<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lexis & Structure — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge English (Y12 WAEC): Lexis & Structure</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Synonyms in context", "teach": ["A synonym is a word with a similar meaning. WAEC often asks you to choose the word closest in meaning to a given word, AS USED IN CONTEXT.", "Always consider the sentence the word appears in \u2014 some words have multiple meanings, and only one fits the context.", "Building a strong vocabulary through wide reading is the best long-term preparation for this question type."], "yt_prompt": "Choose the word nearest in meaning:"}, {"title": "Antonyms in context", "teach": ["An antonym is a word opposite in meaning. Read the full sentence carefully \u2014 the correct antonym must fit grammatically too.", "Example: the antonym of 'ancient' is 'modern', not simply 'new' if 'modern' fits the sentence better.", "Eliminate obviously wrong options first, then compare the remaining choices carefully."], "yt_prompt": "Choose the word opposite in meaning:"}, {"title": "Correct word choice (diction)", "teach": ["Some questions test your ability to choose the most appropriate word for a specific context, even among near-synonyms.", "Example: 'economical' (careful with money) vs 'economic' (relating to the economy) \u2014 these are easily confused.", "Pay close attention to word endings and precise shades of meaning."], "yt_prompt": "Choose the most appropriate word:"}, {"title": "Prepositions", "teach": ["Certain verbs and adjectives are always followed by specific prepositions \u2014 these must be memorised, as they don't always follow logical rules.", "Example: 'married TO' (not 'with'), 'good AT' (not 'in'), 'interested IN' (not 'for').", "Reading widely helps you absorb correct preposition use naturally over time."], "yt_prompt": "Choose the correct preposition:"}, {"title": "Tense accuracy", "teach": ["WAEC frequently tests correct tense use, especially the difference between simple past, present perfect, and past perfect.", "Example: 'By the time we arrived, the film had already started' (past perfect for the earlier of two past events).", "Identify which event happened FIRST when choosing between past and past perfect tense."], "yt_prompt": "Choose the correct tense:"}, {"title": "Subject-verb agreement", "teach": ["The verb must agree with its subject in number, even when other words come between them.", "Example: 'The list of items IS long' \u2014 the subject is 'list' (singular), not 'items'.", "With 'neither...nor' and 'either...or', the verb agrees with the NEARER subject."], "yt_prompt": "Choose the correct verb form:"}, {"title": "Correct spelling", "teach": ["WAEC includes questions testing correct spelling, often of commonly confused or misspelled words.", "Common errors include doubled letters (accommodate, necessary), and 'ei/ie' confusion (receive, believe).", "Keep a personal list of words you frequently misspell and review it regularly."], "yt_prompt": "Identify the correctly spelled word:"}, {"title": "Idiomatic expressions", "teach": ["An idiom is a fixed expression whose meaning isn't obvious from the individual words.", "Example: 'to let the cat out of the bag' means to reveal a secret, not literally about a cat.", "WAEC tests recognition of common idioms and their correct meanings in context."], "yt_prompt": "What does this idiom mean?"}, {"title": "Sentence completion", "teach": ["This question type gives an incomplete sentence with a gap, testing grammar, vocabulary, and logical sense together.", "Read the WHOLE sentence first before choosing an answer \u2014 the correct word often depends on context later in the sentence.", "Eliminate options that are grammatically wrong before considering meaning."], "yt_prompt": "Complete the sentence correctly:"}, {"title": "Mixed practice", "teach": ["You've now covered synonyms, antonyms, word choice, prepositions, tense, subject-verb agreement, spelling, and idioms.", "These are exactly the skills tested in the WAEC 'Lexis and Structure' section of the objective test.", "Regular reading and active vocabulary-building are the most effective long-term preparation for this section."], "yt_prompt": "Choose the word nearest in meaning:"}];
function ytGen_0() { const sets=[['ABUNDANT',['Scarce','Plentiful','Empty','Fragile'],'Plentiful'],['METICULOUS',['Careless','Careful and precise','Quick','Lazy'],'Careful and precise'],['CANDID',['Dishonest','Frank and honest','Angry','Quiet'],'Frank and honest']]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p[0], options:p[1], answer:p[2]}; }
function ytGen_1() { const sets=[['GENEROUS',['Kind','Stingy','Wealthy','Honest'],'Stingy'],['ANCIENT',['Old','Modern','Historic','Broken'],'Modern'],['TIMID',['Shy','Bold','Quiet','Nervous'],'Bold']]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p[0], options:p[1], answer:p[2]}; }
function ytGen_2() { const opts=['His economical use of words made the essay effective.','His economic use of words made the essay effective.']; return {q:'Choose the correct word for this context (careful/thrifty use)', options:opts, answer:opts[0]}; }
function ytGen_3() { const sets=[['married',['with','to','at'],'to'],['good',['in','at','for'],'at'],['interested',['for','in','with'],'in']]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:`She is ___ (${p[0]}) her studies.`, options:p[1], answer:p[2]}; }
function ytGen_4() { const opts=['By the time we arrived, the film had already started.','By the time we arrived, the film already started.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_5() { const opts=['The list of items is long.','The list of items are long.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_6() { const opts=['Accommodate','Acommodate','Accomodate']; return {q:'Which is spelled correctly?', options:opts, answer:opts[0]}; }
function ytGen_7() { const opts=[['to let the cat out of the bag',['To reveal a secret','To own a cat','To be angry'],'To reveal a secret'],['to hit the nail on the head',['To be exactly right','To damage something','To work hard'],'To be exactly right']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:p[1], answer:p[2]}; }
function ytGen_8() { const opts=['Despite the heavy rain, the match continued.','Despite of the heavy rain, the match continued.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_9() { const sets=[['RETICENT',['Talkative','Reserved','Angry','Careless'],'Reserved'],['DILIGENT',['Lazy','Hardworking','Careless','Quiet'],'Hardworking']]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p[0], options:p[1], answer:p[2]}; }

const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^-?\d+\.\d+$/.test(ans)) {
    const num = parseFloat(ans);
    const decimals = (ans.split('.')[1]||'').length;
    const deltas = [0.1,-0.1,0.01,-0.01,1,-1,0.5,-0.5].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = (num + d).toFixed(decimals);
      if (c !== ans && !candidates.includes(c)) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+%$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [5,-5,10,-10,2,-2,1,-1].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d) + '%';
      if (c !== ans && !candidates.includes(c) && (num+d) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  }

  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>

<script type="module">
