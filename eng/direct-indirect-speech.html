function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'

    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');

    }
    return;
  }
});

{lb:'Comma before the quote',dr:dQ2,ht:'<p>A comma usually comes before the opening quotation mark: <b>She said, "I am tired."</b></p>'},
{lb:'Capital letter and punctuation placement',dr:dQ2,ht:'<p>The quoted speech starts with a <b>capital letter</b>, and the final punctuation (full stop, question mark) goes <b>inside</b> the closing quotation mark.</p>'},
{lb:'New speaker, new paragraph',dr:dQ2,ht:'<p>In dialogue writing, start a <b>new paragraph</b> every time the speaker changes.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What do quotation marks enclose?',o:['The exact words spoken','A summary of what was said','The speaker\\u2019s name only','Nothing — they are decorative'],a:0,w:'Quotation marks enclose the exact words spoken.'},{q:'What usually comes before the opening quotation mark?',o:['A comma','A semicolon','A colon','Nothing at all'],a:0,w:'A comma usually comes before the opening quotation mark, e.g. "She said, ..."'},{q:'Where does the final punctuation mark go in direct speech?',o:['Inside the closing quotation mark','Outside the closing quotation mark','It is omitted entirely','Before the opening quotation mark'],a:0,w:'The final punctuation mark (full stop, question mark) goes inside the closing quotation mark.'},{q:'What letter case starts the quoted speech?',o:['A capital letter','A lowercase letter always','It depends on the speaker\\u2019s name','Numbers only'],a:0,w:'The quoted speech starts with a capital letter.'},{q:'What should happen when the speaker changes in dialogue writing?',o:['Start a new paragraph','Keep it in the same paragraph','Add extra quotation marks','Switch to indirect speech automatically'],a:0,w:'A new paragraph should start every time the speaker changes in dialogue writing.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 &bull; English &bull; Grammar',ti:'Converting Direct to Indirect Speech',su:'Apply a step-by-step method to convert direct speech into reported speech.',steps:[
{lb:'Step 1: remove quotation marks',dr:dQ3,ht:'<p>Remove the <b>quotation marks</b> and the comma before them; you may optionally add "that" to introduce the reported clause.</p>'},
{lb:'Step 2: shift the tense back',dr:dQ3,ht:'<p>Shift the tense <b>one step back</b>: present becomes past, e.g. "am" becomes "was," "will" becomes "would."</p>'},
{lb:'Step 3: change the pronouns',dr:dQ3,ht:'<p>Change pronouns to match the <b>reporter\\u2019s perspective</b>: "I" often becomes "she" or "he," depending on who said it.</p>'},
{lb:'Step 4: adjust time/place words',dr:dQ3,ht:'<p>Adjust time and place words if needed: "today" becomes "that day," "here" becomes "there."</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'What is removed in step 1 of the conversion?',o:['The quotation marks and preceding comma','The subject of the sentence','The main verb entirely','The speaker\\u2019s name'],a:0,w:'Step 1 removes the quotation marks and the comma before them.'},{q:'What happens to the tense in step 2?',o:['It shifts one step back (present becomes past)','It shifts forward into the future','It stays exactly the same always','It is removed entirely'],a:0,w:'In step 2, the tense shifts back one step, e.g. present becomes past.'},{q:'What happens to pronouns in step 3?',o:['They change to match the reporter\\u2019s perspective','They are always deleted','They become question words','They are capitalised'],a:0,w:'Pronouns change to match the reporter\\u2019s perspective, e.g. "I" becomes "she/he."'},{q:'What might change in step 4?',o:['Time and place words, e.g. "today" to "that day"','The spelling of the main verb','The subject of the sentence','The number of clauses'],a:0,w:'Step 4 adjusts time and place words as needed, e.g. "today" to "that day."'},{q:'Convert "I am tired," she said fully to indirect speech — which is correct?',o:['She said she was tired.','She said she is tired.','She said, "she was tired."','She said I am tired.'],a:0,w:'"She said she was tired" correctly shifts both tense and pronoun.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 &bull; English &bull; Grammar',ti:'Tense Shifts in Reported Speech',su:'Apply the standard tense-shift pattern when reporting speech.',steps:[
{lb:'Present simple/continuous',dr:dQ4,ht:'<p>"I am tired" becomes <b>"she said she WAS tired"</b>; "I am going" becomes <b>"she said she WAS GOING."</b></p>'},
{lb:'Present perfect',dr:dQ4,ht:'<p>"I have finished" becomes <b>"she said she HAD finished."</b></p>'},
{lb:'Past simple',dr:dQ4,ht:'<p>"I went" becomes <b>"she said she HAD gone"</b> — past simple often shifts to past perfect.</p>'},
{lb:'Will',dr:dQ4,ht:'<p>"I will come" becomes <b>"she said she WOULD come."</b></p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'"I am tired" becomes what in reported speech?',o:['"She said she was tired."','"She said she is tired."','"She said she will be tired."','"She said she has been tired."'],a:0,w:'"I am tired" shifts to "she said she was tired" — present to past.'},{q:'"I have finished" becomes what in reported speech?',o:['"She said she had finished."','"She said she has finished."','"She said she finished."','"She said she will finish."'],a:0,w:'"I have finished" shifts to "she said she had finished" — present perfect to past perfect.'},{q:'"I went" often becomes what in reported speech?',o:['"She said she had gone."','"She said she goes."','"She said she is going."','"She said she will go."'],a:0,w:'"I went" often shifts to "she said she had gone" — past simple to past perfect.'},{q:'"I will come" becomes what in reported speech?',o:['"She said she would come."','"She said she comes."','"She said she is coming."','"She said she has come."'],a:0,w:'"I will come" shifts to "she said she would come" — will becomes would.'},{q:'What is the general tense-shift pattern in reported speech?',o:['Tenses shift one step back into the past','Tenses always shift into the future','Tenses never change at all','Only questions shift tense'],a:0,w:'The general pattern is that tenses shift one step back into the past.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 &bull; English &bull; Grammar',ti:'Pronoun and Time-Word Changes',su:'Adjust pronouns, time words, and place words correctly when reporting speech.',steps:[
{lb:'Pronoun shifts',dr:dQ5,ht:'<p>Pronouns shift to match who is reporting: if Ada says "I," and someone else reports it, "I" becomes <b>"she."</b></p>'},
{lb:'Time-word shifts',dr:dQ5,ht:'<p>Since reporting happens later, time words shift too: <b>"today"</b> becomes <b>"that day,"</b> and <b>"tomorrow"</b> becomes <b>"the next day."</b></p>'},
{lb:'Place-word shifts',dr:dQ5,ht:'<p>Place words shift similarly: <b>"here"</b> becomes <b>"there,"</b> and <b>"this"</b> becomes <b>"that."</b></p>'},
{lb:'Not everything changes',dr:dQ5,ht:'<p>Only words that <b>logically shift</b> with time and perspective need to change — not every single word in the sentence.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'If Ada says "I am tired" and someone else reports it, what does "I" become?',o:['"She"','"He" always, regardless of speaker','"It"','"They" always'],a:0,w:'"I" becomes "she" (or "he") to match who is being reported, e.g. Ada.'},{q:'What does "today" typically become in reported speech?',o:['"That day"','"This day"','"Tomorrow"','"Yesterday" always'],a:0,w:'"Today" typically becomes "that day" in reported speech, since the reporting happens later.'},{q:'What does "tomorrow" typically become in reported speech?',o:['"The next day"','"Today"','"Yesterday"','"That day"'],a:0,w:'"Tomorrow" typically becomes "the next day" in reported speech.'},{q:'What does "here" typically become in reported speech?',o:['"There"','"This place"','"Somewhere"','"Nowhere"'],a:0,w:'"Here" typically becomes "there" in reported speech.'},{q:'Does every single word need to change when converting to reported speech?',o:['No, only words that logically shift with time/perspective','Yes, every word must change','Yes, but only nouns need to change','No, nothing at all needs to change'],a:0,w:'Only words that logically shift with time and perspective need to change.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar',ti:'Reporting Questions',su:'Convert direct questions into indirect/reported questions correctly.',steps:[
{lb:'Example',dr:dQ6,ht:'<p><b>Direct:</b> "Are you coming?" she asked. <b>Indirect:</b> She asked if/whether I was coming.</p>'},
{lb:'Word order changes',dr:dQ6,ht:'<p>Reported questions use <b>statement word order</b>, not question word order — there is no auxiliary-verb inversion and no question mark.</p>'},
{lb:'Yes/no vs wh- questions',dr:dQ6,ht:'<p>Yes/no questions use <b>"if"</b> or <b>"whether"</b> to introduce the reported clause; wh- questions simply keep the <b>wh- word</b> (where, what, why) instead.</p>'},
{lb:'Example with a wh- question',dr:dQ6,ht:'<p><b>"Where are you going?"</b> becomes <b>she asked where I was going</b> — the wh- word is kept, but word order shifts to a statement.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What word order do reported questions use?',o:['Statement word order, not question word order','Exactly the same word order as the direct question','Random word order','Only imperative word order'],a:0,w:'Reported questions use statement word order, without auxiliary inversion.'},{q:'What is added to report a yes/no question?',o:['"If" or "whether"','A question mark at the end','An exclamation mark','Nothing is added'],a:0,w:'Yes/no questions are reported using "if" or "whether."'},{q:'How are wh- questions reported?',o:['By keeping the wh- word but shifting to statement order','By removing the wh- word entirely','By adding "if" before the wh- word','By keeping the question mark'],a:0,w:'Wh- questions are reported by keeping the wh- word, with statement word order.'},{q:'Convert "Are you coming?" she asked, to reported speech.',o:['She asked if I was coming.','She asked are you coming.','She asked, "Are you coming?"','She asked I was coming.'],a:0,w:'"She asked if I was coming" correctly uses "if" and statement word order.'},{q:'Does a reported question end with a question mark?',o:['No','Yes, always','Only for wh- questions','Only for yes/no questions'],a:0,w:'A reported question does not end with a question mark, since it becomes a statement.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Grammar',ti:'Reporting Commands and Requests',su:'Convert direct commands into reported speech using the correct pattern.',steps:[
{lb:'Example',dr:dQ7,ht:'<p><b>Direct:</b> "Close the door," she said. <b>Indirect:</b> She told me to close the door.</p>'},
{lb:'The pattern',dr:dQ7,ht:'<p>Reported commands follow the pattern: <b>told/asked + person + TO + base verb.</b></p>'},
{lb:'Negative commands',dr:dQ7,ht:'<p>Negative commands add <b>"not"</b> before "to": "Don\\u2019t run" becomes <b>she told me NOT TO run.</b></p>'},
{lb:'No quotation marks',dr:dQ7,ht:'<p>Like all reported speech, reported commands drop the <b>quotation marks</b> and exact wording.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What is the pattern for reporting a command?',o:['told/asked + person + TO + base verb','said + that + past tense verb','asked + if + past tense verb','told + person + past tense verb'],a:0,w:'Reported commands follow the pattern: told/asked + person + TO + base verb.'},{q:'Convert "Close the door," she said, to reported speech.',o:['She told me to close the door.','She said close the door.','She told me closing the door.','She asked if I closed the door.'],a:0,w:'"She told me to close the door" correctly follows the told + person + to + base verb pattern.'},{q:'How is a negative command reported, e.g. "Don\\u2019t run"?',o:['She told me not to run.','She told me to not run never.','She told me don\\u2019t run.','She told me running is banned.'],a:0,w:'"Don\\u2019t run" becomes "she told me not to run" — adding "not" before "to."'},{q:'Do reported commands keep quotation marks?',o:['No','Yes, always','Only for negative commands','Only for polite requests'],a:0,w:'Reported commands, like all reported speech, drop the quotation marks.'},{q:'What verb form follows "to" in a reported command?',o:['The base form of the verb','The past tense form','The -ing form','The past participle'],a:0,w:'The base form of the verb follows "to" in a reported command, e.g. "to close."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Grammar',ti:'Common Errors',su:'Recognise and correct frequent mistakes in reported speech.',steps:[
{lb:'Forgetting the tense shift',dr:dQ8,ht:'<p>A common error is forgetting to shift tense: <b>✗ "She said she is tired"</b> should be <b>✓ "She said she WAS tired."</b></p>'},
{lb:'Keeping quotation marks',dr:dQ8,ht:'<p>Another error is keeping quotation marks in indirect speech: <b>✗ She said "she was tired"</b> should have <b>no quotation marks at all.</b></p>'},
{lb:'Keeping question word order',dr:dQ8,ht:'<p>A third error is keeping question word order in a reported question: <b>✗ She asked was I coming</b> should be <b>✓ she asked if I was coming.</b></p>'},
{lb:'The fix: apply all four steps',dr:dQ8,ht:'<p>Fix these errors by always applying the full conversion process: quotes out, tense back, pronouns shifted, time/place words adjusted.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'What is a common tense-related error in reported speech?',o:['Forgetting to shift the tense back','Always shifting the tense forward','Never using any tense at all','Using too many different tenses'],a:0,w:'A common error is forgetting to shift the tense back when reporting speech.'},{q:'Which of these is an error in indirect speech?',o:['She said "she was tired." (keeping quotation marks)','She said she was tired.','She said that she was tired.','She mentioned she was tired.'],a:0,w:'Keeping quotation marks in indirect speech is an error — reported speech has no quotation marks.'},{q:'Which of these is an error in a reported question?',o:['"She asked was I coming." (keeping question word order)','She asked if I was coming.','She asked whether I was coming.','She wondered if I was coming.'],a:0,w:'Keeping question word order ("was I coming") is an error in reported speech.'},{q:'What is the correct reported version of "Are you coming?" she asked?',o:['She asked if I was coming.','She asked was I coming.','She asked, "Are you coming?"','She asked am I coming.'],a:0,w:'"She asked if I was coming" is correct — using "if" and statement word order.'},{q:'What is the overall fix for these common errors?',o:['Always apply the full 4-step conversion process','Ignore tense shifts entirely','Always keep the original quotation marks','Avoid reporting questions altogether'],a:0,w:'The fix is to always apply the full 4-step conversion process consistently.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Grammar',ti:'Why This Matters for Writing',su:'Understand where direct and indirect speech are used in different writing forms.',steps:[
{lb:'Dialogue writing',dr:dQ9,ht:'<p><b>Direct speech</b> brings characters to life in narrative and descriptive writing, showing their exact words and personality.</p>'},
{lb:'Reports and summaries',dr:dQ9,ht:'<p><b>Indirect speech</b> is more concise for retelling what was said in reports, summaries, and formal writing.</p>'},
{lb:'Interviews and news articles',dr:dQ9,ht:'<p>The <b>Interviews</b> writing form often mixes direct quotes with indirect summary; <b>news articles</b> commonly use indirect speech plus one key direct quote for impact.</p>'},
{lb:'Exam relevance',dr:dQ9,ht:'<p>Accurate use of both direct and indirect speech shows <b>strong technical control</b>, which examiners reward across several writing forms.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'What does direct speech do in dialogue writing?',o:['Brings characters to life with their exact words','Makes writing more concise and general','Removes personality from characters','Is only used in formal reports'],a:0,w:'Direct speech brings characters to life by showing their exact words and personality.'},{q:'Why is indirect speech useful in reports and summaries?',o:['It is more concise for retelling what was said','It always sounds more dramatic','It is required by law in journalism','It removes the need for any verbs'],a:0,w:'Indirect speech is more concise for retelling what was said in reports and summaries.'},{q:'How do news articles often use direct and indirect speech together?',o:['Indirect speech generally, plus one key direct quote for impact','Only direct speech throughout','Only indirect speech throughout','Neither is ever used in news articles'],a:0,w:'News articles commonly use indirect speech generally, with one key direct quote for impact.'},{q:'Which Writing strand form often mixes direct quotes with indirect summary?',o:['Interviews','Descriptive writing','Reports (numerical data only)','Blogs about weather'],a:0,w:'The Interviews writing form often mixes direct quotes with indirect summary.'},{q:'What does accurate use of direct/indirect speech show examiners?',o:['Strong technical control','A lack of understanding of grammar','Overly simple writing','Nothing relevant to writing skill'],a:0,w:'Accurate use of direct and indirect speech shows strong technical control, valued by examiners.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 &bull; English &bull; Grammar',ti:'Mixed Questions — Direct & Indirect Speech',su:'Integrated revision across punctuation, tense shift, pronouns, questions and commands.',steps:[
{lb:'The core distinction',dr:dQ10,ht:'<p><b>Direct speech:</b> exact words, quotation marks. <b>Indirect speech:</b> reported meaning, no quotation marks.</p>'},
{lb:'Conversion recap',dr:dQ10,ht:'<p>Remove quotes, shift <b>tense back</b> (present &rarr; past), shift <b>pronouns</b> to match the reporter, and adjust <b>time/place words</b> if needed.</p>'},
{lb:'Questions and commands',dr:dQ10,ht:'<p><b>Reported questions:</b> statement word order + if/whether or the wh- word. <b>Reported commands:</b> told/asked + person + to + base verb.</p>'},
{lb:'Exam tip, restated',dr:dQ10,ht:'<p>Always apply the full conversion process consistently — this shows strong technical control valued across several writing forms.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'What punctuation encloses direct speech?',o:['Quotation marks','Semicolons','Colons only','No punctuation at all'],a:0,w:'Quotation marks enclose direct speech.'},{q:'How does the tense typically shift in indirect speech?',o:['One step back, e.g. present to past','One step forward, e.g. past to future','It never shifts','It always shifts to the future perfect'],a:0,w:'Tense typically shifts one step back in indirect speech, e.g. present to past.'},{q:'How is a reported yes/no question introduced?',o:['With "if" or "whether"','With a question mark','With "that" only','With no connecting word at all'],a:0,w:'A reported yes/no question is introduced with "if" or "whether."'},{q:'What pattern do reported commands follow?',o:['told/asked + person + to + base verb','said + that + past tense','asked + if + base verb','told + person + past tense'],a:0,w:'Reported commands follow: told/asked + person + to + base verb.'},{q:'Convert: "I am happy," he said. — correct indirect form?',o:['He said he was happy.','He said he is happy.','He said, "he was happy."','He said I am happy.'],a:0,w:'"He said he was happy" correctly shifts both tense and pronoun.'},{q:'Convert: "Where do you live?" she asked. — correct indirect form?',o:['She asked where I lived.','She asked where do I live.','She asked, "Where do you live?"','She asked where you live.'],a:0,w:'"She asked where I lived" uses statement word order and shifts the pronoun/tense correctly.'},{q:'What is a common error when converting direct to indirect speech?',o:['Forgetting to shift the tense back','Always shifting the tense forward','Removing all pronouns','Adding extra quotation marks'],a:0,w:'A common error is forgetting to shift the tense back when converting to indirect speech.'},{q:'Why does accuracy in direct/indirect speech matter for exams?',o:['It shows strong technical control valued across writing forms','It has no bearing on exam marks','It only matters for spoken exams','It only matters in Grammar tests, not Writing'],a:0,w:'Accuracy in direct/indirect speech shows strong technical control, valued across several writing forms.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
