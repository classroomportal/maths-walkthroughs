document.addEventListener('click',function(e){

    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);

]},
{ey:'Q2 &bull; English &bull; Grammar',ti:'Independent Clauses',su:'Recognise clauses that express a complete thought and can stand alone.',steps:[
{lb:'Definition',dr:dQ2,ht:'<p>An <b>independent clause</b> expresses a <b>complete thought</b> and can stand alone as its own sentence.</p>'},
{lb:'Example',dr:dQ2,ht:'<p><b>"The rain stopped."</b> This has a subject ("the rain") and a verb ("stopped"), and makes complete sense on its own.</p>'},
{lb:'Also called a main clause',dr:dQ2,ht:'<p>An independent clause is sometimes called a <b>"main clause"</b> — the core clause that a sentence\'s meaning depends on.</p>'},
{lb:'Foundation of the simple sentence',dr:dQ2,ht:'<p>Every <b>simple sentence</b> is, by definition, a single independent clause. Compound and complex sentences build on top of this basic unit.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What does an independent clause express?',o:['A complete thought','An incomplete thought only','No thought at all','Only a question'],a:0,w:'An independent clause expresses a complete thought.'},{q:'Can an independent clause stand alone as its own sentence?',o:['Yes','No, it always needs another clause','No, it is always a fragment','Only if it has no verb'],a:0,w:'An independent clause can stand alone as its own complete sentence.'},{q:'What is another name for an independent clause?',o:['A "main clause"','A "fragment clause"','A "broken clause"','A "silent clause"'],a:0,w:'An independent clause is also called a "main clause."'},{q:'Which of these is an independent clause?',o:['"The rain stopped."','"Because it rained."','"Although the rain stopped."','"When the rain stopped."'],a:0,w:'"The rain stopped" expresses a complete thought and can stand alone.'},{q:'What is every simple sentence, in terms of clauses?',o:['A single independent clause','Always two independent clauses','Always one subordinate clause','Never a clause at all'],a:0,w:'Every simple sentence is, by definition, a single independent clause.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 &bull; English &bull; Grammar',ti:'Subordinate (Dependent) Clauses',su:'Recognise clauses that cannot stand alone and need a main clause.',steps:[
{lb:'Definition',dr:dQ3,ht:'<p>A <b>subordinate (or "dependent") clause</b> has a subject and a verb, but does <b>not</b> express a complete thought on its own.</p>'},
{lb:'Needs a main clause',dr:dQ3,ht:'<p>"<b>Because the rain stopped</b>" is incomplete alone — it needs a main clause to finish the idea: <b>"Because the rain stopped, we went outside."</b></p>'},
{lb:'Signal words',dr:dQ3,ht:'<p>Subordinate clauses typically begin with a <b>subordinating conjunction</b> (because, although, when, if) or a <b>relative pronoun</b> (which, who, that).</p>'},
{lb:'Three kinds',dr:dQ3,ht:'<p>There are three main kinds of subordinate clause: <b>adverbial, relative, and noun clauses</b> — each covered in more detail in the following topics.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'Does a subordinate clause express a complete thought on its own?',o:['No','Yes, always','Yes, but only in questions','Yes, but only if short'],a:0,w:'A subordinate clause does not express a complete thought on its own.'},{q:'What does a subordinate clause need to complete its meaning?',o:['A main (independent) clause','Another subordinate clause','A dictionary definition','Nothing at all'],a:0,w:'A subordinate clause needs a main clause to complete its meaning.'},{q:'Which of these typically begins a subordinate clause?',o:['A subordinating conjunction like "because"','A full stop','A capital letter only','An exclamation mark'],a:0,w:'Subordinate clauses typically begin with a subordinating conjunction such as "because."'},{q:'Is "Because the rain stopped" a complete sentence alone?',o:['No, it is incomplete without a main clause','Yes, it is complete','Yes, because it has a subject and verb','Yes, because it starts with a capital letter'],a:0,w:'"Because the rain stopped" is incomplete alone — it is a subordinate clause.'},{q:'What are the three main kinds of subordinate clause?',o:['Adverbial, relative, and noun clauses','Long, medium, and short clauses','Formal, informal, and neutral clauses','Past, present, and future clauses'],a:0,w:'The three main kinds of subordinate clause are adverbial, relative, and noun clauses.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 &bull; English &bull; Grammar',ti:'Relative Clauses',su:'Use relative clauses to add descriptive detail to a noun.',steps:[
{lb:'Definition',dr:dQ4,ht:'<p>A <b>relative clause</b> is a subordinate clause that describes a noun, usually beginning with <b>who, which, that, whose,</b> or <b>where</b>.</p>'},
{lb:'Example',dr:dQ4,ht:'<p><b>"The teacher who marked our exams is strict."</b> The clause "who marked our exams" describes which teacher is meant.</p>'},
{lb:'Choosing the right relative pronoun',dr:dQ4,ht:'<p>Use <b>who/which/that</b> for people or things, <b>whose</b> to show possession, <b>where</b> for places, and <b>when</b> for times.</p>'},
{lb:'Why relative clauses matter',dr:dQ4,ht:'<p>Relative clauses let a writer add detail <b>without starting a new sentence</b> — a valuable tool for creating sentence variety in exam writing.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What does a relative clause do?',o:['Describes a noun','Describes a verb only','Replaces the subject entirely','Ends a sentence with a question mark'],a:0,w:'A relative clause describes a noun.'},{q:'Which word could begin a relative clause about a person?',o:['Who','Because','Although','If'],a:0,w:'"Who" is used to begin a relative clause describing a person.'},{q:'In "The teacher who marked our exams is strict," what does "who marked our exams" describe?',o:['The teacher','The exams','The verb "is"','The word "strict"'],a:0,w:'"Who marked our exams" describes "the teacher."'},{q:'Which relative pronoun shows possession?',o:['Whose','Which','That','Where'],a:0,w:'"Whose" is the relative pronoun used to show possession.'},{q:'What is a key benefit of using relative clauses in writing?',o:['Adding detail without starting a new sentence','Making every sentence shorter','Avoiding the use of nouns entirely','Removing the need for punctuation'],a:0,w:'Relative clauses let a writer add detail without starting a new sentence, aiding sentence variety.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 &bull; English &bull; Grammar',ti:'Noun Clauses',su:'Identify subordinate clauses that function as a noun in a sentence.',steps:[
{lb:'Definition',dr:dQ5,ht:'<p>A <b>noun clause</b> is a subordinate clause that acts as a noun in a sentence — as a subject, object, or complement.</p>'},
{lb:'Example',dr:dQ5,ht:'<p><b>"What she said surprised everyone."</b> The clause "what she said" functions as the subject of the sentence, just like a noun would.</p>'},
{lb:'Common starting words',dr:dQ5,ht:'<p>Noun clauses often begin with <b>that, what, whether, who, how,</b> or <b>why</b>.</p>'},
{lb:'A useful test',dr:dQ5,ht:'<p>To check if a clause is a noun clause, try replacing it with the word <b>"something"</b> — if the sentence still makes sense, it is functioning as a noun.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What does a noun clause act as in a sentence?',o:['A noun (subject, object or complement)','An adjective only','An adverb only','A conjunction'],a:0,w:'A noun clause acts as a noun — as a subject, object, or complement.'},{q:'In "What she said surprised everyone," what role does "what she said" play?',o:['The subject of the sentence','The verb of the sentence','An adjective describing "everyone"','A conjunction joining two clauses'],a:0,w:'"What she said" functions as the subject of the sentence.'},{q:'Which word could begin a noun clause?',o:['That','Because','Although','And'],a:0,w:'"That" commonly begins a noun clause, e.g. "I know that she left."'},{q:'What test can help identify a noun clause?',o:['Try replacing it with "something"','Try replacing it with a comma','Try deleting the whole sentence','Try adding an exclamation mark'],a:0,w:'Replacing the clause with "something" and checking the sentence still makes sense helps identify a noun clause.'},{q:'Which of these is a noun clause?',o:['"Whether she comes or not" (as in "Whether she comes or not does not matter.")','"Because she left early"','"Although it rained"','"When the bell rang"'],a:0,w:'"Whether she comes or not" functions as the subject — a noun clause.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar',ti:'Adverbial Clauses',su:'Use adverbial clauses to show when, where, why or how something happens.',steps:[
{lb:'Definition',dr:dQ6,ht:'<p>An <b>adverbial clause</b> is a subordinate clause that functions like an adverb, telling us <b>when, where, why,</b> or <b>how</b> something happens.</p>'},
{lb:'Example',dr:dQ6,ht:'<p><b>"We stayed inside because it rained."</b> The clause "because it rained" tells us <b>why</b> we stayed inside.</p>'},
{lb:'Signal words',dr:dQ6,ht:'<p>Common signal words include <b>because, although, when, if,</b> and <b>since</b> — the same words used to build complex sentences.</p>'},
{lb:'Flexible position',dr:dQ6,ht:'<p>An adverbial clause can move to the <b>front of the sentence</b> for effect: <b>"Because it rained, we stayed inside."</b> — a comma is then needed after the clause.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What does an adverbial clause tell us?',o:['When, where, why or how something happens','The name of the subject only','A definition of a word','Nothing about the main clause'],a:0,w:'An adverbial clause tells us when, where, why or how something happens.'},{q:'In "We stayed inside because it rained," what does "because it rained" tell us?',o:['Why we stayed inside','Where we stayed','When we stayed','Who stayed inside'],a:0,w:'"Because it rained" tells us why we stayed inside.'},{q:'Which of these is a common adverbial clause signal word?',o:['Because','And','But','Or'],a:0,w:'"Because" is a common subordinating conjunction that signals an adverbial clause.'},{q:'Where can an adverbial clause be placed in a sentence?',o:['At the front or the end of the sentence','Only at the very end','Only in the middle, never elsewhere','Only as a standalone sentence'],a:0,w:'An adverbial clause can move to the front of the sentence or stay at the end.'},{q:'What punctuation is needed when an adverbial clause starts the sentence?',o:['A comma after the clause','A semicolon before the clause','No punctuation is ever needed','A colon after the clause'],a:0,w:'A comma is needed after an adverbial clause when it starts the sentence.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Grammar',ti:'Identifying Clauses in a Sentence',su:'Apply a step-by-step method to find and classify clauses.',steps:[
{lb:'Step 1: find the verbs',dr:dQ7,ht:'<p>Start by finding <b>every verb</b> in the sentence — each verb usually marks the presence of a separate clause.</p>'},
{lb:'Step 2: find the matching subject',dr:dQ7,ht:'<p>For each verb, find the <b>subject</b> that goes with it. A subject + its verb together form one clause.</p>'},
{lb:'Step 3: test independence',dr:dQ7,ht:'<p>Ask: <b>could this clause stand alone as a complete sentence?</b> If yes, it is independent; if no, it is subordinate.</p>'},
{lb:'Why this matters',dr:dQ7,ht:'<p>This process becomes quick and automatic with practice, and is <b>essential</b> for punctuating complex and compound sentences correctly.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What is the first step in identifying clauses?',o:['Find every verb in the sentence','Count all the nouns','Find the longest word','Look only at the punctuation'],a:0,w:'The first step is to find every verb in the sentence.'},{q:'After finding a verb, what should you find next?',o:['The subject that goes with it','A synonym for the verb','The last word in the sentence','An adjective near it'],a:0,w:'After finding a verb, find the subject that goes with it to form a clause.'},{q:'What question tests whether a clause is independent?',o:['Could this clause stand alone as a complete sentence?','Is this clause longer than five words?','Does this clause contain an adjective?','Is this clause at the start of the sentence?'],a:0,w:'Asking whether the clause could stand alone as a complete sentence tests independence.'},{q:'Why is correctly identifying clauses important?',o:['It is essential for punctuating complex/compound sentences correctly','It has no real practical use','It only matters for very long essays','It is only relevant in poetry'],a:0,w:'Correctly identifying clauses is essential for accurate punctuation in complex and compound sentences.'},{q:'What happens to this skill with practice?',o:['It becomes quick and automatic','It becomes harder over time','It stops being useful after Year 9','It only works for short sentences'],a:0,w:'With practice, identifying clauses becomes quick and automatic.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Grammar',ti:'Clauses and Punctuation',su:'Apply the correct punctuation rules for joining and separating clauses.',steps:[
{lb:'Two independent clauses',dr:dQ8,ht:'<p>Join two independent clauses with a <b>comma + FANBOYS conjunction</b>, or with a <b>semicolon</b> alone.</p>'},
{lb:'Subordinate clause first',dr:dQ8,ht:'<p>When a subordinate clause comes <b>before</b> the main clause, a comma is needed: <b>"Although it rained, we went out."</b></p>'},
{lb:'Subordinate clause second',dr:dQ8,ht:'<p>When the subordinate clause comes <b>after</b> the main clause, a comma is usually <b>not</b> needed: <b>"We went out although it rained."</b></p>'},
{lb:'Relative clauses: essential vs non-essential',dr:dQ8,ht:'<p>A <b>non-essential</b> relative clause (extra, removable detail) is set off with commas; an <b>essential</b> one (needed to identify the noun) takes no commas.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'How can two independent clauses be correctly joined?',o:['With a comma + FANBOYS conjunction, or a semicolon','With a comma alone','With no punctuation at all','With a question mark'],a:0,w:'Two independent clauses can be joined with a comma + FANBOYS conjunction, or a semicolon.'},{q:'When is a comma needed with a subordinate clause?',o:['When the subordinate clause comes before the main clause','Always, no matter the order','Never, under any circumstances','Only in questions'],a:0,w:'A comma is needed when the subordinate clause comes before the main clause.'},{q:'"We went out although it rained." — is a comma needed here?',o:['No, because the subordinate clause comes second','Yes, always required','Yes, because it starts with "we"','No sentence can end this way'],a:0,w:'No comma is usually needed when the subordinate clause comes after the main clause.'},{q:'How is a non-essential relative clause punctuated?',o:['Set off with commas','Never punctuated at all','Always followed by a semicolon','Always followed by a colon'],a:0,w:'A non-essential relative clause (removable extra detail) is set off with commas.'},{q:'How is an essential relative clause punctuated?',o:['With no commas, since it is needed to identify the noun','Always with commas on both sides','Always with a semicolon','Always with brackets'],a:0,w:'An essential relative clause takes no commas because it is needed to identify the noun.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Grammar',ti:'Common Clause Errors',su:'Recognise and correct sentence fragments and comma splices.',steps:[
{lb:'Sentence fragment',dr:dQ9,ht:'<p>Writing a subordinate clause alone, as if it were a complete sentence, creates a <b>fragment</b>: <b>✗ "Because it rained."</b></p>'},
{lb:'Comma splice',dr:dQ9,ht:'<p>Joining two independent clauses with <b>only a comma</b> (no conjunction) creates a <b>comma splice</b>: <b>✗ "It rained, we stayed in."</b></p>'},
{lb:'How to fix these errors',dr:dQ9,ht:'<p>Fix a fragment by adding a main clause; fix a comma splice by adding a <b>conjunction, semicolon,</b> or splitting into two sentences: <b>✓ "It rained, so we stayed in."</b></p>'},
{lb:'A useful checking habit',dr:dQ9,ht:'<p>Always check: <b>does every clause serve a clear purpose</b>, and is it correctly joined or punctuated? Careful clause control is rewarded at IGCSE and WAEC level.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'What is a "sentence fragment"?',o:['A subordinate clause written alone as if it were a full sentence','Any sentence under five words','A sentence with too many commas','A sentence with no punctuation'],a:0,w:'A sentence fragment is a subordinate clause written alone as if it were a complete sentence.'},{q:'What is a "comma splice"?',o:['Joining two independent clauses with only a comma','Using too many commas in a list','A missing full stop','Correct use of a semicolon'],a:0,w:'A comma splice is joining two independent clauses with only a comma and no conjunction.'},{q:'Which of these is a comma splice?',o:['"It rained, we stayed in."','"It rained, so we stayed in."','"It rained; we stayed in."','"It rained. We stayed in."'],a:0,w:'"It rained, we stayed in" joins two independent clauses with only a comma — a comma splice.'},{q:'How can a comma splice be fixed?',o:['By adding a conjunction, using a semicolon, or splitting into two sentences','By deleting the comma with nothing else added','By adding more commas','By removing the subject from one clause'],a:0,w:'A comma splice can be fixed by adding a conjunction, using a semicolon, or splitting the sentence.'},{q:'Why does careful clause control matter for exams?',o:['It is rewarded at IGCSE and WAEC level','It has no effect on exam marks','It only matters in spoken English','It only matters for poetry'],a:0,w:'Careful, correct clause control is rewarded at IGCSE and WAEC level.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 &bull; English &bull; Grammar',ti:'Mixed Questions — Clauses',su:'Integrated revision across independent, subordinate, relative, noun and adverbial clauses.',steps:[
{lb:'Clause recap',dr:dQ10,ht:'<p>A <b>clause</b> = subject + verb. <b>Independent</b> clauses stand alone; <b>subordinate</b> clauses cannot.</p>'},
{lb:'Three kinds of subordinate clause',dr:dQ10,ht:'<p><b>Relative</b> clauses describe a noun (who/which/that). <b>Noun</b> clauses act as a noun (what/that/whether). <b>Adverbial</b> clauses show when/where/why/how (because/when/if).</p>'},
{lb:'Errors to avoid',dr:dQ10,ht:'<p>A lone subordinate clause is a <b>fragment</b>. Two independent clauses joined by only a comma is a <b>comma splice</b>.</p>'},
{lb:'Exam tip',dr:dQ10,ht:'<p>Always identify the <b>type</b> of clause before deciding on punctuation — this prevents both fragments and comma splices in exam writing.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'What must every clause contain?',o:['A subject and a verb','Only a verb','Only a subject','A comma'],a:0,w:'Every clause must contain a subject and a verb.'},{q:'Which clause type can stand alone as a full sentence?',o:['Independent','Subordinate','Relative only','Noun only'],a:0,w:'An independent clause can stand alone as a full sentence.'},{q:'Which clause type describes a noun?',o:['Relative clause','Adverbial clause','Main clause','None of these'],a:0,w:'A relative clause describes a noun, e.g. "the teacher who marked our exams."'},{q:'Which clause type answers "why," "when," "where," or "how"?',o:['Adverbial clause','Noun clause','Relative clause','Independent clause'],a:0,w:'An adverbial clause answers why, when, where, or how something happens.'},{q:'What error is "Because it rained." on its own?',o:['A sentence fragment','A comma splice','A perfectly complete sentence','A relative clause error'],a:0,w:'"Because it rained." alone is a sentence fragment — it needs a main clause.'},{q:'What error is "It rained, we stayed in."?',o:['A comma splice','A sentence fragment','A correct compound sentence','A relative clause error'],a:0,w:'"It rained, we stayed in" is a comma splice — it needs a conjunction or semicolon.'},{q:'Which clause type acts as a subject, object, or complement?',o:['Noun clause','Relative clause','Adverbial clause','None of these'],a:0,w:'A noun clause acts as a noun — as a subject, object, or complement.'},{q:'What should you identify before deciding on punctuation, according to the exam tip?',o:['The type of clause involved','The number of words in the sentence','The author’s opinion','The topic of the essay'],a:0,w:'Identifying the type of clause helps decide correct punctuation and avoid errors.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},

];

// Keep each question's real number in the sidebar when only some are shown
if(window.abcQuestionNumbers){var _renderAll=render;render=function(){_renderAll.apply(this,arguments);var n=window.abcQuestionNumbers;document.querySelectorAll('#sb .qn').forEach(function(el,i){if(n[i])el.textContent='Q'+n[i];});};}

render();
