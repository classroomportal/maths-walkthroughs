body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}

.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#E65100',DARK='#BF360C',CRM='#FFF3E0',LINE='#FFE0B2';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#2a1a0d';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}

  o.push(R(250,100,220,44,'#fff',ACC,1.5));o.push(T(360,118,'a clause',ACC,11,'middle',true));o.push(T(360,136,'short or long','#555',9,'middle',false));}
if(p>=3){o.push(R(10,154,460,44,'#e8f5e9',ACC,1));o.push(T(240,178,'Every sentence has at least one clause',DARK,10,'middle',false));}

if(p>=2){o.push(R(10,96,460,44,'#e8f5e9',ACC,1));o.push(T(240,116,'"Because it rained, we stayed in."',DARK,11,'middle',false));o.push(T(240,134,'Now it makes sense!','#555',9,'middle',false));}

function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Joining Two Complete Clauses',ACC,12,'middle',true));
[['Two ideas','"It rained." + "We stayed in."'],['Join them','With and, but, or, so'],['Result','"It rained, so we stayed in."'],['Remember','Use a comma before the joining word']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,10,'middle',true));o.push(T(330,56+i*36,r[1],'#444',9,'middle',false));}});
s.innerHTML=o.join('');}

function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Adding Detail: "who", "which", "that"',ACC,11,'middle',true));
if(p>=1){o.push(R(10,40,460,44,CRM,ACC,2));o.push(T(240,60,'These words add extra detail about a person or thing',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#fff',ACC,1));o.push(T(240,116,'"The teacher WHO marked our exams is strict."',DARK,10,'middle',false));o.push(T(240,134,'"who marked our exams" tells us more about the teacher','#555',9,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,'#e8f5e9',ACC,1));o.push(T(240,176,'Use "who" for people, "which"/"that" for things','#555',10,'middle',false));}

function dQ6(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Where Does the Comma Go?',ACC,13,'middle',true));
[['Clause first','"Because it rained, we stayed in." (comma needed)'],['Clause second','"We stayed in because it rained." (no comma)'],['Rule','Comma only if the small clause comes FIRST'],['Practice','Try both orders and check which needs a comma']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(125,56+i*36,r[0],ACC,9,'middle',true));o.push(T(340,56+i*36,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ7(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Spotting Clauses in a Sentence',ACC,12,'middle',true));
if(p>=1){o.push(R(10,40,460,44,CRM,ACC,2));o.push(T(240,60,'Step 1: Find the verb',DARK,11,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#fff',ACC,1));o.push(T(240,116,'Step 2: Find who or what is doing it (the subject)',DARK,10,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,'#e8f5e9',ACC,1));o.push(T(240,176,'Step 3: Ask — could this bit stand alone?','#555',10,'middle',false));}

function dQ8(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'A Common Mistake',ACC,13,'middle',true));
if(p>=1){o.push(R(10,40,460,44,'#fde8e8',ACC,2));o.push(T(240,60,'Writing a clause that cannot stand alone by itself',DARK,10,'middle',false));o.push(T(240,80,'✗ "Because it rained."','#555',10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#e8f5e9',ACC,1));o.push(T(240,116,'✓ "Because it rained, we stayed home."',DARK,10,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,CRM,ACC,1));o.push(T(240,176,'Always finish the thought with a second clause','#555',10,'middle',false));}

function dQ9(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Why Clauses Matter',ACC,13,'middle',true));
[['Better writing','Mixing clause types makes writing more interesting'],['Clearer meaning','Correct clauses avoid confusing the reader'],['Building block','Every sentence you write uses clauses'],['Practice helps','The more you notice clauses, the easier it gets']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,10,'middle',true));o.push(T(330,56+i*36,r[1],'#444',9,'middle',false));}});

[['Clause','Subject + verb'],['Independent clause','Can stand alone — a complete sentence'],['Dependent clause','Cannot stand alone — needs help'],['Joining words','because, although, when, if'],['Comma rule','Add comma if the small clause comes first']].forEach(function(r,i){if(i<p+1){o.push(R(10,34+i*36,460,30,CRM,LINE,1));o.push(T(130,54+i*36,r[0],ACC,10,'middle',true));o.push(T(330,54+i*36,r[1],'#555',9,'middle',false));}});

var QS=[

{ey:'Q1 &bull; English &bull; Grammar (Year 8)',ti:'What is a Clause?',su:'Learn what a clause is and why it matters.',steps:[
{lb:'The basic idea',dr:dQ1,ht:'<p>A <b>clause</b> is a group of words with a <b>subject</b> and a <b>verb</b>. It is a building block used to make sentences.</p>'},

]},
{ey:'Q5 &bull; English &bull; Grammar (Year 8)',ti:'Adding Detail: "who", "which", "that"',su:'Learn how to add extra detail about a person or thing.',steps:[
{lb:'What these words do',dr:dQ5,ht:'<p>Words like <b>who, which,</b> and <b>that</b> add extra detail about a person or thing.</p>'},
{lb:'Example',dr:dQ5,ht:'<p><b>"The teacher WHO marked our exams is strict."</b> "Who marked our exams" tells us more about the teacher.</p>'},
{lb:'Choosing the right word',dr:dQ5,ht:'<p>Use <b>"who"</b> for people, and <b>"which"</b> or <b>"that"</b> for things.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What do "who", "which" and "that" do?',o:['Add extra detail about a person or thing','End a sentence','Ask a question','Join two full sentences only'],a:0,w:'These words add extra detail about a person or thing.'},{q:'Which word should describe a person?',o:['Who','Which','That','And'],a:0,w:'"Who" is used to describe a person.'},{q:'In "The teacher who marked our exams is strict," what does "who marked our exams" tell us?',o:['More about the teacher','More about the exams','Nothing useful','The exam results'],a:0,w:'"Who marked our exams" gives us more detail about the teacher.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar (Year 8)',ti:'Where Does the Comma Go?',su:'Learn the simple rule for when to use a comma with clauses.',steps:[
{lb:'Clause first: comma needed',dr:dQ6,ht:'<p><b>"Because it rained, we stayed in."</b> When the small clause comes FIRST, add a comma.</p>'},
{lb:'Clause second: no comma',dr:dQ6,ht:'<p><b>"We stayed in because it rained."</b> When the small clause comes SECOND, no comma is needed.</p>'},
{lb:'The rule',dr:dQ6,ht:'<p>Comma only if the small clause (because/although/when...) comes <b>first</b>.</p>'},
{lb:'Practising it',dr:dQ6,ht:'<p>Try writing your sentence both ways and check which order needs the comma.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'When is a comma needed with these clauses?',o:['When the small clause comes first','Always, no matter the order','Never, under any circumstances','Only in questions'],a:0,w:'A comma is needed when the small clause comes first in the sentence.'},{q:'Does "We stayed in because it rained" need a comma?',o:['No, the small clause comes second','Yes, it always needs one','Yes, because it starts with "we"','No sentence can be written this way'],a:0,w:'No comma is needed here because the small clause comes second.'},{q:'Which is correctly punctuated?',o:['"Because it rained, we stayed in."','"Because it rained we stayed, in."','"Because, it rained, we stayed in."','"Because it, rained we stayed in."'],a:0,w:'"Because it rained, we stayed in" correctly places the comma after the first clause.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Grammar (Year 8)',ti:'Spotting Clauses in a Sentence',su:'Practice a simple three-step method for finding clauses.',steps:[
{lb:'Step 1: find the verb',dr:dQ7,ht:'<p>Start by finding the <b>verb</b> in the sentence.</p>'},
{lb:'Step 2: find the subject',dr:dQ7,ht:'<p>Find who or what is doing that verb — the <b>subject</b>.</p>'},
{lb:'Step 3: test it',dr:dQ7,ht:'<p>Ask: could this bit <b>stand alone</b> as its own sentence?</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What is step 1 in finding a clause?',o:['Find the verb','Find a comma','Count the words','Find a capital letter'],a:0,w:'Step 1 is to find the verb in the sentence.'},{q:'What is step 2?',o:['Find the subject doing the verb','Find a full stop','Find an adjective','Find a question mark'],a:0,w:'Step 2 is to find the subject that goes with the verb.'},{q:'What is step 3?',o:['Ask if the clause could stand alone','Ask how many words are in it','Ask if it has a capital letter','Ask if it rhymes'],a:0,w:'Step 3 is to ask whether the clause could stand alone as a full sentence.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Grammar (Year 8)',ti:'A Common Mistake',su:'Learn to spot and fix the common clause mistake.',steps:[
{lb:'The mistake',dr:dQ8,ht:'<p>Writing a clause that cannot stand alone, as if it were a full sentence: <b>✗ "Because it rained."</b></p>'},
{lb:'The fix',dr:dQ8,ht:'<p><b>✓ "Because it rained, we stayed home."</b> Now the thought is finished.</p>'},
{lb:'The rule to remember',dr:dQ8,ht:'<p>Always finish the thought by adding a <b>second clause</b>.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'What is wrong with "Because it rained." on its own?',o:['It cannot stand alone as a full sentence','It has too many words','It has no capital letter','Nothing is wrong with it'],a:0,w:'"Because it rained" cannot stand alone — it needs a second clause.'},{q:'How can this mistake be fixed?',o:['Add a second clause, e.g. "we stayed home"','Delete the word "because"','Add more commas','It cannot be fixed'],a:0,w:'Adding a second clause completes the thought and fixes the mistake.'},{q:'What should you always do to finish this kind of clause?',o:['Add a second clause','Add an exclamation mark','Remove the subject','Remove the verb'],a:0,w:'Always finish the thought by adding a second clause.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Grammar (Year 8)',ti:'Why Clauses Matter',su:'Understand why learning about clauses helps your writing.',steps:[
{lb:'Better writing',dr:dQ9,ht:'<p>Mixing different clause types makes your writing more <b>interesting</b> to read.</p>'},
{lb:'Clearer meaning',dr:dQ9,ht:'<p>Using clauses correctly helps avoid <b>confusing</b> your reader.</p>'},
{lb:'Building block',dr:dQ9,ht:'<p>Every sentence you write is built from <b>clauses</b>.</p>'},
{lb:'Practice helps',dr:dQ9,ht:'<p>The more you notice clauses in your reading and writing, the <b>easier</b> this skill becomes.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'What does mixing clause types do for your writing?',o:['Makes it more interesting to read','Makes it harder to understand','Makes it shorter always','Makes it use fewer words'],a:0,w:'Mixing clause types makes your writing more interesting to read.'},{q:'What does correct clause use help avoid?',o:['Confusing the reader','Using any punctuation','Writing complete sentences','Using capital letters'],a:0,w:'Correct clause use helps avoid confusing the reader.'},{q:'What is every sentence built from?',o:['Clauses','Only nouns','Only adjectives','Only punctuation marks'],a:0,w:'Every sentence is built from clauses.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 &bull; English &bull; Grammar (Year 8)',ti:'Mixed Questions — Clauses',su:'Revise independent and dependent clauses together.',steps:[
{lb:'Clause recap',dr:dQ10,ht:'<p>A <b>clause</b> = subject + verb. An <b>independent clause</b> can stand alone; a <b>dependent clause</b> cannot.</p>'},
{lb:'Joining words',dr:dQ10,ht:'<p>Words like <b>because, although, when, if</b> often begin a dependent clause.</p>'},
{lb:'The comma rule',dr:dQ10,ht:'<p>Add a comma if the small clause comes <b>first</b>; no comma if it comes second.</p>'},
{lb:'Adding detail',dr:dQ10,ht:'<p>Words like <b>who, which, that</b> add extra detail about a person or thing.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'What must every clause contain?',o:['A subject and a verb','Only a verb','Only a subject','A question mark'],a:0,w:'Every clause must contain a subject and a verb.'},{q:'Which clause type can stand alone?',o:['Independent clause','Dependent clause','Neither type','Both equally'],a:0,w:'An independent clause can stand alone as a full sentence.'},{q:'Which word often begins a dependent clause?',o:['Because','And','So','But'],a:0,w:'"Because" often begins a dependent clause that needs another clause to complete it.'},{q:'When is a comma needed?',o:['When the small clause comes first','Always, no matter what','Never, under any circumstances','Only with question marks'],a:0,w:'A comma is needed when the small clause comes first in the sentence.'},{q:'Which word adds detail about a person?',o:['Who','Which','That','And'],a:0,w:'"Who" is used to add detail about a person.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
