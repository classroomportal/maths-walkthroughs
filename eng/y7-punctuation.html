header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}

.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

var ACC='#E65100',DARK='#BF360C',CRM='#FFF3E0',LINE='#FFE0B2';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
    return;
  }
});

function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}

{ey:'Q5 &bull; English &bull; Grammar (Year 7)',ti:'Apostrophes: Contractions',su:'Learn how apostrophes show missing letters.',steps:[
{lb:'What contractions are',dr:dQ5,ht:'<p>An apostrophe shows <b>missing letters</b> when two words are joined together.</p>'},
{lb:'Example',dr:dQ5,ht:'<p><b>"do not"</b> becomes <b>"don\\u2019t"</b> — the apostrophe replaces the missing "o."</p>'},
{lb:'More examples',dr:dQ5,ht:'<p><b>"cannot"</b> becomes <b>"can\\u2019t."</b> <b>"I am"</b> becomes <b>"I\\u2019m."</b></p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What does an apostrophe show in a contraction?',o:['Missing letters','A list of items','A question','A new paragraph'],a:0,w:'An apostrophe shows missing letters in a contraction.'},{q:'What does "don\\u2019t" stand for?',o:['Do not','Does not','Did not','Doing not'],a:0,w:'"Don\\u2019t" is the contraction of "do not."'},{q:'What letter is missing in "don\\u2019t"?',o:['O','A','E','I'],a:0,w:'The "o" from "not" is missing, replaced by the apostrophe.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar (Year 7)',ti:'Apostrophes: Ownership',su:'Learn how apostrophes show who owns something.',steps:[
{lb:'One owner',dr:dQ6,ht:'<p>For one owner, add <b>\\u2019s</b>: "the dog\\u2019s bone."</p>'},
{lb:'Many owners',dr:dQ6,ht:'<p>For many owners already ending in "s," add just <b>\\u2019</b>: "the dogs\\u2019 bones."</p>'},
{lb:'A tricky word: "its"',dr:dQ6,ht:'<p><b>"Its"</b> (belonging to it) has <b>NO apostrophe</b> — this is a common mistake.</p>'},
{lb:'"It\\u2019s" is different',dr:dQ6,ht:'<p><b>"It\\u2019s"</b> means "it is" and always has an apostrophe.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'How do you show ownership for one owner?',o:['Add \\u2019s, e.g. "the dog\\u2019s bone"','Add just \\u2019, e.g. "the dog\\u2019 bone"','Add nothing at all','Add \\u2019re'],a:0,w:'For one owner, add \\u2019s, e.g. "the dog\\u2019s bone."'},{q:'How do you show ownership for many owners ending in "s"?',o:['Add just \\u2019, e.g. "the dogs\\u2019 bones"','Add \\u2019s again','Remove the "s" entirely','Add \\u2019re'],a:0,w:'For many owners already ending in "s," add just \\u2019.'},{q:'Does "its" (belonging to it) have an apostrophe?',o:['No','Yes, always','Yes, but only sometimes','Only in questions'],a:0,w:'"Its" (belonging to it) has no apostrophe.'},{q:'What does "it\\u2019s" (with an apostrophe) mean?',o:['It is','Belonging to it','Its own','A place name'],a:0,w:'"It\\u2019s" (with an apostrophe) means "it is."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Grammar (Year 7)',ti:'Capital Letters',su:'Learn the basic rules for using capital letters correctly.',steps:[
{lb:'Starting a sentence',dr:dQ7,ht:'<p>Start every sentence with a <b>capital letter</b>.</p>'},
{lb:'Names',dr:dQ7,ht:'<p>Names need capitals too: <b>Ada, Lagos, Monday</b>.</p>'},
{lb:'The word "I"',dr:dQ7,ht:'<p>The word <b>"I"</b> is always a capital letter, no matter where it appears in a sentence.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What letter case starts every sentence?',o:['A capital letter','A lowercase letter','No specific rule','Only numbers'],a:0,w:'Every sentence starts with a capital letter.'},{q:'Which of these needs a capital letter?',o:['Lagos','the','and','ran'],a:0,w:'"Lagos" is a place name and needs a capital letter.'},{q:'Is the word "I" always a capital letter?',o:['Yes, always','No, only at the start of a sentence','No, never','Only in questions'],a:0,w:'The word "I" is always a capital letter, wherever it appears.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Grammar (Year 7)',ti:'A Common Mistake',su:'Learn to spot and fix a common punctuation mistake.',steps:[
{lb:'The mistake',dr:dQ8,ht:'<p><b>✗ "its raining outside"</b> — missing both an apostrophe and a capital letter.</p>'},
{lb:'The fix',dr:dQ8,ht:'<p><b>✓ "It\\u2019s raining outside."</b> — capital letter, apostrophe, and full stop all correct.</p>'},
{lb:'The rule to remember',dr:dQ8,ht:'<p>Always check for a <b>capital letter</b> AND <b>correct end punctuation</b>.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'What is wrong with "its raining outside"?',o:['It is missing an apostrophe and a capital letter','It has too many words','It has no verb','Nothing is wrong with it'],a:0,w:'"Its raining outside" is missing both the apostrophe in "it\\u2019s" and a capital letter at the start.'},{q:'What is the corrected version?',o:['"It\\u2019s raining outside."','"Its raining outside."','"it\\u2019s raining outside"','"ITS raining outside."'],a:0,w:'"It\\u2019s raining outside." correctly uses a capital letter, apostrophe, and full stop.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Grammar (Year 7)',ti:'Why Punctuation Matters',su:'Understand how punctuation can completely change meaning.',steps:[
{lb:'Meaning can change',dr:dQ9,ht:'<p>Compare: <b>"Let\\u2019s eat, Grandma!"</b> vs <b>"Let\\u2019s eat Grandma!"</b> — one comma saves Grandma!</p>'},
{lb:'Clarity',dr:dQ9,ht:'<p>Punctuation helps the reader <b>understand</b> your sentence correctly.</p>'},
{lb:'Marks matter',dr:dQ9,ht:'<p>Examiners check punctuation <b>carefully</b> when marking your writing.</p>'},
{lb:'Practice helps',dr:dQ9,ht:'<p>Checking your work becomes <b>automatic</b> the more you practice.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'What does the "Let\\u2019s eat, Grandma!" example show?',o:['Punctuation can completely change meaning','Commas are never important','Grandma is always in danger','Punctuation has no real effect'],a:0,w:'The comma changes the meaning completely — from addressing Grandma to eating her!'},{q:'Why do examiners check punctuation carefully?',o:['It affects the marks given for writing','It has no effect on marks at all','Only spelling is ever checked','Punctuation is optional in exams'],a:0,w:'Examiners check punctuation carefully because it affects the marks given for writing.'},{q:'What happens to punctuation-checking with practice?',o:['It becomes automatic','It becomes harder','It stops mattering','It only works for short sentences'],a:0,w:'Checking your punctuation becomes automatic the more you practice.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 &bull; English &bull; Grammar (Year 7)',ti:'Mixed Questions — Punctuation Basics',su:'Revise full stops, commas, apostrophes and capital letters together.',steps:[
{lb:'End punctuation',dr:dQ10,ht:'<p><b>Full stop</b> ends a statement. <b>Question mark</b> ends a question. <b>Exclamation mark</b> shows strong feeling.</p>'},
{lb:'Commas',dr:dQ10,ht:'<p>Commas <b>separate list items</b> and help <b>join two ideas</b> together.</p>'},
{lb:'Apostrophes',dr:dQ10,ht:'<p>Apostrophes show <b>missing letters</b> (don\\u2019t) or <b>ownership</b> (the dog\\u2019s bone).</p>'},
{lb:'Capital letters',dr:dQ10,ht:'<p>Use capitals for the <b>start of sentences, names,</b> and the word <b>"I."</b></p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'What does a full stop do?',o:['Ends a statement','Ends a question','Shows a list','Shows ownership'],a:0,w:'A full stop ends a statement.'},{q:'What do commas do in a list?',o:['Separate items','End the sentence','Show ownership','Join two full sentences alone'],a:0,w:'Commas separate items in a list.'},{q:'What does an apostrophe show in "don\\u2019t"?',o:['Missing letters','Ownership','A question','A list'],a:0,w:'The apostrophe in "don\\u2019t" shows missing letters.'},{q:'How do you show ownership for one owner?',o:['Add \\u2019s','Add just \\u2019','Add nothing','Add a comma'],a:0,w:'Add \\u2019s to show ownership for one owner, e.g. "the dog\\u2019s bone."'},{q:'Which word is always written with a capital letter?',o:['"I"','"the"','"and"','"a"'],a:0,w:'The word "I" is always written with a capital letter.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
