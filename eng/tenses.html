.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}

.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}

.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}

.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}

function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:'+DARK+';color:#fff;border:1px solid '+DARK+';border-radius:3px;padding:8px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
    return;
  }
});

{lb:'Twelve main tense forms',dr:dQ1,ht:'<p>Combining 3 times with 4 aspects (simple/continuous/perfect/perfect continuous) gives <b>12 main tense forms</b> in total in English.</p>'},
{lb:'Why this matters',dr:dQ1,ht:'<p>Choosing the <b>right tense</b> is vital for clear writing, and is a frequent focus of WAEC and IGCSE grammar marking.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What are the three basic times in the English tense system?',o:['Past, present, and future','Formal, informal, and neutral','Long, medium, and short','Active, passive, and neutral'],a:0,w:'The three basic times are past, present, and future.'},{q:'What does tense tell us?',o:['When an action happens','Who is speaking','Where the action happens','The volume of the speaker\\u2019s voice'],a:0,w:'Tense tells us when an action happens.'},{q:'How many main tense forms exist in English, combining time and aspect?',o:['Twelve','Three','Nine','Six'],a:0,w:'Combining 3 times with 4 aspects gives 12 main tense forms.'},{q:'What four aspects combine with the three times?',o:['Simple, continuous, perfect, and perfect continuous','Formal, casual, and poetic','Loud, quiet, and neutral','Positive, negative, and neutral'],a:0,w:'The four aspects are simple, continuous, perfect, and perfect continuous.'},{q:'Why does choosing the right tense matter for exams?',o:['It is a frequent focus of WAEC/IGCSE grammar marking','It has no effect on exam marks at all','It only matters for spoken English','It only matters in poetry'],a:0,w:'Choosing the right tense is a frequent focus of WAEC/IGCSE grammar marking.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 &bull; English &bull; Grammar',ti:'Simple Tenses',su:'Use past, present and future simple to state facts and completed actions.',steps:[
{lb:'Past simple',dr:dQ2,ht:'<p><b>Past simple:</b> "She walked to school." — describes a <b>completed action</b> in the past.</p>'},
{lb:'Present simple',dr:dQ2,ht:'<p><b>Present simple:</b> "She walks to school." — describes a <b>habit or general fact</b>.</p>'},
{lb:'Future simple',dr:dQ2,ht:'<p><b>Future simple:</b> "She will walk to school." — describes a <b>prediction or plan</b>.</p>'},
{lb:'The most common tense forms',dr:dQ2,ht:'<p>Simple tenses state a fact or completed action with no ongoing sense — they are the <b>default, most common</b> tense choice in most writing.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What does past simple describe?',o:['A completed action in the past','An action in progress now','A future prediction only','A habitual action only'],a:0,w:'Past simple describes a completed action in the past, e.g. "She walked to school."'},{q:'What does present simple describe?',o:['A habit or general fact','Only actions in progress','Only future plans','Only completed past actions'],a:0,w:'Present simple describes a habit or general fact, e.g. "She walks to school."'},{q:'What does future simple describe?',o:['A prediction or plan','A completed past action','An ongoing present action','A fact that never changes'],a:0,w:'Future simple describes a prediction or plan, e.g. "She will walk to school."'},{q:'Which is an example of past simple?',o:['"She walked to school."','"She walks to school."','"She will walk to school."','"She is walking to school."'],a:0,w:'"She walked to school" is past simple — a completed action.'},{q:'Why are simple tenses considered the most common?',o:['They are the default tense choice for stating facts/completed actions','They are the hardest to learn','They are only used in questions','They are only used in formal writing'],a:0,w:'Simple tenses are the default, most common tense choice in most writing.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 &bull; English &bull; Grammar',ti:'Continuous (Progressive) Tenses',su:'Use continuous tenses to show actions in progress.',steps:[
{lb:'How continuous tenses are formed',dr:dQ3,ht:'<p>Continuous tenses are formed with a form of <b>"be" + verb-ING</b>: "was walking," "is walking," "will be walking."</p>'},
{lb:'What they show',dr:dQ3,ht:'<p>Continuous tenses show an action <b>in progress</b> at a particular point in time: "She was walking when it started to rain."</p>'},
{lb:'Present continuous for near-future plans',dr:dQ3,ht:'<p>Present continuous can also express a <b>near-future plan</b>: "I am meeting her tomorrow."</p>'},
{lb:'Why writers use it',dr:dQ3,ht:'<p>Continuous tenses add a sense of <b>duration or interruption</b>, making them useful for scene-setting in narrative writing.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'How are continuous tenses formed?',o:['A form of "be" + verb-ING','A form of "have" + past participle','Just adding "-ed" to the verb','A modal verb alone'],a:0,w:'Continuous tenses are formed with a form of "be" plus verb-ING.'},{q:'What do continuous tenses typically show?',o:['An action in progress at a point in time','Only a completed action','Only a future prediction','Only a general fact'],a:0,w:'Continuous tenses show an action in progress at a particular point in time.'},{q:'What can present continuous also express?',o:['A near-future plan','Only actions from long ago','A permanent, unchanging fact','A command'],a:0,w:'Present continuous can also express a near-future plan, e.g. "I am meeting her tomorrow."'},{q:'Which is an example of a continuous tense?',o:['"She was walking when it started to rain."','"She walked to school."','"She will walk to school."','"She walks to school every day."'],a:0,w:'"She was walking..." uses the past continuous, showing an action in progress.'},{q:'Why are continuous tenses useful in narrative writing?',o:['They add a sense of duration or interruption for scene-setting','They make writing shorter overall','They avoid the need for any subject','They are required in every sentence'],a:0,w:'Continuous tenses add a sense of duration or interruption, useful for scene-setting.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 &bull; English &bull; Grammar',ti:'Perfect Tenses',su:'Use perfect tenses to show completion relative to another point in time.',steps:[
{lb:'Past perfect',dr:dQ4,ht:'<p><b>Past perfect:</b> "She had walked" — describes an action completed <b>before another past action</b>.</p>'},
{lb:'Present perfect',dr:dQ4,ht:'<p><b>Present perfect:</b> "She has walked" — links a past action to the <b>present moment</b>.</p>'},
{lb:'Future perfect',dr:dQ4,ht:'<p><b>Future perfect:</b> "She will have walked" — describes an action that will be <b>complete by a future point</b>.</p>'},
{lb:'How perfect tenses are formed',dr:dQ4,ht:'<p>All perfect tenses are formed with <b>"have/has/had" + past participle</b>, showing completion relative to another point in time.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What does past perfect describe?',o:['An action completed before another past action','An action happening right now','A future prediction','A general habit'],a:0,w:'Past perfect describes an action completed before another past action.'},{q:'What does present perfect do?',o:['Links a past action to the present moment','Describes only future events','Describes only habits','Has no connection to the present at all'],a:0,w:'Present perfect links a past action to the present moment.'},{q:'What does future perfect describe?',o:['An action that will be complete by a future point','An action happening right now','A past habit','A general fact with no time reference'],a:0,w:'Future perfect describes an action that will be complete by a specified future point.'},{q:'How are all perfect tenses formed?',o:['"Have/has/had" + past participle','"Be" + verb-ING','Modal verb + base verb','Simple present tense only'],a:0,w:'All perfect tenses are formed with "have/has/had" plus a past participle.'},{q:'Which is an example of present perfect?',o:['"She has walked to school."','"She walked to school."','"She will walk to school."','"She was walking to school."'],a:0,w:'"She has walked to school" is present perfect, linking past action to the present.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 &bull; English &bull; Grammar',ti:'Present Perfect vs Past Simple',su:'Choose correctly between present perfect and past simple based on time reference.',steps:[
{lb:'Past simple: specific time',dr:dQ5,ht:'<p><b>Past simple</b> is used when a <b>specific past time</b> is given: "I visited Lagos in 2020."</p>'},
{lb:'Present perfect: unspecified time',dr:dQ5,ht:'<p><b>Present perfect</b> is used when <b>no specific time</b> is given, and the action still feels relevant now: "I have visited Lagos."</p>'},
{lb:'A common error',dr:dQ5,ht:'<p>A frequent error is mixing the two: <b>✗ "I have visited Lagos in 2020"</b> is incorrect — a specific past time requires <b>past simple</b>, not present perfect.</p>'},
{lb:'Why this distinction is tested',dr:dQ5,ht:'<p>This exact distinction is a <b>frequent WAEC/IGCSE grammar test point</b>, so recognising time signals is essential.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'When is past simple used regarding time?',o:['When a specific past time is given','Only when no time is given at all','Only for future events','Only for permanent facts'],a:0,w:'Past simple is used when a specific past time is given, e.g. "in 2020."'},{q:'When is present perfect used regarding time?',o:['When no specific time is given, and it feels relevant now','Only when an exact date is given','Only for predictions','Only for habits'],a:0,w:'Present perfect is used when no specific time is given, and the action feels relevant now.'},{q:'Which of these is grammatically correct?',o:['"I visited Lagos in 2020."','"I have visited Lagos in 2020."','"I have visit Lagos in 2020."','"I having visited Lagos in 2020."'],a:0,w:'"I visited Lagos in 2020" correctly uses past simple with a specific past time.'},{q:'Why is "I have visited Lagos in 2020" incorrect?',o:['A specific past time requires past simple, not present perfect','Present perfect can never be used with places','"Visited" is spelled incorrectly','It should be in the future tense'],a:0,w:'A specific past time like "in 2020" requires past simple, not present perfect.'},{q:'Why does this distinction matter for exams?',o:['It is a frequent WAEC/IGCSE grammar test point','It has no bearing on exam marks','It only matters in spoken English','It is only relevant to poetry'],a:0,w:'This distinction is a frequent WAEC/IGCSE grammar test point.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar',ti:'Tense Consistency',su:'Maintain consistent tense across a passage of writing.',steps:[
{lb:'The problem with unintended shifts',dr:dQ6,ht:'<p>Unintended tense shifts confuse the reader: <b>✗ "She walks to school and then went home."</b> mixes present and past without reason.</p>'},
{lb:'The corrected version',dr:dQ6,ht:'<p><b>✓ "She walked to school and then went home."</b> — keeping the <b>same base tense</b> across the passage avoids confusion.</p>'},
{lb:'Narrative default',dr:dQ6,ht:'<p><b>Narrative writing</b> usually stays in <b>past tense</b> throughout; recounts, reports, and instructions vary depending on purpose.</p>'},
{lb:'Deliberate shifts must be clear',dr:dQ6,ht:'<p>Deliberate tense shifts (e.g. a <b>flashback</b>) must be clearly signalled to the reader, not left ambiguous.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What problem does an unintended tense shift cause?',o:['It confuses the reader','It always improves clarity','It has no effect on the reader','It is required for good grammar'],a:0,w:'An unintended tense shift confuses the reader.'},{q:'Which of these is correctly consistent in tense?',o:['"She walked to school and then went home."','"She walks to school and then went home."','"She walked to school and then goes home."','"She will walk to school and then went home."'],a:0,w:'"She walked... and then went home" keeps a consistent past tense throughout.'},{q:'What tense does narrative writing usually stay in?',o:['Past tense','Present tense always','Future tense always','A random mix of all tenses'],a:0,w:'Narrative writing usually stays in past tense throughout.'},{q:'What must a deliberate tense shift, like a flashback, be?',o:['Clearly signalled to the reader','Left completely ambiguous','Avoided entirely in all writing','Written only in the future tense'],a:0,w:'A deliberate tense shift, such as a flashback, must be clearly signalled to the reader.'},{q:'What general rule helps avoid tense-consistency errors?',o:['Keep the same base tense across a passage','Change tense in every sentence for variety','Only use the present tense ever','Avoid using verbs where possible'],a:0,w:'Keeping the same base tense across a passage helps avoid tense-consistency errors.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Grammar',ti:'Tense in Different Writing Forms',su:'Choose the appropriate tense for different IGCSE writing forms.',steps:[
{lb:'Narrative writing',dr:dQ7,ht:'<p><b>Narrative writing</b> usually stays in <b>past tense</b> throughout, recounting events as if they already happened.</p>'},
{lb:'Descriptive writing',dr:dQ7,ht:'<p><b>Descriptive writing</b> can use <b>present tense</b> for immediacy (as if happening now), or <b>past tense</b> for recollection.</p>'},
{lb:'Reports and reviews',dr:dQ7,ht:'<p><b>Reports</b> use past tense for events but present tense for ongoing facts. <b>Reviews</b> typically use present tense: "The film shows..."</p>'},
{lb:'Speeches',dr:dQ7,ht:'<p><b>Speeches</b> often use present/future tense, since they are direct and forward-looking in purpose.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What tense does narrative writing usually stay in?',o:['Past tense','Present tense always','Future tense always','It never uses a consistent tense'],a:0,w:'Narrative writing usually stays in past tense throughout.'},{q:'What tense can descriptive writing use for immediacy?',o:['Present tense','Only past perfect','Only future tense','No tense — description avoids verbs'],a:0,w:'Descriptive writing can use present tense for a sense of immediacy.'},{q:'What tense do reviews typically use?',o:['Present tense, e.g. "The film shows..."','Past tense exclusively','Future tense exclusively','No consistent tense at all'],a:0,w:'Reviews typically use present tense, e.g. "The film shows..."'},{q:'What tense do speeches often use?',o:['Present/future tense, being direct and forward-looking','Only past perfect tense','Only past continuous tense','No tense is used in speeches'],a:0,w:'Speeches often use present/future tense, since they are direct and forward-looking.'},{q:'What tense do reports use for events versus ongoing facts?',o:['Past tense for events, present tense for ongoing facts','Only future tense throughout','Only past continuous throughout','No distinction is ever made'],a:0,w:'Reports use past tense for events but present tense for ongoing facts.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Grammar',ti:'Common Tense Errors',su:'Recognise and correct frequent tense mistakes, including irregular verbs.',steps:[
{lb:'Irregular verb mistakes',dr:dQ8,ht:'<p>A common error is misforming irregular past tenses, e.g. <b>✗ "goed"</b> instead of <b>✓ "went."</b> English has many irregular past tense forms that must be memorised.</p>'},
{lb:'Mixing past simple with present perfect',dr:dQ8,ht:'<p>Another common error is incorrectly mixing tenses: <b>✗ "I have went there yesterday."</b></p>'},
{lb:'The corrected versions',dr:dQ8,ht:'<p><b>✓ "I went there yesterday"</b> (specific past time = past simple). <b>✓ "I have been there"</b> (no specific time = present perfect).</p>'},
{lb:'How to fix these errors',dr:dQ8,ht:'<p>Fix by learning irregular verb forms, and always checking for <b>time signal words</b> like "yesterday" or "in 2020," which require past simple.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'What is the correct past tense of "go"?',o:['Went','Goed','Gone (alone, without "have")','Going'],a:0,w:'The correct irregular past tense of "go" is "went," not "goed."'},{q:'Which of these is a tense error?',o:['"I have went there yesterday."','"I went there yesterday."','"I have been there."','"I have gone there."'],a:0,w:'"I have went there yesterday" incorrectly mixes present perfect with a specific past time signal.'},{q:'Which is the correct version, given a specific past time?',o:['"I went there yesterday."','"I have went there yesterday."','"I have go there yesterday."','"I having went there yesterday."'],a:0,w:'"I went there yesterday" correctly uses past simple with a specific past time.'},{q:'Which is the correct version, with no specific time given?',o:['"I have been there."','"I have went there."','"I go there."','"I have go there."'],a:0,w:'"I have been there" correctly uses present perfect with no specific time given.'},{q:'What should you always check to avoid this type of tense error?',o:['Time signal words like "yesterday" or "in 2020"','The number of syllables in the verb','Whether the sentence is a question','The colour scheme of the passage'],a:0,w:'Checking for time signal words helps determine whether past simple or present perfect is needed.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Grammar',ti:'Time Signal Words',su:'Use time signal words to identify the correct tense to use.',steps:[
{lb:'Past simple signals',dr:dQ9,ht:'<p>Words like <b>"yesterday," "last week," "in 2020"</b> signal that <b>past simple</b> is needed.</p>'},
{lb:'Present simple signals',dr:dQ9,ht:'<p>Words like <b>"now," "every day," "always"</b> signal that <b>present simple</b> is needed.</p>'},
{lb:'Future simple signals',dr:dQ9,ht:'<p>Words like <b>"tomorrow," "next year," "soon"</b> signal that <b>future simple</b> is needed.</p>'},
{lb:'Present perfect signals',dr:dQ9,ht:'<p>Words like <b>"already," "just," "ever," "never," "yet"</b> signal <b>present perfect</b>; <b>"since"</b> and <b>"for" + duration</b> signal ongoing present perfect.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'Which time word signals past simple?',o:['Yesterday','Now','Tomorrow','Already'],a:0,w:'"Yesterday" signals a specific past time, requiring past simple.'},{q:'Which time word signals present simple?',o:['Always','Yesterday','Tomorrow','Ever'],a:0,w:'"Always" signals a general habit, requiring present simple.'},{q:'Which time word signals future simple?',o:['Tomorrow','Yesterday','Already','Since'],a:0,w:'"Tomorrow" signals a future time, requiring future simple.'},{q:'Which time word signals present perfect?',o:['Already','Yesterday','Tomorrow','Next year'],a:0,w:'"Already" signals present perfect, e.g. "I have already finished."'},{q:'Which words signal an ongoing present perfect?',o:['"Since" and "for" + duration','"Yesterday" and "last week"','"Tomorrow" and "next year"','"Always" and "every day"'],a:0,w:'"Since" and "for" + duration signal an ongoing present perfect, e.g. "I have lived here since 2020."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 &bull; English &bull; Grammar',ti:'Mixed Questions — Tenses',su:'Integrated revision across simple, continuous, perfect tenses and consistency.',steps:[
{lb:'Three times, four aspects',dr:dQ10,ht:'<p>English has <b>past, present, future</b>, each with <b>simple, continuous, perfect,</b> and <b>perfect continuous</b> forms — 12 forms in total.</p>'},
{lb:'Simple vs continuous vs perfect vs perfect continuous',dr:dQ10,ht:'<p><b>Simple</b> states facts/completed actions. <b>Continuous</b> ("be"+ing) shows action in progress. <b>Perfect</b> ("have/has/had"+past participle) shows completion relative to a point in time. <b>Perfect continuous</b> ("have/has/had been"+ing) shows ongoing duration up to a point in time.</p>'},
{lb:'Present perfect vs past simple',dr:dQ10,ht:'<p>Use <b>past simple</b> with a specific time ("in 2020"); use <b>present perfect</b> with no specific time, when it still feels relevant now.</p>'},
{lb:'Consistency and form choice',dr:dQ10,ht:'<p>Keep tense <b>consistent</b> within a passage, and choose tense appropriately for the <b>writing form</b> — e.g. narrative in past, reviews in present.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'How many main tense forms exist in English?',o:['Twelve','Three','Six','Nine'],a:0,w:'Combining 3 times with 4 aspects gives 12 main tense forms.'},{q:'How are continuous tenses formed?',o:['"Be" + verb-ING','"Have" + past participle','A modal verb alone','Adding "-ed" to the base verb'],a:0,w:'Continuous tenses are formed with a form of "be" plus verb-ING.'},{q:'How are perfect tenses formed?',o:['"Have/has/had" + past participle','"Be" + verb-ING','A modal verb + base verb','No auxiliary is needed'],a:0,w:'Perfect tenses are formed with "have/has/had" plus a past participle.'},{q:'How are perfect continuous tenses formed, and what do they emphasise?',o:['"Have/has/had been" + verb-ING, emphasising ongoing duration','"Be" + past participle, emphasising a single instant','A modal verb alone, emphasising possibility','Adding "-ing" only, emphasising completion'],a:0,w:'Perfect continuous tenses are formed with "have/has/had been" plus verb-ING, and emphasise ongoing duration up to a point in time.'},{q:'When should past simple be used instead of present perfect?',o:['When a specific past time is given','When no time reference exists at all','Only in questions','Only in negative sentences'],a:0,w:'Past simple should be used when a specific past time is given, e.g. "in 2020."'},{q:'What tense does narrative writing usually maintain?',o:['Past tense','Present tense always','Future tense always','A random mix throughout'],a:0,w:'Narrative writing usually maintains past tense consistently throughout.'},{q:'What is a common irregular verb error?',o:['"Goed" instead of "went"','"Went" instead of "goed"','Using "was" correctly','Using "have" correctly'],a:0,w:'"Goed" instead of "went" is a common irregular verb error.'},{q:'Which time word signals present perfect rather than past simple?',o:['Already','Yesterday','In 2020','Last week'],a:0,w:'"Already" signals present perfect, unlike specific past-time words like "yesterday."'},{q:'Why must unintended tense shifts be avoided?',o:['They confuse the reader about when events happen','They are required for correct grammar','They make writing more exciting','They have no effect on meaning'],a:0,w:'Unintended tense shifts confuse the reader about when events happen.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q11 &bull; English &bull; Grammar',ti:'Perfect Continuous Tenses',su:'Use perfect continuous tenses to show duration up to a point in time.',steps:[
{lb:'Present perfect continuous',dr:dQ11,ht:'<p><b>Present perfect continuous:</b> "She has been walking" — describes an action of <b>duration continuing up to now</b>, often with "for" or "since": "She has been walking for an hour."</p>'},
{lb:'Past perfect continuous',dr:dQ11,ht:'<p><b>Past perfect continuous:</b> "She had been walking" — describes a <b>duration that continued up to a point in the past</b>: "She had been walking for an hour when it started to rain."</p>'},
{lb:'Future perfect continuous',dr:dQ11,ht:'<p><b>Future perfect continuous:</b> "She will have been walking" — describes a <b>duration that will continue up to a future point</b>: "By 6pm, she will have been walking for two hours."</p>'},
{lb:'Perfect continuous vs perfect',dr:dQ11,ht:'<p>All perfect continuous tenses are formed with <b>"have/has/had been" + verb-ING</b>. Unlike simple perfect, they stress the <b>ongoing duration</b> of the action, not just its completion: "I have lived here" (simple fact) vs "I have been living here" (emphasises duration).</p>'},
{lb:'Your turn',dr:dQ11,ht:tryItMC(function(){var qs=[{q:'How are perfect continuous tenses formed?',o:['"Have/has/had been" + verb-ING','"Be" + verb-ING','"Have/has/had" + past participle','A modal verb + base verb'],a:0,w:'Perfect continuous tenses are formed with "have/has/had been" plus verb-ING.'},{q:'What does present perfect continuous emphasise?',o:['Duration continuing up to now','A single completed action','A future prediction','A permanent, unchanging fact'],a:0,w:'Present perfect continuous emphasises duration continuing up to the present moment, e.g. "She has been walking for an hour."'},{q:'What does past perfect continuous describe?',o:['A duration that continued up to a point in the past','An action happening right now','A duration up to a future point','A single instant in the past'],a:0,w:'Past perfect continuous describes a duration that continued up to a point in the past.'},{q:'What does future perfect continuous describe?',o:['A duration that will continue up to a future point','A duration up to a past point','A single completed future action','A general future habit'],a:0,w:'Future perfect continuous describes a duration continuing up to a specified future point.'},{q:'How does "I have been living here" differ in emphasis from "I have lived here"?',o:['It emphasises ongoing duration rather than just the fact','It means something happened only once','It refers only to the future','There is no difference in meaning'],a:0,w:'"I have been living here" (perfect continuous) emphasises ongoing duration, while "I have lived here" (perfect) simply states the fact.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},

];

function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
