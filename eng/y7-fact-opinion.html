<style>
:root{--red:#E65100;--dark:#BF360C;--cream:#FFF3E0;--ink:#2a1a0d;--line:#FFE0B2;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#E65100',DARK='#BF360C',CRM='#FFF3E0',LINE='#FFE0B2';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#2a1a0d';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'What is a Fact?',ACC,14,'middle',true));
if(p>=1){o.push(R(10,40,460,50,CRM,ACC,2));o.push(T(240,60,'A fact can be PROVEN to be true',DARK,11,'middle',false));o.push(T(240,80,'It doesn\\u2019t change person to person','#555',10,'middle',false));}
if(p>=2){o.push(R(10,100,460,44,'#fff',ACC,1));o.push(T(240,120,'"Lagos is in Nigeria."',DARK,11,'middle',false));o.push(T(240,138,'This can be checked and proven true','#555',9,'middle',false));}
if(p>=3){o.push(R(10,154,460,40,'#e8f5e9',ACC,1));o.push(T(240,178,'Facts often include numbers, dates, and measurable things',DARK,10,'middle',false));}
s.innerHTML=o.join('');}

function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'What is an Opinion?',ACC,14,'middle',true));
if(p>=1){o.push(R(10,40,460,50,CRM,ACC,2));o.push(T(240,60,'An opinion is what someone THINKS or BELIEVES',DARK,10,'middle',false));o.push(T(240,80,'It can be different from person to person','#555',10,'middle',false));}
if(p>=2){o.push(R(10,100,460,44,'#fff',ACC,1));o.push(T(240,120,'"Lagos is the best city in Nigeria."',DARK,10,'middle',false));o.push(T(240,138,'This cannot be proven — it\\u2019s a personal view','#555',9,'middle',false));}
s.innerHTML=o.join('');}

function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Fact vs Opinion Side by Side',ACC,12,'middle',true));
if(p>=1){o.push(R(10,40,220,50,'#fff',ACC,1.5));o.push(T(120,60,'Fact',ACC,11,'middle',true));o.push(T(120,80,'"It is 30 degrees today."','#555',8,'middle',false));
  o.push(R(250,40,220,50,'#fff',ACC,1.5));o.push(T(360,60,'Opinion',ACC,11,'middle',true));o.push(T(360,80,'"It is too hot today."','#555',8,'middle',false));}
if(p>=2){o.push(R(10,102,460,44,CRM,ACC,1));o.push(T(240,120,'Fact: can be measured with a thermometer',DARK,10,'middle',false));o.push(T(240,138,'Opinion: "too hot" depends on the person','#555',9,'middle',false));}
s.innerHTML=o.join('');}

function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Clue Words for Opinions',ACC,13,'middle',true));
[['I think...','Shows a personal view'],['I believe...','Shows a personal view'],['best / worst','Comparing words are often opinions'],['should / must','Suggests what someone thinks is right']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(130,56+i*36,r[0],ACC,9,'middle',true));o.push(T(340,56+i*36,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Facts Can Still Be Wrong!',ACC,13,'middle',true));
if(p>=1){o.push(R(10,40,460,44,CRM,ACC,2));o.push(T(240,60,'A "fact" statement can still be FALSE',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#fff',ACC,1));o.push(T(240,116,'"The Earth is flat." — stated as a fact, but WRONG',DARK,10,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,'#e8f5e9',ACC,1));o.push(T(240,176,'What matters: CAN it be checked/proven? Not whether it\\u2019s true.','#555',10,'middle',false));}
s.innerHTML=o.join('');}

function dQ6(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Mixing Facts and Opinions',ACC,13,'middle',true));
[['Watch out!','A sentence can contain BOTH'],['Example','"Lagos, which has 20 million people, is amazing."'],['Fact part','"Lagos has 20 million people"'],['Opinion part','"is amazing"']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,9,'middle',true));o.push(T(330,56+i*36,r[1],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}

function dQ7(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Why Advertisers Use Opinions',ACC,12,'middle',true));
if(p>=1){o.push(R(10,40,460,44,CRM,ACC,2));o.push(T(240,60,'Adverts often use opinions dressed up as facts',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#fff',ACC,1));o.push(T(240,116,'"The BEST chocolate in the world!"',DARK,10,'middle',false));o.push(T(240,134,'Sounds like a fact, but it\\u2019s really an opinion','#555',9,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,'#e8f5e9',ACC,1));o.push(T(240,176,'Being able to spot this makes you a smarter reader!','#555',10,'middle',false));}
s.innerHTML=o.join('');}

function dQ8(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'A Common Mistake',ACC,13,'middle',true));
if(p>=1){o.push(R(10,40,460,44,'#fde8e8',ACC,2));o.push(T(240,60,'Thinking all confident statements are facts',DARK,10,'middle',false));o.push(T(240,80,'✗ "It MUST be true, it sounds so certain!"','#555',10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#e8f5e9',ACC,1));o.push(T(240,116,'✓ Ask: "Can this be checked or proven?"',DARK,10,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,CRM,ACC,1));o.push(T(240,176,'Confidence in tone does NOT make something a fact','#555',10,'middle',false));}
s.innerHTML=o.join('');}

function dQ9(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Why This Skill Matters',ACC,13,'middle',true));
[['Critical thinking','Helps you judge what you read carefully'],['Spotting bias','Many texts mix opinion INTO facts to persuade you'],['Everyday life','News, adverts, and social media all need this skill'],['Exam relevance','A core reading skill tested at IGCSE and WAEC']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,9,'middle',true));o.push(T(330,56+i*36,r[1],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Fact vs Opinion — Summary',ACC,13,'middle',true));
[['Fact','Can be proven true or false'],['Opinion','What someone thinks or believes'],['Clue words','I think, I believe, best, worst, should'],['Facts can be wrong','But they can still be checked/proven'],['Watch for mixing','One sentence can contain both']].forEach(function(r,i){if(i<p+1){o.push(R(10,34+i*36,460,30,CRM,LINE,1));o.push(T(120,54+i*36,r[0],ACC,9,'middle',true));o.push(T(330,54+i*36,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}

var QS=[

{ey:'Q1 &bull; English &bull; Reading (Year 7)',ti:'What is a Fact?',su:'Learn what makes a statement a fact.',steps:[
{lb:'Definition',dr:dQ1,ht:'<p>A <b>fact</b> can be proven to be true. It doesn\\u2019t change from person to person.</p>'},
{lb:'Example',dr:dQ1,ht:'<p><b>"Lagos is in Nigeria."</b> This can be checked and proven true.</p>'},
{lb:'What facts often include',dr:dQ1,ht:'<p>Facts often include <b>numbers, dates,</b> and other <b>measurable</b> things.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is a fact?',o:['Something that can be proven to be true','Something only some people believe','A statement that always sounds confident','A guess about the future'],a:0,w:'A fact can be proven to be true.'},{q:'Which of these is a fact?',o:['"Lagos is in Nigeria."','"Lagos is the best city."','"Lagos feels too crowded."','"Lagos is boring."'],a:0,w:'"Lagos is in Nigeria" can be checked and proven true — a fact.'},{q:'What do facts often include?',o:['Numbers, dates, and measurable things','Only feelings','Only opinions','Nothing specific'],a:0,w:'Facts often include numbers, dates, and other measurable things.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 &bull; English &bull; Reading (Year 7)',ti:'What is an Opinion?',su:'Learn what makes a statement an opinion.',steps:[
{lb:'Definition',dr:dQ2,ht:'<p>An <b>opinion</b> is what someone thinks or believes. It can be different from person to person.</p>'},
{lb:'Example',dr:dQ2,ht:'<p><b>"Lagos is the best city in Nigeria."</b> This cannot be proven — it\\u2019s a personal view.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What is an opinion?',o:['What someone thinks or believes','Something that can always be proven true','A fact stated confidently','A measurement using numbers'],a:0,w:'An opinion is what someone thinks or believes.'},{q:'Which of these is an opinion?',o:['"Lagos is the best city in Nigeria."','"Lagos is in Nigeria."','"Lagos has over 20 million people."','"Lagos is a coastal city."'],a:0,w:'"Lagos is the best city" is a personal view — an opinion.'},{q:'Can opinions differ from person to person?',o:['Yes','No, they are always the same','No, opinions are facts','Only in fiction books'],a:0,w:'Opinions can differ from person to person, unlike facts.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'The opinion',dr:dQ3,ht:'<p><b>"It is too hot today."</b> Whether it\\u2019s "too hot" depends on the person.</p>'},

]},
