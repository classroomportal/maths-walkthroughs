var ACC='#E65100',DARK='#BF360C',CRM='#FFF3E0',LINE='#FFE0B2';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
    return;
  }
});

function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}

{ey:'Q4 &bull; English &bull; Grammar (Year 7)',ti:'Commands — Telling Someone to Do Something',su:'Learn how to give instructions using commands.',steps:[
{lb:'What a command does',dr:dQ4,ht:'<p>A <b>command</b> gives an instruction or order.</p>'},
{lb:'The hidden subject',dr:dQ4,ht:'<p>In a command, the subject <b>"you"</b> is understood but not written — we just don\'t say it.</p>'},
{lb:'Examples',dr:dQ4,ht:'<p><b>"Sit down."</b> "Please close the door."</b> Both are commands.</p>'},
{lb:'How it ends',dr:dQ4,ht:'<p>A command can end with a <b>full stop</b> or, if urgent, an <b>exclamation mark</b>.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What does a command do?',o:['Gives an instruction or order','Asks a question','Tells a fact','Shows surprise'],a:0,w:'A command gives an instruction or order.'},{q:'What subject is hidden in a command?',o:['"You"','"I"','"They"','"It"'],a:0,w:'The subject "you" is understood but not written in a command.'},{q:'Which of these is a command?',o:['"Sit down."','"Are you sitting?"','"I am sitting."','"What a great seat!"'],a:0,w:'"Sit down" gives an instruction — a command.'},{q:'What punctuation can a command end with?',o:['A full stop or exclamation mark','Only a question mark','Only a comma','No punctuation at all'],a:0,w:'A command can end with a full stop, or an exclamation mark if urgent.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 &bull; English &bull; Grammar (Year 7)',ti:'Exclamations — Excited Sentences!',su:'Learn how to write sentences that show strong feeling.',steps:[
{lb:'What an exclamation does',dr:dQ5,ht:'<p>An <b>exclamation</b> shows strong feeling or surprise.</p>'},
{lb:'How it ends',dr:dQ5,ht:'<p>An exclamation ends with an <b>exclamation mark (!)</b></p>'},
{lb:'Examples',dr:dQ5,ht:'<p><b>"What a great goal!"</b> "I won!"</b> Both show excitement.</p>'},
{lb:'Don\'t overuse it',dr:dQ5,ht:'<p>Save the exclamation mark for real excitement — using it too often makes it less special.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What does an exclamation show?',o:['Strong feeling or surprise','A calm fact','A question','An instruction'],a:0,w:'An exclamation shows strong feeling or surprise.'},{q:'What punctuation ends an exclamation?',o:['An exclamation mark','A full stop','A question mark','A comma'],a:0,w:'An exclamation ends with an exclamation mark.'},{q:'Which of these is an exclamation?',o:['"I won!"','"Did I win?"','"I did not win."','"Winning is good."'],a:0,w:'"I won!" shows excitement — an exclamation.'},{q:'What happens if you use exclamation marks too often?',o:['They become less special','Your writing becomes clearer','Nothing changes at all','They are required by every sentence'],a:0,w:'Overusing exclamation marks makes them less special and less effective.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar (Year 7)',ti:'Short and Long Sentences',su:'See how sentence length can change the effect of your writing.',steps:[
{lb:'Short sentences',dr:dQ6,ht:'<p>A <b>short sentence</b>, like "She ran," feels quick and punchy.</p>'},
{lb:'Long sentences',dr:dQ6,ht:'<p>A <b>long sentence</b>, like "She ran quickly because the bus was leaving," gives us more detail.</p>'},
{lb:'Both are correct',dr:dQ6,ht:'<p>Neither length is "better" — it depends on <b>what you need to say</b>.</p>'},
{lb:'Mixing lengths',dr:dQ6,ht:'<p>Good writers <b>mix short and long sentences</b> to create different effects in their writing.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What feeling does a short sentence often give?',o:['Quick and punchy','Slow and detailed','Confusing','Formal only'],a:0,w:'A short sentence often feels quick and punchy.'},{q:'What does a long sentence usually give us?',o:['More detail','Less information','No information at all','Only questions'],a:0,w:'A long sentence usually gives us more detail.'},{q:'Is a short sentence always "worse" than a long one?',o:['No, both are correct depending on what you need to say','Yes, always worse','Yes, unless it has ten words','No, short sentences are always better'],a:0,w:'Neither length is inherently better — it depends on what you need to say.'},{q:'What do good writers do with sentence length?',o:['Mix short and long sentences for effect','Only ever use short sentences','Only ever use long sentences','Avoid using sentences of any length'],a:0,w:'Good writers mix short and long sentences to create different effects.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Grammar (Year 7)',ti:'Joining Two Ideas: "and", "but", "or"',su:'Learn how little joining words connect two ideas together.',steps:[
{lb:'Joining words',dr:dQ7,ht:'<p>Little words like <b>and, but, or,</b> and <b>so</b> connect two ideas together in one sentence.</p>'},
{lb:'Example with "and"',dr:dQ7,ht:'<p><b>"I like tea AND coffee."</b> "And" joins two things the writer likes.</p>'},
{lb:'Example with "but"',dr:dQ7,ht:'<p><b>"I wanted to play BUT it rained."</b> "But" shows a change or a problem.</p>'},
{lb:'Why this helps',dr:dQ7,ht:'<p>Using joining words helps you write <b>longer, more interesting sentences</b> instead of lots of short, choppy ones.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What do words like "and", "but", "or" do?',o:['Connect two ideas in one sentence','End a sentence','Start a question','Show strong emotion'],a:0,w:'Words like "and," "but," "or" connect two ideas together in one sentence.'},{q:'In "I like tea AND coffee," what does "and" do?',o:['Joins two things the writer likes','Ends the sentence','Asks a question','Shows surprise'],a:0,w:'"And" joins the two things — tea and coffee — that the writer likes.'},{q:'What does "but" often show?',o:['A change or a problem','A list of similar things','A question','Strong excitement'],a:0,w:'"But" often shows a change or a problem, e.g. "I wanted to play but it rained."'},{q:'Why is it helpful to use joining words?',o:['They help you write longer, more interesting sentences','They make sentences shorter','They remove the need for a subject','They are required at the start of every sentence'],a:0,w:'Joining words help you write longer, more interesting sentences instead of short, choppy ones.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Grammar (Year 7)',ti:'Common Mistakes',su:'Learn to spot and fix the most common sentence mistake.',steps:[
{lb:'The mistake',dr:dQ8,ht:'<p>A common mistake is forgetting the <b>subject</b> or the <b>verb</b>: <b>✗ "Ran to the shop."</b> — who ran?</p>'},
{lb:'The fix',dr:dQ8,ht:'<p><b>✓ "She ran to the shop."</b> Now we know who ran.</p>'},
{lb:'How to check',dr:dQ8,ht:'<p>Always ask: <b>does my sentence make full sense all by itself?</b> If not, something is missing.</p>'},
{lb:'Practice makes perfect',dr:dQ8,ht:'<p>The more you check your own writing this way, the more natural it becomes.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'What is missing from "Ran to the shop"?',o:['A subject — who ran?','A full stop','A capital letter','A question mark'],a:0,w:'"Ran to the shop" is missing a subject telling us who ran.'},{q:'How can "Ran to the shop" be fixed?',o:['By adding a subject, e.g. "She ran to the shop."','By adding more verbs','By removing the full stop','It cannot be fixed'],a:0,w:'Adding a subject, e.g. "She ran to the shop," fixes the sentence.'},{q:'What question should you ask to check a sentence?',o:['Does it make full sense all by itself?','Is it longer than five words?','Does it use a capital letter?','Does it rhyme?'],a:0,w:'Asking whether the sentence makes full sense by itself helps you check it is complete.'},{q:'Which of these is a complete sentence?',o:['"She ran to the shop."','"Ran to the shop."','"To the shop quickly."','"Quickly to the shop."'],a:0,w:'"She ran to the shop" has both a subject and a verb — complete.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Grammar (Year 7)',ti:'Capital Letters and Full Stops',su:'Learn the basic punctuation rules every sentence follows.',steps:[
{lb:'Starting a sentence',dr:dQ9,ht:'<p>Every sentence starts with a <b>capital letter</b>.</p>'},
{lb:'Ending a sentence',dr:dQ9,ht:'<p>Every sentence ends with a <b>full stop (.), question mark (?),</b> or <b>exclamation mark (!)</b></p>'},
{lb:'Names need capitals too',dr:dQ9,ht:'<p>Names of people, places, and days also need capital letters: <b>Lagos, Ada, Monday</b>.</p>'},
{lb:'Checking your work',dr:dQ9,ht:'<p>Always <b>read your writing back</b> before you finish, checking capitals and end punctuation.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'What letter case starts every sentence?',o:['A capital letter','A lowercase letter','No specific rule applies','Only numbers'],a:0,w:'Every sentence starts with a capital letter.'},{q:'Which punctuation marks can end a sentence?',o:['Full stop, question mark, or exclamation mark','Only commas','Only semicolons','Only colons'],a:0,w:'A sentence can end with a full stop, question mark, or exclamation mark.'},{q:'Which of these needs a capital letter?',o:['Lagos (a place name)','the (an ordinary word)','and (a joining word)','ran (an ordinary verb)'],a:0,w:'"Lagos" is a place name and needs a capital letter.'},{q:'What should you do before finishing a piece of writing?',o:['Read it back and check capitals/punctuation','Add as many exclamation marks as possible','Remove all full stops','Make every sentence as long as possible'],a:0,w:'Reading your writing back and checking capitals/punctuation helps catch mistakes.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 &bull; English &bull; Grammar (Year 7)',ti:'Mixed Questions — Sentence Types',su:'Revise statements, questions, commands and exclamations together.',steps:[
{lb:'Four sentence types',dr:dQ10,ht:'<p>We have learned four types: <b>statements</b> (.), <b>questions</b> (?), <b>commands</b> (instructions), and <b>exclamations</b> (!)</p>'},
{lb:'Every sentence needs',dr:dQ10,ht:'<p>Every sentence needs a <b>subject and a verb</b>, a capital letter at the start, and correct end punctuation.</p>'},
{lb:'Joining ideas',dr:dQ10,ht:'<p>Words like <b>and, but, or, so</b> help join two ideas into one longer sentence.</p>'},
{lb:'Mixing lengths',dr:dQ10,ht:'<p>Good writers use a <b>mix of short and long sentences</b> for the best effect.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Which sentence type ends with a question mark?',o:['Question','Statement','Command','Exclamation'],a:0,w:'A question ends with a question mark.'},{q:'Which sentence type gives an instruction?',o:['Command','Statement','Question','Exclamation'],a:0,w:'A command gives an instruction, e.g. "Sit down."'},{q:'Which sentence type shows strong feeling?',o:['Exclamation','Statement','Question','Command'],a:0,w:'An exclamation shows strong feeling, ending with !'},{q:'What does every sentence need?',o:['A subject and a verb','Only a subject','Only a verb','Neither a subject nor a verb'],a:0,w:'Every sentence needs both a subject and a verb.'},{q:'Which word could join two ideas together?',o:['And','Capital','Full stop','Question'],a:0,w:'"And" is a joining word that connects two ideas.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
