<style>
:root{--red:#E65100;--dark:#BF360C;--cream:#FFF3E0;--ink:#2a1a0d;--line:#FFE0B2;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#E65100',DARK='#BF360C',CRM='#FFF3E0',LINE='#FFE0B2';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#2a1a0d';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Active and Passive Sentences',ACC,13,'middle',true));
if(p>=1){o.push(R(10,40,220,50,'#fff',ACC,1.5));o.push(T(120,60,'Active',ACC,11,'middle',true));o.push(T(120,80,'"The dog bit the man."','#555',9,'middle',false));
  o.push(R(250,40,220,50,'#fff',ACC,1.5));o.push(T(360,60,'Passive',ACC,11,'middle',true));o.push(T(360,80,'"The man was bitten."','#555',9,'middle',false));}
if(p>=2){o.push(R(10,102,460,44,CRM,ACC,1));o.push(T(240,120,'Active: the subject DOES the action',DARK,10,'middle',false));o.push(T(240,138,'Passive: the subject HAS something done to it','#555',9,'middle',false));}
if(p>=3){o.push(R(10,156,460,40,'#e8f5e9',ACC,1));o.push(T(240,180,'Both are correct — we choose based on what to emphasise',DARK,10,'middle',false));}
s.innerHTML=o.join('');}

function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Spotting Active Voice',ACC,13,'middle',true));
[['Pattern','Subject + verb + object'],['Example','"The chef cooked the meal."'],['Who acts?','The subject does the action'],['Most common','The everyday way we usually speak/write']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,10,'middle',true));o.push(T(330,56+i*36,r[1],'#444',9,'middle',false));}});
s.innerHTML=o.join('');}

function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Spotting Passive Voice',ACC,13,'middle',true));
if(p>=1){o.push(R(10,40,460,44,CRM,ACC,2));o.push(T(240,60,'The subject has the action done to it',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#fff',ACC,1));o.push(T(240,116,'"The meal was cooked by the chef."',DARK,10,'middle',false));o.push(T(240,134,'The meal is now the subject','#555',9,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,'#e8f5e9',ACC,1));o.push(T(240,176,'Look for "was/is/were" + a past-tense-looking verb','#555',10,'middle',false));}
s.innerHTML=o.join('');}

function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Switching Active to Passive',ACC,12,'middle',true));
[['Step 1','Take the object: "the meal"'],['Step 2','Make it the new subject: "The meal..."'],['Step 3','Add "was" + the past form: "...was cooked..."'],['Step 4','Optionally add "by the chef"']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(115,56+i*36,r[0],ACC,10,'middle',true));o.push(T(330,56+i*36,r[1],'#444',9,'middle',false));}});
s.innerHTML=o.join('');}

function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Why Use Active Voice?',ACC,13,'middle',true));
if(p>=1){o.push(R(10,40,460,44,CRM,ACC,2));o.push(T(240,60,'It is clear and direct',DARK,10,'middle',false));o.push(T(240,80,'We know exactly who did what','#555',9,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#fff',ACC,1));o.push(T(240,116,'It is usually shorter too',DARK,10,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,'#e8f5e9',ACC,1));o.push(T(240,176,'Great for stories and persuasive writing','#555',10,'middle',false));}
s.innerHTML=o.join('');}

function dQ6(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Why Use Passive Voice?',ACC,13,'middle',true));
[['Unknown doer','"My bike was stolen." (we don\'t know who)'],['Doer not important','"The road was built in 1990."'],['Focus on the result','Science: "The liquid was heated."'],['Sounds more formal','Common in reports and news']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(125,56+i*36,r[0],ACC,9,'middle',true));o.push(T(340,56+i*36,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ7(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Passive in Different Tenses',ACC,13,'middle',true));
[['Now','"The cake IS baked."'],['Past','"The cake WAS baked."'],['Will happen','"The cake WILL BE baked."'],['Pattern','"be" (in some form) + past tense verb']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,10,'middle',true));o.push(T(330,56+i*36,r[1],'#444',9,'middle',false));}});
s.innerHTML=o.join('');}

function dQ8(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'A Common Mistake',ACC,13,'middle',true));
if(p>=1){o.push(R(10,40,460,44,'#fde8e8',ACC,2));o.push(T(240,60,'Missing the "be" word',DARK,10,'middle',false));o.push(T(240,80,'✗ "The meal cooked by the chef."','#555',10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#e8f5e9',ACC,1));o.push(T(240,116,'✓ "The meal WAS cooked by the chef."',DARK,10,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,CRM,ACC,1));o.push(T(240,176,'Always check for "was/is/were" in passive sentences','#555',10,'middle',false));}
s.innerHTML=o.join('');}

function dQ9(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Choosing the Right Voice',ACC,12,'middle',true));
[['Stories','Mostly active — keeps the action moving'],['Science reports','Mostly passive — focus on the process'],['Speeches','Active — sounds confident'],['Best writers','Choose on purpose, don\'t just pick one']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,10,'middle',true));o.push(T(330,56+i*36,r[1],'#444',9,'middle',false));}});
s.innerHTML=o.join('');}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Active & Passive — Summary',ACC,13,'middle',true));
[['Active','Subject does the action'],['Passive','Subject has the action done to it'],['Active example','"The dog bit the man."'],['Passive example','"The man was bitten by the dog."'],['Use active for','Clear, direct, story writing'],['Use passive for','Unknown doer, science, formal reports']].forEach(function(r,i){if(i<p+1){o.push(R(10,34+i*33,460,27,CRM,LINE,1));o.push(T(120,52+i*33,r[0],ACC,9,'middle',true));o.push(T(330,52+i*33,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}

var QS=[

{ey:'Q1 &bull; English &bull; Grammar (Year 9)',ti:'Active and Passive Sentences',su:'Learn the two ways to write about an action.',steps:[
{lb:'Two kinds of sentence',dr:dQ1,ht:'<p>Sentences can be written in the <b>active voice</b> or the <b>passive voice</b>.</p>'},
{lb:'Active example',dr:dQ1,ht:'<p><b>"The dog bit the man."</b> The dog (subject) does the biting.</p>'},
{lb:'Passive example',dr:dQ1,ht:'<p><b>"The man was bitten by the dog."</b> The man (subject) has the biting done to him.</p>'},
{lb:'Both are correct',dr:dQ1,ht:'<p>Both voices are grammatically correct — we choose based on <b>what we want to emphasise</b>.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'In the active voice, what does the subject do?',o:['Performs the action','Receives the action','Nothing at all','Becomes a verb'],a:0,w:'In the active voice, the subject performs the action.'},{q:'In the passive voice, what happens to the subject?',o:['It receives the action','It performs the action','It disappears','It becomes a question'],a:0,w:'In the passive voice, the subject receives the action.'},{q:'Which sentence is active?',o:['"The dog bit the man."','"The man was bitten by the dog."','"The man had been bitten."','Neither is active'],a:0,w:'"The dog bit the man" is active — the subject performs the action.'},{q:'Are both active and passive voice grammatically correct?',o:['Yes, both are correct','No, only active is correct','No, only passive is correct','No, neither is correct'],a:0,w:'Both active and passive voice are grammatically correct.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 &bull; English &bull; Grammar (Year 9)',ti:'Spotting Active Voice',su:'Learn to recognise active voice sentences.',steps:[
{lb:'The pattern',dr:dQ2,ht:'<p>Active voice follows: <b>subject + verb + object</b>.</p>'},
{lb:'Example',dr:dQ2,ht:'<p><b>"The chef cooked the meal."</b> The chef (subject) performs the cooking.</p>'},
{lb:'Who acts?',dr:dQ2,ht:'<p>In active voice, the <b>subject</b> always does the action.</p>'},
{lb:'The everyday choice',dr:dQ2,ht:'<p>Active voice is the way we <b>most commonly</b> speak and write.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What is the pattern of an active sentence?',o:['Subject + verb + object','Object + verb + subject','Verb + subject only','Subject + object only'],a:0,w:'Active voice follows: subject + verb + object.'},{q:'In "The chef cooked the meal," who does the cooking?',o:['The chef','The meal','Neither','Both'],a:0,w:'The chef (the subject) performs the action of cooking.'},{q:'Which voice do we most commonly use?',o:['Active voice','Passive voice','Neither is common','They are equally rare'],a:0,w:'Active voice is the way we most commonly speak and write.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 &bull; English &bull; Grammar (Year 9)',ti:'Spotting Passive Voice',su:'Learn to recognise passive voice sentences.',steps:[

{lb:'Example',dr:dQ3,ht:'<p><b>"The meal was cooked by the chef."</b> "The meal" is now the subject.</p>'},
{lb:'How to spot it',dr:dQ3,ht:'<p>Look for <b>"was/is/were"</b> plus a past-tense-looking verb.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'In passive voice, what happens to the subject?',o:['It has the action done to it','It performs the action','It becomes a verb','Nothing changes'],a:0,w:'In passive voice, the subject has the action done to it.'},{q:'In "The meal was cooked by the chef," what is the new subject?',o:['The meal','The chef','Cooked','By'],a:0,w:'"The meal" is now the subject in this passive sentence.'},{q:'What should you look for to spot passive voice?',o:['"Was/is/were" + a past-tense-looking verb','A question mark','A capital letter','A comma'],a:0,w:'Look for a form of "be" (was/is/were) plus a past-tense-looking verb.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 &bull; English &bull; Grammar (Year 9)',ti:'Switching Active to Passive',su:'Learn the four steps to convert active sentences to passive.',steps:[
{lb:'Step 1',dr:dQ4,ht:'<p>Take the <b>object</b> of the active sentence: "the meal."</p>'},
{lb:'Step 2',dr:dQ4,ht:'<p>Make it the <b>new subject</b>: "The meal..."</p>'},
{lb:'Step 3',dr:dQ4,ht:'<p>Add <b>"was"</b> plus the past form of the verb: "...was cooked..."</p>'},
{lb:'Step 4',dr:dQ4,ht:'<p>Optionally add <b>"by the chef"</b> at the end.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What is taken in step 1?',o:['The object of the active sentence','The subject of the active sentence','The verb only','Nothing is taken'],a:0,w:'Step 1 takes the object of the active sentence.'},{q:'What happens to the object in step 2?',o:['It becomes the new subject','It is deleted','It becomes a verb','It stays the same'],a:0,w:'In step 2, the object becomes the new subject.'},{q:'What is added in step 3?',o:['"Was" + the past form of the verb','A question mark','A comma','Nothing is added'],a:0,w:'Step 3 adds "was" plus the past form of the verb.'},{q:'Convert "The chef cooked the meal" to passive — which is correct?',o:['"The meal was cooked by the chef."','"The meal cooked the chef."','"Cooked the meal was chef."','"The chef was cooked."'],a:0,w:'"The meal was cooked by the chef" correctly follows all the steps.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 &bull; English &bull; Grammar (Year 9)',ti:'Why Use Active Voice?',su:'Understand the benefits of choosing active voice.',steps:[
{lb:'Clear and direct',dr:dQ5,ht:'<p>Active voice is <b>clear and direct</b> — we know exactly who did what.</p>'},
{lb:'Usually shorter',dr:dQ5,ht:'<p>Active sentences are usually <b>shorter</b> than the passive version.</p>'},
{lb:'Great for stories',dr:dQ5,ht:'<p>Active voice is great for <b>stories and persuasive writing</b>.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What quality does active voice have?',o:['It is clear and direct','It is always vague','It hides who did what','It is always longer'],a:0,w:'Active voice is clear and direct.'},{q:'Is active voice usually shorter or longer than passive?',o:['Usually shorter','Always longer','Exactly the same length','It has no fixed length'],a:0,w:'Active voice is usually shorter than the passive equivalent.'},{q:'Which writing types suit active voice well?',o:['Stories and persuasive writing','Only maths homework','Only shopping lists','Only weather reports'],a:0,w:'Active voice suits stories and persuasive writing well.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar (Year 9)',ti:'Why Use Passive Voice?',su:'Understand when passive voice is the better choice.',steps:[
{lb:'Unknown doer',dr:dQ6,ht:'<p>Use passive when we don\'t know who did it: <b>"My bike was stolen."</b></p>'},
{lb:'Doer not important',dr:dQ6,ht:'<p>Use passive when the doer isn\'t important: <b>"The road was built in 1990."</b></p>'},
{lb:'Focus on the result',dr:dQ6,ht:'<p>Science writing often uses passive to focus on the <b>result</b>: "The liquid was heated."</p>'},
{lb:'Sounds more formal',dr:dQ6,ht:'<p>Passive voice is common in <b>reports and news</b>, and can sound more formal.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'When might we use passive voice about the doer?',o:['When the doer is unknown or unimportant','Only when the doer is famous','Only in questions','Never — active is always better'],a:0,w:'Passive voice is useful when the doer is unknown or unimportant.'},{q:'Why might "My bike was stolen" use passive voice?',o:['The thief is unknown','The bike did the stealing','It must always be passive','There is no reason at all'],a:0,w:'"My bike was stolen" uses passive because the thief (doer) is unknown.'},{q:'Where is passive voice especially common?',o:['Science reports and news','Text messages to friends','Song lyrics only','Comic books only'],a:0,w:'Passive voice is especially common in science reports and news.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Grammar (Year 9)',ti:'Passive in Different Tenses',su:'See how passive voice changes across different times.',steps:[
{lb:'Now (present)',dr:dQ7,ht:'<p><b>"The cake IS baked."</b> — present tense passive.</p>'},
{lb:'Already happened (past)',dr:dQ7,ht:'<p><b>"The cake WAS baked."</b> — past tense passive.</p>'},
{lb:'Will happen (future)',dr:dQ7,ht:'<p><b>"The cake WILL BE baked."</b> — future tense passive.</p>'},
{lb:'The pattern',dr:dQ7,ht:'<p>The pattern is always: some form of <b>"be"</b> plus the past-tense-looking form of the verb.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What is the present passive of "bake"?',o:['"Is baked"','"Was baked"','"Will be baked"','"Baking"'],a:0,w:'The present passive is "is baked."'},{q:'What is the past passive of "bake"?',o:['"Was baked"','"Is baked"','"Will be baked"','"Bakes"'],a:0,w:'The past passive is "was baked."'},{q:'What is the future passive of "bake"?',o:['"Will be baked"','"Was baked"','"Is baked"','"Baked"'],a:0,w:'The future passive is "will be baked."'},{q:'What is the general pattern across all passive tenses?',o:['A form of "be" + past-tense-looking verb','A form of "have" + base verb','No pattern applies','Only the word "by" is needed'],a:0,w:'The general pattern is a form of "be" plus the past-tense-looking form of the verb.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Grammar (Year 9)',ti:'A Common Mistake',su:'Learn to spot and fix a frequent passive voice error.',steps:[
{lb:'The mistake',dr:dQ8,ht:'<p>Missing the <b>"be"</b> word: <b>✗ "The meal cooked by the chef."</b></p>'},
{lb:'The fix',dr:dQ8,ht:'<p><b>✓ "The meal WAS cooked by the chef."</b></p>'},
{lb:'How to check',dr:dQ8,ht:'<p>Always check for <b>"was/is/were"</b> in passive sentences.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'What is wrong with "The meal cooked by the chef"?',o:['It is missing the "be" word ("was")','It has too many words','It has no subject','Nothing is wrong'],a:0,w:'This sentence is missing "was," needed for correct passive voice.'},{q:'How is this mistake fixed?',o:['Adding "was": "The meal WAS cooked by the chef."','Removing "the chef"','Adding a question mark','It cannot be fixed'],a:0,w:'Adding "was" fixes the sentence: "The meal was cooked by the chef."'},{q:'What should you always check for in passive sentences?',o:['"Was/is/were"','A question mark','A comma','A capital letter'],a:0,w:'Always check for a form of "be" (was/is/were) in passive sentences.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Grammar (Year 9)',ti:'Choosing the Right Voice',su:'Learn when to choose active or passive voice on purpose.',steps:[
{lb:'Stories',dr:dQ9,ht:'<p><b>Stories</b> mostly use active voice — it keeps the action moving.</p>'},
{lb:'Science reports',dr:dQ9,ht:'<p><b>Science reports</b> mostly use passive voice, to focus on the process.</p>'},
{lb:'Speeches',dr:dQ9,ht:'<p><b>Speeches</b> often use active voice — it sounds confident.</p>'},
{lb:'The best writers',dr:dQ9,ht:'<p>The best writers <b>choose on purpose</b> — they don\'t just pick one voice by accident.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'Which voice do stories mostly use?',o:['Active voice','Passive voice','Neither','Both equally, at random'],a:0,w:'Stories mostly use active voice to keep the action moving.'},{q:'Which voice do science reports mostly use?',o:['Passive voice','Active voice','Neither','Only questions'],a:0,w:'Science reports mostly use passive voice to focus on the process.'},{q:'What do the best writers do when choosing voice?',o:['Choose on purpose, not by accident','Only ever use passive voice','Only ever use active voice','Avoid using verbs entirely'],a:0,w:'The best writers choose their voice on purpose, rather than by accident.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 &bull; English &bull; Grammar (Year 9)',ti:'Mixed Questions — Active & Passive Voice',su:'Revise recognising, converting, and choosing between active and passive voice.',steps:[
{lb:'The core idea',dr:dQ10,ht:'<p><b>Active:</b> the subject does the action. <b>Passive:</b> the subject has the action done to it.</p>'},
{lb:'Conversion recap',dr:dQ10,ht:'<p>Take the <b>object</b>, make it the subject, add <b>"was"</b> + the past form, and optionally add "by..."</p>'},
{lb:'When to use each',dr:dQ10,ht:'<p>Use <b>active</b> for clear, direct stories. Use <b>passive</b> when the doer is unknown or for science/formal reports.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'In active voice, who does the action?',o:['The subject','The object','The verb','Nobody'],a:0,w:'In active voice, the subject does the action.'},{q:'"The man was bitten by the dog" — what voice is this?',o:['Passive voice','Active voice','Neither voice','Both at once'],a:0,w:'This is passive — the subject (man) receives the action.'},{q:'What should you check for in a passive sentence?',o:['"Was/is/were"','A question mark','A capital letter only','Nothing special'],a:0,w:'Check for a form of "be" (was/is/were) in a passive sentence.'},{q:'When is passive voice most useful?',o:['When the doer is unknown or unimportant','Only in stories','Only in speeches','Never'],a:0,w:'Passive voice is most useful when the doer is unknown or unimportant.'},{q:'Which voice is usually best for stories?',o:['Active voice','Passive voice','Neither matters','Only passive is allowed'],a:0,w:'Active voice is usually best for stories, keeping the action moving.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
