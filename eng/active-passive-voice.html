.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}

.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}

.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}

<script>
var ACC='#E65100',DARK='#BF360C',CRM='#FFF3E0',LINE='#FFE0B2';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}

  o.push(R(250,38,220,50,'#fff',ACC,1.5));o.push(T(360,56,'Passive',ACC,10,'middle',true));o.push(T(360,74,'"The man was bitten..."','#555',8,'middle',false));o.push(T(360,90,'subject RECEIVES the action','#888',7,'middle',false));}

function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Why Use Active Voice?',ACC,13,'middle',true));
[['Clarity','Immediately clear who did what'],['Conciseness','Usually shorter than the passive equivalent'],['Directness','Feels confident and engaging to read'],['Default choice','Preferred in narrative & most essay writing'],['Exam tip','Examiners often reward clear active-voice prose']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});

function dQ6(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Why Use Passive Voice?',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,1.5));o.push(T(240,56,'When the doer is unknown',DARK,10,'middle',false));o.push(T(240,74,'"My phone was stolen." (thief unknown)','#555',9,'middle',false));}

[['Narrative writing','Mostly active — keeps pace and clarity'],['Scientific reports','Mostly passive — focus on process, not person'],['Persuasive writing','Active — feels confident and direct'],['News reports','Mix — passive when the doer is unknown'],['Exam tip','Vary deliberately, don\\u2019t default to one voice only']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(125,46+i*32,r[0],ACC,8,'middle',true));o.push(T(340,46+i*32,r[1],'#444',7,'middle',false));}});

{lb:'Who is responsible?',dr:dQ2,ht:'<p>Active voice makes it immediately clear <b>who is responsible</b> for the action — there is no ambiguity about the doer.</p>'},
{lb:'The default in English',dr:dQ2,ht:'<p>Active voice is the <b>most common, most natural</b> voice in everyday English speech and writing.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What is the basic structure of an active-voice sentence?',o:['Subject + verb + object','Object + verb + subject','Verb + subject only','Subject + preposition + object'],a:0,w:'Active voice follows the pattern subject + verb + object.'},{q:'In "The chef cooked the meal," who performs the action?',o:['The chef','The meal','Neither','Both equally'],a:0,w:'The chef (the subject) performs the action of cooking.'},{q:'What does active voice make immediately clear?',o:['Who is responsible for the action','The exact time of day','The weather conditions','The location of the action'],a:0,w:'Active voice makes it immediately clear who is responsible for the action.'},{q:'Which voice is the most common and natural in everyday English?',o:['Active voice','Passive voice','Neither is more common','They are equally rare'],a:0,w:'Active voice is the most common, most natural voice in everyday English.'},{q:'Which of these is in the active voice?',o:['"The teacher marked the exams."','"The exams were marked."','"The exams had been marked."','"Marking was completed."'],a:0,w:'"The teacher marked the exams" has the subject (teacher) performing the action — active voice.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 &bull; English &bull; Grammar',ti:'Recognising Passive Voice',su:'Identify sentences where the subject receives the action.',steps:[
{lb:'Structure',dr:dQ3,ht:'<p>Passive voice follows the pattern: <b>object + "be" verb + past participle</b> (+ optional "by..." to name the doer).</p>'},
{lb:'Example',dr:dQ3,ht:'<p><b>"The meal was cooked by the chef."</b> Here, "the meal" (originally the object) becomes the new subject.</p>'},
{lb:'The doer can be dropped',dr:dQ3,ht:'<p>The "by..." phrase naming the doer is <b>optional</b> and can be dropped entirely: <b>"The meal was cooked."</b></p>'},
{lb:'When it is useful',dr:dQ3,ht:'<p>Passive voice is especially useful when the doer is <b>unknown or unimportant</b> — common in scientific and formal report writing, e.g. "The data was collected."</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'What is the basic structure of a passive-voice sentence?',o:['Object (as new subject) + "be" verb + past participle','Subject + verb + object','Verb + object only','Preposition + subject + verb'],a:0,w:'Passive voice follows: object (as new subject) + "be" verb + past participle.'},{q:'In "The meal was cooked by the chef," what was originally the object?',o:['"The meal"','"The chef"','"Was cooked"','"By"'],a:0,w:'"The meal" was originally the object in the active version, now the subject in the passive.'},{q:'Is the "by..." phrase required in a passive sentence?',o:['No, it is optional and can be dropped','Yes, it is always required','Yes, unless the sentence is a question','No sentence can ever drop it'],a:0,w:'The "by..." phrase naming the doer is optional and can be dropped, e.g. "The meal was cooked."'},{q:'When is passive voice especially useful?',o:['When the doer is unknown or unimportant','Only when writing poetry','Only in spoken English','Never — it should always be avoided'],a:0,w:'Passive voice is especially useful when the doer is unknown or unimportant.'},{q:'Which of these is in the passive voice?',o:['"The data was collected."','"The scientists collected the data."','"The scientists collect data."','"The scientists will collect data."'],a:0,w:'"The data was collected" has the subject (data) receiving the action — passive voice.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 &bull; English &bull; Grammar',ti:'Converting Active to Passive',su:'Apply a step-by-step method to rewrite active sentences in the passive voice.',steps:[
{lb:'Step 1: find the object',dr:dQ4,ht:'<p>Take the <b>object</b> of the active sentence: in "The chef cooked <b>the meal</b>," the object is "the meal."</p>'},
{lb:'Step 2: make it the new subject',dr:dQ4,ht:'<p>Move that object to the <b>front</b> of the sentence, making it the new subject: <b>"The meal..."</b></p>'},
{lb:'Step 3: add "be" + past participle',dr:dQ4,ht:'<p>Add the correct form of <b>"be"</b> plus the <b>past participle</b> of the verb: <b>"The meal was cooked..."</b></p>'},
{lb:'Step 4 (optional): add the original subject',dr:dQ4,ht:'<p>Optionally, add <b>"by" + the original subject</b> at the end: <b>"The meal was cooked by the chef."</b></p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What is the first step in converting active to passive?',o:['Take the object of the active sentence','Delete the verb entirely','Add a semicolon','Change the subject\\u2019s name'],a:0,w:'The first step is to take the object of the active sentence.'},{q:'What happens to the object in step 2?',o:['It becomes the new subject','It disappears from the sentence','It becomes a preposition','It becomes an adjective'],a:0,w:'In step 2, the object becomes the new subject of the passive sentence.'},{q:'What is added in step 3?',o:['A form of "be" + the past participle','A form of "have" + the base verb','A subordinating conjunction','A comma and semicolon'],a:0,w:'Step 3 adds a form of "be" plus the past participle of the verb.'},{q:'What is optionally added in step 4?',o:['"By" + the original subject','A new object','A question mark','A relative pronoun'],a:0,w:'Step 4 optionally adds "by" plus the original subject, naming the doer.'},{q:'Convert "The chef cooked the meal" fully to passive — which is correct?',o:['"The meal was cooked by the chef."','"The meal cooked the chef."','"The chef was cooked by the meal."','"Cooked was the meal chef."'],a:0,w:'"The meal was cooked by the chef" correctly follows all four conversion steps.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 &bull; English &bull; Grammar',ti:'Why Use Active Voice?',su:'Understand the stylistic benefits of active voice in writing.',steps:[
{lb:'Clarity',dr:dQ5,ht:'<p>Active voice makes it <b>immediately clear</b> who did what, reducing ambiguity for the reader.</p>'},
{lb:'Conciseness',dr:dQ5,ht:'<p>Active-voice sentences are usually <b>shorter</b> than their passive equivalents, since no extra "be" verb or "by" phrase is required.</p>'},
{lb:'Directness',dr:dQ5,ht:'<p>Active voice feels <b>confident and engaging</b> — a strong choice for narrative, persuasive, and most essay writing.</p>'},
{lb:'Exam reward',dr:dQ5,ht:'<p>Examiners often reward <b>clear, active-voice prose</b>, especially in narrative and persuasive writing tasks.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What does active voice make immediately clear?',o:['Who did what','The exact date of an event','The reader\\u2019s opinion','The colour of an object'],a:0,w:'Active voice makes it immediately clear who did what.'},{q:'Why is active voice usually more concise than passive?',o:['It does not need an extra "be" verb or "by" phrase','It always uses fewer nouns','It never uses adjectives','It avoids using verbs entirely'],a:0,w:'Active voice is usually shorter since it does not need an extra "be" verb or "by" phrase.'},{q:'What quality does active voice give to writing?',o:['Confidence and directness','Vagueness and distance','Excessive formality only','Complete ambiguity'],a:0,w:'Active voice feels confident and direct, engaging the reader.'},{q:'In which writing types is active voice usually preferred?',o:['Narrative, persuasive and most essay writing','Only legal contracts','Only scientific lab reports','Only historical documents'],a:0,w:'Active voice is usually preferred in narrative, persuasive and most essay writing.'},{q:'What do examiners often reward regarding voice?',o:['Clear, active-voice prose','Exclusively passive-voice prose','Random mixing with no purpose','Avoiding all verbs'],a:0,w:'Examiners often reward clear, deliberate use of active-voice prose.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar',ti:'Why Use Passive Voice?',su:'Understand the legitimate reasons for choosing the passive voice.',steps:[
{lb:'When the doer is unknown',dr:dQ6,ht:'<p>Use passive when the doer is <b>unknown</b>: <b>"My phone was stolen."</b> (we don\\u2019t know who the thief was).</p>'},
{lb:'When the doer is unimportant',dr:dQ6,ht:'<p>Use passive when the doer is <b>unimportant or obvious</b>: <b>"The bridge was built in 1990."</b> (naming the builder isn\\u2019t the point).</p>'},
{lb:'To emphasise the action or result',dr:dQ6,ht:'<p>Passive voice shifts focus onto the <b>action or result</b> rather than the doer — common in scientific and formal report writing.</p>'},
{lb:'To avoid blame or sound diplomatic',dr:dQ6,ht:'<p>Passive voice can be used deliberately to <b>avoid assigning blame</b>: <b>"Mistakes were made."</b> avoids naming who made them.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'When is passive voice useful regarding the doer?',o:['When the doer is unknown, unimportant, or obvious','Only when the doer is famous','Only when the doer is the writer','Never — the doer must always be named'],a:0,w:'Passive voice is useful when the doer is unknown, unimportant, or obvious.'},{q:'Why might "My phone was stolen" use the passive voice?',o:['The thief (doer) is unknown','The phone did the stealing','It is grammatically required for all crimes','It avoids using any verb'],a:0,w:'"My phone was stolen" uses passive because the thief (doer) is unknown.'},{q:'What does passive voice shift the focus onto?',o:['The action or result, rather than the doer','Only the time of day','Only the location','Only the reader\\u2019s feelings'],a:0,w:'Passive voice shifts focus onto the action or result rather than the doer.'},{q:'Where is passive voice especially common?',o:['Scientific and formal report writing','Casual text messages only','Song lyrics only','Children\\u2019s picture books only'],a:0,w:'Passive voice is especially common in scientific and formal report writing.'},{q:'What can passive voice help a writer avoid?',o:['Assigning blame to a specific person','Using any punctuation','Writing in the past tense','Using nouns at all'],a:0,w:'Passive voice can help a writer avoid assigning blame, e.g. "Mistakes were made."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Grammar',ti:'Passive Voice Across Tenses',su:'Form the passive voice correctly in different tenses.',steps:[
{lb:'Present simple passive',dr:dQ7,ht:'<p><b>Present simple:</b> "The cake <b>is baked</b>." — uses "is/are" + past participle.</p>'},
{lb:'Past simple passive',dr:dQ7,ht:'<p><b>Past simple:</b> "The cake <b>was baked</b>." — uses "was/were" + past participle.</p>'},
{lb:'Present perfect passive',dr:dQ7,ht:'<p><b>Present perfect:</b> "The cake <b>has been baked</b>." — uses "has/have been" + past participle.</p>'},
{lb:'Future passive',dr:dQ7,ht:'<p><b>Future:</b> "The cake <b>will be baked</b>." — uses "will be" + past participle. The pattern is always: form of "be" + past participle.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What is the present simple passive of "bake"?',o:['"Is baked"','"Was baked"','"Has been baked"','"Will be baked"'],a:0,w:'The present simple passive uses "is/are" + past participle: "is baked."'},{q:'What is the past simple passive of "bake"?',o:['"Was baked"','"Is baked"','"Will be baked"','"Baking"'],a:0,w:'The past simple passive uses "was/were" + past participle: "was baked."'},{q:'What is the present perfect passive of "bake"?',o:['"Has been baked"','"Is baked"','"Was baked"','"Bakes"'],a:0,w:'The present perfect passive uses "has/have been" + past participle: "has been baked."'},{q:'What is the future passive of "bake"?',o:['"Will be baked"','"Was being baked"','"Has baked"','"Bakes"'],a:0,w:'The future passive uses "will be" + past participle: "will be baked."'},{q:'What pattern applies across all passive tenses?',o:['A form of "be" + a past participle','A form of "have" + a base verb','A subordinating conjunction + a verb','No pattern applies at all'],a:0,w:'Across all tenses, the passive voice follows the pattern: form of "be" + past participle.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Grammar',ti:'Common Passive Voice Errors',su:'Identify and correct common mistakes with the passive voice.',steps:[
{lb:'Overuse creates vague writing',dr:dQ8,ht:'<p>Overusing the passive voice creates <b>vague, wordy, indirect</b> writing, and can weaken narrative pace if used too often.</p>'},
{lb:'Missing "be" verb',dr:dQ8,ht:'<p>A common error is dropping the "be" verb: <b>✗ "The meal cooked by the chef."</b> should be <b>✓ "The meal WAS cooked by the chef."</b></p>'},
{lb:'How to fix these errors',dr:dQ8,ht:'<p>Fix by identifying the doer and checking whether active voice would be clearer, or by adding the missing "be" verb.</p>'},
{lb:'Balance, not avoidance',dr:dQ8,ht:'<p>Good writers deliberately <b>balance both voices</b> — passive is not inherently "bad," it is about choosing the appropriate voice for the purpose.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'What does overusing the passive voice create?',o:['Vague, wordy, indirect writing','Perfectly clear writing every time','Shorter sentences overall','Better exam grades automatically'],a:0,w:'Overusing the passive voice creates vague, wordy, indirect writing.'},{q:'Which of these is a common passive-voice error?',o:['"The meal cooked by the chef." (missing "was")','"The meal was cooked by the chef."','"The chef cooked the meal."','"The chef is cooking the meal."'],a:0,w:'"The meal cooked by the chef" is missing the "be" verb ("was") needed for correct passive voice.'},{q:'How can a missing-"be"-verb passive error be fixed?',o:['Adding the correct form of "be," e.g. "was"','Removing the verb entirely','Adding more commas','Changing the subject to a pronoun'],a:0,w:'The error is fixed by adding the correct form of "be," e.g. "was cooked."'},{q:'Is passive voice inherently "bad" writing?',o:['No — it is about choosing the appropriate voice for the purpose','Yes, it should never be used','Yes, only beginners use it','No, active voice should never be used instead'],a:0,w:'Passive voice is not inherently bad; good writers balance both voices for the right purpose.'},{q:'What can excessive passive voice weaken in narrative writing?',o:['The pace of the writing','The spelling accuracy','The paragraph count','The title of the story'],a:0,w:'Excessive passive voice can weaken the pace of narrative writing.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Grammar',ti:'Active/Passive in Exam Writing',su:'Choose the right voice deliberately for different writing forms.',steps:[
{lb:'Narrative writing',dr:dQ9,ht:'<p><b>Narrative writing</b> mostly uses active voice — it keeps the pace moving and events clear.</p>'},
{lb:'Scientific reports',dr:dQ9,ht:'<p><b>Scientific/formal reports</b> mostly use passive voice — the focus is on the process or result, not who performed it.</p>'},
{lb:'Persuasive and news writing',dr:dQ9,ht:'<p><b>Persuasive writing</b> favours active voice for confidence and directness. <b>News reports</b> often mix both, using passive when the doer is unknown.</p>'},
{lb:'The exam tip',dr:dQ9,ht:'<p>Vary voice <b>deliberately</b> according to purpose — don\\u2019t default to only one voice throughout an entire piece.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'Which voice does narrative writing mostly use?',o:['Active voice, to keep pace and clarity','Passive voice exclusively','Neither voice is used in narrative','Only the future tense'],a:0,w:'Narrative writing mostly uses active voice to keep the pace moving and events clear.'},{q:'Which voice do scientific/formal reports mostly use?',o:['Passive voice, focusing on process not person','Active voice exclusively','Neither voice — only questions','Only the imperative mood'],a:0,w:'Scientific and formal reports mostly use passive voice, focusing on process rather than person.'},{q:'Why might news reports use the passive voice?',o:['When the doer of an action is unknown','To make the article longer','To avoid using any verbs','Because active voice is banned in journalism'],a:0,w:'News reports often use passive voice when the doer of an action is unknown.'},{q:'What is the overall exam tip for choosing voice?',o:['Vary voice deliberately according to purpose','Always use active voice, with no exceptions','Always use passive voice, with no exceptions','Avoid using any verbs where possible'],a:0,w:'The exam tip is to vary voice deliberately according to purpose, not default to one voice only.'},{q:'Which writing type favours active voice for confidence?',o:['Persuasive writing','Formal scientific reports','Legal documents only','None of these'],a:0,w:'Persuasive writing favours active voice, which feels confident and direct.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 &bull; English &bull; Grammar',ti:'Mixed Questions — Active & Passive Voice',su:'Integrated revision across recognition, conversion, and stylistic choice.',steps:[
{lb:'The core distinction',dr:dQ10,ht:'<p><b>Active:</b> subject performs the verb. <b>Passive:</b> subject receives the verb, using "be" + past participle.</p>'},
{lb:'Conversion recap',dr:dQ10,ht:'<p>To convert active to passive: take the <b>object</b>, make it the new subject, add <b>"be" + past participle</b>, optionally add "by + original subject."</p>'},
{lb:'When to use each',dr:dQ10,ht:'<p><b>Active</b> for clarity, pace and directness. <b>Passive</b> when the doer is unknown/unimportant, or for formal/scientific tone.</p>'},
{lb:'Exam tip, restated',dr:dQ10,ht:'<p>Choose voice <b>deliberately</b> for purpose — don\\u2019t overuse either voice throughout a whole piece of writing.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'In the active voice, who performs the action?',o:['The subject','The object','The verb','The article'],a:0,w:'In the active voice, the subject performs the action.'},{q:'How is the passive voice formed?',o:['A form of "be" + a past participle','A form of "do" + the base verb','A subordinating conjunction alone','Only by adding "-ing"'],a:0,w:'The passive voice is formed using a form of "be" plus a past participle.'},{q:'"The report was written by the team." — what voice is this?',o:['Passive voice','Active voice','Neither voice','Both voices at once'],a:0,w:'The subject ("the report") receives the action here — passive voice.'},{q:'When is passive voice most useful?',o:['When the doer is unknown or unimportant','Only in poetry','Only when writing a letter','Never — it should always be avoided'],a:0,w:'Passive voice is most useful when the doer is unknown or unimportant.'},{q:'What is the first step in converting active to passive?',o:['Take the object of the active sentence','Delete the subject','Add a semicolon','Change the tense to future'],a:0,w:'The first step in conversion is to take the object of the active sentence.'},{q:'Which voice is usually preferred in narrative writing?',o:['Active voice','Passive voice','Neither voice matters in narrative','Only the passive voice is grammatical'],a:0,w:'Active voice is usually preferred in narrative writing for pace and clarity.'},{q:'What error occurs in "The meal cooked by the chef"?',o:['A missing "be" verb ("was")','A missing object','A missing subject','A missing conjunction'],a:0,w:'This sentence is missing the "be" verb needed for correct passive voice: "was cooked."'},{q:'What is the overall lesson about choosing active vs passive voice?',o:['Choose deliberately for purpose, rather than overusing either','Always use active voice only','Always use passive voice only','Voice choice never affects meaning'],a:0,w:'The overall lesson is to choose voice deliberately for purpose, rather than overusing either voice.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
