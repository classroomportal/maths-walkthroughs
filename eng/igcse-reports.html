<style>
:root{--red:#E65100;--dark:#BF360C;--cream:#FFF3E0;--ink:#2a1a0d;--line:#FFE0B2;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#E65100',DARK='#BF360C',CRM='#FFF3E0',LINE='#FFE0B2';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#2a1a0d';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Reports at IGCSE Level',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'Formal, structured, factual account for a specific purpose',DARK,10,'middle',false));o.push(T(240,74,'Usually commissioned to inform a decision or action','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,'#fff',ACC,1));o.push(T(240,110,'IGCSE rewards clear organisation AND objective, formal register',DARK,9,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,'#e8f5e9',ACC,1));o.push(T(240,170,'Unlike narrative/descriptive - clarity beats creativity here','#555',9,'middle',false));}
s.innerHTML=o.join('');}

function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Standard Report Structure',ACC,13,'middle',true));
[['Title/heading','States exactly what is being reported on'],['Introduction','Purpose, scope, and method of the report'],['Main findings','Organised under clear subheadings'],['Conclusion & recommendations','Summary + suggested actions/next steps']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,9,'middle',true));o.push(T(330,56+i*36,r[1],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}

o.push(T(240,20,'Subheadings for Navigation',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'Subheadings let a busy reader find what they need FAST',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,'#fff',ACC,1));o.push(T(240,110,'"Findings", "Analysis", "Recommendations" - clear labels',DARK,10,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,'#e8f5e9',ACC,1));o.push(T(240,170,'Bold, consistent formatting throughout the whole report','#555',9,'middle',false));}
s.innerHTML=o.join('');}

function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Formal, Impersonal Register',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,'#fde8e8',ACC,2));o.push(T(240,56,'✗ "I think the cafeteria food is bad."',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,'#e8f5e9',ACC,1));o.push(T(240,110,'✓ "Student feedback indicates dissatisfaction with cafeteria food."',DARK,9,'middle',false));}

function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Presenting Data Clearly',ACC,13,'middle',true));
[['Precise figures','Exact numbers, not vague amounts'],['Comparative language','"Increased by 15%" not just "went up"'],['Bullet points','Good for lists of separate findings'],['Full sentences','Better for explaining WHY something happened']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,9,'middle',true));o.push(T(330,56+i*36,r[1],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}

function dQ6(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Recommendations Must Follow Findings',ACC,12,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'Every recommendation should be JUSTIFIED by evidence given',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,'#fff',ACC,1));o.push(T(240,110,'"Since 60% reported dissatisfaction, we recommend a menu review."',DARK,9,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,'#e8f5e9',ACC,1));o.push(T(240,170,'Never introduce a recommendation with no supporting finding','#555',9,'middle',false));}
s.innerHTML=o.join('');}

function dQ7(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Balanced, Evidence-Based Tone',ACC,12,'middle',true));
[['Avoid emotive language','Reports inform decisions, not stir feelings'],['Present multiple angles','If evidence conflicts, present both sides'],['Hedge appropriately','"This may suggest..." for less certain conclusions'],['State certainty clearly','"Data clearly shows..." for well-supported claims']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(130,56+i*36,r[0],ACC,9,'middle',true));o.push(T(340,56+i*36,r[1],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}

function dQ8(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'A Common Mistake',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,'#fde8e8',ACC,2));o.push(T(240,56,'Writing a report like a narrative or diary entry',DARK,10,'middle',false));o.push(T(240,74,'"So then we looked at the cafeteria and it was quite bad..."','#555',8,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,'#e8f5e9',ACC,1));o.push(T(240,110,'✓ "The cafeteria was assessed against three criteria..."',DARK,9,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,CRM,ACC,1));o.push(T(240,170,'Reports inform systematically - they do not tell a story','#555',9,'middle',false));}
s.innerHTML=o.join('');}

function dQ9(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Why Report Precision Matters',ACC,12,'middle',true));
[['Real workplace skill','Used constantly in business, science, and government'],['Distinct assessed genre','Tests objective, structured writing specifically'],['Decision-making tool','Real reports genuinely influence real decisions'],['Clarity under scrutiny','Poor structure in a report has real consequences']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(125,56+i*36,r[0],ACC,9,'middle',true));o.push(T(340,56+i*36,r[1],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Reports Summary',ACC,13,'middle',true));
[['Structure','Title, introduction, findings, conclusion/recommendations'],['Subheadings','Let readers navigate quickly to what they need'],['Register','Formal, impersonal - avoid "I think"'],['Data presentation','Precise figures; bullets for lists, sentences for explanation'],['Recommendations','Must be justified by the findings given']].forEach(function(r,i){if(i<p+1){o.push(R(10,32+i*30,460,25,CRM,LINE,1));o.push(T(130,49+i*30,r[0],ACC,9,'middle',true));o.push(T(350,49+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}

{lb:'Comparative language',dr:dQ5,ht:'<p><b>"Increased by 15%"</b> not just "went up."</p>'},
{lb:'Bullet points vs full sentences',dr:dQ5,ht:'<p><b>Bullet points</b> are good for lists of separate findings. <b>Full sentences</b> are better for explaining WHY something happened.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What kind of figures should a report use?',o:['Precise, exact numbers','Vague, approximate amounts','No numbers at all','Only rounded estimates'],a:0,w:'A report should use precise, exact numbers, not vague amounts.'},{q:'Which is more precise comparative language?',o:['"Increased by 15%"','"Went up a bit"','"Got bigger"','"Changed somewhat"'],a:0,w:'"Increased by 15%" is precise comparative language, unlike vague phrases.'},{q:'When are bullet points especially useful in a report?',o:['For lists of separate findings','For explaining why something happened','For the introduction only','Never in a formal report'],a:0,w:'Bullet points are especially useful for lists of separate findings.'},{q:'When are full sentences better than bullet points?',o:['For explaining why something happened','For every single fact in the report','Never — bullet points are always better','Only in the title'],a:0,w:'Full sentences are better for explaining why something happened, requiring more connected reasoning.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q6 &bull; English &bull; Writing (IGCSE)',ti:'Recommendations Must Follow Findings',su:'Learn that every recommendation needs to be justified by evidence.',steps:[

{lb:'Example',dr:dQ6,ht:'<p><b>"Since 60% reported dissatisfaction, we recommend a menu review."</b></p>'},
{lb:'The rule',dr:dQ6,ht:'<p>Never introduce a recommendation with <b>no supporting finding</b>.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What must every recommendation in a report be?',o:['Justified by evidence given earlier','Based only on personal opinion','Completely unrelated to the findings','As dramatic as possible'],a:0,w:'Every recommendation must be justified by evidence given earlier in the report.'},{q:'Which of these correctly links a finding to a recommendation?',o:['"Since 60% reported dissatisfaction, we recommend a menu review."','"We recommend a menu review."','"The cafeteria needs to change."','"Everyone agrees something must be done."'],a:0,w:'This example explicitly links the finding (60% dissatisfaction) to the recommendation.'},{q:'What should you never do with a recommendation?',o:['Introduce it with no supporting finding','Justify it with evidence','Link it to the report\\u2019s findings','Place it in the conclusion'],a:0,w:'Never introduce a recommendation with no supporting finding from earlier in the report.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Writing (IGCSE)',ti:'Balanced, Evidence-Based Tone',su:'Learn to write with appropriate certainty and balance.',steps:[

{lb:'Hedging appropriately',dr:dQ7,ht:'<p>Use <b>"This may suggest..."</b> for less certain conclusions.</p>'},

{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What should reports avoid using?',o:['Emotive language','Precise figures','Clear subheadings','Justified recommendations'],a:0,w:'Reports should avoid emotive language, since they aim to inform decisions objectively.'},{q:'What should you do if evidence conflicts?',o:['Present both sides fairly','Only report the side you prefer','Ignore the conflicting evidence','Remove all evidence entirely'],a:0,w:'If evidence conflicts, present both sides fairly in the report.'},{q:'Which phrase suits a less certain conclusion?',o:['"This may suggest..."','"Data clearly shows..."','"It is certain that..."','"Without doubt..."'],a:0,w:'"This may suggest..." is an appropriate hedge for a less certain conclusion.'},{q:'Which phrase suits a well-supported, certain claim?',o:['"Data clearly shows..."','"This might possibly indicate..."','"Perhaps, though unclear..."','"It could be argued, with uncertainty..."'],a:0,w:'"Data clearly shows..." suits a well-supported, certain claim.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Writing (IGCSE)',ti:'A Common Mistake',su:'Learn to avoid writing a report like a narrative or diary entry.',steps:[

{lb:'The fix',dr:dQ8,ht:'<p><b>✓ "The cafeteria was assessed against three criteria..."</b></p>'},
{lb:'The rule to remember',dr:dQ8,ht:'<p>Reports inform <b>systematically</b> — they do not tell a story.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'What is the mistake in "So then we looked at the cafeteria and it was quite bad..."?',o:['It is written like a narrative, not a systematic report','It uses too many words','It has no subject','Nothing is wrong with it'],a:0,w:'This is written like a narrative/diary entry, not the systematic style expected in a report.'},{q:'What is a more report-appropriate version?',o:['"The cafeteria was assessed against three criteria..."','"So then we looked at the cafeteria..."','"We went to check the food and it was bad."','"You would not believe how bad the food was."'],a:0,w:'"The cafeteria was assessed against three criteria..." is systematic and report-appropriate.'},{q:'What do reports do, according to this lesson?',o:['Inform systematically, rather than telling a story','Tell an exciting narrative','Focus on the writer\\u2019s personal feelings','Avoid using any evidence'],a:0,w:'Reports inform systematically — they do not tell a story like a narrative.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
