{lb:'Example comparison',dr:dQ1,ht:'<p><b>"In the morning"</b> is a phrase (no subject/verb). <b>"She left"</b> is a clause (subject "she" + verb "left").</p>'},
{lb:'A common error source',dr:dQ1,ht:'<p>Confusing phrases with clauses is a <b>common source of grammar errors</b>, especially fragments — treating a phrase as if it were a complete sentence.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is the key difference between a phrase and a clause?',o:['Whether it has a subject AND a verb together','Whether it is longer than five words','Whether it starts with a capital letter','Whether it uses punctuation'],a:0,w:'The key difference is whether the group of words has a subject and a verb together.'},{q:'Is "in the morning" a phrase or a clause?',o:['A phrase — it has no subject or verb','A clause — it has a subject and verb','Neither — it is a full sentence','Both, depending on context'],a:0,w:'"In the morning" has no subject or verb, so it is a phrase.'},{q:'Is "she left" a phrase or a clause?',o:['A clause — it has a subject and a verb','A phrase — it has no subject','A phrase — it has no verb','Neither a phrase nor a clause'],a:0,w:'"She left" has a subject ("she") and a verb ("left"), so it is a clause.'},{q:'What common error comes from confusing phrases with clauses?',o:['Treating a phrase as if it were a complete sentence (a fragment)','Using too many commas','Writing in the wrong tense','Spelling mistakes'],a:0,w:'A common error is treating a phrase as a complete sentence, creating a fragment.'},{q:'Do phrases and clauses behave the same way in a sentence?',o:['No, they behave very differently','Yes, they are identical in every way','Yes, but only in questions','No, phrases are always longer'],a:0,w:'Phrases and clauses behave very differently, despite both being groups of related words.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 &bull; English &bull; Grammar',ti:'What is a Phrase?',su:'Define a phrase and understand why it cannot stand alone.',steps:[
{lb:'Definition',dr:dQ2,ht:'<p>A <b>phrase</b> is a group of related words that does <b>not</b> contain both a subject and a verb.</p>'},
{lb:'Example',dr:dQ2,ht:'<p><b>"In the morning"</b> has no subject and no verb — it is simply a group of words adding detail.</p>'},
{lb:'What phrases do',dr:dQ2,ht:'<p>A phrase adds detail to a sentence — showing <b>time, place, manner,</b> or other information — without forming a complete idea by itself.</p>'},
{lb:'Types of phrase',dr:dQ2,ht:'<p>Common types include <b>noun, verb, prepositional, adjective,</b> and <b>adverb phrases</b> — covered across the following steps.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What is a phrase?',o:['A group of related words with no subject and verb together','A group of words that always forms a full sentence','A single word only','A punctuation mark'],a:0,w:'A phrase is a group of related words without both a subject and a verb together.'},{q:'Can a phrase stand alone as a complete sentence?',o:['No, never','Yes, always','Yes, but only short phrases','Yes, if it starts with a capital letter'],a:0,w:'A phrase can never stand alone as a complete sentence, since it lacks a subject+verb pair.'},{q:'What kind of detail can a phrase add to a sentence?',o:['Time, place, manner, or similar detail','Only colour names','Only numbers','Nothing at all'],a:0,w:'A phrase can add detail such as time, place, or manner.'},{q:'Which of these is a phrase?',o:['"In the morning"','"She arrived"','"Because she arrived"','"When she arrived"'],a:0,w:'"In the morning" has no subject or verb — it is a phrase.'},{q:'Which of these is NOT a common type of phrase?',o:['Subordinating phrase','Noun phrase','Verb phrase','Prepositional phrase'],a:0,w:'"Subordinating phrase" is not a standard phrase type — noun, verb, and prepositional phrases are.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 &bull; English &bull; Grammar',ti:'Prepositional Phrases',su:'Identify phrases built from a preposition and its object.',steps:[
{lb:'Definition',dr:dQ3,ht:'<p>A <b>prepositional phrase</b> begins with a preposition (in, on, at, under, before, after, with...) followed by its object.</p>'},
{lb:'Example',dr:dQ3,ht:'<p><b>"The book on the table is mine."</b> Here, "on the table" is a prepositional phrase describing where the book is.</p>'},
{lb:'No subject or verb',dr:dQ3,ht:'<p>A prepositional phrase contains <b>no subject or verb of its own</b> — "on the table" cannot stand alone as a sentence.</p>'},
{lb:'What they usually tell us',dr:dQ3,ht:'<p>Prepositional phrases often tell us <b>where</b> or <b>when</b> something happens, and are the most common phrase type in everyday writing.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'What does a prepositional phrase begin with?',o:['A preposition followed by its object','A subject followed by a verb','A conjunction followed by a clause','A capital letter always'],a:0,w:'A prepositional phrase begins with a preposition followed by its object.'},{q:'In "The book on the table is mine," what is the prepositional phrase?',o:['"on the table"','"the book"','"is mine"','"The book on"'],a:0,w:'"On the table" is the prepositional phrase, beginning with the preposition "on."'},{q:'Does a prepositional phrase contain a subject and verb of its own?',o:['No','Yes, always','Yes, but only sometimes','Only if it is very long'],a:0,w:'A prepositional phrase contains no subject or verb of its own.'},{q:'What do prepositional phrases often tell us?',o:['Where or when something happens','Who is speaking','The tense of the sentence','The author\'s opinion'],a:0,w:'Prepositional phrases often tell us where or when something happens.'},{q:'Which of these is a prepositional phrase?',o:['"Under the bridge"','"She walked"','"Although tired"','"Walking quickly"'],a:0,w:'"Under the bridge" begins with the preposition "under" — a prepositional phrase.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 &bull; English &bull; Grammar',ti:'Noun and Verb Phrases',su:'Identify phrases that function as the subject/object or the verb of a sentence.',steps:[
{lb:'Noun phrase',dr:dQ4,ht:'<p>A <b>noun phrase</b> is a noun plus its modifiers, e.g. <b>"the tall old man."</b> It functions as a subject or object but contains no verb.</p>'},
{lb:'Verb phrase',dr:dQ4,ht:'<p>A <b>verb phrase</b> is a main verb plus its auxiliary (helping) verbs, e.g. <b>"has been running."</b> It functions as the sentence\'s verb, but has no separate subject inside it.</p>'},
{lb:'Function in the sentence',dr:dQ4,ht:'<p>A noun phrase can act as a <b>subject or object</b>; a verb phrase always functions as the sentence\'s <b>main verb</b>.</p>'},
{lb:'Not clauses',dr:dQ4,ht:'<p>Neither type has a complete subject+verb pair within itself — that is exactly what makes them <b>phrases</b>, not clauses, even though both are essential building blocks of clauses.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What is a noun phrase?',o:['A noun plus its modifiers','A verb plus its auxiliaries','A subordinating conjunction','A full independent clause'],a:0,w:'A noun phrase is a noun plus its modifiers, e.g. "the tall old man."'},{q:'What is a verb phrase?',o:['A main verb plus its auxiliary verbs','A noun plus an adjective','A preposition plus its object','A subordinate clause'],a:0,w:'A verb phrase is a main verb plus its auxiliary (helping) verbs, e.g. "has been running."'},{q:'What can a noun phrase function as?',o:['A subject or object','Only a verb','Only a conjunction','Only an adverb'],a:0,w:'A noun phrase can function as a subject or object in a sentence.'},{q:'Does a verb phrase contain its own separate subject?',o:['No','Yes, always','Yes, but only in questions','Only in the past tense'],a:0,w:'A verb phrase has no separate subject inside it — the subject sits outside the verb phrase.'},{q:'Why are noun/verb phrases not clauses?',o:['Neither contains a complete subject+verb pair within itself','They are always too short','They always start with a capital letter','They can never be part of a sentence'],a:0,w:'Neither noun nor verb phrases contain a complete subject+verb pair within themselves, which is why they are phrases, not clauses.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 &bull; English &bull; Grammar',ti:'Adjective and Adverb Phrases',su:'Identify phrases that add descriptive detail without a subject and verb.',steps:[
{lb:'Adjective phrase',dr:dQ5,ht:'<p>An <b>adjective phrase</b> describes a noun, e.g. <b>"very tall"</b> describing a person\'s height.</p>'},
{lb:'Adverb phrase',dr:dQ5,ht:'<p>An <b>adverb phrase</b> describes a verb, e.g. <b>"very quickly"</b> describing how an action was performed.</p>'},
{lb:'Still not clauses',dr:dQ5,ht:'<p>Neither an adjective phrase nor an adverb phrase contains a subject and verb of its own — so neither is a clause.</p>'},
{lb:'A common mix-up',dr:dQ5,ht:'<p>These phrases are often confused with <b>adjective and adverb clauses</b> (a type of relative/adverbial clause) — the subject+verb test resolves the confusion every time.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What does an adjective phrase describe?',o:['A noun','A verb','A whole sentence','A preposition'],a:0,w:'An adjective phrase describes a noun, e.g. "very tall."'},{q:'What does an adverb phrase describe?',o:['A verb','A noun','A conjunction','An article'],a:0,w:'An adverb phrase describes a verb, e.g. "very quickly."'},{q:'Do adjective and adverb phrases contain a subject and verb?',o:['No','Yes, always','Yes, but only adverb phrases do','Yes, but only adjective phrases do'],a:0,w:'Neither adjective nor adverb phrases contain a subject and verb of their own.'},{q:'What test resolves confusion between phrases and clauses of the same name?',o:['Checking for a subject and verb','Checking the sentence length','Checking the punctuation used','Checking the topic of the sentence'],a:0,w:'The subject+verb test resolves confusion between adjective/adverb phrases and clauses.'},{q:'Which of these is an adjective phrase, not a clause?',o:['"Very tall"','"Who is very tall"','"Because she is tall"','"When she grew tall"'],a:0,w:'"Very tall" has no subject or verb — an adjective phrase, not a clause.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar',ti:'The Key Test: Subject + Verb',su:'Apply the single test that reliably distinguishes phrases from clauses.',steps:[
{lb:'The test',dr:dQ6,ht:'<p>Ask: does this group of words have <b>both a subject AND a verb</b> of its own? This single question resolves almost every phrase-vs-clause question.</p>'},
{lb:'Yes to both = clause',dr:dQ6,ht:'<p>If the answer is <b>yes</b> to both, the group of words is a <b>clause</b>.</p>'},
{lb:'No to either = phrase',dr:dQ6,ht:'<p>If the answer is <b>no</b> to either part, the group of words is a <b>phrase</b>.</p>'},
{lb:'Applying it: a tricky case',dr:dQ6,ht:'<p><b>"Running down the street"</b> contains a verb form ("running"), but no subject performing the action — so it is a <b>phrase</b>, not a clause.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What is the key test for distinguishing a phrase from a clause?',o:['Whether it has both a subject AND a verb','Whether it is longer than ten words','Whether it uses a comma','Whether it is at the start of a sentence'],a:0,w:'The key test is whether the group of words has both a subject and a verb.'},{q:'If a group of words has both a subject and a verb, what is it?',o:['A clause','A phrase','A conjunction','A preposition'],a:0,w:'If a group of words has both a subject and a verb, it is a clause.'},{q:'Is "running down the street" a clause or a phrase?',o:['A phrase — it has no subject performing the action','A clause — it has a subject and verb','Neither a phrase nor a clause','Both a phrase and a clause'],a:0,w:'"Running down the street" has a verb form but no subject, so it is a phrase.'},{q:'Why does "running down the street" fail the clause test?',o:['It has no subject performing the action','It has too many words','It starts with a capital letter','It contains a preposition'],a:0,w:'It fails the clause test because there is no subject performing the action of "running."'},{q:'What does this single test resolve?',o:['Almost all confusion between phrases and clauses','Only spelling mistakes','Only punctuation errors','Nothing useful at all'],a:0,w:'This single subject+verb test resolves almost all confusion between phrases and clauses.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Grammar',ti:'Phrases Inside Clauses',su:'See how a single clause can contain several different phrases.',steps:[
{lb:'One sentence, one clause',dr:dQ7,ht:'<p><b>"The tall man in the corner smiled quietly."</b> This whole sentence is <b>one clause</b> — one subject ("the tall man...") and one verb ("smiled").</p>'},
{lb:'Phrases inside it',dr:dQ7,ht:'<p>Within that single clause sit several phrases: <b>"the tall man"</b> (noun phrase), <b>"in the corner"</b> (prepositional phrase), and <b>"quietly"</b> (adverb phrase).</p>'},
{lb:'Phrases decorate; clauses carry meaning',dr:dQ7,ht:'<p>A clause carries the <b>core meaning</b> (who did what); phrases add extra <b>descriptive detail</b> around that core.</p>'},
{lb:'Why this matters for exams',dr:dQ7,ht:'<p>Recognising both phrases and clauses improves <b>sentence analysis skills</b>, useful for both the Reading (structure) and Writing (accuracy) exam sections.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'How many clauses does "The tall man in the corner smiled quietly" contain?',o:['One','Two','Three','None'],a:0,w:'This sentence is one clause, with one subject and one verb ("smiled").'},{q:'What phrase type is "the tall man" in this sentence?',o:['A noun phrase','A prepositional phrase','An adverb phrase','A verb phrase'],a:0,w:'"The tall man" is a noun phrase — a noun plus its modifiers.'},{q:'What phrase type is "in the corner"?',o:['A prepositional phrase','A noun phrase','An adjective phrase','A verb phrase'],a:0,w:'"In the corner" is a prepositional phrase, beginning with "in."'},{q:'What carries the "core meaning" of who did what in a sentence?',o:['The clause','The phrases alone','The punctuation','The title of the text'],a:0,w:'The clause carries the core meaning of who did what; phrases add extra detail.'},{q:'Why does recognising phrases and clauses matter for exams?',o:['It improves sentence analysis useful for Reading and Writing sections','It only matters for spelling tests','It has no relevance to any exam section','It only matters for oral exams'],a:0,w:'Recognising phrases and clauses improves sentence analysis skills useful for both Reading and Writing exam sections.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Grammar',ti:'Common Confusions',su:'Apply the subject+verb test to a set of tricky phrase/clause pairs.',steps:[
{lb:'"Although tired" vs "Although she was tired"',dr:dQ8,ht:'<p><b>"Although tired"</b> is a phrase (no subject of its own). <b>"Although she was tired"</b> is a clause — it has the subject "she" and the verb "was."</p>'},
{lb:'"Running fast" vs "He was running fast"',dr:dQ8,ht:'<p><b>"Running fast"</b> is a phrase (a participle phrase, no subject). <b>"He was running fast"</b> is a clause — subject "he" + verb "was running."</p>'},
{lb:'Always apply the test',dr:dQ8,ht:'<p>Whenever unsure, apply the same test every time: does this group of words have <b>both</b> a subject and a verb of its own?</p>'},
{lb:'Why these pairs confuse writers',dr:dQ8,ht:'<p>These pairs look similar because they share key words (although, running) — but only the versions with an explicit subject and verb are true clauses.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'Is "Although tired" a phrase or a clause?',o:['A phrase — no subject of its own','A clause — it has a subject','A clause — it has a verb','Neither a phrase nor a clause'],a:0,w:'"Although tired" has no subject of its own — it is a phrase.'},{q:'Is "Although she was tired" a phrase or a clause?',o:['A clause — subject "she" + verb "was"','A phrase — no subject or verb','A clause, but only because it is long','Neither a phrase nor a clause'],a:0,w:'"Although she was tired" has a subject ("she") and a verb ("was") — a clause.'},{q:'Is "Running fast" a phrase or a clause?',o:['A phrase — no subject performing the action','A clause — it has a subject','A clause — it has a verb and subject','Neither a phrase nor a clause'],a:0,w:'"Running fast" is a phrase — there is no subject performing the running.'},{q:'Is "He was running fast" a phrase or a clause?',o:['A clause — subject "he" + verb "was running"','A phrase — no subject','A phrase — no verb','Neither a phrase nor a clause'],a:0,w:'"He was running fast" has a subject ("he") and a verb ("was running") — a clause.'},{q:'What test should always be applied to resolve these confusions?',o:['Checking for both a subject and a verb','Checking the sentence length','Checking for a capital letter','Checking for a question mark'],a:0,w:'Always apply the test of checking for both a subject and a verb.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Grammar',ti:'Why This Distinction Matters',su:'Understand the practical exam and writing consequences of confusing phrases and clauses.',steps:[
{lb:'Different punctuation rules',dr:dQ9,ht:'<p>Punctuation rules differ for phrases and clauses — only <b>clauses</b> can create fragments or comma splices when mishandled.</p>'},
{lb:'Ambiguity from misplaced phrases',dr:dQ9,ht:'<p>A misplaced phrase can create <b>ambiguity</b>, such as a dangling or misplaced modifier, confusing the reader about what is being described.</p>'},
{lb:'Tested at IGCSE',dr:dQ9,ht:'<p>IGCSE "analysing structure" Reading questions often test this distinction directly — identifying phrase vs clause boosts precision in exam answers.</p>'},
{lb:'A foundational skill',dr:dQ9,ht:'<p>A firm grasp of phrase vs clause supports both <b>reading analysis and writing accuracy</b>, and underpins every later grammar topic in this strand.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'What can only clauses create if mishandled?',o:['Fragments or comma splices','Correct punctuation always','Perfect grammar every time','Nothing at all'],a:0,w:'Only clauses can create fragments or comma splices when mishandled — phrases cannot on their own.'},{q:'What can a misplaced phrase create?',o:['Ambiguity, such as a dangling or misplaced modifier','Perfect clarity always','A new independent clause','A correct compound sentence'],a:0,w:'A misplaced phrase can create ambiguity, such as a dangling or misplaced modifier.'},{q:'Which IGCSE Reading skill often tests phrase vs clause knowledge?',o:['Analysing structure','Identifying explicit information only','Summary writing only','Comparing texts only'],a:0,w:'IGCSE "analysing structure" questions often test phrase vs clause knowledge directly.'},{q:'What does a firm grasp of phrase vs clause support?',o:['Both reading analysis and writing accuracy','Only spelling ability','Only vocabulary size','Only handwriting neatness'],a:0,w:'A firm grasp of phrase vs clause supports both reading analysis and writing accuracy.'},{q:'What role does this topic play for later grammar topics?',o:['It is foundational and underpins later topics','It has no connection to other grammar topics','It only applies to Year 7 grammar','It replaces the need to learn punctuation'],a:0,w:'This distinction is foundational and underpins every later grammar topic in the strand.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 &bull; English &bull; Grammar',ti:'Mixed Questions — Phrase vs Clause',su:'Integrated revision across phrase types, clause types, and the key test.',steps:[
{lb:'The core distinction',dr:dQ10,ht:'<p>A <b>phrase</b> has no subject+verb pair; a <b>clause</b> has one. This is the single most important distinction in this topic.</p>'},
{lb:'Phrase types recap',dr:dQ10,ht:'<p><b>Noun phrase</b> (subject/object, no verb), <b>verb phrase</b> (main verb + auxiliaries, no separate subject), <b>prepositional phrase</b> (preposition + object), <b>adjective/adverb phrase</b> (descriptive detail).</p>'},
{lb:'The key test, restated',dr:dQ10,ht:'<p>Always ask: does this group of words have <b>both</b> a subject AND a verb of its own? Yes = clause. No = phrase.</p>'},
{lb:'Exam relevance',dr:dQ10,ht:'<p>This distinction is tested in IGCSE Reading (structure analysis) and rewarded through <b>accuracy</b> in Writing — a foundational grammar skill.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'What is the single most important distinction between a phrase and a clause?',o:['Whether it has both a subject and a verb','Whether it is formal or informal','Whether it is a question','Whether it uses punctuation'],a:0,w:'The key distinction is whether the group of words has both a subject and a verb.'},{q:'Which phrase type is "on the table"?',o:['Prepositional phrase','Noun phrase','Verb phrase','Adverb phrase'],a:0,w:'"On the table" is a prepositional phrase, beginning with the preposition "on."'},{q:'Which phrase type is "has been running"?',o:['Verb phrase','Noun phrase','Prepositional phrase','Adjective phrase'],a:0,w:'"Has been running" is a verb phrase — main verb plus auxiliary verbs.'},{q:'Is "Although tired" a phrase or clause?',o:['A phrase — no subject of its own','A clause — it has a subject','A clause — it has a verb','Neither'],a:0,w:'"Although tired" has no subject of its own, so it is a phrase.'},{q:'Is "She smiled" a phrase or clause?',o:['A clause — subject + verb present','A phrase — no verb','A phrase — no subject','Neither a phrase nor a clause'],a:0,w:'"She smiled" has both a subject and a verb — a clause.'},{q:'What kind of ambiguity can a misplaced phrase cause?',o:['A dangling or misplaced modifier','A subject-verb agreement error only','A spelling mistake','A capitalisation error'],a:0,w:'A misplaced phrase can cause ambiguity such as a dangling or misplaced modifier.'},{q:'Which IGCSE Reading skill often relies on this distinction?',o:['Analysing structure','Fact vs opinion only','Summary writing only','Bias and persuasion only'],a:0,w:'Analysing structure questions often rely on the phrase vs clause distinction.'},{q:'What should you always check when unsure whether something is a phrase or clause?',o:['Whether it has both a subject and a verb','Whether it is longer than ten words','Whether it uses a semicolon','Whether it is the first sentence of a paragraph'],a:0,w:'Always check whether the group of words has both a subject and a verb.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
