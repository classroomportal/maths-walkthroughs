<style>
:root{--red:#E65100;--dark:#BF360C;--cream:#FFF3E0;--ink:#2a1a0d;--line:#FFE0B2;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#E65100',DARK='#BF360C',CRM='#FFF3E0',LINE='#FFE0B2';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#2a1a0d';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'What is Subject-Verb Agreement?',ACC,12,'middle',true));
if(p>=1){o.push(R(10,40,460,50,CRM,ACC,2));o.push(T(240,60,'The subject and verb must MATCH',DARK,11,'middle',false));o.push(T(240,80,'Singular subject &rarr; singular verb','#555',10,'middle',false));}
if(p>=2){o.push(R(10,100,220,44,'#fff',ACC,1.5));o.push(T(120,120,'"She walks"',ACC,11,'middle',true));
  o.push(R(250,100,220,44,'#fff',ACC,1.5));o.push(T(360,120,'"They walk"',ACC,11,'middle',true));}
if(p>=3){o.push(R(10,154,460,40,'#e8f5e9',ACC,1));o.push(T(240,178,'One person = walks (with s). More than one = walk (no s)',DARK,10,'middle',false));}
s.innerHTML=o.join('');}

function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Singular Subjects',ACC,13,'middle',true));
[['He / She / It','Add -s to the verb: "he walks"'],['One person\\u2019s name','"Ada walks to school."'],['One thing','"The dog barks loudly."'],['Rule','Singular subject + verb ending in -s']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(130,56+i*36,r[0],ACC,9,'middle',true));o.push(T(340,56+i*36,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Plural Subjects',ACC,13,'middle',true));
if(p>=1){o.push(R(10,40,460,44,CRM,ACC,2));o.push(T(240,60,'We / You / They + verb with NO -s',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#fff',ACC,1));o.push(T(240,116,'"They walk to school." NOT "They walks"',DARK,10,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,'#e8f5e9',ACC,1));o.push(T(240,176,'More than one person/thing = no -s on the verb','#555',10,'middle',false));}
s.innerHTML=o.join('');}

function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Tricky Subjects: "Everyone", "Each"',ACC,11,'middle',true));
if(p>=1){o.push(R(10,40,460,44,'#fde8e8',ACC,2));o.push(T(240,60,'✗ "Everyone are here." (sounds plural, but ISN\\u2019T)',DARK,9,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#e8f5e9',ACC,1));o.push(T(240,116,'✓ "Everyone IS here."',DARK,10,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,CRM,ACC,1));o.push(T(240,176,'Everyone, everybody, each, either — all SINGULAR','#555',10,'middle',false));}
s.innerHTML=o.join('');}

function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'When Words Come Between',ACC,12,'middle',true));
if(p>=1){o.push(R(10,40,460,44,CRM,ACC,2));o.push(T(240,60,'Don\\u2019t let extra words confuse you!',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#fff',ACC,1));o.push(T(240,116,'"The box of chocolates IS on the table."',DARK,10,'middle',false));o.push(T(240,134,'"box" is the real subject, not "chocolates"','#555',9,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,'#e8f5e9',ACC,1));o.push(T(240,176,'Find the TRUE subject before choosing the verb','#555',10,'middle',false));}
s.innerHTML=o.join('');}

function dQ6(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Two Subjects Joined by "And"',ACC,12,'middle',true));
[['"And" joins','Usually makes a plural subject'],['Example','"Ada AND Femi are friends."'],['Verb choice','Plural verb (are, not is)'],['Exception','Some fixed phrases act as one idea, e.g. "bread and butter IS"']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,9,'middle',true));o.push(T(330,56+i*36,r[1],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}

function dQ7(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'"Or" and "Nor" Subjects',ACC,13,'middle',true));
if(p>=1){o.push(R(10,40,460,44,CRM,ACC,2));o.push(T(240,60,'With "or"/"nor", match the NEAREST subject',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#fff',ACC,1));o.push(T(240,116,'"Either the dog or the cats ARE hungry."',DARK,10,'middle',false));o.push(T(240,134,'"cats" is nearest, so verb is plural ("are")','#555',9,'middle',false));}
s.innerHTML=o.join('');}

function dQ8(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'A Common Mistake',ACC,13,'middle',true));
if(p>=1){o.push(R(10,40,460,44,'#fde8e8',ACC,2));o.push(T(240,60,'✗ "The list of items ARE long." (wrong)',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,96,460,44,'#e8f5e9',ACC,1));o.push(T(240,116,'✓ "The list of items IS long."',DARK,10,'middle',false));}
if(p>=3){o.push(R(10,152,460,44,CRM,ACC,1));o.push(T(240,176,'"List" (singular) is the subject, not "items"','#555',10,'middle',false));}
s.innerHTML=o.join('');}

function dQ9(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Why Subject-Verb Agreement Matters',ACC,11,'middle',true));
[['Sounds correct','Mistakes here stand out immediately to readers'],['Clarity','Helps the reader know exactly who/what you mean'],['Marks matter','Checked closely in writing assessments'],['Practice helps','Becomes automatic the more you write and check']].forEach(function(r,i){if(i<=p){o.push(R(10,36+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,1));o.push(T(120,56+i*36,r[0],ACC,9,'middle',true));o.push(T(330,56+i*36,r[1],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Subject-Verb Agreement — Summary',ACC,11,'middle',true));
[['Singular subject','He/she/it/one name/one thing + verb with -s'],['Plural subject','We/you/they/many things + verb with no -s'],['Tricky singulars','Everyone, everybody, each, either'],['Words in between','Find the TRUE subject, ignore extra words'],['"And" subjects','Usually plural: "Ada and Femi ARE"'],['"Or"/"nor" subjects','Match the nearest subject to the verb']].forEach(function(r,i){if(i<p+1){o.push(R(10,32+i*30,460,25,CRM,LINE,1));o.push(T(130,49+i*30,r[0],ACC,8,'middle',true));o.push(T(350,49+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}

var QS=[

{ey:'Q1 &bull; English &bull; Grammar (Year 8)',ti:'What is Subject-Verb Agreement?',su:'Learn the basic rule that subjects and verbs must match.',steps:[

{lb:'Examples',dr:dQ1,ht:'<p><b>"She walks"</b> (singular) vs <b>"They walk"</b> (plural).</p>'},

{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'What happens to the verb with a plural subject like "they"?',o:['It has no -s, e.g. "they walk"','It adds -s, e.g. "they walks"','It changes to the past tense always','Nothing changes at all'],a:0,w:'A plural subject like "they" uses a verb with no -s: "they walk."'},{q:'Which is correct?',o:['"They walk to school."','"They walks to school."','"They walking to school is."','"They walked-s to school."'],a:0,w:'"They walk to school" correctly matches the plural subject with no -s on the verb.'},{q:'What does "more than one" mean for the verb?',o:['No -s on the verb','Always adds -s to the verb','Always uses the past tense','Always uses "is"'],a:0,w:'More than one person or thing means no -s on the verb.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'The correct version',dr:dQ4,ht:'<p><b>✓ "Everyone IS here."</b></p>'},
{lb:'The rule',dr:dQ4,ht:'<p><b>Everyone, everybody, each, either</b> — all treated as <b>SINGULAR</b>.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'Is "everyone" treated as singular or plural?',o:['Singular','Plural','Neither','It depends on context'],a:0,w:'"Everyone" is treated as singular, even though it refers to many people.'},{q:'Which is correct?',o:['"Everyone is here."','"Everyone are here."','"Everyone were here."','"Everyone been here."'],a:0,w:'"Everyone is here" correctly treats "everyone" as singular.'},{q:'Which of these words is treated as singular?',o:['Each','They','We','Both'],a:0,w:'"Each" is treated as singular, like "everyone" and "everybody."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 &bull; English &bull; Grammar (Year 8)',ti:'When Words Come Between',su:'Learn to find the true subject when extra words come between subject and verb.',steps:[
{lb:'Don\\u2019t get confused',dr:dQ5,ht:'<p>Don\\u2019t let <b>extra words</b> between the subject and verb confuse you.</p>'},
{lb:'Example',dr:dQ5,ht:'<p><b>"The box of chocolates IS on the table."</b> "Box" is the real subject, not "chocolates."</p>'},
{lb:'The rule',dr:dQ5,ht:'<p>Find the <b>TRUE subject</b> before choosing the verb.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'In "The box of chocolates IS on the table," what is the true subject?',o:['Box','Chocolates','Table','Is'],a:0,w:'"Box" is the true subject; "of chocolates" is just extra description.'},{q:'What should you do when extra words come between subject and verb?',o:['Find the true subject before choosing the verb','Match the verb to the nearest word always','Ignore the subject entirely','Use a plural verb every time'],a:0,w:'Find the true subject before choosing the verb, ignoring extra descriptive words.'},{q:'Which is correct: "The box of chocolates ___ on the table"?',o:['Is','Are','Were','Have'],a:0,w:'"Is" is correct since "box" (the true subject) is singular.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar (Year 8)',ti:'Two Subjects Joined by "And"',su:'Learn how "and" usually creates a plural subject.',steps:[
{lb:'"And" joins two subjects',dr:dQ6,ht:'<p>Joining two subjects with <b>"and"</b> usually makes a <b>plural</b> subject.</p>'},
{lb:'Example',dr:dQ6,ht:'<p><b>"Ada AND Femi are friends."</b></p>'},
{lb:'The verb choice',dr:dQ6,ht:'<p>Use a <b>plural verb</b> (are, not is) when two subjects are joined by "and."</p>'},
{lb:'An exception',dr:dQ6,ht:'<p>Some fixed phrases act as <b>one idea</b>, e.g. "bread and butter IS my favourite breakfast."</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What does joining two subjects with "and" usually create?',o:['A plural subject','A singular subject always','No subject at all','A question'],a:0,w:'Joining two subjects with "and" usually creates a plural subject.'},{q:'Which is correct: "Ada and Femi ___ friends"?',o:['Are','Is','Was','Has'],a:0,w:'"Are" is correct since "Ada and Femi" together form a plural subject.'},{q:'Can some fixed phrases with "and" act as one singular idea?',o:['Yes, e.g. "bread and butter is..."','No, "and" always makes things plural','No, "and" cannot be used with singular verbs ever','Yes, but only in questions'],a:0,w:'Some fixed phrases, like "bread and butter," can act as one singular idea.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

]},
