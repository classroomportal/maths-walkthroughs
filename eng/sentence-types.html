<style>
:root{--red:#E65100;--dark:#BF360C;--cream:#FFF3E0;--ink:#2a1a0d;--line:#FFE0B2;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=shuffleMC(genFn());ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=shuffleMC(entry.genFn());entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';
    }
    return;
  }
});

{lb:'Subject and verb working together',dr:dQ1,ht:'<p>In <b>"The dog barked,"</b> the subject is <b>"the dog"</b> and the verb is <b>"barked."</b> Together they form a complete idea — we know who did something and what they did.</p>'},
{lb:'Sentence fragments',dr:dQ1,ht:'<p>A group of words missing a subject or a verb — or that doesn\'t express a complete thought — is called a <b>fragment</b>, not a sentence. <b>"Running down the street"</b> has no clear subject performing the action as a main verb, so it is incomplete.</p>'},
{lb:'Turning a fragment into a sentence',dr:dQ1,ht:'<p>Adding a subject fixes the fragment: <b>"The dog ran down the street."</b> Now there is a subject ("the dog"), a verb ("ran"), and a complete thought — a proper sentence.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What two things does every sentence need?',o:['A subject and a verb','Only a noun','Only an adjective','A comma and a full stop'],a:0,w:'Every sentence needs a subject and a verb to express a complete thought.'},{q:'In "The dog barked," what is the subject?',o:['The dog','Barked','The','No subject exists'],a:0,w:'"The dog" is the subject — who the sentence is about.'},{q:'In "The dog barked," what is the verb?',o:['Barked','The dog','The','Neither word is a verb'],a:0,w:'"Barked" is the verb — what the subject did.'},{q:'What is "Running down the street" an example of?',o:['A sentence fragment','A complete compound sentence','A complex sentence','A question'],a:0,w:'"Running down the street" lacks a clear subject and main verb, making it a fragment, not a full sentence.'},{q:'How can "Running down the street" be fixed into a full sentence?',o:['By adding a subject, e.g. "The dog ran down the street."','By adding another comma','By removing all the words','It cannot be fixed'],a:0,w:'Adding a subject, e.g. "The dog ran down the street," completes the thought.'},{q:'What does a sentence need to express, beyond just having words?',o:['A complete thought','A rhyme','A question mark always','A minimum of ten words'],a:0,w:'A sentence must express a complete thought, not just contain words.'},{q:'Which of these is a complete sentence?',o:['"She sings beautifully."','"Beautifully singing."','"Down the road, quickly."','"Although she sings."'],a:0,w:'"She sings beautifully" has a subject (she) and a verb (sings), forming a complete thought.'},{q:'Why is a subject alone, like just "The dog," not a complete sentence?',o:['It has no verb to tell us what the subject does','It is too short','It has too many words','It uses the wrong punctuation'],a:0,w:'Without a verb, "The dog" tells us who but not what happened — it is incomplete.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 &bull; English &bull; Grammar',ti:'Simple Sentences',su:'Identify and construct simple sentences with one independent clause.',steps:[
{lb:'Definition',dr:dQ2,ht:'<p>A <b>simple sentence</b> contains exactly <b>one independent clause</b> — one subject, one verb, and one complete idea. It is the most basic sentence structure.</p>'},
{lb:'Example',dr:dQ2,ht:'<p><b>"The teacher marked the exams."</b> This has one subject ("the teacher") and one verb ("marked"), expressing a single complete thought.</p>'},
{lb:'Simple does not mean short',dr:dQ2,ht:'<p>Simple sentences can have <b>compound subjects or verbs</b> and still count as simple, e.g. <b>"The teacher and the headmaster marked the exams together."</b> — still one clause overall.</p>'},
{lb:'Why use simple sentences',dr:dQ2,ht:'<p>Writers use short simple sentences for <b>impact, clarity, or pace</b> — especially effective after longer, more complex sentences in narrative and descriptive writing.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'How many independent clauses does a simple sentence contain?',o:['Exactly one','Exactly two','Three or more','None'],a:0,w:'A simple sentence contains exactly one independent clause.'},{q:'Which of these is a simple sentence?',o:['"The teacher marked the exams."','"The teacher marked the exams, and she felt tired."','"Although tired, the teacher marked the exams."','"The teacher marked the exams; she felt tired."'],a:0,w:'"The teacher marked the exams" has just one subject and verb — a simple sentence.'},{q:'Can a simple sentence have a compound subject (e.g. "The teacher and the headmaster")?',o:['Yes, it can still be a simple sentence','No, that automatically makes it compound','No, that automatically makes it complex','Only in questions'],a:0,w:'A simple sentence can have compound subjects/verbs and still be one clause overall.'},{q:'Why might a writer use a short simple sentence in descriptive writing?',o:['For impact, clarity or pace','To confuse the reader','Because longer sentences are grammatically incorrect','To avoid using any verbs'],a:0,w:'Short simple sentences are often used deliberately for impact, clarity, or pace.'},{q:'Which of these is NOT a simple sentence?',o:['"Because it rained, we stayed inside."','"She smiled."','"The dog barked loudly."','"Birds sing."'],a:0,w:'"Because it rained, we stayed inside" has a subordinate clause, making it complex, not simple.'},{q:'What is the most basic sentence structure called?',o:['A simple sentence','A compound-complex sentence','A fragment','A run-on sentence'],a:0,w:'The simple sentence is the most basic sentence structure.'},{q:'How many verbs are needed for a sentence to remain "simple"?',o:['Effectively one main verb/clause, even if compound','Always exactly two verbs','A minimum of three verbs','No verbs are required'],a:0,w:'A simple sentence expresses one main clause, even if the subject or verb is compound.'},{q:'"The boys ran and jumped." — why is this still simple?',o:['It has one subject with a compound verb, but only one clause','It has two subjects','It has a subordinate clause','It uses a semicolon'],a:0,w:'One subject with a compound verb ("ran and jumped") is still a single clause — simple.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 &bull; English &bull; Grammar',ti:'Compound Sentences',su:'Join two independent clauses correctly using FANBOYS conjunctions.',steps:[
{lb:'Definition',dr:dQ3,ht:'<p>A <b>compound sentence</b> joins <b>two or more independent clauses</b> — each of which could stand alone as its own sentence — using a comma and a coordinating conjunction.</p>'},
{lb:'FANBOYS',dr:dQ3,ht:'<p>The seven coordinating conjunctions are remembered by the acronym <b>FANBOYS: For, And, Nor, But, Or, Yet, So.</b> Each joins two independent clauses of equal importance.</p>'},
{lb:'Each clause stands alone',dr:dQ3,ht:'<p>In <b>"It rained, so we stayed in,"</b> both <b>"It rained"</b> and <b>"we stayed in"</b> could each be their own complete sentence — that\'s what makes it compound, not complex.</p>'},
{lb:'The comma splice error',dr:dQ3,ht:'<p>A common mistake is the <b>comma splice</b>: joining two independent clauses with only a comma and no conjunction, e.g. <b>✗ "It rained, we stayed in."</b> The fix is adding "so" or using a semicolon instead.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'What does a compound sentence join together?',o:['Two or more independent clauses','A subject and an object only','A subordinate clause and nothing else','Two nouns'],a:0,w:'A compound sentence joins two or more independent clauses.'},{q:'What does the acronym FANBOYS stand for?',o:['For, And, Nor, But, Or, Yet, So','Find, Ask, Never, Bring, Only, You, Stop','Four, All, Nothing, Best, Over, Yes, Sit','For, After, Nor, Before, On, Yet, Since'],a:0,w:'FANBOYS = For, And, Nor, But, Or, Yet, So — the coordinating conjunctions.'},{q:'What must be true of each clause in a compound sentence?',o:['Each could stand alone as its own complete sentence','Each must start with a capital letter mid-sentence','Each must contain a question','Neither clause can have a subject'],a:0,w:'Each clause in a compound sentence could stand alone as its own complete sentence.'},{q:'What is a "comma splice"?',o:['Joining two independent clauses with only a comma, no conjunction','Using too many commas in a list','A missing full stop at the end of a sentence','Using a semicolon correctly'],a:0,w:'A comma splice is joining two independent clauses with only a comma and no conjunction — an error.'},{q:'Which of these correctly fixes a comma splice: "It rained, we stayed in."?',o:['"It rained, so we stayed in."','"It rained we stayed in."','"It, rained, we, stayed, in."','"It rained so, we stayed in."'],a:0,w:'Adding "so" after the comma correctly joins the two clauses as a compound sentence.'},{q:'Which sentence is compound?',o:['"She studied hard, and she passed the exam."','"She studied hard because she wanted to pass."','"Studying hard, she passed."','"She studied hard."'],a:0,w:'"She studied hard, and she passed the exam" joins two independent clauses with "and" — compound.'},{q:'Besides a comma + FANBOYS word, what else can join two independent clauses?',o:['A semicolon','A single hyphen','An apostrophe','A question mark'],a:0,w:'A semicolon can also join two independent clauses without needing a conjunction.'},{q:'What kind of clauses does FANBOYS join?',o:['Two independent clauses of equal importance','One independent and one dependent clause','Two dependent clauses only','A single clause split in half'],a:0,w:'FANBOYS conjunctions join two independent clauses of equal grammatical importance.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 &bull; English &bull; Grammar',ti:'Complex Sentences',su:'Combine a main clause with a subordinate clause using subordinating conjunctions.',steps:[
{lb:'Definition',dr:dQ4,ht:'<p>A <b>complex sentence</b> contains one <b>main (independent) clause</b> and at least one <b>subordinate (dependent) clause</b>, joined by a subordinating conjunction.</p>'},
{lb:'Subordinating conjunctions',dr:dQ4,ht:'<p>Common subordinating conjunctions include: <b>although, because, since, if, when, while, unless, after.</b> These introduce a clause that depends on the main clause for full meaning.</p>'},
{lb:'The subordinate clause cannot stand alone',dr:dQ4,ht:'<p>"<b>Although it rained</b>" is not a complete sentence on its own — it needs the main clause to finish the thought: <b>"Although it rained, we went out."</b></p>'},
{lb:'Order can be reversed',dr:dQ4,ht:'<p>The subordinate clause can come first or second: <b>"We went out although it rained."</b> A comma is only needed when the subordinate clause comes <b>before</b> the main clause.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What does a complex sentence contain?',o:['One main clause and at least one subordinate clause','Only two independent clauses','Only a fragment','Two subordinate clauses and no main clause'],a:0,w:'A complex sentence contains a main clause plus at least one subordinate clause.'},{q:'Which of these is a subordinating conjunction?',o:['Although','And','But','Or'],a:0,w:'"Although" is a subordinating conjunction; the others are coordinating (FANBOYS).'},{q:'Can "Although it rained" stand alone as a complete sentence?',o:['No, it needs a main clause to complete the thought','Yes, it is already complete','Yes, because it has a subject and verb','No, because it has no subject'],a:0,w:'"Although it rained" is a subordinate clause and cannot stand alone as a complete sentence.'},{q:'When is a comma needed in a complex sentence?',o:['When the subordinate clause comes before the main clause','Always, no matter the order','Never, under any circumstances','Only if the sentence is a question'],a:0,w:'A comma is needed when the subordinate clause comes first, before the main clause.'},{q:'Which of these is a correctly punctuated complex sentence?',o:['"Although it rained, we went out."','"Although it rained we went, out."','"Although, it rained we went out."','"Although it rained; we went out."'],a:0,w:'"Although it rained, we went out" correctly places the comma after the subordinate clause.'},{q:'Which of these subordinating conjunctions signals a reason?',o:['Because','And','So','Yet'],a:0,w:'"Because" is a subordinating conjunction that signals a reason.'},{q:'Which sentence is complex, not compound?',o:['"Because she studied, she passed the exam."','"She studied, and she passed the exam."','"She studied, so she passed."','"She studied, but she was nervous."'],a:0,w:'"Because she studied, she passed the exam" uses a subordinating conjunction — complex, not compound.'},{q:'Can a complex sentence be rearranged so the subordinate clause comes second?',o:['Yes, e.g. "We went out although it rained."','No, the subordinate clause must always come first','No, that would make it a fragment','Yes, but only in questions'],a:0,w:'The subordinate clause can come second, e.g. "We went out although it rained," with no comma needed.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 &bull; English &bull; Grammar',ti:'Compound-Complex Sentences',su:'Recognise sentences combining multiple independent and subordinate clauses.',steps:[
{lb:'Definition',dr:dQ5,ht:'<p>A <b>compound-complex sentence</b> contains <b>two or more independent clauses</b> AND <b>at least one subordinate clause</b> — the most sophisticated of the four sentence structures.</p>'},
{lb:'Example broken down',dr:dQ5,ht:'<p><b>"Although it rained, we went out, and we got soaked."</b> This has: a subordinate clause ("Although it rained") + two independent clauses ("we went out" / "we got soaked") joined by "and."</p>'},
{lb:'Why it matters for exams',dr:dQ5,ht:'<p>Using varied sentence structures — including compound-complex sentences — demonstrates <b>sophisticated sentence control</b>, which examiners reward in top-band IGCSE and WAEC writing.</p>'},
{lb:'Balance is key',dr:dQ5,ht:'<p>Compound-complex sentences shouldn\'t be overused — mixing them with <b>simple sentences for impact</b> creates the most effective, varied writing style.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What does a compound-complex sentence contain?',o:['Two or more independent clauses plus at least one subordinate clause','Only one independent clause','Only subordinate clauses','Exactly one clause of any kind'],a:0,w:'A compound-complex sentence has two+ independent clauses plus at least one subordinate clause.'},{q:'In "Although it rained, we went out, and we got soaked," which part is the subordinate clause?',o:['"Although it rained"','"we went out"','"we got soaked"','The whole sentence'],a:0,w:'"Although it rained" is the subordinate clause introduced by "although."'},{q:'How many independent clauses are in "Although it rained, we went out, and we got soaked"?',o:['Two','One','Three','None'],a:0,w:'"We went out" and "we got soaked" are the two independent clauses, joined by "and."'},{q:'Why do examiners reward compound-complex sentences in writing?',o:['They demonstrate sophisticated sentence control','They are always grammatically incorrect','They are the shortest possible sentences','They avoid using any punctuation'],a:0,w:'Compound-complex sentences show sophisticated sentence control, which examiners reward.'},{q:'What sentence type combination is most effective for varied writing style?',o:['Mixing compound-complex sentences with short simple sentences','Using only compound-complex sentences throughout','Using only fragments','Avoiding all subordinate clauses entirely'],a:0,w:'Mixing longer compound-complex sentences with short simple ones creates the most effective, varied style.'},{q:'Which of these is a compound-complex sentence?',o:['"Because she was tired, she rested, and she felt better."','"She was tired."','"She was tired, so she rested."','"Because she was tired, she rested."'],a:0,w:'This sentence has a subordinate clause plus two independent clauses — compound-complex.'},{q:'What is compound-complex considered among the four sentence structures?',o:['The most sophisticated structure','The simplest structure','A type of fragment','Not a real sentence type'],a:0,w:'Compound-complex is considered the most sophisticated of the four sentence structures.'},{q:'What risk comes with overusing compound-complex sentences?',o:['Losing the impact that comes from sentence variety','Making the writing too easy to understand','Making the essay too short','None — there is no risk at all'],a:0,w:'Overusing them risks losing the impact created by varying sentence length and structure.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Grammar',ti:'Declarative Sentences',su:'Identify sentences that state facts or opinions.',steps:[
{lb:'Definition',dr:dQ6,ht:'<p>A <b>declarative sentence</b> makes a <b>statement</b> — it states a fact, opinion, or idea, and ends with a <b>full stop</b>.</p>'},
{lb:'Example',dr:dQ6,ht:'<p><b>"Lagos is the largest city in Nigeria."</b> Declarative sentences are the <b>most common type</b> used in everyday writing and speech.</p>'},
{lb:'Function, not structure',dr:dQ6,ht:'<p>"Declarative" describes a sentence\'s <b>function</b> (what it does), not its grammatical structure. A declarative sentence can be simple, compound, complex, or compound-complex.</p>'},
{lb:'Where declaratives are used',dr:dQ6,ht:'<p>Declarative sentences form the <b>backbone of essays, reports, and narratives</b> — used for narration, description, and explanation throughout WAEC/IGCSE writing.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What does a declarative sentence do?',o:['Makes a statement of fact or opinion','Asks a question','Gives a command','Expresses strong emotion only'],a:0,w:'A declarative sentence makes a statement of fact or opinion.'},{q:'What punctuation ends a declarative sentence?',o:['A full stop','A question mark','An exclamation mark always','No punctuation is needed'],a:0,w:'A declarative sentence ends with a full stop.'},{q:'Is "declarative" a description of structure or function?',o:['Function — what the sentence does','Structure — how many clauses it has','Neither; it is a punctuation mark','Both equally, with no distinction'],a:0,w:'"Declarative" describes function (making a statement), not grammatical structure.'},{q:'Can a declarative sentence also be complex in structure?',o:['Yes, e.g. "Although tired, she finished the report."','No, declarative sentences must always be simple','No, declarative sentences cannot have subordinate clauses','Only compound sentences can be declarative'],a:0,w:'A declarative sentence can be simple, compound, complex, or compound-complex in structure.'},{q:'Which sentence type is most common in everyday writing and speech?',o:['Declarative','Exclamatory','Imperative','Interrogative'],a:0,w:'Declarative sentences are the most common type used in everyday writing and speech.'},{q:'Which of these is a declarative sentence?',o:['"Lagos is the largest city in Nigeria."','"Is Lagos the largest city?"','"Visit Lagos today!"','"What a huge city!"'],a:0,w:'"Lagos is the largest city in Nigeria" states a fact — declarative.'},{q:'What kind of writing relies heavily on declarative sentences?',o:['Essays, reports and narratives','Only shopping lists','Only poetry','Only exclamatory speeches'],a:0,w:'Essays, reports and narratives rely heavily on declarative sentences for narration and explanation.'},{q:'What is the main purpose of a declarative sentence in an essay?',o:['To state facts, ideas or opinions clearly','To always ask the reader a question','To always give the reader a command','To always express extreme emotion'],a:0,w:'The main purpose of a declarative sentence is to state facts, ideas or opinions clearly.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Grammar',ti:'Interrogative Sentences',su:'Identify and construct sentences that ask questions.',steps:[
{lb:'Definition',dr:dQ7,ht:'<p>An <b>interrogative sentence</b> asks a <b>question</b> and ends with a <b>question mark (?)</b>.</p>'},
{lb:'Example',dr:dQ7,ht:'<p><b>"Have you finished your homework?"</b> Interrogative sentences often begin with a <b>wh- word</b> or an <b>auxiliary verb</b> (do, is, have, can).</p>'},
{lb:'Two common structures',dr:dQ7,ht:'<p><b>Wh- questions</b> begin with who, what, where, when, why, or how. <b>Yes/no questions</b> begin with an auxiliary verb: "Do you...?" "Is she...?" "Can they...?"</p>'},
{lb:'Rhetorical questions',dr:dQ7,ht:'<p>A <b>rhetorical question</b> is asked for effect, not to get an answer — a powerful device in speeches and persuasive writing to engage the reader directly.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What does an interrogative sentence do?',o:['Asks a question','States a fact','Gives a command','Expresses strong emotion'],a:0,w:'An interrogative sentence asks a question.'},{q:'What punctuation ends an interrogative sentence?',o:['A question mark','A full stop','An exclamation mark','A comma'],a:0,w:'An interrogative sentence ends with a question mark.'},{q:'Which word type often begins a "wh-" question?',o:['Who, what, where, when, why, how','Although, because, since','For, and, nor, but','Please, kindly, quickly'],a:0,w:'Wh- questions begin with words like who, what, where, when, why, how.'},{q:'What often begins a yes/no question?',o:['An auxiliary verb like "do," "is," or "can"','A subordinating conjunction','A FANBOYS word','An adjective'],a:0,w:'Yes/no questions typically begin with an auxiliary verb such as do, is, have, or can.'},{q:'What is a "rhetorical question"?',o:['A question asked for effect, not to get a literal answer','A question that is grammatically incorrect','A question only used in formal essays','A question with no question mark'],a:0,w:'A rhetorical question is asked for effect or persuasive impact, not to get a literal answer.'},{q:'Where is the rhetorical question a common device?',o:['Speeches and persuasive writing','Only scientific reports','Only shopping lists','Only recipes'],a:0,w:'Rhetorical questions are a common device in speeches and persuasive writing.'},{q:'Which of these is an interrogative sentence?',o:['"Have you finished your homework?"','"Finish your homework."','"You finished your homework."','"What a relief that homework is finished!"'],a:0,w:'"Have you finished your homework?" asks a question — interrogative.'},{q:'What effect does a rhetorical question have on a reader?',o:['It engages the reader and makes them think, without expecting a literal reply','It confuses the reader intentionally','It always demands an immediate written answer','It has no effect at all'],a:0,w:'A rhetorical question engages the reader and makes them think, without expecting a literal answer.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Grammar',ti:'Imperative Sentences',su:'Identify sentences giving commands, instructions or requests.',steps:[
{lb:'Definition',dr:dQ8,ht:'<p>An <b>imperative sentence</b> gives a <b>command, instruction, or request</b>. The subject "you" is <b>implied</b> rather than written.</p>'},
{lb:'Example',dr:dQ8,ht:'<p><b>"Close the door."</b> "Please sit down."</b> Imperative sentences typically start with the <b>base form of the verb</b> (the imperative form).</p>'},
{lb:'Two possible endings',dr:dQ8,ht:'<p>Imperatives can end with a <b>full stop</b> for a neutral instruction, or an <b>exclamation mark</b> for urgency: <b>"Stop."</b> vs <b>"Stop!"</b></p>'},
{lb:'Common uses',dr:dQ8,ht:'<p>Imperative sentences are common in <b>recipes, instructions, and speeches</b>, where the direct address to the reader creates a sense of urgency or clear guidance.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'What does an imperative sentence do?',o:['Gives a command, instruction or request','Asks a question','States a fact','Always expresses extreme emotion'],a:0,w:'An imperative sentence gives a command, instruction or request.'},{q:'What subject is implied but usually not written in an imperative sentence?',o:['"You"','"I"','"They"','"It"'],a:0,w:'The subject "you" is implied but not usually written in an imperative sentence.'},{q:'What form does the verb usually take at the start of an imperative sentence?',o:['The base form of the verb','The past tense form','The -ing form','The passive form'],a:0,w:'Imperative sentences typically begin with the base form of the verb.'},{q:'Which punctuation can an imperative sentence end with?',o:['A full stop or an exclamation mark','Only a question mark','Only a comma','Only a semicolon'],a:0,w:'An imperative sentence can end with a full stop (neutral) or an exclamation mark (urgent).'},{q:'Which of these is an imperative sentence?',o:['"Close the door."','"Is the door closed?"','"The door is closed."','"What a loud door!"'],a:0,w:'"Close the door" gives a command with an implied "you" — imperative.'},{q:'Where are imperative sentences especially common?',o:['Recipes, instructions and speeches','Only scientific abstracts','Only poetry','Only weather reports'],a:0,w:'Imperative sentences are especially common in recipes, instructions and speeches.'},{q:'What effect does direct imperative address create for the reader?',o:['A sense of urgency or clear guidance','Total confusion with no clear meaning','Only humour, never seriousness','No effect on the reader at all'],a:0,w:'Direct imperative address creates a sense of urgency or clear guidance for the reader.'},{q:'What is the difference between "Stop." and "Stop!"?',o:['"Stop!" conveys more urgency than the neutral "Stop."','There is no difference at all','"Stop." is not a real sentence','"Stop!" is not imperative'],a:0,w:'"Stop!" conveys more urgency through the exclamation mark than the neutral "Stop."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Grammar',ti:'Exclamatory Sentences',su:'Identify sentences expressing strong emotion or surprise.',steps:[
{lb:'Definition',dr:dQ9,ht:'<p>An <b>exclamatory sentence</b> expresses <b>strong emotion or surprise</b> and ends with an <b>exclamation mark (!)</b>.</p>'},
{lb:'Example',dr:dQ9,ht:'<p><b>"What a beautiful sunset!"</b> "I can\'t believe it!"</b> Exclamatory sentences often begin with <b>"What"</b> or <b>"How."</b></p>'},
{lb:'Use sparingly',dr:dQ9,ht:'<p>Overusing exclamation marks <b>weakens their impact</b> — in formal writing, examiners reward careful, deliberate use rather than frequent exclamation marks.</p>'},
{lb:'Where exclamatories are used',dr:dQ9,ht:'<p>Exclamatory sentences are effective in <b>descriptive and narrative writing</b> to convey emotion, but are rare or absent in formal reports and articles.</p>'},
