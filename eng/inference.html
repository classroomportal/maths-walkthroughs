.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}

.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}

.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}

.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}

function shuffleMC(o){var idxs=o.options.map(function(_,i){return i;});for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}var newOptions=idxs.map(function(i){return o.options[i];});return{question:o.question,options:newOptions,correct:idxs.indexOf(o.correct),working:o.working};}

document.addEventListener('click',function(e){

    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;

      allBtns[o.correct].classList.add('mc-correct');

    }

  }
});

{lb:'Key idea',dr:dQ1,ht:'<p><b>Inference</b> is the skill of using evidence in the text to work out meaning the writer has not stated directly — reading \'between the lines\'.</p>'},
{lb:'In practice',dr:dQ1,ht:'<p>The reader\'s role in inference is to <b>combine textual clues</b> — word choice, action, detail — with their own reasoning to reach a justified conclusion.</p>'},

nly their own imagination','Only the title of the text','Only punctuation marks'],a:0,w:'Inference combines specific textual clues with the reader\'s own reasoning.'},{q:'Why is inference an important reading skill for IGCSE?',o:['Much of a writer\'s meaning is implied rather than stated directly','All exam texts only ever contain explicit information','Inference questions never appear in exams','It replaces the need to read the text at all'],a:0,w:'Inference is essential because writers often imply meaning rather than stating it directly.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q3 &bull; English &bull; Reading',ti:'Evidence-Based Inference',su:'Support every inference with a specific quotation or reference.',steps:[
{lb:'Overview',dr:dQ3,ht:'<p>Every inference must be backed by a <b>quotation or specific reference</b> to the text — never left as an unsupported claim.</p>'},
{lb:'Key idea',dr:dQ3,ht:'<p><b>Precision</b> matters: choosing the exact word or phrase that triggers the inference is stronger than a vague reference to \'the passage\'.</p>'},
{lb:'In practice',dr:dQ3,ht:'<p>In exams, <b>unsupported inference loses credit</b> — examiners reward the reasoning that connects evidence to meaning, not just the conclusion itself.</p>'},
{lb:'Exam focus',dr:dQ3,ht:'<p>Quotations used for inference should usually be <b>short and precise</b>, followed by a clear explanation <b>linking the evidence back</b> to the inference being made.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'What must every inference be backed by?',o:['A quotation or specific reference to the text','A guess with no supporting detail','The reader\'s personal opinion only','Nothing — inferences require no evidence'],a:0,w:'Every inference must be supported by a specific quotation or reference to the text.'},{q:'Why does precision matter when choosing supporting evidence?',o:['The exact triggering word or phrase gives a stronger, sharper inference','Precision has no effect on the strength of an inference','Vague references are always preferred by examiners','Precision only matters in essay writing, not inference'],a:0,w:'A precise word or phrase creates a sharper, more convincing inference than a vague reference.'},{q:'What happens to unsupported inference in an exam?',o:['It loses credit, since reasoning must be linked to evidence','It always receives full marks regardless','It is treated the same as explicit information','It automatically becomes a valid answer'],a:0,w:'Unsupported inference loses credit because examiners reward evidence-based reasoning.'},{q:'How long should quotations used for inference typically be?',o:['Short and precise','As long as possible, ideally a full paragraph','Exactly one word only, never more','There is no need for any quotation at all'],a:0,w:'Quotations for inference should be short and precise rather than lengthy.'},{q:'What should follow a quotation used to support an inference?',o:['A clear explanation linking the evidence back to the inference','Nothing further — the quotation alone is sufficient','A completely unrelated new point','A repeat of the same quotation'],a:0,w:'The quotation should be followed by an explanation linking it clearly to the inference.'},{q:'Which is the stronger way to support an inference?',o:['\'The word "trembling" suggests she was nervous.\'','\'Somewhere in the text it says she was nervous.\'','\'I just think she was nervous.\'','\'She was definitely nervous, no evidence needed.\''],a:0,w:'Citing the precise word \'trembling\' gives a much stronger, evidence-based inference.'},{q:'What do examiners specifically reward in inference answers?',o:['The reasoning that connects evidence to meaning','Only the length of the answer','Only the number of quotations used','Answers with no reference to the text at all'],a:0,w:'Examiners reward the reasoning that clearly connects textual evidence to the inferred meaning.'},{q:'Why is a vague reference like \'somewhere in the passage\' weaker than a precise quotation?',o:['It fails to pinpoint the exact evidence supporting the inference','It is always more convincing than a precise quotation','It automatically gains full marks','Precision has no bearing on inference quality'],a:0,w:'A vague reference fails to pinpoint the specific evidence, weakening the inference.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 &bull; English &bull; Reading',ti:'Word Choice as a Clue',su:'Use connotation and word choice to unlock deeper meaning.',steps:[
{lb:'Overview',dr:dQ4,ht:'<p><b>Connotation</b> is the feeling or association a word carries beyond its literal dictionary meaning, or <b>denotation</b>.</p>'},
{lb:'Key idea',dr:dQ4,ht:'<p>Similar words can carry very different connotations — \'slender\' and \'skinny\' both describe thinness, but suggest very different attitudes.</p>'},
{lb:'In practice',dr:dQ4,ht:'<p><b>Verb choice</b> often carries strong emotional connotation: \'she walked\' versus \'she stumbled\' or \'she stormed\' each imply a very different state of mind.</p>'},
{lb:'Exam focus',dr:dQ4,ht:'<p>A useful inference technique is to <b>ask why</b> a writer chose this particular word rather than a more neutral alternative — the answer usually reveals implied meaning.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What is connotation?',o:['The feeling or association a word carries beyond its literal meaning','The exact dictionary definition of a word','The number of syllables in a word','A word\'s spelling in a different language'],a:0,w:'Connotation refers to the feelings or associations a word carries beyond its literal meaning.'},{q:'What is denotation?',o:['The literal, dictionary definition of a word','The emotional association of a word','A word used only in poetry','A synonym for inference'],a:0,w:'Denotation is the literal, dictionary definition of a word.'},{q:'Why might \'skinny\' and \'slender\' create different impressions despite similar meaning?',o:['They carry different connotations despite similar denotation','They have completely different dictionary definitions','They are not actually similar in meaning at all','Connotation never affects word choice'],a:0,w:'Despite similar literal meaning, \'skinny\' and \'slender\' carry very different connotations.'},{q:'What might the verb \'stormed\' suggest about how someone left a room?',o:['Anger or strong emotion, rather than a calm departure','Complete calm and contentment','No emotional state at all','Uncertainty about which room they left'],a:0,w:'\'Stormed\' carries strong connotations of anger, unlike a neutral word like \'left\'.'},{q:'What question helps unlock word-choice-based inference?',o:['\'Why did the writer choose this word rather than a neutral alternative?\'','\'How many letters does this word have?\'','\'Is this word a noun or a verb?\'','\'What is the word\'s exact dictionary spelling?\''],a:0,w:'Asking why a specific word was chosen over a neutral one helps reveal implied meaning.'},{q:'Which pair best demonstrates contrasting connotation for a similar idea?',o:['\'Curious\' vs \'nosy\'','\'Cat\' vs \'feline\'','\'Ten\' vs \'10\'','\'Quickly\' vs \'fast\''],a:0,w:'\'Curious\' and \'nosy\' describe similar behaviour but carry very different connotations.'},{q:'Why is verb choice particularly useful for inference?',o:['Verbs often carry strong emotional connotation about actions','Verbs never carry any connotation','Only adjectives can carry connotation','Verb choice has no link to a character\'s state of mind'],a:0,w:'Verbs frequently carry strong emotional connotation, revealing a character\'s state of mind.'},{q:'What does analysing connotation ultimately help a reader do?',o:['Infer meaning and attitude the writer has not stated directly','Find only the literal dictionary meaning of a text','Avoid making any inference at all','Identify only grammatical errors in a text'],a:0,w:'Analysing connotation helps readers infer implied meaning and attitude.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 &bull; English &bull; Reading',ti:'Inferring Character Feelings',su:'Work out emotional states from action, dialogue and description.',steps:[
{lb:'Overview',dr:dQ5,ht:'<p><b>Physical signs</b> — trembling hands, flushed cheeks, a lowered voice — often signal a character\'s emotional state without it being named directly.</p>'},
{lb:'Key idea',dr:dQ5,ht:'<p><b>Speech patterns</b> also reveal feeling: short, clipped sentences, interruptions, or sudden silence can suggest tension, distress, or hesitation.</p>'},
{lb:'In practice',dr:dQ5,ht:'<p>A <b>contradiction</b> between what a character says and what they do — smiling while gripping a chair tightly — is a particularly strong inference clue.</p>'},
{lb:'Exam focus',dr:dQ5,ht:'<p>Be <b>cautious</b>: only infer an emotion the text genuinely supports with evidence — avoid naming a feeling the details don\'t actually justify.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What physical signs might suggest a character\'s emotion?',o:['Trembling hands, flushed cheeks, a lowered voice','The colour of their clothing only','The number of siblings they have','Their exact age in years'],a:0,w:'Physical signs like trembling or flushed cheeks often signal emotion indirectly.'},{q:'How might speech patterns reveal a character\'s feelings?',o:['Short sentences, interruptions or silence can suggest tension or distress','Speech patterns never reveal any emotion','Only long, calm sentences reveal emotion','Punctuation has no link to speech patterns'],a:0,w:'Short sentences, interruptions, or silence can suggest tension, distress, or hesitation.'},{q:'Why is a contradiction between words and actions a strong inference clue?',o:['It suggests a hidden feeling different from what is being expressed outwardly','Contradictions are always accidental and meaningless','It means the character is definitely lying about everything','It has no relevance to inferring emotion'],a:0,w:'A contradiction between speech and action often signals a hidden underlying emotion.'},{q:'What can a character\'s reaction to others reveal?',o:['Their inner emotional state','Only their physical height','The setting of the story','The genre of the text'],a:0,w:'How a character responds to others can reveal their inner emotional state.'},{q:'What caution should a reader take when inferring emotion?',o:['Avoid naming a feeling the text doesn\'t actually support with evidence','Always name the most extreme emotion possible','Ignore all textual evidence when guessing emotion','Assume every character feels the same way'],a:0,w:'Readers should avoid inferring an emotion that isn\'t genuinely supported by evidence.'},{q:'\'He answered in short, clipped sentences, avoiding her eyes\' suggests what?',o:['Discomfort or tension','Complete relaxation and ease','Total honesty with no hesitation','Boredom with the conversation'],a:0,w:'Short, clipped sentences and avoided eye contact suggest discomfort or tension.'},{q:'Why might a character smiling while gripping a chair tightly be significant?',o:['The contradiction suggests hidden tension behind an outward calm','It shows the character is completely relaxed','It has no relevance to inference','It shows the character dislikes chairs'],a:0,w:'The contradiction between the smile and the tight grip suggests hidden tension.'},{q:'What is the risk of over-interpreting a character\'s emotion?',o:['Naming a feeling the text does not actually support with evidence','Being too precise with textual evidence','Quoting the text too accurately','Avoiding emotional inference altogether'],a:0,w:'Over-interpretation risks naming an emotion the evidence does not genuinely support.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 &bull; English &bull; Reading',ti:'Inferring Atmosphere and Setting',su:'Use description of place to infer mood and unstated meaning.',steps:[
{lb:'Overview',dr:dQ6,ht:'<p>Description of <b>light and colour</b> — a bright, sunlit room versus a dim, shadowy one — shapes atmosphere and can hint at underlying mood.</p>'},
{lb:'Key idea',dr:dQ6,ht:'<p><b>Sound, or its absence</b>, is equally telling — an unsettling silence can suggest tension just as effectively as loud noise suggests chaos.</p>'},
{lb:'In practice',dr:dQ6,ht:'<p><b>Weather</b> is often used to mirror emotional tone — a storm building can foreshadow conflict, while stillness can suggest calm or eerie anticipation.</p>'},
{lb:'Exam focus',dr:dQ6,ht:'<p>When natural elements directly mirror human emotion, this is called <b>pathetic fallacy</b> — a powerful device for implying feeling without stating it directly.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'How can light and colour shape atmosphere in a text?',o:['Bright, sunlit scenes and dim, shadowy ones create different moods','Light and colour have no effect on a reader\'s sense of mood','Only colour affects mood, never light','Atmosphere cannot be created through description'],a:0,w:'Light and colour choices shape the mood a scene creates for the reader.'},{q:'How might silence be used to suggest atmosphere?',o:['An unsettling silence can suggest tension','Silence always suggests happiness','Silence has no effect on atmosphere','Only loud noise can create atmosphere'],a:0,w:'Silence, especially when unexpected, can suggest tension just as strongly as noise.'},{q:'What is \'pathetic fallacy\'?',o:['Nature or weather reflecting human emotion','A grammatical error in a sentence','A type of closed question','A factual mistake in non-fiction writing'],a:0,w:'Pathetic fallacy is when nature or weather is used to reflect human emotion.'},{q:'What might a building storm foreshadow in a narrative?',o:['Upcoming conflict or emotional turmoil','Guaranteed happiness for all characters','The end of the story with no further events','Nothing — weather has no symbolic function'],a:0,w:'A building storm often foreshadows conflict or emotional turmoil ahead.'},{q:'How might a cramped, narrow setting affect atmosphere?',o:['It can suggest feelings of confinement or unease','It always suggests freedom and openness','Setting size has no effect on atmosphere','It only affects the setting\'s temperature'],a:0,w:'A cramped, narrow setting can suggest confinement, unease, or restriction.'},{q:'Which of these best demonstrates pathetic fallacy?',o:['\'The sky darkened as her mood soured.\'','\'The sky was blue and clear all day.\'','\'The character walked into a room.\'','\'The character said hello politely.\''],a:0,w:'The darkening sky mirroring the character\'s mood is a clear example of pathetic fallacy.'},{q:'Why is setting description useful for inference?',o:['It can imply mood and feeling without stating it directly','Setting description never carries any implied meaning','Only dialogue can be used for inference','Setting has no connection to a text\'s atmosphere'],a:0,w:'Setting description is a key tool for implying mood and feeling indirectly.'},{q:'What effect does a vast, open setting often create compared to a cramped one?',o:['A sense of freedom or exposure, rather than confinement','Identical effects in every case','No effect on atmosphere whatsoever','Only a change in weather, nothing else'],a:0,w:'A vast, open setting often suggests freedom or exposure, contrasting with a cramped one.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 &bull; English &bull; Reading',ti:'Multiple Valid Inferences',su:'Recognise that a single piece of evidence can support more than one reading.',steps:[
{lb:'Overview',dr:dQ7,ht:'<p>Some pieces of evidence genuinely support <b>more than one valid inference</b> — texts are often deliberately ambiguous or layered in meaning.</p>'},
{lb:'Key idea',dr:dQ7,ht:'<p>Two different inferences <b>can both be valid</b>, as long as each is clearly grounded in the same piece of textual evidence.</p>'},
{lb:'In practice',dr:dQ7,ht:'<p>The <b>strongest exam answers</b> sometimes acknowledge more than one possible reading, showing sophisticated understanding of the text\'s complexity.</p>'},
{lb:'Exam focus',dr:dQ7,ht:'<p>In practice, it\'s usually best to state the <b>most likely inference first</b>, with clear justification, rather than listing every conceivable possibility without focus.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'Can a single piece of evidence support more than one valid inference?',o:['Yes, some evidence is genuinely ambiguous or layered','No, only one inference is ever possible for any evidence','No, only explicit statements can be interpreted','Yes, but only in poetry, never prose'],a:0,w:'Some evidence genuinely supports more than one valid, well-grounded inference.'},{q:'What makes two different inferences from the same evidence both valid?',o:['Each is clearly grounded in the same textual evidence','Only if the reader personally prefers both','Neither inference actually needs any evidence','Only if the two inferences directly contradict each other'],a:0,w:'Two inferences can both be valid if each is genuinely supported by the same evidence.'},{q:'What do the strongest exam answers sometimes do with ambiguous evidence?',o:['Acknowledge more than one possible reading','Ignore the ambiguity completely','State that the text has no meaning at all','Refuse to answer the question'],a:0,w:'Strong answers can acknowledge multiple valid readings, showing depth of understanding.'},{q:'What is a sensible exam approach when evidence allows multiple readings?',o:['State the most likely inference first, with clear justification','List every possible inference with no focus','Avoid answering the question entirely','Choose an inference with no supporting evidence'],a:0,w:'A focused approach — leading with the most likely, justified inference — is usually strongest.'},{q:'Does \'multiple valid inferences\' mean any reading of a text is acceptable?',o:['No — not every possible reading is equally supported by evidence','Yes, any reading at all is always acceptable','Yes, evidence is irrelevant once ambiguity exists','No, only one single reading is ever allowed'],a:0,w:'Not every reading is equally valid — each must still be grounded in evidence.'},{q:'Why might a text be deliberately ambiguous?',o:['To create layered meaning that rewards careful, evidence-based reading','Because the writer made an accidental mistake','Because ambiguity is always a flaw in writing','Because all texts are required to be ambiguous'],a:0,w:'Deliberate ambiguity can create layered meaning that rewards careful, evidence-based reading.'},{q:'What links two different but equally valid inferences from one detail?',o:['Both are supported by the same evidence, interpreted in different ways','Neither is actually connected to the text','They must always contradict the same piece of evidence','They can never both be correct'],a:0,w:'Multiple valid inferences share the same evidential basis, interpreted from different angles.'},{q:'What is the risk of listing too many possible inferences with no focus?',o:['The answer can seem unfocused and less convincing','It automatically raises the mark of the answer','It removes the need for supporting evidence','It has no effect on how the answer reads'],a:0,w:'An unfocused list of every possible inference can weaken the overall clarity of an answer.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 &bull; English &bull; Reading',ti:'Avoiding Over-Inference',su:'Recognise when a conclusion goes beyond what the evidence supports.',steps:[
{lb:'Overview',dr:dQ8,ht:'<p><b>Over-inference</b> happens when a reader draws a conclusion the text genuinely doesn\'t support — going beyond what the evidence can justify.</p>'},
{lb:'Key idea',dr:dQ8,ht:'<p>A useful <b>warning sign</b>: if you can\'t point to a specific word or phrase that triggers your inference, it may be over-inference rather than a grounded reading.</p>'},
{lb:'In practice',dr:dQ8,ht:'<p>A common trap is assuming detail based on <b>stereotype or assumption</b> rather than what the text actually says — this weakens the validity of an answer.</p>'},
{lb:'Exam focus',dr:dQ8,ht:'<p>The fix is to <b>return to the text</b> and check whether the claim genuinely holds up against the actual words used — <b>confidence alone</b> is never a substitute for real evidence.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'What is over-inference?',o:['Drawing a conclusion the text doesn\'t actually support','Correctly identifying explicit information','Using precise textual evidence to support a claim','Reading a text more than once'],a:0,w:'Over-inference means going beyond what the evidence in the text can actually justify.'},{q:'What is a useful warning sign for over-inference?',o:['Being unable to point to a specific word or phrase supporting the claim','Being able to quote the exact evidence used','Reading the text multiple times before answering','Using short, precise quotations'],a:0,w:'If you can\'t identify specific supporting evidence, the inference may be over-reaching.'},{q:'What is a common trap that leads to over-inference?',o:['Assuming detail based on stereotype rather than the text itself','Quoting the text too precisely','Reading the passage too many times','Using evidence that is too specific'],a:0,w:'Assuming detail from stereotype rather than the actual text is a common cause of over-inference.'},{q:'What is the fix for a potentially over-inferred claim?',o:['Return to the text and check whether the claim genuinely holds up','Ignore the text and trust the first instinct','Add more confident language to the answer','Remove all evidence from the answer'],a:0,w:'Checking the claim against the actual text helps confirm or correct a potential over-inference.'},{q:'Why is confidence alone not enough to justify an inference?',o:['A confident-sounding answer still needs real textual support','Confidence always guarantees a correct inference','Evidence is unnecessary if the answer sounds certain','Confidence replaces the need for quotation'],a:0,w:'Even a confidently worded answer needs genuine textual evidence to be valid.'},{q:'Which of these is most likely an example of over-inference?',o:['Assuming a character is wealthy simply because they wear a coat, with no other evidence','Inferring nervousness from trembling hands mentioned in the text','Inferring anger from a described clenched fist','Inferring sadness from a quoted line of dialogue'],a:0,w:'Assuming wealth from a coat alone, without further textual support, is a case of over-inference.'},{q:'How can a reader check whether an inference is justified?',o:['By locating the exact evidence in the text that supports it','By assuming it is correct without checking','By comparing it to a stereotype instead of the text','By ignoring the text and relying on general knowledge'],a:0,w:'Locating the exact supporting evidence in the text is how an inference is checked for validity.'},{q:'Why does over-inference weaken an exam answer?',o:['It draws conclusions the text cannot actually support with evidence','It always demonstrates deeper understanding of the text','It automatically strengthens the argument being made','It is identical to correctly grounded inference'],a:0,w:'Over-inference weakens an answer because its conclusions are not genuinely supported by the text.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 &bull; English &bull; Reading',ti:'Structuring an Inference Answer',su:'Use a clear point-evidence-explanation structure for inference questions.',steps:[
{lb:'Overview',dr:dQ9,ht:'<p>A clear inference answer starts with a <b>point</b> — stating the inference directly, e.g. \'The character appears anxious.\'</p>'},
{lb:'Key idea',dr:dQ9,ht:'<p>This is followed by <b>evidence</b> — a short, precise quotation from the text that supports the point being made.</p>'},
{lb:'In practice',dr:dQ9,ht:'<p>The answer must then <b>explain</b> how the evidence supports the inference — connecting the specific word or detail to the meaning being drawn from it.</p>'},
{lb:'Exam focus',dr:dQ9,ht:'<p>Strong answers push for <b>depth</b>, explaining not just what is inferred but <b>why</b> the evidence suggests it — while staying precisely focused on what the question actually asks.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'What should the \'Point\' stage of an inference answer do?',o:['State the inference clearly and directly','Give a long, unrelated quotation','Restate the question word for word','Avoid stating any conclusion at all'],a:0,w:'The Point stage clearly and directly states the inference being made.'},{q:'What should the \'Evidence\' stage provide?',o:['A short, precise quotation from the text','A vague, unreferenced summary','The reader\'s own unrelated opinion','No quotation at all'],a:0,w:'The Evidence stage should provide a short, precise supporting quotation.'},{q:'What is the purpose of the \'Explain\' stage?',o:['To connect the evidence clearly to the meaning being inferred','To repeat the quotation a second time','To introduce a completely new, unrelated point','To end the answer immediately'],a:0,w:'The Explain stage connects the evidence to the inferred meaning, showing the reasoning.'},{q:'What should a strong inference answer explain beyond the obvious?',o:['Why the evidence suggests the inference, not just what is inferred','Only the page number where the evidence appears','Only the author\'s full name','Nothing further than the initial point'],a:0,w:'Strong answers explain why the evidence supports the inference, adding depth.'},{q:'What structure is commonly used for inference answers?',o:['Point, Evidence, Explain','Only a single unsupported statement','A list of unrelated facts','A structure with no evidence required'],a:0,w:'The Point-Evidence-Explain (P-E-E) structure is a common, effective approach.'},{q:'Why should an inference answer stay precisely focused on the question asked?',o:['Straying from the question can lose relevant marks','Straying always improves the depth of an answer','The question asked is never actually relevant','Precision has no bearing on exam marks'],a:0,w:'Staying precisely focused on the question avoids losing marks for irrelevant content.'},{q:'Which of these best demonstrates a full P-E-E inference answer?',o:['\'The character seems nervous. The text says her hands were "trembling," which suggests she is struggling to stay calm.\'','\'The character seems nervous.\'','\'Her hands were trembling.\'','\'I think she felt something.\''],a:0,w:'This example clearly states the point, gives precise evidence, and explains the connection — full P-E-E.'},{q:'Why is the \'Explain\' step essential, not optional?',o:['Without it, the evidence and the inference remain unconnected for the reader','It is entirely optional and can always be skipped','It replaces the need for any evidence','It only matters in creative writing, not inference'],a:0,w:'The Explain step is essential because it makes the link between evidence and inference clear.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 &bull; English &bull; Reading',ti:'Mixed Review — Inference',su:'Bring together evidence, connotation, character and structure.',steps:[
{lb:'Overview',dr:dQ10,ht:'<p><b>Inference</b> is the skill of working out meaning a writer has not stated directly, always grounded in specific evidence from the text.</p>'},
{lb:'Key idea',dr:dQ10,ht:'<p>Clues for inference come from many sources: <b>word choice and connotation</b>, character <b>action</b>, <b>setting</b> and atmosphere, and contradictions between speech and behaviour.</p>'},
{lb:'In practice',dr:dQ10,ht:'<p>Every inference needs precise <b>textual support</b> — a short quotation or clear reference — and should avoid <b>over-inference</b> that goes beyond what the evidence justifies.</p>'},
{lb:'Exam focus',dr:dQ10,ht:'<p>The clearest inference answers follow a <b>Point-Evidence-Explain</b> structure, staying focused precisely on what the question is actually asking.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'What does inference always require, according to this topic?',o:['Grounding in specific evidence from the text','No evidence at all, only imagination','A dictionary definition of every word','Agreement from every reader'],a:0,w:'Inference must always be grounded in specific evidence from the text.'},{q:'Which of these is NOT typically a source of inference clues?',o:['The page number of the text','Word choice and connotation','A character\'s actions','Setting and atmosphere'],a:0,w:'Page number carries no meaning; word choice, action, and setting are genuine inference sources.'},{q:'What must support every inference in a strong answer?',o:['A precise piece of textual evidence','Nothing — inference needs no support','Only the reader\'s personal feelings','A comparison to another unrelated text'],a:0,w:'Every inference must be supported by a precise piece of textual evidence.'},{q:'What should a reader avoid when making an inference?',o:['Over-inference that goes beyond what the evidence supports','Using any evidence from the text at all','Explaining how evidence connects to meaning','Reading the text carefully before answering'],a:0,w:'Readers should avoid over-inference — conclusions the evidence cannot actually support.'},{q:'What structure is recommended for a clear inference answer?',o:['Point, Evidence, Explain','Evidence only, with no explanation','A single unsupported opinion','A list of every possible inference'],a:0,w:'The Point-Evidence-Explain structure creates a clear, well-supported inference answer.'},{q:'How does connotation contribute to inference?',o:['It reveals feeling or attitude beyond a word\'s literal meaning','It only ever provides the literal dictionary meaning','It has no link to inference at all','It only applies to poetry'],a:0,w:'Connotation reveals implied feeling or attitude, contributing directly to inference.'},{q:'Why is a contradiction between speech and action a useful inference clue?',o:['It can suggest a hidden feeling different from what is being expressed','Contradictions are always meaningless in a text','It proves a character is always lying','It has no bearing on emotional inference'],a:0,w:'A contradiction between speech and action often points to a hidden underlying emotion.'},{q:'What is the overall skill inference questions are testing?',o:['The ability to justify unstated meaning using precise textual evidence','The ability to copy text directly with no interpretation','The ability to ignore the text and use outside knowledge','The ability to write the longest possible answer'],a:0,w:'Inference questions test the ability to justify unstated meaning using precise textual evidence.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
