var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function shuffleMC(o){
  if(!o||!o.options)return o;
  var idxs=[];for(var k=0;k<o.options.length;k++){idxs.push(k);}
  for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=idxs[i];idxs[i]=idxs[j];idxs[j]=tmp;}
  var newOptions=[];for(var m=0;m<idxs.length;m++){newOptions.push(o.options[idxs[m]]);}
  var newCorrect=idxs.indexOf(o.correct);
  var o2={};for(var key in o){if(o.hasOwnProperty(key))o2[key]=o[key];}
  o2.options=newOptions;o2.correct=newCorrect;
  return o2;
}
function tryItMC(genFn){var wrapped=function(){return shuffleMC(genFn());};var id='t'+Math.random().toString(36).slice(2);var o=wrapped();ST[id]={o:o,genFn:wrapped,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});

var QS=[
{ey:'Q1 • Gov • ELE',ti:'What is an Electoral System?',su:'Define an electoral system and see why the choice of rules matters.',steps:[
{lb:'Definition',dr:dQ1,ht:'<p>An <b>electoral system</b> is the set of rules that determines how votes cast by citizens are translated into winners or seats in government. It covers: how ballots are cast, how votes are counted, and what threshold a candidate or party needs to win.</p>'},
{lb:'Why the choice of system matters',dr:dQ1,ht:'<p>The SAME votes can produce very different results under different electoral systems. A party that wins 30% of votes nationwide might win almost no seats under one system, but a proportionate share of seats under another. This is why electoral system design is itself a major political decision.</p>'},
{lb:'The main families of electoral system',dr:dQ1,ht:'<p>Three broad families: (1) <b>First-Past-The-Post (FPTP)</b> — whoever gets the most votes in a constituency wins, used in Nigeria and the UK. (2) <b>Proportional Representation (PR)</b> — seats are shared out to match each party’s vote share, used in South Africa and much of Europe. (3) <b>Mixed systems</b> — combine elements of both, e.g. Germany.</p>'},
{lb:'What Nigeria uses',dr:dQ1,ht:'<p>Nigeria uses <b>FPTP</b> for the presidency, National Assembly, governorship and State Houses of Assembly — with one important addition for the presidency: a special <b>25% distribution rule</b> across the states (covered later in this topic).</p>'},
{lb:'What makes an election free and fair?',dr:dQ1,ht:'<p>Regardless of which system is used, a credible election needs: universal adult suffrage; a secret ballot; an independent umpire (INEC in Nigeria); transparent counting and collation; and an accessible route to challenge results (electoral petition tribunals).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'An electoral system is best defined as:',o:['A political party\'s manifesto','The set of rules for how votes are translated into winners or seats','A list of registered voters','The date on which an election is held'],a:1,w:'An electoral system is the set of rules translating cast votes into winners or seats — not the parties, voter lists, or dates themselves.'},{q:'Why does the choice of electoral system matter?',o:['It has no real effect on outcomes','The same votes can produce very different results under different systems','It only affects how ballots look, not who wins','All electoral systems always produce identical results'],a:1,w:'The same set of votes can produce very different winners/seat totals depending on the electoral system used — this is why the choice matters so much.'},{q:'Which of these is one of the three main families of electoral system?',o:['Proportional Representation (PR)','Monarchical Representation','Judicial Representation','Religious Representation'],a:0,w:'The three main families are First-Past-The-Post (FPTP), Proportional Representation (PR), and Mixed systems.'},{q:'Which electoral system does Nigeria mainly use?',o:['Pure Proportional Representation','First-Past-The-Post (FPTP), with a special rule for the presidency','A fully mixed system like Germany\'s','A system where parties simply appoint their own representatives'],a:1,w:'Nigeria mainly uses FPTP, with an additional 25%-in-24-states distribution requirement for the presidency.'},{q:'Which of these is NOT a requirement of a free and fair election?',o:['Universal adult suffrage','A secret ballot','An independent electoral umpire','Only government officials being allowed to vote'],a:3,w:'Restricting voting to government officials would be the opposite of universal suffrage — a core requirement of a free and fair election.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 • Gov • ELE',ti:'First-Past-The-Post (FPTP)',su:'Understand how FPTP works and its main strengths and weaknesses.',steps:[
{lb:'How FPTP works',dr:dQ2,ht:'<p>Under <b>First-Past-The-Post</b>, each constituency elects one winner: whoever receives the most votes wins that seat, even without an overall majority. This is sometimes called a "plurality" system.</p>'},
{lb:'Worked example',dr:dQ2,ht:'<p>Imagine three candidates contest a seat: Candidate A gets 42%, Candidate B gets 35%, Candidate C gets 23%. Under FPTP, Candidate A wins — despite 58% of voters preferring someone else.</p>'},
{lb:'The result',dr:dQ2,ht:'<p>This example shows FPTP\'s central feature: a candidate can win comfortably with a <b>plurality</b> (the most votes) rather than a <b>majority</b> (more than half the votes).</p>'},
{lb:'Advantages of FPTP',dr:dQ2,ht:'<p>Advantages: (1) Simple to understand and count. (2) Usually produces a clear, decisive winner. (3) Creates a direct constituency link between representative and voters. (4) Tends to produce stable, single-party majorities in parliament.</p>'},
{lb:'Disadvantages of FPTP',dr:dQ2,ht:'<p>Disadvantages: (1) Winners can take office with well under half the vote. (2) Votes for losing candidates effectively count for nothing ("wasted votes"). (3) Smaller parties are usually under-represented relative to their vote share. (4) Can encourage tactical voting rather than voting for a genuinely preferred candidate.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Under FPTP, a candidate wins a seat by:',o:['Receiving more than 50% of the vote','Receiving the most votes, even without a majority','Being selected by their party leadership','Receiving the most votes in every constituency nationwide'],a:1,w:'FPTP is a plurality system: the candidate with the most votes wins, even if that is well under 50%.'},{q:'In the worked example (42%, 35%, 23%), who wins under FPTP?',o:['Candidate B, because they are the compromise choice','Candidate C, because they have the fewest votes','Candidate A, because they have the most votes','No one — a run-off is always required'],a:2,w:'Candidate A wins with 42% — the most votes, even though 58% of voters chose someone else.'},{q:'Which of these is a genuine ADVANTAGE of FPTP?',o:['It always produces perfectly proportional results','It usually produces a clear, decisive single winner','It eliminates the possibility of tactical voting','It guarantees every party gets seats matching its vote share'],a:1,w:'FPTP\'s main strength is that it usually produces a clear, decisive winner and stable single-party majorities.'},{q:'A "wasted vote" under FPTP refers to:',o:['A vote cast for a candidate who does not win the seat','A vote that is spoiled or invalid','A vote cast by someone who is not registered','A vote cast after the polls have closed'],a:0,w:'Votes cast for any candidate who does not win are sometimes called "wasted" because they contribute nothing to the final outcome under FPTP.'},{q:'Which of these is a genuine DISADVANTAGE of FPTP?',o:['It is too complicated for voters to understand','Smaller parties are usually under-represented relative to their vote share','It never produces a clear winner','It requires proportional vote counting, which is expensive'],a:1,w:'A key criticism of FPTP is that smaller parties\' vote shares are not reflected proportionally in the seats they win.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 • Gov • ELE',ti:'Proportional Representation and Mixed Systems',su:'Compare PR and mixed systems with FPTP.',steps:[
{lb:'How PR works',dr:dQ3,ht:'<p>Under <b>Proportional Representation</b>, seats in a legislature are awarded to match each party\'s share of the vote as closely as possible. A party winning 30% of the vote should win roughly 30% of the seats.</p>'},
{lb:'Party list PR',dr:dQ3,ht:'<p>The most common form is <b>party list PR</b>: voters choose a party (rather than an individual candidate), and each party allocates seats from a pre-prepared list of candidates, in order, based on how many seats it wins.</p>'},
{lb:'Mixed systems',dr:dQ3,ht:'<p><b>Mixed systems</b> combine FPTP constituencies with a PR "top-up" layer, aiming to keep the constituency link of FPTP while correcting some of its disproportionality. <b>Germany</b> is a well-known example: voters cast one vote for a local constituency MP and one for a party list.</p>'},
{lb:'The core trade-off',dr:dQ3,ht:'<p>The fundamental trade-off in electoral system design: <b>FPTP</b> favours strong, decisive, easily-formed governments; <b>PR</b> favours a fairer match between votes cast and seats won, but can produce coalition governments and more fragmented parliaments.</p>'},
{lb:'Applying this to Nigeria',dr:dQ3,ht:'<p>Nigeria has stayed with FPTP rather than adopting PR. Advocates of reform sometimes argue PR would better represent Nigeria\'s many smaller parties and ethnic/regional interests; defenders of FPTP argue it produces clearer accountability and more stable government — important given Nigeria\'s history of political instability.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'Under Proportional Representation, seats are allocated:',o:['Entirely at random among all registered parties','To match each party\'s share of the vote as closely as possible','Only to the single party with the most votes nationwide','By the president, after consulting party leaders'],a:1,w:'PR aims to match each party\'s seat share to its vote share, unlike FPTP where the seat winner takes everything in each constituency.'},{q:'Under "party list" PR, voters typically choose:',o:['An individual candidate only, with no reference to party','A party, which then allocates seats from its own prepared list','Two separate candidates from different parties','The country\'s president directly'],a:1,w:'In party list PR, voters usually choose a party, and the party fills its allotted seats from a pre-prepared candidate list, in order.'},{q:'A "mixed" electoral system, as used in Germany, typically combines:',o:['Two different PR systems with no FPTP element','FPTP constituencies with a PR "top-up" layer','A monarchy with an elected parliament','Compulsory voting with voluntary candidacy'],a:1,w:'Mixed systems like Germany\'s combine FPTP constituency seats with a proportional "top-up" layer, aiming to balance decisiveness with fairness.'},{q:'The central trade-off between FPTP and PR is best described as:',o:['FPTP favours decisive government; PR favours a fairer votes-to-seats match','FPTP is always fairer; PR is always less democratic','PR always produces dictatorships; FPTP always produces democracies','There is no meaningful difference between FPTP and PR in practice'],a:0,w:'FPTP tends to produce strong, decisive single-party government; PR tends to produce a fairer match between vote share and seat share, often at the cost of more coalition government.'},{q:'Nigeria\'s continued use of FPTP rather than PR is often defended on the grounds that FPTP:',o:['Guarantees every ethnic group an equal number of seats','Produces clearer accountability and more stable government','Is required by the United Nations for all federations','Automatically eliminates all electoral malpractice'],a:1,w:'Defenders of FPTP in Nigeria argue it produces clearer accountability (one MP per constituency) and more stable, decisive government — valuable given Nigeria\'s history of instability.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 • Gov • ELE',ti:'Nigeria\'s Presidential Election Rule',su:'Examine the unique 25%-in-24-states requirement for winning the presidency.',steps:[
{lb:'Section 134 of the 1999 Constitution',dr:dQ4,ht:'<p>Nigeria\'s presidential elections are governed by <b>Section 134</b> of the 1999 Constitution, which sets a stricter test than simple FPTP for the country\'s highest office.</p>'},
{lb:'Condition one: most votes nationwide',dr:dQ4,ht:'<p>To win outright, a candidate must first receive the <b>highest number of votes</b> cast nationwide — the basic FPTP condition.</p>'},
{lb:'Condition two: the 25% spread rule',dr:dQ4,ht:'<p>The candidate must ALSO receive <b>at least 25% of the votes</b> in at least <b>24 of Nigeria\'s 36 states</b> (two-thirds of the states). This prevents a candidate from winning purely on the strength of one region.</p>'},
{lb:'Both conditions, or a run-off',dr:dQ4,ht:'<p>Both conditions must be satisfied together. If no candidate meets both, a <b>run-off election</b> is held between the top two candidates. Nigeria has never yet needed a run-off, but the rule shapes how candidates campaign nationally rather than regionally.</p>'},
{lb:'Why this rule exists',dr:dQ4,ht:'<p>The 25% rule was designed to ensure the president has genuinely <b>national</b>, cross-regional support in a country with over 250 ethnic groups — rather than being elected by one region or ethnic bloc alone. It is one of the key ways Nigeria\'s electoral system differs from simple FPTP.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'Nigeria\'s presidential election rules are set out in which part of the Constitution?',o:['Section 2','Section 134 of the 1999 Constitution','The Second Schedule (Exclusive List)','The Electoral Act 2022 only, with no constitutional basis'],a:1,w:'Section 134 of the 1999 Constitution sets out the conditions a presidential candidate must meet to win outright.'},{q:'To win the Nigerian presidency outright, a candidate must get the most votes nationwide AND:',o:['Win a majority in the Senate','At least 25% of votes in at least 24 of the 36 states','The personal endorsement of the outgoing president','A minimum of 60% of the total national vote'],a:1,w:'The candidate must also secure at least 25% of the vote in at least 24 of Nigeria\'s 36 states — both conditions are required.'},{q:'If no presidential candidate meets both conditions in Section 134, what happens?',o:['The National Assembly chooses the president instead','The election is cancelled and re-run entirely from scratch a year later','A run-off election is held between the top two candidates','The sitting president automatically remains in office'],a:2,w:'If no candidate satisfies both conditions, Section 134 requires a run-off election between the top two candidates.'},{q:'Why does Nigeria require 25% support across 24 states rather than just the most votes nationwide?',o:['To make elections take longer and more expensive','To ensure the president has genuinely national, cross-regional support','To guarantee that only northern candidates can win','To reduce the number of registered political parties'],a:1,w:'The 25%-in-24-states rule ensures a president cannot be elected on the strength of one region or ethnic bloc alone, encouraging genuinely national campaigning.'},{q:'As of the most recent elections, how many times has Nigeria needed a presidential run-off under this rule?',o:['Never — no run-off has yet been required','Once, in 1999','Twice, in 2015 and 2019','Every election since 1999'],a:0,w:'Nigeria has never yet required a presidential run-off — a winning candidate has always met both conditions in Section 134.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 • Gov • ELE',ti:'INEC — Role and Functions',su:'Examine the Independent National Electoral Commission\'s role in Nigeria\'s elections.',steps:[
{lb:'What INEC is',dr:dQ5,ht:'<p>The <b>Independent National Electoral Commission (INEC)</b> is the federal body responsible for organising, conducting and supervising elections in Nigeria, established under Section 153 and the Third Schedule of the 1999 Constitution.</p>'},
{lb:'Voter registration',dr:dQ5,ht:'<p>INEC registers eligible voters and issues <b>Permanent Voter Cards (PVCs)</b>. This is the foundation of the whole electoral process — without an accurate voter register, elections cannot be credible.</p>'},
{lb:'Delimitation and party regulation',dr:dQ5,ht:'<p>INEC also handles <b>delimitation</b> (drawing and reviewing constituency boundaries) and <b>party registration</b> — it can register new political parties and, in cases of serious non-compliance, deregister existing ones.</p>'},
{lb:'Conducting and declaring elections',dr:dQ5,ht:'<p>INEC conducts presidential, National Assembly, gubernatorial and State House of Assembly elections, and its Returning Officers formally <b>declare winners</b> at each level. (Local government elections are instead run by State Independent Electoral Commissions — SIECs.)</p>'},
{lb:'Independence and its limits',dr:dQ5,ht:'<p>INEC is designed to be constitutionally independent of the government of the day, but critics point to funding dependence on the federal executive and occasional political pressure as ongoing challenges to its true independence.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'INEC is established under which part of Nigeria\'s 1999 Constitution?',o:['Section 153 and the Third Schedule','The Electoral Act 2022 only','Section 2 (declaring Nigeria one sovereign state)','The Land Use Act'],a:0,w:'INEC\'s constitutional basis is Section 153 and the Third Schedule of the 1999 Constitution.'},{q:'What document does INEC issue to registered voters?',o:['A National Identity Number (NIN) card','A Permanent Voter Card (PVC)','A tax identification certificate','A driver\'s licence'],a:1,w:'INEC issues the Permanent Voter Card (PVC) to registered voters as proof of registration and eligibility to vote.'},{q:'"Delimitation", one of INEC\'s functions, refers to:',o:['Setting the national minimum wage','Drawing and reviewing constituency boundaries','Approving the national budget','Appointing state governors'],a:1,w:'Delimitation is the process of drawing (and periodically reviewing) the boundaries of electoral constituencies.'},{q:'Which body conducts LOCAL GOVERNMENT elections in Nigeria — not INEC?',o:['The National Assembly','SIECs (State Independent Electoral Commissions)','The Federal Ministry of the Interior','The Nigeria Police Force'],a:1,w:'Local government elections are conducted by SIECs, which each state establishes — not by INEC, which handles federal and state-level elections.'},{q:'A common criticism of INEC\'s independence is that:',o:['It has no legal basis in the Constitution at all','It depends on federal government funding, which can create political pressure','It has too many staff and too large a budget','It is run entirely by foreign election observers'],a:1,w:'Although constitutionally independent, INEC\'s reliance on federal government funding is often cited as a practical limit on its true independence.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 • Gov • ELE',ti:'Nigeria\'s Electoral History',su:'Trace the development of Nigeria\'s elections from the colonial era to today.',steps:[
{lb:'Colonial-era elections (1922-1959)',dr:dQ6,ht:'<p>Limited elections under British rule began with the 1922 Clifford Constitution (a small elected element in Lagos and Calabar). The <b>1959 federal election</b>, held ahead of independence, was the first election covering the whole country and shaped the parties that led Nigeria into independence in 1960.</p>'},
{lb:'The First and Second Republics',dr:dQ6,ht:'<p>The <b>First Republic</b> (1963-66) ended in military coups. After a period of military rule, the <b>Second Republic</b> (1979-83) restored civilian, FPTP-based elections — but this too was ended by a military coup in 1983.</p>'},
{lb:'Return to democracy: 1999',dr:dQ6,ht:'<p>Following prolonged military rule (including the annulled 1993 election, widely seen as Nigeria\'s freest ever at that point), Nigeria returned to civilian democracy in <b>1999</b>, re-establishing INEC and beginning the current unbroken run of elections every four years.</p>'},
{lb:'2015: the first peaceful transfer of power',dr:dQ6,ht:'<p>The <b>2015 election</b> was historic: it marked Nigeria\'s first ever peaceful transfer of power between political parties, as incumbent President Goodluck Jonathan conceded defeat to Muhammadu Buhari — widely seen as a major milestone for Nigerian democracy.</p>'},
{lb:'2023: technology-driven reform',dr:dQ6,ht:'<p>The <b>2023 election</b> was the first to require nationwide use of <b>BVAS</b> (biometric voter accreditation) and <b>IReV</b> (real-time online results viewing), under the Electoral Act 2022 — a major step in using technology to improve transparency, though implementation was uneven.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'Nigeria\'s first federal-wide election, ahead of independence, was held in:',o:['1979','1959','1999','1923'],a:1,w:'The 1959 federal election was the first to cover the whole country, held just ahead of independence in 1960.'},{q:'The Second Republic (1979-83) ended when:',o:['It was replaced peacefully by the Third Republic','A military coup took place in 1983','Nigeria became a monarchy','The president voluntarily stepped down after one term'],a:1,w:'The Second Republic ended with a military coup in December 1983, restoring military rule.'},{q:'Nigeria returned to civilian democracy, and re-established INEC, in:',o:['1993','1999','1979','2015'],a:1,w:'Nigeria returned to civilian democratic rule in 1999, beginning the current unbroken sequence of elections every four years.'},{q:'The 2015 Nigerian election is historically significant because:',o:['It was the first election ever held in Nigeria','It marked Nigeria\'s first peaceful transfer of power between political parties','It was cancelled and never actually took place','It was the last election supervised by the military'],a:1,w:'The 2015 election marked Nigeria\'s first peaceful transfer of power between parties, when Jonathan conceded to Buhari.'},{q:'The 2023 election was notable for the mandatory nationwide use of:',o:['Postal voting for all citizens','BVAS and IReV','Paper ballots only, with no technology','Compulsory voting laws'],a:1,w:'2023 was the first election requiring nationwide use of BVAS (biometric accreditation) and IReV (real-time results viewing).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 • Gov • ELE',ti:'Electoral Malpractice and Safeguards',su:'Identify common forms of electoral malpractice and the reforms designed to counter them.',steps:[
{lb:'Common forms of malpractice',dr:dQ7,ht:'<p>Recurring problems in Nigerian elections have included: <b>vote buying</b> (paying voters for their support); <b>ballot snatching</b> and box stuffing; <b>multiple voting</b>; intimidation and violence at polling units; and manipulation of results during collation.</p>'},
{lb:'BVAS: verifying the voter',dr:dQ7,ht:'<p>The <b>Biometric Voter Accreditation System (BVAS)</b>, made mandatory in 2023, uses fingerprint or facial recognition to confirm that each voter is genuine and registered — directly targeting multiple voting and impersonation.</p>'},
{lb:'IReV: transparency in real time',dr:dQ7,ht:'<p>The <b>INEC Results Viewing Portal (IReV)</b> allows anyone with internet access to view the scanned result sheet from each polling unit as soon as it is uploaded — making it much harder to alter results later at collation centres without detection.</p>'},
{lb:'Form EC8A: a paper trail',dr:dQ7,ht:'<p><b>Form EC8A</b> records the result at each individual polling unit. It must be signed by the Presiding Officer and party agents present, who each keep a copy — creating multiple independent witnesses to the count that can later be checked against results announced elsewhere.</p>'},
{lb:'The Electoral Act 2022',dr:dQ7,ht:'<p>The <b>Electoral Act 2022</b> provides the legal backbone for these reforms: it makes BVAS and electronic result transmission mandatory, strengthens penalties for electoral offences, and expands timelines for pre-election activities — though full implementation remains a work in progress.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'"Vote buying" as a form of electoral malpractice means:',o:['A political party legally purchasing campaign advertising','Paying individual voters in exchange for their support','A candidate buying INEC equipment for a polling unit','Political parties paying registration fees to INEC'],a:1,w:'Vote buying refers to directly paying individual voters for their votes — a form of electoral malpractice, not a legitimate campaign activity.'},{q:'BVAS was introduced primarily to prevent:',o:['Late delivery of ballot papers','Multiple voting and impersonation at the polling unit','Political parties from campaigning on election day','Voters from queuing for long periods'],a:1,w:'BVAS uses biometric verification (fingerprint/facial recognition) specifically to confirm each voter\'s identity and prevent multiple voting or impersonation.'},{q:'IReV increases transparency mainly by:',o:['Allowing the public to view polling unit results online in real time','Allowing INEC staff to vote twice for auditing purposes','Replacing the need for any paper result forms','Allowing political parties to alter results after submission'],a:0,w:'IReV lets the public view scanned polling unit results online as soon as they are uploaded, making later manipulation easier to detect.'},{q:'Form EC8A is significant because it:',o:['Is only used for presidential elections','Creates a signed, witnessed paper record of results at each polling unit','Replaces the need for INEC staff at polling units','Is completed only after a candidate wins'],a:1,w:'Form EC8A is signed by the Presiding Officer and party agents at the polling unit, creating multiple independent witnesses to the recorded result.'},{q:'The Electoral Act 2022 is significant because it:',o:['Abolished INEC and replaced it with a new body','Provides the legal basis for mandatory BVAS and stronger penalties for electoral offences','Removed the 25%-in-24-states rule for the presidency','Ended all local government elections in Nigeria'],a:1,w:'The Electoral Act 2022 gave BVAS and electronic transmission a firm legal basis and strengthened penalties for electoral malpractice.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 • Gov • ELE',ti:'Election Day and Dispute Resolution',su:'Follow the process from polling to the declaration of results and legal challenges.',steps:[
{lb:'Polling unit procedure',dr:dQ8,ht:'<p>On election day, polling units typically open at 8am. Voters are accredited using BVAS, receive a ballot paper, and vote by secret ballot. Votes are then counted <b>at the polling unit itself</b>, in front of party agents and observers, before being recorded on Form EC8A.</p>'},
{lb:'Collation',dr:dQ8,ht:'<p>Results are then <b>collated</b> upward: from polling unit, to ward, to Local Government Area, to state, and finally to the national level (for presidential elections). Each stage should match the figures uploaded earlier to IReV.</p>'},
{lb:'Declaration of results',dr:dQ8,ht:'<p>At each level, an INEC <b>Returning Officer</b> formally declares the winner. For the presidency, this means confirming both that a candidate has the most votes nationwide AND meets the 25%-in-24-states requirement.</p>'},
{lb:'Electoral petition tribunals',dr:dQ8,ht:'<p>Candidates who dispute a result can challenge it at an <b>Electoral Petition Tribunal</b> within 21 days of the declaration. For governorship/NASS elections this is the Court of Appeal; for the presidency, the <b>Presidential Election Petition Tribunal (Court of Appeal)</b> hears the case, with a final appeal route to the Supreme Court.</p>'},
{lb:'Grounds for a petition',dr:dQ8,ht:'<p>Common grounds for an electoral petition include: electoral malpractice or non-compliance with the Electoral Act; corrupt practices; or disqualification of the declared winner. The 2023 presidential petitions (Atiku and Obi vs INEC/Tinubu) were a major recent example, decided by the Supreme Court.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'At a Nigerian polling unit, votes are counted:',o:['At the polling unit itself, before agents and observers','Only at INEC\'s national headquarters','By the Nigerian Police Force alone','Several weeks after the election, in private'],a:0,w:'Votes are counted at the polling unit itself, in view of party agents and observers, before being recorded on Form EC8A.'},{q:'"Collation" in Nigeria\'s electoral process refers to:',o:['Registering new voters','Adding up results upward from polling unit through ward, LGA, state to national level','Printing ballot papers before the election','Training electoral officers'],a:1,w:'Collation is the step-by-step process of adding results upward from the polling unit level to ward, LGA, state and (for presidential elections) national level.'},{q:'An electoral petition challenging a Nigerian election result must be filed within:',o:['7 days of the declaration','21 days of the declaration','6 months of the declaration','There is no time limit'],a:1,w:'Under Nigeria\'s Electoral Act, a petition must be filed within 21 days of the declaration of the disputed result, or it is time-barred.'},{q:'The Presidential Election Petition Tribunal (PEPT) in Nigeria is:',o:['A special committee of the National Assembly','The Court of Appeal, sitting in its special jurisdiction for presidential petitions','INEC\'s own internal disciplinary panel','The Nigerian Bar Association'],a:1,w:'The PEPT is the Court of Appeal sitting specially to hear challenges to presidential election results, with a final appeal route to the Supreme Court.'},{q:'Which of these is a valid ground for an electoral petition in Nigeria?',o:['The losing candidate simply disagrees with the outcome','Non-compliance with the Electoral Act or disqualification of the winner','The winning candidate campaigned more than the loser','The election took place on a weekday'],a:1,w:'Valid grounds include electoral malpractice, non-compliance with the Electoral Act, or the disqualification of the declared winner — not mere disagreement with the result.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 • Gov • ELE',ti:'WAEC Prep — Electoral Systems',su:'Practise structuring WAEC-style answers on electoral systems.',steps:[
{lb:'Essay structure: comparing electoral systems',dr:dQ9,ht:'<p>For a WAEC essay comparing electoral systems: (1) Define electoral system. (2) Explain FPTP with an example. (3) Explain PR (and mixed systems) with an example. (4) Compare advantages/disadvantages of each. (5) State which system Nigeria uses and why. (6) Conclusion — evaluate whether Nigeria\'s system suits its circumstances.</p>'},
{lb:'Essay structure: role of INEC',dr:dQ9,ht:'<p>For "Discuss the role of INEC in Nigeria\'s electoral system": (1) Define INEC and its constitutional basis. (2) Functions (registration, delimitation, party regulation, conducting elections, declaring results). (3) Challenges (funding dependence, malpractice, logistics). (4) Reforms (BVAS, IReV, Electoral Act 2022). (5) Assessment — has INEC improved over time? (6) Conclusion.</p>'},
{lb:'Key vocabulary for essays',dr:dQ9,ht:'<p>Key vocabulary: <b>plurality</b>, <b>FPTP</b>, <b>Proportional Representation</b>, <b>party list</b>, <b>delimitation</b>, <b>INEC</b>, <b>BVAS</b>, <b>IReV</b>, <b>collation</b>, <b>electoral petition tribunal</b>, <b>the 25% rule</b>. Precise, correctly-used vocabulary strengthens WAEC answers significantly.</p>'},
{lb:'Common exam mistakes',dr:dQ9,ht:'<p>Common mistakes to avoid: saying the Nigerian president only needs the most votes (the 25%-in-24-states condition is also required); confusing INEC (federal/state elections) with SIECs (local government elections); saying FPTP and PR always produce identical outcomes (they do not); forgetting to give a real-world example for each system named.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'A strong WAEC essay comparing electoral systems should begin by:',o:['Giving a personal opinion with no definitions','Clearly defining what an electoral system is','Listing unrelated historical dates','Describing only Nigeria\'s system with no comparison'],a:1,w:'A strong essay should open with a clear definition of "electoral system" before comparing specific systems.'},{q:'Which of these is a typical WAEC-style question on this topic?',o:['"Describe the geography of the Niger Delta."','"Examine the merits and demerits of the First-Past-The-Post system as used in Nigeria."','"List the rivers of Nigeria."','"Define photosynthesis."'],a:1,w:'"Examine the merits and demerits of FPTP as used in Nigeria" is a typical WAEC-style question for this topic.'},{q:'Which term describes voters choosing a party, which then fills seats from a pre-prepared list?',o:['First-Past-The-Post','Party list Proportional Representation','A run-off election','Delimitation'],a:1,w:'Party list PR is the term for voters choosing a party, with seats filled from that party\'s pre-prepared candidate list.'},{q:'Which common WAEC mistake should be avoided when discussing Nigeria\'s presidential election rules?',o:['Mentioning the 25%-in-24-states rule at all','Saying the president only needs the most votes nationwide, ignoring the 25% rule','Naming Section 134 of the Constitution','Giving Nigerian examples of electoral reform'],a:1,w:'A common and important mistake is forgetting the 25%-in-24-states condition and stating only that the president needs the most votes.'},{q:'Why does WAEC reward using precise vocabulary like "plurality", "delimitation" and "collation"?',o:['These words replace the need for any factual content','Precise, correctly-used vocabulary demonstrates genuine understanding of the topic','WAEC penalises the use of technical terms','These words are only relevant to Mathematics'],a:1,w:'Precise, correctly-used technical vocabulary is one of the clearest ways WAEC examiners distinguish strong answers from weak ones.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q10 • Gov • ELE',ti:'Mixed Revision — Electoral Systems',su:'Integrated final revision across all Electoral Systems topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Electoral system: the rules for turning votes into winners/seats. Families: FPTP (most votes wins — used in Nigeria), PR (seats match vote share), Mixed (blend of both, e.g. Germany). Nigeria\'s presidency: FPTP PLUS the 25%-in-24-states rule (Section 134). INEC: registers voters, delimits constituencies, registers parties, conducts and declares elections. History: 1959 first federal election → 1999 return to democracy → 2015 first peaceful transfer → 2023 BVAS/IReV. Safeguards: BVAS, IReV, Form EC8A, Electoral Act 2022. Disputes: Electoral Petition Tribunals, 21-day filing window, PEPT for presidential cases.</p>'},
{lb:'FPTP vs PR — final review',dr:dQ10,ht:'<p>FPTP: simple, decisive, strong constituency link; but can waste votes and under-represent smaller parties. PR: fairer votes-to-seats match; but can produce coalition/fragmented government. Nigeria uses FPTP for all its elections, with the extra 25%-in-24-states requirement uniquely applied to the presidency to ensure broad national support.</p>'},
{lb:'Comparing INEC and SIECs',dr:dQ10,ht:'<p>INEC vs SIEC comparison: Elections run — INEC: presidential, NASS, governorship, State Assembly | SIEC: local government only. Constitutional basis — INEC: federal (1999 Constitution) | SIEC: state law. Independence — INEC: constitutionally independent (with funding-dependence criticisms) | SIEC: often criticised as less independent from state governors. WAEC questions often ask you to distinguish these two bodies clearly.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final tips: know the difference between FPTP, PR and Mixed systems, each with a real-world example. Know Nigeria\'s presidential rule (most votes AND 25% in 24 of 36 states) precisely. Know INEC\'s core functions and how it differs from SIECs. Know the key reforms (BVAS, IReV, Electoral Act 2022) and what each is designed to prevent. Know the electoral petition process (21 days; PEPT; Supreme Court on appeal). For 25-mark essays: define → explain systems/features → apply to Nigeria → evaluate strengths/weaknesses → conclusion.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'The key difference between FPTP and PR is that:',o:['FPTP always produces fairer results than PR','Under FPTP the candidate with the most votes wins; under PR, seats are matched to vote share','PR is only used in African countries','FPTP requires a secret ballot while PR does not'],a:1,w:'FPTP is a plurality system (most votes wins the seat); PR aims to match seats won to each party\'s share of the vote.'},{q:'Nigeria\'s presidential election requires a candidate to get the most votes nationwide AND:',o:['A simple majority in the Senate','At least 25% of the vote in at least 24 of the 36 states','The support of the outgoing president','At least 60% of the total national vote'],a:1,w:'Section 134 requires the most votes nationwide AND at least 25% of votes in at least 24 of the 36 states — both conditions together.'},{q:'Which body conducts Nigeria\'s local government elections, as distinct from INEC?',o:['SIECs (State Independent Electoral Commissions)','The National Assembly','The Nigeria Police Force','The Federal Ministry of Justice'],a:0,w:'SIECs, established under state law, conduct local government elections; INEC handles federal and state-level elections.'},{q:'Which 2023 technology reform allows the public to view polling unit results in real time?',o:['BVAS','IReV','Form EC8A','The Electoral Act 2022 itself'],a:1,w:'IReV (INEC Results Viewing Portal) allows anyone with internet access to view scanned polling unit results as soon as they are uploaded.'},{q:'An electoral petition challenging a Nigerian election result must be filed within how many days of the declaration?',o:['7 days','14 days','21 days','60 days'],a:2,w:'Nigeria\'s Electoral Act requires petitions to be filed within 21 days of the declaration of the disputed result.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]}
