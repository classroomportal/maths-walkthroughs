lawed, should never be overthrown by military force','The coup was both understandable given the First Republic\'s dysfunction (rigged elections; political violence; "Wild Wild West") and unjustifiable in that it set a precedent for military intervention that plagued Nigeria until 1999 — the cure proved worse than the disease','The coup had no lasting consequences and Nigeria quickly returned to stable democratic governance'],a:3,w:'The balanced judgment: the January 1966 coup responded to real dysfunction (rigged elections 1964-65; "Wild Wild West" violence; inability of civilian politicians to govern constitutionally). But it set a precedent for military intervention that Nigeria repeated in 1966 (July counter-coup); 1975; 1983; 1985; 1993. Military rule (with brief democratic interludes) lasted until 1999 — 33 years during which Nigeria\'s governance worsened rather than improved. The cure proved worse than the disease.'},{q:'What does the career of Funmilayo Ransome-Kuti reveal about gender and Nigerian nationalism?',o:['Women had fully equal political rights with men throughout the colonial and independence period','Women were entirely passive and played no role in Nigerian political history','Women were politically active and achieved concrete victories through mass organisation (Aba 1929; AWU; Alake abdication 1949) — but were systematically excluded from formal political leadership despite essential contributions; their experience reveals the contradiction between nationalist rhetoric of freedom and the gendered exclusions of the nationalist project itself','Only western-educated women from Lagos contributed to Nigerian political history'],a:3,w:'Funmilayo\'s career reveals the contradiction at the heart of Nigerian nationalism: leaders who demanded freedom from colonial rule denied political leadership to women. Aba 1929 showed women\'s organisational capacity; Funmilayo showed women could achieve concrete political victories. But no women served as ministers at independence; northern women could not vote until 1979. The nationalist project achieved political independence while reproducing gendered exclusions — a contradiction that subsequent feminist historians have highlighted.'},{q:'What is meant by describing democracy as requiring a "constitutional culture" and not just a document?',o:['Citizens and leaders must genuinely respect democratic norms, not just have a document','Only the document matters, not behaviour','Constitutional culture means military rule','It refers only to written laws'],a:1,w:'A constitutional culture means citizens and leaders genuinely respect democratic norms, not merely possess a written document.'},{q:'Historians often describe the January 1966 coup using what kind of balanced assessment?',o:['One acknowledging real grievances while condemning the coup\'s ethnic bias and bloodshed','One declaring the coup entirely good with no criticism','One declaring the coup entirely bad with no context','Historians avoid discussing the coup'],a:1,w:'Balanced historical assessments acknowledge real grievances against the First Republic while condemning the coup\'s ethnic bias and bloodshed.'},{q:'What does Funmilayo Ransome-Kuti\'s political career demonstrate about Nigerian women\'s role in nationalism?',o:['Women were active, organised political participants, not passive observers','Women played no organised political role','Women\'s activism began only after 1979','Women were excluded from all nationalist movements'],a:1,w:'Ransome-Kuti\'s career demonstrates women were active, organised political participants in the independence movement.'},{q:'Between which two constitutions did Nigeria move to establish a federal structure, according to the standard sequence?',o:['Between the Richards and Macpherson Constitutions','Between the 1979 and 1999 Constitutions','Between Independence and the Republic','Between Clifford and Independence directly'],a:1,w:'Nigeria moved toward a federal structure between the Richards (1946) and Macpherson (1951) Constitutions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov \u2022 POL',ti:'Mixed Revision — Nationalism and Decolonisation',su:'Final comprehensive revision on all nationalism topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Nationalism and decolonisation full summary: Early organisations: Peoples Union 1908; NCBWA 1920; NNDP 1923; NYM 1934; NCNC 1944; Egbe Omo Oduduwa 1948; AG 1951; NPC 1951. Key people: Macaulay (NNDP 1923; NCNC 1944; died 1946). Azikiwe (West African Pilot 1937; NCNC; 1st GG 1960; 1st President 1963). Awolowo (AG; free education 1955; imprisoned 1962). Bello (NPC; Sardauna; Premier North; killed Jan.1966). Balewa (NPC; 1st PM 1960; killed Jan.1966). Funmilayo (AWU 1946; Alake 1949). Pan-Africanism: Du Bois; Garvey; Manchester 1945; Ghana 1957; Atlantic Charter 1941; UN 1514 1960. 1959 elections: NPC 134; NCNC 89; AG 73. Independence: 1 October 1960. Republic: 1963. First Republic collapse: AG split; rigged elections; Wild Wild West; Jan.1966 coup (Nzeogwu; Balewa/Bello/Akintola killed); July 1966 counter-coup.</p>'},
{lb:'Synthesis and themes',dr:dQ10,ht:'<p>Synthesis: Nigerian nationalism was shaped by five major forces: (1) Colonial education — created the nationalist leaders who then demanded what they had read about (democracy, rights). (2) Pan-Africanism — gave nationalism intellectual depth and international connections. (3) Constitutional development — the mechanism through which demands were escalated until independence was achieved. (4) World events — WWI/II veterans; Atlantic Charter; Indian independence; Ghana independence. (5) Inter-ethnic competition — the darker side of nationalism that undermined the First Republic. These forces interacted: education enabled pan-Africanism; pan-Africanism inspired constitutional demands; constitutional change created political parties; parties competed along ethnic lines; ethnic competition collapsed the First Republic. A complete WAEC answer should address all five forces with specific evidence.</p>'},
{lb:'Connections across POL topics',dr:dQ1,ht:'<p>POL-01 → POL-02 → POL-03 connections: Pre-colonial systems (POL-01) provided the template for indirect rule (POL-02). Indirect rule entrenched ethnic divisions (POL-02) that became the basis for ethnically-based nationalist parties (POL-03). The three-region structure (Richards 1946; POL-02) became the framework for ethnic-regional party competition (AG/West; NPC/North; NCNC/East; POL-03). Pre-colonial governance sophistication (POL-01) was marginalised by colonialism (POL-02) but re-emerged in post-independence traditional ruler institutions (POL-03). The pre-colonial North-South administrative difference (POL-01) became the colonial North-South divide (POL-02) and the First Republic\'s ethnic fault lines (POL-03). These three topics form one continuous political history.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>WAEC must-knows for GOV-POL-03: Parties: NCNC 1944 (Macaulay+Azikiwe); AG 1951 (Awolowo); NPC 1951 (Bello). 1959 results: NPC 134; NCNC 89; AG 73. Independence: 1 October 1960. First PM: Balewa (NPC). First GG: Azikiwe (NCNC) → first President 1963. January 1966 coup: mainly Igbo officers (Nzeogwu); Balewa/Bello/Akintola killed. July 1966 counter-coup: northern officers; Ironsi killed; Gowon. First Republic collapse causes: three ethnic parties; Westminster mismatch; election rigging; political violence; absence of constitutional culture. Women: Aba 1929 (largest anti-colonial uprising; ~50 killed); Funmilayo Ransome-Kuti (AWU 1946; Alake abdication 1949; "mother of Africa"). Pan-Africanism: Du Bois (Pan-African Congresses); Garvey (UNIA); Manchester 1945; Ghana 1957 (Nkrumah). Know these facts cold.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which of the following CORRECTLY pairs a nationalist with a specific dated achievement?',o:['Awolowo → founded West African Pilot (1937)','Azikiwe → introduced free primary education in Western Region (1955)','Funmilayo Ransome-Kuti → founded Abeokuta Women\'s Union (1946) which forced the Alake of Abeokuta to abdicate temporarily (1949)','Balewa → founded the Northern People\'s Congress (1951)'],a:3,w:'Funmilayo Ransome-Kuti → AWU 1946 → Alake abdication 1949 + women\'s taxation abolished in Abeokuta. Azikiwe founded the West African Pilot (1937). Free primary education was Awolowo\'s (Western Region, 1955). The NPC (1951) was founded by Ahmadu Bello (Sardauna of Sokoto), not Balewa.'},{q:'Which of the following is TRUE about the 1959 federal elections?',o:['The NCNC won the most seats and formed a government without a coalition partner','All three parties received exactly equal numbers of seats, requiring British arbitration','The NPC won the most seats (134); no party had an overall majority; the NPC-NCNC coalition formed the independence government with Balewa as PM and Azikiwe as GG','The AG won the most seats but refused to form a government on ethnic grounds'],a:3,w:'1959 results: NPC 134; NCNC 89; AG 73. No overall majority. NPC-NCNC coalition: Balewa (NPC) → Prime Minister; Azikiwe (NCNC) → Senate President → Governor-General at independence. AG → official opposition. This coalition governed Nigeria from 1960 until the January 1966 coup.'},{q:'The Atlantic Charter (1941) gave Nigerian nationalists a powerful rhetorical tool because:',o:['It was signed by Nigerian nationalist leaders at the Lancaster House Conference','Roosevelt and Churchill declared the right of peoples to self-determination — nationalists could demand that the colonial power apply its own stated principles to Nigeria','It promised economic independence to Nigeria as a reward for participation in World War II','It established the United Nations, which immediately began pressuring Britain to decolonise Nigeria'],a:2,w:'The Atlantic Charter (August 1941) stated respect for "the right of all peoples to choose the form of government under which they will live." Churchill intended this for Nazi-occupied Europe; African nationalists immediately demanded it apply to them. This gave the independence movement a powerful rhetorical weapon — holding Britain to its own declared principles.'},{q:'The legacy of Nigerian nationalism for post-independence Africa was:',o:['Nigeria\'s nationalism inspired no other African countries — each nation\'s independence movement was entirely independent','Nigerian independence (1960) and its peaceful, constitutional path to independence inspired other African nations and gave Nigeria early prestige on the continent — though the January 1966 coup and subsequent civil war damaged that reputation','Nigerian independence was irrelevant to the rest of Africa because Nigeria was too different from other African countries','Nigeria\'s First Republic was so successful that it became the model for all subsequent African constitutional democracies'],a:2,w:'Nigeria\'s independence (1960) — the largest African country by population, achieved through peaceful constitutional negotiation — gave it enormous prestige on the continent. Nigeria\'s early foreign policy under Balewa was respected internationally (non-alignment; African unity; anti-apartheid). The January 1966 coup and 1967-70 civil war damaged that prestige. But the peaceful achievement of independence itself remained an inspiration and model for the constitutional (rather than violent) path to decolonisation.'},{q:'Why did the 1959 federal elections require a coalition government?',o:['No single party won an outright majority of seats','The elections were cancelled and rerun','Only one party was allowed to contest','The military intervened before results were declared'],a:1,w:'No single party won an outright majority in the 1959 elections, requiring a coalition government.'},{q:'Which two parties formed the coalition government following the 1959 federal elections?',o:['The NPC and the NCNC','The AG and the NPC','The NCNC and the AG','The NNDP and the NPC'],a:1,w:'The NPC and NCNC formed the coalition government following the 1959 federal elections.'},{q:'What key principle from the Atlantic Charter (1941) did African nationalists draw on?',o:['The right of all peoples to choose their own government (self-determination)','A commitment to permanent colonial rule','A promise of unlimited economic aid','A plan for African federation'],a:1,w:'Nationalists drew on the Atlantic Charter\'s declaration of the right of all peoples to self-determination.'},{q:'In what sense is Nigeria\'s independence considered part of a broader wave rather than an isolated event?',o:['It was one of many African independence movements gaining momentum together','It happened decades before any other African country','It was entirely disconnected from other African movements','No other African country was seeking independence at that time'],a:1,w:'Nigeria\'s independence was part of a broader wave of African independence movements gaining momentum across the continent.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
