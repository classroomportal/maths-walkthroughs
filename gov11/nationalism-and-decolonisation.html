var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Key Nationalists and Their Parties',ACC,12,'middle',true));
[['Nationalist','Party','Region/Base'],['Nnamdi Azikiwe','NCNC (1944)','East / Lagos (Igbo base)'],['Obafemi Awolowo','AG (1951)','West (Yoruba base)'],['Ahmadu Bello','NPC (1951)','North (Hausa-Fulani base)'],['Tafawa Balewa','NPC','North (first PM)'],['Herbert Macaulay','NNDP (1923); NCNC co-founder','Lagos (father of nationalism)'],['Aminu Kano','NEPU — radical northern opposition','North (progressive)'],['Funmilayo Ransome-Kuti','AWU; women\'s movement','West (women rights)']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(130,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(265,34+i*28,r[1],'#444',7,'middle',false));o.push(T(400,34+i*28,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Timeline to Independence',ACC,12,'middle',true));
[['Year','Event'],['1923','NNDP founded — Macaulay; first contested elections Lagos'],['1934','Nigerian Youth Movement — first truly national party'],['1944','NCNC founded — Macaulay/Azikiwe; national tour'],['1951','AG and NPC formed; regional elections held'],['1954','Lyttleton Constitution — full federation; regional self-government'],['1957','Eastern and Western Regions achieve internal self-government'],['1959','Federal elections — NPC/NCNC coalition wins'],['1960','1 October — Independence; Balewa PM; Azikiwe GG']].forEach(function(r,i){if(i<=p){o.push(R(10,16+i*28,460,22,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(90,28+i*28,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(310,28+i*28,r[1],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Nationalism and Decolonisation — Summary',ACC,13,'middle',true));
[['Azikiwe','NCNC; West African Pilot; pan-Nigerian; 1st President 1963'],['Awolowo','AG; Yoruba base; free education West Region 1955; imprisoned 1962'],['Ahmadu Bello','NPC; Sardauna of Sokoto; Premier North; killed Jan 1966'],['Tafawa Balewa','NPC; first PM 1960; killed Jan 1966'],['Macaulay','NNDP 1923; NCNC 1944; died 1946; "father of nationalism"'],['Independence','1 October 1960; Westminster; 3 regions; NPC/NCNC coalition']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(110,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov \u2022 POL',ti:'Nnamdi Azikiwe and the NCNC',su:'Examine the role of Azikiwe and the NCNC in the independence movement.',steps:[
{lb:'Azikiwe\'s background',dr:dQ1,ht:'<p>Nnamdi Azikiwe (1904-1996), known as "Zik of Africa," was the dominant figure of Nigerian nationalism. Born in Zungeru (of Igbo origin), he studied in the US (Howard University, Lincoln University) and was exposed to Pan-Africanism (Du Bois, Garvey) and liberal democratic thought. He returned to West Africa in 1934, editing the African Morning Post in Accra before founding the <b>West African Pilot</b> in Lagos (1937), with the slogan "Show the light and the people will find the way." In 1944, he co-founded the <b>NCNC</b> with Herbert Macaulay. He became Governor-General at independence (1960) and Nigeria\'s first President when it became a republic (1963).</p>'},
{lb:'Awolowo and the Action Group',dr:dQ2,ht:'<p>Chief Obafemi Awolowo (1909-1987) founded the <b>Action Group (AG)</b> in 1951, rooted in the Egbe Omo Oduduwa cultural society (1948). The AG dominated the Western Region and championed: (1) Yoruba political identity. (2) Progressive social welfare — he introduced <b>free primary education in the Western Region (1955)</b> — the first in sub-Saharan Africa — funded by a cocoa levy. (3) A federal Nigeria with regions based on linguistic-ethnic groups ("Path to Nigerian Freedom," 1947). Awolowo was Premier of the Western Region (1954-59). He was imprisoned in 1962 for alleged treasonable felony — a conviction widely seen as politically motivated. He remains a revered figure in Yoruba culture.</p>'},
{lb:'Ahmadu Bello and the NPC',dr:dQ1,ht:'<p>Sir Ahmadu Bello (1909-1966), the <b>Sardauna of Sokoto</b>, was the dominant northern political figure. He founded the <b>Northern People\'s Congress (NPC)</b> in 1951 — a conservative party representing the northern establishment (emirs, traditional rulers). He chose to remain as <b>Premier of the Northern Region</b> rather than become Federal Prime Minister — sending <b>Tafawa Balewa</b> as NPC\'s federal representative. The NPC\'s primary concern was protecting northern interests in the federation — particularly the "fear of southern domination" — and it insisted on proportional northern representation in federal positions. Bello was killed in the January 1966 military coup alongside Balewa.</p>'},
{lb:'Funmilayo Ransome-Kuti and women\'s nationalism',dr:dQ2,ht:'<p>Mrs <b>Funmilayo Ransome-Kuti</b> (1900-1978) — the "lioness of Lisabi" and "mother of Africa" — was the most prominent female Nigerian nationalist. She founded the <b>Abeokuta Women\'s Union (AWU, 1946)</b>, which campaigned against: the Alake of Abeokuta\'s corrupt tax collection; women\'s taxation. Her campaigns succeeded: the Alake was forced to abdicate temporarily (1949) and women\'s taxation was abolished in Abeokuta. The <b>Aba Women\'s Riots (1929)</b> earlier showed women\'s capacity for mass political action — approximately 50 women were killed by British soldiers after protests against the Warrant Chief system and fear of taxation swept southeastern Nigeria.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Azikiwe\'s newspaper, the West African Pilot, had the slogan:',o:['"Nigeria shall be free or we die trying"',"'Show the light and the people will find the way'",'"One Nigeria, one destiny"',"'The pen is mightier than the colonial sword'"],a:2,w:'"Show the light and the people will find the way" — the West African Pilot\'s slogan captured Azikiwe\'s philosophy: journalism as enlightenment, educating Nigerians about their rights and inspiring them to seek independence.'},{q:'Awolowo\'s most enduring legacy in the Western Region was:',o:['Establishing the University of Ibadan as the first Nigerian university','Negotiating the 1954 Lyttleton Constitution on behalf of the Yoruba people','Introducing free primary education (1955) — the first in sub-Saharan Africa — funded by cocoa levy, producing a generation of educated Yoruba professionals','Founding the first Nigerian newspaper, the West African Pilot, in Lagos in 1937'],a:3,w:'Free primary education (1955) in the Western Region — funded through the cocoa marketing board — was Awolowo\'s most transformative achievement. It produced a generation of educated Yoruba who dominated Nigeria\'s professional class by the 1970s-80s.'},{q:'Ahmadu Bello chose to remain Premier of the Northern Region rather than become Federal PM because:',o:['He was constitutionally ineligible to serve as Federal PM','He believed the Northern Region\'s interests were best protected by his direct leadership in Kaduna — he could control the North\'s vast resources and demographic weight more effectively from the North than as PM in Lagos','He was offered the position but declined it as incompatible with his role as Sardauna of Sokoto','He lacked the university education required for Federal PM under the 1960 constitution'],a:2,w:'Bello\'s calculation: the Northern Region was larger than the rest of Nigeria combined. As Premier of the North, he controlled this vast bloc directly. He sent Tafawa Balewa to Lagos as Federal PM while remaining the real power behind the northern bloc.'},{q:'Funmilayo Ransome-Kuti\'s Abeokuta Women\'s Union (1946) achieved which concrete political victory?',o:['The abolition of indirect rule in Egba territory','The election of women to the Abeokuta Native Authority council','The temporary abdication of the Alake of Abeokuta and the abolition of women\'s taxation in Abeokuta','The establishment of free primary education for girls in Abeokuta 10 years before Awolowo\'s scheme'],a:3,w:'Funmilayo\'s AWU campaign succeeded: the Alake of Abeokuta was forced to abdicate temporarily in 1949 (later restored); women\'s taxation was abolished in Abeokuta. These were concrete, measurable political victories achieved through mass women\'s organisation.'},{q:'What newspaper did Nnamdi Azikiwe found in 1937 to promote nationalist ideas?',o:['The West African Pilot','The Daily Times','The Nigerian Tribune','The Lagos Weekly Record'],a:1,w:'Azikiwe founded the West African Pilot in 1937 as a vehicle for nationalist ideas.'},{q:'Which position did Obafemi Awolowo hold as leader of the Action Group in the Western Region?',o:['Premier of the Western Region','Federal Prime Minister','Governor-General','President of the Senate'],a:1,w:'Awolowo served as Premier of the Western Region as leader of the Action Group.'},{q:'What was the primary aim of Ahmadu Bello\'s leadership in the Northern Region?',o:['To protect Northern regional interests within a federal Nigeria','To make the North a separate country','To abolish traditional emirate rule','To relocate the capital to Kaduna permanently'],a:1,w:'Bello aimed to protect Northern regional interests and identity within a federal Nigeria.'},{q:'What broader significance did the Abeokuta Women\'s Union have for Nigerian nationalism?',o:['It showed women could organise effective political resistance','It had no lasting political impact','It focused only on religious matters','It was suppressed with no results'],a:1,w:'The Abeokuta Women\'s Union showed women could organise effective political resistance against unjust colonial-backed taxation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 POL',ti:'Pan-Africanism and the Global Context',su:'Examine pan-African ideas and the global context of Nigerian decolonisation.',steps:[
{lb:'Pan-Africanism',dr:dQ2,ht:'<p>Pan-Africanism — the idea that African peoples worldwide share a common identity and destiny — was a major intellectual influence on Nigerian nationalists. Key thinkers: (1) <b>W.E.B. Du Bois</b> (1868-1963) — African-American scholar; organised the Pan-African Congresses (1919-1945); argued for African political independence and racial solidarity. (2) <b>Marcus Garvey</b> (1887-1940) — Jamaican; UNIA ("Back to Africa" movement); Black pride and economic self-sufficiency. (3) <b>Kwame Nkrumah</b> — Gold Coast/Ghana; the most prominent African advocate of continental unity; "Seek ye first the political kingdom." Azikiwe encountered all three during his US education — Pan-Africanism gave Nigerian nationalism its intellectual foundation.</p>'},
{lb:'Manchester Pan-African Congress (1945)',dr:dQ2,ht:'<p>The <b>Fifth Pan-African Congress (Manchester, 1945)</b> was a turning point: organised by Du Bois and Nkrumah, it was the first dominated by Africans themselves (previous congresses were led by African-Americans and West Indians). Nigerians present included Obafemi Awolowo. Key demands: immediate independence for all African and Asian colonies; universal suffrage; end of all racial discrimination. The Congress shifted Pan-Africanism from cultural solidarity to a <b>political programme of immediate independence</b>. It directly inspired Nkrumah to return to the Gold Coast and lead the independence movement that achieved Ghana\'s independence in 1957 — the first in sub-Saharan Africa.</p>'},
{lb:'Ghana 1957 and the global context',dr:dQ1,ht:'<p>Ghana became independent on 6 March 1957 — the first sub-Saharan African country to gain independence from Britain. Impact on Nigeria: (1) Proved independence was achievable. (2) Embarrassed Nigeria\'s nationalists — pressured them to achieve independence quickly. (3) Demonstrated the constitutional path worked. (4) Accelerated constitutional conferences leading to Nigerian independence in 1960. Global context: UN Resolution 1514 (1960) — colonialism declared a violation of human rights. Atlantic Charter (1941) — right of peoples to self-determination. Indian independence (1947) — showed Britain could decolonise. Cold War — US and USSR competing for African allies gave independence movements leverage.</p>'},
{lb:'The First Republic and its collapse',dr:dQ2,ht:'<p>The First Republic (1960-66) used the Westminster parliamentary model with three major ethnically-based parties: NPC (North/Hausa-Fulani; Balewa PM); NCNC (East/Igbo; Azikiwe President); AG (West/Yoruba; Awolowo opposition). Collapse: (1) <b>Western Region crisis (1962-63)</b> — AG split; state of emergency; Awolowo imprisoned. (2) <b>Rigged 1964 federal elections</b> — NNA vs UPGA; constitutional crisis. (3) <b>"Wild Wild West" (1965)</b> — fraudulent regional elections; widespread violence. (4) <b>January 1966 coup</b> — mainly Igbo officers (Nzeogwu) killed Balewa, Bello, Akintola. Perceived as "Igbo coup" in North → counter-coup July 1966 (northern officers; Ironsi killed; Gowon took power). Beginning of military rule that lasted (with brief interludes) until 1999.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Manchester Pan-African Congress (1945) was significant because:',o:['It was the first Pan-African congress to demand African independence','It was the first Pan-African congress dominated by Africans themselves — shifting from cultural solidarity to a political programme of immediate independence','It formally unified all African nationalist parties under a single organisation','It persuaded Britain to agree immediately to Nigerian independence'],a:2,w:'The 1945 Manchester Congress was a turning point: unlike earlier congresses (dominated by African-Americans), this was led by Africans — Nkrumah, Kenyatta and others. It demanded immediate independence for all African and Asian colonies — the intellectual trigger for the wave of African independence movements of the 1950s-60s.'},{q:'Ghana\'s independence in 1957 impacted Nigerian nationalism by:',o:['Causing Nigerian nationalists to give up their demands','Proving independence was achievable, embarrassing Nigeria\'s nationalists and accelerating the push for Nigerian independence in 1960','Causing Azikiwe to merge the NCNC with Nkrumah\'s CPP into a single pan-African party','Making the British Colonial Office decide all African colonies should become independent on the same day'],a:2,w:'Ghana\'s independence (6 March 1957) proved the constitutional path worked and created pressure: Nigeria risked being overshadowed by Ghana (a smaller country) as Africa\'s leader. Nigerian nationalists accelerated demands; the British agreed to 1960.'},{q:'The primary cause of the First Republic\'s collapse was:',o:['A communist revolution inspired by Soviet influence on Nigerian trade unions','Ethnically-based parties, the Westminster model mismatch, election rigging and political violence making constitutional governance unworkable','A natural disaster that destabilised the economy and caused political unrest','Military intervention ordered by the British government to protect its economic interests in Nigerian oil'],a:2,w:'The First Republic collapsed because of: ethnic-regional parties that made governance a zero-sum ethnic competition; a Westminster model ill-suited to multi-ethnic Nigeria; systematic election rigging (1964, 1965); political violence in the Western Region; and military officers who believed constitutional governance had broken down.'},{q:'UN Resolution 1514 (1960) boosted decolonisation by:',o:['Sending UN peacekeeping troops to force colonial powers out of Africa','Formally declaring colonialism a violation of human rights — providing international legal and moral authority for decolonisation','Imposing economic sanctions on Britain until Nigeria was given independence','Funding African independence movements through the UN Development Programme'],a:2,w:'UN Resolution 1514 (December 1960) — "Declaration on the Granting of Independence to Colonial Countries and Peoples" — formally declared colonialism a violation of human rights. Though not militarily enforceable, it shifted global moral authority decisively against colonialism and legitimised independence movements.'},{q:'Who were among the key organisers of the 1945 Manchester Pan-African Congress?',o:['Kwame Nkrumah and George Padmore','Winston Churchill and Franklin Roosevelt','Cecil Rhodes and Lord Lugard','Queen Elizabeth II and Harold Macmillan'],a:1,w:'Kwame Nkrumah and George Padmore were among the key organisers of the 1945 Manchester Congress.'},{q:'What was a key demand of the Manchester Pan-African Congress in 1945?',o:['An end to colonial rule and self-determination for Africans','Greater British investment in African colonies only','The creation of a single African currency','Permanent Commonwealth membership'],a:1,w:'The Congress demanded an end to colonial rule and self-determination for African peoples.'},{q:'Which decade saw the fastest wave of African decolonisation, following Ghana\'s lead?',o:['The 1930s','The 1950s','The 1960s','The 1980s'],a:3,w:'The 1960s saw the fastest wave of African decolonisation following Ghana\'s 1957 independence.'},{q:'What did UN General Assembly Resolution 1514 (1960) specifically call for?',o:['The prompt and unconditional end of colonialism','Increased UN military intervention in Africa','New colonial administrations under UN control','Trade sanctions on African nations'],a:1,w:'Resolution 1514 (1960) called for the prompt and unconditional end of colonialism in all its forms.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 POL',ti:'WAEC Prep — Nationalism and Decolonisation',su:'Practise WAEC-style questions on nationalism and decolonisation.',steps:[
{lb:'WAEC essay approach',dr:dQ1,ht:'<p>For WAEC Government essays on nationalism and decolonisation: Common questions: "Assess the contribution of Nnamdi Azikiwe to Nigerian independence." "Compare the political ideologies of Awolowo and Azikiwe." "Examine the role of women in the Nigerian independence movement." "Discuss factors that led to the collapse of the First Republic." "Trace the development of Nigerian nationalism from 1920 to 1960." "Assess the impact of pan-Africanism on Nigerian nationalism." For each person: give background, party/organisation, ideology, specific achievements, legacy. For evaluation: both positive contributions AND limitations. Key dates: 1944 NCNC; 1951 AG/NPC; 1954 Lyttleton; 1957 East/West self-government; 1959 elections (NPC 134, NCNC 89, AG 73); 1960 Oct.1; 1963 republic; 1966 coups.</p>'},
{lb:'Key facts and comparisons',dr:dQ2,ht:'<p>Essential comparisons: Azikiwe (NCNC): pan-Nigerian aspiration; journalist; educated USA; first President 1963; Igbo base. Awolowo (AG): Yoruba-federalist; lawyer; free education West; imprisoned 1962; federal vision. Bello (NPC): Sardauna; conservative; traditional base; stayed in North; killed 1966. Tafawa Balewa: NPC; first PM; moderate; killed 1966. Macaulay: NNDP/NCNC; Father of nationalism; died 1946. Funmilayo: AWU 1946; women\'s rights; Abeokuta; forced Alake abdication 1949. Common mistakes: Saying Azikiwe was PM (Balewa was PM). Saying Awolowo led independence (he was in opposition). Confusing NCNC (Azikiwe; Igbo/East) with NPC (Bello; Hausa/North). Saying Bello became Federal PM (he stayed in North; Balewa was PM). Saying 1966 coup was northern-led (it was mainly Igbo officers; the counter-coup in July 1966 was northern-led).</p>'},
{lb:'The 1959 elections and independence',dr:dQ2,ht:'<p>The December 1959 federal elections — the last before independence — produced: NPC: 134 seats; NCNC: 89 seats; AG: 73 seats. No party had an overall majority. The NPC and NCNC formed a coalition government: Tafawa Balewa (NPC) became Prime Minister; Azikiwe (NCNC) became President of the Senate, then Governor-General. This coalition was Nigeria\'s independence government. The AG under Awolowo became the official opposition. Independence came on <b>1 October 1960</b>. Nigeria became a republic on <b>1 October 1963</b> — Azikiwe became first President. The 1964 federal elections were deeply contested; the 1965 Western Region elections were fraudulent ("Wild Wild West") — setting the stage for the January 1966 coup.</p>'},
{lb:'Model evaluation',dr:dQ1,ht:'<p>Model evaluation paragraph for Azikiwe: "Nnamdi Azikiwe made the most significant single contribution to Nigerian independence. His West African Pilot newspaper reached 12,000 readers daily, giving the movement a national voice. His founding of the NCNC (1944) with Macaulay and the subsequent national tour mobilised mass support. As Nigeria\'s first President (1963), he embodied pan-Nigerian unity above ethnic politics. However, in practice the NCNC drew primarily on Igbo support, and his failure to prevent the First Republic\'s collapse showed the limits of his pan-Nigerian vision." This balance — specific evidence + nuanced evaluation — is what WAEC rewards. Know achievements AND limitations for every leader.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The correct chronological order of party formation is:',o:['NPC (1944), NCNC (1951), AG (1951)','NCNC (1944), NPC (1951), AG (1951)','AG (1944), NCNC (1946), NPC (1951)','NNDP (1944), NPC (1951), NCNC (1953)'],a:2,w:'NCNC — founded 1944 by Macaulay and Azikiwe. NPC — founded 1951 by Ahmadu Bello. AG — founded 1951 by Awolowo. The NCNC was the earliest of the major independence parties. The NNDP was Macaulay\'s earlier party (1923), not one of the major three that contested the 1959 independence elections.'},{q:'Which statement BEST describes Awolowo\'s concept of Nigerian federalism?',o:['Nigeria should be a unitary state with one powerful central government','Nigeria should have exactly three regions — North, East and West — permanently','Nigeria should be a federal state with regions based on linguistic-ethnic groups — many more and smaller units that match cultural realities','Nigeria should be divided between the North and South as two sovereign states in a confederation'],a:3,w:'Awolowo\'s "Path to Nigerian Freedom" (1947) argued for a federal Nigeria with regions based on linguistic groups. He believed three regions were too few; he advocated many more, smaller, ethnically coherent units. This vision later influenced the creation of more states (12 in 1967; 36 today).'},{q:'The NPC-NCNC coalition that won the 1959 elections and governed Nigeria at independence was:',o:['An ideological partnership based on shared socialist values','A power-sharing arrangement between the two largest parties — a pragmatic deal with no ideological common ground, with the AG as official opposition','A merger of all three parties into a national unity government','A British-arranged caretaker government excluding Nigerian nationalist parties'],a:2,w:'The NPC-NCNC coalition (1959-66) was purely pragmatic: neither party had a majority; they shared power. There was no ideological overlap — the NPC was conservative and the NCNC more progressive. The coalition\'s weakness contributed to the First Republic\'s instability.'},{q:'The first sub-Saharan African country to gain independence from British colonial rule was:',o:['Nigeria (1960)','Kenya (1963)','Ghana/Gold Coast (1957)','Sierra Leone (1961)'],a:3,w:'Ghana (the Gold Coast, under Kwame Nkrumah) gained independence on 6 March 1957 — the first sub-Saharan British African colony to do so. This was enormously significant: it proved independence was achievable through constitutional means and directly inspired and pressured Nigerian nationalists to accelerate their own independence drive, achieved just three years later in 1960.'},{q:'Which party did Obafemi Awolowo found in 1951?',o:['The Action Group (AG)','The NCNC','The NPC','The NNDP'],a:1,w:'Awolowo founded the Action Group (AG) in 1951.'},{q:'Which party was primarily associated with the Northern Region under Ahmadu Bello?',o:['The Northern People\'s Congress (NPC)','The Action Group','The NCNC','The NNDP'],a:1,w:'The Northern People\'s Congress (NPC) was primarily associated with Ahmadu Bello and the Northern Region.'},{q:'What was a key criticism of Nigeria\'s regional party system at independence?',o:['Parties were organised along ethnic/regional lines rather than national ideology','There was only one political party','Parties had no regional base at all','Parties were banned before 1960'],a:1,w:'Nigeria\'s major parties were criticised for being organised along ethnic/regional lines rather than national ideology.'},{q:'Besides Ghana, which West African country gained independence in the late 1950s, inspiring Nigerian nationalists?',o:['Guinea (1958)','South Africa','Ethiopia','Liberia'],a:1,w:'Guinea gained independence in 1958, part of the wave of West African decolonisation inspiring Nigerian nationalists.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 POL',ti:'Mixed Revision — Nationalism',su:'Final integrated revision on nationalism and decolonisation.',steps:[
{lb:'Complete summary',dr:dQ10,ht:'<p>Nationalism and decolonisation summary: Key parties: NNDP 1923 (Macaulay); NCNC 1944 (Macaulay/Azikiwe); AG 1951 (Awolowo); NPC 1951 (Bello). Key figures: Azikiwe (NCNC; journalist; Pan-African; 1st GG/President); Awolowo (AG; free education; imprisoned 1962); Bello (NPC; Sardauna; killed 1966); Balewa (NPC; 1st PM; killed 1966); Macaulay (father of nationalism; died 1946); Funmilayo (women\'s rights; AWU; Alake abdication 1949). Global context: Pan-Africanism (Du Bois, Garvey); Manchester Congress 1945; Ghana independence 1957; Atlantic Charter 1941; UN Resolution 1514 1960. First Republic: NPC-NCNC coalition; Western Region crisis 1962-63; rigged elections 1964-65; January 1966 coup (Nzeogwu; mainly Igbo; Balewa/Bello/Akintola killed); counter-coup July 1966.</p>'},
{lb:'Key evaluations',dr:dQ10,ht:'<p>Key evaluations for WAEC: (1) Who contributed most to Nigerian independence? Azikiwe (mass mobilisation; journalism; pan-African vision). Awolowo (western governance model; free education; federal theory). Balewa (federal leadership at independence). Macaulay (pioneer who bridged protest and nationalism). No single answer — WAEC rewards balance and evidence. (2) Why did the First Republic fail? Ethnic-regional parties; Westminster model mismatch; election rigging; political violence; absence of constitutional culture. (3) Was the January 1966 coup justified? Against: violated democratic norms; elected government overthrown. For: First Republic had become ungovernable; elections rigged; widespread violence. WAEC rewards balance and specific evidence over one-sided answers.</p>'},
{lb:'Synthesis',dr:dQ1,ht:'<p>Synthesis: Nigerian nationalism was simultaneously a movement for independence from colonialism AND a competition among Nigeria\'s ethnic-regional groups for dominance in any post-colonial state. This dual character — anti-colonial unity combined with inter-ethnic competition — defined the independence struggle and shaped post-independence failures. The nationalist leaders who united to demand independence found it harder to govern together after independence. The constitutional framework inherited from Britain (Westminster model; three regions) was ill-suited to managing Nigeria\'s multi-ethnic complexity. The military coup of January 1966 was the direct consequence of this failure to build a constitutional culture that could contain ethnic-regional competition.</p>'},
{lb:'WAEC final tips',dr:dQ2,ht:'<p>Final WAEC tips — nationalism and decolonisation: (1) Know all three major parties: NCNC (Azikiwe/Igbo East), AG (Awolowo/Yoruba West), NPC (Bello/Hausa-Fulani North). (2) Know key dates: 1944 (NCNC); 1951 (AG/NPC); 1959 elections results (NPC 134; NCNC 89; AG 73); 1960 Oct.1 independence; 1963 republic; Jan.1966 coup. (3) Always connect nationalism to constitutional development — each constitution stimulated new political organising. (4) Know women\'s contributions (Aba 1929; Funmilayo; AWU) — examiners increasingly include women\'s history. (5) Know the global context — Pan-Africanism, Atlantic Charter, Ghana 1957, UN Resolution 1514. (6) For evaluation essays: know both achievements AND limitations of each leader. (7) The First Republic collapse is a key cause-and-effect question — know all causes with evidence.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[
{q:"Nigerian independence on 1 October 1960 was achieved through:",o:["Armed revolution by nationalist fighters","Negotiated constitutional advancement — a gradual process from 1922-1960 in which nationalists worked within the colonial system, expanding Nigerian autonomy until independence was achieved","UN sanctions forcing British withdrawal","Economic pressure from the United States"],a:2,w:"Nigerian independence was negotiated, not won by armed struggle. The nationalist parties worked within the constitutional framework — contesting elections, filling ministerial posts, attending Lancaster House conferences — until independence came on 1 October 1960."},
{q:'The carpet crossing incident in the Western Region (1951-52) involved:',o:['MPs physically crossing the floor of the House to join another party during a vote','Awolowo\'s AG members persuading NCNC elected members to defect to the AG — giving the AG a majority and denying Azikiwe the Western premiership despite NCNC having more seats','The Federal government crossing its constitutional jurisdiction into the Western Region','Members of the Oyo Mesi crossing into the Western House of Assembly uninvited'],a:2,w:'In the 1951 Western Region elections, the NCNC won more seats than the AG. But Awolowo\'s AG persuaded NCNC elected members to defect to the AG, giving it a majority. Azikiwe was denied the Western premiership — motivating him to return to the East.'},
{q:"The significance of 1 October as Nigeria's Independence Day is that:",o:["It was the anniversary of the Battle of Lagos","It was chosen by Nigerian nationalists as auspicious according to Yoruba calendar traditions","On 1 October 1960, Nigeria formally became independent from Britain with Tafawa Balewa as Prime Minister — ending 99 years of formal British colonial rule","It was the day the United Nations formally admitted Nigeria as a member state"],a:3,w:"1 October 1960: Nigeria became formally independent, ending British colonial rule dating from the 1861 Lagos annexation (99 years). Tafawa Balewa became PM; Azikiwe became Governor-General. The date 1 October is now National Day."},
{q:"Which statement about the role of World War II in Nigerian nationalism is most accurate?",o:["World War II delayed Nigerian nationalism because nationalists supported Britain and stopped campaigning","Nigerian soldiers who fought for British freedom in Europe and Asia returned asking why they had freedom abroad but not at home — radicalising the post-war nationalist movement, combined with the Atlantic Charter (1941) and Indian independence (1947)","World War II had no significant impact on Nigerian nationalism","The Atlantic Charter immediately granted independence to all British colonies"],a:2,w:"Nigerian soldiers (about 100,000) served in WWII fighting for freedom. Returning home to colonial rule, they experienced the contradiction acutely. Combined with the Atlantic Charter and the Indian independence example (1947), the post-war period radicalised the independence movement."}
,{q:"What role did Nigerian soldiers who served in World War II play in post-war nationalism?",o:["Many returned demanding rights and self-government","They actively opposed independence","They had no political influence afterward","They were barred from returning to Nigeria"],a:1,w:"Many WWII veterans returned with heightened political awareness, demanding rights and self-government."},{q:"What was the significance of the 1951-52 Western Region \"carpet crossing\" incident for party politics?",o:["It showed how fragile party loyalty could be","It ended all political parties","It led to a military coup","It caused Western Region's secession"],a:1,w:"The carpet crossing incident showed how fragile party loyalty could be, reshaping regional power balance."},{q:"Nigeria's constitutional path to independence is often contrasted with which other approach used elsewhere in Africa?",o:["Armed liberation struggle (e.g. Algeria, Kenya's Mau Mau)","No other African country sought independence","Immediate unilateral declaration","Direct UN administration"],a:1,w:"Nigeria's negotiated path contrasts with armed liberation struggles seen in Algeria and Kenya."},{q:"What is one criticism of describing Nigeria's independence as entirely \"peaceful\"?",o:["Underlying regional and ethnic tensions were not resolved","There were no tensions at all before or after","It was actually won through war","Independence was never really granted"],a:1,w:"Critics note that underlying regional and ethnic tensions were not resolved and later contributed to conflict."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 POL',ti:'Further Practice — Nationalism',su:'Additional practice questions on nationalism and decolonisation.',steps:[
{lb:'Extended practice',dr:dQ2,ht:'<p>Extended practice questions: (1) "Assess the contribution of Obafemi Awolowo to Nigerian political development." Points: AG founding 1951; Western Region Premier 1954-59; free primary education 1955 (first in sub-Saharan Africa); "Path to Nigerian Freedom" (1947) — federal vision; Nigeria\'s first TV station (Ibadan 1959); imprisoned 1962 (politically motivated); federal opposition leader; presidential candidate 1979/1983. Evaluation: most effective governor of the independence era; governance model decades ahead of its time; BUT AG was primarily Yoruba-based despite pan-Nigerian rhetoric; his imprisonment prevented him leading the federation he had envisioned. (2) "Discuss the factors that led to Nigerian independence in 1960." Points: constitutional development; nationalist organisations; WWI/II soldiers; Atlantic Charter; Pan-Africanism; Ghana 1957; UN pressure.</p>'},
{lb:'Comparing nationalist leaders',dr:dQ2,ht:'<p>Comparison framework: Azikiwe vs Awolowo. Azikiwe: NCNC; eastern Igbo base despite pan-Nigerian rhetoric; journalist/newspaper (West African Pilot); US-educated (Howard, Lincoln); first President; charismatic and populist; ideologically pan-African and democratic. Awolowo: AG; Yoruba/Western base; lawyer; London-educated; free education policy (concrete achievement); federal vision; more intellectual and programmatic; imprisoned. On legacy: Azikiwe — political (first President); symbolic (Zik of Africa). Awolowo — governance (free education; first TV station); intellectual (federal theory). Both essential: without Azikiwe — no mass independence movement; without Awolowo — no developmental governance model. Both had limitations: ethnic-regional base vs national aspiration; neither prevented the First Republic\'s collapse.</p>'},
{lb:'Women in nationalism — extended',dr:dQ1,ht:'<p>Women\'s contributions to Nigerian nationalism: (1) <b>Aba Women\'s Riots (1929)</b> — the largest anti-colonial uprising in colonial Nigerian history; approximately 50 women killed; forced British inquiry into Warrant Chief system. (2) <b>Funmilayo Ransome-Kuti (AWU 1946)</b> — forced Alake abdication 1949; abolished women\'s taxation in Abeokuta; international figure (met Mao, Khrushchev, Nkrumah). (3) <b>Market women\'s networks</b> — women\'s market associations spread nationalist messages in communities not reached by newspapers. (4) <b>Women\'s wings of parties</b> — NCNC, AG women\'s wings mobilised millions of voters. Despite these contributions, women were largely excluded from formal political leadership; northern women could not vote in federal elections until 1979.</p>'},
{lb:'First Republic synthesis',dr:dQ2,ht:'<p>First Republic synthesis: The First Republic (1960-66) failed not because of its constitutional design but because of an absence of democratic culture: parties would not accept electoral defeat (1964, 1965 elections rigged); politicians manipulated constitutional mechanisms for ethnic advantage; violence was used to settle political disputes. Constitutional design (Westminster vs presidential) matters less than the willingness of all political actors to abide by constitutional rules — a lesson Nigeria has revisited repeatedly since 1960. The structural cause (ethnic-regional parties in a winner-takes-all system) was colonial in origin (three-region structure, Richards 1946); the proximate cause (the choices of political leaders in 1962-65) was post-independence. Both colonial and post-independence failures contributed.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Which of the following BEST evaluates Nigerian nationalism 1920-1960?',o:['It was a unified movement with one ideology and leadership from start to finish','It was entirely ethnic — there was no genuine pan-Nigerian aspiration at any point','It was simultaneously a movement against colonialism AND a competition among ethnic-regional groups for post-colonial dominance — this dual character both united and divided nationalists','It was driven entirely by economic grievances about colonial taxation with no political or ideological content'],a:3,w:'The most nuanced and accurate evaluation: Nigerian nationalism combined genuine anti-colonial sentiment (demanding independence from Britain) with inter-ethnic competition (each major group seeking dominance in the post-colonial state). This dual character — most visible in the three ethnically-based major parties — both enabled independence (all groups wanted it) and undermined the post-independence state (all groups competed within it).'},{q:'The Western Region crisis (1962-63) demonstrated which fundamental problem of the First Republic?',o:['The Western Region was too small and needed to be divided into smaller states','Federal politicians were willing to manipulate constitutional mechanisms (states of emergency, treason charges) for partisan advantage — showing absence of constitutional culture and democratic norms','The Action Group\'s socialist policies were incompatible with federal government\'s capitalist approach','The British-designed constitution was too complex even for trained lawyers to understand'],a:2,w:'The Western Region crisis showed: Awolowo (federal opposition) vs Akintola (Western PM) was a power struggle; the federal government\'s state of emergency and Awolowo\'s imprisonment for treason were widely seen as politically motivated; the constitution was used as a weapon rather than respected as a framework. This absence of constitutional culture — shared rules respected even by losers — was the First Republic\'s fatal weakness.'},{q:'Nnamdi Azikiwe\'s major achievement at Nigerian independence was:',o:['Becoming Nigeria\'s first Prime Minister with executive power to govern','Serving as Governor-General (1960) then first President (1963) — symbolic head of state; his pan-African vision and journalism had earlier built the mass support that made independence politically inevitable','Winning the 1959 federal elections with an outright majority for the NCNC','Writing the 1960 Independence Constitution single-handedly'],a:2,w:'Azikiwe became Governor-General (1960) — a ceremonial head of state role under the Westminster model — not the executive Prime Minister (that was Balewa). His greatest achievements were earlier: the West African Pilot newspaper that gave nationalism a voice; the NCNC\'s mass mobilisation; and his pan-African intellectual framework. At independence he was a unifying symbolic figure; the executive power was Balewa\'s.'},{q:'The January 1966 coup is described as an "Igbo coup" because:',o:['All the coup plotters were from Igboland','The mainly Igbo coup plotters killed northern and Yoruba leaders (Balewa, Bello, Akintola) while largely sparing Igbo political and military figures — creating a perception of ethnic targeting regardless of actual intent','The coup was announced on Radio Nigeria in the Igbo language before the national broadcast','Nnamdi Azikiwe publicly endorsed the coup, giving it an Igbo presidential seal of approval'],a:2,w:'The coup of 15 January 1966 killed Tafawa Balewa (Hausa-Fulani), Ahmadu Bello (Hausa-Fulani), Samuel Akintola (Yoruba) and several northern military officers — while Igbo political and military figures were largely unharmed. This pattern — whether coincidental or intentional — led northern Nigerians to conclude it was an Igbo coup. The counter-coup of July 1966 and subsequent anti-Igbo massacres in the North were partly driven by this perception.'},{q:'What best characterises the differences among Nigeria\'s main nationalist leaders (Azikiwe, Awolowo, Bello)?',o:['They had differing regional bases and visions for Nigeria\'s future','They were from the exact same region and party','They agreed on every political question','None of them sought self-government'],a:1,w:'The three leaders had differing regional bases, ideologies and visions for Nigeria\'s political future.'},{q:'What was a key outcome of the Western Region crisis of 1962-63 for Nigerian federalism?',o:['It exposed how federal intervention could be used for political advantage','It strengthened trust between the regions','It led immediately to Nigeria\'s independence','It had no lasting political consequences'],a:1,w:'The crisis exposed how federal intervention could be used for political advantage, undermining regional autonomy.'},{q:'What ceremonial/constitutional role did Azikiwe hold at Nigeria\'s independence in 1960?',o:['Governor-General','Federal Prime Minister','Chief Justice','Army Chief of Staff'],a:1,w:'Azikiwe served as Governor-General, representing the Queen as head of state, at independence.'},{q:'What was one major consequence of the January 1966 coup for Nigerian politics?',o:['It ended the First Republic and led to military rule','It restored full civilian democracy immediately','It reunited all regions under one party','It had no impact on governance'],a:1,w:'The January 1966 coup ended the First Republic and ushered in military rule.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 POL',ti:'Revision — Nationalism Quick Fire',su:'Quick-fire revision across nationalism and decolonisation.',steps:[
{lb:'Quick review — parties and leaders',dr:dQ1,ht:'<p>Quick review: NCNC (1944) — National Council of Nigeria and the Cameroons; founded by Macaulay and Azikiwe; Igbo/East base; pan-Nigerian aspiration. AG (1951) — Action Group; founded by Awolowo; Yoruba/West base; free education; federal vision. NPC (1951) — Northern People\'s Congress; founded by Bello; Hausa-Fulani/North base; conservative; traditional ruler network. NNDP (1923) — Nigerian National Democratic Party; Macaulay; first Nigerian party; Lagos elections. NYM (1934) — Nigerian Youth Movement; first truly national party. 1959 elections: NPC 134; NCNC 89; AG 73. NPC-NCNC coalition → Balewa PM; Azikiwe GG → 1 October 1960 independence → 1 October 1963 republic (Azikiwe President).</p>'},
{lb:'Quick review — women and pan-Africanism',dr:dQ2,ht:'<p>Women: Aba Women\'s Riots (1929) — Igboland; Warrant Chiefs + fear of taxation; ~50 women killed; British inquiry reformed Warrant Chief system; largest anti-colonial uprising in colonial Nigeria. Funmilayo Ransome-Kuti (1900-1978) — AWU 1946; Alake abdication 1949; women\'s taxation abolished Abeokuta; met Mao/Khrushchev/Nkrumah; "lioness of Lisabi." Northern women could not vote in federal elections until 1979. Pan-Africanism: Du Bois (Pan-African Congresses); Garvey (UNIA; Back to Africa; Black pride); Nkrumah (Ghana 1957; "seek ye first the political kingdom"); Manchester Congress 1945 (Africans took control; immediate independence demanded). Atlantic Charter (1941): right of peoples to self-determination. Indian independence (1947): showed Britain could decolonise. UN Resolution 1514 (1960): colonialism = human rights violation.</p>'},
{lb:'Quick review — First Republic collapse',dr:dQ2,ht:'<p>First Republic collapse (1960-66): Causes — 3 ethnically-based parties in a winner-takes-all Westminster system; AG split 1962; Western Region state of emergency 1962; Awolowo imprisoned 1962-66; rigged 1964 federal elections (NNA vs UPGA); "Wild Wild West" 1965 Western Region elections (widespread fraud and violence). January 1966 coup: mainly Igbo officers (Nzeogwu); Balewa (PM), Bello (Premier North) and Akintola (Premier West) killed; Igbo leaders largely spared → perceived as "Igbo coup." July 1966 counter-coup: northern officers; Major-General Ironsi killed; Gowon takes power. Civil war 1967-70 (Biafra) follows from these events. Military rule (with brief interludes) lasted until 1999 (Fourth Republic).</p>'},
{lb:'Key quotations and their significance',dr:dQ1,ht:'<p>Key quotations: (1) "Show the light and the people will find the way" (Azikiwe/West African Pilot) — journalism as political enlightenment; education as path to independence. (2) "Seek ye first the political kingdom" (Nkrumah) — political independence must come before economic development; influenced pan-African thought. (3) " Nigeria\'s independence is meaningless unless it is linked with the total liberation of the African continent" (Nkrumah at Ghana\'s independence 1957) — pan-African interdependence. (4) "A marriage of inconvenience" (critics of 1914 Amalgamation) — captures the tensions of joining profoundly different peoples without consent. Know these for quotation-based WAEC questions.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[
{q:"The Dual Mandate theory (Lugard) and the path to Nigerian freedom (Awolowo) both addressed:",o:["Which colonial power should control Nigeria","How Nigeria should organise its military after independence","The relationship between governance and the welfare of Nigerian people — though from completely different perspectives (colonial exploitation vs indigenous self-governance)","Whether Nigeria should join the British Commonwealth at independence"],a:3,w:"Both addressed governance and the people's welfare — from opposite angles. Lugard's Dual Mandate justified colonialism as serving both British commercial interests AND African civilisation. Awolowo's Path to Nigerian Freedom (1947) argued for self-governance with regions based on linguistic groups."},
{q:"Which BEST assesses Tafawa Balewa's contribution to Nigerian independence?",o:["He was the most charismatic nationalist leader whose speeches inspired millions","He was a moderate, respected Federal Prime Minister who represented the NPC in the independence coalition government — his steady leadership ensured a peaceful transfer of power on 1 October 1960, though he lacked the political strength to prevent the Republic's eventual collapse","He was the primary architect of the 1954 Lyttleton Constitution that made independence possible","He led the military campaign that forced Britain to agree to Nigerian independence"],a:2,w:"Balewa (1912-1966) was a moderate, respected figure whose greatest contribution was providing steady federal leadership during the transition to independence. He was not the most charismatic nationalist but was trusted across ethnic lines and provided stability needed for peaceful independence."},
{q:"That women in northern Nigeria could not vote in federal elections until 1979 illustrates:",o:["That Nigerian women generally had less political capacity than men","Women were entirely passive and played no role in Nigerian political history","The inconsistency between Nigeria's formal independence claiming democratic rights and the reality of women's political exclusion — especially in the North where the NPC/emirate system maintained gender exclusion aligned with Islamic-traditional norms","That northern women chose not to vote as a cultural preference with no external pressure"],a:3,w:"Nigerian independence in 1960 declared democratic governance — but northern women were excluded from federal elections until the Second Republic (1979). The NPC government operating through the emirate system maintained traditional gender exclusion. This reveals the gap between formal democratic rhetoric and gendered political reality."},
{q:"To what extent was the collapse of the First Republic Nigeria's own fault rather than colonialism's legacy?",o:["Entirely colonialism's fault — Nigerian leaders had no ability to make different choices","Entirely Nigeria's own fault — colonial policies had no lasting political consequences after 1960","Both: colonial policies created the structural conditions (three-region structure; Westminster model; ethnic politics) and Nigerian leaders made choices that worsened those conditions (election rigging; political violence; refusal to accept constitutional norms)","Neither — the collapse was inevitable regardless"],a:3,w:"The most accurate evaluation: both colonial legacy AND Nigerian leaders' choices contributed. Colonial legacy created the structure: three-region ethnic politics; Westminster model unsuited to multi-ethnic reality; export economy creating resource competition. Nigerian leaders made it worse: rigged elections 1964-65; refusal to accept electoral defeat."}
,{q:"What was the core idea behind Lord Lugard's \"Dual Mandate\" theory of colonial rule?",o:["That colonial powers should develop colonies for both the colonising power's benefit and local welfare","That colonies should be immediately granted independence","That colonies should have no economic development","That local rulers should have no role in governance"],a:1,w:"The Dual Mandate argued colonial rule should serve both British commercial interests and local welfare."},{q:"What leadership style is Tafawa Balewa generally remembered for as Nigeria's first Prime Minister?",o:["A calm, moderate and conciliatory leadership style","An authoritarian, one-party approach","Open hostility toward all other regions","Complete withdrawal from politics"],a:1,w:"Balewa is remembered for a calm, moderate and conciliatory leadership style as Prime Minister."},{q:"Why were northern Nigerian women denied the vote in federal elections until 1979?",o:["Conservative religious and cultural traditions restricted women's participation","Northern women did not want to vote","Federal law banned women nationwide","Women were not Nigerian citizens"],a:1,w:"Conservative religious and cultural traditions in the region restricted women's political participation until 1979."},{q:"What is a balanced historical view of responsibility for the First Republic's collapse?",o:["Both colonial-era structural weaknesses and Nigerian leaders' choices contributed","It was purely due to colonial policy with no Nigerian responsibility","It was purely due to Nigerian leaders with no colonial contribution","No historical explanation is possible"],a:1,w:"Historians generally attribute the collapse to both colonial-era structural weaknesses and Nigerian leaders' political choices."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 POL',ti:'WAEC Prep — Final Revision (Nationalism)',su:'Final WAEC preparation covering nationalism and decolonisation.',steps:[
{lb:'Essay planning practice',dr:dQ1,ht:'<p>25-mark essay plan: "Assess the contribution of Nnamdi Azikiwe to Nigeria\'s independence." Introduction (3 sentences): Context — Nigerian nationalism 1920s-1960; who Azikiwe was; main argument (most significant single contributor). Points: 1. West African Pilot (1937) — journalism as nationalism; 12,000 readers daily. 2. NCNC founding (1944) with Macaulay — first mass national party. 3. NCNC national tour (1946-47) — mass mobilisation across Nigeria. 4. Pan-African ideology — gave nationalism intellectual depth and international connections (Du Bois, Nkrumah). 5. First President (1963) — symbolic unity. Limitations: NCNC in practice Igbo-based; First Republic failed. Conclusion: greatest mass mobiliser; but limited success in post-independence governance. 400-500 words, specific evidence throughout.</p>'},
{lb:'Essay planning — Awolowo',dr:dQ2,ht:'<p>25-mark essay plan: "Assess the contribution of Obafemi Awolowo to Nigeria\'s political development." Introduction: Context — Yoruba-based nationalism; AG 1951; Western Region premiership. Points: 1. AG founding (1951) — based on Egbe Omo Oduduwa; disciplined grassroots organisation. 2. Free primary education (1955) — first in sub-Saharan Africa; transformed Yoruba educational attainment. 3. First TV station in Africa (Ibadan 1959) — Western Region under Awolowo. 4. "Path to Nigerian Freedom" (1947) — federal vision ahead of its time; influenced later state creation. 5. Federal opposition leader — kept democratic opposition alive during First Republic. Limitations: AG was primarily Yoruba-based; imprisoned 1962 (politically motivated); could not prevent collapse. Conclusion: most effective regional governor; federal vision ahead of its time; but limited national reach.</p>'},
{lb:'Key points for common questions',dr:dQ2,ht:'<p>Key points for common WAEC questions: "Factors leading to collapse of First Republic": (1) Three ethnically-based parties in winner-takes-all system. (2) AG split and Western Region crisis 1962-63. (3) Rigged 1964 federal elections. (4) "Wild Wild West" 1965 electoral violence. (5) Absence of constitutional culture — parties would not accept electoral defeat. "Factors leading to Nigerian nationalism": (1) Western education — created elite who demanded rights they read about. (2) WWI/II veterans — fought for freedom abroad, denied it at home. (3) Atlantic Charter 1941 — self-determination principle. (4) Pan-Africanism — Du Bois, Garvey, Manchester 1945. (5) Indian independence 1947 — proved Britain could decolonise. (6) Ghana 1957 — pressured Nigeria. "Role of women": Aba 1929; Funmilayo; market women; party women\'s wings.</p>'},
{lb:'Final tips',dr:dQ2,ht:'<p>Final tips for WAEC nationalism questions: (1) Know all three parties with founders, dates and bases: NCNC 1944 (Macaulay/Azikiwe; East); AG 1951 (Awolowo; West); NPC 1951 (Bello; North). (2) 1959 elections: NPC 134; NCNC 89; AG 73. Know these numbers. (3) Independence: 1 October 1960. Republic: 1 October 1963. (4) January 1966 coup: mainly Igbo officers; Balewa/Bello/Akintola killed. July 1966 counter-coup: northern officers; Ironsi killed; Gowon. (5) Always mention women\'s contributions when discussing nationalism — WAEC rewards inclusivity. (6) Connect nationalism to constitution: each constitution stimulated new party formation. (7) For evaluation questions: both achievements AND limitations; concluded judgment. (8) Specific names, dates and events score marks over vague generalisations.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Macaulay\'s NNDP (1923) was founded in direct response to:',o:['The Amalgamation (1914) creating a Nigeria without Nigerian consent','The Clifford Constitution (1922) creating elections — Macaulay founded the NNDP to contest the new Lagos Council seats','The Richards Constitution (1946) formalising the three-region structure','Lord Lugard\'s dismissal of the educated elite from colonial administration positions'],a:2,w:'The Clifford Constitution (1922) created the first elections in Nigeria. Herbert Macaulay immediately founded the NNDP (1923) to contest those elections. The NNDP dominated Lagos Council elections through the 1920s-30s, giving Macaulay his political platform. Constitutional change directly stimulated political organisation.'},{q:'The Aba Women\'s Riots (1929) demonstrated that:',o:['Women lacked organised political capacity in colonial Nigeria','The British colonial administration was benevolent and willing to negotiate','Women were politically active, capable of mass organisation, and could force policy changes — the largest anti-colonial uprising in colonial Nigerian history, directly reforming the Warrant Chief system','Only educated urban women participated in colonial Nigerian politics'],a:3,w:'The Women\'s War (Ogu Umunwanyi) demonstrated: women\'s capacity for organised mass political action; the effectiveness of traditional protest methods (anlu/"sitting on a man"); the breadth of anti-colonial sentiment beyond the educated urban elite; and that mass action could force colonial policy reform (British inquiry led to reform of Warrant Chief system).'},{q:'Which of the following CORRECTLY pairs a nationalist with a specific achievement?',o:['Awolowo → West African Pilot newspaper (1937) giving nationalism a national voice','Azikiwe → free primary education in Eastern Region (1955)','Funmilayo Ransome-Kuti → forced abdication of the Alake of Abeokuta (1949) through the Abeokuta Women\'s Union\'s campaign','Tafawa Balewa → founding the NCNC (1944) as Nigeria\'s first mass nationalist party'],a:3,w:'Funmilayo Ransome-Kuti → AWU (1946) → forced temporary abdication of Alake of Abeokuta (1949) and abolished women\'s taxation in Abeokuta. Azikiwe founded the West African Pilot (1937). Free primary education was Awolowo\'s (Western Region, 1955, not Eastern). The NCNC (1944) was co-founded by Macaulay and Azikiwe.'},{q:'Nigerian independence was a peaceful transfer of power. The significance of this is:',o:['No other African country achieved independence peacefully — Nigeria set a unique precedent on the continent','It demonstrated that the constitutional path to independence could succeed without armed struggle — contrasting with Algeria (FLN), Kenya (Mau Mau), and others; and showing that organised nationalism within the colonial system could achieve independence','The British had planned Nigerian independence since 1945 so there was no possibility of resistance by 1960','Nigerian military forces had already secured all strategic positions, making British resistance impossible'],a:2,w:'Nigeria\'s independence contrasts with violent decolonisation in Algeria (FLN vs France, 1954-62), Kenya (Mau Mau 1952-60), and others. The constitutional path — working within the colonial framework through elections, parties and constitutional negotiations — achieved independence peacefully. This was a model that impressed other African nations and initially gave Nigeria prestige on the continent.'},{q:'What triggered the Aba Women\'s Riots of 1929 in southeastern Nigeria?',o:['Fears that colonial taxation would be extended to women','A dispute over land ownership','A religious conflict between Christians and Muslims','A demand for immediate independence'],a:1,w:'Fears that colonial authorities would extend direct taxation to women triggered the Aba Women\'s Riots.'},{q:'What was Herbert Macaulay\'s main significance in early Nigerian nationalism?',o:['He founded the NNDP, Nigeria\'s first political party','He led Nigeria to independence as Prime Minister','He wrote the 1960 constitution','He was the first military head of state'],a:1,w:'Macaulay founded the NNDP in 1923, Nigeria\'s first political party, to contest Clifford Constitution elections.'},{q:'Which nationalist figure is most associated with promoting free primary education in the Eastern Region?',o:['Nnamdi Azikiwe','Obafemi Awolowo','Ahmadu Bello','Herbert Macaulay'],a:1,w:'Nnamdi Azikiwe is associated with promoting free primary education initiatives in the Eastern Region.'},{q:'Which African country\'s independence movement is most often compared with Nigeria\'s relatively peaceful constitutional path?',o:['Ghana\'s','Algeria\'s','Kenya\'s','Mozambique\'s'],a:1,w:'Ghana\'s constitutional, largely negotiated path to independence is most often compared with Nigeria\'s.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 POL',ti:'Mixed Revision — Full Nationalism Review',su:'Integrated revision across all nationalism and decolonisation topics.',steps:[
{lb:'Complete summary',dr:dQ10,ht:'<p>Nationalism and decolonisation complete summary: Political organisations: Peoples Union 1908; NCBWA 1920 (Casely Hayford); NNDP 1923 (Macaulay); NYM 1934; NCNC 1944 (Macaulay/Azikiwe); Egbe Omo Oduduwa 1948 (Awolowo); AG 1951 (Awolowo); NPC 1951 (Bello). Key figures: Macaulay (NNDP/NCNC; Father; died 1946); Azikiwe (West African Pilot; NCNC; 1st GG/President); Awolowo (AG; free education; imprisoned 1962); Bello (NPC; Sardauna; killed 1966); Balewa (NPC; 1st PM; killed 1966); Funmilayo (AWU; Alake abdication 1949). Pan-Africanism: Du Bois; Garvey; Manchester 1945; Nkrumah/Ghana 1957. Constitutions: Clifford 1922→NNDP; Richards 1946→AG/NPC 1951; Macpherson 1951; Lyttleton 1954; Independence 1960. First Republic collapse: AG split 1962; rigged elections 1964-65; Wild Wild West; Jan.1966 coup.</p>'},
{lb:'The connection between colonialism and nationalism',dr:dQ10,ht:'<p>The connection: colonial policies created the conditions for their own undoing. (1) Western education (mission schools) → educated elite → nationalist leaders (Azikiwe at US universities; Awolowo at London Inns of Court). (2) Constitutional concessions (Clifford 1922) → political parties (NNDP 1923) → further concessions → independence. (3) Exclusion of educated elite from indirect rule governance → radicalisation → nationalism. (4) Atlantic Charter (WWII) → nationalists used colonial power\'s own words against it. (5) Indian independence 1947 → proof colonialism could end. (6) Ghana 1957 → proof the constitutional path worked in West Africa. Each colonial policy contained its own contradiction — rule that required educated administrators educated the people who demanded self-rule.</p>'},
{lb:'Examination strategies',dr:dQ1,ht:'<p>WAEC examination strategies for nationalism questions: (1) Read the question carefully — "describe" ≠ "assess" ≠ "compare." (2) Plan 2-3 minutes: list 5 main points with key evidence. (3) Introduction: context (date/period); what the question is asking; main argument. (4) Each body paragraph: Point → Evidence (specific name/date/event) → Explanation → Significance. (5) Conclusion: overall judgment with specific evidence. (6) For evaluation/assessment questions: include BOTH positive AND negative points; conclude with a balanced judgment. (7) Time management: 25-mark questions ≈ 25-30 minutes. (8) Use technical terms correctly: nationalism, Pan-Africanism, elective principle, federation, Westminster model, constitutional culture, ethnic-regional politics. (9) Women\'s contributions — include when relevant; examiners reward inclusive answers.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>WAEC must-knows — nationalism and decolonisation: Party dates: NCNC 1944; AG 1951; NPC 1951. 1959 election results: NPC 134; NCNC 89; AG 73. Independence: 1 October 1960. First PM: Tafawa Balewa (NPC). First GG: Azikiwe (NCNC). Republic: 1 October 1963; Azikiwe first President. January 1966 coup: Nzeogwu; mainly Igbo officers; Balewa/Bello/Akintola killed. Pan-Africanism: Du Bois + Garvey + Manchester 1945 + Nkrumah. Ghana 1957: first sub-Saharan British colony to gain independence. Father of nationalism: Macaulay (died 1946). Free education: Awolowo (Western Region, 1955, first in sub-Saharan Africa). Aba Women\'s Riots: 1929; largest anti-colonial uprising; ~50 women killed; Warrant Chief system reformed. Funmilayo: AWU 1946; Alake abdication 1949. Know these facts cold for WAEC.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[
{q:"Which correctly pairs a constitution with the party/organisation it directly stimulated?",o:["Richards 1946 → NNDP 1923 (Macaulay founded NNDP to contest Richards elections)","Clifford 1922 → NNDP 1923 (Macaulay founded NNDP specifically to contest the new Lagos elections created by the Clifford Constitution)","Lyttleton 1954 → NCNC 1944 (Azikiwe founded NCNC in response to Lyttleton's federation)","Macpherson 1951 → NCBWA 1920 (Casely Hayford founded NCBWA in response to Macpherson)"],a:2,w:"Clifford 1922 (first elections) → NNDP 1923 (Macaulay founded NNDP specifically to contest the new Lagos Council seats). This is the clearest example of constitutional change directly stimulating political organisation."},
{q:"Marcus Garvey's Back to Africa movement contributed to Nigerian nationalism by:",o:["Persuading Nigerian nationalists to emigrate to the United States","Inspiring African pride and the idea that people of African descent had a common destiny — providing the cultural and psychological foundation for political nationalism","Providing direct funding to the NCNC through the UNIA's African fund","Organising armed resistance to colonialism that spread to Nigeria"],a:2,w:"Garvey's UNIA and Back to Africa message promoted Black pride, African unity and economic self-sufficiency. His ideas reached West Africa through newspapers and returning emigrants. They provided the cultural and psychological foundation for nationalism: the idea that Africans had the right to self-determination."},
{q:"Nkrumah's declaration at Ghana's independence (1957) reflects which political ideology?",o:["Nigerian nationalism — Nkrumah was expressing support for Nigeria's independence specifically","Pan-Africanism — the idea that African nations' independence is interconnected and that one nation's freedom is incomplete without continental liberation","Socialism — Nkrumah was expressing the need for African economic unity as the basis for political freedom","Commonwealth membership — Nkrumah was calling for stronger ties within the British Commonwealth"],a:2,w:"Pan-Africanism — the foundational idea that African peoples share a common destiny and that one nation's independence is incomplete without the liberation of all. This principle drove the pan-African congresses and was the intellectual framework that connected Nigerian nationalism to a global movement."},
{q:"The most significant difference between the NCNC and the NPC as independence parties was:",o:["The NCNC was funded by British colonial interests while the NPC was entirely self-funded","The NCNC aspired to pan-Nigerian identity and was more progressive, while the NPC was explicitly conservative, representing traditional northern interests and focused on protecting the North in any federal arrangement","The NPC had more educated leadership while the NCNC relied on illiterate traditional rulers","The NCNC was a military organisation while the NPC was purely civilian"],a:2,w:"The fundamental contrast: NCNC (Azikiwe) — pan-Nigerian aspiration, progressive, inspired by Pan-Africanism and US liberal democracy. NPC (Bello) — explicitly conservative, representing traditional rulers and the Islamic emirate system, focused on protecting northern interests and preventing southern domination in a post-independence federal Nigeria."}
,{q:"What was the central message of Marcus Garvey's \"Back to Africa\" movement?",o:["Promoting Black pride, unity and return of the African diaspora to Africa","Encouraging Africans to emigrate to Europe","Supporting continued colonial rule","Opposing all forms of African nationalism"],a:1,w:"Garvey's movement promoted Black pride, unity and the eventual return of the African diaspora to Africa."},{q:"What did Kwame Nkrumah's famous words at Ghana's 1957 independence emphasise?",o:["That Ghana's independence was linked to the liberation of the whole African continent","That Ghana would remain a British colony","That Ghana rejected all Pan-African ties","That independence should be indefinitely postponed"],a:1,w:"Nkrumah declared Ghana's independence was meaningless unless linked to the total liberation of Africa."},{q:"Which party is generally seen as having the more pan-Nigerian, national outlook among the main independence-era parties?",o:["The NCNC","The NPC","The AG","The NNDP"],a:1,w:"The NCNC is generally seen as having the more pan-Nigerian, national outlook among the major parties."},{q:"Which nationalist organisation preceded the NCNC as an early pan-Nigerian political movement?",o:["The Nigerian Youth Movement (NYM)","The Northern Elements Progressive Union","The Nigerian Labour Congress","The Sardauna Front"],a:1,w:"The Nigerian Youth Movement (NYM) preceded the NCNC as an early pan-Nigerian political movement."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 POL',ti:'Extended Mixed Revision',su:'Further comprehensive revision across nationalism topics.',steps:[
{lb:'Integrated topics',dr:dQ2,ht:'<p>This walkthrough has covered GOV-POL-03: Nationalism and Decolonisation in Nigeria — from the earliest political organisations (1908-1934) through the major independence parties (NCNC 1944; AG 1951; NPC 1951) to independence (1960) and the collapse of the First Republic (1966). Key themes: (1) Nationalism as both anti-colonial movement and inter-ethnic competition. (2) Women\'s essential but marginalised contribution. (3) Pan-African intellectual framework. (4) Constitutional development as the mechanism for achieving independence. (5) The structural and cultural causes of First Republic collapse. (6) Colonial legacies that shaped post-independence politics. All themes connect — they represent different dimensions of the same 40-year process from colonial protest to independent statehood.</p>'},
{lb:'Practice — comparing constitutions and nationalism',dr:dQ1,ht:'<p>Practice: "How did constitutional development shape Nigerian nationalism from 1922 to 1960?" Clifford 1922 → NNDP 1923 (first party/elections). Richards 1946 → NCNC national tour (opposition); AG/NPC founded 1951 (regional politics). Macpherson 1951 → first real consultations; regional assemblies; parties gain governance experience. Lyttleton 1954 → full federation; regional self-government; parties become regional governments (NCNC in East; AG in West; NPC in North). 1957 → Eastern and Western self-government. 1959 elections → transfer of power. Each constitution both responded to nationalist pressure AND created new political opportunities that nationalists exploited. The relationship was dialectical: nationalism drove constitutional change; constitutional change accelerated nationalism.</p>'},
{lb:'Practice — evaluating independence',dr:dQ2,ht:'<p>Practice: "Was Nigerian independence in 1960 a success?" For: peaceful transfer of power (contrast with Algeria\'s violence); a democratic constitution; all regions represented in government; national pride and pan-African inspiration; first sub-Saharan Commonwealth republic (1963). Against: independence rested on a fragile NPC-NCNC coalition with no ideological basis; Westminster model unsuited to multi-ethnic Nigeria; three ethnically-based parties made compromise difficult; military coup in January 1966 ended the First Republic just six years after independence. Overall: independence was achieved successfully but the post-independence governance structures were fragile from the start — partly a colonial legacy, partly the failure of political leaders to build constitutional culture. WAEC rewards this nuanced balance.</p>'},
{lb:'Final WAEC preparation',dr:dQ2,ht:'<p>Final WAEC preparation for POL-03: (1) Know all party founders, dates and bases (NCNC/Macaulay+Azikiwe/1944; AG/Awolowo/1951/West; NPC/Bello/1951/North). (2) Know 1959 election results (NPC 134; NCNC 89; AG 73). (3) Know independence date (1 October 1960) and republic date (1 October 1963). (4) Know roles: Balewa (1st PM); Azikiwe (1st GG → 1st President). (5) Know January 1966 coup facts: mainly Igbo officers; Nzeogwu; Balewa/Bello/Akintola killed. (6) Know women: Aba 1929 (largest anti-colonial uprising); Funmilayo (AWU 1946; Alake abdication 1949). (7) Know pan-Africanism: Du Bois; Garvey; Manchester 1945; Ghana 1957. (8) Know Atlantic Charter (1941) and UN Resolution 1514 (1960). (9) For evaluation essays: specific evidence + balanced judgment + legacy connection.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The correct sequence of Nigerian constitutional history is:',o:['Clifford→Richards→Macpherson→Lyttleton→Independence','Richards→Clifford→Lyttleton→Macpherson→Independence','Macpherson→Clifford→Richards→Lyttleton→Independence','Clifford→Macpherson→Richards→Lyttleton→Independence'],a:1,w:'The correct sequence: Clifford (1922) → Richards (1946) → Macpherson (1951) → Lyttleton (1954) → Independence (1960) → Republic (1963). Each constitution was more participatory than the last, progressively transferring power to Nigerian representatives until independence was achieved.'},{q:'Which statement BEST captures why the First Republic failed despite having a democratic constitution?',o:['The constitution was too complex and no one understood it','Democratic governance requires not just a constitution but a constitutional culture — a commitment by all parties to accept the rules even when losing; Nigeria\'s First Republic had the document but not the culture','The British deliberately designed the constitution to fail so they could reassert colonial control','Nigeria\'s ethnic diversity makes democratic governance inherently impossible'],a:2,w:'Constitutional culture — the willingness of all political actors to accept the rules, especially electoral results, even when losing — is the essential ingredient of democratic governance. Nigeria\'s First Republic had a constitution (1960) but not the culture: parties rigged elections when they feared losing; the constitution was used as a political weapon (Western Region emergency; Awolowo\'s imprisonment); violence replaced negotiation. The document without the culture failed.'},{q:'The January 1966 coup ended the First Republic. A BALANCED historical judgment would be:',o:['The coup was entirely justified — the elected government was so corrupt and incompetent that military intervention was the only option','The coup was entirely unjustified — democratic governments, however f
