<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}

.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}

.ar{display:flex;gap:8px;margin-top:6px;}

.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}

.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});

{ey:'Q1 \u2022 Government • Y11',ti:'Meaning of Local Government',su:'Understand what local government is and why it exists.',steps:[
  {lb:'What is local government?',dr:dQ1,ht:'<p>Local government is the third tier of government in Nigeria\'s federal system, operating at the grassroots level closest to the people, responsible for administering specific local affairs within a defined area (a Local Government Area, or LGA).</p>'},
  {lb:'Why local government exists',dr:dQ1,ht:'<p>Local government exists to bring governance closer to the people, address local needs more effectively than a distant central government could, and allow citizen participation in decisions affecting their immediate community.</p>'},
  {lb:'Legal basis in Nigeria',dr:dQ1,ht:'<p>Nigeria\'s 1999 Constitution (Section 7) guarantees a system of local government by democratically elected local government councils, and the Constitution lists Nigeria\'s 774 Local Government Areas in its First Schedule.</p>'},
  {lb:'Local government as the third tier',dr:dQ1,ht:'<p>Nigeria\'s federal structure has three tiers: federal, state, and local. Local government is the tier closest to citizens, handling matters like primary education, primary healthcare, sanitation, and local markets/roads.</p>'},

eral, local, state"],"a":1,"w":"Nigeria's federal structure comprises three tiers, from broadest to most local: federal, state, then local government."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q2 \u2022 Government • Y11',ti:'Structure of Local Government',su:'Understand how local government councils are organised.',steps:[
  {lb:'The Local Government Chairman',dr:dQ2,ht:'<p>Each Local Government Area is headed by an elected Chairman, who serves as the chief executive of the council, overseeing administration and implementation of council decisions.</p>'},
  {lb:'Councillors and the Legislative Council',dr:dQ2,ht:'<p>Councillors, elected from wards within the LGA, form the Legislative Council (or council legislature), responsible for making bye-laws, approving the budget, and overseeing the Chairman\'s administration.</p>'},
  {lb:'Departments and staff',dr:dQ2,ht:'<p>Local governments are organised into departments (e.g. works, health, education, finance/treasury) staffed by local government civil servants responsible for day-to-day service delivery within the LGA.</p>'},
  {lb:'Traditional rulers\' advisory role',dr:dQ2,ht:'<p>Traditional rulers, though without formal executive or legislative power under the Constitution, often play an advisory role in local government affairs, given their customary authority and closeness to communities.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Who serves as the chief executive of a Local Government Area?","o":["The elected Local Government Chairman","The state Governor directly","A traditional ruler with executive powers","The President"],"a":0,"w":"The elected Local Government Chairman serves as the chief executive, overseeing administration and implementation of council decisions."},{"q":"Councillors elected from wards within an LGA form the:","o":["Federal Executive Council","Legislative Council, which makes bye-laws and approves the budget","Supreme Court","National Assembly"],"a":1,"w":"Ward councillors form the Legislative Council, responsible for bye-laws, budget approval and oversight of the Chairman's administration."},{"q":"Which of these is a typical local government department?","o":["Defence","Foreign Affairs","Works, health, education, or finance/treasury","The Central Bank"],"a":2,"w":"Local governments are typically organised into departments such as works, health, education and finance/treasury for service delivery."},{"q":"What role do traditional rulers typically play in local government today?","o":["They directly control the LGA's budget","Full executive authority over the LGA","They have no connection to local government at all","An advisory role, given their customary authority, without formal executive/legislative power under the Constitution"],"a":3,"w":"Traditional rulers typically play an advisory role in local government, without holding formal constitutional executive or legislative power."},{"q":"What is the main function of the Legislative Council within local government?","o":["Making bye-laws, approving the budget, and overseeing the Chairman's administration","Conducting national elections","Setting national foreign policy","Declaring states of emergency"],"a":0,"w":"The Legislative Council's role includes making bye-laws, approving the local budget and overseeing the administration led by the Chairman."},{"q":"Which best describes the relationship between the Chairman and the Legislative Council?","o":["They have identical roles with no distinction","The Chairman leads administration/implementation while the Council legislates and provides oversight, similar to executive-legislature relations at other tiers","The Council has no oversight role over the Chairman at all","The Chairman is appointed by the Legislative Council rather than elected"],"a":1,"w":"The Chairman (executive) implements decisions while the Legislative Council (legislature) makes bye-laws and provides oversight — mirroring executive-legislature relations at higher tiers."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government • Y11',ti:'Functions of Local Government',su:'Explore what local governments are responsible for.',steps:[
  {lb:'Fourth Schedule functions',dr:dQ3,ht:'<p>Nigeria\'s 1999 Constitution (Fourth Schedule) assigns local governments functions including: economic planning, provision and maintenance of markets, motor parks, public conveniences, and refuse disposal.</p>'},
  {lb:'Primary education and healthcare',dr:dQ3,ht:'<p>Local governments play a key role (often alongside state universal basic education boards) in the administration of primary schools, and in providing primary healthcare services within their areas.</p>'},
  {lb:'Infrastructure and environmental sanitation',dr:dQ3,ht:'<p>Local governments are responsible for constructing and maintaining local roads, streetlights, and drains, and for ensuring environmental sanitation — refuse collection and public health enforcement at the community level.</p>'},
  {lb:'Registration of births, deaths and other civil functions',dr:dQ3,ht:'<p>Local governments assist in registering births, deaths and marriages (often jointly with the National Population Commission), collecting certain local rates/levies, and maintaining local civil records.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{"q":"Which schedule of Nigeria's 1999 Constitution assigns functions to local government?","o":["The Fourth Schedule","The First Schedule","The Second Schedule","The Third Schedule"],"a":0,"w":"The Fourth Schedule of the 1999 Constitution lists the specific functions assigned to local government councils."},{"q":"Which of these is a function of local government under the Fourth Schedule?","o":["Setting national interest rates","Provision and maintenance of markets, motor parks and refuse disposal","Conducting foreign diplomacy","Declaring war"],"a":1,"w":"Provision and maintenance of markets, motor parks, public conveniences and refuse disposal are Fourth Schedule local government functions."},{"q":"Local governments play a key role in the administration of:","o":["The national judiciary","Federal universities exclusively","Primary schools and primary healthcare","International trade agreements"],"a":2,"w":"Local governments play a significant role in administering primary education and providing primary healthcare within their areas."},{"q":"Which of these is an infrastructure-related local government responsibility?","o":["Setting national fuel prices","Building international airports","Managing the national grid","Constructing and maintaining local roads, streetlights and drains"],"a":3,"w":"Local governments are responsible for local-level infrastructure such as roads, streetlights and drains within their areas."},{"q":"Local governments often assist which body in registering births and deaths?","o":["The National Population Commission","The Central Bank of Nigeria","The Nigerian Stock Exchange","The Nigerian Army"],"a":0,"w":"Local governments assist the National Population Commission in registering births, deaths and other vital civil records."},{"q":"Why are local governments well-suited to handle refuse disposal and environmental sanitation?","o":["Because federal government has no interest in sanitation","Because they operate at the grassroots level, closest to the specific community needs involved","Because state government cannot legally handle sanitation","Because sanitation is not a real government function"],"a":1,"w":"Local governments' proximity to the grassroots community makes them well-positioned to manage localised functions like refuse disposal and sanitation."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government • Y11',ti:'Sources of Local Government Revenue',su:'Understand how local governments are funded.',steps:[
  {lb:'Statutory allocation',dr:dQ4,ht:'<p>The main source of local government revenue in Nigeria is statutory allocation from the Federation Account, distributed monthly to local governments based on a constitutionally defined revenue-sharing formula.</p>'},
  {lb:'Internally generated revenue (IGR)',dr:dQ4,ht:'<p>Local governments also generate revenue internally through rates, market fees, tenement rates on property, motor park levies, and fees/fines for various local services and licences.</p>'},
  {lb:'State government allocations/grants',dr:dQ4,ht:'<p>State governments may also provide grants or additional funding to local governments, though this varies significantly and, controversially, some states have been criticised for withholding or diverting local government funds via joint state/local accounts.</p>'},
  {lb:'Challenges in local government finance',dr:dQ4,ht:'<p>Local governments face challenges of over-reliance on federal statutory allocation, weak internally generated revenue collection, and, historically, interference by state governments in local government funds through Joint Local Government Accounts.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{"q":"The main source of local government revenue in Nigeria is:","o":["Statutory allocation from the Federation Account","Foreign aid exclusively","Private company donations","Religious institution funding"],"a":0,"w":"Statutory allocation from the Federation Account, distributed via a constitutional revenue-sharing formula, is the main local government revenue source."},{"q":"Which of these is an example of internally generated revenue (IGR) for a local government?","o":["Federal statutory allocation","Market fees and tenement rates on property","Foreign direct investment","National import duties"],"a":1,"w":"Market fees, tenement rates and similar local levies are examples of internally generated revenue for local governments."},{"q":"What controversy has surrounded state-local government financial relations in Nigeria?","o":["Local governments never receive any state-related funding","States always fully protect local government funds with no issues","Some states have been criticised for withholding or diverting local government funds via joint state/local accounts","There has never been any controversy over this issue"],"a":2,"w":"Joint State/Local Government Accounts have been controversial, with some states criticised for withholding or diverting local government funds."},{"q":"Which is a recognised challenge facing local government finance in Nigeria?","o":["No financial challenges exist at all","Excessive independence from federal allocation","Too much internally generated revenue with no need for federal support","Over-reliance on federal statutory allocation and weak internally generated revenue collection"],"a":3,"w":"Over-reliance on federal statutory allocation, combined with weak IGR collection, is a well-documented challenge for Nigerian local governments."},{"q":"Why might weak internally generated revenue collection be a problem for local governments?","o":["It increases dependence on unpredictable statutory allocations, limiting financial autonomy and planning","It has no effect on local government operations","It guarantees stronger local government autonomy","It eliminates the need for any local government functions"],"a":0,"w":"Weak IGR collection increases dependence on statutory allocations, which can be delayed or reduced, limiting local government financial autonomy."},{"q":"What is the purpose of the constitutionally defined revenue-sharing formula for local governments?","o":["To set local government election rules","To determine how statutory allocation from the Federation Account is distributed among local governments","To determine which traditional ruler is recognised","To set the national minimum wage"],"a":1,"w":"The revenue-sharing formula determines the constitutionally guided distribution of Federation Account funds to local governments."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government • Y11',ti:'Local Government Reforms in Nigeria',su:'Trace the key historical reforms of local government in Nigeria.',steps:[
  {lb:'The 1976 Local Government Reform',dr:dQ5,ht:'<p>The 1976 Local Government Reform, under military rule, created a uniform system of local government across Nigeria, established local government as the third tier of government, and set up statutory allocation of revenue to local governments.</p>'},
  {lb:'Democratization of local government',dr:dQ5,ht:'<p>Subsequent reforms sought to democratize local government administration, introducing elected chairmen and councillors (rather than appointed administrators), aiming to make local government more accountable to citizens.</p>'},
  {lb:'Creation of new LGAs',dr:dQ5,ht:'<p>Nigeria\'s number of LGAs has grown over time through state creation and further subdivision, reaching the current constitutionally recognised 774, though states have controversially created additional \'development areas\' beyond this number.</p>'},
  {lb:'Ongoing reform debates',dr:dQ5,ht:'<p>Current debates include: whether to grant local governments full financial autonomy (direct allocation, bypassing state Joint Accounts), and broader \'restructuring\' proposals about the appropriate balance of power between federal, state and local tiers.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{"q":"The 1976 Local Government Reform is significant because it:","o":["Created a uniform system of local government and established it as the third tier of government with statutory revenue allocation","Abolished local government entirely","Made local government part of the federal ministry structure with no independence","Ended local government elections permanently"],"a":0,"w":"The 1976 reform created a uniform local government structure, established it as a distinct tier, and set up statutory revenue allocation."},{"q":"Democratization reforms in local government sought to introduce:","o":["Only military-appointed officials with no elections","Elected chairmen and councillors, rather than appointed administrators","Traditional rulers as the sole authority","Foreign-appointed administrators"],"a":1,"w":"Democratization reforms aimed to introduce elected local government leadership, replacing earlier appointed administrators."},{"q":"How many Local Government Areas does Nigeria's Constitution currently recognise?","o":["360","500","774","1000"],"a":2,"w":"Nigeria's 1999 Constitution recognises 774 Local Government Areas."},{"q":"What controversial practice have some states engaged in regarding LGA numbers?","o":["Merging all LGAs into a single national authority","Reducing the number of LGAs below 774","Abolishing all LGAs entirely","Creating additional 'development areas' beyond the constitutionally recognised 774 LGAs"],"a":3,"w":"Some states have controversially created additional 'development areas' beyond the 774 constitutionally recognised LGAs, raising legal and funding questions."},{"q":"What is a key current debate regarding local government financial autonomy?","o":["Whether local governments should receive direct allocation, bypassing state Joint Accounts","Whether to eliminate local government revenue entirely","Whether to increase state control over federal allocation","Whether local governments should stop collecting any revenue at all"],"a":0,"w":"A key ongoing debate concerns granting local governments direct financial allocation, bypassing state-controlled Joint Local Government Accounts."},{"q":"Why is the debate over local government autonomy connected to broader 'restructuring' discussions in Nigeria?","o":["Because restructuring only concerns international relations","Because both concern the appropriate balance of power and resources between federal, state and local tiers","Because local government has no connection to the restructuring debate","Because restructuring only concerns the judiciary"],"a":1,"w":"Local government autonomy debates are part of broader restructuring discussions about how power and resources should be balanced across Nigeria's federal, state and local tiers."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government • Y11',ti:'Problems of Local Government Administration',su:'Understand the challenges facing local government in Nigeria.',steps:[
  {lb:'Financial dependency and interference',dr:dQ6,ht:'<p>Many local governments remain heavily dependent on statutory allocation and vulnerable to state government interference through Joint Accounts, undermining their financial and administrative autonomy.</p>'},
  {lb:'Weak capacity and corruption',dr:dQ6,ht:'<p>Local governments often suffer from inadequate technical/administrative capacity, insufficient qualified staff, and, in some cases, corruption or mismanagement of the limited funds available to them.</p>'},
  {lb:'Political interference and instability',dr:dQ6,ht:'<p>Local government administration has frequently been disrupted by dissolution of elected councils and replacement with appointed caretaker committees, undermining democratic accountability and continuity.</p>'},
  {lb:'Overlap and duplication of functions',dr:dQ6,ht:'<p>Overlapping responsibilities between local and state governments (e.g. in primary education or healthcare) can lead to duplication, confusion over accountability, and inefficient use of resources.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{"q":"A major problem facing local government in Nigeria is:","o":["Financial dependency on statutory allocation and vulnerability to state interference","Complete financial independence from all other tiers","Excessive local government funding compared to federal government","No financial issues at all"],"a":0,"w":"Financial dependency on statutory allocation and vulnerability to state interference through Joint Accounts is a major documented problem."},{"q":"Which is a common capacity-related problem for local governments?","o":["Excessive numbers of overqualified staff","Inadequate technical/administrative capacity and insufficient qualified staff","Too much technical expertise with no need for training","No staffing issues at all"],"a":1,"w":"Inadequate technical and administrative capacity, along with insufficient qualified staff, is a recognised local government problem."},{"q":"What has frequently disrupted local government's democratic continuity in Nigeria?","o":["Permanent abolition of all local government structures","Consistent, uninterrupted elected leadership with no disruptions","Dissolution of elected councils and replacement with appointed caretaker committees","Complete elimination of the Chairman position"],"a":2,"w":"The dissolution of elected local government councils and their replacement with appointed caretaker committees has frequently disrupted democratic continuity."},{"q":"Which issue arises from overlapping local and state government responsibilities?","o":["Local governments taking over all state functions","Perfect coordination with no issues at all","Complete absence of any shared responsibilities","Duplication of functions and confusion over accountability, e.g. in primary education or healthcare"],"a":3,"w":"Overlapping responsibilities, such as in primary education or healthcare, can create duplication and confusion over which tier is accountable."},{"q":"Why is caretaker committee administration considered a problem for local government?","o":["Because appointed caretaker committees are not democratically elected, undermining accountability to the local electorate","Because caretaker committees are always more efficient than elected councils","Because caretaker committees have unlimited terms with no oversight needed","Because caretaker committees eliminate the need for any local government function"],"a":0,"w":"Caretaker committees, being appointed rather than elected, undermine democratic accountability to the local electorate that elected councils would otherwise provide."},{"q":"How does corruption at the local government level typically manifest?","o":["Excessive transparency in all local government dealings","Mismanagement or diversion of limited statutory and internally generated funds","Complete absence of any financial issues","Local governments returning unused funds to the federal government voluntarily"],"a":1,"w":"Corruption at the local level often involves mismanagement or diversion of the limited statutory allocation and internally generated revenue available."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government • Y11',ti:'Reforming Local Government: Proposed Solutions',su:'Explore proposed reforms to strengthen local government administration.',steps:[
  {lb:'Financial autonomy reforms',dr:dQ7,ht:'<p>Proposals include direct allocation of statutory funds to local governments (bypassing state Joint Accounts), which has gained legal and political traction, including recent Supreme Court rulings supporting direct local government allocation.</p>'},
  {lb:'Capacity building',dr:dQ7,ht:'<p>Reform proposals emphasise training and capacity building for local government staff, improved recruitment standards, and better technical support from state and federal governments to strengthen service delivery.</p>'},
  {lb:'Strengthening democratic accountability',dr:dQ7,ht:'<p>Proposals call for ending the practice of caretaker committees, ensuring regular, timely local government elections, and strengthening oversight mechanisms (audits, citizen participation, transparency in budgets).</p>'},
  {lb:'Clarifying functional responsibilities',dr:dQ7,ht:'<p>Reforms propose clearer constitutional or legal delineation of functions between state and local governments to reduce overlap, duplication and confusion over accountability for service delivery.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{"q":"A key proposed financial reform for local government is:","o":["Direct allocation of statutory funds, bypassing state Joint Accounts","Eliminating all local government funding entirely","Transferring all local government revenue to the federal government only","Ending statutory allocation completely with no replacement"],"a":0,"w":"Direct allocation of statutory funds to local governments, bypassing state-controlled Joint Accounts, has been a major proposed and legally supported financial reform."},{"q":"Recent legal developments regarding local government finance in Nigeria have included:","o":["A permanent ban on any local government funding","Supreme Court rulings supporting direct allocation of funds to local governments","The abolition of the 774 LGA structure","A ruling eliminating all local government elections"],"a":1,"w":"Recent Supreme Court rulings have supported direct financial allocation to local governments as a reform measure."},{"q":"Which reform aims to strengthen local government staff capability?","o":["Removing all qualification requirements for staff","Reducing all staff training programmes","Training and capacity building for local government staff, with improved recruitment standards","Eliminating local government departments entirely"],"a":2,"w":"Capacity building through training and improved recruitment standards is a proposed reform to strengthen local government staff capability."},{"q":"Which reform proposal addresses the caretaker committee problem?","o":["Abolishing the office of Local Government Chairman entirely","Making caretaker committees permanent","Removing the need for any elections at any tier","Ending caretaker committees and ensuring regular, timely local government elections"],"a":3,"w":"Ending the use of caretaker committees and ensuring timely elections is a proposed reform to strengthen local government democratic accountability."},{"q":"Why is clarifying functional responsibilities between state and local government considered an important reform?","o":["It would reduce duplication, confusion over accountability, and inefficient use of resources","It would eliminate the need for local government entirely","It would make local government identical to federal government","It has no practical benefit for service delivery"],"a":0,"w":"Clearer delineation of functions would reduce duplication and confusion, improving accountability and efficient resource use in service delivery."},{"q":"Overall, what is the main goal of local government reform proposals?","o":["To eliminate local government as a tier of government entirely","To strengthen local government's financial autonomy, capacity, and democratic accountability for better service delivery","To transfer all local functions permanently to the federal government","To remove all citizen participation from local governance"],"a":1,"w":"The overarching aim of these reform proposals is to strengthen local government's autonomy, capacity and accountability, ultimately improving grassroots service delivery."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government • Y11',ti:'Relationship Between Local and State Government',su:'Understand how local government relates to the state tier above it.',steps:[
  {lb:'State oversight of local government',dr:dQ8,ht:'<p>State governments exercise significant oversight over local governments — including, in practice, control over Joint State/Local Government Accounts, approval of local budgets in some states, and supervision of local government elections through State Independent Electoral Commissions (SIECs).</p>'},
  {lb:'State Independent Electoral Commissions (SIECs)',dr:dQ8,ht:'<p>Each state has a SIEC responsible for conducting local government elections, distinct from INEC which conducts federal and state elections — though SIECs have often been criticised for being less independent than INEC.</p>'},
  {lb:'Areas of cooperation',dr:dQ8,ht:'<p>States and local governments often cooperate on shared functions such as primary education (via State Universal Basic Education Boards working with local governments) and primary healthcare delivery.</p>'},
  {lb:'Tensions in the relationship',dr:dQ8,ht:'<p>Tensions arise particularly over local government finance (Joint Accounts), the appointment of caretaker committees by state governors, and disputes over which tier truly controls local government resources and personnel.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{"q":"Which body is responsible for conducting local government elections in each Nigerian state?","o":["The State Independent Electoral Commission (SIEC)","INEC directly","The National Assembly","The Federal Ministry of Local Government"],"a":0,"w":"Each state's SIEC, distinct from INEC, is responsible for conducting local government elections."},{"q":"A major source of tension between state and local government in Nigeria involves:","o":["Agreement on all matters with no disputes ever","Control of Joint State/Local Government Accounts","Local governments controlling state governors' appointments","States having no involvement in local government at all"],"a":1,"w":"Joint State/Local Government Accounts have been a major and persistent source of tension between the two tiers."},{"q":"In which area do states and local governments commonly cooperate?","o":["Foreign policy","National defence","Primary education, via State Universal Basic Education Boards","Setting the national currency"],"a":2,"w":"States and local governments commonly cooperate on primary education through State Universal Basic Education Boards working alongside local governments."},{"q":"A common criticism of SIECs, compared to INEC, is that they:","o":["Conduct only federal elections","Are always more independent than INEC","Have no role in any local elections","Are often seen as less independent, given governors' influence over their composition"],"a":3,"w":"SIECs have often been criticised as less independent than INEC, given the influence state governors can have over their composition and operations."},{"q":"Which practice has been a recurring source of state-local tension regarding local government leadership?","o":["State governors appointing caretaker committees instead of allowing local government elections","States never interfering in local government leadership at all","Local governments appointing state governors","Local governments controlling state-level elections"],"a":0,"w":"State governors appointing caretaker committees, bypassing local government elections, has been a recurring and controversial practice."},{"q":"Why is the state-local government relationship significant for understanding Nigerian federalism?","o":["It has no relevance to federalism at all","It illustrates practical tensions and cooperation within Nigeria's three-tier federal structure","It only concerns foreign relations","It only matters for the judiciary"],"a":1,"w":"The state-local relationship is a practical illustration of how Nigeria's three-tier federal structure functions, with both cooperation and tension."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government • Y11',ti:'WAEC Exam Preparation — Local Government Administration',su:'Practise WAEC-style questions on local government structure, functions and reform.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions: (1) Define local government and its constitutional basis (Section 7, Fourth Schedule). (2) Describe structure (Chairman, Councillors). (3) List functions. (4) Discuss revenue sources. (5) Examine problems and reforms.</p>'},
  {lb:'Common WAEC question patterns',dr:dQ9,ht:'<p>Typical questions: \'Discuss the functions of local government in Nigeria\', \'Examine the problems of local government administration\', \'Explain the sources of local government revenue\', \'Discuss reforms aimed at improving local government autonomy\'.</p>'},
  {lb:'Key facts to memorise',dr:dQ9,ht:'<p>Section 7 = constitutional guarantee. Fourth Schedule = functions list. 774 LGAs (First Schedule). Statutory allocation = main revenue source. 1976 reform = created uniform local government system. Joint Accounts = key controversy.</p>'},
  {lb:'Common mistakes to avoid',dr:dQ9,ht:'<p>Avoid vague answers without citing the Constitution (Section 7, Fourth Schedule). Always mention the 774 LGA figure precisely. Distinguish clearly between statutory allocation and internally generated revenue when discussing finance.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{"q":"Which constitutional provision should a WAEC essay cite when defining local government's legal basis?","o":["Section 7 of the 1999 Constitution","Section 33","Section 100","Section 14 only, with no other reference"],"a":0,"w":"Section 7 of the 1999 Constitution is the standard citation for local government's constitutional basis and should be referenced in WAEC essays."},{"q":"A complete WAEC answer on local government functions should reference:","o":["Only the First Schedule with no further detail","The Fourth Schedule of the 1999 Constitution","A private company's internal policy","A foreign country's constitution"],"a":1,"w":"The Fourth Schedule of the 1999 Constitution specifically lists local government functions and should be cited for full marks."},{"q":"When discussing local government revenue for WAEC, students should distinguish between:","o":["Only military budget allocations","Only foreign aid sources","Statutory allocation and internally generated revenue (IGR)","Only religious donations"],"a":2,"w":"WAEC expects a clear distinction between statutory allocation (from the Federation Account) and internally generated revenue (IGR) sources."},{"q":"A precise WAEC fact to cite regarding LGA numbers is:","o":["Nigeria has 1000 LGAs","Nigeria has exactly 360 LGAs","Nigeria has no fixed number of LGAs","Nigeria has 774 constitutionally recognised LGAs"],"a":3,"w":"The precise, WAEC-expected fact is that Nigeria's Constitution recognises 774 Local Government Areas."},{"q":"A common WAEC mistake to avoid when discussing local government problems is:","o":["Failing to mention the Joint Local Government Account controversy","Discussing financial dependency issues","Mentioning capacity/staffing problems","Discussing caretaker committee disruptions"],"a":0,"w":"Failing to mention the Joint Local Government Account controversy is a common gap, since it's a central, well-known issue in Nigerian local government finance debates."},{"q":"Which historical reform should be cited when discussing the origin of Nigeria's uniform local government system?","o":["The 1999 Constitution alone, with no earlier reform mentioned","The 1976 Local Government Reform","The 2013 power sector reform","The Structural Adjustment Programme"],"a":1,"w":"The 1976 Local Government Reform is the key historical reform that created Nigeria's uniform local government system and should be cited."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Government • Y11',ti:'Mixed Questions — Local Government Administration',su:'Integrated revision across structure, functions, finance, problems and reform.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Local government = third tier, closest to citizens (Section 7, 774 LGAs). Structure: Chairman (executive) + Councillors (Legislative Council). Functions: Fourth Schedule (markets, sanitation, primary education/health). Revenue: statutory allocation + IGR. Problems: financial dependency, weak capacity, caretaker committees, overlap. Reform: financial autonomy, capacity building, ending caretaker committees.</p>'},
  {lb:'Connecting concepts',dr:dQ10,ht:'<p>Chain: Constitutional basis (Section 7) → structure (Chairman + Councillors) → assigned functions (Fourth Schedule) → funded via statutory allocation/IGR → undermined by financial dependency and political interference → addressed through ongoing reform proposals (direct allocation, capacity building).</p>'},
