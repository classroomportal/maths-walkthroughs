<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});

{ey:'Q1 \u2022 Government • Y11',ti:'Meaning of Public Corporations',su:'Understand what public corporations are.',steps:[
  {lb:'What is a public corporation?',dr:dQ1,ht:'<p>A public corporation is a government-owned enterprise established by law to provide essential goods or services to the public, operating with some independence from direct day-to-day ministerial control, but ultimately owned and funded by the state.</p>'},
  {lb:'Legal establishment',dr:dQ1,ht:'<p>Public corporations are usually created by an Act of the legislature (or decree, historically) which defines their functions, powers, structure and governing board, giving them a distinct legal identity from the ministry that oversees them.</p>'},
  {lb:'Examples in Nigeria',dr:dQ1,ht:'<p>Nigerian examples include the Nigerian National Petroleum Company (NNPC), the Nigerian Ports Authority (NPA), the Nigerian Railway Corporation (NRC), and the National Electric Power Authority (NEPA, now largely privatised/restructured).</p>'},
  {lb:'Purpose of public corporations',dr:dQ1,ht:'<p>Public corporations are established to provide essential services that may not attract sufficient private investment (e.g. railways), to control strategic national resources (e.g. oil), or to achieve social objectives government considers important.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"A public corporation is best defined as:","o":["A government-owned enterprise established by law to provide goods/services, with some operational independence","A private company with no government involvement","A political party","A traditional ruling council"],"a":0,"w":"A public corporation is a government-owned enterprise, created by law, that operates with some independence while providing public goods or services."},{"q":"Public corporations are typically established through:","o":["A private shareholder agreement","An Act of the legislature defining their functions and structure","A religious decree","A foreign investment treaty"],"a":1,"w":"Public corporations are usually created by an Act of the legislature that defines their legal identity, functions and governance structure."},{"q":"Which of these is a Nigerian public corporation example?","o":["A foreign multinational bank","A privately owned bakery","The Nigerian National Petroleum Company (NNPC)","A private university"],"a":2,"w":"NNPC is a classic example of a Nigerian public corporation, government-owned and established to control the strategic oil sector."},{"q":"Why might government establish a public corporation rather than leave a sector to private business?","o":["To reduce government's role in the economy to zero","To guarantee private companies earn maximum profit","To eliminate all competition in every sector","To provide essential services that might not attract sufficient private investment, or to control strategic resources"],"a":3,"w":"Governments often establish public corporations to provide essential services lacking private investment interest, or to control strategically important resources."},{"q":"How does a public corporation typically differ from a regular government ministry?","o":["It operates with some independence from direct day-to-day ministerial control, despite being state-owned","It has no legal existence at all","It is owned entirely by private shareholders","It cannot provide any public services"],"a":0,"w":"Public corporations, unlike ministries, typically operate with some day-to-day operational independence while remaining state-owned."},{"q":"What gives a public corporation its distinct legal identity from its supervising ministry?","o":["A private company registration certificate","The Act of the legislature that establishes it","A foreign court ruling","A religious authority's blessing"],"a":1,"w":"The establishing Act of the legislature gives a public corporation its own distinct legal identity, separate from the ministry overseeing it."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government • Y11',ti:'Features of Public Corporations',su:'Explore the defining features of public corporations.',steps:[
  {lb:'Corporate/legal personality',dr:dQ2,ht:'<p>A public corporation has its own legal personality — it can sue and be sued, own property, and enter contracts in its own name, distinct from the government ministry that supervises it.</p>'},
  {lb:'Government ownership and funding',dr:dQ2,ht:'<p>Public corporations are wholly or majority owned by the government, and typically receive government funding, subsidies, or capital, though many are also expected to generate their own revenue.</p>'},
  {lb:'Board of directors/management',dr:dQ2,ht:'<p>Public corporations are usually governed by a board of directors or management board appointed by government, responsible for overseeing operations while day-to-day management is handled by professional staff.</p>'},
  {lb:'Public accountability',dr:dQ2,ht:'<p>Despite operational independence, public corporations remain accountable to government (through the supervising ministry), the legislature (through oversight and audits), and ultimately the public whose interests they are meant to serve.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"A public corporation's 'legal personality' means it can:","o":["Sue and be sued, own property, and enter contracts in its own name","Never be taken to court","Only exist as part of a private company","Have no distinct existence from the government"],"a":0,"w":"Legal personality allows a public corporation to sue and be sued, own property and enter contracts independently, in its own name."},{"q":"Public corporations are typically:","o":["Wholly privately owned with no government stake","Wholly or majority owned and funded by government","Owned exclusively by foreign investors","Owned by traditional rulers"],"a":1,"w":"Public corporations are wholly or majority government-owned, typically receiving government funding or capital."},{"q":"Who typically oversees a public corporation's overall direction, while professional staff handle daily operations?","o":["Foreign shareholders exclusively","A single unaccountable individual","A board of directors/management board appointed by government","The judiciary directly"],"a":2,"w":"A government-appointed board of directors oversees a public corporation's strategic direction, while professional staff manage daily operations."},{"q":"To whom are public corporations ultimately accountable?","o":["Only their own management, with no external oversight","No one at all","Only foreign investors","Government (via supervising ministry), the legislature, and the public"],"a":3,"w":"Public corporations remain accountable to the supervising ministry, the legislature (through oversight/audits) and ultimately the public."},{"q":"Why is legal personality important for a public corporation's operations?","o":["It allows the corporation to enter contracts and conduct business as a distinct legal entity, separate from the ministry","It has no practical importance at all","It means the corporation cannot own any property","It prevents the corporation from being audited"],"a":0,"w":"Legal personality enables the corporation to independently conduct business, own assets and enter contracts, distinct from its supervising ministry."},{"q":"Which best illustrates the balance public corporations must strike?","o":["Complete independence with zero accountability","Operational independence for efficiency, balanced against accountability to government and the public","Complete government control with no operational independence at all","No relationship with government whatsoever"],"a":1,"w":"Public corporations must balance operational independence (for efficiency) with continued accountability to government, the legislature and the public."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government • Y11',ti:'Reasons for Establishing Public Corporations',su:'Understand why governments create public corporations.',steps:[
  {lb:'Provision of essential services',dr:dQ3,ht:'<p>Governments establish public corporations to guarantee provision of essential services — electricity, water, railways, ports — that private business might neglect if they are not sufficiently profitable.</p>'},
  {lb:'Control of strategic resources',dr:dQ3,ht:'<p>Public corporations allow government to control strategically important resources and sectors, such as oil and gas (NNPC) or ports (NPA), which are considered too important to leave entirely to private or foreign control.</p>'},
  {lb:'Preventing private monopoly exploitation',dr:dQ3,ht:'<p>In some sectors (e.g. utilities), a natural monopoly may exist; a public corporation can prevent a private monopolist from exploiting consumers through excessive pricing, by keeping the service under public control and oversight.</p>'},
  {lb:'Employment and regional development',dr:dQ3,ht:'<p>Public corporations have also historically been used to create employment opportunities and drive development in specific regions, aligning with broader national development and social objectives.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{"q":"A key reason for establishing public corporations is to:","o":["Guarantee provision of essential services that private business might neglect if unprofitable","Eliminate all forms of government involvement in the economy","Ensure only foreign companies control key sectors","Abolish the need for any legislation"],"a":0,"w":"Public corporations are often established to guarantee essential services (electricity, water, railways) that private business might not adequately provide if unprofitable."},{"q":"Why might government use a public corporation to control the oil sector, as with NNPC in Nigeria?","o":["Because oil has no economic value","To control a strategically important national resource","To hand control entirely to foreign private companies","Because oil requires no regulation"],"a":1,"w":"NNPC exemplifies government control of a strategically important resource (oil) through a public corporation structure."},{"q":"How can a public corporation help prevent exploitation in a natural monopoly sector?","o":["By banning the service entirely","By allowing unlimited private price-setting with no oversight","By keeping the service under public control and oversight rather than an unregulated private monopolist","By transferring all control to foreign investors with no regulation"],"a":2,"w":"In natural monopoly sectors, a public corporation can prevent exploitative pricing by keeping the service under public ownership and oversight."},{"q":"Besides essential services, what other objective have public corporations historically served in Nigeria?","o":["Abolishing elections","Eliminating all forms of taxation","Replacing the judiciary","Employment generation and regional development"],"a":3,"w":"Public corporations have historically also served employment generation and regional development objectives, alongside service provision."},{"q":"Which best explains why some essential services are provided via public corporations rather than left purely to private markets?","o":["Because private business might underinvest in services that are important but not highly profitable","Because private business always provides better services in every case","Because public corporations are always more efficient than private firms","Because law forbids any private involvement in any sector"],"a":0,"w":"Public corporations often step in where private business might underinvest in services considered essential but not sufficiently profitable."},{"q":"Which is an example of a 'natural monopoly' sector often run via a public corporation?","o":["Small-scale retail trading","Electricity distribution","Local hairdressing services","Private tutoring"],"a":1,"w":"Electricity distribution is a classic example of a natural monopoly sector historically run through a public corporation to prevent exploitative private pricing."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government • Y11',ti:'Problems of Public Corporations',su:'Understand the common challenges facing public corporations.',steps:[
  {lb:'Political interference',dr:dQ4,ht:'<p>Public corporations often suffer from political interference — appointments based on political loyalty rather than competence, and pressure to make decisions favouring political interests rather than sound business practice.</p>'},
  {lb:'Inefficiency and mismanagement',dr:dQ4,ht:'<p>Many public corporations have suffered from poor management, lack of accountability, overstaffing, and weak performance incentives, leading to inefficiency compared to competitive private businesses.</p>'},
  {lb:'Corruption',dr:dQ4,ht:'<p>Public corporations, often controlling large budgets and valuable resources with limited oversight, have historically been vulnerable to corruption — diversion of funds, contract inflation, and outright theft of public assets.</p>'},
  {lb:'Financial losses and reliance on subsidy',dr:dQ4,ht:'<p>Due to inefficiency, mismanagement or deliberately low pricing for social reasons, many public corporations have run persistent financial losses, requiring continued government subsidy or bailout to stay operational.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{"q":"Political interference in public corporations often manifests as:","o":["Appointments based on political loyalty rather than competence, and political pressure on decisions","Appointments based on merit alone with no political influence","Complete independence from all government influence","Total absence of any board of directors"],"a":0,"w":"Political interference typically involves loyalty-based appointments and political pressure influencing decisions, rather than sound business practice."},{"q":"Which is a common efficiency-related problem in public corporations?","o":["Excessive competition driving down costs","Overstaffing and weak performance incentives leading to inefficiency","Too few employees to run operations","Complete absence of any management structure"],"a":1,"w":"Overstaffing and weak performance incentives are common problems that reduce efficiency in many public corporations."},{"q":"Why are public corporations often considered vulnerable to corruption?","o":["Because they are always privately owned","Because they never handle any government funds","Because they control large budgets and resources with limited oversight in some cases","Because they have no legal existence"],"a":2,"w":"Large budgets and valuable resources, combined with limited oversight in some cases, make public corporations vulnerable to corruption."},{"q":"Why do many public corporations rely on government subsidy or bailout?","o":["Because private companies fund them entirely","Because they generate excessive unwanted profit","Because government has no interest in their survival","Persistent financial losses from inefficiency, mismanagement, or deliberately low social pricing"],"a":3,"w":"Financial losses from inefficiency, mismanagement, or intentionally low pricing for social reasons often require ongoing government subsidy."},{"q":"Which of these best illustrates 'contract inflation' as a corruption risk in public corporations?","o":["Officials awarding contracts at inflated prices to divert public funds for personal gain","A corporation reducing its costs through fair competitive bidding","A corporation refusing to award any contracts at all","A corporation operating with zero budget"],"a":0,"w":"Contract inflation involves awarding contracts at artificially high prices, diverting the excess funds for personal gain — a recognised corruption risk."},{"q":"What underlying issue often connects political interference, inefficiency and corruption in public corporations?","o":["Excessive private sector competition","Weak accountability and oversight mechanisms allowing these problems to persist","Too much transparency in operations","Overly strict merit-based recruitment"],"a":1,"w":"Weak accountability and oversight mechanisms are often the underlying issue that allows political interference, inefficiency and corruption to persist together."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government • Y11',ti:'Commercialization',su:'Understand commercialization as a reform strategy for public corporations.',steps:[
  {lb:'Meaning of commercialization',dr:dQ5,ht:'<p>Commercialization is the process of restructuring a public corporation to operate on a commercial, profit-oriented basis — covering its own costs and pricing services more realistically — while remaining under government ownership.</p>'},
  {lb:'Why commercialize?',dr:dQ5,ht:'<p>Commercialization aims to reduce a corporation\'s dependence on government subsidy, improve efficiency through commercial discipline, and encourage better management practices, without necessarily transferring ownership to private hands.</p>'},
  {lb:'Examples in Nigeria',dr:dQ5,ht:'<p>Nigeria has attempted commercialization of entities like NNPC subsidiaries and some port operations — requiring them to operate more like businesses, generate their own revenue, and reduce reliance on federal government subvention.</p>'},
  {lb:'Limitations of commercialization',dr:dQ5,ht:'<p>Commercialization alone, without full privatization, can still leave a corporation subject to political interference and management weaknesses, since government retains ownership and ultimate control.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{"q":"Commercialization is best defined as:","o":["Restructuring a public corporation to operate profitably/cover its own costs, while remaining government-owned","Selling a public corporation entirely to private investors","Abolishing a public corporation completely","Nationalising a previously private company"],"a":0,"w":"Commercialization restructures a public corporation toward commercial, profit-oriented operation while government retains ownership."},{"q":"A main aim of commercialization is to:","o":["Increase dependence on government subsidy permanently","Reduce dependence on government subsidy and improve efficiency through commercial discipline","Transfer full ownership to a foreign government","Eliminate the corporation's legal personality"],"a":1,"w":"Commercialization aims to reduce reliance on subsidy and encourage more efficient, commercially disciplined operation."},{"q":"How does commercialization differ from privatization?","o":["Privatization keeps government ownership; commercialization transfers ownership","They are exactly the same process","Commercialization keeps government ownership while adopting commercial practices; privatization transfers ownership to private hands","Neither involves any change to a corporation's operations"],"a":2,"w":"Commercialization retains government ownership while adopting commercial operating practices; privatization involves transferring ownership to private investors."},{"q":"Which is a limitation of commercialization as a reform strategy?","o":["It removes the need for any management structure","It always eliminates all political interference immediately","It automatically transfers ownership to private hands","It can still leave the corporation subject to political interference since government retains ownership"],"a":3,"w":"Because government retains ownership under commercialization, the corporation can remain subject to political interference despite the reform."},{"q":"Which Nigerian sector has seen attempts at commercialization to reduce reliance on federal subvention?","o":["NNPC subsidiaries and some port operations","Private tailoring businesses","Foreign embassies","Religious institutions"],"a":0,"w":"NNPC subsidiaries and port operations are examples of Nigerian public corporations that have undergone commercialization attempts."},{"q":"Why might commercialization improve management practices in a public corporation?","o":["Because it removes all oversight from the corporation entirely","Because commercial discipline (covering costs, realistic pricing) encourages more efficient, business-like operation","Because it guarantees the corporation will never make a loss again","Because it eliminates the need for a board of directors"],"a":1,"w":"Commercial discipline — needing to cover costs and price services realistically — tends to encourage more efficient, business-like management practices."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government • Y11',ti:'Privatization',su:'Understand privatization as a deeper reform of public corporations.',steps:[
  {lb:'Meaning of privatization',dr:dQ6,ht:'<p>Privatization is the transfer of ownership and control of a public corporation (or part of it) from government to private investors, typically through sale of shares or assets.</p>'},
  {lb:'Reasons for privatization',dr:dQ6,ht:'<p>Governments privatize to raise revenue, reduce the fiscal burden of subsidising loss-making corporations, improve efficiency through private management and competition, and attract private investment/expertise.</p>'},
  {lb:'Examples in Nigeria',dr:dQ6,ht:'<p>Nigeria has privatized entities such as NITEL (telecommunications), several power generation and distribution companies following the 2013 unbundling of the former NEPA/PHCN, and various other former public corporations.</p>'},
  {lb:'Criticisms of privatization',dr:dQ6,ht:'<p>Critics argue privatization can lead to job losses, higher prices for consumers if private monopolies are not well regulated, loss of government control over strategic sectors, and sometimes corrupt or undervalued sales of public assets.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{"q":"Privatization is best defined as:","o":["The transfer of ownership and control of a public corporation from government to private investors","Government purchasing a new private company","Restructuring a corporation while keeping it fully government-owned","Abolishing a corporation with no sale of assets"],"a":0,"w":"Privatization involves transferring ownership and control of a public corporation from government to private investors, typically via sale of shares/assets."},{"q":"Which is a key reason governments pursue privatization?","o":["To increase government subsidy spending permanently","To raise revenue and reduce the fiscal burden of subsidising loss-making corporations","To eliminate all private sector involvement in the economy","To transfer ownership to foreign governments only"],"a":1,"w":"Privatization is often pursued to raise revenue and reduce the ongoing fiscal cost of subsidising loss-making public corporations."},{"q":"Which Nigerian entity is a well-known example of privatization?","o":["The Supreme Court","The National Assembly","NITEL (telecommunications)","The Nigerian Army"],"a":2,"w":"NITEL is a well-known example of a Nigerian public corporation that underwent privatization."},{"q":"The 2013 unbundling and privatization of Nigeria's power sector primarily affected which former entity?","o":["The Nigerian Railway Corporation","The Nigerian Ports Authority","The Central Bank of Nigeria","NEPA/PHCN (electricity generation and distribution)"],"a":3,"w":"The 2013 reforms unbundled and privatized generation and distribution companies from the former NEPA/PHCN electricity monopoly."},{"q":"Which is a common criticism of privatization?","o":["It can lead to job losses and higher prices if private monopolies are not well regulated","It always guarantees lower prices for all consumers","It never affects employment levels","It always improves service quality with no downside"],"a":0,"w":"Critics highlight risks such as job losses and higher prices if the resulting private monopoly or oligopoly is not effectively regulated."},{"q":"How does privatization differ from commercialization in terms of ownership?","o":["They are identical in terms of ownership change","Privatization transfers ownership to private hands; commercialization keeps ownership with government","Commercialization always transfers ownership to foreign investors","Privatization keeps 100% government ownership"],"a":1,"w":"Privatization transfers ownership to private investors, whereas commercialization retains government ownership while adopting commercial practices."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government • Y11',ti:'Deregulation',su:'Understand deregulation as a related economic reform.',steps:[
  {lb:'Meaning of deregulation',dr:dQ7,ht:'<p>Deregulation is the reduction or removal of government rules and controls over a sector or industry, allowing market forces (competition, supply and demand) to play a greater role in determining prices and operations.</p>'},
  {lb:'Deregulation and public corporations',dr:dQ7,ht:'<p>Deregulation often accompanies privatization — removing government-set prices or entry restrictions that previously protected a public corporation\'s monopoly, opening the sector to competition from private firms.</p>'},
  {lb:'Examples in Nigeria',dr:dQ7,ht:'<p>Nigeria has pursued deregulation in sectors such as telecommunications (opening the market to private operators like MTN, Globacom, Airtel) and, with ongoing debate, the downstream petroleum sector (fuel pricing).</p>'},
  {lb:'Effects of deregulation',dr:dQ7,ht:'<p>Deregulation can increase competition, improve service quality and innovation (as seen in Nigerian telecoms), but can also lead to price volatility or reduced access in underserved areas if not carefully managed.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{"q":"Deregulation is best defined as:","o":["The reduction or removal of government rules/controls over a sector, allowing market forces to play a greater role","Increasing government control over a sector","Nationalising a private industry","Abolishing all forms of business in a sector"],"a":0,"w":"Deregulation reduces or removes government controls over a sector, allowing market forces to play a larger role in pricing and operations."},{"q":"How does deregulation often relate to privatization?","o":["They are entirely unrelated concepts","Deregulation often accompanies privatization, removing restrictions that protected a public corporation's monopoly","Deregulation always happens before any corporation is created","Deregulation eliminates the need for privatization to ever occur"],"a":1,"w":"Deregulation often accompanies privatization by removing restrictions that had protected the former public monopoly, opening the sector to competition."},{"q":"Which Nigerian sector is a widely cited success story of deregulation increasing competition?","o":["The military","The judiciary","Telecommunications (opening to MTN, Globacom, Airtel)","Traditional rulership"],"a":2,"w":"Telecommunications deregulation in Nigeria, opening the market to private operators, is a widely cited success story of increased competition and service improvement."},{"q":"Which sector has seen ongoing deregulation debate in Nigeria regarding pricing?","o":["Primary school uniforms","Traditional chieftaincy titles","The national anthem","The downstream petroleum sector (fuel pricing)"],"a":3,"w":"Deregulation of fuel pricing in Nigeria's downstream petroleum sector has been a long-running and contentious policy debate."},{"q":"What is a potential risk of deregulation if not carefully managed?","o":["Price volatility or reduced access in underserved areas","Guaranteed lower prices for every consumer with no risk","Complete elimination of all competition","Automatic improvement in every case with no downside"],"a":0,"w":"If not carefully managed, deregulation can lead to price volatility or reduced service access in less profitable, underserved areas."},{"q":"What is a key benefit deregulation aims to achieve?","o":["Guaranteed government control over all pricing","Increased competition, improved service quality and innovation","Elimination of all private sector participation","Permanent price fixing by a single monopoly"],"a":1,"w":"Deregulation aims to increase competition and encourage improved service quality and innovation through market forces."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government • Y11',ti:'Evaluating Reform: Commercialization, Privatization, Deregulation Compared',su:'Compare the three reform strategies for public corporations.',steps:[
  {lb:'Ownership comparison',dr:dQ8,ht:'<p>Commercialization keeps government ownership while introducing commercial discipline. Privatization transfers ownership to private hands. Deregulation removes government rules/controls, and can apply regardless of who owns the enterprise.</p>'},
  {lb:'When each is used',dr:dQ8,ht:'<p>Commercialization suits corporations government wants to keep but make more efficient. Privatization suits corporations government wants to exit entirely. Deregulation suits sectors where competition is desired, whether or not ownership changes.</p>'},
  {lb:'Combined reform strategies',dr:dQ8,ht:'<p>In practice, governments often combine these strategies — as with Nigeria\'s power sector, which was both privatized (generation/distribution companies sold to private investors) and partially deregulated (tariff structures adjusted, though still regulated).</p>'},
  {lb:'Assessing success',dr:dQ8,ht:'<p>The success of these reforms is judged by improved service delivery, financial sustainability, and reduced burden on government finances — though results in Nigeria have been mixed, with continued challenges in sectors like power supply.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{"q":"Which of the three reforms keeps government ownership while adopting commercial discipline?","o":["Commercialization","Privatization","Deregulation only","None of them keep government ownership"],"a":0,"w":"Commercialization is distinct in retaining government ownership while introducing commercial, profit-oriented operating discipline."},{"q":"Which reform involves transferring ownership entirely to private investors?","o":["Commercialization","Privatization","Deregulation alone","Nationalisation"],"a":1,"w":"Privatization specifically involves the transfer of ownership from government to private investors."},{"q":"Which reform can apply regardless of who owns the enterprise, since it concerns rules rather than ownership?","o":["Commercialization only","Privatization only","Deregulation","None of these"],"a":2,"w":"Deregulation concerns the removal of government rules/controls and can apply whether the enterprise is publicly or privately owned."},{"q":"Nigeria's power sector reform of 2013 combined which two strategies?","o":["Only deregulation with no privatization","Only nationalisation","Only commercialization with no ownership change","Privatization and partial deregulation of tariff structures"],"a":3,"w":"The 2013 power sector reform combined privatization (selling generation/distribution companies) with partial deregulation of tariff arrangements."},{"q":"How is the success of these reform strategies typically judged?","o":["By improved service delivery, financial sustainability, and reduced burden on government finances","Only by how quickly the reform was announced","Only by the number of new employees hired","By whether the reform received international media coverage"],"a":0,"w":"Success is judged mainly by whether service delivery improves, whether the entity becomes financially sustainable, and whether government's fiscal burden is reduced."},{"q":"What has been a common criticism of Nigeria's power sector reforms since 2013?","o":["Complete elimination of all power supply issues","Continued challenges in power supply reliability despite privatization","Total absence of any private sector involvement","No debate or criticism has arisen at all"],"a":1,"w":"Despite privatization, Nigeria's power sector has continued to face reliability challenges, making the reform's overall success debated."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government • Y11',ti:'WAEC Exam Preparation — Public Corporations',su:'Practise WAEC-style questions on public corporations and their reform.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions: (1) Define public corporation clearly. (2) State features (legal personality, government ownership, board). (3) Give reasons for establishment. (4) Discuss problems. (5) Explain commercialization/privatization/deregulation as reforms, with Nigerian examples.</p>'},
  {lb:'Common WAEC question patterns',dr:dQ9,ht:'<p>Typical questions: \'What is a public corporation? Discuss its features\', \'Examine the problems of public corporations in Nigeria\', \'Distinguish between commercialization and privatization\', \'Discuss the effects of deregulation on a named Nigerian sector\'.</p>'},
  {lb:'Key facts to memorise',dr:dQ9,ht:'<p>NNPC, NPA, NRC = classic Nigerian public corporation examples. Commercialization = keep ownership, add commercial discipline. Privatization = transfer ownership. Deregulation = remove rules/controls. NITEL and NEPA/PHCN = key privatization examples.</p>'},
  {lb:'Common mistakes to avoid',dr:dQ9,ht:'<p>Avoid confusing commercialization with privatization — ownership change is the key distinguishing factor. Always give a specific Nigerian example for each reform type. Balance reasons for establishment against the real problems public corporations have faced.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{"q":"A precise WAEC definition of a public corporation should mention:","o":["A government-owned enterprise established by law with some operational independence, providing goods/services","A privately owned company with no government involvement","A political party structure","A type of traditional council"],"a":0,"w":"WAEC expects public corporations to be defined as government-owned, law-established enterprises with some operational independence."},{"q":"When distinguishing commercialization from privatization, WAEC expects candidates to state that:","o":["They are identical processes","Commercialization retains government ownership while adding commercial discipline; privatization transfers ownership to private investors","Privatization always retains 100% government ownership","Commercialization always sells the corporation to a foreign government"],"a":1,"w":"WAEC expects the clear distinction: commercialization retains ownership while adding commercial practices, while privatization transfers ownership."},{"q":"A complete WAEC answer on 'problems of public corporations' should include:","o":["Only a list of corporation names with no explanation","Only positive achievements with no problems mentioned","Political interference, inefficiency, corruption, and financial losses/reliance on subsidy","Only the founding date of each corporation"],"a":2,"w":"A thorough WAEC answer on public corporation problems covers political interference, inefficiency, corruption, and financial losses/subsidy dependence."},{"q":"Which Nigerian example should be cited for a question on privatization?","o":["A traditional emirate council","The National Assembly","The Nigerian Army","NITEL or the privatized NEPA/PHCN successor companies"],"a":3,"w":"NITEL and the privatized NEPA/PHCN successor companies are the standard Nigerian examples cited for privatization questions."},{"q":"A common WAEC mistake to avoid on this topic is:","o":["Confusing commercialization with privatization, treating them as the same thing","Giving Nigerian examples for each reform type","Discussing both reasons for establishment and problems of public corporations","Defining terms before explaining them"],"a":0,"w":"A frequent error is failing to distinguish commercialization from privatization, when WAEC expects candidates to differentiate them clearly."},{"q":"For a question on deregulation's effects on a named sector, students should:","o":["Avoid naming any specific sector at all","Choose a specific Nigerian sector (e.g. telecoms) and discuss concrete effects like increased competition","Discuss only foreign countries with no Nigerian reference","Describe deregulation as identical to nationalisation"],"a":1,"w":"WAEC rewards answers that name a specific Nigerian sector (like telecoms) and discuss concrete effects of deregulation, such as increased competition."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q10 \u2022 Government • Y11',ti:'Mixed Questions — Public Corporations',su:'Integrated revision across meaning, features, problems and reform of public corporations.',steps:[
