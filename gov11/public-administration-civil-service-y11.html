var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});

{ey:'Q1 \u2022 Government • Y11',ti:'Meaning of Public Administration',su:'Understand what public administration is.',steps:[
  {lb:'What is public administration?',dr:dQ1,ht:'<p>Public administration is the implementation of government policy through the organised machinery of the state — the day-to-day management of public affairs by government departments and agencies.</p>'},
  {lb:'Public vs private administration',dr:dQ1,ht:'<p>Public administration differs from private administration in that it serves the public interest (not profit), is funded by taxpayers, operates under strict legal/constitutional rules, and is accountable to the public and legislature.</p>'},
  {lb:'Scope of public administration',dr:dQ1,ht:'<p>It covers areas such as budgeting and finance, personnel management, policy implementation, public service delivery (health, education, security), and regulation of various sectors of the economy and society.</p>'},
  {lb:'Importance of public administration',dr:dQ1,ht:'<p>Effective public administration translates government policy and law into real services and outcomes for citizens — without it, even the best-designed laws and policies would fail to be delivered.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Public administration is best defined as:","o":["The implementation of government policy through the organised machinery of the state","A private business seeking profit","A type of election","A form of military rule"],"a":0,"w":"Public administration is the process of implementing government policy through the state's organised institutions and personnel."},{"q":"How does public administration differ from private administration?","o":["Public administration seeks profit above all else","Public administration serves the public interest, is taxpayer-funded and accountable to the legislature/public","There is no difference at all","Private administration is always larger"],"a":1,"w":"Public administration serves the public interest, uses taxpayer funds, and is accountable to the legislature and the public, unlike profit-seeking private administration."},{"q":"Which of these falls within the scope of public administration?","o":["Only foreign private investment decisions","Only private company shareholder meetings","Personnel management and public service delivery","Only religious ceremonies"],"a":2,"w":"Public administration covers areas including personnel management, budgeting, and delivery of public services like health and education."},{"q":"Why is public administration important for governance?","o":["It has no real impact on citizens","It eliminates the legislature's role","It replaces the need for elections","It translates government policy and law into actual services and outcomes for citizens"],"a":3,"w":"Public administration is essential because it turns policy and law into concrete services and outcomes that citizens actually experience."},{"q":"Which characteristic distinguishes public administration as being accountable?","o":["It answers to the legislature and the public, unlike private business accountable mainly to shareholders","It answers to no one","It is accountable only to foreign investors","It has no legal rules to follow"],"a":0,"w":"Public administration is accountable to the legislature and the public, reflecting its role in serving public rather than private interests."},{"q":"What would likely happen without effective public administration?","o":["Government policy and law would be implemented perfectly regardless","Even well-designed laws and policies would fail to be properly delivered to citizens","Nothing would change in service delivery","Private companies would take over all government functions automatically"],"a":1,"w":"Without effective public administration, government policy and law cannot be properly implemented or delivered to citizens."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government • Y11',ti:'Characteristics of Public Administration',su:'Explore the key characteristics that define public administration.',steps:[
  {lb:'Hierarchy and structure',dr:dQ2,ht:'<p>Public administration operates through a clear hierarchy of offices, with defined chains of command, from permanent secretaries and directors down to junior officers, ensuring order and accountability.</p>'},
  {lb:'Bureaucracy and rules',dr:dQ2,ht:'<p>It follows formal rules, procedures and written regulations (bureaucracy) to ensure consistency, fairness and predictability in how government business is conducted — a concept associated with sociologist Max Weber.</p>'},
  {lb:'Continuity',dr:dQ2,ht:'<p>Unlike elected governments which change periodically, the public administration (civil service) provides continuity — permanent staff who remain in post to implement policy regardless of which political party is in power.</p>'},
  {lb:'Neutrality and anonymity',dr:dQ2,ht:'<p>Civil servants are expected to be politically neutral, serving whichever government is in power impartially, and to work anonymously — with political credit or blame resting with elected ministers, not civil servants themselves.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Public administration typically operates through:","o":["A clear hierarchy of offices with defined chains of command","No structure at all","Only informal, undocumented arrangements","A single unaccountable individual"],"a":0,"w":"Public administration is structured hierarchically, with clear chains of command from senior to junior officers."},{"q":"Which sociologist is closely associated with the concept of bureaucracy in public administration?","o":["Karl Marx","Max Weber","John Locke","Aristotle"],"a":1,"w":"Max Weber developed the classic sociological theory of bureaucracy — rule-based, hierarchical, impersonal administration."},{"q":"'Continuity' as a characteristic of public administration means:","o":["Civil servants change every time a new government is elected","There is no administrative staff at all","Permanent staff remain in post to implement policy regardless of which party is in power","Only elected officials can implement policy"],"a":2,"w":"Continuity means the permanent civil service remains in place across changes of elected government, ensuring stable implementation of policy."},{"q":"'Neutrality' in public administration means civil servants should:","o":["Openly support one political party","Only work for opposition parties","Refuse to implement any government policy","Serve whichever government is in power impartially, without political bias"],"a":3,"w":"Neutrality requires civil servants to serve any government in power impartially, without favouring a particular political party."},{"q":"'Anonymity' in the civil service means:","o":["Political credit or blame rests with elected ministers, not the civil servants who implement policy","Civil servants take public credit for all government successes","Civil servants' names are never recorded anywhere","Civil servants work in total secrecy from each other"],"a":0,"w":"Anonymity means civil servants work behind the scenes; ministers, who are politically accountable, take public credit or blame."},{"q":"Why does public administration rely on formal rules and procedures (bureaucracy)?","o":["To make governance slower for no reason","To ensure consistency, fairness and predictability in government business","To allow officials to act however they wish","To eliminate all accountability"],"a":1,"w":"Formal rules and procedures ensure that government business is conducted consistently, fairly and predictably."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government • Y11',ti:'Meaning and Features of the Civil Service',su:'Understand the civil service as the core institution of public administration.',steps:[
  {lb:'What is the civil service?',dr:dQ3,ht:'<p>The civil service is the body of permanent, professional, non-political officials who staff government ministries and departments, responsible for implementing government policies and providing administrative support to ministers.</p>'},
  {lb:'Permanence',dr:dQ3,ht:'<p>Civil servants are career employees who typically remain in service across different governments and administrations, unlike political appointees who leave office when a government changes.</p>'},
  {lb:'Political neutrality',dr:dQ3,ht:'<p>Civil servants must serve the government of the day impartially, regardless of their personal political views, ensuring policy continuity and public trust in administrative fairness.</p>'},
  {lb:'Hierarchy and specialisation',dr:dQ3,ht:'<p>The civil service is organised hierarchically (from permanent secretary down to junior clerks) and features specialisation, with officers assigned to specific departments (finance, health, education) based on expertise.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{"q":"The civil service is best defined as:","o":["The body of permanent, professional, non-political officials who staff government ministries","Elected politicians who form the government","A private business sector","The military high command"],"a":0,"w":"The civil service comprises permanent, professional, non-political officials who staff and administer government ministries and departments."},{"q":"Which is a defining feature of civil service employment?","o":["Officials change automatically with every new government","Permanence — civil servants typically remain in service across changes of government","Officials are elected directly by the public","Civil servants openly campaign for political parties"],"a":1,"w":"Permanence is a defining feature: civil servants remain in career service across different governments, unlike political appointees."},{"q":"Political neutrality in the civil service requires officials to:","o":["Refuse instructions from any minister","Only serve governments they personally support","Serve the government of the day impartially regardless of personal political views","Campaign actively for their preferred party"],"a":2,"w":"Political neutrality means civil servants serve whichever government is in power impartially, setting aside personal political views."},{"q":"Which best describes the civil service's internal structure?","o":["No structure or hierarchy at all","Only elected members with no ranks","A single unranked pool of identical staff","A hierarchy from permanent secretary down to junior clerks, with departmental specialisation"],"a":3,"w":"The civil service is organised hierarchically with specialisation by department, from senior permanent secretaries to junior clerks."},{"q":"Who typically heads a government ministry's civil service staff (the top career civil servant), distinct from the elected/appointed minister?","o":["The Permanent Secretary","The President alone","A market trader","A traditional ruler"],"a":0,"w":"The Permanent Secretary is typically the most senior career civil servant heading a ministry's administrative staff, distinct from the political minister."},{"q":"Why is permanence in the civil service valuable to government?","o":["It has no value at all","It ensures policy continuity and retains institutional expertise across changes of political leadership","It guarantees civil servants can never be removed for misconduct","It means civil servants set government policy themselves"],"a":1,"w":"Permanence ensures continuity of policy implementation and retains institutional knowledge and expertise despite changes in political leadership."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government • Y11',ti:'Functions of the Civil Service',su:'Explore what the civil service actually does.',steps:[
  {lb:'Policy advice and implementation',dr:dQ4,ht:'<p>Civil servants advise ministers on policy options based on technical expertise, and then implement the policies that ministers and the legislature decide to adopt, translating decisions into administrative action.</p>'},
  {lb:'Service delivery',dr:dQ4,ht:'<p>The civil service delivers essential public services — collecting taxes, running schools and hospitals administratively, issuing licences and permits, and managing public records.</p>'},
  {lb:'Financial management',dr:dQ4,ht:'<p>Civil servants manage government budgets, control public expenditure, ensure funds are used for their intended purposes, and maintain financial accountability through audits and reporting.</p>'},
  {lb:'Regulatory functions',dr:dQ4,ht:'<p>The civil service enforces regulations across sectors — from environmental standards to business licensing — ensuring laws passed by the legislature are properly applied in practice.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{"q":"A key function of the civil service in relation to policy is to:","o":["Advise ministers on policy options and implement decided policies","Make all final policy decisions instead of elected ministers","Refuse to implement any government policy","Only advise foreign governments"],"a":0,"w":"Civil servants provide technical policy advice to ministers and then implement the policies that are decided upon."},{"q":"Which is an example of civil service 'service delivery'?","o":["Conducting a national election directly","Running schools and hospitals administratively, issuing licences and permits","Declaring war on another country","Setting the exchange rate of the naira alone"],"a":1,"w":"Service delivery functions include administering schools, hospitals, licences and permits at the operational level."},{"q":"Financial management, as a civil service function, includes:","o":["Printing new currency notes personally","Only counting votes in an election","Managing budgets, controlling expenditure, and ensuring accountability through audits","Setting political party membership fees"],"a":2,"w":"Financial management functions include budget management, expenditure control and accountability through auditing and reporting."},{"q":"Which best describes a regulatory function of the civil service?","o":["Managing a private company's marketing","Writing campaign speeches for political candidates","Conducting religious ceremonies","Enforcing business licensing and environmental standards passed into law by the legislature"],"a":3,"w":"Regulatory functions involve enforcing laws and standards (e.g. business licensing, environmental rules) passed by the legislature."},{"q":"Why do civil servants provide policy advice rather than making final decisions themselves?","o":["Because final policy decisions rest with elected/appointed political office-holders who are accountable to the public","Because civil servants are not knowledgeable enough to advise at all","Because civil servants have no role in policy at all","Because only foreign advisors can make policy decisions"],"a":0,"w":"Civil servants advise, but final policy decisions rest with accountable elected/appointed political office-holders, reflecting democratic accountability."},{"q":"Which of these best illustrates the civil service's role in tax collection?","o":["Only private banks collect all government taxes","Civil servants in revenue agencies collect and manage government tax revenue for public use","Tax collection is done exclusively by traditional rulers","Tax collection has nothing to do with public administration"],"a":1,"w":"Civil servants in revenue agencies (e.g. tax authorities) are responsible for collecting and managing government tax revenue."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government • Y11',ti:'Recruitment into the Civil Service',su:'Understand how civil servants are recruited.',steps:[
  {lb:'Merit-based recruitment',dr:dQ5,ht:'<p>Modern civil service recruitment is generally based on merit — open competitive examinations, interviews, and assessment of qualifications — rather than favouritism, ensuring competent staff are appointed.</p>'},
  {lb:'Federal character in Nigerian recruitment',dr:dQ5,ht:'<p>In Nigeria, recruitment into the federal civil service also considers the federal character principle, aiming for representation of Nigeria\'s diverse states and ethnic groups, alongside merit.</p>'},
  {lb:'Qualifications and entry levels',dr:dQ5,ht:'<p>Recruitment typically requires specific educational qualifications matched to entry grade levels — from school certificate holders at junior levels to university graduates at professional/executive entry levels.</p>'},
  {lb:'Challenges in recruitment',dr:dQ5,ht:'<p>Challenges include political interference, nepotism/favouritism undermining merit, delays in recruitment processes, and, at times, tension between merit-based selection and federal character quotas.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{"q":"Modern civil service recruitment is generally expected to be based on:","o":["Merit — competitive examinations, interviews, and assessed qualifications","Favouritism and personal connections only","Random selection with no criteria","Only hereditary succession"],"a":0,"w":"Merit-based recruitment through competitive processes is the standard expected principle for modern civil service appointments."},{"q":"The federal character principle, as applied to civil service recruitment in Nigeria, aims to:","o":["Exclude all ethnic minorities from employment","Ensure representation of Nigeria's diverse states and ethnic groups in federal appointments","Give one region permanent exclusive control","Abolish merit-based recruitment entirely"],"a":1,"w":"Federal character aims to balance merit with fair representation of Nigeria's diverse states and ethnic groups in federal appointments."},{"q":"Entry into professional/executive levels of the civil service typically requires:","o":["No qualifications at all","Only primary school certificates","University-level qualifications matched to entry grade level","Only military training"],"a":2,"w":"Professional/executive entry levels typically require university qualifications appropriate to the specific grade level."},{"q":"Which is a common challenge affecting merit-based civil service recruitment in practice?","o":["No challenges exist at all","Excessive transparency in recruitment","Too much reliance on competitive examinations","Political interference and nepotism undermining merit-based selection"],"a":3,"w":"Political interference and nepotism/favouritism are common challenges that can undermine merit-based civil service recruitment."},{"q":"Why might tension arise between merit-based recruitment and federal character quotas?","o":["Because prioritising broad representation can sometimes mean a strictly highest-scoring candidate from one region is not selected","Because they always perfectly align with no trade-offs","Because federal character has nothing to do with recruitment","Because merit-based recruitment is illegal in Nigeria"],"a":0,"w":"Tension can arise because balancing broad regional/ethnic representation with strict merit-ranking can occasionally mean the top-scoring individual candidate is not selected in favour of balanced representation."},{"q":"What is the main purpose of using competitive examinations in civil service recruitment?","o":["To ensure only wealthy candidates are recruited","To identify and appoint the most competent candidates fairly","To eliminate the need for any qualifications","To guarantee jobs for relatives of officials"],"a":1,"w":"Competitive examinations are used to fairly identify and appoint the most competent candidates for civil service positions."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government • Y11',ti:'Promotion in the Civil Service',su:'Understand how civil servants advance through the ranks.',steps:[
  {lb:'Basis for promotion',dr:dQ6,ht:'<p>Promotion in the civil service is generally based on a combination of seniority (years of service), merit (performance appraisal), and, at times, passing promotional examinations for advancement to higher grade levels.</p>'},
  {lb:'Performance appraisal',dr:dQ6,ht:'<p>Regular performance appraisal systems assess civil servants\' work output, competence and conduct, forming a key input into promotion decisions alongside seniority.</p>'},
  {lb:'Promotion boards/committees',dr:dQ6,ht:'<p>Promotions are typically decided by designated promotion boards or civil service commissions, intended to ensure decisions are made on official criteria rather than personal favouritism.</p>'},
  {lb:'Challenges in the promotion system',dr:dQ6,ht:'<p>Challenges include: promotion delays due to bureaucratic bottlenecks, allegations of favouritism or \'godfatherism\' overriding merit, and insufficient positions at higher grades relative to eligible staff.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{"q":"Promotion in the civil service is generally based on:","o":["A combination of seniority and merit/performance appraisal","Random selection only","Purely hereditary right","Only the recommendation of a traditional ruler"],"a":0,"w":"Civil service promotion typically combines seniority (years served) with merit, assessed through performance appraisal."},{"q":"What is the main purpose of performance appraisal in the civil service?","o":["To determine a civil servant's private religious beliefs","To assess work output, competence and conduct as input into promotion decisions","To replace the need for recruitment exams","To set the national budget"],"a":1,"w":"Performance appraisal systematically evaluates competence and conduct, informing promotion and personnel decisions."},{"q":"Who typically decides on civil service promotions to ensure fairness?","o":["Foreign consultants exclusively","A single unelected private individual","Designated promotion boards or civil service commissions","Traditional rulers exclusively"],"a":2,"w":"Promotion boards or civil service commissions are typically designated to decide promotions based on official criteria, aiming for fairness."},{"q":"Which of these is a recognised challenge in civil service promotion systems?","o":["Excessive transparency causing no issues","Complete absence of any promotion system","Too few civil servants seeking promotion","Allegations of favouritism or 'godfatherism' overriding merit"],"a":3,"w":"Favouritism or 'godfatherism' overriding merit-based promotion criteria is a recognised challenge in many civil service systems."},{"q":"Why can promotion delays occur in large civil service bureaucracies?","o":["Due to bureaucratic bottlenecks and limited higher-grade positions relative to eligible staff","Because promotions happen instantly with no process at all","Because there are too many vacant senior positions","Because civil servants are never eligible for promotion"],"a":0,"w":"Bureaucratic bottlenecks and limited available higher-grade positions relative to eligible staff commonly cause promotion delays."},{"q":"Why is it important that promotion boards apply official criteria rather than personal favouritism?","o":["Because official criteria are irrelevant to good administration","To maintain fairness, morale and the integrity of the merit principle in the civil service","Because favouritism always leads to better outcomes","Because it has no impact on civil service morale"],"a":1,"w":"Applying official criteria rather than favouritism maintains fairness, staff morale and upholds the merit principle central to good public administration."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government • Y11',ti:'Discipline in the Civil Service',su:'Understand how discipline and conduct are managed among civil servants.',steps:[
  {lb:'Purpose of discipline',dr:dQ7,ht:'<p>Discipline in the civil service ensures officials adhere to rules, regulations and ethical standards, maintaining public trust, efficiency, and the integrity of government administration.</p>'},
  {lb:'Common disciplinary offences',dr:dQ7,ht:'<p>Common offences include absenteeism, corruption/bribery, insubordination, abuse of office, negligence of duty, and breach of the official code of conduct.</p>'},
  {lb:'Disciplinary procedures',dr:dQ7,ht:'<p>Disciplinary procedures typically involve: a query or query letter, an opportunity for the officer to respond/defend themselves, an investigation or disciplinary panel, and a decision ranging from warning to suspension or dismissal.</p>'},
  {lb:'Role of oversight bodies',dr:dQ7,ht:'<p>In Nigeria, bodies such as the Independent Corrupt Practices Commission (ICPC) and the Economic and Financial Crimes Commission (EFCC), alongside internal civil service disciplinary committees, help enforce discipline and accountability.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{"q":"The main purpose of discipline in the civil service is to:","o":["Ensure adherence to rules and ethical standards, maintaining public trust and efficiency","Punish civil servants without any due process","Remove all civil servants regularly regardless of conduct","Eliminate the need for a code of conduct"],"a":0,"w":"Discipline maintains adherence to rules and ethics, ensuring public trust and efficient administration."},{"q":"Which of these is a common civil service disciplinary offence?","o":["Attending an approved training course","Corruption/bribery and abuse of office","Taking authorised annual leave","Submitting a performance appraisal on time"],"a":1,"w":"Corruption, bribery and abuse of office are recognised disciplinary offences within the civil service."},{"q":"A typical civil service disciplinary procedure begins with:","o":["Immediate dismissal with no process","A public vote by all citizens","A query or query letter, followed by the officer's opportunity to respond","A direct order from a foreign government"],"a":2,"w":"Disciplinary procedures typically start with a query letter, giving the officer an opportunity to respond before further action."},{"q":"Which Nigerian body specifically investigates corruption among public officials, including civil servants?","o":["The Federal Road Safety Corps","The Nigerian Stock Exchange","The National Youth Service Corps","The Independent Corrupt Practices Commission (ICPC)"],"a":3,"w":"The ICPC investigates and prosecutes corruption among public officials, complementing internal civil service disciplinary mechanisms."},{"q":"Why is due process important in civil service disciplinary procedures?","o":["It ensures fairness by giving officers the chance to respond before a decision is made","It has no real importance to discipline","It always guarantees the officer will be dismissed","It removes the need for any investigation"],"a":0,"w":"Due process (query, response, investigation) ensures fairness and legitimacy in disciplinary decisions."},{"q":"What range of outcomes can result from civil service disciplinary proceedings?","o":["Only immediate promotion regardless of the offence","Outcomes ranging from a warning to suspension or dismissal, depending on severity","Automatic transfer to a foreign country","No outcome is ever possible"],"a":1,"w":"Disciplinary outcomes range from warnings for minor issues to suspension or dismissal for serious offences, depending on severity."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government • Y11',ti:'Merits and Demerits of the Civil Service System',su:'Evaluate the strengths and weaknesses of civil service administration.',steps:[
  {lb:'Merits: expertise and continuity',dr:dQ8,ht:'<p>The civil service brings specialised expertise and continuity to government, ensuring policies are implemented professionally and consistently even as elected governments change.</p>'},
  {lb:'Merits: neutrality and stability',dr:dQ8,ht:'<p>Political neutrality allows the civil service to serve any government fairly, contributing to administrative stability and public confidence in impartial service delivery.</p>'},
  {lb:'Demerits: bureaucratic delay',dr:dQ8,ht:'<p>Excessive rules, hierarchy and procedure (\'red tape\') can cause slow decision-making, inefficiency, and frustration for citizens seeking services, undermining responsiveness.</p>'},
  {lb:'Demerits: corruption and inefficiency risks',dr:dQ8,ht:'<p>Large bureaucracies can be vulnerable to corruption, nepotism in recruitment/promotion, and inefficiency, particularly where oversight and accountability mechanisms are weak.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{"q":"Which is a key merit of the civil service system?","o":["It brings specialised expertise and ensures continuity in policy implementation","It always eliminates all bureaucratic delay","It guarantees zero corruption anywhere","It has no need for any rules"],"a":0,"w":"Expertise and continuity across changes of elected government are core merits of a professional civil service."},{"q":"'Bureaucratic delay' or 'red tape' refers to:","o":["A form of civil service promotion","Excessive rules and procedures causing slow decision-making and inefficiency","A type of election","A civil service uniform"],"a":1,"w":"Bureaucratic delay ('red tape') describes how excessive rules and procedures can slow decision-making and reduce responsiveness."},{"q":"How does political neutrality benefit the civil service system?","o":["It eliminates the need for elections","It means civil servants ignore all government instructions","It allows the civil service to serve any government fairly, contributing to stability and public confidence","It guarantees civil servants never make mistakes"],"a":2,"w":"Political neutrality allows fair service to any government, contributing to administrative stability and public trust."},{"q":"Which is a recognised demerit/weakness of large civil service bureaucracies?","o":["Guaranteed rapid decision-making in every case","Complete elimination of all inefficiency automatically","Total absence of any hierarchy","Vulnerability to corruption and nepotism where oversight is weak"],"a":3,"w":"Large bureaucracies can be vulnerable to corruption and nepotism, especially where accountability mechanisms are weak."},{"q":"Why is continuity considered valuable despite the civil service's demerits?","o":["It ensures institutional knowledge and stable implementation persist even as elected governments change","It has no real value at all","It means civil servants can never be replaced","It guarantees civil servants set all government policy"],"a":0,"w":"Continuity preserves institutional knowledge and stable policy implementation across changes in elected political leadership, despite other system weaknesses."},{"q":"What reform is commonly proposed to address civil service inefficiency and corruption risks?","o":["Abolishing the civil service entirely","Strengthening oversight, transparency, merit-based recruitment/promotion, and reducing unnecessary bureaucratic bottlenecks","Removing all rules and procedures completely","Eliminating performance appraisal systems"],"a":1,"w":"Reforms commonly proposed include strengthening oversight and transparency, reinforcing merit principles, and streamlining excessive bureaucratic procedures."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government • Y11',ti:'WAEC Exam Preparation — Public Administration & Civil Service',su:'Practise WAEC-style questions on public administration and the civil service.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions: (1) Define public administration/civil service clearly. (2) State key characteristics or functions. (3) Discuss recruitment, promotion or discipline as required. (4) Evaluate merits and demerits. (5) Use Nigerian examples (ICPC, federal character, Permanent Secretary).</p>'},
  {lb:'Common WAEC question patterns',dr:dQ9,ht:'<p>Typical questions: \'What is public administration? Discuss its characteristics\', \'Explain the functions of the civil service\', \'Discuss recruitment and promotion procedures in the civil service\', \'Examine the merits and demerits of bureaucracy\'.</p>'},
  {lb:'Key facts to memorise',dr:dQ9,ht:'<p>Public administration = implementing policy through state machinery. Civil service characteristics: permanence, neutrality, anonymity, hierarchy. Weber = bureaucracy theory. ICPC/EFCC = discipline/anti-corruption oversight. Federal character affects recruitment.</p>'},
  {lb:'Common mistakes to avoid',dr:dQ9,ht:'<p>Avoid confusing civil servants (permanent, non-political) with political appointees/ministers (temporary, political). Avoid omitting Nigerian examples. Always distinguish between recruitment, promotion and discipline as separate processes.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{"q":"A precise WAEC definition of public administration should mention:","o":["The implementation of government policy through the organised machinery of the state","Only private company management","A form of military rule","A type of election"],"a":0,"w":"WAEC expects public administration to be defined as the implementation of government policy through the state's organised machinery."},{"q":"When asked to distinguish civil servants from political appointees, WAEC expects candidates to note that civil servants are:","o":["Temporary and openly political","Permanent, professional and politically neutral, unlike temporary political appointees","Elected directly by the public","Unaccountable to any oversight body"],"a":1,"w":"WAEC expects the key distinction that civil servants are permanent, professional and politically neutral, unlike temporary political appointees."},{"q":"For a question on civil service functions, a complete WAEC answer should include:","o":["Only writing political campaign speeches","Only conducting national elections","Policy advice, implementation, service delivery, financial management and regulation","Only managing private businesses"],"a":2,"w":"A complete WAEC answer on civil service functions covers policy advice, implementation, service delivery, financial management and regulatory enforcement."},{"q":"Which scholar should be cited when discussing bureaucracy in a WAEC essay?","o":["Adam Smith","Karl Marx","John Locke","Max Weber"],"a":3,"w":"Max Weber is the standard scholar cited for bureaucracy theory in Government/Public Administration essays."},{"q":"A common WAEC mistake to avoid on this topic is:","o":["Treating recruitment, promotion and discipline as the same single process","Distinguishing recruitment from promotion clearly","Giving Nigerian examples like ICPC","Defining terms before explaining them"],"a":0,"w":"A frequent error is failing to distinguish recruitment, promotion and discipline as separate processes within civil service management."},{"q":"When discussing merits/demerits of bureaucracy for WAEC, students should balance:","o":["Only listing merits with no demerits","Expertise/continuity/neutrality (merits) against bureaucratic delay/corruption risk (demerits)","Only listing demerits with no merits","Ignoring the topic of merits and demerits entirely"],"a":1,"w":"A balanced WAEC answer weighs merits (expertise, continuity, neutrality) against demerits (bureaucratic delay, corruption risk)."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Government • Y11',ti:'Mixed Questions — Public Administration & Civil Service',su:'Integrated revision across public administration, recruitment, promotion and discipline.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Public administration = implementing policy via state machinery. Civil service: permanent, neutral, anonymous, hierarchical. Functions: policy advice, implementation, service delivery, finance, regulation. Recruitment: merit + federal character. Promotion: seniority + merit via boards. Discipline: query → investigation → outcome; ICPC/EFCC oversight.</p>'},
  {lb:'Connecting concepts',dr:dQ10,ht:'<p>Chain: Recruitment brings competent staff in → promotion rewards performance and retains talent → discipline maintains integrity and public trust → together these processes determine how well public administration delivers services to citizens.</p>'},
  {lb:'Nigeria-specific facts',dr:dQ10,ht:'<p>Nigeria: federal character shapes recruitment; Permanent Secretary heads ministry administration; ICPC and EFCC handle corruption discipline; civil service commissions oversee recruitment/promotion at federal and state levels.</p>'},
