.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}

.qb:hover{border-color:var(--red);color:var(--red);}

.main{flex:1;min-width:0;}

.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}

.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}

function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'

document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;

});

{ey:'Q1 \u2022 Gov • POL',ti:'Overview: West Africa\'s Post-Independence Political Landscape',su:'Compare the shared colonial legacies and political challenges across West Africa.',steps:[
{lb:'Independence wave',dr:dQ1,ht:'<p>West Africa\'s independence wave ran from <b>Ghana in 1957</b> (the first sub-Saharan African colony to gain independence) through most of the region by the early 1960s, to <b>Guinea-Bissau and Cape Verde in 1974-75</b> (former Portuguese colonies, the last to gain independence via armed liberation struggle).</p>'},
{lb:'Colonial legacies: Anglophone vs Francophone',dr:dQ1,ht:'<p>British colonies (Nigeria, Ghana, Sierra Leone, The Gambia) generally inherited <b>indirect rule</b> traditions and a federal/regional structure. French colonies (Senegal, C&ocirc;te d\'Ivoire, Mali, Guinea) experienced more <b>direct rule and assimilation policy</b>, often retaining closer post-independence ties to France &mdash; a relationship sometimes critically termed <b>"Fran&ccedil;afrique."</b></p>'},
{lb:'Shared post-independence challenges',dr:dQ1,ht:'<p>Nearly every West African state faced: weak state institutions inherited from short colonial preparation periods; ethnic and regional divisions often deepened by colonial-era borders drawn at the <b>Berlin Conference (1884-85)</b> without regard to existing communities; economic dependency on a narrow range of primary commodity exports; and Cold War-era superpower interference (1947-1991).</p>'},
{lb:'Divergent trajectories',dr:dQ1,ht:'<p>Political trajectories diverged sharply: <b>Senegal</b> maintained continuous civilian rule since independence; <b>Ghana and Nigeria</b> experienced repeated military coups; <b>Sierra Leone and Liberia</b> descended into brutal civil wars in the 1990s; while the <b>Sahel states (Mali, Burkina Faso, Niger)</b> have seen a fresh wave of coups since 2020.</p>'},

ded into brutal civil wars during the 1990s?","o":["Ghana and Nigeria","Senegal and Mali","Sierra Leone and Liberia","Guinea-Bissau and Cape Verde"],"a":2,"w":"Sierra Leone and Liberia both descended into brutal civil wars during the 1990s."},{"q":"Which group of Sahel states has seen a fresh wave of coups since 2020?","o":["Guinea-Bissau and Cape Verde","Senegal, Ghana and Nigeria","Sierra Leone and Liberia","Mali, Burkina Faso and Niger"],"a":3,"w":"Mali, Burkina Faso and Niger have all experienced a fresh wave of military coups since 2020."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which rebel group fought the Sierra Leone government during its civil war (1991-2002)?","o":["The Revolutionary United Front (RUF)","ECOMOG","The NPFL","The Special Court"],"a":0,"w":"The Revolutionary United Front (RUF) fought against the Sierra Leone government during the civil war."},{"q":"What term describes diamonds mined in rebel-held areas of Sierra Leone to fund the conflict?","o":["\"War bonds\"","\"Blood diamonds\"","\"Rebel gold\"","\"Trade tokens\""],"a":1,"w":"\"Blood diamonds\" describes diamonds mined in rebel-held areas and sold to fund the conflict."},{"q":"Who came to power in Liberia after its first civil war (1989-1997)?","o":["Kwame Nkrumah","Jerry Rawlings","Charles Taylor","Alpha Condé"],"a":2,"w":"Charles Taylor came to power in Liberia after its first civil war (1989-1997)."},{"q":"Which court later tried and convicted Charles Taylor for war crimes?","o":["The ECOWAS Court of Justice","The International Court of Justice","The Nigerian Supreme Court","The Special Court for Sierra Leone"],"a":3,"w":"The Special Court for Sierra Leone tried and convicted Charles Taylor for war crimes."},{"q":"What is ECOMOG?","o":["The ECOWAS Monitoring Group, a regional peacekeeping force","A rebel group in Sierra Leone","A UN agency for refugees","A West African trade organisation"],"a":0,"w":"ECOMOG is the ECOWAS Monitoring Group, a regional peacekeeping force."},{"q":"Which country provided the largest troop contribution to ECOMOG's interventions?","o":["Ghana","Nigeria","Senegal","Mali"],"a":1,"w":"Nigeria provided the largest troop contribution to ECOMOG's interventions in Liberia and Sierra Leone."},{"q":"In which year did ECOMOG first deploy to Liberia?","o":["2002","1997","1990","1989"],"a":2,"w":"ECOMOG first deployed to Liberia in 1990."},{"q":"What kind of body did both Sierra Leone and Liberia establish to address wartime atrocities afterward?","o":["Separate independent states","New royal monarchies","Permanent military governments","Truth and Reconciliation Commissions"],"a":3,"w":"Both countries established Truth and Reconciliation Commissions to address wartime atrocities."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov • POL',ti:'Francophone West Africa\'s Political Patterns',su:'Compare political development in Senegal, Côte d\'Ivoire and Mali.',steps:[
{lb:'Côte d\'Ivoire under Houphouët-Boigny',dr:dQ2,ht:'<p><b>Félix Houphouët-Boigny</b> ruled C&ocirc;te d\'Ivoire from independence in 1960 until his death in <b>1993</b> &mdash; 33 years &mdash; under sustained one-party dominance, delivering relative economic stability, though ethnic and political tensions escalated sharply after his death.</p>'},
{lb:'Senegal\'s relative stability',dr:dQ2,ht:'<b>Senegal</b>, led initially by <b>Léopold Sédar Senghor</b> (1960-1980), has maintained relatively continuous civilian rule since independence and is widely regarded as one of Africa\'s most stable and consistently democratic states.</p>'},
{lb:'Mali\'s cycles of instability',dr:dQ2,ht:'<p><b>Mali</b> has experienced repeated periods of military rule and coups &mdash; in 1968, 1991, and more recently <b>2012, 2020 and 2021</b> &mdash; the most recent coups occurring amid a worsening <b>jihadist insurgency</b> across the Sahel region.</p>'},
{lb:'Persistent French influence',dr:dQ2,ht:'<p>French political, economic and military influence has generally remained <b>more persistent</b> in Francophone West Africa than British influence in Anglophone states, including through the shared <b>CFA franc</b> currency arrangement and French military bases, contributing to recent anti-French sentiment in some Sahel states.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"For how many years did Félix Houphouët-Boigny rule Côte d'Ivoire, from independence until his death?","o":["33 years","20 years","10 years","50 years"],"a":0,"w":"Houphouët-Boigny ruled Côte d'Ivoire for 33 years, from 1960 until his death in 1993."},{"q":"Who led Senegal from independence in 1960 until 1980?","o":["Félix Houphouët-Boigny","Léopold Sédar Senghor","Kwame Nkrumah","Charles Taylor"],"a":1,"w":"Léopold Sédar Senghor led Senegal from independence in 1960 until 1980."},{"q":"Which West African country is widely regarded as one of Africa's most stable and consistently democratic states?","o":["Côte d'Ivoire","Mali","Senegal","Sierra Leone"],"a":2,"w":"Senegal is widely regarded as one of Africa's most stable and consistently democratic states."},{"q":"Besides 1968 and 1991, in which more recent years has Mali experienced military coups?","o":["2002 and 2010","1993 and 1997","1957 and 1960","2012, 2020 and 2021"],"a":3,"w":"Mali experienced further coups in 2012, 2020 and 2021, amid worsening insurgency."},{"q":"What kind of insurgency has worsened in Mali around the time of its recent coups?","o":["A jihadist insurgency","A pro-democracy uprising","A trade union strike","A religious reformation"],"a":0,"w":"A worsening jihadist insurgency has accompanied Mali's recent coups."},{"q":"What shared currency arrangement illustrates persistent French influence in Francophone West Africa?","o":["The British pound","The CFA franc","The US dollar","The Nigerian naira"],"a":1,"w":"The shared CFA franc currency arrangement illustrates persistent French influence in Francophone West Africa."},{"q":"What critical term describes ongoing close French involvement in its former colonies' affairs?","o":["The Commonwealth","Pax Africana","Françafrique","The Sahel Accord"],"a":2,"w":"\"Françafrique\" describes ongoing close French involvement in its former colonies' affairs."},{"q":"What recent sentiment has grown in some Sahel states regarding French influence?","o":["Indifference to all foreign influence","Increased demand for French colonisation","Support for rejoining France directly","Anti-French sentiment"],"a":3,"w":"Anti-French sentiment has grown in some Sahel states in connection with persistent French influence."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov • POL',ti:'ECOWAS\'s Political and Security Role',su:'Explain how ECOWAS evolved from an economic body into a political and security actor.',steps:[
{lb:'Founding and original mandate',dr:dQ1,ht:'<p><b>ECOWAS</b> was founded by the <b>Treaty of Lagos in 1975</b>, with an originally <b>economic</b> mandate: promoting trade integration and cooperation among West African states, with Nigeria as a leading founding member.</p>'},
{lb:'Development of a security role',dr:dQ1,ht:'<p>ECOWAS developed a formal <b>security and conflict-prevention mandate</b> through its <b>1999 Mechanism for Conflict Prevention, Management, Resolution, Peacekeeping and Security</b>, following its earlier ad hoc ECOMOG interventions in Liberia and Sierra Leone.</p>'},
{lb:'Responding to unconstitutional changes of government',dr:dQ1,ht:'<p>ECOWAS has increasingly imposed <b>sanctions and suspensions</b> on member states following unconstitutional changes of government &mdash; suspending <b>Mali (2021)</b>, <b>Guinea (2021)</b>, <b>Burkina Faso (2022)</b>, and <b>Niger (2023)</b> after coups in each country.</p>'},
{lb:'The limits of enforcement: Niger, 2023',dr:dQ1,ht:'<p>Following Niger\'s <b>July 2023 coup</b> against President <b>Mohamed Bazoum</b>, ECOWAS threatened <b>military intervention</b> to restore him, but ultimately did not carry this out &mdash; highlighting the practical limits of ECOWAS\'s enforcement power when member states resist collectively.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which treaty founded ECOWAS in 1975?","o":["The Treaty of Lagos","The Treaty of Lomé","The Berlin Conference","The Montevideo Convention"],"a":0,"w":"ECOWAS was founded by the Treaty of Lagos in 1975."},{"q":"What was ECOWAS's originally intended mandate at its founding?","o":["Military conquest of neighbouring states","Economic trade integration and cooperation","Religious unification","Abolishing all national governments"],"a":1,"w":"ECOWAS's original mandate was economic trade integration and cooperation among member states."},{"q":"In which year did ECOWAS adopt its formal Mechanism for Conflict Prevention and Security?","o":["1990","1975","1999","2002"],"a":2,"w":"ECOWAS adopted its formal Mechanism for Conflict Prevention, Management, Resolution, Peacekeeping and Security in 1999."},{"q":"Which West African states has ECOWAS suspended following recent coups (2021-2023)?","o":["Côte d'Ivoire and Togo","Senegal, Ghana and Nigeria","Sierra Leone and Liberia","Mali, Guinea, Burkina Faso and Niger"],"a":3,"w":"ECOWAS has suspended Mali, Guinea, Burkina Faso and Niger following recent coups."},{"q":"Who was the President of Niger removed in the July 2023 coup?","o":["Mohamed Bazoum","Assimi Goïta","Alpha Condé","Charles Taylor"],"a":0,"w":"Mohamed Bazoum was the President of Niger removed in the July 2023 coup."},{"q":"What did ECOWAS threaten, but ultimately not carry out, after Niger's 2023 coup?","o":["Immediate recognition of the coup government","Military intervention to restore Bazoum","A permanent alliance with the coup leaders","Full economic integration with Niger"],"a":1,"w":"ECOWAS threatened military intervention to restore Bazoum but ultimately did not carry it out."},{"q":"What does the Niger case illustrate about ECOWAS's enforcement power?","o":["That ECOWAS has no security role at all","Its unlimited and always-effective military power","Its practical limits when member states resist collectively","That ECOWAS always achieves its stated goals immediately"],"a":2,"w":"The Niger case illustrates the practical limits of ECOWAS's enforcement power when member states resist collectively."},{"q":"Which earlier ECOWAS interventions preceded its formal 1999 security mechanism?","o":["A joint operation with the United Nations only, with no ECOWAS troops","Interventions in Ghana and Senegal","A direct war against France","ECOMOG interventions in Liberia and Sierra Leone"],"a":3,"w":"ECOMOG's earlier interventions in Liberia and Sierra Leone preceded ECOWAS's formal 1999 security mechanism."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov • POL',ti:'Democratic Transitions of the 1990s',su:'Explain the "Third Wave" of democratisation across West Africa in the 1990s.',steps:[
{lb:'The end of the Cold War and the "Third Wave"',dr:dQ2,ht:'<p>The end of the <b>Cold War (1989-91)</b> removed superpower backing for many authoritarian African regimes that had been propped up by either the USA or USSR, contributing to a broader <b>"Third Wave"</b> of democratisation across Africa and much of the world during the 1990s.</p>'},
{lb:'The Benin model: national conferences',dr:dQ2,ht:'<p><b>Benin\'s 1990 National Conference</b> pioneered a model later followed elsewhere in Francophone West Africa: a negotiated, peaceful national gathering bringing together government, opposition and civil society to agree a path to multiparty democracy.</p>'},
{lb:'Nigeria\'s contrasting experience',dr:dQ2,ht:'<p>Nigeria\'s own transition attempt during this period, culminating in the <b>annulled 12 June 1993 election</b>, contrasted sharply with more successful negotiated transitions elsewhere in the region during the same years, delaying Nigeria\'s return to democracy until 1999.</p>'},
{lb:'Uneven implementation',dr:dQ2,ht:'<p>By the late 1990s, most West African states had formally adopted <b>multiparty constitutions</b>, though the genuine implementation of democratic norms &mdash; free elections, respect for term limits, civilian control of the military &mdash; varied widely and, in several states, later reversed.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What global event (1989-91) removed superpower backing for many authoritarian African regimes?","o":["The end of the Cold War","World War II","The founding of the United Nations","The Berlin Conference"],"a":0,"w":"The end of the Cold War (1989-91) removed superpower backing for many authoritarian African regimes."},{"q":"What term describes the broader global democratisation trend of the 1990s?","o":["The \"First Republic\" era","The \"Third Wave\" of democratisation","The \"Colonial Era\"","The \"Cold War Peak\""],"a":1,"w":"The \"Third Wave\" of democratisation describes the broader global democratic trend of the 1990s."},{"q":"Which country pioneered the \"National Conference\" model of negotiated democratic transition in 1990?","o":["Ghana","Nigeria","Benin","Sierra Leone"],"a":2,"w":"Benin pioneered the National Conference model of negotiated democratic transition in 1990."},{"q":"What did Benin's National Conference bring together to agree a path to democracy?","o":["Only religious leaders","Only the military","Only foreign diplomats","Government, opposition and civil society"],"a":3,"w":"Benin's National Conference brought together government, opposition and civil society."},{"q":"Which annulled election contrasted with more successful transitions elsewhere in the region during the 1990s?","o":["Nigeria's 12 June 1993 election","Ghana's 1992 election","Senegal's 1980 transition","Benin's 1990 conference"],"a":0,"w":"Nigeria's annulled 12 June 1993 election contrasted with more successful transitions elsewhere in the region."},{"q":"Until what year was Nigeria's return to democracy delayed, following the 1993 annulment?","o":["1993","1999","1996","2000"],"a":1,"w":"Nigeria's return to democracy was delayed until 1999, following the 1993 annulment."},{"q":"What had most West African states formally adopted by the late 1990s?","o":["Direct colonial rule again","One-party constitutions only","Multiparty constitutions","No constitutions at all"],"a":2,"w":"Most West African states had formally adopted multiparty constitutions by the late 1990s."},{"q":"What varied widely despite the formal adoption of multiparty constitutions?","o":["The number of official languages","The physical size of each country","The population of each country","The genuine implementation of democratic norms"],"a":3,"w":"The genuine implementation of democratic norms varied widely despite formal multiparty constitutions."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov • POL',ti:'The Recent Coup Wave (2020-2023)',su:'Explain the recent wave of military coups across the Sahel region.',steps:[
{lb:'Mali\'s two coups',dr:dQ1,ht:'<p><b>Mali</b> experienced coups in <b>August 2020</b> and <b>May 2021</b>, both led by figures associated with <b>Colonel Assimi Go&iuml;ta</b>, who subsequently became transitional President amid an ongoing jihadist insurgency in the country\'s north.</p>'},
{lb:'Guinea\'s 2021 coup',dr:dQ1,ht:'<p><b>Guinea</b>\'s coup in <b>September 2021</b> removed President <b>Alpha Cond&eacute;</b>, who had controversially changed the constitution to extend his own term limits shortly before being overthrown.</p>'},
{lb:'Burkina Faso\'s double coup',dr:dQ1,ht:'<p><b>Burkina Faso</b> experienced <b>two coups within 2022 alone</b>, amid a rapidly worsening jihadist insurgency and public frustration with the government\'s inability to protect civilians in the country\'s rural areas.</p>'},
{lb:'Niger and the Alliance of Sahel States',dr:dQ1,ht:'<p>Following <b>Niger\'s July 2023 coup</b> against President Mohamed Bazoum, Mali, Burkina Faso and Niger formed the <b>Alliance of Sahel States (AES)</b> in 2023, partly distancing themselves from ECOWAS and, in some cases, from former colonial power France.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Who became Mali's transitional President following the 2020 and 2021 coups?","o":["Colonel Assimi Goïta","Alpha Condé","Mohamed Bazoum","Charles Taylor"],"a":0,"w":"Colonel Assimi Goïta became Mali's transitional President following the 2020 and 2021 coups."},{"q":"What ongoing crisis has accompanied Mali's recent political instability?","o":["A currency collapse only","A jihadist insurgency in the country's north","A dispute with Senegal","A World Cup qualification dispute"],"a":1,"w":"A jihadist insurgency in Mali's north has accompanied its recent political instability."},{"q":"Which president did Guinea's September 2021 coup remove?","o":["Mohamed Bazoum","Assimi Goïta","Alpha Condé","Charles Taylor"],"a":2,"w":"Guinea's September 2021 coup removed President Alpha Condé."},{"q":"What controversial action had Alpha Condé taken shortly before his removal?","o":["Resigning voluntarily","Reducing his own presidential term","Introducing a fully democratic multiparty system","Changing the constitution to extend his own term limits"],"a":3,"w":"Condé had controversially changed the constitution to extend his own term limits shortly before his removal."},{"q":"How many coups did Burkina Faso experience within 2022 alone?","o":["Two","One","Three","None"],"a":0,"w":"Burkina Faso experienced two coups within 2022 alone."},{"q":"What has driven public frustration with government in Burkina Faso's recent crisis?","o":["A dispute over football results","A worsening jihadist insurgency and inability to protect civilians","Excessive foreign investment","A currency surplus"],"a":1,"w":"A worsening jihadist insurgency and the government's inability to protect civilians drove public frustration in Burkina Faso."},{"q":"Which alliance did Mali, Burkina Faso and Niger form in 2023?","o":["ECOWAS","The African Union","The Alliance of Sahel States (AES)","The Commonwealth"],"a":2,"w":"Mali, Burkina Faso and Niger formed the Alliance of Sahel States (AES) in 2023."},{"q":"What has the Alliance of Sahel States partly distanced itself from?","o":["Nigeria specifically","The United Nations entirely","All forms of regional cooperation","ECOWAS and, in some cases, France"],"a":3,"w":"The Alliance of Sahel States has partly distanced itself from ECOWAS and, in some cases, France."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov • POL',ti:'Comparing Nigeria\'s Development with the Region',su:'Evaluate Nigeria\'s political trajectory against broader West African trends.',steps:[
{lb:'Nigeria\'s pattern within the regional trend',dr:dQ2,ht:'<p>Nigeria\'s own trajectory &mdash; independence (1960), repeated military coups, a devastating civil war (1967-70), extended periods of military rule, and eventual return to democracy (1999) &mdash; broadly mirrors regional patterns, though Nigeria\'s <b>size, population and oil wealth</b> give it particular weight and influence within West Africa.</p>'},
{lb:'Avoiding the recent Sahel coup wave',dr:dQ2,ht:'<p>Unlike Mali, Guinea, Burkina Faso and Niger, Nigeria has <b>avoided any military takeover since 1999</b> &mdash; its longest continuous period of civilian, democratic government to date &mdash; despite facing its own serious security challenges, including the Boko Haram insurgency.</p>'},
{lb:'Nigeria\'s regional leadership role',dr:dQ2,ht:'<p>Nigeria has consistently played a <b>leading role</b> within ECOWAS, providing the largest troop contributions to ECOMOG peacekeeping in Liberia and Sierra Leone, and taking a prominent diplomatic role in responding to recent Sahel coups, consistent with its stated Africa-centred foreign policy.</p>'},
{lb:'Lessons from the comparison',dr:dQ2,ht:'<p>Comparative analysis suggests that Nigeria\'s relative post-1999 stability, compared with some Sahel neighbours, may reflect a combination of factors: greater oil-derived state revenue, a larger domestic market cushioning economic shocks, and lasting lessons drawn from its own civil war about the costs of political fragmentation.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What year did Nigeria return to democracy, marking its longest continuous period of civilian government to date?","o":["1999","1960","1979","1993"],"a":0,"w":"Nigeria returned to democracy in 1999, marking its longest continuous period of civilian government to date."},{"q":"Unlike Mali, Guinea, Burkina Faso and Niger, what has Nigeria avoided since 1999?","o":["All forms of insurgency","Any military takeover","Any economic challenges","Any political disagreement"],"a":1,"w":"Nigeria has avoided any military takeover since 1999, unlike several recent Sahel coup states."},{"q":"What insurgency has Nigeria faced despite avoiding military takeover since 1999?","o":["A civil war led by Ghana","A jihadist insurgency in the Sahel led by Mali","The Boko Haram insurgency","An insurgency in Senegal"],"a":2,"w":"Nigeria has faced the Boko Haram insurgency despite avoiding military takeover since 1999."},{"q":"In which peacekeeping missions has Nigeria provided the largest troop contributions?","o":["Missions entirely within its own borders","UN missions in Europe only","NATO missions only","ECOMOG missions in Liberia and Sierra Leone"],"a":3,"w":"Nigeria has provided the largest troop contributions to ECOMOG missions in Liberia and Sierra Leone."},{"q":"What foreign policy tradition is Nigeria's regional leadership role consistent with?","o":["Its Africa-centred foreign policy","A policy of complete isolation","A policy focused only on Europe","A policy of avoiding all international organisations"],"a":0,"w":"Nigeria's regional leadership role is consistent with its long-standing Africa-centred foreign policy."},{"q":"What economic factor is suggested as contributing to Nigeria's relative post-1999 stability?","o":["A complete absence of natural resources","Greater oil-derived state revenue","Total reliance on foreign aid","A currency pegged to the CFA franc"],"a":1,"w":"Greater oil-derived state revenue is suggested as contributing to Nigeria's relative post-1999 stability."},{"q":"What historical experience is suggested to have taught Nigeria lasting lessons about political fragmentation?","o":["Mali's 2020 coup","Ghana's 1966 coup","Its own civil war (1967-70)","Senegal's stable transition"],"a":2,"w":"Nigeria's own civil war (1967-70) is suggested to have taught lasting lessons about the costs of political fragmentation."},{"q":"What overall comparative point does this lesson draw about Nigeria within West Africa?","o":["Nigeria's history is identical to Senegal's in every respect","Nigeria has had no coups or instability at all in its history","Nigeria has been entirely disconnected from regional trends","Its trajectory mirrors regional patterns but its size and oil wealth give it particular influence"],"a":3,"w":"The lesson concludes that Nigeria's trajectory broadly mirrors regional patterns, but its size and oil wealth give it particular influence."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov • POL',ti:'WAEC Exam Preparation — West African Political Development',su:'Practise WAEC-style questions on political development across West Africa.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on West African political development: (1) Identify the <b>specific country or period</b> asked about. (2) Give <b>precise dates and named leaders</b>. (3) Describe <b>key events</b> with cause and effect. (4) Draw a <b>comparative or evaluative conclusion</b>, ideally referencing Nigeria\'s own experience.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "Compare political stability in Ghana and Nigeria since independence." / "Discuss the causes and consequences of the Sierra Leone civil war." / "Explain the role of ECOWAS in managing political crises in West Africa." / "Account for the recent wave of coups in the Sahel."</p>'},
{lb:'Key vocabulary for essays',dr:dQ1,ht:'<p>Key vocabulary: <b>coup d\'état</b>, <b>Third Wave of democratisation</b>, <b>national conference</b>, <b>ECOMOG</b>, <b>Françafrique</b>, <b>unconstitutional change of government</b>, <b>Alliance of Sahel States</b>. Precise, correctly-spelled use of these terms strengthens WAEC answers significantly.</p>'},
{lb:'Using named, dated comparisons',dr:dQ1,ht:'<p>The strongest WAEC essays on this topic use <b>named, dated comparisons</b> across countries &mdash; e.g. contrasting Ghana\'s peaceful transitions since 2000 with Mali\'s repeated coups &mdash; rather than describing any single country in isolation.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on West African political development?","o":["Identify the specific country or period asked about","Immediately give a personal opinion with no facts","List unrelated dates with no explanation","Skip straight to a conclusion"],"a":0,"w":"A strong WAEC essay should begin by identifying the specific country or period being asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Explain the role of ECOWAS in managing political crises in West Africa.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"Explain the role of ECOWAS in managing political crises in West Africa\" is a typical WAEC-style question on this topic."},{"q":"What term describes a sudden, illegal seizure of power, often by the military?","o":["Amendment","Referendum","Coup d'état","Treaty"],"a":2,"w":"\"Coup d'état\" describes a sudden, illegal seizure of power, often by the military."},{"q":"What term describes the global democratisation trend of the 1990s discussed in this topic?","o":["The Colonial Era","The First Republic","The Cold War Peak","The Third Wave of democratisation"],"a":3,"w":"\"The Third Wave of democratisation\" describes the global democratic trend of the 1990s."},{"q":"What is the recently-formed alliance of Sahel coup states called?","o":["The Alliance of Sahel States","The Commonwealth of Nations","The African Union","ECOWAS"],"a":0,"w":"\"The Alliance of Sahel States\" is the recently-formed alliance of Sahel coup states."},{"q":"What kind of comparison makes the strongest WAEC essays on this topic?","o":["A description of only one country with no comparison","Named, dated comparisons across different countries","A comparison with only European countries","No comparison at all, only opinions"],"a":1,"w":"The strongest WAEC essays use named, dated comparisons across different West African countries."},{"q":"Which comparison is given as a strong example in this lesson?","o":["Senegal's history versus Japan's history","Nigeria's history versus ancient Rome's history","Ghana's peaceful transitions since 2000 versus Mali's repeated coups","Ghana's history versus China's history"],"a":2,"w":"Ghana's peaceful transitions since 2000 versus Mali's repeated coups is given as a strong comparative example."},{"q":"Why should WAEC essays reference Nigeria's own experience where possible on this topic?","o":["It replaces the need for any other content","Nigeria is the only country ever studied in WAEC Government","Other countries are irrelevant to the syllabus","It demonstrates the ability to apply regional patterns to a specific, relevant example"],"a":3,"w":"Referencing Nigeria's own experience demonstrates the ability to apply regional patterns to a specific, relevant example."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov • POL',ti:'Mixed Questions — West African Political Development',su:'Integrated revision across the political development of West Africa since independence.',steps:[
{lb:'Summary of key themes',dr:dQ10,ht:'<p>West Africa\'s political development since independence shows shared colonial legacies and challenges, but sharply <b>divergent outcomes</b> &mdash; from Senegal and, more recently, Ghana\'s relative stability, to Sierra Leone and Liberia\'s civil wars, to the Sahel\'s recent coup wave &mdash; managed imperfectly through regional bodies like ECOWAS.</p>'},
{lb:'Key names and dates to remember',dr:dQ10,ht:'<p>Must-know facts: <b>1957</b> (Ghana\'s independence); <b>1975</b> (ECOWAS founded); <b>1990</b> (Benin\'s National Conference); <b>1991-2002</b> (Sierra Leone civil war); <b>1992</b> (Ghana\'s Fourth Republic constitution); <b>1993</b> (Nigeria\'s annulled election); <b>2020-2023</b> (Sahel coup wave in Mali, Guinea, Burkina Faso, Niger).</p>'},
{lb:'Lessons for Nigeria today',dr:dQ10,ht:'<p>Nigeria\'s own history of coups, civil war and eventual democratic consolidation places it within this broader regional story, while its continued leadership role in ECOWAS peacekeeping and diplomacy reflects its stated commitment to regional stability and Pan-African cooperation.</p>'},
{lb:'Final exam tips',dr:dQ10,ht:'<p>Always use <b>named, dated examples</b> from at least two or three different countries, distinguish clearly between <b>Anglophone and Francophone</b> patterns, and conclude by connecting the regional picture back to Nigeria\'s own comparative experience.</p>'},
