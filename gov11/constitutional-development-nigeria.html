<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Constitutional Development of Nigeria',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'Colonial constitutions: Clifford 1922, Richards 1946',DARK,10,'middle',false));o.push(T(240,74,'Macpherson 1951, Lyttleton 1954','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,CRM,ACC,1.5));o.push(T(240,110,'Independence 1960; Republic 1963',DARK,10,'middle',false));o.push(T(240,128,'Parliamentary system throughout','#555',9,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,CRM,ACC,1.5));o.push(T(240,164,'Military rule 1966-79; presidential system from 1979',DARK,10,'middle',false));o.push(T(240,182,'12/19/21/30/36 states over time','#555',9,'middle',false));}
if(p>=4){o.push(R(10,200,460,60,CRM,ACC,1));o.push(T(240,218,'Annulled 1993 election; 1999 Constitution',DARK,10,'middle',false));o.push(T(240,236,'Fourth Republic since 29 May 1999','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Key Constitutions',ACC,12,'middle',true));
[['1922 Clifford','First elective principle, Lagos/Calabar only'],['1946 Richards','First formal 3-region structure'],['1954 Lyttleton','Genuine federalism, self-governing regions'],['1979','Presidential system replaces parliamentary system'],['1999','Current constitution, Fourth Republic']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}

function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Constitutional Development — Summary',ACC,13,'middle',true));
[['Clifford (1922)','First elective principle'],['Richards (1946)','First 3-region structure'],['Macpherson (1951)','First real Nigerian consultation'],['Lyttleton (1954)','Genuine federalism — path to independence'],['1960/1963','Independence, then Republic'],['1979','Presidential system, Second Republic'],['1999','Current constitution, Fourth Republic']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov \u2022 POL',ti:'The Colonial Constitutions (1922-1951)',su:'Trace Nigeria\'s earliest constitutions under British colonial rule.',steps:[
{lb:'The Clifford Constitution (1922)',dr:dQ1,ht:'<p>The <b>Clifford Constitution (1922)</b>, introduced by Governor Sir Hugh Clifford, was Nigeria\'s first constitution to include an <b>elective principle</b> &mdash; allowing a small number of wealthy, property-owning Nigerians in Lagos and Calabar to elect a few members of the Legislative Council. It was a modest first step, but excluded the vast majority of Nigerians and did not touch the North.</p>'},
{lb:'The Richards Constitution (1946)',dr:dQ1,ht:'<p>The <b>Richards Constitution (1946)</b>, named after Governor Sir Arthur Richards, formally divided Nigeria into <b>three regions</b> &mdash; North, West and East &mdash; each with its own House of Assembly, for the first time. Nationalists strongly criticised it for being drafted with almost no Nigerian consultation, and for entrenching regional divisions that would shape Nigerian politics for decades.</p>'},
{lb:'The Macpherson Constitution (1951)',dr:dQ1,ht:'<p>The <b>Macpherson Constitution (1951)</b>, following genuine consultation with Nigerians across all regions (a first), created regional legislatures with real Nigerian participation and a central Council of Ministers including Nigerian members. However, its regional structure quickly proved unstable, contributing to the 1953 constitutional crisis over self-government timing.</p>'},
{lb:'Lessons from the colonial constitutions',dr:dQ1,ht:'<p>Each constitution built incrementally on the last: Clifford introduced elections; Richards introduced formal regionalism; Macpherson introduced real Nigerian participation and exposed regional tensions. WAEC essays should trace this clear line of gradual, negotiated constitutional advancement rather than treating each constitution in isolation.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which constitution first introduced the elective principle to Nigeria in 1922?',o:['The Clifford Constitution','The Richards Constitution','The Macpherson Constitution','The Lyttleton Constitution'],a:1,w:'The Clifford Constitution (1922) first introduced the elective principle to Nigeria.'},{q:'Which governor introduced the 1922 constitution bearing his name?',o:['Sir Hugh Clifford','Sir Arthur Richards','Sir John Macpherson','Sir Oliver Lyttleton'],a:1,w:'Sir Hugh Clifford introduced the Clifford Constitution of 1922.'},{q:'Which constitution first formally divided Nigeria into three regions (North, West, East)?',o:['The Richards Constitution (1946)','The Clifford Constitution (1922)','The Macpherson Constitution (1951)','The 1999 Constitution'],a:1,w:'The Richards Constitution (1946) first formally divided Nigeria into three regions.'},{q:'What was a major nationalist criticism of the Richards Constitution?',o:['It was drafted with almost no Nigerian consultation','It gave Nigerians too much power too quickly','It abolished all regional government','It introduced universal adult suffrage'],a:1,w:'Nationalists criticised the Richards Constitution for being drafted with almost no Nigerian consultation.'},{q:'Which constitution was the first to follow genuine consultation with Nigerians across all regions?',o:['The Macpherson Constitution (1951)','The Clifford Constitution (1922)','The Richards Constitution (1946)','The 1999 Constitution'],a:1,w:'The Macpherson Constitution (1951) was the first to follow genuine consultation with Nigerians across all regions.'},{q:'What crisis in 1953 exposed instability in the Macpherson Constitution\'s regional structure?',o:['A crisis over the timing of self-government','A civil war','A military coup','A currency collapse'],a:1,w:'The 1953 constitutional crisis over self-government timing exposed instability in the Macpherson Constitution\'s structure.'},{q:'Who were the only Nigerians permitted to vote under the Clifford Constitution\'s elective principle?',o:['A small number of wealthy, property-owning Nigerians in Lagos and Calabar','All adult Nigerians nationwide','Only traditional rulers','Only military officers'],a:1,w:'Only a small number of wealthy, property-owning Nigerians in Lagos and Calabar could vote under the Clifford Constitution.'},{q:'What overall pattern should a WAEC essay trace across the Clifford, Richards and Macpherson constitutions?',o:['A clear line of gradual, negotiated constitutional advancement','A sudden jump straight to full independence','No connection between the three constitutions','A reversal back to direct colonial rule each time'],a:1,w:'A strong WAEC essay should trace the gradual, negotiated constitutional advancement across these three constitutions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 POL',ti:'The Lyttleton Constitution and the Path to Independence',su:'Explain the Lyttleton Constitution (1954) and the final steps to independence.',steps:[
{lb:'The Lyttleton Constitution (1954)',dr:dQ2,ht:'<p>The <b>Lyttleton Constitution (1954)</b>, negotiated at a constitutional conference in London, established a genuine <b>federal system</b> with self-governing regions, each with its own premier, alongside a federal government in Lagos. This is widely regarded as the actual constitutional framework that made independence possible six years later.</p>'},
{lb:'Regional self-government',dr:dQ2,ht:'<p>Under the Lyttleton framework, the <b>Western and Eastern Regions achieved self-government in 1957</b>, followed by the <b>Northern Region in 1959</b> &mdash; the North\'s slower pace reflecting its leaders\' caution about southern political and educational dominance at independence.</p>'},
{lb:'The 1959 federal elections',dr:dQ2,ht:'<p>The <b>1959 federal elections</b> produced no outright majority for any single party: the <b>NPC</b> won 134 seats, the <b>NCNC</b> 89, and the <b>AG</b> 73. This led to a coalition government between the NPC and NCNC, with <b>Tafawa Balewa</b> (NPC) becoming Prime Minister and Nnamdi Azikiwe (NCNC) becoming Governor-General.</p>'},
{lb:'Independence, 1960',dr:dQ2,ht:'<p>Nigeria achieved <b>independence on 1 October 1960</b>, under a Westminster-style constitution retaining the British monarch as ceremonial head of state, with the Union Jack formally lowered for the last time &mdash; the culmination of the negotiated constitutional path traced from Clifford (1922) through Lyttleton (1954).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Which constitution is widely regarded as the actual framework that made Nigerian independence possible?',o:['The Lyttleton Constitution (1954)','The Clifford Constitution (1922)','The Richards Constitution (1946)','The 1999 Constitution'],a:1,w:'The Lyttleton Constitution (1954) established the genuine federal system that led directly to independence.'},{q:'In which year did the Western and Eastern Regions achieve self-government under the Lyttleton framework?',o:['1957','1954','1959','1960'],a:1,w:'The Western and Eastern Regions achieved self-government in 1957.'},{q:'In which year did the Northern Region achieve self-government, later than the South?',o:['1959','1957','1954','1960'],a:1,w:'The Northern Region achieved self-government in 1959, later than the Western and Eastern Regions.'},{q:'Why did the Northern Region delay self-government compared to the South?',o:['Its leaders were cautious about southern political and educational dominance at independence','It refused to ever accept self-government','It had no political leaders at the time','It had already gained full independence earlier'],a:1,w:'The North\'s leaders were cautious about southern political and educational dominance, delaying its self-government.'},{q:'How many seats did the NPC win in the 1959 federal elections?',o:['134','89','73','193'],a:1,w:'The NPC won 134 seats in the 1959 federal elections.'},{q:'Who became Nigeria\'s first Prime Minister following the 1959 coalition government?',o:['Tafawa Balewa','Nnamdi Azikiwe','Obafemi Awolowo','Ahmadu Bello'],a:1,w:'Tafawa Balewa, leader of the NPC, became Nigeria\'s first Prime Minister.'},{q:'Who became Nigeria\'s first Governor-General at independence, from the NCNC?',o:['Nnamdi Azikiwe','Tafawa Balewa','Obafemi Awolowo','Ahmadu Bello'],a:1,w:'Nnamdi Azikiwe of the NCNC became Nigeria\'s first Governor-General at independence.'},{q:'On what date did Nigeria achieve independence, marking the culmination of this constitutional path?',o:['1 October 1960','1 October 1963','29 May 1999','24 October 1945'],a:1,w:'Nigeria achieved independence on 1 October 1960.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 POL',ti:'The Republican Constitution of 1963',su:'Explain the significance of Nigeria becoming a republic in 1963.',steps:[
{lb:'From dominion to republic',dr:dQ1,ht:'<p>Between 1960 and 1963, Nigeria was an independent <b>dominion</b> within the Commonwealth, still formally recognising the <b>British monarch</b> as head of state, represented locally by a Governor-General. On <b>1 October 1963</b>, Nigeria adopted a new Republican Constitution, becoming a <b>republic</b> and replacing the Queen with a Nigerian <b>President</b> as head of state.</p>'},
{lb:'Nigeria\'s first President',dr:dQ1,ht:'<p><b>Nnamdi Azikiwe</b>, who had served as Governor-General since 1960, became Nigeria\'s first President in 1963. However, the President\'s role remained largely <b>ceremonial</b>, since Nigeria retained its Westminster-style parliamentary system, with real executive power held by the Prime Minister, Tafawa Balewa.</p>'},
{lb:'Continuity alongside change',dr:dQ1,ht:'<p>While becoming a republic was symbolically significant &mdash; completing the removal of the British monarch from Nigeria\'s constitutional structure &mdash; the underlying <b>parliamentary system</b>, regional structure and party arrangements established under Lyttleton (1954) remained largely unchanged, showing that 1963 was more a symbolic completion of independence than a fresh constitutional beginning.</p>'},
{lb:'Significance for later history',dr:dQ1,ht:'<p>The 1963 Republican Constitution retained the tensions of the regional system it inherited &mdash; ethnically-based parties, an unresolved balance of power between regions, and a ceremonial presidency alongside a powerful Prime Minister &mdash; tensions that would contribute directly to the political crises leading to the <b>January 1966 military coup</b>.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What was Nigeria\'s constitutional status between 1960 and 1963, before becoming a republic?',o:['An independent dominion still recognising the British monarch as head of state','A fully independent republic','A British colony','A military dictatorship'],a:1,w:'Between 1960 and 1963, Nigeria was an independent dominion still recognising the British monarch as head of state.'},{q:'On what date did Nigeria become a republic, adopting a new Republican Constitution?',o:['1 October 1963','1 October 1960','29 May 1999','24 October 1945'],a:1,w:'Nigeria became a republic on 1 October 1963.'},{q:'Who became Nigeria\'s first President in 1963?',o:['Nnamdi Azikiwe','Tafawa Balewa','Obafemi Awolowo','Ahmadu Bello'],a:1,w:'Nnamdi Azikiwe, previously Governor-General, became Nigeria\'s first President in 1963.'},{q:'What role did the President hold under the 1963 Republican Constitution?',o:['Largely ceremonial, with real executive power held by the Prime Minister','Full executive power, replacing the Prime Minister entirely','No role at all, as the office was purely symbolic and empty','Sole military commander with dictatorial powers'],a:1,w:'The President\'s role remained largely ceremonial, with real executive power held by the Prime Minister.'},{q:'Who remained Nigeria\'s Prime Minister, holding real executive power, after 1963?',o:['Tafawa Balewa','Nnamdi Azikiwe','Obafemi Awolowo','Yakubu Gowon'],a:1,w:'Tafawa Balewa remained Prime Minister, holding real executive power, after Nigeria became a republic.'},{q:'What best describes the overall significance of the 1963 constitutional change?',o:['A symbolic completion of independence rather than a fresh constitutional beginning','A complete rewriting of Nigeria\'s entire political system','The introduction of military rule','The abolition of all regional government'],a:1,w:'1963 is best understood as a symbolic completion of independence, since the underlying system remained largely unchanged.'},{q:'Which underlying system, established under the 1954 Lyttleton Constitution, remained largely unchanged in 1963?',o:['The Westminster-style parliamentary system and regional structure','A presidential system with no parliament','A one-party state','Direct colonial administration'],a:1,w:'The Westminster-style parliamentary system and regional structure from 1954 remained largely unchanged in 1963.'},{q:'What later crisis did the tensions retained by the 1963 Constitution directly contribute to?',o:['The January 1966 military coup','Nigeria\'s independence in 1960','The founding of ECOWAS','The adoption of the 1999 Constitution'],a:1,w:'The tensions retained by the 1963 Constitution contributed directly to the political crises leading to the January 1966 coup.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 POL',ti:'Constitutional Change under Military Rule (1966-1979)',su:'Explain how constitutional government was suspended and later restored between 1966 and 1979.',steps:[
{lb:'Suspension of the 1963 Constitution',dr:dQ2,ht:'<p>Following the <b>January 1966 military coup</b>, Nigeria\'s civilian constitution was suspended, replaced by military decrees. General <b>Yakubu Gowon</b>, who took power after a countercoup in July 1966, later restructured Nigeria\'s federal system, replacing the four regions with <b>12 states in 1967</b> partly to weaken the power of the old regional blocs and address minority grievances.</p>'},
{lb:'The Civil War and constitutional consequences',dr:dQ2,ht:'<p>The <b>Nigerian Civil War (1967-1970)</b>, triggered by the Eastern Region\'s secession as the Republic of Biafra, was fought partly over these very constitutional and regional questions. Its outcome preserved a united Nigeria but reinforced the case for a stronger central government and more, smaller states, a pattern that continued after the war (19 states by 1976).</p>'},
{lb:'Preparing for civilian rule',dr:dQ2,ht:'<p>General <b>Murtala Mohammed</b>, who took power in 1975, announced a firm timetable to return Nigeria to civilian rule by <b>1979</b>, and established a <b>Constitution Drafting Committee (CDC)</b> in 1975 to prepare a new constitution, deliberately choosing the <b>American presidential model</b> over the earlier Westminster parliamentary system.</p>'},
{lb:'The 1979 Constitution',dr:dQ2,ht:'<p>The <b>1979 Constitution</b>, Nigeria\'s first to establish a <b>presidential system</b>, created a directly-elected executive President separate from the legislature, aiming to avoid the earlier weaknesses of a divided Prime Minister/ceremonial-President arrangement. It restored civilian rule under President <b>Shehu Shagari</b>, elected in 1979.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What happened to Nigeria\'s 1963 Constitution immediately after the January 1966 coup?',o:['It was suspended and replaced by military decrees','It remained fully in force with no changes','It was formally repealed by the Supreme Court','It was replaced immediately by the 1999 Constitution'],a:1,w:'The 1963 Constitution was suspended and replaced by military decrees after the January 1966 coup.'},{q:'Which military leader restructured Nigeria\'s four regions into 12 states in 1967?',o:['General Yakubu Gowon','General Murtala Mohammed','General Sani Abacha','General Ibrahim Babangida'],a:1,w:'General Yakubu Gowon restructured Nigeria\'s four regions into 12 states in 1967.'},{q:'What secessionist declaration triggered the Nigerian Civil War (1967-1970)?',o:['The Eastern Region\'s declaration of the Republic of Biafra','The Western Region\'s declaration of independence','The Northern Region\'s declaration of independence','A declaration by the whole of Nigeria to leave the Commonwealth'],a:1,w:'The Eastern Region\'s declaration of the Republic of Biafra triggered the Nigerian Civil War.'},{q:'Approximately how many states did Nigeria have by 1976, reflecting continued state creation after the war?',o:['19','12','4','36'],a:1,w:'Nigeria had 19 states by 1976, following continued state creation after the civil war.'},{q:'Which military leader announced a firm timetable to return Nigeria to civilian rule by 1979?',o:['General Murtala Mohammed','General Yakubu Gowon','General Sani Abacha','General Ibrahim Babangida'],a:1,w:'General Murtala Mohammed, who took power in 1975, announced the timetable for a return to civilian rule by 1979.'},{q:'What was the committee established in 1975 to draft Nigeria\'s new constitution called?',o:['The Constitution Drafting Committee (CDC)','The National Assembly','The Federal Executive Council','The Council of State'],a:1,w:'The Constitution Drafting Committee (CDC) was established in 1975 to draft Nigeria\'s new constitution.'},{q:'Which foreign constitutional model did the Constitution Drafting Committee deliberately choose over the earlier Westminster system?',o:['The American presidential model','The French model','The Soviet model','The Chinese model'],a:1,w:'The CDC deliberately chose the American presidential model over the earlier Westminster parliamentary system.'},{q:'Who became President under the new 1979 Constitution, restoring civilian rule?',o:['Shehu Shagari','Yakubu Gowon','Murtala Mohammed','Tafawa Balewa'],a:1,w:'Shehu Shagari was elected President in 1979, restoring civilian rule under the new presidential constitution.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 POL',ti:'The Presidential System under the 1979 Constitution',su:'Explain the key features of Nigeria\'s 1979 presidential constitution.',steps:[
{lb:'Why a presidential system?',dr:dQ1,ht:'<p>The 1979 Constitution\'s drafters chose a <b>presidential system</b>, modelled on the United States, partly because they believed the earlier <b>Westminster parliamentary system</b> had contributed to the First Republic\'s instability by fusing legislative and executive power in ways that deepened ethnic and regional rivalries for control of a single powerful Prime Ministerial office.</p>'},
{lb:'Separation of powers',dr:dQ1,ht:'<p>The 1979 Constitution introduced a clear <b>separation of powers</b>: a directly-elected <b>President</b> as both head of state and head of government, a <b>bicameral National Assembly</b> (Senate and House of Representatives) as the legislature, and an independent <b>judiciary</b> &mdash; each intended to check the others, unlike the fused executive-legislature of the parliamentary era.</p>'},
{lb:'Federal character and the \'Federal Character Principle\'',dr:dQ1,ht:'<p>The 1979 Constitution introduced the <b>Federal Character Principle</b> (later reinforced in the 1999 Constitution\'s s.14(3)), requiring appointments and resource distribution to reflect Nigeria\'s diverse states and ethnic groups, directly responding to the regional imbalance blamed for the First Republic\'s collapse.</p>'},
{lb:'The Second Republic (1979-1983)',dr:dQ1,ht:'<p>The 1979 Constitution governed Nigeria\'s <b>Second Republic</b>, with President <b>Shehu Shagari</b> re-elected in 1983 amid widely disputed results. The Second Republic ended abruptly with a military coup on <b>31 December 1983</b>, showing that a new constitutional design alone could not resolve Nigeria\'s deeper political and economic tensions.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which country\'s constitutional system was the model for Nigeria\'s 1979 presidential constitution?',o:['The United States','The United Kingdom','France','Ghana'],a:1,w:'Nigeria\'s 1979 presidential constitution was modelled on the United States\' system.'},{q:'Why did the 1979 Constitution\'s drafters move away from the Westminster parliamentary system?',o:['They believed it had contributed to the First Republic\'s instability by fusing legislative and executive power','They believed parliamentary systems were illegal under international law','They wanted to abolish elections entirely','They wanted to restore direct colonial rule'],a:1,w:'The drafters believed the fused legislative/executive power of the parliamentary system had contributed to First Republic instability.'},{q:'What are the three separate branches of government established under the 1979 Constitution\'s separation of powers?',o:['The President, the National Assembly, and the judiciary','Only the President and the military','Only the National Assembly and traditional rulers','Only the judiciary and the civil service'],a:1,w:'The 1979 Constitution established separation of powers among the President, National Assembly and judiciary.'},{q:'What structure describes Nigeria\'s National Assembly under the 1979 Constitution?',o:['Bicameral, with a Senate and House of Representatives','Unicameral, with only a Senate','Unicameral, with only a House of Representatives','There was no National Assembly at all'],a:1,w:'The National Assembly is bicameral, comprising a Senate and House of Representatives.'},{q:'Which principle, introduced in 1979 and reinforced later, requires appointments to reflect Nigeria\'s diverse states and ethnic groups?',o:['The Federal Character Principle','The Doctrine of Necessity','The Rule of Law','Judicial Review'],a:1,w:'The Federal Character Principle requires government appointments to reflect Nigeria\'s diverse states and ethnic groups.'},{q:'Which period of Nigerian history was governed by the 1979 Constitution?',o:['The Second Republic (1979-1983)','The First Republic (1960-1966)','The Third Republic','The current Fourth Republic'],a:1,w:'The 1979 Constitution governed Nigeria\'s Second Republic, from 1979 to 1983.'},{q:'Who was re-elected President in the disputed 1983 elections under the 1979 Constitution?',o:['Shehu Shagari','Yakubu Gowon','Muhammadu Buhari','Ibrahim Babangida'],a:1,w:'Shehu Shagari was re-elected President in the widely disputed 1983 elections.'},{q:'On what date did a military coup abruptly end the Second Republic?',o:['31 December 1983','1 October 1979','1 October 1960','29 May 1999'],a:1,w:'A military coup on 31 December 1983 abruptly ended the Second Republic.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 POL',ti:'Failed and Aborted Constitutions (1989-1998)',su:'Explain the attempted transitions to civilian rule between 1989 and 1998.',steps:[
{lb:'The 1989 Constitution and Babangida\'s transition',dr:dQ2,ht:'<p>General <b>Ibrahim Babangida</b> (in power 1985-1993) announced a <b>1989 Constitution</b> intended to underpin a planned Third Republic, alongside a deliberately created <b>two-party system</b> (the SDP and NRC), an unusual, government-designed arrangement meant to avoid the ethnic party fragmentation of earlier republics.</p>'},
{lb:'The annulled 1993 election',dr:dQ2,ht:'<p>Nigeria held presidential elections on <b>12 June 1993</b>, widely regarded as the country\'s freest and fairest to date, in which businessman <b>Moshood Abiola (SDP)</b> appeared to have won decisively. However, Babangida\'s government <b>annulled the election</b>, plunging Nigeria into a severe political crisis and effectively aborting the planned Third Republic constitution before it ever took effect.</p>'},
{lb:'Abacha\'s constitutional conference',dr:dQ2,ht:'<p>General <b>Sani Abacha</b>, who seized power later in 1993, convened a <b>Constitutional Conference (1994-95)</b> that drafted a new constitution, but Abacha\'s own increasingly authoritarian rule (1993-1998) meant this constitution was never actually implemented, and Abiola, who had declared himself president, died in detention in 1998 without ever taking office.</p>'},
{lb:'Lessons from the failed transitions',dr:dQ2,ht:'<p>The events of 1989-1998 show that a well-designed constitution on paper cannot guarantee genuine democratic transition without <b>political will</b> from those holding power &mdash; a crucial WAEC lesson distinguishing formally having a constitution from the practice of true <b>constitutionalism</b>.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Which military leader announced the 1989 Constitution intended for a planned Third Republic?',o:['Ibrahim Babangida','Sani Abacha','Yakubu Gowon','Muhammadu Buhari'],a:1,w:'General Ibrahim Babangida announced the 1989 Constitution intended for a planned Third Republic.'},{q:'What unusual party system did Babangida\'s government deliberately create for the planned Third Republic?',o:['A government-designed two-party system (SDP and NRC)','A one-party state','An unlimited multi-party system','No political parties at all'],a:1,w:'Babangida\'s government deliberately created a two-party system, the SDP and NRC, for the planned Third Republic.'},{q:'On what date was the presidential election widely regarded as Nigeria\'s freest and fairest to date held?',o:['12 June 1993','1 October 1979','29 May 1999','31 December 1983'],a:1,w:'The 12 June 1993 presidential election is widely regarded as Nigeria\'s freest and fairest to date.'},{q:'Who appeared to have won the 12 June 1993 election before it was annulled?',o:['Moshood Abiola','Ibrahim Babangida','Sani Abacha','Shehu Shagari'],a:1,w:'Moshood Abiola of the SDP appeared to have won the 12 June 1993 election decisively.'},{q:'What action by Babangida\'s government plunged Nigeria into severe political crisis in 1993?',o:['The annulment of the 12 June election','The immediate handover of power to Abiola','The abolition of the military entirely','The peaceful implementation of the new constitution'],a:1,w:'Babangida\'s government\'s annulment of the 12 June election plunged Nigeria into severe political crisis.'},{q:'Which military leader convened a Constitutional Conference in 1994-95 that was never actually implemented?',o:['Sani Abacha','Ibrahim Babangida','Yakubu Gowon','Olusegun Obasanjo'],a:1,w:'General Sani Abacha convened the 1994-95 Constitutional Conference, but its constitution was never implemented.'},{q:'What happened to Moshood Abiola after declaring himself president?',o:['He died in detention in 1998 without ever taking office','He successfully took office as President','He fled Nigeria and lived abroad','He became Chief Justice of Nigeria'],a:1,w:'Moshood Abiola died in detention in 1998 without ever taking office as president.'},{q:'What key WAEC lesson do the failed transitions of 1989-1998 illustrate?',o:['A well-designed constitution cannot guarantee democracy without political will from those in power','Constitutions always guarantee smooth democratic transitions','Military rule always respects constitutional processes','Nigeria never attempted any democratic transitions before 1999'],a:1,w:'These failed transitions show that a constitution alone cannot guarantee democracy without genuine political will.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 POL',ti:'The 1999 Constitution and the Fourth Republic',su:'Explain the drafting, key features, and significance of Nigeria\'s 1999 Constitution.',steps:[
{lb:'Drafting the 1999 Constitution',dr:dQ1,ht:'<p>Following <b>Sani Abacha\'s death in June 1998</b>, General <b>Abdulsalami Abubakar</b> oversaw a rapid transition to civilian rule, adapting the largely unused 1995 draft constitution into the <b>1999 Constitution</b>, promulgated on <b>29 May 1999</b> &mdash; the date now celebrated annually as Democracy Day.</p>'},
{lb:'Key features',dr:dQ1,ht:'<p>The 1999 Constitution retains the <b>presidential system</b> established in 1979, with a directly-elected President limited to <b>two four-year terms</b> (s.137), a bicameral National Assembly, an independent judiciary, and Chapter II\'s non-enforceable <b>Fundamental Objectives</b> alongside Chapter IV\'s enforceable <b>Fundamental Rights</b>.</p>'},
{lb:'The Fourth Republic',dr:dQ1,ht:'<p>The 1999 Constitution ushered in Nigeria\'s <b>Fourth Republic</b>, with <b>Olusegun Obasanjo</b> elected President in 1999 &mdash; Nigeria\'s longest continuous period of civilian, constitutional government to date, now spanning over two decades and multiple peaceful transfers of power between different presidents and parties.</p>'},
{lb:'Ongoing amendment and debate',dr:dQ1,ht:'<p>The 1999 Constitution has been amended multiple times through the National Assembly\'s constitutional amendment procedure (requiring two-thirds majorities in the National Assembly and most State Houses of Assembly), and remains the subject of continuing debate over issues such as <b>restructuring</b>, state creation, and the balance of power between federal and state government.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which military leader oversaw the rapid transition to civilian rule after Sani Abacha\'s death in 1998?',o:['Abdulsalami Abubakar','Ibrahim Babangida','Yakubu Gowon','Murtala Mohammed'],a:1,w:'General Abdulsalami Abubakar oversaw the transition to civilian rule following Abacha\'s death in 1998.'},{q:'On what date was the 1999 Constitution promulgated, now celebrated as Democracy Day?',o:['29 May 1999','1 October 1999','1 October 1960','24 October 1945'],a:1,w:'The 1999 Constitution was promulgated on 29 May 1999, now celebrated as Democracy Day.'},{q:'What system of government does the 1999 Constitution retain from the 1979 Constitution?',o:['The presidential system','The parliamentary system','A one-party system','Direct military rule'],a:1,w:'The 1999 Constitution retains the presidential system first established in the 1979 Constitution.'},{q:'What is the maximum period a President may serve under the 1999 Constitution?',o:['Two four-year terms (8 years)','One four-year term only','Unlimited terms','Ten years in a single term'],a:1,w:'The President is limited to two four-year terms (8 years) under the 1999 Constitution.'},{q:'Who became Nigeria\'s President in 1999, ushering in the Fourth Republic?',o:['Olusegun Obasanjo','Muhammadu Buhari','Goodluck Jonathan','Umaru Yar\'Adua'],a:1,w:'Olusegun Obasanjo was elected President in 1999, ushering in the Fourth Republic.'},{q:'What distinguishes the Fourth Republic from all of Nigeria\'s earlier republics?',o:['It is Nigeria\'s longest continuous period of civilian, constitutional government to date','It lasted less than one year','It has never had any elections','It was governed entirely by the military'],a:1,w:'The Fourth Republic is Nigeria\'s longest continuous period of civilian, constitutional government to date.'},{q:'What majority is required in the National Assembly to amend fundamental provisions of the 1999 Constitution?',o:['Two-thirds','A simple majority','Unanimous agreement','No majority is required'],a:1,w:'Amending fundamental provisions requires a two-thirds majority in the National Assembly and most State Houses of Assembly.'},{q:'Which ongoing debate continues to surround the 1999 Constitution today?',o:['Restructuring and the balance of power between federal and state government','Whether Nigeria should return to colonial rule','Whether Nigeria should abolish elections','Whether Nigeria should rejoin the League of Nations'],a:1,w:'Ongoing debate continues over restructuring and the balance of power between federal and state government.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 POL',ti:'Comparing Nigeria\'s Constitutions',su:'Compare the key features across Nigeria\'s constitutional history.',steps:[
{lb:'Parliamentary vs. presidential systems',dr:dQ2,ht:'<p>Nigeria\'s constitutions fall into two broad types: <b>parliamentary</b> (Clifford 1922 through the 1963 Republican Constitution, with a Prime Minister and fused executive/legislature) and <b>presidential</b> (from 1979 onward, with a directly-elected President separate from the legislature) &mdash; a fundamental shift in constitutional design following the First Republic\'s collapse.</p>'},
{lb:'Regional/state structure over time',dr:dQ2,ht:'<p>Nigeria\'s internal structure has expanded dramatically: <b>3 regions</b> (Richards, 1946) &rarr; <b>4 regions</b> (after the Mid-West was created in 1963) &rarr; <b>12 states</b> (Gowon, 1967) &rarr; <b>19 states</b> (1976) &rarr; <b>21 states</b> (1987) &rarr; <b>30 states</b> (1991) &rarr; <b>36 states</b> (1996, the current number).</p>'},
{lb:'Civilian vs. military constitutions',dr:dQ2,ht:'<p>Nigeria\'s constitutional history alternates between <b>civilian, negotiated constitutions</b> (1960, 1963, 1979, 1999) and periods where constitutions were <b>suspended or imposed by military decree</b> (1966-79, 1983-99), a pattern WAEC essays should be able to place on a clear timeline with dates.</p>'},
{lb:'What has remained constant',dr:dQ2,ht:'<p>Despite these changes, certain features persist across almost every constitution: a <b>federal structure</b> (except during periods of military centralisation), recognition of <b>Nigeria\'s ethnic and regional diversity</b> as a central constitutional challenge, and an underlying commitment, however imperfectly realised, to an eventual return to civilian, elected government.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Which type of system characterised Nigeria\'s constitutions from Clifford (1922) through the 1963 Republican Constitution?',o:['Parliamentary','Presidential','Military dictatorship only','Absolute monarchy'],a:1,w:'Nigeria\'s constitutions from Clifford through 1963 were parliamentary in structure.'},{q:'From which constitution onward did Nigeria adopt a presidential system?',o:['The 1979 Constitution','The 1963 Constitution','The Richards Constitution (1946)','The Clifford Constitution (1922)'],a:1,w:'Nigeria adopted a presidential system from the 1979 Constitution onward.'},{q:'How many regions did Nigeria have under the Richards Constitution (1946)?',o:['Three','Four','Twelve','Thirty-six'],a:1,w:'Nigeria had three regions (North, West, East) under the Richards Constitution (1946).'},{q:'How many states did General Gowon\'s 1967 restructuring create?',o:['12','3','19','36'],a:1,w:'General Gowon\'s 1967 restructuring created 12 states, replacing the four regions.'},{q:'How many states does Nigeria currently have, following the 1996 state creation exercise?',o:['36','12','19','30'],a:1,w:'Nigeria currently has 36 states, following the 1996 state creation exercise.'},{q:'Which years mark periods when Nigeria\'s constitution was suspended or imposed by military decree?',o:['1966-79 and 1983-99','1960-66 only','1999-present','There were no such periods'],a:1,w:'1966-79 and 1983-99 were periods when Nigeria\'s constitution was suspended or imposed by military decree.'},{q:'Which constitutional feature has persisted across almost every Nigerian constitution, except during military centralisation?',o:['A federal structure','A one-party state','An absolute monarchy','Direct colonial administration'],a:1,w:'A federal structure has persisted across almost every Nigerian constitution, except during periods of military centralisation.'},{q:'What central constitutional challenge has every Nigerian constitution had to address?',o:['Nigeria\'s ethnic and regional diversity','The absence of any population','The complete lack of natural resources','The total absence of any political parties'],a:1,w:'Nigeria\'s ethnic and regional diversity has been a central constitutional challenge across every constitution.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 POL',ti:'WAEC Exam Preparation — Constitutional Development of Nigeria',su:'Practise WAEC-style questions on Nigeria\'s constitutional development.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on constitutional development: (1) Identify the <b>specific constitution(s)</b> the question asks about. (2) Give the <b>date and key architect</b> (e.g. Governor or military head of state). (3) Describe its <b>main features</b> precisely. (4) Evaluate its <b>significance</b> for Nigeria\'s constitutional and political development.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "Trace the development of Nigeria\'s constitution from 1922 to 1999." / "Compare the parliamentary and presidential systems of government in Nigeria." / "Discuss the significance of the 1954 Lyttleton Constitution." / "Account for the failure of the Second Republic."</p>'},
{lb:'Key vocabulary for essays',dr:dQ1,ht:'<p>Key vocabulary: <b>elective principle</b>, <b>regionalism</b>, <b>federalism</b>, <b>parliamentary system</b>, <b>presidential system</b>, <b>separation of powers</b>, <b>Federal Character Principle</b>, <b>amendment procedure</b>, <b>constitutionalism</b>. Correct, precise use of these terms distinguishes strong from weak answers.</p>'},
{lb:'A timeline approach',dr:dQ1,ht:'<p>Building a clear mental <b>timeline</b> &mdash; 1922 (Clifford) &rarr; 1946 (Richards) &rarr; 1951 (Macpherson) &rarr; 1954 (Lyttleton) &rarr; 1960 (Independence) &rarr; 1963 (Republic) &rarr; 1979 (presidential system, Second Republic) &rarr; 1999 (Fourth Republic) &mdash; is one of the most effective ways to prepare confidently for this WAEC topic.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is the recommended first step for a WAEC essay on constitutional development?',o:['Identify the specific constitution(s) the question asks about','Immediately give a personal opinion with no facts','List unrelated dates with no explanation','Skip straight to a conclusion'],a:1,w:'A WAEC essay should begin by identifying the specific constitution(s) the question is asking about.'},{q:'Which of these is a typical WAEC-style question on this topic?',o:['"Discuss the significance of the 1954 Lyttleton Constitution."','"Describe the layout of Lagos."','"Define photosynthesis."','"List the rivers of Nigeria."'],a:1,w:'"Discuss the significance of the 1954 Lyttleton Constitution" is a typical WAEC-style question on this topic.'},{q:'Which term describes Nigeria\'s shift to a directly-elected President separate from the legislature in 1979?',o:['The presidential system','The parliamentary system','Absolute monarchy','Military decree'],a:1,w:'The presidential system describes Nigeria\'s 1979 shift to a directly-elected President separate from the legislature.'},{q:'What should follow after identifying the specific constitution asked about in a WAEC essay?',o:['Give the date and key architect (Governor or military head of state)','Skip directly to an unrelated topic','Provide no further factual detail','End the essay immediately'],a:1,w:'After identifying the constitution, a strong essay should give the specific date and key architect involved.'},{q:'Which term describes the WAEC vocabulary item referring to a state\'s supreme, final legal document?',o:['Constitution','Diplomacy','Sanctions','Treaty'],a:1,w:'"Constitution" refers to a state\'s supreme, final legal document, a key term for this WAEC topic.'},{q:'Which timeline order correctly places these Nigerian constitutions in sequence?',o:['Clifford (1922) → Richards (1946) → Macpherson (1951) → Lyttleton (1954)','Lyttleton → Macpherson → Richards → Clifford','Richards → Clifford → Lyttleton → Macpherson','Macpherson → Lyttleton → Clifford → Richards'],a:1,w:'The correct order is Clifford (1922) → Richards (1946) → Macpherson (1951) → Lyttleton (1954).'},{q:'Why is a mental timeline especially useful for WAEC preparation on this topic?',o:['It helps confidently place each constitution\'s date and significance in sequence','It replaces the need to know any dates at all','It is discouraged by WAEC examiners','It only applies to essays about the 1999 Constitution'],a:1,w:'A mental timeline helps students confidently place each constitution\'s date and significance in the correct sequence.'},{q:'Which vocabulary term describes the practice of actually governing according to constitutional principles, not just having a document?',o:['Constitutionalism','Colonialism','Federalism only','Diplomacy'],a:1,w:'"Constitutionalism" describes the practice of actually governing according to constitutional principles, not merely possessing a document.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
