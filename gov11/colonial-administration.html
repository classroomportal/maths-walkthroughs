{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which colonial policy MOST directly created the three-region structure that defined Nigeria\'s First Republic?',o:['The Clifford Constitution (1922), which created electoral constituencies along regional lines','The Richards Constitution (1946), which formalised the North, West and East regions for the first time','Lord Lugard\'s Amalgamation (1914), which divided Nigeria into a northern and southern administrative zone','The Lyttleton Constitution (1954), which made the regions self-governing'],a:2,w:'The Richards Constitution (1946) was the first to formally create three distinct regions (North, West, East) — giving them separate legislative councils (Houses of Assembly and Houses of Chiefs). This three-region structure became the framework for all subsequent constitutional development and was the direct basis for the ethnic-regional parties (NPC/North; AG/West; NCNC/East) that defined First Republic politics.'},{q:'What evidence shows that the Aba Women\'s Riots (1929) were a genuine political uprising rather than a spontaneous riot?',o:['The protests were limited to one town (Aba) and lasted only one day','Women from across southeastern Nigeria (Owerri and Calabar Provinces) coordinated protests using traditional network (anlu/"sitting on a man") — a purposeful, organised, widespread campaign against a specific grievance (Warrant Chiefs and fear of taxation)','The British immediately agreed to all women\'s demands without any violence','European women led the protests with the assistance of the CMS mission in Aba'],a:2,w:'The Women\'s War (Ogu Umunwanyi) was organised and widespread: women communicated across Owerri and Calabar Provinces using pre-existing Igbo women\'s networks; they used the traditional "anlu" protest method purposefully; they targeted specific Warrant Chiefs and European institutions; and they had clear demands (end of Warrant Chief system; abolition of women\'s taxation). This was organised political action, not spontaneous riot.'},{q:'The "father of Nigerian nationalism" is a title given to Herbert Macaulay. What actions BEST justify this title?',o:['He led the armed resistance to British conquest of Lagos in 1861','He founded the NNDP (1923) to contest the first Nigerian elections, published the Lagos Daily News, won legal challenges against colonial policy at the Privy Council, and co-founded the NCNC with Azikiwe in 1944 — spanning the entire history of organised Nigerian political opposition from 1923 to his death in 1946','He was the first Nigerian to be appointed to the Colonial Governor\'s Executive Council','He drafted the Clifford Constitution (1922) that introduced the first elections to Nigeria'],a:2,w:'Macaulay (1864-1946) was the dominant figure of Nigerian political opposition from the 1920s until his death: NNDP 1923 (first Nigerian political party); Lagos Daily News 1925; legal challenges at Privy Council; NCNC co-founded 1944; national tour 1946. He connected 19th-century petition-and-protest politics with 20th-century mass nationalism — bridging the entire arc of the independence movement.'},{q:'Why is 1 October celebrated as Nigeria\'s Independence Day?',o:['It was the day Lugard signed the Amalgamation Proclamation in 1914','It was the day Nigeria became a republic and Azikiwe became President in 1963','It was the day Nigeria formally gained independence from Britain in 1960, with Tafawa Balewa as Prime Minister and the Union Jack lowered for the last time','It was the day the first Nigerian federal elections were held in 1959'],a:3,w:'On 1 October 1960, Nigeria formally gained independence: the Union Jack was lowered; the Nigerian green-white-green flag raised; Tafawa Balewa became PM; Princess Alexandra represented the Crown at the independence ceremony. This ended 99 years of formal British colonial rule (from the 1861 Lagos annexation). In 1963 Nigeria became a republic — a different date; but 1 October 1960 remains Independence Day.'},{q:'Which colonial-era constitution first formally created the North, West and East regional structure?',o:['The Richards Constitution (1946)','The Clifford Constitution (1922)','The Lyttleton Constitution (1954)','The 1999 Constitution'],a:1,w:'The Richards Constitution (1946) first formally created the three-region structure.'},{q:'What traditional method did Igbo women use to coordinate and enforce their protest during the Aba Women\'s Riots?',o:['A traditional practice of publicly shaming and pressuring offending officials','Formal petitions to the British Parliament','Armed rebellion using firearms','A boycott of British-manufactured goods only'],a:1,w:'Women used a traditional practice of publicly shaming and pressuring officials, sometimes called "sitting on a man."'},{q:'Over what span of years is Herbert Macaulay\'s political activity in Nigerian nationalism generally dated?',o:['From 1923 until his death in 1946','From 1960 to 1966','From 1900 to 1914','From 1979 to 1999'],a:1,w:'Macaulay\'s organised political activity spans from founding the NNDP in 1923 until his death in 1946.'},{q:'Whose lowering marked the formal end of British rule in Nigeria on 1 October 1960?',o:['The Union Jack (the British flag)','The flag of the Sokoto Caliphate','The flag of the League of Nations','The flag of the United Nations'],a:1,w:'The lowering of the Union Jack on 1 October 1960 marked the formal end of British rule.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov \u2022 POL',ti:'Mixed Revision — Colonial Administration',su:'Final comprehensive revision across all colonial administration topics.',steps:[
{lb:'Complete summary',dr:dQ10,ht:'<p>Complete colonial administration: Conquest — Lagos 1861; RNC 1886; Protectorates 1900; Amalgamation 1914 (Lugard; financial). Indirect rule — North=success; Igboland=Warrant Chiefs=Aba 1929; criticisms (ethnic divisions; educated elite excluded; froze development). Constitutions — Clifford 1922 (elections/NNDP 1923); Richards 1946 (3 regions; not consulted); Macpherson 1951 (consultations; regional assemblies); Lyttleton 1954 (federation); Independence 1960 (Balewa PM; Azikiwe GG). Republic 1963. First Republic — NPC-NCNC coalition; AG opposition; Western crisis 1962; rigged elections 1964-65; January 1966 coup (Nzeogwu; mainly Igbo; killed Balewa/Bello/Akintola). Counter-coup July 1966 (northern; Ironsi killed; Gowon). Nationalism — Macaulay; Azikiwe (NCNC; West African Pilot); Awolowo (AG; free education); Bello (NPC; Sardauna).</p>'},
{lb:'Key people final review',dr:dQ10,ht:'<p>People to know: Lugard (1858-1945): Amalgamation 1914; indirect rule; Dual Mandate 1922. Macaulay (1864-1946): NNDP 1923; Father of nationalism; NCNC 1944; died 1946. Azikiwe (1904-1996): West African Pilot; NCNC; 1st GG 1960; 1st President 1963. Awolowo (1909-1987): AG; free education 1955; imprisoned 1962-66; presidential candidate 1979/1983. Bello (1909-1966): NPC; Sardauna of Sokoto; Premier North; killed January 1966. Balewa (1912-1966): NPC; 1st PM 1960; killed January 1966. Funmilayo Ransome-Kuti (1900-1978): AWU 1946; Alake forced abdication 1949; Mother of Africa. Nzeogwu (1937-1967): led January 1966 coup; killed in civil war 1967.</p>'},
{lb:'Examination strategies',dr:dQ1,ht:'<p>WAEC examination strategies for colonial administration: (1) Read the question carefully — "describe" ≠ "assess" ≠ "compare." (2) Plan before writing: 2-3 minutes listing your 5 main points with key evidence for each. (3) Introduction: one sentence on context; one on what the question is asking; one on your main argument. (4) Each body paragraph: Point → Evidence (specific date/name/event) → Explanation → Significance. (5) Conclusion: restate main argument; give overall legacy judgment. (6) Time management: 25-mark questions ≈ 25-30 minutes in a 3-hour paper. (7) Technical terms: use them correctly (indirect rule; elective principle; amalgamation; dual mandate; protectorate; federation). (8) Always finish — partial answers can still earn marks.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Absolute must-knows for WAEC colonial administration: Amalgamation date: 1914. Who: Lugard. Why: financial (northern deficit). Constitutional dates: 1922 (Clifford); 1946 (Richards); 1951 (Macpherson); 1954 (Lyttleton); 1960 (independence). Independence date: 1 October 1960. First PM: Balewa (NPC). First GG→President: Azikiwe (NCNC). Republic: 1963. First Republic collapsed: January 1966 coup. Indirect rule success: North. Indirect rule failure: Igboland (Aba 1929 — caused by Warrant Chiefs). Father of nationalism: Macaulay. Free education: Awolowo (West, 1955). These facts appear in WAEC questions year after year — know them cold.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which of the following CORRECTLY pairs a leader with their party?',o:['Azikiwe → NPC; Bello → NCNC; Awolowo → AG','Azikiwe → NCNC; Bello → NPC; Awolowo → AG','Azikiwe → AG; Awolowo → NCNC; Balewa → NPC','Macaulay → NPC; Azikiwe → AG; Bello → NCNC'],a:2,w:'Azikiwe → NCNC (National Council of Nigeria and the Cameroons; Igbo-East base). Bello → NPC (Northern People\'s Congress; Hausa-Fulani/North). Awolowo → AG (Action Group; Yoruba-West base). Balewa → NPC (he was PM representing the NPC coalition). These three parties and their ethnic-regional bases defined First Republic politics.'},{q:'The Dual Mandate theory (Lugard, 1922) claimed colonialism benefited:',o:['Only Britain — Lugard was honest that the purpose was British commercial gain','Only Africa — Lugard argued Africans benefited from "civilisation" while Britain gained nothing','Both Britain (commercial exploitation of resources) and Africa (civilisation/development) — though critics argued British interests consistently won when the two conflicted','The entire world through free trade in African commodities'],a:3,w:'The Dual Mandate argued colonialism served two masters: British commercial interests (extracting and developing Africa\'s resources) AND African interests (bringing "civilisation," order and development). Critics correctly pointed out that the "dual" nature was a myth — British commercial interests consistently took precedence; "civilising" was defined on British terms; and no industrialisation was pursued that would genuinely have developed Africa.'},{q:'The Richards Constitution (1946) was significant because it:',o:['Introduced the first elections and the elective principle in Nigerian history','Was the first constitution drafted after meaningful Nigerian consultations','Formalised the three-region structure (North, West, East) for the first time — the foundation for all subsequent Nigerian constitutional and political development','Created the Council of Ministers with Nigerian members for the first time'],a:3,w:'Richards 1946 was the first to formally create three distinct regions — giving Nigeria the three-region architecture (North, West, East) that shaped all subsequent constitutional development and the ethnic-regional party competition that defined (and ultimately destroyed) the First Republic. Creating the regions was the most consequential act of this constitution.'},{q:'What was the role of the 1959 federal elections in achieving Nigerian independence?',o:['They were unnecessary — independence was agreed before the elections were held','They produced a hung parliament requiring British intervention to appoint a caretaker government','They produced the NPC-NCNC coalition government (NPC 134; NCNC 89; AG 73 seats) that formed Nigeria\'s independence government — proving Nigerian parties could form a government before the British transferred power','They were boycotted by all major parties, so independence was delayed until 1963'],a:3,w:'The December 1959 elections were the decisive test: could Nigeria\'s parties form a government that the British could hand power to? The NPC-NCNC coalition provided that government: Balewa as PM; the coalition commanding a majority in the federal House of Representatives. This gave the British the confidence to complete the transfer of power on 1 October 1960.'},{q:'Which nationalist leader was most closely associated with the Northern People\'s Congress (NPC)?',o:['Ahmadu Bello','Nnamdi Azikiwe','Obafemi Awolowo','Herbert Macaulay'],a:1,w:'Ahmadu Bello led the Northern People\'s Congress (NPC).'},{q:'What criticism did critics make of Lugard\'s Dual Mandate theory in practice?',o:['British commercial interests consistently took priority over African development','African interests always won over British interests','The theory was applied equally and fairly at all times','The theory was never actually implemented'],a:1,w:'Critics argued British commercial interests consistently won out over African development when the two conflicted.'},{q:'Which constitution laid the structural foundation that all later Nigerian constitutional development built upon?',o:['The Richards Constitution (1946)','The Clifford Constitution (1922)','The Lyttleton Constitution (1954)','The 1999 Constitution'],a:1,w:'The Richards Constitution (1946), formalising the three-region structure, was the foundation for all later constitutional development.'},{q:'What did the outcome of the 1959 federal elections demonstrate about Nigeria\'s readiness for self-government?',o:['Nigerian parties were capable of forming a functioning government before independence','Nigeria required continued direct British rule','No Nigerian party could cooperate with another','The elections proved democracy was unworkable in Nigeria'],a:1,w:'The 1959 elections\' NPC-NCNC coalition proved Nigerian parties could form a functioning government before independence.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
