<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}

.ht{font-size:15px;font-weight:700;}

.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}

.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}

.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}

.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}

.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}

.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Stages of British Colonisation of Nigeria',ACC,12,'middle',true));
[['Period','Event','Significance'],['1861','Annexation of Lagos','First formal British territory'],['1886','Royal Niger Company','Commercial colonisation of interior'],['1900','Protectorates declared','Crown control North & South'],['1906','Lagos Colony merged','Colony & Protectorate of Southern Nigeria'],['1914','Amalgamation','North + South = Nigeria; Lugard as Governor-General'],['1922','Clifford Constitution','First elections; elective principle introduced'],['1954','Lyttleton Constitution','Full federation; regional self-government']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(70,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(200,34+i*28,r[1],'#444',7,'middle',false));o.push(T(390,34+i*28,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Constitutional Development 1914-1960',ACC,12,'middle',true));
[['Constitution','Year','Key Feature'],['Amalgamation','1914','North+South united; Lugard Governor-General'],['Clifford','1922','First elections; Lagos+Calabar; NNDP formed 1923'],['Richards','1946','3 regions formalised; Houses of Chiefs; not consulted'],['Macpherson','1951','First consultations; regional legislatures; Council of Ministers'],['Lyttleton','1954','Full federation; regions self-governing; path to independence'],['Independence','1960','Westminster; Balewa PM; Azikiwe GG; republic 1963']].forEach(function(r,i){if(i<=p){o.push(R(10,16+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,34+i*36,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(250,34+i*36,r[1],'#444',8,'middle',false));o.push(T(400,34+i*36,r[2],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Colonial Administration — Summary',ACC,13,'middle',true));
[['Amalgamation 1914','Lugard; financial reasons; "marriage of inconvenience"'],['Indirect rule','Through traditional rulers; North=success; Igboland=failure (Aba 1929)'],['Clifford 1922','First elections; income £100 qualification; NNDP 1923'],['Richards 1946','3 regions; not consulted; deepened divisions'],['Macpherson 1951','Consultations; regional assemblies; led to AG winning West'],['Lyttleton 1954','Full federation; self-governing regions; independence framework'],['Independence 1960','1 October; Westminster; Balewa PM; Azikiwe GG→President 1963']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,9,'middle',true));o.push(T(320,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov \u2022 POL',ti:'British Conquest of Nigeria',su:'Examine how Britain acquired and consolidated control over Nigeria.',steps:[
{lb:'Lagos annexation and Royal Niger Company',dr:dQ1,ht:'<p>Britain formally annexed Lagos in <b>1861</b> — the first British territory in what is now Nigeria. In 1886, the <b>Royal Niger Company</b> (Sir George Goldie) received a Royal Charter giving it authority to administer and trade in the Niger area. It signed treaties (often obtained by deception), excluded rivals, and conducted military campaigns against resisting states. In 1900, the charter was revoked and the British government took direct Crown control, proclaiming the <b>Protectorate of Northern Nigeria</b> and the <b>Protectorate of Southern Nigeria</b>.</p>'},
{lb:'Amalgamation 1914',dr:dQ1,ht:'<p>On 1 January 1914, Lord Lugard amalgamated Northern and Southern Nigeria into a single entity: <b>Nigeria</b>. The primary reason was financial — the North ran a deficit while the South was profitable; amalgamation allowed cross-subsidisation. Lugard became the first Governor-General. Critics called it a "marriage of inconvenience" — joining politically, culturally and religiously diverse peoples who had had little formal connection. The amalgamation created the structural tensions (North-South, ethnic, religious) that would define Nigerian politics ever after.</p>'},
{lb:'Military conquest',dr:dQ1,ht:'<p>Key military conquests: (1) <b>Benin Punitive Expedition (1897)</b> — Benin City sacked; Oba exiled; Benin Bronzes looted. (2) <b>Aro Expedition (1901-2)</b> — Aro Chukwu oracle destroyed, removing the main trans-Igbo coordinating institution. (3) <b>Kano and Sokoto (1903)</b> — Lugard defeated the Kano Emirate then the Sultan of Sokoto, ending the Caliphate\'s military independence. (4) <b>Aba Women\'s Riots (1929)</b> — not a conquest but a major anti-colonial uprising, killed c.50 women; showed colonial rule was contested throughout.</p>'},
{lb:'Indirect rule — theory and practice',dr:dQ2,ht:'<p>Lord Lugard developed <b>indirect rule</b> — governing through existing traditional rulers. Theory: cheaper; culturally sensitive; efficient; prepared Africans for eventual self-government. Practice: best in the North (Sokoto Caliphate gave a ready-made hierarchy: Sultan→Emirs→District Heads). In Igboland: the British appointed <b>Warrant Chiefs</b> — men given authority by written warrant, not through Igbo tradition. Many abused their power. The <b>Aba Women\'s Riots (1929)</b> resulted — the British inquiry admitted Warrant Chiefs were "contrary to Igbo political tradition." Criticisms: entrenched ethnic divisions; denied educated elite political roles; froze political development.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Britain formally annexed Lagos as a Crown Colony in:',o:['1851 (after the bombardment)','1861','1886 (Royal Niger Company charter)','1900 (Protectorates declared)'],a:2,w:'Lagos was bombarded in 1851 but formally annexed as a Crown Colony in 1861 — the first formal British territory in what is now Nigeria.'},{q:'The primary reason for the 1914 Amalgamation of North and South Nigeria was:',o:['To create Nigerian national unity before independence','Financial — the north ran a deficit; amalgamation allowed the profitable south to subsidise northern administration','To implement indirect rule simultaneously across Nigeria','Religious — to create Christian-Muslim dialogue'],a:2,w:'Amalgamation was primarily a financial/administrative decision: the Northern Protectorate ran at a deficit while the Southern was profitable. Combining them reduced cost to the British treasury. Lugard also believed unified administration would be more efficient.'},{q:'The Aba Women\'s Riots (1929) were caused by:',o:['Excessive taxation of women by the Sokoto Caliphate','The Warrant Chief system — British-appointed chiefs lacking Igbo legitimacy abused power; women feared being taxed','The Oyo Mesi refusing British authority in Yorubaland','Missionaries converting Igbo women and causing social unrest'],a:2,w:'The Warrant Chief system imposed leaders alien to Igbo decentralised tradition. Many abused their artificial authority. A rumour spread that a census was preparation for taxing women → the Women\'s War (Ogu Umunwanyi) swept Owerri and Calabar Provinces. About 50 women were killed by British soldiers. The British inquiry admitted the Warrant Chief system had failed.'},{q:'Indirect rule was MOST successful in which region?',o:['The Niger Delta city-states','Igboland','The North — the Sokoto Caliphate\'s existing hierarchy (Sultan→Emirs→District Heads) was used directly','Lagos, where educated Nigerians cooperated as junior administrators'],a:3,w:'Indirect rule worked best in the North because the Sokoto Caliphate provided a ready-made administrative hierarchy. Emirs governed, collected taxes and administered justice; British Residents supervised from a distance. This required few British officials and caused minimal disruption to existing governance.'},{q:'Under what type of colonial status was Lagos placed after 1861?',o:['A Crown Colony under direct British administration','An independent kingdom','A League of Nations mandate','A French protectorate'],a:1,w:'Lagos was annexed as a Crown Colony under direct British administration in 1861.'},{q:'What was the general British approach to governing colonies known as "indirect rule"?',o:['Governing through existing traditional rulers and institutions','Direct rule by British officials in every village','Complete self-government with no British involvement','Rule entirely through the military'],a:1,w:'Indirect rule meant governing through existing traditional rulers rather than direct British administration.'},{q:'Why was the North initially a less profitable region for the British compared to the South?',o:['The South had more developed trade generating greater revenue','The North had no natural resources at all','The North refused to pay any taxes','The South was entirely undeveloped'],a:1,w:'The South\'s more developed trade (e.g. palm oil) generated far greater revenue than the North.'},{q:'What colonial-era grievance most directly triggered the Aba Women\'s Riots of 1929?',o:['Fear that the Warrant Chief system would lead to taxation of women','A dispute over land inheritance','A religious disagreement with missionaries','A demand for immediate independence'],a:1,w:'Women feared the Warrant Chief system would extend taxation to them, sparking the 1929 riots.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 POL',ti:'Constitutional Development 1922-1960',su:'Trace Nigeria\'s constitutional evolution from Clifford to independence.',steps:[
{lb:'Clifford 1922 and Richards 1946',dr:dQ2,ht:'<p><b>Clifford Constitution (1922)</b>: introduced the <b>elective principle</b> — first elections in Nigeria; Lagos and Calabar could elect members of the Legislative Council; but income qualification (£100/year) limited the franchise severely. It directly stimulated political organisation: Herbert Macaulay founded the <b>NNDP (1923)</b> to contest elections. <b>Richards Constitution (1946)</b>: for the first time created <b>three regions</b> (North, West, East); created Houses of Chiefs. Criticisms: nationalists (especially Azikiwe) were not consulted; formalising regions deepened divisions; traditional rulers given precedence over the educated elite.</p>'},
{lb:'Macpherson 1951 and Lyttleton 1954',dr:dQ2,ht:'<p><b>Macpherson Constitution (1951)</b>: first constitution drafted after meaningful Nigerian consultations; created regional legislatures with Nigerian majorities; Council of Ministers with Nigerian members. Led to crisis when regional elections produced sharp ethnic-regional competition (AG winning West). <b>Lyttleton Constitution (1954)</b>: established a genuine federal system; each of the three regions became self-governing with a Premier; a federal Council of Ministers emerged; Lagos as federal capital. This was the direct framework for independence. The subsequent 1960 Independence Constitution used this federal structure.</p>'},
{lb:'Independence 1960 and the First Republic',dr:dQ2,ht:'<p>The <b>1959 federal elections</b> produced: NPC 134 seats; NCNC 89; AG 73. No overall majority — NPC and NCNC formed a coalition. <b>Tafawa Balewa (NPC)</b> became Nigeria\'s first Prime Minister. Nigeria became independent on <b>1 October 1960</b>. <b>Nnamdi Azikiwe</b> became Governor-General; in 1963 Nigeria became a republic and he became first President. The First Republic (1960-66) was a Westminster parliamentary model with three ethnically-based regional parties. It collapsed through: election rigging; political violence (Western Region crisis 1962-63; "Wild Wild West" 1965); and the January 1966 military coup.</p>'},
{lb:'Economic and social impact of colonialism',dr:dQ1,ht:'<p>Colonial economic policy served British interests: (1) <b>Export commodity production</b> — groundnuts (North), cocoa (West), palm oil (East/Delta). (2) <b>Infrastructure for extraction</b> — railways built to move raw materials to coastal ports, not to develop internal trade. (3) <b>No industrialisation</b> — Nigeria kept as raw material supplier. (4) <b>Taxation</b> forced Nigerians into the cash economy. Social changes: Western education (mission schools) created the educated elite who later led nationalism; Christianity spread in the South; urbanisation grew; labour migration increased. The export commodity structure created dependence that later became oil dependence.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Clifford Constitution (1922) was significant because it:',o:['Granted universal suffrage to all adult Nigerians for the first time','Introduced the elective principle — the first elections in Nigeria, though with a high income qualification (Lagos and Calabar only)','Created the three-region structure (North, West, East)','Established a full federation with self-governing regions'],a:2,w:'The Clifford Constitution (1922) introduced the elective principle — a tiny franchise (Lagos and Calabar; £100 annual income) but the first right to elect any members of the Legislative Council. It directly stimulated political organisation: Macaulay founded the NNDP (1923) to contest the new elections.'},{q:'Nigerian nationalists opposed the Richards Constitution (1946) mainly because:',o:['It gave too many elections, threatening traditional ruler power','They were not consulted during drafting; formalising three regions was seen as divisive — weakening national unity','It gave the North too much power at the expense of the South','It abolished Houses of Chiefs, angering traditional rulers'],a:2,w:'Azikiwe and other nationalists opposed the Richards Constitution because: (1) they were not consulted; (2) formalising three regions was seen as engineering divisive regionalism that would weaken the nationalist movement; (3) it gave traditional rulers more prominence over the elected/educated elite.'},{q:'The Lyttleton Constitution (1954) was the most important pre-independence constitution because:',o:['It introduced the first elections in Nigerian history','It formally ended indirect rule','It established a genuine federal system with self-governing regions — the actual framework for independence','It created the Council of Traditional Rulers as supreme advisory body'],a:3,w:'Lyttleton (1954) established the federal structure: three self-governing regions each with a Premier; a federal Council of Ministers; Lagos as federal capital. This was the constitutional architecture on which independence was built. The 1960 constitution was largely its continuation.'},{q:'Tafawa Balewa\'s role at Nigerian independence was:',o:['First Governor-General (head of state) under the 1960 Westminster model','First Prime Minister (head of government) — leader of the NPC, the largest party in the 1959 federal elections','First President of the Federal Republic of Nigeria in 1963','First Premier of the Northern Region under the Lyttleton Constitution'],a:2,w:'Alhaji Sir Abubakar Tafawa Balewa (NPC) became Nigeria\'s first Prime Minister on independence — the head of government under the Westminster model. Azikiwe became Governor-General (head of state) in 1960, then first President when Nigeria became a republic in 1963.'},{q:'What was significant about the elective principle introduced by the Clifford Constitution (1922)?',o:['It allowed a small number of qualified Nigerians in Lagos and Calabar to vote for the first time','It gave all Nigerians the vote immediately','It created Nigeria\'s first President','It ended indirect rule completely'],a:1,w:'The elective principle allowed a small number of qualified Nigerians in Lagos and Calabar to vote for the first time.'},{q:'What common nationalist criticism was made of both the Richards (1946) and Macpherson (1951) Constitutions?',o:['Nigerians were insufficiently consulted in drafting them','They granted too much power to Nigerians too quickly','They abolished all traditional rulers','They introduced universal adult suffrage nationwide'],a:1,w:'Nationalists criticised both constitutions for insufficient Nigerian consultation in their drafting.'},{q:'Which constitution is considered the direct framework that led to Nigerian independence in 1960?',o:['The Lyttleton Constitution (1954)','The Clifford Constitution (1922)','The 1999 Constitution','The Richards Constitution (1946)'],a:1,w:'The Lyttleton Constitution (1954) established the genuine federal framework that led directly to independence.'},{q:'Who became Nigeria\'s first Prime Minister at independence in 1960?',o:['Tafawa Balewa','Nnamdi Azikiwe','Obafemi Awolowo','Ahmadu Bello'],a:1,w:'Tafawa Balewa, leader of the NPC, became Nigeria\'s first Prime Minister in 1960.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 POL',ti:'Early Nationalism',su:'Examine the rise of Nigerian nationalism and early political organisations.',steps:[
{lb:'Armed resistance and early organisations',dr:dQ1,ht:'<p>Nigerians resisted colonialism from the start. Key acts: Ijebu War (1892); Benin expedition (1897); Aro expedition (1901-2); Satiru revolt (1906); Egba revolt (1918); Aba Women\'s Riots (1929). All were suppressed by British military superiority. Early political organisations: (1) <b>Peoples Union (Lagos, 1908)</b> — protesting colonial land policies. (2) <b>NCBWA (1920)</b> — National Congress of British West Africa; J.E. Casely Hayford; demanded elected representation across all British West Africa. (3) <b>NNDP (1923)</b> — Herbert Macaulay; contested Lagos Council elections. (4) <b>NYM (1934)</b> — Nigerian Youth Movement; first truly national party.</p>'},
{lb:'Herbert Macaulay — father of nationalism',dr:dQ1,ht:'<p>Herbert Macaulay (1864-1946) is known as the "father of Nigerian nationalism." Key contributions: (1) Founded the <b>Lagos Daily News</b> (1925) and the <b>NNDP (1923)</b>. (2) Used legal challenges, newspaper campaigns, and political organisation to oppose colonial policy. (3) Won cases at the Privy Council in London challenging colonial ordinances. (4) Co-founded the <b>NCNC (1944)</b> with Azikiwe — the party that led the independence movement. (5) Conducted the NCNC\'s 1946 national tour across Nigeria — mobilising mass support — before dying at 82 during the tour. He did not call for immediate independence but consistently demanded greater Nigerian participation in governance.</p>'},
{lb:'Factors driving nationalism',dr:dQ1,ht:'<p>Factors driving Nigerian nationalism: (1) <b>Western education</b> — created Nigerians who read about democracy and rights but were denied them. (2) <b>World Wars I and II</b> — Nigerians fought for British "freedom"; returning soldiers asked: why fight for freedom abroad while denied it at home? (3) <b>Atlantic Charter (1941)</b> — Roosevelt and Churchill declared the right of peoples to self-determination; nationalists applied it to themselves. (4) <b>Pan-Africanism</b> — W.E.B. Du Bois, Marcus Garvey, the Pan-African Congresses (especially Manchester 1945). (5) <b>Indian independence (1947)</b> — proved independence from Britain was achievable. (6) <b>Ghana independence (1957)</b> — the first sub-Saharan British colony independent; pressured Nigeria.</p>'},
{lb:'Constitutional development and nationalism — connection',dr:dQ2,ht:'<p>Every constitutional change stimulated new political organisation: Clifford 1922 (elections) → NNDP 1923. Richards 1946 (regions) → NCNC national tour, protests. Macpherson 1951 (regional elections) → AG founded 1951; NPC founded 1951; sharp regional competition. Lyttleton 1954 (federation) → regional self-government campaigns; internal self-government for East and West 1957. Independence Constitution 1960 → 1959 federal elections; transfer of power. The pattern: British constitutional concessions came in response to nationalist pressure, and each concession produced new nationalist demands for more. This escalating cycle drove decolonisation from 1922 to 1960.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Herbert Macaulay is called the "father of Nigerian nationalism" because:',o:['He was the first Nigerian to serve as Prime Minister','He founded the NNDP (1923) and Lagos Daily News, co-founded the NCNC with Azikiwe (1944), pioneered organised political protest — bridging 19th-century protest and 20th-century independence movement','He led the armed resistance to the British at the Battle of Lagos 1861','He drafted the 1960 Independence Constitution'],a:2,w:'Macaulay (1864-1946) was the dominant figure of early Nigerian political opposition: legal challenges, newspapers, political parties. He founded the NNDP (1923), co-founded the NCNC with Azikiwe (1944), and conducted the NCNC\'s national tour before dying at 82. He bridged 19th-century protest politics and 20th-century mass nationalism.'},{q:'The Atlantic Charter (1941) boosted Nigerian nationalism because:',o:['It granted independence to all British colonies within five years','Roosevelt and Churchill declared the right of peoples to self-determination — nationalists used the colonial power\'s own stated principles against colonial rule','It promised economic independence to Nigeria as a reward for WWII participation','It established the UN, which immediately pressured Britain to decolonise'],a:2,w:'The Atlantic Charter (August 1941) stated respect for "the right of all peoples to choose the form of government under which they will live." Churchill intended it for Nazi-occupied Europe; African nationalists immediately applied it to their own situation. It gave the independence movement a powerful rhetorical weapon — holding Britain to its own stated principles.'},{q:'The National Congress of British West Africa (NCBWA, 1920) was significant because:',o:['It was the first organisation to demand immediate independence for Nigeria','It was a trans-national pan-West African organisation — spanning Nigeria, Gold Coast, Sierra Leone and Gambia — representing early pan-African political vision','It was the first organisation to win elections in Nigeria','It was founded specifically to oppose the Lyttleton Constitution'],a:2,w:'The NCBWA (founded by J.E. Casely Hayford of the Gold Coast) was a pan-British West African body demanding elected representation across all British West African territories. This trans-national vision represents early pan-African political thought — organising beyond individual colonial boundaries.'},{q:'Ghana\'s independence in 1957 impacted Nigerian nationalism by:',o:['Causing Nigerian nationalists to stop their campaigns, fearing British punishment','Proving independence from Britain was achievable through constitutional means, embarrassing Nigeria\'s nationalists and accelerating the push for Nigerian independence in 1960','Causing Azikiwe to merge the NCNC with Nkrumah\'s CPP into a single pan-African party','Making the British Colonial Office decide all African colonies should become independent simultaneously'],a:2,w:'Ghana\'s independence (6 March 1957) proved the constitutional path worked and created pressure: Nigeria risked being overshadowed by Ghana (a smaller country) as Africa\'s leader. Nigerian nationalists accelerated demands; the British agreed to 1960. Ghana\'s independence was a direct catalyst for Nigerian independence three years later.'},{q:'What was the significance of Herbert Macaulay founding the Lagos Daily News?',o:['It gave nationalists a media platform to organise political opposition','It was Nigeria\'s first television station','It was funded entirely by the British colonial government','It supported continued colonial rule'],a:1,w:'The Lagos Daily News gave Nigerian nationalists a media platform to organise and voice political opposition.'},{q:'What broader political vision did the National Congress of British West Africa (NCBWA, 1920) represent?',o:['An early pan-West African political movement spanning multiple colonies','A movement limited only to Lagos','A purely religious organisation','A British-run advisory council'],a:1,w:'The NCBWA represented an early pan-West African political vision spanning several British colonies.'},{q:'How did Nigerian nationalists rhetorically use the Atlantic Charter (1941) to their advantage?',o:['They cited its declaration of self-determination against Britain\'s colonial policy','They used it to demand British military support','They used it to justify armed rebellion','They ignored it as irrelevant to Africa'],a:1,w:'Nationalists cited the Atlantic Charter\'s declaration of self-determination against Britain\'s own colonial policy.'},{q:'What psychological/political effect did Ghana\'s 1957 independence have on Nigerian nationalists?',o:['It proved independence was achievable and increased pressure for Nigerian independence','It discouraged Nigerian nationalists entirely','It caused Nigeria to abandon its independence campaign','It had no effect on Nigerian politics'],a:1,w:'Ghana\'s independence proved constitutional independence was achievable, accelerating Nigeria\'s own push.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 POL',ti:'WAEC Prep — Colonial Administration',su:'Practise WAEC-style questions on colonial administration.',steps:[
{lb:'WAEC essay approach',dr:dQ1,ht:'<p>For WAEC Government essays on colonial administration: (1) Name the specific constitution or policy. (2) Give key features with dates. (3) Evaluate: strengths and weaknesses. (4) State the legacy. Common questions: "Describe indirect rule and assess its impact." "Trace Nigeria\'s constitutional development 1922-1960." "Examine the causes and effects of the Aba Women\'s Riots (1929)." "Assess Herbert Macaulay\'s contribution to nationalism." "Compare the Richards (1946) and Macpherson (1951) Constitutions." Essential facts: Amalgamation 1914 (Lugard; financial); Clifford 1922 (first elections; NNDP 1923); Richards 1946 (3 regions); Macpherson 1951 (consultations); Lyttleton 1954 (full federation); Independence 1960 (Balewa PM; Azikiwe GG).</p>'},
{lb:'Common mistakes to avoid',dr:dQ2,ht:'<p>Avoid: Saying Azikiwe was the first Prime Minister (Balewa was PM; Azikiwe was GG then President). Confusing which constitution introduced 3 regions (Richards 1946 — not Clifford). Saying Clifford introduced universal suffrage (it had a high income qualification). Saying the Aba Riots were caused by actual taxation of women (it was a fear/rumour). Saying indirect rule worked everywhere (failed in Igboland — Warrant Chiefs → Aba 1929). Missing the date 1914 for Amalgamation. Confusing Lugard (indirect rule/amalgamation) with Clifford (1922 Constitution). Not mentioning the North-South divide as the key legacy of colonial administration for post-independence Nigeria.</p>'},
{lb:'Key connections',dr:dQ2,ht:'<p>Colonial legacies for post-independence Nigeria: (1) Three-region structure (Richards 1946) → ethnic-regional competition in First Republic → 1966 coups. (2) Indirect rule → North-South administrative divide → civil war 1967-70. (3) Westminster model (1960) → ill-suited to multi-ethnic reality → overthrown 1966. (4) Export commodity economy → oil dependence. (5) Educated elite vs traditional ruler tension → continued in post-independence party politics. (6) North-South religious divide (missionaries kept out of North) → recurring north-south tensions. Every colonial policy had post-independence consequences — demonstrating their lasting significance for Nigeria.</p>'},
{lb:'Evaluation practice',dr:dQ1,ht:'<p>Practice evaluation: "Assess the impact of indirect rule on Nigeria." Positive: preserved valuable traditional institutions; cheaper administration; less cultural disruption in many areas; Sokoto template gave effective northern governance. Negative: entrenched ethnic divisions (governing by "tribe"); denied educated elite political roles → radicalised nationalism; damaged decentralised societies (Igbo Warrant Chiefs → Aba 1929); created North-South divide; froze political development. Overall: indirect rule served British colonial interests primarily; its political legacy (ethnic regionalism, North-South tension) contributed directly to Nigeria\'s post-independence crises. A balanced evaluation rewards both sides.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The correct constitutional chronology is:',o:['Richards 1922 → Clifford 1946 → Macpherson 1951 → Lyttleton 1954','Clifford 1922 → Richards 1946 → Macpherson 1951 → Lyttleton 1954 → Independence 1960','Macpherson 1922 → Richards 1946 → Clifford 1951 → Independence 1960','Clifford 1922 → Macpherson 1946 → Richards 1951 → Lyttleton 1960'],a:2,w:'Clifford 1922 (first elections) → Richards 1946 (three regions) → Macpherson 1951 (consultations; regional assemblies) → Lyttleton 1954 (full federation) → Independence Constitution 1960 (Westminster; Balewa PM; Azikiwe GG).'},{q:'Nigeria gained independence on:',o:['1 January 1914 (Amalgamation date)','1 October 1960','28 September 1963 (republic date)','15 August 1947 (India independence)'],a:2,w:'Nigeria became independent on 1 October 1960 — celebrated annually as Independence Day. In 1963 Nigeria became a republic (leaving the monarchy but remaining in the Commonwealth), with Azikiwe as first President. Balewa remained Prime Minister until the January 1966 coup.'},{q:'The "elective principle" introduced by the Clifford Constitution (1922) means:',o:['All Nigerians could elect the Governor-General','A small number of qualified Nigerians in Lagos and Calabar could elect some members of the Legislative Council — the first electoral right in Nigerian history','Traditional rulers were to be elected by their communities','Universal suffrage for all adult Nigerians'],a:2,w:'The Clifford Constitution introduced the first right to elect ANY members of the Legislative Council — limited to Lagos and Calabar, with an income qualification of £100/year. It was very restricted but was the fundamental shift from purely appointed colonial governance to one with some electoral legitimacy.'},{q:'Which legacy of colonial administration most directly contributed to the January 1966 military coup?',o:['The colonial road network, which made military movement across the country easy','The three-region structure and ethnically-based parties that made the First Republic\'s politics a zero-sum ethnic competition — combined with election rigging and political violence making constitutional governance unworkable','The Westminster parliamentary system, which British constitutional experts said was unsuitable for Africa','The colonial export economy, which left Nigeria too poor to maintain stable democratic institutions'],a:2,w:'The three-region structure (Richards 1946, formalised 1954) ensured that each major election was effectively a competition between ethnic blocs (Hausa-North/NPC; Yoruba-West/AG; Igbo-East/NCNC). This made every loss a zero-sum ethnic defeat. Combined with election rigging (1964, 1965) and political violence, it made constitutional governance unworkable — providing the context for the January 1966 coup.'},{q:'Which constitution came immediately after the Clifford Constitution (1922) in Nigeria\'s constitutional development?',o:['The Richards Constitution (1946)','The Macpherson Constitution (1951)','The Lyttleton Constitution (1954)','The 1999 Constitution'],a:1,w:'The Richards Constitution (1946) came immediately after the Clifford Constitution (1922).'},{q:'What year did Nigeria transition from a Westminster-style parliamentary government to a republic?',o:['1960','1963','1966','1979'],a:2,w:'Nigeria became a republic in 1963, replacing the Queen with a Nigerian President.'},{q:'Approximately how many years elapsed between the Clifford Constitution (1922) and Nigerian independence (1960)?',o:['18 years','28 years','38 years','48 years'],a:3,w:'38 years elapsed between the Clifford Constitution (1922) and independence in 1960.'},{q:'What structural colonial legacy is often blamed for weakening Nigeria\'s First Republic?',o:['The three-region structure combined with ethnically-based parties','The abolition of all traditional rulers','The complete absence of any elections before 1960','Nigeria\'s currency being tied to the British pound'],a:1,w:'The three-region structure combined with ethnically-based parties made First Republic politics a zero-sum contest.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 POL',ti:'Mixed Revision — Colonial Administration',su:'Integrated revision across all colonial administration topics.',steps:[
{lb:'Summary',dr:dQ10,ht:'<p>Colonial administration: Conquest — Lagos 1861; RNC 1886; Protectorates 1900; Amalgamation 1914 (Lugard; financial reasons). Indirect rule — works through traditional rulers; North=success (Sokoto template); Igboland=failure (Warrant Chiefs → Aba 1929). Constitutions — Clifford 1922 (first elections; NNDP 1923); Richards 1946 (3 regions; not consulted); Macpherson 1951 (consultations; regional assemblies); Lyttleton 1954 (full federation); Independence 1960 (Balewa PM; Azikiwe GG; Westminster). Republic 1963 (Azikiwe President). Nationalism — Macaulay (NNDP/NCNC; Father); Azikiwe (NCNC; journalist; Pan-African); Awolowo (AG; free education). Factors driving nationalism: education; WWI/II; Atlantic Charter; Pan-Africanism; Ghana 1957.</p>'},
{lb:'Key people',dr:dQ10,ht:'<p>Key colonial figures: Lord Lugard — Amalgamation 1914; indirect rule; Dual Mandate (1922). Sir Hugh Clifford — 1922 Constitution. Sir Arthur Richards — 1946 Constitution (3 regions). Sir John Macpherson — 1951 Constitution (consultations). Oliver Lyttleton — 1954 Constitution (federation). Herbert Macaulay — NNDP 1923; NCNC 1944; Father of nationalism; died 1946. Nnamdi Azikiwe — NCNC; West African Pilot; 1st GG 1960; 1st President 1963. Obafemi Awolowo — AG; free education Western Region 1955; imprisoned 1962. Ahmadu Bello — NPC; Sardauna; Premier North; killed Jan.1966. Tafawa Balewa — NPC; 1st PM 1960; killed Jan.1966. Funmilayo Ransome-Kuti — AWU 1946; women\'s rights; Abeokuta.</p>'},
{lb:'Evaluation',dr:dQ1,ht:'<p>Key evaluations: (1) "Who contributed most to Nigerian independence?" Azikiwe (mass mobilisation; press; pan-African vision; 1st President). Awolowo (AG governance model; free education). Balewa (federal leadership at independence). Macaulay (pioneering the independence movement). (2) "Why did the First Republic fail?" Ethnic-regional parties; Westminster model mismatch; election rigging; political violence (Western Region); absence of constitutional culture. (3) "Assess indirect rule." Positive: cheaper; preserved institutions; effective in North. Negative: ethnic divisions; damaged decentralised societies; froze political development; excluded educated elite. WAEC rewards balanced evaluation with specific evidence.</p>'},
{lb:'WAEC final tips',dr:dQ2,ht:'<p>Final tips: (1) Know constitutional timeline in order: 1914, 1922, 1946, 1951, 1954, 1960, 1963. (2) Know at least two specific features of each constitution. (3) Know the difference: Azikiwe = 1st GG 1960 then 1st President 1963; Balewa = 1st PM 1960. (4) Know why indirect rule failed in Igboland (Aba 1929) — guaranteed exam topic. (5) Know Amalgamation date (1914) and reason (financial — not cultural unity). (6) Connect every colonial policy to its post-independence legacy: 3-region structure → ethnic politics; North-South divide → 1966 coups; export economy → oil dependence. (7) Specific dates and names score marks; vague generalisations do not. Aim for 5+ developed points with evidence in a 25-mark essay.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which statement BEST evaluates British indirect rule in Nigeria?',o:['It was a perfect colonial policy that successfully preserved all Nigerian traditions','It was entirely destructive — it undermined all pre-colonial governance everywhere in Nigeria','It worked well in centralised northern Nigeria (using existing Sokoto hierarchy) but failed in decentralised Igboland (Warrant Chiefs → Aba 1929), and throughout entrenched ethnic divisions and excluded the educated elite','It had no lasting impact — all effects of indirect rule were reversed by independence in 1960'],a:3,w:'Balanced evaluation: indirect rule worked in the North (Sokoto Caliphate template — genuine administrative continuity); failed in Igboland (Warrant Chiefs violated decentralised tradition → 1929 Aba Women\'s Riots); and throughout entrenched ethnic divisions and denied educated Nigerians political roles. This nuanced position is what WAEC rewards.'},{q:'The most significant constitutional innovation of the Macpherson Constitution (1951) was:',o:['Creating the three-region structure for the first time','Granting universal suffrage to all adult Nigerians','Being the first constitution drafted after meaningful consultation with Nigerians across all regions — creating regional assemblies with genuine Nigerian participation','Establishing the full federal system with self-governing regions'],a:3,w:'Macpherson (1951) was distinctive for its consultative process — the first time Nigerians across all regions were extensively consulted before a constitution was written. It created regional assemblies with Nigerian majorities and a Council of Ministers. It was more participatory than any previous constitution, though British ultimate control remained.'},{q:'The Berlin Conference (1884-85) is relevant to Nigerian history because:',o:['It was where Nigerian independence was agreed','European powers divided Africa among themselves — drawing Nigeria\'s borders without African representation, often cutting across pre-existing ethnic and political boundaries','It abolished the slave trade in West Africa immediately','Britain and Nigeria signed a treaty preventing military conquest'],a:2,w:'The Berlin Conference established rules for European partition of Africa: effective occupation required; Niger River declared open; slave trade condemned. Nigeria\'s borders were fixed by Anglo-French and Anglo-German negotiations — boundaries that split the Hausa-Fulani, Kanuri and other groups across colonial frontiers. Nigerians had no representation.'},{q:'Nigerian independence in 1960 was achieved through:',o:['Armed revolution by nationalist fighters','Negotiated constitutional advancement — a gradual process from 1922-1960 in which nationalists worked within the colonial system, expanding Nigerian autonomy until independence was achieved','UN sanctions forcing British withdrawal','Economic pressure from the United States'],a:2,w:'Nigerian independence was negotiated, not won by armed struggle. The nationalist parties worked within the constitutional framework — contesting elections, filling ministerial posts, attending Lancaster House conferences — until independence came on 1 October 1960. This contrasts with Algeria (FLN armed struggle), Kenya (Mau Mau) and other violent independence movements.'},{q:'What was a key outcome of the Berlin Conference (1884-85) for African political boundaries?',o:['European powers drew Africa\'s borders without African consent','African leaders were invited to negotiate their own borders','It ended the transatlantic slave trade immediately','It created the first African independence movement'],a:1,w:'The Berlin Conference saw European powers divide Africa\'s borders without African representation or consent.'},{q:'Why is the Macpherson Constitution (1951) considered a turning point compared to earlier constitutions?',o:['It was the first created after genuine consultation with Nigerians across regions','It was the first to introduce any elections at all','It granted Nigeria full independence immediately','It abolished the office of Governor entirely'],a:1,w:'The Macpherson Constitution was the first drafted after genuine, wide-ranging consultation with Nigerians.'},{q:'What term describes Nigeria\'s general path to independence, as opposed to armed struggle seen elsewhere in Africa?',o:['Negotiated constitutional advancement','Violent revolutionary overthrow','UN-imposed decolonisation','Unilateral declaration without British involvement'],a:1,w:'Nigeria followed a path of negotiated constitutional advancement rather than armed struggle.'},{q:'In which specific region did indirect rule face its most significant colonial-era crisis, as shown by the Aba Women\'s Riots?',o:['Igboland (the Southeast)','The Sokoto Caliphate (the North)','Lagos','The Niger Delta'],a:1,w:'Igboland saw the most significant crisis of indirect rule, exemplified by the 1929 Aba Women\'s Riots.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 POL',ti:'Further Colonial Practice',su:'Additional practice on colonial administration.',steps:[
{lb:'Review — key institutions',dr:dQ2,ht:'<p>Key colonial institutions: <b>Colonial Governor</b> — supreme British authority; issued ordinances; controlled budget. <b>Resident</b> — British official supervising an emirate under indirect rule; wielded real power but in theory only "advised." <b>Legislative Council</b> — evolved from purely appointed (pre-1922) to partly elected (1922) to Nigerian majority (1950s). <b>Native Authority</b> — traditional ruler and council functioning as local government under indirect rule. <b>Native Courts</b> — administered customary (and in north, Islamic) law. <b>Warrant Chief</b> — British-appointed Igbo "chief"; lacked legitimacy; caused Aba 1929. <b>Dual Mandate</b> — Lugard\'s theory: colonial rule serves both British commerce AND African development.</p>'},
{lb:'Role of missionaries',dr:dQ2,ht:'<p>Christian missionaries played an ambiguous role in colonial Nigeria: (1) <b>Education</b> — mission schools (CMS, Catholic, Baptist) provided most Nigerian education; the educated nationalist elite were largely mission-educated. (2) <b>Health</b> — mission hospitals and clinics. (3) <b>Language</b> — Bible translations into Yoruba, Igbo helped codify and preserve Nigerian languages. (4) <b>Cultural disruption</b> — missionaries condemned traditional religion, music and social practices. (5) <b>North-South divide</b> — British kept missionaries out of the North to protect indirect rule through Islamic emirs — deepening the North-South religious divide that persists today. The educated southern elite and the Islamic northern establishment were products of these different religious policies.</p>'},
{lb:'The Dual Mandate and colonial justification',dr:dQ1,ht:'<p>Lugard\'s "The Dual Mandate in British Tropical Africa" (1922) argued colonial rule served two purposes: (1) Developing Africa\'s resources for British commercial benefit. (2) "Civilising"/developing Africans for their own benefit. This was the most sophisticated ideological justification for colonialism. Critics: (1) The "dual mandate" consistently prioritised British interests over African development. (2) "Civilisation" was defined entirely in British terms. (3) No industrialisation was pursued (which would have served African development). (4) The Aba Women\'s Riots revealed the limits of "benevolent" colonial rule. Despite these criticisms, the Dual Mandate shaped British colonial policy and provided the intellectual framework for indirect rule.</p>'},
{lb:'Legacy connections',dr:dQ2,ht:'<p>Connecting colonial to post-colonial: (1) Federal structure — colonial administrative divisions became federal regions, then states (12 in 1967; 36 today). (2) Ethnic politics — three-region structure embedded ethnic-regional competition. (3) Westminster model — adopted 1960, overthrown 1966, too alien to Nigerian political culture. (4) Legal system — common law + customary law + Islamic law: all colonial constructs still operative. (5) Economic dependence — commodity export economy → oil dependence. (6) Military — colonial constabulary became Nigerian Army; trained by Britain → 1966 coups. (7) English language — colonial imposition but serves as national lingua franca across 250+ ethnic groups.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Christian missionaries were excluded from northern Nigeria under indirect rule because:',o:['Missionaries refused to work in hot northern climates','Lugard feared missionary activity would destabilise the Islamic emirate system on which indirect rule in the North depended','The Roman Catholic Church had a political agreement to evangelise only the South','Northern rulers specifically requested Christian missionaries to help establish schools'],a:2,w:'Indirect rule in the North depended on Muslim emirs\' cooperation. Lugard feared Christian missionaries would provoke the emirs and undermine the system. This exclusion had lasting consequences: the North remained overwhelmingly Muslim; the educated Christian elite emerged almost exclusively from the South; the North-South religious divide deepened.'},{q:'The Dual Mandate theory (Lugard, 1922) justified colonialism by arguing it:',o:['Gave Britain a UN mandate to govern Nigeria until 1960','Served two purposes: developing Africa\'s resources for British commerce AND civilising/developing Africans — supposedly benefiting both Britain and Africa','Required equal treatment of all colonial subjects regardless of religion or ethnicity','Gave Britain the mandate to govern all former German and Ottoman territories in Africa'],a:2,w:'Lugard\'s Dual Mandate (1922) argued colonialism served two beneficiaries: British commercial interests (exploitation of African resources) AND African civilisational development. Critics pointed out that British interests consistently won when the two conflicted, and "civilisation" was defined entirely on British terms.'},{q:'The most significant long-term legacy of British colonialism for Nigeria\'s post-independence economy was:',o:['A diversified industrial economy that later struggled with technological competition','A dependence on primary commodity exports (groundnuts, cocoa, palm oil — later oil) with no significant industrialisation — structural underdevelopment rooted in colonial economic policy','A modern agricultural sector capable of feeding Nigeria without imports','Infrastructure designed for internal development and regional trade'],a:2,w:'Colonial economic policy kept Nigeria as a raw material supplier and market for British manufactures. No industrial policy was pursued; infrastructure served export extraction (Lagos-Kano railway to move groundnuts to port). This structural legacy simply changed commodity when oil replaced agricultural products — the dependence pattern itself persisted, and is the root of Nigeria\'s current economic vulnerability.'},{q:'Which of the following CORRECTLY describes the role of the "Resident" in indirect rule?',o:['A British administrator who directly governed a district, replacing all traditional authority','A British official who nominally "advised" emirs and chiefs but in practice held ultimate authority — the supervisory figure in the indirect rule system','A Nigerian traditional ruler who had been given a British salary and title','An elected Nigerian representative who reported local concerns to the Colonial Governor'],a:2,w:'British Residents were theoretically advisors to traditional rulers (the "indirect" in indirect rule — they did not govern directly). In practice, Residents held real power: they could overrule or remove uncooperative emirs; they managed the finances and military. "Advising" was a polite fiction that masked continued colonial control. The Resident embodied the contradiction of indirect rule: nominally hands-off, actually in charge.'},{q:'What was Lord Lugard\'s main concern about allowing Christian missionaries into the Northern emirates?',o:['That missionary activity could destabilise the Islamic emirate system','That missionaries had no interest in going north','That northern Nigeria had no population to convert','That missionaries had already converted the whole North'],a:1,w:'Lugard feared missionary activity would destabilise the Islamic emirate system underpinning indirect rule in the North.'},{q:'According to Lugard\'s Dual Mandate theory, colonialism was supposed to benefit whom?',o:['Both Britain commercially and Africans through supposed development','Only the African population','Only the British government','Neither party, as a purely administrative exercise'],a:1,w:'The Dual Mandate claimed to benefit both Britain commercially and Africans through "civilising" development.'},{q:'What long-term economic pattern did colonial policy establish in Nigeria, according to this lesson?',o:['Heavy dependence on exporting primary commodities rather than industrial development','A fully industrialised economy independent of exports','Complete economic self-sufficiency','An economy based entirely on manufacturing exports'],a:1,w:'Colonial policy established dependence on primary commodity exports, without significant industrialisation.'},{q:'What was the practical role of the British "Resident" within the indirect rule system?',o:['To supervise and effectively control local rulers while nominally advising them','To have no authority at all over local rulers','To be elected by the local population','To serve only as a religious adviser'],a:1,w:'The Resident nominally "advised" emirs and chiefs but in practice held ultimate authority.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 POL',ti:'Mixed Revision 2 — Colonial and Nationalism',su:'Further integrated revision covering all colonial topics.',steps:[
{lb:'Full integrated review',dr:dQ10,ht:'<p>Integrated review: Conquest: Lagos 1861; RNC 1886; Protectorates 1900; Benin 1897; Aro 1901-2; Kano/Sokoto 1903. Amalgamation 1914: Lugard; financial reasons; "marriage of inconvenience." Indirect rule: North=success; Igboland=Warrant Chiefs=Aba 1929. Constitutions: Clifford 1922→NNDP 1923; Richards 1946 (3 regions); Macpherson 1951 (consultations); Lyttleton 1954 (federation); Independence 1960 (Balewa PM; Azikiwe GG). Republic 1963 (Azikiwe President). 1964 rigged elections; 1965 Wild Wild West; January 1966 coup (Nzeogwu; mainly Igbo officers; Balewa/Bello killed). Counter-coup July 1966 (northern; Ironsi killed; Gowon). Economic: export dependence; no industrialisation; infrastructure for extraction.</p>'},
{lb:'Nationalism timeline',dr:dQ10,ht:'<p>Nationalism timeline: 1908 Peoples Union (Lagos). 1920 NCBWA (Casely Hayford; trans-West Africa). 1923 NNDP (Macaulay; contested Lagos elections). 1925 Lagos Daily News (Macaulay). 1934 NYM (first truly national party). 1937 West African Pilot (Azikiwe; "Show the light"). 1941 Atlantic Charter. 1944 NCNC (Macaulay/Azikiwe). 1945 Manchester Pan-African Congress. 1946 NCNC national tour; Macaulay dies. 1948 Egbe Omo Oduduwa (Awolowo). 1951 AG (Awolowo); NPC (Bello). 1953 Kano Riots; Enahoro self-government motion. 1954 Lyttleton; federation. 1955 Free primary education Western Region (Awolowo). 1957 Ghana independent; East/West self-government. 1959 Federal elections (NPC 134; NCNC 89; AG 73). 1960 Independence.</p>'},
{lb:'Evaluating independence leaders',dr:dQ1,ht:'<p>Azikiwe: journalist; pan-Nigerian aspiration; mass mobiliser; first President. Criticism: NCNC in practice Igbo-based; First Republic failed on his watch. Awolowo: free education; developed governance model for West; federal vision ahead of its time. Criticism: imprisoned (politically motivated but still failed to prevent it); AG was primarily Yoruba-based. Bello: maintained northern unity; effective northern Premier; kept stability in the North. Criticism: conservative; opposed progressive reform; killed January 1966. Balewa: respected internationally; moderate; capable PM. Criticism: not a strong enough leader to prevent the Republic\'s collapse. No leader was without limitations — WAEC evaluations reward acknowledging both achievements and weaknesses.</p>'},
{lb:'WAEC final review',dr:dQ2,ht:'<p>Final WAEC preparation: Most frequently examined topics in colonial administration: (1) Indirect rule — how it worked; why it succeeded in North; why it failed in Igboland (Aba 1929). (2) Constitutional development — all five constitutions with dates and key features. (3) Herbert Macaulay — "father of nationalism"; specific contributions. (4) Causes of First Republic collapse. (5) Impact of colonial economic policy on post-independence Nigeria. For each: give specific evidence (dates, names, events). Avoid vague generalisations. Structure 25-mark essays: intro (2-3 sentences) + 5-6 developed points with evidence + conclusion (2-3 sentences with overall judgment). Aim for 400-500 words.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The January 1966 coup resulted in the deaths of:',o:['Azikiwe and Awolowo — the two main rivals to northern dominance','Tafawa Balewa (PM), Ahmadu Bello (Premier of North), Samuel Akintola (Premier of West), and several senior military officers','Only Igbo politicians — showing the coup was pro-northern from the start','Only military figures — the coup plotters were careful to protect civilian politicians'],a:2,w:'The 15 January 1966 coup (led by mainly Igbo officers including Major Nzeogwu) killed: Tafawa Balewa (PM; Hausa-Fulani); Ahmadu Bello (Premier of North; Hausa-Fulani); Samuel Akintola (Premier of West; Yoruba) and several senior northern military officers. Igbo political and military leaders were largely spared — creating the perception of an "Igbo coup" that triggered the July 1966 counter-coup.'},{q:'Free primary education was introduced in the Western Region in 1955 by:',o:['Nnamdi Azikiwe as part of the NCNC\'s national programme','Lord Lugard as part of indirect rule\'s educational component','Obafemi Awolowo — funded by a levy on cocoa marketing board revenue — the first free universal primary education in sub-Saharan Africa','The British Colonial Office as part of the Lancaster House independence preparations'],a:3,w:'Awolowo introduced free primary education in the Western Region (1955), funded through the cocoa marketing board. This was the first free universal primary education in sub-Saharan Africa — within a few years producing a generation of educated Yoruba who would dominate Nigeria\'s professional class by the 1970s-80s. Nigeria\'s first TV station also opened in Ibadan (1959) under Awolowo\'s Western Region government.'},{q:'The 1959 federal elections produced a coalition between:',o:['All three parties (NPC, NCNC, AG) in a national unity government','NPC and NCNC — the two largest parties; NPC held PM position; NCNC held Eastern Region and federal positions; AG became official opposition','NCNC and AG against the NPC — but the NPC won because northern population gave it more seats','NPC and AG — leaving the NCNC in opposition despite Azikiwe\'s pan-Nigerian credentials'],a:2,w:'1959 results: NPC 134; NCNC 89; AG 73. No overall majority. NPC and NCNC formed a pragmatic coalition: Balewa (NPC) became PM; Azikiwe (NCNC) became Senate President (then GG at independence). The AG under Awolowo became official opposition. This coalition was born of arithmetic necessity, not ideological agreement.'},{q:'Which of the following BEST explains why Nigeria\'s post-independence economy remained underdeveloped?',o:['Nigerian leaders were corrupt from the start and mismanaged colonial-era industrialisation','Colonial economic policy deliberately kept Nigeria as a raw material exporter without industrialisation — a structural dependence that oil revenues later temporarily masked but did not resolve','Nigeria had no natural resources beyond oil, which was only discovered after independence','The First Republic\'s collapse in 1966 destroyed all colonial-era economic development plans'],a:2,w:'Colonial economic policy was extractive by design: export commodity production (groundnuts, cocoa, palm oil); no industrialisation; infrastructure for extraction (railways to ports). Nigeria was kept as a raw material supplier and market for British manufactured goods. This structural legacy simply changed commodity — oil replaced groundnuts/cocoa — while the dependence pattern (primary commodity export, no manufacturing) persisted. Colonial economics created the structural underdevelopment that Nigeria\'s post-independence governments inherited.'},{q:'What funding source did Obafemi Awolowo use to finance free primary education in the Western Region?',o:['A levy on cocoa marketing board revenue','A direct grant from the British government','Oil revenue','A national income tax'],a:1,w:'Awolowo funded free primary education through a levy on cocoa marketing board revenue.'},{q:'What was the outcome of the January 1966 coup for Nigeria\'s top political leadership?',o:['Several senior political leaders, including the PM and regional premiers, were killed','All political leaders survived unharmed','Only military officers were affected','The coup was bloodless'],a:1,w:'The January 1966 coup resulted in the deaths of several senior politicians, including the PM and regional premiers.'},{q:'Which party held the position of Prime Minister following the 1959 federal election coalition?',o:['The NPC','The NCNC','The AG','The NNDP'],a:1,w:'The NPC, as the largest party in the coalition, held the position of Prime Minister.'},{q:'What economic pattern from the colonial era is said to have persisted after independence, later masked temporarily by oil revenue?',o:['Dependence on raw material exports without significant industrialisation','A fully diversified industrial economy','Complete economic independence from exports','An economy driven entirely by manufacturing'],a:1,w:'Dependence on raw material exports, a colonial-era pattern, persisted and was only temporarily masked by oil revenue.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 POL',ti:'Extended Practice Questions',su:'Further practice across all colonial and nationalist topics.',steps:[
{lb:'Practice answers',dr:dQ2,ht:'<p>Model answer extract: "Assess the impact of the Amalgamation (1914) on Nigeria\'s political development." The Amalgamation of Northern and Southern Nigeria in 1914 was Lord Lugard\'s most consequential administrative act. Primarily motivated by financial necessity (the northern deficit), it joined two profoundly different colonial territories: the largely Islamic, hierarchically governed North and the more diverse, partly decentralised South. Critics called it a "marriage of inconvenience." Its most lasting impact was creating the structural North-South tension that would drive Nigerian politics: the 1946 three-region structure formalised this division; the 1959 election produced a coalition of convenience between northern and eastern parties; and the 1966 coups reflected North-South mutual suspicion reaching a breaking point.</p>'},
{lb:'Extended analysis',dr:dQ1,ht:'<p>Extended analysis: The role of education in Nigerian nationalism. Mission schools (CMS, Catholic, Baptist) educated the nationalist elite — Azikiwe, Awolowo, Macaulay were all mission-educated. Western education exposed Nigerians to liberal democratic concepts of rights and self-determination — concepts they then demanded for themselves. Azikiwe\'s US education (Howard, Lincoln — historically Black universities) gave him Pan-African intellectual frameworks. Awolowo\'s London law degree gave him constitutional expertise. The irony: colonial education created the people who dismantled colonialism. But education was unequally distributed: mission schools concentrated in the South (missionaries excluded from North); the educated elite was disproportionately southern — deepening the educated-southerner vs traditional-northerner divide that shaped post-independence politics.</p>'},
{lb:'Comparison framework',dr:dQ2,ht:'<p>Comparison framework — Azikiwe vs Awolowo: Azikiwe: NCNC; eastern base (despite pan-Nigerian aspiration); journalist/newspaper; US-educated; first President; more charismatic and populist. Awolowo: AG; Yoruba/western base; lawyer; London-educated; free education policy; imprisoned; more intellectual and programmatic. On ideology: Azikiwe — pan-African, democratic, pragmatic. Awolowo — federalist, progressive welfare state, ethnic federalism. On legacy: Azikiwe — political (first President); symbolic (Zik of Africa). Awolowo — governance (free education); intellectual (federal theory). Both were essential; without Azikiwe there would have been no mass independence movement; without Awolowo no model of developmental governance. WAEC essays comparing them should acknowledge both achievements and limitations.</p>'},
{lb:'WAEC preparation wrap-up',dr:dQ2,ht:'<p>Final colonial administration preparation: Questions to practise: (1) "Describe the main features of indirect rule and assess its suitability for Nigeria." (2) "Trace the constitutional development of Nigeria from 1922 to 1960 and evaluate which constitution was most significant." (3) "What factors led to the growth of Nigerian nationalism?" (4) "Compare the contributions of Azikiwe and Awolowo to Nigeria\'s independence." (5) "Examine the causes and consequences of the Aba Women\'s Riots (1929)." For each: introduction with context; 5+ developed points with evidence; balanced evaluation; conclusion with overall judgment. Specific dates, names and events score marks. Vague generalisations do not. Aim for analysis, not just description.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The "Wild Wild West" (1965) refers to:',o:['The Ijebu War of 1892 in western Yorubaland','Widespread electoral violence and rigging in the Western Region following the disputed 1965 regional elections — a crisis that directly contributed to the January 1966 coup','AWD Awolowo\'s political campaign tour across the Western Region in 1954','The British military campaign to pacify the Western Region in the 1890s'],a:2,w:'The 1965 Western Region elections were chaotic: widespread rigging; ballot stuffing; declared results most observers believed fabricated; and political violence that killed hundreds. The "Wild Wild West" crisis convinced January 1966 coup plotters that elected politicians had made democratic governance impossible. It was the immediate political trigger for the coup.'},{q:'Pan-Africanism influenced Nigerian nationalism through:',o:['Providing financial resources for nationalist parties through the UNIA fund','Providing intellectual frameworks (shared African destiny; right to self-determination; Black pride) that gave nationalists theoretical grounding for their independence demands','Organising armed guerrilla forces that fought alongside Nigerian nationalist militias','Persuading the United States to impose sanctions on Britain over Nigerian independence'],a:2,w:'Pan-Africanism (Du Bois, Garvey, Manchester Congress 1945, Nkrumah) provided the intellectual and emotional framework for Nigerian nationalism: the idea that African peoples share a common destiny; that colonialism is a violation of human rights; that self-determination is non-negotiable; and that African civilisation pre-dates European "civilisation." These ideas gave nationalists the theoretical language and emotional conviction for their campaigns.'},{q:'The main difference between the NCNC\'s national aspiration and its actual political base was:',o:['The NCNC aspired to be a national party but in practice drew most of its electoral support from the Igbo East','The NCNC aspired to a socialist state but in practice followed conservative economic policies','The NCNC aspired to immediate independence but in practice cooperated with gradual constitutional development','The NCNC aspired to a unitary state but in practice supported the federal structure'],a:1,w:'This is the fundamental tension in Nigerian nationalism: parties claimed national mandates but operated on ethnic-regional bases. The NCNC (Azikiwe\'s party) called itself "national" and pan-Nigerian — but its electoral stronghold was the Igbo East. The AG was nominally national but was a Yoruba party. The NPC made no pretence of national aspiration — explicitly representing northern interests. This gap between national rhetoric and ethnic reality defined First Republic politics.'},{q:'What does the career of Funmilayo Ransome-Kuti reveal about women\'s political participation in colonial Nigeria?',o:['That women had equal political rights to men throughout the colonial period','That women were entirely passive and could only act through male intermediaries','That women were politically active and capable of mass organisation and concrete political victories (the Alake\'s abdication; abolition of women\'s taxation in Abeokuta) — but were systematically excluded from formal political leadership despite their contributions','That only educated women from Lagos participated in colonial politics'],a:3,w:'Funmilayo\'s career demonstrates the paradox of women\'s colonial politics: she achieved real political victories (forced the Alake to abdicate temporarily 1949; abolished women\'s taxation in Abeokuta) through mass women\'s organisation. She was an international figure (met Mao, Khrushchev, Nkrumah). But women were largely excluded from formal party leadership, cabinet positions, and (in the North) even voting until 1979. Active and capable but systematically marginalised.'},{q:'What event is referred to by the phrase "Wild Wild West" in Nigerian political history?',o:['Widespread electoral violence following the disputed 1965 Western Region elections','A cowboy-themed cultural festival in Lagos','A military campaign against Cameroon','A drought crisis in the Western Region'],a:1,w:'"Wild Wild West" refers to the electoral violence following the disputed 1965 Western Region elections.'},{q:'What kind of contribution did Pan-Africanism make to Nigerian nationalism, according to this lesson?',o:['It provided intellectual frameworks such as shared destiny and self-determination','It provided direct military support','It provided financial loans from Ghana','It had no real influence on Nigerian nationalism'],a:1,w:'Pan-Africanism provided intellectual frameworks such as shared African destiny and self-determination.'},{q:'Despite aspiring to be a national party, where did the NCNC draw most of its actual electoral support from?',o:['The Igbo-dominated Eastern Region','The entire country equally','The Northern Region only','The Western Region only'],a:1,w:'Despite its national aspirations, the NCNC drew most support from the Igbo-dominated Eastern Region.'},{q:'What did Funmilayo Ransome-Kuti\'s career reveal about the limits placed on women in colonial-era Nigerian politics?',o:['Women could achieve real victories but were excluded from formal leadership','Women held equal formal political power to men','Women had no involvement in colonial-era politics','Women\'s activism began only after independence'],a:1,w:'Ransome-Kuti\'s career shows women achieved real political victories but remained excluded from formal leadership.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 POL',ti:'WAEC Prep — Final Colonial Review',su:'Final WAEC preparation on colonial administration.',steps:[
{lb:'25-mark essay structure',dr:dQ1,ht:'<p>25-mark WAEC essay structure for colonial administration: Introduction (3-4 sentences): state the topic; give historical context; state your main argument. Body (5-6 points, each paragraph): Point → Evidence → Explanation → Significance. Conclusion (2-3 sentences): summarise main argument; state overall legacy/judgment. Example: "Indirect Rule in Nigeria: Benefits and Problems." Intro: Lugard\'s system; 1900 onwards; overview of debate. Points: 1. Theory of indirect rule. 2. Success in North (Sokoto). 3. Failure in Igboland (Warrant Chiefs/Aba 1929). 4. Impact on educated elite (political exclusion → nationalism). 5. Legacy: ethnic divisions and North-South divide. Conclusion: mixed impact; worked in North but damaged south and entrenched divisions.</p>'},
{lb:'Synthesis question practice',dr:dQ2,ht:'<p>Synthesis question: "To what extent was colonial administration responsible for Nigeria\'s post-independence problems?" Responsible for: three-region structure → ethnic competition (Richards 1946 → First Republic collapse); indirect rule → North-South administrative divide (→ 1966 coups/civil war); export economy → oil dependence; Westminster model → 1966 coup (unsuitable for multi-ethnic reality); exclusion of educated elite → radicalised nationalism without experience of governance. Not solely responsible for: post-independence leaders\' own failures (election rigging; political violence; corruption); global Cold War pressures; oil price volatility (external factor). Conclusion: colonial administration created the structural conditions for post-independence problems, but Nigerian politicians also made choices that worsened those conditions.</p>'},
{lb:'Key quote analyses',dr:dQ1,ht:'<p>Key quote analyses: (1) "Marriage of inconvenience" (critics of 1914 Amalgamation): this phrase captures the fundamental tension — joining profoundly different peoples (Islamic hierarchical North; diverse decentralised South) without consent. The phrase predicted the post-independence conflicts. (2) "Show the light and the people will find the way" (Azikiwe/West African Pilot): captures his philosophy of journalism as enlightenment — education and information as the path to political consciousness and independence. (3) "The education of the masses is the sine qua non for any successful democratic government" (Azikiwe): explains why he prioritised journalism and later education; democracy without an educated citizenry is hollow. Know these for quotation-based WAEC questions.</p>'},
{lb:'WAEC final tips',dr:dQ2,ht:'<p>Final tips: (1) Memorise the constitutional timeline: 1914, 1922, 1946, 1951, 1954, 1960, 1963. (2) Know all key figures: Lugard (indirect rule/amalgamation); Macaulay (NNDP/nationalism/NCNC); Azikiwe (NCNC/1st President); Balewa (1st PM); Bello (NPC/Sardauna/killed 1966); Awolowo (AG/free education/imprisoned). (3) For indirect rule essays: discuss success (North) AND failure (Igboland/Aba 1929). (4) Always link colonial to post-independence: 3-region structure → ethnic competition; North-South divide → 1966 coups; export economy → oil dependence. (5) Dates and names score marks. (6) Evaluation (assess, to what extent, critically examine) requires both sides with a concluded judgment. (7) For women\'s history: always mention Aba 1929 AND Funmilayo Ransome-Kuti when discussing colonial resistance or nationalism.</p>'},
