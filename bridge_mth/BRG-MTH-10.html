<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reading Bar Charts, Pictograms & Line Graphs — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge Maths: Reading Bar Charts, Pictograms & Line Graphs</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Reading values from a bar chart", "teach": ["A bar chart shows values as the height (or length) of bars \u2014 read across from the top of the bar to the scale on the axis.", "Example: if a bar for 'Maths' reaches the 8 line, then 8 students chose Maths.", "Always check what the axis scale is counting in \u2014 sometimes it goes up in 2s, 5s, or 10s, not just 1s."], "yt_prompt": "How many students chose the subject asked about?"}, {"title": "Finding the most popular category", "teach": ["The most popular (or highest) category on a bar chart is simply the tallest bar.", "Example: with Maths=8, English=5, Science=10, Art=4 \u2014 Science is the tallest, so it's most popular.", "Compare all the values carefully before deciding, especially when two bars look close in height."], "yt_prompt": "Which subject was most popular?"}, {"title": "Finding the difference between two bars", "teach": ["To find the difference between two categories, subtract the smaller value from the larger one.", "Example: Science=10, Art=4 \u2192 difference = 10\u22124 = 6.", "Always subtract smaller from larger, so your answer is positive."], "yt_prompt": "Find the difference:"}, {"title": "Finding the total from a bar chart", "teach": ["To find a total, add up all the values shown across every category.", "Example: Maths=8, English=5, Science=10, Art=4 \u2192 total = 8+5+10+4 = 27.", "This is useful for finding the total number of students, votes, or items surveyed."], "yt_prompt": "Find the total (add all four values):"}, {"title": "Reading a pictogram", "teach": ["A pictogram uses repeated pictures/symbols to represent data \u2014 each symbol usually stands for more than one item (check the key!).", "Example: if the key says 'each = 2 students' and a row shows 3 symbols, that's 3\u00d72=6 students.", "Always check the key first before reading any values \u2014 this is the most common mistake with pictograms."], "yt_prompt": "Work out the value from the pictogram:"}, {"title": "Half symbols in a pictogram", "teach": ["Sometimes a pictogram shows half a symbol, representing half the usual value.", "Example: if each symbol = 10 students, a half symbol represents 5 students.", "Add whole symbols first, then add on the half-symbol value at the end."], "yt_prompt": "Work out the value from the pictogram:"}, {"title": "Reading values from a line graph", "teach": ["A line graph shows how a value changes over time \u2014 read across from a point on the line to the value on the y-axis.", "Example: if the line is at height 15 when x=3 (e.g. 3pm), the value at that time is 15.", "Line graphs are especially useful for showing trends (increasing, decreasing, or staying the same)."], "yt_prompt": "Read the value from the line graph:"}, {"title": "Describing a trend on a line graph", "teach": ["A trend describes whether values are generally going up, down, or staying flat over time.", "Example: if temperature rises from 10\u00b0C to 25\u00b0C across the day, the trend is 'increasing'.", "Look at the overall direction of the line, not just individual small wiggles."], "yt_prompt": "What is the trend in this data?"}, {"title": "Finding the range of a data set", "teach": ["The range is the difference between the highest and lowest values in a data set.", "Example: values 4, 8, 5, 10 \u2192 range = 10\u22124 = 6.", "Always find the highest and lowest first, then subtract."], "yt_prompt": "Find the range of this data set:"}, {"title": "Mixed data-handling practice", "teach": ["You've now covered bar charts, pictograms, line graphs, totals, differences, and range.", "These data-handling skills apply across many subjects, not just maths \u2014 reading charts carefully is a key life skill.", "This final question brings a couple of these ideas together."], "yt_prompt": "Find the difference between the highest and lowest bar:"}];
function ytGen_0() { const vals={Maths:Math.floor(Math.random()*10)+3, English:Math.floor(Math.random()*10)+3, Science:Math.floor(Math.random()*10)+3, Art:Math.floor(Math.random()*10)+3}; const subjects=Object.keys(vals); const pick=subjects[Math.floor(Math.random()*4)]; return {q:'', chart:{labels:subjects, values:subjects.map(s=>vals[s])}, answer:String(vals[pick]), prompt:`How many students chose ${pick}?`}; }
function ytGen_1() { const subjects=['Maths','English','Science','Art']; const nums=[3,5,7,9].sort(()=>Math.random()-0.5); const vals={}; subjects.forEach((s,i)=>vals[s]=nums[i]); const max=Math.max(...Object.values(vals)); const winner=subjects.find(k=>vals[k]===max); return {q:'', chart:{labels:subjects, values:subjects.map(s=>vals[s])}, answer:winner, prompt:'Which subject was most popular?'}; }
function ytGen_2() { const vals={Maths:Math.floor(Math.random()*10)+3, Science:Math.floor(Math.random()*10)+3}; const diff=Math.abs(vals.Maths-vals.Science); return {q:'', chart:{labels:['Maths','Science'], values:[vals.Maths,vals.Science]}, answer:String(diff), prompt:'What is the difference between them?'}; }
function ytGen_3() { const a=Math.floor(Math.random()*10)+3; const b=Math.floor(Math.random()*10)+3; const c=Math.floor(Math.random()*10)+3; const d=Math.floor(Math.random()*10)+3; return {q:'', chart:{labels:['Maths','English','Science','Art'], values:[a,b,c,d]}, answer:String(a+b+c+d), prompt:'What is the total across all four?'}; }
function ytGen_4() { const perSymbol=[2,5,10][Math.floor(Math.random()*3)]; const symbols=Math.floor(Math.random()*6)+2; return {q:'', pictogram:{perSymbol:perSymbol, wholeSymbols:symbols, hasHalf:false}, answer:String(perSymbol*symbols), prompt:`Key: each symbol = ${perSymbol} students. How many students does this row represent?`}; }
function ytGen_5() { const perSymbol=[4,6,10][Math.floor(Math.random()*3)]; const wholeSymbols=Math.floor(Math.random()*4)+1; return {q:'', pictogram:{perSymbol:perSymbol, wholeSymbols:wholeSymbols, hasHalf:true}, answer:String(perSymbol*wholeSymbols+perSymbol/2), prompt:`Key: each symbol = ${perSymbol} students. How many students total (including the half symbol)?`}; }
function ytGen_6() { const base=Math.floor(Math.random()*10)+10; const points=[base, base+Math.floor(Math.random()*8)+2, base+Math.floor(Math.random()*15)+5, base+Math.floor(Math.random()*10)+8]; const askIdx=Math.floor(Math.random()*4); return {q:'', lineGraph:{labels:['9am','11am','1pm','3pm'], values:points}, answer:String(points[askIdx]), prompt:`What is the temperature at ${['9am','11am','1pm','3pm'][askIdx]}?`}; }
function ytGen_7() { const trends=[[[10,15,20,25],'increasing'],[[30,26,22,18],'decreasing'],[[20,20,21,20],'flat']]; const p=trends[Math.floor(Math.random()*trends.length)]; return {q:'', lineGraph:{labels:['9am','11am','1pm','3pm'], values:p[0]}, answer:p[1], options:['increasing','decreasing','flat'], prompt:'What is the trend shown in this line graph?'}; }
function ytGen_8() { const vals=[]; for(let i=0;i<4;i++) vals.push(Math.floor(Math.random()*20)+1); const range=Math.max(...vals)-Math.min(...vals); return {q:vals.join(', '), answer:String(range)}; }
function ytGen_9() { const a=Math.floor(Math.random()*10)+3; const b=Math.floor(Math.random()*10)+3; const c=Math.floor(Math.random()*10)+3; const vals=[a,b,c]; const range=Math.max(...vals)-Math.min(...vals); return {q:'', chart:{labels:['Bar A','Bar B','Bar C'], values:vals}, answer:String(range), prompt:'What is the difference between the highest and lowest bar?'}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

// Pre-compute every correct answer in this topic, used as a distractor pool
// for non-numeric answers (sampled once per attempt via YT_GENS() calls below)
let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      // Distractors should stay the same sign as the correct answer — a
      // negative answer shouldn't get a positive distractor (or vice versa),
      // since that would be an unrelated, easy-to-spot wrong option rather
      // than a genuinely plausible mistake.
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+r\d+$/.test(ans)) {
    const [whole, rem] = ans.split('r').map(Number);
    const perturbs = [[whole+1,rem],[whole>1?whole-1:whole+2,rem],[whole,rem+1],[whole,rem>1?rem-1:rem+2]].sort(() => Math.random()-0.5);
    for (const [w,r] of perturbs) {
      if (w>0 && r>=0) {
        const c = `${w}r${r}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+ \d+\/\d+$/.test(ans)) {
    const [wholePart, fracPart] = ans.split(' ');
    const whole = Number(wholePart);
    const [numer, denom] = fracPart.split('/').map(Number);
    const perturbs = [[whole+1,numer,denom],[whole>1?whole-1:whole+2,numer,denom],[whole,numer+1,denom],[whole,numer>1?numer-1:numer+2,denom]].sort(() => Math.random()-0.5);
    for (const [w,n,d] of perturbs) {
      if (w>0 && n>0 && d>0 && n<d) {
        const c = `${w} ${n}/${d}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  }

  // Fill any remaining slots from the pool of other correct answers this topic
  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function renderBarChartSVG(labels, values) {
  const width = 320, height = 220, padding = 36, barGap = 14;
  const maxVal = Math.max(...values) * 1.15;
  const chartHeight = height - padding * 2;
  const barWidth = (width - padding * 2 - barGap * (values.length - 1)) / values.length;
  const colours = ['#C0272D', '#8f1d22', '#e05a5f', '#f0a3a6', '#C0272D'];
  let bars = '';
  values.forEach((v, i) => {
    const barHeight = (v / maxVal) * chartHeight;
    const x = padding + i * (barWidth + barGap);
    const y = height - padding - barHeight;
    bars += `
      <rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" fill="${colours[i % colours.length]}" rx="3"></rect>
      <text x="${x + barWidth/2}" y="${y - 6}" text-anchor="middle" font-size="13" font-weight="700" fill="#333">${v}</text>
      <text x="${x + barWidth/2}" y="${height - padding + 16}" text-anchor="middle" font-size="11" fill="#555">${labels[i]}</text>
    `;
  });
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;max-width:360px;height:auto;display:block;margin:0 auto">
    <line x1="${padding}" y1="${height-padding}" x2="${width-padding}" y2="${height-padding}" stroke="#ccc" stroke-width="1.5"></line>
    ${bars}
  </svg>`;
}

function renderPictogramSVG(perSymbol, wholeSymbols, hasHalf) {
  const iconSize = 34, gap = 8;
  let icons = '';
  for (let i = 0; i < wholeSymbols; i++) {
    const x = 20 + i * (iconSize + gap);
    icons += `<rect x="${x}" y="20" width="${iconSize}" height="${iconSize}" rx="6" fill="#C0272D"></rect>
      <text x="${x+iconSize/2}" y="${20+iconSize/2+6}" text-anchor="middle" font-size="16" fill="#fff">S</text>`;
  }
  if (hasHalf) {
    const x = 20 + wholeSymbols * (iconSize + gap);
    icons += `<clipPath id="halfclip"><rect x="${x}" y="20" width="${iconSize/2}" height="${iconSize}"></rect></clipPath>
      <rect x="${x}" y="20" width="${iconSize}" height="${iconSize}" rx="6" fill="#f0c9ca"></rect>
      <rect x="${x}" y="20" width="${iconSize}" height="${iconSize}" rx="6" fill="#C0272D" clip-path="url(#halfclip)"></rect>`;
  }
  const totalWidth = 40 + (wholeSymbols + (hasHalf?1:0)) * (iconSize + gap);
  return `<div style="text-align:center; margin:8px 0;">
    <svg viewBox="0 0 ${Math.max(totalWidth,200)} 80" style="width:100%;max-width:340px;height:auto;display:block;margin:0 auto">
      ${icons}
      <text x="20" y="70" font-size="12" fill="#666">Key: each full symbol = ${perSymbol} students${hasHalf ? ' (half symbol = ' + perSymbol/2 + ')' : ''}</text>
    </svg>
  </div>`;
}

function renderLineGraphSVG(labels, values) {
  const width = 320, height = 220, padding = 40;
  const minVal = Math.min(...values) - 3, maxVal = Math.max(...values) + 3;
  const range = maxVal - minVal;
  const stepX = (width - padding * 2) / (labels.length - 1);
  const points = values.map((v, i) => {
    const x = padding + i * stepX;
    const y = height - padding - ((v - minVal) / range) * (height - padding * 2);
    return { x, y, v };
  });
  const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ' ' + p.y).join(' ');
  let dots = points.map((p, i) => `
    <circle cx="${p.x}" cy="${p.y}" r="4" fill="#C0272D"></circle>
    <text x="${p.x}" y="${p.y - 10}" text-anchor="middle" font-size="12" font-weight="700" fill="#333">${p.v}°</text>
    <text x="${p.x}" y="${height - padding + 18}" text-anchor="middle" font-size="11" fill="#555">${labels[i]}</text>
  `).join('');
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;max-width:360px;height:auto;display:block;margin:8px auto">
    <line x1="${padding}" y1="${height-padding}" x2="${width-padding}" y2="${height-padding}" stroke="#ccc" stroke-width="1.5"></line>
    <path d="${pathD}" fill="none" stroke="#8f1d22" stroke-width="2.5"></path>
    ${dots}
  </svg>`;
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let visualHtml = '';
    if (currentYT.chart) visualHtml = renderBarChartSVG(currentYT.chart.labels, currentYT.chart.values);
    else if (currentYT.pictogram) visualHtml = renderPictogramSVG(currentYT.pictogram.perSymbol, currentYT.pictogram.wholeSymbols, currentYT.pictogram.hasHalf);
    else if (currentYT.lineGraph) visualHtml = renderLineGraphSVG(currentYT.lineGraph.labels, currentYT.lineGraph.values);
    const promptText = currentYT.prompt || q.yt_prompt;

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${promptText}</div>
        ${visualHtml}
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

// Precompute the answer pool once at load (using each question's first generated answer)
ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>

<script type="module">

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'BRG-MTH-10';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
    if (!topicRow) return;
    const { data: profRow } = await supabase.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
    if (!profRow) return;
    await supabase.from('walkthrough_interactions').insert({
      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
