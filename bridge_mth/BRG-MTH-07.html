<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Function Machines & Simple Equations — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge Maths: Function Machines & Simple Equations</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is a function machine?", "teach": ["A function machine takes an input number, applies one or more operations, and produces an output.", "Example: input \u2192 \u00d72 \u2192 +3 \u2192 output. If input = 4: 4\u00d72=8, then 8+3=11.", "Always apply the operations in the order shown, left to right."], "yt_prompt": "Work out the output:"}, {"title": "Function machines with subtraction", "teach": ["Function machines can use any operation, including subtraction \u2014 just apply them in order.", "Example: input \u2192 \u00d73 \u2192 \u22124 \u2192 output. If input=5: 5\u00d73=15, then 15\u22124=11.", "Be careful with the order \u2014 \u00d73 then \u22124 gives a different answer than \u22124 then \u00d73."], "yt_prompt": "Work out the output:"}, {"title": "Working backwards through a function machine", "teach": ["To find the input from the output, reverse each step and reverse each operation (+ becomes \u2212, \u00d7 becomes \u00f7).", "Example: output=11, machine was \u00d72 then +3 \u2192 reverse: 11\u22123=8, then 8\u00f72=4 \u2192 input was 4.", "Always reverse the order of the steps as well as the operations themselves."], "yt_prompt": "Work out the input:"}, {"title": "What is an equation?", "teach": ["An equation says two things are equal, using an '=' sign, and usually contains a letter representing an unknown number.", "Example: x + 7 = 12 means 'some number plus 7 equals 12'.", "Solving an equation means finding the value of the letter that makes it true."], "yt_prompt": "What value of x makes this equation true?"}, {"title": "Solving equations with subtraction", "teach": ["To solve x \u2212 a = b, add 'a' to both sides to isolate x.", "Example: x \u2212 5 = 8 \u2192 add 5 to both sides \u2192 x = 13.", "Whatever you do to one side of an equation, you must do to the other side too."], "yt_prompt": "What value of x makes this equation true?"}, {"title": "Solving equations with multiplication", "teach": ["To solve ax = b, divide both sides by 'a' to find x.", "Example: 3x = 15 \u2192 divide both sides by 3 \u2192 x = 5.", "Check your answer by substituting it back into the original equation."], "yt_prompt": "What value of x makes this equation true?"}, {"title": "Solving two-step equations", "teach": ["Some equations need two steps: first deal with the added/subtracted number, then the multiplied number.", "Example: 2x + 3 = 11 \u2192 subtract 3 from both sides (2x=8), then divide by 2 \u2192 x=4.", "Always undo addition/subtraction first, then multiplication/division \u2014 the reverse of BODMAS order."], "yt_prompt": "What value of x makes this equation true?"}, {"title": "Writing an equation from a word problem", "teach": ["Turn the words into maths symbols \u2014 look for phrases like 'add', 'times', 'is equal to'.", "Example: 'A number multiplied by 4, then add 3, gives 19' becomes 4x + 3 = 19.", "Once it's written as an equation, solve it using the same steps as before."], "yt_prompt": "Solve: A number multiplied by 3, then add 5, gives the total shown. What is the number?"}, {"title": "Checking your solution", "teach": ["Always substitute your answer back into the original equation to check it works.", "Example: if you found x=4 for 2x+3=11, check: 2\u00d74+3 = 8+3 = 11 \u2713 correct!", "This habit catches most mistakes before you move on."], "yt_prompt": "Solve and the check will be built into scoring \u2014 what value of x makes this true?"}, {"title": "Mixed practice \u2014 function machines and equations", "teach": ["Function machines and equations are two ways of looking at the same idea: applying operations to an unknown number.", "In Year 7, you'll move between these two representations often, so being confident with both matters.", "This last question brings the two together."], "yt_prompt": "What value of x makes this equation true?"}];
function ytGen_0() { const inp=Math.floor(Math.random()*8)+1; const mult=Math.floor(Math.random()*4)+2; const add=Math.floor(Math.random()*8)+1; return {q:`input=${inp} → ×${mult} → +${add} → output=?`, answer:String(inp*mult+add)}; }
function ytGen_1() { const inp=Math.floor(Math.random()*8)+3; const mult=Math.floor(Math.random()*4)+2; const sub=Math.floor(Math.random()*6)+1; return {q:`input=${inp} → ×${mult} → −${sub} → output=?`, answer:String(inp*mult-sub)}; }
function ytGen_2() { const inp=Math.floor(Math.random()*8)+1; const mult=Math.floor(Math.random()*4)+2; const add=Math.floor(Math.random()*8)+1; const out=inp*mult+add; return {q:`input=? → ×${mult} → +${add} → output=${out}`, answer:String(inp)}; }
function ytGen_3() { const x=Math.floor(Math.random()*15)+1; const add=Math.floor(Math.random()*15)+1; const total=x+add; return {q:`x + ${add} = ${total}`, answer:String(x)}; }
function ytGen_4() { const x=Math.floor(Math.random()*15)+10; const sub=Math.floor(Math.random()*8)+1; const total=x-sub; return {q:`x − ${sub} = ${total}`, answer:String(x)}; }
function ytGen_5() { const a=Math.floor(Math.random()*6)+2; const x=Math.floor(Math.random()*10)+1; const total=a*x; return {q:`${a}x = ${total}`, answer:String(x)}; }
function ytGen_6() { const a=Math.floor(Math.random()*4)+2; const x=Math.floor(Math.random()*8)+1; const b=Math.floor(Math.random()*8)+1; const total=a*x+b; return {q:`${a}x + ${b} = ${total}`, answer:String(x)}; }
function ytGen_7() { const x=Math.floor(Math.random()*10)+1; const total=3*x+5; return {q:`3x + 5 = ${total}`, answer:String(x)}; }
function ytGen_8() { const a=Math.floor(Math.random()*3)+2; const x=Math.floor(Math.random()*6)+2; const b=Math.floor(Math.random()*6)+1; const total=a*x-b; return {q:`${a}x − ${b} = ${total}`, answer:String(x)}; }
function ytGen_9() { const x=Math.floor(Math.random()*8)+2; const total=2*x+4; return {q:`2x + 4 = ${total}`, answer:String(x)}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

// Pre-compute every correct answer in this topic, used as a distractor pool
// for non-numeric answers (sampled once per attempt via YT_GENS() calls below)
let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      // Distractors should stay the same sign as the correct answer — a
      // negative answer shouldn't get a positive distractor (or vice versa),
      // since that would be an unrelated, easy-to-spot wrong option rather
      // than a genuinely plausible mistake.
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+r\d+$/.test(ans)) {
    const [whole, rem] = ans.split('r').map(Number);
    const perturbs = [[whole+1,rem],[whole>1?whole-1:whole+2,rem],[whole,rem+1],[whole,rem>1?rem-1:rem+2]].sort(() => Math.random()-0.5);
    for (const [w,r] of perturbs) {
      if (w>0 && r>=0) {
        const c = `${w}r${r}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+ \d+\/\d+$/.test(ans)) {
    const [wholePart, fracPart] = ans.split(' ');
    const whole = Number(wholePart);
    const [numer, denom] = fracPart.split('/').map(Number);
    const perturbs = [[whole+1,numer,denom],[whole>1?whole-1:whole+2,numer,denom],[whole,numer+1,denom],[whole,numer>1?numer-1:numer+2,denom]].sort(() => Math.random()-0.5);
    for (const [w,n,d] of perturbs) {
      if (w>0 && n>0 && d>0 && n<d) {
        const c = `${w} ${n}/${d}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  }

  // Fill any remaining slots from the pool of other correct answers this topic
  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    // Some questions supply their own explicit options (e.g. category-style
    // answers like increasing/decreasing/flat, where auto-generated distractors
    // from unrelated numeric answers elsewhere in the topic wouldn't make sense)
    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

// Precompute the answer pool once at load (using each question's first generated answer)
ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
