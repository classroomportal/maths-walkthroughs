<script>
const QUESTIONS = [{"title": "Column addition \u2014 no carrying", "teach": ["Line up numbers by place value, units under units, tens under tens.", "Add each column separately starting from the units (right-hand side).", "Example: 4,213 + 1,532<br><br><div style=\"font-family:'Courier New',monospace;font-size:1.2rem;line-height:1.7;white-space:pre;display:inline-block\">  4213\n+ 1532\n\u2500\u2500\u2500\u2500\u2500\u2500</div><br><br>Units 3+2=5, tens 1+3=4, hundreds 2+5=7, thousands 4+1=5 \u2192 5,745."], "yt_prompt": "Work out the answer:"}, {"title": "Column addition \u2014 with carrying", "teach": ["When a column adds to 10 or more, write down the units digit and carry the ten into the next column.", "Example: 4,672 + 1,839<br><br><div style=\"font-family:'Courier New',monospace;font-size:1.2rem;line-height:1.7;white-space:pre;display:inline-block\">  4672\n+ 1839\n\u2500\u2500\u2500\u2500\u2500\u2500</div><br><br>Units 2+9=11, write 1 carry 1 \u2192 tens 7+3+1=11, write 1 carry 1 \u2192 hundreds 6+8+1=15, write 5 carry 1 \u2192 thousands 4+1+1=6 \u2192 6,511.", "Always work right to left, and don't forget to add any carried digit into the next column."], "yt_prompt": "Work out the answer:"}, {"title": "Column subtraction \u2014 no borrowing", "teach": ["Line the numbers up the same way as addition, then subtract each column from right to left.", "Example: 8,946 \u2212 2,314<br><br><div style=\"font-family:'Courier New',monospace;font-size:1.2rem;line-height:1.7;white-space:pre;display:inline-block\">  8946\n- 2314\n\u2500\u2500\u2500\u2500\u2500\u2500</div><br><br>Units 6\u22124=2, tens 4\u22121=3, hundreds 9\u22123=6, thousands 8\u22122=6 \u2192 6,632.", "Check your answer by adding the result to the number you subtracted \u2014 you should get back the original."], "yt_prompt": "Work out the answer:"}, {"title": "Column subtraction \u2014 with borrowing", "teach": ["When the top digit is smaller than the bottom digit, borrow 10 from the next column to the left.", "Example: 6,003 \u2212 2,847. Units: 3\u22127 needs borrowing \u2014 but the tens AND hundreds digits are both 0, so the borrow has to chain all the way back from the thousands digit.<br><br>Thousands: 6 becomes 5 (lends 1). Hundreds: 0 becomes 10, then lends 1 to tens, leaving 9. Tens: becomes 10, then lends 1 to units, leaving 9. Units: 3 becomes 13.<br><br>Now subtract each column, right to left: units 13\u22127=6, tens 9\u22124=5, hundreds 9\u22128=1, thousands 5\u22122=3 \u2192 answer 3,156.", "This is the trickiest column method \u2014 when you hit a 0, keep borrowing further left until you find a digit you can actually take 1 from."], "yt_prompt": "Work out the answer:"}, {"title": "Long multiplication \u2014 multiplying by a single digit", "teach": ["Multiply each digit of the larger number by the single digit, working right to left, carrying as needed \u2014 just like column addition but with multiplication.", "Example: 234 \u00d7 6 \u2192 4\u00d76=24 (write 4, carry 2), 3\u00d76=18+2=20 (write 0, carry 2), 2\u00d76=12+2=14 \u2192 1,404.", "Estimate first (234 is about 200, \u00d76 is about 1,200) so you can sanity-check your final answer."], "yt_prompt": "Work out the answer:"}, {"title": "Long multiplication \u2014 two digits by two digits", "teach": ["Break the second number into tens and units, multiply separately, then add the results.", "Example: 23 \u00d7 14 = (23\u00d710) + (23\u00d74) = 230 + 92 = 322.", "This 'partitioning' method works for any size number \u2014 it's the same idea behind the full grid/column method."], "yt_prompt": "Work out the answer:"}, {"title": "Short division \u2014 no remainder", "teach": ["Divide starting from the left-most digit, carrying any remainder into the next digit.", "Example: 846 \u00f7 6 \u2192 8\u00f76=1 remainder 2, bring down 4 \u2192 24\u00f76=4, bring down 6 \u2192 6\u00f76=1 \u2192 answer 141.", "Check by multiplying your answer by the divisor \u2014 it should give back the original number."], "yt_prompt": "Work out the answer:"}, {"title": "Short division \u2014 with a remainder", "teach": ["Sometimes a division doesn't divide exactly \u2014 whatever is left over at the end is the remainder.", "Example: 149 \u00f7 6 = 24 remainder 5, because 24\u00d76=144 and 149\u2212144=5.", "Write remainders as 'r' followed by the number, e.g. 24r5."], "yt_prompt": "Work out the answer:"}, {"title": "Order of operations (BODMAS)", "teach": ["When a calculation has more than one operation, follow the order: Brackets, Orders (powers), Division/Multiplication, Addition/Subtraction.", "Example: 3 + 4 \u00d7 5 \u2192 do the multiplication first (4\u00d75=20), then add 3 \u2192 23. Not 7\u00d75=35!", "Always scan for brackets first, then powers, then multiply/divide, then add/subtract, working left to right within each level."], "yt_prompt": "Work out the answer using BODMAS:"}, {"title": "Mixed four-operations word problem", "teach": ["Real problems often need more than one operation \u2014 read carefully to work out which order to use them in.", "Example: 'A shop has 240 sweets, packed into bags of 8. How many bags are needed?' \u2192 this is a division problem: 240 \u00f7 8 = 30 bags.", "Always underline the numbers and the operation words (share, total, difference, product) before calculating."], "yt_prompt": "Solve the word problem:"}];
function colStack(a,b,op) {
  const as=String(a), bs=String(b);
  const w=Math.max(as.length,bs.length)+2;
  const pad=s=>s.padStart(w,' ');
  const line='─'.repeat(w);
  return `<div style="font-family:'Courier New',monospace;font-size:1.3rem;line-height:1.75;white-space:pre;text-align:left;display:inline-block">${pad(as)}\n${op}${pad(bs).slice(1)}\n${line}</div>`;
}
function colDiv(divisor,dividend) {
  const ds=String(dividend);
  const line='_'.repeat(ds.length+2);
  return `<div style="font-family:'Courier New',monospace;font-size:1.3rem;line-height:1.75;white-space:pre;text-align:left;display:inline-block">   ${line}\n${divisor} ) ${ds}</div>`;
}
function exprBox(expr) {
  return `<div style="font-family:'Courier New',monospace;font-size:1.3rem;padding:8px 16px;border:1px dashed #bbb;border-radius:6px;display:inline-block">${expr}</div>`;
}
function noCarryPair() {
  const a = Math.floor(Math.random()*9000)+1000;
  const da = String(a).split('').map(Number);
  const db = da.map(d => Math.floor(Math.random()*(9-d+1)));
  const b = parseInt(db.join(''),10);
  return {a,b};
}
function withCarryPair() {
  let da=[], db=[];
  const carryPos = Math.floor(Math.random()*4);
  for (let i=0;i<4;i++) {
    if (i===carryPos) {
      const x=Math.floor(Math.random()*5)+5;
      const y=Math.floor(Math.random()*5)+5;
      da.push(x); db.push(y);
    } else {
      da.push(Math.floor(Math.random()*10));
      db.push(Math.floor(Math.random()*10));
    }
  }
  if (da[0]===0) da[0]=Math.floor(Math.random()*9)+1;
  if (db[0]===0) db[0]=Math.floor(Math.random()*9)+1;
  return {a:parseInt(da.join(''),10), b:parseInt(db.join(''),10)};
}
function noBorrowPair() {
  const a = Math.floor(Math.random()*9000)+1000;
  const da = String(a).split('').map(Number);
  const db = da.map(d => Math.floor(Math.random()*(d+1)));
  const b = parseInt(db.join(''),10);
  return {a,b};
}
function withBorrowPair() {
  let a, b;
  do {
    let da=new Array(4), db=new Array(4);
    const borrowPos = Math.floor(Math.random()*4);
    for (let i=0;i<4;i++) {
      if (i===borrowPos) {
        const x = (i===0) ? Math.floor(Math.random()*4)+1 : Math.floor(Math.random()*5);
        const y = Math.min(x + Math.floor(Math.random()*5) + 1, 9);
        da[i]=x; db[i]=y;
      } else {
        let x = Math.floor(Math.random()*10);
        let y = Math.floor(Math.random()*(x+1));
        if (i===0 && x===0) { x=Math.floor(Math.random()*9)+1; y=Math.floor(Math.random()*(x+1)); }
        da[i]=x; db[i]=y;
      }
    }
    a=parseInt(da.join(''),10); b=parseInt(db.join(''),10);
  } while (a<=b);
  return {a,b};
}
function ytGen_0() { const {a,b}=noCarryPair(); return {q:colStack(a,b,'+'), answer:String(a+b)}; }
function ytGen_1() { const {a,b}=withCarryPair(); return {q:colStack(a,b,'+'), answer:String(a+b)}; }
function ytGen_2() { const {a,b}=noBorrowPair(); return {q:colStack(a,b,'−'), answer:String(a-b)}; }
function ytGen_3() { const {a,b}=withBorrowPair(); return {q:colStack(a,b,'−'), answer:String(a-b)}; }
function ytGen_4() { const a=Math.floor(Math.random()*800)+100; const b=Math.floor(Math.random()*7)+2; return {q:colStack(a,b,'×'), answer:String(a*b)}; }
function ytGen_5() { const a=Math.floor(Math.random()*70)+15; const b=Math.floor(Math.random()*70)+15; return {q:colStack(a,b,'×'), answer:String(a*b)}; }
function ytGen_6() { const ans=Math.floor(Math.random()*80)+20; const d=Math.floor(Math.random()*7)+2; const n=ans*d; return {q:colDiv(d,n), answer:String(ans)}; }
function ytGen_7() { const d=Math.floor(Math.random()*6)+3; const whole=Math.floor(Math.random()*40)+10; const rem=Math.floor(Math.random()*(d-1))+1; const n=whole*d+rem; return {q:colDiv(d,n), answer:`${whole}r${rem}`}; }
function ytGen_8() { const a=Math.floor(Math.random()*8)+2; const b=Math.floor(Math.random()*8)+2; const c=Math.floor(Math.random()*8)+2; return {q:exprBox(`${a} + ${b} × ${c}`), answer:String(a+b*c)}; }
function ytGen_9() { const bags=Math.floor(Math.random()*20)+10; const each=Math.floor(Math.random()*8)+4; const total=bags*each; return {q:`A shop has ${total} sweets, packed into bags of ${each}. How many bags are there?<br><br>${colDiv(each,total)}`, answer:String(bags)}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

// Pre-compute every correct answer in this topic, used as a distractor pool
// for non-numeric answers (sampled once per attempt via YT_GENS() calls below)
let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      // Distractors should stay the same sign as the correct answer — a
      // negative answer shouldn't get a positive distractor (or vice versa),
      // since that would be an unrelated, easy-to-spot wrong option rather
      // than a genuinely plausible mistake.
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+r\d+$/.test(ans)) {
    const [whole, rem] = ans.split('r').map(Number);
    const perturbs = [[whole+1,rem],[whole>1?whole-1:whole+2,rem],[whole,rem+1],[whole,rem>1?rem-1:rem+2]].sort(() => Math.random()-0.5);
    for (const [w,r] of perturbs) {
      if (w>0 && r>=0) {
        const c = `${w}r${r}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+ \d+\/\d+$/.test(ans)) {
    const [wholePart, fracPart] = ans.split(' ');
    const whole = Number(wholePart);
    const [numer, denom] = fracPart.split('/').map(Number);
    const perturbs = [[whole+1,numer,denom],[whole>1?whole-1:whole+2,numer,denom],[whole,numer+1,denom],[whole,numer>1?numer-1:numer+2,denom]].sort(() => Math.random()-0.5);
    for (const [w,n,d] of perturbs) {
      if (w>0 && n>0 && d>0 && n<d) {
        const c = `${w} ${n}/${d}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  }

  // Fill any remaining slots from the pool of other correct answers this topic
  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    // Some questions supply their own explicit options (e.g. category-style
    // answers like increasing/decreasing/flat, where auto-generated distractors
    // from unrelated numeric answers elsewhere in the topic wouldn't make sense)
    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

// Precompute the answer pool once at load (using each question's first generated answer)
ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>

      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
</script>
