<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Statistics & Probability — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge Maths (Y12 WAEC): Statistics & Probability</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Mean, median, mode recap", "teach": ["Mean = sum of values \u00f7 count. Median = middle value when ordered. Mode = most frequent value.", "Example: for 4, 7, 7, 9, 12 \u2014 mean=(4+7+7+9+12)/5=7.8, median=7, mode=7.", "Always order the data first before finding the median."], "yt_prompt": "Find the mean:"}, {"title": "Mean from a frequency table", "teach": ["To find the mean from a frequency table: multiply each value by its frequency, sum these, then divide by total frequency.", "Example: values 5,6,7 with frequencies 2,3,1 \u2192 (5\u00d72+6\u00d73+7\u00d71)/(2+3+1) = 35/6 \u2248 5.83.", "Always double-check your total frequency (denominator) before dividing."], "yt_prompt": "Find the mean (to 2 d.p. if needed):"}, {"title": "Range and quartiles", "teach": ["Range = highest value \u2212 lowest value, a simple measure of spread.", "Quartiles divide ordered data into four equal parts; the median is the second quartile.", "The interquartile range (upper quartile \u2212 lower quartile) shows the spread of the middle 50% of data."], "yt_prompt": "Find the range:"}, {"title": "Simple probability", "teach": ["Probability = number of favourable outcomes \u00f7 total number of possible outcomes.", "Example: probability of rolling an even number on a die = 3/6 = 1/2.", "Probability is always between 0 (impossible) and 1 (certain)."], "yt_prompt": "Work out the probability (as a fraction):"}, {"title": "Probability of combined independent events", "teach": ["For independent events, multiply the individual probabilities.", "Example: probability of two coin flips both being heads = 1/2 \u00d7 1/2 = 1/4.", "Independence means the outcome of one event doesn't affect the other."], "yt_prompt": "Work out the combined probability (as a fraction):"}, {"title": "Probability without replacement", "teach": ["When an item is removed and not replaced, recalculate the total for the next pick.", "Example: bag has 4 red, 3 blue. P(red then red, no replacement) = 4/7 \u00d7 3/6 = 12/42 = 2/7.", "Always adjust BOTH the numerator and denominator for the second event."], "yt_prompt": "Work out the probability (as a fraction, simplified):"}, {"title": "Reading pie charts", "teach": ["A pie chart shows data as proportional slices of a circle, with the whole circle representing 360\u00b0 or 100%.", "To find a value's proportion: (slice angle \u00f7 360\u00b0) \u00d7 total, or (slice % \u00f7 100) \u00d7 total.", "Always check whether the pie chart is labelled in degrees or percentages before calculating."], "yt_prompt": "Find the value represented by this slice:"}, {"title": "Cumulative frequency", "teach": ["Cumulative frequency is a running total of frequencies, used to estimate the median and quartiles from grouped data.", "Example: frequencies 4, 7, 5, 4 give cumulative frequencies 4, 11, 16, 20.", "The final cumulative frequency value always equals the total number of data points."], "yt_prompt": "Find the cumulative frequency up to and including this class:"}, {"title": "Standard deviation (introduction)", "teach": ["Standard deviation measures how spread out data is from the mean \u2014 a small value means data is clustered close to the mean.", "It's calculated using the differences between each value and the mean, squared, averaged, then square-rooted.", "At this level, focus on interpreting standard deviation values rather than calculating them by hand."], "yt_prompt": "Which data set has a SMALLER standard deviation (less spread)?"}, {"title": "Mixed practice", "teach": ["You've now covered averages, probability (simple, combined, and without replacement), and reading statistical charts.", "Statistics & Probability is heavily tested in WAEC, often through real-world data interpretation questions.", "Always read data questions carefully \u2014 misreading a table or chart is the most common source of errors."], "yt_prompt": "Work out the probability (as a fraction):"}];
function ytGen_0() { const n=5; const vals=Array.from({length:n},()=>Math.floor(Math.random()*20)+1); const sum=vals.reduce((a,b)=>a+b,0); const mean=sum/n; return {q:vals.join(', '), answer:Number.isInteger(mean)?String(mean):mean.toFixed(1)}; }
function ytGen_1() { const vals=[5,6,7]; const freqs=[Math.floor(Math.random()*4)+2,Math.floor(Math.random()*4)+2,Math.floor(Math.random()*4)+2]; const total=freqs.reduce((a,b)=>a+b,0); const sum=vals.reduce((s,v,i)=>s+v*freqs[i],0); const mean=sum/total; return {q:vals.map((v,i)=>`${v}→${freqs[i]}`).join(', '), answer:Number.isInteger(mean)?String(mean):mean.toFixed(2)}; }
function ytGen_2() { const vals=Array.from({length:6},()=>Math.floor(Math.random()*30)+1); const range=Math.max(...vals)-Math.min(...vals); return {q:vals.join(', '), answer:String(range)}; }
function ytGen_3() { const opts=[['rolling an even number on a die','1/2'],['rolling a number greater than 4 on a die','1/3'],['picking a heart from a deck (13/52)','1/4']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_4() { const pairs=[[1,2,1,2,'1/4'],[1,3,1,3,'1/9'],[1,2,1,3,'1/6']]; const [n1,d1,n2,d2,ans]=pairs[Math.floor(Math.random()*pairs.length)]; return {q:`P(A)=${n1}/${d1}, P(B)=${n2}/${d2}, independent`, answer:ans}; }
function ytGen_5() { const pairs=[[4,3,'2/7'],[5,2,'2/7'],[6,3,'5/12']]; const [red,blue,ans]=pairs[Math.floor(Math.random()*pairs.length)]; return {q:`Bag: ${red} red, ${blue} blue. P(red then red, no replacement)`, answer:ans}; }
function ytGen_6() { const total=(Math.floor(Math.random()*10)+5)*20; const deg=[90,120,60,180][Math.floor(Math.random()*4)]; const value=Math.round((deg/360)*total); return {q:`Pie chart slice = ${deg}°, total = ${total}`, answer:String(value)}; }
function ytGen_7() { const freqs=[4,7,5,4]; const upTo=Math.floor(Math.random()*4); const cum=freqs.slice(0,upTo+1).reduce((a,b)=>a+b,0); return {q:`Frequencies: ${freqs.join(', ')}. Cumulative up to class ${upTo+1}`, answer:String(cum)}; }
function ytGen_8() { const opts=['Set A: 10, 11, 9, 10, 10 (close together)','Set B: 2, 18, 5, 20, 3 (spread out)']; return {q:'Which is less spread out?', options:opts, answer:opts[0]}; }
function ytGen_9() { const opts=[['rolling an even number on a die','1/2'],['rolling a number greater than 4 on a die','1/3']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }

const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^-?\d+\.\d+$/.test(ans)) {
    const num = parseFloat(ans);
    const decimals = (ans.split('.')[1]||'').length;
    const deltas = [0.1,-0.1,0.01,-0.01,1,-1,0.5,-0.5].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = (num + d).toFixed(decimals);
      if (c !== ans && !candidates.includes(c)) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+%$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [5,-5,10,-10,2,-2,1,-1].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d) + '%';
      if (c !== ans && !candidates.includes(c) && (num+d) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  }

  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
