<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Direct & Inverse Proportion — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge Maths (Y9): Direct & Inverse Proportion</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is direct proportion?", "teach": ["Two quantities are directly proportional if they increase or decrease together at the same rate \u2014 double one, and the other doubles too.", "This is written y \u221d x, meaning y = kx for some constant k.", "Example: if 3 books cost \u20a6900, then 6 books (double) cost \u20a61,800 (double)."], "yt_prompt": "Is this direct proportion?"}, {"title": "Finding the constant of proportionality", "teach": ["If y is directly proportional to x, find k using k = y \u00f7 x from one known pair of values.", "Example: if y=20 when x=5, then k = 20\u00f75 = 4, so y = 4x for all values.", "Once you know k, you can find y for ANY value of x by substituting into y = kx."], "yt_prompt": "Find the constant of proportionality (k):"}, {"title": "Using direct proportion to find new values", "teach": ["Once you have y = kx, substitute in the new x value to find the matching y value.", "Example: if y = 4x, and x = 8, then y = 4 \u00d7 8 = 32.", "Always find k first using the given pair, then use it for the new calculation."], "yt_prompt": "Find y when x changes:"}, {"title": "What is inverse proportion?", "teach": ["Two quantities are inversely proportional if one increases as the other decreases \u2014 double one, and the other halves.", "This is written y \u221d 1/x, meaning y = k/x, so xy = k (constant) for all pairs.", "Example: more workers means less time needed \u2014 that's inverse proportion."], "yt_prompt": "Is this inverse proportion?"}, {"title": "Finding the constant for inverse proportion", "teach": ["For inverse proportion, find k using k = x \u00d7 y from one known pair of values.", "Example: if x=4 and y=15, then k = 4\u00d715 = 60, so xy = 60 for all pairs.", "This constant k stays the same throughout the whole problem."], "yt_prompt": "Find the constant (k = x \u00d7 y):"}, {"title": "Using inverse proportion to find new values", "teach": ["Once you know k = xy, find a new y value using y = k \u00f7 (new x).", "Example: if xy = 60, and the new x = 10, then y = 60 \u00f7 10 = 6.", "Remember: as x gets bigger, y gets SMALLER in inverse proportion \u2014 the opposite of direct proportion."], "yt_prompt": "Find the new value:"}, {"title": "Workers and time (classic inverse proportion)", "teach": ["More workers complete a job faster \u2014 this is a classic inverse proportion context.", "Method: multiply workers \u00d7 time to get the constant (total 'worker-days'), then divide by the new number of workers.", "Example: 6 workers take 10 days \u2192 60 worker-days. With 12 workers: 60 \u00f7 12 = 5 days."], "yt_prompt": "How many days will it take?"}, {"title": "Speed, distance and time", "teach": ["For a fixed distance, speed and time are inversely proportional \u2014 faster speed means less time.", "Method: multiply speed \u00d7 time to get the constant distance, then divide by the new speed (or time).", "Example: at 60km/h a journey takes 2 hours (120km). At 80km/h: 120 \u00f7 80 = 1.5 hours."], "yt_prompt": "How long will the journey take (in hours)?"}, {"title": "Recognising direct vs inverse proportion", "teach": ["Direct proportion: both quantities increase together (e.g. cost and quantity bought).", "Inverse proportion: one increases as the other decreases (e.g. speed and time for a fixed distance).", "Always read the context carefully \u2014 the wording tells you which type of proportion applies."], "yt_prompt": "Is this direct or inverse proportion?"}, {"title": "Mixed practice", "teach": ["You've now covered both direct proportion (y = kx) and inverse proportion (y = k/x).", "The key skill in both cases is finding the constant k first, then using it to answer the actual question.", "Always double check: did the quantities increase together (direct), or does one go up as the other goes down (inverse)?"], "yt_prompt": "Find the new value:"}];
function ytGen_0() { const opts=[['5 books cost ₦500, 10 books cost ₦1,000','Yes'],['6 workers take 4 days, 12 workers take 2 days','No'],['3kg costs ₦300, 6kg costs ₦600','Yes']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Yes','No'], answer:p[1]}; }
function ytGen_1() { const k=Math.floor(Math.random()*8)+2; const x=Math.floor(Math.random()*8)+2; const y=k*x; return {q:`y=${y} when x=${x}`, answer:String(k)}; }
function ytGen_2() { const k=Math.floor(Math.random()*8)+2; const x1=Math.floor(Math.random()*6)+2; const x2=Math.floor(Math.random()*10)+3; const y1=k*x1; return {q:`y is proportional to x. y=${y1} when x=${x1}. Find y when x=${x2}.`, answer:String(k*x2)}; }
function ytGen_3() { const opts=[['8 workers finish in 3 days, 4 workers finish in 6 days','Yes'],['5 pens cost ₦250, 10 pens cost ₦500','No'],['Faster speed means shorter journey time','Yes']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Yes','No'], answer:p[1]}; }
function ytGen_4() { const x=Math.floor(Math.random()*8)+2; const y=Math.floor(Math.random()*10)+3; return {q:`x=${x}, y=${y}`, answer:String(x*y)}; }
function ytGen_5() { const k=(Math.floor(Math.random()*8)+3)*(Math.floor(Math.random()*8)+3); const newX=Math.floor(Math.random()*8)+2; return {q:`xy=${k}. Find y when x=${newX}.`, answer:String(Math.round(k/newX*10)/10)}; }
function ytGen_6() { const workers1=Math.floor(Math.random()*6)+4; const days1=Math.floor(Math.random()*8)+4; const total=workers1*days1; const workers2=Math.floor(Math.random()*6)+4; return {q:`${workers1} workers take ${days1} days. How many days for ${workers2} workers?`, answer:String(Math.round(total/workers2*10)/10)}; }
function ytGen_7() { const speed1=[40,50,60,80][Math.floor(Math.random()*4)]; const time1=[1,1.5,2,3][Math.floor(Math.random()*4)]; const dist=speed1*time1; const speed2=[40,50,60,80,100][Math.floor(Math.random()*5)]; return {q:`At ${speed1}km/h, journey takes ${time1}hrs. At ${speed2}km/h?`, answer:String(Math.round(dist/speed2*100)/100)}; }
function ytGen_8() { const opts=[['Number of workers and time to finish a job','Inverse'],['Number of items bought and total cost','Direct'],['Speed and time for a fixed distance','Inverse'],['Hours worked and total pay','Direct']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Direct','Inverse'], answer:p[1]}; }
function ytGen_9() { const k=Math.floor(Math.random()*8)+2; const x1=Math.floor(Math.random()*6)+2; const x2=Math.floor(Math.random()*10)+3; const y1=k*x1; return {q:`y is proportional to x. y=${y1} when x=${x1}. Find y when x=${x2}.`, answer:String(k*x2)}; }

const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^-?\d+\.\d+$/.test(ans)) {
    const num = parseFloat(ans);
    const decimals = (ans.split('.')[1]||'').length;
    const deltas = [0.1,-0.1,0.01,-0.01,1,-1,0.5,-0.5].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = (num + d).toFixed(decimals);
      if (c !== ans && !candidates.includes(c)) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+%$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [5,-5,10,-10,2,-2,1,-1].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d) + '%';
      if (c !== ans && !candidates.includes(c) && (num+d) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  }

  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
