<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Averages from Frequency Tables & Scatter Graphs — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge Maths (Y9): Frequency Tables & Scatter Graphs</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Reading a frequency table", "teach": ["A frequency table shows how many times each value occurs. The 'frequency' column tells you the count for each value.", "Example: if 5 students scored 60 and 8 scored 70, the frequency for 60 is 5 and for 70 is 8.", "Always check what each row actually represents before doing any calculations with the table."], "yt_prompt": "How many students scored the value shown?"}, {"title": "Finding the mode from a frequency table", "teach": ["The mode from a frequency table is the value with the HIGHEST frequency \u2014 not the highest value itself.", "Example: if 60 has frequency 5, 70 has frequency 8, and 80 has frequency 4, the mode is 70 (highest frequency).", "Don't confuse 'the biggest number' with 'the number that appears the most' \u2014 they're often different."], "yt_prompt": "Find the mode:"}, {"title": "Finding the total frequency (total count)", "teach": ["To find the total number of data points, add up all the frequencies in the table.", "Example: frequencies of 5, 8, 4, 3 add up to a total of 20 data points.", "You'll need this total for calculating the mean, so always find it first."], "yt_prompt": "Find the total frequency:"}, {"title": "Calculating the mean from a frequency table", "teach": ["To find the mean: multiply each value by its frequency, add all these products together, then divide by the total frequency.", "Example: (60\u00d75 + 70\u00d78 + 80\u00d74 + 90\u00d73) \u00f7 20 = (300+560+320+270) \u00f7 20 = 1,450 \u00f7 20 = 72.5.", "This weighted approach accounts for values that occur more often pulling the mean towards them."], "yt_prompt": "Find the mean:"}, {"title": "Finding the median from a frequency table", "teach": ["To find the median position, use (total frequency + 1) \u00f7 2, then count through the cumulative frequencies to find which value that position falls in.", "Example: total = 20, so median position = 10.5th value \u2192 count through the frequencies to find which group contains the 10th/11th values.", "This is more involved than a simple list \u2014 track the running (cumulative) total as you go."], "yt_prompt": "Which value does the median fall in?"}, {"title": "Plotting points on a scatter graph", "teach": ["A scatter graph plots pairs of related values as points, to explore whether there's a relationship between them.", "Each point represents one pair of values \u2014 read the x-coordinate first, then the y-coordinate.", "Scatter graphs are used to explore correlation, such as between hours studied and test scores."], "yt_prompt": "What are the coordinates of the point described?"}, {"title": "Types of correlation", "teach": ["Positive correlation: as one variable increases, so does the other (points trend upward left-to-right).", "Negative correlation: as one variable increases, the other decreases (points trend downward left-to-right).", "No correlation: there's no clear pattern between the two variables \u2014 points are scattered randomly."], "yt_prompt": "What type of correlation does this describe?"}, {"title": "Line of best fit", "teach": ["A line of best fit is drawn through scattered points to show the general trend, with roughly equal points above and below the line.", "It should NOT necessarily pass through every point \u2014 it represents the overall pattern, not each individual value.", "You can use the line of best fit to estimate values that weren't directly measured."], "yt_prompt": "True or false: a line of best fit must pass through every point."}, {"title": "Using a line of best fit to estimate", "teach": ["To estimate a value using a line of best fit, find the known value on one axis, trace to the line, then read off the other axis.", "This method only gives an ESTIMATE, not an exact answer \u2014 real data doesn't always follow the line perfectly.", "Be cautious estimating far beyond the range of the original data \u2014 the pattern may not continue."], "yt_prompt": "Using the described trend, estimate the value:"}, {"title": "Mixed practice", "teach": ["You've now covered reading frequency tables, calculating mean/mode/median from grouped data, and interpreting scatter graphs.", "Both skills involve careful reading before calculating \u2014 misreading the table or graph is the most common mistake.", "Take your time setting out frequency table calculations in a clear column format to avoid errors."], "yt_prompt": "Find the mean:"}];
function ytGen_0() { const vals=[60,70,80,90]; const freqs=[5,8,4,3]; const i=Math.floor(Math.random()*4); return {q:`Value ${vals[i]} in table: 60→5, 70→8, 80→4, 90→3`, answer:String(freqs[i])}; }
function ytGen_1() { const sets=[[[60,70,80,90],[5,8,4,3]],[[10,20,30,40],[3,6,9,2]],[[1,2,3,4],[7,4,9,2]]]; const [vals,freqs]=sets[Math.floor(Math.random()*sets.length)]; const maxIdx=freqs.indexOf(Math.max(...freqs)); return {q:vals.map((v,i)=>`${v}→${freqs[i]}`).join(', '), answer:String(vals[maxIdx])}; }
function ytGen_2() { const freqs=[Math.floor(Math.random()*6)+2,Math.floor(Math.random()*6)+2,Math.floor(Math.random()*6)+2,Math.floor(Math.random()*6)+2]; return {q:`Frequencies: ${freqs.join(', ')}`, answer:String(freqs.reduce((a,b)=>a+b,0))}; }
function ytGen_3() { const vals=[60,70,80,90]; const freqs=[Math.floor(Math.random()*6)+2,Math.floor(Math.random()*6)+2,Math.floor(Math.random()*6)+2,Math.floor(Math.random()*6)+2]; const total=freqs.reduce((a,b)=>a+b,0); const sum=vals.reduce((s,v,i)=>s+v*freqs[i],0); const mean=sum/total; return {q:vals.map((v,i)=>`${v}→${freqs[i]}`).join(', '), answer: Number.isInteger(mean)?String(mean):mean.toFixed(1)}; }
function ytGen_4() { const vals=[60,70,80,90]; const freqs=[5,8,4,3]; return {q:'Frequencies: 60→5, 70→8, 80→4, 90→3 (total 20)', options:['60','70','80'], answer:'70'}; }
function ytGen_5() { const x=Math.floor(Math.random()*10)+1; const y=Math.floor(Math.random()*10)+1; return {q:`A point ${x} units right and ${y} units up from the origin`, answer:`(${x}, ${y})`}; }
function ytGen_6() { const opts=[['As study hours increase, test scores increase','Positive'],['As age of car increases, value decreases','Negative'],['Shoe size and favourite colour','No correlation']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Positive','Negative','No correlation'], answer:p[1]}; }
function ytGen_7() { return {q:'A line of best fit must pass through every point', options:['True','False'], answer:'False'}; }
function ytGen_8() { const x=Math.floor(Math.random()*8)+2; const m=Math.floor(Math.random()*5)+2; return {q:`Trend: y ≈ ${m} × x. Estimate y when x=${x}.`, answer:String(m*x)}; }
function ytGen_9() { const vals=[10,20,30,40]; const freqs=[Math.floor(Math.random()*6)+2,Math.floor(Math.random()*6)+2,Math.floor(Math.random()*6)+2,Math.floor(Math.random()*6)+2]; const total=freqs.reduce((a,b)=>a+b,0); const sum=vals.reduce((s,v,i)=>s+v*freqs[i],0); const mean=sum/total; return {q:vals.map((v,i)=>`${v}→${freqs[i]}`).join(', '), answer: Number.isInteger(mean)?String(mean):mean.toFixed(1)}; }

const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^-?\d+\.\d+$/.test(ans)) {
    const num = parseFloat(ans);
    const decimals = (ans.split('.')[1]||'').length;
    const deltas = [0.1,-0.1,0.01,-0.01,1,-1,0.5,-0.5].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = (num + d).toFixed(decimals);
      if (c !== ans && !candidates.includes(c)) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+%$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [5,-5,10,-10,2,-2,1,-1].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d) + '%';
      if (c !== ans && !candidates.includes(c) && (num+d) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  }

  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
