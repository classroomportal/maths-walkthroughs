<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Angles in Polygons & Intro to Pythagoras — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge Maths (Y9): Angles in Polygons & Intro to Pythagoras</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Sum of interior angles in a polygon", "teach": ["The sum of interior angles in a polygon with n sides is (n\u22122) \u00d7 180\u00b0.", "Example: a hexagon has 6 sides, so its angles sum to (6\u22122) \u00d7 180 = 720\u00b0.", "This formula works because any polygon can be split into (n\u22122) triangles, each contributing 180\u00b0."], "yt_prompt": "Find the sum of interior angles:"}, {"title": "Interior angle of a regular polygon", "teach": ["In a REGULAR polygon (all sides and angles equal), divide the total interior angle sum by the number of sides.", "Example: a regular hexagon has interior angle sum 720\u00b0, so each angle = 720 \u00f7 6 = 120\u00b0.", "This only works for regular polygons \u2014 irregular ones can have different-sized angles."], "yt_prompt": "Find each interior angle:"}, {"title": "Exterior angles of a polygon", "teach": ["The exterior angles of any polygon always add up to 360\u00b0, no matter how many sides it has.", "Interior and exterior angles at the same vertex are supplementary \u2014 they add up to 180\u00b0.", "Example: if the interior angle is 120\u00b0, the exterior angle is 180 \u2212 120 = 60\u00b0."], "yt_prompt": "Find the exterior angle:"}, {"title": "Finding the number of sides from the exterior angle", "teach": ["Since exterior angles sum to 360\u00b0, dividing 360\u00b0 by one exterior angle gives the number of sides (for a regular polygon).", "Example: if each exterior angle is 45\u00b0, the polygon has 360 \u00f7 45 = 8 sides.", "This is a useful way to work 'backwards' from an angle to identify the shape."], "yt_prompt": "How many sides does the polygon have?"}, {"title": "Finding the number of sides from the interior angle", "teach": ["If you're given the interior angle instead, first find the exterior angle (180 \u2212 interior), then divide 360 by that.", "Example: interior angle 144\u00b0 \u2192 exterior = 180\u2212144 = 36\u00b0 \u2192 sides = 360\u00f736 = 10.", "Always convert to the exterior angle first \u2014 dividing 360 by the interior angle directly won't work."], "yt_prompt": "How many sides does the polygon have?"}, {"title": "Introducing Pythagoras' theorem", "teach": ["In a right-angled triangle, the square of the hypotenuse (longest side, opposite the right angle) equals the sum of the squares of the other two sides: a\u00b2 + b\u00b2 = c\u00b2.", "Example: legs of 3cm and 4cm \u2192 hypotenuse\u00b2 = 3\u00b2 + 4\u00b2 = 9+16 = 25 \u2192 hypotenuse = 5cm.", "Pythagoras only works for RIGHT-angled triangles \u2014 always check the triangle has a right angle first."], "yt_prompt": "Find the hypotenuse (in cm):"}, {"title": "Finding a missing shorter side", "teach": ["If you know the hypotenuse and one other side, rearrange: the missing side\u00b2 = hypotenuse\u00b2 \u2212 known side\u00b2.", "Example: hypotenuse 13cm, one leg 5cm \u2192 missing\u00b2 = 169 \u2212 25 = 144 \u2192 missing = 12cm.", "Always subtract the smaller square from the larger (hypotenuse) square \u2014 never the other way round."], "yt_prompt": "Find the missing side (in cm):"}, {"title": "Recognising Pythagorean triples", "teach": ["Some right-angled triangles have whole-number sides that come up again and again: 3-4-5, 6-8-10, 5-12-13.", "Recognising these instantly saves time \u2014 you don't need to calculate if you spot a known triple.", "Any multiple of a triple also works: 3-4-5 scaled by 2 gives 6-8-10, still a right-angled triangle."], "yt_prompt": "Is this a Pythagorean triple (right-angled triangle)?"}, {"title": "Applying Pythagoras in context", "teach": ["Pythagoras is often used in real contexts, like finding the diagonal of a rectangle or the length of a ladder against a wall.", "Example: a ladder reaches 8m up a wall, with its base 6m from the wall. Ladder length = \u221a(8\u00b2+6\u00b2) = \u221a100 = 10m.", "Always identify which side is the hypotenuse (usually the diagonal/slanted one) before applying the formula."], "yt_prompt": "Find the length (in m):"}, {"title": "Mixed practice", "teach": ["You've now covered interior/exterior angles of polygons and Pythagoras' theorem for right-angled triangles.", "Both topics rely on a clear formula \u2014 the challenge is usually identifying which values go where.", "Draw a quick sketch if you're unsure which side is the hypotenuse or which angle is being asked for."], "yt_prompt": "Find the hypotenuse (in cm):"}];
function ytGen_0() { const n=Math.floor(Math.random()*6)+5; return {q:`A polygon with ${n} sides`, answer:String((n-2)*180)}; }
function ytGen_1() { const n=[5,6,8,9,10,12][Math.floor(Math.random()*6)]; return {q:`A regular polygon with ${n} sides`, answer:String(((n-2)*180)/n)}; }
function ytGen_2() { const interior=[100,120,135,140,150][Math.floor(Math.random()*5)]; return {q:`Interior angle = ${interior}°`, answer:String(180-interior)}; }
function ytGen_3() { const sides=[5,6,8,9,10,12][Math.floor(Math.random()*6)]; const ext=360/sides; return {q:`Each exterior angle is ${ext}°`, answer:String(sides)}; }
function ytGen_4() { const sides=[5,6,8,9,10,12][Math.floor(Math.random()*6)]; const ext=360/sides; const interior=180-ext; return {q:`Each interior angle is ${interior}°`, answer:String(sides)}; }
function ytGen_5() { const triples=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]]; const [a,b,c]=triples[Math.floor(Math.random()*triples.length)]; return {q:`Legs ${a}cm and ${b}cm`, answer:String(c)}; }
function ytGen_6() { const triples=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]]; const [a,b,c]=triples[Math.floor(Math.random()*triples.length)]; return {q:`Hypotenuse ${c}cm, one leg ${a}cm`, answer:String(b)}; }
function ytGen_7() { const validTriples=[[3,4,5],[6,8,10],[5,12,13]]; const invalidSets=[[4,5,7],[3,5,8],[6,7,10]]; const isValid=Math.random()<0.5; const set=isValid?validTriples[Math.floor(Math.random()*validTriples.length)]:invalidSets[Math.floor(Math.random()*invalidSets.length)]; return {q:`Sides ${set[0]}, ${set[1]}, ${set[2]}`, options:['Yes','No'], answer:isValid?'Yes':'No'}; }
function ytGen_8() { const triples=[[6,8,10],[9,12,15],[8,15,17],[5,12,13]]; const [a,b,c]=triples[Math.floor(Math.random()*triples.length)]; return {q:`Ladder base ${a}m from wall, reaches ${b}m up`, answer:String(c)}; }
function ytGen_9() { const triples=[[3,4,5],[6,8,10],[5,12,13],[9,12,15]]; const [a,b,c]=triples[Math.floor(Math.random()*triples.length)]; return {q:`Legs ${a}cm and ${b}cm`, answer:String(c)}; }

const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^-?\d+\.\d+$/.test(ans)) {
    const num = parseFloat(ans);
    const decimals = (ans.split('.')[1]||'').length;
    const deltas = [0.1,-0.1,0.01,-0.01,1,-1,0.5,-0.5].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = (num + d).toFixed(decimals);
      if (c !== ans && !candidates.includes(c)) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+%$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [5,-5,10,-10,2,-2,1,-1].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d) + '%';
      if (c !== ans && !candidates.includes(c) && (num+d) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  }

  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
