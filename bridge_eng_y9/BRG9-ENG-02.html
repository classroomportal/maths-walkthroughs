<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Analysing Language & Writer's Purpose — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge English (Y9): Analysing Language & Writer's Purpose</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is writer's purpose?", "teach": ["A writer's purpose is WHY they wrote the text: to inform, persuade, entertain, describe, or instruct.", "Example: a news report informs; an advert persuades; a short story entertains.", "Identifying purpose helps you understand the choices the writer made in language and structure."], "yt_prompt": "What is the main purpose of this type of text?"}, {"title": "Identifying tone", "teach": ["Tone is the writer's attitude towards their subject, shown through word choice \u2014 it could be serious, humorous, critical, or celebratory.", "Example: 'The so-called expert clearly had no idea what he was talking about' has a critical, sarcastic tone.", "Look at specific word choices (adjectives, verbs) to work out the tone, rather than guessing generally."], "yt_prompt": "What tone does this sentence create?"}, {"title": "Word choice and connotation", "teach": ["Connotation is the feeling or association a word carries beyond its literal meaning.", "Example: 'skinny' and 'slender' both mean thin, but 'skinny' has a more negative connotation, while 'slender' sounds more positive.", "Writers choose words carefully for their connotations, not just their literal dictionary meaning."], "yt_prompt": "Which word has the more negative connotation?"}, {"title": "Identifying persuasive techniques", "teach": ["Persuasive writing often uses rhetorical questions ('Isn't it time for change?'), the rule of three ('faster, stronger, better'), and emotive language.", "Direct address ('you') makes the reader feel personally spoken to, increasing persuasive impact.", "Spotting these techniques is the first step; explaining their EFFECT on the reader is the higher-level skill."], "yt_prompt": "Which persuasive technique is used here?"}, {"title": "Identifying descriptive techniques", "teach": ["Descriptive writing often uses sensory language (sight, sound, smell, touch, taste) to help the reader picture a scene vividly.", "Similes ('as fast as lightning') and metaphors ('a sea of people') create vivid images by comparing things.", "Personification gives human qualities to non-human things: 'the wind whispered through the trees.'"], "yt_prompt": "Which descriptive technique is used here?"}, {"title": "Explaining the effect of language choices", "teach": ["It's not enough to just name a technique \u2014 explain WHAT EFFECT it has on the reader.", "Example: 'The metaphor \"a sea of people\" suggests the crowd was overwhelming and endless, making the narrator feel small.'", "Always link the technique back to the specific feeling or idea it creates for the reader."], "yt_prompt": "Which explanation best links the technique to its effect?"}, {"title": "Structural choices", "teach": ["Structure is about HOW a text is organised \u2014 short paragraphs for pace, a shocking opening to grab attention, a twist ending.", "A writer might delay key information deliberately to build suspense or tension.", "When analysing structure, consider what the writer chose to reveal, and when, and why."], "yt_prompt": "What structural technique is being used here?"}, {"title": "Audience awareness", "teach": ["Writers adapt their language and tone depending on their intended audience \u2014 children's writing differs from academic writing.", "Formal language, complex vocabulary, and longer sentences often suggest an educated adult audience.", "Simple vocabulary, direct address, and short sentences often suggest a younger or general audience."], "yt_prompt": "Who is the most likely intended audience for this text?"}, {"title": "Combining purpose, tone and technique in analysis", "teach": ["Strong analysis combines all three: what is the writer's PURPOSE, what TONE do they create, and what TECHNIQUES achieve this?", "Example: 'The writer's persuasive purpose is achieved through an urgent tone, created by the rhetorical question and emotive language.'", "This combined approach is exactly what earns the highest marks in language analysis questions."], "yt_prompt": "Which analysis best combines purpose, tone and technique?"}, {"title": "Mixed practice", "teach": ["You've now covered writer's purpose, tone, connotation, persuasive/descriptive techniques, and structural choices.", "These are the core analytical skills needed for IGCSE-style language analysis questions.", "This final question checks you can apply everything together."], "yt_prompt": "What is the writer most likely trying to achieve here?"}];
function ytGen_0() { const opts=[['A news report about a flood','Inform'],['An advert for a new phone','Persuade'],['A short story about a lost dog','Entertain']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Inform','Persuade','Entertain'], answer:p[1]}; }
function ytGen_1() { const opts=[['The so-called expert clearly had no idea what he was talking about.','Critical/sarcastic'],['The sunrise painted the sky in brilliant gold and rose.','Celebratory/admiring']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Critical/sarcastic','Celebratory/admiring'], answer:p[1]}; }
function ytGen_2() { const opts=[['skinny','slender'],['stubborn','determined'],['cheap','affordable']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:`${p[0]} or ${p[1]}?`, options:p, answer:p[0]}; }
function ytGen_3() { const opts=[['Isn\'t it time we did something about this?','Rhetorical question'],['You deserve better. You deserve more. You deserve this.','Rule of three']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Rhetorical question','Rule of three'], answer:p[1]}; }
function ytGen_4() { const opts=[['The wind whispered through the trees.','Personification'],['Her smile was as bright as the morning sun.','Simile']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Personification','Simile'], answer:p[1]}; }
function ytGen_5() { const opts=['The metaphor "a sea of people" suggests the crowd felt overwhelming and endless.','The writer used a metaphor about people.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_6() { const opts=[['A shocking opening sentence to grab attention','Grabs the reader\'s interest immediately'],['Withholding key information until the end','Builds suspense/tension']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Grabs the reader\'s interest immediately','Builds suspense/tension'], answer:p[1]}; }
function ytGen_7() { const opts=[['Complex vocabulary, formal tone, long sentences','Educated adult audience'],['Simple words, short sentences, direct address','Younger or general audience']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Educated adult audience','Younger or general audience'], answer:p[1]}; }
function ytGen_8() { const opts=['The persuasive purpose is achieved through an urgent tone, created by the rhetorical question.','The writer used a rhetorical question.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_9() { const opts=[['An emotive charity advert with images of suffering','Persuade the reader to donate'],['A calm, factual weather report','Inform the reader accurately']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Persuade the reader to donate','Inform the reader accurately'], answer:p[1]}; }

const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^-?\d+\.\d+$/.test(ans)) {
    const num = parseFloat(ans);
    const decimals = (ans.split('.')[1]||'').length;
    const deltas = [0.1,-0.1,0.01,-0.01,1,-1,0.5,-0.5].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = (num + d).toFixed(decimals);
      if (c !== ans && !candidates.includes(c)) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+%$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [5,-5,10,-10,2,-2,1,-1].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d) + '%';
      if (c !== ans && !candidates.includes(c) && (num+d) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  }

  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
