<style>
:root{--red:#37474F;--dark:#263238;--cream:#ECEFF1;--ink:#0d1b2a;--line:#CFD8DC;--gold:#00ACC1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#f0fbfc;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e0f7fa;color:#00838f;border:1px solid #80deea;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#00838f;}
.an{background:#E0F7FA;border-left:4px solid var(--gold);border-radius:4px;padding:12px 14px;margin:12px 0 4px;}.an-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#00838f;font-weight:700;margin-bottom:4px;}.an p{font-size:14.5px;line-height:1.55;margin:0;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#37474F',DARK='#263238',CRM='#ECEFF1',LINE='#CFD8DC';
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}

var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
  }
});

function makeDiagram(title, points){
  return function(p){
    var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
    o.push(T(240,20,title,ACC,12,'middle',true));
    points.forEach(function(txt,i){
      if(p>=i){
        var y=36+i*44;
        o.push(R(10,y,460,38,i===p?LINE:CRM,ACC,i===p?2:1));
        o.push(T(240,y+23,txt,DARK,10,'middle',false));
      }
    });
    s.innerHTML=o.join('');
  };
}

var dQ1=makeDiagram('What is Cloud Computing?',['Cloud computing delivers computing services (storage, processing, soft…','Instead of owning physical servers, organisations rent computing resou…','Major cloud providers include AWS, Microsoft Azure, and Google Cloud.','Cloud computing has transformed how businesses build and scale technol…']);

var dQ3=makeDiagram('Public, Private, and Hybrid Cloud',['Public cloud resources are shared among multiple customers via the int…','Private cloud resources are dedicated to a single organisation, often …','Hybrid cloud combines public and private cloud resources together.','Choosing a cloud model depends on cost, security needs, and regulatory…']);
var dQ4=makeDiagram('Scalability and Elasticity',['Scalability means a system can handle increased demand by adding resou…','Elasticity means resources can automatically scale up or down based on…','Cloud computing enables businesses to avoid over-investing in unused c…','This flexibility is a major advantage over traditional, fixed-capacity…']);
var dQ5=makeDiagram('Cloud Storage',['Cloud storage services (like AWS S3, Google Cloud Storage) store data …','Data can be accessed from anywhere with an internet connection.','Redundancy across multiple locations helps protect against data loss.','Understanding storage tiers (hot vs cold storage) helps optimise cost …']);
var dQ6=makeDiagram('Cost Models in the Cloud',['Cloud services often use "pay-as-you-go" pricing, charging only for re…','This can reduce costs compared to purchasing and maintaining physical …','Poorly managed cloud usage can also lead to unexpectedly high costs.','Understanding cost models helps organisations use cloud resources effi…']);
var dQ7=makeDiagram('Cloud Computing and Businesses in Nigeria',['Nigerian businesses increasingly use cloud services to reduce IT infra…','Cloud adoption supports startups by lowering the barrier to launching …','Reliable internet connectivity remains an important factor in cloud ad…','Understanding cloud computing supports Nigeria\'s growing digital econo…']);
var dQ8=makeDiagram('Cloud Security Considerations',['Cloud security requires understanding the shared responsibility model …','Misconfigured settings are a leading cause of cloud data breaches.','Strong access controls and encryption remain essential in cloud enviro…','Regular audits help ensure cloud security settings remain appropriate …']);
var dQ9=makeDiagram('Migrating to the Cloud',['Cloud migration involves moving data, applications, and processes from…','Careful planning avoids downtime and data loss during migration.','Testing thoroughly after migration ensures everything functions as exp…','Migration strategies vary depending on an organisation\'s specific need…']);
var dQ10=makeDiagram('The Future of Cloud Computing',['Edge computing brings processing closer to where data is generated, re…','Serverless computing lets developers run code without managing underly…','Cloud computing continues to evolve alongside AI, IoT, and 5G technolo…','Staying current with cloud trends supports many modern computing caree…']);

var QS=[
{ey:'Q1 \u2022 Digital Technologies \u2022 Web & Software',ti:'What is Cloud Computing?',su:'Learn about What is Cloud Computing? and test your understanding.',steps:[
  {lb:'The basics',dr:dQ1,ht:'<p>Cloud computing delivers computing services (storage, processing, software) over the internet.</p><div class="an"><div class="an-t">&#128161; Think of it like this</div><p>Cloud computing is like getting electricity from the grid. You don\'t build your own power station; you plug in and pay for what you use.</p></div>'},
  {lb:'Key details',dr:dQ1,ht:'<p>Instead of owning physical servers, organisations rent computing resources as needed.</p>'},
  {lb:'How it works',dr:dQ1,ht:'<p>Major cloud providers include AWS, Microsoft Azure, and Google Cloud.</p>'},
  {lb:'Why it matters',dr:dQ1,ht:'<p>Cloud computing has transformed how businesses build and scale technology.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[
      {q:'What does cloud computing deliver over the internet?',o:['Computing services like storage and processing','Only physical hardware delivery','Only paper documents','Only television broadcasts'],a:0,w:'Cloud computing delivers computing services — like storage, processing power, and software — over the internet.'},
      {q:'A school saves homework in Google Drive instead of on one computer in the staff room. What is this an example of?',o:['A printer queue','Cloud computing','A USB stick','A local network cable'],a:1,w:'The files are stored and accessed over the internet on a provider\'s servers, which is cloud computing.'},
      {q:'Which of these is a major cloud computing provider?',o:['A computer mouse','A word processor','A monitor brand','Microsoft Azure'],a:3,w:'AWS, Microsoft Azure and Google Cloud are the largest cloud providers.'},
      {q:'Why might a small business rent cloud resources instead of buying its own servers?',o:['Owning servers is illegal','Cloud computing needs no internet','To avoid the big upfront cost of buying and maintaining hardware','Cloud services are always free'],a:2,w:'Renting means the business pays as it goes instead of buying expensive equipment up front.'}
    ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})}
]},
{ey:'Q2 \u2022 Digital Technologies \u2022 Web & Software',ti:'Types of Cloud Services: IaaS, PaaS, SaaS',su:'Learn about Types of Cloud Services: IaaS, PaaS, SaaS and test your understanding.',steps:[
  {lb:'The basics',dr:dQ2,ht:'<p>IaaS (Infrastructure as a Service) provides virtualised computing resources like servers and storage.</p><div class="an"><div class="an-t">&#128161; Think of it like this</div><p>Think about eating jollof rice. IaaS is renting a kitchen and cooking everything yourself. PaaS is a kitchen with the ingredients ready; you just cook. SaaS is ordering a ready plate at a restaurant and simply eating.</p></div>'},
  {lb:'Key details',dr:dQ2,ht:'<p>PaaS (Platform as a Service) provides a platform for developing and deploying applications.</p>'},
  {lb:'How it works',dr:dQ2,ht:'<p>SaaS (Software as a Service) delivers complete software applications over the internet.</p>'},
  {lb:'Why it matters',dr:dQ2,ht:'<p>Choosing the right service type depends on how much control versus convenience an organisation needs.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[
      {q:'What does SaaS stand for?',o:['Software as a Service','Storage as a Service','System as a Service','Security as a Service'],a:0,w:'SaaS stands for Software as a Service — complete software applications delivered and accessed over the internet.'},
      {q:'Gmail, used in a web browser with nothing to install, is an example of:',o:['IaaS','PaaS','SaaS','Hardware'],a:2,w:'SaaS delivers complete, ready-to-use software over the internet.'},
      {q:'A company rents virtual servers and installs its own operating system and software on them. Which model is this?',o:['SaaS','IaaS','PaaS','Freeware'],a:1,w:'IaaS provides the basic infrastructure (servers, storage); the customer manages everything on top.'},
      {q:'Developers upload their code, and the provider looks after the servers and operating system. Which model is this?',o:['IaaS','SaaS','Email','PaaS'],a:3,w:'PaaS gives developers a ready platform to build and run applications.'}
    ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})}
]},
{ey:'Q3 \u2022 Digital Technologies \u2022 Web & Software',ti:'Public, Private, and Hybrid Cloud',su:'Learn about Public, Private, and Hybrid Cloud and test your understanding.',steps:[
  {lb:'The basics',dr:dQ3,ht:'<p>Public cloud resources are shared among multiple customers via the internet.</p><div class="an"><div class="an-t">&#128161; Think of it like this</div><p>Public cloud is like a danfo bus: shared and cheap. Private cloud is like owning your own car. Hybrid cloud is driving your car to the bus park, then taking the bus for the rest of the journey.</p></div>'},
  {lb:'Key details',dr:dQ3,ht:'<p>Private cloud resources are dedicated to a single organisation, often for extra control or compliance.</p>'},
  {lb:'How it works',dr:dQ3,ht:'<p>Hybrid cloud combines public and private cloud resources together.</p>'},
  {lb:'Why it matters',dr:dQ3,ht:'<p>Choosing a cloud model depends on cost, security needs, and regulatory requirements.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[
      {q:'What defines a "private cloud"?',o:['Resources dedicated to a single organisation','Resources shared among all customers equally','A cloud with no security at all','A cloud that only works offline'],a:0,w:'A private cloud consists of resources dedicated exclusively to a single organisation, often for greater control or compliance.'},
      {q:'A bank keeps customer records on its own private servers but runs its public website on a public cloud. Which model is this?',o:['Public cloud only','Hybrid cloud','Private cloud only','No cloud at all'],a:1,w:'Hybrid cloud combines private and public cloud resources.'},
      {q:'What is a main advantage of public cloud?',o:['Lower cost, because resources are shared','The customer controls the physical building','It works without the internet','No other customers use it'],a:0,w:'Sharing resources across many customers keeps public cloud costs down.'},
      {q:'Why might a hospital choose a private cloud for patient records?',o:['Private cloud is always cheaper','It makes games run faster','For extra control and to meet privacy rules','To share records with everyone'],a:2,w:'Private cloud gives one organisation dedicated resources and more control, which helps with privacy rules.'}
    ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})}
]},
{ey:'Q4 \u2022 Digital Technologies \u2022 Web & Software',ti:'Scalability and Elasticity',su:'Learn about Scalability and Elasticity and test your understanding.',steps:[
  {lb:'The basics',dr:dQ4,ht:'<p>Scalability means a system can handle increased demand by adding resources.</p><div class="an"><div class="an-t">&#128161; Think of it like this</div><p>Elasticity is like a party hall that adds chairs as guests arrive and stacks them away as guests leave, so you never pay for empty seats.</p></div>'},
  {lb:'Key details',dr:dQ4,ht:'<p>Elasticity means resources can automatically scale up or down based on real-time demand.</p>'},
  {lb:'How it works',dr:dQ4,ht:'<p>Cloud computing enables businesses to avoid over-investing in unused capacity.</p>'},
  {lb:'Why it matters',dr:dQ4,ht:'<p>This flexibility is a major advantage over traditional, fixed-capacity infrastructure.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[
      {q:'What does "elasticity" mean in cloud computing?',o:['Resources automatically scale up or down based on demand','A cloud service that never changes capacity','A type of encryption','A type of programming language'],a:0,w:'Elasticity refers to a cloud system\'s ability to automatically scale resources up or down in response to real-time demand.'},
      {q:'On results day, a results website suddenly gets 100 times more visitors than usual. Which cloud feature helps it cope?',o:['Encryption','Elasticity: automatically adding resources','Deleting old pages','Using a slower server'],a:1,w:'Elasticity adds resources automatically when demand rises.'},
      {q:'In an elastic system, what happens to resources when demand falls?',o:['They stay at maximum for ever','The system crashes','They scale down automatically, reducing cost','They double'],a:2,w:'Elastic systems release resources that are no longer needed, so you stop paying for them.'},
      {q:'What is the difference between scalability and elasticity?',o:['They mean exactly the opposite','Elasticity only applies to rubber','Scalability is about typing speed','Scalability is the ability to grow; elasticity is growing and shrinking automatically as demand changes'],a:3,w:'A scalable system can handle more load; an elastic one adjusts automatically, up and down.'}
    ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})}
]},
{ey:'Q5 \u2022 Digital Technologies \u2022 Web & Software',ti:'Cloud Storage',su:'Learn about Cloud Storage and test your understanding.',steps:[
  {lb:'The basics',dr:dQ5,ht:'<p>Cloud storage services (like AWS S3, Google Cloud Storage) store data on remote servers.</p><div class="an"><div class="an-t">&#128161; Think of it like this</div><p>Redundant cloud storage is like keeping copies of your certificates in three different houses. If one house floods, you still have the other copies.</p></div>'},
  {lb:'Key details',dr:dQ5,ht:'<p>Data can be accessed from anywhere with an internet connection.</p>'},
  {lb:'How it works',dr:dQ5,ht:'<p>Redundancy across multiple locations helps protect against data loss.</p>'},
  {lb:'Why it matters',dr:dQ5,ht:'<p>Understanding storage tiers (hot vs cold storage) helps optimise cost and performance.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[
      {q:'What is a benefit of storing data across multiple redundant locations in the cloud?',o:['Protection against data loss','Guaranteed higher cost with no benefit','Slower access speeds only','No security benefit at all'],a:0,w:'Storing data redundantly across multiple locations helps protect against loss if one location experiences a failure.'},
      {q:'Cold storage is best for:',o:['Live video calls','Data used every second','Archived data that is rarely accessed','Running games'],a:2,w:'Cold storage is cheaper but slower to access, so it suits rarely used data.'},
      {q:'Why does cloud storage keep copies in several locations?',o:['To make data harder to find','So data survives if one data centre fails','To use more electricity','Because one copy is illegal'],a:1,w:'Redundancy protects against data loss from a single failure.'},
      {q:'What do you need to open your cloud files on a different device?',o:['A printer','A CD','The original computer switched on','An internet connection and your login'],a:3,w:'Cloud files live on the provider\'s servers, so any device with internet and your login can reach them.'}
    ];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})}
]},
{ey:'Q6 \u2022 Digital Technologies \u2022 Web & Software',ti:'Cost Models in the Cloud',su:'Learn about Cost Models in the Cloud and test your understanding.',steps:[
  {lb:'The basics',dr:dQ6,ht:'<p>Cloud services often use "pay-as-you-go" pricing, charging only for resources actually used.</p><div class="an"><div class="an-t">&#128161; Think of it like this</div><p>Pay-as-you-go cloud is like buying data for your phone: you pay for what you use. But leave a video streaming that nobody is watching and your data disappears. Forgotten cloud services drain money in the same way.</p></div>'},
  {lb:'Key details',dr:dQ6,ht:'<p>This can reduce costs compared to purchasing and maintaining physical infrastructure.</p>'},
  {lb:'How it works',dr:dQ6,ht:'<p>Poorly managed cloud usage can also lead to unexpectedly high costs.</p>'},
  {lb:'Why it matters',dr:dQ6,ht:'<p>Understanding cost models helps organisations use cloud resources efficiently.</p>'},
