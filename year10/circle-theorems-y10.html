<style>
:root{--red:#C0272D;--dark:#7A1418;--cream:#FBF6F1;--ink:#241A17;--line:#E4D6CE;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}

.cvs{background:linear-gradient(#fff,#fdf7f4);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:170px;}

.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}

.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}

@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);
    ST[id]={o:o,genFn:entry.genFn,mc:true};
    return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';}
    return;
  }
});
function g(){var el=document.getElementById('dg');el.innerHTML='';return el;}
function T(x,y,txt,c,sz,a,bold){c=c||'#241A17';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function CIR(cx,cy,r,fill,stroke,sw){fill=fill||'none';stroke=stroke||'#241A17';sw=sw||1.5;return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';}
function DOT(x,y,c){return '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+(c||'#241A17')+'"/>';}
/* Point on a circle centred (cx,cy) radius r at angle deg (0=east, ccw positive, y flipped for SVG) */
function pt(cx,cy,r,deg){var rad=deg*Math.PI/180;return [cx+r*Math.cos(rad),cy-r*Math.sin(rad)];}
function arcPath(cx,cy,r,d1,d2,large,sweep){var p1=pt(cx,cy,r,d1),p2=pt(cx,cy,r,d2);large=large?1:0;sweep=sweep!=null?sweep:0;return '<path d="M'+p1[0].toFixed(1)+','+p1[1].toFixed(1)+' A'+r+','+r+' 0 '+large+' '+sweep+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1)+'" fill="none" stroke="#C8922A" stroke-width="2"/>';}
function angleArc(cx,cy,r,d1,d2){ // small marker arc for showing an angle at a vertex
  var p1=pt(cx,cy,r,d1),p2=pt(cx,cy,r,d2);
  return '<path d="M'+p1[0].toFixed(1)+','+p1[1].toFixed(1)+' A'+r+','+r+' 0 0 0 '+p2[0].toFixed(1)+','+p2[1].toFixed(1)+'" fill="none" stroke="#1a5a8a" stroke-width="2"/>';
}

var CX=240,CY=155,R=95;

/* Q1 - Angle in a semicircle */
function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(CIR(CX,CY,R));
  var A=pt(CX,CY,R,200),B=pt(CX,CY,R,20),C=pt(CX,CY,R,70);
  if(p>=1){o.push(L(A[0],A[1],B[0],B[1],'#C0272D',2.5));o.push(T((A[0]+B[0])/2,(A[1]+B[1])/2+18,'diameter','#C0272D',10));}
  o.push(DOT(A[0],A[1]));o.push(T(A[0]-10,A[1]+5,'A','#241A17',13,'end',true));
  o.push(DOT(B[0],B[1]));o.push(T(B[0]+10,B[1]+5,'B','#241A17',13,'start',true));
  o.push(DOT(CX,CY,'#888'));
  if(p>=2){
    o.push(L(A[0],A[1],C[0],C[1],'#1a5a8a',2));o.push(L(B[0],B[1],C[0],C[1],'#1a5a8a',2));
    o.push(DOT(C[0],C[1]));o.push(T(C[0],C[1]-12,'C','#1a5a8a',13,'middle',true));
    o.push('<rect x="'+(C[0]-14)+'" y="'+(C[1]-14)+'" width="14" height="14" fill="none" stroke="#1a5a8a" stroke-width="2"/>');
  }
  if(p>=3){o.push(T(240,280,'Angle ACB = 90\u00b0, wherever C sits on the circle','#1a7a3a',12,'middle',true));}
  s.innerHTML=o.join('');
}

/* Q2 - Angle at centre = 2 x angle at circumference */
function dQ2(p){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(CIR(CX,CY,R));
  var A=pt(CX,CY,R,160),B=pt(CX,CY,R,20),C=pt(CX,CY,R,260);
  o.push(DOT(A[0],A[1]));o.push(T(A[0]-8,A[1]-6,'A','#241A17',13,'end',true));
  o.push(DOT(B[0],B[1]));o.push(T(B[0]+8,B[1]-6,'B','#241A17',13,'start',true));
  o.push(DOT(CX,CY,'#888'));o.push(T(CX+4,CY+16,'O','#888',11,'start'));
  if(p>=1){o.push(L(CX,CY,A[0],A[1],'#C0272D',2));o.push(L(CX,CY,B[0],B[1],'#C0272D',2));o.push(angleArc(CX,CY,26,20,160));o.push(T(CX,CY-34,'angle at centre','#C0272D',10,'middle',true));}
  if(p>=2){
    o.push(L(A[0],A[1],C[0],C[1],'#1a5a8a',2));o.push(L(B[0],B[1],C[0],C[1],'#1a5a8a',2));
    o.push(DOT(C[0],C[1]));o.push(T(C[0],C[1]+16,'C','#1a5a8a',13,'middle',true));
  }
  if(p>=3){o.push(T(240,282,'Angle AOB = 2 \u00d7 Angle ACB','#1a7a3a',13,'middle',true));}
  s.innerHTML=o.join('');
}

/* Q3 - Angles in the same segment */
function dQ3(p){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(CIR(CX,CY,R));
  var A=pt(CX,CY,R,190),B=pt(CX,CY,R,-10),C=pt(CX,CY,R,55),D=pt(CX,CY,R,110);
  o.push(DOT(A[0],A[1]));o.push(T(A[0]-8,A[1]+4,'A','#241A17',13,'end',true));
  o.push(DOT(B[0],B[1]));o.push(T(B[0]+8,B[1]+4,'B','#241A17',13,'start',true));
  if(p>=1){o.push(L(A[0],A[1],C[0],C[1],'#1a5a8a',2));o.push(L(B[0],B[1],C[0],C[1],'#1a5a8a',2));o.push(DOT(C[0],C[1]));o.push(T(C[0]+8,C[1]-6,'C','#1a5a8a',13,'start',true));}
  if(p>=2){o.push(L(A[0],A[1],D[0],D[1],'#C0272D',2));o.push(L(B[0],B[1],D[0],D[1],'#C0272D',2));o.push(DOT(D[0],D[1]));o.push(T(D[0]-6,D[1]-8,'D','#C0272D',13,'end',true));}
  if(p>=3){o.push(T(240,282,'Angle ACB = Angle ADB (same segment, same arc AB)','#1a7a3a',12,'middle',true));}
  s.innerHTML=o.join('');
}

/* Q4 - Cyclic quadrilateral */
function dQ4(p){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(CIR(CX,CY,R));
  var A=pt(CX,CY,R,150),B=pt(CX,CY,R,60),C=pt(CX,CY,R,-40),D=pt(CX,CY,R,220);
  var pts=[A,B,C,D],labs=['A','B','C','D'],cols=['#241A17','#241A17','#241A17','#241A17'];
  if(p>=1){for(var i=0;i<4;i++){var n=pts[(i+1)%4];o.push(L(pts[i][0],pts[i][1],n[0],n[1],'#C0272D',2));}}
  pts.forEach(function(pt2,i){o.push(DOT(pt2[0],pt2[1]));var dx=pt2[0]>CX?10:-10,dy=pt2[1]>CY?14:-8;o.push(T(pt2[0]+dx,pt2[1]+dy,labs[i],'#241A17',13,dx>0?'start':'end',true));});
  if(p>=2){o.push(angleArc(A[0],A[1],16,pt(CX,CY,R,150)[0]-A[0]+0,0));}
  if(p>=3){o.push(T(240,282,'Angle A + Angle C = 180\u00b0  and  Angle B + Angle D = 180\u00b0','#1a7a3a',12,'middle',true));}
  s.innerHTML=o.join('');
}

/* Q5 - Tangent perpendicular to radius */
function dQ5(p){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(CIR(CX,CY,R));
  var Tp=pt(CX,CY,R,0);
  o.push(DOT(CX,CY,'#888'));o.push(T(CX-8,CY+16,'O','#888',11,'end'));
  if(p>=1){o.push(L(CX,CY,Tp[0],Tp[1],'#1a5a8a',2));o.push(T((CX+Tp[0])/2,Tp[1]-10,'radius','#1a5a8a',10));}
  o.push(DOT(Tp[0],Tp[1]));o.push(T(Tp[0]+12,Tp[1]+4,'T','#241A17',13,'start',true));
  if(p>=2){
    o.push(L(Tp[0],Tp[1]-70,Tp[0],Tp[1]+70,'#C0272D',2.5));
    o.push(T(Tp[0]+16,Tp[1]-60,'tangent line','#C0272D',10,'start'));
    o.push('<rect x="'+(Tp[0]-16)+'" y="'+(Tp[1]-16)+'" width="16" height="16" fill="none" stroke="#1a7a3a" stroke-width="2"/>');
  }
  if(p>=3){o.push(T(240,282,'The tangent at T is always perpendicular (90\u00b0) to the radius OT','#1a7a3a',12,'middle',true));}
  s.innerHTML=o.join('');
}

/* Q6 - Two tangents from an external point */
function dQ6(p){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(CIR(CX,CY,R));
  var A=pt(CX,CY,R,150),B=pt(CX,CY,R,30);
  var P=[CX+ (CX-((A[0]+B[0])/2))*-1 +  (A[0]+B[0])/2 - (A[0]+B[0])/2, 0]; // placeholder unused
  var Px=CX, Py=CY-R-70;
  o.push(DOT(CX,CY,'#888'));
  if(p>=1){o.push(L(Px,Py,A[0],A[1],'#C0272D',2));o.push(L(Px,Py,B[0],B[1],'#C0272D',2));}
  o.push(DOT(A[0],A[1]));o.push(T(A[0]-10,A[1]+2,'A','#241A17',13,'end',true));
  o.push(DOT(B[0],B[1]));o.push(T(B[0]+10,B[1]+2,'B','#241A17',13,'start',true));
  o.push(DOT(Px,Py));o.push(T(Px,Py-10,'P','#241A17',13,'middle',true));
  if(p>=2){o.push(T((Px+A[0])/2-30,(Py+A[1])/2,'PA','#C0272D',11));o.push(T((Px+B[0])/2+18,(Py+B[1])/2,'PB','#C0272D',11));}
  if(p>=3){o.push(T(240,282,'PA = PB \u2014 the two tangents from an external point are equal','#1a7a3a',12,'middle',true));}
  s.innerHTML=o.join('');
}

/* Q7 - Alternate segment theorem */
function dQ7(p){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(CIR(CX,CY,R));
  var Tp=pt(CX,CY,R,-60),A=pt(CX,CY,R,150),Cx=pt(CX,CY,R,40);
  if(p>=1){o.push(L(Tp[0]-90,Tp[1]+52,Tp[0]+90,Tp[1]-52,'#888',2));o.push(T(Tp[0]+95,Tp[1]-56,'tangent','#888',10,'start'));}
  if(p>=2){o.push(L(Tp[0],Tp[1],A[0],A[1],'#C0272D',2));o.push(DOT(A[0],A[1]));o.push(T(A[0]-10,A[1]+4,'A','#241A17',13,'end',true));}
  o.push(DOT(Tp[0],Tp[1]));o.push(T(Tp[0]+4,Tp[1]+16,'T','#241A17',13,'start',true));
  if(p>=3){o.push(L(Tp[0],Tp[1],Cx[0],Cx[1],'#1a5a8a',2));o.push(L(A[0],A[1],Cx[0],Cx[1],'#1a5a8a',2));o.push(DOT(Cx[0],Cx[1]));o.push(T(Cx[0]+10,Cx[1]-2,'C','#1a5a8a',13,'start',true));}
  if(p>=4){o.push(T(240,282,'Angle between tangent and chord TA = angle ACT in the alternate segment','#1a7a3a',11,'middle',true));}
  s.innerHTML=o.join('');
}

/* Q8 - Radius bisects a chord at 90 */
function dQ8(p){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(CIR(CX,CY,R));
  var A=pt(CX,CY,R,160),B=pt(CX,CY,R,20);
  var M=[(A[0]+B[0])/2,(A[1]+B[1])/2];
  o.push(DOT(CX,CY,'#888'));o.push(T(CX-8,CY-8,'O','#888',11,'end'));
  if(p>=1){o.push(L(A[0],A[1],B[0],B[1],'#C0272D',2.5));o.push(DOT(A[0],A[1]));o.push(T(A[0]-8,A[1]-4,'A','#241A17',13,'end',true));o.push(DOT(B[0],B[1]));o.push(T(B[0]+8,B[1]-4,'B','#241A17',13,'start',true));}
