<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function round2(x){return Math.round(x*100)/100;}
function round1(x){return Math.round(x*10)/10;}

var ST={};
function tryIt(genFn){
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">✔ Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var en=ST[id];if(!en)return;var o=en.genFn();en.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:en.genFn};return;}
  if(el.classList.contains('try-ck')){var id=el.getAttribute('data-tryid');var en=ST[id];if(!en)return;var o=en.o;var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;var v=parseFloat(inp.value);if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}var tol=o.tol!=null?o.tol:0.5;if(Math.abs(v-o.ans)<=tol){fb.className='try-fb fb ok';fb.innerHTML='✓ Correct!  '+o.working;}else{fb.className='try-fb fb er';fb.textContent='Not quite — check your working and try again.';}}
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';t=String(t).replace(/∝/g,'<tspan font-size="'+Math.round(sz*1.4)+'" font-weight="700">∝</tspan>');return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'"'+(b?' font-weight="700"':'')+'>'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+(stroke||'none')+'" stroke-width="'+(sw||0)+'" rx="2"/>';}
function L(x1,y1,x2,y2,c,w){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#ccc')+'" stroke-width="'+(w||1)+'"/>';}

function propDiag(p,type,pairs,label){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(R(0,0,480,300,'#fdf7f4'));
  o.push(R(20,20,440,48,'#fff5f0','#C0272D',1.5));
  o.push(RT(240,50,label,'#C0272D',15,true));
  if(p>=1){
    o.push(R(20,82,440,36,'#e8f4ff','#1a5a8a',1.5));
    o.push(T(80,105,'x','#1a5a8a',14,'middle',true));
    o.push(T(240,105,'y','#1a5a8a',14,'middle',true));
    o.push(T(380,105,'k','#888',14,'middle',true));
  }
  pairs.forEach(function(pr,i){
    if(p>=i+2){
      var ys=130+i*34;
      o.push(T(80,ys+18,pr[0],'#241A17',14,'middle'));
      o.push(T(240,ys+18,pr[1]===null?'?':''+pr[1],'#C0272D',14,'middle',pr[1]===null));
      o.push(T(380,ys+18,pr[2],'#888',13,'middle'));
      o.push(L(20,ys+26,460,ys+26,'#E4D6CE',1));
    }
  });
  s.innerHTML=o.join('');
}

/* HTML stacked fraction, written as it would be on paper */
function fr(n,d){return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';}
/* SVG text with stacked fractions. Write a fraction as {numerator|denominator}. */
function RT(cx,y,str,col,sz,bold){
  col=col||'#241A17';sz=sz||14;
  var parts=[],re=/\{([^|}]*)\|([^}]*)\}/g,m,last=0;
  while((m=re.exec(str))){if(m.index>last)parts.push({t:str.slice(last,m.index)});parts.push({n:m[1],d:m[2]});last=re.lastIndex;}
  if(last<str.length)parts.push({t:str.slice(last)});
  var cw=sz*0.56,fs=Math.round(sz*0.85),fcw=fs*0.56;
  function tw(str,size){var w=0;for(var i=0;i<str.length;i++){var ch=str[i];w+=(ch===' '||'il.:,;|!\'()'.indexOf(ch)>=0)?0.28:('mwMW'.indexOf(ch)>=0?0.83:(ch==='∝'?0.9:(/[A-Z]/.test(ch)?0.67:(/[0-9]/.test(ch)?0.56:0.5))));}return w*size*(bold?1.07:1);}
  function wid(pt){return pt.t!=null?tw(pt.t,sz):Math.max(tw(pt.n,fs),tw(pt.d,fs))+8;}
  var total=parts.reduce(function(a,pt){return a+wid(pt);},0),x=cx-total/2,o='';
  var fw=bold?' font-weight="700"':'';
  parts.forEach(function(pt){
    var w=wid(pt);
    if(pt.t!=null){o+='<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+col+'" text-anchor="start" xml:space="preserve"'+fw+'>'+pt.t.replace(/∝/g,'<tspan font-size="'+Math.round(sz*1.4)+'" font-weight="700">∝</tspan>')+'</text>';}
    else{var bar=y-sz*0.32,mx=x+w/2;
      o+='<text x="'+mx+'" y="'+(bar-3)+'" font-size="'+fs+'" font-family="Arial" fill="'+col+'" text-anchor="middle"'+fw+'>'+pt.n+'</text>';
      o+='<line x1="'+(x+2)+'" y1="'+bar+'" x2="'+(x+w-2)+'" y2="'+bar+'" stroke="'+col+'" stroke-width="1.5"/>';
      o+='<text x="'+mx+'" y="'+(bar+fs*0.85+1)+'" font-size="'+fs+'" font-family="Arial" fill="'+col+'" text-anchor="middle"'+fw+'>'+pt.d+'</text>';}
    x+=w;
  });
  return o;
}
/* Simple graph: axes from 0, a curve y=fn(x), labelled points, optional line y = x */
function graphDiag(opt){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(R(0,0,480,300,'#fdf7f4'));
  var X0=64,Y0=258,W=380,H=210,xm=opt.xmax,ym=opt.ymax;
  function px(x){return X0+x/xm*W;} function py(y){return Y0-y/ym*H;}
  // grid and ticks
  for(var i=0;i<=xm;i+=opt.xstep){o.push(L(px(i),Y0,px(i),Y0-H,'#efe3dc',1));o.push(T(px(i),Y0+16,i,'#888',11));}
  for(var j=0;j<=ym;j+=opt.ystep){o.push(L(X0,py(j),X0+W,py(j),'#efe3dc',1));o.push(T(X0-8,py(j)+4,j,'#888',11,'end'));}
  o.push(L(X0,Y0,X0+W+8,Y0,'#241A17',1.5));o.push(L(X0,Y0,X0,Y0-H-8,'#241A17',1.5));
  o.push(T(X0+W,Y0+32,opt.xl,'#241A17',12,'end',true));
  o.push(T(X0-4,Y0-H-14,opt.yl,'#241A17',12,'start',true));
  if(opt.yx){o.push('<line x1="'+px(0)+'" y1="'+py(0)+'" x2="'+px(Math.min(xm,ym))+'" y2="'+py(Math.min(xm,ym))+'" stroke="#C8922A" stroke-width="1.5" stroke-dasharray="6,4"/>');
    o.push(T(px(Math.min(xm,ym))-4,py(Math.min(xm,ym))+16,'y = x','#C8922A',12,'end',true));}
  var pts=[],x0=opt.xmin||0;
  for(var k=0;k<=200;k++){var x=x0+(xm-x0)*k/200,y=opt.fn(x);if(y<=ym&&y>=0)pts.push(px(x).toFixed(1)+','+py(y).toFixed(1));}
  o.push('<polyline points="'+pts.join(' ')+'" fill="none" stroke="#C0272D" stroke-width="2.5"/>');
  (opt.pts||[]).forEach(function(pt){o.push('<circle cx="'+px(pt[0])+'" cy="'+py(pt[1])+'" r="4.5" fill="#1a5a8a"/>');o.push(T(px(pt[0])+8,py(pt[1])-8,'('+pt[0]+', '+pt[1]+')','#1a5a8a',11,'start',true));});
  if(opt.title)o.push(RT(300,opt.titleY||40,opt.title,'#C0272D',15,true));
  s.innerHTML=o.join('');
}
function gQ1(){graphDiag({xmax:10,ymax:50,xstep:1,ystep:10,xl:'x',yl:'y',fn:function(x){return 5*x;},pts:[[2,10],[5,25],[8,40]],title:'y = 5x',titleY:60});}
function gQ4(){graphDiag({xmin:0.7,xmax:14,ymax:40,xstep:2,ystep:5,xl:'x',yl:'y',fn:function(x){return 36/x;},pts:[[2,18],[3,12],[6,6],[12,3]],title:'y = {36|x}',titleY:50});}
function gQ6(){graphDiag({xmax:6,ymax:300,xstep:1,ystep:50,xl:'time t (hours)',yl:'distance d (km)',fn:function(x){return 45*x;},pts:[[2,90],[3,135],[5,225]],title:'d = 45t',titleY:60});}
function gQ7(){graphDiag({xmin:2.5,xmax:14,ymax:14,xstep:2,ystep:2,xl:'workers',yl:'days',fn:function(x){return 36/x;},pts:[[3,12],[4,9],[6,6],[9,4],[12,3]],yx:true,title:'days = {36|workers}',titleY:40});}
/* Q4: the product x × y is always the same */
function productDiag(p){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(R(0,0,480,300,'#fdf7f4'));
  o.push(R(20,16,440,40,'#fff5f0','#C0272D',1.5));
  o.push(T(240,42,'Inverse proportion: x × y is ALWAYS the same number','#C0272D',14,'middle',true));
  var xs=[1,2,3,4,6,9,12],cw=56,x0=72;
  o.push(T(40,98,'x','#1a5a8a',15,'middle',true));o.push(T(40,138,'y','#1a5a8a',15,'middle',true));o.push(T(40,184,'x × y','#1a7a3a',13,'middle',true));
  xs.forEach(function(x,i){var cx=x0+i*cw+cw/2;
    o.push(R(x0+i*cw,76,cw,34,'#fff','#E4D6CE',1));o.push(T(cx,99,x,'#241A17',15,'middle',true));
    o.push(R(x0+i*cw,116,cw,34,'#fff','#E4D6CE',1));o.push(T(cx,139,36/x,'#241A17',15,'middle',true));
    o.push(R(x0+i*cw,164,cw,34,'#e8f8ee','#a8dbb8',1));o.push(T(cx,186,'36','#1a7a3a',15,'middle',true));
  });
  o.push(T(240,228,'When x is multiplied by 2, y is divided by 2.','#241A17',13,'middle'));
  o.push(T(240,250,'When x is multiplied by 3, y is divided by 3.','#241A17',13,'middle'));
  o.push(RT(240,284,'The constant k = xy = 36, so y = {36|x}','#1a7a3a',15,true));
  s.innerHTML=o.join('');
}

// Q1 Direct proportion y ∝ x
function dQ1(p){propDiag(p,'direct',[[2,10,'k=5'],[5,25,'k=5'],[8,null,'k=5']],'Direct proportion:  y ∝ x  means  y = kx');}
// Q2 Direct proportion y ∝ x²
function dQ2(p){propDiag(p,'direct2',[[2,12,'k=3'],[3,27,'k=3'],[5,null,'k=3']],'Direct proportion:  y ∝ x²  means  y = kx²');}
// Q3 Direct proportion y ∝ √x
function dQ3(p){propDiag(p,'sqrt',[[4,10,'k=5'],[9,15,'k=5'],[16,null,'k=5']],'Direct proportion:  y ∝ √x  means  y = k√x');}
// Q4 Inverse proportion y ∝ 1/x
function dQ4(p){propDiag(p,'inv',[[2,18,'k=36'],[3,12,'k=36'],[6,null,'k=36']],'Inverse proportion:  y ∝ {1|x}  means  y = {k|x}');}
// Q5 Inverse proportion y ∝ 1/x²
function dQ5(p){propDiag(p,'inv2',[[2,50,'k=200'],[5,8,'k=200'],[10,null,'k=200']],'Inverse proportion:  y ∝ {1|x²}  means  y = {k|x²}');}

function tableDiag(p,headers,rows,formula,answer){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(R(0,0,480,300,'#fdf7f4'));
  if(p>=1){o.push(R(20,16,440,48,'#fff5f0','#C0272D',1.5));o.push(RT(240,46,formula,'#C0272D',15,true));}
  if(p>=2){
    o.push(R(20,72,440,34,'#e8f4ff','#1a5a8a',1));
    headers.forEach(function(h,i){o.push(T(60+i*130,93,h,'#1a5a8a',14,'middle',true));});
  }
  rows.forEach(function(row,ri){
    if(p>=ri+3){
      var ys=110+ri*36;
      row.forEach(function(cell,ci){
        var isQ=(cell==='?');
        o.push(T(60+ci*130,ys+22,cell,isQ?'#C0272D':'#241A17',isQ?16:14,'middle',isQ));
      });
      o.push(L(20,ys+32,460,ys+32,'#E4D6CE',1));
    }
  });
  if(p>=rows.length+3){o.push(R(20,230,440,48,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,260,answer,'#1a7a3a',16,'middle',true));}
  s.innerHTML=o.join('');
}

var QS=[
  {ey:'Q1 · Proportion · Extended',ti:'Direct Proportion  y ∝ x',su:'y is directly proportional to x. When x = 2, y = 10. Find y when x = 8.',lv:'E',steps:[
    {lb:'What does y ∝ x mean?',dr:dQ1,ht:'<span class="lt le">Extended</span><p>The symbol <b>∝</b> means <b>“is proportional to”</b>. So y ∝ x is read “y is directly proportional to x”.</p><p>It means <b>y = kx</b>, where k is a fixed number called the <b>constant of proportionality</b>.</p><ul class="hl"><li>If x is doubled, y is doubled.</li><li>If x is multiplied by 3, y is multiplied by 3.</li><li>If x = 0, then y = 0.</li><li>The ratio '+fr('y','x')+' is always the same number, k.</li></ul>'},
    {lb:'Find k',dr:dQ1,ht:'<p>Write the formula, then substitute the pair of values you know (x = 2, y = 10):</p><div class="fm paper">y = kx<br>10 = k × 2<br>k = '+fr(10,2)+'<br>k = 5</div>'},
    {lb:'Use the formula',dr:dQ1,ht:'<p>Put k back into the formula, then substitute the new value of x:</p><div class="fm paper">y = 5x<br>When x = 8:<br>y = 5 × 8<br>y = <b>40</b></div>'},
    {lb:'The graph of y ∝ x',dr:gQ1,ht:'<p>The graph of y = kx is a <b>straight line through the origin</b> (0, 0). The gradient of the line is k.</p><p>Every point on the line gives the same value of '+fr('y','x')+': '+fr(10,2)+' = '+fr(25,5)+' = '+fr(40,8)+' = 5.</p><p style="font-size:13px;color:#6b5750;">If a graph is a straight line through the origin, the two quantities are directly proportional.</p>'},
    {lb:'Your turn',dr:gQ1,ht:tryIt(function(){var k=rnd(2,8),x1=rnd(2,5),y1=k*x1,x2=rnd(x1+1,10);return{question:'y ∝ x. When x = '+x1+', y = '+y1+'. Find y when x = '+x2+'.',hints:['y = kx, so '+y1+' = k × '+x1,'k = '+fr(y1,x1)+' = '+k,'Then y = '+k+' × '+x2],ans:k*x2,tol:0,unit:'',working:'y = kx<br>'+y1+' = k × '+x1+'<br>k = '+fr(y1,x1)+' = '+k+'<br>y = '+k+' × '+x2+' = '+k*x2};})},

  {ey:'Q2 · Proportion · Extended',ti:'Direct Proportion  y ∝ x²',su:'y is proportional to x². When x = 2, y = 12. Find y when x = 5.',lv:'E',steps:[

    {lb:'Use the formula',dr:dQ2,ht:'<div class="fm paper">y = 3x²<br>When x = 5:<br>y = 3 × 5²<br>y = 3 × 25<br>y = <b>75</b></div>'},
    {lb:'Worked example 2',dr:dQ2,ht:'<p><b>y ∝ x². When x = 3, y = 18. Find y when x = 4.</b></p><div class="fm paper">y = kx²<br>18 = k × 3²<br>18 = 9k<br>k = '+fr(18,9)+' = 2<br>So y = 2x²<br>When x = 4: y = 2 × 4² = 2 × 16 = <b>32</b></div>'},
    {lb:'Worked example 3 (finding x)',dr:dQ2,ht:'<p><b>Using y = 2x² from example 2, find x when y = 50 (x is positive).</b></p><div class="fm paper">50 = 2x²<br>x² = '+fr(50,2)+' = 25<br>x = √25<br>x = <b>5</b></div><p style="font-size:13px;color:#6b5750;">To find x, rearrange the formula: divide by k, then take the square root.</p>'},

  {ey:'Q4 · Proportion · Extended',ti:'Inverse Proportion  y ∝ 1/x',su:'y is inversely proportional to x. When x = 2, y = 18. Find y when x = 6.',lv:'E',steps:[
    {lb:'What does y ∝ 1/x mean?',dr:dQ4,ht:'<span class="lt le">Extended</span><p>y ∝ '+fr(1,'x')+' is read “y is <b>inversely proportional</b> to x”. It means</p><div class="fm">y = '+fr('k','x')+' &nbsp;&nbsp;which is the same as&nbsp;&nbsp; <b>x × y = k</b></div><p>The key idea: <b>the product x × y is always the same number</b>. When x gets bigger, y gets smaller so that the product stays the same.</p>'},
    {lb:'The product is constant',dr:productDiag,ht:'<p>Look at the table. Every pair of values multiplies to give the <b>same product, 36</b>:</p><div class="fm">1 × 36 = 2 × 18 = 3 × 12 = 4 × 9 = 6 × 6 = 36</div><p>If x is doubled, y is halved. If x is multiplied by 3, y is divided by 3. The product never changes.</p>'},
    {lb:'Find k',dr:dQ4,ht:'<p>Because the product is constant, k = x × y. Substitute x = 2, y = 18:</p><div class="fm paper">y = '+fr('k','x')+'<br>18 = '+fr('k',2)+'<br>k = 18 × 2 = 36</div><p>Check: x × y = 2 × 18 = 36 ✓</p>'},
    {lb:'Use the formula',dr:dQ4,ht:'<div class="fm paper">y = '+fr(36,'x')+'<br>When x = 6:<br>y = '+fr(36,6)+'<br>y = <b>6</b></div><p>Check the product: 6 × 6 = 36 ✓</p>'},
    {lb:'The graph of y ∝ 1/x',dr:gQ4,ht:'<p>The graph of y = '+fr(36,'x')+' is a curve that gets closer and closer to both axes but never touches them. For every point on the curve, x × y = 36.</p>'},
    {lb:'Your turn',dr:gQ4,ht:tryIt(function(){var k=rnd(12,60),x1=pick([2,3,4,5,6]),y1=k/x1;while(!Number.isInteger(y1)){k=rnd(12,60);y1=k/x1;}var x2=pick([3,4,5,6,8,10,12]);while(k%x2!==0||x2===x1)x2++;return{question:'y ∝ '+fr(1,'x')+'. When x = '+x1+', y = '+y1+'. Find y when x = '+x2+'.',hints:['The product is constant: k = x × y = '+x1+' × '+y1+' = '+k,'y = '+fr(k,x2)],ans:k/x2,tol:0,unit:'',working:'k = x × y = '+x1+' × '+y1+' = '+k+'<br>y = '+fr(k,x2)+' = '+k/x2+'<br>Check: '+x2+' × '+k/x2+' = '+k+' ✓'};})},
  ]},
  {ey:'Q5 · Proportion · Extended',ti:'Inverse Proportion  y ∝ 1/x²',su:'y ∝ 1/x². When x = 2, y = 50. Find y when x = 5.',lv:'E',steps:[
    {lb:'Write the formula',dr:dQ5,ht:'<span class="lt le">Extended</span><p>y ∝ '+fr(1,'x²')+' means <b>y = '+fr('k','x²')+'</b>, so x² × y = k is constant. When x doubles, y is divided by 2² = 4.</p>'},
    {lb:'Find k',dr:dQ5,ht:'<div class="fm paper">y = '+fr('k','x²')+'<br>50 = '+fr('k','2²')+' = '+fr('k',4)+'<br>k = 50 × 4 = 200</div>'},
    {lb:'Use the formula',dr:dQ5,ht:'<div class="fm paper">y = '+fr(200,'x²')+'<br>When x = 5:<br>y = '+fr(200,'5²')+' = '+fr(200,25)+'<br>y = <b>8</b></div>'},

  {ey:'Q6 · Proportion · Foundation',ti:'Proportion in Context — Distance and Time',su:'A car travels at constant speed: 90 km in 2 hours. How far in 5 hours?',lv:'F',steps:[

    {lb:'The graph',dr:gQ6,ht:'<p>The distance\u2013time graph is a <b>straight line through the origin</b>, so distance is directly proportional to time. The gradient is the speed:</p><div class="fm">gradient = '+fr(90,2)+' = '+fr(135,3)+' = '+fr(225,5)+' = 45 km/h</div>'},
    {lb:'Your turn',dr:gQ6,ht:tryIt(function(){var spd=pick([40,50,60,80,90]),t1=rnd(2,4),d1=spd*t1,t2=rnd(t1+1,6);return{question:'A car covers '+d1+' km in '+t1+' hours at constant speed. How far in '+t2+' hours?',hints:['Speed = '+fr(d1,t1)+' = '+spd+' km/h'],ans:spd*t2,tol:0,unit:'km',working:'speed = '+fr(d1,t1)+' = '+spd+' km/h<br>d = '+spd+' × '+t2+' = '+spd*t2+' km'};})},

  {ey:'Q7 · Proportion · Extended',ti:'Inverse Proportion in Context — Workers and Days',su:'3 workers take 12 days to finish a job. How many workers are needed to finish in 4 days?',lv:'E',steps:[
    {lb:'Identify the proportion',dr:dQ7,ht:'<span class="lt le">Extended</span><p>More workers → fewer days. This is <b>inverse proportion</b>: workers × days = constant.</p>'},
    {lb:'Find the constant',dr:dQ7,ht:'<div class="fm">3 × 12 = 36 &nbsp;(worker-days)</div><p>The job always needs 36 worker-days of work.</p>'},

    {lb:'The graph and its symmetry',dr:gQ7,ht:'<p>The graph of workers × days = 36 is a curve. It is <b>symmetrical about the line y = x</b> (dashed):</p><ul class="hl"><li>(3, 12) and (12, 3) are both on the curve.</li><li>(4, 9) and (9, 4) are both on the curve.</li><li>(6, 6) lies on the line y = x itself.</li></ul><p>This is because swapping the two numbers does not change their product: 3 × 12 = 12 × 3 = 36.</p>'},

  {ey:'Q8 · Proportion · Extended',ti:'Proportion y ∝ x³',su:'y ∝ x³. When x = 2, y = 24. Find y when x = 3.',lv:'E',steps:[
    {lb:'Write the formula',dr:dQ8,ht:'<span class="lt le">Extended</span><p>y ∝ x³ means <b>y = kx³</b>. When x doubles, y is multiplied by 2³ = 8.</p>'},
    {lb:'Find k',dr:dQ8,ht:'<div class="fm paper">y = kx³<br>24 = k × 2³<br>24 = 8k<br>k = '+fr(24,8)+' = 3</div>'},

    {lb:'Evaluate at x = 3',dr:dQ8,ht:'<div class="fm paper">y = 3 × 3³<br>y = 3 × 27<br>y = <b>81</b></div>'},
    {lb:'Where does y ∝ x³ happen in nature?',dr:dQ8,ht:'<p>Cube proportion appears whenever something grows in <b>all three directions</b> at once:</p><ul class="hl"><li><b>Raindrops and hailstones</b> are roughly spheres. Their volume (and mass) is V = '+fr(4,3)+'πr³, so mass ∝ r³. A hailstone with twice the radius is 8 times as heavy.</li><li><b>Fish and other animals</b> keep roughly the same shape as they grow. Scientists who study fish use mass ≈ k × length³.</li><li><b>Planets:</b> Kepler found that for planets orbiting the Sun, (time for one orbit)² ∝ (distance from the Sun)³.</li></ul>'},

  {ey:'Q9 · Proportion · Extended',ti:'Proportion y ∝ √x (Applied)',su:'P ∝ √Q. When Q = 16, P = 20. Find P when Q = 25.',lv:'E',steps:[

    {lb:'Evaluate at d = 6',dr:dQ10,ht:'<div class="fm paper">F = '+fr(144,'6²')+'<br>F = '+fr(144,36)+'<br>F = <b>4</b></div><p>Check: distance tripled (2 → 6), so F is divided by 9: '+fr(36,9)+' = 4 ✓</p>'},

  ]}
];

var qi=0,si=0;
function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti+'<br><span class="badge '+(q.lv==='F'?'bf':'be')+'">'+(q.lv==='F'?'Foundation':'Extended')+'</span>';b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
function render(){bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').textContent=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+String(st.ht).replace(/∝/g,'<span class="pp">∝</span>');st.dr(si);bDT();document.getElementById('pb').disabled=si===0;document.getElementById('nb').textContent=si===q.steps.length-1?'Restart':'Next →';}
document.getElementById('pb').addEventListener('click',function(){if(si>0){si--;render();}});
document.getElementById('nb').addEventListener('click',function(){var q=QS[qi];si=si===q.steps.length-1?0:si+1;render();});
// Lesson links: ?only=2,5 shows just those questions (as ticked in Lesson Mapping); ?q=N opens question N
(function(){var p=new URLSearchParams(location.search),total=QS.length;var only=(p.get('only')||'').split(',').map(Number).filter(function(n){return n>=1&&n<=total;});window.abcQuestionNumbers=null;if(only.length){var nums=[],keep=[];QS.forEach(function(x,i){if(only.indexOf(i+1)>=0){nums.push(i+1);keep.push(x);}});QS.length=0;keep.forEach(function(x){QS.push(x);});window.abcQuestionNumbers=nums;var lbl=document.querySelector('#sb .sb-lbl');if(lbl){lbl.innerHTML='This lesson: '+nums.length+' of '+total+' questions &middot; <a href="'+location.pathname+'" style="color:inherit">show all</a>';}}var q=parseInt(p.get('q'),10);if(q>=1){var idx=window.abcQuestionNumbers?window.abcQuestionNumbers.indexOf(q):q-1;if(idx>=0&&idx<QS.length)qi=idx;}})();
// Keep each question's real number in the sidebar when only some are shown
if(window.abcQuestionNumbers){var _renderAll=render;render=function(){_renderAll.apply(this,arguments);var n=window.abcQuestionNumbers;document.querySelectorAll('#sb .qn').forEach(function(el,i){if(n[i])el.textContent='Q'+n[i];});};}
// Completion: once the last step of every question has been reached, ask the server to verify and save it (as the Mark as Complete button does)
(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
render();
</script>
