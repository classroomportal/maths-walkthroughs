<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Non-Routine Problem Solving (Mixed Strategies) — Extension Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Extension Maths: Non-Routine Problem Solving (Mixed Strategies)</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Working systematically", "teach": ["Non-routine problems often don't have an obvious formula \u2014 working systematically (trying possibilities in order) is a reliable strategy.", "Example: 'Find two numbers that multiply to 24 and add to 10' \u2014 systematically try factor pairs of 24 until one fits.", "Listing possibilities in an organised way (like a table) helps avoid missing a solution or repeating attempts."], "yt_prompt": "Find two numbers that multiply to give the product shown and add to give the sum shown. What is the larger number?"}, {"title": "Working backwards", "teach": ["Some problems are easier to solve by starting from the end result and reversing each step.", "Example: 'I think of a number, double it, add 5, and get 19. What was my number?' \u2192 reverse: 19\u22125=14, 14\u00f72=7.", "This strategy is especially useful for 'I think of a number' style puzzles."], "yt_prompt": "Work backwards to find the starting number:"}, {"title": "Drawing a diagram to visualise a problem", "teach": ["Some problems become much clearer when represented as a simple diagram or picture.", "Example: seating arrangements or path problems are often easier to solve by sketching a quick diagram first.", "Even a rough sketch can reveal a pattern or relationship that's hard to see from the words alone."], "yt_prompt": "Five people stand in a line. If Ade is exactly in the middle, how many people are on each side of him?"}, {"title": "Breaking a problem into smaller parts", "teach": ["Complex problems can often be split into smaller, more manageable steps.", "Example: to find the total cost of a shopping trip with several different items and quantities, calculate each item's cost separately before adding them all together.", "Tackling one small part at a time reduces the chance of making an error across the whole problem."], "yt_prompt": "Solve this multi-step problem \u2014 find the total cost:"}, {"title": "Looking for a pattern", "teach": ["Some problems reveal their answer once you notice a repeating pattern in a sequence of results.", "Example: finding the units digit of a large power (like 7^100) is easier once you notice the units digits repeat in a cycle.", "Try a few small cases first to spot the pattern before tackling the full problem."], "yt_prompt": "The units digit of powers of 2 cycles as 2,4,8,6,2,4,8,6... What is the units digit of 2 to the power shown?"}, {"title": "Using logical elimination", "teach": ["Some problems are solved by eliminating impossible options one by one until only the correct answer remains.", "Example: 'A number is even, greater than 10, less than 20, a multiple of 3, and its digits add up to 9.' Even numbers between 10 and 20: 12, 14, 16, 18 \u2192 multiples of 3: 12, 18 \u2192 digits add up to 9: only 18.", "Work through each clue in turn, narrowing down the possibilities systematically. If more than one number is still left at the end, you need another clue to pin down a single answer."], "yt_prompt": "A number is even, greater than 10, less than 20, a multiple of 3, and its digits add up to 3. What is the number?"}, {"title": "Considering all cases", "teach": ["Some problems require checking more than one possible scenario before reaching a final answer.", "Example: 'The product of two numbers is negative \u2014 what can you say about their signs?' requires considering both (+,\u2212) and (\u2212,+) cases.", "Being thorough and checking every relevant case avoids missing part of the answer."], "yt_prompt": "If the product of two numbers is negative, what must be true about their signs? Type 'one positive one negative':"}, {"title": "Estimating to check a solution is reasonable", "teach": ["After solving a problem, estimate a rough answer to check your precise calculation makes sense.", "Example: if you calculate 29\u00d731 precisely, a quick estimate (30\u00d730=900) confirms your answer should be close to 900.", "This habit catches major errors, like a misplaced decimal point or an incorrect operation."], "yt_prompt": "Estimate first, then calculate precisely:"}, {"title": "Combining multiple strategies", "teach": ["Harder non-routine problems often need more than one strategy combined \u2014 like working backwards AND checking multiple cases.", "Example: complex logic puzzles often require systematic listing plus elimination together.", "Being flexible and willing to switch strategies partway through a problem is a valuable skill."], "yt_prompt": "A number is doubled, then 3 is subtracted, giving 15. What was the original number?"}, {"title": "Mixed practice \u2014 non-routine problem solving", "teach": ["You've now practiced working systematically, working backwards, spotting patterns, and using logical elimination.", "These flexible problem-solving strategies are exactly what's tested in reasoning and non-routine exam questions.", "This final question brings a couple of these strategies together."], "yt_prompt": "I think of a number, add 7, then multiply by 2, giving the result shown. What was my original number?"}];
function ytGen_0() { const a=Math.floor(Math.random()*8)+3; const b=Math.floor(Math.random()*8)+3; const larger=Math.max(a,b); return {q:`Two numbers multiply to ${a*b} and add to ${a+b}. What is the larger number?`, answer:String(larger)}; }
function ytGen_1() { const start=Math.floor(Math.random()*10)+2; const doubled=start*2; const added=doubled+5; return {q:`I think of a number, double it, then add 5. The result is ${added}. What was my number?`, answer:String(start)}; }
function ytGen_2() { return {q:'Five people stand in a line. If Ade is exactly in the middle, how many people are on each side of him?', answer:'2'}; }
function ytGen_3() { const item1=Math.floor(Math.random()*5)+2; const price1=Math.floor(Math.random()*300)+100; const item2=Math.floor(Math.random()*4)+1; const price2=Math.floor(Math.random()*400)+150; const total=item1*price1+item2*price2; return {q:`${item1} items at ₦${price1} each, plus ${item2} items at ₦${price2} each. What is the total cost?`, answer:String(total)}; }
function ytGen_4() { const cycle=[2,4,8,6]; const power=Math.floor(Math.random()*20)+5; const idx=(power-1)%4; return {q:`What is the units digit of 2^${power}?`, answer:String(cycle[idx])}; }
function ytGen_5() { return {q:'A number is even, greater than 10, less than 20, a multiple of 3, and its digits add up to 3. What is the number?', answer:'12'}; }
function ytGen_6() { return {q:'If the product of two numbers is negative, what must be true about their signs?', answer:'one positive one negative'}; }
function ytGen_7() { const a=Math.floor(Math.random()*20)+20; const b=Math.floor(Math.random()*20)+20; return {q:`${a} × ${b}`, answer:String(a*b)}; }
function ytGen_8() { const orig=Math.floor(Math.random()*10)+5; const result=orig*2-3; return {q:`A number is doubled, then 3 is subtracted, giving ${result}. What was the original number?`, answer:String(orig)}; }
function ytGen_9() { const orig=Math.floor(Math.random()*10)+3; const result=(orig+7)*2; return {q:`I think of a number, add 7, then multiply by 2, giving ${result}. What was my original number?`, answer:String(orig)}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val.toLowerCase() == String(currentYT.answer).toLowerCase()) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'EXT-MTH-05';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
    if (!topicRow) return;
    const { data: profRow } = await supabase.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
    if (!profRow) return;
    await supabase.from('walkthrough_interactions').insert({
      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
</script>
</body>
</html>
