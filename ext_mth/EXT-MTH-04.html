<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ratio & Proportion — Multi-Step Problems — Extension Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Extension Maths: Ratio & Proportion — Multi-Step Problems</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Sharing in a ratio \u2014 finding one share", "teach": ["To share an amount in a ratio, add the ratio parts together, divide the total by this sum, then multiply by the relevant part.", "Example: share \u20a64,000 in the ratio 3:5 \u2192 total parts=8, one part=500, so shares are 1,500 and 2,500.", "Always check your two (or more) shares add back up to the original total."], "yt_prompt": "Share this amount in the ratio 3:5. What is the larger share?"}, {"title": "Sharing in a three-part ratio", "teach": ["The same method works for three-part ratios \u2014 add all three parts, divide, then multiply.", "Example: share 60 in the ratio 1:2:3 \u2192 total parts=6, one part=10 \u2192 shares are 10, 20, 30.", "Always double check: do all three shares add back up to the original amount?"], "yt_prompt": "Share this amount in the ratio 2:3:5. What is the smallest share?"}, {"title": "Finding a ratio from given amounts", "teach": ["To find a ratio from two amounts, write them as a fraction and simplify by dividing both by their highest common factor.", "Example: 15 and 25 \u2192 ratio 15:25 \u2192 divide both by 5 \u2192 3:5.", "This is the reverse process of sharing an amount using a given ratio."], "yt_prompt": "Simplify this ratio fully (write as e.g. 3:5):"}, {"title": "Direct proportion \u2014 scaling up", "teach": ["In direct proportion, as one quantity increases, the other increases at the same rate.", "Example: if 3 pens cost \u20a6150, then 9 pens (3 times as many) cost 3\u00d7\u20a6150=\u20a6450.", "Find the value for one unit first, then scale to whatever quantity is needed."], "yt_prompt": "If 3 items cost the amount shown, how much would 9 items cost?"}, {"title": "Direct proportion \u2014 finding a unit rate", "teach": ["Finding the 'unit rate' (the value for just 1 unit) makes solving proportion problems much easier.", "Example: if 5kg of rice costs \u20a62,000, then 1kg costs \u20a62,000\u00f75=\u20a6400.", "Once you know the unit rate, you can scale to any quantity needed."], "yt_prompt": "Find the cost of 1 unit, given the total cost:"}, {"title": "Best value comparisons using unit rates", "teach": ["To compare which product offers better value, calculate the price per unit for each option, then compare.", "Example: 500g for \u20a6300 vs 750g for \u20a6400 \u2014 per 100g, that's \u20a660 vs \u20a653.33 \u2014 the second is better value.", "Always compare using the same unit (e.g. price per 100g) for a fair comparison."], "yt_prompt": "Which is better value? Type 'A' or 'B':"}, {"title": "Inverse proportion", "teach": ["In inverse proportion, as one quantity increases, the other decreases at a related rate (their product stays constant).", "Example: if 4 workers take 12 days to finish a job, then 8 workers (twice as many) would take half the time: 6 days.", "Multiply the two known quantities together first \u2014 this constant product helps you scale to any new scenario."], "yt_prompt": "If this many workers take the number of days shown, how many days would double the workers take?"}, {"title": "Multi-step ratio and proportion word problem", "teach": ["Some problems combine ratio sharing with an additional proportion step.", "Example: 'A recipe uses flour and sugar in the ratio 3:1. If 240g of flour is used, how much sugar is needed?' \u2192 find the value of 1 ratio part, then scale.", "Break the problem into clear steps: identify the ratio, find one part's value, then answer the actual question."], "yt_prompt": "A recipe uses flour and sugar in the ratio 3:1. If this much flour is used, how much sugar is needed?"}, {"title": "Scaling a ratio to match a new total", "teach": ["When a ratio needs to be scaled to a new total, first work out what one 'part' is worth in the new total.", "Example: a ratio 2:3 needs to total 100 instead of the original 20 \u2192 scale factor is 5, so new ratio amounts are 10:15.", "Always check the new amounts still simplify back to the original ratio."], "yt_prompt": "Scale the ratio 2:3 so the two parts add up to the total shown. What is the larger part?"}, {"title": "Mixed practice \u2014 ratio and proportion", "teach": ["You've now covered sharing ratios, simplifying ratios, direct and inverse proportion, and multi-step word problems.", "These skills combine frequently in real-world contexts like recipes, best-value shopping, and work-rate problems.", "This final question brings a couple of these ideas together."], "yt_prompt": "Share this amount in the ratio 4:1. What is the smaller share?"}];
function ytGen_0() { const part=Math.floor(Math.random()*400)+100; const total=part*8; return {q:`Share ${total} in the ratio 3:5. What is the larger share?`, answer:String(part*5)}; }
function ytGen_1() { const part=Math.floor(Math.random()*30)+5; const total=part*10; return {q:`Share ${total} in the ratio 2:3:5. What is the smallest share?`, answer:String(part*2)}; }
function ytGen_2() { const factor=Math.floor(Math.random()*8)+2; const a=3*factor; const b=5*factor; return {q:`${a}:${b}`, answer:'3:5'}; }
function ytGen_3() { const perItem=(Math.floor(Math.random()*20)+10)*10; const cost3=perItem*3; return {q:`3 items cost ₦${cost3}. How much would 9 items cost?`, answer:String(perItem*9)}; }
function ytGen_4() { const unitCost=Math.floor(Math.random()*40)+10; const qty=Math.floor(Math.random()*8)+3; const total=unitCost*qty; return {q:`${qty} items cost ₦${total} in total. What does 1 item cost?`, answer:String(unitCost)}; }
function ytGen_5() { const priceA=Math.floor(Math.random()*200)+100; const sizeA=500; const priceB=priceA*0.85; const sizeB=400; const rateA=priceA/sizeA; const rateB=priceB/sizeB; const better = rateA<rateB?'A':'B'; return {q:`A: ${sizeA}g for ₦${priceA.toFixed(0)}. B: ${sizeB}g for ₦${priceB.toFixed(0)}. Which is better value?`, answer:better}; }
function ytGen_6() { const workers=Math.floor(Math.random()*5)+2; const days=Math.floor(Math.random()*10)+8; const newDays=Math.round((workers*days)/(workers*2)); return {q:`${workers} workers take ${days} days to finish a job. How many days would ${workers*2} workers take?`, answer:String(newDays)}; }
function ytGen_7() { const part=Math.floor(Math.random()*30)+20; const flour=part*3; return {q:`Flour and sugar are in the ratio 3:1. ${flour}g of flour is used. How much sugar is needed?`, answer:String(part)}; }
function ytGen_8() { const factor=Math.floor(Math.random()*10)+3; const total=5*factor; return {q:`Scale the ratio 2:3 so the parts add up to ${total}. What is the larger part?`, answer:String(3*factor)}; }
function ytGen_9() { const part=Math.floor(Math.random()*20)+10; const total=part*5; return {q:`Share ${total} in the ratio 4:1. What is the smaller share?`, answer:String(part)}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val.toLowerCase() == String(currentYT.answer).toLowerCase()) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'EXT-MTH-04';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
    if (!topicRow) return;
    const { data: profRow } = await supabase.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
    if (!profRow) return;
    await supabase.from('walkthrough_interactions').insert({
      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
</script>
</body>
