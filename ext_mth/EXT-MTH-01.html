<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algebraic Reasoning — Forming & Solving Equations — Extension Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:10px 12px; border-radius:6px; margin:8px 0; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  input[type=text] { padding:10px; font-size:1rem; border:2px solid #ddd; border-radius:8px; width:140px; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Extension Maths: Algebraic Reasoning — Forming & Solving Equations</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Turning words into an equation", "teach": ["Word problems can be translated into algebraic equations by assigning a letter to the unknown quantity.", "Example: 'A number multiplied by 3, then increased by 7, gives 22' becomes 3x + 7 = 22.", "Identify the unknown first, then build the equation step by step, following the order the words describe."], "yt_prompt": "Form and solve: a number multiplied by 4, then increased by 5, gives the total shown."}, {"title": "Equations with brackets", "teach": ["When an equation has brackets, expand them first before solving.", "Example: 2(x + 3) = 16 \u2192 expand to 2x + 6 = 16 \u2192 2x = 10 \u2192 x = 5.", "Always expand fully before attempting to isolate the unknown."], "yt_prompt": "Solve for x:"}, {"title": "Equations with the unknown on both sides", "teach": ["When x appears on both sides of the equation, collect all the x terms on one side first.", "Example: 5x + 3 = 2x + 12 \u2192 subtract 2x from both sides \u2192 3x + 3 = 12 \u2192 3x = 9 \u2192 x = 3.", "Always move the smaller x term across so you're left with a positive coefficient."], "yt_prompt": "Solve for x:"}, {"title": "Forming equations from perimeter problems", "teach": ["Geometric problems often need an equation built from a shape's known properties, like perimeter.", "Example: a rectangle has length (x+3) and width x, and perimeter 26. Then 2(x+3+x)=26 \u2192 solve for x.", "Set up the equation carefully based on the shape's formula before solving."], "yt_prompt": "A rectangle has length (x + 4) and width x. Its perimeter is shown. Find x."}, {"title": "Non-routine problem \u2014 consecutive numbers", "teach": ["Consecutive numbers follow one after another (e.g. n, n+1, n+2). Set up an equation using this pattern.", "Example: 'Three consecutive numbers add up to 63' \u2192 n + (n+1) + (n+2) = 63 \u2192 3n+3=63 \u2192 n=20.", "This pattern-based approach works for many classic reasoning problems."], "yt_prompt": "Three consecutive numbers add up to the total shown. What is the smallest number?"}, {"title": "Non-routine problem \u2014 ages", "teach": ["Age problems often involve setting up an equation relating two people's ages, sometimes with a time shift.", "Example: 'Ade is 3 years older than Bola. Together their ages total 27' \u2192 x + (x+3) = 27 \u2192 x=12.", "Define the unknown clearly (usually the younger/smaller value) before setting up the equation."], "yt_prompt": "Ade is 5 years older than Bola. Together their ages total the number shown. How old is Bola?"}, {"title": "Simultaneous reasoning \u2014 two unknowns from context", "teach": ["Some problems give you two pieces of information about two unknowns \u2014 use one to substitute into the other.", "Example: 'Two numbers add to 20, and one is 3 times the other' \u2192 x + 3x = 20 \u2192 4x=20 \u2192 x=5, other=15.", "This is an early introduction to simultaneous equation thinking, without needing formal notation yet."], "yt_prompt": "Two numbers add to the total shown, and one is 4 times the other. What is the smaller number?"}, {"title": "Checking algebraic reasoning with substitution", "teach": ["Always verify your solution by substituting it back into the original equation or problem statement.", "Example: if you solved 3x+7=22 and got x=5, check: 3(5)+7=15+7=22 \u2713.", "This habit catches errors before submitting a final answer, especially in multi-step problems."], "yt_prompt": "Solve and verify: what value of x satisfies this equation?"}, {"title": "Forming an equation from a shared-cost problem", "teach": ["Real-life sharing problems can be modelled algebraically when amounts are related.", "Example: 'Three friends share a bill, but one pays \u20a6500 more than the other two combined equally' \u2014 set up an equation based on what's described.", "Read carefully to identify exactly how the unknown relates to the total."], "yt_prompt": "A total bill is shared so that one friend pays x, and the other two each pay x\u22125. Together they pay the total shown. Find x."}, {"title": "Mixed algebraic reasoning practice", "teach": ["You've now covered forming equations from words, brackets, x on both sides, and classic reasoning problems.", "These skills combine frequently in exam questions, so being flexible across different problem types is valuable.", "This final question brings a couple of these ideas together."], "yt_prompt": "Solve for x:"}];
function ytGen_0() { const x=Math.floor(Math.random()*10)+2; const total=4*x+5; return {q:`4x + 5 = ${total}. What is x?`, answer:String(x)}; }
function ytGen_1() { const a=Math.floor(Math.random()*4)+2; const x=Math.floor(Math.random()*8)+2; const b=Math.floor(Math.random()*5)+1; const total=a*(x+b); return {q:`${a}(x + ${b}) = ${total}. What is x?`, answer:String(x)}; }
function ytGen_2() { const x=Math.floor(Math.random()*8)+2; const a=Math.floor(Math.random()*3)+4; const b=Math.floor(Math.random()*3)+2; const c=Math.floor(Math.random()*10)+3; const lhs=a*x+c; const rhs=b*x+c+(a-b)*x; return {q:`${a}x + ${c} = ${b}x + ${c+(a-b)*x}. What is x?`, answer:String(x)}; }
function ytGen_3() { const x=Math.floor(Math.random()*8)+2; const perimeter=2*((x+4)+x); return {q:`Perimeter = 2 × ((x+4) + x) = ${perimeter}. What is x?`, answer:String(x)}; }
function ytGen_4() { const n=Math.floor(Math.random()*20)+5; const total=3*n+3; return {q:`Three consecutive numbers add up to ${total}. What is the smallest number?`, answer:String(n)}; }
function ytGen_5() { const bola=Math.floor(Math.random()*15)+8; const total=2*bola+5; return {q:`Ade is 5 years older than Bola. Together their ages total ${total}. How old is Bola?`, answer:String(bola)}; }
function ytGen_6() { const small=Math.floor(Math.random()*8)+2; const total=small+4*small; return {q:`Two numbers add to ${total}, and one is 4 times the other. What is the smaller number?`, answer:String(small)}; }
function ytGen_7() { const x=Math.floor(Math.random()*10)+3; const a=Math.floor(Math.random()*4)+2; const b=Math.floor(Math.random()*10)+2; const total=a*x-b; return {q:`${a}x − ${b} = ${total}. What is x?`, answer:String(x)}; }
function ytGen_8() { const x=Math.floor(Math.random()*20)+10; const total=x+2*(x-5); return {q:`One friend pays x, and two others each pay (x−5). Together they pay ${total}. Find x.`, answer:String(x)}; }
function ytGen_9() { const x=Math.floor(Math.random()*8)+3; const total=3*(x+2); return {q:`3(x + 2) = ${total}. What is x?`, answer:String(x)}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        <div class="worked">${currentYT.q}</div>
        <input type="text" id="ytAnswer" placeholder="Your answer">
        <button class="act" onclick="checkYT()">Check</button>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT() {
  const val = document.getElementById('ytAnswer').value.trim();
  const fb = document.getElementById('ytFeedback');
  if (val.toLowerCase() == String(currentYT.answer).toLowerCase()) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — try again.</div>';
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'EXT-MTH-01';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
    if (!topicRow) return;
    const { data: profRow } = await supabase.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
    if (!profRow) return;
    await supabase.from('walkthrough_interactions').insert({
      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
</script>
</body>
