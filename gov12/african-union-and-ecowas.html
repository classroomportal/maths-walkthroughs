document.addEventListener('click',function(e){

{ey:'Q1 \u2022 Gov • International Relations',ti:'From the OAU to the African Union',su:'Trace the transformation from the Organisation of African Unity to the African Union.',steps:[

{lb:'The OAU\'s key principle: territorial integrity',dr:dQ1,ht:'<p>The OAU adopted a strict principle of respecting existing <b>colonial-era borders</b> and non-interference in members\' internal affairs, aiming to prevent conflicts over Africa\'s often arbitrarily-drawn boundaries, though critics argue this also allowed dictatorial regimes to escape scrutiny.</p>'},
{lb:'From OAU to AU (2002)',dr:dQ1,ht:'<p>The OAU was replaced by the <b>African Union (AU)</b> in <b>2002</b>, following a decision at the 1999 Sirte Summit, with an expanded mandate that included, for the first time, a formal right to <b>intervene in member states</b> facing war crimes, genocide or crimes against humanity.</p>'},
{lb:'Nigeria\'s founding role',dr:dQ1,ht:'<p>Nigeria was among the OAU\'s founding members in 1963 and has remained a leading AU member since 2002, consistently among its largest financial contributors and most active participants in AU peacekeeping and diplomatic initiatives.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"In which city was the OAU founded in 1963?","o":["Addis Ababa, Ethiopia","Lagos, Nigeria","Accra, Ghana","Cairo, Egypt"],"a":0,"w":"The OAU was founded in Addis Ababa, Ethiopia, in May 1963."},{"q":"How many independent African states founded the OAU in 1963?","o":["10","32","55","15"],"a":1,"w":"32 independent African states founded the OAU in 1963."},{"q":"What key principle did the OAU adopt regarding colonial-era borders?","o":["Abolishing all national borders in Africa","Immediately redrawing all African borders","Respecting existing colonial-era borders and non-interference in internal affairs","Restoring direct colonial rule"],"a":2,"w":"The OAU adopted a principle of respecting existing colonial-era borders and non-interference in internal affairs."},{"q":"What criticism is made of the OAU's non-interference principle?","o":["It abolished all national governments","It caused immediate war between all member states","It gave too much power to the United Nations","It allowed dictatorial regimes to escape scrutiny"],"a":3,"w":"Critics argue the non-interference principle allowed dictatorial regimes to escape scrutiny."},{"q":"In which year was the OAU replaced by the African Union?","o":["2002","1963","1999","2010"],"a":0,"w":"The OAU was replaced by the African Union in 2002."},{"q":"At which summit was the decision to transform the OAU into the AU made?","o":["The 1963 Addis Ababa founding conference","The 1999 Sirte Summit","The 2005 Ezulwini meeting","The 1990 Benin National Conference"],"a":1,"w":"The 1999 Sirte Summit made the decision to transform the OAU into the AU."},{"q":"What new formal right did the AU gain, unlike the OAU?","o":["The right to abolish all African currencies","The right to colonise other continents","The right to intervene in member states facing war crimes or genocide","The right to dissolve any member state's government at will"],"a":2,"w":"The AU gained the formal right to intervene in member states facing war crimes, genocide or crimes against humanity."},{"q":"What has Nigeria's role been within both the OAU and its successor, the AU?","o":["A state that has never joined either organisation","A member that has never contributed financially","A state that left the OAU/AU decades ago","A founding member and leading, active participant"],"a":3,"w":"Nigeria was a founding OAU member and has remained a leading, active AU member since 2002."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'The Assembly of Heads of State and Government',dr:dQ2,ht:'<p>The <b>Assembly of Heads of State and Government</b> is the AU\'s supreme decision-making body, bringing together all 55 member state leaders (or their representatives) at least once a year to set policy direction and elect AU leadership.</p>'},
{lb:'The African Union Commission',dr:dQ2,ht:'<p>The <b>African Union Commission</b>, based in Addis Ababa, functions as the AU\'s <b>secretariat</b>, implementing decisions, coordinating day-to-day administration, and representing the AU internationally, headed by an elected <b>Chairperson</b>.</p>'},
{lb:'The Peace and Security Council',dr:dQ2,ht:'<p>The <b>Peace and Security Council (PSC)</b>, established in 2004, is the AU\'s key body for conflict prevention, management and resolution &mdash; often compared to the UN Security Council, though without permanent members or a veto &mdash; and can authorise AU peace support operations.</p>'},
{lb:'The Pan-African Parliament and African Court',dr:dQ2,ht:'<p>The <b>Pan-African Parliament</b> (based in South Africa) provides a forum for African peoples\' representation, though currently with mainly advisory rather than legislative powers, while the <b>African Court on Human and Peoples\' Rights</b> adjudicates human rights disputes referred to it.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which body is the AU's supreme decision-making body?","o":["The Assembly of Heads of State and Government","The African Union Commission","The Pan-African Parliament","The African Court"],"a":0,"w":"The Assembly of Heads of State and Government is the AU's supreme decision-making body."},{"q":"How often does the Assembly of Heads of State and Government typically meet?","o":["Once every ten years","At least once a year","Only once, at the AU's founding","Every day"],"a":1,"w":"The Assembly typically meets at least once a year to set policy direction."},{"q":"Which body functions as the AU's secretariat, based in Addis Ababa?","o":["The Pan-African Parliament","The Peace and Security Council","The African Union Commission","The African Court"],"a":2,"w":"The African Union Commission functions as the AU's secretariat, based in Addis Ababa."},{"q":"In which year was the AU's Peace and Security Council established?","o":["1999","2002","1963","2004"],"a":3,"w":"The Peace and Security Council was established in 2004."},{"q":"What is the Peace and Security Council's main function?","o":["Conflict prevention, management and resolution","Managing the AU's annual budget only","Organising cultural festivals","Issuing passports to AU citizens"],"a":0,"w":"The Peace and Security Council's main function is conflict prevention, management and resolution."},{"q":"Unlike the UN Security Council, what does the AU's Peace and Security Council lack?","o":["Any members at all","Permanent members with a veto","Any role in African security","Any connection to the AU"],"a":1,"w":"Unlike the UN Security Council, the AU's Peace and Security Council lacks permanent members with a veto."},{"q":"Where is the Pan-African Parliament based?","o":["Ethiopia","Nigeria","South Africa","Ghana"],"a":2,"w":"The Pan-African Parliament is based in South Africa."},{"q":"What kind of powers does the Pan-African Parliament currently mainly have?","o":["No powers or function at all","Full legislative powers over all African states","Powers to declare war","Advisory rather than legislative powers"],"a":3,"w":"The Pan-African Parliament currently has mainly advisory rather than legislative powers."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov • International Relations',ti:'Achievements of the African Union',su:'Evaluate the African Union\'s key achievements since its founding.',steps:[
{lb:'Peacekeeping and conflict resolution',dr:dQ1,ht:'<p>The AU has deployed peace support operations in multiple conflicts, including the <b>African Union Mission in Somalia (AMISOM, since 2007)</b> against al-Shabaab, and the joint <b>UN-AU Mission in Darfur (UNAMID)</b>, demonstrating a growing capacity for African-led peacekeeping.</p>'},
{lb:'Continental economic integration: AfCFTA',dr:dQ1,ht:'<p>The <b>African Continental Free Trade Area (AfCFTA)</b>, which came into force in <b>2021</b>, represents the AU\'s most significant recent economic achievement &mdash; aiming to create the world\'s largest free trade area by number of participating countries, boosting intra-African trade.</p>'},
{lb:'Election observation and democratic norms',dr:dQ1,ht:'<p>The AU has developed election observation missions and, through frameworks like the <b>African Charter on Democracy, Elections and Governance (2007)</b>, established norms condemning <b>unconstitutional changes of government</b>, applying suspensions after coups in member states.</p>'},

":"What overall benefit does collective AU action give African states on the global stage?","o":["Complete economic self-sufficiency","No benefit at all compared to acting alone","A guaranteed permanent UN Security Council seat immediately","A stronger collective voice than they would have individually"],"a":3,"w":"Collective AU action gives African states a stronger collective voice than they would have acting individually."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'Financial dependency',dr:dQ2,ht:'<p>The AU remains heavily dependent on <b>external funding</b> from partners such as the European Union and individual donor states for a significant share of its budget and peacekeeping operations, raising questions about its genuine independence and "African ownership" of its own agenda.</p>'},
{lb:'Enforcement limitations',dr:dQ2,ht:'<p>Like ECOWAS, the AU has struggled to consistently <b>enforce</b> its own decisions against powerful or resistant member states &mdash; suspension from the organisation carries limited practical consequences if a suspended government retains domestic control and other international partners.</p>'},
{lb:'Slow and inconsistent responses to crises',dr:dQ2,ht:'<p>Critics point to <b>slow or inconsistent AU responses</b> to certain crises &mdash; contrasted with faster, more decisive action in others &mdash; often attributed to competing national interests among influential member states affecting collective decision-making.</p>'},
{lb:'Balancing sovereignty and intervention',dr:dQ2,ht:'<p>The AU continues to navigate tension between its founding commitment to <b>sovereignty and non-interference</b> (inherited from the OAU) and its newer, more interventionist mandate &mdash; a tension that shapes, and sometimes limits, its responses to internal crises within member states.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What has the AU remained heavily dependent on for a significant share of its budget?","o":["External funding from partners such as the EU","Entirely self-generated revenue with no external funding","Funding solely from Nigeria","No funding at all"],"a":0,"w":"The AU remains heavily dependent on external funding from partners such as the EU."},{"q":"What question does this financial dependency raise?","o":["Questions about whether Africa has any countries at all","Questions about the AU's genuine independence and \"African ownership\" of its agenda","Questions about whether the AU has ever met","Questions about Nigeria's GDP specifically"],"a":1,"w":"This dependency raises questions about the AU's genuine independence and \"African ownership\" of its agenda."},{"q":"What practical limitation affects the AU's ability to enforce decisions against resistant states?","o":["All member states always immediately comply with AU decisions","The AU has unlimited military power over all member states","Suspension carries limited consequences if the state retains domestic control and other partners","The AU has no enforcement mechanisms of any kind"],"a":2,"w":"Suspension carries limited practical consequences if a suspended government retains domestic control and other international partners."},{"q":"What is often cited as a reason for slow or inconsistent AU responses to certain crises?","o":["A rule requiring unanimous agreement from all 55 states on every issue","A complete absence of any member states","A total lack of any funding whatsoever","Competing national interests among influential member states"],"a":3,"w":"Competing national interests among influential member states are often cited as a reason for slow or inconsistent responses."},{"q":"What founding commitment did the AU inherit from the OAU regarding sovereignty?","o":["A commitment to sovereignty and non-interference","A commitment to unlimited intervention in all member states","A commitment to abolishing all national governments","A commitment to restoring colonial rule"],"a":0,"w":"The AU inherited a founding commitment to sovereignty and non-interference from the OAU."},{"q":"What tension does the AU continue to navigate regarding this inherited commitment?","o":["No tension at all — both commitments are identical","Tension between sovereignty/non-interference and its newer interventionist mandate","Tension only between Nigeria and Ghana specifically","Tension only regarding trade policy"],"a":1,"w":"The AU navigates tension between its inherited sovereignty/non-interference commitment and its newer, more interventionist mandate."},{"q":"What can this sovereignty-versus-intervention tension do to AU responses to internal crises?","o":["Guarantee immediate, decisive action in every single case","Have no effect on AU responses whatsoever","Shape and sometimes limit its responses to internal crises","Only affect responses in non-African crises"],"a":2,"w":"This tension shapes and sometimes limits the AU's responses to internal crises within member states."},{"q":"What overall balanced conclusion should a WAEC essay draw about the AU?","o":["It should be immediately abolished with no further discussion","It has achieved absolutely nothing of value since 1963","It has no criticisms or limitations whatsoever","It has real achievements but also real, ongoing limitations and criticisms"],"a":3,"w":"A balanced WAEC essay should acknowledge both the AU's real achievements and its real, ongoing limitations."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov • International Relations',ti:'ECOWAS: Founding and Economic Mandate',su:'Explain ECOWAS\'s founding, economic goals and institutional structure.',steps:[
{lb:'Founding by the Treaty of Lagos (1975)',dr:dQ1,ht:'<p><b>ECOWAS</b> was founded by the <b>Treaty of Lagos in 1975</b>, bringing together <b>15 West African states</b>, with Nigeria as a leading founding member, aiming primarily to promote <b>economic cooperation and integration</b> across the region.</p>'},
{lb:'Core economic goals',dr:dQ1,ht:'<p>ECOWAS\'s core economic goals include creating a <b>common market</b>, removing trade barriers between member states, harmonising economic policies, and eventually establishing a <b>single regional currency</b> (the long-planned but not yet implemented "Eco").</p>'},
{lb:'Free movement of persons',dr:dQ1,ht:'<p>ECOWAS\'s <b>Protocol on Free Movement</b> allows citizens of member states to travel, reside and, in principle, work across the region without visas &mdash; one of its most concretely implemented achievements, though practical barriers and border harassment persist.</p>'},
{lb:'Institutional structure',dr:dQ1,ht:'<p>ECOWAS\'s institutions include the <b>Authority of Heads of State and Government</b> (supreme decision-making body), the <b>ECOWAS Commission</b> (administrative secretariat, based in Abuja, Nigeria), and the <b>ECOWAS Parliament and Court of Justice</b>.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which treaty founded ECOWAS in 1975?","o":["The Treaty of Lagos","The Treaty of Lomé","The Berlin Conference","The Montevideo Convention"],"a":0,"w":"ECOWAS was founded by the Treaty of Lagos in 1975."},{"q":"How many West African states were brought together by ECOWAS's founding?","o":["55","15","36","10"],"a":1,"w":"15 West African states were brought together by ECOWAS's founding."},{"q":"What was ECOWAS's primary founding aim?","o":["Religious unification","Military conquest of neighbouring regions","Economic cooperation and integration","Abolishing all national governments"],"a":2,"w":"ECOWAS's primary founding aim was economic cooperation and integration across West Africa."},{"q":"What is the long-planned but not yet implemented single ECOWAS currency called?","o":["The West African Pound","The Naira Union","The CFA Franc","The Eco"],"a":3,"w":"\"The Eco\" is the long-planned but not yet implemented single ECOWAS currency."},{"q":"What does ECOWAS's Protocol on Free Movement allow?","o":["Citizens of member states to travel, reside and work across the region without visas","Only heads of state to travel between member countries","Only military personnel to cross borders","Nothing — the protocol has never existed"],"a":0,"w":"The Protocol on Free Movement allows citizens to travel, reside and work across ECOWAS states without visas."},{"q":"What practical problem persists despite the Protocol on Free Movement?","o":["Complete closure of all ECOWAS borders","Practical barriers and border harassment","A total ban on all travel between member states","No problems at all — implementation is perfect"],"a":1,"w":"Practical barriers and border harassment persist despite the Protocol on Free Movement."},{"q":"Where is the ECOWAS Commission, its administrative secretariat, based?","o":["Accra, Ghana","Addis Ababa, Ethiopia","Abuja, Nigeria","Dakar, Senegal"],"a":2,"w":"The ECOWAS Commission, its administrative secretariat, is based in Abuja, Nigeria."},{"q":"What is ECOWAS's supreme decision-making body called?","o":["The ECOWAS Commission","The ECOWAS Parliament","The ECOWAS Court of Justice","The Authority of Heads of State and Government"],"a":3,"w":"The Authority of Heads of State and Government is ECOWAS's supreme decision-making body."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov • International Relations',ti:'ECOWAS\'s Political and Security Evolution',su:'Explain how ECOWAS expanded from an economic body into a security and political actor.',steps:[
{lb:'From economics to security: ECOMOG',dr:dQ2,ht:'<p>ECOWAS developed an ad hoc security role through <b>ECOMOG</b> (the ECOWAS Monitoring Group), first deployed to <b>Liberia in 1990</b> and later Sierra Leone (1997), well before any formal legal security mandate existed &mdash; a pragmatic response to regional crises threatening spillover.</p>'},
{lb:'Formalising the security mandate (1999)',dr:dQ2,ht:'<p>ECOWAS formalised its security role through the <b>1999 Mechanism for Conflict Prevention, Management, Resolution, Peacekeeping and Security</b>, giving legal structure to what had previously been ad hoc interventions.</p>'},
{lb:'Responding to unconstitutional government changes',dr:dQ2,ht:'<p>ECOWAS has increasingly applied <b>sanctions and suspensions</b> against member states following coups &mdash; Mali (2021), Guinea (2021), Burkina Faso (2022), Niger (2023) &mdash; reflecting a growing, if imperfectly enforced, commitment to democratic norms across the region.</p>'},
{lb:'The limits shown by recent Sahel crises',dr:dQ2,ht:'<p>ECOWAS\'s threatened but uncarried-out <b>military intervention in Niger (2023)</b>, and the subsequent formation of the breakaway <b>Alliance of Sahel States</b> by Mali, Burkina Faso and Niger, starkly illustrate the practical limits of ECOWAS\'s political and security authority when member states resist collectively.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What was ECOMOG's first major deployment, in 1990?","o":["Liberia","Sierra Leone","Nigeria","Mali"],"a":0,"w":"ECOMOG's first major deployment, in 1990, was to Liberia."},{"q":"In which year did ECOMOG also deploy to Sierra Leone?","o":["1990","1997","1975","1999"],"a":1,"w":"ECOMOG also deployed to Sierra Leone in 1997."},{"q":"Before what did ECOMOG operate, showing ECOWAS's pragmatic, ad hoc security evolution?","o":["Nigeria became independent","ECOWAS itself was founded","Any formal legal security mandate existed","The Treaty of Lagos was signed"],"a":2,"w":"ECOMOG operated before any formal legal security mandate existed, showing a pragmatic, ad hoc evolution."},{"q":"In which year did ECOWAS formalise its security mandate through a legal Mechanism?","o":["1997","1975","1990","1999"],"a":3,"w":"ECOWAS formalised its security mandate through the 1999 Mechanism for Conflict Prevention and Security."},{"q":"Which West African states has ECOWAS suspended following recent coups (2021-2023)?","o":["Mali, Guinea, Burkina Faso and Niger","Senegal, Ghana and Nigeria","Sierra Leone and Liberia","Côte d'Ivoire and Togo"],"a":0,"w":"ECOWAS has suspended Mali, Guinea, Burkina Faso and Niger following recent coups."},{"q":"What did ECOWAS threaten but ultimately not carry out following Niger's 2023 coup?","o":["Immediate diplomatic recognition of the coup","Military intervention","A permanent alliance with the coup leaders","Full economic integration with Niger's new government"],"a":1,"w":"ECOWAS threatened but ultimately did not carry out military intervention following Niger's 2023 coup."},{"q":"What breakaway alliance did Mali, Burkina Faso and Niger subsequently form?","o":["The African Union Standby Force","A new ECOWAS faction","The Alliance of Sahel States","A new United Nations body"],"a":2,"w":"Mali, Burkina Faso and Niger subsequently formed the Alliance of Sahel States."},{"q":"What does the Niger case illustrate about ECOWAS's authority?","o":["That ECOWAS always achieves every stated goal immediately","Its unlimited and always-effective enforcement power","That ECOWAS has no security role at all","Its practical limits when member states resist collectively"],"a":3,"w":"The Niger case illustrates the practical limits of ECOWAS's authority when member states resist collectively."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov • International Relations',ti:'Nigeria\'s Leadership in the AU and ECOWAS',su:'Evaluate Nigeria\'s specific contributions and influence within both organisations.',steps:[
{lb:'Financial and troop contributions',dr:dQ1,ht:'<p>Nigeria has consistently been among the <b>largest financial contributors</b> to both the AU and ECOWAS, and provided the overwhelming majority of troops for <b>ECOMOG</b> interventions in Liberia and Sierra Leone, reflecting substantial national investment in regional stability.</p>'},
{lb:'Diplomatic leadership in crises',dr:dQ1,ht:'<p>Nigerian leaders and diplomats have repeatedly taken <b>lead diplomatic roles</b> in responding to regional crises &mdash; from Liberia and Sierra Leone in the 1990s-2000s to the recent Sahel coup wave &mdash; consistent with Nigeria\'s stated Africa-centred foreign policy.</p>'},
{lb:'Advocacy for institutional reform',dr:dQ1,ht:'<p>Nigeria has been a leading advocate, through the AU\'s <b>Ezulwini Consensus</b>, for reforming the UN Security Council to include permanent African representation, positioning itself as a natural candidate for any such seat given its size and contributions.</p>'},
{lb:'Balancing costs and domestic criticism',dr:dQ1,ht:'<p>Nigeria\'s extensive regional leadership role periodically faces <b>domestic criticism</b> questioning whether its financial and military costs are proportionate to direct national benefit, especially during periods of domestic economic hardship &mdash; a recurring tension in Nigerian foreign policy debates.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What kind of contributor has Nigeria consistently been to both the AU and ECOWAS?","o":["One of the largest financial contributors","A non-member of both organisations","A contributor only in name, with no actual funding","An opponent of regional cooperation"],"a":0,"w":"Nigeria has consistently been one of the largest financial contributors to both the AU and ECOWAS."},{"q":"What did Nigeria provide the overwhelming majority of for ECOMOG's interventions?","o":["Only diplomatic statements with no material support","Troops","Naval vessels exclusively","Only humanitarian aid, no troops"],"a":1,"w":"Nigeria provided the overwhelming majority of troops for ECOMOG's interventions."},{"q":"What role has Nigeria repeatedly taken in responding to regional crises?","o":["A role opposing all regional cooperation","A purely passive, uninvolved role","Lead diplomatic roles","No role at all in any regional crisis"],"a":2,"w":"Nigeria has repeatedly taken lead diplomatic roles in responding to regional crises."},{"q":"Which AU position has Nigeria advocated for regarding UN Security Council reform?","o":["The Atlantic Charter","The Treaty of Lagos","The Berlin Conference","The Ezulwini Consensus"],"a":3,"w":"Nigeria has advocated for the Ezulwini Consensus regarding UN Security Council reform."},{"q":"Why does Nigeria position itself as a natural candidate for a reformed UN Security Council seat?","o":["Given its size and extensive contributions to regional stability","Because it is the smallest African country","Because it has never contributed to any regional body","Because it left the AU decades ago"],"a":0,"w":"Nigeria positions itself as a natural candidate given its size and extensive contributions to regional stability."},{"q":"What domestic criticism does Nigeria's extensive regional leadership periodically face?","o":["That Nigeria has never contributed anything to any regional body","Whether its costs are proportionate to direct national benefit, especially during hardship","That regional leadership has no costs at all","That Nigeria should immediately leave the AU and ECOWAS"],"a":1,"w":"Nigeria faces domestic criticism questioning whether the costs of regional leadership are proportionate to direct national benefit."},{"q":"What does this domestic criticism reflect about Nigerian foreign policy debates?","o":["A total absence of any foreign policy debate in Nigeria","Complete national unanimity on all foreign policy issues","A recurring tension between national interest and regional leadership costs","An agreement that Nigeria should abandon all international relations"],"a":2,"w":"This reflects a recurring tension between national interest and regional leadership costs in Nigerian foreign policy debates."},{"q":"What consistent foreign policy tradition is Nigeria's regional leadership role consistent with?","o":["A policy adopted only after 1999","A policy focused only on Europe","A policy of complete isolation since 1960","Its Africa-centred foreign policy since 1960"],"a":3,"w":"Nigeria's regional leadership role is consistent with its Africa-centred foreign policy pursued since 1960."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov • International Relations',ti:'Comparing the African Union and ECOWAS',su:'Compare the scope, membership and relationship between the AU and ECOWAS.',steps:[
{lb:'Continental versus regional scope',dr:dQ2,ht:'<p>The <b>African Union</b> is a <b>continental</b> body with 55 members spanning all of Africa, while <b>ECOWAS</b> is a <b>regional</b> body with 15 members confined to West Africa &mdash; meaning every ECOWAS member is also an AU member, but the reverse is not true.</p>'},
{lb:'Overlapping but distinct mandates',dr:dQ2,ht:'<p>Both organisations share overlapping goals &mdash; economic integration, peace and security, democratic norms &mdash; but ECOWAS, being smaller and more regionally focused, has often acted <b>faster and more decisively</b> in West African crises than the larger, more diplomatically complex AU.</p>'},
{lb:'Coordination and occasional tension',dr:dQ2,ht:'<p>The AU and ECOWAS generally <b>coordinate closely</b> (e.g. the joint UN-AU-ECOWAS diplomatic responses to Sahel coups), though occasional tension arises over which organisation should take the lead role in a specific regional crisis.</p>'},
{lb:'A layered system of African governance',dr:dQ2,ht:'<p>Together, the AU and ECOWAS (alongside other regional bodies like SADC in Southern Africa) form a <b>layered system</b> of African governance &mdash; continental, regional and national &mdash; each level handling different scales of political and economic cooperation.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What kind of body is the African Union, in terms of geographic scope?","o":["Continental, spanning all of Africa","Regional, confined only to West Africa","National, confined only to Nigeria","Global, spanning every continent"],"a":0,"w":"The African Union is a continental body spanning all of Africa."},{"q":"What kind of body is ECOWAS, in terms of geographic scope?","o":["Continental, spanning all of Africa","Regional, confined to West Africa","Global, spanning every continent","National, confined only to Nigeria"],"a":1,"w":"ECOWAS is a regional body confined to West Africa."},{"q":"Is every ECOWAS member also an AU member?","o":["Only Nigeria is a member of both","No, ECOWAS and AU membership never overlap","Yes, every ECOWAS member is also an AU member","No African state belongs to both organisations"],"a":2,"w":"Every ECOWAS member is also an AU member, though the reverse is not true."},{"q":"Which organisation has often acted faster and more decisively in West African crises?","o":["Only the United Nations acts in West African crises","The African Union","Neither organisation has ever acted in any crisis","ECOWAS"],"a":3,"w":"ECOWAS, being smaller and more regionally focused, has often acted faster and more decisively in West African crises."},{"q":"How do the AU and ECOWAS generally relate to each other in practice?","o":["They generally coordinate closely on shared goals","They have never once communicated with each other","They are legally forbidden from cooperating","They automatically merge into a single organisation"],"a":0,"w":"The AU and ECOWAS generally coordinate closely on shared goals in practice."},{"q":"What can occasionally arise between the AU and ECOWAS despite close coordination?","o":["A complete permanent merger of the two organisations","Tension over which organisation should take the lead role in a crisis","An immediate declaration of war between them","A total ban on any further cooperation"],"a":1,"w":"Occasional tension can arise over which organisation should take the lead role in a specific regional crisis."},{"q":"Which other regional body, in Southern Africa, is part of this layered system of African governance?","o":["AMISOM","ECOMOG","SADC","UNAMID"],"a":2,"w":"SADC (Southern African Development Community) is part of this layered system of African governance in Southern Africa."},{"q":"What overall system do the AU, ECOWAS and other regional bodies form together?","o":["A purely economic system with no political function","A single, identical organisation with three different names","A system with no relationship to each other at all","A layered system of African governance across continental, regional and national levels"],"a":3,"w":"Together they form a layered system of African governance across continental, regional and national levels."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov • International Relations',ti:'WAEC Exam Preparation — African Union and ECOWAS',su:'Practise WAEC-style questions on the African Union and ECOWAS.',steps:[
{lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC essays on the AU/ECOWAS: (1) Give the <b>founding date and context</b>. (2) Describe the relevant <b>organ or function</b> asked about with structural detail. (3) Give <b>specific, dated examples</b> of the organisation in action. (4) Evaluate strengths and weaknesses, referencing Nigeria\'s role where relevant.</p>'},
{lb:'Common WAEC question patterns',dr:dQ2,ht:'<p>Common patterns include: "Trace the transformation of the OAU into the African Union." / "Discuss the structure and functions of ECOWAS." / "Examine Nigeria\'s role within the AU and ECOWAS." / "Assess the achievements and challenges of regional integration in West Africa."</p>'},
{lb:'Key vocabulary for essays',dr:dQ2,ht:'<p>Key vocabulary: <b>OAU</b>, <b>AU</b>, <b>ECOWAS</b>, <b>Treaty of Lagos</b>, <b>Peace and Security Council</b>, <b>ECOMOG</b>, <b>AfCFTA</b>, <b>Ezulwini Consensus</b>, <b>unconstitutional change of government</b>. Precise, correctly-spelled terms strengthen WAEC answers.</p>'},
{lb:'Distinguishing the AU from ECOWAS',dr:dQ2,ht:'<p>WAEC essays should clearly distinguish the <b>continental AU</b> (55 members, founded 2002 from the 1963 OAU) from the <b>regional ECOWAS</b> (15 West African members, founded 1975) &mdash; two related but distinct organisations often confused by students.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on the AU or ECOWAS?","o":["Give the founding date and context","Immediately give a personal opinion with no facts","List unrelated dates with no explanation","Skip straight to a conclusion"],"a":0,"w":"A strong essay should begin by giving the founding date and historical context."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Trace the transformation of the OAU into the African Union.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"Trace the transformation of the OAU into the African Union\" is a typical WAEC-style question on this topic."},{"q":"How many members does the continental African Union have?","o":["36","15","55","10"],"a":2,"w":"The African Union has 55 members."},{"q":"How many members does the regional ECOWAS have?","o":["10","55","36","15"],"a":3,"w":"ECOWAS has 15 West African members."},{"q":"In which year was the OAU founded, a key date for this topic?","o":["1963","1975","2002","1999"],"a":0,"w":"The OAU was founded in 1963, a key date for this topic."},{"q":"In which year was ECOWAS founded, a key date for this topic?","o":["1963","1975","2002","1999"],"a":1,"w":"ECOWAS was founded in 1975, a key date for this topic."},{"q":"Why should WAEC students clearly distinguish the AU from ECOWAS?","o":["ECOWAS is larger than the AU","They are exactly the same organisation with two names","They are related but distinct organisations, often confused by students","The AU only exists within Nigeria"],"a":2,"w":"The AU and ECOWAS are related but distinct organisations, often confused by students, so clear distinction is important."},{"q":"What should a WAEC essay evaluate about both organisations, according to the recommended structure?","o":["Nothing beyond their founding dates","Only positive facts with no criticism","Only negative facts with no achievements","Strengths and weaknesses, referencing Nigeria's role where relevant"],"a":3,"w":"A WAEC essay should evaluate both organisations' strengths and weaknesses, referencing Nigeria's role where relevant."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov • International Relations',ti:'Mixed Questions — African Union and ECOWAS',su:'Integrated revision across the African Union and ECOWAS.',steps:[
{lb:'Summary of key points',dr:dQ1,ht:'<p>The <b>African Union</b> (55 members, founded 2002 from the 1963 OAU) and <b>ECOWAS</b> (15 members, founded 1975) both evolved from primarily political/economic bodies into organisations with significant <b>security and governance mandates</b>, though both face real enforcement limitations, especially against determined coup regimes.</p>'},
{lb:'Key dates and names to remember',dr:dQ1,ht:'<p>Must-know facts: <b>1963</b> (OAU founded); <b>1975</b> (ECOWAS founded, Treaty of Lagos); <b>1990</b> (ECOMOG\'s first Liberia deployment); <b>1999</b> (ECOWAS security Mechanism); <b>2002</b> (AU replaces OAU); <b>2004</b> (AU Peace and Security Council); <b>2007</b> (African Charter on Democracy); <b>2021</b> (AfCFTA in force).</p>'},
{lb:'Lessons for Nigeria',dr:dQ1,ht:'<p>Nigeria\'s leading financial, military and diplomatic contributions to both organisations reflect its long-standing Africa-centred foreign policy, while ongoing domestic debate about the cost-benefit of this leadership illustrates the recurring tension between national interest and regional responsibility.</p>'},
{lb:'Final exam tips',dr:dQ1,ht:'<p>Always clearly distinguish the <b>continental AU</b> from the <b>regional ECOWAS</b>, use precise founding dates and named institutions, and conclude by weighing each organisation\'s real achievements against its real, persistent enforcement limitations.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"In which year was the OAU founded?","o":["1963","1975","2002","1999"],"a":0,"w":"The OAU was founded in 1963."},{"q":"In which year was ECOWAS founded, by the Treaty of Lagos?","o":["1963","1975","2002","1999"],"a":1,"w":"ECOWAS was founded in 1975, by the Treaty of Lagos."},{"q":"In which year did the AU replace the OAU?","o":["1999","1963","2002","1975"],"a":2,"w":"The AU replaced the OAU in 2002."},{"q":"Which body, established in 2004, is the AU's key security decision-making organ?","o":["The African Court","The Pan-African Parliament","The African Union Commission","The Peace and Security Council"],"a":3,"w":"The Peace and Security Council, established in 2004, is the AU's key security decision-making organ."},{"q":"Which economic agreement came into force in 2021, boosting intra-African trade?","o":["AfCFTA","The Treaty of Lagos","The Ezulwini Consensus","ECOMOG"],"a":0,"w":"AfCFTA came into force in 2021, boosting intra-African trade."},{"q":"Which peacekeeping force reflects ECOWAS's early, pragmatic security role?","o":["AMISOM","ECOMOG","UNAMID","AfCFTA"],"a":1,"w":"ECOMOG reflects ECOWAS's early, pragmatic security role."},{"q":"What common limitation do both the AU and ECOWAS share, according to this lesson?","o":["A complete absence of any member states","Unlimited and always-effective enforcement power","Real enforcement limitations, especially against determined coup regimes","No relationship to Nigeria whatsoever"],"a":2,"w":"Both the AU and ECOWAS share real enforcement limitations, especially against determined coup regimes."},{"q":"What should a strong WAEC essay conclusion on this topic weigh?","o":["Facts unrelated to the AU or ECOWAS","Only positive facts about both organisations","Only negative facts about both organisations","Each organisation's real achievements against its real, persistent limitations"],"a":3,"w":"A strong conclusion should weigh each organisation's real achievements against its real, persistent limitations."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
