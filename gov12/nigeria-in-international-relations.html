document.addEventListener('click',function(e){

 domestic criticism has Nigeria's Pan-African commitment periodically faced?","o":["Criticism that Nigeria has left the AU entirely","Criticism that Nigeria has never supported any African cause","Criticism over its financial cost, especially during economic downturns","No criticism has ever been raised"],"a":2,"w":"Nigeria's Pan-African commitment has periodically faced criticism over its financial cost during economic downturns."},{"q":"What recurring debate does this domestic criticism prompt?","o":["Whether Nigeria should abandon the United Nations","Whether Nigeria should abolish all foreign policy entirely","Whether Nigeria should rejoin British colonial rule","Balancing continental leadership against pressing domestic needs"],"a":3,"w":"This criticism prompts recurring debate about balancing continental leadership against pressing domestic needs."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

g troop casualties"],"a":3,"w":"Nigeria's peacekeeping leadership entails significant financial and human costs, including troop casualties."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q4 \u2022 Gov • International Relations',ti:'Nigeria\'s Relations with Major Global Powers',su:'Examine Nigeria\'s diplomatic and economic relations with the USA, China, UK and EU.',steps:[
{lb:'Relations with the United States',dr:dQ2,ht:'<p>Nigeria maintains significant relations with the <b>United States</b> centred on <b>counter-terrorism cooperation</b> (against Boko Haram), trade (notably oil exports historically), and democratic governance support, though occasional tensions arise over human rights concerns and visa policy.</p>'},
{lb:'Relations with China',dr:dQ2,ht:'<p>Nigeria\'s relationship with <b>China</b> has grown substantially since the 2000s, particularly through <b>infrastructure investment and loans</b> (railways, roads, telecommunications) under China\'s Belt and Road-style engagement, though this has raised domestic debate about debt sustainability and dependency.</p>'},
{lb:'Relations with the United Kingdom',dr:dQ2,ht:'<p>As a former colonial power and fellow Commonwealth member, the <b>United Kingdom</b> remains significant for Nigeria through historical ties, a large Nigerian diaspora in the UK, educational links, and continued trade and investment relationships.</p>'},
{lb:'Relations with the European Union',dr:dQ2,ht:'<p>Nigeria\'s relationship with the <b>European Union</b> spans trade agreements, development aid, and cooperation on migration management, given the EU\'s interest in reducing irregular migration routes through West Africa toward Europe.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is a central focus of Nigeria's relations with the United States?","o":["Counter-terrorism cooperation against Boko Haram","Cooperation on Antarctic exploration","A currency union","A shared national anthem"],"a":0,"w":"Counter-terrorism cooperation against Boko Haram is a central focus of Nigeria-US relations."},{"q":"What kind of investment has grown substantially between Nigeria and China since the 2000s?","o":["Investment only in agriculture, with no infrastructure","Infrastructure investment and loans (railways, roads, telecommunications)","Investment only in Nigeria's currency","No investment of any kind"],"a":1,"w":"Infrastructure investment and loans from China have grown substantially since the 2000s."},{"q":"What domestic debate has grown alongside Nigeria's relationship with China?","o":["Debate about leaving the United Nations","Debate about abolishing all foreign investment","Debate about debt sustainability and dependency","Debate about joining the Soviet Union"],"a":2,"w":"Debate about debt sustainability and dependency has grown alongside Nigeria's relationship with China."},{"q":"What historical relationship does Nigeria share with the United Kingdom?","o":["A purely military alliance with no other ties","No historical relationship at all","A relationship only through the OAU","Former colonial power and fellow Commonwealth member"],"a":3,"w":"The UK is significant to Nigeria as its former colonial power and a fellow Commonwealth member."},{"q":"What large community links Nigeria and the UK today?","o":["A large Nigerian diaspora in the UK","A large British diaspora in Nigeria only","No diaspora connection exists","A shared royal family with equal authority"],"a":0,"w":"A large Nigerian diaspora in the UK links the two countries today."},{"q":"What cooperation area is significant in Nigeria's relationship with the European Union?","o":["Space exploration","Migration management","Antarctic research","Nuclear weapons development"],"a":1,"w":"Migration management is a significant area of cooperation in Nigeria-EU relations."},{"q":"Why is the EU particularly interested in migration cooperation with Nigeria and West Africa?","o":["To fund migration to Nigeria from Europe","To encourage more migration to Europe","To help reduce irregular migration routes through West Africa toward Europe","It has no interest in migration at all"],"a":2,"w":"The EU is interested in reducing irregular migration routes through West Africa toward Europe."},{"q":"What overall pattern do Nigeria's relations with major powers show?","o":["Relations focused solely on military alliances","Identical relationships with every major power, with no distinctions","A total rejection of all relations with major global powers","A mix of historical ties, economic interest and security cooperation, each shaped by different priorities"],"a":3,"w":"Nigeria's relations with major powers show a mix of historical ties, economic interest and security cooperation, each shaped by different priorities."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov • International Relations',ti:'Nigeria\'s Economic Diplomacy',su:'Explain how Nigeria uses diplomacy to advance its economic interests internationally.',steps:[
{lb:'Attracting foreign direct investment',dr:dQ1,ht:'<p>Nigeria\'s economic diplomacy actively seeks to attract <b>foreign direct investment (FDI)</b>, particularly in oil and gas, telecommunications, and increasingly technology/fintech sectors, through investment promotion agencies and high-level diplomatic engagement.</p>'},
{lb:'Trade agreements and AfCFTA',dr:dQ1,ht:'<p>Nigeria\'s participation in the <b>African Continental Free Trade Area (AfCFTA, 2021)</b> reflects economic diplomacy aimed at expanding market access across Africa for Nigerian goods and services, despite initial domestic hesitation over protecting local industries.</p>'},
{lb:'OPEC coordination as economic diplomacy',dr:dQ1,ht:'<p>Nigeria\'s active participation in <b>OPEC</b> production quota negotiations represents economic diplomacy directly protecting its most significant revenue source, requiring careful balancing of domestic production pressures against collective OPEC discipline.</p>'},
{lb:'Debt diplomacy and international financial institutions',dr:dQ1,ht:'<p>Nigeria\'s diplomatic engagement with the <b>IMF, World Bank and Paris Club</b> creditors &mdash; notably securing the landmark <b>2005 debt relief deal</b> &mdash; illustrates economic diplomacy aimed at managing Nigeria\'s international financial obligations and credit standing.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Nigeria's economic diplomacy actively seek to attract?","o":["Foreign direct investment (FDI)","Only foreign military bases","Only foreign tourists","Only foreign students, with no other goal"],"a":0,"w":"Nigeria's economic diplomacy actively seeks to attract foreign direct investment (FDI)."},{"q":"In which sectors does Nigeria particularly seek foreign investment?","o":["Only agriculture, with no other sector","Oil and gas, telecommunications and technology/fintech","Only tourism, with no other sector","Only the arts, with no other sector"],"a":1,"w":"Nigeria particularly seeks foreign investment in oil and gas, telecommunications and technology/fintech."},{"q":"Which trade agreement, joined in 2021, reflects Nigeria's economic diplomacy toward African market access?","o":["The Ezulwini Consensus","The Treaty of Lagos","AfCFTA","OPEC+"],"a":2,"w":"AfCFTA, joined in 2021, reflects Nigeria's economic diplomacy toward African market access."},{"q":"What initial domestic hesitation did Nigeria have about AfCFTA?","o":["A demand that AfCFTA be based only in Nigeria","No hesitation at all — Nigeria joined immediately with full support","A refusal to ever join AfCFTA","Concern over protecting local industries"],"a":3,"w":"Nigeria initially hesitated over AfCFTA due to concerns about protecting local industries."},{"q":"What does Nigeria's OPEC participation represent, in terms of economic diplomacy?","o":["Economic diplomacy directly protecting its most significant revenue source","A purely symbolic gesture with no economic significance","A rejection of all oil-related diplomacy","A relationship unrelated to Nigeria's economy"],"a":0,"w":"Nigeria's OPEC participation represents economic diplomacy directly protecting its most significant revenue source."},{"q":"What must Nigeria balance carefully within OPEC, according to this lesson?","o":["Its Commonwealth membership against its UN membership","Domestic production pressures against collective OPEC discipline","Its relationship with China against its relationship with the UK","Its military budget against its education budget"],"a":1,"w":"Nigeria must balance domestic production pressures against collective OPEC discipline."},{"q":"Which international financial institutions has Nigeria's economic diplomacy engaged with regarding debt?","o":["Only OPEC","Only the African Union","The IMF, World Bank and Paris Club","Only the Commonwealth Secretariat"],"a":2,"w":"Nigeria's economic diplomacy has engaged with the IMF, World Bank and Paris Club regarding debt."},{"q":"What landmark debt deal did this economic diplomacy achieve in 2005?","o":["A military alliance with the United States","A permanent UN Security Council seat","A new African currency","A Paris Club debt relief deal"],"a":3,"w":"This economic diplomacy achieved a landmark Paris Club debt relief deal in 2005."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov • International Relations',ti:'Nigeria\'s Diaspora and Cultural Diplomacy',su:'Explain how Nigeria\'s diaspora and cultural exports contribute to its international relations.',steps:[
{lb:'Nigeria\'s global diaspora',dr:dQ2,ht:'<p>Nigeria has one of the world\'s <b>largest and most globally dispersed diasporas</b>, with significant communities in the UK, USA, and across Europe, contributing substantial <b>remittances</b> back to Nigeria\'s economy and serving as informal cultural and diplomatic ambassadors abroad.</p>'},
{lb:'Nollywood as soft power',dr:dQ2,ht:'<p><b>Nollywood</b>, Nigeria\'s film industry (one of the world\'s largest by output), has significantly boosted Nigeria\'s international cultural visibility and soft power, extending Nigerian cultural influence far beyond its formal diplomatic reach.</p>'},
{lb:'Afrobeats\' global rise',dr:dQ2,ht:'<p>The global rise of <b>Afrobeats</b> music, with Nigerian artists achieving major international chart success and touring worldwide from the 2010s onward, has similarly enhanced Nigeria\'s cultural prestige and soft power internationally.</p>'},
{lb:'Converting cultural influence into diplomatic capital',dr:dQ2,ht:'<p>Nigerian governments have increasingly sought to <b>formally leverage</b> this cultural influence &mdash; through cultural diplomacy initiatives, creative-industry promotion, and diaspora engagement policies &mdash; converting informal soft power into more structured diplomatic and economic capital.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is notable about Nigeria's global diaspora?","o":["It is one of the world's largest and most globally dispersed","It is one of the smallest in the world","It exists only within Africa, with no presence elsewhere","It has no economic significance whatsoever"],"a":0,"w":"Nigeria's diaspora is one of the world's largest and most globally dispersed."},{"q":"What do Nigeria's diaspora communities contribute substantially to the domestic economy?","o":["Only tourism revenue","Remittances","Only agricultural products","Only oil revenue"],"a":1,"w":"Nigeria's diaspora communities contribute substantial remittances to the domestic economy."},{"q":"What role do diaspora communities serve, besides economic contribution?","o":["A purely military role","No role at all beyond sending money home","Informal cultural and diplomatic ambassadors abroad","A role limited entirely to sports"],"a":2,"w":"Diaspora communities serve as informal cultural and diplomatic ambassadors abroad."},{"q":"Which Nigerian film industry has significantly boosted the country's soft power?","o":["A film industry that does not exist","Hollywood","Bollywood","Nollywood"],"a":3,"w":"Nollywood, Nigeria's film industry, has significantly boosted the country's soft power."},{"q":"What is notable about Nollywood's global scale, as mentioned in this lesson?","o":["It is one of the world's largest film industries by output","It produces no films at all","It is smaller than any other national film industry","It only operates within Nigeria with no international reach"],"a":0,"w":"Nollywood is one of the world's largest film industries by output."},{"q":"Which Nigerian musical genre has achieved major international chart success since the 2010s?","o":["Classical music","Afrobeats","Only gospel music, with no other genre succeeding internationally","No Nigerian music has ever achieved international success"],"a":1,"w":"Afrobeats has achieved major international chart success since the 2010s."},{"q":"What have Nigerian governments increasingly sought to do with this cultural influence?","o":["Ban it from being promoted internationally","Ignore it entirely as irrelevant to foreign policy","Formally leverage it through cultural diplomacy and diaspora engagement initiatives","Transfer all control of it to foreign governments"],"a":2,"w":"Nigerian governments have increasingly sought to formally leverage cultural influence through diplomacy initiatives."},{"q":"What is the overall effect of converting cultural influence into diplomatic capital?","o":["A complete replacement of formal diplomacy with music and film alone","No effect at all on Nigeria's international standing","A reduction in Nigeria's cultural influence","Converting informal soft power into more structured diplomatic and economic capital"],"a":3,"w":"This conversion transforms informal soft power into more structured diplomatic and economic capital."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov • International Relations',ti:'Challenges in Nigeria\'s International Relations',su:'Evaluate the key challenges Nigeria faces in conducting its international relations.',steps:[
{lb:'Balancing regional leadership costs',dr:dQ1,ht:'<p>Nigeria faces the recurring challenge of balancing the <b>financial and military costs</b> of its extensive regional leadership role (ECOWAS, AU, peacekeeping) against pressing <b>domestic economic needs</b>, especially during periods of economic hardship.</p>'},
{lb:'Managing great power relationships',dr:dQ1,ht:'<p>Nigeria must carefully manage relationships with <b>competing great powers</b> (the USA, China, EU) without becoming excessively dependent on, or entangled in rivalries between, any single power &mdash; a delicate balancing act as global competition for African influence intensifies.</p>'},
{lb:'Security challenges affecting international standing',dr:dQ1,ht:'<p>Ongoing security challenges &mdash; <b>Boko Haram/ISWAP, farmer-herder conflicts, banditry, and IPOB-related unrest</b> &mdash; affect Nigeria\'s international image and complicate its ability to project full confidence as a stable regional leader.</p>'},
{lb:'Domestic economic constraints on foreign policy',dr:dQ1,ht:'<p>Nigeria\'s <b>economic constraints</b> &mdash; oil price volatility, currency instability, and debt servicing obligations &mdash; periodically limit its capacity to fund the ambitious foreign policy and regional leadership role it aspires to.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What recurring challenge does Nigeria face regarding its regional leadership role?","o":["Balancing its financial/military costs against domestic economic needs","No challenge at all, since regional leadership is entirely free of cost","A total absence of any regional leadership role","A challenge only related to Nigeria's currency design"],"a":0,"w":"Nigeria faces the challenge of balancing regional leadership costs against domestic economic needs."},{"q":"Which great powers must Nigeria carefully manage relationships with, without excessive dependency?","o":["Only Ghana and Senegal","The USA, China and EU","Only Mali and Niger","No foreign powers at all"],"a":1,"w":"Nigeria must carefully manage relationships with the USA, China and EU without excessive dependency."},{"q":"What broader global trend intensifies the challenge of managing great power relationships?","o":["A total absence of any competing powers","A complete end to all global interest in Africa","Intensifying global competition for African influence","A permanent alliance among all great powers with no competition"],"a":2,"w":"Intensifying global competition for African influence intensifies this challenge for Nigeria."},{"q":"Which security challenges affect Nigeria's international image, according to this lesson?","o":["No security challenges exist in Nigeria today","Only a dispute with Ghana over cocoa","Only a currency dispute with the CFA franc zone","Boko Haram/ISWAP, farmer-herder conflicts, banditry and IPOB-related unrest"],"a":3,"w":"Boko Haram/ISWAP, farmer-herder conflicts, banditry and IPOB-related unrest affect Nigeria's international image."},{"q":"What does this affect about Nigeria's role as a regional leader?","o":["Its ability to project full confidence as a stable regional leader","Nothing at all — security challenges have no effect on international standing","Only Nigeria's domestic tourism industry","Only Nigeria's relationship with Mali specifically"],"a":0,"w":"These security challenges complicate Nigeria's ability to project full confidence as a stable regional leader."},{"q":"Which economic constraints periodically limit Nigeria's foreign policy ambitions?","o":["A complete absence of any economic constraints","Oil price volatility, currency instability and debt servicing obligations","Only a shortage of diplomats","Only a shortage of embassy buildings"],"a":1,"w":"Oil price volatility, currency instability and debt servicing obligations periodically limit Nigeria's foreign policy ambitions."},{"q":"What overall lesson does this topic teach about Nigeria's international relations?","o":["Domestic issues have no relationship to foreign policy at all","Nigeria faces no constraints of any kind in pursuing its foreign policy","Foreign policy ambitions must be balanced against real domestic constraints and challenges","Nigeria's foreign policy has remained completely unchanged since 1960 with no challenges"],"a":2,"w":"This topic teaches that foreign policy ambitions must be balanced against real domestic constraints and challenges."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov • International Relations',ti:'Nigeria and International Law',su:'Explain Nigeria\'s engagement with international law and legal dispute resolution.',steps:[
{lb:'The Bakassi Peninsula case',dr:dQ2,ht:'<p>Nigeria\'s most notable engagement with the <b>International Court of Justice (ICJ)</b> involved the <b>Bakassi Peninsula dispute</b> with Cameroon; the ICJ ruled in <b>2002</b> that the resource-rich peninsula belonged to Cameroon, and despite domestic controversy, Nigeria ultimately complied and formally transferred the territory in <b>2008</b>.</p>'},
{lb:'Significance of compliance',dr:dQ2,ht:'<p>Nigeria\'s acceptance of the Bakassi ruling, despite its unpopularity domestically, is often cited as a positive example of a state respecting <b>international legal rulings</b> even when the outcome is unfavourable &mdash; strengthening Nigeria\'s international legal credibility.</p>'},
{lb:'Nigeria and international human rights law',dr:dQ2,ht:'<p>Nigeria is party to major international human rights instruments, including the <b>African Charter on Human and Peoples\' Rights</b>, and has periodically faced international scrutiny over domestic human rights issues, including during the Abacha era and more recent security operations.</p>'},
{lb:'Nigeria\'s law of the sea interests',dr:dQ2,ht:'<p>As a coastal state with significant offshore oil resources, Nigeria has an active interest in the <b>UN Convention on the Law of the Sea (UNCLOS)</b>, particularly regarding its <b>Exclusive Economic Zone</b> boundaries and rights over offshore petroleum resources.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which territorial dispute did Nigeria bring before the International Court of Justice?","o":["The Bakassi Peninsula dispute with Cameroon","A dispute with Ghana over cocoa exports","A dispute with Chad over Lake Chad","A dispute with Niger over uranium"],"a":0,"w":"Nigeria's Bakassi Peninsula dispute with Cameroon was brought before the ICJ."},{"q":"In which year did the ICJ rule on the Bakassi Peninsula dispute?","o":["1999","2002","2008","1975"],"a":1,"w":"The ICJ ruled on the Bakassi Peninsula dispute in 2002."},{"q":"Who did the ICJ rule the Bakassi Peninsula belonged to?","o":["Chad","Nigeria","Cameroon","Niger"],"a":2,"w":"The ICJ ruled that the Bakassi Peninsula belonged to Cameroon."},{"q":"In which year did Nigeria formally transfer the Bakassi Peninsula to Cameroon?","o":["2021","2002","1999","2008"],"a":3,"w":"Nigeria formally transferred the Bakassi Peninsula to Cameroon in 2008."},{"q":"What is Nigeria's compliance with the Bakassi ruling often cited as an example of?","o":["A state respecting international legal rulings even when unfavourable","A state ignoring all international law","A state refusing to accept any ICJ ruling","A rejection of the ICJ's authority entirely"],"a":0,"w":"Nigeria's compliance is cited as an example of respecting international legal rulings even when unfavourable."},{"q":"Which human rights instrument is Nigeria a party to?","o":["The Treaty of Lagos","The African Charter on Human and Peoples' Rights","The Ezulwini Consensus","AfCFTA"],"a":1,"w":"Nigeria is a party to the African Charter on Human and Peoples' Rights."},{"q":"Which UN convention is significant to Nigeria's offshore oil interests?","o":["The Vienna Convention on Diplomatic Relations","The UN Charter alone","The UN Convention on the Law of the Sea (UNCLOS)","The Montevideo Convention"],"a":2,"w":"The UN Convention on the Law of the Sea (UNCLOS) is significant to Nigeria's offshore oil interests."},{"q":"What maritime zone is particularly relevant to Nigeria's rights over offshore petroleum resources?","o":["The continental interior","The high seas only","Territorial airspace","The Exclusive Economic Zone"],"a":3,"w":"The Exclusive Economic Zone is particularly relevant to Nigeria's rights over offshore petroleum resources."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov • International Relations',ti:'WAEC Exam Preparation — Nigeria in International Relations',su:'Practise WAEC-style questions on Nigeria\'s role in international relations.',steps:[
{lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC essays on Nigeria\'s international relations: (1) Identify the <b>specific aspect</b> asked about (objectives, peacekeeping, relations with a specific power, etc). (2) Give <b>precise dates and named events</b>. (3) Explain <b>cause and effect</b>. (4) Evaluate <b>achievements and challenges</b>.</p>'},
{lb:'Common WAEC question patterns',dr:dQ2,ht:'<p>Common patterns include: "Discuss the objectives of Nigeria\'s foreign policy since independence." / "Examine Nigeria\'s role in regional peacekeeping." / "Assess Nigeria\'s relations with major world powers." / "Discuss the challenges facing Nigeria\'s international relations."</p>'},
{lb:'Key vocabulary for essays',dr:dQ2,ht:'<p>Key vocabulary: <b>Africa-centred foreign policy</b>, <b>Pan-Africanism</b>, <b>Ezulwini Consensus</b>, <b>ECOMOG</b>, <b>Multinational Joint Task Force</b>, <b>economic diplomacy</b>, <b>soft power</b>, <b>diaspora</b>. Precise, correctly-spelled terms strengthen WAEC answers.</p>'},
{lb:'Using named, dated examples throughout',dr:dQ2,ht:'<p>The strongest WAEC essays on this topic consistently use <b>named, dated examples</b> &mdash; ECOMOG in Liberia (1990), the 2005 Paris Club deal, AfCFTA (2021) &mdash; rather than discussing Nigeria\'s international relations only in abstract, general terms.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on Nigeria's international relations?","o":["Identify the specific aspect asked about","Immediately give a personal opinion with no facts","List unrelated dates with no explanation","Skip straight to a conclusion"],"a":0,"w":"A strong essay should begin by identifying the specific aspect of Nigeria's international relations asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Examine Nigeria's role in regional peacekeeping.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"Examine Nigeria's role in regional peacekeeping\" is a typical WAEC-style question on this topic."},{"q":"Which term describes Nigeria's foreign policy tradition since 1960?","o":["Isolationist foreign policy","Europe-centred foreign policy","Africa-centred foreign policy","Asia-centred foreign policy"],"a":2,"w":"\"Africa-centred foreign policy\" describes Nigeria's foreign policy tradition since 1960."},{"q":"Which AU position should be cited when discussing Nigeria's push for Security Council reform?","o":["The Atlantic Charter","The Treaty of Lagos","The Berlin Conference","The Ezulwini Consensus"],"a":3,"w":"The Ezulwini Consensus should be cited when discussing Nigeria's push for Security Council reform."},{"q":"Which named peacekeeping force should be cited when discussing Nigeria's regional security role?","o":["ECOMOG","NATO","The World Trade Organisation","The Commonwealth Secretariat"],"a":0,"w":"ECOMOG should be cited when discussing Nigeria's regional security role."},{"q":"Which specific, dated debt agreement should be cited when discussing Nigeria's economic diplomacy?","o":["The 1999 Constitution","The 2005 Paris Club deal","The 1960 independence agreement","The 2021 AfCFTA agreement"],"a":1,"w":"The 2005 Paris Club debt relief deal should be cited when discussing Nigeria's economic diplomacy."},{"q":"Why do the strongest WAEC essays on this topic use named, dated examples?","o":["Named examples are discouraged by WAEC","Dates are irrelevant to WAEC marking","They demonstrate concrete knowledge rather than only abstract, general claims","Abstract claims always score higher than concrete examples"],"a":2,"w":"Named, dated examples demonstrate concrete knowledge, which is more highly rewarded than abstract, general claims."},{"q":"What should a WAEC essay on this topic evaluate, according to the recommended structure?","o":["Nothing beyond a simple definition","Only positive facts with no criticism","Only negative facts with no achievements","Achievements and challenges"],"a":3,"w":"A WAEC essay on this topic should evaluate both achievements and challenges."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov • International Relations',ti:'Mixed Questions — Nigeria in International Relations',su:'Integrated revision across Nigeria\'s foreign policy objectives, peacekeeping, and global relations.',steps:[
{lb:'Summary of key points',dr:dQ1,ht:'<p>Nigeria\'s international relations are shaped by its <b>Africa-centred foreign policy</b>, Pan-African commitments, leading regional peacekeeping role (ECOMOG, Multinational Joint Task Force), economic diplomacy, and growing <b>soft power</b> through its diaspora, Nollywood and Afrobeats &mdash; all balanced against real domestic constraints.</p>'},
{lb:'Key names and dates to remember',dr:dQ1,ht:'<p>Must-know facts: <b>1960</b> (independence, Africa-centred policy begins); <b>1963</b> (OAU founding role); <b>1990</b> (ECOMOG\'s first Liberia deployment); <b>2005</b> (Paris Club debt deal); <b>2021</b> (AfCFTA); <b>Ezulwini Consensus</b> (Security Council reform advocacy).</p>'},
{lb:'Lessons for Nigeria today',dr:dQ1,ht:'<p>Nigeria\'s international relations demonstrate how a large, influential African state balances continental leadership, great-power diplomacy, economic interests and cultural soft power, while managing significant domestic security and economic constraints.</p>'},
{lb:'Final exam tips',dr:dQ1,ht:'<p>Always name the <b>specific objective, relationship or event</b> asked about, use precise dates, and conclude by weighing Nigeria\'s real international achievements against its ongoing domestic and diplomatic challenges.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What has Nigeria declared the centrepiece of its foreign policy since 1960?","o":["Africa","Europe","Asia","The Middle East"],"a":0,"w":"Nigeria has declared Africa the centrepiece of its foreign policy since 1960."},{"q":"In which year did Nigeria play a founding role in the OAU?","o":["1960","1963","1975","2002"],"a":1,"w":"Nigeria played a founding role in the OAU in 1963."},{"q":"In which year did ECOMOG first deploy, with Nigeria providing the majority of troops?","o":["1975","1963","1990","2002"],"a":2,"w":"ECOMOG first deployed in 1990, with Nigeria providing the majority of troops."},{"q":"Which multinational force does Nigeria lead against Boko Haram/ISWAP?","o":["UNAMID","ECOMOG","AMISOM","The Multinational Joint Task Force"],"a":3,"w":"Nigeria leads the Multinational Joint Task Force against Boko Haram/ISWAP."},{"q":"In which year did Nigeria secure its landmark Paris Club debt relief deal?","o":["2005","1999","2010","2021"],"a":0,"w":"Nigeria secured its landmark Paris Club debt relief deal in 2005."},{"q":"Which Nigerian cultural exports are cited as examples of soft power in this topic?","o":["Only Nigeria's oil exports","Nollywood and Afrobeats","Only Nigeria's agricultural products","Only Nigeria's currency"],"a":1,"w":"Nollywood and Afrobeats are cited as examples of Nigeria's soft power."},{"q":"Which AU position does Nigeria champion for Security Council reform?","o":["The Berlin Conference","The Treaty of Lagos","The Ezulwini Consensus","The Atlantic Charter"],"a":2,"w":"Nigeria champions the Ezulwini Consensus for Security Council reform."},{"q":"What should a strong WAEC essay conclusion on this topic weigh?","o":["Facts unrelated to Nigeria's international relations","Only positive facts about Nigeria","Only negative facts about Nigeria","Nigeria's real international achievements against its ongoing domestic and diplomatic challenges"],"a":3,"w":"A strong conclusion should weigh Nigeria's real international achievements against its ongoing domestic and diplomatic challenges."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];

window.markComplete=async function(){
  const{data:{session}}=await _sb.auth.getSession();if(!session)return;
  const{data:topic}=await _sb.from('topics').select('id').eq('topic_code','GOV-INT-07').maybeSingle();if(!topic)return;
  window._abcTopicId=topic.id;
  const { data: __mySchoolProfile } = await _sb.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
  const __mySchoolId = __mySchoolProfile ? __mySchoolProfile.school_id : null;
  await _sb.from('walkthrough_progress').upsert({student_id:session.user.id, school_id: __mySchoolId,topic_id:topic.id,status:'completed',completed_at:new Date().toISOString(),last_visited_at:new Date().toISOString()},{onConflict:'student_id,topic_id'});
};
</script>
<script src="../abc_feedback_widget.js"></script>
