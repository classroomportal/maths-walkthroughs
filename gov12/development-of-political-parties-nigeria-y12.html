<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});

var QS=[
{ey:'Q1 \u2022 Government • Y12',ti:'Meaning and Role of Political Parties',su:'Understand what political parties are and why they matter.',steps:[
  {lb:'What is a political party?',dr:dQ1,ht:'<p>A political party is an organised group of people who share similar political views and aim to win elections and control government in order to implement their policies and programmes.</p>'},
  {lb:'Functions of political parties',dr:dQ1,ht:'<p>Political parties perform key functions: aggregating and articulating public interests, selecting and presenting candidates for elections, forming government or opposition, educating the public, and providing a channel for political participation.</p>'},
  {lb:'Party systems',dr:dQ1,ht:'<p>Countries can have one-party, two-party, or multi-party systems. Nigeria currently operates a multi-party system, though in practice a small number of parties tend to dominate elections.</p>'},
  {lb:'Importance for democracy',dr:dQ1,ht:'<p>Political parties are essential to democracy because they organise political competition, provide voters with clear policy choices, and create the mechanism through which citizens can hold government accountable at elections.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"A political party is best defined as:","o":["An organised group aiming to win elections and control government to implement its policies","A private business enterprise","A traditional ruling council","A religious organisation only"],"a":0,"w":"A political party is an organised group of people sharing political views, seeking to win elections and implement its policies through government."},{"q":"Which of these is a key function of political parties?","o":["Setting international exchange rates directly","Selecting and presenting candidates for elections","Running the national judiciary","Printing the national currency"],"a":1,"w":"Selecting and presenting candidates for elections is a core function of political parties."},{"q":"What type of party system does Nigeria currently operate?","o":["A two-party system by law","A strict one-party system","A multi-party system","No party system at all"],"a":2,"w":"Nigeria operates a multi-party system, allowing multiple parties to register and contest elections, even though a few tend to dominate in practice."},{"q":"Why are political parties considered essential to democracy?","o":["They prevent any political participation by citizens","They eliminate the need for elections entirely","They replace the judiciary's role","They organise political competition and give voters clear policy choices at elections"],"a":3,"w":"Political parties organise political competition and provide voters with distinct policy choices, essential to functioning democracy."},{"q":"How do political parties provide a channel for political participation?","o":["By allowing citizens to join, campaign, vote for, or stand as candidates under a party's platform","By preventing citizens from ever voting","By replacing citizens' votes with party decisions alone","By eliminating public political discussion entirely"],"a":0,"w":"Parties give citizens avenues to participate in politics — as members, campaigners, voters, or candidates."},{"q":"Which function involves parties gathering and representing the diverse interests of citizens?","o":["Judicial interpretation of laws","Interest aggregation and articulation","Currency printing","Traditional chieftaincy succession"],"a":1,"w":"Interest aggregation and articulation is the process by which parties gather diverse citizen interests into coherent policy positions."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government • Y12',ti:'Pre-Independence Political Parties (1920s–1950s)',su:'Trace the earliest Nigerian political parties before independence.',steps:[
  {lb:'Early nationalist movements',dr:dQ2,ht:'<p>Nigeria\'s earliest political organisations emerged in the 1920s, including Herbert Macaulay\'s Nigerian National Democratic Party (NNDP), founded in 1923 — widely regarded as Nigeria\'s first political party, based mainly in Lagos.</p>'},
  {lb:'The Nigerian Youth Movement (NYM)',dr:dQ2,ht:'<p>The Nigerian Youth Movement (NYM), formed in the 1930s, became an important nationalist platform, bringing together young, educated Nigerians (including Nnamdi Azikiwe and Obafemi Awolowo before they formed their own parties) to campaign for self-governance.</p>'},
  {lb:'NCNC and the drive for independence',dr:dQ2,ht:'<p>The National Council of Nigeria and the Cameroons (NCNC), founded in 1944 and led by Nnamdi Azikiwe, became a major nationalist party, campaigning strongly for Nigerian self-government and independence.</p>'},
  {lb:'Regional/ethnic-based parties emerge',dr:dQ2,ht:'<p>By the 1950s, major parties had become closely associated with Nigeria\'s three regions/ethnic groups: NCNC (largely Igbo/Eastern), Action Group or AG (largely Yoruba/Western, led by Awolowo), and the Northern People\'s Congress or NPC (largely Hausa-Fulani/Northern, led by Ahmadu Bello).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which is widely regarded as Nigeria's first political party, founded by Herbert Macaulay in 1923?","o":["The Nigerian National Democratic Party (NNDP)","The National Council of Nigeria and the Cameroons (NCNC)","The Action Group (AG)","The Northern People's Congress (NPC)"],"a":0,"w":"Herbert Macaulay's Nigerian National Democratic Party (NNDP), founded in 1923, is widely regarded as Nigeria's first political party."},{"q":"The Nigerian Youth Movement (NYM) of the 1930s is significant because it:","o":["Was Nigeria's first political party in the 1920s","Brought together young, educated Nigerians as an important nationalist platform","Was formed after Nigeria's independence in 1960","Was exclusively a Northern regional party"],"a":1,"w":"The NYM served as an important pre-independence nationalist platform bringing together educated young Nigerians, including future party leaders."},{"q":"Who founded and led the National Council of Nigeria and the Cameroons (NCNC), founded in 1944?","o":["Ahmadu Bello","Obafemi Awolowo","Nnamdi Azikiwe","Herbert Macaulay"],"a":2,"w":"Nnamdi Azikiwe founded and led the NCNC, a major nationalist party campaigning for Nigerian self-government."},{"q":"Which party was closely associated with the Yoruba/Western Region, led by Obafemi Awolowo?","o":["The Nigerian National Democratic Party (NNDP)","The Northern People's Congress (NPC)","The National Council of Nigeria and the Cameroons (NCNC)","The Action Group (AG)"],"a":3,"w":"The Action Group (AG), led by Obafemi Awolowo, was closely associated with the Yoruba-dominated Western Region."},{"q":"Which party was closely associated with the Hausa-Fulani/Northern Region, led by Ahmadu Bello?","o":["The Northern People's Congress (NPC)","The Action Group (AG)","The NCNC","The NNDP"],"a":0,"w":"The Northern People's Congress (NPC), led by Ahmadu Bello, was closely associated with the Hausa-Fulani-dominated Northern Region."},{"q":"By the 1950s, Nigeria's major political parties had become closely associated with:","o":["A single unified national ideology with no regional basis","Nigeria's three regions and their dominant ethnic groups","Foreign colonial administrations exclusively","Purely religious rather than political distinctions"],"a":1,"w":"By the 1950s, the major parties (NCNC, AG, NPC) were each closely tied to one of Nigeria's three regions and their dominant ethnic groups."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government • Y12',ti:'First Republic Parties (1960–1966)',su:'Understand the party landscape of Nigeria\'s First Republic.',steps:[
  {lb:'Independence-era coalition',dr:dQ3,ht:'<p>At independence in 1960, Nigeria\'s government was formed through an NPC-NCNC coalition, with the NPC\'s Abubakar Tafawa Balewa as Prime Minister and the NCNC\'s Nnamdi Azikiwe as the ceremonial President, while the AG became the main opposition.</p>'},
  {lb:'Regional dominance of parties',dr:dQ3,ht:'<p>Each major party dominated its home region\'s government: NPC controlled the Northern Region, AG controlled the Western Region, and NCNC controlled the Eastern Region, reflecting Nigeria\'s deep regional/ethnic party alignment.</p>'},
  {lb:'Smaller parties and splits',dr:dQ3,ht:'<p>Smaller parties and splinter groups also emerged, including the Northern Elements Progressive Union (NEPU, a radical Northern opposition party led by Aminu Kano) and the United Middle Belt Congress (UMBC), representing Middle Belt minority interests.</p>'},
  {lb:'Political crisis and the end of the First Republic',dr:dQ3,ht:'<p>Intense political rivalry, disputed elections (notably the 1964 and 1965 Western Region crises), and deepening regional/ethnic tensions contributed to the collapse of the First Republic, ending in the January 1966 military coup.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{"q":"Which coalition formed Nigeria's government at independence in 1960?","o":["NPC-NCNC coalition","AG-NPC coalition","NCNC-AG coalition","A single-party NPC government"],"a":0,"w":"Nigeria's independence government was formed through an NPC-NCNC coalition, with the AG as the main opposition."},{"q":"Who was Nigeria's Prime Minister at independence in 1960?","o":["Nnamdi Azikiwe","Abubakar Tafawa Balewa","Obafemi Awolowo","Ahmadu Bello"],"a":1,"w":"Abubakar Tafawa Balewa, of the NPC, served as Nigeria's first Prime Minister at independence."},{"q":"Which party dominated the government of the Northern Region during the First Republic?","o":["The NCNC","The AG (Action Group)","The NPC (Northern People's Congress)","NEPU"],"a":2,"w":"The NPC dominated the Northern Region's government, reflecting its strong Hausa-Fulani/Northern regional base."},{"q":"Which party, led by Aminu Kano, represented radical Northern opposition to the NPC?","o":["The United Middle Belt Congress (UMBC)","The Action Group (AG)","The NCNC","The Northern Elements Progressive Union (NEPU)"],"a":3,"w":"NEPU, led by Aminu Kano, was a radical Northern opposition party challenging the NPC's dominance."},{"q":"Which organisation represented Middle Belt minority interests during the First Republic?","o":["The United Middle Belt Congress (UMBC)","The Northern People's Congress (NPC)","The Action Group (AG)","The NCNC"],"a":0,"w":"The United Middle Belt Congress (UMBC) represented the political interests of Middle Belt minority groups."},{"q":"What ultimately brought the First Republic to an end in January 1966?","o":["A peaceful transfer of power through elections","A military coup, following intense political rivalry and disputed regional elections","A unanimous national referendum ending party politics","Voluntary dissolution of all political parties"],"a":1,"w":"The First Republic ended with the January 1966 military coup, following intense political rivalry and disputed elections, notably in the Western Region."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government • Y12',ti:'Political Parties Under Military Rule and Transition Attempts',su:'Understand how party politics was suspended and later attempted during military rule.',steps:[
  {lb:'Ban on party politics (1966–1978)',dr:dQ4,ht:'<p>Following the 1966 coups and the Nigerian Civil War (1967–70), successive military governments banned political party activities, ruling by decree without an elected legislature or active political parties.</p>'},
  {lb:'Transition to the Second Republic',dr:dQ4,ht:'<p>General Olusegun Obasanjo\'s military government permitted a return to party politics in 1978–79, lifting the ban ahead of the transition to the Second Republic (1979–83) under a new presidential constitution.</p>'},
  {lb:'Second Republic parties (1979–83)',dr:dQ4,ht:'<p>Five parties were registered for the 1979 elections: the National Party of Nigeria (NPN), Unity Party of Nigeria (UPN, led by Awolowo), Nigerian Peoples Party (NPP, led by Azikiwe), Peoples Redemption Party (PRP, led by Aminu Kano), and Great Nigeria Peoples Party (GNPP).</p>'},
  {lb:'Return to military rule (1983–98)',dr:dQ4,ht:'<p>The Second Republic ended with the December 1983 military coup; subsequent military governments (Buhari, Babangida, Abacha) again suspended party politics, with Babangida\'s controversial two-party experiment (SDP and NRC) in the early 1990s ultimately failing to produce a lasting transition.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{"q":"For how long, broadly, was party political activity banned following the 1966 coups?","o":["From 1966 until the transition to the Second Republic in 1978–79","Only for one month in 1966","Party politics was never banned in Nigeria","From 1999 to the present day"],"a":0,"w":"Party political activity was banned from the 1966 coups until General Obasanjo's military government permitted a return to party politics in 1978–79."},{"q":"Which military ruler oversaw the transition permitting a return to party politics ahead of the Second Republic?","o":["General Sani Abacha","General Olusegun Obasanjo","General Ibrahim Babangida","General Muhammadu Buhari"],"a":1,"w":"General Olusegun Obasanjo's military government lifted the ban on party politics in 1978–79, ahead of the Second Republic transition."},{"q":"Which party, led by Obafemi Awolowo, was registered for the 1979 Second Republic elections?","o":["The Nigerian Peoples Party (NPP)","The National Party of Nigeria (NPN)","The Unity Party of Nigeria (UPN)","The Peoples Redemption Party (PRP)"],"a":2,"w":"The Unity Party of Nigeria (UPN), led by Obafemi Awolowo, was one of the five parties registered for the 1979 elections."},{"q":"Which party, led by Aminu Kano, represented radical/progressive politics in the Second Republic?","o":["The Great Nigeria Peoples Party (GNPP)","The National Party of Nigeria (NPN)","The Unity Party of Nigeria (UPN)","The Peoples Redemption Party (PRP)"],"a":3,"w":"The Peoples Redemption Party (PRP), led by Aminu Kano, represented radical/progressive politics in the Second Republic."},{"q":"What ended Nigeria's Second Republic in December 1983?","o":["A military coup","A peaceful, scheduled transfer of power","A national referendum ending democracy voluntarily","The voluntary merger of all political parties"],"a":0,"w":"The Second Republic ended with a military coup in December 1983."},{"q":"Babangida's controversial two-party experiment in the early 1990s created which two parties?","o":["The NPN and UPN","The Social Democratic Party (SDP) and National Republican Convention (NRC)","The NCNC and AG","NEPU and UMBC"],"a":1,"w":"Babangida's government created the SDP and NRC as Nigeria's only two officially permitted parties in a controversial, ultimately unsuccessful transition experiment."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government • Y12',ti:'The Annulled 1993 Election and Its Aftermath',su:'Understand the significance of the annulled June 12, 1993 election.',steps:[
  {lb:'The June 12, 1993 election',dr:dQ5,ht:'<p>Held under Babangida\'s two-party system, the June 12, 1993 presidential election was widely regarded as Nigeria\'s freest and fairest, with Chief M.K.O. Abiola of the SDP appearing to have won decisively.</p>'},
  {lb:'Annulment of the election',dr:dQ5,ht:'<p>General Babangida controversially annulled the election results before they could be officially declared, triggering a major national political crisis and widespread protests, particularly in Yoruba/Western areas.</p>'},
  {lb:'Political fallout',dr:dQ5,ht:'<p>The annulment led to Babangida\'s eventual resignation, a brief Interim National Government under Ernest Shonekan, and then General Sani Abacha\'s seizure of power in November 1993, ushering in a repressive military era.</p>'},
  {lb:'Legacy of June 12',dr:dQ5,ht:'<p>June 12 became a powerful symbol of Nigeria\'s struggle for democracy; in 2018, President Muhammadu Buhari\'s government officially recognised June 12 (rather than May 29) as Nigeria\'s Democracy Day, honouring Abiola and the annulled election.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{"q":"The June 12, 1993 election is widely regarded as:","o":["Nigeria's freest and fairest election up to that point","A fraudulent election with no credibility","An election that never actually took place","A purely ceremonial, non-competitive vote"],"a":0,"w":"The June 12, 1993 election is widely regarded as one of Nigeria's freest and fairest elections."},{"q":"Who was the SDP candidate widely believed to have won the annulled June 12, 1993 election?","o":["General Ibrahim Babangida","Chief M.K.O. Abiola","Ernest Shonekan","General Sani Abacha"],"a":1,"w":"Chief M.K.O. Abiola of the SDP was widely believed to have won the June 12, 1993 election decisively before it was annulled."},{"q":"Who annulled the June 12, 1993 election results?","o":["Ernest Shonekan","General Sani Abacha","General Ibrahim Babangida","Chief M.K.O. Abiola himself"],"a":2,"w":"General Ibrahim Babangida controversially annulled the election results before they could be officially declared."},{"q":"What interim arrangement followed Babangida's resignation after the annulment crisis?","o":["The National Assembly took over full executive power","Immediate elections were held within a week","Chief Abiola was allowed to take office","An Interim National Government under Ernest Shonekan"],"a":3,"w":"A brief Interim National Government under Ernest Shonekan followed Babangida's resignation, before Abacha seized power."},{"q":"Who seized power in November 1993, ushering in a repressive military era?","o":["General Sani Abacha","General Ibrahim Babangida","Ernest Shonekan","Chief M.K.O. Abiola"],"a":0,"w":"General Sani Abacha seized power in November 1993, beginning a repressive military era following the June 12 crisis."},{"q":"What significant change did President Buhari's government make in 2018 regarding June 12?","o":["Banned any commemoration of June 12 permanently","Officially recognised June 12 as Nigeria's Democracy Day, honouring Abiola and the annulled election","Declared June 12 a purely religious holiday","Removed June 12 from Nigeria's political history entirely"],"a":1,"w":"In 2018, the Buhari government officially recognised June 12 as Nigeria's Democracy Day (replacing May 29), honouring Abiola's presumed victory and the annulled election."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government • Y12',ti:'Fourth Republic Parties (1999–present)',su:'Understand the major parties of Nigeria\'s current, ongoing democratic era.',steps:[
  {lb:'Transition to the Fourth Republic',dr:dQ6,ht:'<p>Following Abacha\'s death in 1998 and a brief transition under General Abdulsalami Abubakar, Nigeria returned to civilian, multi-party democracy in 1999, marking the start of the Fourth Republic — Nigeria\'s longest continuous period of democratic government.</p>'},
  {lb:'PDP dominance (1999–2015)',dr:dQ6,ht:'<p>The People\'s Democratic Party (PDP) dominated Nigerian politics from 1999, winning every presidential election from 1999 to 2011, with Olusegun Obasanjo (1999, 2003), Umaru Musa Yar\'Adua (2007) and Goodluck Jonathan (2011) as PDP presidents.</p>'},
  {lb:'The rise of the APC and 2015 power shift',dr:dQ6,ht:'<p>In 2013, several opposition parties merged to form the All Progressives Congress (APC); in 2015, the APC\'s Muhammadu Buhari defeated the PDP\'s incumbent Goodluck Jonathan, marking Nigeria\'s first-ever democratic transfer of power between parties at the presidential level.</p>'},
  {lb:'Continued multi-party competition',dr:dQ6,ht:'<p>Since 2015, Nigeria\'s party landscape has continued to feature PDP and APC as the dominant parties, alongside smaller parties like the Labour Party (which gained significant support in the 2023 elections) and others contesting at various levels.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{"q":"Nigeria's Fourth Republic, Nigeria's current democratic era, began in which year?","o":["1999","1979","1966","2015"],"a":0,"w":"The Fourth Republic began in 1999, following the transition from Abacha-era military rule, and remains Nigeria's current democratic period."},{"q":"Which party dominated Nigerian presidential politics from 1999 to 2015?","o":["The All Progressives Congress (APC)","The People's Democratic Party (PDP)","The Labour Party","The Action Group (AG)"],"a":1,"w":"The PDP dominated Nigerian presidential politics from 1999, winning every presidential election until 2015."},{"q":"The All Progressives Congress (APC) was formed in which year, through a merger of opposition parties?","o":["1979","1999","2013","2023"],"a":2,"w":"The APC was formed in 2013 through a merger of several opposition parties seeking to challenge PDP dominance."},{"q":"What was historically significant about the 2015 presidential election?","o":["It was won unopposed by the incumbent president","It was Nigeria's first-ever presidential election of any kind","It ended all political party activity in Nigeria","It marked Nigeria's first-ever democratic transfer of power between parties at the presidential level"],"a":3,"w":"The 2015 election, in which APC's Buhari defeated PDP's incumbent Jonathan, marked Nigeria's first democratic transfer of power between parties at the presidential level."},{"q":"Which party gained significant support, particularly among younger voters, in the 2023 general elections?","o":["The Labour Party","The Action Group","NEPU","The Northern People's Congress"],"a":0,"w":"The Labour Party gained significant support in the 2023 elections, particularly attracting younger, urban voters."},{"q":"Which two parties have remained the dominant forces in Nigerian politics since 2015?","o":["NCNC and NPC","PDP and APC","UPN and NPN","SDP and NRC"],"a":1,"w":"PDP and APC have remained the two dominant parties in Nigerian politics since the 2015 power shift."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government • Y12',ti:'Ethnic and Regional Basis of Nigerian Parties',su:'Understand the recurring pattern of ethnic/regional party alignment.',steps:[
  {lb:'Historical pattern',dr:dQ7,ht:'<p>From the First Republic (NPC-North, AG-West, NCNC-East) through to more recent periods, Nigerian political parties have frequently drawn much of their core support from specific ethnic or regional bases, even when officially presenting themselves as national parties.</p>'},
  {lb:'Efforts to build national parties',dr:dQ7,ht:'<p>Nigeria\'s electoral laws (since the Second Republic) have required parties to demonstrate a national spread of support and leadership (e.g. having offices/leadership in a set number of states) specifically to discourage narrow ethnic/regional parties.</p>'},
  {lb:'Persistent regional voting patterns',dr:dQ7,ht:'<p>Despite these legal requirements, voting patterns in Nigerian elections still often show strong regional/ethnic correlations, with certain parties or candidates performing particularly strongly in specific zones.</p>'},
  {lb:'Implications for national unity',dr:dQ7,ht:'<p>The persistence of ethnic/regional voting patterns raises ongoing concerns about national integration, as parties can be tempted to appeal mainly to their regional/ethnic base rather than building genuinely cross-cutting national coalitions.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{"q":"During the First Republic, which party was most closely associated with the Eastern Region?","o":["The NCNC","The NPC","The AG","NEPU"],"a":0,"w":"The NCNC was most closely associated with the Eastern Region and its largely Igbo population during the First Republic."},{"q":"Why does Nigerian electoral law require parties to show a national spread of support/leadership?","o":["To ban all political parties entirely","To discourage narrow ethnic/regional parties and encourage genuinely national political organisations","To ensure only one party can ever be registered","To eliminate elections altogether"],"a":1,"w":"Nigeria's electoral laws require national spread specifically to discourage parties from being narrowly ethnic/regional and to promote genuinely national organisations."},{"q":"Despite legal requirements for national spread, Nigerian elections still often show:","o":["Total elimination of any ethnic voting influence","Completely uniform voting patterns with no regional variation at all","Strong regional/ethnic correlations in voting patterns for certain parties/candidates","No connection between region and voting behaviour whatsoever"],"a":2,"w":"Despite legal national-spread requirements, actual voting patterns often still show notable regional/ethnic correlations."},{"q":"What concern does persistent ethnic/regional voting raise for Nigeria's national unity?","o":["It shows that ethnicity has no role in Nigerian politics","It guarantees perfect national unity with no concerns at all","It has eliminated the need for federal character entirely","Parties may be tempted to appeal mainly to their regional/ethnic base rather than build cross-cutting national coalitions"],"a":3,"w":"Persistent regional/ethnic voting raises concerns that parties may prioritise their core regional base over building genuinely national coalitions, a challenge for integration."},{"q":"Which historical pattern illustrates the recurring ethnic/regional basis of Nigerian parties?","o":["NPC-North, AG-West, NCNC-East during the First Republic","All parties having identical support in every region throughout Nigerian history","Political parties never having any regional association at all","Only religious, not ethnic, factors shaping party support"],"a":0,"w":"The First Republic's NPC (North), AG (West) and NCNC (East) pattern is the classic historical illustration of ethnic/regional party alignment in Nigeria."},{"q":"Why is it important for WAEC students to understand this ethnic/regional pattern?","o":["Because it has no relevance to understanding Nigerian Government","Because it recurs across Nigerian political history and helps explain challenges to national integration and party politics","Because Nigerian parties have never shown any regional characteristics","Because this pattern is unique to only one historical period"],"a":1,"w":"Understanding the recurring ethnic/regional pattern is important because it helps explain long-standing challenges to Nigerian national integration and party politics."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government • Y12',ti:'Roles and Challenges of Political Parties in Nigeria Today',su:'Evaluate how well Nigerian political parties perform their democratic functions.',steps:[
  {lb:'Weak ideological differentiation',dr:dQ8,ht:'<p>Critics argue Nigerian parties often lack clear, distinct ideological positions, with politicians frequently moving between parties (defection) based on personal or political convenience rather than genuine policy differences.</p>'},
  {lb:'Godfatherism and internal democracy',dr:dQ8,ht:'<p>\'Godfatherism\' — where powerful political patrons control candidate selection and party decisions — has been a persistent challenge, undermining internal party democracy and merit-based candidate emergence.</p>'},
  {lb:'Party funding and vote-buying concerns',dr:dQ8,ht:'<p>Concerns persist about the role of money in Nigerian party politics, including allegations of vote-buying during elections and the high financial cost of contesting for party nominations (party primaries).</p>'},
  {lb:'Efforts at reform',dr:dQ8,ht:'<p>Reform efforts have included INEC regulations on party registration and conduct, court rulings on internal party democracy disputes, and growing civil society pressure for more transparent, issue-based party competition.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{"q":"A common criticism of Nigerian political parties is that they:","o":["Often lack clear, distinct ideological positions, with frequent politician defections","Always maintain rigid, unchanging ideological positions","Never experience any politician movement between parties","Have identical policies with absolutely no distinction from each other by design"],"a":0,"w":"Critics argue Nigerian parties often lack strong ideological differentiation, with politicians frequently defecting based on convenience rather than policy."},{"q":"'Godfatherism' in Nigerian party politics refers to:","o":["A formal government department overseeing elections","Powerful political patrons controlling candidate selection and party decisions","A type of traditional ruler's title","A specific electoral law regulating campaign finance"],"a":1,"w":"Godfatherism describes the influence of powerful political patrons ('godfathers') over candidate selection and internal party decisions, often undermining internal democracy."},{"q":"Which concern relates to money's role in Nigerian party politics?","o":["Parties being legally banned from receiving any funding at all","Complete absence of any campaign spending in Nigerian elections","Vote-buying during elections and high costs of contesting party primaries","Money having no influence whatsoever on Nigerian elections"],"a":2,"w":"Concerns persist about vote-buying and the high financial costs associated with contesting party primaries and elections in Nigeria."},{"q":"Which body has issued regulations on party registration and conduct as part of reform efforts?","o":["The National Youth Service Corps","The Nigerian Stock Exchange","The Nigerian Bar Association alone","INEC (Independent National Electoral Commission)"],"a":3,"w":"INEC has issued regulations on party registration, conduct and internal processes as part of ongoing reform efforts."},{"q":"How has the judiciary been involved in addressing internal party democracy disputes?","o":["Through court rulings resolving disputes over party primaries and candidate selection","By directly selecting party candidates itself","By banning all political parties from holding primaries","By having no role in party-related disputes at all"],"a":0,"w":"Nigerian courts have frequently ruled on disputes over party primaries and candidate selection, playing an important role in internal party democracy issues."},{"q":"What is a key ongoing challenge for improving Nigerian party politics?","o":["Eliminating political parties entirely","Building more transparent, issue-based competition rather than personality/patronage-driven politics","Returning to a one-party system permanently","Removing INEC's regulatory role over parties"],"a":1,"w":"A key challenge is shifting Nigerian party politics toward more transparent, issue-based competition, away from patronage and personality-driven approaches."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government • Y12',ti:'WAEC Exam Preparation — Development of Political Parties',su:'Practise WAEC-style questions on the historical development of Nigerian political parties.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions: (1) Define political parties and their functions. (2) Trace historical development chronologically (pre-independence → First Republic → military era → Second Republic → June 12 → Fourth Republic). (3) Name key parties/leaders per era. (4) Discuss ethnic/regional patterns. (5) Evaluate current challenges.</p>'},
  {lb:'Common WAEC question patterns',dr:dQ9,ht:'<p>Typical questions: \'Trace the development of political parties in Nigeria from the colonial era to the present\', \'Discuss the major political parties of the First Republic and their regional bases\', \'Account for the significance of the June 12, 1993 election\', \'Examine the challenges facing political parties in Nigeria today\'.</p>'},
  {lb:'Key facts to memorise',dr:dQ9,ht:'<p>NNDP (1923, Macaulay) = first party. NCNC (1944, Azikiwe), AG (Awolowo), NPC (Ahmadu Bello) = First Republic \'big three\'. NPN, UPN, NPP, PRP, GNPP = Second Republic five. SDP/NRC = Babangida\'s two parties. Abiola = June 12, 1993. PDP dominance 1999–2015; APC won 2015 (first transfer of power).</p>'},
  {lb:'Common mistakes to avoid',dr:dQ9,ht:'<p>Avoid mixing up party eras (e.g. confusing First Republic parties with Second Republic parties). Always attribute the correct leader to each party. Give precise years for major transitions (1960, 1966, 1979, 1983, 1993, 1999, 2015). Mention the ethnic/regional basis where relevant.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{"q":"For a WAEC question tracing party development 'from the colonial era to the present', where should the answer begin?","o":["Herbert Macaulay's NNDP (1923), Nigeria's first political party","Only from 1999, ignoring all earlier history","Only from the Second Republic (1979)","Only from the June 12, 1993 election"],"a":0,"w":"A complete WAEC answer tracing party development from the colonial era should begin with Macaulay's NNDP (1923) as Nigeria's first political party."},{"q":"Which set of parties should be cited for a question specifically about First Republic parties?","o":["NPN, UPN, NPP, PRP, GNPP","NCNC, AG, NPC (and smaller parties like NEPU, UMBC)","SDP and NRC","PDP and APC"],"a":1,"w":"NCNC, AG and NPC (the 'big three'), alongside smaller parties like NEPU and UMBC, are the correct parties for First Republic questions."},{"q":"Which set of parties should be cited for a question specifically about the Second Republic (1979–83)?","o":["SDP and NRC","NCNC, AG, NPC","NPN, UPN, NPP, PRP, GNPP","PDP and APC"],"a":2,"w":"The five parties registered for 1979 elections — NPN, UPN, NPP, PRP, GNPP — are correct for Second Republic questions."},{"q":"A precise WAEC answer on the significance of June 12, 1993 should mention:","o":["That June 12 has no ongoing political significance","Only that an election took place with no further detail","That June 12 refers to Nigeria's independence day","Abiola's presumed victory, Babangida's annulment, and its later recognition as Democracy Day in 2018"],"a":3,"w":"A complete answer covers Abiola's presumed victory, the annulment by Babangida, and the 2018 recognition of June 12 as Democracy Day."},{"q":"A common WAEC mistake to avoid on this topic is:","o":["Confusing First Republic parties (NCNC/AG/NPC) with Second Republic parties (NPN/UPN/NPP/PRP/GNPP)","Giving precise years for major transitions","Naming the correct party leaders","Discussing the ethnic/regional basis of parties"],"a":0,"w":"A frequent error is mixing up the party names/eras between the First and Second Republics, which WAEC expects students to keep clearly distinct."},{"q":"For a question on 'challenges facing Nigerian political parties today', a complete answer should mention:","o":["Only that Nigerian parties face no challenges of any kind","Weak ideological differentiation, godfatherism, and concerns about money/vote-buying","Only the history of the First Republic with no reference to current issues","Only foreign political parties, not Nigerian ones"],"a":1,"w":"A complete WAEC answer on current challenges should cover weak ideological differentiation, godfatherism and money's role in party politics."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Government • Y12',ti:'Mixed Questions — Development of Political Parties',su:'Integrated revision across the full history of Nigerian political parties.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Pre-independence: NNDP (1923, Macaulay), NYM (1930s), NCNC (1944, Azikiwe). First Republic: NCNC-East, AG-West (Awolowo), NPC-North (Ahmadu Bello); ended in 1966 coup. Military ban 1966–78. Second Republic (1979–83): NPN, UPN, NPP, PRP, GNPP; ended in 1983 coup. Babangida\'s SDP/NRC; June 12, 1993 (Abiola) annulled. Fourth Republic (1999–present): PDP dominance to 2015; APC wins 2015 (first power transfer); Labour Party rises 2023.</p>'},
  {lb:'Connecting concepts',dr:dQ10,ht:'<p>Chain: Nationalist parties campaign for independence → regional/ethnic party alignment emerges → political rivalry contributes to First Republic\'s collapse → military bans then permits parties cyclically → June 12 annulment becomes a democratic turning point → Fourth Republic establishes lasting multi-party democracy, though ethnic/regional patterns and internal party challenges persist.</p>'},
  {lb:'Nigeria-specific facts',dr:dQ10,ht:'<p>Key years: 1923 (NNDP), 1944 (NCNC), 1960 (independence), 1966 (coup, party ban begins), 1979 (Second Republic begins), 1983 (coup), 1993 (June 12 annulment), 1999 (Fourth Republic begins), 2013 (APC formed), 2015 (first power transfer), 2018 (June 12 recognised as Democracy Day), 2023 (Labour Party surge).</p>'},
  {lb:'Final revision tips',dr:dQ10,ht:'<p>Build a mental timeline with these key years and match each era\'s correct parties and leaders. Always distinguish First Republic parties from Second Republic parties. Know the June 12 story in detail, as it is a favourite WAEC topic. Link the historical account to ongoing challenges (godfatherism, ethnic voting patterns) for a strong concluding paragraph.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{"q":"Which correctly matches party to founding leader?","o":["NNDP – Herbert Macaulay; NCNC – Nnamdi Azikiwe; AG – Obafemi Awolowo; NPC – Ahmadu Bello","NNDP – Azikiwe; NCNC – Macaulay; AG – Ahmadu Bello; NPC – Awolowo","All four parties were founded by the same person","None of these parties had any specific founding leader"],"a":0,"w":"The correct pairings are: NNDP-Macaulay, NCNC-Azikiwe, AG-Awolowo, and NPC-Ahmadu Bello — key First Republic-era figures."},{"q":"Which correctly orders these events chronologically?","o":["Fourth Republic begins (1999) → Independence (1960) → NNDP founded (1923)","NNDP founded (1923) → NCNC founded (1944) → Independence (1960) → First Republic ends (1966) → Second Republic begins (1979) → June 12 annulment (1993) → Fourth Republic begins (1999)","June 12 annulment (1993) → NNDP founded (1923) → Independence (1960)","All these events happened in the same year"],"a":1,"w":"This is the correct chronological order of Nigeria's key political party history milestones."},{"q":"Which party was widely believed to have won the annulled June 12, 1993 election?","o":["The People's Democratic Party (PDP)","The National Republican Convention (NRC)","The Social Democratic Party (SDP), led by candidate M.K.O. Abiola","The All Progressives Congress (APC)"],"a":2,"w":"Abiola contested under the SDP and was widely believed to have won the annulled June 12, 1993 election decisively."},{"q":"Which event marked Nigeria's first-ever democratic transfer of power between parties at the presidential level?","o":["The June 12, 1993 election","The 1960 independence transition","The 1979 Second Republic elections","The 2015 election, when APC's Buhari defeated PDP's incumbent Jonathan"],"a":3,"w":"The 2015 election was historically significant as Nigeria's first democratic transfer of presidential power between parties (PDP to APC)."},{"q":"Which recurring theme has challenged Nigerian party politics across multiple eras?","o":["Ethnic/regional party alignment, from the First Republic's NPC/AG/NCNC pattern to more recent voting patterns","Complete absence of any ethnic or regional influence in any era","Total elimination of political parties since 1999","A permanent one-party system since independence"],"a":0,"w":"Ethnic/regional party alignment has been a recurring theme across Nigerian political history, from the First Republic to more recent elections."},{"q":"What is the overall lesson from Nigeria's political party history for WAEC essays?","o":["Nigerian parties have never faced any historical disruption","Nigerian party politics has evolved through cycles of civilian rule and military intervention, with persistent ethnic/regional patterns and ongoing internal party challenges","Only one party has ever existed in Nigerian history","Ethnic and regional factors have never influenced Nigerian party politics"],"a":1,"w":"The overall lesson is that Nigerian party politics has evolved through cycles of democratic and military rule, with persistent ethnic/regional patterns and ongoing internal challenges like godfatherism."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
