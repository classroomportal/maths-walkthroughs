<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The United Nations',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'UN: 193 member states, founded 24 October 1945',DARK,10,'middle',false));o.push(T(240,74,'Replaced the failed League of Nations (1920-1946)','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,CRM,ACC,1.5));o.push(T(240,110,'Charter purposes: peace, cooperation, human rights',DARK,10,'middle',false));o.push(T(240,128,'Signed San Francisco Conference, 1945','#555',9,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,CRM,ACC,1.5));o.push(T(240,164,'Six main organs: GA, Security Council, ICJ, Secretariat, ECOSOC, Trusteeship Council',DARK,10,'middle',false));o.push(T(240,182,'Nigeria joined 7 October 1960','#555',9,'middle',false));}
if(p>=4){o.push(R(10,200,460,60,CRM,ACC,1));o.push(T(240,218,'Peacekeeping ("Blue Helmets") since 1948 (UNTSO)',DARK,10,'middle',false));o.push(T(240,236,'Achievements and criticisms debated globally','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Structure of the UN',ACC,12,'middle',true));
[['General Assembly','193 members, one vote each — "parliament of nations"'],['Security Council','15 members, 5 permanent with veto (USA/UK/France/Russia/China)'],['ICJ','The Hague — settles legal disputes between states'],['Secretariat','Led by Secretary-General (António Guterres since 2017)'],['ECOSOC','Coordinates economic/social work, Sustainable Development Goals']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}

[['Founding','1945, San Francisco Conference, replacing League of Nations'],['Charter','4 purposes (Art.1), sovereign equality (Art.2)'],['General Assembly','193 states, one vote each, non-binding'],['Security Council','15 members, veto, binding Chapter VII powers'],['Other organs','ICJ, Secretariat, ECOSOC, Trusteeship Council (suspended 1994)'],['Agencies','WHO, UNESCO, UNICEF, World Bank, IMF, FAO'],['Nigeria','Joined 1960; major peacekeeping contributor; Ezulwini Consensus']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov \u2022 International Relations',ti:'Origins and Founding of the United Nations',su:'Trace the origins of the UN from the League of Nations to its founding in 1945.',steps:[
{lb:'The League of Nations (1920-1946)',dr:dQ1,ht:'<p>The <b>League of Nations</b>, established in 1920 under the Treaty of Versailles after World War I, was the first attempt at a permanent international organisation for collective security. It failed to prevent aggression by Japan (Manchuria, 1931), Italy (Abyssinia, 1935) and Germany, and was formally dissolved in 1946 &mdash; but its failures directly shaped how the UN was designed to be stronger.</p>'},
{lb:'Founding of the United Nations',dr:dQ1,ht:'<p>The <b>United Nations</b> was founded on <b>24 October 1945</b> (now celebrated annually as UN Day), after the UN Charter was signed by 50 states at the <b>San Francisco Conference</b> (April-June 1945) and ratified by the required majority, including all five prospective permanent Security Council members. The Charter built on earlier wartime declarations: the <b>Atlantic Charter (1941)</b> and the <b>Dumbarton Oaks Conference (1944)</b>.</p>'},
{lb:'Founding aims',dr:dQ1,ht:'<p>The UN\'s founders, having lived through two world wars within 30 years, aimed to: prevent future large-scale wars; promote international cooperation on economic, social and humanitarian problems; and establish a framework for collective security stronger than the League\'s, particularly by giving enforcement power to a Security Council rather than relying only on unanimous agreement.</p>'},
{lb:'Nigeria and the UN',dr:dQ1,ht:'<p>Nigeria joined the United Nations on <b>7 October 1960</b>, just six days after gaining independence from Britain on 1 October 1960 &mdash; among the earliest actions of the new nation, reflecting how central UN membership was considered to full international recognition as a sovereign state.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which organisation, founded in 1920, was the UN\'s failed predecessor?',o:['The League of Nations','NATO','The Commonwealth','The Warsaw Pact'],a:1,w:'The League of Nations, founded in 1920 under the Treaty of Versailles, was the UN\'s failed predecessor.'},{q:'On what date was the United Nations officially founded, now celebrated as UN Day?',o:['24 October 1945','1 January 1945','26 June 1945','1 October 1960'],a:1,w:'The UN was officially founded on 24 October 1945, now celebrated annually as UN Day.'},{q:'At which conference was the UN Charter signed in 1945?',o:['The San Francisco Conference','The Berlin Conference','The Yalta Conference only','The Lagos Conference'],a:1,w:'The UN Charter was signed at the San Francisco Conference (April-June 1945).'},{q:'Which 1941 wartime declaration is considered an early step toward founding the UN?',o:['The Atlantic Charter','The Treaty of Versailles','The Treaty of Lagos','The Berlin Conference'],a:1,w:'The Atlantic Charter (1941) was an early wartime declaration that helped shape the UN\'s founding principles.'},{q:'Which conference in 1944 helped design the UN\'s basic structure before its founding?',o:['The Dumbarton Oaks Conference','The San Francisco Conference','The Berlin Conference','The Montevideo Conference'],a:1,w:'The Dumbarton Oaks Conference (1944) helped design the UN\'s basic structure before it was formally founded.'},{q:'Approximately how many states signed the original UN Charter in 1945?',o:['About 10','About 50','About 100','About 193'],a:2,w:'About 50 states signed the original UN Charter in 1945.'},{q:'On what date did Nigeria join the United Nations?',o:['7 October 1960','1 October 1960','24 October 1945','29 May 1999'],a:1,w:'Nigeria joined the UN on 7 October 1960, just six days after independence.'},{q:'Which type of failure by the League of Nations directly shaped how the UN\'s Security Council was designed?',o:['Its failure to stop aggression by Japan, Italy and Germany without enforcement power','Its excessive military strength','Its refusal to admit any member states','Its focus only on economic issues'],a:1,w:'The League\'s failure to stop aggression without real enforcement power directly shaped the UN Security Council\'s design.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 International Relations',ti:'Purposes and Principles of the UN Charter',su:'Explain the UN Charter\'s stated purposes and founding principles.',steps:[
{lb:'The Charter\'s purposes (Article 1)',dr:dQ2,ht:'<p>Article 1 of the UN Charter sets out four main purposes: (1) to <b>maintain international peace and security</b>; (2) to develop friendly relations among nations based on <b>self-determination</b>; (3) to achieve international cooperation on <b>economic, social and humanitarian</b> problems and promote human rights; and (4) to be a <b>centre for harmonising</b> the actions of nations in pursuing these common ends.</p>'},
{lb:'Key principles (Article 2)',dr:dQ2,ht:'<p>Article 2 establishes founding principles: the <b>sovereign equality</b> of all member states; peaceful settlement of international disputes; a general prohibition on the <b>threat or use of force</b> against another state\'s territorial integrity or political independence; and (with important exceptions) <b>non-interference</b> in matters within a state\'s own domestic jurisdiction.</p>'},
{lb:'The famous Preamble',dr:dQ2,ht:'<p>The Charter\'s Preamble opens with words that remain widely quoted: <em>"We the peoples of the United Nations, determined to save succeeding generations from the scourge of war, which twice in our lifetime has brought untold sorrow to mankind..."</em> &mdash; directly reflecting the trauma of two world wars within 30 years.</p>'},
{lb:'Legal authority of the Charter',dr:dQ2,ht:'<p>Under <b>Article 103</b>, obligations under the UN Charter take precedence over any other international agreement a member state has signed. This gives the Charter a unique status as, in effect, the closest thing the international system has to a global constitution.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Which article of the UN Charter sets out its four main purposes?',o:['Article 1','Article 2','Article 51','Article 103'],a:1,w:'Article 1 of the UN Charter sets out the organisation\'s four main purposes.'},{q:'Which of these is one of the UN Charter\'s stated purposes under Article 1?',o:['To maintain international peace and security','To establish a single world government','To abolish all national armies','To create one global currency'],a:1,w:'Maintaining international peace and security is one of the UN Charter\'s core stated purposes.'},{q:'Which principle in Article 2 grants all member states, regardless of size, equal legal status?',o:['Sovereign equality','Majority rule only','Great power privilege','Colonial hierarchy'],a:1,w:'Article 2 establishes the principle of sovereign equality among all member states.'},{q:'What does Article 2 generally prohibit regarding relations between states?',o:['The threat or use of force against another state\'s territorial integrity','All forms of diplomacy','All international trade','All membership applications'],a:1,w:'Article 2 generally prohibits the threat or use of force against another state\'s territorial integrity.'},{q:'Which phrase from the Charter\'s Preamble reflects the trauma of two world wars?',o:['"Determined to save succeeding generations from the scourge of war"','"In the beginning God created the heavens and the earth"','"We hold these truths to be self-evident"','"Government of the people, by the people, for the people"'],a:1,w:'The Preamble\'s phrase about saving generations from "the scourge of war" directly reflects the trauma of two world wars.'},{q:'Which article gives UN Charter obligations precedence over any other international agreement?',o:['Article 103','Article 1','Article 2','Article 51'],a:1,w:'Article 103 gives UN Charter obligations precedence over any other international agreement.'},{q:'Why is the UN Charter sometimes described as similar to a global constitution?',o:['Its obligations take precedence over other international agreements','It has no legal force at all','It only applies to Security Council members','It was written entirely after the UN\'s founding'],a:1,w:'Because its obligations take legal precedence, the Charter functions similarly to a global constitution.'},{q:'Which UN Charter principle, with exceptions, limits the UN\'s ability to intervene in a state\'s internal affairs?',o:['Non-interference in domestic jurisdiction','Sovereign inequality','Mandatory military intervention','Automatic veto for all states'],a:1,w:'The principle of non-interference in domestic jurisdiction limits UN intervention in internal state affairs, with important exceptions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 International Relations',ti:'The General Assembly',su:'Describe the composition, functions and decision-making of the UN General Assembly.',steps:[
{lb:'Composition',dr:dQ1,ht:'<p>The <b>General Assembly</b> is often called the "parliament of nations" &mdash; all <b>193 UN member states</b> are represented, each holding exactly <b>one vote</b>, regardless of population, wealth or military power. This makes it the most representative and inclusive UN organ.</p>'},
{lb:'Sessions',dr:dQ1,ht:'<p>The General Assembly meets in <b>regular annual session</b>, beginning each September in New York, and can also hold <b>special or emergency sessions</b> when urgent international issues arise (such as during major humanitarian crises or conflicts).</p>'},
{lb:'Voting and decision-making',dr:dQ1,ht:'<p>Decisions on <b>important matters</b> &mdash; such as peace and security recommendations, admitting new members, or the UN budget &mdash; require a <b>two-thirds majority</b>. Other, less critical matters require only a simple majority. Unlike the Security Council, no member state holds a veto in the General Assembly.</p>'},
{lb:'Powers and limitations',dr:dQ1,ht:'<p>The General Assembly can <b>discuss and recommend</b> action on almost any matter within the Charter\'s scope, elect the ten non-permanent Security Council members, and approve the UN budget and the appointment of the Secretary-General (on the Security Council\'s recommendation). However, unlike the Security Council, its resolutions are generally <b>not legally binding</b> on member states.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Why is the General Assembly often called the "parliament of nations"?',o:['All 193 member states are represented, each with one vote','Only the five permanent powers can vote there','It has no member states at all','It meets only once every ten years'],a:1,w:'All 193 member states are represented in the General Assembly, each holding one vote, earning it this nickname.'},{q:'How many votes does each member state hold in the General Assembly, regardless of size?',o:['One','Five','Ten','As many as its population requires'],a:1,w:'Each member state holds exactly one vote in the General Assembly, regardless of size or power.'},{q:'In which month does the General Assembly\'s regular annual session typically begin?',o:['September','January','June','December'],a:1,w:'The General Assembly\'s regular annual session typically begins each September.'},{q:'What majority is required for the General Assembly to decide "important matters" such as admitting new members?',o:['A two-thirds majority','A simple majority only','Unanimous agreement','Approval from the Security Council alone'],a:1,w:'Important matters in the General Assembly require a two-thirds majority to pass.'},{q:'Does any member state hold a veto in the General Assembly, unlike in the Security Council?',o:['No, no member state holds a veto in the General Assembly','Yes, all five permanent powers hold a veto there too','Yes, but only Nigeria holds a veto','Only the Secretary-General holds a veto'],a:1,w:'Unlike the Security Council, no member state holds a veto in the General Assembly.'},{q:'Which Security Council members does the General Assembly have the power to elect?',o:['The ten non-permanent members','The five permanent members','The Secretary-General alone, without Security Council input','No Security Council members at all'],a:1,w:'The General Assembly elects the ten non-permanent members of the Security Council.'},{q:'Are General Assembly resolutions generally legally binding on member states?',o:['No, they are generally not legally binding','Yes, all are automatically legally binding','Only resolutions about Nigeria are binding','Only budget resolutions are ever passed'],a:1,w:'General Assembly resolutions are generally not legally binding on member states, unlike Security Council resolutions.'},{q:'Besides regular annual sessions, what other kind of session can the General Assembly hold?',o:['Special or emergency sessions for urgent issues','Only sessions scheduled ten years in advance','No other kind of session is permitted','Sessions requiring Security Council approval first'],a:1,w:'The General Assembly can hold special or emergency sessions when urgent international issues arise.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 International Relations',ti:'The Security Council',su:'Explain the composition, powers and controversies of the UN Security Council.',steps:[
{lb:'Composition',dr:dQ2,ht:'<p>The <b>Security Council</b> has 15 members: <b>five permanent members</b> &mdash; the USA, UK, France, Russia and China &mdash; each holding a <b>veto</b>, and <b>ten non-permanent members</b> elected by the General Assembly for two-year terms on a regional rotation basis.</p>'},
{lb:'Primary responsibility',dr:dQ2,ht:'<p>The Security Council holds the UN\'s <b>primary responsibility for maintaining international peace and security</b>. It is the only UN organ whose decisions under <b>Chapter VII</b> of the Charter (dealing with threats to peace, breaches of peace, and acts of aggression) are <b>legally binding</b> on all member states, including authorising sanctions or the use of force.</p>'},
{lb:'The veto and its controversy',dr:dQ2,ht:'<p>Any one of the five permanent members can <b>veto</b> (block) a substantive resolution, regardless of how the other 14 members vote. This has repeatedly prevented action &mdash; for example, Russia\'s vetoes on multiple resolutions concerning Syria and Ukraine &mdash; leading critics to call the Council\'s structure outdated and undemocratic, frozen in the power arrangements of 1945.</p>'},
{lb:'Calls for reform',dr:dQ2,ht:'<p>Nigeria and the African Union have long pushed for Security Council reform through the <b>Ezulwini Consensus</b> (2005), demanding at least two permanent African seats with veto power, since <b>Africa currently has no permanent representation</b> despite being home to over a billion people and a large share of the Council\'s agenda items. As of this lesson, no such reform has been achieved.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'How many total members does the UN Security Council have?',o:['15','10','5','193'],a:1,w:'The Security Council has 15 members: 5 permanent and 10 non-permanent.'},{q:'Which five countries are permanent members of the Security Council?',o:['USA, UK, France, Russia and China','USA, Germany, Japan, Brazil and India','Nigeria, USA, UK, France and China','UK, France, Germany, Italy and Spain'],a:1,w:'The five permanent Security Council members are the USA, UK, France, Russia and China.'},{q:'For how long are non-permanent Security Council members elected to serve?',o:['Two years','One year','Ten years','Permanently, with no term limit'],a:1,w:'Non-permanent Security Council members are elected by the General Assembly for two-year terms.'},{q:'Under which chapter of the UN Charter can the Security Council make legally binding decisions on peace and security?',o:['Chapter VII','Chapter II','Chapter XV','Chapter I'],a:1,w:'Chapter VII of the UN Charter allows the Security Council to make legally binding decisions on threats to peace.'},{q:'What power do the five permanent members hold that the ten non-permanent members do not?',o:['The veto','The right to vote at all','The right to attend meetings','The right to be re-elected'],a:1,w:'Only the five permanent members hold the veto power; non-permanent members do not.'},{q:'Which recent conflicts have seen Russia\'s Security Council veto block proposed resolutions?',o:['Syria and Ukraine','Only conflicts in Latin America','Only conflicts before 1950','No conflicts at all'],a:1,w:'Russia has used its veto to block Security Council resolutions concerning both Syria and Ukraine.'},{q:'What is the name of the 2005 African Union position demanding permanent African seats on the Security Council?',o:['The Ezulwini Consensus','The Treaty of Lagos','The Atlantic Charter','The Montevideo Convention'],a:1,w:'The Ezulwini Consensus (2005) is the African Union\'s position demanding permanent African seats on the Security Council.'},{q:'What is a key criticism of the Security Council\'s current permanent membership structure?',o:['It reflects the power arrangements of 1945 and gives Africa no permanent seat','It gives too many permanent seats to African states','It has no permanent members at all','It allows every member state an equal veto'],a:1,w:'Critics argue the Council\'s permanent membership reflects outdated 1945 power arrangements and excludes Africa entirely.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 International Relations',ti:'Other UN Organs',su:'Describe the ICJ, Secretariat, ECOSOC and the Trusteeship Council.',steps:[
{lb:'The International Court of Justice (ICJ)',dr:dQ1,ht:'<p>The <b>International Court of Justice</b>, based in <b>The Hague, Netherlands</b>, is the UN\'s principal judicial organ. It settles legal disputes between states (contentious cases) and gives <b>advisory opinions</b> on legal questions referred by UN organs or agencies. Unlike domestic courts, the ICJ can only hear cases between states, not individuals, and only when states have agreed to its jurisdiction.</p>'},
{lb:'The Secretariat',dr:dQ1,ht:'<p>The <b>Secretariat</b>, headed by the <b>Secretary-General</b>, administers the UN\'s day-to-day work, implements decisions made by other organs, and can bring emerging global threats to the Security Council\'s attention. <b>António Guterres</b> of Portugal has served as Secretary-General since 2017; earlier holders of the post included Kofi Annan of Ghana (1997-2006), the first sub-Saharan African to hold the role.</p>'},
{lb:'The Economic and Social Council (ECOSOC)',dr:dQ1,ht:'<p><b>ECOSOC</b> coordinates the UN\'s economic, social and related work, overseeing many of the UN\'s <b>specialised agencies</b> and functional commissions. It plays a central role in advancing the UN\'s <b>Sustainable Development Goals</b> (adopted 2015), covering poverty, health, education and the environment.</p>'},
{lb:'The Trusteeship Council',dr:dQ1,ht:'<p>The <b>Trusteeship Council</b> historically supervised the transition of former colonial "trust territories" toward self-government or independence. It formally <b>suspended operations in 1994</b> after its last remaining trust territory, <b>Palau</b>, achieved independence &mdash; making it the only UN principal organ no longer actively functioning.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'In which city is the International Court of Justice based?',o:['The Hague, Netherlands','New York, USA','Geneva, Switzerland','Vienna, Austria'],a:1,w:'The International Court of Justice is based in The Hague, Netherlands.'},{q:'What type of legal opinion can the ICJ give, besides ruling on disputes between states?',o:['Advisory opinions on legal questions referred by UN organs','Binding rulings on individual criminal cases','Rulings on domestic traffic disputes','Opinions only on trade tariffs'],a:1,w:'The ICJ can give advisory opinions on legal questions referred to it by UN organs or agencies.'},{q:'Who has served as UN Secretary-General since 2017?',o:['António Guterres','Kofi Annan','Ban Ki-moon','Boutros Boutros-Ghali'],a:1,w:'António Guterres of Portugal has served as UN Secretary-General since 2017.'},{q:'Who was the first sub-Saharan African to serve as UN Secretary-General?',o:['Kofi Annan','António Guterres','Nelson Mandela','Kwame Nkrumah'],a:1,w:'Kofi Annan of Ghana, serving 1997-2006, was the first sub-Saharan African UN Secretary-General.'},{q:'Which UN organ coordinates economic and social work, including the Sustainable Development Goals?',o:['ECOSOC','The Trusteeship Council','The ICJ only','The Secretariat alone'],a:1,w:'ECOSOC coordinates the UN\'s economic and social work, including the Sustainable Development Goals.'},{q:'In which year were the UN\'s Sustainable Development Goals adopted?',o:['2015','1945','1994','2002'],a:1,w:'The Sustainable Development Goals were adopted by the UN in 2015.'},{q:'In which year did the Trusteeship Council suspend operations, after its last trust territory gained independence?',o:['1994','1945','1963','2002'],a:1,w:'The Trusteeship Council suspended operations in 1994 after Palau, its last trust territory, gained independence.'},{q:'Which former trust territory\'s independence led to the Trusteeship Council\'s suspension?',o:['Palau','Nigeria','Ghana','South Africa'],a:1,w:'Palau\'s independence in 1994 was the trigger for the Trusteeship Council\'s suspension of operations.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 International Relations',ti:'UN Specialized Agencies',su:'Identify key UN specialized agencies and their global roles.',steps:[
{lb:'World Health Organization (WHO)',dr:dQ2,ht:'<p>The <b>World Health Organization</b> coordinates global public health responses &mdash; famously leading the <b>eradication of smallpox</b> (declared achieved in 1980) and, more recently, coordinating the international response to the <b>COVID-19 pandemic</b> beginning in 2020, including declaring it a Public Health Emergency of International Concern.</p>'},
{lb:'UNESCO and UNICEF',dr:dQ2,ht:'<p><b>UNESCO</b> (United Nations Educational, Scientific and Cultural Organization) promotes education, scientific cooperation and cultural heritage protection &mdash; including designating World Heritage Sites. <b>UNICEF</b> (United Nations Children\'s Fund) focuses on children\'s welfare, health and education worldwide, including major programmes in Nigeria addressing child malnutrition and out-of-school children.</p>'},
{lb:'The World Bank and IMF',dr:dQ2,ht:'<p>The <b>World Bank</b> and <b>International Monetary Fund (IMF)</b>, though often discussed separately, are technically UN specialised agencies linked through ECOSOC. The World Bank provides loans for development projects, while the IMF promotes international monetary cooperation and financial stability &mdash; both have been involved in Nigeria\'s economic reform programmes over the decades.</p>'},
{lb:'Food and Agriculture Organization (FAO)',dr:dQ2,ht:'<p>The <b>FAO</b> works to defeat hunger and improve agricultural productivity and food security worldwide, an especially significant agency for a large agricultural economy like Nigeria\'s, where FAO programmes have supported farmers facing conflict-related displacement in the Northeast.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Which UN specialized agency led the global eradication of smallpox, achieved by 1980?',o:['The World Health Organization (WHO)','UNESCO','UNICEF','The FAO'],a:1,w:'The World Health Organization (WHO) led the global campaign that eradicated smallpox by 1980.'},{q:'Which global health emergency did WHO coordinate the international response to, beginning in 2020?',o:['The COVID-19 pandemic','World War II','The Ebola outbreak of 1976 only','The Spanish flu of 1918'],a:1,w:'WHO coordinated the international response to the COVID-19 pandemic beginning in 2020.'},{q:'Which UN agency designates World Heritage Sites and promotes education and culture?',o:['UNESCO','UNICEF','The World Bank','The IMF'],a:1,w:'UNESCO promotes education, science and culture, including designating World Heritage Sites.'},{q:'Which UN agency focuses specifically on children\'s welfare, health and education worldwide?',o:['UNICEF','UNESCO','The FAO','The IMF'],a:1,w:'UNICEF focuses specifically on children\'s welfare, health and education worldwide.'},{q:'Which UN-linked institution provides loans for development projects around the world?',o:['The World Bank','UNESCO','UNICEF','The FAO'],a:1,w:'The World Bank provides loans for development projects worldwide.'},{q:'Which UN-linked institution promotes international monetary cooperation and financial stability?',o:['The International Monetary Fund (IMF)','UNESCO','UNICEF','The FAO'],a:1,w:'The International Monetary Fund (IMF) promotes international monetary cooperation and financial stability.'},{q:'Which UN agency works to defeat hunger and improve food security worldwide?',o:['The Food and Agriculture Organization (FAO)','UNESCO','The IMF','The ICJ'],a:1,w:'The Food and Agriculture Organization (FAO) works to defeat hunger and improve food security.'},{q:'Why is the FAO especially significant for a country like Nigeria?',o:['Nigeria has a large agricultural economy, including farmers affected by conflict in the Northeast','Nigeria has no agricultural sector at all','The FAO only operates in Europe','The FAO focuses solely on space exploration'],a:1,w:'Nigeria\'s large agricultural economy, including farmers displaced by conflict in the Northeast, makes FAO programmes especially significant.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 International Relations',ti:'UN Peacekeeping and Nigeria\'s Role',su:'Explain UN peacekeeping principles and Nigeria\'s contributions to peacekeeping missions.',steps:[
{lb:'What is UN peacekeeping?',dr:dQ1,ht:'<p>UN <b>peacekeeping forces</b>, popularly known as "<b>Blue Helmets</b>," are typically deployed with the <b>consent</b> of the parties involved to help maintain ceasefires, protect civilians, and support the implementation of peace agreements. The first mission, <b>UNTSO</b>, was deployed to the Middle East in 1948 and continues today.</p>'},
{lb:'Nigeria as a major troop contributor',dr:dQ1,ht:'<p>Nigeria has been one of <b>Africa\'s largest contributors</b> of troops and police to UN peacekeeping missions, participating in operations including the <b>Congo crisis (ONUC, 1960s)</b>, missions in Lebanon, and the joint UN-AU mission in Darfur (<b>UNAMID</b>), reflecting Nigeria\'s stated foreign policy commitment to African and global peace and security.</p>'},
{lb:'Peacekeeping vs. peace enforcement',dr:dQ1,ht:'<p>Traditional <b>peacekeeping</b> relies on the consent of the conflicting parties and uses force only in self-defence. <b>Peace enforcement</b>, authorised under <b>Chapter VII</b> of the UN Charter, permits more robust military action without requiring the consent of all parties &mdash; a distinction WAEC students should be able to explain clearly with examples.</p>'},
{lb:'Criticisms of peacekeeping',dr:dQ1,ht:'<p>UN peacekeeping has faced serious criticism for slow deployment, limited mandates, and tragic failures &mdash; most notably the inability of <b>UNAMIR</b> to prevent the <b>Rwandan genocide (1994)</b>, and the failure to protect civilians during the <b>Srebrenica massacre (1995)</b> in Bosnia, both widely studied as cautionary examples of peacekeeping\'s limitations.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is the popular nickname for UN peacekeeping forces?',o:['Blue Helmets','Green Berets','White Coats','Red Crosses'],a:1,w:'UN peacekeeping forces are popularly known as "Blue Helmets."'},{q:'In which year was the first UN peacekeeping mission, UNTSO, deployed?',o:['1948','1945','1960','1994'],a:1,w:'UNTSO, the first UN peacekeeping mission, was deployed to the Middle East in 1948.'},{q:'In which 1960s crisis did Nigeria contribute troops to a major UN peacekeeping operation (ONUC)?',o:['The Congo crisis','The Nigerian Civil War','The Suez Crisis','The Korean War'],a:1,w:'Nigeria contributed troops to ONUC, the UN peacekeeping operation during the Congo crisis in the 1960s.'},{q:'What does traditional UN peacekeeping generally require from the conflicting parties?',o:['Their consent','No consent is ever required','Only the consent of the Security Council','Only the consent of Nigeria'],a:1,w:'Traditional UN peacekeeping generally requires the consent of the conflicting parties.'},{q:'Under which chapter of the UN Charter can more robust "peace enforcement" be authorised without full consent?',o:['Chapter VII','Chapter I','Chapter II','Chapter XV'],a:1,w:'Chapter VII of the UN Charter allows for more robust peace enforcement without requiring full consent.'},{q:'Which 1994 tragedy is widely studied as a failure of UN peacekeeping to prevent mass atrocities?',o:['The Rwandan genocide','The Nigerian Civil War','World War II','The Cuban Missile Crisis'],a:1,w:'The Rwandan genocide of 1994, which UNAMIR failed to prevent, is a widely studied peacekeeping failure.'},{q:'Which 1995 event in Bosnia is also cited as a failure of UN peacekeeping to protect civilians?',o:['The Srebrenica massacre','The fall of the Berlin Wall','The end of apartheid','The Rwandan genocide'],a:1,w:'The Srebrenica massacre (1995) in Bosnia is also cited as a major failure of UN peacekeeping to protect civilians.'},{q:'Which joint UN-AU peacekeeping mission in Darfur did Nigeria participate in?',o:['UNAMID','ONUC','UNTSO','ECOMOG'],a:1,w:'Nigeria participated in UNAMID, the joint UN-AU peacekeeping mission in Darfur.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 International Relations',ti:'Achievements and Criticisms of the UN',su:'Evaluate the UN\'s achievements and the main criticisms levelled against it.',steps:[
{lb:'Key achievements',dr:dQ2,ht:'<p>The UN\'s achievements include: no direct war between major powers since 1945; supporting <b>decolonisation</b> across Africa and Asia; establishing the <b>Universal Declaration of Human Rights (1948)</b>; humanitarian and development aid worldwide; and health milestones such as the <b>eradication of smallpox (1980)</b> through WHO-led efforts.</p>'},
{lb:'Key criticisms',dr:dQ2,ht:'<p>Common criticisms include: the Security Council\'s <b>veto power</b>, which can paralyse action on urgent crises; a slow, <b>bureaucratic</b> decision-making process; domination by a small number of <b>great powers</b>; heavy financial dependence on major contributors such as the United States; and limits on its ability to <b>enforce</b> decisions against powerful or uncooperative states.</p>'},
{lb:'Reform debates',dr:dQ2,ht:'<p>Ongoing reform debates focus especially on <b>expanding the Security Council\'s permanent membership</b> &mdash; since Africa currently holds no permanent seat despite being home to over a billion people &mdash; alongside calls to improve the UN\'s efficiency, funding model, and speed of response to emerging crises.</p>'},
{lb:'Overall assessment',dr:dQ2,ht:'<p>Despite its flaws, the UN remains the primary global forum for <b>multilateral diplomacy</b>, the main source of international humanitarian coordination, and the only body with near-universal membership capable of addressing genuinely global problems &mdash; a balanced WAEC essay should acknowledge both its real achievements and its real limitations.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What major international document did the UN establish in 1948?',o:['The Universal Declaration of Human Rights','The Treaty of Versailles','The Atlantic Charter','The Treaty of Lagos'],a:1,w:'The UN established the Universal Declaration of Human Rights in 1948.'},{q:'Which UN-led health achievement is frequently cited among its major successes?',o:['The eradication of smallpox by 1980','The end of all infectious disease','The invention of vaccines','The founding of the WHO in 1980'],a:1,w:'The eradication of smallpox by 1980, led by WHO efforts, is frequently cited among the UN\'s major achievements.'},{q:'Which feature of the Security Council is most frequently criticised for paralysing UN action?',o:['The veto power held by the five permanent members','The General Assembly\'s one-state-one-vote system','The existence of the ICJ','The UN\'s headquarters location'],a:1,w:'The veto power held by the five permanent members is most frequently criticised for paralysing Security Council action.'},{q:'Which country is often cited as the UN\'s largest financial contributor, giving it significant influence?',o:['The United States','Nigeria','Ghana','Palau'],a:1,w:'The United States is often cited as the UN\'s largest financial contributor.'},{q:'What is a central focus of ongoing debates about UN Security Council reform?',o:['Expanding permanent membership, since Africa currently holds no permanent seat','Abolishing the General Assembly entirely','Removing all veto powers immediately','Moving UN headquarters to Nigeria'],a:1,w:'A central reform debate is expanding Security Council permanent membership, since Africa currently has no permanent seat.'},{q:'Which of these is a fair criticism of the UN\'s decision-making process?',o:['It can be slow and bureaucratic','It always acts instantly on every crisis','It has no rules for decision-making at all','It is controlled entirely by Nigeria'],a:1,w:'A slow, bureaucratic decision-making process is a commonly cited criticism of the UN.'},{q:'What is a widely recognised achievement of the UN relating to Africa and Asia after 1945?',o:['Supporting decolonisation across Africa and Asia','Preventing all decolonisation','Colonising new territories itself','Ignoring African and Asian affairs entirely'],a:1,w:'The UN supported the decolonisation process across Africa and Asia following WWII.'},{q:'What balanced conclusion should a strong WAEC essay reach about the UN?',o:['It has real achievements and real limitations, but remains the key forum for multilateral diplomacy','It has achieved absolutely nothing of value','It has no flaws whatsoever','It should be immediately abolished'],a:1,w:'A balanced WAEC essay should acknowledge both the UN\'s real achievements and its real limitations.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 International Relations',ti:'WAEC Exam Preparation — The United Nations',su:'Practise WAEC-style questions on the origins, structure and role of the United Nations.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on the UN: (1) Give the <b>founding date and context</b> (1945, after WWII, replacing the League of Nations). (2) Describe the relevant <b>organ or function</b> being asked about, with structural detail. (3) Give <b>specific, dated examples</b> of the UN in action. (4) Evaluate strengths and weaknesses, and where relevant, Nigeria\'s specific involvement.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "Discuss the structure and functions of the United Nations." / "Examine the role of the Security Council in maintaining international peace." / "Assess the achievements and weaknesses of the United Nations since 1945." / "Discuss Nigeria\'s contribution to UN peacekeeping."</p>'},
{lb:'Key vocabulary for essays',dr:dQ1,ht:'<p>Key vocabulary: <b>Charter</b>, <b>General Assembly</b>, <b>Security Council</b>, <b>veto</b>, <b>Secretariat</b>, <b>ICJ</b>, <b>ECOSOC</b>, <b>specialized agency</b>, <b>peacekeeping</b>, <b>Chapter VII</b>, <b>sovereign equality</b>. Precise use of these terms, correctly spelled, earns higher marks.</p>'},
{lb:'Applying to Nigeria',dr:dQ1,ht:'<p>Always mention Nigeria\'s UN membership since 1960, its major contributions to peacekeeping (Congo, Lebanon, Darfur), and its advocacy through the AU\'s <b>Ezulwini Consensus</b> for Security Council reform &mdash; WAEC consistently rewards this kind of concrete, locally-relevant application.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is the recommended first step for a WAEC essay on the United Nations?',o:['Give the founding date and context','Immediately criticise the UN with no context','List unrelated facts','Skip straight to a conclusion'],a:1,w:'A WAEC essay on the UN should begin by giving its founding date and historical context.'},{q:'Which of these is a typical WAEC-style question on this topic?',o:['"Examine the role of the Security Council in maintaining international peace."','"Describe Nigeria\'s road network."','"Define photosynthesis."','"List the states of Nigeria."'],a:1,w:'"Examine the role of the Security Council in maintaining international peace" is a typical WAEC-style question on this topic.'},{q:'Which of these terms should a strong WAEC essay on the UN correctly use?',o:['Charter, Security Council, veto, ECOSOC, Chapter VII','Only "government" and "election"','Only mathematical formulas','Only unrelated historical dates'],a:1,w:'Precise terms such as Charter, Security Council, veto and ECOSOC strengthen a WAEC essay on the UN.'},{q:'Which specific Nigerian contribution should be mentioned when discussing UN peacekeeping in a WAEC essay?',o:['Nigeria\'s troop contributions to Congo, Lebanon and Darfur missions','Nigeria\'s refusal to join any peacekeeping mission','Nigeria\'s withdrawal from the UN','Nigeria\'s opposition to all UN activities'],a:1,w:'Nigeria\'s troop contributions to missions in Congo, Lebanon and Darfur are key specific examples for a WAEC essay.'},{q:'Which African Union position should be mentioned when discussing Security Council reform?',o:['The Ezulwini Consensus','The Atlantic Charter','The Treaty of Lagos','The Montevideo Convention'],a:1,w:'The Ezulwini Consensus is the AU\'s specific position demanding Security Council reform, relevant to a strong WAEC answer.'},{q:'Why does WAEC reward mentioning Nigeria\'s UN membership date (1960) specifically?',o:['It demonstrates precise, concrete knowledge rather than vague generalisation','Dates are irrelevant to WAEC marking','Nigeria only joined the UN after 2000','The UN was founded by Nigeria'],a:1,w:'Precise dates like Nigeria\'s 1960 UN membership demonstrate concrete knowledge, which WAEC rewards.'},{q:'What should a WAEC essay do after describing the relevant UN organ or function?',o:['Give specific, dated examples of the UN in action','Immediately end the essay','Repeat the definition without further detail','Avoid all examples entirely'],a:1,w:'After describing the organ or function, a strong essay should give specific, dated examples of the UN in action.'},{q:'What is the benefit of evaluating both strengths and weaknesses in a WAEC UN essay?',o:['It demonstrates balanced, critical thinking valued by WAEC examiners','It is discouraged by WAEC','It replaces the need for any factual content','It is only relevant for essays on Nigeria\'s history'],a:1,w:'Evaluating both strengths and weaknesses demonstrates the balanced, critical thinking WAEC examiners value.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov \u2022 International Relations',ti:'Mixed Questions — The United Nations',su:'Integrated revision across the origins, structure, and role of the United Nations.',steps:[
