<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Nigeria Since 1999',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'Obasanjo 1999-2007: Sharia debate, debt relief',DARK,10,'middle',false));o.push(T(240,74,'Yar\'Adua 2007-10: illness, Doctrine of Necessity','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,CRM,ACC,1.5));o.push(T(240,110,'Jonathan 2010-15: Boko Haram, Chibok',DARK,10,'middle',false));o.push(T(240,128,'2015: first opposition election win','#555',9,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,CRM,ACC,1.5));o.push(T(240,164,'Buhari 2015-23: #EndSARS, recessions, cash crisis',DARK,10,'middle',false));o.push(T(240,182,'Tinubu 2023-: subsidy removal, naira float','#555',9,'middle',false));}
if(p>=4){o.push(R(10,200,460,60,CRM,ACC,1));o.push(T(240,218,'Elections: PVC/BVAS reforms since 2011',DARK,10,'middle',false));o.push(T(240,236,'Ongoing: restructuring, resource control debates','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Presidential Timeline',ACC,12,'middle',true));
[['Obasanjo','1999-2007 — debt relief, Sharia debate, 3rd term bid fails'],["Yar'Adua/Jonathan",'2007-15 — Doctrine of Necessity, Boko Haram rises'],['Buhari','2015-23 — #EndSARS, 2 recessions, cash crisis'],['Tinubu','2023- — subsidy removed, naira floated'],['Ongoing debates','Restructuring, resource control, state creation']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ4(p){dQ2(p);}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Nigeria Since 1999 — Summary',ACC,13,'middle',true));
[['29 May 1999','Fourth Republic begins (Obasanjo)'],['2005','Paris Club debt relief deal'],['2009','Niger Delta amnesty; Boko Haram turns violent'],['2014','Chibok kidnapping; GDP rebasing'],['2015','First opposition election win (Buhari over Jonathan)'],['2020','#EndSARS protests'],['2023','Tinubu elected; subsidy removed; naira floated']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov • POL',ti:'The Obasanjo Presidency (1999-2007)',su:'Explain the key events and policies of Nigeria\'s Fourth Republic under Obasanjo.',steps:[
{lb:'Return to democracy',dr:dQ1,ht:'<p><b>Olusegun Obasanjo</b>, elected in February 1999, was inaugurated on <b>29 May 1999</b> as Nigeria\'s President, marking the start of the Fourth Republic. His government faced the immediate challenge of restoring civilian institutions after 15 years of continuous military rule.</p>'},
{lb:'Sharia law controversy',dr:dQ1,ht:'<p>Beginning in 1999-2000, several <b>Northern states</b> (starting with Zamfara) adopted full <b>Sharia (Islamic law)</b> criminal codes, sparking intense national debate about religion, federalism and the 1999 Constitution\'s secular character, and contributing to inter-religious tensions in parts of the North.</p>'},
{lb:'Economic reforms',dr:dQ1,ht:'<p>Obasanjo\'s government, particularly in his second term (2003-2007), pursued significant economic reforms including <b>banking sector consolidation</b> (2004-05, reducing the number of banks from 89 to 25 through forced recapitalisation) and pursuit of <b>debt relief</b>, achieving a landmark <b>Paris Club debt deal in 2005</b> that wrote off much of Nigeria\'s external debt.</p>'},
{lb:'A controversial third-term bid',dr:dQ1,ht:'<p>In 2006, Obasanjo\'s allies attempted to amend the constitution to allow him a <b>third presidential term</b>, but the bid was defeated in the <b>National Assembly</b>, seen as an important, if contested, demonstration of constitutional limits holding against executive pressure.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"On what date was Olusegun Obasanjo inaugurated as President, starting the Fourth Republic?","o":["29 May 1999","1 October 1999","1 October 1960","29 May 2003"],"a":0,"w":"Obasanjo was inaugurated on 29 May 1999, starting Nigeria's Fourth Republic."},{"q":"Which Northern state first adopted full Sharia criminal law beginning in 1999-2000?","o":["Kano","Zamfara","Sokoto","Kaduna"],"a":1,"w":"Zamfara was the first Northern state to adopt full Sharia criminal law, beginning in 1999-2000."},{"q":"What national debate did the adoption of Sharia law spark?","o":["A debate about state creation only","A debate about Nigeria's currency","Debate about religion, federalism and the Constitution's secular character","A debate about Nigeria's UN membership"],"a":2,"w":"The adoption of Sharia law sparked debate about religion, federalism and the Constitution's secular character."},{"q":"From what number to what number did banking sector consolidation (2004-05) reduce Nigeria's banks?","o":["From 100 to 50","From 25 to 89","From 50 to 10","From 89 to 25"],"a":3,"w":"Banking sector consolidation reduced the number of Nigerian banks from 89 to 25."},{"q":"What major debt agreement did Nigeria achieve in 2005?","o":["A Paris Club debt relief deal","A new UN Security Council seat","A trade deal with the EU","A currency union with Ghana"],"a":0,"w":"Nigeria achieved a landmark Paris Club debt relief deal in 2005."},{"q":"What controversial attempt occurred in 2006 involving Obasanjo's presidency?","o":["An attempt to abolish the Senate","An attempt to amend the constitution for a third presidential term","An attempt to return to military rule","An attempt to move the capital back to Lagos"],"a":1,"w":"In 2006, Obasanjo's allies attempted to amend the constitution to allow him a third presidential term."},{"q":"Which body defeated the third-term bid in 2006?","o":["INEC","The Supreme Court","The National Assembly","The Nigerian Army"],"a":2,"w":"The National Assembly defeated the third-term bid in 2006."},{"q":"What did the defeat of the third-term bid demonstrate about Nigeria's constitutional system?","o":["That elections had been permanently abolished","That the constitution had no real force","That the military had regained control","That constitutional limits could hold against executive pressure"],"a":3,"w":"The defeat of the third-term bid demonstrated that constitutional limits could hold against executive pressure."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Gov • POL',ti:'The Yar\'Adua and Jonathan Presidencies (2007-2015)',su:'Explain the events of the Yar\'Adua and Jonathan administrations.',steps:[
{lb:'Yar\'Adua\'s election and the "Seven-Point Agenda"',dr:dQ2,ht:'<p><b>Umaru Musa Yar\'Adua</b> was elected President in April 2007, in an election marred by widespread reports of irregularities, later famously admitted by Yar\'Adua himself. His government announced a <b>"Seven-Point Agenda"</b> focused on power, food security, and infrastructure, alongside a landmark <b>Niger Delta amnesty programme (2009)</b> for militants.</p>'},
{lb:'Yar\'Adua\'s illness and the "Doctrine of Necessity"',dr:dQ2,ht:'<p>Yar\'Adua fell seriously ill and was absent from the country for medical treatment for an extended period in late 2009-early 2010, creating a constitutional crisis over who held presidential power. The National Assembly resolved this via the so-called <b>"Doctrine of Necessity"</b> in February 2010, declaring Vice President <b>Goodluck Jonathan</b> Acting President.</p>'},
{lb:'Jonathan\'s presidency',dr:dQ2,ht:'<p>Yar\'Adua died in May 2010, and Jonathan became substantive President, later winning election in his own right in <b>2011</b>. His presidency (2010-2015) was marked by the escalating <b>Boko Haram insurgency</b>, including the internationally notorious <b>Chibok schoolgirls kidnapping (April 2014)</b>.</p>'},
{lb:'The 2015 election and peaceful handover',dr:dQ2,ht:'<p>The <b>2015 presidential election</b> saw Jonathan defeated by <b>Muhammadu Buhari</b> of the APC &mdash; the <b>first time in Nigerian history</b> that an incumbent president lost an election and peacefully handed over power to the opposition, widely praised as a landmark moment for Nigerian democracy.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"In which year was Umaru Musa Yar'Adua elected President, in an election he himself later admitted was flawed?","o":["2007","1999","2010","2011"],"a":0,"w":"Yar'Adua was elected President in 2007, in an election he later admitted was flawed."},{"q":"What amnesty programme did Yar'Adua's government launch in 2009?","o":["An amnesty for Boko Haram fighters","A Niger Delta amnesty programme for militants","An amnesty for former military rulers","An amnesty for election riggers"],"a":1,"w":"Yar'Adua's government launched a Niger Delta amnesty programme for militants in 2009."},{"q":"What constitutional principle resolved the crisis over Yar'Adua's prolonged medical absence?","o":["Judicial Review","The Federal Character Principle","The \"Doctrine of Necessity\"","The Rule of Law"],"a":2,"w":"The \"Doctrine of Necessity\" resolved the constitutional crisis over Yar'Adua's prolonged absence."},{"q":"Who was declared Acting President under the Doctrine of Necessity in February 2010?","o":["Atiku Abubakar","Muhammadu Buhari","Olusegun Obasanjo","Goodluck Jonathan"],"a":3,"w":"Goodluck Jonathan was declared Acting President under the Doctrine of Necessity in February 2010."},{"q":"In what year did Yar'Adua die, making Jonathan the substantive President?","o":["2010","2007","2011","2015"],"a":0,"w":"Yar'Adua died in May 2010, making Jonathan the substantive President."},{"q":"What internationally notorious event occurred during Jonathan's presidency in April 2014?","o":["The annulment of an election","The Chibok schoolgirls kidnapping","A military coup","A civil war"],"a":1,"w":"The Chibok schoolgirls kidnapping by Boko Haram occurred in April 2014, during Jonathan's presidency."},{"q":"Who defeated Goodluck Jonathan in the 2015 presidential election?","o":["Olusegun Obasanjo","Umaru Yar'Adua","Muhammadu Buhari","Atiku Abubakar"],"a":2,"w":"Muhammadu Buhari of the APC defeated Goodluck Jonathan in the 2015 presidential election."},{"q":"What made the 2015 election result historically significant for Nigerian democracy?","o":["It was annulled like the 1993 election","It was Nigeria's first ever election","It led to a military coup","It was the first time an incumbent president lost and peacefully handed over power"],"a":3,"w":"The 2015 election was historically significant as the first time an incumbent president lost and peacefully handed over power."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov • POL',ti:'The Buhari Presidency (2015-2023)',su:'Explain the key policies and challenges of the Buhari administration.',steps:[
{lb:'Anti-corruption and security focus',dr:dQ1,ht:'<p><b>Muhammadu Buhari</b>\'s administration (2015-2023) prioritised <b>anti-corruption</b> efforts and the fight against <b>Boko Haram/ISWAP</b> insurgency in the Northeast, while also facing a worsening wave of <b>farmer-herder conflicts</b> and banditry across the North-West and Middle Belt.</p>'},
{lb:'Economic challenges',dr:dQ1,ht:'<p>Nigeria entered <b>two recessions</b> during Buhari\'s tenure (2016 and 2020, the latter linked to the COVID-19 pandemic and collapsing oil prices), alongside a highly controversial <b>currency redesign and cash scarcity crisis</b> in early 2023, just before the general election.</p>'},
{lb:'The #EndSARS protests (2020)',dr:dQ1,ht:'<p>In October 2020, mass <b>#EndSARS protests</b> erupted nationwide against police brutality, particularly by the Special Anti-Robbery Squad (SARS), culminating in the disputed <b>Lekki Tollgate incident (20 October 2020)</b> where security forces were accused of shooting at protesters, sparking widespread domestic and international condemnation.</p>'},
{lb:'The 2023 election and handover',dr:dQ1,ht:'<p>The <b>2023 general election</b>, held amid the cash scarcity crisis, was won by <b>Bola Ahmed Tinubu</b> of the APC, who was inaugurated on <b>29 May 2023</b>, continuing the pattern of peaceful, constitutional transfers of power established since 1999.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What two priority areas did Buhari's administration emphasise from 2015?","o":["Anti-corruption and fighting Boko Haram/ISWAP insurgency","Expanding the monarchy and reducing elections","Rejoining the Commonwealth and abolishing the Senate","Abolishing all state governments"],"a":0,"w":"Buhari's administration emphasised anti-corruption efforts and fighting the Boko Haram/ISWAP insurgency."},{"q":"Besides Boko Haram, what other security challenge worsened during Buhari's tenure?","o":["A civil war in the South-West","Farmer-herder conflicts and banditry","A war with Ghana","A conflict with Cameroon over Lagos"],"a":1,"w":"Farmer-herder conflicts and banditry worsened across the North-West and Middle Belt during Buhari's tenure."},{"q":"In which two years did Nigeria enter recession during Buhari's presidency?","o":["1999 and 2007","2015 and 2019","2016 and 2020","2010 and 2014"],"a":2,"w":"Nigeria entered recession in both 2016 and 2020 during Buhari's presidency."},{"q":"What crisis occurred in early 2023, just before the general election?","o":["A currency union with Ghana","A civil war","A military coup","A currency redesign and cash scarcity crisis"],"a":3,"w":"A controversial currency redesign and cash scarcity crisis occurred in early 2023, just before the general election."},{"q":"What movement erupted in October 2020 against police brutality?","o":["The #EndSARS protests","The Aba Women's Riots","The Wild Wild West crisis","The Third Term bid protests"],"a":0,"w":"The #EndSARS protests erupted in October 2020 against police brutality."},{"q":"Which police unit was the primary target of the #EndSARS protests?","o":["The Nigerian Army","The Special Anti-Robbery Squad (SARS)","The Nigerian Navy","The Nigerian Air Force"],"a":1,"w":"The Special Anti-Robbery Squad (SARS) was the primary target of the #EndSARS protests."},{"q":"What disputed incident occurred on 20 October 2020 during the #EndSARS protests?","o":["The annulment of an election","The Chibok kidnapping","The Lekki Tollgate incident","A military coup in Lagos"],"a":2,"w":"The disputed Lekki Tollgate incident occurred on 20 October 2020 during the #EndSARS protests."},{"q":"Who won the 2023 general election, continuing the pattern of peaceful transfers of power since 1999?","o":["Atiku Abubakar","Muhammadu Buhari","Goodluck Jonathan","Bola Ahmed Tinubu"],"a":3,"w":"Bola Ahmed Tinubu won the 2023 general election, continuing the pattern of peaceful transfers of power since 1999."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov • POL',ti:'Elections and the Electoral Process Since 1999',su:'Evaluate the development of Nigeria\'s electoral process across the Fourth Republic.',steps:[
{lb:'Early elections: 1999, 2003, 2007',dr:dQ2,ht:'<p>The elections of <b>1999, 2003 and 2007</b> were widely criticised for significant irregularities, with the <b>2007 election</b> particularly notorious &mdash; even winner Yar\'Adua publicly acknowledged its flaws, prompting subsequent reform efforts.</p>'},
{lb:'Electoral reforms and INEC',dr:dQ2,ht:'<p>Reforms followed, including strengthening the <b>Independent National Electoral Commission (INEC)</b> under chairmen such as <b>Attahiru Jega</b> (2010-2015), introducing measures like the <b>biometric voter card (PVC)</b> and <b>Smart Card Readers</b> to reduce fraud, seen as improving the credibility of the <b>2011 and 2015 elections</b>.</p>'},
{lb:'The 2015 election as a turning point',dr:dQ2,ht:'<p>The <b>2015 election</b>, in which Jonathan lost and conceded to Buhari, is widely regarded as a turning point demonstrating that Nigeria\'s electoral system could produce a <b>genuine change of ruling party</b> through the ballot box rather than force.</p>'},
{lb:'Continued challenges',dr:dQ2,ht:'<p>Despite improvements, more recent elections (2019, 2023) have continued to face criticism over <b>logistical failures, technology glitches (e.g. BVAS result transmission issues in 2023), vote-buying, and localised violence</b>, showing that electoral consolidation in Nigeria remains an ongoing, incomplete process.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which early Fourth Republic elections were widely criticised for significant irregularities?","o":["1999, 2003 and 2007","2011, 2015 and 2019","1979 and 1983 only","1960 and 1963 only"],"a":0,"w":"The 1999, 2003 and 2007 elections were widely criticised for significant irregularities."},{"q":"Who publicly acknowledged flaws in the 2007 election that had made him President?","o":["Olusegun Obasanjo","Umaru Yar'Adua","Goodluck Jonathan","Muhammadu Buhari"],"a":1,"w":"Umaru Yar'Adua publicly acknowledged flaws in the 2007 election that had made him President."},{"q":"Who chaired INEC from 2010-2015, overseeing significant electoral reforms?","o":["Goodluck Jonathan","Muhammadu Buhari","Attahiru Jega","Olusegun Obasanjo"],"a":2,"w":"Attahiru Jega chaired INEC from 2010-2015, overseeing significant electoral reforms."},{"q":"What biometric technology was introduced to reduce electoral fraud?","o":["A purely online voting system","A national ID card unrelated to voting","Only paper ballots with no verification","The biometric voter card (PVC) and Smart Card Readers"],"a":3,"w":"The biometric voter card (PVC) and Smart Card Readers were introduced to reduce electoral fraud."},{"q":"Which election is widely regarded as a turning point showing a genuine change of ruling party was possible?","o":["The 2015 election","The 1999 election","The 1993 election","The 1979 election"],"a":0,"w":"The 2015 election is widely regarded as a turning point showing a genuine change of ruling party was possible."},{"q":"What technology issue affected the 2023 election's credibility?","o":["A complete absence of any voting technology","BVAS result transmission issues","A ban on all electronic devices","An overseas voting scandal"],"a":1,"w":"BVAS result transmission issues affected the credibility of the 2023 election."},{"q":"Besides technology issues, what other problems have continued to affect Nigerian elections?","o":["A total lack of any elections since 1999","A complete absence of political parties","Logistical failures, vote-buying and localised violence","Elections being held only in one state"],"a":2,"w":"Logistical failures, vote-buying and localised violence have continued to affect Nigerian elections."},{"q":"What overall conclusion does this lesson draw about Nigeria's electoral consolidation?","o":["It ended entirely after the 2015 election","It was fully completed and perfected by 2007","It has not improved at all since 1999","It remains an ongoing, incomplete process despite improvements"],"a":3,"w":"The lesson concludes that electoral consolidation in Nigeria remains an ongoing, incomplete process despite improvements."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov • POL',ti:'Insecurity Challenges Since 1999',su:'Explain the major security challenges Nigeria has faced during the Fourth Republic.',steps:[
{lb:'The Niger Delta militancy',dr:dQ1,ht:'<p>From the early 2000s, militant groups such as <b>MEND (Movement for the Emancipation of the Niger Delta)</b> attacked oil infrastructure and kidnapped oil workers, protesting environmental damage and the region\'s poverty despite its oil wealth, until the <b>2009 amnesty programme</b> significantly reduced violence.</p>'},
{lb:'The rise of Boko Haram',dr:dQ1,ht:'<p><b>Boko Haram</b>, founded around 2002 and turning violent from 2009, launched an escalating insurgency across the Northeast, seizing significant territory at its peak (2014-15) before a coordinated military response, backed by the regional <b>Multinational Joint Task Force</b>, reclaimed most territory, though attacks continue.</p>'},
{lb:'Farmer-herder conflicts and banditry',dr:dQ1,ht:'<p>Competition over land and resources, worsened by <b>climate change and desertification</b> pushing herders southward, has fuelled deadly <b>farmer-herder conflicts</b> across the Middle Belt, alongside a distinct wave of <b>armed banditry and kidnapping-for-ransom</b> across the North-West.</p>'},
{lb:'The Indigenous People of Biafra (IPOB)',dr:dQ1,ht:'<p>The <b>Indigenous People of Biafra (IPOB)</b>, a secessionist movement in the South-East demanding an independent Biafran state, was formally proscribed as a <b>terrorist organisation</b> by the Nigerian government in 2017, and its associated "sit-at-home" orders have periodically disrupted economic life in the region.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which militant group attacked oil infrastructure in the Niger Delta from the early 2000s?","o":["MEND (Movement for the Emancipation of the Niger Delta)","Boko Haram","IPOB","ISWAP"],"a":0,"w":"MEND attacked oil infrastructure in the Niger Delta from the early 2000s."},{"q":"What programme significantly reduced Niger Delta militant violence from 2009?","o":["The Sharia law adoption","The Niger Delta amnesty programme","The banking consolidation programme","The Doctrine of Necessity"],"a":1,"w":"The 2009 Niger Delta amnesty programme significantly reduced militant violence in the region."},{"q":"Around which year did Boko Haram turn violent, escalating its insurgency?","o":["1999","2002","2009","2015"],"a":2,"w":"Boko Haram turned violent around 2009, escalating its insurgency."},{"q":"Which multinational force helped reclaim territory from Boko Haram after its 2014-15 peak?","o":["The African Union Standby Force alone","ECOMOG","NATO","The Multinational Joint Task Force"],"a":3,"w":"The Multinational Joint Task Force helped reclaim territory from Boko Haram after its 2014-15 peak."},{"q":"What environmental factor has contributed to farmer-herder conflicts in the Middle Belt?","o":["Climate change and desertification pushing herders southward","Excessive rainfall in the South only","A sudden population decline","Volcanic activity"],"a":0,"w":"Climate change and desertification pushing herders southward have contributed to farmer-herder conflicts."},{"q":"What distinct security problem has affected the North-West region in recent years?","o":["A separate civil war","Armed banditry and kidnapping-for-ransom","A currency crisis only","A religious reformation"],"a":1,"w":"Armed banditry and kidnapping-for-ransom have affected the North-West region in recent years."},{"q":"What does IPOB stand for?","o":["The Islamic People of Borno","The International Party of Benin","The Indigenous People of Biafra","The Independent Police Oversight Board"],"a":2,"w":"IPOB stands for the Indigenous People of Biafra, a secessionist movement in the South-East."},{"q":"In what year was IPOB formally proscribed as a terrorist organisation by the Nigerian government?","o":["2023","1999","2009","2017"],"a":3,"w":"IPOB was formally proscribed as a terrorist organisation by the Nigerian government in 2017."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov • POL',ti:'Economic Developments Since 1999',su:'Explain key economic policies and challenges of Nigeria\'s Fourth Republic.',steps:[
{lb:'Early reforms and debt relief',dr:dQ2,ht:'<p>Obasanjo\'s government pursued <b>banking consolidation (2004-05)</b> and secured the <b>2005 Paris Club debt relief deal</b>, writing off much of Nigeria\'s external debt burden and improving the country\'s international credit standing.</p>'},
{lb:'Oil dependency and price shocks',dr:dQ2,ht:'<p>Nigeria\'s economy has remained heavily dependent on <b>oil revenue</b>, making it vulnerable to global oil price swings &mdash; contributing directly to recessions in <b>2016</b> (oil price collapse) and <b>2020</b> (COVID-19 pandemic and oil price crash).</p>'},
{lb:'Rebasing the economy and "Africa\'s largest economy"',dr:dQ2,ht:'<p>In 2014, Nigeria <b>rebased its GDP calculation</b> methodology (updating the base year for the first time since 1990), resulting in Nigeria overtaking South Africa to become officially <b>"Africa\'s largest economy"</b> by GDP &mdash; though this reflected a statistical recalculation as much as new growth.</p>'},
{lb:'Recent economic reforms and hardship',dr:dQ2,ht:'<p>Since 2023, President Tinubu\'s government has pursued major reforms including <b>removing the long-standing petrol subsidy</b> and <b>floating the naira</b> (allowing its exchange rate to be market-determined), causing significant short-term inflation and hardship for many Nigerians, while aiming for longer-term fiscal sustainability.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What major debt agreement did Obasanjo's government secure in 2005?","o":["The Paris Club debt relief deal","A new UN Security Council seat","A currency union with Ghana","A trade deal with China"],"a":0,"w":"Obasanjo's government secured the Paris Club debt relief deal in 2005."},{"q":"What has Nigeria's continued heavy dependence on oil revenue made its economy vulnerable to?","o":["Only domestic weather changes","Global oil price swings","Only changes in Nigerian population","Only changes in Nigerian language policy"],"a":1,"w":"Nigeria's dependence on oil revenue has made its economy vulnerable to global oil price swings."},{"q":"What triggered Nigeria's 2016 recession?","o":["A civil war","The COVID-19 pandemic","An oil price collapse","A currency union failure"],"a":2,"w":"An oil price collapse triggered Nigeria's 2016 recession."},{"q":"What triggered Nigeria's 2020 recession?","o":["A currency redesign only","A civil war","A military coup","The COVID-19 pandemic and an oil price crash"],"a":3,"w":"The COVID-19 pandemic and an accompanying oil price crash triggered Nigeria's 2020 recession."},{"q":"In what year did Nigeria rebase its GDP calculation, resulting in it becoming \"Africa's largest economy\"?","o":["2014","1999","2005","2023"],"a":0,"w":"Nigeria rebased its GDP calculation in 2014, resulting in it becoming officially \"Africa's largest economy.\""},{"q":"Which country did Nigeria officially overtake in GDP terms after the 2014 rebasing?","o":["Ghana","South Africa","Egypt","Kenya"],"a":1,"w":"Nigeria officially overtook South Africa in GDP terms after the 2014 rebasing."},{"q":"What major subsidy did President Tinubu's government remove from 2023?","o":["The education subsidy","The electricity subsidy only","The petrol subsidy","The healthcare subsidy"],"a":2,"w":"President Tinubu's government removed the long-standing petrol subsidy from 2023."},{"q":"What currency policy did Tinubu's government also pursue from 2023, alongside subsidy removal?","o":["Abolishing the naira entirely","Fixing the naira permanently to the US dollar","Adopting the CFA franc","Floating the naira (market-determined exchange rate)"],"a":3,"w":"Tinubu's government floated the naira, allowing a market-determined exchange rate, alongside subsidy removal."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov • POL',ti:'Constitutional and Federal Debates Since 1999',su:'Explain ongoing debates about restructuring, resource control and federalism.',steps:[
{lb:'Calls for "restructuring"',dr:dQ1,ht:'<p>Since 1999, there have been persistent calls, particularly from Southern and Middle Belt politicians and civil society groups, for <b>"restructuring"</b> &mdash; devolving more powers and resources from the federal government to the states, reducing the long <b>Exclusive Legislative List</b>.</p>'},
{lb:'Resource control debates',dr:dQ1,ht:'<p>Niger Delta politicians and activists have long demanded greater <b>"resource control"</b> &mdash; a larger share of oil revenue for producing states &mdash; leading to the <b>13% derivation principle</b> being applied to oil-producing states under the 1999 Constitution, though many argue this remains insufficient.</p>'},
{lb:'State creation demands',dr:dQ1,ht:'<p>Despite Nigeria\'s 36 states (fixed since 1996), demands for <b>further state creation</b> continue periodically, though the constitutional amendment threshold (requiring two-thirds majorities in the National Assembly and most State Houses of Assembly) has made new states difficult to create since 1999.</p>'},
{lb:'Constitutional amendments since 1999',dr:dQ1,ht:'<p>The 1999 Constitution has been amended multiple times through the National Assembly\'s process, addressing issues including electoral reforms, local government autonomy, and judicial independence, though comprehensive "restructuring" of the federal system itself has not yet been achieved.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What term describes calls to devolve more power and resources from the federal government to the states?","o":["\"Restructuring\"","\"Federal Character\"","\"Doctrine of Necessity\"","\"Third Term\""],"a":0,"w":"\"Restructuring\" describes calls to devolve more power and resources from the federal government to the states."},{"q":"Which legislative list do restructuring advocates want reduced?","o":["The Concurrent List only","The Exclusive Legislative List","The Residual List","The Federal Character List"],"a":1,"w":"Restructuring advocates want the Exclusive Legislative List reduced, devolving more powers to states."},{"q":"What percentage derivation principle applies to oil-producing states under the 1999 Constitution?","o":["5%","50%","13%","100%"],"a":2,"w":"The 13% derivation principle applies to oil-producing states under the 1999 Constitution."},{"q":"What term describes Niger Delta demands for a larger share of oil revenue?","o":["\"State creation\"","\"Restructuring\" only","\"Federal Character\"","\"Resource control\""],"a":3,"w":"\"Resource control\" describes Niger Delta demands for a larger share of oil revenue."},{"q":"How many states does Nigeria currently have, fixed since 1996?","o":["36","30","19","12"],"a":0,"w":"Nigeria currently has 36 states, fixed since 1996."},{"q":"What has made further state creation difficult since 1999?","o":["A complete legal ban on any new states","The high constitutional amendment threshold required","A lack of any demand for new states","A UN resolution against new states"],"a":1,"w":"The high constitutional amendment threshold (two-thirds majorities required) has made further state creation difficult."},{"q":"What kinds of issues have recent constitutional amendments since 1999 addressed?","o":["Only Nigeria's flag design","Only the national anthem","Electoral reforms, local government autonomy and judicial independence","Only Nigeria's national animal"],"a":2,"w":"Recent constitutional amendments have addressed electoral reforms, local government autonomy and judicial independence."},{"q":"What comprehensive reform has not yet been achieved despite ongoing debate?","o":["The abolition of all state governments","The adoption of any constitution at all","Nigeria's independence","A comprehensive restructuring of the federal system itself"],"a":3,"w":"A comprehensive restructuring of the federal system itself has not yet been achieved despite ongoing debate."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov • POL',ti:'Political Parties Since 1999',su:'Explain the evolution of Nigeria\'s party system across the Fourth Republic.',steps:[
{lb:'PDP dominance (1999-2015)',dr:dQ1,ht:'<p>The <b>People\'s Democratic Party (PDP)</b> dominated Nigerian politics from 1999, winning every presidential election from 1999 through 2011, and controlling the presidency continuously for 16 years &mdash; the longest single-party dominance of Nigeria\'s Fourth Republic.</p>'},
{lb:'The formation of the APC (2013)',dr:dQ1,ht:'<p>In February 2013, several major opposition parties &mdash; including the <b>ACN, ANPP, CPC and a faction of the APGA</b> &mdash; merged to form the <b>All Progressives Congress (APC)</b>, creating, for the first time, a single opposition party large enough to seriously challenge PDP dominance nationwide.</p>'},
{lb:'The 2015 breakthrough',dr:dQ1,ht:'<p>The APC\'s <b>2015 election victory</b>, with Muhammadu Buhari defeating incumbent Goodluck Jonathan, demonstrated that Nigeria\'s party system could produce genuine competitive alternation, ending the PDP\'s 16-year hold on the presidency.</p>'},
{lb:'A more fluid multi-party landscape',dr:dQ1,ht:'<p>Since 2015, Nigeria\'s party system has remained a mix of <b>PDP-APC dominance</b> alongside numerous smaller parties (such as the Labour Party, which gained significant support in the 2023 election), reflecting a gradually more <b>fluid, competitive</b> multi-party landscape than the earlier PDP-dominant years.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which party dominated Nigerian politics from 1999 to 2015?","o":["The People's Democratic Party (PDP)","The All Progressives Congress (APC)","The Action Group (AG)","The NPC"],"a":0,"w":"The People's Democratic Party (PDP) dominated Nigerian politics from 1999 to 2015."},{"q":"For how many years did the PDP continuously control the presidency?","o":["8 years","16 years","24 years","4 years"],"a":1,"w":"The PDP continuously controlled the presidency for 16 years, from 1999 to 2015."},{"q":"In which year did major opposition parties merge to form the APC?","o":["2015","1999","2013","2023"],"a":2,"w":"Major opposition parties merged to form the APC in February 2013."},{"q":"Which of these parties merged to help form the APC in 2013?","o":["The AG and NCNC","The PDP and NCNC","The NPC and NNDP","The ACN, ANPP and CPC"],"a":3,"w":"The ACN, ANPP, CPC and a faction of the APGA merged to form the APC in 2013."},{"q":"What did the APC's formation create for the first time in the Fourth Republic?","o":["A single opposition party large enough to seriously challenge PDP dominance","A one-party state","A return to military rule","An immediate ban on the PDP"],"a":0,"w":"The APC's formation created, for the first time, a single opposition party large enough to seriously challenge PDP dominance."},{"q":"What did the APC's 2015 election victory demonstrate about Nigeria's party system?","o":["That only one party could ever win","That it could produce genuine competitive alternation of power","That elections were no longer held","That the military controlled all elections"],"a":1,"w":"The APC's 2015 victory demonstrated that Nigeria's party system could produce genuine competitive alternation of power."},{"q":"Which smaller party gained significant support in the 2023 election, reflecting a more fluid party landscape?","o":["The APC","The PDP","The Labour Party","The NPC"],"a":2,"w":"The Labour Party gained significant support in the 2023 election, reflecting a more fluid party landscape."},{"q":"What overall trend does Nigeria's party system show since 2015, according to this lesson?","o":["No change at all since 1999","A return to strict one-party dominance","The complete abolition of political parties","A gradually more fluid, competitive multi-party landscape"],"a":3,"w":"Nigeria's party system shows a gradually more fluid, competitive multi-party landscape since 2015."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov • POL',ti:'WAEC Exam Preparation — Nigeria Since 1999',su:'Practise WAEC-style questions on Nigeria\'s Fourth Republic.',steps:[
{lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC essays on Nigeria since 1999: (1) Identify the <b>specific president, period or issue</b> asked about. (2) Give <b>precise dates and named events</b>. (3) Describe policies and their effects with cause and effect. (4) Evaluate <b>achievements and continuing challenges</b>.</p>'},
{lb:'Common WAEC question patterns',dr:dQ2,ht:'<p>Common patterns include: "Discuss the achievements and challenges of Nigeria\'s Fourth Republic." / "Account for the growth of insecurity in Nigeria since 1999." / "Examine the development of Nigeria\'s electoral process since 1999." / "Discuss the case for restructuring Nigeria\'s federal system."</p>'},
{lb:'Key vocabulary for essays',dr:dQ2,ht:'<p>Key vocabulary: <b>Fourth Republic</b>, <b>Doctrine of Necessity</b>, <b>restructuring</b>, <b>resource control</b>, <b>derivation principle</b>, <b>INEC</b>, <b>PVC/BVAS</b>, <b>subsidy removal</b>, <b>insurgency</b>. Precise, correctly-spelled terms strengthen WAEC answers.</p>'},
{lb:'A presidential timeline approach',dr:dQ2,ht:'<p>Building a clear timeline of presidents &mdash; <b>Obasanjo (1999-2007) → Yar\'Adua (2007-2010) → Jonathan (2010-2015) → Buhari (2015-2023) → Tinubu (2023-)</b> &mdash; with one or two key facts per administration, is essential preparation for this WAEC topic.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on Nigeria since 1999?","o":["Identify the specific president, period or issue asked about","Immediately give a personal opinion with no facts","List unrelated dates with no explanation","Skip straight to a conclusion"],"a":0,"w":"A strong essay should begin by identifying the specific president, period or issue being asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Account for the growth of insecurity in Nigeria since 1999.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"Account for the growth of insecurity in Nigeria since 1999\" is a typical WAEC-style question on this topic."},{"q":"What constitutional principle resolved the crisis over Yar'Adua's prolonged absence, a key vocabulary term?","o":["Judicial Review","The Federal Character Principle","The Doctrine of Necessity","Resource Control"],"a":2,"w":"The Doctrine of Necessity is a key vocabulary term relevant to Yar'Adua's prolonged absence crisis."},{"q":"What derivation percentage should students know applies to oil-producing states?","o":["100%","5%","50%","13%"],"a":3,"w":"Students should know the 13% derivation principle applies to oil-producing states."},{"q":"Who was Nigeria's President immediately before Muhammadu Buhari (2015-2023)?","o":["Goodluck Jonathan","Umaru Yar'Adua","Olusegun Obasanjo","Bola Tinubu"],"a":0,"w":"Goodluck Jonathan was Nigeria's President immediately before Muhammadu Buhari."},{"q":"Who became President in 2023, continuing the presidential timeline?","o":["Muhammadu Buhari","Bola Ahmed Tinubu","Goodluck Jonathan","Atiku Abubakar"],"a":1,"w":"Bola Ahmed Tinubu became President in 2023, continuing the presidential timeline."},{"q":"Why is a presidential timeline considered essential preparation for this WAEC topic?","o":["It is discouraged by WAEC examiners","It replaces the need to know any specific facts","It helps confidently sequence each administration's key facts and dates","It only applies to questions about the 1999 Constitution"],"a":2,"w":"A presidential timeline helps students confidently sequence each administration's key facts and dates."},{"q":"What should a WAEC essay on this topic evaluate, according to the recommended structure?","o":["Nothing beyond simple dates","Only positive facts with no criticism","Only negative facts with no achievements","Achievements and continuing challenges"],"a":3,"w":"A WAEC essay on this topic should evaluate both achievements and continuing challenges."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov • POL',ti:'Mixed Questions — Nigeria Since 1999',su:'Integrated revision across Nigeria\'s Fourth Republic, 1999 to the present.',steps:[
{lb:'Summary of the presidential timeline',dr:dQ1,ht:'<p>Nigeria\'s Fourth Republic has been led by <b>Obasanjo (1999-2007)</b>, <b>Yar\'Adua (2007-2010)</b>, <b>Jonathan (2010-2015)</b>, <b>Buhari (2015-2023)</b>, and <b>Tinubu (2023-present)</b>, spanning debt relief, insurgency, economic reform, and the landmark 2015 transfer of power.</p>'},
{lb:'Key dates and events to remember',dr:dQ1,ht:'<p>Must-know facts: <b>29 May 1999</b> (Fourth Republic begins); <b>2005</b> (Paris Club debt deal); <b>2009</b> (Niger Delta amnesty; Boko Haram turns violent); <b>2014</b> (Chibok kidnapping; GDP rebasing); <b>2015</b> (first opposition election win); <b>2020</b> (#EndSARS protests); <b>2023</b> (Tinubu elected; subsidy removed).</p>'},
{lb:'Lessons for Nigeria today',dr:dQ1,ht:'<p>Nigeria\'s Fourth Republic demonstrates both real democratic progress &mdash; peaceful transfers of power, electoral reform &mdash; and continuing challenges: insecurity, economic vulnerability to oil prices, and unresolved federalism debates that remain central to Nigerian politics today.</p>'},
{lb:'Final exam tips',dr:dQ1,ht:'<p>Always link specific presidents to their <b>key policies and events</b> with precise dates, distinguish between <b>political and economic</b> developments, and conclude by weighing the Fourth Republic\'s real achievements against its continuing, unresolved challenges.</p>'},
