function shuffleMC(o){
  if(!o||!o.options)return o;
  var idxs=[];for(var k=0;k<o.options.length;k++){idxs.push(k);}
  for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=idxs[i];idxs[i]=idxs[j];idxs[j]=tmp;}
  var newOptions=[];for(var m=0;m<idxs.length;m++){newOptions.push(o.options[idxs[m]]);}
  var newCorrect=idxs.indexOf(o.correct);
  var o2={};for(var key in o){if(o.hasOwnProperty(key))o2[key]=o[key];}
  o2.options=newOptions;o2.correct=newCorrect;
  return o2;
}
function tryItMC(genFn){var wrapped=function(){return shuffleMC(genFn());};var id='t'+Math.random().toString(36).slice(2);var o=wrapped();ST[id]={o:o,genFn:wrapped,mc:true};return buildTryMC(id,o);}

{ey:'Q4 \u2022 Gov • International Relations',ti:'Diplomatic Immunity and Privileges',su:'Explain diplomatic immunity under the Vienna Convention and its purpose.',steps:[
{lb:'The Vienna Convention on Diplomatic Relations (1961)',dr:dQ2,ht:'<p>The <b>Vienna Convention on Diplomatic Relations (1961)</b> codified longstanding customary international law on diplomatic immunity and privileges, and remains the primary legal framework governing diplomatic relations between states worldwide today.</p>'},
{lb:'What diplomatic immunity means',dr:dQ2,ht:'<p><b>Diplomatic immunity</b> generally protects accredited diplomats from arrest, prosecution and lawsuits in the host country, and grants diplomatic premises (embassies) special protection, on the principle that diplomats must be free to perform their duties without fear of pressure or coercion from the host government.</p>'},
{lb:'Justification: reciprocity and function',dr:dQ2,ht:'<p>Immunity is justified partly by <b>reciprocity</b> (each state benefits from its own diplomats receiving equivalent protection abroad) and partly by <b>functional necessity</b> &mdash; diplomats could not effectively represent their country\'s interests if constantly vulnerable to arrest or harassment by the host state.</p>'},
{lb:'Controversies and limits',dr:dQ2,ht:'<p>Diplomatic immunity is sometimes controversial when diplomats commit serious crimes (e.g. traffic offences, or in rare cases more serious crimes) yet escape prosecution; the usual remedy is that the <b>home country can waive immunity</b> or recall the diplomat, though this is not guaranteed, generating periodic diplomatic disputes.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which 1961 convention codified diplomatic immunity and privileges?","o":["The Geneva Convention","The Montevideo Convention","The Vienna Convention on Diplomatic Relations","The UN Charter"],"a":2,"w":"The Vienna Convention on Diplomatic Relations (1961) codified diplomatic immunity and privileges."},{"q":"What does diplomatic immunity generally protect accredited diplomats from?","o":["Only traffic fines specifically","Nothing at all — it is a purely symbolic concept","Arrest, prosecution and lawsuits in the host country","Only tax obligations in their own country"],"a":2,"w":"Diplomatic immunity generally protects accredited diplomats from arrest, prosecution and lawsuits in the host country."},{"q":"What special protection does diplomatic immunity give to embassy premises?","o":["Protection only during wartime","Special legal protection from host-country interference","No protection at all","Protection only for one year after opening"],"a":1,"w":"Diplomatic immunity gives embassy premises special legal protection from host-country interference."},{"q":"What principle underlies diplomatic immunity, related to states benefiting equally?","o":["Federalism","Reciprocity","Unilateralism","Colonialism"],"a":1,"w":"Reciprocity — each state benefiting from equivalent protection for its own diplomats abroad — underlies diplomatic immunity."},{"q":"What functional justification is also given for diplomatic immunity?","o":["Immunity exists only for economic reasons","Diplomats could not effectively represent their country if vulnerable to host-state harassment","Diplomats are legally superior human beings","Immunity has no real justification at all"],"a":1,"w":"Functional necessity — that diplomats could not effectively perform their duties if vulnerable to harassment — justifies immunity."},{"q":"What controversy can arise from diplomatic immunity?","o":["Diplomats committing serious crimes yet escaping prosecution","Diplomats losing their citizenship automatically","Diplomats being unable to travel at all","Diplomats being taxed twice by two countries"],"a":0,"w":"A key controversy is diplomats committing serious crimes yet escaping prosecution due to immunity."},{"q":"What can a diplomat's home country do to address such controversies?","o":["Nothing at all — the situation cannot be addressed","Automatically transfer the case to the UN Security Council","Waive immunity or recall the diplomat","Immediately declare war on the host country"],"a":2,"w":"A diplomat's home country can waive immunity or recall the diplomat to address such controversies."},{"q":"Why does the Vienna Convention remain significant today?","o":["It has been completely replaced by newer treaties","It remains the primary legal framework governing diplomatic relations worldwide","It has never been ratified by any African state","It only applies to European countries"],"a":1,"w":"The Vienna Convention remains the primary legal framework governing diplomatic relations between states worldwide today."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov • International Relations',ti:'The Functions of Diplomacy',su:'Explain the key functions diplomacy performs for states.',steps:[
{lb:'Representation',dr:dQ1,ht:'<p>Diplomacy\'s most basic function is <b>representation</b> &mdash; a diplomat officially represents their state\'s government, communicating its official positions and maintaining formal relations with the host country.</p>'},
{lb:'Negotiation',dr:dQ1,ht:'<p><b>Negotiation</b> is a central diplomatic function: diplomats negotiate treaties, trade agreements, and settlements of disputes, seeking outcomes that serve their state\'s interests while maintaining workable relationships for the future.</p>'},
{lb:'Information gathering (reporting)',dr:dQ1,ht:'<p>Diplomats perform an essential <b>information-gathering (reporting)</b> function &mdash; observing and analysing political, economic and social developments in the host country, and reporting these back to inform their home government\'s policy decisions.</p>'},
{lb:'Protection of citizens and promotion of interests',dr:dQ1,ht:'<p>Diplomatic missions also perform <b>consular protection</b> of citizens abroad (especially during crises), and actively <b>promote their country\'s trade, investment, and cultural interests</b> in the host country, functions increasingly emphasised in modern "economic diplomacy."</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is diplomacy's most basic function?","o":["Only tax collection","Representation of a state's government and positions","Only military coordination","Only tourism promotion"],"a":1,"w":"Representation of a state's government and positions is diplomacy's most basic function."},{"q":"What central diplomatic function involves treaties, trade agreements and dispute settlements?","o":["Only consular protection","Negotiation","Only representation, with no negotiation involved","Only information gathering"],"a":1,"w":"Negotiation, involving treaties, trade agreements and dispute settlements, is a central diplomatic function."},{"q":"What is the \"reporting\" function of diplomacy?","o":["Reporting weather conditions only","Filing tax returns for diplomats","Reporting crimes to the host country's police only","Observing and analysing developments in the host country and reporting back home"],"a":3,"w":"The reporting function involves observing and analysing host-country developments and reporting back to the home government."},{"q":"What does the reporting function help inform?","o":["The home government's policy decisions","Only the diplomat's personal finances","Only sports events","Only tourist recommendations"],"a":0,"w":"The reporting function helps inform the home government's policy decisions."},{"q":"What consular function does a diplomatic mission perform for its own citizens abroad?","o":["Only issuing local driving licences","Only selling local souvenirs","Protection of citizens, especially during crises","Only providing local weather forecasts"],"a":2,"w":"A diplomatic mission provides protection of citizens abroad, especially during crises."},{"q":"What modern term describes diplomacy's active promotion of trade and investment interests?","o":["\"Religious diplomacy\" only","\"Colonial diplomacy\"","\"Economic diplomacy\"","\"Military diplomacy\" only"],"a":2,"w":"\"Economic diplomacy\" describes diplomacy's active promotion of trade and investment interests."},{"q":"Which of these best illustrates the negotiation function of diplomacy?","o":["A diplomat negotiating a bilateral trade agreement","A diplomat attending a purely social event with no agenda","A diplomat filing routine paperwork with no external contact","A diplomat on holiday"],"a":0,"w":"A diplomat negotiating a bilateral trade agreement clearly illustrates the negotiation function of diplomacy."},{"q":"Why are all these diplomatic functions considered important together?","o":["They have no connection to a state's national interest","They apply only to very large, powerful states","Only one function matters; the others are irrelevant","They collectively allow a state to pursue its interests peacefully and effectively abroad"],"a":3,"w":"Together, these functions allow a state to pursue its interests peacefully and effectively abroad."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov • International Relations',ti:'Nigeria\'s Diplomatic History and Practice',su:'Trace Nigeria\'s diplomatic engagement since independence.',steps:[
{lb:'Early diplomatic priorities',dr:dQ2,ht:'<p>Since independence in 1960, Nigeria established diplomatic missions across Africa and beyond, with an early emphasis on <b>anti-colonial solidarity</b> and support for liberation movements still fighting colonial rule elsewhere on the continent, especially in Southern Africa.</p>'},
{lb:'Anti-apartheid diplomacy',dr:dQ2,ht:'<p>Nigeria was among the most vocal African states in the international campaign against <b>apartheid South Africa</b> during the 1970s-80s, using diplomatic pressure, funding for the African National Congress, and leadership within the <b>OAU/Commonwealth</b> to isolate the apartheid regime.</p>'},
{lb:'Mediation and peacekeeping diplomacy',dr:dQ2,ht:'<p>Nigerian diplomats have played leading roles in mediating regional conflicts, notably during the <b>Liberian and Sierra Leonean civil wars</b> (1990s-2000s) and, more recently, in responding diplomatically to the wave of Sahel coups (2020-2023).</p>'},
{lb:'Contemporary diplomatic challenges',dr:dQ2,ht:'<p>Nigeria\'s contemporary diplomacy must balance historic Africa-centred priorities with managing relations with major global powers (the <b>USA, China, EU, UK</b>), securing foreign investment, and addressing the diplomatic dimensions of counter-terrorism cooperation against Boko Haram/ISWAP.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What early diplomatic priority did Nigeria emphasise following its 1960 independence?","o":["Anti-colonial solidarity and support for African liberation movements","Alliance with apartheid South Africa","Complete isolation from all African affairs","Rejoining the British Empire"],"a":0,"w":"Nigeria emphasised anti-colonial solidarity and support for African liberation movements following independence."},{"q":"Against which regime was Nigeria among the most vocal African diplomatic critics during the 1970s-80s?","o":["The United States","The Soviet Union","Ghana","Apartheid South Africa"],"a":3,"w":"Nigeria was among the most vocal African diplomatic critics of apartheid South Africa during the 1970s-80s."},{"q":"Which liberation movement did Nigeria provide funding to during the anti-apartheid campaign?","o":["MEND","Boko Haram","IPOB","The African National Congress (ANC)"],"a":3,"w":"Nigeria provided funding to the African National Congress (ANC) during the anti-apartheid campaign."},{"q":"Which regional/international bodies did Nigeria use to help isolate the apartheid regime?","o":["The OAU and Commonwealth","NATO and the EU","The World Bank and IMF only","The International Court of Justice alone"],"a":0,"w":"Nigeria used the OAU and Commonwealth to help isolate the apartheid regime diplomatically."},{"q":"In which conflicts did Nigerian diplomats play leading mediation roles during the 1990s-2000s?","o":["The Nigerian Civil War itself","The Liberian and Sierra Leonean civil wars","The Cold War","World War II"],"a":1,"w":"Nigerian diplomats played leading mediation roles during the Liberian and Sierra Leonean civil wars."},{"q":"Which recent regional crisis has Nigeria responded to diplomatically since 2020?","o":["A civil war in Ghana","The wave of Sahel coups","A conflict in Southern Africa","A war between Senegal and Mali"],"a":1,"w":"Nigeria has responded diplomatically to the wave of Sahel coups since 2020."},{"q":"Which major global powers does Nigeria's contemporary diplomacy need to balance relations with?","o":["Only Ghana and Senegal","Only Sierra Leone and Liberia","The USA, China, EU and UK","Only Mali and Niger"],"a":2,"w":"Nigeria's contemporary diplomacy must balance relations with the USA, China, EU and UK, among others."},{"q":"What security-related diplomatic cooperation does Nigeria pursue with foreign partners today?","o":["Cooperation to leave the United Nations","Cooperation to abolish ECOWAS","Cooperation to restore apartheid","Counter-terrorism cooperation against Boko Haram/ISWAP"],"a":3,"w":"Nigeria pursues counter-terrorism diplomatic cooperation against Boko Haram/ISWAP with foreign partners."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov • International Relations',ti:'Diplomacy Compared with Other Instruments',su:'Compare diplomacy with sanctions and the use of force as instruments of IR.',steps:[
{lb:'Diplomacy vs sanctions',dr:dQ1,ht:'<p>Compared with <b>economic sanctions</b>, diplomacy is generally less immediately costly to both parties and preserves the possibility of continued cooperation, whereas sanctions apply direct economic pressure but can harden a target state\'s resistance rather than encouraging genuine compromise.</p>'},
{lb:'Diplomacy vs the use of force',dr:dQ1,ht:'<p>Compared with <b>military force</b>, diplomacy avoids the immense human, financial, and political costs of war, though critics note that diplomacy alone may prove insufficient against determined aggressors unwilling to negotiate in good faith, as seen in some failed pre-war diplomatic efforts historically.</p>'},
{lb:'Combining instruments: coercive diplomacy',dr:dQ1,ht:'<p>States frequently combine instruments through <b>"coercive diplomacy"</b> &mdash; using the credible threat of sanctions or force to strengthen a diplomatic negotiating position, rather than relying on diplomacy or coercion in complete isolation from each other.</p>'},
{lb:'When diplomacy typically prevails',dr:dQ1,ht:'<p>Diplomacy typically prevails as the primary instrument when both parties have <b>some shared interest</b> in avoiding conflict and preserving a working relationship; it becomes less effective when one party has little interest in compromise or perceives overwhelming advantage from confrontation.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"How does diplomacy generally compare with economic sanctions in terms of cost?","o":["It has no cost implications at all","It is always far more expensive than sanctions","It is generally less immediately costly to both parties","It has identical costs to sanctions in every case"],"a":2,"w":"Diplomacy is generally less immediately costly to both parties than economic sanctions."},{"q":"What risk do economic sanctions sometimes carry, according to this lesson?","o":["They have no effect on any state whatsoever","They always guarantee immediate compromise","They can harden a target state's resistance rather than encourage compromise","They are illegal under all circumstances"],"a":2,"w":"Sanctions can sometimes harden a target state's resistance rather than encourage compromise."},{"q":"What costs does diplomacy avoid, compared with military force?","o":["The immense human, financial and political costs of war","The need for embassies to exist at all","All forms of political disagreement","The need for any government to have a foreign policy"],"a":0,"w":"Diplomacy avoids the immense human, financial and political costs of war, compared with military force."},{"q":"What criticism do critics make of diplomacy alone against determined aggressors?","o":["It may prove insufficient if the aggressor is unwilling to negotiate in good faith","It has no relationship to national interest","It always guarantees peace under every circumstance","It is illegal under international law"],"a":0,"w":"Critics note that diplomacy alone may prove insufficient against aggressors unwilling to negotiate in good faith."},{"q":"What term describes using the credible threat of sanctions or force to strengthen a diplomatic position?","o":["\"Unconditional surrender\"","\"Pure pacifism\"","\"Coercive diplomacy\"","\"Total isolationism\""],"a":2,"w":"\"Coercive diplomacy\" describes using the credible threat of sanctions or force to strengthen a diplomatic position."},{"q":"Why do states often combine diplomacy with other instruments, rather than using either alone?","o":["Because sanctions are always illegal on their own","Because using only one instrument is against international law","To strengthen their negotiating position through credible pressure","Because diplomacy is always illegal on its own"],"a":2,"w":"States combine instruments to strengthen their negotiating position through credible pressure, rather than relying on one alone."},{"q":"When does diplomacy typically prevail as the primary instrument, according to this lesson?","o":["Only when one party has overwhelming military superiority","Never — diplomacy always fails eventually","Only when there is no possible common ground at all","When both parties share some interest in avoiding conflict and preserving relations"],"a":3,"w":"Diplomacy typically prevails when both parties share some interest in avoiding conflict and preserving relations."},{"q":"When does diplomacy tend to become less effective, according to this lesson?","o":["When an international organisation is involved","When both parties are equally powerful","When one party has little interest in compromise or perceives an advantage from confrontation","When diplomats are highly experienced"],"a":2,"w":"Diplomacy becomes less effective when one party has little interest in compromise or sees an advantage in confrontation."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov • International Relations',ti:'Modern Challenges to Diplomacy',su:'Explain how digital communication and summit diplomacy have transformed modern diplomatic practice.',steps:[
{lb:'Summit diplomacy',dr:dQ2,ht:'<p><b>Summit diplomacy</b> &mdash; direct, high-profile meetings between heads of state or government &mdash; has become increasingly common since the mid-20th century, allowing leaders to negotiate personally rather than relying solely on career diplomats, though critics argue it can sometimes bypass careful institutional preparation.</p>'},
{lb:'The rise of digital diplomacy',dr:dQ2,ht:'<p><b>Digital or "Twitter diplomacy"</b> has transformed modern practice, with government leaders and foreign ministries increasingly announcing policy and engaging in public disputes directly via social media &mdash; sometimes bypassing traditional, more measured diplomatic channels entirely.</p>'},
{lb:'Virtual diplomacy during COVID-19',dr:dQ2,ht:'<p>The <b>COVID-19 pandemic (2020-21)</b> accelerated the use of <b>virtual/video-conference diplomacy</b>, with major international meetings (including UN General Assembly sessions) conducted remotely, demonstrating both the resilience and the limits of diplomacy without in-person contact.</p>'},
{lb:'Risks of digital-era diplomacy',dr:dQ2,ht:'<p>Digital-era diplomacy carries risks: <b>misinformation, diplomatic incidents caused by hastily-written public statements</b>, and reduced opportunities for the private, face-to-face trust-building that traditional diplomacy has long relied upon.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is \"summit diplomacy\"?","o":["Direct, high-profile meetings between heads of state or government","A type of economic sanction","A form of military cooperation only","A form of shuttle diplomacy only"],"a":0,"w":"Summit diplomacy refers to direct, high-profile meetings between heads of state or government."},{"q":"What criticism is sometimes made of summit diplomacy?","o":["It has no relationship to national interest","It is banned under the Vienna Convention","It is always more effective than any other form of diplomacy","It can bypass careful institutional preparation"],"a":3,"w":"Critics argue summit diplomacy can sometimes bypass careful institutional preparation."},{"q":"What term describes leaders announcing policy directly via social media?","o":["\"Shuttle diplomacy\" only","\"Consular diplomacy\" only","\"Economic diplomacy\" only","\"Digital\" or \"Twitter diplomacy\""],"a":3,"w":"\"Digital\" or \"Twitter diplomacy\" describes leaders announcing policy directly via social media."},{"q":"What risk does digital diplomacy carry, compared with traditional channels?","o":["It always improves diplomatic outcomes with no risk","It can bypass more measured, traditional diplomatic channels","It has replaced the need for embassies entirely","It is identical in every way to traditional diplomacy"],"a":1,"w":"Digital diplomacy can bypass more measured, traditional diplomatic channels, carrying real risks."},{"q":"What global event in 2020-21 accelerated the use of virtual/video-conference diplomacy?","o":["The COVID-19 pandemic","The Berlin Conference","World War II","The end of the Cold War"],"a":0,"w":"The COVID-19 pandemic (2020-21) accelerated the use of virtual/video-conference diplomacy."},{"q":"Which major international meetings were conducted remotely during the pandemic?","o":["UN General Assembly sessions","Only Nigerian state assembly meetings","Only local town council meetings","No meetings were conducted remotely at all"],"a":0,"w":"UN General Assembly sessions were among the major international meetings conducted remotely during the pandemic."},{"q":"What did the pandemic-era experience of virtual diplomacy demonstrate?","o":["That diplomacy is now entirely unnecessary","That in-person diplomacy will never be needed again","That virtual diplomacy has no limitations whatsoever","Both the resilience and the limits of diplomacy without in-person contact"],"a":3,"w":"The pandemic demonstrated both the resilience and the limits of diplomacy conducted without in-person contact."},{"q":"What traditional element of diplomacy can be reduced by heavy reliance on digital-era methods?","o":["The need for embassies to exist","The need for any negotiation at all","The need for national interest","Private, face-to-face trust-building"],"a":3,"w":"Heavy reliance on digital-era methods can reduce opportunities for private, face-to-face trust-building."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov • International Relations',ti:'WAEC Exam Preparation — Diplomacy',su:'Practise WAEC-style questions on the meaning, types and functions of diplomacy.',steps:[
{lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC essays on diplomacy: (1) Define diplomacy clearly. (2) Identify the <b>relevant type</b> (bilateral, multilateral, shuttle, public) if the question specifies one. (3) Explain <b>functions or personnel</b> as relevant, with precise vocabulary. (4) Give <b>named, dated examples</b>, ideally involving Nigeria.</p>'},
{lb:'Common WAEC question patterns',dr:dQ2,ht:'<p>Common patterns include: "Explain the meaning and types of diplomacy." / "Distinguish between an ambassador and a consul." / "Discuss the importance of diplomatic immunity." / "Examine Nigeria\'s use of diplomacy in regional conflict resolution."</p>'},
{lb:'Key vocabulary for essays',dr:dQ2,ht:'<p>Key vocabulary: <b>bilateral/multilateral diplomacy</b>, <b>shuttle diplomacy</b>, <b>ambassador</b>, <b>High Commissioner</b>, <b>consul</b>, <b>diplomatic immunity</b>, <b>Vienna Convention (1961)</b>, <b>coercive diplomacy</b>. Precise, correctly-spelled terms strengthen WAEC answers.</p>'},
{lb:'Applying to Nigeria\'s own diplomatic practice',dr:dQ2,ht:'<p>Always connect general diplomatic concepts to <b>Nigeria\'s own diplomatic history</b> &mdash; anti-apartheid diplomacy, ECOWAS mediation, or Nigeria\'s extensive network of embassies and High Commissions &mdash; since WAEC consistently rewards this kind of concrete, locally-relevant application.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on diplomacy?","o":["Immediately give a personal opinion with no facts","Skip straight to a conclusion","Define diplomacy clearly","List unrelated dates with no explanation"],"a":2,"w":"A WAEC essay on diplomacy should begin by clearly defining the term."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"List the rivers of Nigeria.\"","\"Distinguish between an ambassador and a consul.\"","\"Describe the layout of Lagos.\"","\"Define photosynthesis.\""],"a":1,"w":"\"Distinguish between an ambassador and a consul\" is a typical WAEC-style question on this topic."},{"q":"Which 1961 convention should be mentioned when discussing diplomatic immunity?","o":["The Vienna Convention on Diplomatic Relations","The Montevideo Convention","The Treaty of Lagos","The Geneva Convention"],"a":0,"w":"The Vienna Convention on Diplomatic Relations (1961) should be mentioned when discussing diplomatic immunity."},{"q":"Which term should be used to describe combining diplomacy with the threat of sanctions or force?","o":["\"Unconditional diplomacy\"","\"Pure pacifism\"","\"Coercive diplomacy\"","\"Total isolationism\""],"a":2,"w":"\"Coercive diplomacy\" is the precise term for combining diplomacy with the credible threat of sanctions or force."},{"q":"Which Nigerian diplomatic history example should be mentioned for strong WAEC answers?","o":["Only ancient Egyptian diplomacy","A diplomatic history unrelated to Nigeria entirely","Only European diplomatic history","Nigeria's anti-apartheid diplomacy in the 1970s-80s"],"a":3,"w":"Nigeria's anti-apartheid diplomacy in the 1970s-80s is a strong, specific example for WAEC answers."},{"q":"Which type of diplomacy should be named if a WAEC question asks about mediators travelling between conflicting parties?","o":["Shuttle diplomacy","Only economic diplomacy","Only bilateral diplomacy","Only public diplomacy"],"a":0,"w":"\"Shuttle diplomacy\" is the precise term for mediators travelling between conflicting parties."},{"q":"Why does WAEC reward connecting diplomatic concepts to Nigeria's own practice?","o":["It replaces the need for any definitions","It demonstrates the ability to apply general concepts to a specific, relevant example","Other countries are irrelevant to the syllabus","Nigeria is the only country ever studied in WAEC Government"],"a":1,"w":"Connecting concepts to Nigeria's own practice demonstrates the ability to apply general concepts to a specific example."},{"q":"What should a WAEC essay do if the question specifies a particular type of diplomacy?","o":["Refuse to answer the question as asked","Ignore the type specified and discuss diplomacy generally","Only discuss unrelated historical events","Identify and focus on that relevant type specifically"],"a":3,"w":"A WAEC essay should identify and focus on the specific type of diplomacy the question asks about."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov • International Relations',ti:'Mixed Questions — Diplomacy',su:'Integrated revision across the meaning, types, personnel and functions of diplomacy.',steps:[
{lb:'Summary of key points',dr:dQ1,ht:'<p>Diplomacy is the primary peaceful instrument of international relations, conducted through <b>embassies/High Commissions</b> led by ambassadors/High Commissioners, protected by <b>diplomatic immunity (Vienna Convention, 1961)</b>, and taking various forms &mdash; bilateral, multilateral, shuttle and public diplomacy.</p>'},
{lb:'Key terms and examples to remember',dr:dQ1,ht:'<p>Must-know facts: <b>Vienna Convention (1961)</b>; <b>Henry Kissinger</b> (shuttle diplomacy); ambassador vs consul distinction; Nigeria\'s <b>anti-apartheid diplomacy</b>; Nigeria\'s role in <b>ECOWAS mediation</b>; <b>coercive diplomacy</b> as combining instruments.</p>'},
{lb:'Lessons for Nigeria',dr:dQ1,ht:'<p>Nigeria\'s extensive diplomatic network and historical mediation record demonstrate how a leading regional power uses diplomacy alongside other instruments (economic, security cooperation) to pursue its Africa-centred foreign policy and national interest.</p>'},
{lb:'Final exam tips',dr:dQ1,ht:'<p>Always distinguish clearly between <b>diplomatic personnel</b> (ambassador vs consul), name the <b>specific type</b> of diplomacy relevant to a question, and use Nigeria\'s own diplomatic history as concrete supporting evidence throughout.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is diplomacy generally considered to be, among instruments of international relations?","o":["The primary peaceful instrument","An instrument used only by weak states","The most costly and violent instrument","An instrument banned under international law"],"a":0,"w":"Diplomacy is generally considered the primary peaceful instrument of international relations."},{"q":"Who heads an embassy?","o":["A Prime Minister only","A Secretary-General","A consul","An ambassador"],"a":3,"w":"An ambassador heads an embassy."},{"q":"Which 1961 convention governs diplomatic immunity?","o":["The Treaty of Lagos","The Geneva Convention","The Vienna Convention","The Montevideo Convention"],"a":2,"w":"The Vienna Convention (1961) governs diplomatic immunity."},{"q":"Which US Secretary of State is associated with shuttle diplomacy?","o":["Henry Kissinger","Woodrow Wilson","Franklin Roosevelt","Colin Powell"],"a":0,"w":"Henry Kissinger is associated with shuttle diplomacy."},{"q":"What does a consul primarily focus on, unlike an ambassador?","o":["Practical services such as visas and citizen assistance","Only military coordination","Only cultural festivals","Only high-level treaty negotiations"],"a":0,"w":"A consul primarily focuses on practical services such as visas and citizen assistance, unlike an ambassador."},{"q":"Which historic Nigerian diplomatic campaign is a key example for this topic?","o":["A campaign against ECOWAS","Anti-apartheid diplomacy in the 1970s-80s","A campaign to join the Soviet Union","A campaign to rejoin British colonial rule"],"a":1,"w":"Nigeria's anti-apartheid diplomacy in the 1970s-80s is a key example for this topic."},{"q":"What term describes combining diplomacy with the credible threat of sanctions or force?","o":["\"Total isolationism\"","\"Unconditional surrender\"","\"Pure diplomacy\"","\"Coercive diplomacy\""],"a":3,"w":"\"Coercive diplomacy\" describes combining diplomacy with the credible threat of sanctions or force."},{"q":"What should a strong WAEC essay on diplomacy always do, according to the final exam tips?","o":["Avoid mentioning Nigeria entirely","Only discuss ancient history","Use Nigeria's own diplomatic history as concrete supporting evidence","Only discuss European diplomacy"],"a":2,"w":"A strong essay should use Nigeria's own diplomatic history as concrete supporting evidence throughout."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
