function shuffleMC(o){
  if(!o||!o.options)return o;
  var idxs=[];for(var k=0;k<o.options.length;k++){idxs.push(k);}
  for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=idxs[i];idxs[i]=idxs[j];idxs[j]=tmp;}
  var newOptions=[];for(var m=0;m<idxs.length;m++){newOptions.push(o.options[idxs[m]]);}
  var newCorrect=idxs.indexOf(o.correct);
  var o2={};for(var key in o){if(o.hasOwnProperty(key))o2[key]=o[key];}
  o2.options=newOptions;o2.correct=newCorrect;
  return o2;
}

  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'

{lb:"Defining conflict resolution",dr:dQ1,ht:"<p><b>Conflict resolution</b> is the process of resolving a dispute so that all sides reach a <b>mutually acceptable, peaceful outcome</b>, rather than one side simply overpowering the other.</p>"},
{lb:"More than just stopping the fighting",dr:dQ1,ht:"<p>True conflict resolution aims to address the <b>underlying causes</b> of a dispute, not merely halt the violence \u2014 a <b>ceasefire alone</b> is not the same as full conflict resolution.</p>"},
{lb:"Different levels of conflict",dr:dQ1,ht:"<p>Conflict resolution can apply between <b>states</b> (e.g. border disputes), <b>within</b> states (e.g. civil wars), or between <b>groups</b> (e.g. ethnic or religious clashes).</p>"},
{lb:"Nigeria's regional role",dr:dQ1,ht:"<p>Nigeria has been particularly <b>active in conflict resolution across West Africa</b>, working through regional bodies such as <b>ECOWAS</b> and the <b>African Union</b>.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q": "What is conflict resolution?", "o": ["Making sure one side completely defeats the other", "Resolving a dispute so all sides reach a mutually acceptable, peaceful outcome", "Ignoring a dispute until it disappears", "A term used only for legal court cases"], "a": 1, "w": "Conflict resolution is resolving a dispute so all sides reach a mutually acceptable, peaceful outcome."}, {"q": "Is a ceasefire alone the same as full conflict resolution?", "o": ["Yes, they are exactly the same thing", "No, resolution also requires addressing underlying causes", "Yes, but only in Africa", "No, because ceasefires are illegal"], "a": 1, "w": "A ceasefire alone is not the same as full conflict resolution, which also requires addressing underlying causes."}, {"q": "Which of these is an example of conflict WITHIN a state?", "o": ["A trade dispute between two countries", "A civil war", "A border disagreement between two states", "A treaty negotiation"], "a": 1, "w": "A civil war is an example of conflict within a state."}, {"q": "Which regional bodies has Nigeria worked through for conflict resolution in West Africa?", "o": ["NATO and the EU", "ECOWAS and the African Union", "The G7 only", "The World Trade Organisation"], "a": 1, "w": "Nigeria has worked through ECOWAS and the African Union for conflict resolution in West Africa."}, {"q": "What does conflict resolution aim to address, beyond just stopping violence?", "o": ["Nothing beyond the violence itself", "The underlying causes of the dispute", "Only the economic cost of the conflict", "Only which side has more weapons"], "a": 1, "w": "Conflict resolution aims to address the underlying causes of the dispute, not just the violence."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q2 &bull; Gov &bull; International Relations",ti:"Methods of Conflict Resolution",su:"Distinguish between negotiation, mediation, arbitration and adjudication.",steps:[
{lb:"Negotiation",dr:dQ2,ht:"<p><b>Negotiation</b> involves the parties in dispute talking <b>directly</b> with each other to reach an agreement, without a third party's involvement.</p>"},
{lb:"Mediation",dr:dQ2,ht:"<p><b>Mediation</b> introduces a <b>neutral third party</b> who helps facilitate discussion and encourages the parties to reach their own agreement, but has no power to impose a decision.</p>"},
{lb:"Arbitration",dr:dQ2,ht:"<p><b>Arbitration</b> also involves a neutral third party, but here that party\u2019s decision is <b>binding</b> on both sides \u2014 they must accept and follow the ruling.</p>"},
{lb:"Adjudication and conciliation",dr:dQ2,ht:"<p><b>Adjudication</b> is resolution through a court, such as the <b>International Court of Justice (ICJ)</b>, delivering a formal legal judgment; <b>conciliation</b> sits between mediation and arbitration \u2014 a third party investigates and suggests terms, but they remain non-binding.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q": "What is negotiation in conflict resolution?", "o": ["A binding decision by a court", "Direct talks between the parties themselves, without a third party", "A UN peacekeeping mission", "A military intervention"], "a": 1, "w": "Negotiation involves direct talks between the disputing parties, without a third party."}, {"q": "In mediation, what power does the neutral third party have?", "o": ["The power to impose a binding decision", "No power to impose a decision \u2014 they only help facilitate discussion", "The power to declare war", "The power to arrest either party"], "a": 1, "w": "In mediation, the third party has no power to impose a decision; they only facilitate discussion."}, {"q": "What makes arbitration different from mediation?", "o": ["Arbitration has no third party at all", "The arbitrator's decision is binding on both sides", "Arbitration is only used for sports disputes", "Arbitration always involves military force"], "a": 1, "w": "In arbitration, unlike mediation, the third party's decision is binding on both sides."}, {"q": "Which international body handles adjudication of disputes between states?", "o": ["The International Court of Justice (ICJ)", "The World Health Organisation", "FIFA", "The African Development Bank"], "a": 0, "w": "The International Court of Justice (ICJ) handles adjudication of disputes between states."}, {"q": "How does conciliation typically differ from arbitration?", "o": ["Conciliation's outcome is binding, arbitration's is not", "Conciliation's suggested terms are non-binding, unlike arbitration's decision", "They are identical in every way", "Conciliation only applies to internal state matters"], "a": 1, "w": "Conciliation's suggested terms are non-binding, unlike a binding arbitration decision."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q3 &bull; Gov &bull; International Relations",ti:"Peacekeeping vs Peace Enforcement",su:"Distinguish between UN peacekeeping and peace enforcement operations.",steps:[
{lb:"Peacekeeping requires consent",dr:dQ3,ht:"<p><b>Peacekeeping</b> operations require the <b>consent of all parties</b> to the conflict. Peacekeepers are lightly armed, remain neutral, and typically monitor ceasefires and protect civilians.</p>"},
{lb:"Peace enforcement does not",dr:dQ3,ht:"<p><b>Peace enforcement</b> operations do <b>not require consent</b> and may use force to compel compliance \u2014 these are authorised under <b>Chapter VII</b> of the UN Charter and involve heavily armed forces.</p>"},
{lb:"A key operational distinction",dr:dQ3,ht:"<p>This distinction matters enormously in practice: peacekeepers acting <b>without consent</b>, or exceeding their mandate, risk becoming a party to the conflict themselves rather than a neutral force.</p>"},
{lb:"ECOMOG blurred the line",dr:dQ3,ht:"<p>Nigeria-led <b>ECOMOG</b> operations in Liberia and Sierra Leone are notable because they combined <b>both roles</b> at different points \u2014 starting as peacekeeping, but shifting into more forceful peace-enforcement action when needed.</p>"},
{lb:"Your turn",dr:dQ3,ht:tryItMC(function(){var qs=[{"q": "What do UN peacekeeping operations require, unlike peace enforcement?", "o": ["Heavy weapons only", "The consent of all parties to the conflict", "No consent whatsoever", "Only military personnel, never civilians"], "a": 1, "w": "UN peacekeeping operations require the consent of all parties to the conflict."}, {"q": "Under which chapter of the UN Charter are peace enforcement operations typically authorised?", "o": ["Chapter I", "Chapter IV", "Chapter VII", "Chapter X"], "a": 2, "w": "Peace enforcement operations are typically authorised under Chapter VII of the UN Charter."}, {"q": "What risk arises if peacekeepers act without consent or exceed their mandate?", "o": ["They automatically win the war", "They risk becoming a party to the conflict themselves", "Nothing changes at all", "They are immediately disbanded"], "a": 1, "w": "Peacekeepers acting without consent or exceeding their mandate risk becoming a party to the conflict."}, {"q": "What made Nigeria-led ECOMOG operations notable regarding this distinction?", "o": ["They were purely peacekeeping and never used force", "They combined both peacekeeping and peace-enforcement roles", "They had no Nigerian involvement at all", "They only operated outside Africa"], "a": 1, "w": "ECOMOG operations were notable for combining both peacekeeping and peace-enforcement roles."}, {"q": "How are peacekeepers typically armed, compared to peace enforcement troops?", "o": ["Peacekeepers are lightly armed; enforcement troops are more heavily armed", "Peacekeepers are always unarmed entirely", "Both are identically armed in every case", "Peacekeepers always carry heavier weapons"], "a": 0, "w": "Peacekeepers are typically lightly armed, while peace enforcement troops are more heavily armed."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q4 &bull; Gov &bull; International Relations",ti:"The United Nations and Peacekeeping",su:"Explain the UN's role in peacekeeping, its guiding principles, and Nigeria's contribution.",steps:[
{lb:"The Security Council's role",dr:dQ4,ht:"<p>The <b>UN Security Council</b> authorises most international peacekeeping missions, deploying troops widely known as <b>\u201cBlue Helmets\u201d</b> from contributing member states.</p>"},
{lb:"Three guiding principles",dr:dQ4,ht:"<p>UN peacekeeping is guided by three core principles: <b>consent</b> of the parties, <b>impartiality</b> between them, and the <b>non-use of force</b> except in self-defence or defence of the mandate.</p>"},
{lb:"Nigeria's contributions",dr:dQ4,ht:"<p>Nigeria has been a significant <b>troop-contributing country</b> to UN missions over the decades, including deployments to the <b>Democratic Republic of Congo</b> and <b>Darfur, Sudan</b>, among others.</p>"},
{lb:"Criticisms of UN peacekeeping",dr:dQ4,ht:"<p>UN missions face persistent criticism for being <b>slow to deploy</b> and often <b>underfunded</b> relative to the scale of the crises they are sent to address.</p>"},
{lb:"Your turn",dr:dQ4,ht:tryItMC(function(){var qs=[{"q": "Which UN body authorises most international peacekeeping missions?", "o": ["The General Assembly alone", "The Security Council", "The International Court of Justice", "UNESCO"], "a": 1, "w": "The UN Security Council authorises most international peacekeeping missions."}, {"q": "What are UN peacekeeping troops commonly known as?", "o": ["Green Berets", "Blue Helmets", "Red Crescents", "White Doves"], "a": 1, "w": "UN peacekeeping troops are commonly known as 'Blue Helmets'."}, {"q": "Which is NOT one of the UN's three core peacekeeping principles?", "o": ["Consent", "Impartiality", "Non-use of force except in self-defence/mandate defence", "Automatic use of maximum force at all times"], "a": 3, "w": "The UN's three principles are consent, impartiality, and non-use of force except in self-defence/mandate defence \u2014 not automatic maximum force."}, {"q": "To which mission has Nigeria contributed troops, alongside Darfur?", "o": ["The Democratic Republic of Congo", "Antarctica", "The Moon", "The North Pole"], "a": 0, "w": "Nigeria has contributed troops to missions including the Democratic Republic of Congo, alongside Darfur, Sudan."}, {"q": "What is a common criticism of UN peacekeeping missions?", "o": ["They are always over-funded", "They can be slow to deploy and underfunded", "They never involve African countries", "They have no guiding principles at all"], "a": 1, "w": "UN peacekeeping missions are commonly criticised for being slow to deploy and underfunded."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q5 &bull; Gov &bull; International Relations",ti:"ECOWAS and ECOMOG",su:"Explain the formation of ECOMOG and its major deployments in West Africa.",steps:[
{lb:"What is ECOMOG?",dr:dQ5,ht:"<p><b>ECOMOG</b> (the ECOWAS Monitoring Group) is a regional peacekeeping force formed by ECOWAS in <b>1990</b>, with Nigeria providing the majority of its troops, funding and leadership.</p>"},
{lb:"Deployment to Liberia",dr:dQ5,ht:"<p>ECOMOG's first major deployment was to <b>Liberia in 1990</b>, intervening in that country's brutal civil war, which had begun the previous year.</p>"},
{lb:"Deployment to Sierra Leone",dr:dQ5,ht:"<p>ECOMOG later deployed to <b>Sierra Leone in 1997</b>, helping to restore the country's democratically elected government after it had been overthrown in a military coup.</p>"},
{lb:"A landmark for African-led peacekeeping",dr:dQ5,ht:"<p>ECOMOG is widely seen as a <b>landmark</b>: it was among the first major peacekeeping forces led primarily by <b>African states themselves</b>, rather than Western powers or the UN directly.</p>"},
{lb:"Your turn",dr:dQ5,ht:tryItMC(function(){var qs=[{"q": "What does ECOMOG stand for?", "o": ["The ECOWAS Monitoring Group", "The European Community Military Organisation Group", "The East Coast Maritime Operations Group", "The Economic Cooperation Military Organisation"], "a": 0, "w": "ECOMOG stands for the ECOWAS Monitoring Group."}, {"q": "In which year was ECOMOG formed?", "o": ["1975", "1990", "2004", "2014"], "a": 1, "w": "ECOMOG was formed in 1990."}, {"q": "Which country provided the majority of ECOMOG's troops, funding and leadership?", "o": ["Ghana", "Nigeria", "Senegal", "South Africa"], "a": 1, "w": "Nigeria provided the majority of ECOMOG's troops, funding and leadership."}, {"q": "To which country did ECOMOG first deploy in 1990?", "o": ["Sierra Leone", "Liberia", "Rwanda", "Sudan"], "a": 1, "w": "ECOMOG's first major deployment, in 1990, was to Liberia."}, {"q": "Why is ECOMOG considered a landmark in African peacekeeping?", "o": ["It was entirely funded by the UN", "It was among the first major peacekeeping forces led primarily by African states", "It never actually deployed anywhere", "It was led entirely by Western powers"], "a": 1, "w": "ECOMOG is a landmark as among the first major peacekeeping forces led primarily by African states."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q6 &bull; Gov &bull; International Relations",ti:"The African Union's Peace & Security Architecture",su:"Identify the key institutions the AU uses to manage peace and security on the continent.",steps:[
{lb:"The Peace and Security Council",dr:dQ6,ht:"<p>The <b>AU Peace and Security Council</b>, established in <b>2004</b>, is the AU's main standing decision-making body for preventing, managing and resolving conflicts across Africa.</p>"},
{lb:"The African Standby Force",dr:dQ6,ht:"<p>The <b>African Standby Force</b> is intended as a rapid-deployment multinational force, made up of regional brigades, ready to respond quickly to emerging crises.</p>"},
{lb:"The Panel of the Wise",dr:dQ6,ht:"<p>The <b>Panel of the Wise</b> consists of senior, respected African figures who provide <b>mediation and preventive diplomacy</b> support to help defuse tensions before they escalate.</p>"},
{lb:"Early warning and non-indifference",dr:dQ6,ht:"<p>The <b>Continental Early Warning System</b> monitors emerging conflict risks, while the AU's principle of <b>\u201cnon-indifference\u201d</b> allows it to intervene in a member state's grave crises, such as war crimes or genocide.</p>"},
{lb:"Your turn",dr:dQ6,ht:tryItMC(function(){var qs=[{"q": "When was the AU Peace and Security Council established?", "o": ["1990", "2004", "2014", "2020"], "a": 1, "w": "The AU Peace and Security Council was established in 2004."}, {"q": "What is the African Standby Force intended to do?", "o": ["Provide only humanitarian food aid", "Rapidly deploy as a multinational force to emerging crises", "Handle only trade disputes", "Replace the United Nations entirely"], "a": 1, "w": "The African Standby Force is intended to rapidly deploy as a multinational force to emerging crises."}, {"q": "What role does the AU's Panel of the Wise play?", "o": ["Military combat operations", "Mediation and preventive diplomacy", "Managing the AU's finances only", "Running elections in member states"], "a": 1, "w": "The Panel of the Wise provides mediation and preventive diplomacy support."}, {"q": "What does the Continental Early Warning System do?", "o": ["Predicts weather patterns only", "Monitors and flags emerging conflict risks", "Manages AU membership applications", "Issues passports"], "a": 1, "w": "The Continental Early Warning System monitors and flags emerging conflict risks."}, {"q": "What does the AU's principle of 'non-indifference' allow?", "o": ["The AU to ignore all internal crises in member states", "The AU to intervene in a member state's grave crises like genocide", "Member states to leave the AU freely at any time", "Nothing \u2014 it has no practical meaning"], "a": 1, "w": "The principle of 'non-indifference' allows the AU to intervene in grave crises within a member state."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q7 &bull; Gov &bull; International Relations",ti:"Causes of Conflict in Africa",su:"Identify the major underlying causes of conflict across the African continent.",steps:[
{lb:"Ethnic and religious rivalry",dr:dQ7,ht:"<p>Many African conflicts stem from <b>ethnic and religious rivalry</b>, often worsened by <b>colonial-era borders</b> that were drawn without regard for existing ethnic or cultural boundaries.</p>"},
{lb:"Competition over resources and governance",dr:dQ7,ht:"<p>Conflict is also frequently driven by competition over <b>resources</b> (land, oil, minerals), and by <b>disputed election results</b> or broader governance failures.</p>"},
{lb:"Poverty and weak institutions",dr:dQ7,ht:"<p><b>Poverty</b> and <b>weak state institutions</b> can make conflict more likely to break out, and significantly harder to resolve once it does, since states may lack the capacity to enforce agreements.</p>"},
{lb:"Nigerian example: Boko Haram",dr:dQ7,ht:"<p>The <b>Boko Haram insurgency</b> in North-East Nigeria illustrates how these causes can combine \u2014 poverty, weak local governance, and religious extremism together fuelling a prolonged and devastating conflict.</p>"},
{lb:"Your turn",dr:dQ7,ht:tryItMC(function(){var qs=[{"q": "What historical factor is cited as worsening ethnic rivalry in Africa?", "o": ["Colonial-era borders drawn without regard for ethnic boundaries", "The complete absence of any historical borders", "Modern social media use", "Recent climate agreements"], "a": 0, "w": "Colonial-era borders, drawn without regard for ethnic boundaries, are cited as worsening ethnic rivalry."}, {"q": "Which of these is cited as a driver of conflict, alongside resource competition?", "o": ["Excess rainfall only", "Disputed election results and governance failures", "Too much international aid", "An oversupply of peacekeepers"], "a": 1, "w": "Disputed election results and governance failures are cited as drivers of conflict, alongside resource competition."}, {"q": "How do poverty and weak state institutions affect conflict?", "o": ["They make conflict impossible", "They make conflict more likely and harder to resolve", "They have no effect on conflict at all", "They only affect wealthy countries"], "a": 1, "w": "Poverty and weak state institutions make conflict more likely and harder to resolve."}, {"q": "Which Nigerian conflict is used as an example combining poverty, weak governance and religious extremism?", "o": ["The Nigerian Civil War (1967-70)", "The Boko Haram insurgency in North-East Nigeria", "The Niger Delta militancy", "The 1993 election annulment crisis"], "a": 1, "w": "The Boko Haram insurgency in North-East Nigeria is used as an example combining these causes."}, {"q": "Which resource type is cited as a common cause of resource-based conflict?", "o": ["Land, oil and minerals", "Only fresh air", "Only internet bandwidth", "Only postage stamps"], "a": 0, "w": "Land, oil and minerals are cited as common causes of resource-based conflict."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q8 &bull; Gov &bull; International Relations",ti:"Case Study: ECOMOG in Liberia and Sierra Leone",su:"Examine ECOMOG's interventions in Liberia and Sierra Leone in more depth.",steps:[
{lb:"Liberia's civil war",dr:dQ8,ht:"<p>Liberia's civil war broke out in <b>1989</b>, prompting ECOWAS to deploy <b>ECOMOG troops in 1990</b> \u2014 the force was made up mostly of <b>Nigerian soldiers</b>.</p>"},
{lb:"ECOMOG's impact in Liberia",dr:dQ8,ht:"<p>ECOMOG helped bring an end to major fighting and supported the organisation of elections, though the conflict continued in <b>phases until 2003</b> before finally ending.</p>"},
{lb:"Deployment to Sierra Leone",dr:dQ8,ht:"<p>A similar ECOMOG force deployed to <b>Sierra Leone in 1997</b>, working to restore the country's <b>elected government</b> after it had been overthrown by a military coup.</p>"},
{lb:"Nigeria's burden and legacy",dr:dQ8,ht:"<p>Nigeria bore the <b>largest share</b> of both troops and financial cost in these missions \u2014 seen by many as a demonstration of regional leadership, but also a significant national burden.</p>"},
{lb:"Your turn",dr:dQ8,ht:tryItMC(function(){var qs=[{"q": "In which year did Liberia's civil war break out, prompting ECOMOG's deployment the following year?", "o": ["1975", "1989", "1999", "2010"], "a": 1, "w": "Liberia's civil war broke out in 1989, and ECOMOG deployed the following year, 1990."}, {"q": "Which country's soldiers made up most of the ECOMOG force?", "o": ["Ghana", "Nigeria", "Senegal", "Ivory Coast"], "a": 1, "w": "Nigerian soldiers made up most of the ECOMOG force."}, {"q": "Until roughly what year did Liberia's conflict continue, in phases?", "o": ["1991", "1997", "2003", "2015"], "a": 2, "w": "Liberia's conflict continued in phases until roughly 2003."}, {"q": "Why did ECOMOG deploy to Sierra Leone in 1997?", "o": ["To help build new roads", "To restore the elected government after a military coup", "To celebrate independence day", "To hold a trade summit"], "a": 1, "w": "ECOMOG deployed to Sierra Leone in 1997 to restore the elected government after a military coup."}, {"q": "What did Nigeria bear the largest share of during these ECOMOG missions?", "o": ["Neither troops nor financial cost", "Both troops and financial cost", "Only financial cost, no troops", "Only troops, no financial cost"], "a": 1, "w": "Nigeria bore the largest share of both troops and financial cost during these ECOMOG missions."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q9 &bull; Gov &bull; International Relations",ti:"Challenges of Peacekeeping",su:"Identify the major challenges facing international and regional peacekeeping efforts.",steps:[
{lb:"Funding shortfalls",dr:dQ9,ht:"<p>Peacekeeping missions frequently face <b>funding shortfalls</b>, leaving them under-resourced relative to the scale of the crises they are deployed to address.</p>"},
{lb:"Slow deployment",dr:dQ9,ht:"<p>Authorisation processes at the <b>UN or AU</b> can take months, meaning peacekeepers often arrive only after violence has already caused significant harm.</p>"},
{lb:"Limited mandates",dr:dQ9,ht:"<p>Peacekeepers operating under a limited <b>consent-based mandate</b> may be unable to act decisively to protect civilians, unless their mandate is upgraded toward peace enforcement.</p>"},
{lb:"Allegations of misconduct",dr:dQ9,ht:"<p>Some peacekeeping missions have faced serious <b>allegations of misconduct</b> by personnel, which have historically damaged trust in peacekeeping operations among local populations.</p>"},
{lb:"Your turn",dr:dQ9,ht:tryItMC(function(){var qs=[{"q": "What is a common financial challenge facing peacekeeping missions?", "o": ["They are always over-funded", "Funding shortfalls, leaving them under-resourced", "They receive too much money to spend effectively", "They have no financial needs at all"], "a": 1, "w": "Peacekeeping missions commonly face funding shortfalls, leaving them under-resourced."}, {"q": "Why can slow deployment be a problem for peacekeeping missions?", "o": ["It never causes any issues", "Peacekeepers may arrive only after significant harm has occurred", "It means missions deploy too quickly", "It only affects missions in Europe"], "a": 1, "w": "Slow deployment can mean peacekeepers arrive only after violence has already caused significant harm."}, {"q": "What can limit peacekeepers' ability to protect civilians decisively?", "o": ["Having too much funding", "A limited, consent-based mandate", "Having too many troops", "Excessive international support"], "a": 1, "w": "A limited, consent-based mandate can limit peacekeepers' ability to act decisively."}, {"q": "What kind of allegations have damaged trust in some peacekeeping missions?", "o": ["Allegations of excessive humanitarian aid", "Allegations of misconduct by personnel", "Allegations of too much transparency", "Allegations of overfunding"], "a": 1, "w": "Allegations of misconduct by personnel have damaged trust in some peacekeeping missions."}, {"q": "What can upgrade a peacekeeping mandate to allow more decisive action?", "o": ["A shift toward a peace-enforcement mandate", "Reducing the number of troops to zero", "Removing all funding", "Ending the mission entirely"], "a": 0, "w": "A shift toward a peace-enforcement mandate can allow peacekeepers to act more decisively."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q10 &bull; Gov &bull; International Relations",ti:"Conflict Resolution & Peacekeeping \u2014 Summary",su:"Consolidate the key facts on conflict resolution and peacekeeping for exam use.",steps:[
{lb:"Core definitions to remember",dr:dQ10,ht:"<p>Remember: <b>conflict resolution</b> = reaching a mutually acceptable, peaceful outcome; <b>peacekeeping</b> = consent-based, neutral; <b>peace enforcement</b> = no consent needed, UN Charter Chapter VII.</p>"},
{lb:"Key methods and institutions",dr:dQ10,ht:"<p>Must-know methods: <b>negotiation, mediation, arbitration, adjudication, conciliation</b>. Key institutions: the <b>UN Security Council</b>, <b>ECOWAS/ECOMOG</b>, and the <b>AU Peace and Security Council</b>.</p>"},
{lb:"Key dated examples",dr:dQ10,ht:"<p>Must-know examples: <b>ECOMOG formed 1990</b>; deployed to <b>Liberia (1990)</b> and <b>Sierra Leone (1997)</b>; <b>AU Peace and Security Council established 2004</b>; Nigeria's UN contributions to DR Congo and Darfur.</p>"},
{lb:"Final exam tips",dr:dQ10,ht:"<p>Always specify <b>which method or institution</b> a question is asking about, use <b>named, dated examples</b> throughout, and where relevant, weigh peacekeeping's <b>achievements against its persistent challenges</b>.</p>"},
{lb:"Your turn",dr:dQ10,ht:tryItMC(function(){var qs=[{"q": "Which chapter of the UN Charter authorises peace enforcement, without requiring consent?", "o": ["Chapter I", "Chapter VII", "Chapter X", "Chapter XII"], "a": 1, "w": "Chapter VII of the UN Charter authorises peace enforcement without requiring consent."}, {"q": "In which year was ECOMOG formed, and which country led it?", "o": ["1980, led by Ghana", "1990, led by Nigeria", "2004, led by South Africa", "2014, led by Kenya"], "a": 1, "w": "ECOMOG was formed in 1990, led primarily by Nigeria."}, {"q": "Which method of conflict resolution results in a legally binding decision by a court?", "o": ["Negotiation", "Mediation", "Adjudication", "Conciliation"], "a": 2, "w": "Adjudication results in a legally binding decision by a court, such as the ICJ."}, {"q": "In what year was the AU Peace and Security Council established?", "o": ["1990", "2004", "2014", "2020"], "a": 1, "w": "The AU Peace and Security Council was established in 2004."}, {"q": "What should a strong exam answer on this topic always include?", "o": ["Only vague, undated generalisations", "Named, dated examples supporting the argument", "No mention of any African examples", "Only European examples"], "a": 1, "w": "A strong answer should always include named, dated examples supporting the argument."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];

function render(){bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').innerHTML=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+st.ht;st.dr(si);bDT();document.getElementById('pb').disabled=si===0;document.getElementById('nb').textContent=si===q.steps.length-1?'Restart':'Next';}
document.getElementById('pb').addEventListener('click',function(){if(si>0){si--;render();}});

// Lesson links: ?only=2,5 shows just those questions (as ticked in Lesson Mapping); ?q=N opens question N
(function(){var p=new URLSearchParams(location.search),total=QS.length;var only=(p.get('only')||'').split(',').map(Number).filter(function(n){return n>=1&&n<=total;});window.abcQuestionNumbers=null;if(only.length){var nums=[],keep=[];QS.forEach(function(x,i){if(only.indexOf(i+1)>=0){nums.push(i+1);keep.push(x);}});QS.length=0;keep.forEach(function(x){QS.push(x);});window.abcQuestionNumbers=nums;var lbl=document.querySelector('#sb .sb-lbl');if(lbl){lbl.innerHTML='This lesson: '+nums.length+' of '+total+' questions &middot; <a href="'+location.pathname+'" style="color:inherit">show all</a>';}}var q=parseInt(p.get('q'),10);if(q>=1){var idx=window.abcQuestionNumbers?window.abcQuestionNumbers.indexOf(q):q-1;if(idx>=0&&idx<QS.length)qi=idx;}})();
// Keep each question's real number in the sidebar when only some are shown
if(window.abcQuestionNumbers){var _renderAll=render;render=function(){_renderAll.apply(this,arguments);var n=window.abcQuestionNumbers;document.querySelectorAll('#sb .qn').forEach(function(el,i){if(n[i])el.textContent='Q'+n[i];});};}

(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
