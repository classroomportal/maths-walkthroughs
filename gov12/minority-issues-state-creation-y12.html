<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});

var QS=[
{ey:'Q1 \u2022 Government • Y12',ti:'Meaning of Minority Groups',su:'Understand who minority groups are in the Nigerian context.',steps:[
  {lb:'What is a minority group?',dr:dQ1,ht:'<p>In Nigerian politics, a minority group refers to an ethnic group that is numerically smaller and politically less dominant compared to the three major ethnic groups — Hausa-Fulani, Yoruba and Igbo.</p>'},
  {lb:'Examples of minority groups',dr:dQ1,ht:'<p>Nigeria\'s minority groups include the Ijaw, Kanuri, Tiv, Ibibio, Efik, Edo, Urhobo, Itsekiri, Nupe, Gwari and many others, mostly concentrated in the Middle Belt and Niger Delta regions.</p>'},
  {lb:'Why minority status matters politically',dr:dQ1,ht:'<p>Minority status matters because Nigeria\'s political system has historically been dominated by the three major groups, leading minorities to feel marginalised in political representation, resource allocation and access to federal appointments.</p>'},
  {lb:'Minority fears at independence',dr:dQ1,ht:'<p>At independence, minority groups feared domination by the three major ethnic groups within the then three regions (North, East, West), leading to demands for separate states or regions to protect their political and cultural interests.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"In Nigerian politics, a 'minority group' refers to:","o":["An ethnic group numerically smaller and less politically dominant than the three major groups","Any political party with fewer members","A religious sect only","A foreign community living in Nigeria"],"a":0,"w":"Minority groups are ethnic groups that are numerically smaller and less politically dominant compared to the Hausa-Fulani, Yoruba and Igbo."},{"q":"Which of these is an example of a Nigerian minority ethnic group?","o":["The Hausa-Fulani","The Ijaw","The Yoruba","The Igbo"],"a":1,"w":"The Ijaw are one of Nigeria's significant minority ethnic groups, concentrated mainly in the Niger Delta."},{"q":"Where are many of Nigeria's minority ethnic groups concentrated?","o":["Only outside Nigeria's borders","Only in Lagos State","Mainly in the Middle Belt and Niger Delta regions","Only in the Federal Capital Territory"],"a":2,"w":"Many Nigerian minority groups are concentrated in the Middle Belt and Niger Delta regions."},{"q":"Why did minority status matter especially at Nigeria's independence?","o":["Because independence eliminated ethnic identity entirely","Because minorities controlled all political power at independence","Because minority groups did not exist before 1960","Because minorities feared domination by the three major ethnic groups within the original three regions"],"a":3,"w":"At independence, minorities feared being politically dominated by the major ethnic groups within the North, East and West regions, prompting demands for protection."},{"q":"A key political concern for minority groups in Nigeria has been:","o":["Marginalisation in political representation, resource allocation and federal appointments","Excessive political power compared to majority groups","Complete exclusion from Nigerian citizenship","Total absence of any Nigerian minority groups"],"a":0,"w":"Minority groups have historically been concerned about marginalisation in representation, resources and appointments relative to the major ethnic groups."},{"q":"Which three ethnic groups are typically identified as Nigeria's major (non-minority) groups?","o":["Ijaw, Tiv, Kanuri","Hausa-Fulani, Yoruba, Igbo","Nupe, Efik, Gwari","Urhobo, Itsekiri, Edo"],"a":1,"w":"Hausa-Fulani, Yoruba and Igbo are conventionally identified as Nigeria's three major ethnic groups, against which minority status is measured."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government • Y12',ti:'The Willink Commission (1957–58)',su:'Understand the historic commission set up to address minority fears.',steps:[
  {lb:'Purpose of the Willink Commission',dr:dQ2,ht:'<p>The Willink Commission was set up by the British colonial government in 1957 to investigate the fears of minority groups in Nigeria\'s three regions and recommend ways to allay those fears ahead of independence.</p>'},
  {lb:'Findings of the Commission',dr:dQ2,ht:'<p>The Commission acknowledged that minority fears were genuine but did not recommend creating new regions/states immediately; instead, it proposed \'Special Areas\' with development boards and constitutional safeguards for minority rights.</p>'},
  {lb:'Niger Delta Development Board',dr:dQ2,ht:'<p>One of the Commission\'s key recommendations was the creation of the Niger Delta Development Board to address the special developmental needs of the Niger Delta minorities, given the region\'s difficult terrain and neglect.</p>'},
  {lb:'Legacy of the Commission',dr:dQ2,ht:'<p>While it did not immediately create new states, the Willink Commission\'s work laid important groundwork for later state creation exercises and remains a key historical reference point in Nigeria\'s minority rights debates.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"The Willink Commission was established in which years?","o":["1957–58","1914","1966","1999"],"a":0,"w":"The Willink Commission was set up by the British colonial government in 1957–58, ahead of Nigeria's independence."},{"q":"What was the main purpose of the Willink Commission?","o":["To draft Nigeria's independence constitution entirely","To investigate minority fears in Nigeria's regions and recommend solutions","To conduct Nigeria's first population census","To create Nigeria's first political parties"],"a":1,"w":"The Commission's core mandate was to investigate genuine minority fears and recommend measures to address them ahead of independence."},{"q":"Rather than immediately creating new regions, the Willink Commission recommended:","o":["Abolition of all three existing regions","Immediate creation of 12 new states","'Special Areas' with development boards and constitutional safeguards","Complete independence for each ethnic group separately"],"a":2,"w":"The Commission recommended Special Areas with development boards and constitutional safeguards, rather than immediate new regions."},{"q":"Which development body did the Willink Commission recommend for the Niger Delta?","o":["The Ministry of Niger Delta Affairs","The Nigerian National Petroleum Company","The Niger Delta Development Commission (NDDC)","The Niger Delta Development Board"],"a":3,"w":"The Commission recommended creating the Niger Delta Development Board to address the region's special developmental needs (the NDDC came much later, in 2000)."},{"q":"What is the historical significance of the Willink Commission today?","o":["It laid important groundwork for later state creation exercises and remains a key reference in minority rights debates","It has no relevance to Nigerian politics today","It created all of Nigeria's current 36 states","It abolished the concept of minority groups"],"a":0,"w":"Though it didn't create states immediately, the Commission's work remains a key historical reference point that influenced later state creation efforts."},{"q":"Why did the Willink Commission acknowledge minority fears as genuine but not recommend immediate new regions?","o":["It found minority fears to be entirely baseless","It judged that constitutional safeguards and development boards could address concerns without radical restructuring at that point","It lacked the authority to make any recommendations","It was instructed only to study population figures"],"a":1,"w":"The Commission found the fears genuine but opted for safeguards and development measures rather than immediate new regions, given the practical challenges of restructuring so close to independence."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government • Y12',ti:'History of State Creation in Nigeria',su:'Trace how Nigeria\'s states have expanded from 3 regions to 36 states.',steps:[
  {lb:'From regions to states (1963–67)',dr:dQ3,ht:'<p>Nigeria began with 3 regions at independence (1960); the Mid-West Region was created in 1963 (Nigeria\'s first new region, addressing minority concerns), and General Gowon created 12 states in 1967, partly in response to the crisis preceding the Civil War.</p>'},
  {lb:'Further state creation (1976–1991)',dr:dQ3,ht:'<p>Nigeria\'s states increased to 19 in 1976 (Murtala Mohammed), 21 in 1987, and 30 in 1991 (Babangida), reflecting continued demands for more localised governance and minority representation.</p>'},
  {lb:'The current 36 states (1996)',dr:dQ3,ht:'<p>General Sani Abacha created 6 additional states in 1996, bringing Nigeria\'s total to the current 36 states plus the Federal Capital Territory (Abuja) — no new states have been created since.</p>'},
  {lb:'Reasons behind state creation exercises',dr:dQ3,ht:'<p>State creation has generally been driven by: minority agitation for self-governance, the desire to bring government closer to the people, easing ethnic tensions, and, at times, political calculations by military rulers.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{"q":"How many regions did Nigeria have at independence in 1960?","o":["Three","Four","Twelve","Thirty-six"],"a":0,"w":"Nigeria began with three regions at independence in 1960: Northern, Eastern and Western Regions."},{"q":"Nigeria's first new region, created in 1963, was:","o":["Kano State","The Mid-West Region","Lagos State","Rivers State"],"a":1,"w":"The Mid-West Region, created in 1963, was Nigeria's first new region, addressing minority concerns within the Western Region."},{"q":"Who created Nigeria's 12 states in 1967?","o":["General Ibrahim Babangida","General Sani Abacha","General Yakubu Gowon","General Murtala Mohammed"],"a":2,"w":"General Yakubu Gowon created Nigeria's 12 states in 1967, partly in response to the crisis preceding the Nigerian Civil War."},{"q":"How many states did Nigeria have after Babangida's 1991 state creation exercise?","o":["21","36","19","30"],"a":3,"w":"Babangida's 1991 state creation exercise brought Nigeria's total number of states to 30."},{"q":"Nigeria's current 36 states were completed under which military ruler, in 1996?","o":["General Sani Abacha","General Yakubu Gowon","General Ibrahim Babangida","General Murtala Mohammed"],"a":0,"w":"General Sani Abacha created 6 additional states in 1996, bringing Nigeria's total to the current 36 states."},{"q":"Which of these has generally driven Nigeria's state creation exercises?","o":["A desire to reduce the number of Nigerian citizens","Minority agitation for self-governance and bringing government closer to the people","International pressure from the United Nations","A single referendum held once in 1960"],"a":1,"w":"State creation has largely been driven by minority self-governance demands, bringing government closer to citizens, and easing ethnic tensions."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government • Y12',ti:'Arguments for State Creation',su:'Explore the case for creating more/new states.',steps:[
  {lb:'Bringing government closer to the people',dr:dQ4,ht:'<p>Proponents argue that smaller states allow government to be more responsive to local needs, since state capitals and administration become more accessible to citizens in their immediate area.</p>'},
  {lb:'Protecting minority interests',dr:dQ4,ht:'<p>State creation has been used as a tool to give minority ethnic groups their own political space, reducing domination by larger neighbouring groups and giving minorities a stronger political voice.</p>'},
  {lb:'Reducing ethnic tension',dr:dQ4,ht:'<p>By giving groups their own administrative units, state creation can reduce competition and tension between different ethnic groups that previously had to share a single regional government.</p>'},
  {lb:'Equitable resource distribution',dr:dQ4,ht:'<p>Advocates argue that more states can mean a fairer, more localised distribution of statutory allocation and development resources to areas that previously felt neglected within larger regions/states.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{"q":"A key argument for state creation is that it:","o":["Brings government closer to the people, making it more responsive to local needs","Always eliminates the need for local government entirely","Removes all forms of ethnic identity","Reduces Nigeria's population automatically"],"a":0,"w":"Smaller states are argued to bring government closer to citizens and make administration more responsive to local needs."},{"q":"How can state creation help protect minority interests?","o":["By merging all minority groups into one single state","By giving minority ethnic groups their own political space, reducing domination by larger neighbouring groups","By removing minorities from the political process entirely","By eliminating the need for elections in minority areas"],"a":1,"w":"State creation can give minorities their own administrative unit, reducing domination by larger neighbouring ethnic groups and strengthening their political voice."},{"q":"How might state creation reduce ethnic tension?","o":["By abolishing all ethnic identities","By forcing all ethnic groups into a single state permanently","By separating groups into their own administrative units, reducing competition for a shared regional government","By eliminating the concept of federalism"],"a":2,"w":"Giving groups separate administrative units can reduce the competition and tension that arises when different groups share one government."},{"q":"Advocates argue more states can lead to fairer resource distribution because:","o":["It removes the need for any revenue-sharing formula","It automatically increases Nigeria's total national revenue","It eliminates the need for a Federation Account entirely","Statutory allocation and development resources can be distributed more locally to previously neglected areas"],"a":3,"w":"More states can allow a more localised distribution of statutory allocation and development resources to areas previously overlooked within larger states."},{"q":"Which best summarises the overall case FOR state creation?","o":["It can improve responsiveness, protect minorities, ease tension and distribute resources more fairly","It has no benefits of any kind","It always eliminates ethnic diversity","It guarantees permanent political stability with no downsides"],"a":0,"w":"The overall case for state creation rests on improved responsiveness, minority protection, reduced tension and fairer resource distribution."},{"q":"Why might a minority group specifically campaign for its own state?","o":["Because it wants to leave Nigeria entirely","To gain greater political representation and control over local resources and development, rather than being governed by a dominant neighbouring group","Because it opposes all forms of government","Because federal allocation is not affected by the number of states"],"a":1,"w":"Minority groups often campaign for their own state to gain political representation and control over local resources, rather than being governed by a larger neighbouring group."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government • Y12',ti:'Arguments Against Further State Creation',su:'Explore concerns about creating additional states.',steps:[
  {lb:'High cost of administration',dr:dQ5,ht:'<p>Creating new states means establishing new bureaucracies, government buildings, and salaries for additional political office-holders and civil servants — a significant financial burden on limited national resources.</p>'},
  {lb:'Viability concerns',dr:dQ5,ht:'<p>Critics argue many existing states are not financially viable, relying heavily on federal allocation rather than generating their own revenue; creating more states could worsen this dependency problem.</p>'},
  {lb:'Fragmentation and weakened national unity',dr:dQ5,ht:'<p>Some argue that continuously creating more, smaller states based on ethnic demands could deepen ethnic consciousness and fragmentation, potentially undermining broader national unity and integration.</p>'},
  {lb:'Political manipulation concerns',dr:dQ5,ht:'<p>Critics note that historically, some state creation exercises have been driven more by military rulers\' political calculations (rewarding loyalty, building support) than by genuine, carefully assessed need.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{"q":"A key argument AGAINST creating more states is:","o":["The high cost of establishing new bureaucracies and administrative structures","It always improves government efficiency with no cost","It eliminates the need for federal allocation entirely","It guarantees every state becomes financially independent"],"a":0,"w":"Critics highlight the significant financial burden of establishing new government structures, buildings and staff for each new state."},{"q":"Which is a 'viability' concern regarding further state creation?","o":["All Nigerian states are fully self-sufficient with no federal support needed","Many existing states already depend heavily on federal allocation rather than generating their own revenue","Viability concerns do not apply to Nigerian states","New states always generate more revenue than older states"],"a":1,"w":"Since many states already rely heavily on federal allocation, critics worry that creating more states could deepen this financial dependency problem."},{"q":"How might continuous state creation affect national unity, according to critics?","o":["It has no bearing on ethnic identity at all","It always strengthens national unity with no risk","It could deepen ethnic consciousness and fragmentation, potentially undermining broader unity","It automatically eliminates all regional differences"],"a":2,"w":"Critics argue that continuously creating states along ethnic lines could deepen ethnic consciousness and risk fragmenting broader national unity."},{"q":"What political manipulation concern has been raised about past state creation exercises?","o":["Only civilian democratic governments have ever created states","All past state creation exercises were conducted through full national referenda","State creation has never involved any political considerations","Some exercises were driven by military rulers' political calculations rather than purely objective need assessments"],"a":3,"w":"Critics note that some state creation exercises under military rule were influenced by rulers' political calculations, such as rewarding loyal regions."},{"q":"Which best summarises the overall case AGAINST further state creation?","o":["High administrative costs, viability concerns, risk of fragmentation, and past political manipulation","There are no valid concerns about creating more states","Creating more states always reduces government costs","Further state creation guarantees improved national unity automatically"],"a":0,"w":"The case against further state creation centres on cost, viability, fragmentation risk and concerns about past political manipulation."},{"q":"Why do critics worry about the financial viability of potential new states?","o":["Because new states are legally barred from receiving any federal allocation","Because new states may struggle to generate sufficient internally generated revenue, deepening reliance on federal allocation","Because Nigeria has an unlimited national budget","Because financial viability is not a relevant consideration in state creation"],"a":1,"w":"Concerns centre on whether new states could generate enough internally generated revenue, given how heavily even existing states depend on federal allocation."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government • Y12',ti:'Constitutional Requirements for Creating a New State',su:'Understand the formal process for creating a state under the 1999 Constitution.',steps:[
  {lb:'Section 8 of the 1999 Constitution',dr:dQ6,ht:'<p>Section 8 of the 1999 Constitution sets out the demanding procedure for creating a new state, requiring support from the National Assembly, the affected state\'s House of Assembly, and a referendum among the people of the proposed area.</p>'},
  {lb:'Key procedural steps',dr:dQ6,ht:'<p>The process requires: a request supported by at least two-thirds of members representing the area in the Senate, House of Representatives, and the relevant State House of Assembly; a referendum in the area with at least two-thirds majority support; and, finally, approval by two-thirds of all State Houses of Assembly and the National Assembly.</p>'},
  {lb:'Why the process is deliberately difficult',dr:dQ6,ht:'<p>The Constitution makes state creation deliberately demanding to prevent frivolous or purely political state creation requests, ensuring genuine, broad-based popular support before Nigeria\'s federal structure is altered.</p>'},
  {lb:'Practical effect since 1999',dr:dQ6,ht:'<p>Despite numerous requests and proposed bills for new states since 1999 (some for minority groups like the Ijaw seeking their own state), none have successfully completed this demanding constitutional process, and Nigeria remains at 36 states.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{"q":"Which section of Nigeria's 1999 Constitution sets out the procedure for creating a new state?","o":["Section 8","Section 7","Section 14","Section 33"],"a":0,"w":"Section 8 of the 1999 Constitution establishes the detailed procedure required to create a new state."},{"q":"Which of these is required under Section 8 to create a new state?","o":["A simple majority vote in only the Senate","A referendum in the proposed area with at least two-thirds majority support","Approval from a single State Governor only","No requirement for any referendum at all"],"a":1,"w":"Section 8 requires a referendum in the affected area with at least two-thirds majority support, among other requirements."},{"q":"Why does the Constitution make the state creation process so demanding?","o":["Because the Constitution does not permit any new states ever","To make state creation impossible in every case","To prevent frivolous or purely political requests and ensure genuine, broad-based support","To transfer the decision entirely to the judiciary"],"a":2,"w":"The demanding process is designed to ensure only genuinely supported proposals succeed, preventing arbitrary or purely political state creation."},{"q":"How many states has Nigeria successfully created under the Section 8 process since the 1999 Constitution came into force?","o":["One new state","Six new states","Twelve new states","None — Nigeria remains at 36 states"],"a":3,"w":"Despite various proposals, no new state has successfully completed the Section 8 process since 1999; Nigeria remains at 36 states."},{"q":"Besides a local referendum, what final approval is also required to create a new state?","o":["Approval by two-thirds of all State Houses of Assembly and the National Assembly","Approval only by the President, with no legislative involvement","Approval only by the United Nations","No further approval is required after the referendum"],"a":0,"w":"After the local referendum, the process also requires approval by two-thirds of all State Houses of Assembly and the National Assembly."},{"q":"Which minority group is often cited as having sought its own state under this process, without success?","o":["The Yoruba","The Ijaw","The Hausa-Fulani","The Igbo"],"a":1,"w":"The Ijaw have been among the groups seeking their own state (e.g. a proposed Toru/Ijaw state), though no such proposal has completed the demanding Section 8 process."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government • Y12',ti:'The Niger Delta and Minority Agitation',su:'Explore the specific case of Niger Delta minority agitation.',steps:[
  {lb:'Niger Delta minorities and oil',dr:dQ7,ht:'<p>The Niger Delta is home to numerous minority ethnic groups (Ijaw, Ogoni, Itsekiri, Urhobo and others) whose land produces the bulk of Nigeria\'s oil wealth, yet the region has historically suffered environmental damage and underdevelopment.</p>'},
  {lb:'Ogoni struggle and Ken Saro-Wiwa',dr:dQ7,ht:'<p>The Movement for the Survival of the Ogoni People (MOSOP), led by Ken Saro-Wiwa, campaigned in the 1990s against environmental damage from oil exploration and for greater resource control; Saro-Wiwa was controversially executed by the Abacha government in 1995.</p>'},
  {lb:'Resource control demands',dr:dQ7,ht:'<p>Niger Delta minorities have long demanded greater \'resource control\' — a larger share of oil revenue derived from their land — leading to the constitutional derivation principle guaranteeing states a percentage of revenue from natural resources in their territory.</p>'},
  {lb:'The Niger Delta Development Commission (NDDC)',dr:dQ7,ht:'<p>Established in 2000, the NDDC was created specifically to address the developmental needs of the oil-producing Niger Delta region, though it has faced persistent criticism over corruption and underperformance.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{"q":"Which region is home to many Nigerian minority groups whose land produces most of the country's oil?","o":["The Niger Delta","The Federal Capital Territory","The Sahel region","Lagos Island"],"a":0,"w":"The Niger Delta is home to numerous minority ethnic groups on whose land the bulk of Nigeria's oil is produced."},{"q":"Which organisation, led by Ken Saro-Wiwa, campaigned against environmental damage from oil exploration?","o":["The National Youth Service Corps","The Movement for the Survival of the Ogoni People (MOSOP)","The Nigerian Bar Association","The Independent National Electoral Commission"],"a":1,"w":"MOSOP, led by Ken Saro-Wiwa, campaigned in the 1990s against environmental damage and for greater resource control for the Ogoni people."},{"q":"What happened to Ken Saro-Wiwa in 1995?","o":["He was awarded a state governorship","He became Nigeria's President","He was controversially executed by the Abacha military government","He retired peacefully from activism"],"a":2,"w":"Ken Saro-Wiwa was controversially executed by the Abacha government in 1995, drawing significant international condemnation."},{"q":"What does 'resource control' refer to in the Niger Delta context?","o":["A demand to transfer oil revenue only to the federal government","A demand to eliminate all oil production entirely","A demand for the Niger Delta to become a separate country","Demands for a larger share of oil revenue derived from the region's own land/resources"],"a":3,"w":"Resource control refers to Niger Delta demands for a greater share of the revenue generated from oil extracted from their land."},{"q":"The constitutional 'derivation principle' guarantees states:","o":["A percentage of revenue derived from natural resources located in their territory","Complete ownership of all national oil revenue","No share of any natural resource revenue at all","Equal shares regardless of where resources are located"],"a":0,"w":"The derivation principle guarantees states a constitutionally specified percentage of revenue derived from natural resources in their territory."},{"q":"The Niger Delta Development Commission (NDDC), established in 2000, has faced persistent criticism for:","o":["Achieving complete and total success with no criticism at all","Corruption and underperformance despite its development mandate","Having no connection to the Niger Delta region","Being abolished immediately after creation"],"a":1,"w":"Despite its mandate to develop the Niger Delta, the NDDC has faced persistent criticism over corruption and underperformance."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government • Y12',ti:'Federal Character and Minority Representation',su:'Understand how federal character addresses minority political concerns.',steps:[
  {lb:'Federal character principle',dr:dQ8,ht:'<p>The federal character principle (Section 14(3) of the 1999 Constitution) requires that appointments to federal government positions reflect the diversity of Nigeria\'s states and ethnic groups, aiming to prevent domination by any one group.</p>'},
  {lb:'Federal character and minorities',dr:dQ8,ht:'<p>By requiring representation across all states (rather than just the major ethnic groups), federal character gives minority-dominated states a guaranteed voice in federal appointments they might otherwise be excluded from.</p>'},
  {lb:'Criticisms of federal character',dr:dQ8,ht:'<p>Critics argue federal character can sometimes prioritise geographic/state balance over merit, and that it addresses state-level representation more than it addresses the specific concerns of minority ethnic groups scattered across or within larger states.</p>'},
  {lb:'Federal character in practice',dr:dQ8,ht:'<p>In practice, federal character is applied to federal civil service recruitment, ministerial appointments (at least one minister per state), and appointments to federal boards and agencies.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{"q":"The federal character principle is found in which section of the 1999 Constitution?","o":["Section 14(3)","Section 8","Section 7","Section 33"],"a":0,"w":"Section 14(3) of the 1999 Constitution establishes the federal character principle."},{"q":"What is the main aim of the federal character principle?","o":["To give only the three major ethnic groups federal appointments","To ensure federal appointments reflect the diversity of Nigeria's states and ethnic groups, preventing domination by any one group","To eliminate the need for elections entirely","To ensure only Lagos and Abuja are represented in government"],"a":1,"w":"Federal character aims to ensure fair representation across Nigeria's diverse states and groups in federal appointments, preventing dominance by any single group."},{"q":"How does federal character benefit minority-dominated states specifically?","o":["It only applies to the three major ethnic groups","It excludes minority states from all federal appointments","It guarantees them a voice in federal appointments they might otherwise be excluded from","It has no effect on minority representation at all"],"a":2,"w":"Federal character requires representation by state, giving minority-dominated states guaranteed access to federal positions."},{"q":"A common criticism of federal character is that it:","o":["Applies only to state government appointments, never federal","Always perfectly represents every individual minority ethnic group","Has eliminated all forms of ethnic tension in Nigeria","Can prioritise geographic/state balance over strict merit-based selection"],"a":3,"w":"Critics argue federal character can sometimes favour geographic/state balance over merit, and doesn't always address minority ethnic concerns within larger states."},{"q":"Which of these is an area where federal character is applied in practice?","o":["Federal civil service recruitment and ministerial appointments","Only private company hiring decisions","Only religious leadership appointments","Only traditional ruler selection"],"a":0,"w":"Federal character is applied to federal civil service recruitment, ministerial appointments (at least one per state) and federal board appointments."},{"q":"Why might federal character not fully resolve minority ethnic concerns, according to critics?","o":["Because it fully and completely resolves every minority concern with no gaps","Because it operates mainly at the state level, and minority ethnic groups can be scattered across or within larger, non-minority-dominated states","Because it does not apply to any federal government body","Because minority groups do not live within any Nigerian states"],"a":1,"w":"Since federal character works at the state level, it may not adequately capture the specific concerns of minority ethnic groups within states dominated by other groups."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government • Y12',ti:'WAEC Exam Preparation — Minority Issues & State Creation',su:'Practise WAEC-style questions on minority issues and state creation.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions: (1) Define minority groups and their concerns. (2) Reference the Willink Commission. (3) Trace state creation history (3→12→19→21→30→36). (4) Discuss arguments for/against further state creation. (5) Cite Section 8 procedure and federal character as responses to minority concerns.</p>'},
  {lb:'Common WAEC question patterns',dr:dQ9,ht:'<p>Typical questions: \'Discuss the causes of minority agitation in Nigeria\', \'Trace the history of state creation in Nigeria\', \'Examine the arguments for and against the creation of more states\', \'Discuss the constitutional procedure for creating a new state\'.</p>'},
  {lb:'Key facts to memorise',dr:dQ9,ht:'<p>Willink Commission (1957–58). Mid-West Region (1963) — first new region. 12 states (1967, Gowon). 19 states (1976). 21 states (1987). 30 states (1991, Babangida). 36 states (1996, Abacha). Section 8 = state creation procedure. Section 14(3) = federal character.</p>'},
  {lb:'Common mistakes to avoid',dr:dQ9,ht:'<p>Avoid confusing the Willink Commission\'s era (pre-independence, 1957–58) with later state creation exercises. Always give the precise state creation figures/years. Distinguish federal character (state-based) from resource control/derivation (resource-based) as separate minority-related concepts.</p>'},
