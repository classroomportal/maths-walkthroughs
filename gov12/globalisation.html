var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function shuffleMC(o){
  if(!o||!o.options)return o;
  var idxs=[];for(var k=0;k<o.options.length;k++){idxs.push(k);}
  for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=idxs[i];idxs[i]=idxs[j];idxs[j]=tmp;}
  var newOptions=[];for(var m=0;m<idxs.length;m++){newOptions.push(o.options[idxs[m]]);}
  var newCorrect=idxs.indexOf(o.correct);
  var o2={};for(var key in o){if(o.hasOwnProperty(key))o2[key]=o[key];}
  o2.options=newOptions;o2.correct=newCorrect;
  return o2;
}
function tryItMC(genFn){var wrapped=function(){return shuffleMC(genFn());};var id='t'+Math.random().toString(36).slice(2);var o=wrapped();ST[id]={o:o,genFn:wrapped,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});

{lb:'Cultural globalisation and identity politics',dr:dQ1,ht:'<p>Cultural globalisation has provoked <b>identity-based resistance</b> in some contexts, with movements emphasising the preservation of traditional or national cultural distinctiveness against perceived homogenising global pressures.</p>'},

"Nigeria only uses French officially","English is Nigeria's official language","Nigeria has never used English at all"],"a":2,"w":"Nigeria has particularly benefited given English's role as its official language."},{"q":"What kind of resistance has cultural globalisation sometimes provoked?","o":["Identity-based resistance emphasising preservation of traditional culture","A complete global ban on all cultural exchange","Resistance only in Nigeria, nowhere else","No resistance has ever been recorded anywhere"],"a":0,"w":"Cultural globalisation has sometimes provoked identity-based resistance emphasising preservation of traditional culture."},{"q":"What is the central debate within cultural globalisation, according to this lesson?","o":["Whether globalisation exists at all","Whether it causes cultural homogenisation or enables local cultures to reach global audiences","Whether Nigeria has any culture at all","Whether English should be banned worldwide"],"a":1,"w":"The central debate is whether globalisation causes cultural homogenisation or enables local cultures to reach global audiences."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov • International Relations',ti:'Political and Technological Globalisation',su:'Explain the political and technological dimensions of globalisation.',steps:[
{lb:'Growth of international organisations',dr:dQ2,ht:'<p><b>Political globalisation</b> is reflected in the growing role of international organisations &mdash; the <b>UN, AU, ECOWAS, WTO</b> &mdash; coordinating shared global and regional responses to problems no single state can solve alone.</p>'},
{lb:'Spread of shared political norms',dr:dQ2,ht:'<p>Globalisation has spread certain <b>shared political norms</b> &mdash; human rights standards, democratic governance expectations, anti-corruption frameworks &mdash; codified in instruments like the <b>African Charter on Democracy, Elections and Governance (2007)</b>.</p>'},
{lb:'The internet and digital revolution',dr:dQ2,ht:'<p><b>Technological globalisation</b>, driven by the internet (widespread from the 1990s) and, more recently, <b>mobile and smartphone technology</b>, has connected billions of people worldwide, transforming communication, commerce and access to information, including across Nigeria.</p>'},
{lb:'Cybersecurity as a globalised challenge',dr:dQ2,ht:'<p>Technological globalisation has also created new, <b>globalised security challenges</b> &mdash; cybercrime, misinformation, and cyberattacks that cross borders instantly &mdash; requiring international cooperation frameworks that traditional, territorially-based security approaches struggle to address.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is political globalisation reflected in, according to this lesson?","o":["The end of all international cooperation","The complete abolition of all national governments","A single unified world government","The growing role of international organisations like the UN, AU, ECOWAS and WTO"],"a":3,"w":"Political globalisation is reflected in the growing role of international organisations."},{"q":"Which 2007 framework codifies shared political norms on democracy and governance in Africa?","o":["The African Charter on Democracy, Elections and Governance","AfCFTA","The Treaty of Lagos","The Ezulwini Consensus"],"a":0,"w":"The African Charter on Democracy, Elections and Governance (2007) codifies shared political norms."},{"q":"What has driven technological globalisation since the 1990s?","o":["The internet and, more recently, mobile/smartphone technology","Only traditional postal mail","Only fixed-line telephones","Only printed newspapers"],"a":0,"w":"The internet and mobile/smartphone technology have driven technological globalisation since the 1990s."},{"q":"What has technological globalisation transformed, according to this lesson?","o":["Communication, commerce and access to information","Only agricultural production methods","Only national flag designs","Only military uniform design"],"a":0,"w":"Technological globalisation has transformed communication, commerce and access to information."},{"q":"What new security challenges has technological globalisation created?","o":["Cybercrime, misinformation and cross-border cyberattacks","No new security challenges of any kind","Only traditional naval warfare","Only cavalry-based conflict"],"a":0,"w":"Technological globalisation has created new challenges such as cybercrime, misinformation and cross-border cyberattacks."},{"q":"Why do these new challenges struggle to be addressed by traditional security approaches?","o":["These challenges do not actually exist","Traditional approaches are too advanced for these simple threats","Traditional approaches are territorially-based, while these threats cross borders instantly","Traditional approaches have already fully solved these challenges"],"a":2,"w":"Traditional, territorially-based security approaches struggle to address threats that cross borders instantly."},{"q":"What kind of cooperation do these new globalised security challenges require?","o":["Only cooperation within one single country","Only military cooperation, with no other kind possible","International cooperation frameworks","No cooperation of any kind"],"a":2,"w":"These challenges require international cooperation frameworks to address effectively."},{"q":"How would you summarise the relationship between political and technological globalisation?","o":["Both reflect growing global interconnectedness requiring new forms of cooperation and norms","Political globalisation has ended completely","They are entirely unrelated processes with no connection","Technological globalisation only affects wealthy countries"],"a":0,"w":"Both reflect growing global interconnectedness requiring new forms of cooperation and shared norms."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov • International Relations',ti:'Benefits of Globalisation',su:'Evaluate the key benefits globalisation has brought to states and individuals.',steps:[
{lb:'Economic growth and poverty reduction',dr:dQ1,ht:'<p>Globalisation has contributed to significant <b>economic growth and poverty reduction</b> in many developing countries by expanding access to global markets, foreign investment, and technology transfer, lifting hundreds of millions out of extreme poverty worldwide since the 1990s, notably in Asia.</p>'},
{lb:'Access to knowledge and technology',dr:dQ1,ht:'<p>Globalisation has dramatically expanded access to <b>knowledge, technology and education</b> &mdash; online learning platforms, international scholarships, and technology transfer have benefited developing countries including Nigeria, accelerating skill development.</p>'},
{lb:'Cultural exchange and mutual understanding',dr:dQ1,ht:'<p>Globalisation facilitates <b>cultural exchange</b>, exposing people worldwide to diverse perspectives, potentially fostering greater mutual understanding and reducing the kind of ignorance that can fuel prejudice or conflict between different peoples.</p>'},
{lb:'Global cooperation on shared challenges',dr:dQ1,ht:'<p>Globalisation has enabled greater <b>international cooperation</b> on shared global challenges &mdash; pandemic response, climate change, and international development &mdash; that no single state could effectively address alone.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What has globalisation contributed to in many developing countries since the 1990s?","o":["Only increased poverty everywhere","Complete economic collapse in every country","No economic effects of any kind","Economic growth and poverty reduction"],"a":3,"w":"Globalisation has contributed to economic growth and poverty reduction in many developing countries."},{"q":"Which region is particularly noted for poverty reduction linked to globalisation since the 1990s?","o":["Only the Arctic","Only Antarctica","Only Western Europe","Asia"],"a":3,"w":"Asia is particularly noted for significant poverty reduction linked to globalisation since the 1990s."},{"q":"What has globalisation dramatically expanded access to, benefiting countries like Nigeria?","o":["Only agricultural land","Knowledge, technology and education","Only military weapons","Only currency printing capacity"],"a":1,"w":"Globalisation has dramatically expanded access to knowledge, technology and education."},{"q":"What does globalisation facilitate that can foster mutual understanding between peoples?","o":["Cultural exchange","The elimination of all cultural differences","Complete cultural isolation","A ban on all international travel"],"a":0,"w":"Globalisation facilitates cultural exchange, which can foster mutual understanding between peoples."},{"q":"What can reduced ignorance through cultural exchange potentially help address?","o":["Only currency exchange rates","Prejudice or conflict between different peoples","Only military logistics","Only agricultural productivity"],"a":1,"w":"Reduced ignorance through cultural exchange can potentially help address prejudice or conflict between peoples."},{"q":"What kind of global challenges has globalisation enabled greater cooperation on?","o":["Pandemic response, climate change and international development","Only local traffic management","Only school curriculum design","Only individual household budgeting"],"a":0,"w":"Globalisation has enabled greater cooperation on pandemic response, climate change and international development."},{"q":"Why can no single state effectively address these challenges alone?","o":["Every state has unlimited resources to solve them alone","They are inherently global in scale, crossing all national borders","States are legally forbidden from addressing them","These challenges do not actually exist"],"a":1,"w":"These challenges are inherently global in scale, crossing all national borders, requiring cooperation."},{"q":"What overall benefit does this lesson emphasise about globalisation?","o":["It has brought real economic, educational, cultural and cooperative benefits","It has brought no benefits of any kind","It has only ever harmed developing countries","It has eliminated all international problems entirely"],"a":0,"w":"This lesson emphasises that globalisation has brought real economic, educational, cultural and cooperative benefits."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov • International Relations',ti:'Criticisms and Challenges of Globalisation',su:'Evaluate the key criticisms and challenges associated with globalisation.',steps:[
{lb:'Inequality between and within countries',dr:dQ2,ht:'<p>Critics argue globalisation has <b>disproportionately benefited</b> already-wealthy countries and elites within poorer countries, while leaving many workers and regions &mdash; including parts of Nigeria\'s economy &mdash; relatively marginalised from its gains.</p>'},
{lb:'Vulnerability to external shocks',dr:dQ2,ht:'<p>Deep global economic integration means individual economies, including Nigeria\'s, become more <b>vulnerable to external shocks</b> &mdash; oil price crashes, global recessions, pandemic disruptions &mdash; over which they have little direct control.</p>'},
{lb:'Threats to local industries and jobs',dr:dQ2,ht:'<p>Exposure to global competition can threaten <b>local industries and jobs</b> unable to compete with cheaper imports or larger multinational competitors, a recurring concern in debates over Nigeria\'s participation in agreements like AfCFTA.</p>'},
{lb:'Environmental and cultural concerns',dr:dQ2,ht:'<p>Critics also highlight globalisation\'s role in <b>environmental degradation</b> (driven by expanded global production and consumption) and concerns about <b>cultural homogenisation</b>, eroding local traditions under pressure from dominant global cultural products.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What criticism is made about how globalisation's benefits are distributed?","o":["It only ever benefits the poorest countries","It benefits every country and person completely equally","It disproportionately benefits already-wealthy countries and elites","It has never benefited anyone anywhere"],"a":2,"w":"Critics argue globalisation disproportionately benefits already-wealthy countries and elites."},{"q":"What vulnerability does deep global economic integration create for individual economies?","o":["Vulnerability to external shocks such as oil price crashes or recessions","No vulnerability of any kind","Vulnerability only to internal domestic issues, never external ones","Complete immunity from all economic problems"],"a":0,"w":"Deep global integration creates vulnerability to external shocks such as oil price crashes or recessions."},{"q":"Which country's economy is cited as an example of this vulnerability to external shocks?","o":["Only landlocked countries","Nigeria's","Only countries with no oil exports","Only fully industrialised countries"],"a":1,"w":"Nigeria's economy is cited as an example of vulnerability to external shocks like oil price changes."},{"q":"What can exposure to global competition threaten domestically?","o":["Only a country's national anthem","Only a country's flag design","Only a country's currency design","Local industries and jobs unable to compete with imports or larger competitors"],"a":3,"w":"Exposure to global competition can threaten local industries and jobs unable to compete."},{"q":"Which agreement has sparked domestic debate in Nigeria about protecting local industries from global competition?","o":["The Ezulwini Consensus","The Treaty of Lagos","The Commonwealth Charter","AfCFTA"],"a":3,"w":"AfCFTA has sparked domestic debate in Nigeria about protecting local industries from global competition."},{"q":"What environmental criticism is made of globalisation?","o":["It has no environmental effects of any kind","It has only ever improved environmental conditions everywhere","It has entirely eliminated all environmental problems","It has contributed to environmental degradation through expanded production and consumption"],"a":3,"w":"Critics highlight globalisation's role in environmental degradation through expanded global production and consumption."},{"q":"What cultural concern is often raised alongside the environmental criticism?","o":["The total elimination of all global media","A complete absence of any cultural exchange","A ban on all cultural products worldwide","Cultural homogenisation eroding local traditions"],"a":3,"w":"Cultural homogenisation, eroding local traditions, is often raised as a concern alongside the environmental criticism."},{"q":"What balanced conclusion should a WAEC essay draw about globalisation's effects?","o":["It has brought only benefits with no costs of any kind","It has brought real benefits alongside real costs and risks that require careful management","It has no measurable effects on any country","It has brought only costs with no benefits of any kind"],"a":1,"w":"A balanced WAEC essay should acknowledge globalisation's real benefits alongside its real costs and risks."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov • International Relations',ti:'Nigeria and Globalisation',su:'Examine how globalisation has specifically shaped Nigeria\'s economy and society.',steps:[
{lb:'Oil and global market integration',dr:dQ1,ht:'<p>Nigeria\'s economy is deeply integrated into <b>global oil markets</b> through OPEC membership, making national fiscal planning directly dependent on globally-determined oil prices &mdash; a clear example of Nigeria\'s economic globalisation.</p>'},
{lb:'Nigeria\'s growing tech and creative sectors',dr:dQ1,ht:'<p>Globalisation has enabled the rapid growth of Nigeria\'s <b>technology sector</b> (fintech startups attracting international investment) and <b>creative industries</b> (Nollywood, Afrobeats), both leveraging global platforms and international markets for growth.</p>'},
{lb:'Migration and the Nigerian diaspora',dr:dQ1,ht:'<p>Globalisation has facilitated extensive <b>Nigerian migration</b> worldwide, creating a large diaspora contributing significant <b>remittances</b> to Nigeria\'s economy while also raising domestic concerns about "brain drain" &mdash; the emigration of skilled professionals.</p>'},
{lb:'Balancing openness and protection',dr:dQ1,ht:'<p>Nigeria continues to navigate the tension between embracing <b>globalisation\'s opportunities</b> (trade, investment, technology) and protecting <b>domestic industries and interests</b> from its potential downsides, reflected in ongoing AfCFTA implementation debates.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Through what membership is Nigeria's economy deeply integrated into global oil markets?","o":["The African Union alone","OPEC","The Commonwealth","ECOWAS alone"],"a":1,"w":"Nigeria's economy is deeply integrated into global oil markets through its OPEC membership."},{"q":"What has globalisation enabled the rapid growth of within Nigeria's technology sector?","o":["Only textile production","Only agricultural machinery manufacturing","Fintech startups attracting international investment","Only mining equipment"],"a":2,"w":"Globalisation has enabled the rapid growth of Nigerian fintech startups attracting international investment."},{"q":"Which Nigerian creative industries have leveraged global platforms for growth?","o":["Nollywood and Afrobeats","Only Nigeria's oil sector","Only Nigeria's banking sector","Only Nigeria's agricultural sector"],"a":0,"w":"Nollywood and Afrobeats have leveraged global platforms and international markets for growth."},{"q":"What has globalisation facilitated regarding Nigerian migration worldwide?","o":["Migration only within Nigeria's own borders","No migration of any kind","A complete ban on all emigration","Extensive migration, creating a large diaspora"],"a":3,"w":"Globalisation has facilitated extensive Nigerian migration worldwide, creating a large diaspora."},{"q":"What do diaspora communities contribute significantly to Nigeria's economy?","o":["Only tourism revenue","Only agricultural exports","Remittances","Only military equipment"],"a":2,"w":"Diaspora communities contribute significant remittances to Nigeria's economy."},{"q":"What domestic concern does extensive skilled emigration raise?","o":["No concern of any kind","An oversupply of doctors and engineers","\"Brain drain\" — the emigration of skilled professionals","A shortage of unskilled labour only"],"a":2,"w":"Extensive skilled emigration raises concerns about \"brain drain\" — the loss of skilled professionals."},{"q":"What tension does Nigeria continue to navigate regarding globalisation?","o":["No tension exists regarding globalisation at all","Complete, unconditional embrace of globalisation with no concerns","Embracing its opportunities while protecting domestic industries and interests","A total rejection of all globalisation"],"a":2,"w":"Nigeria navigates the tension between embracing globalisation's opportunities and protecting domestic interests."},{"q":"Which ongoing agreement reflects this tension in current policy debates?","o":["AfCFTA implementation","The Commonwealth Charter","The Treaty of Lagos","The 1999 Constitution"],"a":0,"w":"Ongoing AfCFTA implementation debates reflect this tension between openness and protection."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov • International Relations',ti:'Theoretical Perspectives on Globalisation',su:'Compare Realist and Liberal perspectives on the significance of globalisation.',steps:[
{lb:'The Liberal perspective: transformation',dr:dQ2,ht:'<p><b>Liberal</b> IR theorists generally view globalisation as genuinely <b>transformative</b>, arguing deepening economic interdependence and shared institutions reduce the likelihood of conflict between states and create new forms of cooperative governance beyond the traditional state system.</p>'},
{lb:'The Realist perspective: continuity',dr:dQ2,ht:'<p><b>Realist</b> theorists are typically more skeptical, arguing that despite globalisation, <b>states remain the dominant actors</b> in international relations, still guarding sovereignty jealously and using globalisation\'s tools (trade, technology) to pursue traditional power and security goals.</p>'},
{lb:'Evidence for both views',dr:dQ2,ht:'<p>Evidence exists for both perspectives: deepening trade ties have coincided with historically low levels of great-power war (supporting Liberals), while states have also weaponised economic interdependence (sanctions, trade restrictions, technology export controls) for strategic advantage (supporting Realists).</p>'},
{lb:'A nuanced middle view',dr:dQ2,ht:'<p>Many contemporary scholars adopt a <b>nuanced middle position</b>: globalisation has genuinely transformed some aspects of international relations (economic interdependence, information flows) while state sovereignty and power politics remain stubbornly persistent in others (security, territorial disputes).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"How do Liberal IR theorists generally view globalisation?","o":["As having no significance at all for international relations","As identical to colonialism in every respect","As genuinely transformative, reducing conflict likelihood through interdependence","As a purely military phenomenon"],"a":2,"w":"Liberal theorists generally view globalisation as genuinely transformative, reducing conflict likelihood through interdependence."},{"q":"How do Realist IR theorists typically view globalisation, by contrast?","o":["Identically to Liberal theorists, with no disagreement","As having completely replaced the state system","More skeptically, arguing states remain the dominant actors pursuing traditional power goals","As entirely irrelevant to international relations"],"a":2,"w":"Realist theorists are typically more skeptical, arguing states remain dominant actors pursuing traditional power goals."},{"q":"What evidence supports the Liberal view of globalisation?","o":["Rising levels of great-power war worldwide","Deepening trade ties coinciding with historically low levels of great-power war","A complete absence of any international trade","The total abolition of all international institutions"],"a":1,"w":"Deepening trade ties coinciding with historically low levels of great-power war supports the Liberal view."},{"q":"What evidence supports the Realist view of globalisation?","o":["States refusing to ever use economic tools for strategic advantage","The total disappearance of all state borders","States weaponising economic interdependence through sanctions and export controls","A complete absence of any state sovereignty concerns"],"a":2,"w":"States weaponising economic interdependence through sanctions and export controls supports the Realist view."},{"q":"What do economic sanctions and technology export controls illustrate, according to Realists?","o":["The end of all international trade","States using globalisation's tools to pursue traditional power and security goals","A complete rejection of globalisation by all states","The irrelevance of national interest to modern states"],"a":1,"w":"Realists argue sanctions and export controls show states using globalisation's tools for traditional power goals."},{"q":"What nuanced middle position do many contemporary scholars adopt?","o":["There is no possible middle position between Realism and Liberalism","Globalisation has transformed some aspects of IR while state power persists in others","Globalisation has completely replaced all state power everywhere","Globalisation has transformed absolutely nothing about international relations"],"a":1,"w":"Many scholars adopt a middle position: globalisation transforms some aspects of IR while state power persists in others."},{"q":"In which areas does state sovereignty and power politics remain \"stubbornly persistent,\" according to the middle view?","o":["Only within Nigeria specifically","Security and territorial disputes","Areas that no longer exist in the modern world","Information flows and economic interdependence only"],"a":1,"w":"State sovereignty and power politics remain persistent particularly in security and territorial disputes."},{"q":"Why is understanding both Realist and Liberal perspectives valuable for a WAEC essay on globalisation?","o":["Only one perspective has ever been considered valid","WAEC forbids discussing IR theory in essays on globalisation","It shows a sophisticated understanding of competing debates about globalisation's true significance","These perspectives have no relevance to globalisation at all"],"a":2,"w":"Understanding both perspectives shows sophisticated engagement with debates about globalisation's true significance."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov • International Relations',ti:'WAEC Exam Preparation — Globalisation',su:'Practise WAEC-style questions on globalisation.',steps:[
{lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC essays on globalisation: (1) Define the term clearly. (2) Identify the relevant <b>dimension</b> (economic, cultural, political, technological) if the question specifies one. (3) Give <b>named, dated examples</b>, especially Nigerian. (4) Evaluate <b>benefits and challenges</b>.</p>'},
{lb:'Common WAEC question patterns',dr:dQ2,ht:'<p>Common patterns include: "Explain the meaning and dimensions of globalisation." / "Discuss the benefits and challenges of globalisation for developing countries." / "Examine the impact of globalisation on Nigeria\'s economy." / "Assess the relationship between globalisation and cultural identity."</p>'},
{lb:'Key vocabulary for essays',dr:dQ2,ht:'<p>Key vocabulary: <b>globalisation</b>, <b>interconnectedness</b>, <b>multinational corporation (MNC)</b>, <b>cultural homogenisation</b>, <b>WTO</b>, <b>lingua franca</b>, <b>brain drain</b>, <b>global supply chains</b>. Precise, correctly-spelled terms strengthen WAEC answers significantly.</p>'},
{lb:'Applying to Nigeria throughout',dr:dQ2,ht:'<p>The strongest WAEC essays on this topic consistently apply globalisation concepts to <b>Nigeria\'s own experience</b> &mdash; OPEC, Nollywood/Afrobeats, AfCFTA, diaspora remittances &mdash; since WAEC consistently rewards concrete, locally-relevant application over purely abstract discussion.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on globalisation?","o":["Define the term clearly","List unrelated dates with no explanation","Skip straight to a conclusion","Immediately give a personal opinion with no facts"],"a":0,"w":"A WAEC essay on globalisation should begin by clearly defining the term."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Define photosynthesis.\"","\"Examine the impact of globalisation on Nigeria's economy.\"","\"List the rivers of Nigeria.\""],"a":2,"w":"\"Examine the impact of globalisation on Nigeria's economy\" is a typical WAEC-style question on this topic."},{"q":"Which term describes the erosion of local cultures under dominant global cultural products?","o":["\"Political federalism\"","\"Cultural homogenisation\"","\"Diplomatic immunity\"","\"Economic diversification\""],"a":1,"w":"\"Cultural homogenisation\" describes the erosion of local cultures under dominant global cultural products."},{"q":"Which term describes the emigration of skilled professionals from a country?","o":["\"Brain drain\"","\"Economic diplomacy\"","\"Cultural exchange\"","\"Trade liberalisation\""],"a":0,"w":"\"Brain drain\" describes the emigration of skilled professionals from a country."},{"q":"Which Nigerian examples should be used when discussing cultural globalisation in a WAEC essay?","o":["Only Nigeria's military","Only Nigeria's currency","Nollywood and Afrobeats","Only Nigeria's oil exports"],"a":2,"w":"Nollywood and Afrobeats should be used as Nigerian examples of cultural globalisation."},{"q":"Which trade agreement should be cited when discussing Nigeria's economic globalisation?","o":["The Commonwealth Charter","The Treaty of Lagos","AfCFTA","The Ezulwini Consensus"],"a":2,"w":"AfCFTA should be cited when discussing Nigeria's economic globalisation."},{"q":"Why does WAEC reward applying globalisation concepts specifically to Nigeria's experience?","o":["Other countries are irrelevant to the syllabus","It replaces the need for any definitions","Nigeria is the only country ever studied in WAEC Government","It demonstrates concrete knowledge rather than purely abstract discussion"],"a":3,"w":"Applying concepts to Nigeria's specific experience demonstrates concrete knowledge over purely abstract discussion."},{"q":"What should a WAEC essay on globalisation evaluate, according to the recommended structure?","o":["Benefits and challenges","Nothing beyond a basic definition","Only negative facts with no benefits","Only positive facts with no criticism"],"a":0,"w":"A WAEC essay on globalisation should evaluate both benefits and challenges."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov • International Relations',ti:'Mixed Questions — Globalisation',su:'Integrated revision across the meaning, dimensions, benefits and challenges of globalisation.',steps:[
{lb:'Summary of key points',dr:dQ1,ht:'<p>Globalisation is the increasing worldwide interconnectedness across <b>economic, cultural, political and technological</b> dimensions, bringing real benefits (growth, knowledge access, cooperation) alongside real challenges (inequality, vulnerability, cultural homogenisation concerns).</p>'},
{lb:'Key terms and examples to remember',dr:dQ1,ht:'<p>Must-know terms and examples: <b>WTO (1995)</b>; <b>MNCs</b> (Shell, Dangote Group); <b>2008 financial crisis</b>; <b>COVID-19 supply chain disruption (2020)</b>; <b>Nollywood/Afrobeats</b>; <b>brain drain</b>; <b>AfCFTA (2021)</b>.</p>'},
{lb:'Lessons for Nigeria',dr:dQ1,ht:'<p>Nigeria\'s experience &mdash; deep OPEC/oil market integration, a thriving globally-connected creative sector, extensive diaspora remittances, and ongoing AfCFTA debates &mdash; illustrates both globalisation\'s real opportunities and its real risks for a developing economy.</p>'},
{lb:'Final exam tips',dr:dQ1,ht:'<p>Always identify the <b>specific dimension</b> of globalisation relevant to a question, use named, dated examples throughout, and conclude by weighing globalisation\'s genuine benefits against its genuine costs and risks.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What are the four main dimensions of globalisation covered in this topic?","o":["Economic, cultural, political and technological","Only cultural and religious","Only economic and military","Only political and agricultural"],"a":0,"w":"The four main dimensions of globalisation are economic, cultural, political and technological."},{"q":"Which institution, founded in 1995, drives global trade liberalisation?","o":["The Commonwealth","The United Nations","OPEC","The World Trade Organisation (WTO)"],"a":3,"w":"The World Trade Organisation (WTO), founded in 1995, drives global trade liberalisation."},{"q":"Which 2008 event illustrates the risks of global financial integration?","o":["The Nigerian Civil War","The Rwandan genocide","The global financial crisis","The Sahel coup wave"],"a":2,"w":"The 2008 global financial crisis illustrates the risks of global financial integration."},{"q":"Which 2020 event illustrates global supply chain vulnerability?","o":["The annulled 1993 election","The COVID-19 pandemic","The Rwandan genocide","The 2008 financial crisis"],"a":1,"w":"The COVID-19 pandemic (2020) illustrates global supply chain vulnerability."},{"q":"Which Nigerian cultural exports illustrate cultural globalisation?","o":["Nollywood and Afrobeats","Only Nigeria's currency","Only Nigeria's military","Only Nigeria's oil exports"],"a":0,"w":"Nollywood and Afrobeats illustrate cultural globalisation from Nigeria."},{"q":"Which term describes the emigration of skilled Nigerian professionals abroad?","o":["\"Trade liberalisation\"","\"Brain drain\"","\"Cultural exchange\"","\"Economic diplomacy\""],"a":1,"w":"\"Brain drain\" describes the emigration of skilled Nigerian professionals abroad."},{"q":"Which trade agreement illustrates Nigeria's ongoing engagement with economic globalisation?","o":["The Ezulwini Consensus","The Commonwealth Charter","AfCFTA","The Treaty of Lagos"],"a":2,"w":"AfCFTA illustrates Nigeria's ongoing engagement with economic globalisation."},{"q":"What should a strong WAEC essay conclusion on globalisation weigh?","o":["Only positive facts about globalisation","Genuine benefits against genuine costs and risks","Only negative facts about globalisation","Facts unrelated to globalisation entirely"],"a":1,"w":"A strong conclusion should weigh globalisation's genuine benefits against its genuine costs and risks."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];

(function(){var p=new URLSearchParams(location.search),total=QS.length;var only=(p.get('only')||'').split(',').map(Number).filter(function(n){return n>=1&&n<=total;});window.abcQuestionNumbers=null;if(only.length){var nums=[],keep=[];QS.forEach(function(x,i){if(only.indexOf(i+1)>=0){nums.push(i+1);keep.push(x);}});QS.length=0;keep.forEach(function(x){QS.push(x);});window.abcQuestionNumbers=nums;var lbl=document.querySelector('#sb .sb-lbl');if(lbl){lbl.innerHTML='This lesson: '+nums.length+' of '+total+' questions &middot; <a href="'+location.pathname+'" style="color:inherit">show all</a>';}}var q=parseInt(p.get('q'),10);if(q>=1){var idx=window.abcQuestionNumbers?window.abcQuestionNumbers.indexOf(q):q-1;if(idx>=0&&idx<QS.length)qi=idx;}})();
// Keep each question's real number in the sidebar when only some are shown
if(window.abcQuestionNumbers){var _renderAll=render;render=function(){_renderAll.apply(this,arguments);var n=window.abcQuestionNumbers;document.querySelectorAll('#sb .qn').forEach(function(el,i){if(n[i])el.textContent='Q'+n[i];});};}

(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
