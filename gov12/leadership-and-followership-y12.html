<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});

var QS=[
{ey:'Q1 \u2022 Government • Y12',ti:'Meaning of Leadership',su:'Understand what leadership means in a political context.',steps:[
  {lb:'What is leadership?',dr:dQ1,ht:'<p>Leadership is the ability to guide, direct, motivate and influence a group of people toward achieving common goals. In politics, it refers to the capacity of office-holders to steer their society toward development and stability.</p>'},
  {lb:'Leadership vs mere holding of office',dr:dQ1,ht:'<p>Holding a political office does not automatically make someone a leader in the fullest sense; true leadership requires vision, competence, and the ability to inspire and mobilise people toward shared goals, beyond simply occupying a position.</p>'},
  {lb:'Sources of political leadership',dr:dQ1,ht:'<p>Political leaders can emerge through various paths: democratic election, hereditary succession (traditional rulers), military takeover, or appointment. The legitimacy and effectiveness of leadership can depend heavily on which path was followed.</p>'},
  {lb:'Why leadership matters for development',dr:dQ1,ht:'<p>Effective leadership is widely regarded as crucial to national development — leaders set direction, allocate resources, build institutions, and can either advance or hinder progress depending on their competence and integrity.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Leadership in a political context is best defined as:","o":["The ability to guide, direct, motivate and influence people toward achieving common goals","Simply holding any government office regardless of performance","A hereditary title with no practical function","A purely ceremonial role with no real influence"],"a":0,"w":"Leadership is the capacity to guide, direct, motivate and influence people toward achieving shared goals, going beyond simply occupying an office."},{"q":"Why is merely holding office not the same as being a true leader?","o":["Because office-holders automatically become leaders regardless of ability","Because true leadership requires vision, competence and the ability to inspire people, beyond just occupying a position","Because leadership has nothing to do with office at all","Because only traditional rulers can be considered leaders"],"a":1,"w":"True leadership requires vision, competence and the capacity to inspire and mobilise people — qualities that go beyond simply holding an office."},{"q":"Which of these is a recognised path through which political leaders can emerge?","o":["Only through winning a sporting competition","Only through inheriting wealth with no political process involved","Democratic election, hereditary succession, military takeover, or appointment","Only through religious ordination"],"a":2,"w":"Political leaders can emerge through election, hereditary succession, military takeover, or appointment — each carrying different implications for legitimacy."},{"q":"Why is effective leadership considered crucial to national development?","o":["Because only economic factors, not leadership, determine development","Because leadership has no real impact on a country's development","Because development happens automatically regardless of leadership quality","Because leaders set direction, allocate resources and build institutions that shape a country's progress"],"a":3,"w":"Effective leadership shapes development by setting direction, allocating resources and building the institutions that either advance or hinder progress."},{"q":"How can the path through which a leader emerges affect their legitimacy?","o":["Democratically elected leaders often enjoy stronger legitimacy than those who seized power by military takeover","The path to power never affects a leader's legitimacy in any way","Only military leaders are ever considered legitimate","Hereditary succession always guarantees the highest legitimacy"],"a":0,"w":"The path to power matters for legitimacy — democratic election is generally seen as conferring stronger popular legitimacy than seizing power through a coup."},{"q":"Which best distinguishes 'leadership' from simply 'governing'?","o":["They are identical concepts with no meaningful difference","Leadership involves vision and the ability to inspire people, while merely governing can be purely administrative and uninspired","Governing always requires more vision than leadership","Leadership only applies to traditional rulers, never elected officials"],"a":1,"w":"Leadership implies vision and the capacity to inspire, which goes beyond the purely administrative aspects of simply governing or holding office."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government • Y12',ti:'Qualities of Good Leadership',su:'Explore the key qualities associated with effective political leadership.',steps:[
  {lb:'Vision and foresight',dr:dQ2,ht:'<p>Good leaders have a clear vision for their society\'s future and the foresight to plan and implement policies that address both immediate needs and long-term development goals.</p>'},
  {lb:'Integrity and accountability',dr:dQ2,ht:'<p>Effective leaders demonstrate honesty, transparency, and willingness to be held accountable for their decisions, building public trust and reducing corruption.</p>'},
  {lb:'Competence and decisiveness',dr:dQ2,ht:'<p>Good leaders possess the necessary knowledge, skills and judgement to make sound decisions, and the decisiveness to act promptly, especially during crises.</p>'},
  {lb:'Empathy and inclusiveness',dr:dQ2,ht:'<p>Effective leaders show genuine concern for the welfare of all citizens, including minorities and the vulnerable, and work to build inclusive coalitions rather than favouring narrow personal, ethnic or political interests.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which quality allows a leader to plan for both immediate needs and long-term development?","o":["Vision and foresight","Corruption tolerance","Ethnic favouritism","Indecisiveness"],"a":0,"w":"Vision and foresight enable leaders to plan effectively for both immediate needs and long-term national development goals."},{"q":"Why is integrity considered an important leadership quality?","o":["It has no real impact on public trust or governance","It builds public trust and helps reduce corruption","It only matters for traditional rulers, not elected leaders","It guarantees a leader will never be criticised"],"a":1,"w":"Integrity builds public trust in leadership and helps reduce the corruption that can undermine governance and development."},{"q":"Decisiveness is particularly important for a leader especially:","o":["Only when there is no urgent issue to address","Only during ceremonial public events","During crises requiring prompt action","Never, since indecisiveness is always preferable"],"a":2,"w":"Decisiveness is especially valuable during crises, when prompt, well-judged action can be critical."},{"q":"How does empathy/inclusiveness manifest in good political leadership?","o":["Excluding minority groups from all consideration","Favouring only the leader's own ethnic or political group","Ignoring the needs of vulnerable citizens entirely","Genuine concern for the welfare of all citizens, including minorities and the vulnerable"],"a":3,"w":"Empathetic, inclusive leadership shows genuine concern for all citizens' welfare, including minorities and vulnerable groups, rather than narrow favouritism."},{"q":"Which combination best describes the qualities of good leadership discussed?","o":["Vision, integrity, competence, decisiveness, and empathy/inclusiveness","Only wealth and personal ambition","Only military strength with no other qualities needed","Only hereditary status with no personal qualities required"],"a":0,"w":"Good leadership combines vision, integrity, competence, decisiveness and empathy/inclusiveness — not simply wealth, force or inherited status."},{"q":"Why might a leader who is highly competent but lacks integrity still fail as a leader?","o":["Because competence alone is irrelevant to leadership success","Because lack of integrity can erode public trust and enable corruption, undermining long-term effectiveness despite technical competence","Because integrity has no bearing on public trust","Because competent but corrupt leaders always succeed regardless"],"a":1,"w":"Even a technically competent leader can fail if lack of integrity erodes public trust and enables corruption, undermining sustained effectiveness."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government • Y12',ti:'Meaning of Followership',su:'Understand followership as an active, essential complement to leadership.',steps:[
  {lb:'What is followership?',dr:dQ3,ht:'<p>Followership refers to the role citizens play in supporting, cooperating with, and holding accountable those in leadership positions. Good followership is not passive obedience but active, constructive engagement with governance.</p>'},
  {lb:'Active vs passive followership',dr:dQ3,ht:'<p>Active followers engage critically — supporting good policies, questioning poor ones, participating in civic life, and voting thoughtfully. Passive followership, by contrast, simply accepts whatever leaders decide without engagement or scrutiny.</p>'},
  {lb:'Followership and democracy',dr:dQ3,ht:'<p>In a democracy, followership includes exercising the right to vote, participating in civic organisations, engaging in public debate, and holding leaders accountable through legitimate means such as elections, courts, and civil society.</p>'},
  {lb:'Interdependence of leadership and followership',dr:dQ3,ht:'<p>Leadership and followership are interdependent: even the best leaders cannot achieve good governance without engaged, responsible followers, and even well-organised citizens need capable leadership to translate their efforts into results.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{"q":"Followership is best defined as:","o":["The role citizens play in supporting, cooperating with, and holding accountable those in leadership positions","Blind, unquestioning obedience to any leader","A role reserved only for members of the ruling party","A purely passive, disengaged relationship with government"],"a":0,"w":"Followership is the active role citizens play in supporting, engaging with and holding leaders accountable, not passive or blind obedience."},{"q":"What distinguishes 'active' followership from 'passive' followership?","o":["Active followers never support any government policy","Active followers engage critically and hold leaders accountable; passive followers simply accept decisions without scrutiny","Passive followers always oppose their leaders","There is no meaningful difference between the two"],"a":1,"w":"Active followers engage critically, question poor decisions and hold leaders accountable, while passive followers accept decisions without scrutiny."},{"q":"Which of these is an example of followership in a democracy?","o":["Blindly supporting every government decision without question","Refusing to ever participate in any civic activity","Exercising the right to vote thoughtfully and participating in civic organisations","Avoiding all forms of political engagement"],"a":2,"w":"Thoughtful voting and participation in civic organisations are key examples of active followership in a democracy."},{"q":"Why are leadership and followership described as 'interdependent'?","o":["Because the two concepts have no real connection to each other","Because leadership can achieve everything alone with no need for followers","Because followership can succeed entirely without any leadership","Because even the best leaders need engaged followers, and organised citizens need capable leadership to achieve results"],"a":3,"w":"Leadership and followership are interdependent — effective governance requires both capable leaders and engaged, responsible citizens working together."},{"q":"How can followers hold leaders accountable through legitimate means?","o":["Through elections, courts, and civil society engagement","Only through violent uprising","Only by ignoring leaders entirely","Only through unconstitutional means"],"a":0,"w":"Legitimate accountability mechanisms for followers include elections, the court system, and civil society engagement."},{"q":"Why is good followership important for governance, even with excellent leadership in place?","o":["Because followership has no real bearing on governance outcomes","Because engaged followers provide feedback, participation and accountability that even the best leaders need to govern effectively","Because excellent leadership alone always guarantees good governance regardless of citizen engagement","Because followers have no legitimate role in a functioning democracy"],"a":1,"w":"Even excellent leadership benefits from engaged followers who provide feedback, participate constructively and hold leaders accountable, supporting effective governance."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government • Y12',ti:'Qualities of Good Followership',su:'Explore the qualities associated with responsible citizenship/followership.',steps:[
  {lb:'Civic responsibility',dr:dQ4,ht:'<p>Good followers understand and fulfil their civic duties — obeying just laws, paying taxes honestly, and participating in activities (like elections and community initiatives) that support collective wellbeing.</p>'},
  {lb:'Critical engagement',dr:dQ4,ht:'<p>Good followers do not accept leadership decisions uncritically; they engage thoughtfully with public issues, seek accurate information, and express informed opinions through legitimate channels.</p>'},
  {lb:'Constructive accountability',dr:dQ4,ht:'<p>Good followers hold leaders accountable constructively — through voting, peaceful protest, petitions, and civil society engagement — rather than through violence or destructive, unlawful means.</p>'},
  {lb:'Patriotism balanced with vigilance',dr:dQ4,ht:'<p>Good followership combines genuine patriotism and support for national institutions with healthy vigilance against abuse of power, avoiding both blind loyalty and destructive cynicism.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{"q":"Civic responsibility, as a quality of good followership, includes:","o":["Obeying just laws, paying taxes honestly, and participating in elections and community initiatives","Avoiding all forms of civic participation entirely","Refusing to pay any taxes regardless of law","Ignoring all community initiatives"],"a":0,"w":"Civic responsibility involves fulfilling duties like obeying just laws, honest tax payment, and participating in elections and community efforts."},{"q":"'Critical engagement' as a followership quality means citizens should:","o":["Accept every leadership decision without question","Engage thoughtfully with public issues and seek accurate information rather than accepting decisions uncritically","Avoid seeking any information about public issues","Refuse to ever express any opinion on governance"],"a":1,"w":"Critical engagement means thoughtfully assessing public issues and seeking accurate information, rather than blindly accepting decisions."},{"q":"Which of these is an example of 'constructive accountability' by followers?","o":["Ignoring leadership entirely with no engagement","Violent uprising against any unpopular decision","Voting, peaceful protest, and petitions","Destructive, unlawful actions against government property"],"a":2,"w":"Constructive accountability uses legitimate channels like voting, peaceful protest and petitions, rather than violence or unlawful destruction."},{"q":"Good followership balances patriotism with:","o":["Indifference to how power is exercised","Total blind loyalty with no scrutiny of leaders at all","Complete cynicism and rejection of all national institutions","Healthy vigilance against abuse of power"],"a":3,"w":"Good followership combines genuine patriotism with healthy vigilance against potential abuse of power, avoiding both blind loyalty and destructive cynicism."},{"q":"Why is 'blind loyalty' considered a weakness rather than a strength in followership?","o":["Because it can enable leaders to abuse power without facing appropriate scrutiny or accountability","Because loyalty to one's country is always harmful","Because blind loyalty always improves governance outcomes","Because followers should never support their government in any way"],"a":0,"w":"Blind, uncritical loyalty can enable leadership abuses to go unchecked, which is why healthy scrutiny is considered an important followership quality."},{"q":"Which best summarises the overall qualities of good followership?","o":["Total obedience with no engagement or scrutiny whatsoever","Civic responsibility, critical engagement, constructive accountability, and balanced patriotism with vigilance","Complete disengagement from all civic and political life","Violent resistance to all forms of government authority"],"a":1,"w":"Good followership combines civic responsibility, critical engagement, constructive accountability and a balance of patriotism with vigilance."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government • Y12',ti:'Nigerian Leadership: Historical Examples and Lessons',su:'Examine examples of leadership in Nigeria\'s political history.',steps:[
  {lb:'Nationalist-era leaders',dr:dQ5,ht:'<p>Leaders like Nnamdi Azikiwe, Obafemi Awolowo and Ahmadu Bello are often studied for their roles in the independence struggle and early nation-building, each bringing distinct visions for Nigeria\'s development, alongside the regional/ethnic bases they represented.</p>'},
  {lb:'Military leadership examples',dr:dQ5,ht:'<p>Nigeria\'s military era produced a range of leadership styles — from Gowon\'s role in preserving national unity during the Civil War to Abacha\'s widely criticised authoritarian rule marked by human rights abuses and corruption, illustrating both constructive and destructive leadership.</p>'},
  {lb:'Obasanjo and democratic transition leadership',dr:dQ5,ht:'<p>Olusegun Obasanjo\'s leadership is notable both for overseeing Nigeria\'s 1979 military-to-civilian handover and later, as an elected President (1999–2007), for steering Nigeria\'s return to sustained civilian democratic governance.</p>'},
  {lb:'Lessons from Nigerian leadership history',dr:dQ5,ht:'<p>Nigeria\'s leadership history illustrates that legitimacy, integrity, and inclusiveness matter greatly for effective governance, and that leadership failures (corruption, authoritarianism, ethnic favouritism) have repeatedly undermined national development and unity.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{"q":"Which nationalist-era leaders are commonly studied for their roles in Nigeria's independence struggle?","o":["Nnamdi Azikiwe, Obafemi Awolowo, and Ahmadu Bello","Only foreign colonial administrators","Only military leaders from the 1990s","Only Fourth Republic presidents"],"a":0,"w":"Azikiwe, Awolowo and Ahmadu Bello are the standard nationalist-era leaders studied for their roles in Nigeria's independence struggle and early nation-building."},{"q":"Which military leader's era is widely criticised for authoritarian rule, corruption and human rights abuses?","o":["General Yakubu Gowon","General Sani Abacha","Olusegun Obasanjo","Herbert Macaulay"],"a":1,"w":"General Sani Abacha's era is widely criticised for authoritarian rule, significant human rights abuses and corruption."},{"q":"Olusegun Obasanjo is notable for which two distinct leadership roles in Nigerian history?","o":["Only leading the independence movement in the 1950s","Only serving as a traditional ruler","Overseeing the 1979 military-to-civilian handover, and later serving as elected President (1999–2007)","Only serving in the Second Republic as a civilian politician"],"a":2,"w":"Obasanjo is notable both for overseeing the 1979 military-to-civilian transition and for later serving as Nigeria's elected President from 1999 to 2007."},{"q":"What key lesson does Nigeria's leadership history illustrate about governance?","o":["Ethnic favouritism has never affected Nigerian governance","Leadership quality has no bearing on Nigeria's development outcomes","Only military leadership has ever succeeded in Nigeria","Legitimacy, integrity and inclusiveness matter greatly, while failures like corruption and authoritarianism undermine development"],"a":3,"w":"Nigeria's history shows that legitimacy, integrity and inclusiveness are crucial, while leadership failures like corruption have repeatedly undermined development."},{"q":"Which quality distinguishes constructive from destructive leadership examples in Nigerian history?","o":["Constructive leaders generally show greater integrity and inclusiveness, while destructive ones are marked by authoritarianism and corruption","There is no meaningful distinction between any Nigerian leaders","All Nigerian leaders have shown identical leadership qualities","Only elected leaders can ever be considered constructive"],"a":0,"w":"Constructive leadership in Nigerian history is generally associated with greater integrity and inclusiveness, while destructive leadership is marked by authoritarianism and corruption."},{"q":"Why is it useful for WAEC students to study specific Nigerian leadership examples?","o":["Because Nigerian history has no relevance to understanding leadership concepts","Because concrete historical examples illustrate abstract leadership qualities and their real consequences for governance","Because only foreign leadership examples are relevant to WAEC Government","Because leadership qualities cannot be illustrated with real examples"],"a":1,"w":"Concrete Nigerian examples help illustrate abstract leadership concepts (vision, integrity, inclusiveness) and demonstrate their real-world governance consequences."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government • Y12',ti:'Leadership Failures and Their Consequences',su:'Understand how poor leadership can harm a nation\'s development.',steps:[
  {lb:'Corruption and misallocation of resources',dr:dQ6,ht:'<p>Poor leadership marked by corruption diverts public resources away from development projects, health, and education, directly harming citizens\' welfare and undermining trust in government.</p>'},
  {lb:'Authoritarianism and suppression',dr:dQ6,ht:'<p>Leaders who suppress dissent, restrict press freedom, and concentrate power without accountability tend to weaken democratic institutions and can provoke instability or resistance over time.</p>'},
  {lb:'Ethnic/regional favouritism',dr:dQ6,ht:'<p>Leadership that favours a particular ethnic or regional group in appointments and resource allocation can deepen national divisions, fuel resentment among excluded groups, and threaten national unity.</p>'},
  {lb:'Long-term consequences of leadership failure',dr:dQ6,ht:'<p>Repeated leadership failures can produce cycles of instability, economic underdevelopment, brain drain (skilled citizens emigrating), and diminished public trust in political institutions generally.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{"q":"How does corruption under poor leadership typically harm a country?","o":["It diverts public resources from development, health and education, harming citizens' welfare","It always increases funding for public services with no downside","It has no measurable effect on national development","It only affects the leader personally, with no wider harm"],"a":0,"w":"Corruption diverts resources away from essential development, health and education spending, directly harming citizens' welfare."},{"q":"What is a common consequence of authoritarian leadership that suppresses dissent and press freedom?","o":["Immediate and total national stability with no risks","Weakened democratic institutions and potential instability or resistance over time","Automatic strengthening of democratic institutions","No effect on institutions or stability whatsoever"],"a":1,"w":"Authoritarian suppression of dissent and press freedom tends to weaken democratic institutions and can eventually provoke instability or resistance."},{"q":"How can ethnic/regional favouritism in leadership harm national unity?","o":["It has no effect on how citizens view their government","It always strengthens national unity with no risk","It can deepen divisions and fuel resentment among excluded groups, threatening unity","It automatically benefits all ethnic groups equally"],"a":2,"w":"Favouring one ethnic or regional group can deepen divisions and fuel resentment among excluded groups, posing a real threat to national unity."},{"q":"Which of these is a recognised long-term consequence of repeated leadership failure?","o":["Complete immunity from any further governance problems","Guaranteed permanent economic prosperity regardless of governance quality","Automatic elimination of all future leadership challenges","Brain drain, as skilled citizens emigrate seeking better opportunities"],"a":3,"w":"Repeated leadership failures can drive brain drain, as skilled citizens emigrate in search of better governance and opportunities elsewhere."},{"q":"Why does diminished public trust matter as a consequence of leadership failure?","o":["Because it undermines citizens' willingness to cooperate with and support government institutions generally","Because public trust has no bearing on how governance functions","Because diminished trust automatically improves government efficiency","Because trust in institutions is irrelevant to national development"],"a":0,"w":"Diminished public trust undermines citizens' cooperation with and support for government institutions, which is important for effective governance."},{"q":"Which best summarises the overall consequences of poor political leadership?","o":["Always improved national development regardless of leadership quality","Corruption, weakened institutions, deepened divisions, and long-term instability/underdevelopment","No measurable consequences of any kind","Only positive effects on citizens' welfare"],"a":1,"w":"Poor leadership tends to produce corruption, weakened institutions, deepened social divisions, and long-term instability or underdevelopment."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government • Y12',ti:'The Relationship Between Leadership and Followership',su:'Explore how leadership and followership shape each other in practice.',steps:[
  {lb:'Leaders shape followership behaviour',dr:dQ7,ht:'<p>The quality of leadership can shape how citizens engage with governance — transparent, accountable leaders tend to encourage active, constructive followership, while corrupt or repressive leaders can breed cynicism or apathy.</p>'},
  {lb:'Followers shape leadership behaviour',dr:dQ7,ht:'<p>Engaged, vigilant followers can encourage better leadership by holding leaders accountable through elections, civil society pressure and public scrutiny, while passive followership can enable leaders to act with less restraint.</p>'},
  {lb:'Mutual responsibility for governance outcomes',dr:dQ7,ht:'<p>Good governance is best understood as a shared responsibility — neither excellent leadership alone nor engaged followership alone is sufficient; both must work together for a society to achieve development and stability.</p>'},
  {lb:'Breaking cycles of poor governance',dr:dQ7,ht:'<p>Improving governance often requires simultaneous efforts: developing better leadership (through merit-based selection, accountability mechanisms) and cultivating more engaged, informed followership (through civic education and strengthened institutions).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{"q":"How can the quality of leadership shape citizens' followership behaviour?","o":["Transparent, accountable leaders tend to encourage active, constructive followership, while corrupt leaders can breed apathy or cynicism","Leadership quality has no effect on how citizens engage with governance","Corrupt leadership always increases citizen engagement and trust","Only followership shapes leadership, never the reverse"],"a":0,"w":"Leadership quality influences citizen engagement — transparent, accountable leaders tend to foster active followership, while corruption can breed cynicism or apathy."},{"q":"How can engaged followers encourage better leadership?","o":["By ignoring leaders entirely with no engagement whatsoever","By holding leaders accountable through elections, civil society pressure and public scrutiny","By always supporting leaders unconditionally regardless of performance","By having no influence on leadership behaviour at all"],"a":1,"w":"Vigilant, engaged followers can encourage better leadership by holding leaders accountable through elections, civil society and public scrutiny."},{"q":"Why is good governance best understood as a 'shared responsibility'?","o":["Because only followership matters, with leadership being irrelevant","Because only leadership matters, with followership being irrelevant","Because neither excellent leadership alone nor engaged followership alone is sufficient — both must work together","Because governance quality depends entirely on external foreign factors"],"a":2,"w":"Good governance requires both capable leadership and engaged followership working together; neither alone is sufficient for development and stability."},{"q":"What two simultaneous efforts are often needed to break cycles of poor governance?","o":["Focusing solely on foreign aid with no attention to leadership or followership","Eliminating elections entirely and relying solely on military rule","Ignoring leadership development and focusing only on economic growth","Developing better leadership (merit-based selection, accountability) and cultivating engaged followership (civic education)"],"a":3,"w":"Breaking poor governance cycles typically requires developing better leadership through merit and accountability, alongside cultivating engaged followership through civic education."},{"q":"How does passive followership potentially enable poor leadership behaviour?","o":["It can allow leaders to act with less restraint, since there is less scrutiny or accountability from citizens","It always forces leaders to act with greater accountability","It has no effect on leadership behaviour whatsoever","It automatically improves the quality of governance"],"a":0,"w":"Passive followership, by reducing scrutiny and accountability pressure, can enable leaders to act with less restraint or responsibility."},{"q":"Which best captures the overall relationship between leadership and followership?","o":["They are entirely unrelated and independent factors in governance","They are mutually reinforcing — each shapes and is shaped by the other in determining governance outcomes","Only leadership influences followership, with no reverse influence","Only followership influences leadership, with no reverse influence"],"a":1,"w":"Leadership and followership are mutually reinforcing, with each shaping and being shaped by the other in determining overall governance outcomes."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government • Y12',ti:'Improving Leadership and Followership in Nigeria',su:'Consider reforms and approaches to strengthen both leadership and followership.',steps:[
  {lb:'Strengthening leadership selection',dr:dQ8,ht:'<p>Proposals for improving leadership include: strengthening internal party democracy so competent candidates emerge (rather than godfather-selected ones), improving electoral integrity, and strengthening institutions (judiciary, anti-corruption agencies) that hold leaders accountable.</p>'},
  {lb:'Civic education for better followership',dr:dQ8,ht:'<p>Improving followership involves civic education in schools (including through subjects like Government/Civic Education), voter education campaigns, and strengthening media/civil society capacity to inform citizens accurately.</p>'},
  {lb:'Institutional reforms',dr:dQ8,ht:'<p>Broader institutional reforms — judicial independence, electoral commission credibility (INEC reforms), anti-corruption enforcement, and freedom of information — support both better leadership emergence and more effective followership accountability mechanisms.</p>'},
  {lb:'The role of young Nigerians',dr:dQ8,ht:'<p>Nigeria\'s young population is increasingly engaging in political discourse (e.g. through social media and movements like #EndSARS), representing a potential force for improved followership and future leadership renewal, provided this energy is channelled constructively.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{"q":"Which reform is proposed to improve the emergence of competent political leaders?","o":["Strengthening internal party democracy so candidates emerge on merit rather than through godfather selection","Eliminating all elections permanently","Returning exclusively to hereditary succession for all political offices","Banning all political parties from operating"],"a":0,"w":"Strengthening internal party democracy is proposed to allow more competent, merit-based candidates to emerge rather than godfather-selected ones."},{"q":"How can civic education improve followership in Nigeria?","o":["By discouraging any citizen participation in political life","By teaching citizens (e.g. through school Government/Civic Education) to engage critically and participate effectively in governance","By teaching citizens to accept all leadership decisions without question","By eliminating the need for any voter education"],"a":1,"w":"Civic education, including school subjects like Government/Civic Education, helps citizens engage critically and participate effectively as informed followers."},{"q":"Which institutional reform supports both better leadership and stronger followership accountability?","o":["Removing all anti-corruption agencies","Eliminating the judiciary entirely","Strengthening judicial independence and anti-corruption enforcement","Banning all forms of public scrutiny of government"],"a":2,"w":"Strengthening judicial independence and anti-corruption enforcement supports both the emergence of better leadership and citizens' ability to hold leaders accountable."},{"q":"Which recent Nigerian movement illustrates increased youth political engagement?","o":["The Nigerian Civil War of 1967-70","The Willink Commission of 1957","The First Republic's NPC-NCNC coalition","The #EndSARS movement"],"a":3,"w":"The #EndSARS movement is a notable recent example of increased youth political engagement and activism in Nigeria."},{"q":"What is necessary for young Nigerians' increased political engagement to translate into improved governance?","o":["This energy needs to be channelled constructively into sustained civic and political participation","No further action is needed, as engagement alone automatically fixes governance","Youth engagement should be actively discouraged by government","Only older generations should be involved in political reform efforts"],"a":0,"w":"For increased youth engagement to improve governance, this energy needs to be sustained and channelled constructively into ongoing civic and political participation."},{"q":"Which best summarises the overall approach to improving leadership and followership together?","o":["Focusing only on leadership reform with no attention to followership","Combining leadership selection reforms, civic education, and institutional strengthening, with youth engagement as a key emerging factor","Focusing only on followership with no attention to leadership quality","Relying solely on external foreign intervention with no domestic reform"],"a":1,"w":"A comprehensive approach combines leadership selection reforms, civic education for followership, and institutional strengthening, with youth engagement as an important emerging factor."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government • Y12',ti:'WAEC Exam Preparation — Leadership and Followership',su:'Practise WAEC-style questions on leadership and followership.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions: (1) Define leadership and followership clearly. (2) State qualities of each. (3) Discuss their interdependence. (4) Use Nigerian historical examples (nationalist leaders, military era, Fourth Republic). (5) Discuss consequences of failure and proposals for improvement.</p>'},
  {lb:'Common WAEC question patterns',dr:dQ9,ht:'<p>Typical questions: \'Discuss the qualities of good leadership\', \'Explain the meaning and importance of followership in a democracy\', \'Examine the relationship between leadership and followership\', \'Account for the effects of poor leadership on national development\'.</p>'},
  {lb:'Key facts to memorise',dr:dQ9,ht:'<p>Leadership qualities: vision, integrity, competence, decisiveness, empathy. Followership qualities: civic responsibility, critical engagement, constructive accountability. Nigerian examples: Azikiwe/Awolowo/Bello (nationalist), Gowon/Abacha (military), Obasanjo (transition + elected). #EndSARS = youth engagement example.</p>'},
  {lb:'Common mistakes to avoid',dr:dQ9,ht:'<p>Avoid treating followership as merely passive obedience — WAEC expects an understanding of active, constructive followership. Always discuss leadership and followership as interdependent, not isolated concepts. Give specific Nigerian examples rather than only abstract definitions.</p>'},
