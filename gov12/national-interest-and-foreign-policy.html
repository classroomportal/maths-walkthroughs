var ST={};
function shuffleMC(o){
  if(!o||!o.options)return o;
  var idxs=[];for(var k=0;k<o.options.length;k++){idxs.push(k);}
  for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=idxs[i];idxs[i]=idxs[j];idxs[j]=tmp;}
  var newOptions=[];for(var m=0;m<idxs.length;m++){newOptions.push(o.options[idxs[m]]);}
  var newCorrect=idxs.indexOf(o.correct);
  var o2={};for(var key in o){if(o.hasOwnProperty(key))o2[key]=o[key];}
  o2.options=newOptions;o2.correct=newCorrect;
  return o2;
}
function tryItMC(genFn){var wrapped=function(){return shuffleMC(genFn());};var id='t'+Math.random().toString(36).slice(2);var o=wrapped();ST[id]={o:o,genFn:wrapped,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'

    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;

    }
    return;
  }
});

{lb:'National interest as a justification',dr:dQ1,ht:'<p>Governments frequently invoke <b>"national interest"</b> to justify controversial policies &mdash; from signing unpopular trade deals to deploying troops abroad &mdash; making it as much a <b>rhetorical/political tool</b> as an objective analytical concept.</p>'},

{lb:'The international system and leadership',dr:dQ1,ht:'<p>The broader <b>international system</b> (e.g. the balance of power, alliance structures) and the <b>personality of individual leaders</b> also shape foreign policy &mdash; explaining, for instance, how the end of the Cold War (1991) reshaped nearly every state\'s foreign policy options.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"How does geography shape a state's foreign policy priorities?","o":["Geography has no effect on foreign policy at all","Only landlocked states have any foreign policy","Only island states have any foreign policy","Its size, location and neighbours shape its regional priorities"],"a":3,"w":"A state's geography — size, location and neighbours — shapes its regional foreign policy priorities."},{"q":"How does Nigeria's geography specifically shape its foreign policy?","o":["Nigeria's geography only matters for its domestic policy","Nigeria has no distinctive geographic features relevant to foreign policy","Nigeria's geography is identical to every other African state","Its position as West Africa's largest economy and population shapes its regional leadership role"],"a":3,"w":"Nigeria's position as West Africa's largest economy and population shapes its regional leadership role."},{"q":"How does Nigeria's oil wealth affect its foreign policy?","o":["It only affects Nigeria's domestic budget","It has no effect on foreign policy at all","It guarantees permanent economic stability with no risks","It funds diplomatic and peacekeeping activities, but creates vulnerability to price swings"],"a":3,"w":"Nigeria's oil wealth funds its diplomatic and peacekeeping activities, but also creates vulnerability to global price swings."},{"q":"How can domestic public opinion act as a determinant of foreign policy?","o":["It has no influence on any country's foreign policy","It always overrides all other determinants completely","It only matters in non-democratic states","It influences which policies a government feels able to pursue, especially in a democracy"],"a":3,"w":"Public opinion influences which foreign policies a government feels able to pursue, especially in a democracy."},{"q":"What broader factor, alongside individual leaders' personalities, shapes foreign policy?","o":["Only a country's official language","The international system, such as the balance of power","Only a country's national anthem","Only a country's flag design"],"a":1,"w":"The broader international system, such as the balance of power, shapes foreign policy alongside individual leaders' personalities."},{"q":"What global event in 1991 reshaped nearly every state's foreign policy options?","o":["World War I","The founding of the United Nations","The Berlin Conference","The end of the Cold War"],"a":3,"w":"The end of the Cold War in 1991 reshaped nearly every state's foreign policy options."},{"q":"Why might democratic leaders face constraints on foreign policy that non-democratic leaders do not?","o":["There is no difference between the two systems","Non-democratic leaders never make foreign policy decisions","Democratic leaders have no foreign policy at all","They face electoral accountability for unpopular international commitments"],"a":3,"w":"Democratic leaders face electoral accountability for unpopular international commitments, unlike many non-democratic leaders."},{"q":"Which of these is a domestic (rather than external) determinant of foreign policy?","o":["Another country's leader's personality","A distant international treaty Nigeria has not signed","The global balance of power","Public opinion and type of government"],"a":3,"w":"Public opinion and type of government are domestic determinants of foreign policy."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov • International Relations',ti:'National Interest and Global/Collective Interest',su:'Explore the tension between pursuing national interest and cooperating for shared global goals.',steps:[
{lb:'The tension explained',dr:dQ2,ht:'<p>States often face a tension between pursuing their own <b>narrow national interest</b> and cooperating for <b>collective global goals</b> &mdash; such as climate change action, global health security, or international peacekeeping &mdash; which may require short-term national sacrifice for longer-term shared benefit.</p>'},
{lb:'Climate change as a case study',dr:dQ2,ht:'<p><b>Climate change</b> illustrates this tension clearly: reducing carbon emissions may impose economic costs on individual states (including oil-producing states like Nigeria), even though the benefits of climate action are shared globally &mdash; creating incentives for states to "free-ride" on others\' efforts.</p>'},
{lb:'Peacekeeping as collective action',dr:dQ2,ht:'<p>Nigeria\'s extensive contribution to <b>ECOMOG and UN peacekeeping</b> missions represents a case where pursuing regional/collective stability (an arguably enlightened, longer-term national interest) has been prioritised over narrow short-term cost-saving.</p>'},
{lb:'Enlightened self-interest',dr:dQ2,ht:'<p>Many scholars argue that pursuing collective/global goals can itself reflect <b>"enlightened self-interest"</b> &mdash; the idea that a state\'s own long-term interest is best served by supporting stable, cooperative international arrangements, rather than viewing national and global interest as always opposed.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What tension is often discussed between national interest and global cooperation?","o":["National interest always perfectly matches global interest","Global interest never affects any single state","There is no tension between the two concepts","Narrow national interest versus collective global goals"],"a":3,"w":"There is a recognised tension between pursuing narrow national interest and cooperating for collective global goals."},{"q":"Which global issue is used as a case study for this tension?","o":["The choice of national languages","The colour of a country's currency","Climate change","The design of national flags"],"a":2,"w":"Climate change is used as a case study illustrating the tension between national and global interest."},{"q":"What incentive does the climate change case create for individual states?","o":["An incentive to increase emissions as much as possible","An incentive to \"free-ride\" on others' emission-reduction efforts","An incentive to leave the United Nations","An incentive to abolish all international cooperation"],"a":1,"w":"Climate change creates an incentive for states to \"free-ride\" on other states' emission-reduction efforts."},{"q":"What does Nigeria's extensive contribution to ECOMOG/UN peacekeeping illustrate?","o":["A policy focused only on Nigeria's immediate borders","A complete rejection of all international cooperation","An unwillingness to ever contribute troops abroad","Prioritising regional/collective stability over narrow short-term cost-saving"],"a":3,"w":"Nigeria's extensive peacekeeping contributions illustrate prioritising regional stability over narrow short-term cost-saving."},{"q":"What term describes the idea that a state's own long-term interest is served by supporting cooperative international arrangements?","o":["\"Total isolationism\"","\"Unconditional surrender\"","\"Pure Realism\" only","\"Enlightened self-interest\""],"a":3,"w":"\"Enlightened self-interest\" describes the idea that long-term national interest is served by supporting cooperative arrangements."},{"q":"What view do scholars of \"enlightened self-interest\" reject?","o":["That states have any interests at all","That climate change is a real phenomenon","That international cooperation ever benefits any state","That national and global interest are always necessarily opposed"],"a":3,"w":"Scholars of \"enlightened self-interest\" reject the view that national and global interest are always necessarily opposed."},{"q":"Why might reducing carbon emissions impose short-term costs specifically on oil-producing states like Nigeria?","o":["Only landlocked states are affected by climate policy","Their economies are more dependent on fossil fuel revenue","Oil-producing states have no economy at all","Carbon emissions have no cost implications for any state"],"a":1,"w":"Oil-producing states like Nigeria have economies more dependent on fossil fuel revenue, making emission reductions more costly for them."},{"q":"What overall lesson does this topic teach about national interest?","o":["Global interest is always identical to any one state's interest","National interest can never involve any cooperation with other states","It can sometimes be best served through cooperation rather than narrow self-interest alone","States should always ignore global problems entirely"],"a":2,"w":"This topic teaches that national interest can sometimes be best served through cooperation, not narrow self-interest alone."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov • International Relations',ti:'Instruments for Pursuing National Interest',su:'Explain the key instruments states use to pursue their national interest.',steps:[
{lb:'Diplomacy as the primary instrument',dr:dQ1,ht:'<p><b>Diplomacy</b> &mdash; negotiation through ambassadors and diplomatic missions &mdash; is generally the primary, most frequently used instrument for pursuing national interest, since it is peaceful, relatively low-cost, and preserves future relationships.</p>'},
{lb:'Economic instruments',dr:dQ1,ht:'<p><b>Economic instruments</b> include trade agreements, foreign aid, investment, and economic sanctions &mdash; used both to build goodwill (aid, trade deals) and to pressure other states into changing behaviour (sanctions), as ECOWAS has done against several recent coup regimes.</p>'},
{lb:'Military instruments',dr:dQ1,ht:'<p><b>Military instruments</b> &mdash; from the mere existence of armed forces as a deterrent, to peacekeeping contributions, to (rarely) direct use of force &mdash; remain a state\'s ultimate instrument for protecting core/vital national interests when other means fail.</p>'},
{lb:'Soft power and cultural instruments',dr:dQ1,ht:'<p><b>Soft power instruments</b> &mdash; cultural influence, education exchanges, international broadcasting &mdash; increasingly supplement traditional instruments; Nigeria\'s global cultural influence through <b>Nollywood and Afrobeats</b> is often cited as an example of soft power advancing national prestige and interest without any use of force.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which instrument for pursuing national interest is generally considered the primary, most frequently used one?","o":["Diplomacy","Cultural exchange only","Economic sanctions only","Military force"],"a":0,"w":"Diplomacy is generally the primary, most frequently used instrument for pursuing national interest."},{"q":"Why is diplomacy generally preferred over other instruments?","o":["It is always more expensive than military force","It is peaceful, relatively low-cost, and preserves future relationships","It always fails to achieve any results","It cannot be used between neighbouring states"],"a":1,"w":"Diplomacy is generally preferred because it is peaceful, low-cost, and preserves future relationships."},{"q":"Which of these is an economic instrument for pursuing national interest?","o":["Economic sanctions","A purely ceremonial state visit","A cultural exchange programme only","A national anthem"],"a":0,"w":"Economic sanctions are an economic instrument for pursuing national interest."},{"q":"Which organisation has used economic sanctions against several recent coup regimes in West Africa?","o":["ECOWAS","NATO","The World Trade Organisation","UNESCO"],"a":0,"w":"ECOWAS has used economic sanctions against several recent coup regimes in West Africa."},{"q":"What role does the mere existence of armed forces play as an instrument of national interest?","o":["Only a ceremonial role with no strategic value","No role at all in pursuing national interest","A role limited entirely to internal policing","A deterrent against potential threats"],"a":3,"w":"The mere existence of armed forces plays a deterrent role as an instrument of national interest."},{"q":"When is military force generally considered a state's \"ultimate\" instrument?","o":["When protecting core/vital interests after other means have failed","Only in peacetime, never during a crisis","As the very first option in any foreign policy situation","Only when a state has no diplomats available"],"a":0,"w":"Military force is generally considered a state's ultimate instrument when protecting core/vital interests after other means fail."},{"q":"Which Nigerian cultural phenomena are cited as examples of soft power advancing national interest?","o":["Nigeria's oil pipelines","Nollywood and Afrobeats","Nigeria's navy and army only","Nigeria's electoral commission"],"a":1,"w":"Nollywood and Afrobeats are cited as examples of Nigeria's soft power advancing its national interest."},{"q":"What distinguishes soft power instruments from traditional hard power instruments?","o":["Soft power always involves direct military deployment","Soft power has no relationship to national interest at all","Soft power attracts and persuades through culture rather than coercing through force","Soft power is identical to economic sanctions"],"a":2,"w":"Soft power instruments attract and persuade through culture, rather than coercing through force like hard power."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov • International Relations',ti:'Case Study: Nigeria\'s National Interest and Oil',su:'Examine how oil wealth has shaped Nigeria\'s national interest and foreign policy.',steps:[
{lb:'Oil as a national interest anchor',dr:dQ2,ht:'<p>Since the 1970s oil boom, <b>petroleum revenue</b> has anchored Nigeria\'s national interest calculations, funding government budgets, diplomatic activity, and military capacity, while also making Nigeria\'s economy and foreign policy options highly sensitive to <b>global oil price fluctuations</b>.</p>'},
{lb:'OPEC membership',dr:dQ2,ht:'<p>Nigeria\'s membership of <b>OPEC (Organization of the Petroleum Exporting Countries)</b>, joined in 1971, reflects a foreign policy instrument used to coordinate with other oil-producing states to influence global oil prices in pursuit of Nigeria\'s economic national interest.</p>'},
{lb:'The Niger Delta and domestic-international linkage',dr:dQ2,ht:'<p>Oil-related national interest is complicated by domestic <b>Niger Delta grievances</b> &mdash; environmental damage, revenue-sharing disputes, and militancy (e.g. MEND) &mdash; showing how a resource central to Nigeria\'s foreign policy also generates significant <b>internal political challenges</b>.</p>'},
{lb:'Diversification debates',dr:dQ2,ht:'<p>Repeated oil price shocks (2016, 2020) have intensified domestic debate about the need to <b>diversify Nigeria\'s economy</b> away from oil dependency, seen by many policymakers as essential to Nigeria\'s longer-term national interest and international economic resilience.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Since which decade has petroleum revenue anchored Nigeria's national interest calculations?","o":["The 1990s","The 1970s","The 2010s","The 1930s"],"a":1,"w":"Petroleum revenue has anchored Nigeria's national interest calculations since the 1970s oil boom."},{"q":"What does petroleum revenue fund in Nigeria's national interest pursuit?","o":["Only Nigeria's currency printing","Only school uniforms","Government budgets, diplomatic activity and military capacity","Only local government elections"],"a":2,"w":"Petroleum revenue funds government budgets, diplomatic activity and military capacity."},{"q":"In which year did Nigeria join OPEC?","o":["1971","1975","1999","1960"],"a":0,"w":"Nigeria joined OPEC in 1971."},{"q":"What does OPEC stand for?","o":["Organisation for the Prevention of Economic Crisis","Organization of the Petroleum Exporting Countries","Organisation of Pan-African Economic Cooperation","Organisation for Peace and Economic Cooperation"],"a":1,"w":"OPEC stands for the Organization of the Petroleum Exporting Countries."},{"q":"Why does Nigeria coordinate with OPEC member states?","o":["To influence global oil prices in pursuit of its economic national interest","To form a military alliance against other regions","To eliminate all oil production entirely","To abolish its own oil industry"],"a":0,"w":"Nigeria coordinates with OPEC to influence global oil prices in pursuit of its economic national interest."},{"q":"What domestic grievance complicates Nigeria's oil-related national interest?","o":["A dispute over Nigeria's national language","A currency dispute with the CFA franc zone","A dispute with Ghana over cocoa exports","Niger Delta grievances over environmental damage and revenue-sharing"],"a":3,"w":"Niger Delta grievances over environmental damage and revenue-sharing complicate Nigeria's oil-related national interest."},{"q":"Which militant group is associated with Niger Delta grievances over oil?","o":["ECOMOG","Boko Haram","MEND (Movement for the Emancipation of the Niger Delta)","IPOB"],"a":2,"w":"MEND is associated with Niger Delta grievances over oil-related issues."},{"q":"What debate have repeated oil price shocks (2016, 2020) intensified in Nigeria?","o":["The need to increase oil dependency further","The need to leave OPEC immediately","The need to diversify Nigeria's economy away from oil dependency","The need to abolish the Nigerian currency"],"a":2,"w":"Oil price shocks in 2016 and 2020 intensified debate about diversifying Nigeria's economy away from oil dependency."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov • International Relations',ti:'Case Study: Nigeria\'s National Interest through Regional Leadership',su:'Examine how Nigeria pursues national interest through ECOWAS and AU leadership.',steps:[
{lb:'Africa as the centrepiece',dr:dQ1,ht:'<p>Nigeria\'s foreign policy has declared <b>Africa as the "centrepiece"</b> of its external relations since independence in 1960, viewing regional leadership and stability as directly serving Nigeria\'s own long-term security and prestige-based national interest.</p>'},
{lb:'Funding regional institutions',dr:dQ1,ht:'<p>Nigeria has historically been among the <b>largest financial contributors</b> to both ECOWAS and the AU, and provided the bulk of troops and funding for <b>ECOMOG</b> peacekeeping interventions in Liberia and Sierra Leone &mdash; substantial national investment justified as serving Nigeria\'s regional-stability interest.</p>'},
{lb:'Seeking a permanent UN Security Council seat',dr:dQ1,ht:'<p>Nigeria has long advocated, through the AU\'s <b>Ezulwini Consensus</b>, for a permanent African seat on an expanded UN Security Council &mdash; widely seen as Nigeria pursuing <b>international prestige</b> as a distinct category of national interest.</p>'},
{lb:'Costs and criticisms of regional leadership',dr:dQ1,ht:'<p>Critics within Nigeria periodically question whether the domestic <b>financial cost</b> of extensive regional leadership (peacekeeping, aid to neighbours) is proportionate to the benefits, especially during periods of domestic economic hardship &mdash; illustrating tension between national and regional interest even within Nigeria\'s own policy.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What has Nigeria declared the \"centrepiece\" of its foreign policy since independence?","o":["Asia","Europe","The Middle East","Africa"],"a":3,"w":"Nigeria has declared Africa the \"centrepiece\" of its foreign policy since independence in 1960."},{"q":"What kind of contributor has Nigeria historically been to ECOWAS and the AU?","o":["One of the largest financial contributors","A contributor only in name, with no actual funding","An opponent of both organisations","A non-member of both organisations"],"a":0,"w":"Nigeria has historically been among the largest financial contributors to both ECOWAS and the AU."},{"q":"What did Nigeria provide the bulk of for ECOMOG's interventions in Liberia and Sierra Leone?","o":["Only diplomatic statements with no material support","Troops and funding","Nothing at all","Only weapons sold to both sides"],"a":1,"w":"Nigeria provided the bulk of troops and funding for ECOMOG's interventions in Liberia and Sierra Leone."},{"q":"Which AU position does Nigeria support in seeking a permanent UN Security Council seat?","o":["The Ezulwini Consensus","The Berlin Conference","The Treaty of Lagos","The Atlantic Charter"],"a":0,"w":"Nigeria supports the Ezulwini Consensus in seeking a permanent African UN Security Council seat."},{"q":"What category of national interest is Nigeria's pursuit of a UN Security Council seat mainly seen as an example of?","o":["Peripheral cultural interest","Domestic agricultural policy","Core territorial security only","International prestige"],"a":3,"w":"Nigeria's pursuit of a UN Security Council seat is mainly seen as an example of pursuing international prestige."},{"q":"What domestic criticism is sometimes raised about Nigeria's extensive regional leadership role?","o":["That regional leadership has no costs at all","Whether its financial cost is proportionate to the benefits, especially during economic hardship","That Nigeria has never contributed anything to any regional body","That Nigeria should immediately leave the AU and ECOWAS entirely"],"a":1,"w":"Critics question whether the financial cost of regional leadership is proportionate to the benefits, especially during economic hardship."},{"q":"What does the domestic debate over regional leadership costs illustrate?","o":["That all Nigerians always agree on foreign policy","That Nigeria has no national interest at all","Tension between national and regional interest even within Nigeria's own policy","That regional leadership is entirely free of any cost"],"a":2,"w":"This domestic debate illustrates the tension between national and regional interest even within Nigeria's own policy."},{"q":"Since which year has Nigeria pursued an Africa-centred foreign policy?","o":["2015","1975","1999","1960"],"a":3,"w":"Nigeria has pursued an Africa-centred foreign policy since independence in 1960."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov • International Relations',ti:'National Interest and Morality in Foreign Policy',su:'Explore the tension between pursuing national interest and acting on moral/ethical principles.',steps:[
{lb:'The Realist view: interest over morality',dr:dQ2,ht:'<p><b>Realist</b> theorists argue foreign policy should be guided primarily by <b>national interest</b>, not abstract morality, since states operating in an anarchic international system cannot always afford the luxury of pure ethical idealism without risking their own security.</p>'},
{lb:'The Liberal/idealist view: morality matters',dr:dQ2,ht:'<p>By contrast, <b>Liberal or idealist</b> perspectives argue that foreign policy should be shaped significantly by <b>moral principles</b> &mdash; human rights, international law, humanitarian concern &mdash; even where this involves some cost to narrow national interest.</p>'},
{lb:'A real-world tension: human rights vs trade',dr:dQ2,ht:'<p>This tension appears concretely when states must decide whether to maintain profitable <b>trade relationships</b> with governments accused of serious human rights abuses, or to prioritise ethical concerns at potential economic cost &mdash; a dilemma many states, including Nigeria, have faced in different contexts.</p>'},
{lb:'A middle-ground view',dr:dQ2,ht:'<p>Many scholars argue for a <b>middle-ground</b> position: that morality and national interest are not always opposed, and that a reputation for principled, consistent behaviour can itself become a valuable component of a state\'s long-term national interest and international credibility.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"According to Realist theorists, what should primarily guide foreign policy?","o":["Only the personal preferences of diplomats","Only religious teachings","National interest, not abstract morality","Only public opinion polls"],"a":2,"w":"Realist theorists argue national interest, not abstract morality, should primarily guide foreign policy."},{"q":"Why do Realists argue states cannot always afford pure ethical idealism?","o":["Ethical idealism is banned by the UN Charter","States operate in an anarchic system and cannot risk their own security","Morality is illegal under international law","States have no interests of their own at all"],"a":1,"w":"Realists argue that operating in an anarchic system means states cannot risk their security through pure ethical idealism."},{"q":"Which perspective argues foreign policy should be shaped significantly by moral principles?","o":["No perspective considers morality relevant","The pure Realist perspective only","The colonial perspective","The Liberal/idealist perspective"],"a":3,"w":"The Liberal/idealist perspective argues foreign policy should be shaped significantly by moral principles."},{"q":"What kind of dilemma illustrates the tension between morality and national interest?","o":["Whether to choose a national flag design","Whether to hold elections at all","Whether to maintain trade with governments accused of human rights abuses","Whether to have an army"],"a":2,"w":"The dilemma of trading with human-rights-abusing governments illustrates the tension between morality and national interest."},{"q":"What middle-ground view do many scholars propose about morality and national interest?","o":["That morality and interest are always identical with no distinction","That they are not always opposed, and principled behaviour can serve long-term interest","That morality should never be considered under any circumstances","That national interest should never be considered under any circumstances"],"a":1,"w":"Many scholars propose a middle-ground view that morality and national interest are not always opposed."},{"q":"What can a reputation for principled, consistent behaviour become, according to the middle-ground view?","o":["A purely domestic concern with no international relevance","A valuable component of a state's long-term national interest","An entirely irrelevant factor in foreign policy","A guaranteed economic cost with no benefit"],"a":1,"w":"A reputation for principled behaviour can become a valuable component of long-term national interest, per the middle-ground view."},{"q":"Which international relations concept most directly opposes the Realist view described here?","o":["Diplomacy alone, with no theoretical content","Liberalism/idealism, emphasising cooperation and morality","Federalism","Colonialism"],"a":1,"w":"Liberalism/idealism, emphasising cooperation and morality, most directly contrasts with the pure Realist view."},{"q":"Why is this morality-versus-interest debate relevant for WAEC essays on national interest?","o":["It has no relevance to WAEC Government essays","It replaces the need for factual examples entirely","It only applies to essays about religion","It shows a sophisticated understanding of competing IR perspectives"],"a":3,"w":"This debate shows a sophisticated understanding of competing IR perspectives, valuable for strong WAEC essays."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov • International Relations',ti:'WAEC Exam Preparation — National Interest and Foreign Policy',su:'Practise WAEC-style questions on national interest and foreign policy.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on national interest: (1) Define the term clearly. (2) Distinguish <b>core, secondary and peripheral</b> interests where relevant. (3) Give <b>named, dated examples</b>, ideally Nigerian. (4) Evaluate tensions (national vs global interest, interest vs morality) where relevant to the question.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "Explain the meaning and categories of national interest." / "Discuss the determinants of a state\'s foreign policy." / "Examine the role of oil in shaping Nigeria\'s national interest." / "Discuss the relationship between national interest and morality in foreign policy."</p>'},
{lb:'Key vocabulary for essays',dr:dQ1,ht:'<p>Key vocabulary: <b>national interest</b>, <b>core/vital interest</b>, <b>secondary interest</b>, <b>peripheral interest</b>, <b>determinants</b>, <b>enlightened self-interest</b>, <b>Realism</b>, <b>Liberalism</b>, <b>soft power</b>, <b>OPEC</b>. Precise, correctly-spelled terms strengthen WAEC answers significantly.</p>'},
{lb:'Using Nigerian examples throughout',dr:dQ1,ht:'<p>The strongest WAEC essays on this topic consistently apply concepts to <b>Nigeria\'s own experience</b> &mdash; oil/OPEC, ECOWAS/AU leadership, the Ezulwini Consensus &mdash; rather than discussing national interest only in abstract, theoretical terms.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on national interest?","o":["Skip straight to a conclusion","Define the term clearly","List unrelated dates with no explanation","Immediately give a personal opinion with no facts"],"a":1,"w":"A WAEC essay on national interest should begin by clearly defining the term."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Discuss the determinants of a state's foreign policy.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\"","\"Describe the layout of Lagos.\""],"a":0,"w":"\"Discuss the determinants of a state's foreign policy\" is a typical WAEC-style question on this topic."},{"q":"Which three categories of national interest should a strong essay distinguish where relevant?","o":["Only economic and military, with no other type","Core, secondary and peripheral","Only core and peripheral, with no middle category","Only domestic and foreign, with no other distinction"],"a":1,"w":"A strong essay should distinguish core, secondary and peripheral interests where relevant."},{"q":"Which international organisation should be mentioned when discussing Nigeria's oil-related national interest?","o":["OPEC","NATO","UNESCO","The Commonwealth"],"a":0,"w":"OPEC should be mentioned when discussing Nigeria's oil-related national interest."},{"q":"Which term describes the idea that cooperation can itself serve long-term national interest?","o":["\"Pure isolationism\"","\"Enlightened self-interest\"","\"Unconditional surrender\"","\"Total assimilation\""],"a":1,"w":"\"Enlightened self-interest\" describes the idea that cooperation can itself serve long-term national interest."},{"q":"Why do the strongest WAEC essays on this topic consistently use Nigerian examples?","o":["They demonstrate the ability to apply theory to Nigeria's own concrete experience","It replaces the need for any theoretical content","Nigerian examples are the only ones permitted by WAEC","Nigeria is the only country ever studied in WAEC Government"],"a":0,"w":"The strongest essays use Nigerian examples to demonstrate applying theory to concrete, local experience."},{"q":"Which AU position should be mentioned when discussing Nigeria's pursuit of international prestige?","o":["The Berlin Conference","The Treaty of Westphalia","The Atlantic Charter","The Ezulwini Consensus"],"a":3,"w":"The Ezulwini Consensus should be mentioned when discussing Nigeria's pursuit of international prestige."},{"q":"What should a strong WAEC essay evaluate where relevant to the question asked?","o":["Tensions such as national interest versus global interest or morality","Only Nigeria's flag and anthem","Nothing beyond a simple definition","Only positive facts with no critical evaluation"],"a":0,"w":"A strong essay should evaluate relevant tensions, such as national interest versus global interest or morality."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov • International Relations',ti:'Mixed Questions — National Interest and Foreign Policy',su:'Integrated revision across the meaning, categories and pursuit of national interest.',steps:[
{lb:'Summary of key concepts',dr:dQ2,ht:'<p>National interest encompasses <b>core, secondary and peripheral</b> concerns, shaped by determinants including geography, economy, domestic politics and the international system, pursued through instruments from <b>diplomacy to military force</b>, and increasingly balanced against global cooperation and moral concerns.</p>'},
{lb:'Key terms and examples to remember',dr:dQ2,ht:'<p>Must-know terms and examples: <b>core/secondary/peripheral interest</b>; <b>Hans Morgenthau</b> (Realism); <b>OPEC</b> (joined 1971); <b>Ezulwini Consensus</b>; <b>ECOMOG</b>; <b>enlightened self-interest</b>; <b>soft power</b> (Nollywood/Afrobeats).</p>'},
