function shuffleMC(o){
  if(!o||!o.options)return o;
  var idxs=[];for(var k=0;k<o.options.length;k++){idxs.push(k);}
  for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=idxs[i];idxs[i]=idxs[j];idxs[j]=tmp;}
  var newOptions=[];for(var m=0;m<idxs.length;m++){newOptions.push(o.options[idxs[m]]);}
  var newCorrect=idxs.indexOf(o.correct);
  var o2={};for(var key in o){if(o.hasOwnProperty(key))o2[key]=o[key];}
  o2.options=newOptions;o2.correct=newCorrect;
  return o2;
}
function tryItMC(genFn){var wrapped=function(){return shuffleMC(genFn());};var id='t'+Math.random().toString(36).slice(2);var o=wrapped();ST[id]={o:o,genFn:wrapped,mc:true};return buildTryMC(id,o);}

var QS=[
{ey:'Q1 \u2022 Gov \u2022 International Relations',ti:'What is International Relations?',su:'Define international relations and describe its nature as a field of study.',steps:[
{lb:'Meaning of International Relations',dr:dQ1,ht:'<p><b>International Relations (IR)</b> is the academic and practical study of interactions between states and other actors across national boundaries &mdash; diplomacy, trade, conflict, cooperation and international law. It emerged as a formal university discipline after the First World War (1914-18), when the scale of the war\'s destruction convinced scholars like Alfred Zimmern, who held the first Chair of International Politics at Aberystwyth in 1919, that understanding the causes of war and the conditions for peace deserved serious systematic study rather than being left to diplomats\' instinct alone.</p>'},
{lb:'Nature of the discipline',dr:dQ1,ht:'<p>IR is <b>interdisciplinary</b>, drawing on political science, economics, history, law, sociology and even psychology to explain global events &mdash; for example, economics explains trade disputes, while psychology helps explain why leaders miscalculate in crises such as the Cuban Missile Crisis (1962). IR studies both <b>conflict</b> (wars, arms races, rivalries such as the Cold War between the USA and USSR, 1947-1991) and <b>cooperation</b> (trade blocs, alliances, treaties such as the Paris Agreement on climate change, 2015). No single theory fully explains international behaviour, which is why IR scholars use multiple competing perspectives side by side.</p>'},
{lb:'Scope of IR',dr:dQ1,ht:'<p>The scope of IR includes: <b>diplomacy and foreign policy</b> (how states communicate and set goals); <b>international organisations</b> (the UN, founded 1945; the AU, founded 2002; ECOWAS, founded 1975); <b>international law</b> (treaties, the International Court of Justice at The Hague); <b>global economics and trade</b> (the World Trade Organisation, IMF, World Bank); <b>security and conflict studies</b> (war, terrorism, nuclear weapons); and increasingly <b>global issues</b> such as climate change, pandemics (e.g. COVID-19, 2020), cybercrime and mass migration, which cross borders and cannot be solved by any single state acting alone.</p>'},
{lb:'Why IR matters',dr:dQ1,ht:'<p>Studying IR helps citizens and leaders understand <b>global interdependence</b> &mdash; how a decision made in one country (e.g. an interest-rate rise in the USA, or a conflict such as Russia\'s invasion of Ukraine in 2022) can affect fuel prices, food prices and security decisions in Nigeria and across West Africa. It informs foreign policy decisions and equips WAEC students to critically analyse international events reported in the news, from AU peace missions to global trade disputes, rather than treating world affairs as distant and irrelevant.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"In which period did International Relations emerge as a formal university discipline?","o":["During the 16th century","Only after the year 2000","Before any wars had occurred","After the First World War (1914-18)"],"a":4,"w":"IR emerged as a formal discipline after WWI, notably with the first Chair of International Politics established at Aberystwyth in 1919."},{"q":"Which discipline helps explain psychological factors behind crises like the Cuban Missile Crisis (1962)?","o":["Chemistry","Astronomy","Biology","Psychology"],"a":4,"w":"Psychology helps explain why leaders miscalculate in high-pressure crises such as the Cuban Missile Crisis."},{"q":"Which of these is an example of long-running international conflict studied in IR?","o":["The founding of the WTO","The Cold War between the USA and USSR (1947-1991)","The signing of a trade treaty","The Paris Agreement of 2015"],"a":2,"w":"The Cold War (1947-1991) between the USA and USSR is a classic example of sustained international conflict studied in IR."},{"q":"Which international organisation was founded in 1945, central to the scope of IR?","o":["The World Trade Organisation","ECOWAS","The African Union","The United Nations"],"a":4,"w":"The United Nations was founded in 1945, at the end of the Second World War."},{"q":"Which global issue increasingly falls within the scope of IR because it crosses borders and needs multi-state cooperation?","o":["A neighbourhood's park maintenance","Climate change","A single country's local elections","A school's internal exam schedule"],"a":2,"w":"Climate change is a global issue that crosses borders and cannot be solved by any single state acting alone."},{"q":"How can a decision made in one country illustrate \"global interdependence\" for Nigeria?","o":["Global interdependence only applies to wealthy countries","Decisions in other countries never affect Nigeria","Only Nigerian decisions ever affect other countries","An event like Russia's invasion of Ukraine (2022) can affect fuel and food prices in Nigeria"],"a":4,"w":"Events like Russia's 2022 invasion of Ukraine show how decisions elsewhere can directly affect fuel and food prices in Nigeria."},{"q":"Which body oversees disputes under international law, based at The Hague?","o":["The Nigerian Supreme Court","The International Court of Justice","ECOWAS Parliament","The WAEC examination board"],"a":2,"w":"The International Court of Justice, based at The Hague, is the key body for international legal disputes."},{"q":"Why do IR scholars use multiple competing theories rather than just one?","o":["Multiple theories are used purely for entertainment","Only one theory has ever been proposed","WAEC forbids using more than one theory","No single theory fully explains all international behaviour"],"a":4,"w":"No single theory fully explains international behaviour, so IR scholars draw on multiple perspectives."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 International Relations',ti:'Actors in International Relations — States',su:'Explain the role of states as the primary actors in international relations.',steps:[
{lb:'States as primary actors',dr:dQ2,ht:'<p><b>States (nation-states)</b> are traditionally the primary and most important actors in IR. Each possesses <b>sovereignty</b>, a defined territory, a government and a population &mdash; the four elements confirmed by the <b>Montevideo Convention (1933)</b>. There are currently 193 UN member states, ranging from vast countries like Russia (over 17 million km&sup2;) to tiny microstates like Nauru (21 km&sup2;), yet in international law each is formally treated as a sovereign equal.</p>'},
{lb:'Sovereignty and legal rights',dr:dQ2,ht:'<p><b>Sovereignty</b> gives a state the legal right to conduct its own foreign policy, sign treaties, and defend its territorial integrity without external interference. The modern state system is often traced to the <b>Peace of Westphalia (1648)</b>, which ended the Thirty Years\' War in Europe and established the principle that rulers, not the Pope or Holy Roman Emperor, held supreme authority within their own borders &mdash; a principle Nigeria and every other UN member relies on today.</p>'},
{lb:'How states interact',dr:dQ2,ht:'<p>States interact through <b>diplomacy</b> (Nigeria, for example, maintains embassies and High Commissions in over 100 countries), trade agreements (such as the African Continental Free Trade Area, AfCFTA, which came into force in 2021), military alliances (like NATO, founded 1949), and participation in international organisations such as the UN, AU and ECOWAS. These channels allow states to pursue national goals peacefully most of the time, reserving force as a last resort.</p>'},
{lb:'Inequality of power among states',dr:dQ2,ht:'<p>Not all states are equal in <b>practical power</b>, even though they are formally equal in law. <b>Great powers</b> such as the USA, China, Russia, the UK and France hold permanent seats (and a veto) on the UN Security Council, giving them disproportionate influence compared with smaller states like Togo or The Gambia. This gap between <b>formal legal equality</b> and <b>actual political/military power</b> is a recurring theme WAEC essays should address when discussing the state as an actor in IR.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What are the primary actors traditionally studied in International Relations?","o":["Sports federations","States (nation-states)","Individuals only","Universities"],"a":2,"w":"States (nation-states) are traditionally the primary actors studied in International Relations."},{"q":"Which international agreement first codified the four elements of statehood in 1933?","o":["The UN Charter","The Geneva Convention","The Treaty of Versailles","The Montevideo Convention"],"a":4,"w":"The Montevideo Convention (1933) codified population, territory, government and sovereignty as the four elements of statehood."},{"q":"Which historical agreement is often credited with founding the modern sovereign state system?","o":["The Atlantic Charter (1941)","The Berlin Conference (1884-85)","The Peace of Westphalia (1648)","The Treaty of Lagos (1975)"],"a":3,"w":"The Peace of Westphalia (1648) established the principle of state sovereignty that underlies the modern state system."},{"q":"Which African free trade agreement came into force in 2021, illustrating how states interact economically?","o":["The African Continental Free Trade Area (AfCFTA)","NATO","The Treaty of Versailles","The Peace of Westphalia"],"a":1,"w":"The African Continental Free Trade Area (AfCFTA) came into force in 2021 to boost intra-African trade."},{"q":"Which body gives certain great powers a formal veto, illustrating inequality of power among states?","o":["The UN Security Council","ECOWAS Parliament","The WAEC examination board","The African Union Assembly"],"a":1,"w":"The UN Security Council gives its five permanent members (USA, China, Russia, UK, France) a formal veto."},{"q":"How many member states currently belong to the United Nations, illustrating the scale of the state system?","o":["Around 193","Around 300","Around 50","Around 100"],"a":1,"w":"There are currently 193 UN member states, of hugely varying size and power."},{"q":"What key distinction should a strong WAEC essay draw when discussing states as actors in IR?","o":["All states are always equally powerful in practice","Only wealthy states are ever sovereign","The gap between formal legal equality and actual political/military power","There is no distinction to draw at all"],"a":3,"w":"A strong essay should note the gap between formal legal equality and actual differences in political and military power."},{"q":"Which military alliance, founded in 1949, illustrates how states interact through formal alliances?","o":["NATO","AfCFTA","The African Union","ECOWAS"],"a":1,"w":"NATO, founded in 1949, is a classic example of a formal military alliance between states."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 International Relations',ti:'Non-State Actors in International Relations',su:'Identify and explain the role of IGOs, NGOs, MNCs and other non-state actors.',steps:[
{lb:'Intergovernmental Organisations (IGOs)',dr:dQ1,ht:'<p><b>Intergovernmental Organisations (IGOs)</b> are formed by states to pursue common goals and are increasingly important actors in modern IR. Examples include the <b>United Nations</b> (193 members, founded 1945), the <b>African Union</b> (55 members, founded 2002, replacing the OAU of 1963), and <b>ECOWAS</b> (15 West African members, founded by the Treaty of Lagos in 1975). IGOs provide forums for negotiation, peacekeeping (e.g. ECOWAS\'s ECOMOG force in Liberia, 1990, and Sierra Leone, 1997) and collective decision-making that no single state could achieve alone.</p>'},
{lb:'Non-Governmental Organisations (NGOs)',dr:dQ1,ht:'<p><b>Non-Governmental Organisations (NGOs)</b> operate across borders on humanitarian, human rights or development issues without direct government control. <b>Amnesty International</b> (founded 1961) campaigns on human rights worldwide; the <b>International Committee of the Red Cross</b> (founded 1863) provides humanitarian relief in conflict zones, including in northeastern Nigeria during the Boko Haram insurgency. NGOs influence public opinion and sometimes shape state policy through advocacy, reporting and direct humanitarian action.</p>'},
{lb:'Multinational Corporations (MNCs)',dr:dQ1,ht:'<p><b>Multinational Corporations (MNCs)</b> &mdash; such as Shell (operating in Nigeria\'s oil sector since the 1930s), the Dangote Group (Africa\'s largest industrial conglomerate), and global firms like Apple or Toyota &mdash; wield significant economic power in IR through investment, trade, employment and lobbying. Their decisions on where to invest or withdraw capital can affect a country\'s economy as much as many government policies, which is why some scholars argue MNCs now rival smaller states in practical influence.</p>'},
{lb:'Other non-state actors',dr:dQ1,ht:'<p>Other important non-state actors include <b>terrorist organisations</b> (e.g. Boko Haram in Nigeria\'s Northeast, and ISWAP), which challenge state authority and complicate international security cooperation across the Lake Chad Basin; transnational <b>advocacy networks</b> (e.g. global climate movements); and increasingly influential <b>individuals</b> (such as philanthropists or tech billionaires) whose private resources can shape global health, development or communication in ways once reserved for states alone.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which IGO was founded in 2002, replacing the earlier Organisation of African Unity (founded 1963)?","o":["ECOWAS","The African Union","NATO","The United Nations"],"a":2,"w":"The African Union was founded in 2002, replacing the OAU which had existed since 1963."},{"q":"Which ECOWAS peacekeeping force intervened in Liberia's civil war starting in 1990?","o":["The UN Peacekeeping Force","ECOMOG","NATO","The AU Standby Force"],"a":2,"w":"ECOMOG, ECOWAS's peacekeeping force, intervened in Liberia's civil war from 1990."},{"q":"Which NGO, founded in 1961, campaigns on human rights issues worldwide?","o":["Boko Haram","The Dangote Group","Shell","Amnesty International"],"a":4,"w":"Amnesty International, founded in 1961, is a leading global human rights NGO."},{"q":"Which organisation, founded in 1863, provides humanitarian relief in conflict zones such as Nigeria's Northeast?","o":["The African Union","NATO","The International Committee of the Red Cross","AfCFTA"],"a":3,"w":"The International Committee of the Red Cross (founded 1863) provides humanitarian relief in conflict zones, including Nigeria's Northeast."},{"q":"Which Nigerian company is described as Africa's largest industrial conglomerate, illustrating MNC influence?","o":["Amnesty International","Boko Haram","The Dangote Group","ECOWAS"],"a":3,"w":"The Dangote Group is described as Africa's largest industrial conglomerate, wielding major economic influence."},{"q":"Which non-state armed group has significantly affected security cooperation in Nigeria's Northeast and the wider Lake Chad Basin?","o":["The Dangote Group","Boko Haram","The Red Cross","Shell"],"a":2,"w":"Boko Haram and its offshoot ISWAP have significantly affected security cooperation across the Lake Chad Basin."},{"q":"Why might some scholars argue MNCs now rival smaller states in practical influence?","o":["MNCs have no economic influence at all","Only governments can ever affect national economies","MNCs are legally identical to states","Their investment and withdrawal decisions can affect a country's economy as much as many government policies"],"a":4,"w":"MNC investment or withdrawal decisions can affect a national economy as much as many government policies."},{"q":"Besides organisations, which other kind of non-state actor has grown in influence, such as through philanthropy or technology?","o":["Only military generals","Only the United Nations Secretary-General","Influential individuals, such as philanthropists or tech billionaires","Only elected heads of state"],"a":3,"w":"Influential individuals, such as philanthropists or tech entrepreneurs, are an increasingly important type of non-state actor."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 International Relations',ti:'Key Concepts in International Relations',su:'Explain sovereignty, national interest, power and security as core IR concepts.',steps:[
{lb:'Sovereignty',dr:dQ2,ht:'<p><b>Sovereignty</b> is the supreme authority of a state over its own territory and affairs, free from external interference. It has two aspects: <b>internal sovereignty</b> (supreme authority over people and territory within the state, e.g. Nigeria\'s authority to ban IPOB in 2017) and <b>external sovereignty</b> (independence and equality among other states in the international system). Sovereignty is not absolute in practice &mdash; global trade rules, human rights treaties and international pressure all place real limits on how freely states can act.</p>'},
{lb:'National interest',dr:dQ2,ht:'<p><b>National interest</b> refers to the goals and ambitions a state pursues in its international dealings, typically grouped into: <b>security</b> (protecting borders and citizens), <b>economic prosperity</b> (trade, investment, jobs), and <b>prestige</b> (international standing and influence). Nigeria\'s national interest, for example, includes protecting its oil revenue, securing the Northeast against insurgency, and maintaining leadership status within ECOWAS and the AU. Foreign policy decisions are almost always justified publicly by reference to national interest.</p>'},
{lb:'Power',dr:dQ2,ht:'<p><b>Power</b> in IR is the capacity of a state to influence others\' behaviour. Political scientist <b>Joseph Nye</b> distinguished <b>hard power</b> (military and economic strength used to coerce or reward, e.g. sanctions or military threats) from <b>soft power</b> (the ability to attract and persuade through culture, values and diplomacy, e.g. how Nollywood and Afrobeats have boosted Nigeria\'s international image and influence without any use of force).</p>'},
{lb:'Security',dr:dQ2,ht:'<p><b>Security</b> is the protection of a state and its citizens from threats. Traditionally this meant <b>military defence</b> against invasion, but modern IR increasingly studies <b>non-traditional security</b> &mdash; economic instability (currency crises), environmental change (droughts contributing to conflict in the Sahel), pandemics (COVID-19, 2020), and cyber threats (attacks on banking or government systems), all of which can threaten a state\'s stability as seriously as an armed attack.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What are the two aspects of sovereignty distinguished in IR?","o":["Only internal sovereignty exists","Only external sovereignty exists","Military sovereignty and economic sovereignty only","Internal sovereignty and external sovereignty"],"a":4,"w":"Sovereignty has internal (authority within the state) and external (independence among other states) aspects."},{"q":"Nigeria's 2017 ban on IPOB is an example of which aspect of sovereignty?","o":["International law only","No form of sovereignty","External sovereignty only","Internal sovereignty"],"a":4,"w":"Banning a group within Nigeria's own territory is an exercise of internal sovereignty."},{"q":"Which three broad categories is \"national interest\" typically grouped into?","o":["Security, economic prosperity and prestige","Only religious unity","Only military strength","Only population growth"],"a":1,"w":"National interest is typically grouped into security, economic prosperity and prestige."},{"q":"Which political scientist distinguished \"hard power\" from \"soft power\"?","o":["Herbert Macaulay","Usman dan Fodio","Kwame Nkrumah","Joseph Nye"],"a":4,"w":"Joseph Nye distinguished hard power (coercive) from soft power (attractive/persuasive)."},{"q":"Which of these best illustrates Nigeria's \"soft power\" in IR?","o":["A military threat against a neighbour","An economic sanction on another country","Nollywood and Afrobeats boosting Nigeria's international image","A naval blockade"],"a":3,"w":"Nollywood and Afrobeats illustrate Nigeria's soft power, attracting influence through culture rather than force."},{"q":"Which of these is a \"non-traditional\" security concern increasingly studied in modern IR?","o":["A naval blockade","A declaration of war","A cyberattack on a government's banking system","An armed invasion by another state's military"],"a":3,"w":"Cyberattacks are a non-traditional security concern, alongside economic and environmental threats."},{"q":"What kind of environmental factor has contributed to conflict in the Sahel region?","o":["Volcanic eruptions","Excess rainfall only","Earthquakes","Droughts"],"a":4,"w":"Droughts in the Sahel have contributed to resource conflicts and instability in the region."},{"q":"Why is sovereignty considered \"not absolute\" in practice today?","o":["Only small states have limited sovereignty","Global trade rules, human rights treaties and international pressure limit how freely states can act","States have complete freedom to do anything without consequence","Sovereignty has been formally abolished by the UN"],"a":2,"w":"Global trade rules, treaties and international pressure place real practical limits on state sovereignty."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 International Relations',ti:'Levels of Analysis in International Relations',su:'Distinguish the individual, state and systemic levels of analysis in IR.',steps:[
{lb:'The individual level',dr:dQ1,ht:'<p>The <b>individual level</b> of analysis focuses on how the personality, beliefs, health and decisions of specific leaders shape international events. For example, historians examining the outbreak of the First World War often point to the specific decisions and miscalculations of leaders such as Kaiser Wilhelm II of Germany, while more recently, analysts have examined how President Vladimir Putin\'s own worldview shaped Russia\'s 2022 invasion of Ukraine.</p>'},
{lb:'The state/national level',dr:dQ1,ht:'<p>The <b>state (or national) level</b> of analysis examines how domestic factors &mdash; type of government (democracy vs. military rule), public opinion, economic interests, and internal politics &mdash; shape a state\'s foreign policy, regardless of which individual leader is in office. For example, Nigeria\'s dependence on oil exports (accounting for a large share of government revenue) consistently shapes its foreign economic policy across different administrations.</p>'},
{lb:'The systemic/international level',dr:dQ1,ht:'<p>The <b>systemic (or international) level</b> of analysis looks at the structure of the international system itself &mdash; for example, the <b>bipolar</b> balance of power during the Cold War (1947-1991, USA vs. USSR), the <b>unipolar</b> moment of US dominance after 1991, and the current shift towards a more <b>multipolar</b> world as China\'s power grows &mdash; each shaping how every country, including Nigeria, must position itself internationally.</p>'},
{lb:'Using levels together',dr:dQ1,ht:'<p>Analysts typically use <b>multiple levels together</b> to gain a fuller picture. Explaining Nigeria\'s Africa-centred foreign policy, for example, requires the individual level (specific presidents\' personal commitment to Pan-Africanism), the state level (Nigeria\'s economic and security interests as Africa\'s most populous country), and the systemic level (Nigeria\'s position relative to global powers and its leadership role within ECOWAS and the AU).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which level of analysis would best explain how Kaiser Wilhelm II's personal decisions contributed to WWI's outbreak?","o":["The systemic level","The economic level only","None of these","The individual level"],"a":4,"w":"A specific leader's personal decisions are best explained at the individual level of analysis."},{"q":"Which level of analysis examines how Nigeria's dependence on oil exports shapes foreign economic policy across different administrations?","o":["The state/national level","The individual level only","The religious level","The systemic level only"],"a":1,"w":"This domestic economic factor, consistent across administrations, is best explained at the state/national level."},{"q":"Which term describes the balance of power during the Cold War, with the USA and USSR as the two dominant powers?","o":["Multipolar","Non-polar","Bipolar","Unipolar"],"a":3,"w":"The Cold War era is described as \"bipolar,\" with the USA and USSR as the two dominant powers."},{"q":"Which term describes the period of US dominance after the Cold War ended in 1991?","o":["The unipolar moment","The bipolar era","A multipolar era","The colonial era"],"a":1,"w":"The period of US dominance after 1991 is often called the \"unipolar moment.\""},{"q":"Which term increasingly describes today's international system, as China's power grows alongside the USA?","o":["Purely bipolar","Purely unipolar","Stateless","Multipolar"],"a":4,"w":"The rise of China alongside continued US influence is increasingly described using the term \"multipolar.\""},{"q":"Which level of analysis would you use to study how the rise of China affects all countries' foreign policy choices?","o":["The individual level","The cultural level","The systemic/international level","The state level only"],"a":3,"w":"Changes in the global balance of power, like China's rise, are best studied at the systemic/international level."},{"q":"Why do analysts often combine multiple levels of analysis when explaining Nigeria's Africa-centred foreign policy?","o":["Because WAEC forbids combining levels","To capture leaders' personal commitments, domestic interests, and Nigeria's position in the global system together","Because Nigeria has no foreign policy to analyse","Because only one level is ever useful"],"a":2,"w":"Combining levels captures leaders' personal commitments, domestic interests and Nigeria's global position together."},{"q":"Which of these is an example of the individual level of analysis applied to a recent event?","o":["Analysing ECOWAS's founding treaty","Analysing global oil price trends","Analysing how President Putin's own worldview shaped Russia's 2022 invasion of Ukraine","Analysing the structure of the UN Security Council"],"a":3,"w":"Analysing how a specific leader's worldview shaped a decision is a clear example of individual-level analysis."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 International Relations',ti:'Theories of International Relations',su:'Compare Realism and Liberalism as approaches to explaining international relations.',steps:[
{lb:'Realism',dr:dQ2,ht:'<p><b>Realism</b>, associated with theorists such as <b>Hans Morgenthau</b> and <b>Kenneth Waltz</b>, views IR as a struggle for power among self-interested, sovereign states in an <b>anarchic</b> system &mdash; meaning there is no world government above states to enforce order or guarantee their safety. Realists point to events like the ongoing arms competition among major powers, or Russia\'s willingness to use force in Ukraine (2022) despite international condemnation, as evidence that states ultimately rely on their own power ("self-help") to secure survival.</p>'},
{lb:'Liberalism',dr:dQ2,ht:'<p><b>Liberalism</b>, with roots in the ideas of philosopher <b>Immanuel Kant</b> and US President <b>Woodrow Wilson</b> (who championed the League of Nations after WWI), emphasises cooperation, international institutions and economic interdependence (such as trade) as ways states can achieve mutual benefit and reduce the likelihood of conflict. Liberals point to organisations like the UN, the EU, and ECOWAS, and to the fact that heavily trade-interdependent countries rarely go to war with each other, as evidence that cooperation can restrain pure self-interest.</p>'},
{lb:'Comparing the two theories',dr:dQ2,ht:'<p>Realists stress <b>conflict and self-help</b>, arguing institutions like the UN ultimately reflect and are limited by great-power interests (seen in the Security Council veto). Liberals stress <b>cooperation and institutions</b>, arguing that trade, treaties and shared democratic values genuinely reduce the risk of war over time. Neither theory alone explains all international behaviour &mdash; both perspectives illuminate different aspects of global politics, from arms races to trade partnerships.</p>'},
{lb:'Applying theory to examples',dr:dQ2,ht:'<p>WAEC students should be able to briefly describe both theories and give simple examples: the <b>UN Security Council</b> reflects both power politics (the five permanent members\' veto, a Realist feature) and cooperative institution-building (193 member states working together, a Liberal feature) &mdash; showing that real-world institutions often blend elements of both theories rather than fitting neatly into just one.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which theorist, alongside Kenneth Waltz, is closely associated with Realism in IR?","o":["Hans Morgenthau","Karl Marx","Woodrow Wilson","Immanuel Kant"],"a":1,"w":"Hans Morgenthau, alongside Kenneth Waltz, is closely associated with the Realist school of IR theory."},{"q":"Which US President championed the League of Nations after WWI, reflecting Liberal IR thinking?","o":["Abraham Lincoln","Franklin Roosevelt","Woodrow Wilson","Theodore Roosevelt"],"a":3,"w":"Woodrow Wilson championed the League of Nations after WWI, a key example of Liberal institution-building."},{"q":"Which philosopher's ideas are considered a root of Liberal IR theory?","o":["Hans Morgenthau","Kenneth Waltz","Niccolò Machiavelli","Immanuel Kant"],"a":4,"w":"Immanuel Kant's philosophy is considered a foundational root of Liberal IR theory."},{"q":"What term describes states relying on their own power for survival, as emphasised by Realists?","o":["Self-help","Federalism","Interdependence","Institution-building"],"a":1,"w":"\"Self-help\" describes the Realist idea that states rely on their own power for survival in an anarchic system."},{"q":"Which recent event is often cited by Realists as evidence that states ultimately rely on power, not institutions, for survival?","o":["The founding of ECOWAS","The African Union's creation in 2002","The signing of the Paris Agreement","Russia's 2022 invasion of Ukraine despite international condemnation"],"a":4,"w":"Russia's 2022 invasion of Ukraine, despite international condemnation, is cited by Realists as evidence of power politics."},{"q":"What feature of the UN Security Council reflects a Realist, power-politics element?","o":["Its 193 total member states","The veto held by the five permanent members","Its headquarters location in New York","Its annual General Assembly meeting"],"a":2,"w":"The veto held by the five permanent members reflects a Realist, power-politics element within the UN."},{"q":"What feature of the UN reflects a Liberal, cooperative-institution element?","o":["193 member states working together within a shared organisation","The absence of any international law","The existence of nuclear weapons","The Security Council veto alone"],"a":1,"w":"The broad membership of 193 states working together reflects the Liberal emphasis on cooperative institutions."},{"q":"Why is it useful for WAEC students to understand that real institutions often blend Realist and Liberal features?","o":["Because institutions never actually reflect any theory","Because only one theory has ever been correct","Because WAEC only tests Liberalism","It shows real-world institutions rarely fit neatly into just one theory"],"a":4,"w":"Understanding that institutions blend both theories shows a more sophisticated grasp of IR for WAEC essays."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 International Relations',ti:'Foreign Policy — Meaning and Determinants',su:'Define foreign policy and explain its determinants and objectives.',steps:[
{lb:'Meaning of foreign policy',dr:dQ1,ht:'<p><b>Foreign policy</b> is the strategy a government uses to guide its interactions with other states and international actors. It translates a state\'s <b>national interest</b> into specific goals and actions on the world stage &mdash; for example, Nigeria\'s foreign policy since independence in 1960 has consistently declared <b>Africa as the centrepiece</b> of its external relations, shaping decisions from anti-apartheid support for South Africa in the 1970s-80s to leadership roles in ECOWAS peacekeeping.</p>'},
{lb:'Determinants of foreign policy',dr:dQ1,ht:'<p>Determinants of foreign policy include: <b>geography</b> (Nigeria\'s location as West Africa\'s largest economy and population shapes its regional leadership role); <b>economic resources</b> (oil revenue funds Nigeria\'s diplomatic and peacekeeping activities); <b>historical ties</b> (Commonwealth membership reflecting British colonial history); ideology; public opinion; and the personality of individual leaders (e.g. General Yakubu Gowon\'s and later leaders\' personal commitment to Pan-Africanism).</p>'},
{lb:'Objectives of foreign policy',dr:dQ1,ht:'<p>Common foreign policy objectives include: protecting <b>sovereignty and territorial integrity</b> (e.g. Nigeria\'s military response to Boko Haram, coordinated with Chad, Niger and Cameroon through the Multinational Joint Task Force); promoting <b>economic interests</b> (trade deals, attracting foreign investment); maintaining <b>international peace and security</b> (ECOWAS peacekeeping in Liberia and Sierra Leone); and enhancing <b>national prestige</b> (Nigeria\'s bid for a permanent African seat on an expanded UN Security Council).</p>'},
{lb:'Implementing foreign policy',dr:dQ1,ht:'<p>Foreign policy is implemented through <b>diplomacy</b> (Nigeria\'s missions abroad), treaties, alliances, foreign aid, trade agreements (such as AfCFTA) and, in extreme cases, the use or threat of force. Most foreign policy goals are pursued through peaceful means, since war is costly, unpredictable and usually a last resort even for powerful states.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What has Nigeria consistently declared as the \"centrepiece\" of its foreign policy since independence in 1960?","o":["The Middle East","Asia","Europe","Africa"],"a":4,"w":"Nigeria has consistently declared Africa as the centrepiece of its foreign policy since 1960."},{"q":"Which historic policy did Nigeria pursue toward South Africa in the 1970s-80s, reflecting its Africa-centred foreign policy?","o":["Full military alliance with apartheid South Africa","Anti-apartheid support","Direct colonisation","Complete diplomatic silence"],"a":2,"w":"Nigeria supported the anti-apartheid movement in the 1970s-80s, reflecting its Africa-centred foreign policy."},{"q":"Which economic resource is a major determinant funding Nigeria's diplomatic and peacekeeping activities?","o":["Foreign aid only","Agricultural exports only","Oil revenue","Tourism income only"],"a":3,"w":"Oil revenue is a major economic determinant funding Nigeria's diplomatic and peacekeeping activities."},{"q":"Which multinational military force coordinates Nigeria's response to Boko Haram with Chad, Niger and Cameroon?","o":["The UN Security Council","NATO","ECOMOG","The Multinational Joint Task Force"],"a":4,"w":"The Multinational Joint Task Force coordinates Nigeria's response to Boko Haram with neighbouring countries."},{"q":"Which foreign policy objective is illustrated by Nigeria's bid for a permanent African seat on an expanded UN Security Council?","o":["Reducing international trade","Ending all foreign relations","Protecting territorial integrity only","Enhancing national prestige"],"a":4,"w":"The bid for a permanent Security Council seat is an example of pursuing national prestige as a foreign policy objective."},{"q":"Which historical tie is a determinant of Nigeria's foreign policy, linked to its colonial past?","o":["Commonwealth membership","Membership of the EU","A historical alliance with Russia","Membership of NATO"],"a":1,"w":"Nigeria's Commonwealth membership reflects a historical tie stemming from its colonial past under Britain."},{"q":"Which trade agreement is an example of how foreign policy is implemented through economic means?","o":["The Multinational Joint Task Force","AfCFTA (African Continental Free Trade Area)","ECOMOG","NATO"],"a":2,"w":"AfCFTA is an example of foreign policy implemented through a trade agreement."},{"q":"Why is war generally considered a \"last resort\" in implementing foreign policy?","o":["It has no real consequences for a state","It is always the first and easiest option for any government","It is cheaper than diplomacy","It is costly, unpredictable and usually avoided when peaceful means are available"],"a":4,"w":"War is costly and unpredictable, so most foreign policy goals are pursued through peaceful means first."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 International Relations',ti:'Instruments of International Relations',su:'Explain diplomacy, treaties, sanctions and force as instruments of IR.',steps:[
{lb:'Diplomacy',dr:dQ2,ht:'<p><b>Diplomacy</b> is generally considered the primary peaceful instrument of IR &mdash; the means by which states communicate, negotiate and resolve disputes through ambassadors, high commissioners and diplomatic missions. Nigeria practises <b>shuttle diplomacy</b> and hosts numerous embassies in Abuja, while its own diplomats have historically played leading roles in negotiations such as the Lom&eacute; Peace Accord (1999) ending Sierra Leone\'s civil war.</p>'},
{lb:'Treaties and agreements',dr:dQ2,ht:'<p><b>Treaties and agreements</b> are formal, legally-binding written agreements between states &mdash; such as the <b>Treaty of Lagos (1975)</b>, which established ECOWAS, or defence pacts and trade treaties like AfCFTA (2021). Treaties structure and formalise international cooperation, giving states predictable, enforceable expectations of one another\'s behaviour.</p>'},
{lb:'Sanctions',dr:dQ2,ht:'<p><b>Sanctions</b> are economic or political penalties imposed by one or more states, or by an organisation like the UN or ECOWAS, to pressure another state to change its behaviour without resorting to war. ECOWAS, for instance, has repeatedly suspended and sanctioned member states after military coups (e.g. Mali 2021, Guinea 2021, Niger 2023), restricting trade and freezing assets to pressure a return to civilian rule.</p>'},
{lb:'War and the use of force',dr:dQ2,ht:'<p><b>War, or the use of force,</b> is the most extreme instrument of IR, used when diplomacy and sanctions fail. Its use is increasingly regulated by international law, particularly <b>Article 2(4) of the UN Charter</b>, which prohibits the use of force against another state\'s territorial integrity except in self-defence or with UN Security Council authorisation &mdash; a rule frequently debated but rarely fully respected in practice, as seen in conflicts from Iraq (2003) to Ukraine (2022).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which peace agreement, negotiated with significant Nigerian diplomatic involvement, ended Sierra Leone's civil war in 1999?","o":["The Atlantic Charter","The Lomé Peace Accord","The Treaty of Lagos","The Treaty of Versailles"],"a":2,"w":"The Lomé Peace Accord (1999) ended Sierra Leone's civil war, with significant Nigerian diplomatic involvement."},{"q":"Which treaty, signed in 1975, established ECOWAS?","o":["The Treaty of Lomé","The UN Charter","The Montevideo Convention","The Treaty of Lagos"],"a":4,"w":"The Treaty of Lagos (1975) established ECOWAS."},{"q":"Which trade agreement came into force in 2021, illustrating treaties as instruments of IR?","o":["NATO's founding treaty","The Lomé Peace Accord","AfCFTA","The Treaty of Westphalia"],"a":3,"w":"AfCFTA, which came into force in 2021, illustrates treaties as instruments of economic cooperation in IR."},{"q":"Which organisation has repeatedly sanctioned West African member states after military coups (e.g. Mali, Guinea, Niger)?","o":["The International Court of Justice","The World Trade Organisation","NATO","ECOWAS"],"a":4,"w":"ECOWAS has repeatedly sanctioned member states, including Mali, Guinea and Niger, after military coups."},{"q":"Which article of the UN Charter restricts the use of force between states?","o":["Article 2(4)","Article 99","Article 51 only","There is no such article"],"a":1,"w":"Article 2(4) of the UN Charter prohibits the use of force against another state's territorial integrity, except in specific circumstances."},{"q":"Under which circumstance does the UN Charter permit the use of force between states?","o":["Only with the agreement of the attacking state","Whenever a state simply wishes to expand its territory","Self-defence or UN Security Council authorisation","Never, under any circumstances"],"a":3,"w":"The UN Charter permits force in self-defence or when authorised by the UN Security Council."},{"q":"Which 2003 conflict is often cited in debates about whether the UN Charter's rules on force are consistently respected?","o":["The Cold War","World War I","The Nigerian Civil War","The Iraq War"],"a":4,"w":"The 2003 Iraq War is frequently cited in debates about whether UN Charter rules on the use of force are consistently respected."},{"q":"Why are sanctions generally considered a middle ground between diplomacy and war?","o":["They are legally identical to a declaration of war","They apply real economic/political pressure without direct armed conflict","They have no practical effect on any state","They always involve troops on the ground"],"a":2,"w":"Sanctions apply real pressure without the direct armed conflict involved in war, making them a middle-ground instrument."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q9 \u2022 Gov \u2022 International Relations',ti:'WAEC Exam Preparation — Meaning and Scope of IR',su:'Practise WAEC-style questions on the meaning and scope of international relations.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on IR topics: (1) <b>Define</b> the key term clearly and precisely. (2) <b>Explain</b> relevant concepts or actors with named examples. (3) Give <b>real-world examples</b>, especially Nigerian, West African or global ones with specific dates and names. (4) Draw a <b>conclusion</b> connecting the topic to broader lessons about global politics or Nigeria\'s place in the world.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common WAEC question patterns on this topic include: "Explain the meaning and scope of international relations." / "Distinguish between state and non-state actors in IR, with examples." / "Discuss the importance of studying international relations for a country like Nigeria." / "Compare Realism and Liberalism as theories of IR." Always answer the specific question asked, not a memorised general essay.</p>'},
{lb:'Key vocabulary for essays',dr:dQ1,ht:'<p>Key vocabulary to deploy accurately: <b>sovereignty</b>, <b>national interest</b>, <b>diplomacy</b>, <b>IGO</b>, <b>NGO</b>, <b>MNC</b>, <b>Realism</b>, <b>Liberalism</b>, <b>foreign policy</b>, <b>unilateral/bilateral/multilateral</b>, <b>hard power/soft power</b>, <b>anarchic system</b>. Precise, correctly-used vocabulary is one of the clearest ways WAEC examiners distinguish strong answers from weak ones.</p>'},
{lb:'Applying to Nigeria and named examples',dr:dQ1,ht:'<p>Always link back to <b>Nigeria\'s own experience</b> where relevant &mdash; ECOWAS membership, AU leadership, the Boko Haram insurgency and regional security cooperation, or Nigeria\'s Africa-centred foreign policy since 1960 &mdash; since WAEC consistently rewards the ability to apply global IR concepts to concrete, locally-relevant, dated examples rather than only abstract theory.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on an IR topic?","o":["Define the key terms clearly and precisely","List unrelated facts","Immediately give a personal opinion","Skip straight to a conclusion"],"a":1,"w":"WAEC essays should always begin by clearly and precisely defining the key terms."},{"q":"Which of these WAEC-style questions relates most directly to comparing IR theories?","o":["\"Define photosynthesis.\"","\"List the states of Nigeria.\"","\"Describe the layout of the Nigerian Senate.\"","\"Compare Realism and Liberalism as theories of IR.\""],"a":4,"w":"\"Compare Realism and Liberalism as theories of IR\" directly relates to comparing IR theories."},{"q":"Which of these vocabulary pairs should a strong WAEC IR essay be able to distinguish?","o":["Hard power and soft power","Mitosis and meiosis","Longitude and latitude","Photosynthesis and respiration"],"a":1,"w":"A strong WAEC IR essay should be able to distinguish hard power from soft power precisely."},{"q":"Why does WAEC reward linking IR concepts back to Nigeria's own dated, named experience?","o":["It replaces the need for definitions","It shows the ability to apply general concepts to specific, concrete examples","Nigeria is the only country ever studied in IR","Other countries are irrelevant to the syllabus"],"a":2,"w":"Linking concepts to Nigeria's own dated experience shows the ability to apply general concepts to specific examples."},{"q":"What does the term \"unilateral,\" often used in IR essays, mean?","o":["Action taken by all states in the world","Action taken by exactly two states together","Action taken only by NGOs","Action taken by a single state acting alone"],"a":4,"w":"\"Unilateral\" means action taken by a single state acting alone, without others."},{"q":"What does the term \"bilateral\" mean, as distinguished from \"multilateral,\" in IR essays?","o":["Involving exactly two states","Involving only individuals","Involving no states at all","Involving three or more states or parties"],"a":1,"w":"\"Bilateral\" specifically means involving exactly two states, unlike \"multilateral,\" which involves three or more."},{"q":"Which named, dated example would strengthen a WAEC essay on Nigeria's Africa-centred foreign policy?","o":["No example at all","A vague, undated reference to \"African unity\"","An example about a European country only","Nigeria's anti-apartheid support for South Africa in the 1970s-80s"],"a":4,"w":"Nigeria's anti-apartheid support in the 1970s-80s is a specific, dated example strengthening a WAEC essay."},{"q":"What is the benefit of using specific, dated real-world examples in a WAEC IR essay?","o":["It is only relevant for essays on ancient history","It replaces the need for any theory","It demonstrates concrete knowledge and earns higher marks than vague generalisations","It is discouraged by WAEC"],"a":3,"w":"Using specific, dated real-world examples demonstrates concrete knowledge and typically earns higher WAEC marks."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov \u2022 International Relations',ti:'Mixed Questions — Meaning and Scope of IR',su:'Integrated revision across all aspects of the meaning and scope of international relations.',steps:[
{lb:'Summary of key points',dr:dQ10,ht:'<p>International Relations studies interactions between states and other global actors, involving both conflict and cooperation across political, economic and social spheres. Its scope spans diplomacy, security, international law, global economics, and emerging global issues like climate change and pandemics, all analysed through multiple levels (individual, state, systemic) and competing theories (Realism, Liberalism).</p>'},
{lb:'Key terms and named examples to remember',dr:dQ10,ht:'<p>Must-know terms and examples: <b>Sovereignty</b> (Peace of Westphalia, 1648); <b>national interest</b>; <b>power</b> (Joseph Nye\'s hard/soft power); <b>IGOs</b> (UN 1945, AU 2002, ECOWAS 1975); <b>NGOs</b> (Amnesty International, Red Cross); <b>MNCs</b> (Shell, Dangote Group); <b>Realism</b> (Morgenthau, Waltz); <b>Liberalism</b> (Kant, Wilson); <b>foreign policy</b> and <b>diplomacy</b>.</p>'},
{lb:'Lessons for Nigeria',dr:dQ10,ht:'<p>As Africa\'s most populous country and a leading economy, Nigeria\'s own foreign policy decisions (covered in later topics) are shaped by these same fundamental IR concepts &mdash; sovereignty, national interest, power, and the ongoing choice between cooperative strategies (ECOWAS leadership, AU diplomacy) and more self-interested, Realist calculations (protecting oil revenue and territorial security against Boko Haram).</p>'},
{lb:'Final exam tips',dr:dQ10,ht:'<p>Always distinguish clearly between <b>"international relations"</b> (the broad academic field studying global interactions) and <b>"foreign policy"</b> (a specific state\'s strategy within that field). Define terms precisely, use named, dated real examples wherever possible, and conclude by drawing out relevance to Nigeria\'s or Africa\'s place in the world today.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{"q":"What is the overall subject that International Relations studies?","o":["Only Nigeria's internal politics","Only economics within one country","Relations between states and other global actors, involving conflict and cooperation","Only the history of ancient empires"],"a":3,"w":"IR studies relations between states and other global actors, involving both conflict and cooperation."},{"q":"Which year was the African Union founded, replacing the earlier OAU?","o":["1945","1963","2002","1975"],"a":3,"w":"The African Union was founded in 2002, replacing the OAU which dated from 1963."},{"q":"Which theorist is associated with Realism, alongside Kenneth Waltz?","o":["Immanuel Kant","Joseph Nye","Hans Morgenthau","Woodrow Wilson"],"a":3,"w":"Hans Morgenthau, alongside Kenneth Waltz, is associated with Realist IR theory."},{"q":"What is the key difference between \"international relations\" and \"foreign policy,\" as tested by WAEC?","o":["Foreign policy is broader than IR","IR only applies to Nigeria","IR is the broad field of study; foreign policy is a specific state's strategy within that field","They are exactly the same thing"],"a":3,"w":"IR is the broad field of study, while foreign policy is a specific state's strategy within that field."},{"q":"Which historical agreement (1648) is most closely associated with the origin of state sovereignty?","o":["The Treaty of Lagos","The Peace of Westphalia","The Montevideo Convention","The UN Charter"],"a":2,"w":"The Peace of Westphalia (1648) is most closely associated with the origin of the modern concept of state sovereignty."},{"q":"Which scholar's hard power/soft power distinction is a key IR concept to remember?","o":["Woodrow Wilson","Hans Morgenthau","Joseph Nye","Immanuel Kant"],"a":3,"w":"Joseph Nye's distinction between hard power and soft power is a key concept to remember."},{"q":"Which two competing calculations does Nigeria constantly balance in its foreign policy, according to this lesson?","o":["Cooperative strategies (e.g. ECOWAS/AU leadership) and self-interested, Realist calculations (e.g. protecting oil revenue and security)","Only cooperative strategies, with no self-interest at all","Only Realist calculations, with no cooperation at all","Neither cooperation nor self-interest ever applies"],"a":1,"w":"Nigeria balances cooperative strategies (regional leadership) with more self-interested, Realist calculations (protecting oil revenue and security)."},{"q":"What should a strong WAEC IR essay conclusion typically do?","o":["Avoid mentioning Nigeria at all","Draw out relevance to Nigeria's or Africa's place in the world today","End abruptly with no summary","Introduce a completely new, unrelated topic"],"a":2,"w":"A strong conclusion draws out the relevance of the topic to Nigeria's or Africa's place in the world today."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
