<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}

.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}

.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}

.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

o.push(T(240,20,'Military Rule in Nigeria',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'First coup: 15 Jan 1966 (Nzeogwu)',DARK,10,'middle',false));o.push(T(240,74,'Countercoup: 29 Jul 1966 (Gowon)','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,CRM,ACC,1.5));o.push(T(240,110,'Civil War 1967-70; Biafra secession',DARK,10,'middle',false));o.push(T(240,128,'"No victor, no vanquished"','#555',9,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,CRM,ACC,1.5));o.push(T(240,164,'Murtala Mohammed 1975-76; Obasanjo 1976-79',DARK,10,'middle',false));o.push(T(240,182,'Buhari 1983-85; Babangida 1985-93','#555',9,'middle',false));}
if(p>=4){o.push(R(10,200,460,60,CRM,ACC,1));o.push(T(240,218,'Abacha 1993-98; Abubakar 1998-99',DARK,10,'middle',false));o.push(T(240,236,'Return to civilian rule, 29 May 1999','#555',9,'middle',false));}
s.innerHTML=o.join('');}

o.push(T(240,20,'Key Military Regimes',ACC,12,'middle',true));
[['Ironsi','Jan-Jul 1966 — Unification Decree'],['Gowon','1966-75 — Civil War, oil boom, broken promise'],['Murtala/Obasanjo','1975-79 — Reforms, transition to 1979 Constitution'],['Buhari/Babangida','1983-93 — WAI, SAP, annulled 1993 election'],['Abacha/Abubakar','1993-99 — Repression, then swift return to civilian rule']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}

o.push(T(240,20,'Military Rule in Nigeria — Summary',ACC,13,'middle',true));
[['15 Jan 1966','First coup (Nzeogwu/Ironsi)'],['29 Jul 1966','Countercoup (Gowon)'],['1967-70','Civil War / Biafra'],['1975-79','Murtala Mohammed, then Obasanjo — transition to 1979 Constitution'],['1983-93','Buhari, then Babangida — SAP, annulled 1993 election'],['1993-98','Abacha — repression, Saro-Wiwa executed'],['1998-99','Abubakar — swift return to civilian rule']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov \u2022 POL',ti:'The First Military Coup (January 1966)',su:'Explain the causes and events of Nigeria\'s first military coup.',steps:[
{lb:'Background of political crisis',dr:dQ1,ht:'<p>By early 1966, Nigeria\'s <b>First Republic</b> faced deep instability: disputed regional elections (especially the Western Region crisis of 1965, sometimes called the "Wild Wild West"), allegations of widespread rigging and violence, and deteriorating trust between the NPC-NCNC federal coalition and the opposition. Many young army officers viewed the civilian political class as corrupt and incapable of resolving the crisis.</p>'},
{lb:'The coup of 15 January 1966',dr:dQ1,ht:'<p>On <b>15 January 1966</b>, a group of mostly Igbo army majors, led by <b>Major Chukwuma Kaduna Nzeogwu</b>, staged Nigeria\'s first military coup, assassinating Prime Minister <b>Tafawa Balewa</b>, the Northern Premier <b>Ahmadu Bello</b>, and the Western Premier <b>Samuel Akintola</b>, along with several senior army officers.</p>'},
{lb:'Aftermath and Ironsi\'s government',dr:dQ1,ht:'<p>The coup did not fully succeed as planned; senior officer <b>General Johnson Aguiyi-Ironsi</b> (himself Igbo) assumed power instead of the plotters, suspending the constitution and banning political parties. Because most of the killed leaders were non-Igbo while the plotters were predominantly Igbo, many in the North viewed the coup as an <b>ethnic power grab</b>, regardless of the plotters\' own stated motives.</p>'},
{lb:'Ironsi\'s Unification Decree and its consequences',dr:dQ1,ht:'<p>Ironsi\'s <b>Unification Decree No. 34 (May 1966)</b>, intended to abolish regionalism and create a unitary state, was perceived in the North as further evidence of Igbo domination, triggering deadly anti-Igbo riots and setting the stage for a July 1966 countercoup within just six months of the first.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What Western Region crisis in 1965 is sometimes referred to as the "Wild Wild West"?',o:['Widespread electoral violence following disputed regional elections','A cattle-rustling dispute','A religious conflict','A trade dispute with Ghana'],a:1,w:'The "Wild Wild West" refers to widespread electoral violence following the disputed 1965 Western Region elections.'},{q:'Who led the group of army majors that staged Nigeria\'s first military coup on 15 January 1966?',o:['Major Chukwuma Kaduna Nzeogwu','General Johnson Aguiyi-Ironsi','General Yakubu Gowon','Colonel Odumegwu Ojukwu'],a:1,w:'Major Chukwuma Kaduna Nzeogwu led the group of army majors that staged the 15 January 1966 coup.'},{q:'Which three senior political leaders were among those assassinated in the January 1966 coup?',o:['Tafawa Balewa, Ahmadu Bello and Samuel Akintola','Nnamdi Azikiwe, Obafemi Awolowo and Herbert Macaulay','Yakubu Gowon, Sani Abacha and Ibrahim Babangida','Olusegun Obasanjo, Muhammadu Buhari and Shehu Shagari'],a:1,w:'Tafawa Balewa, Ahmadu Bello and Samuel Akintola were among those assassinated in the January 1966 coup.'},{q:'Who assumed power after the January 1966 coup, rather than the original plotters?',o:['General Johnson Aguiyi-Ironsi','Major Chukwuma Kaduna Nzeogwu','General Yakubu Gowon','Chief Obafemi Awolowo'],a:1,w:'General Johnson Aguiyi-Ironsi assumed power after the January 1966 coup, rather than the original plotters.'},{q:'Why did many in the North view the January 1966 coup as an ethnic power grab?',o:['Most of the killed leaders were non-Igbo while the plotters were predominantly Igbo','All the plotters were from the North','No political leaders were killed in the coup','The coup was led by a Northern general'],a:1,w:'Because most of the killed leaders were non-Igbo while the plotters were predominantly Igbo, many in the North viewed it as an ethnic power grab.'},{q:'What did Ironsi\'s Unification Decree No. 34 (May 1966) attempt to do?',o:['Abolish regionalism and create a unitary state','Restore the monarchy','Immediately hold new elections','Create 36 new states'],a:1,w:'The Unification Decree No. 34 (May 1966) attempted to abolish regionalism and create a unitary state.'},{q:'How was the Unification Decree perceived in the North?',o:['As further evidence of Igbo domination','As a fair and welcome reform','As having no political significance','As a plan to benefit the North specifically'],a:1,w:'The Unification Decree was perceived in the North as further evidence of Igbo domination.'},{q:'How much time passed between the January 1966 coup and the following countercoup?',o:['About six months','About ten years','About one week','About two days'],a:1,w:'Only about six months passed between the January 1966 coup and the July 1966 countercoup.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 POL',ti:'The Countercoup and the Road to Civil War (1966-1967)',su:'Explain the July 1966 countercoup and the events leading to the Nigerian Civil War.',steps:[
{lb:'The July 1966 countercoup',dr:dQ2,ht:'<p>On <b>29 July 1966</b>, mostly Northern officers staged a <b>countercoup</b>, killing General Ironsi and installing <b>Lieutenant Colonel Yakubu Gowon</b> as Head of State. The countercoup was accompanied by, and followed by, further waves of <b>anti-Igbo violence</b> in Northern cities, with tens of thousands of Igbo residents killed or fleeing to the East.</p>'},
{lb:'Breakdown of trust',dr:dQ2,ht:'<p>Relations between Gowon\'s federal government and Eastern Region Military Governor <b>Lieutenant Colonel Odumegwu Ojukwu</b> deteriorated rapidly, as Ojukwu demanded justice and protection for Igbo victims of the violence, while Gowon sought to preserve federal authority. The <b>Aburi Accord (January 1967)</b>, negotiated in Ghana, briefly proposed a looser confederal arrangement but was never implemented as agreed, deepening mutual distrust.</p>'},
{lb:'Creation of 12 states (May 1967)',dr:dQ2,ht:'<p>In May 1967, Gowon announced the creation of <b>12 states</b>, replacing the four regions &mdash; splitting the Eastern Region into three states, which reduced the geographic and population base of any future Igbo secession, and was seen by Ojukwu as a direct provocation undermining the East\'s position.</p>'},
{lb:'Declaration of Biafra',dr:dQ2,ht:'<p>On <b>30 May 1967</b>, Ojukwu declared the Eastern Region\'s secession as the independent <b>Republic of Biafra</b>, citing the massacres of Igbo people in the North and the breakdown of federal guarantees. Nigeria\'s <b>Civil War</b> began shortly afterward, in July 1967, and would last nearly three years.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'On what date did the countercoup that installed Yakubu Gowon as Head of State occur?',o:['29 July 1966','15 January 1966','30 May 1967','1 October 1966'],a:1,w:'The countercoup that installed Yakubu Gowon occurred on 29 July 1966.'},{q:'Who was killed in the July 1966 countercoup?',o:['General Johnson Aguiyi-Ironsi','Tafawa Balewa','Ahmadu Bello','Odumegwu Ojukwu'],a:1,w:'General Johnson Aguiyi-Ironsi was killed in the July 1966 countercoup.'},{q:'Who was the Eastern Region\'s Military Governor during the crisis leading to civil war?',o:['Odumegwu Ojukwu','Yakubu Gowon','Chukwuma Kaduna Nzeogwu','Aguiyi-Ironsi'],a:1,w:'Odumegwu Ojukwu served as the Eastern Region\'s Military Governor during this crisis.'},{q:'Where was the Aburi Accord of January 1967 negotiated?',o:['Ghana','Nigeria','The United Kingdom','The United States'],a:1,w:'The Aburi Accord was negotiated in Ghana in January 1967.'},{q:'What did Gowon\'s May 1967 creation of 12 states do to the Eastern Region?',o:['It split the Eastern Region into three states','It merged the Eastern Region with the North','It abolished the Eastern Region\'s military governor role only','It gave the Eastern Region full independence immediately'],a:1,w:'Gowon\'s 12-state creation split the Eastern Region into three states, reducing its geographic and population base.'},{q:'On what date did Ojukwu declare the secession of the Republic of Biafra?',o:['30 May 1967','29 July 1966','15 January 1966','1 October 1966'],a:1,w:'Ojukwu declared the secession of the Republic of Biafra on 30 May 1967.'},{q:'What did Ojukwu cite as justification for declaring Biafra\'s secession?',o:['Massacres of Igbo people in the North and the breakdown of federal guarantees','A desire to become a British colony again','A trade dispute with Ghana','A religious disagreement with the federal government'],a:1,w:'Ojukwu cited the massacres of Igbo people in the North and the breakdown of federal guarantees as justification.'},{q:'Approximately how long did the Nigerian Civil War, beginning in July 1967, last?',o:['Nearly three years','One month','Ten years','One week'],a:1,w:'The Nigerian Civil War, beginning in July 1967, lasted nearly three years, ending in 1970.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 POL',ti:'The Nigerian Civil War (1967-1970)',su:'Explain the course, key features and outcome of the Nigerian Civil War.',steps:[
{lb:'Course of the war',dr:dQ1,ht:'<p>The <b>Nigerian Civil War</b> (July 1967 - January 1970) pitted the federal government under <b>Yakubu Gowon</b> against the secessionist Republic of Biafra under <b>Odumegwu Ojukwu</b>. Federal forces gradually recaptured Biafran territory, imposing a severe <b>blockade</b> that contributed to mass starvation, most notoriously documented in international media coverage of starving Biafran children.</p>'},
{lb:'International dimensions',dr:dQ1,ht:'<p>The war attracted significant international attention: some countries (including France) provided informal support to Biafra, while Britain and the Soviet Union supported the federal government. Humanitarian organisations, including a young <b>Médecins Sans Frontières</b> (founded partly in response to the crisis), delivered relief amid the blockade.</p>'},
{lb:'End of the war',dr:dQ1,ht:'<p>Biafran resistance collapsed in <b>January 1970</b>, with Ojukwu fleeing into exile and his deputy formally surrendering. Gowon declared <b>"no victor, no vanquished,"</b> announcing a policy of national <b>reconciliation, reconstruction and rehabilitation</b> (the "3 Rs") rather than mass punishment of the defeated East.</p>'},
{lb:'Significance and legacy',dr:dQ1,ht:'<p>The war, which cost an estimated <b>1-3 million lives</b> (many from starvation and disease rather than direct combat), preserved a united Nigeria but left deep scars in national memory, reinforced arguments for smaller states and stronger federal power, and remains a central reference point in Nigerian debates about ethnicity, marginalisation and national unity.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Who led the federal government\'s side during the Nigerian Civil War?',o:['Yakubu Gowon','Odumegwu Ojukwu','Chukwuma Kaduna Nzeogwu','Aguiyi-Ironsi'],a:1,w:'Yakubu Gowon led the federal government\'s side during the Nigerian Civil War.'},{q:'Who led the secessionist Republic of Biafra during the war?',o:['Odumegwu Ojukwu','Yakubu Gowon','Murtala Mohammed','Sani Abacha'],a:1,w:'Odumegwu Ojukwu led the secessionist Republic of Biafra during the war.'},{q:'What federal military tactic contributed significantly to mass starvation in Biafra?',o:['A severe blockade','Direct chemical attacks','Naval bombardment of coastal cities only','An immediate ceasefire'],a:1,w:'A severe federal blockade contributed significantly to mass starvation in Biafra.'},{q:'Which major international humanitarian organisation was founded partly in response to the Biafran crisis?',o:['Médecins Sans Frontières','The Red Cross','UNICEF','Amnesty International'],a:1,w:'Médecins Sans Frontières was founded partly in response to the humanitarian crisis in Biafra.'},{q:'In what month and year did Biafran resistance collapse, ending the civil war?',o:['January 1970','July 1967','May 1967','January 1966'],a:1,w:'Biafran resistance collapsed in January 1970, ending the civil war.'},{q:'What famous phrase did Gowon use to describe his approach to the defeated East?',o:['"No victor, no vanquished"','"An eye for an eye"','"Total surrender or death"','"Divide and rule"'],a:1,w:'Gowon declared "no victor, no vanquished" to describe his approach to the defeated East.'},{q:'What were Gowon\'s "3 Rs" policy for post-war national recovery?',o:['Reconciliation, reconstruction and rehabilitation','Revenge, retribution and removal','Regionalism, restriction and revolution','Recolonisation, reform and rebuilding'],a:1,w:'Gowon\'s "3 Rs" policy stood for reconciliation, reconstruction and rehabilitation.'},{q:'Approximately how many lives are estimated to have been lost in the Nigerian Civil War?',o:['1-3 million','Around 10,000','Around 100','Around 100,000'],a:1,w:'An estimated 1-3 million lives were lost in the Nigerian Civil War, many from starvation and disease.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 POL',ti:'Gowon\'s Regime and Its Fall (1970-1975)',su:'Explain Gowon\'s post-war leadership and the circumstances of his removal.',steps:[
{lb:'Post-war reconstruction',dr:dQ2,ht:'<p>After the civil war, <b>Gowon\'s government</b> focused on national reconciliation, reconstruction of war-damaged infrastructure, and reintegrating former Biafran officials into public life, alongside a booming <b>oil revenue</b> boom following the 1973 international oil price rise, which greatly increased federal government resources.</p>'},
{lb:'Broken promise on civilian rule',dr:dQ2,ht:'<p>Gowon had originally promised a return to civilian rule by <b>1976</b>, but in October 1974 he announced this timetable was <b>indefinitely postponed</b>, citing continuing national instability &mdash; a decision that severely damaged his credibility and triggered widespread public and military dissatisfaction.</p>'},
{lb:'Corruption and public discontent',dr:dQ2,ht:'<p>Despite the oil boom, Gowon\'s government faced growing criticism over <b>corruption</b>, inefficient use of oil wealth, and a lack of visible improvement in ordinary Nigerians\' living standards &mdash; grievances that combined with the broken civilian-rule promise to erode support for his continued leadership.</p>'},
{lb:'The bloodless coup of July 1975',dr:dQ2,ht:'<p>While Gowon was attending an <b>Organisation of African Unity (OAU) summit in Kampala, Uganda</b>, in July 1975, senior officers staged a <b>bloodless coup</b> removing him from power and installing <b>General Murtala Mohammed</b> &mdash; notable for being one of the very few changes of Nigerian military leadership achieved without bloodshed.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What major economic event in 1973 significantly boosted Gowon\'s government\'s oil revenue?',o:['The international oil price rise','The end of the civil war alone','Nigeria joining the UN','The creation of 12 states'],a:1,w:'The 1973 international oil price rise significantly boosted Gowon\'s government\'s oil revenue.'},{q:'By what year had Gowon originally promised a return to civilian rule?',o:['1976','1970','1980','1999'],a:1,w:'Gowon had originally promised a return to civilian rule by 1976.'},{q:'What did Gowon announce in October 1974 regarding this promised timetable?',o:['That it was indefinitely postponed','That it would happen immediately','That it had already been fully achieved','That Nigeria would remain under British rule instead'],a:1,w:'In October 1974, Gowon announced that the promised return to civilian rule was indefinitely postponed.'},{q:'What effect did this broken promise have on Gowon\'s government?',o:['It severely damaged his credibility and triggered widespread dissatisfaction','It significantly increased his popularity','It had no political effect at all','It led to immediate independence for Biafra'],a:1,w:'The broken promise severely damaged Gowon\'s credibility and triggered widespread dissatisfaction.'},{q:'Besides the broken promise, what other major criticism did Gowon\'s government face?',o:['Corruption and inefficient use of oil wealth','Excessive investment in education only','Too rapid a return to civilian rule','Overly harsh treatment of former Biafran officials'],a:1,w:'Gowon\'s government faced criticism over corruption and inefficient use of oil wealth despite the boom.'},{q:'Where was Gowon when the coup removing him from power took place in July 1975?',o:['At an OAU summit in Kampala, Uganda','In Lagos, Nigeria','In London, United Kingdom','In New York, at the United Nations'],a:1,w:'Gowon was attending an OAU summit in Kampala, Uganda, when the coup removed him from power.'},{q:'Who was installed as Head of State after the July 1975 coup against Gowon?',o:['General Murtala Mohammed','General Yakubu Gowon','General Sani Abacha','General Ibrahim Babangida'],a:1,w:'General Murtala Mohammed was installed as Head of State after the July 1975 coup against Gowon.'},{q:'What was notable about the manner in which the July 1975 coup against Gowon was carried out?',o:['It was bloodless, unlike most other changes of Nigerian military leadership','It was the bloodiest coup in Nigerian history','It involved a full civil war','It required foreign military intervention'],a:1,w:'The July 1975 coup was notably bloodless, unlike most other changes of Nigerian military leadership.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 POL',ti:'Murtala Mohammed and Olusegun Obasanjo (1975-1979)',su:'Explain the reforms of Murtala Mohammed and the transition to civilian rule under Obasanjo.',steps:[
{lb:'Murtala Mohammed\'s reforms',dr:dQ1,ht:'<p>General <b>Murtala Mohammed</b> (July 1975 - February 1976) moved quickly and decisively: purging thousands of allegedly corrupt or inefficient civil servants, announcing plans to move the federal capital from Lagos to <b>Abuja</b> (a more centrally-located, ethnically neutral site), and creating <b>seven additional states</b> in 1976, bringing the total to 19.</p>'},
{lb:'A firm timetable for civilian rule',dr:dQ1,ht:'<p>Unlike Gowon, Murtala Mohammed announced a firm, credible <b>timetable to restore civilian rule by 1979</b>, establishing the <b>Constitution Drafting Committee (CDC)</b> in 1975 to prepare a new constitution &mdash; a decisive break from his predecessor\'s broken promises that quickly restored public confidence in the military government.</p>'},
{lb:'The assassination of Murtala Mohammed',dr:dQ1,ht:'<p>On <b>13 February 1976</b>, Murtala Mohammed was <b>assassinated</b> in an unsuccessful coup attempt led by Lieutenant Colonel Bukar Suka Dimka. The coup failed, and his deputy, <b>Lieutenant General Olusegun Obasanjo</b>, immediately assumed power, publicly committing to continue Murtala\'s reform and transition programme.</p>'},
{lb:'Obasanjo\'s transition to civilian rule',dr:dQ1,ht:'<p>Obasanjo (1976-1979) faithfully carried out the transition timetable he inherited: the <b>Constitution Drafting Committee</b> completed its work, a new <b>1979 Constitution</b> was adopted establishing a presidential system, elections were held, and Obasanjo peacefully <b>handed over power</b> to civilian President <b>Shehu Shagari</b> on 1 October 1979 &mdash; Nigeria\'s first military-to-civilian transfer of power.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which Nigerian city did Murtala Mohammed announce plans to move the federal capital to?',o:['Abuja','Kaduna','Enugu','Port Harcourt'],a:1,w:'Murtala Mohammed announced plans to move the federal capital to Abuja.'},{q:'How many additional states did Murtala Mohammed create in 1976, bringing the total to 19?',o:['Seven','Twelve','Three','Twenty'],a:1,w:'Murtala Mohammed created seven additional states in 1976, bringing Nigeria\'s total to 19.'},{q:'What committee did Murtala Mohammed establish in 1975 to prepare a new constitution?',o:['The Constitution Drafting Committee (CDC)','The National Assembly','The Federal Executive Council','The Council of State'],a:1,w:'Murtala Mohammed established the Constitution Drafting Committee (CDC) in 1975.'},{q:'On what date was Murtala Mohammed assassinated in an unsuccessful coup attempt?',o:['13 February 1976','15 January 1966','29 July 1966','1 October 1979'],a:1,w:'Murtala Mohammed was assassinated on 13 February 1976 in an unsuccessful coup attempt.'},{q:'Who led the unsuccessful coup attempt that killed Murtala Mohammed?',o:['Lieutenant Colonel Bukar Suka Dimka','Odumegwu Ojukwu','Yakubu Gowon','Sani Abacha'],a:1,w:'Lieutenant Colonel Bukar Suka Dimka led the unsuccessful coup attempt that killed Murtala Mohammed.'},{q:'Who assumed power immediately after Murtala Mohammed\'s assassination?',o:['Lieutenant General Olusegun Obasanjo','Yakubu Gowon','Shehu Shagari','Ibrahim Babangida'],a:1,w:'Lieutenant General Olusegun Obasanjo assumed power immediately after Murtala Mohammed\'s assassination.'},{q:'On what date did Obasanjo hand over power to civilian President Shehu Shagari?',o:['1 October 1979','1 October 1960','29 May 1999','13 February 1976'],a:1,w:'Obasanjo handed over power to civilian President Shehu Shagari on 1 October 1979.'},{q:'What was historically significant about Obasanjo\'s 1979 handover of power?',o:['It was Nigeria\'s first military-to-civilian transfer of power','It was Nigeria\'s first ever change of government','It marked the end of all future military coups in Nigeria','It was a transfer of power to a foreign government'],a:1,w:'Obasanjo\'s 1979 handover was historically significant as Nigeria\'s first military-to-civilian transfer of power.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 POL',ti:'The Buhari and Babangida Regimes (1983-1993)',su:'Explain the military regimes following the Second Republic\'s collapse.',steps:[
{lb:'The coup of 31 December 1983',dr:dQ2,ht:'<p>The <b>Second Republic</b> ended when Major General <b>Muhammadu Buhari</b> seized power in a coup on <b>31 December 1983</b>, citing corruption, economic mismanagement and disputed elections under President Shehu Shagari. Buhari\'s regime launched a strict <b>"War Against Indiscipline" (WAI)</b> campaign, cracking down on corruption and enforcing public order, but was widely criticised for human rights abuses and press restrictions.</p>'},
{lb:'Babangida\'s coup and \'transition without end\'',dr:dQ2,ht:'<p>Buhari was himself overthrown in a palace coup on <b>27 August 1985</b> by General <b>Ibrahim Babangida</b>, who styled himself "President" rather than Head of State. Babangida (1985-1993) announced repeated, shifting transition timetables toward civilian rule, leading critics to describe his rule as a <b>"transition without end."</b></p>'},
{lb:'Structural Adjustment Programme (SAP)',dr:dQ2,ht:'<p>Facing economic crisis and pressure from the <b>IMF and World Bank</b>, Babangida introduced the <b>Structural Adjustment Programme (SAP)</b> in 1986, involving currency devaluation, subsidy removal and trade liberalisation &mdash; measures that caused severe hardship for ordinary Nigerians and fuelled public protests.</p>'},
{lb:'The annulled 1993 election and Babangida\'s exit',dr:dQ2,ht:'<p>Babangida\'s regime organised the widely-praised <b>12 June 1993</b> presidential election, but then <b>annulled</b> the result before it was formally declared, plunging Nigeria into crisis. Facing intense public pressure, Babangida <b>"stepped aside"</b> in August 1993, installing an unelected <b>Interim National Government (ING)</b> under Ernest Shonekan.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'On what date did Muhammadu Buhari seize power, ending the Second Republic?',o:['31 December 1983','1 October 1979','27 August 1985','12 June 1993'],a:1,w:'Muhammadu Buhari seized power on 31 December 1983, ending the Second Republic.'},{q:'What anti-corruption campaign did Buhari\'s regime launch?',o:['The "War Against Indiscipline" (WAI)','The "3 Rs" policy','The Structural Adjustment Programme','The Federal Character Principle'],a:1,w:'Buhari\'s regime launched the "War Against Indiscipline" (WAI) campaign.'},{q:'Who overthrew Buhari in a palace coup on 27 August 1985?',o:['Ibrahim Babangida','Sani Abacha','Yakubu Gowon','Olusegun Obasanjo'],a:1,w:'Ibrahim Babangida overthrew Buhari in a palace coup on 27 August 1985.'},{q:'What unusual title did Babangida adopt, rather than "Head of State"?',o:['"President"','"Sultan"','"Prime Minister"','"Emperor"'],a:1,w:'Babangida styled himself "President" rather than the usual "Head of State" title.'},{q:'What critical phrase did observers use to describe Babangida\'s repeatedly shifting transition timetables?',o:['A "transition without end"','A "peaceful and swift handover"','An "immediate return to democracy"','A "total abolition of elections"'],a:1,w:'Critics described Babangida\'s shifting timetables as a "transition without end."'},{q:'Which international financial institutions pressured Babangida\'s government toward economic reform?',o:['The IMF and World Bank','The United Nations only','NATO','ECOWAS only'],a:1,w:'The IMF and World Bank pressured Babangida\'s government toward the Structural Adjustment Programme.'},{q:'What economic programme, introduced in 1986, involved currency devaluation and subsidy removal?',o:['The Structural Adjustment Programme (SAP)','The Federal Character Principle','The War Against Indiscipline','The 3 Rs policy'],a:1,w:'The Structural Adjustment Programme (SAP), introduced in 1986, involved currency devaluation and subsidy removal.'},{q:'What did Babangida do to the result of the 12 June 1993 presidential election?',o:['He annulled it before it was formally declared','He immediately accepted and implemented it','He extended his own rule by having himself declared the winner','He ordered a full military invasion of the winning candidate\'s region'],a:1,w:'Babangida annulled the result of the 12 June 1993 election before it was formally declared.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 POL',ti:'The Abacha Regime (1993-1998)',su:'Explain the character and events of Nigeria\'s most authoritarian military regime.',steps:[
{lb:'Abacha seizes power',dr:dQ1,ht:'<p>After the brief, unelected <b>Interim National Government</b> under Ernest Shonekan collapsed, General <b>Sani Abacha</b> seized full power on <b>17 November 1993</b>, dissolving all democratic structures and ruling by decree &mdash; beginning what is widely regarded as Nigeria\'s most repressive period of military rule.</p>'},
{lb:'Human rights abuses and repression',dr:dQ1,ht:'<p>Abacha\'s regime was marked by severe human rights abuses: banning political activity, jailing opposition figures (including detaining <b>Moshood Abiola</b>, the presumed winner of the annulled 1993 election, until his death in custody in 1998), and suppressing press freedom.</p>'},
{lb:'The execution of Ken Saro-Wiwa (1995)',dr:dQ1,ht:'<p>In November 1995, Abacha\'s government executed writer and environmental activist <b>Ken Saro-Wiwa</b> and eight other Ogoni activists, who had campaigned against environmental damage from oil extraction in the Niger Delta, after a widely criticised trial. This triggered international outrage, and Nigeria was <b>suspended from the Commonwealth</b> as a result.</p>'},
{lb:'Corruption and Abacha\'s death',dr:dQ1,ht:'<p>Abacha\'s rule became notorious for massive <b>corruption</b>, with billions of dollars in state funds later found to have been embezzled and hidden in foreign bank accounts (much of it eventually recovered in later decades through international asset-recovery efforts). Abacha died suddenly of a heart attack on <b>8 June 1998</b>, opening the way for a rapid transition to civilian rule.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'On what date did Sani Abacha seize full power, dissolving all democratic structures?',o:['17 November 1993','31 December 1983','27 August 1985','12 June 1993'],a:1,w:'Sani Abacha seized full power on 17 November 1993.'},{q:'Who briefly led the Interim National Government before Abacha\'s takeover?',o:['Ernest Shonekan','Moshood Abiola','Ibrahim Babangida','Olusegun Obasanjo'],a:1,w:'Ernest Shonekan briefly led the Interim National Government before Abacha\'s takeover.'},{q:'What happened to Moshood Abiola under Abacha\'s rule?',o:['He was detained and died in custody in 1998','He was allowed to take office as President','He fled Nigeria and lived safely abroad','He became Abacha\'s Vice President'],a:1,w:'Moshood Abiola was detained under Abacha\'s rule and died in custody in 1998.'},{q:'Which writer and environmental activist was executed by Abacha\'s government in November 1995?',o:['Ken Saro-Wiwa','Wole Soyinka','Chinua Achebe','Fela Kuti'],a:1,w:'Ken Saro-Wiwa, a writer and environmental activist, was executed by Abacha\'s government in November 1995.'},{q:'What cause had Ken Saro-Wiwa and the other executed Ogoni activists campaigned for?',o:['Against environmental damage from oil extraction in the Niger Delta','For the reintroduction of the monarchy','For Nigeria to leave the United Nations','For a return to colonial rule'],a:1,w:'Saro-Wiwa and the other Ogoni activists had campaigned against environmental damage from oil extraction in the Niger Delta.'},{q:'What international consequence followed the executions of November 1995?',o:['Nigeria was suspended from the Commonwealth','Nigeria was expelled from the United Nations','Nigeria was invaded by foreign forces','Nigeria was granted a permanent UN Security Council seat'],a:1,w:'Nigeria was suspended from the Commonwealth following the November 1995 executions.'},{q:'What is Abacha\'s regime particularly notorious for, beyond human rights abuses?',o:['Massive corruption, with billions in state funds embezzled','Complete elimination of all corruption','Excellent economic management with no debt','The abolition of Nigeria\'s oil industry'],a:1,w:'Abacha\'s regime is particularly notorious for massive corruption, embezzling billions of dollars in state funds.'},{q:'On what date did Sani Abacha die, opening the way for a transition to civilian rule?',o:['8 June 1998','17 November 1993','1 October 1999','29 May 1999'],a:1,w:'Sani Abacha died suddenly on 8 June 1998, opening the way for a transition to civilian rule.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 POL',ti:'The Return to Civilian Rule (1998-1999)',su:'Explain how Nigeria transitioned from military rule to the Fourth Republic.',steps:[
{lb:'Abubakar\'s rapid transition',dr:dQ2,ht:'<p>Following Abacha\'s death, General <b>Abdulsalami Abubakar</b> took power and, unlike his predecessors\' repeated delays, moved swiftly to organise a genuine return to civilian rule within roughly one year &mdash; releasing political prisoners, lifting media restrictions, and setting a clear election timetable.</p>'},
{lb:'Drafting the 1999 Constitution',dr:dQ2,ht:'<p>Abubakar\'s government adapted the largely unused 1995 draft constitution from Abacha\'s era into the <b>1999 Constitution</b>, retaining the presidential system first introduced in 1979, and promulgated it on <b>29 May 1999</b> &mdash; just before the formal handover of power.</p>'},
{lb:'The 1999 elections and handover',dr:dQ2,ht:'<p>Presidential elections were held in <b>February 1999</b>, won by <b>Olusegun Obasanjo</b> &mdash; the same general who had handed power to civilians in 1979, now returning as a civilian, elected President. Abubakar formally handed over power on <b>29 May 1999</b>, ending over 15 years of continuous military rule since 1983.</p>'},
{lb:'Significance of 1999',dr:dQ2,ht:'<p>The 1999 transition marked the beginning of Nigeria\'s <b>Fourth Republic</b>, now the country\'s longest unbroken period of civilian, constitutional government. Unlike the failed transitions of 1993, the 1999 transition succeeded because Abubakar, unlike Babangida or Abacha, showed genuine political will to relinquish power on schedule.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Who took power after Abacha\'s death and organised the transition to civilian rule?',o:['General Abdulsalami Abubakar','General Sani Abacha','General Ibrahim Babangida','General Muhammadu Buhari'],a:1,w:'General Abdulsalami Abubakar took power after Abacha\'s death and organised the transition to civilian rule.'},{q:'Roughly how long did Abubakar\'s transition to civilian rule take?',o:['About one year','About ten years','About one month','About five years'],a:1,w:'Abubakar\'s transition to civilian rule took roughly one year, a notably swift timetable.'},{q:'Which earlier draft constitution did Abubakar\'s government adapt to create the 1999 Constitution?',o:['The largely unused 1995 draft constitution from Abacha\'s era','The 1979 Constitution unchanged','The 1963 Republican Constitution unchanged','A newly written constitution with no earlier draft'],a:1,w:'Abubakar\'s government adapted the largely unused 1995 draft constitution from Abacha\'s era.'},{q:'Who won the presidential election held in February 1999?',o:['Olusegun Obasanjo','Muhammadu Buhari','Shehu Shagari','Moshood Abiola'],a:1,w:'Olusegun Obasanjo won the presidential election held in February 1999.'},{q:'What was notable about Obasanjo winning the 1999 election, given his earlier career?',o:['He was the same general who had handed power to civilians in 1979, now returning as an elected civilian President','He had never held any position in Nigerian government before','He was the son of a previous president','He had only ever served as a civilian, never in the military'],a:1,w:'Obasanjo had earlier handed power to civilians as a general in 1979 and now returned as an elected civilian President.'},{q:'On what date did Abubakar formally hand over power, ending over 15 years of military rule?',o:['29 May 1999','1 October 1999','31 December 1998','17 November 1993'],a:1,w:'Abubakar formally handed over power on 29 May 1999, ending over 15 years of continuous military rule since 1983.'},{q:'Which period of Nigerian constitutional history began with the 1999 transition?',o:['The Fourth Republic','The First Republic','The Second Republic','The Third Republic'],a:1,w:'The 1999 transition marked the beginning of Nigeria\'s Fourth Republic.'},{q:'Why did the 1999 transition succeed where the 1993 transition had failed?',o:['Abubakar showed genuine political will to relinquish power on schedule, unlike Babangida or Abacha','Nigeria had no military at all by 1999','The 1999 election had no opposition candidates','International forces physically enforced the transition'],a:1,w:'The 1999 transition succeeded because Abubakar showed genuine political will to relinquish power, unlike his predecessors.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 POL',ti:'WAEC Exam Preparation — Military Rule in Nigeria',su:'Practise WAEC-style questions on Nigeria\'s periods of military rule.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on military rule: (1) Identify the <b>specific regime or coup</b> asked about, with its exact date. (2) Explain the <b>causes</b> that led to it. (3) Describe its <b>key policies and events</b> with named individuals. (4) Evaluate its <b>consequences</b> for Nigeria\'s political and constitutional development.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "Account for the collapse of Nigeria\'s First Republic." / "Discuss the causes and consequences of the Nigerian Civil War." / "Assess the achievements and failures of the Babangida regime." / "Explain the significance of Nigeria\'s return to civilian rule in 1999."</p>'},
{lb:'Key vocabulary for essays',dr:dQ1,ht:'<p>Key vocabulary: <b>coup d\'état</b>, <b>countercoup</b>, <b>secession</b>, <b>military decree</b>, <b>transition programme</b>, <b>Structural Adjustment Programme</b>, <b>annulment</b>, <b>Interim National Government</b>, <b>handover of power</b>. Precisely using these terms with correct spelling earns higher marks.</p>'},
{lb:'A timeline approach',dr:dQ1,ht:'<p>Building a clear mental <b>timeline</b> of Nigeria\'s military rulers &mdash; Ironsi (1966) &rarr; Gowon (1966-75) &rarr; Murtala Mohammed (1975-76) &rarr; Obasanjo (1976-79) &rarr; [civilian interlude 1979-83] &rarr; Buhari (1983-85) &rarr; Babangida (1985-93) &rarr; Abacha (1993-98) &rarr; Abubakar (1998-99) &mdash; is essential preparation for this WAEC topic.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is the recommended first step for a WAEC essay on a specific military regime?',o:['Identify the specific regime or coup asked about, with its exact date','Immediately give a personal opinion with no facts','List unrelated dates with no explanation','Skip straight to a conclusion'],a:1,w:'A strong essay should begin by identifying the specific regime or coup, with its exact date.'},{q:'Which of these is a typical WAEC-style question on this topic?',o:['"Discuss the causes and consequences of the Nigerian Civil War."','"Describe the layout of Lagos."','"Define photosynthesis."','"List the rivers of Nigeria."'],a:1,w:'"Discuss the causes and consequences of the Nigerian Civil War" is a typical WAEC-style question on this topic.'},{q:'What term describes a sudden, illegal seizure of government power, often by the military?',o:['A coup d\'état','A referendum','An amendment','A treaty'],a:1,w:'"Coup d\'état" describes a sudden, illegal seizure of government power, often by the military.'},{q:'What term describes a region\'s formal withdrawal from a country to form a new state, as Biafra attempted?',o:['Secession','Federalism','Constitutionalism','Diplomacy'],a:1,w:'"Secession" describes a region\'s formal withdrawal from a country, as attempted by Biafra.'},{q:'Which military ruler followed Ironsi in Nigeria\'s leadership timeline?',o:['Yakubu Gowon','Murtala Mohammed','Olusegun Obasanjo','Muhammadu Buhari'],a:1,w:'Yakubu Gowon followed Ironsi in Nigeria\'s leadership timeline, taking power in the July 1966 countercoup.'},{q:'Which military ruler led Nigeria immediately before the civilian interlude of 1979-83?',o:['Olusegun Obasanjo','Yakubu Gowon','Muhammadu Buhari','Sani Abacha'],a:1,w:'Olusegun Obasanjo led Nigeria immediately before handing over to civilian rule in 1979.'},{q:'Which military ruler took power immediately after the civilian Second Republic collapsed in December 1983?',o:['Muhammadu Buhari','Ibrahim Babangida','Sani Abacha','Abdulsalami Abubakar'],a:1,w:'Muhammadu Buhari took power immediately after the Second Republic\'s collapse in December 1983.'},{q:'Why is building a mental timeline of Nigeria\'s military rulers considered essential WAEC preparation?',o:['It helps confidently sequence each regime\'s dates and events for exam answers','It replaces the need to know any specific facts','It is discouraged by WAEC examiners','It only applies to questions about the 1999 Constitution'],a:1,w:'A mental timeline helps students confidently sequence each regime\'s dates and events for exam answers.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q10 \u2022 Gov \u2022 POL',ti:'Mixed Questions — Military Rule in Nigeria',su:'Integrated revision across Nigeria\'s periods of military rule, 1966-1999.',steps:[
{lb:'Summary of military regimes',dr:dQ10,ht:'<p>Nigeria experienced military rule from <b>January 1966</b> (Ironsi\'s coup) through <b>1979</b> (Obasanjo\'s handover), and again from <b>December 1983</b> (Buhari\'s coup) through <b>May 1999</b> (Abubakar\'s handover) &mdash; over 28 years of military government across Nigeria\'s post-independence history.</p>'},
{lb:'Key names and dates to remember',dr:dQ10,ht:'<p>Must-know facts: <b>15 January 1966</b> (first coup); <b>29 July 1966</b> (countercoup, Gowon); <b>30 May 1967</b> (Biafra declared); <b>January 1970</b> (civil war ends); <b>13 February 1976</b> (Murtala Mohammed assassinated); <b>31 December 1983</b> (Buhari\'s coup); <b>12 June 1993</b> (annulled election); <b>8 June 1998</b> (Abacha\'s death); <b>29 May 1999</b> (return to civilian rule).</p>'},
{lb:'Lessons for Nigeria today',dr:dQ10,ht:'<p>Nigeria\'s experience of military rule shows both the fragility of civilian institutions when trust breaks down along ethnic and regional lines, and that lasting reform (as under Murtala Mohammed and Abubakar) requires genuine political will to hand back power, not just the promise of eventual civilian rule.</p>'},
{lb:'Final exam tips',dr:dQ10,ht:'<p>Always distinguish clearly between different phases &mdash; the <b>1966-79 period</b> (marked by civil war and post-war reconstruction) and the <b>1983-99 period</b> (marked by economic crisis, SAP and the annulled 1993 election) &mdash; use precise dates and named leaders, and conclude by linking military rule to Nigeria\'s current democratic consolidation.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'On what date did Nigeria\'s first military coup take place?',o:['15 January 1966','29 July 1966','30 May 1967','31 December 1983'],a:1,w:'Nigeria\'s first military coup took place on 15 January 1966.'},{q:'On what date did Ojukwu declare the secession of Biafra?',o:['30 May 1967','15 January 1966','29 July 1966','January 1970'],a:1,w:'Ojukwu declared the secession of Biafra on 30 May 1967.'},{q:'In what month and year did the Nigerian Civil War end?',o:['January 1970','July 1967','May 1967','February 1976'],a:1,w:'The Nigerian Civil War ended in January 1970.'},{q:'On what date was Murtala Mohammed assassinated?',o:['13 February 1976','31 December 1983','12 June 1993','8 June 1998'],a:1,w:'Murtala Mohammed was assassinated on 13 February 1976.'},{q:'On what date did Muhammadu Buhari\'s coup end the Second Republic?',o:['31 December 1983','13 February 1976','1 October 1979','27 August 1985'],a:1,w:'Buhari\'s coup, ending the Second Republic, took place on 31 December 1983.'},{q:'On what date was the presidential election that was later annulled held?',o:['12 June 1993','31 December 1983','29 May 1999','8 June 1998'],a:1,w:'The presidential election later annulled was held on 12 June 1993.'},{q:'On what date did Sani Abacha die, opening the way for civilian rule?',o:['8 June 1998','12 June 1993','29 May 1999','17 November 1993'],a:1,w:'Sani Abacha died on 8 June 1998, opening the way for a transition to civilian rule.'},{q:'Approximately how many total years of military rule did Nigeria experience across its post-independence history?',o:['Over 28 years','About 5 years','About 60 years','Nigeria has never experienced military rule'],a:1,w:'Nigeria experienced over 28 years of military rule across the periods 1966-79 and 1983-99.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
