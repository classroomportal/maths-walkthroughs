function shuffleMC(o){
  if(!o||!o.options)return o;
  var idxs=[];for(var k=0;k<o.options.length;k++){idxs.push(k);}
  for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=idxs[i];idxs[i]=idxs[j];idxs[j]=tmp;}
  var newOptions=[];for(var m=0;m<idxs.length;m++){newOptions.push(o.options[idxs[m]]);}
  var newCorrect=idxs.indexOf(o.correct);
  var o2={};for(var key in o){if(o.hasOwnProperty(key))o2[key]=o[key];}
  o2.options=newOptions;o2.correct=newCorrect;
  return o2;
}

{lb:"Defining federalism",dr:dQ1,ht:"<p><b>Federalism</b> is a system of government in which power is <b>constitutionally divided</b> between a central (federal) government and constituent states or regions, with each level having its own defined areas of authority.</p>"},
{lb:"Neither level can abolish the other",dr:dQ1,ht:"<p>Crucially, in a true federation, <b>neither the centre nor the states can unilaterally abolish the other\u2019s existence or powers</b> \u2014 the division is protected by a written constitution, not just ordinary law.</p>"},
{lb:"Federal vs unitary systems",dr:dQ1,ht:"<p>This contrasts with a <b>unitary system</b>, where all power flows from a single central government, which may delegate (and can withdraw) powers to local authorities at will \u2014 e.g. Ghana and (largely) the UK.</p>"},
{lb:"Nigeria's adoption of federalism",dr:dQ1,ht:"<p>Nigeria first adopted federalism in <b>1954</b> under the Lyttleton Constitution, largely because of the country\u2019s huge size, its ethnic and religious diversity, and the need to accommodate different regions within one country.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q": "What is federalism?", "o": ["A system where all power flows from one central government", "A system where power is constitutionally divided between a central government and states", "A system with no government at all", "A system used only by military regimes"], "a": 1, "w": "Federalism is a system where power is constitutionally divided between a central government and constituent states."}, {"q": "In a true federation, what is true of the central and state governments?", "o": ["The central government can freely abolish the states at any time", "Neither level can unilaterally abolish the other's existence or powers", "States can abolish the central government at any time", "There is no legal division of power at all"], "a": 1, "w": "In a true federation, neither the central government nor the states can unilaterally abolish the other."}, {"q": "What contrasts with federalism, where power flows from a single centre?", "o": ["A confederal system", "A unitary system", "An anarchic system", "A theocratic system"], "a": 1, "w": "A unitary system is one where all power flows from a single central government."}, {"q": "In which year did Nigeria first adopt federalism?", "o": ["1914", "1954", "1966", "1999"], "a": 1, "w": "Nigeria first adopted federalism in 1954, under the Lyttleton Constitution."}, {"q": "Which factor is cited as a key reason Nigeria adopted federalism?", "o": ["Its small size and homogeneity", "Its ethnic and religious diversity and large size", "Pressure from a single foreign power", "A total absence of any regional differences"], "a": 1, "w": "Nigeria's ethnic and religious diversity and large size were key reasons it adopted federalism."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q2 &bull; Gov &bull; Federalism",ti:"Features of a Federal System",su:"Identify and explain the key features that define a federal system of government.",steps:[
{lb:"A written constitution",dr:dQ2,ht:"<p>Federal systems require a <b>written, supreme constitution</b> that clearly defines the powers of each level of government \u2014 this document, not either government, is the ultimate legal authority.</p>"},
{lb:"Division of powers",dr:dQ2,ht:"<p>Powers are formally divided between the centre and the states, typically set out in lists (in Nigeria\u2019s case, the <b>Exclusive, Concurrent and Residual Lists</b>, covered in the next topic).</p>"},
{lb:"Constitutional supremacy",dr:dQ2,ht:"<p>Both the federal and state governments are <b>bound by the constitution</b> \u2014 neither is legally superior to the other; both derive their authority from it.</p>"},
{lb:"Bicameral legislature and independent judiciary",dr:dQ2,ht:"<p>Federations typically have a <b>bicameral legislature</b> (an upper chamber representing states/regions, e.g. Nigeria\u2019s Senate) and an <b>independent judiciary</b> capable of resolving disputes between the federal and state governments.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q": "What kind of constitution do federal systems require?", "o": ["An unwritten, informal set of customs only", "A written, supreme constitution defining each level's powers", "No constitution at all", "A constitution that only the states can amend"], "a": 1, "w": "Federal systems require a written, supreme constitution defining each level's powers."}, {"q": "In Nigeria's federal system, what are powers divided into?", "o": ["Only one single list covering everything", "Exclusive, Concurrent and Residual Lists", "A single 'National List' only", "There is no division of powers in Nigeria"], "a": 1, "w": "Nigeria's federal system divides powers into Exclusive, Concurrent and Residual Lists."}, {"q": "Under constitutional supremacy, which level of government is legally superior?", "o": ["The federal government is always superior", "Neither \u2014 both derive authority from and are bound by the constitution", "The states are always superior", "Whichever level has more soldiers"], "a": 1, "w": "Neither level is superior \u2014 both the federal and state governments are bound by the constitution."}, {"q": "What does a bicameral legislature in a federation typically represent?", "o": ["Only the capital city", "States or regions, via an upper chamber like Nigeria's Senate", "Only the military", "Only foreign governments"], "a": 1, "w": "A bicameral legislature's upper chamber (like Nigeria's Senate) typically represents states or regions."}, {"q": "What role does an independent judiciary play in a federal system?", "o": ["It has no role in federal systems", "It resolves disputes between the federal and state governments", "It only handles criminal cases", "It writes the constitution each year"], "a": 1, "w": "An independent judiciary resolves disputes between the federal and state governments."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q3 &bull; Gov &bull; Federalism",ti:"Exclusive, Concurrent and Residual Lists",su:"Explain the three legislative lists under Nigeria's 1999 Constitution and what falls under each.",steps:[
{lb:"The Exclusive List",dr:dQ3,ht:"<p>The <b>Exclusive List</b> (around 68 items) contains matters only the <b>federal government</b> may legislate on \u2014 including defence, foreign affairs, currency, immigration, the police, and mines and minerals.</p>"},
{lb:"The Concurrent List",dr:dQ3,ht:"<p>The <b>Concurrent List</b> contains matters <b>both</b> federal and state governments may legislate on \u2014 such as education, health, electricity and agriculture. Where laws conflict, <b>federal law prevails</b>.</p>"},
{lb:"The Residual List",dr:dQ3,ht:"<p>Anything <b>not mentioned</b> in either the Exclusive or Concurrent Lists falls to the <b>Residual List</b>, over which only <b>state governments</b> may legislate \u2014 e.g. regulating local markets or chieftaincy matters.</p>"},
{lb:"Why the lists matter",dr:dQ3,ht:"<p>These lists are central to debates about Nigerian federalism: critics argue the Exclusive List is <b>too large</b>, over-centralising power at the federal level and limiting what states can independently control.</p>"},
{lb:"Your turn",dr:dQ3,ht:tryItMC(function(){var qs=[{"q": "Which list can ONLY the federal government legislate on?", "o": ["The Concurrent List", "The Exclusive List", "The Residual List", "There is no such list"], "a": 1, "w": "The Exclusive List can only be legislated on by the federal government."}, {"q": "Which of these is an example of an Exclusive List matter?", "o": ["Local market regulation", "Defence and foreign affairs", "Chieftaincy matters", "Local roads"], "a": 1, "w": "Defence and foreign affairs are Exclusive List matters, handled only by the federal government."}, {"q": "On the Concurrent List, if federal and state laws conflict, which prevails?", "o": ["State law always prevails", "Federal law prevails", "Neither law applies", "Local government law prevails"], "a": 1, "w": "On the Concurrent List, federal law prevails if there is a conflict with state law."}, {"q": "Which of these is an example of a Concurrent List matter?", "o": ["Currency", "Education", "Immigration", "Defence"], "a": 1, "w": "Education is a Concurrent List matter, which both federal and state governments can legislate on."}, {"q": "What falls under the Residual List?", "o": ["Only matters the federal government chooses to ignore", "Anything not mentioned in the Exclusive or Concurrent Lists, for states only", "Only matters the President personally decides", "Nothing \u2014 the Residual List is empty"], "a": 1, "w": "The Residual List covers anything not in the Exclusive or Concurrent Lists, and only states may legislate on it."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q4 &bull; Gov &bull; Federalism",ti:"Revenue Allocation in Nigeria",su:"Explain how revenue is shared between the different levels of government in Nigeria.",steps:[
{lb:"The Federation Account",dr:dQ4,ht:"<p>Nigeria\u2019s major revenues (especially oil revenue) are paid into the <b>Federation Account</b>, then shared among the federal, state and local governments according to a formula set by the <b>Revenue Mobilisation, Allocation and Fiscal Commission (RMAFC)</b>.</p>"},
{lb:"The current sharing formula",dr:dQ4,ht:"<p>The approximate current split is <b>Federal Government 52.68%, States 26.72%, Local Governments 20.60%</b> \u2014 though these percentages are periodically reviewed and remain politically contested.</p>"},
{lb:"The 13% derivation principle",dr:dQ4,ht:"<p>Under the <b>13% derivation principle</b>, states from which natural resources (chiefly oil) are extracted receive an additional 13% of the revenue derived from resources found within their territory.</p>"},
{lb:"A source of ongoing tension",dr:dQ4,ht:"<p>Revenue allocation remains one of Nigeria\u2019s most persistent political tensions \u2014 oil-producing Niger Delta states argue their share is too small given the environmental costs of extraction on their land.</p>"},
{lb:"Your turn",dr:dQ4,ht:tryItMC(function(){var qs=[{"q": "What is the Federation Account?", "o": ["A private bank account owned by the President", "The pool into which major national revenues are paid before being shared", "A fund only for the military", "A tax paid only by state governments"], "a": 1, "w": "The Federation Account is the pool into which major national revenues (especially oil) are paid before being shared."}, {"q": "Which body sets Nigeria's revenue-sharing formula?", "o": ["The Independent National Electoral Commission (INEC)", "The Revenue Mobilisation, Allocation and Fiscal Commission (RMAFC)", "The Nigerian Football Federation", "The Central Bank of Nigeria alone"], "a": 1, "w": "The Revenue Mobilisation, Allocation and Fiscal Commission (RMAFC) sets Nigeria's revenue-sharing formula."}, {"q": "Roughly what share of the Federation Account goes to the Federal Government currently?", "o": ["About 10%", "About 52.68%", "About 90%", "100%"], "a": 1, "w": "The Federal Government currently receives roughly 52.68% of the Federation Account."}, {"q": "What does the 13% derivation principle provide?", "o": ["An extra 13% to every state equally", "An extra 13% of revenue to states where natural resources are extracted", "A 13% tax cut for the Federal Government only", "Nothing \u2014 it was abolished in 1999"], "a": 1, "w": "The 13% derivation principle gives resource-producing states an extra 13% of revenue derived from resources in their territory."}, {"q": "Why is revenue allocation a persistent source of tension in Nigeria?", "o": ["Because all states receive exactly equal shares with no dispute", "Because oil-producing states argue their share is too small given extraction costs", "Because Nigeria has no oil revenue at all", "Because only the Federal Government is allowed to discuss it"], "a": 1, "w": "Revenue allocation is contentious partly because oil-producing states argue their derivation share is too small given the environmental costs they bear."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q5 &bull; Gov &bull; Federalism",ti:"The Resource Control Debate",su:"Explain the resource control debate and why it remains contentious in Nigeria.",steps:[
{lb:"What is resource control?",dr:dQ5,ht:"<p><b>Resource control</b> is the demand by oil-producing states \u2014 chiefly in the Niger Delta \u2014 for a <b>greater share</b> of, or even full control over, revenue from natural resources found on or under their own land.</p>"},
{lb:"Arguments for greater derivation",dr:dQ5,ht:"<p>Niger Delta states argue the current <b>13% derivation</b> is too low given the severe <b>environmental damage</b> (oil spills, gas flaring) their communities bear as a direct result of extraction.</p>"},
{lb:"The federal government's position",dr:dQ5,ht:"<p>The federal government argues that natural resources belong to the <b>entire nation</b>, not just the states where they are found, citing laws such as the <b>Land Use Act (1978)</b> and the Petroleum Act, which vest resource ownership in the state.</p>"},
{lb:"Consequences of the dispute",dr:dQ5,ht:"<p>Unresolved resource control grievances have been linked to <b>Niger Delta militancy</b> (e.g. groups like MEND) and unrest, eventually prompting the federal government\u2019s <b>amnesty programme from 2009</b> for former militants.</p>"},
{lb:"Your turn",dr:dQ5,ht:tryItMC(function(){var qs=[{"q": "What is 'resource control' in the Nigerian context?", "o": ["A demand for a smaller federal government", "The demand of oil-producing states for a greater share of revenue from their own resources", "A law banning oil extraction entirely", "A programme to relocate the capital city"], "a": 1, "w": "Resource control is the demand of oil-producing states for a greater share of revenue from resources on their land."}, {"q": "Which region is most associated with the resource control debate?", "o": ["The Niger Delta", "The far North", "The South-West only", "The Middle Belt only"], "a": 0, "w": "The Niger Delta is most closely associated with the resource control debate."}, {"q": "What do Niger Delta states argue is too low, given environmental costs?", "o": ["Their state's population count", "The current 13% derivation share", "The number of local governments they have", "Their share of federal government appointments"], "a": 1, "w": "Niger Delta states argue the current 13% derivation share is too low given environmental costs."}, {"q": "Which law is cited as the basis for the Federal Government's position that resources belong to the whole nation?", "o": ["The Land Use Act (1978)", "The Independence Constitution of 1960", "The Universal Declaration of Human Rights", "The Freedom of Information Act"], "a": 0, "w": "The Land Use Act (1978) is cited as the basis for the Federal Government's position on national resource ownership."}, {"q": "What began in 2009 partly in response to Niger Delta militancy over resource control?", "o": ["A new state creation exercise", "An amnesty programme for former militants", "The abolition of the Federation Account", "A ban on oil exports"], "a": 1, "w": "An amnesty programme for former Niger Delta militants began in 2009."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q6 &bull; Gov &bull; Federalism",ti:"State Creation in Nigeria",su:"Trace the growth of Nigeria's states and evaluate the reasons for, and problems of, state creation.",steps:[
{lb:"From 3 regions to 36 states",dr:dQ6,ht:"<p>Nigeria began independence in 1960 with just <b>3 regions</b> (later 4). Major waves of state creation followed: <b>12 states (1967)</b>, <b>19 (1976)</b>, further waves in 1987 and 1991, and <b>36 states (1996)</b>, the current number, plus the FCT.</p>"},
{lb:"Reasons for state creation",dr:dQ6,ht:"<p>States were created to address <b>minority ethnic group agitation</b> for self-governance, promote local <b>administrative convenience and development</b>, and reduce fears of domination by larger ethnic groups within existing regions.</p>"},
{lb:"Financial viability problems",dr:dQ6,ht:"<p>A major criticism is that many newly created states are <b>not financially viable</b> on their own \u2014 they rely heavily on monthly federal allocations rather than generating meaningful internal revenue.</p>"},
{lb:"Ongoing debate",dr:dQ6,ht:"<p>Calls for <b>further state creation</b> continue to surface, particularly at constitutional review conferences, though critics argue Nigeria should instead consolidate and strengthen existing states rather than multiply them further.</p>"},
{lb:"Your turn",dr:dQ6,ht:tryItMC(function(){var qs=[{"q": "How many regions did Nigeria begin independence with in 1960?", "o": ["36", "3 (later 4)", "12", "19"], "a": 1, "w": "Nigeria began independence in 1960 with 3 regions, later becoming 4."}, {"q": "How many states does Nigeria currently have, since the 1996 exercise?", "o": ["12", "19", "36 (plus the FCT)", "50"], "a": 2, "w": "Nigeria currently has 36 states plus the FCT, since the 1996 state creation exercise."}, {"q": "Which of these is a stated reason for state creation in Nigeria?", "o": ["To reduce the number of ethnic groups", "To address minority ethnic group agitation for self-governance", "To abolish the Federal Government", "To eliminate local governments entirely"], "a": 1, "w": "Addressing minority ethnic group agitation for self-governance is a key stated reason for state creation."}, {"q": "What is a major criticism of many newly created states?", "o": ["They are too large in land area", "They are not financially viable and rely heavily on federal allocations", "They have too much oil revenue", "They have no state governors"], "a": 1, "w": "Many newly created states are criticised for not being financially viable and relying heavily on federal allocations."}, {"q": "What do critics suggest as an alternative to further state creation?", "o": ["Abolishing all existing states immediately", "Consolidating and strengthening existing states instead", "Returning to a purely unitary system", "Creating 100 new states at once"], "a": 1, "w": "Critics suggest consolidating and strengthening existing states rather than creating more."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q7 &bull; Gov &bull; Federalism",ti:"Fiscal Federalism",su:"Explain fiscal federalism and assess how centralised Nigeria's fiscal system is.",steps:[
{lb:"What is fiscal federalism?",dr:dQ7,ht:"<p><b>Fiscal federalism</b> refers to how financial responsibilities \u2014 raising revenue, and spending on public services \u2014 are divided between the federal, state and local levels of government.</p>"},
{lb:"Nigeria's centralised system",dr:dQ7,ht:"<p>Nigeria practises a highly <b>centralised fiscal system</b>: most major revenue, especially oil revenue, is collected at the <b>federal level</b> and then shared out, rather than states independently raising most of their own funds.</p>"},
{lb:"Weak internally generated revenue",dr:dQ7,ht:"<p>Critics point out that most Nigerian states have <b>weak internally generated revenue (IGR)</b> \u2014 e.g. from local taxes \u2014 and instead depend heavily on their <b>monthly federal allocation</b> just to fund basic operations.</p>"},
{lb:"Calls for reform",dr:dQ7,ht:"<p>Advocates for reform argue <b>true fiscal federalism</b> would require states to generate significantly more of their own revenue, reducing dependence on oil-based federal allocations and increasing state accountability.</p>"},
{lb:"Your turn",dr:dQ7,ht:tryItMC(function(){var qs=[{"q": "What does fiscal federalism refer to?", "o": ["How military powers are divided", "How financial responsibilities are divided between levels of government", "How elections are conducted", "How the judiciary is structured"], "a": 1, "w": "Fiscal federalism refers to how financial responsibilities are divided between levels of government."}, {"q": "How is Nigeria's fiscal system generally described?", "o": ["Highly decentralised, with states raising almost all their own funds", "Highly centralised, with most revenue collected federally then shared", "Entirely privatised", "Non-existent \u2014 Nigeria has no fiscal system"], "a": 1, "w": "Nigeria's fiscal system is generally described as highly centralised."}, {"q": "What do most Nigerian states have, according to critics?", "o": ["Very strong internally generated revenue (IGR)", "Weak internally generated revenue (IGR)", "No expenses at all", "More revenue than the Federal Government"], "a": 1, "w": "Most Nigerian states are criticised for having weak internally generated revenue (IGR)."}, {"q": "What do most states depend heavily on to fund operations?", "o": ["Foreign aid only", "Their monthly federal allocation", "Private donations only", "Lottery revenue"], "a": 1, "w": "Most states depend heavily on their monthly federal allocation to fund basic operations."}, {"q": "What do advocates for fiscal federalism reform generally call for?", "o": ["Abolishing states entirely", "States generating significantly more of their own revenue", "Ending all federal allocations immediately with no transition", "Removing the Federation Account concept"], "a": 1, "w": "Reform advocates generally call for states to generate significantly more of their own revenue."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q8 &bull; Gov &bull; Federalism",ti:"Problems of Nigerian Federalism",su:"Identify and explain the major structural problems facing Nigeria's federal system.",steps:[
{lb:"Fiscal imbalance",dr:dQ8,ht:"<p>Nigeria\u2019s heavy dependence on <b>federally-collected oil revenue</b>, shared out to states with weak internal revenue, creates a persistent <b>fiscal imbalance</b> that undermines genuine state autonomy.</p>"},
{lb:"Ethnic tension and domination fears",dr:dQ8,ht:"<p>Competition among Nigeria\u2019s major ethnic groups for political power and resources creates ongoing <b>ethnic tension</b>, with smaller groups often fearing domination by larger ones.</p>"},
{lb:"Overcentralisation",dr:dQ8,ht:"<p>Many critics argue the <b>Exclusive Legislative List is too large</b>, giving the federal government excessive control over matters that could reasonably be managed by states.</p>"},
{lb:"Weak state viability",dr:dQ8,ht:"<p>As covered earlier, many states \u2014 particularly smaller ones created for political rather than economic reasons \u2014 struggle to be <b>financially self-sustaining</b>, deepening dependence on the centre.</p>"},
{lb:"Your turn",dr:dQ8,ht:tryItMC(function(){var qs=[{"q": "What creates persistent fiscal imbalance in Nigerian federalism?", "o": ["Equal internal revenue across all states", "Heavy dependence on federally-collected oil revenue shared to states with weak IGR", "States having more revenue than the Federal Government", "The complete absence of any federal allocations"], "a": 1, "w": "Fiscal imbalance stems from heavy dependence on federally-collected oil revenue shared to states with weak internal revenue."}, {"q": "What is a source of ethnic tension in Nigerian federalism?", "o": ["A total absence of any ethnic groups", "Competition among major ethnic groups for power and resources", "Every ethnic group having identical political power at all times", "The complete abolition of ethnicity as a concept"], "a": 1, "w": "Competition among Nigeria's major ethnic groups for power and resources is a source of ethnic tension."}, {"q": "What do critics say about the Exclusive Legislative List?", "o": ["It is too small and should be expanded further", "It is too large, over-centralising power federally", "It does not exist", "It only covers agriculture"], "a": 1, "w": "Critics argue the Exclusive Legislative List is too large, over-centralising federal power."}, {"q": "Which states are particularly likely to struggle with financial viability?", "o": ["Only the oldest states from 1960", "Smaller states created for political rather than economic reasons", "States with no oil at all, exclusively", "Only Lagos and Abuja"], "a": 1, "w": "Smaller states created for political rather than economic reasons are particularly likely to struggle with financial viability."}, {"q": "Which of these is NOT typically listed as a problem of Nigerian federalism?", "o": ["Fiscal imbalance", "Ethnic tension", "Overcentralisation", "Complete absence of any state governments"], "a": 3, "w": "Nigeria does have state governments \u2014 the listed problems are fiscal imbalance, ethnic tension and overcentralisation, not an absence of states."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q9 &bull; Gov &bull; Federalism",ti:"The \u201cTrue Federalism\u201d / Restructuring Debate",su:"Explain the arguments for and against restructuring Nigeria towards \u201ctrue federalism\u201d.",steps:[
{lb:"\u201cFederalism in name only\u201d",dr:dQ9,ht:"<p>Critics argue Nigeria practises federalism <b>in name only</b>, since the central government retains excessive control over resources, security and legislative powers compared to genuine federations elsewhere.</p>"},
{lb:"Calls for restructuring",dr:dQ9,ht:"<p>Advocates of <b>restructuring</b> call for devolving more powers to states, granting greater resource control, and significantly <b>reducing the Exclusive List</b> so states can govern more independently.</p>"},
{lb:"Arguments against restructuring",dr:dQ9,ht:"<p>Opponents warn that restructuring could be <b>exploited for narrow ethnic or regional advantage</b>, weaken national unity, and risk fragmenting Nigeria along already-sensitive ethnic and religious lines.</p>"},
{lb:"National conferences on the issue",dr:dQ9,ht:"<p>The restructuring debate has been formally discussed at events such as the <b>2014 National Conference</b>, though its recommendations have not been fully implemented into law.</p>"},
{lb:"Your turn",dr:dQ9,ht:tryItMC(function(){var qs=[{"q": "What do critics mean when they say Nigeria practises federalism \u201cin name only\u201d?", "o": ["That Nigeria has no government at all", "That the centre retains excessive control compared to genuine federations", "That Nigeria has too many states", "That Nigeria is officially a unitary state on paper"], "a": 1, "w": "Critics mean the centre retains excessive control over resources and powers compared to genuine federations."}, {"q": "What do advocates of 'restructuring' typically call for?", "o": ["Abolishing all states", "Devolving more powers to states and reducing the Exclusive List", "Making Nigeria fully unitary", "Removing the Constitution entirely"], "a": 1, "w": "Restructuring advocates call for devolving more powers to states and reducing the Exclusive List."}, {"q": "What is a key argument made by opponents of restructuring?", "o": ["That it would definitely strengthen national unity", "That it could be exploited for narrow ethnic or regional advantage", "That restructuring is required by international law", "That restructuring has already fully happened"], "a": 1, "w": "Opponents argue restructuring could be exploited for narrow ethnic or regional advantage, risking national unity."}, {"q": "At which national event was restructuring formally discussed in 2014?", "o": ["The 2014 National Conference", "The FIFA World Cup", "The Commonwealth Summit", "The AU Peace and Security Council"], "a": 0, "w": "Restructuring was formally discussed at the 2014 National Conference."}, {"q": "Have the 2014 National Conference's recommendations been fully implemented into law?", "o": ["Yes, fully implemented immediately", "No, not fully implemented", "Yes, but only in 1999", "There was no such conference"], "a": 1, "w": "The 2014 National Conference's recommendations have not been fully implemented into law."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q10 &bull; Gov &bull; Federalism",ti:"Federalism \u2014 Summary and Exam Tips",su:"Consolidate the key facts on Nigerian federalism for exam use.",steps:[
{lb:"Core definitions to remember",dr:dQ10,ht:"<p>Remember: <b>federalism</b> = constitutional division of power between centre and states; <b>Exclusive/Concurrent/Residual Lists</b> = how legislative power is split; <b>fiscal federalism</b> = how revenue/finance is divided.</p>"},
{lb:"Key facts and figures",dr:dQ10,ht:"<p>Must-know facts: Nigeria adopted federalism in <b>1954</b>; currently has <b>36 states + FCT</b>; approximate revenue split is <b>Federal 52.68% / States 26.72% / LGAs 20.60%</b>; <b>13% derivation principle</b> for resource-producing states.</p>"},
{lb:"The federal character principle",dr:dQ10,ht:"<p>The <b>Federal Character Principle</b> in Nigeria\u2019s constitution requires appointments and resource distribution to reflect the country\u2019s diversity, ensuring no single ethnic or regional group dominates public life.</p>"},
{lb:"Weighing the debate",dr:dQ10,ht:"<p>A strong exam answer should present <b>both sides</b>: the case for restructuring towards \u201ctrue federalism\u201d, and the counter-argument that this risks national unity \u2014 supported with specific dated examples.</p>"},
