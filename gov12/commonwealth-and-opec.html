function shuffleMC(o){
  if(!o||!o.options)return o;
  var idxs=[];for(var k=0;k<o.options.length;k++){idxs.push(k);}
  for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=idxs[i];idxs[i]=idxs[j];idxs[j]=tmp;}

  o2.options=newOptions;o2.correct=newCorrect;

}

{ey:'Q1 \u2022 Gov • International Relations',ti:'The Commonwealth: Origins and Membership',su:'Trace the Commonwealth\'s evolution from the British Empire into a modern voluntary association.',steps:[
{lb:'From Empire to Commonwealth',dr:dQ1,ht:'<p>The modern <b>Commonwealth</b> evolved from the British Empire, formally recognised through the <b>1931 Statute of Westminster</b> (granting legislative equality to self-governing dominions) and the <b>1949 London Declaration</b>, which allowed newly-independent republics like India to remain members while recognising the British monarch only symbolically as <b>"Head of the Commonwealth."</b></p>'},
{lb:'A voluntary, diverse association',dr:dQ1,ht:'<p>Today\'s Commonwealth is a <b>voluntary association</b> of around 56 member states, mostly former British colonies and territories, though it also includes a small number of countries with no historical British colonial tie, such as <b>Mozambique, Rwanda, Togo and Gabon</b>, admitted based on shared values rather than colonial history alone.</p>'},
{lb:'Membership requirements',dr:dQ1,ht:'<p>Membership requires commitment to shared values codified in the <b>Commonwealth Charter (2012)</b>: democracy, human rights, rule of law, and gender equality &mdash; standards the Commonwealth can, in principle, enforce through suspension of non-compliant members.</p>'},
{lb:'Nigeria\'s membership',dr:dQ1,ht:'<p>Nigeria joined the Commonwealth at <b>independence in 1960</b>, one of many newly-independent African and Asian states that joined as Britain\'s colonial empire dissolved through the 1950s-1960s.</p>'},
{lb:'Regional spread of membership',dr:dQ1,ht:'<p>The 56 members span every inhabited continent: <b>Africa</b> (e.g. Nigeria, Ghana, Kenya, South Africa), <b>Asia</b> (e.g. India, Pakistan, Bangladesh, Malaysia, Singapore), the <b>Caribbean</b> (e.g. Jamaica, Trinidad and Tobago), the <b>Pacific</b> (e.g. Australia, New Zealand, Fiji, Papua New Guinea), and <b>Europe</b> (e.g. the UK, Cyprus, Malta). A full, current member list is maintained on the Commonwealth\'s own website.</p>'},

ights, rule of law and gender equality."},{"q":"In which year did Nigeria join the Commonwealth?","o":["1999","1975","1960","1963"],"a":2,"w":"Nigeria joined the Commonwealth at independence in 1960."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q2 \u2022 Gov • International Relations',ti:'The Commonwealth: Structure and Activities',su:'Explain the Commonwealth\'s key institutions and activities.',steps:[
{lb:'The Commonwealth Secretariat',dr:dQ2,ht:'<p>The <b>Commonwealth Secretariat</b>, based in London, is the Commonwealth\'s central administrative body, headed by a <b>Secretary-General</b>, coordinating the association\'s programmes and supporting member states on governance, trade and development issues.</p>'},
{lb:'CHOGM: the biennial summit',dr:dQ2,ht:'<p>The <b>Commonwealth Heads of Government Meeting (CHOGM)</b> is held every two years, bringing together the leaders of all member states to discuss shared priorities; <b>Nigeria hosted CHOGM in Abuja in 2003</b>.</p>'},
{lb:'Suspension and enforcement',dr:dQ2,ht:'<p>The Commonwealth can <b>suspend members</b> for serious violations of its shared values &mdash; notably suspending <b>Nigeria (1995-1999)</b> following General Abacha\'s execution of Ken Saro-Wiwa, and later suspending/prompting the withdrawal of <b>Zimbabwe (2002-2003)</b> over land reform and human rights concerns.</p>'},
{lb:'The Commonwealth Games and soft diplomacy',dr:dQ2,ht:'<p>The <b>Commonwealth Games</b>, held every four years, provide a major sporting event promoting unity and soft diplomatic ties among member states, alongside scholarship programmes and election observation missions that support the association\'s practical work.</p>'},

ns, among other activities."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q3 \u2022 Gov • International Relations',ti:'The Commonwealth: Values and Criticisms',su:'Evaluate the Commonwealth\'s role, achievements and criticisms.',steps:[
{lb:'Promoting shared democratic values',dr:dQ1,ht:'<p>The Commonwealth\'s core value is promoting <b>democracy, human rights and rule of law</b> among its diverse membership, using its Charter (2012) as a benchmark, and applying suspension as a tool of accountability, however imperfectly and inconsistently applied.</p>'},

{lb:'Ongoing relevance debates',dr:dQ1,ht:'<p>Debate continues about the Commonwealth\'s ongoing relevance in a changing world, especially following the death of Queen Elizabeth II (2022) and King Charles III\'s succession as Head of the Commonwealth &mdash; with some member states periodically debating whether to remain, particularly regarding historical colonial-era grievances and reparations.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What benchmark document does the Commonwealth use to promote democracy and human rights?","o":["The Commonwealth Charter (2012)","The UN Charter","The London Declaration","The Statute of Westminster"],"a":0,"w":"The Commonwealth Charter (2012) is the benchmark document used to promote democracy and human rights."},{"q":"What tool of accountability does the Commonwealth use against non-compliant members?","o":["Immediate military invasion","Suspension","Permanent, automatic expulsion with no path to return","Nothing — it has no accountability tools"],"a":1,"w":"Suspension is the Commonwealth's tool of accountability against non-compliant members."},{"q":"What educational programme does the Commonwealth facilitate for students?","o":["Only religious training programmes","Only agricultural apprenticeships","Commonwealth Scholarships","Only military academy exchanges"],"a":2,"w":"Commonwealth Scholarships facilitate educational exchange among member states."},{"q":"What criticism is often made of the Commonwealth's practical power?","o":["It has no criticisms at all","It has unlimited military power over all members","It has more power than the United Nations","It has limited practical power compared to bodies like the UN or AU"],"a":3,"w":"Critics argue the Commonwealth has limited practical power compared to bodies like the UN or AU."},{"q":"What is the Commonwealth sometimes described as, critically?","o":["A body with no connection to Britain at all","A purely economic trade bloc with no history","A symbolic remnant of the British Empire","A fully independent military alliance"],"a":2,"w":"The Commonwealth is sometimes critically described as a symbolic remnant of the British Empire."},{"q":"Who became Head of the Commonwealth following Queen Elizabeth II's death in 2022?","o":["A newly-elected President","King Charles III","The UN Secretary-General","The Nigerian President"],"a":1,"w":"King Charles III became Head of the Commonwealth following Queen Elizabeth II's death in 2022."},{"q":"What historical issue do some member states periodically debate regarding the Commonwealth?","o":["Whether to build a Commonwealth navy","Colonial-era grievances and reparations","Whether to merge with the United Nations","Whether to adopt a single Commonwealth currency"],"a":1,"w":"Some member states periodically debate colonial-era grievances and reparations in relation to the Commonwealth."},{"q":"What overall balanced view should a WAEC essay take of the Commonwealth?","o":["Only positive facts with no criticism at all","Refusing to discuss the Commonwealth entirely","Acknowledging both its practical value and its real limitations/criticisms","Only negative facts with no achievements at all"],"a":2,"w":"A balanced WAEC essay should acknowledge both the Commonwealth's practical value and its real limitations."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov • International Relations',ti:'OPEC: Origins and Membership',su:'Trace OPEC\'s founding and Nigeria\'s membership within it.',steps:[
{lb:'Founding in Baghdad (1960)',dr:dQ2,ht:'<p><b>OPEC (the Organization of the Petroleum Exporting Countries)</b> was founded in <b>September 1960 in Baghdad, Iraq</b>, by five founding members &mdash; <b>Iran, Iraq, Kuwait, Saudi Arabia and Venezuela</b> &mdash; in response to Western oil companies unilaterally cutting the prices they paid producing countries.</p>'},
{lb:'Core aims',dr:dQ2,ht:'<p>OPEC\'s core aim is to <b>coordinate and unify petroleum policies</b> among member states to secure <b>fair and stable prices</b> for petroleum producers, along with an efficient, economic and regular supply of petroleum to consuming nations.</p>'},
{lb:'Headquarters and expansion',dr:dQ2,ht:'<p>OPEC has been headquartered in <b>Vienna, Austria, since 1965</b>, and has since expanded to include additional oil-producing states across the Middle East, Africa, and Latin America.</p>'},
{lb:'Nigeria\'s membership',dr:dQ2,ht:'<p>Nigeria <b>joined OPEC in 1971</b>, becoming its <b>first sub-Saharan African member</b>, reflecting the growing significance of Nigeria\'s oil sector following the discovery of commercial oil in the Niger Delta in 1956.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"In which city was OPEC founded in September 1960?","o":["Riyadh, Saudi Arabia","Vienna, Austria","Lagos, Nigeria","Baghdad, Iraq"],"a":3,"w":"OPEC was founded in Baghdad, Iraq, in September 1960."},{"q":"Which five countries founded OPEC in 1960?","o":["Egypt, Libya, Algeria, Morocco and Tunisia","The USA, UK, France, Russia and China","Iran, Iraq, Kuwait, Saudi Arabia and Venezuela","Nigeria, Ghana, Senegal, Mali and Guinea"],"a":2,"w":"Iran, Iraq, Kuwait, Saudi Arabia and Venezuela founded OPEC in 1960."},{"q":"What prompted the founding of OPEC?","o":["A war between Iran and Iraq","Western oil companies unilaterally cutting the prices paid to producing countries","A decision by the African Union","The founding of the United Nations"],"a":1,"w":"OPEC was founded in response to Western oil companies unilaterally cutting prices paid to producing countries."},{"q":"What is OPEC's core aim?","o":["To replace the United Nations","To coordinate petroleum policies to secure fair and stable prices for producers","To abolish all oil production worldwide","To create a single global currency"],"a":1,"w":"OPEC's core aim is to coordinate petroleum policies to secure fair and stable prices for producers."},{"q":"Since which year has OPEC been headquartered in Vienna, Austria?","o":["1965","1971","1960","1975"],"a":0,"w":"OPEC has been headquartered in Vienna, Austria, since 1965."},{"q":"In which year did Nigeria join OPEC?","o":["1960","1999","1956","1971"],"a":3,"w":"Nigeria joined OPEC in 1971."},{"q":"What distinction does Nigeria hold as an OPEC member?","o":["It is the only West African OPEC member ever admitted","It is OPEC's largest member by land area","It was OPEC's founding member","It was OPEC's first sub-Saharan African member"],"a":3,"w":"Nigeria was OPEC's first sub-Saharan African member."},{"q":"In which year was commercial oil first discovered in the Niger Delta?","o":["1971","1999","1956","1960"],"a":2,"w":"Commercial oil was first discovered in the Niger Delta in 1956."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov • International Relations',ti:'OPEC: Structure and Functions',su:'Explain OPEC\'s key institutions and how it coordinates member states\' oil policy.',steps:[
{lb:'The OPEC Conference',dr:dQ1,ht:'<p>The <b>OPEC Conference</b> is OPEC\'s supreme decision-making authority, comprising the <b>oil or energy ministers</b> of member states, meeting periodically to set overall policy direction, including production quotas.</p>'},
{lb:'The OPEC Secretariat',dr:dQ1,ht:'<p>The <b>OPEC Secretariat</b>, based in Vienna and headed by a <b>Secretary-General</b>, implements Conference decisions and conducts research and analysis to inform member states\' policy decisions.</p>'},
{lb:'Production quotas',dr:dQ1,ht:'<p>OPEC coordinates <b>production quotas</b> among member states &mdash; agreed limits on how much oil each country can produce &mdash; as its primary tool for influencing global oil supply and, consequently, prices.</p>'},
{lb:'OPEC+ and expanded coordination',dr:dQ1,ht:'<p>Since <b>2016</b>, OPEC has coordinated more broadly through <b>"OPEC+"</b>, an expanded arrangement including major non-OPEC oil producers such as <b>Russia</b>, significantly expanding the group\'s collective influence over global oil markets.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is OPEC's supreme decision-making authority called?","o":["The OPEC Assembly","The OPEC Council","The OPEC Secretariat","The OPEC Conference"],"a":3,"w":"The OPEC Conference is OPEC's supreme decision-making authority."},{"q":"Who comprises the OPEC Conference?","o":["Only private oil company executives","Only the UN Secretary-General","Only the presidents of member states","The oil or energy ministers of member states"],"a":3,"w":"The OPEC Conference comprises the oil or energy ministers of member states."},{"q":"What does the OPEC Secretariat do?","o":["Implements Conference decisions and conducts research and analysis","Has no function at all within OPEC","Only manages OPEC's physical headquarters building","Sets its own independent policy ignoring the Conference"],"a":0,"w":"The OPEC Secretariat implements Conference decisions and conducts research and analysis."},{"q":"What is OPEC's primary tool for influencing global oil supply and prices?","o":["Trade tariffs on unrelated goods","Military intervention","Production quotas","Currency manipulation"],"a":2,"w":"Production quotas are OPEC's primary tool for influencing global oil supply and prices."},{"q":"What are production quotas?","o":["Fixed prices set for consumers worldwide","Taxes imposed on oil imports","Rules about which countries can join OPEC","Agreed limits on how much oil each member country can produce"],"a":3,"w":"Production quotas are agreed limits on how much oil each member country can produce."},{"q":"What expanded arrangement, formed in 2016, includes non-OPEC producers like Russia?","o":["OPEC+","ECOWAS","The Commonwealth","The African Union"],"a":0,"w":"OPEC+, formed in 2016, includes non-OPEC producers like Russia."},{"q":"Why was OPEC+ formed?","o":["To significantly expand the group's collective influence over global oil markets","To end all oil production worldwide","To replace OPEC entirely","To create a single global currency"],"a":0,"w":"OPEC+ was formed to significantly expand the group's collective influence over global oil markets."},{"q":"Which major non-OPEC oil producer is included in OPEC+?","o":["Russia","Nigeria","The United Kingdom","Ghana"],"a":0,"w":"Russia is the major non-OPEC oil producer included in OPEC+."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov • International Relations',ti:'OPEC\'s Influence on Global Oil Markets',su:'Evaluate OPEC\'s historical and contemporary influence on the global economy.',steps:[
{lb:'The 1973 oil embargo',dr:dQ2,ht:'<p>OPEC\'s most dramatic demonstration of influence came in <b>1973</b>, when Arab OPEC members imposed an <b>oil embargo</b> against countries supporting Israel during the Yom Kippur War, causing oil prices to <b>quadruple</b> and triggering a severe global economic shock.</p>'},
{lb:'Ongoing influence through supply coordination',dr:dQ2,ht:'<p>OPEC (and now OPEC+) continues to influence global oil prices through coordinated <b>production increases or cuts</b>, directly affecting the economies of both oil-importing nations (facing higher costs) and oil-exporting nations (facing revenue changes) worldwide.</p>'},
{lb:'Challenges to OPEC\'s dominance',dr:dQ2,ht:'<p>OPEC\'s market dominance has been challenged in recent decades by the rise of <b>US shale oil production</b> (significant from the 2010s), which increased global supply outside OPEC\'s control, somewhat reducing the group\'s ability to single-handedly dictate prices.</p>'},
{lb:'The renewable energy transition',dr:dQ2,ht:'<p>The global <b>transition toward renewable energy</b> and climate policy presents a longer-term structural challenge to OPEC\'s influence, as demand for fossil fuels is expected to gradually decline, prompting debate about oil-dependent economies\' need to diversify.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"In which year did OPEC's oil embargo dramatically demonstrate its influence?","o":["1973","1965","1999","1960"],"a":0,"w":"OPEC's oil embargo in 1973 dramatically demonstrated its influence."},{"q":"Against whom was the 1973 oil embargo imposed?","o":["Countries supporting Israel during the Yom Kippur War","Countries supporting Nigeria's independence","Countries supporting the Commonwealth","Countries opposing apartheid South Africa"],"a":0,"w":"The 1973 embargo was imposed against countries supporting Israel during the Yom Kippur War."},{"q":"What effect did the 1973 embargo have on oil prices?","o":["Prices remained completely unchanged","Prices halved","Prices quadrupled","Prices fell to zero"],"a":2,"w":"The 1973 embargo caused oil prices to quadruple."},{"q":"How does OPEC continue to influence global oil prices today?","o":["Through coordinated production increases or cuts","Through control of the United Nations","Through direct control of all countries' currencies","It no longer has any influence at all"],"a":0,"w":"OPEC continues to influence global oil prices through coordinated production increases or cuts."},{"q":"What recent development has challenged OPEC's market dominance?","o":["The founding of ECOWAS","The founding of the African Union","The rise of US shale oil production","The end of the Cold War"],"a":2,"w":"The rise of US shale oil production has challenged OPEC's market dominance in recent decades."},{"q":"From which decade did US shale oil production become significant?","o":["The 1960s","The 1970s","The 1990s","The 2010s"],"a":3,"w":"US shale oil production became significant from the 2010s."},{"q":"What longer-term structural challenge does the renewable energy transition present to OPEC?","o":["A guaranteed increase in oil prices forever","No challenge at all, since renewables cannot be produced","An immediate, total end to all oil demand within one year","A gradual expected decline in demand for fossil fuels"],"a":3,"w":"The renewable energy transition presents a gradual expected decline in fossil fuel demand as a long-term challenge to OPEC."},{"q":"What debate does the renewable energy transition prompt for oil-dependent economies?","o":["The need to diversify their economies","The need to abolish all forms of energy production","The need to increase oil dependency further","The need to leave the United Nations"],"a":0,"w":"The renewable energy transition prompts debate about the need for oil-dependent economies to diversify."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov • International Relations',ti:'Criticisms of OPEC',su:'Evaluate the main criticisms levelled against OPEC as an organisation.',steps:[
{lb:'Accusations of cartel behaviour',dr:dQ2,ht:'<p>OPEC is frequently criticised as a <b>cartel</b> &mdash; a group of producers coordinating to restrict supply and keep prices artificially high &mdash; behaviour that would be illegal for private companies under most countries\' domestic antitrust/competition law, though OPEC operates between sovereign states, largely outside such legal jurisdiction.</p>'},
{lb:'Internal disputes among members',dr:dQ2,ht:'<p>OPEC has periodically suffered from <b>internal disputes</b>, with member states disagreeing over production quotas or secretly exceeding agreed limits to maximise their own individual revenue, undermining collective discipline and occasionally causing prices to fall sharply.</p>'},
{lb:'Impact on oil-importing developing countries',dr:dQ2,ht:'<p>Critics note that OPEC\'s price-influencing actions can impose significant hardship on <b>poorer, oil-importing developing countries</b>, who face rising fuel costs without benefiting from any oil-export revenue themselves.</p>'},
{lb:'Declining relative influence',dr:dQ2,ht:'<p>OPEC\'s overall global market share and influence has <b>gradually declined</b> relative to its early decades, due to the rise of non-OPEC producers (US shale) and long-term pressure from the global renewable energy transition, prompting some analysts to question its long-term future relevance.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is OPEC frequently criticised as, given its coordination of production and prices?","o":["A military alliance","A cartel","A charity","A purely humanitarian organisation"],"a":1,"w":"OPEC is frequently criticised as a cartel coordinating production and prices."},{"q":"What would cartel-like behaviour typically be illegal under, if practised by private companies?","o":["Constitutional law only","International human rights law only","Maritime law only","Domestic antitrust/competition law"],"a":3,"w":"Cartel-like behaviour would typically be illegal under domestic antitrust/competition law if practised by private companies."},{"q":"Why does OPEC largely operate outside such domestic competition law?","o":["It operates between sovereign states, largely outside such legal jurisdiction","No country has ever passed antitrust law","It has been specifically exempted by the United Nations","OPEC is itself a private company"],"a":0,"w":"OPEC operates between sovereign states, largely outside domestic competition law jurisdiction."},{"q":"What internal problem has periodically undermined OPEC's collective discipline?","o":["A rule requiring only one member state to exist","A total absence of any member states","Members secretly exceeding agreed production quotas","Complete unanimous agreement on every decision ever made"],"a":2,"w":"Members secretly exceeding agreed production quotas has periodically undermined OPEC's collective discipline."},{"q":"What effect can this internal indiscipline sometimes cause?","o":["No effect on prices whatsoever","Prices rising to unlimited levels permanently","Prices falling sharply due to oversupply","Immediate dissolution of OPEC entirely"],"a":2,"w":"This internal indiscipline can cause prices to fall sharply due to oversupply."},{"q":"Who does OPEC's price-influencing behaviour particularly hurt, according to critics?","o":["Only Nigeria specifically","Poorer, oil-importing developing countries","Only wealthy oil-exporting countries","No one — OPEC has no negative effects on anyone"],"a":1,"w":"Critics argue OPEC's price-influencing behaviour particularly hurts poorer, oil-importing developing countries."},{"q":"What has gradually declined regarding OPEC's overall position in the global oil market?","o":["Its total number of member states, to zero","Its overall global market share and influence","Nigeria's membership status","Its headquarters building in Vienna"],"a":1,"w":"OPEC's overall global market share and influence has gradually declined relative to its early decades."},{"q":"What two factors are cited as contributing to OPEC's declining relative influence?","o":["The rise of US shale oil and the renewable energy transition","The end of the Cold War and WWII","The rise of the Commonwealth and CHOGM","The founding of the African Union and ECOWAS"],"a":0,"w":"The rise of US shale oil production and the global renewable energy transition are cited as contributing to OPEC's declining relative influence."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov • International Relations',ti:'Nigeria\'s Membership: Balancing Commonwealth and OPEC',su:'Evaluate how Nigeria\'s dual membership in the Commonwealth and OPEC serves its national interest.',steps:[
{lb:'Two very different organisations',dr:dQ1,ht:'<p>Nigeria\'s membership of the <b>Commonwealth</b> (political/cultural, rooted in colonial history) and <b>OPEC</b> (economic, rooted in shared oil-producer interests) serve <b>different dimensions</b> of Nigeria\'s national interest &mdash; one prestige/soft-power oriented, the other directly economic.</p>'},
{lb:'Commonwealth: soft power and diaspora ties',dr:dQ1,ht:'<p>Nigeria\'s Commonwealth membership sustains <b>educational, diaspora and soft-power ties</b>, particularly with the UK, benefiting from scholarship programmes and preferential relationships, despite the historical tension of its 1995-1999 suspension.</p>'},
{lb:'OPEC: direct economic dependency',dr:dQ1,ht:'<p>Nigeria\'s OPEC membership is far more <b>directly tied to national economic survival</b>, since oil revenue funds a large share of the federal budget, making OPEC production quota decisions immediately consequential for Nigeria\'s fiscal position.</p>'},
{lb:'Managing occasionally competing pressures',dr:dQ1,ht:'<p>Nigeria must sometimes manage <b>competing pressures</b> &mdash; e.g. balancing OPEC production quota commitments against domestic pressure to maximise oil output for revenue, or reconciling Commonwealth democratic-values commitments with practical domestic political realities.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What kind of organisation is the Commonwealth, in terms of its primary character?","o":["Purely economic, rooted in oil production","A military alliance","A currency union","Political/cultural, rooted in colonial history"],"a":3,"w":"The Commonwealth is primarily a political/cultural organisation rooted in colonial history."},{"q":"What kind of organisation is OPEC, in terms of its primary character?","o":["A currency union","Economic, rooted in shared oil-producer interests","A military alliance","Purely political, rooted in colonial history"],"a":1,"w":"OPEC is primarily an economic organisation rooted in shared oil-producer interests."},{"q":"What kind of ties does Nigeria's Commonwealth membership sustain?","o":["Only military cooperation","Educational, diaspora and soft-power ties","Only currency exchange rates","Only direct oil revenue"],"a":1,"w":"Nigeria's Commonwealth membership sustains educational, diaspora and soft-power ties."},{"q":"Why is Nigeria's OPEC membership described as more directly tied to national economic survival?","o":["Oil revenue funds a large share of the federal budget","OPEC controls Nigeria's education system","OPEC has no economic relevance to Nigeria at all","OPEC sets Nigeria's electoral rules"],"a":0,"w":"OPEC membership is directly tied to economic survival because oil revenue funds a large share of Nigeria's federal budget."},{"q":"What historical tension exists within Nigeria's Commonwealth membership?","o":["Its 1995-1999 suspension","Nigeria never actually joining the Commonwealth","A total absence of any historical tension","A permanent expulsion with no path to return"],"a":0,"w":"Nigeria's 1995-1999 Commonwealth suspension represents a historical tension within its membership."},{"q":"What competing pressure can Nigeria face regarding OPEC production quotas?","o":["Pressure to leave OPEC immediately and permanently","Pressure only from the Commonwealth, never from OPEC","Balancing quota commitments against domestic pressure to maximise revenue","No competing pressure exists at all regarding OPEC"],"a":2,"w":"Nigeria can face competing pressure balancing OPEC quota commitments against domestic pressure to maximise oil revenue."},{"q":"What competing pressure can Nigeria face regarding Commonwealth commitments?","o":["Reconciling democratic-values commitments with domestic political realities","Pressure only from OPEC, never from the Commonwealth","No competing pressure exists at all regarding the Commonwealth","Pressure to leave the Commonwealth immediately and permanently"],"a":0,"w":"Nigeria can face competing pressure reconciling Commonwealth democratic-values commitments with domestic political realities."},{"q":"What overall lesson does Nigeria's dual membership illustrate about national interest?","o":["The Commonwealth and OPEC are identical organisations with different names","A state can only ever join one international organisation at a time","A single state can pursue different dimensions of national interest through different organisations simultaneously","National interest has no relationship to international organisation membership"],"a":2,"w":"Nigeria's dual membership illustrates how a single state can pursue different dimensions of national interest through different organisations simultaneously."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov • International Relations',ti:'WAEC Exam Preparation — Commonwealth and OPEC',su:'Practise WAEC-style questions on the Commonwealth and OPEC.',steps:[
{lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC essays on the Commonwealth or OPEC: (1) Give the <b>founding date and context</b>. (2) Describe the relevant <b>structure or function</b> asked about. (3) Give <b>specific, dated examples</b>. (4) Evaluate significance for Nigeria specifically where relevant.</p>'},
{lb:'Common WAEC question patterns',dr:dQ2,ht:'<p>Common patterns include: "Discuss the origin and functions of the Commonwealth." / "Explain the structure and aims of OPEC." / "Examine Nigeria\'s relationship with the Commonwealth since independence." / "Assess the significance of OPEC membership for Nigeria\'s economy."</p>'},
{lb:'Key vocabulary for essays',dr:dQ2,ht:'<p>Key vocabulary: <b>Commonwealth Charter</b>, <b>CHOGM</b>, <b>Head of the Commonwealth</b>, <b>OPEC Conference</b>, <b>production quota</b>, <b>OPEC+</b>, <b>oil embargo</b>. Precise, correctly-spelled terms strengthen WAEC answers significantly.</p>'},
{lb:'Distinguishing the two organisations',dr:dQ2,ht:'<p>WAEC essays should clearly distinguish the <b>Commonwealth</b> (political/cultural association of former British territories) from <b>OPEC</b> (economic cartel of oil-producing states) &mdash; two entirely different organisations Nigeria happens to belong to for very different reasons.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on the Commonwealth or OPEC?","o":["Immediately give a personal opinion with no facts","Skip straight to a conclusion","Give the founding date and context","List unrelated dates with no explanation"],"a":2,"w":"A strong essay should begin by giving the founding date and historical context."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"List the rivers of Nigeria.\"","\"Explain the structure and aims of OPEC.\"","\"Define photosynthesis.\""],"a":2,"w":"\"Explain the structure and aims of OPEC\" is a typical WAEC-style question on this topic."},{"q":"In which year was the Commonwealth Charter adopted, codifying shared values?","o":["1960","1931","1949","2012"],"a":3,"w":"The Commonwealth Charter was adopted in 2012, codifying shared values."},{"q":"In which year was OPEC founded, a key date for this topic?","o":["1960","1965","1975","1971"],"a":0,"w":"OPEC was founded in 1960, a key date for this topic."},{"q":"What term describes agreed limits on how much oil OPEC member countries can produce?","o":["Trade tariffs","Diplomatic sanctions","Production quotas","Currency pegs"],"a":2,"w":"\"Production quotas\" describes agreed limits on how much oil OPEC member countries can produce."},{"q":"What historic 1973 event should be mentioned when discussing OPEC's global influence?","o":["The founding of the United Nations","The Nigerian Civil War","The oil embargo against countries supporting Israel","The Berlin Conference"],"a":2,"w":"The 1973 oil embargo should be mentioned when discussing OPEC's global influence."},{"q":"Why should WAEC students clearly distinguish the Commonwealth from OPEC?","o":["They are entirely different organisations Nigeria belongs to for very different reasons","OPEC is larger than the Commonwealth","The Commonwealth only exists within Nigeria","They are exactly the same organisation with two names"],"a":0,"w":"The Commonwealth and OPEC are entirely different organisations Nigeria belongs to for very different reasons, so clear distinction matters."},{"q":"What should a WAEC essay evaluate regarding Nigeria specifically, where relevant to the question?","o":["Nothing beyond the founding dates","Only the history of other countries","Only facts unrelated to Nigeria","The significance of membership for Nigeria's interests"],"a":3,"w":"A WAEC essay should evaluate the significance of membership for Nigeria's interests where relevant to the question."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov • International Relations',ti:'Mixed Questions — Commonwealth and OPEC',su:'Integrated revision across the Commonwealth and OPEC.',steps:[
{lb:'Summary of key points',dr:dQ1,ht:'<p>The <b>Commonwealth</b> (est. formally 1931/1949, ~56 members) is a political/cultural association of mostly former British territories, while <b>OPEC</b> (founded 1960, headquartered Vienna) is an economic organisation coordinating oil-producer policy &mdash; Nigeria belongs to both, serving very different dimensions of its national interest.</p>'},
{lb:'Key dates and names to remember',dr:dQ1,ht:'<p>Must-know facts: <b>1931/1949</b> (Commonwealth\'s formal origins); <b>1960</b> (Nigeria joins Commonwealth at independence; OPEC founded in Baghdad); <b>1971</b> (Nigeria joins OPEC); <b>1973</b> (OPEC oil embargo); <b>1995-1999</b> (Nigeria\'s Commonwealth suspension); <b>2003</b> (Nigeria hosts CHOGM); <b>2016</b> (OPEC+ formed).</p>'},
{lb:'Lessons for Nigeria',dr:dQ1,ht:'<p>Nigeria\'s engagement with both organisations illustrates how a single state balances soft-power/cultural ties (Commonwealth) with direct economic interests (OPEC), and how membership can carry both benefits and accountability risks (as shown by Nigeria\'s Commonwealth suspension).</p>'},
{lb:'Final exam tips',dr:dQ1,ht:'<p>Always clearly distinguish the <b>Commonwealth</b> from <b>OPEC</b>, use precise founding dates and named events, and conclude by weighing each organisation\'s specific significance for Nigeria\'s distinct interests.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"In which year did Nigeria join the Commonwealth, at independence?","o":["1971","1999","1975","1960"],"a":3,"w":"Nigeria joined the Commonwealth in 1960, at independence."},{"q":"In which year did Nigeria join OPEC?","o":["1999","1965","1960","1971"],"a":3,"w":"Nigeria joined OPEC in 1971."},{"q":"For how many years was Nigeria suspended from the Commonwealth, following Ken Saro-Wiwa's execution?","o":["One year","Nigeria was never suspended","Four years (1995-1999)","Ten years"],"a":2,"w":"Nigeria was suspended from the Commonwealth for four years, 1995 to 1999."},{"q":"In which year did the dramatic OPEC oil embargo occur?","o":["1960","1999","1973","1971"],"a":2,"w":"The dramatic OPEC oil embargo occurred in 1973."},{"q":"In which city is OPEC headquartered?","o":["Baghdad, Iraq","Vienna, Austria","London, UK","Lagos, Nigeria"],"a":1,"w":"OPEC is headquartered in Vienna, Austria."},{"q":"In which year did Nigeria host the Commonwealth Heads of Government Meeting (CHOGM)?","o":["2003","1960","1971","1995"],"a":0,"w":"Nigeria hosted CHOGM in 2003."},{"q":"In which year was the expanded \"OPEC+\" arrangement formed, including Russia?","o":["1960","1973","1999","2016"],"a":3,"w":"OPEC+ was formed in 2016, including Russia and other non-OPEC producers."},{"q":"What does Nigeria's dual membership of the Commonwealth and OPEC illustrate?","o":["How a state can pursue different dimensions of national interest through different organisations","That Nigeria has no national interest at all","That the Commonwealth and OPEC are identical bodies","That a state can only ever belong to one organisation"],"a":0,"w":"Nigeria's dual membership illustrates how a state can pursue different dimensions of national interest through different organisations."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
