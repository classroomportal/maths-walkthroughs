<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});

var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Transport',ti:'Heart Structure and the Cardiac Cycle',su:'Describe the structure of the heart and the sequence of events in the cardiac cycle.',steps:[
  {lb:'Heart structure',dr:dQ1,ht:'<p>The mammalian heart: four chambers (right atrium, right ventricle, left atrium, left ventricle). <b>Atrioventricular (AV) valves:</b> tricuspid (right), bicuspid/mitral (left) \u2014 prevent backflow into atria during ventricular systole. <b>Semilunar valves:</b> pulmonary (right) and aortic (left) \u2014 prevent backflow into ventricles during diastole.</p>'},
  {lb:'Cardiac cycle',dr:dQ1,ht:'<p><b>Atrial systole:</b> atria contract \u2192 blood into ventricles (AV valves open, semilunar closed). <b>Ventricular systole:</b> ventricles contract \u2192 blood into pulmonary artery and aorta (AV valves shut \u2014 \u2018lub\u2019; semilunar open). <b>Diastole:</b> all chambers relax \u2192 semilunar valves shut (\u2018dub\u2019); blood fills atria from veins. Heart rate ~72 bpm; cardiac output = heart rate \u00d7 stroke volume.</p>'},
  {lb:'Electrical conduction',dr:dQ1,ht:'<p><b>SAN</b> (sinoatrial node, pacemaker): in right atrium; initiates electrical impulse. Impulse spreads across atria \u2192 <b>AVN</b> (atrioventricular node): delays impulse (allows atria to finish contracting). Then down <b>Bundle of His</b> (interventricular septum) \u2192 <b>Purkinje fibres</b> spread impulse through ventricular walls from apex upward \u2192 efficient blood ejection.</p>'},
  {lb:'Control of heart rate',dr:dQ1,ht:'<p>Heart rate regulated by autonomic nervous system. <b>Sympathetic</b> (adrenaline, noradrenaline): increases heart rate (fight or flight). <b>Parasympathetic</b> (vagus nerve, ACh): decreases heart rate (rest and digest). Chemoreceptors in aortic arch and carotid bodies detect CO\u2082/pH \u2192 cardiovascular centre in medulla oblongata adjusts rate. Baroreceptors detect blood pressure.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var hr=rnd(55,90),sv=rnd(55,90);var co=hr*sv;return{question:'Heart rate = <b>'+hr+' bpm</b>. Stroke volume = <b>'+sv+' mL</b>. Cardiac output?',hints:['Cardiac output = heart rate \u00d7 stroke volume'],ans:co,tol:0,unit:'mL/min',working:'CO = '+hr+' \u00d7 '+sv+' = '+co+' mL/min'};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Transport',ti:'Blood Vessels and Tissue Fluid',su:'Compare arteries, veins and capillaries. Describe tissue fluid formation.',steps:[
  {lb:'Blood vessel structure',dr:dQ2,ht:'<p><b>Arteries:</b> thick walls; tunica intima (endothelium), tunica media (thick smooth muscle + elastic fibres), tunica adventitia (collagen); narrow lumen; high pressure; no valves. <b>Veins:</b> thinner walls; wider lumen; less elastic fibre; low pressure; valves present (prevent backflow). <b>Capillaries:</b> one cell thick (endothelium only); very small lumen; site of exchange with tissues.</p>'},
  {lb:'Tissue fluid formation',dr:dQ2,ht:'<p>At arteriole end of capillary: hydrostatic pressure > osmotic pressure \u2192 fluid forced out \u2192 tissue fluid. At venule end: osmotic pressure (plasma proteins) > hydrostatic pressure \u2192 fluid drawn back. ~90% returned to blood; ~10% returns via lymph vessels. Lymph: no RBCs, fewer proteins; eventually drains into subclavian veins.</p>'},
  {lb:'Oedema',dr:dQ2,ht:'<p><b>Oedema:</b> excess accumulation of tissue fluid. Causes: (1) reduced plasma protein (kwashiorkor, liver disease \u2192 reduced osmotic pressure); (2) blocked lymph vessels; (3) increased capillary permeability (inflammation); (4) increased venous pressure (heart failure). Understanding osmotic and hydrostatic pressure balance is key.</p>'},
  {lb:'Arteriosclerosis and blood pressure',dr:dQ2,ht:'<p><b>Atherosclerosis:</b> LDL cholesterol deposits in artery wall \u2192 inflammation \u2192 foam cells \u2192 fibrous plaque (atheroma) \u2192 artery narrows (stenosis). Reduces blood flow; may rupture \u2192 thrombus \u2192 myocardial infarction (heart attack) or stroke. Risk factors: high saturated fat diet, smoking, hypertension, diabetes, inactivity.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Tissue fluid forms at the arteriole end of capillaries because: 1=osmotic pressure exceeds hydrostatic pressure, 2=hydrostatic pressure exceeds osmotic pressure, forcing fluid out.',a:2,w:'Arteriole end: high hydrostatic pressure > osmotic pressure \u2192 fluid forced into tissue. Answer: 2.'},{q:'Veins have valves to: 1=increase blood pressure, 2=prevent backflow of blood (low pressure in veins could allow reversal of flow).',a:2,w:'Veins: low pressure; valves prevent backflow, aided by skeletal muscle pump. Answer: 2.'},{q:'Kwashiorkor causes oedema because: 1=excess water is consumed, 2=reduced plasma proteins lower osmotic pressure, so less tissue fluid is reabsorbed.',a:2,w:'Low plasma proteins (albumin) \u2192 low osmotic pressure \u2192 fluid stays in tissues \u2192 oedema. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Arteriole end: high hydrostatic \u2192 fluid out. Low plasma protein \u2192 oedema. Veins: valves prevent backflow.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Transport',ti:'Haemoglobin and Oxygen Transport',su:'Explain the oxygen dissociation curve. Describe the Bohr effect.',steps:[
  {lb:'Haemoglobin structure',dr:dQ3,ht:'<p>Haemoglobin (Hb): quaternary protein; 4 polypeptide chains (2\u03b1 + 2\u03b2 in adults); each chain has 1 haem group (iron Fe\u00b2\u207a) which binds 1 O\u2082. Total: 4 O\u2082 per Hb molecule. <b>Cooperative binding:</b> binding of 1st O\u2082 causes conformational change \u2192 2nd and 3rd bind more easily \u2192 produces sigmoidal (S-shaped) dissociation curve.</p>'},
  {lb:'Oxygen dissociation curve',dr:dQ3,ht:'<p>X-axis: partial pressure of O\u2082 (pO\u2082, kPa). Y-axis: % saturation of Hb. Sigmoidal curve: at low pO\u2082 (tissues) Hb has low affinity and releases O\u2082; at high pO\u2082 (lungs) Hb readily binds O\u2082. The steep part of the curve corresponds to the range of pO\u2082 in body tissues \u2014 small changes in pO\u2082 cause large changes in saturation (efficient delivery).</p>'},
  {lb:'Bohr effect',dr:dQ3,ht:'<p><b>Bohr effect:</b> increased CO\u2082 (in actively respiring tissues) \u2192 CO\u2082 + H\u2082O \u2192 H\u2082CO\u2083 \u2192 H\u207a + HCO\u2083\u207b \u2192 decreased pH. H\u207a binds to Hb \u2192 conformational change \u2192 Hb releases O\u2082 more readily \u2192 curve shifts to the RIGHT. Result: O\u2082 delivered where most needed. Temperature increase also shifts right.</p>'},
  {lb:'Foetal Hb and CO\u2082 transport',dr:dQ3,ht:'<p><b>Foetal Hb (HbF):</b> \u03b32 chains instead of \u03b22; higher O\u2082 affinity than adult Hb \u2192 foetal dissociation curve lies to the LEFT of adult \u2192 O\u2082 transferred from maternal to foetal blood across placenta. <b>CO\u2082 transport:</b> 70% as HCO\u2083\u207b (carbonic anhydrase in RBCs); 23% as carbaminohaemoglobin (CO\u2082 bound to -NH\u2082 groups); 7% dissolved in plasma. Chloride shift maintains RBC charge balance.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var pO2=pick([2,4,6,8,10,12,14]);var sat=pO2<=2?20:pO2<=4?50:pO2<=6?75:pO2<=8?88:pO2<=10?93:pO2<=12?96:98;var bohr_sat=pO2<=2?10:pO2<=4?35:pO2<=6?60:pO2<=8?76:pO2<=10?85:pO2<=12?90:94;return{question:'At pO\u2082 = <b>'+pO2+' kPa</b>, adult Hb saturation \u2248 <b>'+sat+'%</b>. High CO\u2082 (Bohr effect) shifts curve right. Approximate new saturation?',hints:['Right shift: lower saturation at same pO\u2082','Bohr effect: CO\u2082 \u2192 low pH \u2192 Hb releases O\u2082'],ans:bohr_sat,tol:8,unit:'%',working:'Right shift (Bohr effect): ~'+bohr_sat+'%. Less O\u2082 held by Hb at same pO\u2082 \u2192 more delivered to tissues.'};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Transport',ti:'Muscle Structure and Contraction',su:'Describe the sliding filament theory of muscle contraction.',steps:[
  {lb:'Muscle and sarcomere structure',dr:dQ4,ht:'<p>Skeletal muscle: bundles of fascicles \u2192 muscle fibres (cells, multinucleate) \u2192 myofibrils \u2192 sarcomeres. <b>Sarcomere:</b> unit between two Z-lines. <b>Thick filaments:</b> myosin (heads project outward). <b>Thin filaments:</b> actin (double helix) + tropomyosin (regulatory, blocks binding sites) + troponin (Ca\u00b2\u207a receptor). <b>H-zone:</b> thick only. <b>I-band:</b> thin only. <b>A-band:</b> thick filaments (constant length).</p>'},
  {lb:'Cross-bridge cycle',dr:dQ4,ht:'<p>1. Action potential \u2192 Ca\u00b2\u207a released from sarcoplasmic reticulum (SR). 2. Ca\u00b2\u207a binds troponin \u2192 tropomyosin moves \u2192 actin binding sites exposed. 3. Myosin head (with ADP+Pi) binds actin \u2192 <b>cross-bridge</b>. 4. Power stroke: myosin head pivots \u2192 ADP+Pi released \u2192 actin pulled toward M-line. 5. ATP binds myosin \u2192 cross-bridge breaks. 6. ATP hydrolysed \u2192 myosin re-cocked (ready). 7. Cycle repeats.</p>'},
  {lb:'Changes in band/zone lengths',dr:dQ4,ht:'<p>During contraction: actin slides over myosin \u2192 Z-lines move closer together \u2192 sarcomere shortens. <b>I-band shortens</b> (less thin-only region). <b>H-zone shortens</b> (less thick-only region). <b>A-band stays same length</b> (thick filaments do not change). Overall muscle shortens while individual filament lengths remain constant.</p>'},
  {lb:'Energy for contraction',dr:dQ4,ht:'<p>ATP is needed: (1) to detach myosin from actin; (2) to re-cock myosin head (re-energise). Without ATP (e.g. after death): cross-bridges cannot break \u2192 <b>rigor mortis</b>. ATP sources: creatine phosphate (immediate), anaerobic glycolysis (rapid but produces lactate), aerobic respiration (sustained). Fast-twitch (type II) fibres: few mitochondria, fatigue quickly, anaerobic. Slow-twitch (type I): many mitochondria, aerobic, resistant to fatigue.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'During muscle contraction, which band does NOT change length? 1=I-band, 2=A-band.',a:2,w:'A-band: spans thick (myosin) filaments which do not change length. I-band and H-zone shorten. Answer: 2.'},{q:'ATP is needed in muscle contraction to: 1=form the cross-bridge, 2=detach myosin from actin and re-cock the myosin head.',a:2,w:'ATP: binds myosin \u2192 breaks cross-bridge; hydrolysed \u2192 re-energises myosin head. Answer: 2.'},{q:'Rigor mortis occurs because: 1=muscles lack calcium after death, 2=ATP is depleted so myosin cannot detach from actin.',a:2,w:'No ATP \u2192 cross-bridges cannot break \u2192 permanent contraction (rigor mortis). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['A-band: constant. ATP: detaches myosin. Rigor mortis: no ATP.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Transport',ti:'Skeleton, Joints and Support',su:'Describe the mammalian skeleton. Classify joints. Explain hydrostatic skeletons.',steps:[
  {lb:'Skeleton types',dr:dQ5,ht:'<p><b>Endoskeleton</b> (vertebrates): internal; bone/cartilage; grows with organism; allows great size; protected; allows complex joints. <b>Exoskeleton</b> (arthropods): external chitin; must moult (ecdysis) to grow; limits size; provides protection. <b>Hydrostatic skeleton</b> (annelids, cnidarians): fluid-filled body cavity; muscles act against fluid pressure; allows movement without rigid structure.</p>'},
  {lb:'Bone and cartilage',dr:dQ5,ht:'<p><b>Bone:</b> osteoblasts (deposit matrix), osteoclasts (resorb matrix), osteocytes (maintenance). Matrix: collagen fibres + calcium phosphate/hydroxyapatite (hardness + flexibility). Compact bone (Haversian systems); spongy bone (red marrow \u2192 blood cells). <b>Cartilage:</b> chondrocytes; no blood supply; hyaline (joint surfaces), elastic (ear), fibrocartilage (intervertebral discs).</p>'},
  {lb:'Joint types',dr:dQ5,ht:'<p><b>Fixed (fibrous) joints:</b> no movement; skull sutures. <b>Cartilaginous joints:</b> limited movement; vertebrae separated by intervertebral discs. <b>Synovial joints:</b> freely moveable; synovial cavity with synovial fluid (lubrication, shock absorption); articular cartilage (smooth surfaces); ligaments (bone-to-bone); tendons (muscle-to-bone); capsule. Types: hinge (elbow, knee), ball and socket (hip, shoulder), pivot (atlas-axis), gliding (wrist).</p>'},
  {lb:'Antagonistic muscles',dr:dQ5,ht:'<p>Muscles can only pull, not push. <b>Antagonistic pairs:</b> when one contracts, the other relaxes. Example: bicep (flexor) + tricep (extensor) at elbow. Tendons transmit force to bone. Origin: fixed attachment. Insertion: bone that moves. Levers: bone = lever, joint = fulcrum, muscle = effort, weight = load. Types of levers: 1st (fulcrum between load and effort), 2nd (load between), 3rd (effort between \u2014 most in body).</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Tendons connect: 1=bone to bone, 2=muscle to bone.',a:2,w:'Tendons: inelastic collagen, muscle to bone. Ligaments: elastic, bone to bone. Answer: 2.'},{q:'Synovial fluid in joints functions to: 1=provide minerals to cartilage, 2=lubricate and reduce friction between articular surfaces.',a:2,w:'Synovial fluid: viscous lubricant; also provides nutrients to avascular cartilage. Answer: 2.'},{q:'An earthworm uses a hydrostatic skeleton for movement. This means: 1=it has an internal bony skeleton, 2=body fluid acts as the rigid element against which circular and longitudinal muscles contract.',a:2,w:'Hydrostatic: fluid-filled coelom; circular muscles (thin, long body) + longitudinal muscles (short, fat body) work against fluid. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Tendon: muscle to bone. Ligament: bone to bone. Hydrostatic: fluid resists muscle contraction.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Transport',ti:'Double Circulatory System',su:'Compare single and double circulation. Describe pulmonary and systemic circuits.',steps:[
  {lb:'Single vs double circulation',dr:dQ6,ht:'<p><b>Single circulation</b> (fish): heart \u2192 gills \u2192 body \u2192 heart; blood passes through heart once per circuit; loses pressure in gills; limits activity. <b>Double circulation</b> (mammals, birds): pulmonary circuit (right heart \u2192 lungs \u2192 left heart) + systemic circuit (left heart \u2192 body \u2192 right heart); blood passes through heart twice per circuit; allows high blood pressure to body; supports active lifestyle.</p>'},
  {lb:'Pressure differences',dr:dQ6,ht:'<p>Left ventricle: thicker wall \u2192 higher pressure \u2192 pumps blood to entire body (systemic). Right ventricle: thinner wall \u2192 lower pressure \u2192 pumps blood to lungs (short distance, delicate capillaries \u2014 high pressure would damage them). Pulmonary artery: low O\u2082 (unusual \u2014 artery carries deoxygenated blood). Pulmonary vein: high O\u2082 (unusual \u2014 vein carries oxygenated blood).</p>'},
  {lb:'Portal systems',dr:dQ6,ht:'<p><b>Hepatic portal vein:</b> carries absorbed nutrients from intestine to liver for processing before entering general circulation. <b>Renal portal system</b> (not in humans): in some vertebrates (fish, amphibians). <b>Hypophyseal portal system:</b> hypothalamus \u2192 anterior pituitary via portal vessels (carries releasing hormones). Portal systems: blood passes through two capillary beds before returning to heart.</p>'},
  {lb:'Lymphatic system',dr:dQ6,ht:'<p>Lymph vessels: return excess tissue fluid to blood. Thoracic duct drains left side and lower body into left subclavian vein. Right lymphatic duct drains right upper body into right subclavian vein. Lymph nodes: contain lymphocytes; filter lymph; site of immune response. Lacteals: lymph vessels in intestinal villi; absorb chylomicrons (fats).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'The left ventricle has thicker walls than the right ventricle because: 1=it pumps blood to the lungs (short distance), 2=it must generate higher pressure to pump blood to the whole body (systemic circuit).',a:2,w:'Systemic circuit: whole body; requires high pressure. Pulmonary: short; low pressure. Answer: 2.'},{q:'The hepatic portal vein is unusual because: 1=it carries oxygenated blood, 2=it connects two capillary beds (intestine capillaries to liver sinusoids) without returning to the heart.',a:2,w:'Portal system: two capillary beds; blood does not return to heart between them. Answer: 2.'},{q:'In fish, blood passes through the heart: 1=once per circuit (single circulation), 2=twice per circuit.',a:1,w:'Fish: single circulation; heart \u2192 gills \u2192 body \u2192 heart (once). Mammals: double (twice). Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Left ventricle: systemic (whole body, high pressure). Portal vein: two capillary beds. Fish: single circulation.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Transport',ti:'Blood Composition and Clotting',su:'Describe blood components and the process of blood clotting.',steps:[
  {lb:'Blood components',dr:dQ7,ht:'<p><b>Plasma:</b> ~55% of blood; water + dissolved substances (glucose, amino acids, lipids, CO\u2082, urea, hormones, plasma proteins \u2014 albumin for osmosis, fibrinogen for clotting, immunoglobulins). <b>Red blood cells (erythrocytes):</b> biconcave disc; no nucleus (more Hb space); ~120-day lifespan; destroyed in spleen; bilirubin \u2192 bile. <b>White blood cells (leucocytes):</b> lymphocytes (B and T cells), monocytes (become macrophages), neutrophils (phagocytosis).</p>'},
  {lb:'Platelets and clotting cascade',dr:dQ7,ht:'<p><b>Platelets (thrombocytes):</b> cell fragments from megakaryocytes; no nucleus; initiate clotting. <b>Clotting cascade:</b> vessel damage \u2192 collagen exposed \u2192 platelets adhere (platelet plug). Prothrombin (inactive) \u2192 thrombin (activated, requires Ca\u00b2\u207a + clotting factors). Thrombin converts fibrinogen \u2192 fibrin (threads). Fibrin net traps RBCs \u2192 clot. Vitamin K required for synthesis of several clotting factors.</p>'},
  {lb:'Blood groups (ABO and Rhesus)',dr:dQ7,ht:'<p><b>ABO system:</b> surface antigens on RBCs (A, B, both, or neither); plasma antibodies (anti-A or anti-B). Type O: no antigens, universal donor. Type AB: no antibodies, universal recipient. <b>Rhesus (Rh):</b> Rh\u207a (has D antigen) or Rh\u207b (no D antigen). Rh\u207b mother + Rh\u207a foetus: haemolytic disease of the newborn (antibodies cross placenta in 2nd pregnancy). Prevention: anti-D immunoglobulin given to mother.</p>'},
  {lb:'Sickle cell anaemia',dr:dQ7,ht:'<p>Sickle cell anaemia: point mutation in \u03b2-globin gene \u2192 glutamic acid \u2192 valine substitution \u2192 HbS. Under low O\u2082, HbS polymerises \u2192 RBCs become sickle-shaped \u2192 block capillaries; haemolysis \u2192 anaemia; painful crises. Heterozygotes (HbS/HbA): sickle cell trait; some protection against malaria (<em>Plasmodium falciparum</em>). High frequency in malaria-endemic regions = balanced polymorphism.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Fibrinogen is converted to fibrin during blood clotting by the enzyme: 1=thrombin, 2=prothrombin.',a:1,w:'Thrombin (activated form of prothrombin) converts fibrinogen \u2192 fibrin. Answer: 1.'},{q:'A person with blood type O is a universal donor because: 1=their blood has no surface antigens (A or B), so cannot be agglutinated by anti-A or anti-B antibodies, 2=their blood has both A and B antigens.',a:1,w:'Type O: no A or B antigens \u2192 no agglutination reaction with any blood type recipient. Answer: 1.'},{q:'Sickle cell heterozygotes (HbS/HbA) have higher survival in malaria regions because: 1=HbS kills malaria parasites, 2=the HbS/HbA sickling partially disrupts Plasmodium\'s lifecycle in RBCs.',a:2,w:'Sickle trait: RBCs sickle when parasitised \u2192 removed by spleen \u2192 reduced parasite load. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Thrombin: converts fibrinogen. Type O: no antigens. Sickle trait: malaria protection.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Transport',ti:'Gas Exchange Systems',su:'Compare gas exchange in insects, fish and mammals.',steps:[
  {lb:'Principles of gas exchange',dr:dQ8,ht:'<p>Effective gas exchange surfaces are: (1) large surface area; (2) thin walls (short diffusion distance); (3) moist (gases dissolve); (4) good blood/ventilation supply (maintains steep gradient). <b>Fick\u2019s law:</b> Rate of diffusion = (SA \u00d7 concentration difference) / diffusion distance. Larger, more active organisms need specialised exchange surfaces.</p>'},
  {lb:'Insect tracheal system',dr:dQ8,ht:'<p>Insects: tracheae (rigid chitin tubes) \u2192 tracheoles (thin, fluid-filled tips) reach every cell; no respiratory pigment needed (O\u2082 delivered directly to cells). Spiracles (openings on thorax/abdomen) control gas exchange; can close to reduce water loss. Active insects: muscle movement ventilates trachea (tidal flow). Limitation: size limited by diffusion distance through tracheae.</p>'},
  {lb:'Fish gill system',dr:dQ8,ht:'<p>Fish: water flows over gill lamellae (thin plates) with many secondary lamellae (increase SA). Blood and water flow in <b>opposite directions (counter-current)</b> \u2192 maintains concentration gradient along entire length \u2192 ~80% O\u2082 extracted. Parallel flow (same direction): gradient falls to zero midway \u2192 only ~50% extracted. Counter-current is far more efficient.</p>'},
  {lb:'Mammalian lungs',dr:dQ8,ht:'<p>Trachea \u2192 bronchi \u2192 bronchioles \u2192 alveoli. ~700 million alveoli in human lungs; total SA ~70 m\u00b2. Alveolus: surfactant (phospholipid, reduces surface tension, prevents collapse); 1 cell wall; capillary 1 cell wall \u2192 diffusion distance <1 \u03bcm. Ventilation: intercostal muscles + diaphragm (inspiration: contract \u2192 thorax enlarges, pressure falls, air in); expiration: relax. Tidal volume, vital capacity, FRC defined.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var SA=rnd(50,200),diff=rnd(1,5)*0.5,conc=rnd(5,20);var rate=parseFloat((SA*conc/diff).toFixed(1));return{question:'SA = <b>'+SA+' cm\u00b2</b>, conc difference = <b>'+conc+' mmol/L</b>, diffusion distance = <b>'+diff+' mm</b>. Relative diffusion rate?',hints:['Fick\'s law: rate = (SA \u00d7 \u0394conc) / distance'],ans:rate,tol:rate*0.05,unit:'units',working:'rate = ('+SA+'\u00d7'+conc+')/'+diff+' = '+rate};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Transport',ti:'Excretion and Osmoregulation',su:'Describe kidney structure and function. Explain osmoregulation.',steps:[
  {lb:'Kidney structure',dr:dQ9,ht:'<p>Kidney: outer cortex + inner medulla + renal pelvis \u2192 ureter \u2192 bladder \u2192 urethra. Nephron: functional unit (~1 million per kidney). Components: glomerulus (in Bowman\u2019s capsule, cortex) \u2192 proximal convoluted tubule (PCT, cortex) \u2192 loop of Henl\u00e9 (medulla) \u2192 distal convoluted tubule (DCT, cortex) \u2192 collecting duct (medulla) \u2192 renal pelvis.</p>'},
  {lb:'Ultrafiltration and selective reabsorption',dr:dQ9,ht:'<p><b>Ultrafiltration:</b> high pressure in glomerular capillaries (afferent arteriole wider than efferent) \u2192 forces small molecules (water, glucose, urea, ions) out of blood through basement membrane + podocyte foot processes into Bowman\u2019s capsule. Plasma proteins and cells retained (too large). <b>PCT selective reabsorption:</b> glucose, amino acids (100%), most water and ions \u2192 co-transported back into blood; active transport (ATP).</p>'},
  {lb:'Loop of Henl\u00e9 and countercurrent multiplier',dr:dQ9,ht:'<p><b>Loop of Henl\u00e9:</b> creates osmotic gradient in medulla. Descending limb: permeable to water; water leaves \u2192 filtrate becomes concentrated. Ascending limb: impermeable to water; actively pumps Na\u207a and Cl\u207b out \u2192 medulla becomes hyperosmotic. Collecting duct passes through this gradient; ADH (vasopressin) controls water reabsorption \u2192 concentrated or dilute urine produced.</p>'},
  {lb:'ADH and water balance',dr:dQ9,ht:'<p><b>ADH (antidiuretic hormone):</b> produced in hypothalamus; released from posterior pituitary. High blood osmolarity (detected by hypothalamic osmoreceptors) \u2192 more ADH released \u2192 collecting duct more permeable to water \u2192 more water reabsorbed \u2192 concentrated urine (low volume). Low osmolarity \u2192 less ADH \u2192 dilute urine (high volume). Negative feedback.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'Glucose is absent from urine in healthy individuals because: 1=it is too large to be filtered, 2=it is completely reabsorbed by active transport in the proximal convoluted tubule.',a:2,w:'Glucose: filtered in glomerulus; completely reabsorbed in PCT (Na\u207a/glucose cotransport). Answer: 2.'},{q:'ADH increases urine concentration by: 1=increasing glomerular filtration rate, 2=making the collecting duct more permeable to water.',a:2,w:'ADH inserts aquaporins into collecting duct cells \u2192 water reabsorbed \u2192 concentrated urine. Answer: 2.'},{q:'Urea is produced in the liver by: 1=the nitrogen cycle, 2=deamination of excess amino acids (amino group removed \u2192 NH\u2083 \u2192 urea).',a:2,w:'Deamination: amino acid \u2192 keto acid + NH\u2083; ornithine cycle \u2192 urea. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Glucose: reabsorbed in PCT. ADH: aquaporins in collecting duct. Urea: deamination in liver.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Transport',ti:'Mixed Transport and Movement',su:'Integrated questions across all Y12-HUM-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Heart: SAN\u2192AVN\u2192Bundle of His\u2192Purkinje. Cardiac output = HR\u00d7SV. Bohr effect: CO\u2082\u2191\u2192pH\u2193\u2192O\u2082 released. Sliding filament: Ca\u00b2\u207a, cross-bridge, ATP. Counter-current in gills: 80% O\u2082 extraction. ADH: collecting duct water permeability.</p>'},
  {lb:'WAEC application: comparing systems',dr:dQ10,ht:'<p>WAEC often asks to compare gas exchange in insects, fish and mammals with reasons for efficiency. Key points: insects (direct tracheal delivery, no pigment), fish (counter-current multiplier, gills), mammals (large alveolar SA, ventilation). For transport: know double vs single circulation. For kidney: know ultrafiltration \u2192 selective reabsorption \u2192 osmoregulation sequence.</p>'},
  {lb:'Pathology and clinical links',dr:dQ10,ht:'<p>WAEC may test: myocardial infarction (coronary artery blocked \u2192 heart muscle necrosis); stroke (cerebral artery blocked/burst); atherosclerosis risk factors; anaemia (reduced O\u2082 transport \u2014 causes: iron deficiency, sickle cell, B12 deficiency); diabetes insipidus (no ADH \u2192 dilute urine); nephrotic syndrome (glomerulus damaged \u2192 protein in urine \u2192 oedema).</p>'},
  {lb:'Calculations practice',dr:dQ10,ht:'<div class="fm">Cardiac output (mL/min) = heart rate (bpm) \u00d7 stroke volume (mL)</div><div class="fm">Glomerular filtration rate \u2248 125 mL/min in healthy adults</div><div class="fm">Ventilation rate (L/min) = breathing rate \u00d7 tidal volume</div>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['cardiac','ventilation','renal']);if(type==='cardiac'){var hr=rnd(60,100),sv=rnd(60,90);return{question:'HR = <b>'+hr+' bpm</b>, SV = <b>'+sv+' mL</b>. Cardiac output (mL/min)?',hints:['CO = HR \u00d7 SV'],ans:hr*sv,tol:0,unit:'mL/min',working:'CO = '+hr+'\u00d7'+sv+' = '+(hr*sv)+' mL/min'};}if(type==='ventilation'){var br=rnd(12,20),tv=rnd(400,600);return{question:'Breathing rate = <b>'+br+'/min</b>, tidal volume = <b>'+tv+' mL</b>. Ventilation rate (mL/min)?',hints:['Ventilation = breathing rate \u00d7 tidal volume'],ans:br*tv,tol:0,unit:'mL/min',working:'Ventilation = '+br+'\u00d7'+tv+' = '+(br*tv)+' mL/min'};}var gfr=125,hours=rnd(1,8);var total=gfr*60*hours;return{question:'GFR = 125 mL/min. Total filtrate produced in <b>'+hours+' hour(s)</b>?',hints:['Total = GFR \u00d7 60 \u00d7 hours'],ans:total,tol:0,unit:'mL',working:'125 \u00d7 60 \u00d7 '+hours+' = '+total+' mL'};})},
]},
];

render();
