<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Ecological concepts hierarchy','#2E7D32',13,'middle',true));
var levels=[['Organism','individual; interacts with environment'],['Population','all members of one species in an area at a time'],['Community','all populations in an area; species interactions'],['Ecosystem','community + abiotic (non-living) environment'],['Biome','large regional ecosystem with characteristic climate + flora'],['Biosphere','all ecosystems on Earth; global ecological system']];
levels.forEach(function(r,i){if(i<=p){var w=440-i*50;o.push(R(240-w/2,36+i*34,w,26,'#F1F8F1','#2E7D32',1.5));o.push(T(240,52+i*34,r[0]+': '+r[1],'#2E7D32',9,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Energy flow through ecosystems','#2E7D32',12,'middle',true));
o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',2));o.push(T(240,62,'Sun \u2192 Producers (photosynthesis) \u2192 Consumers \u2192 Decomposers','#1b5e20',12,'middle',true));
if(p>=1){o.push(R(10,90,460,36,'#F1F8F1','#2E7D32',1.5));o.push(T(240,108,'Only ~10% energy transferred to next trophic level','#333',10,'middle',false));}
if(p>=2){o.push(R(10,140,460,36,'#F1F8F1','#2E7D32',1.5));o.push(T(240,152,'Energy lost as: heat (respiration), undigested material (faeces)','#333',10,'middle',false));o.push(T(240,168,'urine/excretion, dead organic matter','#555',8,'middle',false));}
if(p>=3){o.push(R(10,190,460,36,'#F1F8F1','#2E7D32',1.5));o.push(T(240,206,'Gross Primary Production (GPP): total photosynthesis','#333',10,'middle',false));o.push(T(240,222,'Net Primary Production (NPP) = GPP \u2212 Respiration (R)','#2E7D32',10,'middle',true));}
if(p>=4){o.push(R(10,238,460,16,'#C8E6C9','#2E7D32',0.5));o.push(T(240,249,'Ecological efficiency = energy at trophic level n+1 / energy at n \u00d7 100','#555',7,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Population growth models','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,36,'#F1F8F1','#2E7D32',1.5));o.push(T(240,58,'Exponential (J-curve): unlimited resources; dN/dt = rN','#333',10,'middle',false));}
if(p>=2){o.push(R(10,88,460,36,'#F1F8F1','#2E7D32',1.5));o.push(T(240,108,'Logistic (S-curve): carrying capacity K; dN/dt = rN(K\u2212N)/K','#333',10,'middle',false));}
if(p>=3){var pts=[[0,8],[40,20],[80,35],[120,52],[160,70],[200,88],[240,105],[280,118],[320,126],[360,130],[400,130]];var prev=null;pts.forEach(function(pt){if(prev){o.push(L(48+prev[0],220-prev[1],48+pt[0],220-pt[1],'#2E7D32',2));}prev=pt;});o.push(T(460,92,'K','#C0272D',10,'middle',true));o.push(L(48,90,465,90,'#C0272D',1,'4'));o.push(T(200,230,'Time','#555',9,'middle',false));o.push(T(30,130,'N','#555',9,'middle',false));}
if(p>=4){o.push(R(10,230,460,24,'#C8E6C9','#2E7D32',1));o.push(T(240,245,'Factors limiting population: density-dependent (disease, predation, competition) vs density-independent (climate, natural disasters)','#555',7,'middle',false));}
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Nutrient cycles — nitrogen cycle','#2E7D32',12,'middle',true));
[['Nitrogen fixation','N\u2082 \u2192 NH\u2084\u207a; by Rhizobium (legumes), Azotobacter (free-living), lightning'],['Nitrification','NH\u2084\u207a \u2192 NO\u2082\u207b (Nitrosomonas); NO\u2082\u207b \u2192 NO\u2083\u207b (Nitrobacter); aerobic chemoautotrophs'],['Assimilation','plants absorb NO\u2083\u207b / NH\u2084\u207a; incorporate into amino acids, proteins, nucleic acids'],['Ammonification','decomposers break down proteins/urea \u2192 NH\u2084\u207a (ammonium) in soil'],['Denitrification','NO\u2083\u207b \u2192 N\u2082 (Pseudomonas, anaerobic); completes the cycle'],['Human impact','fertilisers add NO\u2083\u207b/NH\u2084\u207a; eutrophication; leaching contaminates water']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*34,460,28,'#F1F8F1','#C8E6C9',1));o.push(T(110,56+i*34,r[0],'#2E7D32',10,'middle',true));o.push(T(320,56+i*34,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ3(p);}
function dQ8(p){dQ4(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Ecology summary','#2E7D32',13,'middle',true));
[['NPP','GPP \u2212 respiration; energy available to consumers'],['Ecological efficiency','~10% energy per trophic level; limits food chain length'],['Carrying capacity (K)','max population environment can support; logistic S-curve'],['Interspecific competition','between species for same resource; competitive exclusion principle'],['Keystone species','disproportionate effect on ecosystem; loss \u2192 cascade collapse'],['Succession','community changes over time; pioneer\u2192climax community'],['Mark-recapture','N = n1\u00d7n2/m; estimates population size']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F1F8F1','#C8E6C9',1));o.push(T(120,52+i*30,r[0],'#2E7D32',10,'middle',true));o.push(T(330,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Ecology',ti:'Ecological Organisation',su:'Define ecological terms. Describe abiotic and biotic factors.',steps:[
  {lb:'Ecological hierarchy',dr:dQ1,ht:'<p>Ecology: study of interactions between organisms and their environment. Levels: organism \u2192 population \u2192 community \u2192 ecosystem \u2192 biome \u2192 biosphere. <b>Habitat:</b> physical location where an organism lives. <b>Niche:</b> role/function of an organism in its ecosystem; includes food, habitat, behaviour, interactions. <b>Competitive exclusion principle</b> (Gause): two species cannot occupy the same niche indefinitely \u2192 one excludes the other.</p>'},
  {lb:'Abiotic factors',dr:dQ1,ht:'<p>Abiotic (non-living) factors: temperature, light intensity, water availability, pH, salinity, oxygen content, nutrient availability, wind speed, substrate type, pressure. These affect distribution and abundance of organisms. Tolerance range: organisms survive only within certain limits; optimum at which population is largest; zones of intolerance at extremes.</p>'},
  {lb:'Biotic factors and interactions',dr:dQ1,ht:'<p>Biotic factors: predation (predator kills prey), competition (for food, space, mates, light), parasitism (one benefits, host harmed), mutualism (both benefit), commensalism (one benefits, other unaffected), amensalism (one harmed, other unaffected). Species interactions shape community structure and evolution (coevolution).</p>'},
  {lb:'Sampling methods',dr:dQ1,ht:'<p><b>Quadrats:</b> random placement (random number tables); count organisms in defined area; calculate mean and estimate total population. <b>Transects:</b> belt transect or line transect across habitat gradient (e.g. seashore zones, altitude gradient). <b>Mark-release-recapture:</b> for mobile animals; Lincoln-Petersen index: N = (n1 \u00d7 n2) / m. Assumptions: marks don\u2019t affect survival; good mixing; population stable.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var n1=rnd(30,80),m=rnd(5,20),n2=rnd(30,80);var N=Math.round(n1*n2/m);return{question:'Mark-release-recapture: n\u2081=<b>'+n1+'</b>, n\u2082=<b>'+n2+'</b>, recaptured marked=<b>'+m+'</b>. Estimate population (N).',hints:['Lincoln-Petersen: N = (n\u2081 \u00d7 n\u2082) / m'],ans:N,tol:Math.max(3,Math.round(N*0.05)),unit:'individuals',working:'N = ('+n1+'\u00d7'+n2+')/'+m+' = '+N};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Ecology',ti:'Energy Flow and Productivity',su:'Calculate NPP, ecological efficiency and trophic level energy.',steps:[
  {lb:'Primary productivity',dr:dQ2,ht:'<p><b>Gross Primary Production (GPP):</b> total rate of photosynthesis (total energy fixed). <b>Respiration (R):</b> energy used by plant for metabolism. <b>Net Primary Production (NPP) = GPP \u2212 R:</b> energy available to primary consumers (herbivores). Measured in kJ m\u207b\u00b2 yr\u207b\u00b9 or g dry mass m\u207b\u00b2 yr\u207b\u00b9. Tropical rainforest: highest NPP (~2000 g m\u207b\u00b2 yr\u207b\u00b9). Open ocean: low (~125 g m\u207b\u00b2 yr\u207b\u00b9).</p>'},
  {lb:'Trophic transfer efficiency',dr:dQ2,ht:'<p>Only ~10% of energy at each trophic level is passed to the next. Energy lost as: heat (respiration, ~60%), undigested food (faeces, ~20%), urine/excretion, dead material (to decomposers). Limits food chain length to ~4\u20135 levels (not enough energy for more). Humans eating grain directly is ~10\u00d7 more efficient than eating beef (grain \u2192 cow \u2192 human).</p>'},
  {lb:'Ecological efficiency calculations',dr:dQ2,ht:'<div class="fm">Ecological efficiency = energy at level n+1 / energy at level n \u00d7 100</div><div class="fm">NPP = GPP \u2212 R</div><p>Example: GPP = 10,000 kJ/m\u00b2/yr; R = 2,000; NPP = 8,000. If herbivores assimilate 800 kJ: efficiency = 800/8000 \u00d7 100 = 10%.</p>'},
  {lb:'Pyramids of energy, number and biomass',dr:dQ2,ht:'<p><b>Pyramid of energy:</b> always pyramid-shaped; shows energy per trophic level per unit time; most informative. <b>Pyramid of biomass:</b> usually pyramid-shaped (may be inverted in ocean: phytoplankton turnover rapidly); shows standing crop. <b>Pyramid of numbers:</b> can be inverted (one oak tree \u2192 many caterpillars \u2192 fewer birds); least informative about energy flow.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var gpp=rnd(5,20)*1000,r=rnd(1,5)*1000;var npp=gpp-r;var type=pick(['npp','efficiency','trophic']);if(type==='npp')return{question:'GPP = <b>'+gpp+' kJ/m\u00b2/yr</b>. Respiration = <b>'+r+' kJ/m\u00b2/yr</b>. Find NPP.',hints:['NPP = GPP \u2212 R'],ans:npp,tol:0,unit:'kJ/m\u00b2/yr',working:'NPP = '+gpp+' \u2212 '+r+' = '+npp+' kJ/m\u00b2/yr'};if(type==='efficiency'){var e=rnd(5,15);var next=Math.round(npp*e/100);return{question:'Energy at producer level = <b>'+npp+' kJ</b>. Ecological efficiency = <b>'+e+'%</b>. Energy at next level?',hints:['Energy = prev \u00d7 efficiency/100'],ans:next,tol:0,unit:'kJ',working:npp+'\u00d7'+e+'/100 = '+next+' kJ'};}return{question:'If 1000 kJ enters trophic level 1, how much reaches trophic level 3 at 10% efficiency per level?',hints:['Level 2: 1000\u00d70.1 = 100; Level 3: 100\u00d70.1 = 10'],ans:10,tol:0,unit:'kJ',working:'1000\u00d70.1=100 (L2); 100\u00d70.1=10 (L3)'};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Ecology',ti:'Population Dynamics',su:'Describe factors controlling population size. Interpret population growth curves.',steps:[
  {lb:'Population growth',dr:dQ3,ht:'<p><b>Exponential (J-curve):</b> unlimited resources; birth rate > death rate; population doubles at fixed intervals. Formula: dN/dt = rN (r = intrinsic rate of increase). Rarely seen in nature for long; requires no limiting factors. <b>Logistic (S-curve):</b> resources finite; growth slows as population approaches carrying capacity (K); population stabilises around K; real-world model.</p>'},
  {lb:'Carrying capacity and limiting factors',dr:dQ3,ht:'<p><b>Carrying capacity (K):</b> maximum population size the environment can sustain indefinitely. Factors reducing population towards K: <b>density-dependent:</b> food shortage, predation, disease, intraspecific competition (effect increases as density increases). <b>Density-independent:</b> natural disasters, climate events (affect same proportion regardless of density).</p>'},
  {lb:'Predator-prey cycles',dr:dQ3,ht:'<p>Classic example: lynx and snowshoe hare (10-year cycle). Prey increases \u2192 predator increases (more food) \u2192 prey decreases (over-predation) \u2192 predator decreases (starvation) \u2192 prey recovers. Predator peak lags behind prey peak. Not a perfect cycle (multiple factors involved: vegetation cycles, disease). Lotka-Volterra equations model this mathematically.</p>'},
  {lb:'Human population growth',dr:dQ3,ht:'<p>Human population: ~8 billion (2023); increased rapidly post-industrial revolution. Demographic transition model: high BR+DR \u2192 falling DR (medicine, sanitation) \u2192 falling BR (education, contraception) \u2192 low BR+DR. Age-structure diagrams (population pyramids): broad base (high growth, developing countries) vs straight/narrow (stable/declining, developed countries). WAEC: interpret population pyramids.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var N=rnd(200,800),r=rnd(1,4)*0.1,K=rnd(1000,2000);var dNdt=parseFloat((r*N*(K-N)/K).toFixed(1));var type=pick(['logistic','simple_r']);if(type==='logistic')return{question:'Logistic growth: r=<b>'+r+'</b>, N=<b>'+N+'</b>, K=<b>'+K+'</b>. Find dN/dt.',hints:['dN/dt = rN(K\u2212N)/K'],ans:dNdt,tol:dNdt*0.05,unit:'individuals/time',working:'dN/dt = '+r+'\u00d7'+N+'\u00d7('+K+'\u2212'+N+')/'+K+' = '+dNdt};var r2=rnd(1,5)*0.1,N2=rnd(100,500),simple=parseFloat((r2*N2).toFixed(1));return{question:'Exponential growth: r=<b>'+r2+'</b>, N=<b>'+N2+'</b>. Find dN/dt.',hints:['dN/dt = rN (exponential)'],ans:simple,tol:simple*0.05,unit:'individuals/time',working:'dN/dt = '+r2+'\u00d7'+N2+' = '+simple};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Ecology',ti:'Nutrient Cycles',su:'Describe the nitrogen and carbon cycles in detail.',steps:[
  {lb:'Carbon cycle',dr:dQ4,ht:'<p>Carbon enters biosphere via photosynthesis (CO\u2082 fixed into organic molecules). Returns via: respiration (all organisms), decomposition (bacteria/fungi break down dead organic matter), combustion (fossil fuels \u2014 releases ancient carbon). Ocean: CO\u2082 dissolved in seawater \u2192 carbonate/bicarbonate equilibrium; marine shells form limestone. Human impact: fossil fuel burning + deforestation \u2192 CO\u2082 \u2191 \u2192 enhanced greenhouse effect.</p>'},
  {lb:'Nitrogen cycle',dr:dQ4,ht:'<p>N\u2082 in atmosphere (78%): cannot be used directly by most organisms. <b>Nitrogen fixation:</b> <em>Rhizobium</em> (mutualistic in legume root nodules), free-living bacteria (<em>Azotobacter</em>), lightning, industrial (Haber process). <b>Nitrification:</b> NH\u2084\u207a \u2192 NO\u2082\u207b (Nitrosomonas) \u2192 NO\u2083\u207b (Nitrobacter); aerobic. <b>Assimilation:</b> plants absorb NO\u2083\u207b or NH\u2084\u207a; make amino acids. <b>Ammonification:</b> decomposers \u2192 NH\u2084\u207a. <b>Denitrification:</b> NO\u2083\u207b \u2192 N\u2082 (Pseudomonas; anaerobic; returned to atmosphere).</p>'},
  {lb:'Decomposers and decomposition',dr:dQ4,ht:'<p>Decomposers (bacteria and fungi) break down dead organic matter \u2192 release mineral ions. Process: <em>saprotrophic</em> nutrition (extracellular digestion); essential for nutrient recycling. Factors affecting decomposition rate: temperature (enzyme activity), moisture (needed for decomposers), O\u2082 (aerobic decomposition faster), pH, surface area of dead matter. Compost and sewage treatment use controlled decomposition.</p>'},
  {lb:'Phosphorus and water cycles',dr:dQ4,ht:'<p><b>Phosphorus cycle:</b> no atmospheric pool; cycles between rock (phosphate), soil solution, organisms, sediment. Weathering releases phosphate; plants absorb; animals eat plants; decomposers release; may leach to water bodies or become rock again. Limiting nutrient in many aquatic systems. <b>Water cycle:</b> evaporation \u2192 condensation \u2192 precipitation \u2192 runoff/infiltration \u2192 evapotranspiration by plants.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Nitrification is carried out by: 1=fungi and animals, 2=chemoautotrophic bacteria (Nitrosomonas and Nitrobacter) that oxidise ammonia to nitrate.',a:2,w:'Nitrification: Nitrosomonas (NH\u2084\u207a\u2192NO\u2082\u207b) + Nitrobacter (NO\u2082\u207b\u2192NO\u2083\u207b); aerobic chemoautotrophs. Answer: 2.'},{q:'Denitrification is harmful to agriculture because: 1=it produces toxic nitrites, 2=it converts nitrates back to N\u2082, reducing plant-available nitrogen in soil.',a:2,w:'Denitrification: NO\u2083\u207b \u2192 N\u2082 (by Pseudomonas in anaerobic conditions); removes plant nutrients. Answer: 2.'},{q:'The Haber process is an example of: 1=biological nitrogen fixation, 2=industrial nitrogen fixation converting N\u2082 to NH\u2083.',a:2,w:'Haber process: N\u2082 + 3H\u2082 \u21cc 2NH\u2083 (industrial, Fe catalyst); human-mediated fixation. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Nitrification: Nitrosomonas+Nitrobacter. Denitrification: NO\u2083\u207b\u2192N\u2082 (Pseudomonas). Haber: industrial N fixation.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Ecology',ti:'Species Interactions',su:'Describe predation, competition, parasitism, mutualism and symbiosis with examples.',steps:[
  {lb:'Predation and coevolution',dr:dQ5,ht:'<p><b>Predation:</b> predator kills and eats prey; drives coevolution \u2014 prey adaptations (camouflage, speed, toxins, warning colours) \u2192 predator counter-adaptations (sharp senses, speed, mimicry-breaking). <b>Batesian mimicry:</b> harmless species mimics harmful species (e.g. hoverfly mimics wasp). <b>M\u00fcllerian mimicry:</b> two harmful species mimic each other (reinforces avoidance). Keystone predators: regulate prey \u2192 maintain diversity.</p>'},
  {lb:'Competition',dr:dQ5,ht:'<p><b>Intraspecific:</b> same species; density-dependent; strongest when resources scarce. <b>Interspecific:</b> different species; competitive exclusion (Gause) \u2014 if niches identical, one species out-competes and eliminates other; OR niche differentiation (character displacement) allows coexistence. Resource partitioning: similar species exploit same habitat differently (e.g. Darwin\u2019s finches, MacArthur\u2019s warblers).</p>'},
  {lb:'Parasitism and disease',dr:dQ5,ht:'<p><b>Parasitism:</b> parasite benefits; host harmed; usually does not kill host immediately (would lose habitat). Ectoparasites: on surface (lice, ticks, fleas). Endoparasites: internal (tapeworm, <em>Plasmodium</em>, <em>Ascaris</em>). Adaptations: hooks/suckers (tapeworm), thick cuticle (resists host enzymes), high reproductive rate, complex life cycle. Hyperparasites: parasites of parasites.</p>'},
  {lb:'Mutualism and commensalism',dr:dQ5,ht:'<p><b>Mutualism:</b> both benefit. Examples: mycorrhizae (fungus + root; fungus gets glucose, plant gets P and water), <em>Rhizobium</em> + legume (bacteria get sugar, plant gets fixed N), gut microbiome (bacteria get nutrients, host gets vitamins/protection), cleaner fish + larger fish. <b>Commensalism:</b> one benefits, other unaffected; e.g. barnacles on whales, epiphytes on trees. Obligate vs facultative symbiosis.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'The competitive exclusion principle states that: 1=two species always coexist in the same habitat, 2=two species occupying the same niche cannot coexist \u2014 one will be excluded.',a:2,w:'Gause\u2019s principle: same niche \u2192 competition \u2192 one species eliminated. Coexistence requires niche differentiation. Answer: 2.'},{q:'Mycorrhizal associations are mutualistic because: 1=the fungus harms the plant root, 2=the fungus increases water and nutrient absorption for the plant, while the plant provides carbohydrates to the fungus.',a:2,w:'Mutualism: both benefit. Fungus: more absorption area; plant: more P and water. Answer: 2.'},{q:'Batesian mimicry benefits the mimic because: 1=it becomes more toxic, 2=it resembles a harmful species, deterring predators even though it is harmless.',a:2,w:'Batesian: harmless mimic resembles harmful model \u2192 predators avoid it. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Competitive exclusion: same niche, one wins. Mycorrhizae: mutualism. Batesian: harmless mimic looks dangerous.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Ecology',ti:'Succession',su:'Describe primary and secondary succession. Explain climax communities.',steps:[
  {lb:'Primary succession',dr:dQ6,ht:'<p><b>Primary succession:</b> begins on bare substrate with no soil (volcanic rock, sand dune, exposed rock after glacier retreat). Pioneer species (e.g. lichens) colonise; break down substrate; add organic matter; modify microclimate. Followed by mosses, grasses, shrubs, deciduous trees. Each stage (sere) creates conditions favouring next stage until <b>climax community</b> reached (stable, self-perpetuating).</p>'},
  {lb:'Secondary succession',dr:dQ6,ht:'<p><b>Secondary succession:</b> begins where soil already exists but community removed (fire, flood, abandoned farmland, clear-felling). Faster than primary (soil already present). Typical sequence: annual weeds \u2192 perennial grasses \u2192 shrubs \u2192 pioneer trees \u2192 climax woodland. Climax in UK: oak woodland. In tropical regions: tropical rainforest. Determined by climate (not by chance).</p>'},
  {lb:'Changes during succession',dr:dQ6,ht:'<p>As succession proceeds: (1) species diversity increases (more niches created); (2) biomass increases; (3) NPP increases then stabilises; (4) food web complexity increases; (5) nutrient cycling improves (more decomposers, deeper soil); (6) microclimate stabilises (trees buffer temperature and humidity); (7) r-strategists replaced by K-strategists. Ecosystem becomes more stable.</p>'},
  {lb:'Human-modified climax and conservation',dr:dQ6,ht:'<p><b>Deflected/plagioclimax:</b> human activity prevents reaching natural climax; maintained by burning, grazing, cutting. Examples: heathland (burning), grassland (grazing). Remove pressure \u2192 succession resumes. Conservation: may deliberately prevent succession (e.g. maintain heathland for specific species). Rewilding: allow succession to natural climax.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Primary succession differs from secondary succession because: 1=primary occurs on bare substrate with no soil, while secondary occurs where soil is present after disturbance, 2=primary is faster.',a:1,w:'Primary: no soil, starts with rock/sand. Secondary: soil present; faster; starts later in sequence. Answer: 1.'},{q:'A climax community is: 1=the first community to colonise bare ground, 2=a stable, self-perpetuating community representing the endpoint of succession.',a:2,w:'Climax: final stable stage; species composition doesn\u2019t change unless disturbed. Answer: 2.'},{q:'During succession, species diversity: 1=decreases as competitive exclusion eliminates species, 2=increases as more niches are created by more complex habitat structure.',a:2,w:'Succession: more structural complexity \u2192 more niches \u2192 more species \u2192 biodiversity increases. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Primary: no soil. Climax: stable end point. Succession: diversity increases.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Ecology',ti:'Biodiversity and Conservation',su:'Measure biodiversity. Evaluate conservation strategies.',steps:[
  {lb:'Measuring biodiversity',dr:dQ7,ht:'<p>Biodiversity includes: species richness (number of species), species evenness (relative abundance), genetic diversity (variation within species), ecosystem diversity (variety of habitats). <b>Simpson\u2019s diversity index (D):</b> D = 1 \u2212 \u03a3(n/N)\u00b2; where n = number of each species, N = total. D ranges 0\u20131 (higher = more diverse). Alternative: Shannon index H = \u2212\u03a3(pi ln pi).</p>'},
  {lb:'Threats to biodiversity',dr:dQ7,ht:'<p>HIPPCO: Habitat destruction (main cause), Invasive species, Pollution, Population growth (human), Climate change, Over-exploitation. Mass extinctions: background extinction rate ~1\u201310 species/yr; current rate: 100\u20131000\u00d7 above background (6th mass extinction). Biodiversity is essential: ecosystem services (pollination, water purification, carbon sequestration, food, medicines).</p>'},
  {lb:'Conservation strategies',dr:dQ7,ht:'<p><b>In situ:</b> nature reserves, national parks, RAMSAR wetlands, marine protected areas (MPAs), corridors linking habitats. <b>Ex situ:</b> zoos (captive breeding; reintroduction programmes), seed banks (Svalbard Global Seed Vault), botanic gardens, gene banks. <b>Legislation:</b> CITES (Convention on International Trade in Endangered Species), Convention on Biological Diversity, national laws (Wildlife Conservation Acts).</p>'},
  {lb:'Sustainable use',dr:dQ7,ht:'<p>Sustainable development: meeting present needs without compromising future generations\u2019 ability (Brundtland definition). Sustainable forestry: selective logging, replanting; FSC certification. Sustainable fishing: quotas, mesh size, seasonal bans, aquaculture. Ecotourism: generates income from living organisms (incentivises conservation). WAEC: evaluate costs/benefits of conservation strategies.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var species=[5,12,8,3,15];var N=species.reduce(function(a,b){return a+b;},0);var sum_sq=species.reduce(function(a,n){return a+(n/N)*(n/N);},0);var D=parseFloat((1-sum_sq).toFixed(3));var n=rnd(10,30),total=rnd(50,200);var part=parseFloat(((n/total)*(n/total)).toFixed(4));return{question:'Species with n=<b>'+n+'</b> out of total N=<b>'+total+'</b>. Find (n/N)\u00b2 for Simpson\'s index.',hints:['(n/N)\u00b2 = ('+n+'/'+total+')\u00b2'],ans:part,tol:part*0.05,unit:'',working:'('+n+'/'+total+')\u00b2 = '+parseFloat((n/total).toFixed(4))+'\u00b2 = '+part};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Ecology',ti:'Effects of Pollution',su:'Describe effects of pollution on ecosystems. Use indicator species.',steps:[
  {lb:'Water pollution and eutrophication',dr:dQ8,ht:'<p><b>Eutrophication:</b> excess nutrients (nitrates, phosphates from agriculture/sewage) \u2192 algal bloom \u2192 blocks light \u2192 aquatic plants die \u2192 decomposers multiply \u2192 O\u2082 depleted (Biological Oxygen Demand, BOD, increases) \u2192 fish die. Measured by BOD (mg O\u2082 per litre per 5 days at 20\u00b0C). Clean water: low BOD (<3 mg/L); polluted: high BOD (>5 mg/L).</p>'},
  {lb:'Indicator species',dr:dQ8,ht:'<p>Biotic indicators: sensitive to pollution. Clean water: stonefly larvae, mayfly larvae, freshwater shrimp. Mildly polluted: freshwater louse, water hog-louse. Highly polluted: bloodworms (Chironomus), rat-tailed maggots (Eristalis), sludgeworm (Tubifex). Air pollution: lichens absent near SO\u2082 (sensitive); <em>Usnea</em> (clean air), no lichens (heavy pollution). ACFOR scale to record abundance.</p>'},
  {lb:'Air pollution',dr:dQ8,ht:'<p>CO\u2082: greenhouse effect, climate change. SO\u2082 + NOx: acid rain (pH falls, leaches Al\u00b3\u207a from soil \u2192 toxic to fish and roots; damages tree foliage; corrodes buildings). Particulates (PM2.5, PM10): respiratory disease, cardiovascular effects. CFCs: stratospheric ozone depletion \u2192 increased UV \u2192 skin cancer, ecosystem damage. Tropospheric ozone: from NOx + VOCs in sunlight; photochemical smog \u2192 respiratory disease.</p>'},
  {lb:'Bioaccumulation and biomagnification',dr:dQ8,ht:'<p>Persistent organic pollutants (DDT, PCBs, mercury): not degraded; accumulate in fatty tissues; concentration increases at each trophic level (<b>biomagnification</b>). Classic example: DDT in peregrine falcons (thin eggshells \u2192 reproductive failure). Mercury: Minamata disease (Japan; factory waste \u2192 fish \u2192 humans \u2192 neurological damage). WAEC: understand why top predators are most affected.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Eutrophication kills fish because: 1=the algae produce toxins that kill fish directly, 2=decomposers break down dead algae and plants, depleting O\u2082 in the water.',a:2,w:'Eutrophication: algae die and decompose; decomposers use O\u2082; BOD rises; fish suffocate. Answer: 2.'},{q:'Biomagnification means that top predators accumulate: 1=the same concentration of pollutant as producers, 2=much higher concentrations of persistent pollutants because they are concentrated at each trophic level.',a:2,w:'Biomagnification: pollutant not excreted; builds up in fat; concentrated with each transfer up food chain. Answer: 2.'},{q:'Stonefly larvae indicate: 1=heavily polluted water, 2=clean, well-oxygenated water.',a:2,w:'Stonefly larvae: sensitive to pollution; presence = clean water. Bloodworms/rat-tailed maggots = polluted. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Eutrophication: O\u2082 depleted by decomposers. Biomagnification: concentrates up food chain. Stonefly: clean water.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Ecology',ti:'Global Environmental Issues',su:'Evaluate global warming, deforestation and desertification.',steps:[
  {lb:'Climate change and ecology',dr:dQ9,ht:'<p>Climate change effects on ecosystems: (1) Range shifts: species moving poleward/uphill as temperatures rise; phenological shifts (earlier flowering, earlier bird migration). (2) Coral bleaching: temperature rise \u2192 zooxanthellae expelled from coral \u2192 coral death. (3) Sea level rise: coastal habitat flooding. (4) Increased storm frequency/intensity. (5) Ocean acidification: CO\u2082 + H\u2082O \u2192 H\u2082CO\u2083 \u2192 dissolves carbonate shells.</p>'},
  {lb:'Deforestation',dr:dQ9,ht:'<p>Causes: agriculture (palm oil, cattle, soya), logging, charcoal, urban expansion. Effects: biodiversity loss (especially tropical rainforests, ~50% of species); carbon release (trees store ~45% of terrestrial carbon); local climate change (reduced evapotranspiration \u2192 less rainfall); soil erosion (roots no longer bind soil); disrupted water cycle; desertification. Nigeria: lost >96% primary forest.</p>'},
  {lb:'Desertification',dr:dQ9,ht:'<p>Desertification: productive land \u2192 desert. Causes: overgrazing (removes vegetation cover), deforestation, poor irrigation (salinisation), drought. Vegetation removed \u2192 soil exposed to wind and rain \u2192 erosion \u2192 topsoil lost \u2192 less water retention \u2192 less vegetation. Positive feedback: drier soil \u2192 less cloud formation \u2192 less rain \u2192 even drier. Sahel region particularly affected. WAEC: causes, consequences and prevention.</p>'},
  {lb:'Solutions and international agreements',dr:dQ9,ht:'<p>Climate: Paris Agreement (limit warming to 1.5\u20132\u00b0C); Kyoto Protocol; carbon credits; renewable energy. Deforestation: REDD+ (payment for avoided deforestation); sustainable forestry; reforestation (Bonn Challenge: 350 million ha by 2030). Desertification: UNCCD; agroforestry; contour farming; drip irrigation; tree planting (Great Green Wall of Africa). WAEC: link local actions to global policies.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'Coral bleaching is caused by: 1=physical damage from boats, 2=elevated sea temperatures causing coral to expel symbiotic zooxanthellae algae.',a:2,w:'Bleaching: thermal stress \u2192 zooxanthellae expelled \u2192 coral loses colour and food source \u2192 may die. Answer: 2.'},{q:'Deforestation contributes to climate change because: 1=trees cool the air by evapotranspiration, 2=trees store carbon; burning/rotting releases CO\u2082, and fewer trees remain to absorb CO\u2082.',a:2,w:'Deforestation: stored carbon released as CO\u2082; less forest to absorb CO\u2082 in future. Answer: 2.'},{q:'The Great Green Wall of Africa is designed to combat: 1=coastal erosion, 2=desertification and land degradation in the Sahel region.',a:2,w:'Great Green Wall: 8000 km mosaic of trees across Sahel; combat desertification. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Coral bleaching: temperature + zooxanthellae. Deforestation: CO\u2082 release. Great Green Wall: desertification.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Ecology',ti:'Mixed Ecology Questions',su:'Integrated questions across all Y12-ECO-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>NPP = GPP \u2212 R. ~10% efficiency per trophic level. Mark-recapture: N=n\u2081\u00d7n\u2082/m. Nitrogen cycle: fixation\u2192nitrification\u2192assimilation\u2192ammonification\u2192denitrification. Succession: pioneer\u2192climax. Simpson\u2019s D = 1\u2212\u03a3(n/N)\u00b2.</p>'},
  {lb:'Applied ecology: agriculture',dr:dQ10,ht:'<p>Agriculture disrupts natural ecosystems: monocultures (low diversity, high pest susceptibility), pesticides (kill non-target species, bioaccumulation), fertilisers (eutrophication), irrigation (salinisation), GM crops (potential gene flow to wild relatives). Sustainable alternatives: organic farming, intercropping, IPM (integrated pest management), no-till agriculture, precision farming.</p>'},
  {lb:'WAEC question types in ecology',dr:dQ10,ht:'<p>Common WAEC ecology questions: calculate NPP from GPP and R; use mark-recapture formula; interpret food webs; describe nitrogen cycle steps; explain eutrophication; evaluate conservation methods; describe succession; calculate Simpson\u2019s index; interpret population growth curves; describe effects of named pollutants.</p>'},
  {lb:'Calculation practice',dr:dQ10,ht:'<div class="fm">N (mark-recapture) = n\u2081 \u00d7 n\u2082 / m</div><div class="fm">NPP = GPP \u2212 Respiration</div><div class="fm">Ecological efficiency (%) = (energy at n+1 / energy at n) \u00d7 100</div><div class="fm">Simpson\'s D = 1 \u2212 \u03a3(n/N)\u00b2</div>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['mark_recapture','npp','efficiency']);if(type==='mark_recapture'){var n1=rnd(40,100),m=rnd(8,25),n2=rnd(40,100);var N=Math.round(n1*n2/m);return{question:'n\u2081=<b>'+n1+'</b>, n\u2082=<b>'+n2+'</b>, marked recaptured=<b>'+m+'</b>. Estimate N.',hints:['N = n\u2081\u00d7n\u2082/m'],ans:N,tol:Math.max(3,Math.round(N*0.05)),unit:'individuals',working:'N=('+n1+'\u00d7'+n2+')/'+m+'='+(Math.round(n1*n2/m))};}if(type==='npp'){var gpp=rnd(8,20)*1000,r=rnd(2,6)*1000;var npp=gpp-r;return{question:'GPP=<b>'+gpp+'</b> kJ/m\u00b2/yr, R=<b>'+r+'</b>. NPP?',hints:['NPP = GPP \u2212 R'],ans:npp,tol:0,unit:'kJ/m\u00b2/yr',working:'NPP='+gpp+'\u2212'+r+'='+npp};}var eL1=rnd(5,20)*1000,eff=rnd(8,15);var eL2=Math.round(eL1*eff/100);return{question:'Energy at L1=<b>'+eL1+' kJ</b>. Efficiency=<b>'+eff+'%</b>. Energy at L2?',hints:['Energy = L1 \u00d7 efficiency/100'],ans:eL2,tol:0,unit:'kJ',working:eL1+'\u00d7'+eff+'/100='+eL2+' kJ'};})},
]},
];

function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
function render(){bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').innerHTML=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+st.ht;st.dr(si);bDT();document.getElementById('pb').disabled=si===0;document.getElementById('nb').textContent=si===q.steps.length-1?'Restart':'Next';}
document.getElementById('pb').addEventListener('click',function(){if(si>0){si--;render();}});
