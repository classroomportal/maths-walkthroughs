<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Properties of living organisms','#2E7D32',13,'middle',true));
var props=[['MRS GREN','Movement, Respiration, Sensitivity, Growth, Reproduction, Excretion, Nutrition'],['Movement','change in position; not necessarily the whole organism'],['Respiration','release of energy from organic molecules (ATP)'],['Sensitivity','detection of and response to stimuli'],['Growth','permanent increase in size/dry mass'],['Reproduction','production of offspring (sexual or asexual)'],['Excretion','removal of metabolic waste products'],['Nutrition','obtaining organic molecules for energy and growth']];
props.forEach(function(r,i){if(i<=p){o.push(R(10,34+i*26,460,22,i===0?'#C8E6C9':'#F1F8F1',i===0?'#2E7D32':'#C8E6C9',1));o.push(T(i===0?240:110,50+i*26,r[0],'#2E7D32',i===0?11:10,i===0?'middle':'middle',i===0));if(i>0)o.push(T(310,50+i*26,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Cell ultrastructure — animal cell','#2E7D32',13,'middle',true));
o.push(circ(240,140,90,'#F1F8F1','#2E7D32'));
if(p>=1){o.push(circ(240,140,30,'#e8f5e9','#1b5e20'));o.push(T(240,144,'Nucleus','#1b5e20',8,'middle',true));}
if(p>=2){o.push(T(290,110,'Mitochondria','#555',7,'middle',false));o.push(circ(285,118,8,'#C8E6C9','#2E7D32'));}
if(p>=3){o.push(T(180,100,'RER','#555',7,'middle',false));o.push(R(165,105,30,12,'#e8f5e9','#2E7D32',1));}
if(p>=4){o.push(T(240,230,'Cell surface membrane: phospholipid bilayer — controls entry/exit','#555',8,'middle',false));o.push(T(240,240+8,'Nucleus: contains DNA/chromosomes. Mitochondria: ATP synthesis.','#555',7,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Prokaryotic vs eukaryotic cells','#2E7D32',12,'middle',true));
o.push(R(10,34,222,210,'#F1F8F1','#2E7D32',2));o.push(T(121,52,'PROKARYOTE','#2E7D32',11,'middle',true));
o.push(R(248,34,222,210,'#F1F8F1','#2E7D32',2));o.push(T(359,52,'EUKARYOTE','#2E7D32',11,'middle',true));
var pr=['No membrane-bound nucleus','Naked circular DNA','No membrane-bound organelles','70S ribosomes','Cell wall (peptidoglycan)','Smaller (~1\u201310 \u03bcm)','e.g. bacteria'];
var eu=['Membrane-bound nucleus','Linear DNA + histones','Membrane-bound organelles','80S ribosomes','Cell wall if present (cellulose/chitin)','Larger (~10\u2013100 \u03bcm)','e.g. animals, plants, fungi'];
pr.forEach(function(v,i){if(i<p+1)o.push(T(121,72+i*24,v,'#333',8,'middle',false));});
eu.forEach(function(v,i){if(i<p+1)o.push(T(359,72+i*24,v,'#333',8,'middle',false));});
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Cell membranes — fluid mosaic model','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,44,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,62,'Phospholipid bilayer: hydrophilic heads face outward, hydrophobic tails inward','#333',10,'middle',false));o.push(T(240,78,'Fluid: phospholipids can move laterally in each layer','#555',8,'middle',false));}
if(p>=2){o.push(R(10,100,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,118,'Intrinsic proteins: span entire bilayer (channel/carrier proteins)','#333',10,'middle',false));o.push(T(240,134,'Extrinsic proteins: on surface only (recognition, enzymes)','#555',8,'middle',false));}
if(p>=3){o.push(R(10,156,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,174,'Cholesterol: regulates fluidity; reduces permeability to small molecules','#333',10,'middle',false));o.push(T(240,190,'Glycoproteins/glycolipids: cell recognition, antigens, receptors','#555',8,'middle',false));}
if(p>=4){o.push(R(10,212,460,34,'#C8E6C9','#2E7D32',1.5));o.push(T(240,234,'Temperature \u2191 \u2192 fluidity \u2191 (more permeable). Unsaturated fatty acids \u2192 more fluid at low T','#2E7D32',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Transport across membranes','#2E7D32',12,'middle',true));
[['Diffusion','passive; high\u2192low conc; no energy; small/non-polar molecules'],['Facilitated diffusion','passive; via channel/carrier proteins; high\u2192low conc; no ATP'],['Osmosis','passive; water movement via aquaporins; high\u2192low water potential'],['Active transport','against conc gradient; requires ATP; carrier proteins + pump'],['Endocytosis','bulk uptake into cell via vesicle formation; requires ATP'],['Exocytosis','bulk release from cell; vesicle fuses with membrane; ATP']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*34,460,28,'#F1F8F1','#C8E6C9',1));o.push(T(110,57+i*34,r[0],'#2E7D32',10,'middle',true));o.push(T(320,57+i*34,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ6(p){dQ3(p);}
function dQ7(p){dQ4(p);}
function dQ8(p){dQ5(p);}
function dQ9(p){dQ2(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Cell physiology summary','#2E7D32',13,'middle',true));
[['MRS GREN','7 properties of life: movement, respiration, sensitivity, growth, reproduction, excretion, nutrition'],['Prokaryotes','no membrane nucleus; 70S ribosomes; circular DNA; ~1\u201310\u03bcm'],['Eukaryotes','membrane nucleus; 80S ribosomes; linear DNA; organelles; ~10\u2013100\u03bcm'],['Fluid mosaic','phospholipid bilayer + proteins; cholesterol regulates fluidity'],['Diffusion','passive; high\u2192low; no ATP'],['Active transport','against gradient; ATP + carrier proteins required'],['Osmosis','water moves to lower water potential; via aquaporins']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F1F8F1','#C8E6C9',1));o.push(T(100,52+i*30,r[0],'#2E7D32',10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Cell Physiology',ti:'Properties of Living Organisms',su:'State and explain the seven characteristics of living organisms (MRS GREN).',steps:[
  {lb:'MRS GREN',dr:dQ1,ht:'<p>All living organisms share seven properties, remembered as <b>MRS GREN</b>: <b>M</b>ovement, <b>R</b>espiration, <b>S</b>ensitivity, <b>G</b>rowth, <b>R</b>eproduction, <b>E</b>xcretion, <b>N</b>utrition.</p>'},
  {lb:'Definitions I',dr:dQ1,ht:'<p><b>Movement:</b> change in position; in animals the whole organism moves; in plants parts move (e.g. phototropism). <b>Respiration:</b> release of energy from organic molecules, producing ATP; occurs in all living cells. <b>Sensitivity:</b> detection of stimuli and a coordinated response (e.g. withdrawing from pain).</p>'},
  {lb:'Definitions II',dr:dQ1,ht:'<p><b>Growth:</b> permanent increase in size and dry mass; involves cell division and differentiation. <b>Reproduction:</b> production of offspring, either sexually (variation) or asexually (clones). <b>Excretion:</b> removal of toxic metabolic waste products (CO\u2082, urea, excess water). Note: egestion (faeces) is NOT excretion.</p>'},
  {lb:'Nutrition and WAEC application',dr:dQ1,ht:'<p><b>Nutrition:</b> obtaining organic molecules for energy, growth and repair. Autotrophs make their own (photosynthesis); heterotrophs consume others. WAEC tip: always distinguish <em>excretion</em> (metabolic waste) from <em>egestion</em> (undigested food).</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'A plant bending towards light is an example of which property? 1=movement, 2=sensitivity, 3=growth.',a:2,w:'Bending towards light (phototropism) = sensitivity (detecting and responding to a stimulus). The actual bending is also movement, but the stimulus-response mechanism is sensitivity. Answer: 2.'},{q:'Excretion removes: 1=undigested food only, 2=toxic metabolic waste products such as CO\u2082 and urea.',a:2,w:'Excretion = metabolic waste. Egestion = undigested food. Answer: 2.'},{q:'Which property of life is unique to sexual reproduction? 1=variation in offspring, 2=energy release.',a:1,w:'Sexual reproduction produces genetically varied offspring. Asexual = clones. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['MRS GREN: Movement, Respiration, Sensitivity, Growth, Reproduction, Excretion, Nutrition'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Cell Physiology',ti:'Cell Ultrastructure',su:'Identify and describe the functions of cell organelles in animal and plant cells.',steps:[
  {lb:'Nucleus and genetic material',dr:dQ2,ht:'<p><b>Nucleus:</b> contains chromosomes (DNA + histone proteins); surrounded by double nuclear envelope with nuclear pores for mRNA/ribosome export. <b>Nucleolus:</b> site of rRNA synthesis and ribosome assembly. DNA is organised into chromatin, which condenses into chromosomes during division.</p>'},
  {lb:'Energy-related organelles',dr:dQ2,ht:'<p><b>Mitochondria:</b> site of aerobic respiration; double membrane; inner membrane folded into cristae (site of ATP synthesis by oxidative phosphorylation); matrix contains enzymes for Krebs cycle, circular DNA and 70S ribosomes. <b>Chloroplasts</b> (plants only): double membrane; thylakoid membranes (light reactions); stroma (Calvin cycle).</p>'},
  {lb:'Protein synthesis organelles',dr:dQ2,ht:'<p><b>Ribosomes:</b> site of translation; 80S in eukaryotes (60S + 40S subunits); 70S in prokaryotes. <b>Rough ER:</b> studded with ribosomes; proteins synthesised here enter lumen for modification. <b>Smooth ER:</b> lipid and steroid synthesis; Ca\u00b2\u207a store. <b>Golgi apparatus:</b> modifies, packages and routes proteins; vesicles bud off for secretion or lysosomes.</p>'},
  {lb:'Other organelles',dr:dQ2,ht:'<p><b>Lysosomes:</b> contain hydrolytic enzymes; digest old organelles (autophagy) and pathogens (phagocytosis). <b>Centrioles:</b> form spindle fibres during cell division (animals only). <b>Vacuole:</b> large central vacuole in plant cells maintains turgor. <b>Cell wall</b> (plants): cellulose microfibrils; gives structural support.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Which organelle is the site of ATP synthesis via oxidative phosphorylation? 1=ribosome, 2=mitochondria, 3=Golgi.',a:2,w:'Mitochondria: inner membrane (cristae) = site of electron transport chain and ATP synthesis. Answer: 2.'},{q:'Rough ER differs from smooth ER because: 1=rough ER has ribosomes attached, 2=rough ER makes lipids.',a:1,w:'Rough ER: ribosomes on surface; proteins enter lumen. Smooth ER: lipid synthesis. Answer: 1.'},{q:'Lysosomes contain: 1=hydrolytic enzymes for intracellular digestion, 2=photosynthetic pigments.',a:1,w:'Lysosomes: hydrolases (lipases, proteases, nucleases); digest old organelles and pathogens. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Mitochondria: ATP. Ribosome: protein synthesis. Lysosome: digestion. Golgi: modify+package.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Cell Physiology',ti:'Prokaryotic vs Eukaryotic Cells',su:'Compare prokaryotic and eukaryotic cell structure in detail.',steps:[
  {lb:'Prokaryotic features',dr:dQ3,ht:'<p>Prokaryotes (bacteria, archaea): no membrane-bound nucleus; DNA is naked, circular, supercoiled in nucleoid region; no membrane-bound organelles; 70S ribosomes; cell wall of peptidoglycan (bacteria); may have plasmids (small circular DNA); flagella (different structure from eukaryotic); pili for attachment; capsule for protection.</p>'},
  {lb:'Eukaryotic features',dr:dQ3,ht:'<p>Eukaryotes: true membrane-bound nucleus; linear DNA associated with histone proteins; membrane-bound organelles (mitochondria, ER, Golgi, etc.); 80S ribosomes; much larger (10\u2013100 \u03bcm vs 1\u201310 \u03bcm). Plants also have chloroplasts, large central vacuole, cellulose cell wall. Fungi: chitin cell wall.</p>'},
  {lb:'Evolutionary and WAEC significance',dr:dQ3,ht:'<p>Endosymbiotic theory: mitochondria and chloroplasts evolved from engulfed prokaryotes (evidence: double membrane, 70S ribosomes, circular DNA, binary fission). WAEC examiners expect you to know: (1) prokaryotes appeared ~3.5 billion years ago, (2) eukaryotes ~1.8 billion years ago, (3) both domains are compared in terms of size, DNA organisation and ribosomes.</p>'},
  {lb:'Comparison table',dr:dQ3,ht:'<p>Key differences table:</p><div class="fm">Prokaryote: no nuclear envelope, circular DNA, 70S, peptidoglycan wall<br>Eukaryote: nuclear envelope, linear DNA+histones, 80S, cellulose/chitin wall</div><p>Both have: ribosomes, cell surface membrane, cytoplasm, DNA.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Prokaryotic ribosomes are: 1=80S, 2=70S.',a:2,w:'Prokaryotes: 70S ribosomes (30S + 50S subunits). Eukaryotes: 80S. Answer: 2.'},{q:'Which feature is found in prokaryotes but NOT eukaryotes? 1=plasmids (usually), 2=ribosomes.',a:1,w:'Plasmids: mainly in prokaryotes (some yeasts have them). Both have ribosomes. Answer: 1.'},{q:'Evidence for endosymbiotic theory includes: 1=mitochondria have 70S ribosomes and circular DNA, 2=mitochondria have no membrane.',a:1,w:'Mitochondria: 70S ribosomes, circular DNA, double membrane, binary fission = endosymbiotic evidence. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Prokaryote: 70S, circular DNA, no nucleus. Eukaryote: 80S, linear DNA, nucleus.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Cell Physiology',ti:'The Fluid Mosaic Model',su:'Describe membrane structure and explain how it relates to function.',steps:[
  {lb:'Phospholipid bilayer',dr:dQ4,ht:'<p>Singer and Nicolson (1972) fluid mosaic model. <b>Phospholipid bilayer:</b> amphipathic molecules; glycerol backbone + 2 fatty acid tails + phosphate head group. Hydrophilic heads face aqueous environments (inside/outside cell); hydrophobic tails face inward. Fatty acid tails: saturated = straight chains, pack tightly (less fluid); unsaturated = kinked chains, less dense packing (more fluid).</p>'},
  {lb:'Proteins in the membrane',dr:dQ4,ht:'<p><b>Intrinsic (integral) proteins:</b> span entire bilayer; include channel proteins (allow specific ions through by facilitated diffusion) and carrier proteins (active transport or facilitated diffusion). <b>Extrinsic (peripheral) proteins:</b> on membrane surface; roles in cell signalling, structural support, enzyme activity. Proteins can move laterally \u2014 the mosaic is \u2018fluid\u2019.</p>'},
  {lb:'Cholesterol and carbohydrates',dr:dQ4,ht:'<p><b>Cholesterol:</b> intercalates between phospholipid tails; reduces fluidity at high temperature; prevents membrane becoming too rigid at low temperature; reduces permeability to most water-soluble molecules. <b>Glycoproteins</b> and <b>glycolipids:</b> carbohydrate chains on outer surface; form the glycocalyx; involved in cell recognition, immune responses, cell signalling and receptor binding.</p>'},
  {lb:'Temperature and fluidity',dr:dQ4,ht:'<p>At higher temperatures: phospholipids have more kinetic energy, tails move more freely \u2192 membrane more fluid \u2192 more permeable. At very low temperatures: membrane can solidify. Organisms adapt by altering fatty acid composition (more unsaturated in cold environments). This explains why beetroot leaks pigment when heated (membrane loses integrity).</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Cholesterol in the cell membrane: 1=increases fluidity at all temperatures, 2=stabilises membrane fluidity \u2014 reducing it at high T, preventing rigidity at low T.',a:2,w:'Cholesterol buffers membrane fluidity across temperature changes. Answer: 2.'},{q:'Glycoproteins on the outer membrane surface function as: 1=channels for ion transport, 2=cell surface receptors and antigens for recognition.',a:2,w:'Glycoproteins: glycocalyx, cell recognition, antigen presentation, receptor sites. Answer: 2.'},{q:'Unsaturated fatty acid tails in phospholipids cause membranes to be: 1=more fluid due to kinked tails preventing close packing, 2=less fluid.',a:1,w:'Unsaturated: kinks in tails prevent close packing \u2192 more fluid, especially at low temperatures. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Cholesterol: stabilises fluidity. Unsaturated: kinked tails, more fluid. Glycoproteins: recognition.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Cell Physiology',ti:'Transport Across Membranes',su:'Compare passive and active transport. Calculate water potentials.',steps:[
  {lb:'Passive transport',dr:dQ5,ht:'<p><b>Diffusion:</b> net movement of molecules/ions from high to low concentration; no energy required; rate depends on concentration gradient, surface area, diffusion distance, temperature, molecule size and solubility in lipid. <b>Facilitated diffusion:</b> via specific channel or carrier proteins; still down concentration gradient; no ATP; specific and saturable.</p>'},
  {lb:'Osmosis and water potential',dr:dQ5,ht:'<p><b>Osmosis:</b> net movement of water molecules across a partially permeable membrane from high water potential (\u03a8) to low water potential. Water potential = \u03a8s (solute potential, always negative) + \u03a8p (pressure potential). Pure water \u03a8 = 0. Adding solutes lowers \u03a8 (more negative). WAEC: water moves from less concentrated to more concentrated solution.</p>'},
  {lb:'Active transport',dr:dQ5,ht:'<p><b>Active transport:</b> movement against the concentration gradient; requires ATP hydrolysis; uses specific carrier (pump) proteins (e.g. Na\u207a/K\u207a ATPase pump). Can be primary (directly uses ATP) or secondary (uses electrochemical gradient established by primary transport). Allows cells to accumulate ions/molecules against their gradients.</p>'},
  {lb:'Bulk transport',dr:dQ5,ht:'<p><b>Endocytosis:</b> cell engulfs material by membrane folding in and forming a vesicle; phagocytosis (solids), pinocytosis (liquids). <b>Exocytosis:</b> vesicle fuses with cell surface membrane, releasing contents; used for secretion of proteins, hormones, neurotransmitters. Both require ATP and involve membrane fusion.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var psi_s=rnd(-15,-5),psi_p=rnd(1,4);var psi=psi_s+psi_p;return{question:'A plant cell has \u03a8s = <b>'+psi_s+' kPa</b> and \u03a8p = <b>'+psi_p+' kPa</b>. What is its water potential (\u03a8)?',hints:['\u03a8 = \u03a8s + \u03a8p','\u03a8s is always negative; \u03a8p is usually positive'],ans:psi,tol:0,unit:'kPa',working:'\u03a8 = '+psi_s+' + '+psi_p+' = '+psi+' kPa. Water moves from less negative (higher \u03a8) to more negative.'};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Cell Physiology',ti:'Enzyme Action and Cell Metabolism',su:'Describe enzyme structure, mechanisms and factors affecting enzyme activity.',steps:[
  {lb:'Enzyme structure and active site',dr:dQ6,ht:'<p>Enzymes are biological catalysts; mostly globular proteins. The <b>active site</b> is a specific 3D cleft/groove shaped to fit the substrate. <b>Lock and key model:</b> substrate fits active site exactly. <b>Induced fit model</b> (more accurate): active site changes shape slightly to fit substrate \u2192 enzyme-substrate complex \u2192 products released \u2192 enzyme unchanged and reused.</p>'},
  {lb:'Factors affecting enzyme activity',dr:dQ6,ht:'<p><b>Temperature:</b> increases rate (more kinetic energy) up to optimum; above optimum the enzyme denatures (H-bonds break, active site changes shape, cannot reform). <b>pH:</b> alters ionisation of amino acid R-groups in active site; each enzyme has an optimum pH. <b>Substrate concentration:</b> increases rate until all active sites occupied (Vmax); further increase has no effect.</p>'},
  {lb:'Inhibitors',dr:dQ6,ht:'<p><b>Competitive inhibitors:</b> similar shape to substrate; bind to active site; compete with substrate; effect reduced by increasing substrate concentration. <b>Non-competitive inhibitors:</b> bind to allosteric site; change shape of active site; substrate cannot bind; not reversible by increasing substrate. Some inhibitors are irreversible (e.g. nerve agents binding acetylcholinesterase).</p>'},
  {lb:'Cofactors and coenzymes',dr:dQ6,ht:'<p><b>Cofactors:</b> non-protein molecules required for enzyme activity; inorganic (e.g. Zn\u00b2\u207a, Mg\u00b2\u207a) or organic (coenzymes). <b>Coenzymes:</b> organic cofactors, often vitamins (e.g. NAD\u207a, FAD, coenzyme A); carry H atoms or groups between reactions; regenerated after use. Prosthetic groups are permanently attached cofactors (e.g. haem in haemoglobin).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'A non-competitive inhibitor reduces enzyme activity by: 1=competing with substrate for the active site, 2=binding to an allosteric site and changing the active site shape.',a:2,w:'Non-competitive: allosteric site binding \u2192 conformational change \u2192 substrate cannot bind. Answer: 2.'},{q:'Above an enzyme\'s optimum temperature, activity decreases because: 1=there is less substrate, 2=the enzyme denatures (active site shape changes permanently).',a:2,w:'Denaturation: H-bonds break \u2192 active site shape changes \u2192 substrate cannot bind. Answer: 2.'},{q:'The induced fit model differs from lock and key because: 1=the active site changes shape to fit the substrate, 2=the substrate changes shape.',a:1,w:'Induced fit: active site undergoes conformational change when substrate binds. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Competitive: active site. Non-competitive: allosteric site. Denaturation: permanent shape change.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Cell Physiology',ti:'Cell Division — Mitosis',su:'Describe the stages of mitosis and explain its significance.',steps:[
  {lb:'Interphase',dr:dQ7,ht:'<p>Before mitosis, cells undergo <b>interphase</b>: G1 (cell growth, protein synthesis), S phase (DNA replication \u2192 each chromosome becomes two sister chromatids joined at centromere), G2 (further growth, preparation). DNA replication is semi-conservative: each new molecule contains one original and one new strand.</p>'},
  {lb:'Prophase and Metaphase',dr:dQ7,ht:'<p><b>Prophase:</b> chromatin condenses into visible chromosomes; nuclear envelope breaks down; spindle fibres form from centrioles (animals) or MTOCs (plants). <b>Metaphase:</b> chromosomes align at the metaphase plate (cell equator); spindle fibres attach to centromeres via kinetochores. This stage used for karyotyping.</p>'},
  {lb:'Anaphase and Telophase',dr:dQ7,ht:'<p><b>Anaphase:</b> centromeres split; sister chromatids pulled to opposite poles by shortening spindle fibres. <b>Telophase:</b> chromatids arrive at poles; nuclear envelopes reform; chromosomes decondense. <b>Cytokinesis</b> follows: cleavage furrow in animals; cell plate formation in plants.</p>'},
  {lb:'Significance and cancer',dr:dQ7,ht:'<p>Mitosis produces genetically identical diploid daughter cells; used for growth, repair and asexual reproduction. <b>Cancer:</b> uncontrolled mitosis due to mutations in proto-oncogenes (become oncogenes) or tumour suppressor genes (e.g. p53). Cells lose contact inhibition; can invade other tissues (metastasis).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'During which stage of mitosis do chromosomes align at the equator? 1=prophase, 2=metaphase, 3=anaphase.',a:2,w:'Metaphase: chromosomes line up at cell equator (metaphase plate). Answer: 2.'},{q:'DNA replication occurs during: 1=prophase, 2=S phase of interphase.',a:2,w:'DNA is replicated in S phase (synthesis phase) of interphase, before mitosis begins. Answer: 2.'},{q:'Cancer results from: 1=too little mitosis, 2=uncontrolled mitosis due to mutations in cell cycle control genes.',a:2,w:'Cancer: mutations in oncogenes/tumour suppressors \u2192 uncontrolled division. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Metaphase: alignment. S phase: DNA replication. Cancer: uncontrolled mitosis.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Cell Physiology',ti:'Meiosis and Genetic Variation',su:'Describe meiosis and explain how it generates genetic variation.',steps:[
  {lb:'Meiosis I',dr:dQ8,ht:'<p><b>Meiosis I</b> (reductional division): homologous chromosomes pair up (synapsis) forming bivalents; <b>crossing over</b> occurs at chiasmata (exchange of chromatid segments between homologues \u2192 recombinant chromatids); homologues separated to opposite poles; results in 2 haploid cells with duplicated chromosomes.</p>'},
  {lb:'Meiosis II and outcomes',dr:dQ8,ht:'<p><b>Meiosis II</b> (equational): similar to mitosis; sister chromatids separate; 4 haploid daughter cells produced, each genetically unique. Human: 2n=46 \u2192 4 cells each n=23. Sources of variation: (1) crossing over, (2) independent assortment of homologues (2\u00b2\u00b3 = 8,388,608 combinations in humans), (3) random fertilisation.</p>'},
  {lb:'Comparing mitosis and meiosis',dr:dQ8,ht:'<p>Mitosis: 1 division \u2192 2 diploid identical cells; for growth/repair. Meiosis: 2 divisions \u2192 4 haploid unique cells; for sexual reproduction (gamete production in gonads). Key WAEC distinction: meiosis produces genetic variation; mitosis does not (barring mutation).</p>'},
  {lb:'Gametogenesis',dr:dQ8,ht:'<p><b>Spermatogenesis:</b> 1 primary spermatocyte \u2192 4 equal spermatids \u2192 4 spermatozoa. <b>Oogenesis:</b> unequal divisions; 1 primary oocyte \u2192 1 large secondary oocyte + 1 polar body (meiosis I) \u2192 1 egg + 3 polar bodies (meiosis II, completed at fertilisation). Polar bodies degenerate; egg retains all cytoplasm and yolk.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Crossing over during meiosis I increases genetic variation by: 1=doubling the chromosome number, 2=exchanging segments between homologous chromosomes creating new allele combinations.',a:2,w:'Crossing over at chiasmata: recombinant chromatids \u2192 new allele combinations not present in parents. Answer: 2.'},{q:'How many haploid cells does meiosis produce from one diploid cell? 1=2, 2=4.',a:2,w:'Meiosis: 2 divisions \u2192 4 haploid daughter cells. Answer: 2.'},{q:'Oogenesis differs from spermatogenesis because: 1=it produces 4 equal-sized gametes, 2=it produces 1 large egg and 3 polar bodies (unequal divisions).',a:2,w:'Oogenesis: unequal cytoplasm division \u2192 1 egg + 3 polar bodies. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Meiosis: 4 haploid cells. Crossing over: recombinant chromosomes. Oogenesis: 1 egg + 3 polar bodies.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Cell Physiology',ti:'Biological Molecules — Revision',su:'Link biological molecules to cell structure and function.',steps:[
  {lb:'Carbohydrates',dr:dQ9,ht:'<p>Monosaccharides (glucose, fructose, galactose): hexoses (C\u2086H\u2081\u2082O\u2086); source of energy; \u03b1-glucose vs \u03b2-glucose differ in orientation of -OH on C1. Disaccharides (condensation reaction, glycosidic bond): maltose, sucrose, lactose. Polysaccharides: starch (\u03b1-glucose, branched/unbranched, energy store); glycogen (\u03b1-glucose, highly branched, animal store); cellulose (\u03b2-glucose, straight chains, H-bonds between chains \u2192 microfibrils, structural).</p>'},
  {lb:'Proteins',dr:dQ9,ht:'<p>Amino acids: amino group (-NH\u2082), carboxyl group (-COOH), variable R-group; 20 amino acids. Peptide bond formed by condensation; broken by hydrolysis. Primary structure: sequence. Secondary: \u03b1-helix or \u03b2-pleated sheet (H-bonds). Tertiary: ionic bonds, H-bonds, disulfide bridges, hydrophobic interactions. Quaternary: multiple polypeptide chains (e.g. haemoglobin: 4 chains + 4 haem groups).</p>'},
  {lb:'Lipids and nucleic acids',dr:dQ9,ht:'<p>Triglycerides: glycerol + 3 fatty acids; ester bonds; energy store; non-polar. Phospholipids: glycerol + 2 fatty acids + phosphate; amphipathic; form bilayers. DNA: double helix; A-T (2 H-bonds), G-C (3 H-bonds); antiparallel strands; deoxyribose sugar; genes code for proteins. RNA: single stranded; ribose sugar; uracil instead of thymine; types: mRNA, tRNA, rRNA.</p>'},
  {lb:'Testing for molecules (WAEC practical)',dr:dQ9,ht:'<p>Benedict\u2019s test (reducing sugars): blue \u2192 orange/red precipitate. Iodine (starch): yellow/brown \u2192 blue-black. Biuret (protein): blue \u2192 lilac/purple. Emulsion test (lipids): shake in ethanol, add water \u2192 milky white emulsion. Sudan III/IV (lipids): red stain. WAEC tip: distinguish positive from negative results.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'Cellulose differs from starch because: 1=cellulose is made of \u03b2-glucose; straight chains form H-bonds between parallel chains \u2192 structural role, 2=cellulose is an energy store.',a:1,w:'Cellulose: \u03b2-glucose, straight chains, cross-linked by H-bonds \u2192 rigid cell wall. Starch: \u03b1-glucose, energy store. Answer: 1.'},{q:'Biuret reagent tests for proteins. A positive result gives: 1=orange-red precipitate, 2=a lilac/purple colour.',a:2,w:'Biuret: CuSO\u2084 + NaOH; Cu\u00b2\u207a reacts with peptide bonds \u2192 lilac/purple. Answer: 2.'},{q:'The number of hydrogen bonds between G-C base pairs in DNA is: 1=2, 2=3.',a:2,w:'G-C: 3 hydrogen bonds. A-T: 2 hydrogen bonds. More G-C \u2192 higher melting temperature. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Cellulose: \u03b2-glucose, structural. Starch: \u03b1-glucose, storage. Biuret: lilac = protein. G-C: 3 H-bonds.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Cell Physiology',ti:'Mixed Cell Physiology',su:'Integrated questions covering all Y12-CEL-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>MRS GREN. Prokaryote: 70S, circular DNA, no nucleus. Eukaryote: 80S, linear DNA+histones, organelles. Fluid mosaic model: phospholipid bilayer, intrinsic/extrinsic proteins, cholesterol, glycoproteins. Transport: diffusion, facilitated diffusion, osmosis (\u03a8=\u03a8s+\u03a8p), active transport. Enzymes: induced fit, competitive/non-competitive inhibition, cofactors.</p>'},
  {lb:'Integration: structure and function',dr:dQ10,ht:'<p>Cell structure \u2192 function links: mitochondria (aerobic respiration/ATP) \u2192 active transport needs ATP \u2192 cells maintain ion gradients. Ribosome (protein synthesis) \u2192 enzymes \u2192 catalyse metabolic reactions. Nucleus (DNA) \u2192 mRNA \u2192 ribosome \u2192 protein. Cell wall (plants) \u2192 provides turgor support. Understanding these links is essential for WAEC essay questions.</p>'},
  {lb:'WAEC exam technique',dr:dQ10,ht:'<p>WAEC essay tips for this topic: (1) Always define terms first (e.g. "osmosis is the net movement of water molecules from a region of high water potential to low water potential across a partially permeable membrane"). (2) Compare using a table. (3) Name specific examples (e.g. Na\u207a/K\u207a pump for active transport). (4) State units (water potential in kPa, ribosome size in Svedbergs).</p>'},
  {lb:'Calculation practice',dr:dQ10,ht:'<p>Water potential: \u03a8 = \u03a8s + \u03a8p. If \u03a8s = \u221215 kPa and \u03a8p = 4 kPa, then \u03a8 = \u221211 kPa. Water moves from the cell with \u03a8 = \u221211 kPa to one with \u03a8 = \u221218 kPa (lower water potential). Magnification: actual size = image size / magnification. 1 mm = 1000 \u03bcm = 1,000,000 nm.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['water_pot','magnification','ribosome']);if(type==='water_pot'){var ps=rnd(-18,-6),pp=rnd(1,5);var psi=ps+pp;return{question:'\u03a8s = <b>'+ps+' kPa</b>, \u03a8p = <b>'+pp+' kPa</b>. Water potential?',hints:['\u03a8 = \u03a8s + \u03a8p'],ans:psi,tol:0,unit:'kPa',working:'\u03a8 = '+ps+' + '+pp+' = '+psi+' kPa'};}if(type==='magnification'){var actual=rnd(5,50),mag=pick([100,200,400,1000]);var image=actual*mag;return{question:'Cell is <b>'+actual+' \u03bcm</b> long. Magnification = \u00d7<b>'+mag+'</b>. Image size?',hints:['image = actual \u00d7 magnification'],ans:image,tol:0,unit:'\u03bcm',working:'image = '+actual+'\u00d7'+mag+' = '+image+' \u03bcm'};}return{question:'Prokaryotic ribosomes are ___ S. Enter the number.',hints:['Prokaryotes: 70S. Eukaryotes: 80S.'],ans:70,tol:0,unit:'S',working:'Prokaryotic ribosomes = 70S (50S + 30S subunits). Answer: 70.'};})},
]},
];
