<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}

function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}

o.push(T(240,20,'Homeostasis — negative feedback','#2E7D32',13,'middle',true));
if(p>=1){o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,52,'Homeostasis: maintaining a constant internal environment','#333',10,'middle',true));o.push(T(240,70,'despite changes in external environment','#555',9,'middle',false));}

if(p>=3){o.push(arw(420,122,430,122,'#C0272D',2));o.push(R(10,162,460,38,'#C8E6C9','#2E7D32',1.5));o.push(T(240,178,'NEGATIVE FEEDBACK: response reverses deviation (stabilises)','#2E7D32',10,'middle',true));o.push(T(240,194,'POSITIVE FEEDBACK: response amplifies deviation (destabilises)','#C0272D',9,'middle',false));}
if(p>=4){o.push(R(10,212,460,38,'#F1F8F1','#2E7D32',1));o.push(T(240,228,'Examples: temperature regulation, blood glucose, blood pressure, osmoregulation','#555',9,'middle',false));}
s.innerHTML=o.join('');}

o.push(T(240,20,'Thermoregulation in mammals','#2E7D32',12,'middle',true));
o.push(R(10,36,460,44,'#F1F8F1','#2E7D32',2));o.push(T(240,56,'Hypothalamus: thermostat; set point ~37\u00b0C in humans','#333',10,'middle',true));
if(p>=1){o.push(R(10,90,222,80,'#fde8e8','#C0272D',1.5));o.push(T(121,108,'TOO HOT responses','#C0272D',10,'middle',true));['Vasodilation of skin arterioles','Sweating (evaporative cooling)','Hairs lie flat (no trapped air)','Reduced metabolic rate'].forEach(function(v,i){o.push(T(121,124+i*14,v,'#333',7,'middle',false));});}
if(p>=2){o.push(R(248,90,222,80,'#e8f5e9','#2E7D32',1.5));o.push(T(359,108,'TOO COLD responses','#2E7D32',10,'middle',true));['Vasoconstriction (reduces heat loss)','Shivering (muscle ATP \u2192 heat)','Hairs erect (trap air layer)','Increased metabolic rate'].forEach(function(v,i){o.push(T(359,124+i*14,v,'#333',7,'middle',false));});}
if(p>=3){o.push(R(10,184,460,32,'#C8E6C9','#2E7D32',1));o.push(T(240,200,'Ectotherms: behavioural regulation; energy efficient; temperature-dependent activity','#555',8,'middle',false));}
if(p>=4){o.push(R(10,228,460,24,'#F1F8F1','#2E7D32',1));o.push(T(240,244,'Counter-current heat exchange: rete mirabile in limbs; blood warms returning blood','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Blood glucose regulation','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,52,'Pancreatic islets of Langerhans: \u03b1-cells (glucagon) and \u03b2-cells (insulin)','#333',10,'middle',false));o.push(T(240,70,'Normal blood glucose: ~4\u20136 mmol/L (90 mg/100 mL)','#555',8,'middle',false));}
if(p>=2){o.push(R(10,90,222,80,'#fde8e8','#C0272D',1.5));o.push(T(121,108,'HIGH glucose','#C0272D',10,'middle',true));o.push(T(121,124,'\u03b2-cells release insulin','#333',8,'middle',false));o.push(T(121,138,'Cells take up glucose','#333',8,'middle',false));o.push(T(121,152,'Liver: glycogenesis (glucose\u2192glycogen)','#333',7,'middle',false));o.push(T(121,166,'Blood glucose returns to normal','#555',7,'middle',false));}
if(p>=3){o.push(R(248,90,222,80,'#e8f5e9','#2E7D32',1.5));o.push(T(359,108,'LOW glucose','#2E7D32',10,'middle',true));o.push(T(359,124,'\u03b1-cells release glucagon','#333',8,'middle',false));o.push(T(359,138,'Liver: glycogenolysis (glycogen\u2192glucose)','#333',7,'middle',false));o.push(T(359,152,'Gluconeogenesis (fats/amino acids\u2192glucose)','#333',7,'middle',false));o.push(T(359,166,'Blood glucose returns to normal','#555',7,'middle',false));}
if(p>=4){o.push(R(10,184,460,32,'#C8E6C9','#2E7D32',1));o.push(T(240,200,'Type 1 DM: \u03b2-cells destroyed (autoimmune); no insulin; treated with insulin injections','#333',9,'middle',false));o.push(R(10,222,460,24,'#F1F8F1','#2E7D32',1));o.push(T(240,238,'Type 2 DM: insulin resistance; \u03b2-cells overstimulated; lifestyle factors; diet+exercise','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Kidney structure and function','#2E7D32',12,'middle',true));
[['Glomerulus','ultrafiltration; high pressure forces small molecules into Bowman\'s capsule'],['Bowman\'s capsule','receives filtrate; podocytes have filtration slits; plasma proteins stay in blood'],['PCT','selective reabsorption: glucose, amino acids, 80% water, ions; active transport + osmosis'],['Loop of Henl\u00e9','countercurrent multiplier; creates medullary osmotic gradient for urine concentration'],['DCT','fine adjustment of ion balance; aldosterone acts here; further water reabsorption'],['Collecting duct','ADH-controlled water reabsorption; passes through hyperosmotic medulla; produces concentrated urine']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*34,460,28,'#F1F8F1','#C8E6C9',1));o.push(T(100,56+i*34,r[0],'#2E7D32',10,'middle',true));o.push(T(310,56+i*34,r[1],'#555',8,'middle',false));}});

o.push(T(240,20,'Homeostasis summary','#2E7D32',13,'middle',true));
[['Negative feedback','deviation detected \u2192 response reverses it \u2192 set point restored'],['Thermoregulation','hypothalamus; vasodilation/sweating (hot); vasoconstriction/shivering (cold)'],['Blood glucose','high: insulin+glycogenesis; low: glucagon+glycogenolysis'],['Osmoregulation','ADH: collecting duct water permeability; hypothalamic osmoreceptors'],['Liver roles','glycogen store; deamination; urea production; bile; detoxification'],['Diabetes type 1','no insulin (\u03b2-cells destroyed); hyperglycaemia; insulin injections'],['Diabetes type 2','insulin resistance; lifestyle; diet and exercise management']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F1F8F1','#C8E6C9',1));o.push(T(110,52+i*30,r[0],'#2E7D32',10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Homeostasis',ti:'Principles of Homeostasis',su:'Define homeostasis. Describe negative and positive feedback with examples.',steps:[
  {lb:'Definition and importance',dr:dQ1,ht:'<p><b>Homeostasis:</b> the maintenance of a constant internal environment (milieu int\u00e9rieur, Claude Bernard) despite changes in the external environment. Variables regulated: core body temperature (37\u00b0C), blood glucose (~5 mmol/L), blood pH (7.35\u20137.45), blood osmolarity (~285\u2013295 mOsm/kg), blood O\u2082 and CO\u2082 levels.</p>'},
  {lb:'Negative feedback mechanism',dr:dQ1,ht:'<p>All homeostatic mechanisms use <b>negative feedback</b>: receptor detects deviation \u2192 signals control centre \u2192 effectors produce corrective response \u2192 variable returns to set point \u2192 feedback inhibits further response. Self-correcting. Examples: body temperature, blood glucose, blood pressure, ADH/water balance, thyroid hormones (hypothalamus-pituitary-thyroid axis).</p>'},
  {lb:'Positive feedback',dr:dQ1,ht:'<p><b>Positive feedback:</b> response amplifies the original deviation (destabilising). Uncommon in homeostasis; used in specific physiological events. Examples: (1) childbirth \u2014 oxytocin causes contractions \u2192 more stretch \u2192 more oxytocin \u2192 stronger contractions; (2) blood clotting cascade \u2014 each step amplifies; (3) action potential depolarisation \u2014 Na\u207a entry causes more channels to open. Always runs to completion.</p>'},
  {lb:'Two-effector systems',dr:dQ1,ht:'<p>Most homeostatic systems use <b>paired effectors</b> (one raises, one lowers the variable) for precise control. Example: body temperature \u2014 sweating/vasodilation (cooling) vs shivering/vasoconstriction (warming). Blood glucose \u2014 insulin (lowers) vs glucagon (raises). More sensitive and accurate than a single effector working in one direction.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Negative feedback stabilises a variable because: 1=it amplifies any deviation, 2=it produces a response that reverses the deviation and returns the variable to the set point.',a:2,w:'Negative feedback: response opposes and corrects the deviation. Positive feedback: amplifies. Answer: 2.'},{q:'Oxytocin during childbirth is an example of: 1=negative feedback, 2=positive feedback.',a:2,w:'More contractions \u2192 more stretch \u2192 more oxytocin \u2192 stronger contractions: positive feedback runs to completion. Answer: 2.'},{q:'The hypothalamus acts as the control centre for thermoregulation because: 1=it contains thermoreceptors and compares temperature with the 37\u00b0C set point, 2=it produces adrenaline.',a:1,w:'Hypothalamus: peripheral + central thermoreceptors; compares with set point; sends signals to effectors. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Negative feedback: corrects deviation. Positive: amplifies. Hypothalamus: thermostat.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Homeostasis',ti:'Thermoregulation',su:'Describe thermoregulation in mammals. Compare ectotherms and endotherms.',steps:[
  {lb:'Endotherm responses to heat',dr:dQ2,ht:'<p>When core temperature rises above 37\u00b0C: (1) <b>Vasodilation:</b> precapillary sphincters open \u2192 more blood to skin surface \u2192 more heat lost by radiation/convection. (2) <b>Sweating:</b> eccrine sweat glands activated; evaporation of water removes latent heat. (3) <b>Hairs flatten:</b> reduces insulating air layer. (4) <b>Reduced metabolic rate:</b> less heat generated. (5) <b>Behavioural:</b> move to shade, spread limbs.</p>'},
  {lb:'Endotherm responses to cold',dr:dQ2,ht:'<p>When core temperature falls: (1) <b>Vasoconstriction:</b> blood diverted from skin; shunt vessels open \u2192 reduces heat loss. (2) <b>Shivering:</b> antagonistic muscle contractions; ATP hydrolysis \u2192 heat (thermogenesis). (3) <b>Hair erection (piloerection):</b> arrector pili muscles; traps insulating air layer. (4) <b>Increased metabolic rate:</b> adrenaline + thyroxine stimulate heat production. (5) <b>Behavioural:</b> curl up, huddle, seek shelter.</p>'},
  {lb:'Ectotherms vs endotherms',dr:dQ2,ht:'<p><b>Endotherms</b> (mammals, birds): generate heat metabolically; maintain constant body temperature; active in cold; high metabolic cost (more food needed). <b>Ectotherms</b> (reptiles, fish, amphibians, insects): rely on external heat; body temperature varies with environment; activity limited by temperature; more energy-efficient (less food needed). WAEC: advantages and disadvantages of each strategy.</p>'},
  {lb:'Fever and hypothermia',dr:dQ2,ht:'<p><b>Fever:</b> pyrogens (bacterial lipopolysaccharides, cytokines) raise the set point in the hypothalamus \u2192 body responds as if too cold (shivering, vasoconstriction) until new higher set point is reached. Fever enhances immune function (denatures pathogen enzymes). <b>Hypothermia:</b> core temperature < 35\u00b0C; enzyme activity falls; unconsciousness; cardiac arrest below ~28\u00b0C.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Vasodilation of skin arterioles helps cool the body because: 1=it reduces blood flow to the skin, 2=it increases blood flow to the skin surface, increasing heat loss by radiation and convection.',a:2,w:'Vasodilation: more blood near skin surface \u2192 more heat lost to environment. Answer: 2.'},{q:'Shivering generates heat because: 1=muscle fibres contract and relax rapidly, converting ATP energy to heat, 2=it increases heart rate.',a:1,w:'Shivering: rapid antagonistic muscle contractions; most ATP energy released as heat. Answer: 1.'},{q:'Ectotherms have an advantage over endotherms in that: 1=they can survive cold winters more easily, 2=they use less energy on temperature regulation and need less food.',a:2,w:'Ectotherms: no metabolic thermogenesis; less food required. Disadvantage: limited by environmental temperature. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Vasodilation: more blood at surface, more heat loss. Shivering: ATP \u2192 heat. Ectotherm: less food.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Homeostasis',ti:'Blood Glucose Regulation',su:'Describe how insulin and glucagon regulate blood glucose. Explain diabetes.',steps:[
  {lb:'Insulin and high blood glucose',dr:dQ3,ht:'<p>After a meal, blood glucose rises. <b>\u03b2-cells</b> of islets of Langerhans release <b>insulin</b>. Insulin: (1) increases glucose uptake by cells (GLUT4 transporter insertion into membranes, especially in muscle and adipose tissue); (2) promotes glycogenesis (liver and muscle: glucose \u2192 glycogen); (3) promotes lipogenesis; (4) inhibits gluconeogenesis. Blood glucose returns to set point \u2192 \u03b2-cells reduce insulin secretion (negative feedback).</p>'},
  {lb:'Glucagon and low blood glucose',dr:dQ3,ht:'<p>Between meals, blood glucose falls. <b>\u03b1-cells</b> release <b>glucagon</b>. Glucagon: (1) promotes glycogenolysis (glycogen \u2192 glucose in liver); (2) promotes gluconeogenesis (amino acids and glycerol \u2192 glucose); (3) promotes lipolysis (triglycerides \u2192 fatty acids + glycerol). Blood glucose rises \u2192 glucagon inhibited. Adrenaline also raises blood glucose (fight or flight).</p>'},
  {lb:'Second messenger mechanism',dr:dQ3,ht:'<p>Glucagon (and adrenaline) act via <b>second messenger</b>: bind receptor \u2192 adenylate cyclase activated \u2192 ATP \u2192 cAMP (second messenger) \u2192 protein kinase A activated \u2192 glycogen phosphorylase activated \u2192 glycogenolysis. Insulin acts differently: receptor tyrosine kinase \u2192 signal cascade \u2192 GLUT4 insertion. These are examples of cell signalling and cell-surface receptors.</p>'},
  {lb:'Diabetes mellitus',dr:dQ3,ht:'<p><b>Type 1:</b> autoimmune destruction of \u03b2-cells \u2192 no insulin produced \u2192 chronic hyperglycaemia \u2192 glycosuria (glucose in urine, osmotic diuresis \u2192 polyuria \u2192 polydipsia); ketoacidosis. Treatment: exogenous insulin. <b>Type 2:</b> insulin resistance (receptor dysfunction) or insufficient \u03b2-cell response; associated with obesity, inactivity. Complications: retinopathy, nephropathy, neuropathy, cardiovascular disease. Treatment: lifestyle, metformin, may need insulin.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Insulin lowers blood glucose by: 1=stimulating glycogenolysis, 2=promoting glucose uptake by cells and glycogenesis.',a:2,w:'Insulin: GLUT4 insertion \u2192 more glucose uptake; liver/muscle \u2192 glycogenesis. Answer: 2.'},{q:'Glucagon raises blood glucose by acting on the: 1=pancreas, 2=liver (promoting glycogenolysis and gluconeogenesis).',a:2,w:'Glucagon\u2019s main target: liver \u2192 glycogen\u2192glucose + gluconeogenesis. Answer: 2.'},{q:'Type 1 diabetes is caused by: 1=insulin resistance in target cells, 2=autoimmune destruction of pancreatic \u03b2-cells \u2192 no insulin produced.',a:2,w:'Type 1: \u03b2-cells destroyed by immune system \u2192 no insulin. Type 2: insulin resistance. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Insulin: glucose uptake + glycogenesis. Glucagon: liver glycogenolysis. Type 1: no insulin.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Homeostasis',ti:'Kidney Function and Osmoregulation',su:'Describe nephron function and control of water balance by ADH.',steps:[
  {lb:'Ultrafiltration',dr:dQ4,ht:'<p><b>Ultrafiltration</b> in glomerulus: afferent arteriole wider than efferent \u2192 high hydrostatic pressure (~60 mmHg) \u2192 exceeds osmotic pressure of plasma proteins (~25 mmHg) + capsule pressure \u2192 net filtration. Basement membrane + podocyte filtration slits: size threshold; plasma proteins, RBCs, platelets retained. Filtration rate ~125 mL/min (180 L/day); 99% reabsorbed.</p>'},
  {lb:'Selective reabsorption and loop of Henl\u00e9',dr:dQ4,ht:'<p>PCT: glucose + amino acids 100% reabsorbed (Na\u207a cotransport); ~80% water; Na\u207a (active transport); urea passively reabsorbed. Loop of Henl\u00e9: descending limb (permeable to water; concentrated filtrate); ascending limb (impermeable to water; Na\u207a+Cl\u207b actively pumped out \u2192 medullary gradient builds: 300 mOsm at cortex \u2192 1200 mOsm at medulla tip). DCT: aldosterone \u2192 Na\u207a reabsorption.</p>'},
  {lb:'ADH and collecting duct',dr:dQ4,ht:'<p>Collecting duct passes through hyperosmotic medulla. <b>ADH</b> (vasopressin): produced in hypothalamic supraoptic nucleus; released from posterior pituitary; targets V2 receptors on collecting duct cells \u2192 cAMP \u2192 aquaporin-2 (AQP2) insertion into apical membrane \u2192 water reabsorbed by osmosis into medullary interstitium \u2192 blood. High ADH \u2192 small volume concentrated urine. Low ADH (dilute plasma/alcohol) \u2192 large volume dilute urine.</p>'},
  {lb:'Aldosterone and renin-angiotensin system',dr:dQ4,ht:'<p>Low blood pressure/volume \u2192 juxtaglomerular cells release <b>renin</b> \u2192 angiotensinogen \u2192 angiotensin I \u2192 (ACE) \u2192 angiotensin II \u2192 (1) aldosterone release (adrenal cortex) \u2192 Na\u207a reabsorption in DCT \u2192 water follows \u2192 blood volume rises; (2) vasoconstriction \u2192 blood pressure rises. ACE inhibitors are antihypertensive drugs. RAAS is a key homeostatic hormone cascade.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var gfr=125,reabs=rnd(98,99.5);var urine=parseFloat((gfr*(100-reabs)/100*1440/1000).toFixed(2));return{question:'GFR = <b>125 mL/min</b>. <b>'+reabs+'%</b> is reabsorbed. Urine output per day (L)?',hints:['Urine per min = GFR \u00d7 (1 \u2212 reabsorption fraction)','Per day: \u00d7 1440 min; convert to L (\u00f71000)'],ans:urine,tol:urine*0.05,unit:'L/day',working:'Urine/min = 125\u00d7'+(100-reabs)+'/100 = '+parseFloat((gfr*(100-reabs)/100).toFixed(2))+' mL/min. Per day = \u00d71440/1000 = '+urine+' L'};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Homeostasis',ti:'Liver Function',su:'Describe the major functions of the liver in homeostasis and metabolism.',steps:[
  {lb:'Liver structure',dr:dQ5,ht:'<p>Liver: largest internal organ; highly vascular. <b>Hepatic portal vein:</b> brings absorbed nutrients from intestine. <b>Hepatic artery:</b> oxygenated blood. <b>Hepatic vein:</b> drains into inferior vena cava. <b>Hepatocytes</b> (liver cells): arranged in lobules around central vein; surrounded by sinusoids; abundant mitochondria, RER, SER. <b>Kupffer cells:</b> resident macrophages; phagocytose old RBCs, bacteria.</p>'},
  {lb:'Metabolic roles',dr:dQ5,ht:'<p>(1) <b>Carbohydrate metabolism:</b> glycogenesis (glucose\u2192glycogen), glycogenolysis, gluconeogenesis. (2) <b>Lipid metabolism:</b> \u03b2-oxidation of fatty acids, lipoprotein synthesis (VLDL, HDL), cholesterol synthesis, ketone body production. (3) <b>Protein metabolism:</b> transamination (interconvert amino acids), deamination (remove amino group \u2192 keto acid + NH\u2083), urea cycle (detoxify NH\u2083 \u2192 urea). (4) <b>Bile production:</b> bile salts + bilirubin (from RBC breakdown) + cholesterol + water.</p>'},
  {lb:'Detoxification and synthesis',dr:dQ5,ht:'<p>(5) <b>Detoxification:</b> alcohol (ethanol \u2192 ethanal \u2192 ethanoate, by alcohol dehydrogenase); drugs; hormones (insulin, steroids degraded); bile detoxifies bilirubin. (6) <b>Plasma protein synthesis:</b> albumin (osmotic pressure), fibrinogen (clotting), globulins. (7) <b>Vitamin storage:</b> A, D, B12. (8) <b>Iron storage</b> as ferritin (from haem of degraded Hb). (9) <b>Heat production:</b> high metabolic rate \u2192 major thermogenesis organ.</p>'},
  {lb:'Liver disease',dr:dQ5,ht:'<p><b>Cirrhosis:</b> scar tissue replaces hepatocytes (alcohol, hepatitis B/C); reduced synthetic and detox functions. <b>Jaundice:</b> bilirubin accumulates in blood (excess RBC breakdown, bile duct blockage, or liver failure) \u2192 yellow skin/sclera. <b>Hepatitis B/C:</b> viral; may become chronic; risk of cirrhosis and hepatocellular carcinoma. WAEC: relate liver function loss to specific symptoms.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Deamination in the liver removes the amino group from excess amino acids to produce: 1=glucose directly, 2=ammonia (NH\u2083) which is converted to urea in the ornithine cycle.',a:2,w:'Deamination: -NH\u2082 removed \u2192 NH\u2083; ornithine cycle \u2192 urea (less toxic, excreted by kidneys). Answer: 2.'},{q:'Jaundice causes yellowing because: 1=the liver produces excess bile, 2=bilirubin (from Hb breakdown) accumulates in blood when the liver cannot process it.',a:2,w:'Jaundice: bilirubin not conjugated/excreted by liver \u2192 builds up \u2192 yellow pigmentation. Answer: 2.'},{q:'The hepatic portal vein is important for homeostasis because: 1=it oxygenates the liver, 2=it delivers absorbed nutrients directly to the liver for processing before they reach general circulation.',a:2,w:'Portal vein: intestine \u2192 liver \u2192 glucose regulated, amino acids processed, toxins removed before blood reaches body. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Deamination: NH\u2083 \u2192 urea. Jaundice: bilirubin accumulates. Portal vein: nutrients processed first.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Homeostasis',ti:'Excretion — Nitrogenous Wastes',su:'Compare excretion of nitrogenous wastes across different animal groups.',steps:[
  {lb:'Types of nitrogenous waste',dr:dQ6,ht:'<p>Amino acid catabolism \u2192 toxic NH\u2083. Animals excrete it in different forms: <b>Ammonia (NH\u2083):</b> very toxic; requires large amounts of water to dilute; excreted directly by aquatic animals (most fish, aquatic invertebrates) \u2014 no energy cost. <b>Urea:</b> less toxic; soluble; moderate water needed; excreted by mammals, adult amphibia, sharks. <b>Uric acid:</b> insoluble (paste); very little water needed; birds, reptiles, insects, snails; energy costly to synthesise.</p>'},
  {lb:'Mammalian urea production',dr:dQ6,ht:'<p>Urea produced in liver via <b>ornithine cycle</b> (urea cycle): (1) NH\u2083 + CO\u2082 + ornithine \u2192 citrulline \u2192 argininosuccinate \u2192 arginine \u2192 ornithine + urea. ATP-consuming process. Urea: filtered at glomerulus; partially reabsorbed in tubule (contributes to medullary gradient); excreted in urine. Blood urea nitrogen (BUN) measured clinically; raised in kidney disease.</p>'},
  {lb:'Other excretory products',dr:dQ6,ht:'<p>Excretion = removal of <em>metabolic</em> waste. Not egestion (faeces). Excretory products: CO\u2082 (lungs/gills), urea (kidneys), bile pigments (bilirubin, biliverdin \u2014 liver/bile), water (kidneys, lungs, skin), mineral salts (kidneys, sweat), creatinine (muscles \u2192 blood \u2192 kidneys). WAEC: distinguish excretion from egestion and secretion.</p>'},
  {lb:'Malpighian tubules in insects',dr:dQ6,ht:'<p>Insects: no kidneys; <b>Malpighian tubules</b> open into gut at junction of midgut/hindgut. Tubules: actively pump K\u207a + uric acid into lumen; water follows by osmosis. Contents pass into hindgut/rectum; water and K\u207a reabsorbed; dry uric acid crystals excreted with faeces. Conserves water \u2014 crucial for terrestrial insects. No blood pressure filtration.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Birds excrete uric acid rather than urea because: 1=uric acid is less toxic and can be excreted as a dry paste, conserving water (important for flight, no heavy bladder), 2=birds have no liver.',a:1,w:'Uric acid: insoluble, excreted dry; saves water; lighter than liquid urine (advantage for flight). Answer: 1.'},{q:'Ammonia is suitable for excretion in aquatic animals because: 1=it requires no energy to produce and can be diluted in surrounding water, 2=it is stored safely in vacuoles.',a:1,w:'Ammonia: no synthesis cost; freely diffuses into water. Would be toxic on land (no water to dilute). Answer: 1.'},{q:'Malpighian tubules excrete uric acid by: 1=ultrafiltration under blood pressure, 2=active transport of K\u207a and uric acid into tubule lumen, water follows by osmosis.',a:2,w:'Malpighian tubules: no blood filtration; active secretion into tubule; water follows. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Uric acid: dry, birds+reptiles+insects. Ammonia: aquatic, no cost. Malpighian: active secretion.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Homeostasis',ti:'Lung Volumes and Spirometry',su:'Interpret spirometer traces. Calculate pulmonary volumes.',steps:[
  {lb:'Lung volumes',dr:dQ7,ht:'<p><b>Tidal volume (TV):</b> air breathed in/out in normal breath (~500 mL). <b>Inspiratory reserve volume (IRV):</b> extra air that can be inhaled after normal inspiration (~3000 mL). <b>Expiratory reserve volume (ERV):</b> extra air exhaled after normal expiration (~1500 mL). <b>Residual volume (RV):</b> air always remaining in lungs (~1500 mL; keeps alveoli open). <b>Vital capacity (VC) = TV + IRV + ERV.</b> Total lung capacity = VC + RV.</p>'},
  {lb:'Spirometry calculations',dr:dQ7,ht:'<div class="fm">Vital Capacity = TV + IRV + ERV</div><div class="fm">Minute ventilation = Tidal volume \u00d7 Breathing rate</div><div class="fm">Alveolar ventilation = (TV \u2212 dead space) \u00d7 breathing rate</div><p>Dead space (~150 mL): air in trachea/bronchi not reaching alveoli. Exercise: increases TV and breathing rate \u2192 greatly increased minute ventilation.</p>'},
  {lb:'Control of breathing',dr:dQ7,ht:'<p>Breathing controlled by <b>respiratory centres</b> in medulla oblongata (inspiratory and expiratory centres). Primary stimulus: blood CO\u2082/pH (not O\u2082 \u2014 exception: peripheral chemoreceptors in carotid/aortic bodies respond to very low pO\u2082). Central chemoreceptors in medulla: detect H\u207a (from CO\u2082 + H\u2082O \u2192 H\u2082CO\u2083 \u2192 H\u207a + HCO\u2083\u207b). Hering-Breuer reflex: stretch receptors in lung wall stop inspiration when lungs fully inflated.</p>'},
  {lb:'Obstructive and restrictive diseases',dr:dQ7,ht:'<p><b>Asthma:</b> bronchospasm + inflammation \u2192 increased airway resistance; reduced FEV1 (forced expiratory volume in 1 sec); FEV1/FVC ratio reduced (obstructive pattern). <b>Emphysema:</b> alveolar wall destruction (smoking \u2192 elastase); reduced SA; increased compliance; barrel chest; reduced FEV1 and FVC. <b>Restrictive:</b> fibrosis \u2192 reduced lung compliance; reduced FVC; normal FEV1/FVC ratio. WAEC: interpret spirometry traces for each condition.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var TV=rnd(400,600),IRV=rnd(2500,3500),ERV=rnd(1000,2000),RV=1500,BR=rnd(12,20);var VC=TV+IRV+ERV;var TLC=VC+RV;var MV=TV*BR;var type=pick(['VC','TLC','MV']);if(type==='VC')return{question:'TV=<b>'+TV+'</b>, IRV=<b>'+IRV+'</b>, ERV=<b>'+ERV+' mL</b>. Vital capacity?',hints:['VC = TV + IRV + ERV'],ans:VC,tol:0,unit:'mL',working:'VC = '+TV+'+'+IRV+'+'+ERV+' = '+VC+' mL'};if(type==='TLC')return{question:'VC = <b>'+VC+' mL</b>, RV = <b>'+RV+' mL</b>. Total lung capacity?',hints:['TLC = VC + RV'],ans:TLC,tol:0,unit:'mL',working:'TLC = '+VC+'+'+RV+' = '+TLC+' mL'};return{question:'TV = <b>'+TV+' mL</b>, breathing rate = <b>'+BR+'/min</b>. Minute ventilation?',hints:['Minute ventilation = TV \u00d7 breathing rate'],ans:MV,tol:0,unit:'mL/min',working:'MV = '+TV+'\u00d7'+BR+' = '+MV+' mL/min'};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Homeostasis',ti:'pH Regulation and Buffer Systems',su:'Explain how blood pH is regulated by buffers, lungs and kidneys.',steps:[
  {lb:'Normal blood pH and buffers',dr:dQ8,ht:'<p>Normal blood pH: 7.35\u20137.45 (slightly alkaline). Deviation: acidosis (<7.35) or alkalosis (>7.45) \u2014 both dangerous. <b>Buffer systems:</b> (1) Bicarbonate buffer (most important in blood): H\u207a + HCO\u2083\u207b \u21cc H\u2082CO\u2083 \u21cc H\u2082O + CO\u2082; resists pH change. (2) Haemoglobin buffer: Hb\u207b + H\u207a \u21cc HHb; haemoglobin is a good buffer. (3) Phosphate buffer: in cells and urine. (4) Plasma proteins: -COOH and -NH\u2082 groups buffer H\u207a.</p>'},
  {lb:'Respiratory regulation of pH',dr:dQ8,ht:'<p>Lungs: fast, short-term pH regulation. High CO\u2082 (acidosis) \u2192 central chemoreceptors \u2192 increased ventilation rate \u2192 more CO\u2082 exhaled \u2192 CO\u2082 + H\u2082O \u2193 \u2192 H\u207a \u2193 \u2192 pH normalises. Low CO\u2082 (alkalosis) \u2192 reduced ventilation \u2192 CO\u2082 retained \u2192 pH falls. Hyperventilation: blows off CO\u2082 \u2192 respiratory alkalosis (tingling, tetany). Hypoventilation (obstructive disease): CO\u2082 retained \u2192 respiratory acidosis.</p>'},
  {lb:'Renal regulation of pH',dr:dQ8,ht:'<p>Kidneys: slow, long-term pH regulation (days). Mechanisms: (1) Secrete H\u207a into tubule (actively pumped into lumen); H\u207a + HCO\u2083\u207b in filtrate \u2192 CO\u2082 + H\u2082O (lost in urine). (2) Reabsorb HCO\u2083\u207b (bicarbonate). (3) Produce NH\u2084\u207a (from glutamine) to buffer H\u207a in urine. In acidosis: kidneys excrete more H\u207a and reabsorb more HCO\u2083\u207b. In alkalosis: excrete HCO\u2083\u207b and retain H\u207a.</p>'},
  {lb:'Acid-base disorders',dr:dQ8,ht:'<p>Four types: (1) <b>Respiratory acidosis:</b> hypoventilation \u2192 CO\u2082 retention; compensated by renal HCO\u2083\u207b retention. (2) <b>Respiratory alkalosis:</b> hyperventilation; compensated by renal H\u207a retention. (3) <b>Metabolic acidosis:</b> diabetic ketoacidosis, lactic acidosis, renal failure; compensated by hyperventilation. (4) <b>Metabolic alkalosis:</b> vomiting (HCl loss), alkali ingestion; compensated by hypoventilation.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'During exercise, blood pH falls. The primary reason is: 1=decreased O\u2082, 2=increased CO\u2082 (from respiration) \u2192 H\u2082CO\u2083 \u2192 H\u207a, lowering pH.',a:2,w:'Exercise: more CO\u2082 produced \u2192 CO\u2082+H\u2082O\u2192H\u2082CO\u2083\u2192H\u207a+HCO\u2083\u207b \u2192 pH falls. Answer: 2.'},{q:'Hyperventilation causes respiratory alkalosis because: 1=too much O\u2082 is inhaled, 2=excessive CO\u2082 is exhaled \u2192 less H\u207a formed \u2192 pH rises.',a:2,w:'Blowing off CO\u2082: less H\u2082CO\u2083 \u2192 less H\u207a \u2192 blood becomes more alkaline. Answer: 2.'},{q:'The kidneys help regulate blood pH by: 1=filtering CO\u2082, 2=actively secreting H\u207a into the tubule and reabsorbing HCO\u2083\u207b.',a:2,w:'Kidneys: H\u207a secreted into urine; HCO\u2083\u207b reabsorbed into blood. Long-term pH regulation. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['CO\u2082 \u2192 H\u207a (pH falls). Hyperventilation: CO\u2082 lost \u2192 alkalosis. Kidneys: H\u207a secreted, HCO\u2083\u207b reabsorbed.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Homeostasis',ti:'Reproduction and Hormonal Control',su:'Describe hormonal control of the menstrual cycle and pregnancy.',steps:[
  {lb:'Menstrual cycle hormones',dr:dQ9,ht:'<p>28-day cycle. <b>FSH</b> (anterior pituitary): stimulates follicle development; oestrogen secretion. <b>Oestrogen</b> (follicle): rebuilds uterine lining; at high levels \u2192 positive feedback on LH surge. <b>LH surge</b> (anterior pituitary, day ~14): triggers ovulation; corpus luteum formation. <b>Progesterone</b> (corpus luteum): maintains uterine lining; inhibits FSH and LH (negative feedback); dominant in luteal phase.</p>'},
  {lb:'Ovulation and implantation',dr:dQ9,ht:'<p>Ovulation: LH surge \u2192 Graafian follicle ruptures \u2192 secondary oocyte released \u2192 travels down fallopian tube (fertilisation usually here within 12\u201324 hrs). If fertilised: zygote \u2192 morula \u2192 blastocyst \u2192 implants in endometrium (day 7\u201310). Trophoblast secretes <b>hCG</b> (human chorionic gonadotropin): maintains corpus luteum \u2192 progesterone continues \u2192 no menstruation. hCG detected in pregnancy tests.</p>'},
  {lb:'Pregnancy hormones',dr:dQ9,ht:'<p>During pregnancy: placenta takes over progesterone production (~week 12). <b>Oestrogen + progesterone:</b> maintain endometrium; suppress FSH/LH (no new cycle). <b>hPL</b> (human placental lactogen): alters maternal metabolism (insulin resistance \u2192 more glucose available for foetus). <b>Relaxin:</b> loosens pelvic ligaments; cervix softens. <b>Oxytocin</b>: childbirth (positive feedback); lactation (milk ejection reflex).</p>'},
  {lb:'Contraception and fertility treatment',dr:dQ9,ht:'<p><b>Contraception:</b> combined pill (oestrogen + progesterone \u2192 inhibit FSH/LH \u2192 suppress ovulation; thicken cervical mucus; thin endometrium). Mini-pill (progesterone only). IUD (prevents implantation + spermicidal). <b>Fertility treatment:</b> clomiphene (blocks oestrogen receptors in pituitary \u2192 more FSH \u2192 ovulation). IVF: superovulation (FSH injections) \u2192 egg collection \u2192 in vitro fertilisation \u2192 embryo transfer.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'The LH surge on day ~14 of the menstrual cycle is triggered by: 1=a negative feedback from oestrogen, 2=a positive feedback from high oestrogen levels.',a:2,w:'High oestrogen \u2192 positive feedback on pituitary \u2192 LH surge \u2192 ovulation. Answer: 2.'},{q:'hCG maintains pregnancy in the first trimester by: 1=replacing oestrogen, 2=preventing corpus luteum degeneration so progesterone continues to be produced.',a:2,w:'hCG: maintains corpus luteum \u2192 corpus luteum keeps making progesterone \u2192 uterine lining maintained. Answer: 2.'},{q:'The combined oral contraceptive pill prevents pregnancy primarily by: 1=killing sperm, 2=suppressing FSH and LH release, preventing follicle development and ovulation.',a:2,w:'Pill: synthetic oestrogen+progesterone \u2192 negative feedback on pituitary \u2192 FSH/LH suppressed \u2192 no ovulation. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['LH surge: positive feedback from oestrogen. hCG: maintains corpus luteum. Pill: suppresses FSH/LH.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Homeostasis',ti:'Mixed Homeostasis Questions',su:'Integrated questions across Y12-HUM-02 — homeostasis, gas exchange, excretion.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Negative feedback: corrects deviation. Thermoregulation: hypothalamus, vasodilation/sweating vs vasoconstriction/shivering. Blood glucose: insulin (lower) vs glucagon (raise). ADH: water balance. Liver: deamination, urea, bile, glycogen. Breathing control: CO\u2082/pH at medulla.</p>'},
  {lb:'Integration: hormones and homeostasis',dr:dQ10,ht:'<p>All homeostatic systems use hormones or nerves (or both). Key pairs: insulin/glucagon (blood glucose), ADH/aldosterone (water/Na\u207a balance), PTH/calcitonin (Ca\u00b2\u207a), thyroxine/TRH-TSH axis (metabolic rate). Understand the feedback loops: deviation \u2192 hormone released \u2192 effector response \u2192 variable corrected \u2192 hormone inhibited.</p>'},
  {lb:'WAEC exam technique',dr:dQ10,ht:'<p>For WAEC homeostasis essays: (1) define the variable being regulated; (2) state the set point; (3) describe what detects deviation; (4) state the control centre; (5) name the effectors and their response; (6) explain how the response corrects the deviation; (7) state this is negative feedback. Always use correct terminology and named examples.</p>'},
