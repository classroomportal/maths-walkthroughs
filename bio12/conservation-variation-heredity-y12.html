<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}

body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'DNA structure and gene expression','#2E7D32',13,'middle',true));
if(p>=1){o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,54,'DNA: double helix; antiparallel strands; A-T (2H-bonds), G-C (3H-bonds)','#333',10,'middle',false));o.push(T(240,72,'Deoxyribose sugar; phosphate backbone; nitrogenous bases','#555',8,'middle',false));}
if(p>=2){o.push(R(10,90,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,104,'TRANSCRIPTION: DNA \u2192 mRNA (in nucleus); RNA polymerase; template strand read 3\u2019\u21925\u2019','#333',10,'middle',false));o.push(T(240,122,'pre-mRNA \u2192 splicing (introns removed, exons joined) \u2192 mature mRNA','#555',8,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,156,'TRANSLATION: mRNA \u2192 protein (at ribosomes); codons (triplets); tRNA anticodon','#333',10,'middle',false));o.push(T(240,174,'Start codon AUG (Met); stop codons UAA, UAG, UGA; peptide bond formation','#555',8,'middle',false));}
if(p>=4){o.push(R(10,194,460,54,'#C8E6C9','#2E7D32',1));o.push(T(240,212,'Genetic code: triplet, degenerate (multiple codons per amino acid), non-overlapping, universal','#333',9,'middle',false));o.push(T(240,228,'One gene \u2192 one polypeptide (Beadle & Tatum); genes can be regulated','#555',8,'middle',false));o.push(T(240,244,'Epigenetics: DNA methylation, histone modification alter gene expression without changing sequence','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Mendelian genetics — dihybrid cross','#2E7D32',12,'middle',true));
o.push(R(10,38,460,44,'#F1F8F1','#2E7D32',2));o.push(T(240,58,'AaBb \u00d7 AaBb (both dihybrid)','#1b5e20',12,'middle',true));o.push(T(240,76,'Expected ratio: 9 A_B_ : 3 A_bb : 3 aaB_ : 1 aabb (if genes unlinked)','#555',9,'middle',false));
if(p>=1){var gs=['AB','Ab','aB','ab'];gs.forEach(function(g,i){o.push(T(140+i*80,110,g,'#2E7D32',9,'middle',true));o.push(T(100,130+i*30,g,'#2E7D32',9,'middle',true));});}
if(p>=2){var combos=[['AABB','AABb','AaBB','AaBb'],['AABb','AAbb','AaBb','Aabb'],['AaBB','AaBb','aaBB','aaBb'],['AaBb','Aabb','aaBb','aabb']];combos.forEach(function(row,i){row.forEach(function(cell,j){if(i<=p-1)o.push(T(140+j*80,130+i*30,cell,'#555',7,'middle',false));});});}
if(p>=3)o.push(T(240,250,'9:3:3:1 ratio assumes independent assortment (genes on different chromosomes)','#555',8,'middle',false));
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Gene linkage and recombination','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,56,'Linked genes: on same chromosome; tend to be inherited together','#333',10,'middle',false));o.push(T(240,74,'Deviate from 9:3:3:1 ratio expected for independent assortment','#555',8,'middle',false));}
if(p>=2){o.push(R(10,94,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,112,'Crossing over (meiosis I): breaks linkage; produces recombinant chromosomes','#333',10,'middle',false));o.push(T(240,130,'Recombination frequency = (recombinants/total offspring) \u00d7 100%','#555',8,'middle',false));}
if(p>=3){o.push(R(10,150,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,168,'Recombination frequency (cM, centimorgans) = map distance','#333',10,'middle',false));o.push(T(240,186,'1 cM = 1% recombination; linked genes: < 50 cM apart','#555',8,'middle',false));}
if(p>=4){o.push(R(10,206,460,44,'#C8E6C9','#2E7D32',1));o.push(T(240,224,'Chromosome mapping: genes placed in order using recombination frequencies','#333',9,'middle',false));o.push(T(240,242,'Sturtevant (1913): first chromosome map (X chromosome of Drosophila)','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Mutations and chromosomal abnormalities','#2E7D32',12,'middle',true));
[['Substitution','one base replaced; may change amino acid (missense) or not (silent)'],['Deletion','base(s) removed; frameshift; alters all subsequent codons'],['Insertion','base(s) added; frameshift; alters all subsequent codons'],['Inversion','segment of chromosome reversed; may disrupt gene function'],['Translocation','segment moves to different chromosome; may create fusion gene'],['Non-disjunction','chromosomes fail to separate in meiosis \u2192 aneuploidy (e.g. Down syndrome 47,XX/XY+21)']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*34,460,28,'#F1F8F1','#C8E6C9',1));o.push(T(110,56+i*34,r[0],'#2E7D32',10,'middle',true));o.push(T(320,56+i*34,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ3(p);}
function dQ7(p){dQ4(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Genetics summary','#2E7D32',13,'middle',true));
[['Transcription','DNA\u2192mRNA; RNA polymerase; nucleus; template strand 3\u2019\u21925\u2019'],['Translation','mRNA\u2192protein; ribosome; codons; tRNA anticodon; AUG start'],['Dihybrid ratio','9:3:3:1 (unlinked genes; both parents AaBb)'],['Linkage','genes on same chromosome; inherited together; crossing over reduces'],['Recombination freq','(recombinants/total)\u00d7100%; 1 cM = 1% recombination'],['Frameshift mutation','insertion/deletion; shifts reading frame; alters all downstream codons'],['Epigenetics','methylation/histone modification; changes expression not sequence']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F1F8F1','#C8E6C9',1));o.push(T(120,52+i*30,r[0],'#2E7D32',10,'middle',true));o.push(T(330,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Genetics',ti:'DNA Structure and Gene Expression',su:'Describe transcription and translation in detail.',steps:[
  {lb:'DNA and RNA structure',dr:dQ1,ht:'<p>DNA: double helix; antiparallel strands (3\u2019\u21925\u2019 and 5\u2019\u21923\u2019); deoxyribose-phosphate backbone; bases A,T,G,C; complementary base pairing A-T (2 H-bonds), G-C (3 H-bonds). RNA: single-stranded; ribose sugar; uracil instead of thymine. Types: mRNA (carries genetic message), tRNA (carries amino acid), rRNA (structural component of ribosome). All synthesised by RNA polymerase from DNA template.</p>'},
  {lb:'Transcription',dr:dQ1,ht:'<p><b>Transcription:</b> DNA \u2192 mRNA (in nucleus). RNA polymerase binds promoter; unwinds DNA; reads template strand 3\u2019\u21925\u2019; synthesises mRNA 5\u2019\u21923\u2019 (complementary to template; same sequence as coding strand but U instead of T). <b>Pre-mRNA processing:</b> 5\u2019 cap and poly-A tail added (protect from degradation); introns (non-coding) removed; exons spliced together by spliceosomes \u2192 mature mRNA. Alternative splicing: same gene \u2192 multiple proteins.</p>'},
  {lb:'Translation',dr:dQ1,ht:'<p><b>Translation:</b> mRNA \u2192 protein (at ribosome). Ribosome has A, P and E sites. (1) Initiation: small ribosomal subunit + mRNA; tRNA with anticodon UAC carries Met to AUG start codon. (2) Elongation: tRNA brings amino acid to A site; peptide bond formed (peptidyl transferase; rRNA); ribosome moves along mRNA (translocation); tRNA exits E site. (3) Termination: stop codon (UAA/UAG/UGA) reached; release factor; polypeptide released; ribosome dissembles.</p>'},
  {lb:'Genetic code and regulation',dr:dQ1,ht:'<p>Genetic code: triplet (3 bases = codon); 64 codons for 20 amino acids (degenerate = multiple codons per AA); non-overlapping; universal (same in almost all organisms). Gene expression regulation: (1) transcription factors bind enhancers/silencers; (2) chromatin remodelling (histone acetylation/methylation); (3) epigenetic DNA methylation; (4) post-transcriptional: miRNA degradation, alternative splicing; (5) post-translational: phosphorylation, cleavage, glycosylation.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var dna_template='TACGAACGTCTA',dna_coding='ATGCTTGCAGAT';var mrna='AUGCUUGCAGAU';var qs=[{q:'Template DNA strand is 3\u2019-TACGAA-5\u2019. The mRNA sequence is:',a:1,w:'mRNA = complement of template (U instead of T): AUG CUU \u2192 5\u2019-AUGCUU-3\u2019. Answer: 1.',opt1:'5\u2019-AUGCUU-3\u2019',opt2:'5\u2019-TACGAA-3\u2019'},{q:'The genetic code is described as degenerate. This means: 1=multiple codons can code for the same amino acid, 2=the code is different in different species.',a:1,w:'Degenerate: 64 codons, only 20 amino acids \u2192 multiple codons per amino acid (e.g. UUU and UUC both code for Phe). Answer: 1.'},{q:'Alternative splicing of pre-mRNA allows: 1=one gene to produce multiple different proteins from the same DNA sequence, 2=DNA replication to occur.',a:1,w:'Alternative splicing: different exon combinations \u2192 different mRNAs \u2192 different proteins; increases proteome diversity. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Template 3\u2019\u21925\u2019 \u2192 mRNA 5\u2019\u21923\u2019 (A\u2192U, T\u2192A, G\u2192C, C\u2192G). Degenerate: multiple codons same AA.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Genetics',ti:'Mendelian Genetics — Extended',su:'Solve monohybrid and dihybrid crosses. Explain incomplete dominance and co-dominance.',steps:[
  {lb:'Monohybrid cross review',dr:dQ2,ht:'<p>Mendel\u2019s laws: (1) Law of Segregation: alleles separate during gamete formation; each gamete receives one allele. (2) Law of Independent Assortment: alleles of different genes assort independently into gametes (only if genes on different chromosomes). Monohybrid cross Aa \u00d7 Aa: 1 AA : 2 Aa : 1 aa (1:2:1 genotype); 3 dominant : 1 recessive phenotype (3:1).</p>'},
  {lb:'Dihybrid cross and 9:3:3:1',dr:dQ2,ht:'<p>Dihybrid AaBb \u00d7 AaBb (both heterozygous for two genes). Using FOIL or Punnett square (4\u00d74=16 squares): 9 A_B_ : 3 A_bb : 3 aaB_ : 1 aabb. Only valid if genes on different chromosomes (independent assortment). Modified ratios arise from: epistasis, linkage, lethal alleles, multiple alleles, incomplete dominance, co-dominance.</p>'},
  {lb:'Incomplete and co-dominance',dr:dQ2,ht:'<p><b>Incomplete dominance:</b> heterozygote has intermediate phenotype. Example: snapdragon (red R\u00b9R\u00b9 \u00d7 white R\u00b2R\u00b2 \u2192 pink R\u00b9R\u00b2); ratio 1:2:1 (red:pink:white). <b>Co-dominance:</b> both alleles fully expressed in heterozygote. Example: ABO blood groups (I\u1d2aI\u1d2c = AB; both A and B antigens present). Sickle cell trait: HbA/HbS (both Hb types present in RBCs).</p>'},
  {lb:'Epistasis',dr:dQ2,ht:'<p>Epistasis: one gene masks the effect of another. Types: (1) Recessive epistasis (9:3:4 ratio): aa masks all B alleles. (2) Dominant epistasis (12:3:1): A_ masks bb and B_. (3) Duplicate dominant (15:1): A_ or B_ gives same phenotype. (4) Complementary (9:7): need at least one dominant allele at each locus. Example: coat colour in Labrador dogs (B gene for colour; E gene for expression). Always identify which locus is epistatic to which.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var crosses=[{desc:'AaBb\u00d7AaBb',n:16,ratio:'9:3:3:1',AB:9,Ab:3,aB:3,ab:1},{desc:'Aa\u00d7Aa',n:4,ratio:'3:1',dom:3,rec:1},{desc:'AaBb\u00d7aabb (testcross)',n:4,ratio:'1:1:1:1',AB:1,Ab:1,aB:1,ab:1}];var cr=pick(crosses);if(cr.ratio==='3:1'){return{question:cr.desc+'. Out of 4 offspring, how many show the DOMINANT phenotype?',hints:['Aa\u00d7Aa: 1AA:2Aa:1aa; 3 show dominant'],ans:cr.dom,tol:0,unit:'',working:'AA+Aa: 3 out of 4 show dominant. Answer: 3'};}if(cr.ratio==='9:3:3:1'){return{question:cr.desc+'. Out of 16 offspring, how many are expected to be A_B_ (both dominant)?',hints:['9:3:3:1 ratio; A_B_ = 9'],ans:cr.AB,tol:0,unit:'',working:'Expected A_B_ = 9 out of 16. Answer: 9'};}return{question:cr.desc+'. Out of 4 offspring, how many are AaBb (double heterozygote)?',hints:['Testcross AaBb\u00d7aabb: AaBb:Aabb:aaBb:aabb = 1:1:1:1'],ans:1,tol:0,unit:'',working:'Testcross: 1 of each combination. AaBb = 1 out of 4. Answer: 1'};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Genetics',ti:'Gene Linkage and Chromosome Mapping',su:'Explain gene linkage. Calculate recombination frequencies and map distances.',steps:[
  {lb:'Linkage',dr:dQ3,ht:'<p>Genes on the same chromosome tend to be inherited together (linked). They do NOT show independent assortment. In a dihybrid cross of linked genes, you get predominantly parental combinations (AB and ab) rather than the 9:3:3:1 expected. Evidence: Morgan (1910) with Drosophila body colour and wing type genes on same chromosome.</p>'},
  {lb:'Crossing over and recombinants',dr:dQ3,ht:'<p>During meiosis I, crossing over between homologues at chiasmata can break linkage. Recombinant offspring: new combinations not seen in parents. Recombination frequency (RF) = (recombinant offspring / total offspring) \u00d7 100%. If RF < 50%: genes are linked. RF = 50%: genes assort independently (on different chromosomes or very far apart).</p>'},
  {lb:'Chromosome mapping',dr:dQ3,ht:'<p>RF (%) = map distance in centimorgans (cM) = map units (mu). 1 cM = 1% recombination. Genes close together \u2192 low RF \u2192 rarely separated by crossing over. Genes far apart \u2192 higher RF \u2192 more crossing over. Can construct chromosome maps by comparing RF values of multiple pairs. Limitation: RF cannot exceed 50% (appears unlinked even if same chromosome).</p>'},
  {lb:'Three-point crosses',dr:dQ3,ht:'<p>Three genes studied simultaneously to determine order and distances on chromosome. Rarest recombinants = double crossovers; these identify the middle gene. RF of flanking genes slightly underestimates true distance (double crossovers cancel out). Coefficient of coincidence: actual double crossover freq / expected. Interference = 1 \u2212 CoC; positive interference = crossover in one region reduces probability in adjacent region.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var total=rnd(200,600),rf_pct=rnd(5,35);var recomb=Math.round(total*rf_pct/100);var type=pick(['find_rf','find_recomb','map_dist']);if(type==='find_rf')return{question:'Total offspring = <b>'+total+'</b>. Recombinant offspring = <b>'+recomb+'</b>. Recombination frequency (%)?',hints:['RF(%) = (recombinants/total)\u00d7100'],ans:rf_pct,tol:1,unit:'%',working:'RF = '+recomb+'/'+total+'\u00d7100 = '+rf_pct+'%'};if(type==='find_recomb')return{question:'Total = <b>'+total+'</b>, RF = <b>'+rf_pct+'%</b>. Number of recombinant offspring?',hints:['recombinants = total \u00d7 RF/100'],ans:recomb,tol:0,unit:'',working:'recombinants = '+total+'\u00d7'+rf_pct+'/100 = '+recomb};return{question:'RF between gene A and B = <b>'+rf_pct+'%</b>. Map distance?',hints:['1% RF = 1 cM (centimorgan)'],ans:rf_pct,tol:0,unit:'cM',working:rf_pct+'% RF = '+rf_pct+' cM map distance'};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Genetics',ti:'Mutations',su:'Describe point mutations, frameshift mutations and chromosomal aberrations.',steps:[
  {lb:'Point mutations',dr:dQ4,ht:'<p>Point mutations: change in one or a few nucleotides. <b>Substitution:</b> one base replaced by another. Effects: (1) <b>Silent</b> (synonymous): same amino acid (genetic code degenerate); (2) <b>Missense</b>: different amino acid; may alter protein function; (3) <b>Nonsense</b>: premature stop codon; truncated protein. Example: sickle cell anaemia \u2014 GAG \u2192 GTG (Glu \u2192 Val) in \u03b2-globin.</p>'},
  {lb:'Frameshift mutations',dr:dQ4,ht:'<p><b>Insertion or deletion:</b> adds or removes nucleotide(s). Shifts reading frame for all downstream codons \u2192 completely different amino acids after mutation site; usually nonsense stop codon encountered soon \u2192 non-functional protein. Exception: insertion/deletion of 3 (or multiples of 3) nucleotides \u2192 adds/removes amino acid without frameshifting. Example: cystic fibrosis most common mutation (deltaF508): 3 nucleotide deletion \u2192 CFTR protein missing one Phe \u2192 misfolds.</p>'},
  {lb:'Chromosomal mutations',dr:dQ4,ht:'<p>Affect large chromosome segments. <b>Deletion:</b> segment lost; genes lost. <b>Duplication:</b> segment repeated; extra gene copies (can lead to evolution of new genes). <b>Inversion:</b> segment flipped; may disrupt gene, create new fusion gene. <b>Translocation:</b> segment to different chromosome; Philadelphia chromosome (t(9;22): BCR-ABL fusion oncogene \u2192 CML leukaemia). <b>Non-disjunction:</b> failure of chromosomes to separate \u2192 aneuploidy.</p>'},
  {lb:'Aneuploidy and chromosomal abnormalities',dr:dQ4,ht:'<p>Non-disjunction in meiosis: gametes with n+1 or n-1 chromosomes. <b>Trisomy 21</b> (Down syndrome): extra chromosome 21; intellectual disability, heart defects, distinctive features. <b>Klinefelter</b> (47,XXY): male; infertile; gynecomastia. <b>Turner syndrome</b> (45,X): female; short stature; infertile; no secondary sex characteristics. <b>Cri du chat</b>: deletion chromosome 5p; high-pitched cry, intellectual disability. Prenatal diagnosis: amniocentesis, CVS, karyotyping.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'A nonsense mutation creates a premature stop codon. This results in: 1=a longer protein with extra function, 2=a truncated (shorter) non-functional protein.',a:2,w:'Nonsense: stop codon mid-sequence \u2192 translation terminates early \u2192 truncated protein; usually non-functional. Answer: 2.'},{q:'Down syndrome (trisomy 21) is caused by: 1=a point mutation in chromosome 21, 2=non-disjunction during meiosis resulting in a gamete with two copies of chromosome 21.',a:2,w:'Non-disjunction: both chromosome 21s go to one cell \u2192 gamete with 2 copies \u2192 after fertilisation: 47 chromosomes (trisomy 21). Answer: 2.'},{q:'The sickle cell mutation (GAG\u2192GTG) is a: 1=frameshift mutation, 2=missense point mutation causing a single amino acid change.',a:2,w:'Substitution: one base changed (A\u2192T); codon changes (Glu\u2192Val); single amino acid change = missense. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Nonsense: truncated protein. Non-disjunction: extra chromosome. Missense: amino acid changed.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Genetics',ti:'Sex Determination and Sex-linked Inheritance',su:'Explain sex determination and solve sex-linked inheritance problems.',steps:[
  {lb:'Sex determination',dr:dQ5,ht:'<p>Human sex chromosomes: XX (female), XY (male). SRY gene on Y chromosome triggers male development. Meiosis: females produce X eggs; males produce X or Y sperm. Sex of offspring determined by sperm (50% chance each sex). <b>Karyotype:</b> photograph of chromosomes arranged in pairs; sex chromosomes plus 22 pairs of autosomes. Sex determination varies by species: ZW/ZZ (birds), XO (grasshoppers), environmental (crocodiles, some turtles).</p>'},
  {lb:'X-linked inheritance',dr:dQ5,ht:'<p>Genes on X chromosome: only one copy in males (hemizygous) \u2192 single recessive allele causes condition. Females: carrier possible (X\u1d2cX, normal phenotype). X-linked recessive conditions: colour blindness (~8% males, ~0.64% females), haemophilia A and B, Duchenne muscular dystrophy, Lesch-Nyhan syndrome, G6PD deficiency (common in malaria regions). X-linked dominant: hypophosphataemia (vitamin D-resistant rickets).</p>'},
  {lb:'Haemophilia as a case study',dr:dQ5,ht:'<p>Haemophilia A: deficiency of clotting factor VIII; X-linked recessive. Queen Victoria was a carrier \u2192 passed to sons (Leopold: haemophilia) and daughters (Beatrice, Alice: carriers) \u2192 spread to European royal families. Treatment: factor VIII concentrate (recombinant). Pedigree analysis: males affected, females carriers; no male-to-male transmission (sons get Y from father).</p>'},
  {lb:'Y-linked and autosomal crosses',dr:dQ5,ht:'<p>Y-linked (holandric) traits: only males; passed from father to ALL sons; e.g. hairy ear pinna. Key distinction: X-linked recessive vs autosomal recessive in pedigree \u2014 X-linked: more males affected; no father-to-son transmission. Autosomal recessive: equal sex ratio. <b>Calculating carrier probability</b> in pedigrees: identify obligate carriers (e.g. mother with affected son). Use Bayesian probability for genetic counselling.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'A colour-blind man (X\u1d2cY) mates with a carrier woman (X\u1d2cX). Probability of a colour-blind SON?',hints:['Sons: XY or X\u1d2cY. X\u1d2cY from X\u1d2c egg + Y sperm'],ans:2,w:'Sons receive Y from father; X from mother. Mother X\u1d2cX gives X or X\u1d2c equally. P(colour-blind son) = 1/2 of sons = 1/4 of all children. Answer: 1 in 2 sons (50%). Select: 1=25% of all children, 2=50% of sons.',extra:1},{q:'X-linked conditions affect more males because: 1=males have two X chromosomes, 2=males (XY) have only one X chromosome; a single recessive allele causes the condition.',a:2,w:'Males: hemizygous (one X); any recessive allele on X is expressed. Females: need two copies. Answer: 2.'},{q:'In an X-linked recessive pedigree, which pattern is NOT expected? 1=affected fathers always have carrier daughters, 2=affected fathers pass condition directly to their sons.',a:2,w:'X-linked: sons receive Y from father (not X); cannot get X-linked condition from father. Daughters get X \u2192 become carriers. Answer: 2.'}];var qq=pick(qs);if(qq.extra){return{question:'Colour-blind man (X\u1d2cY) \u00d7 carrier woman (X\u1d2cX). Proportion of sons who are colour-blind?',hints:['Sons get Y from dad; X (either) from mum. Mother gives X or X\u1d2c equally.'],ans:1,tol:0,unit:'(= 50%)',working:'Sons: XY (normal) or X\u1d2cY (colour-blind) in 1:1 ratio. 50% of sons colour-blind. Answer: 1 (50% = 1/2)'};}return{question:qq.q,hints:['X-linked: males hemizygous; one X; single allele expressed.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Genetics',ti:'Quantitative Genetics and Polygenic Traits',su:'Describe polygenic inheritance. Explain the role of environment in phenotype.',steps:[
  {lb:'Polygenic inheritance',dr:dQ6,ht:'<p>Polygenic traits: controlled by multiple genes (each with two or more alleles), each contributing small additive effects. Results in continuous variation (normal distribution). Examples: human height, skin colour, intelligence, mass. Each gene locus contributes equally; dominant alleles add to the phenotype; more dominant alleles \u2192 more extreme phenotype. Statistical analysis: mean, variance, heritability.</p>'},
  {lb:'Heritability',dr:dQ6,ht:'<p><b>Heritability (h\u00b2):</b> proportion of phenotypic variance due to genetic variance in a population. h\u00b2 = V_G / V_P (genetic variance / total phenotypic variance). Ranges 0\u20131. High heritability does NOT mean genetics determines phenotype; it means most variation in that population is due to genetic differences. Changes with environment (e.g. heritability of height is ~0.8 in well-nourished populations, lower where nutrition varies widely).</p>'},
  {lb:'Gene-environment interaction',dr:dQ6,ht:'<p>Phenotype = genotype \u00d7 environment interaction. Same genotype \u2192 different phenotypes in different environments (phenotypic plasticity). Examples: Himalayan rabbits (fur colour temperature-dependent \u2014 cool extremities dark, warm body pale); identical twins (same genotype, different environments \u2192 different phenotypes). PKU (phenylketonuria): genotype (PKUaa) \u2192 phenotype severity determined by dietary phenylalanine.</p>'},
  {lb:'Quantitative genetics and breeding',dr:dQ6,ht:'<p>Quantitative genetics: essential for crop and livestock improvement. Response to selection (R) = h\u00b2 \u00d7 S (selection differential: difference between selected parents and population mean). High heritability: rapid response to selection; low heritability: slow response. BLUP (best linear unbiased prediction): statistical method estimating breeding values from performance records of relatives. Used to select bulls for AI in dairy industry.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var h2=rnd(3,8)*0.1,S=rnd(5,20);var R=parseFloat((h2*S).toFixed(2));var type=pick(['response','h2','S_from_R']);if(type==='response')return{question:'h\u00b2 = <b>'+h2+'</b>, Selection differential S = <b>'+S+'</b>. Response to selection (R)?',hints:['R = h\u00b2 \u00d7 S'],ans:R,tol:R*0.05,unit:'',working:'R = '+h2+'\u00d7'+S+' = '+R};if(type==='h2'){var R2=parseFloat((h2*S).toFixed(2));return{question:'R = <b>'+R2+'</b>, S = <b>'+S+'</b>. Find heritability (h\u00b2).',hints:['h\u00b2 = R/S'],ans:h2,tol:0.01,unit:'',working:'h\u00b2 = '+R2+'/'+S+' = '+h2};}var R3=parseFloat((h2*S).toFixed(2));return{question:'R = <b>'+R3+'</b>, h\u00b2 = <b>'+h2+'</b>. Selection differential S?',hints:['S = R/h\u00b2'],ans:S,tol:0,unit:'',working:'S = '+R3+'/'+h2+' = '+S};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Genetics',ti:'Epigenetics',su:'Describe epigenetic mechanisms and their significance.',steps:[
  {lb:'What is epigenetics?',dr:dQ7,ht:'<p>Epigenetics: heritable changes in gene expression that do not involve changes to DNA sequence. Mechanisms: (1) DNA methylation: methyl groups added to cytosine (often in CpG islands near promoters); methylated genes \u2192 silenced (e.g. X-chromosome inactivation, imprinting). (2) Histone modification: acetylation, methylation, phosphorylation of histone tails; acetylation \u2192 loosens chromatin \u2192 gene expressed; deacetylation \u2192 condenses chromatin \u2192 gene silenced.</p>'},
  {lb:'X-inactivation and imprinting',dr:dQ7,ht:'<p><b>X-inactivation:</b> in female mammals, one X chromosome randomly inactivated in each cell early in development (forms Barr body). Mosaic expression: calico cats (orange/black patches = different X active in each cell). <b>Genomic imprinting:</b> certain genes expressed only from maternal or paternal copy (allele-specific methylation). Prader-Willi: paternal chromosome 15 deletion (or maternal copy imprinted); Angelman: maternal deletion (or paternal copy imprinted). Different diseases from same deletion depending on parent of origin.</p>'},
  {lb:'Environmental effects on epigenome',dr:dQ7,ht:'<p>Environment can alter epigenetic marks: diet (folate, methionine \u2192 methyl donors), stress, toxins (BPA, smoking), age (epigenetic clock). Dutch Hunger Winter (1944\u201345): children conceived during famine had increased risk of obesity, diabetes, schizophrenia in adulthood (altered methylation). Some epigenetic changes may be inherited transgenerationally. Epigenetics links environment to gene expression.</p>'},
  {lb:'Epigenetics in cancer and medicine',dr:dQ7,ht:'<p>Cancer: epigenetic silencing of tumour suppressor genes (e.g. BRCA1 hypermethylation); global hypomethylation (genomic instability). Epigenetic drugs: HDAC inhibitors (vorinostat, romidepsin): reactivate silenced genes in cancer. DNA methyltransferase inhibitors (azacitidine): used in myelodysplastic syndrome. Epigenetic biomarkers: cancer detection from methylation patterns in cell-free DNA. WAEC: distinguish genetic from epigenetic change.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'X-inactivation in female mammals means: 1=all X-linked genes are deleted, 2=one X chromosome is randomly inactivated per cell (forming a Barr body), resulting in mosaic expression.',a:2,w:'X-inactivation: one X condensed (Barr body); genes on it not expressed; explains calico cat coat patterns. Answer: 2.'},{q:'Epigenetic changes differ from mutations because: 1=they change the DNA sequence, 2=they alter gene expression without changing the DNA base sequence (reversible modifications to DNA/histones).',a:2,w:'Epigenetics: methylation, acetylation etc. alter expression; DNA sequence unchanged; potentially reversible. Answer: 2.'},{q:'Histone acetylation leads to: 1=chromatin condensation and gene silencing, 2=chromatin relaxation and increased gene expression.',a:2,w:'Acetylation neutralises positive charge on histones \u2192 DNA-histone interaction weakens \u2192 chromatin opens \u2192 transcription factors can access promoter. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['X-inactivation: one X = Barr body. Epigenetics: expression changed, not sequence. Acetylation: open chromatin.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Genetics',ti:'Gene Cloning and Sequencing',su:'Describe PCR, gel electrophoresis and DNA sequencing.',steps:[
  {lb:'PCR (Polymerase Chain Reaction)',dr:dQ8,ht:'<p>PCR amplifies specific DNA segments. Three steps per cycle: (1) Denaturation: 94\u201395\u00b0C; H-bonds break; DNA strands separate. (2) Annealing: 50\u201365\u00b0C; specific primers bind to target sequence. (3) Extension: 72\u00b0C; Taq polymerase synthesises new strand from primers. Exponential amplification: 30 cycles \u2192 2\u00b3\u2070 = ~10\u2079 copies. Uses: forensics, diagnosis, research, ancient DNA, COVID-19 RT-PCR testing.</p>'},
  {lb:'Gel electrophoresis',dr:dQ8,ht:'<p>Separates DNA/RNA/protein by size. DNA samples loaded into wells; electric current applied (DNA negatively charged \u2192 moves toward positive electrode); smaller fragments travel further through agarose gel. Bands visualised with ethidium bromide or SYBR Green under UV light. Molecular weight ladder (DNA ladder) used to estimate fragment sizes. Used in: RFLP analysis, DNA fingerprinting, Southern blotting, diagnostic testing.</p>'},
  {lb:'DNA sequencing',dr:dQ8,ht:'<p>Sanger sequencing (chain termination): uses ddNTPs (dideoxynucleotides) with fluorescent labels; synthesis stops at each ddNTP; fragments separated by electrophoresis; sequence read from size-ordered fragments. Now largely replaced by next-generation sequencing (NGS): massively parallel; sequence millions of fragments simultaneously; used for whole genome sequencing (~$100 per genome now). Bioinformatics: computer analysis of sequence data.</p>'},
  {lb:'Applications: forensics and genomics',dr:dQ8,ht:'<p>DNA profiling (fingerprinting): PCR amplifies STRs (short tandem repeats) at multiple loci; unique pattern for each individual (except identical twins); probability of two people matching ~1 in 10\u00b9\u00b3. Used in: crime investigation, paternity testing, disaster victim identification. Human genome project (2003): 3.2 billion bp sequenced; ~20,000-25,000 protein-coding genes; only ~1.5% of genome codes for protein; ENCODE project: functional elements in non-coding DNA.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var cycles=rnd(20,35);var copies=Math.pow(2,cycles);return{question:'PCR: starting with 1 DNA molecule. After <b>'+cycles+'</b> cycles, how many copies? (answer as power: 2^n \u2014 enter n only)',hints:['Each cycle doubles the DNA: 2^cycles','Enter the exponent (cycles) as the answer'],ans:cycles,tol:0,unit:'(2^n copies)',working:'2^'+cycles+' = '+copies.toLocaleString()+' copies. Enter n = '+cycles+'.'};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Genetics',ti:'Genomics and Proteomics',su:'Describe the human genome project. Explain proteomics and its applications.',steps:[
  {lb:'The genome and genomics',dr:dQ9,ht:'<p>Genome: complete DNA sequence of an organism. Human genome: ~3.2 billion base pairs; ~20,000-25,000 protein-coding genes; only ~1.5% codes for protein. Remainder: introns, regulatory sequences, transposable elements, repetitive sequences, pseudogenes. HGP (1990\u20132003): international collaboration; reference human genome sequence. Now: 1000 Genomes Project, UK Biobank, ENCODE (functional non-coding DNA).</p>'},
  {lb:'Pharmacogenomics and personalised medicine',dr:dQ9,ht:'<p><b>Pharmacogenomics:</b> how genetic variation affects drug response. Examples: CYP2D6 variants affect codeine metabolism (poor vs ultra-rapid metabolisers); HLA-B*5701 allele \u2192 hypersensitivity to abacavir (HIV drug) \u2014 tested before prescribing; warfarin dosing guided by CYP2C9 and VKORC1 genotype. Personalised medicine: tailor treatment to individual\u2019s genetic profile. Reduces adverse drug reactions.</p>'},
  {lb:'Proteomics',dr:dQ9,ht:'<p>Proteome: complete set of proteins expressed by a cell/organism at a given time. More complex than genome (one gene can produce many proteins via alternative splicing, post-translational modification). Techniques: 2D gel electrophoresis (separate by isoelectric point and size), mass spectrometry (identify proteins), protein microarrays. Applications: identify disease biomarkers, drug targets, understand cell signalling.</p>'},
  {lb:'Bioinformatics',dr:dQ9,ht:'<p>Bioinformatics: computational analysis of biological data. Tools: BLAST (compare DNA/protein sequences); GenBank/EMBL (sequence databases); protein structure prediction (AlphaFold); phylogenetic analysis software; GWAS (genome-wide association studies: find SNPs associated with disease). Key insight: 1% sequence difference between humans and chimps = ~30 million nucleotide differences; most in non-coding regulatory regions.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'Pharmacogenomics uses genetic information to: 1=develop new vaccines, 2=tailor drug choice and dosage to individual genetic variation in drug metabolism.',a:2,w:'Pharmacogenomics: genetic variants affect drug metabolism; personalised dosing reduces toxicity and improves efficacy. Answer: 2.'},{q:'Proteomics is more complex than genomics because: 1=the proteome changes with cell type, environment and time, while the genome is fixed in all cells, 2=proteins are smaller than DNA.',a:1,w:'Proteome: varies by cell type, conditions, time (dynamic). Genome: same in all cells (static). Answer: 1.'},{q:'GWAS (genome-wide association studies) are used to: 1=sequence entire genomes, 2=identify genetic variants (SNPs) associated with particular diseases in large populations.',a:2,w:'GWAS: compare SNP frequencies between affected and unaffected individuals; find disease-associated variants. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Pharmacogenomics: personalised medicine. Proteome: dynamic, varies. GWAS: SNPs linked to disease.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Genetics',ti:'Mixed Genetics Questions',su:'Integrated questions across all Y12-GEN-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Transcription: DNA\u2192mRNA (nucleus). Translation: mRNA\u2192protein (ribosome). Dihybrid: 9:3:3:1. Linkage: RF=recombinants/total\u00d7100%. Frameshift: insertion/deletion. H-W: p+q=1; p\u00b2+2pq+q\u00b2=1. Epigenetics: methylation, acetylation alter expression.</p>'},
  {lb:'WAEC integration: genetics in medicine',dr:dQ10,ht:'<p>WAEC often tests genetics in medical context: sickle cell (codominance, point mutation, natural selection, malaria protection); cystic fibrosis (autosomal recessive, frameshift, H-W carrier frequency); haemophilia (X-linked, pedigree analysis); Down syndrome (non-disjunction, trisomy 21); genetic counselling (risk calculation, pedigree analysis).</p>'},
  {lb:'WAEC essay technique: genetics',dr:dQ10,ht:'<p>For genetics essays: define all terms clearly; draw Punnett squares when asked; show gametes above/beside grid; state genotype AND phenotype ratios; explain expected ratios for linkage (deviates from 9:3:3:1); for H-W: always show formula, substitutions and calculation steps; for pedigrees: identify affected, obligate carriers, possible carriers; state probabilities as fractions or percentages.</p>'},
  {lb:'Calculations: linkage and H-W',dr:dQ10,ht:'<div class="fm">RF(%) = (recombinant offspring / total offspring) \u00d7 100</div><div class="fm">p + q = 1 &nbsp; p\u00b2 + 2pq + q\u00b2 = 1</div><div class="fm">Start with q\u00b2 (recessive phenotype frequency)</div>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['hw','linkage','mutation']);if(type==='hw'){var q2=pick([0.01,0.04,0.09,0.0025]);var q=parseFloat(Math.sqrt(q2).toFixed(4));var p=parseFloat((1-q).toFixed(4));var carrier=parseFloat((2*p*q).toFixed(4));return{question:'Disorder freq (q\u00b2) = <b>'+q2+'</b>. Carrier frequency (2pq)?',hints:['q=\u221a(q\u00b2); p=1\u2212q; 2pq=carrier'],ans:carrier,tol:0.003,unit:'',working:'q='+q+', p='+p+', 2pq='+carrier};}if(type==='linkage'){var total=rnd(200,500),rf=rnd(8,30);var recomb=Math.round(total*rf/100);return{question:'Total=<b>'+total+'</b>, recombinants=<b>'+recomb+'</b>. RF(%)?',hints:['RF=recombinants/total\u00d7100'],ans:rf,tol:1,unit:'%',working:'RF='+recomb+'/'+total+'\u00d7100='+rf+'%'};}return{question:'A deletion of 2 nucleotides in a coding sequence causes: 1=a silent mutation, 2=a frameshift altering all downstream codons.',hints:['2 nucleotides: not multiple of 3 \u2192 frameshift'],ans:2,tol:0,unit:'',working:'Deletion of 2 nt: not multiple of 3 \u2192 shifts reading frame \u2192 all downstream codons changed. Answer: 2.'};})},
]},
];

var qi=0,si=0;
