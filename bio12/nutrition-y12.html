<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}

if(p>=4){o.push(R(10,206,460,40,'#C8E6C9','#2E7D32',1));o.push(T(240,226,'Products passed to stroma for Calvin cycle. O\u2082 = by-product of photolysis','#555',9,'middle',false));}

if(p>=2){o.push(R(10,90,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,104,'GP \u2192 G3P (triose phosphate): uses ATP + NADPH from light reactions','#333',10,'middle',false));o.push(T(240,122,'G3P = 3-carbon sugar; building block for glucose, starch, amino acids, lipids','#555',8,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,156,'5/6 G3P \u2192 RuBP regeneration (uses ATP)','#333',10,'middle',false));o.push(T(240,174,'1/6 G3P \u2192 products (glucose, sucrose, starch, cellulose, amino acids, lipids)','#555',8,'middle',false));}
if(p>=4){o.push(R(10,194,460,54,'#C8E6C9','#2E7D32',1));o.push(T(240,212,'3 CO\u2082 fixed per cycle \u2192 6 ATP + 6 NADPH used','#2E7D32',9,'middle',true));o.push(T(240,228,'Limiting factors: low CO\u2082 stops Calvin cycle; low light stops ATP/NADPH supply','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Mineral nutrition in plants','#2E7D32',12,'middle',true));
[['Nitrate (NO\u2083\u207b)','synthesis of amino acids, proteins, nucleic acids; deficiency \u2192 yellowing (chlorosis)'],['Phosphate (PO\u2084\u00b3\u207b)','DNA, RNA, ATP, phospholipids; deficiency \u2192 purple leaves, poor root growth'],['Magnesium (Mg\u00b2\u207a)','chlorophyll synthesis; deficiency \u2192 interveinal chlorosis (yellowing between veins)'],['Potassium (K\u207a)','enzyme cofactor; stomatal opening (guard cells); deficiency \u2192 brown leaf edges'],['Calcium (Ca\u00b2\u207a)','cell wall (middle lamella); membrane stability; deficiency \u2192 distorted young leaves'],['Iron (Fe)','haem groups in cytochromes; chlorophyll; deficiency \u2192 interveinal chlorosis']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*34,460,28,'#F1F8F1','#C8E6C9',1));o.push(T(100,56+i*34,r[0],'#2E7D32',9,'middle',true));o.push(T(310,56+i*34,r[1],'#555',8,'middle',false));}});

s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Nutrition',ti:'Overview of Photosynthesis',su:'State the overall equation and describe the two stages of photosynthesis.',steps:[
  {lb:'Overall equation',dr:dQ1,ht:'<p>Photosynthesis converts light energy into chemical energy (glucose).</p><div class="fm">6CO\u2082 + 6H\u2082O \u2192 C\u2086H\u2081\u2082O\u2086 + 6O\u2082</div><p>Occurs in chloroplasts. Two stages: (1) Light-dependent reactions (thylakoid membranes), (2) Light-independent reactions/Calvin cycle (stroma).</p>'},
  {lb:'Two stages overview',dr:dQ1,ht:'<p><b>Stage 1 — Light-dependent:</b> uses light energy; produces ATP, NADPH; splits water (photolysis) releasing O\u2082. <b>Stage 2 — Calvin cycle (light-independent):</b> uses ATP + NADPH from stage 1; fixes CO\u2082 into organic molecules (G3P \u2192 glucose, starch, etc.). Stage 2 requires the products of stage 1 but not light directly.</p>'},
  {lb:'Chloroplast structure and function',dr:dQ1,ht:'<p>Chloroplast: double membrane; intermembrane space; inner membrane (import of molecules); <b>thylakoids</b>: stacked into grana (interconnected by lamellae); contain photosystems and electron carriers; site of light-dependent reactions. <b>Stroma:</b> fluid-filled space; contains enzymes for Calvin cycle, circular DNA, 70S ribosomes (evidence for endosymbiosis).</p>'},
  {lb:'Pigments and absorption spectrum',dr:dQ1,ht:'<p><b>Chlorophyll a</b> (primary pigment): absorbs red (680 nm) and blue-violet (430 nm); reflects green. <b>Chlorophyll b:</b> broader range. <b>Carotenoids</b> (carotene, xanthophyll): absorb blue-green; extend range; protect from photo-oxidation. Chromatography separates pigments; R\u1d0d values identify each. Action spectrum (photosynthesis rate vs wavelength) matches absorption spectrum of chlorophylls.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'In photosynthesis, where does the Calvin cycle occur? 1=thylakoid membranes, 2=stroma of chloroplast.',a:2,w:'Calvin cycle: stroma (enzymes dissolved in fluid). Light-dependent: thylakoid membranes. Answer: 2.'},{q:'Oxygen produced in photosynthesis comes from: 1=CO\u2082, 2=water (photolysis of H\u2082O).',a:2,w:'Photolysis: 2H\u2082O \u2192 4H\u207a + 4e\u207b + O\u2082. O\u2082 comes from water, not CO\u2082. Answer: 2.'},{q:'Why do chlorophyll pigments appear green? 1=they absorb green light, 2=they reflect green light and absorb red and blue.',a:2,w:'Chlorophylls absorb red + blue; reflect green \u2192 leaves appear green. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Calvin cycle: stroma. O\u2082 from photolysis. Green reflected.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Nutrition',ti:'Light-Dependent Reactions',su:'Describe the light-dependent reactions in detail including photolysis and photophosphorylation.',steps:[
  {lb:'Photosystems and light absorption',dr:dQ2,ht:'<p><b>Photosystem II (P680):</b> absorbs light at 680 nm; chlorophyll excited \u2192 high-energy electrons released; simultaneously water is split (photolysis): 2H\u2082O \u2192 4H\u207a + 4e\u207b + O\u2082. O\u2082 diffuses out. <b>Photosystem I (P700):</b> absorbs 700 nm; electrons re-energised; passed to NADP reductase; reduces NADP\u207a + H\u207a \u2192 NADPH.</p>'},
  {lb:'Electron transport chain',dr:dQ2,ht:'<p>Electrons from PS II pass along a chain of electron carriers (plastoquinone, cytochrome b6f complex, plastocyanin) in the thylakoid membrane. Energy released pumps H\u207a from stroma into thylakoid lumen \u2192 concentration gradient \u2192 H\u207a flow back through ATP synthase (chemiosmosis) \u2192 ATP produced (photophosphorylation).</p>'},
  {lb:'Non-cyclic and cyclic photophosphorylation',dr:dQ2,ht:'<p><b>Non-cyclic:</b> electrons flow from PS II \u2192 ETC \u2192 PS I \u2192 NADPH; net products: ATP + NADPH + O\u2082. <b>Cyclic:</b> electrons from PS I cycle back via ETC to PS I; only ATP produced; no NADPH, no O\u2082. Occurs when NADPH is plentiful but ATP is needed.</p>'},
  {lb:'Products passed to Calvin cycle',dr:dQ2,ht:'<p>The light-dependent reactions supply the Calvin cycle with: <b>ATP</b> (for phosphorylation reactions) and <b>NADPH</b> (as reducing agent). These are consumed in the stroma. If light is removed, ATP and NADPH stop being produced \u2192 Calvin cycle slows \u2192 CO\u2082 fixation stops. The H\u207a from photolysis ultimately become incorporated into NADPH and then into organic molecules.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'ATP is produced in the light-dependent reactions by: 1=substrate-level phosphorylation, 2=photophosphorylation (chemiosmosis via ATP synthase in thylakoid membrane).',a:2,w:'Photophosphorylation: H\u207a gradient across thylakoid membrane \u2192 ATP synthase. Answer: 2.'},{q:'In cyclic photophosphorylation, the product(s) are: 1=ATP only (no NADPH, no O\u2082), 2=ATP + NADPH + O\u2082.',a:1,w:'Cyclic: electrons cycle back to PS I; only ATP produced. Answer: 1.'},{q:'Photolysis of water produces: 1=CO\u2082 + H\u2082, 2=O\u2082 + H\u207a + electrons.',a:2,w:'2H\u2082O \u2192 O\u2082 + 4H\u207a + 4e\u207b. O\u2082 released, H\u207a and electrons used in ETC. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Photophosphorylation: chemiosmosis. Cyclic: ATP only. Photolysis: H\u2082O\u2192O\u2082+H\u207a+e\u207b.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Nutrition',ti:'The Calvin Cycle',su:'Describe the reactions of the Calvin cycle. Explain the role of RuBisCO.',steps:[
  {lb:'Carbon fixation',dr:dQ3,ht:'<p>CO\u2082 combines with ribulose bisphosphate (<b>RuBP</b>, 5C) catalysed by <b>RuBisCO</b> (ribulose bisphosphate carboxylase/oxygenase). The unstable 6C compound immediately splits into two molecules of <b>glycerate-3-phosphate (GP)</b>, also called 3-phosphoglycerate (3-PGA). This is CO\u2082 fixation \u2014 inorganic C incorporated into organic molecule.</p>'},
  {lb:'Reduction of GP to G3P',dr:dQ3,ht:'<p>GP (3C) is reduced to <b>glyceraldehyde-3-phosphate (G3P)</b>, also called triose phosphate (TP). This uses <b>ATP</b> (phosphorylation) and <b>NADPH</b> (reduction) from the light-dependent reactions. G3P is the first stable product; a 3-carbon sugar phosphate that can be used to build many organic molecules.</p>'},
  {lb:'Regeneration of RuBP',dr:dQ3,ht:'<p>5 out of every 6 G3P molecules are used to regenerate <b>RuBP</b> using ATP. This maintains the cycle. For every 3 CO\u2082 fixed: 6 ATP + 6 NADPH consumed for reduction; 3 ATP used for RuBP regeneration. 1 G3P exits the cycle to form products.</p>'},
  {lb:'Products of G3P',dr:dQ3,ht:'<p>G3P (triose phosphate) is the starting point for synthesis of: <b>glucose</b> (2 G3P joined, then various modifications); <b>sucrose</b> (transport form); <b>starch</b> and <b>cellulose</b>; <b>glycerol</b> and <b>fatty acids</b> (lipids); <b>amino acids</b> (with addition of nitrate-derived NH\u2082 groups); <b>nucleotides</b>. G3P is the link between photosynthesis and all biosynthesis.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'The enzyme that catalyses CO\u2082 fixation in the Calvin cycle is: 1=ATP synthase, 2=RuBisCO.',a:2,w:'RuBisCO: CO\u2082 + RuBP \u2192 2GP. Most abundant enzyme on Earth. Answer: 2.'},{q:'Reducing GP to G3P in the Calvin cycle requires: 1=only ATP, 2=both ATP and NADPH.',a:2,w:'GP \u2192 G3P: ATP (phosphorylation) + NADPH (reduction). Both from light-dependent reactions. Answer: 2.'},{q:'If light is suddenly removed, what happens to RuBP levels first? 1=RuBP levels increase (not consumed; CO\u2082 fixation stops but production continues briefly), 2=RuBP levels decrease immediately.',a:1,w:'No light \u2192 no ATP/NADPH \u2192 RuBP not consumed (CO\u2082 fixation stops) \u2192 RuBP builds up first. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['RuBisCO: CO\u2082 fixation. GP\u2192G3P: ATP+NADPH. No light: RuBP rises first.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Nutrition',ti:'Factors Affecting Photosynthesis',su:'Describe and explain limiting factors. Analyse graphs of photosynthesis rates.',steps:[
  {lb:'Limiting factors',dr:dQ4,ht:'<p>The rate of photosynthesis is limited by whichever factor is in shortest supply (Blackman\'s law of limiting factors, 1905). Three main limiting factors: <b>light intensity</b> (affects ATP/NADPH production), <b>CO\u2082 concentration</b> (affects Calvin cycle rate), <b>temperature</b> (affects enzyme-controlled reactions, especially Calvin cycle). Water deficiency causes stomata to close \u2192 less CO\u2082 entry.</p>'},
  {lb:'Light intensity',dr:dQ4,ht:'<p>At low light: photosynthesis rate \u221d light intensity (light is limiting). At high light: rate plateaus (CO\u2082 or temperature becomes limiting). Compensation point: light intensity where photosynthesis rate = respiration rate (net gas exchange = 0). Light saturation point: above this, more light has no effect.</p>'},
  {lb:'CO\u2082 concentration and temperature',dr:dQ4,ht:'<p><b>CO\u2082:</b> increasing [CO\u2082] increases photosynthesis rate up to a point (then light or temperature becomes limiting). In greenhouses, CO\u2082 enrichment (to ~0.1\u20130.2%) can double yields. <b>Temperature:</b> increases rate up to optimum (~25\u201330\u00b0C for C3 plants); above optimum, enzymes (especially RuBisCO) denature; stomata close to reduce water loss \u2192 less CO\u2082.</p>'},
  {lb:'Practical: measuring photosynthesis',dr:dQ4,ht:'<p>Methods: (1) O\u2082 evolution using oxygen electrode or gas syringe; (2) CO\u2082 uptake using infrared gas analyser; (3) counting O\u2082 bubbles in <em>Elodea</em>/aquatic plant (less accurate); (4) change in biomass (long term). Gross photosynthesis = net photosynthesis + respiration. Light compensation point = when net gas exchange = 0.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var net=rnd(5,20),resp=rnd(2,6);var gross=net+resp;return{question:'Net photosynthesis = <b>'+net+' mg CO\u2082/h</b>. Respiration = <b>'+resp+' mg CO\u2082/h</b>. Find gross photosynthesis.',hints:['Gross = Net + Respiration'],ans:gross,tol:0,unit:'mg CO\u2082/h',working:'Gross = '+net+' + '+resp+' = '+gross+' mg CO\u2082/h'};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Nutrition',ti:'Mineral Nutrition in Plants',su:'Describe roles of essential mineral ions. Identify deficiency symptoms.',steps:[
  {lb:'Nitrogen and phosphorus',dr:dQ5,ht:'<p><b>Nitrogen (as nitrate, NO\u2083\u207b):</b> essential for amino acid synthesis \u2192 proteins, enzymes, chlorophyll, nucleic acids. Deficiency: poor growth, chlorosis (yellowing) of older leaves first. <b>Phosphorus (as phosphate, PO\u2084\u00b3\u207b):</b> DNA, RNA, ATP, phospholipids. Deficiency: purple pigmentation (anthocyanins), poor root growth, dark green older leaves.</p>'},
  {lb:'Magnesium, potassium, calcium',dr:dQ5,ht:'<p><b>Magnesium (Mg\u00b2\u207a):</b> central atom of chlorophyll molecule; enzyme cofactor. Deficiency: interveinal chlorosis (leaves yellow between veins; veins remain green). <b>Potassium (K\u207a):</b> guard cell solute (stomatal opening); enzyme cofactor. Deficiency: brown/scorched leaf edges. <b>Calcium (Ca\u00b2\u207a):</b> middle lamella of cell wall; membrane stability; signal molecule. Deficiency: distorted young leaves, stunted growth.</p>'},
  {lb:'Uptake of mineral ions',dr:dQ5,ht:'<p>Minerals absorbed by root hair cells mainly by <b>active transport</b> (against concentration gradient; requires ATP). Transported to xylem via apoplast (cell wall pathway) and symplast (cytoplasm pathway); Casparian strip forces symplast route in endodermis. Mycorrhizal associations (fungi + roots) greatly increase absorption surface area.</p>'},
  {lb:'Nitrogen cycle relevance',dr:dQ5,ht:'<p>Plants cannot use N\u2082 directly; depend on nitrate (NO\u2083\u207b) or ammonium (NH\u2084\u207a) ions from soil. Nitrate assimilation: NO\u2083\u207b \u2192 NO\u2082\u207b (nitrate reductase) \u2192 NH\u2084\u207a \u2192 amino acids (via glutamine). Legumes: root nodules with <em>Rhizobium</em> fix N\u2082 \u2192 available to plant. WAEC: link nitrogen cycle to plant mineral nutrition.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Interveinal chlorosis (yellowing between leaf veins) indicates deficiency of: 1=nitrogen, 2=magnesium.',a:2,w:'Mg\u00b2\u207a: central atom of chlorophyll. Deficiency \u2192 chlorophyll breakdown in mesophyll (between veins); veins remain green. Answer: 2.'},{q:'Mineral ions are absorbed by root hairs mainly by: 1=osmosis, 2=active transport against the concentration gradient.',a:2,w:'Minerals: active transport (using ATP + carrier proteins) \u2192 against concentration gradient. Answer: 2.'},{q:'Nitrogen deficiency causes: 1=purple leaf pigmentation, 2=chlorosis (yellowing) of older leaves first.',a:2,w:'N deficiency: chlorosis of older leaves (mobile nutrient; moved from old to young). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Mg: chlorophyll (interveinal chlorosis). Minerals: active transport. N deficiency: yellowing.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Nutrition',ti:'Human Digestion — Enzymes and Absorption',su:'Describe the chemical digestion and absorption of food in humans.',steps:[
  {lb:'Digestive enzymes',dr:dQ6,ht:'<p><b>Carbohydrases:</b> salivary amylase (mouth; starch \u2192 maltose); pancreatic amylase (duodenum); maltase, sucrase, lactase (intestinal epithelium; disaccharides \u2192 monosaccharides). <b>Proteases:</b> pepsin (stomach, pH 2; proteins \u2192 polypeptides); trypsin + chymotrypsin (pancreas; duodenum); peptidases (intestinal walls; peptides \u2192 amino acids). <b>Lipases:</b> pancreatic lipase (triglycerides \u2192 fatty acids + glycerol); bile emulsifies fat (increases surface area).</p>'},
  {lb:'Absorption in the small intestine',dr:dQ6,ht:'<p>Ileum: highly adapted for absorption. <b>Villi</b>: fold of mucosa; each has microvilli (brush border) \u2192 vast surface area (~200 m\u00b2). Rich capillary network (glucose, amino acids \u2192 hepatic portal vein \u2192 liver). Lacteals (lymph vessels) absorb fatty acids + glycerol (reformed as triglycerides \u2192 chylomicrons \u2192 lymph). Glucose + amino acids: cotransport (Na\u207a/glucose carrier).</p>'},
  {lb:'Stomach and liver functions',dr:dQ6,ht:'<p><b>Stomach:</b> parietal cells secrete HCl (pH 2 \u2014 kills bacteria, denatures protein, activates pepsinogen \u2192 pepsin); chief cells secrete pepsinogen; goblet cells secrete mucus (protects stomach wall). <b>Liver:</b> produces bile (emulsifies fat, neutralises acid chyme); deaminates excess amino acids (NH\u2082 \u2192 urea); glycogen storage; detoxification; cholesterol synthesis; plasma proteins.</p>'},
  {lb:'Large intestine and deficiency diseases',dr:dQ6,ht:'<p>Large intestine: water reabsorption; gut bacteria (vitamin K, B12); faeces formation. <b>Malnutrition:</b> Kwashiorkor (protein deficiency \u2014 oedema, wasting, pot belly, skin lesions); Marasmus (total calorie deficiency \u2014 severe wasting). <b>Vitamin deficiencies</b> (WAEC): A (night blindness, xerophthalmia), C (scurvy, collagen deficiency), D (rickets, soft bones), B1 thiamine (beriberi), B3 niacin (pellagra).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Bile is important in fat digestion because: 1=it is an enzyme that breaks down fat, 2=it emulsifies fat into tiny droplets, greatly increasing surface area for lipase action.',a:2,w:'Bile: bile salts emulsify fat \u2192 smaller droplets \u2192 more surface area for lipase. Bile is not an enzyme. Answer: 2.'},{q:'Glucose is absorbed from the intestine by: 1=simple diffusion only, 2=cotransport with Na\u207a ions (secondary active transport).',a:2,w:'Na\u207a/glucose cotransport: Na\u207a gradient (from active Na\u207a/K\u207a pump) drives glucose uptake. Answer: 2.'},{q:'Kwashiorkor is caused by: 1=total calorie deficiency, 2=protein deficiency despite adequate calorie intake.',a:2,w:'Kwashiorkor: protein deficiency \u2192 oedema, swollen belly, skin lesions. Marasmus: total calorie deficiency. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Bile: emulsification. Glucose: Na\u207a cotransport. Kwashiorkor: protein deficiency.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Nutrition',ti:'Modes of Nutrition',su:'Compare autotrophic, heterotrophic and other modes of nutrition.',steps:[
  {lb:'Autotrophs and heterotrophs',dr:dQ7,ht:'<p><b>Autotrophs:</b> synthesise organic molecules from inorganic sources. <b>Photoautotrophs:</b> use light energy (plants, algae, cyanobacteria). <b>Chemoautotrophs:</b> use chemical energy (nitrifying bacteria: Nitrosomonas, Nitrobacter \u2014 oxidise NH\u2084\u207a or NO\u2082\u207b to gain energy). <b>Heterotrophs:</b> obtain organic molecules by consuming other organisms or their products.</p>'},
  {lb:'Types of heterotrophic nutrition',dr:dQ7,ht:'<p><b>Holozoic:</b> ingest whole food, then digest internally (all animals). <b>Saprophytic/saprotrophic:</b> feed on dead/decaying organic matter by extracellular digestion (most fungi, some bacteria); secrete enzymes, absorb products. <b>Parasitic:</b> live on/in host; obtain nutrients at host\'s expense; e.g. tapeworm, <em>Plasmodium</em>, mistletoe. <b>Mutualistic:</b> both organisms benefit; e.g. <em>Rhizobium</em> in legume nodules.</p>'},
  {lb:'Symbiosis and special feeding',dr:dQ7,ht:'<p><b>Mutualism:</b> both benefit; e.g. gut bacteria (digest cellulose in ruminants, produce vitamins for humans). <b>Commensalism:</b> one benefits, other unaffected. <b>Filter feeding:</b> passively filtering plankton from water; e.g. whale sharks, mussels, flamingos. <b>Ruminant digestion:</b> cows; four stomach chambers; cellulose digested by microorganisms in rumen; cud chewing (rumination).</p>'},
  {lb:'Carnivorous plants',dr:dQ7,ht:'<p>Some plants supplement mineral nutrition (especially N, P) by trapping and digesting insects: <em>Drosera</em> (sundew, sticky mucilage), <em>Dionaea</em> (Venus flytrap, snap mechanism), <em>Nepenthes</em> (pitcher plant, digestive fluid pool), <em>Utricularia</em> (bladderwort, suction trap). Adaptations for nutrient-poor habitats (e.g. peat bogs).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Nitrifying bacteria are chemoautotrophs because: 1=they use light energy and CO\u2082, 2=they use chemical energy from oxidising inorganic compounds (NH\u2084\u207a or NO\u2082\u207b) to fix CO\u2082.',a:2,w:'Chemoautotrophs: chemical energy from inorganic oxidations; CO\u2082 fixed. No light needed. Answer: 2.'},{q:'Saprophytic fungi digest food: 1=internally after ingestion, 2=externally by secreting enzymes and absorbing products.',a:2,w:'Saprotrophic: extracellular digestion outside the organism; then absorb soluble products. Answer: 2.'},{q:'Tapeworms show parasitic nutrition because: 1=they harm the host while obtaining nutrients, 2=they photosynthesise inside the host.',a:1,w:'Parasitism: one organism benefits (tapeworm gets nutrients) at expense of host (harmed). Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Chemoautotroph: chemical energy from inorganic compounds. Saprotrophic: extracellular digestion. Parasitic: harms host.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Nutrition',ti:'Food Tests and Energy Calculations',su:'Perform food tests. Calculate energy content of foods.',steps:[
  {lb:'Food tests',dr:dQ8,ht:'<p><b>Reducing sugars:</b> Benedict\u2019s (blue \u2192 brick red/orange). <b>Non-reducing sugars:</b> acid hydrolysis then Benedict\u2019s (negative \u2192 positive). <b>Starch:</b> iodine (yellow/brown \u2192 blue-black). <b>Protein:</b> Biuret (blue \u2192 lilac/purple). <b>Lipids:</b> emulsion test (ethanol extract + water \u2192 milky white) or Sudan III (red stain). WAEC: be able to describe controls and what constitutes positive vs negative.</p>'},
  {lb:'Calorimetry',dr:dQ8,ht:'<p>Energy content measured by calorimetry: burn food \u2192 heat water \u2192 calculate energy.</p><div class="fm">Energy (J) = mass of water (g) \u00d7 4.2 (J/g/\u00b0C) \u00d7 \u0394T (\u00b0C)</div><p>Energy per gram = total energy / mass of food burned. Actual values: carbohydrates ~17 kJ/g, proteins ~17 kJ/g, fats ~39 kJ/g.</p>'},
  {lb:'BMR and energy balance',dr:dQ8,ht:'<p><b>Basal metabolic rate (BMR):</b> energy required at rest to maintain vital functions; affected by body size, sex, age, thyroid hormones. <b>Energy balance:</b> energy intake (food) must equal energy expenditure (BMR + activity) for constant mass. Positive balance \u2192 weight gain; negative balance \u2192 weight loss. WAEC: calculate daily energy requirements from activity level.</p>'},
  {lb:'Malnutrition and diet-related disease',dr:dQ8,ht:'<p>Obesity: excess adipose tissue; BMI > 30; risk factors: type 2 diabetes, cardiovascular disease, hypertension. Diet: excess saturated fat \u2192 raised LDL cholesterol \u2192 atherosclerosis. Anaemia: iron deficiency (Fe\u00b2\u207a needed for haemoglobin). Goitre: iodine deficiency (needed for thyroxine). Rickets: vitamin D/calcium deficiency (children \u2014 soft bones).</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var mass_w=rnd(50,200),dT=rnd(5,25);var energy=parseFloat((mass_w*4.2*dT/1000).toFixed(2));var mass_f=rnd(1,5);var perG=parseFloat((energy/mass_f).toFixed(2));var type=pick(['total','per_gram']);if(type==='total')return{question:'<b>'+mass_w+' g</b> water heated by <b>'+dT+'\u00b0C</b>. Energy released (kJ)?',hints:['E = mass \u00d7 4.2 \u00d7 \u0394T (in J), then \u00f71000 for kJ'],ans:energy,tol:energy*0.02,unit:'kJ',working:'E = '+mass_w+'\u00d74.2\u00d7'+dT+' = '+(mass_w*4.2*dT)+' J = '+energy+' kJ'};return{question:'Total energy = <b>'+energy+' kJ</b> from <b>'+mass_f+' g</b> food. Energy per gram?',hints:['Energy per gram = total / mass of food'],ans:perG,tol:perG*0.05,unit:'kJ/g',working:energy+'/'+mass_f+' = '+perG+' kJ/g'};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Nutrition',ti:'Transpiration and Water Transport',su:'Describe the transpiration stream and factors affecting water loss.',steps:[
  {lb:'Transpiration',dr:dQ9,ht:'<p><b>Transpiration:</b> evaporation of water from plant surfaces, mainly through stomata. Water evaporates from cell surfaces in the spongy mesophyll \u2192 diffuses through stomata. Creates a water potential gradient from roots to leaves. 95\u201399% of water absorbed is transpired; only ~1\u20135% used in photosynthesis and other processes.</p>'},
  {lb:'Cohesion-tension theory',dr:dQ9,ht:'<p>Water moves up the xylem by the <b>cohesion-tension</b> mechanism: (1) Transpiration creates tension (negative pressure) at the top of the xylem. (2) Water molecules are cohesive (H-bonds between them) \u2192 pull column upward. (3) Water adheres to xylem vessel walls (adhesion). Water potential gradient: leaves (most negative) \u2192 roots (least negative).</p>'},
  {lb:'Factors affecting transpiration rate',dr:dQ9,ht:'<p>Increased by: high temperature (more evaporation), low humidity (steeper gradient), wind (removes water vapour), high light intensity (stomata open). Decreased by: high humidity, still air, darkness (stomata close), water stress (ABA causes stomatal closure). Measured using a potometer (capillary tube with air bubble).</p>'},
  {lb:'Stomatal mechanism',dr:dQ9,ht:'<p>Guard cells control stomatal opening. In light: guard cells take up K\u207a by active transport \u2192 water potential falls \u2192 water enters by osmosis \u2192 guard cells swell \u2192 stoma opens. In dark (or water stress): K\u207a leaves \u2192 guard cells lose water \u2192 stoma closes. ABA (abscisic acid) triggers closure during drought.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var bubble=rnd(10,50),time=rnd(5,20),rate=parseFloat((bubble/time).toFixed(2));var type=pick(['rate','distance']);if(type==='rate')return{question:'Air bubble moves <b>'+bubble+' mm</b> in <b>'+time+' min</b>. Transpiration rate (mm/min)?',hints:['rate = distance / time'],ans:rate,tol:rate*0.05,unit:'mm/min',working:'rate = '+bubble+'/'+time+' = '+rate+' mm/min'};var area=rnd(20,100),rate2=parseFloat((bubble/time*60).toFixed(1));return{question:'Rate of transpiration = <b>'+rate+' mm/min</b>. How far does bubble move in <b>60 min</b>?',hints:['distance = rate \u00d7 time'],ans:parseFloat((rate*60).toFixed(1)),tol:1,unit:'mm',working:'distance = '+rate+'\u00d760 = '+parseFloat((rate*60).toFixed(1))+' mm'};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Nutrition',ti:'Mixed Nutrition Questions',su:'Integrated questions across plant nutrition, photosynthesis and human digestion.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Photosynthesis: 6CO\u2082+6H\u2082O\u2192C\u2086H\u2081\u2082O\u2086+6O\u2082. Light-dependent (thylakoid): ATP+NADPH+O\u2082. Calvin cycle (stroma): CO\u2082\u2192G3P using ATP+NADPH. Mg\u00b2\u207a: chlorophyll. NO\u2083\u207b: amino acids. Bile: emulsification. Kwashiorkor: protein deficiency.</p>'},
  {lb:'Calculation: Calvin cycle stoichiometry',dr:dQ10,ht:'<p>For every 3 CO\u2082 fixed: 6 ATP + 6 NADPH used in reduction; 3 ATP for RuBP regeneration \u2192 9 ATP + 6 NADPH total per 3 CO\u2082. For 1 glucose (6C): 18 ATP + 12 NADPH needed. G3P is the key intermediate. WAEC often asks for ATP/NADPH requirements per molecule of CO\u2082 fixed.</p>'},
  {lb:'WAEC essay framework',dr:dQ10,ht:'<p>For photosynthesis questions: (1) state equation; (2) describe location of each stage; (3) name key molecules (RuBP, GP, G3P, ATP, NADPH); (4) explain how the two stages are linked; (5) discuss limiting factors with explanation of why each limits rate. For nutrition: (1) name enzyme; (2) substrate and product; (3) site; (4) optimal pH.</p>'},
  {lb:'Applied: greenhouse horticulture',dr:dQ10,ht:'<p>Greenhouses optimise photosynthesis: elevated CO\u2082 (~0.1%), artificial lighting (red+blue LEDs match absorption spectrum), optimal temperature (25\u201328\u00b0C), nutrient solution (hydroponics). Understanding limiting factors allows commercial growers to maximise yield. WAEC: link theory to agricultural application.</p>'},
