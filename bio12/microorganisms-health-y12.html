<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}

.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}

.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}

.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Types of pathogens and diseases','#2E7D32',13,'middle',true));
[['Bacteria','prokaryotes; toxins damage host; e.g. tuberculosis, cholera, typhoid, meningitis'],['Viruses','acellular; use host machinery; e.g. HIV, influenza, measles, hepatitis B, COVID-19'],['Fungi','eukaryotes; superficial or systemic; e.g. ringworm, candidiasis, aspergillosis'],['Protoctista','unicellular eukaryotes; e.g. malaria (Plasmodium), sleeping sickness (Trypanosoma)'],['Helminths (worms)','multicellular animals; e.g. tapeworm, roundworm, schistosomiasis, filariasis'],['Prions','misfolded proteins; CJD, vCJD, BSE, scrapie; no nucleic acid; fatal']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(90,55+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(320,55+i*33,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Malaria — life cycle and control','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,52,'Causative agent: Plasmodium (4 species; P. falciparum most deadly)','#333',10,'middle',false));o.push(T(240,70,'Vector: female Anopheles mosquito (takes blood meal to mature eggs)','#555',8,'middle',false));}
if(p>=2){o.push(R(10,90,460,52,'#F1F8F1','#2E7D32',1.5));o.push(T(240,108,'Life cycle: mosquito injects sporozoites \u2192 liver (schizogony) \u2192 merozoites released','#333',10,'middle',false));o.push(T(240,124,'Merozoites invade RBCs \u2192 multiply \u2192 RBCs burst (fever) \u2192 gametocytes','#555',8,'middle',false));o.push(T(240,138,'Mosquito takes up gametocytes \u2192 sexual reproduction in mosquito \u2192 sporozoites','#555',7,'middle',false));}
if(p>=3){o.push(R(10,154,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,170,'Control: insecticide-treated bed nets, indoor residual spraying, larval control','#333',10,'middle',false));o.push(T(240,186,'Drugs: chloroquine, artemisinin combination therapy (ACT), primaquine','#555',8,'middle',false));}
if(p>=4){o.push(R(10,206,460,40,'#C8E6C9','#2E7D32',1));o.push(T(240,222,'Why malaria is difficult to eradicate: multiple Plasmodium species, drug resistance,','#333',9,'middle',false));o.push(T(240,238,'mosquito insecticide resistance, no fully effective vaccine yet, complex life cycle','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Immune response','#2E7D32',12,'middle',true));
o.push(R(10,36,222,210,'#F1F8F1','#2E7D32',2));o.push(T(121,54,'NON-SPECIFIC','#2E7D32',11,'middle',true));
o.push(R(248,36,222,210,'#F1F8F1','#2E7D32',2));o.push(T(359,54,'SPECIFIC (ADAPTIVE)','#2E7D32',11,'middle',true));
var ns=['Skin + mucous membranes','Inflammation response','Phagocytosis (neutrophils)','NK cells','Complement system','Fever','Interferons (antiviral)'];
var sp=['B lymphocytes (antibodies)','T lymphocytes (cell-mediated)','Antigen-specific','Clonal selection','Immunological memory','Slower (days) first time','Faster and stronger 2nd exposure'];
ns.forEach(function(v,i){if(i<p+1)o.push(T(121,72+i*22,v,'#333',7,'middle',false));});
sp.forEach(function(v,i){if(i<p+1)o.push(T(359,72+i*22,v,'#333',7,'middle',false));});
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'HIV and AIDS','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,56,'HIV: retrovirus; RNA genome; lipid envelope; gp120 attaches to CD4 receptor on T-helper cells','#333',10,'middle',false));o.push(T(240,74,'Reverse transcriptase: RNA \u2192 DNA \u2192 integrates into host genome (provirus)','#555',8,'middle',false));}
if(p>=2){o.push(R(10,94,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,112,'Destroys T-helper cells \u2192 immune suppression \u2192 AIDS (CD4 count < 200/\u03bcL)','#333',10,'middle',false));o.push(T(240,130,'Opportunistic infections: PCP pneumonia, TB, Kaposi\u2019s sarcoma, CMV','#555',8,'middle',false));}
if(p>=3){o.push(R(10,150,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,168,'Transmission: sexual contact, blood (needles), mother-to-child (MTCT)','#333',10,'middle',false));o.push(T(240,186,'NOT transmitted: casual contact, shared food, mosquitoes, air','#555',8,'middle',false));}
if(p>=4){o.push(R(10,206,460,44,'#C8E6C9','#2E7D32',1));o.push(T(240,224,'Antiretrovirals (ART/HAART): reverse transcriptase inhibitors, protease inhibitors, integrase inhibitors','#333',9,'middle',false));o.push(T(240,242,'Treatment not cure; prevents AIDS; reduces transmission; UNAIDS 95-95-95 targets','#555',8,'middle',false));}
s.innerHTML=o.join('');}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Health and disease summary','#2E7D32',13,'middle',true));
[['Malaria','Plasmodium; Anopheles vector; fever; ACT treatment; bed nets'],['HIV/AIDS','retrovirus; T-helper cells; CD4 count; ART; sexual/blood transmission'],['TB','Mycobacterium tuberculosis; airborne; BCG vaccine; long treatment'],['Non-specific immunity','skin, phagocytosis, inflammation, fever, interferons'],['Specific immunity','B cells (antibodies), T cells (cell-mediated), memory cells'],['Vaccines','antigen \u2192 primary response \u2192 memory cells \u2192 rapid secondary'],['Koch\u2019s postulates','microbe in all cases; isolated; inoculated \u2192 disease; re-isolated']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F1F8F1','#C8E6C9',1));o.push(T(100,52+i*30,r[0],'#2E7D32',10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Health',ti:'Types of Pathogens',su:'Classify pathogens. Describe Koch\'s postulates.',steps:[
  {lb:'Classification of pathogens',dr:dQ1,ht:'<p>Pathogen: organism causing disease. Categories: Bacteria (prokaryotes; cell wall; toxins/invasion), Viruses (acellular; obligate intracellular; use host ribosomes), Fungi (eukaryotes; chitin wall; mainly spore-transmitted), Protoctista (unicellular eukaryotes; often vector-transmitted), Helminths (multicellular worms; complex life cycles), Prions (misfolded proteins; no nucleic acid).</p>'},
  {lb:'Koch\'s postulates',dr:dQ1,ht:'<p>Koch (1876\u20131884) established proof of causation: (1) Microorganism found in all cases of disease. (2) Isolated from diseased host and grown in pure culture. (3) Inoculated into healthy host \u2192 causes disease. (4) Re-isolated from diseased host and matches original. Proved causation for anthrax, TB, cholera. Limitations: some pathogens cannot be cultured; some organisms carried asymptomatically (e.g. cholera); viral diseases (Pasteur-Koch era pre-virology).</p>'},
  {lb:'Transmission routes',dr:dQ1,ht:'<p>Routes of transmission: airborne (droplets/aerosols: TB, influenza, COVID-19), faecal-oral (cholera, typhoid: contaminated water/food), direct contact (STIs: HIV, gonorrhoea, syphilis; skin: ringworm), vector-borne (malaria: Anopheles; sleeping sickness: tsetse fly; dengue: Aedes), vertical (mother-to-child: HIV, rubella, CMV), blood-borne (HIV, hepatitis B, C: needles, transfusion). Control: break transmission chain.</p>'},
  {lb:'Epidemiology',dr:dQ1,ht:'<p>Epidemiology: study of disease distribution and determinants. <b>Incidence:</b> new cases per time period. <b>Prevalence:</b> existing cases at a point in time. <b>R\u2080 (basic reproduction number):</b> average number of secondary cases from one infected individual in fully susceptible population. R\u2080 > 1: epidemic grows. R\u2080 < 1: epidemic dies out. COVID-19 R\u2080: ~2\u20133 original; higher for Omicron. Herd immunity threshold = 1 \u2212 1/R\u2080.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Koch\'s postulates establish that a microorganism causes a disease. The third postulate requires: 1=finding the microorganism in all cases, 2=inoculating a healthy host with the isolated microorganism and producing the disease.',a:2,w:'Postulate 3: inoculate pure culture into healthy host \u2192 same disease appears \u2192 proves causation. Answer: 2.'},{q:'An R\u2080 of 3 means: 1=the disease is fatal in 3% of cases, 2=one infected person infects on average 3 others in a fully susceptible population.',a:2,w:'R\u2080: basic reproduction number; R\u2080=3 \u2192 epidemic will grow if no immunity. Answer: 2.'},{q:'Malaria transmission is vector-borne. This means: 1=it spreads through contaminated water, 2=it is transmitted by an intermediate organism (Anopheles mosquito) that carries the pathogen.',a:2,w:'Vector-borne: Anopheles mosquito takes blood from infected person \u2192 sporozoites develop in mosquito \u2192 infect next person. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Koch postulate 3: inoculate healthy host. R\u2080: average secondary cases. Vector: transmitting organism.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Health',ti:'Malaria',su:'Describe the life cycle of Plasmodium and methods of malaria control.',steps:[
  {lb:'Plasmodium life cycle in human',dr:dQ2,ht:'<p>1. Female <em>Anopheles</em> mosquito bites \u2192 injects <b>sporozoites</b> into bloodstream. 2. Sporozoites travel to liver \u2192 multiply (asexual schizogony) \u2192 release <b>merozoites</b> (many). 3. Merozoites invade RBCs \u2192 multiply (48-72 hr cycle depending on species) \u2192 RBCs burst \u2192 fever, chills, anaemia. 4. Some merozoites \u2192 <b>gametocytes</b> (sexual stage).</p>'},
  {lb:'Plasmodium life cycle in mosquito',dr:dQ2,ht:'<p>5. Mosquito bites infected human \u2192 takes up gametocytes. 6. In mosquito gut: male and female gametocytes fuse \u2192 zygote \u2192 oocyst \u2192 sporozoites migrate to salivary glands. 7. Sporozoites injected into next human (cycle complete). <em>P. falciparum</em>: most dangerous (invades all RBC ages; causes cerebral malaria; high parasitaemia). <em>P. vivax</em>: dormant liver stage (hypnozoites); relapses.</p>'},
  {lb:'Symptoms and complications',dr:dQ2,ht:'<p>Periodic fever (corresponds to RBC rupture cycles): tertian (every 48h: P. vivax, P. falciparum) or quartan (every 72h: P. malariae). Severe falciparum malaria: cerebral malaria (coma, seizures), severe anaemia, pulmonary oedema, renal failure, hypoglycaemia. Sickle cell trait (HbS/HbA) and G6PD deficiency both confer partial protection against malaria. Common in tropical/subtropical regions (Africa, South/South-east Asia).</p>'},
  {lb:'Prevention and treatment',dr:dQ2,ht:'<p><b>Prevention:</b> insecticide-treated bed nets (ITNs); indoor residual spraying (IRS) with pyrethroids; larval control (drainage, BTI larvicide, biological control); chemoprophylaxis for travellers. <b>Treatment:</b> artemisinin combination therapy (ACT: artesunate + lumefantrine); chloroquine (where not resistant); primaquine (clears liver stage). <b>Challenges:</b> drug resistance (ACT resistance emerging in SE Asia); insecticide resistance; no fully effective vaccine (RTS,S/AS01 limited; R21/Matrix-M now WHO-approved).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'The periodic fever in malaria occurs because: 1=the mosquito bites every 48 hours, 2=RBCs burst synchronously at the end of the parasite\u2019s erythrocytic cycle, releasing merozoites and pyrogens.',a:2,w:'RBC rupture: releases merozoites + toxins \u2192 immune response \u2192 fever. Occurs every 48h (P. falciparum). Answer: 2.'},{q:'Sickle cell trait (HbS/HbA) protects against malaria because: 1=sickle cells kill mosquitoes, 2=parasitised HbS/HbA cells sickle and are removed by the spleen before parasites complete their cycle.',a:2,w:'Parasitised HbS/HbA cells: sickling triggered \u2192 removed by spleen \u2192 parasite lifecycle disrupted. Answer: 2.'},{q:'Insecticide-treated bed nets (ITNs) prevent malaria by: 1=killing all mosquitoes in the area, 2=acting as a physical barrier and killing mosquitoes that land on the net, reducing bites at night.',a:2,w:'ITNs: physical barrier + insecticide kills mosquitoes; effective as Anopheles is nocturnal. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Fever: RBC rupture. Sickle trait: parasitised cells removed by spleen. ITNs: barrier + insecticide.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Health',ti:'The Immune System',su:'Describe the non-specific and specific immune responses.',steps:[
  {lb:'Non-specific (innate) immunity',dr:dQ3,ht:'<p>First line: skin (keratinised barrier), mucous membranes (trap pathogens), tears/saliva (lysozyme), stomach acid (pH 2). Second line: inflammation (vasodilation \u2192 redness/heat/swelling; neutrophils migrate to infection site \u2192 phagocytosis), fever (raises temperature, enhances immune function), complement system (cascade of proteins \u2192 pores in pathogen membrane), interferons (signal neighbouring cells to resist viral infection), NK cells (kill infected cells).</p>'},
  {lb:'Specific (adaptive) immunity',dr:dQ3,ht:'<p>Antigen-specific; takes days first time; produces immunological memory. <b>Humoral immunity (B cells):</b> B cell recognises antigen via BCR \u2192 clonal selection (specific B cell proliferates) \u2192 plasma cells (secrete antibodies) + memory B cells. <b>Cell-mediated immunity (T cells):</b> T helper (CD4+): coordinate response; T cytotoxic (CD8+): kill infected cells; T regulatory: prevent autoimmunity. APCs (dendritic cells, macrophages) present antigen on MHC molecules.</p>'},
  {lb:'Antibodies',dr:dQ3,ht:'<p>Antibodies (immunoglobulins): Y-shaped glycoproteins; 2 heavy + 2 light chains; variable region (antigen-binding site, unique); constant region (effector functions). 5 classes: IgG (most common, secondary response, crosses placenta), IgM (primary response, pentamer), IgA (secretions: mucus, breast milk), IgE (allergy, parasites), IgD (B cell surface). Antibody functions: neutralisation, opsonisation (coat pathogen for phagocytosis), complement activation, agglutination.</p>'},
  {lb:'Primary vs secondary immune response',dr:dQ3,ht:'<p><b>Primary response:</b> first exposure to antigen; takes 7\u201314 days; mainly IgM; relatively weak; many B cells undergo apoptosis; some become memory cells. <b>Secondary response:</b> second exposure; rapid (2\u20133 days); mainly IgG; much higher antibody titre; longer lasting; basis of vaccination and lasting immunity. Memory B and T cells: long-lived, rapid response on re-exposure.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Clonal selection means: 1=all B cells are activated by any antigen, 2=only the specific B cell whose receptor matches the antigen is activated and proliferates to form a clone.',a:2,w:'Clonal selection: each B cell has one specificity; matching antigen \u2192 that B cell selected and expands. Answer: 2.'},{q:'Opsonisation by antibodies aids phagocytosis because: 1=antibodies digest the pathogen, 2=antibodies coat the pathogen, making it easier for phagocytes to recognise and engulf it via Fc receptors.',a:2,w:'Opsonins (IgG): bind pathogen + phagocyte Fc receptor \u2192 enhanced phagocytosis. Answer: 2.'},{q:'The secondary immune response is faster and stronger because: 1=the pathogen is weaker second time, 2=memory B and T cells respond rapidly and in greater numbers than naive cells.',a:2,w:'Memory cells: long-lived, rapidly activated on re-exposure; produce higher antibody titre faster. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Clonal selection: specific B cell activated. Opsonisation: antibody coat for phagocytosis. Secondary: memory cells.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Health',ti:'HIV and AIDS',su:'Describe HIV replication cycle. Explain the development of AIDS.',steps:[
  {lb:'HIV structure and entry',dr:dQ4,ht:'<p>HIV (Human Immunodeficiency Virus): retrovirus; RNA genome (2 copies); lipid envelope derived from host cell; surface glycoproteins gp120 (attachment to CD4) and gp41 (fusion). Contains: reverse transcriptase, integrase, protease (all drug targets). Entry: gp120 binds CD4 receptor + CCR5/CXCR4 co-receptor on T-helper cells (and macrophages, dendritic cells) \u2192 gp41 fuses membranes \u2192 core enters cell.</p>'},
  {lb:'HIV replication cycle',dr:dQ4,ht:'<p>1. gp120 binds CD4/CCR5 \u2192 fusion. 2. RNA + reverse transcriptase enter cytoplasm. 3. Reverse transcriptase: RNA \u2192 DNA (error-prone \u2192 high mutation rate \u2192 immune evasion, drug resistance). 4. Integrase: viral DNA integrates into host chromosome (provirus \u2192 latent reservoir; major obstacle to cure). 5. Host RNA polymerase transcribes provirus. 6. Protease cleaves polyprotein precursors \u2192 mature viral proteins. 7. Assembly + budding of new virions.</p>'},
  {lb:'Progression to AIDS',dr:dQ4,ht:'<p>After initial infection (acute retroviral syndrome: flu-like illness, high viral load): immune system partially controls virus; CD4 count falls gradually over years. Clinical latency: 8\u201310 years (asymptomatic, but infectious; viral load detectable). AIDS: CD4 count < 200 cells/\u03bcL; immune system fails \u2192 opportunistic infections: <em>Pneumocystis jirovecii</em> pneumonia, CMV, cryptococcal meningitis, toxoplasmosis, TB, Kaposi\u2019s sarcoma (HHV-8). AIDS-defining illnesses.</p>'},
  {lb:'Treatment and prevention',dr:dQ4,ht:'<p>ART (antiretroviral therapy): combination (\u22653 drugs from \u22652 classes): NRTI (block reverse transcriptase), NNRTI (block RT differently), PI (block protease), INSTI (block integrase), entry inhibitors. Undetectable = Untransmittable (U=U): effective ART \u2192 viral load undetectable \u2192 cannot transmit HIV sexually. PrEP (pre-exposure prophylaxis): tenofovir+emtricitabine; highly effective prevention. UNAIDS 95-95-95: 95% diagnosed, 95% on ART, 95% virally suppressed.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'HIV reverse transcriptase has a high error rate. This is clinically significant because: 1=it slows virus replication, 2=it generates many mutations, allowing rapid evolution of drug-resistant and immune-evading variants.',a:2,w:'High error rate: ~1 mutation per replication cycle; drug resistance emerges quickly; immune escape variants generated. Answer: 2.'},{q:'AIDS is defined by: 1=being infected with HIV, 2=CD4 count below 200 cells/\u03bcL and/or development of AIDS-defining illnesses.',a:2,w:'AIDS: stage of HIV infection with severe immunodeficiency; CD4 < 200; opportunistic infections. Answer: 2.'},{q:'ART does not cure HIV because: 1=the drugs are not strong enough, 2=integrated proviral DNA in latently infected cells is not eliminated by current drugs.',a:2,w:'Latent reservoir: provirus in resting CD4 T cells; ART suppresses but cannot eliminate; cells reactivate if ART stopped. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['RT error rate: drug resistance + immune escape. AIDS: CD4<200. Latent reservoir: ART cannot eliminate.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Health',ti:'Tuberculosis and Other Bacterial Diseases',su:'Describe TB pathogenesis and control. Describe cholera as an example of water-borne disease.',steps:[
  {lb:'Tuberculosis',dr:dQ5,ht:'<p><em>Mycobacterium tuberculosis</em>: aerobic, acid-fast bacillus; waxy mycolic acid cell wall (resists immune cells, gram staining, desiccation). Transmission: airborne droplets. Infection: macrophages in alveoli engulf bacilli but cannot destroy them; forms granuloma (tubercle: core of mycobacteria + macrophages + fibrous capsule). Latent TB: most infections (90%) stay latent; reactivation when immune system weakens (HIV, malnutrition, immunosuppression).</p>'},
  {lb:'TB disease and treatment',dr:dQ5,ht:'<p>Active TB: fever, night sweats, weight loss, chronic cough, haemoptysis. Diagnosis: TB skin test (Mantoux/PPD), IFN-\u03b3 release assay (IGRA), sputum smear/culture, chest X-ray, GeneXpert (rapid molecular). Treatment: RIPE (Rifampicin, Isoniazid, Pyrazinamide, Ethambutol) for 6 months. Multi-drug resistant TB (MDR-TB): resistant to at least rifampicin + isoniazid. Extensively drug-resistant (XDR-TB). BCG vaccine: moderate protection (variable, especially pulmonary TB in adults). Global burden: 10 million cases/yr.</p>'},
  {lb:'Cholera',dr:dQ5,ht:'<p><em>Vibrio cholerae</em>: gram-negative; secretes cholera toxin. Transmission: faecal-oral; contaminated water/food. Toxin: activates adenylate cyclase in intestinal epithelium \u2192 \u2191cAMP \u2192 massive Cl\u207b secretion \u2192 water follows osmotically \u2192 \u2018rice water\u2019 diarrhoea (up to 20 L/day). Treatment: oral rehydration therapy (ORS: glucose + salts + water); IV fluids if severe; antibiotics (reduce duration). Prevention: clean water, sanitation, hygiene (WASH), oral cholera vaccine. John Snow\u2019s 1854 Broad Street pump investigation: epidemiological classic.</p>'},
  {lb:'Non-communicable diseases',dr:dQ5,ht:'<p>NCD: not caused by infectious agent; not transmitted person-to-person. Cardiovascular disease (CVD), cancer, diabetes, chronic respiratory disease. Leading cause of death globally (70%). Risk factors: smoking, diet (saturated fat, salt, sugar), inactivity, alcohol, obesity. CVD: atherosclerosis (LDL cholesterol deposition) \u2192 plaque \u2192 stenosis \u2192 thrombus \u2192 MI or stroke. Prevention: lifestyle modification, statins, antihypertensives, aspirin, smoking cessation.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Cholera causes profuse watery diarrhoea because: 1=Vibrio cholerae destroys intestinal cells, 2=cholera toxin activates adenylate cyclase \u2192 cAMP \u2192 massive Cl\u207b and water secretion into intestine.',a:2,w:'Cholera toxin: cAMP \u2192 Cl\u207b pumped out \u2192 water follows by osmosis \u2192 \u2018rice water\u2019 stools. Answer: 2.'},{q:'MDR-TB is particularly dangerous because: 1=it spreads through water, 2=it is resistant to the two most effective first-line antibiotics (rifampicin and isoniazid), making treatment much harder.',a:2,w:'MDR-TB: resistant to rifampicin + isoniazid; requires longer, more toxic second-line drugs. Answer: 2.'},{q:'Oral rehydration therapy (ORS) works in cholera because: 1=it kills V. cholerae, 2=glucose co-transport of Na\u207a in the gut is not inhibited by cholera toxin, allowing fluid absorption.',a:2,w:'ORS: Na\u207a/glucose cotransport pathway not affected by cholera toxin; fluid absorbed even during toxin-induced secretion. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Cholera toxin: cAMP \u2192 Cl\u207b+water secretion. MDR-TB: resistant to rifampicin+isoniazid. ORS: glucose cotransport.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Health',ti:'Vaccines and Immunisation',su:'Describe how vaccines work. Evaluate different vaccine types.',steps:[
  {lb:'Principles of vaccination',dr:dQ6,ht:'<p>Vaccines: introduce antigen to stimulate primary immune response + memory cells WITHOUT causing disease. On real infection: memory B and T cells respond rapidly (secondary response) \u2192 pathogen eliminated before symptoms or early. Herd immunity: if sufficient % of population immune \u2192 transmission chains break \u2192 even non-immune individuals protected. Threshold: 1 \u2212 1/R\u2080 (measles R\u2080=15 \u2192 need ~95% immune).</p>'},
  {lb:'Types of vaccines',dr:dQ6,ht:'<p><b>Live-attenuated:</b> weakened pathogen; strong, long-lasting immunity; MMR, BCG, oral polio, yellow fever, chickenpox. Cannot use in immunocompromised. <b>Inactivated (killed):</b> dead pathogen; safer; usually need boosters; injectable polio, influenza, hepatitis A, rabies. <b>Subunit/protein:</b> just surface antigens; very safe; hepatitis B (HBsAg), pertussis (acellular), HPV, shingles (Shingrix). <b>Toxoid:</b> inactivated toxin; tetanus, diphtheria. <b>mRNA:</b> codes for antigen (spike protein); COVID-19 BNT162b2, mRNA-1273; novel; no live pathogen; rapid development.</p>'},
  {lb:'mRNA vaccines and new platforms',dr:dQ6,ht:'<p>mRNA vaccines: lipid nanoparticle delivers mRNA into cells \u2192 ribosomes translate mRNA \u2192 spike protein expressed \u2192 immune response. mRNA does NOT enter nucleus; does NOT alter DNA. Advantages: rapid development, scalable, no live pathogen risk, can be updated quickly. WAEC: dispel common misconceptions about mRNA vaccines. Viral vector vaccines (AZ/ChAdOx1, J&J): adenovirus carries gene; similar outcome; different delivery.</p>'},
  {lb:'Challenges and adverse effects',dr:dQ6,ht:'<p>Vaccine safety: monitored by pharmacovigilance systems (Yellow Card UK, VAERS USA). Common: injection site pain, mild fever, fatigue (immune response \u2014 normal and expected). Rare serious: anaphylaxis (~1-2 per million doses; managed with adrenaline); myocarditis (mRNA vaccines, mainly young males, mild/self-limiting); VITT (vaccine-induced thrombocytopenia with thrombosis: AZ vaccine, rare). Vaccine hesitancy: misinformation, historical abuses, distrust. Debunking: no credible evidence linking MMR to autism (Wakefield paper retracted, fraudulent).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'mRNA COVID-19 vaccines work by: 1=injecting a weakened virus, 2=delivering mRNA that instructs cells to make the viral spike protein, triggering an immune response without any viral particles.',a:2,w:'mRNA: cells make spike protein; immune system mounts response; mRNA degraded quickly; no live virus; cannot alter DNA. Answer: 2.'},{q:'Herd immunity requires a high proportion of the population to be immune because: 1=vaccinated people protect themselves only, 2=when enough people are immune, transmission chains break, protecting even non-immune individuals.',a:2,w:'Herd immunity: immune individuals form a barrier; pathogen cannot find enough susceptible hosts to spread. Answer: 2.'},{q:'Live-attenuated vaccines cannot be given to immunocompromised patients because: 1=they are allergic to the vaccine, 2=the weakened pathogen could cause disease in someone with a severely weakened immune system.',a:2,w:'Immunocompromised: reduced ability to control even attenuated pathogen \u2192 risk of vaccine-strain disease. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['mRNA: cells make antigen; no virus; cannot alter DNA. Herd immunity: breaks transmission chains. Live vaccines: risk in immunocompromised.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Health',ti:'Tropical Diseases',su:'Describe schistosomiasis, sleeping sickness and other tropical diseases relevant to WAEC.',steps:[
  {lb:'Schistosomiasis',dr:dQ7,ht:'<p>Caused by blood flukes (<em>Schistosoma mansoni, S. haematobium, S. japonicum</em>). Life cycle: eggs in faeces/urine \u2192 freshwater \u2192 hatch \u2192 miracidia infect snail (intermediate host) \u2192 cercariae released \u2192 penetrate human skin \u2192 adult worms in blood vessels. Symptoms: chronic (liver fibrosis, splenomegaly, haematuria, bladder cancer). Treatment: praziquantel. Control: molluscicides (kill snails), prevent water contact, sanitation. 200 million cases globally.</p>'},
  {lb:'Sleeping sickness (African trypanosomiasis)',dr:dQ7,ht:'<p>Caused by <em>Trypanosoma brucei</em> (rhodesiense in E. Africa, gambiense in W. Africa). Vector: tsetse fly (<em>Glossina</em>). Life cycle: tsetse bite \u2192 trypomastigotes in blood (stage 1: fever, lymphadenopathy) \u2192 cross blood-brain barrier \u2192 stage 2: neurological symptoms (personality changes, sleep disturbance \u2192 coma). Treatment: stage 1: pentamidine/suramin; stage 2: melarsoprol (arsenic-based, toxic) or eflornithine. Control: tsetse traps, insecticides, cattle treatment.</p>'},
  {lb:'Onchocerciasis and lymphatic filariasis',dr:dQ7,ht:'<p><b>Onchocerciasis (river blindness):</b> <em>Onchocerca volvulus</em> (nematode); vector: <em>Simulium</em> blackfly; microfilariae in skin and eyes \u2192 inflammatory response \u2192 blindness; treatment: ivermectin. <b>Lymphatic filariasis (elephantiasis):</b> <em>Wuchereria bancrofti</em>; vector: <em>Culex</em> mosquito; worms block lymph vessels \u2192 massive oedema. Mass drug administration (MDA): albendazole + ivermectin/DEC used for elimination.</p>'},
  {lb:'Neglected tropical diseases (NTDs)',dr:dQ7,ht:'<p>WHO defines 20 NTDs affecting >1 billion people in tropical/subtropical regions; mostly affecting poorest communities; limited commercial incentive for drug development. Examples: leishmaniasis, Chagas disease, yaws, leprosy, dengue, guinea worm. London Declaration (2012): pharma companies pledged drug donations; WHO roadmap 2021-2030: eliminate or eradicate most NTDs. WAEC: know major NTDs affecting Nigeria/West Africa specifically.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Schistosomiasis is transmitted when: 1=a mosquito bites an infected person, 2=cercariae (free-swimming larvae) in freshwater penetrate the skin of someone wading or swimming.',a:2,w:'Schistosomiasis: cercariae in freshwater \u2192 penetrate skin directly (no insect vector; snail is intermediate host). Answer: 2.'},{q:'African sleeping sickness is fatal if untreated because: 1=the parasite destroys RBCs, 2=Trypanosoma brucei crosses the blood-brain barrier causing fatal neurological damage.',a:2,w:'Stage 2: CNS invasion \u2192 encephalitis \u2192 coma \u2192 death without treatment. Answer: 2.'},{q:'River blindness (onchocerciasis) is linked to rivers because: 1=patients drink river water, 2=the vector (Simulium blackfly) breeds in fast-flowing oxygenated rivers.',a:2,w:'Simulium: breeds in fast-flowing rivers \u2192 communities near rivers disproportionately affected. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Schistosomiasis: cercariae penetrate skin. Sleeping sickness: CNS invasion, fatal. Onchocerciasis: Simulium in fast rivers.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Health',ti:'Non-Communicable Diseases and Public Health',su:'Describe risk factors for NCDs. Evaluate public health interventions.',steps:[
  {lb:'Cardiovascular disease',dr:dQ8,ht:'<p>CVD: most common cause of death globally. Atherosclerosis: LDL cholesterol + macrophages \u2192 foam cells in arterial intima \u2192 fibrous plaque \u2192 lumen narrowed. Risk factors: smoking (damages endothelium, \u2191LDL, \u2191clotting), hypertension (turbulence \u2192 endothelial damage), diabetes (glycosylation of proteins), obesity (dyslipidaemia), inactivity, saturated fat diet, family history. Thrombus formation \u2192 MI (coronary artery) or stroke (cerebral).</p>'},
  {lb:'Cancer biology',dr:dQ8,ht:'<p>Cancer: uncontrolled cell division; loss of contact inhibition; invasion and metastasis. Caused by: (1) mutations in proto-oncogenes \u2192 oncogenes (accelerators stuck on); (2) mutations in tumour suppressor genes (p53, BRCA1, Rb) \u2192 brakes removed. Carcinogens: tobacco smoke, ionising radiation, UV, asbestos, viral (HPV, EBV, HBV, HCV, HTLV-1). Smoking: lung cancer, bladder, oesophagus. Obesity: breast, colon, endometrial, renal cancers.</p>'},
  {lb:'Diabetes mellitus',dr:dQ8,ht:'<p>Type 1: autoimmune; \u03b2-cell destruction; insulin-dependent. Complications: DKA (ketoacidosis), hypoglycaemia (insulin overdose). Type 2: insulin resistance + \u03b2-cell dysfunction; strongly associated with obesity, inactivity. Complications: retinopathy, nephropathy, neuropathy, peripheral vascular disease, atherosclerosis. Africa: rising epidemic of Type 2 with urbanisation + westernisation. Nigeria: estimated 5.7% prevalence. Prevention: diet, exercise, weight loss.</p>'},
  {lb:'Public health strategies',dr:dQ8,ht:'<p>Population-level: legislation (tobacco taxes, smoking bans, food labelling, seat belts); screening programmes (breast, cervical, bowel cancer; blood pressure; diabetes); vaccination programmes; water fluoridation; food fortification (iodine in salt, folic acid in flour). Individual-level: health education, brief interventions (smoking cessation), lifestyle advice, medication. WAEC: evaluate cost-effectiveness and equity of public health measures.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Smoking causes atherosclerosis because: 1=it increases HDL cholesterol, 2=nicotine and carbon monoxide damage endothelium, increase LDL, and promote platelet aggregation, accelerating plaque formation.',a:2,w:'Smoking: endothelial damage + \u2191LDL + \u2191clotting \u2192 accelerated atherosclerosis. Answer: 2.'},{q:'HPV vaccination reduces cervical cancer risk because: 1=it treats existing HPV infection, 2=it induces immunity against HPV strains 16 and 18 which cause ~70% of cervical cancers.',a:2,w:'HPV vaccine: targets HPV 16+18 (high-risk strains); prophylactic \u2014 must be given before exposure; reduces incidence of cervical cancer. Answer: 2.'},{q:'Type 2 diabetes can often be prevented by: 1=insulin injections, 2=maintaining healthy weight through diet and physical activity, which reduce insulin resistance.',a:2,w:'Type 2: insulin resistance related to obesity/inactivity; lifestyle intervention (weight loss, exercise) prevents or delays onset. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Smoking: endothelial damage, LDL. HPV vaccine: prevention, HPV 16+18. Type 2: lifestyle prevention.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Health',ti:'Drug Development and Clinical Trials',su:'Describe how new drugs are developed and tested.',steps:[
  {lb:'Drug discovery',dr:dQ9,ht:'<p>Drug discovery: (1) Target identification: identify protein/pathway involved in disease. (2) Lead compound: identify molecule that modulates target (natural products, HTS screening of compound libraries, rational drug design). (3) Lead optimisation: modify compound for potency, selectivity, pharmacokinetics (ADME: absorption, distribution, metabolism, excretion), safety. Computational methods (in silico screening, molecular modelling) accelerate this stage.</p>'},
  {lb:'Preclinical testing',dr:dQ9,ht:'<p>Before human trials: (1) In vitro (cell cultures, organoids): test efficacy and toxicity. (2) In vivo (animal studies): pharmacokinetics, pharmacodynamics, toxicology. Species used: mice, rats, rabbits, dogs, primates. 3Rs: Replace (alternatives to animals), Reduce (fewer animals), Refine (minimise suffering). Animals not perfect models for human disease. ~90% of drugs fail in clinical trials despite passing preclinical.</p>'},
  {lb:'Clinical trials (phases)',dr:dQ9,ht:'<p><b>Phase I:</b> small number of healthy volunteers (or patients with no other options); safety, pharmacokinetics, maximum tolerated dose. <b>Phase II:</b> hundreds of patients; efficacy signals, further safety, dose-finding. <b>Phase III:</b> thousands of patients; randomised, double-blind, placebo-controlled (RCT); primary endpoint (efficacy + safety); regulatory approval if successful. <b>Phase IV:</b> post-marketing surveillance; rare adverse effects, long-term safety.</p>'},
  {lb:'Regulatory approval and ethics',dr:dQ9,ht:'<p>Regulatory bodies: FDA (USA), EMA (Europe), NAFDAC (Nigeria), MHRA (UK). Must show: efficacy (works), safety (acceptable risk/benefit), quality (manufacturing standards). Clinical trial ethics: informed consent, IRB/ethics committee approval, random allocation, blinding, equipoise. Placebo ethical only when no proven effective treatment exists. WAEC: understand trial design; distinguish correlation from causation in health research.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'A double-blind RCT is the gold standard for testing drugs because: 1=it is the cheapest method, 2=neither patients nor researchers know who receives drug or placebo, removing bias from results.',a:2,w:'Double-blind: patient bias (placebo effect) and researcher bias (observer bias) eliminated; objective results. Answer: 2.'},{q:'Phase III clinical trials differ from Phase I because: 1=Phase III tests safety in healthy volunteers, 2=Phase III tests efficacy and safety in thousands of patients using a randomised controlled design.',a:2,w:'Phase I: safety, pharmacokinetics, small numbers. Phase III: efficacy + safety, large RCT, regulatory approval basis. Answer: 2.'},{q:'The 3Rs in animal research stand for: 1=Repeat, Record, Report, 2=Replace (alternatives), Reduce (fewer animals), Refine (minimise suffering).',a:2,w:'3Rs: Replace with non-animal alternatives; Reduce numbers; Refine to minimise pain/distress. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Double-blind: removes placebo effect + observer bias. Phase III: large RCT. 3Rs: Replace, Reduce, Refine.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Health',ti:'Mixed Health and Disease Questions',su:'Integrated questions across all Y12-HEA-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Malaria: Plasmodium, Anopheles, fever from RBC rupture, ACT treatment, bed nets. HIV: retrovirus, T-helper cells, CD4<200=AIDS, ART. TB: Mycobacterium, airborne, granuloma, RIPE. Immunity: non-specific (phagocytosis, inflammation) + specific (B cells, antibodies, T cells, memory). Vaccines: antigen \u2192 memory cells \u2192 rapid secondary response.</p>'},
  {lb:'WAEC integration: disease in Nigeria/West Africa',dr:dQ10,ht:'<p>WAEC regularly tests diseases of West African relevance: malaria (major burden), HIV/AIDS, TB, schistosomiasis, onchocerciasis, sleeping sickness, meningococcal meningitis, typhoid, cholera. For each: know causative agent, vector (if any), mode of transmission, symptoms, treatment, prevention. Prioritise diseases with local significance; link pathophysiology to treatment and prevention strategies.</p>'},
  {lb:'Calculation: herd immunity threshold',dr:dQ10,ht:'<div class="fm">Herd immunity threshold (HIT) = 1 \u2212 1/R\u2080</div><p>Example: measles R\u2080 = 15. HIT = 1 \u2212 1/15 = 0.933 = 93.3%. COVID-19 (original): R\u2080 = 2.5. HIT = 1 \u2212 1/2.5 = 0.6 = 60%. Omicron R\u2080 = 10\u201315. HIT = 90\u201393%.</p>'},
  {lb:'WAEC question types',dr:dQ10,ht:'<p>Common WAEC questions: describe the life cycle of Plasmodium; explain how HIV causes AIDS; describe the non-specific and specific immune responses; explain how vaccines work; describe Koch\u2019s postulates; compare bacterial and viral diseases; describe cholera transmission and treatment; evaluate methods of malaria control.</p>'},
