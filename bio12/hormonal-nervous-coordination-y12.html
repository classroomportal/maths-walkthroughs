:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}

body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}

.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}

.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}

.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}

.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Nervous vs hormonal coordination','#2E7D32',12,'middle',true));
o.push(R(10,34,222,210,'#F1F8F1','#2E7D32',2));o.push(T(121,52,'NERVOUS','#2E7D32',11,'middle',true));
o.push(R(248,34,222,210,'#F1F8F1','#2E7D32',2));o.push(T(359,52,'HORMONAL','#2E7D32',11,'middle',true));
var nv=['Electrical impulse (action potential)','Via neurones','Very fast (up to 120 m/s)','Localised response','Short-lived effect','No target organ specificity needed','Reflex arcs for rapid response'];
var ho=['Chemical messenger (hormone)','Via blood stream','Slower (seconds to minutes)','Widespread/diffuse response','Long-lasting effect','Target cells have specific receptors','Used for long-term regulation'];
nv.forEach(function(v,i){if(i<p+1)o.push(T(121,70+i*22,v,'#333',7,'middle',false));});
ho.forEach(function(v,i){if(i<p+1)o.push(T(359,70+i*22,v,'#333',7,'middle',false));});

o.push(T(240,20,'Neuron structure and types','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,52,'#F1F8F1','#2E7D32',1.5));o.push(T(240,56,'Motor neuron: long axon from CNS to effector; cell body in CNS','#333',10,'middle',false));o.push(T(240,74,'Sensory neuron: long dendron from receptor; cell body in dorsal root ganglion','#555',8,'middle',false));}
if(p>=2){o.push(R(10,102,460,52,'#F1F8F1','#2E7D32',1.5));o.push(T(240,120,'Relay neuron: in CNS; short axon and dendrites; connects sensory to motor','#333',10,'middle',false));o.push(T(240,138,'All neurons: cell body (soma), axon, dendrites, myelin sheath (Schwann cells)','#555',8,'middle',false));}
if(p>=3){o.push(R(10,166,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,184,'Myelinated axons: faster conduction (saltatory, node to node)','#333',10,'middle',false));o.push(T(240,200,'Multiple sclerosis: myelin sheath damaged \u2192 slowed/blocked transmission','#555',8,'middle',false));}
if(p>=4){o.push(R(10,222,460,30,'#C8E6C9','#2E7D32',1));o.push(T(240,240,'CNS: brain + spinal cord. PNS: somatic (voluntary) + autonomic (involuntary)','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Action potential','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,52,'Resting potential: \u221270 mV inside negative; maintained by Na\u207a/K\u207a ATPase pump','#333',10,'middle',false));o.push(T(240,70,'(pumps 3 Na\u207a out, 2 K\u207a in per cycle; K\u207a leaks back)','#555',8,'middle',false));}
if(p>=2){o.push(R(10,90,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,104,'Depolarisation: stimulus \u2192 Na\u207a channels open \u2192 Na\u207a rush in \u2192 inside \u2192 +30 mV','#333',10,'middle',false));o.push(T(240,122,'Action potential: threshold \u2265 \u221255 mV must be reached (all-or-nothing)','#555',8,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,156,'Repolarisation: Na\u207a channels close; K\u207a channels open \u2192 K\u207a leaves \u2192 inside negative','#333',10,'middle',false));o.push(T(240,174,'Hyperpolarisation: K\u207a channels slow to close \u2192 brief overshoot below \u221270 mV','#555',8,'middle',false));}
if(p>=4){o.push(R(10,194,460,54,'#C8E6C9','#2E7D32',1));o.push(T(240,212,'Absolute refractory period: Na\u207a channels inactivated; no new AP possible','#2E7D32',9,'middle',false));o.push(T(240,228,'Relative refractory: large stimulus can trigger AP; determines max frequency','#555',8,'middle',false));o.push(T(240,244,'Propagation: depolarised region repolarises; local currents depolarise next region','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Synaptic transmission','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,56,'AP arrives at presynaptic terminal \u2192 voltage-gated Ca\u00b2\u207a channels open','#333',10,'middle',false));o.push(T(240,74,'Ca\u00b2\u207a floods in \u2192 vesicles fuse with membrane \u2192 ACh released by exocytosis','#555',8,'middle',false));}
if(p>=2){o.push(R(10,90,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,104,'ACh diffuses across cleft \u2192 binds nicotinic receptors on postsynaptic membrane','#333',10,'middle',false));o.push(T(240,122,'Na\u207a channels open \u2192 depolarisation \u2192 EPSP (excitatory postsynaptic potential)','#555',8,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,156,'Acetylcholinesterase in cleft hydrolyses ACh \u2192 choline + acetate (deactivates signal)','#333',10,'middle',false));o.push(T(240,174,'Choline reabsorbed by presynaptic terminal; resynthesised with acetyl-CoA','#555',8,'middle',false));}
if(p>=4){o.push(R(10,194,460,54,'#C8E6C9','#2E7D32',1));o.push(T(240,212,'Spatial summation: multiple synapses fire together','#333',9,'middle',false));o.push(T(240,228,'Temporal summation: same synapse fires rapidly','#555',8,'middle',false));o.push(T(240,244,'IPSP: inhibitory; Cl\u207b influx \u2192 hyperpolarise; makes AP less likely','#555',8,'middle',false));}
s.innerHTML=o.join('');}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Coordination summary','#2E7D32',13,'middle',true));
[['Resting potential','\u221270 mV; Na\u207a/K\u207a pump; K\u207a leakage channels'],['Action potential','threshold (\u221255 mV); Na\u207a in (depolarise); K\u207a out (repolarise); all-or-nothing'],['Synapse','Ca\u00b2\u207a\u2192vesicle release\u2192ACh\u2192receptor\u2192EPSP; AChE degrades ACh'],['Reflex arc','receptor\u2192sensory\u2192relay\u2192motor\u2192effector; rapid, involuntary'],['Hormone action','receptor binding \u2192 second messenger (cAMP) or direct gene activation'],['Sympathetic NS','fight or flight; adrenaline; \u2191HR, \u2191BP, dilate pupils, bronchodilation'],['Parasympathetic NS','rest and digest; ACh; \u2193HR, stimulate digestion, constrict pupils']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F1F8F1','#C8E6C9',1));o.push(T(110,52+i*30,r[0],'#2E7D32',10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Coordination',ti:'Nervous vs Hormonal Coordination',su:'Compare nervous and hormonal coordination in detail.',steps:[
  {lb:'Overview comparison',dr:dQ1,ht:'<p>Both systems coordinate body responses to stimuli but use different mechanisms. Nervous: fast, precise, short-lived, electrical impulses via neurones. Hormonal: slower, widespread, long-lasting, chemical messengers via blood. Often work together: e.g. adrenaline (hormone) + sympathetic NS both prepare body for fight-or-flight simultaneously.</p>'},
  {lb:'Nervous system organisation',dr:dQ1,ht:'<p><b>CNS:</b> brain + spinal cord; integration centre. <b>PNS:</b> sensory + motor neurones. <b>Somatic NS:</b> voluntary control of skeletal muscle. <b>Autonomic NS:</b> involuntary (heart, smooth muscle, glands); divided into <b>sympathetic</b> (fight-or-flight; noradrenaline/adrenaline) and <b>parasympathetic</b> (rest-and-digest; acetylcholine). Dual innervation: most organs receive both; antagonistic control.</p>'},
  {lb:'Endocrine system organisation',dr:dQ1,ht:'<p>Endocrine glands secrete hormones into blood. <b>Hypothalamus:</b> master controller; produces releasing hormones \u2192 anterior pituitary \u2192 tropic hormones \u2192 target glands. <b>Negative feedback:</b> target gland hormone inhibits hypothalamus and pituitary. Examples: thyroid axis (TRH \u2192 TSH \u2192 thyroxine); adrenal axis (CRH \u2192 ACTH \u2192 cortisol); gonadal axis (GnRH \u2192 FSH/LH \u2192 oestrogen/testosterone).</p>'},
  {lb:'Integration of systems',dr:dQ1,ht:'<p>Neuroendocrine integration: hypothalamus bridges nervous and endocrine systems. Example: stress \u2192 hypothalamus stimulates sympathetic NS (immediate response: adrenaline from adrenal medulla) AND stimulates HPA axis (sustained: cortisol from adrenal cortex). Cortisol: raises blood glucose, suppresses immunity, increases alertness. Both systems work in concert for coordinated response.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Nervous coordination differs from hormonal because: 1=it uses chemicals in the blood, 2=it uses electrical impulses along neurones and is faster and more localised.',a:2,w:'Nervous: electrical impulses, fast, localised. Hormonal: chemicals in blood, slower, widespread. Answer: 2.'},{q:'The parasympathetic nervous system uses which neurotransmitter? 1=noradrenaline, 2=acetylcholine (ACh).',a:2,w:'Parasympathetic: ACh at all synapses. Sympathetic: noradrenaline at effector (ACh at ganglion). Answer: 2.'},{q:'The hypothalamus controls the anterior pituitary by releasing: 1=tropic hormones directly into blood, 2=releasing hormones into a portal blood system to the pituitary.',a:2,w:'Hypothalamus: releasing hormones into hypothalamo-hypophyseal portal system \u2192 anterior pituitary. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Nervous: fast, electrical, local. Hormonal: slow, chemical, widespread. Parasympathetic: ACh.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Coordination',ti:'Neurone Structure and Reflex Arc',su:'Describe neurone types and the pathway of a spinal reflex arc.',steps:[
  {lb:'Neurone types',dr:dQ2,ht:'<p><b>Sensory (afferent) neurone:</b> long dendron from receptor (skin, sense organ) to cell body (dorsal root ganglion); long axon to spinal cord. <b>Relay (interneurone):</b> entirely within CNS; short processes; many synaptic connections; integration. <b>Motor (efferent) neurone:</b> long axon from CNS to effector (muscle or gland); cell body in CNS (anterior horn of spinal cord).</p>'},
  {lb:'Myelination and conduction speed',dr:dQ2,ht:'<p><b>Myelin sheath:</b> formed by Schwann cells (PNS) or oligodendrocytes (CNS) wrapping around axon. Nodes of Ranvier: gaps between Schwann cells; ion exchange occurs here. <b>Saltatory conduction:</b> action potential jumps from node to node (much faster than continuous conduction). Myelinated: up to 120 m/s. Unmyelinated: 0.5\u20132 m/s. Pain fibres: unmyelinated (slow, dull ache) vs fast myelinated (sharp, immediate).</p>'},
  {lb:'Spinal reflex arc',dr:dQ2,ht:'<p>Rapid, involuntary response to stimulus. Pathway: <b>receptor</b> (detects stimulus) \u2192 <b>sensory neurone</b> (afferent, dorsal root) \u2192 <b>relay neurone</b> (spinal cord dorsal horn) \u2192 <b>motor neurone</b> (ventral root) \u2192 <b>effector</b> (muscle/gland). Response occurs before conscious awareness. Withdrawal reflex protects from harm. Reflex arc can be modified by higher brain centres.</p>'},
  {lb:'Synaptic connections in reflex',dr:dQ2,ht:'<p>The relay neurone in the spinal cord also sends impulses to the brain (conscious perception of pain after reflex). Reciprocal inhibition: flexor reflex contracts flexor AND inhibits antagonist extensor muscle (via inhibitory interneurone). Crossed extensor reflex: opposite limb extends to maintain balance when one withdraws. Understanding reflex arcs important for WAEC neurophysiology questions.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'In a spinal reflex arc, the correct order is: 1=receptor\u2192motor\u2192relay\u2192sensory\u2192effector, 2=receptor\u2192sensory\u2192relay\u2192motor\u2192effector.',a:2,w:'Receptor (detects) \u2192 sensory neurone \u2192 relay neurone (CNS) \u2192 motor neurone \u2192 effector. Answer: 2.'},{q:'Saltatory conduction in myelinated neurones means: 1=the AP travels continuously along the axon surface, 2=the AP jumps from node of Ranvier to node of Ranvier, increasing speed.',a:2,w:'Saltatory (from Latin saltare, to jump): AP jumps between nodes \u2192 faster, less energy. Answer: 2.'},{q:'Sensory neurones have their cell body located in: 1=the ventral horn of the spinal cord, 2=the dorsal root ganglion.',a:2,w:'Sensory neurone: cell body in dorsal root ganglion (outside CNS). Motor: cell body in ventral horn. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Reflex arc: receptor\u2192sensory\u2192relay\u2192motor\u2192effector. Sensory cell body: dorsal root ganglion. Saltatory: jumps between nodes.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Coordination',ti:'The Action Potential',su:'Describe the action potential in detail. Explain the all-or-nothing principle and refractory periods.',steps:[
  {lb:'Resting potential',dr:dQ3,ht:'<p>At rest: inside of axon is \u221270 mV relative to outside. Maintained by: (1) <b>Na\u207a/K\u207a ATPase pump:</b> 3 Na\u207a out + 2 K\u207a in per cycle (uses ATP); net positive charge outside. (2) <b>K\u207a leak channels:</b> K\u207a diffuses out (down concentration gradient) \u2192 inside becomes negative. (3) Large organic anions inside cell cannot leave.</p>'},
  {lb:'Depolarisation and threshold',dr:dQ3,ht:'<p>Stimulus received \u2192 some voltage-gated Na\u207a channels open \u2192 Na\u207a rushes in \u2192 inside becomes less negative. <b>Threshold</b> (~\u221255 mV): if reached, all remaining Na\u207a channels open simultaneously \u2192 rapid depolarisation to +30 mV. <b>All-or-nothing:</b> AP either fires fully (+30 mV) or not at all; size independent of stimulus strength. Strength encoded by frequency of APs, not amplitude.</p>'},
  {lb:'Repolarisation and hyperpolarisation',dr:dQ3,ht:'<p>At peak (+30 mV): Na\u207a channels inactivate (close). Voltage-gated <b>K\u207a channels</b> open \u2192 K\u207a rushes out \u2192 inside becomes negative again (repolarisation). K\u207a channels slow to close \u2192 <b>hyperpolarisation</b> (briefly more negative than \u221270 mV). Na\u207a/K\u207a pump restores resting ion concentrations (takes slightly longer).</p>'},
  {lb:'Refractory periods and propagation',dr:dQ3,ht:'<p><b>Absolute refractory period:</b> Na\u207a channels inactivated; cannot trigger new AP regardless of stimulus strength; ensures unidirectional propagation and limits frequency. <b>Relative refractory period:</b> Na\u207a channels recovered but K\u207a channels still open; larger-than-normal stimulus needed; limits maximum frequency. <b>Propagation:</b> depolarised region generates local currents \u2192 depolarises adjacent membrane \u2192 AP moves along (unidirectional because region behind is refractory).</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'The all-or-nothing principle of action potentials means: 1=the size of the AP varies with stimulus strength, 2=the AP either fires at full amplitude or not at all \u2014 threshold must be reached.',a:2,w:'All-or-nothing: once threshold reached, full AP fires. Stimulus strength encoded by frequency. Answer: 2.'},{q:'During the absolute refractory period: 1=a very large stimulus can trigger a new AP, 2=no AP can be generated regardless of stimulus strength.',a:2,w:'Absolute refractory: Na\u207a channels inactivated; no AP possible. Relative: very large stimulus works. Answer: 2.'},{q:'The resting potential (\u221270 mV) is maintained mainly by: 1=K\u207a leaking out and the Na\u207a/K\u207a pump, 2=Na\u207a leaking in continuously.',a:1,w:'Na\u207a/K\u207a pump (3 Na\u207a out, 2 K\u207a in) + K\u207a leak channels \u2192 inside negative. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['All-or-nothing: threshold needed. Absolute refractory: no AP. Resting: Na\u207a/K\u207a pump + K\u207a leak.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Coordination',ti:'Synaptic Transmission',su:'Describe chemical synaptic transmission. Explain summation and inhibition.',steps:[
  {lb:'Steps of synaptic transmission',dr:dQ4,ht:'<p>1. AP arrives at <b>presynaptic terminal</b> (axon bulb). 2. Depolarisation opens <b>voltage-gated Ca\u00b2\u207a channels</b>; Ca\u00b2\u207a flows into terminal. 3. Ca\u00b2\u207a triggers <b>synaptic vesicle fusion</b> with presynaptic membrane (exocytosis). 4. <b>Acetylcholine (ACh)</b> released into synaptic cleft (~20 nm). 5. ACh binds <b>nicotinic ACh receptors</b> on postsynaptic membrane \u2192 ligand-gated Na\u207a channels open \u2192 Na\u207a in \u2192 EPSP (excitatory postsynaptic potential).</p>'},
  {lb:'Neurotransmitter removal',dr:dQ4,ht:'<p>ACh is broken down rapidly by <b>acetylcholinesterase (AChE)</b> in the synaptic cleft \u2192 choline + acetate. Choline reabsorbed by presynaptic terminal; resynthesised to ACh with acetyl-CoA. This prevents continuous stimulation. <b>Drugs affecting synapses:</b> nerve agents (sarin, VX): irreversibly inhibit AChE \u2192 continuous ACh \u2192 overstimulation. Organophosphate pesticides: similar mechanism. Atropine: blocks muscarinic ACh receptors.</p>'},
  {lb:'Summation and inhibition',dr:dQ4,ht:'<p><b>Spatial summation:</b> simultaneous EPSPs from multiple presynaptic terminals \u2192 combined depolarisation may reach threshold. <b>Temporal summation:</b> rapid repeated firing of one terminal \u2192 EPSPs summate before previous decays. <b>Inhibitory postsynaptic potential (IPSP):</b> inhibitory neurotransmitter (GABA) opens Cl\u207b channels \u2192 Cl\u207b in \u2192 hyperpolarisation \u2192 harder to reach threshold. Balance of EPSPs and IPSPs determines whether AP fires.</p>'},
  {lb:'Other neurotransmitters',dr:dQ4,ht:'<p>Noradrenaline (norepinephrine): sympathetic NS effector synapses; \u03b1 and \u03b2 adrenergic receptors. <b>Dopamine:</b> reward, motor control; Parkinson\u2019s (dopamine-producing cells destroyed \u2192 tremor, rigidity). <b>Serotonin (5-HT):</b> mood, sleep; SSRIs block reuptake \u2192 antidepressant. <b>GABA:</b> main inhibitory NT; benzodiazepines enhance GABA \u2192 anxiolytic/sedative. <b>Glutamate:</b> main excitatory NT in CNS.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Ca\u00b2\u207a ions are essential for synaptic transmission because: 1=they generate the action potential, 2=they trigger vesicle fusion and release of neurotransmitter.',a:2,w:'Ca\u00b2\u207a influx \u2192 vesicle-membrane fusion \u2192 exocytosis of ACh into cleft. Answer: 2.'},{q:'Acetylcholinesterase functions to: 1=synthesise acetylcholine, 2=break down acetylcholine in the cleft, terminating the signal.',a:2,w:'AChE: hydrolyses ACh \u2192 choline + acetate; prevents continuous receptor activation. Answer: 2.'},{q:'Nerve agents like sarin cause death by: 1=blocking ACh receptors, 2=inhibiting AChE \u2192 ACh accumulates \u2192 continuous overstimulation of muscles and glands.',a:2,w:'AChE inhibition \u2192 ACh not broken down \u2192 continuous EPSP \u2192 muscle spasm, seizures, respiratory failure. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Ca\u00b2\u207a: vesicle release. AChE: breaks down ACh. Nerve agents: inhibit AChE.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Coordination',ti:'Sense Organs',su:'Describe structure and function of the eye and ear.',steps:[
  {lb:'The eye',dr:dQ5,ht:'<p><b>Cornea:</b> transparent; refracts light (~70% of refraction). <b>Lens:</b> variable refraction for near/far objects (accommodation). <b>Iris/pupil:</b> controls light entry (circular + radial muscles, antagonistic, regulated by ANS). <b>Retina:</b> photoreceptors: <b>rods</b> (dim light, monochromatic, peripheral, rhodopsin) + <b>cones</b> (colour, bright light, central, 3 types: red/green/blue, iodopsin). Fovea: cone-rich; highest acuity. Blind spot: optic disc (no receptors).</p>'},
  {lb:'Accommodation and defects',dr:dQ5,ht:'<p><b>Accommodation:</b> near object \u2192 ciliary muscles contract \u2192 zonule fibres relax \u2192 lens thickens (more convex) \u2192 greater refraction. Far object \u2192 ciliary muscles relax \u2192 zonules taut \u2192 lens flattens. <b>Myopia (short sight):</b> image focused in front of retina; corrected with concave lens. <b>Hyperopia (long sight):</b> image behind retina; convex lens. <b>Astigmatism:</b> irregular cornea; cylindrical lens. Presbyopia: lens loses elasticity with age.</p>'},
  {lb:'The ear',dr:dQ5,ht:'<p><b>Outer ear:</b> pinna + auditory canal \u2192 tympanic membrane (eardrum). <b>Middle ear:</b> ossicles (malleus, incus, stapes) amplify and transmit vibrations to oval window. <b>Inner ear:</b> cochlea (hearing) \u2192 basilar membrane vibrates; hair cells (mechanoreceptors); different frequencies at different positions (high frequency at base). Semicircular canals: balance/rotation; utricle/saccule: gravity/linear acceleration.</p>'},
  {lb:'Transduction in rods',dr:dQ5,ht:'<p>Rods contain <b>rhodopsin</b> (opsin + retinal, vitamin A derivative). Light \u2192 retinal changes shape (cis\u2192trans) \u2192 opsin activated \u2192 G-protein cascade (transducin) \u2192 phosphodiesterase \u2192 cGMP hydrolysed \u2192 Na\u207a channels close \u2192 rod hyperpolarises \u2192 less glutamate released \u2192 bipolar cells depolarise \u2192 signal to ganglion cells \u2192 optic nerve. Convergence of rods: many rods share one ganglion cell \u2192 sensitive, low acuity.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Near vision (accommodation) requires: 1=ciliary muscles to relax, making the lens thin, 2=ciliary muscles to contract, relaxing zonule fibres so the lens becomes more convex.',a:2,w:'Near: ciliary muscles contract \u2192 zonules relax \u2192 lens rounds up \u2192 more refractive power. Answer: 2.'},{q:'Rods are used in dim light because: 1=they are more numerous and sensitive (many converge on one ganglion cell), but give lower acuity, 2=they detect colour better than cones.',a:1,w:'Rods: more sensitive (summation), rhodopsin sensitive, monochromatic. Cones: colour, high acuity. Answer: 1.'},{q:'Short-sightedness (myopia) is corrected with: 1=a convex (converging) lens, 2=a concave (diverging) lens.',a:2,w:'Myopia: eyeball too long; image in front of retina. Concave lens diverges rays to correct this. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Near vision: ciliary contracts, lens rounds. Rods: sensitive, low acuity. Myopia: concave lens.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Coordination',ti:'Endocrine System — Hormone Mechanisms',su:'Describe how steroid and peptide hormones act at the molecular level.',steps:[
  {lb:'Peptide and protein hormones',dr:dQ6,ht:'<p>Peptide hormones (insulin, glucagon, ADH, oxytocin, FSH, LH, adrenaline): water-soluble; cannot cross lipid membrane; bind <b>cell-surface receptors</b>. Receptor activation \u2192 second messenger system: e.g. adenylate cyclase \u2192 cAMP \u2192 protein kinase A \u2192 enzyme phosphorylation cascade. Effect is rapid (seconds to minutes) but short-lived.</p>'},
  {lb:'Steroid hormones',dr:dQ6,ht:'<p>Steroid hormones (oestrogen, testosterone, cortisol, aldosterone, progesterone, ecdysone in insects): lipid-soluble; cross cell membrane; bind <b>intracellular receptors</b>. Hormone-receptor complex enters nucleus \u2192 binds hormone response elements (HREs) on DNA \u2192 alters gene transcription \u2192 new protein synthesis. Effect slower (hours) but longer-lasting (genes switched on/off).</p>'},
  {lb:'cAMP second messenger pathway',dr:dQ6,ht:'<p>Adrenaline/glucagon mechanism: hormone binds G-protein coupled receptor (GPCR) \u2192 G-protein activated \u2192 adenylate cyclase converts ATP \u2192 cAMP \u2192 activates protein kinase A (PKA) \u2192 cascade of phosphorylation reactions. Amplification: one hormone molecule \u2192 many cAMP \u2192 many PKA \u2192 millions of product molecules. cAMP degraded by phosphodiesterase (limits response). Caffeine inhibits phosphodiesterase \u2192 sustained response.</p>'},
  {lb:'Thyroid hormones and growth hormone',dr:dQ6,ht:'<p><b>Thyroxine (T4):</b> iodine-containing; amino acid-derived but lipid-soluble; crosses membrane; binds nuclear receptor; increases metabolic rate (regulates BMR). <b>Growth hormone (GH):</b> peptide from anterior pituitary; stimulates IGF-1 from liver; promotes bone/muscle growth; increases blood glucose. <b>Melatonin:</b> pineal gland; regulates circadian rhythms; derived from serotonin (tryptophan).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Steroid hormones act by: 1=binding cell-surface receptors and activating cAMP, 2=entering the cell, binding intracellular receptors and altering gene transcription.',a:2,w:'Steroids: lipid-soluble \u2192 cross membrane \u2192 intracellular receptor \u2192 hormone-receptor complex \u2192 nucleus \u2192 gene expression. Answer: 2.'},{q:'The amplification of a hormonal signal via cAMP occurs because: 1=each hormone molecule can activate many G-proteins and generate many cAMP molecules, each activating many enzymes, 2=hormones travel faster in blood.',a:1,w:'cAMP: cascade amplification; 1 hormone \u2192 many cAMP \u2192 many PKA \u2192 millions of product. Answer: 1.'},{q:'Thyroxine differs from most peptide hormones because: 1=it binds nuclear receptors and regulates gene expression (similar to steroids), 2=it cannot be detected in blood.',a:1,w:'Thyroxine: lipid-soluble; binds nuclear receptor; alters gene transcription. Unique among amino acid-derived hormones. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Steroid: nuclear receptor, gene expression. Peptide: cell-surface, cAMP. cAMP: amplification cascade.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Coordination',ti:'The Brain',su:'Describe the structure and functions of the major brain regions.',steps:[
  {lb:'Cerebrum',dr:dQ7,ht:'<p><b>Cerebrum</b> (cerebral cortex): largest region; two hemispheres; grey matter (neurone cell bodies) on surface; white matter (myelinated axons) below. Functions: sensory perception, voluntary movement, memory, learning, reasoning, language (Broca\u2019s area: speech production; Wernicke\u2019s: language comprehension). Lobes: frontal (planning, personality), parietal (somatosensory), temporal (hearing, memory), occipital (vision).</p>'},
  {lb:'Cerebellum and brainstem',dr:dQ7,ht:'<p><b>Cerebellum:</b> posterior; coordinates smooth movement, balance, posture, muscle tone; receives info from muscles and joints (proprioceptors) and cerebrum. Damage \u2192 ataxia. <b>Medulla oblongata:</b> controls autonomic functions: breathing (respiratory centre), heart rate (cardiovascular centre), swallowing, vomiting, blood pressure. <b>Pons:</b> relay between cerebrum and cerebellum; assists breathing.</p>'},
  {lb:'Hypothalamus and limbic system',dr:dQ7,ht:'<p><b>Hypothalamus:</b> master homeostatic control; thermoregulation, hunger, thirst, circadian rhythms, autonomic NS control; produces ADH and oxytocin (released from posterior pituitary); controls anterior pituitary via portal blood (releasing hormones). <b>Limbic system:</b> hippocampus (memory formation, spatial navigation), amygdala (fear, emotion, emotional memory), thalamus (relay station for sensory information to cortex).</p>'},
  {lb:'Imaging and WAEC application',dr:dQ7,ht:'<p>Brain imaging: CT (X-ray, structure), MRI (magnetic field, soft tissue detail), fMRI (blood flow \u2192 activity), EEG (electrical activity). WAEC: understand role of each region, link damage to loss of function. Example: stroke in Broca\u2019s area \u2192 expressive aphasia (cannot speak but understands). Cerebellar lesion \u2192 uncoordinated movement. Hypothalamic damage \u2192 temperature dysregulation, diabetes insipidus.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'The cerebellum coordinates: 1=conscious thought and memory, 2=smooth movement, posture and balance.',a:2,w:'Cerebellum: receives proprioceptive input; coordinates smooth, accurate movement; balance. Answer: 2.'},{q:'The medulla oblongata controls: 1=voluntary skeletal muscle movement, 2=autonomic functions such as breathing and heart rate.',a:2,w:'Medulla: respiratory and cardiovascular centres; involuntary control. Answer: 2.'},{q:'Broca\'s area, if damaged, results in: 1=inability to understand language, 2=expressive aphasia (difficulty producing speech).',a:2,w:'Broca\u2019s: speech production. Damage \u2192 expressive aphasia. Wernicke\u2019s: comprehension. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Cerebellum: movement coordination. Medulla: autonomic. Broca\u2019s: speech production.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Coordination',ti:'Drugs and the Nervous System',su:'Describe how drugs affect synaptic transmission.',steps:[
  {lb:'Drug mechanisms at synapses',dr:dQ8,ht:'<p>Drugs affect synaptic transmission by: (1) Mimicking neurotransmitters (agonists); (2) Blocking receptors (antagonists); (3) Inhibiting neurotransmitter breakdown; (4) Blocking reuptake of neurotransmitter; (5) Blocking ion channels; (6) Affecting neurotransmitter synthesis or release. Most drugs of abuse act on the mesolimbic dopamine system (reward pathway).</p>'},
  {lb:'Specific drug examples',dr:dQ8,ht:'<p><b>Nicotine:</b> binds nicotinic ACh receptors (agonist); stimulates; highly addictive; \u2191dopamine. <b>Morphine/heroin:</b> opioid receptor agonists; inhibit pain pathways; highly addictive. <b>Cocaine:</b> blocks dopamine reuptake \u2192 dopamine accumulates in synapse \u2192 euphoria; addictive. <b>SSRIs</b> (fluoxetine): block serotonin reuptake; antidepressant. <b>Benzodiazepines:</b> enhance GABA (inhibitory) \u2192 anxiolytic, sedative.</p>'},
  {lb:'Addiction and tolerance',dr:dQ8,ht:'<p><b>Tolerance:</b> reduced response to drug with repeated use; more drug needed for same effect (receptor downregulation, increased enzyme degradation). <b>Dependence:</b> physiological need (withdrawal symptoms on cessation). <b>Addiction:</b> compulsive drug-seeking despite harm; involves long-term changes in gene expression and synaptic strength (neuroplasticity) in reward circuits. WAEC: relate addiction to dopamine pathway.</p>'},
  {lb:'Alcohol and CNS depressants',dr:dQ8,ht:'<p><b>Ethanol:</b> enhances GABA (inhibitory) \u2192 CNS depression (slurred speech, impaired coordination, drowsiness). Inhibits glutamate (excitatory). Chronic use: liver cirrhosis, Wernicke-Korsakoff syndrome (thiamine deficiency), cerebellar atrophy. <b>Anaesthetics:</b> general (inhalation: enhance GABA, inhibit glutamate); local (e.g. lidocaine: block Na\u207a channels in sensory neurones \u2192 no AP).</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'SSRIs treat depression by: 1=increasing dopamine synthesis, 2=blocking serotonin reuptake, increasing serotonin availability in the synapse.',a:2,w:'SSRI = Selective Serotonin Reuptake Inhibitor; blocks reuptake transporter \u2192 serotonin stays in cleft longer. Answer: 2.'},{q:'Local anaesthetics work by: 1=blocking Na\u207a channels in sensory neurones, preventing action potentials, 2=increasing GABA.',a:1,w:'Local anaesthetics (lidocaine): block voltage-gated Na\u207a channels \u2192 no depolarisation \u2192 no AP \u2192 no pain signal. Answer: 1.'},{q:'Drug tolerance develops because: 1=the drug becomes less pure over time, 2=the nervous system adapts (e.g. receptor downregulation), requiring more drug for the same effect.',a:2,w:'Tolerance: receptor number/sensitivity decreases with repeated exposure; withdrawal reverses adaptations. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['SSRI: blocks serotonin reuptake. Local anaesthetics: block Na\u207a channels. Tolerance: receptor downregulation.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Coordination',ti:'Plant Responses and Tropisms',su:'Describe plant responses to stimuli: phototropism, gravitropism and thigmotropism.',steps:[
  {lb:'Plant hormones overview',dr:dQ9,ht:'<p>Plants have no nervous system; use hormones for coordination. Main hormones: <b>Auxins (IAA):</b> produced in shoot tip; promote elongation in stem, inhibit in root; responsible for tropisms. <b>Gibberellins:</b> stem elongation, seed germination, fruit development. <b>Cytokinins:</b> cell division, delay senescence. <b>Abscisic acid (ABA):</b> stress hormone; stomatal closure; seed dormancy. <b>Ethylene:</b> fruit ripening, leaf abscission.</p>'},
  {lb:'Phototropism',dr:dQ9,ht:'<p>Shoot bends <b>toward light</b> (positive phototropism). Mechanism: light causes IAA to redistribute to shaded side (Cholodny-Went theory). Shaded side: more IAA \u2192 more elongation \u2192 shoot bends toward light. Evidence: Went\u2019s agar block experiments with oat coleoptiles. Root: negative phototropism (grows away from light) because roots are inhibited by IAA concentrations that stimulate shoots.</p>'},
  {lb:'Gravitropism and thigmotropism',dr:dQ9,ht:'<p><b>Gravitropism (geotropism):</b> roots are positively gravitropic (grow down); shoots negatively gravitropic (grow up). IAA accumulates on lower side; in shoots: lower side elongates \u2192 curves upward; in roots: root more sensitive to IAA \u2192 lower side inhibited \u2192 curves downward. <b>Thigmotropism:</b> response to touch; tendrils coil around support; cells on touching side elongate less.</p>'},
  {lb:'Commercial applications of plant hormones',dr:dQ9,ht:'<p>IAA (rooting powder): promotes root formation from cuttings. Gibberellins: increase fruit size (seedless grapes), break seed dormancy, induce germination of barley (beer production). Ethylene: synchronise fruit ripening (banana); promote leaf fall. ABA: control seed dormancy in storage. Synthetic auxins (2,4-D): selective weedkiller (kills broad-leaved weeds, not grasses). Cytokinins: tissue culture medium (with auxin ratio determines shoot/root formation).</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'In phototropism, the shoot bends toward light because: 1=IAA moves to the illuminated side and promotes elongation there, 2=IAA moves to the shaded side, causing greater elongation there.',a:2,w:'IAA: redistribution to shaded side \u2192 more elongation on shaded side \u2192 shoot bends toward light. Answer: 2.'},{q:'Roots are more sensitive to IAA than shoots. This means: 1=high IAA concentrations that promote shoot growth inhibit root growth, 2=roots respond the same as shoots.',a:1,w:'High IAA: promotes shoot elongation but inhibits root elongation (roots have lower optimum). Answer: 1.'},{q:'Gibberellins are used commercially to: 1=kill weeds, 2=increase fruit size and break seed dormancy (e.g. in brewing and seedless grape production).',a:2,w:'Gibberellins: stem elongation, fruit size (\u2191grape), germination (barley), dormancy breaking. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['IAA: shaded side elongates. Roots: sensitive, inhibited by high IAA. Gibberellins: fruit size, germination.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Coordination',ti:'Mixed Coordination Questions',su:'Integrated questions across all Y12-HUM-03 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Action potential: \u221270mV\u21920\u2192+30\u2192repolarise. All-or-nothing. Synapse: Ca\u00b2\u207a\u2192ACh\u2192EPSP; AChE degrades. Hormones: peptide (cell surface, cAMP) vs steroid (nuclear receptor, gene expression). Brain: cerebellum (coordination), medulla (autonomic), hypothalamus (homeostasis).</p>'},
  {lb:'WAEC integration: comparing levels',dr:dQ10,ht:'<p>WAEC often asks how nervous and hormonal systems interact. Key examples: (1) Pain \u2192 reflex arc (nervous, fast) + enkephalin/endorphin release (hormonal, longer lasting). (2) Stress \u2192 sympathetic NS (immediate) + HPA axis cortisol (sustained). (3) Childbirth \u2192 stretch receptors/oxytocin (positive feedback combining both). Always link structure to function in answers.</p>'},
  {lb:'Calculations: conduction velocity',dr:dQ10,ht:'<div class="fm">Conduction velocity (m/s) = distance (m) / time (s)</div><p>Example: AP travels 0.5 m in 5 ms. Velocity = 0.5 / 0.005 = 100 m/s. Myelinated A fibres: 70\u2013120 m/s. Unmyelinated C fibres: 0.5\u20132 m/s. Fibre diameter also affects speed (larger = faster).</p>'},
  {lb:'WAEC question types',dr:dQ10,ht:'<p>Common WAEC questions: describe the sequence of events at a synapse; explain the all-or-nothing law; compare nervous and hormonal coordination; describe the role of IAA in phototropism; explain how the action potential is generated and propagated; describe the functions of named brain regions. Practice drawing labelled diagrams of a synapse, reflex arc, and neurone.</p>'},
