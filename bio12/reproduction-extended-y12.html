<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}

.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}

.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}

.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}

.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}

.btn.p{background:var(--red);color:#fff;}

.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Reproductive strategies comparison','#2E7D32',13,'middle',true));
o.push(R(10,36,222,210,'#F1F8F1','#2E7D32',2));o.push(T(121,54,'SEXUAL','#2E7D32',11,'middle',true));
o.push(R(248,36,222,210,'#F1F8F1','#2E7D32',2));o.push(T(359,54,'ASEXUAL','#2E7D32',11,'middle',true));

var ax=['One parent only','Mitosis','Offspring genetically identical (clones)','Faster, less energy required','Stable environments; well-adapted parent','Vulnerable: disease can wipe out all','Examples: bacteria, yeast, Amoeba, bulbs, runners'];
sx.forEach(function(v,i){if(i<p+1)o.push(T(121,72+i*22,v,'#333',7,'middle',false));});

o.push(T(240,20,'Gametogenesis','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,222,90,'#F1F8F1','#2E7D32',1.5));o.push(T(121,56,'SPERMATOGENESIS','#2E7D32',10,'middle',true));o.push(T(121,72,'Testes; seminiferous tubules','#555',8,'middle',false));o.push(T(121,86,'Spermatogonium (2n) \u2192 primary spermatocyte (2n)','#333',7,'middle',false));o.push(T(121,100,'Meiosis I \u2192 2 secondary spermatocytes (n)','#333',7,'middle',false));o.push(T(121,114,'Meiosis II \u2192 4 spermatids (n) \u2192 spermatozoa','#333',7,'middle',false));}
if(p>=2){o.push(R(248,38,222,90,'#F1F8F1','#2E7D32',1.5));o.push(T(359,56,'OOGENESIS','#2E7D32',10,'middle',true));o.push(T(359,72,'Ovaries; unequal division','#555',8,'middle',false));o.push(T(359,86,'Oogonium (2n) \u2192 primary oocyte (2n)','#333',7,'middle',false));o.push(T(359,100,'Meiosis I: secondary oocyte + 1st polar body','#333',7,'middle',false));o.push(T(359,114,'Meiosis II (if fertilised): ovum + 2nd polar body','#333',7,'middle',false));}
if(p>=3){o.push(R(10,142,460,44,'#C8E6C9','#2E7D32',1));o.push(T(240,158,'Sperm: small, motile; millions produced daily; fertilises egg','#333',9,'middle',false));o.push(T(240,176,'Egg: large (food store), few produced; arrested in meiosis II until fertilisation','#555',8,'middle',false));}
if(p>=4){o.push(R(10,200,460,44,'#F1F8F1','#2E7D32',1));o.push(T(240,216,'Acrosome reaction: acrosin digests zona pellucida for sperm entry','#333',9,'middle',false));o.push(T(240,234,'Cortical reaction: Ca\u00b2\u207a release \u2192 cortical granules harden ZP \u2192 polyspermy block','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Fertilisation and early development','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,54,'Fertilisation: sperm + egg \u2192 zygote (2n). Usually in fallopian tube','#333',10,'middle',false));o.push(T(240,72,'Acrosome reaction (zona penetration) \u2192 cortical reaction (polyspermy block)','#555',8,'middle',false));}
if(p>=2){o.push(R(10,90,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,106,'Cleavage: rapid mitosis (cell number \u2191, size stays same)','#333',10,'middle',false));o.push(T(240,124,'Morula (16 cells) \u2192 blastocyst (inner cell mass + trophoblast)','#555',8,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,158,'Implantation: day 7\u201310; trophoblast invades endometrium','#333',10,'middle',false));o.push(T(240,176,'hCG secreted: maintains corpus luteum \u2192 progesterone continues','#555',8,'middle',false));}
if(p>=4){o.push(R(10,194,460,54,'#C8E6C9','#2E7D32',1));o.push(T(240,212,'Gastrulation: 3 germ layers: ectoderm, mesoderm, endoderm','#2E7D32',9,'middle',true));o.push(T(240,228,'Ectoderm: skin, nervous system. Mesoderm: muscle, bone, blood. Endoderm: gut lining, lungs','#555',8,'middle',false));o.push(T(240,244,'Organogenesis follows: neural tube, heart, limb buds develop','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Reproductive technologies','#2E7D32',12,'middle',true));
[['IVF','superovulation \u2192 egg collection \u2192 in vitro fertilisation \u2192 culture \u2192 embryo transfer'],['PGD','preimplantation genetic diagnosis; screen embryos for genetic disorders before implantation'],['ICSI','intracytoplasmic sperm injection; single sperm injected directly into egg'],['Surrogacy','embryo implanted in surrogate mother; gestational or traditional'],['Artificial insemination','sperm deposited in reproductive tract without intercourse; used in livestock'],['Cloning (SCNT)','somatic cell nuclear transfer; nucleus from body cell in enucleated egg; Dolly']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(90,55+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(330,55+i*33,r[1],'#555',8,'middle',false));}});

o.push(T(240,20,'Reproduction summary','#2E7D32',13,'middle',true));
[['Sexual reproduction','meiosis + fertilisation; variation; two parents'],['Asexual reproduction','mitosis; clones; one parent; faster in stable environments'],['Spermatogenesis','4 spermatozoa from 1 primary spermatocyte (2n)'],['Oogenesis','1 egg + 3 polar bodies; arrested in meiosis II'],['Polyspermy block','cortical reaction; ZP hardening; Ca\u00b2\u207a release'],['Blastocyst','inner cell mass (embryo) + trophoblast (placenta); implants day 7\u201310'],['Germ layers','ectoderm (skin/NS), mesoderm (muscle/bone), endoderm (gut/lungs)']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F1F8F1','#C8E6C9',1));o.push(T(120,52+i*30,r[0],'#2E7D32',10,'middle',true));o.push(T(330,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Reproduction',ti:'Sexual vs Asexual Reproduction',su:'Compare sexual and asexual reproduction in detail.',steps:[
  {lb:'Sexual reproduction advantages',dr:dQ1,ht:'<p>Sexual reproduction: two parents; meiosis produces haploid gametes; fertilisation restores diploid number; offspring genetically unique (variation from crossing over, independent assortment, random fertilisation). Advantages: genetic variation \u2192 natural selection can act \u2192 adaptation to changing environments; disease resistance varied. Disadvantages: requires mate; slower; only females reproduce (twofold cost of sex); energy costly.</p>'},
  {lb:'Asexual reproduction types',dr:dQ1,ht:'<p>Asexual: one parent; mitosis; offspring = genetic clones. Types: binary fission (bacteria), budding (yeast, Hydra), fragmentation (starfish, Planaria), vegetative propagation (bulbs, runners, rhizomes, tubers), sporulation (fungi), parthenogenesis (some insects, lizards, fish: eggs develop without fertilisation). Advantages: fast, all offspring reproduce, no mate needed, efficient in stable environments.</p>'},
  {lb:'Alternation of generations',dr:dQ1,ht:'<p>Many organisms combine both: ferns, mosses, cnidarians. <b>Alternation of generations</b> in plants: sporophyte (diploid, 2n) alternates with gametophyte (haploid, n). Sporophyte produces spores (by meiosis) \u2192 gametophyte produces gametes (by mitosis) \u2192 fertilisation \u2192 sporophyte. In mosses: gametophyte dominant. In ferns/gymnosperms/angiosperms: sporophyte dominant. Understanding this links plant life cycles to meiosis.</p>'},
  {lb:'Parthenogenesis and unusual reproductive strategies',dr:dQ1,ht:'<p><b>Parthenogenesis:</b> egg develops without fertilisation. Haploid (e.g. male bees, wasps, ants) or diploid (e.g. some lizards, turkeys, certain fish). Advantages: rapid reproduction; all-female populations. <b>Hermaphroditism:</b> both sexes in one organism; simultaneous (earthworms, snails) or sequential (some fish change sex). <b>External fertilisation:</b> gametes shed into water (fish, frogs); large numbers of gametes needed (fertilisation chance low). <b>Internal fertilisation:</b> gametes meet inside female; fewer eggs needed; more parental care.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Sexual reproduction produces genetic variation primarily through: 1=mutations only, 2=crossing over, independent assortment of chromosomes, and random fertilisation.',a:2,w:'Three sources: crossing over (meiosis I), independent assortment (2^23 combinations), random fertilisation. Answer: 2.'},{q:'Asexual reproduction is advantageous when: 1=the environment is changing rapidly, 2=the environment is stable and the parent is well-adapted.',a:2,w:'Stable environment: clones (all like well-adapted parent) colonise quickly. Changing: variation needed. Answer: 2.'},{q:'Parthenogenesis produces offspring from: 1=two parents\u2019 gametes fusing, 2=an unfertilised egg that develops into a new organism.',a:2,w:'Parthenogenesis: egg develops without sperm fertilisation; e.g. male honeybees (haploid). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Variation: crossing over + independent assortment + random fertilisation. Asexual: stable environments. Parthenogenesis: no fertilisation.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Reproduction',ti:'Gametogenesis',su:'Describe spermatogenesis and oogenesis in detail. Compare sperm and egg structure.',steps:[
  {lb:'Spermatogenesis',dr:dQ2,ht:'<p>In seminiferous tubules of testes. Spermatogonium (2n, stem cell) \u2192 mitosis \u2192 primary spermatocyte (2n) \u2192 meiosis I \u2192 2 secondary spermatocytes (n) \u2192 meiosis II \u2192 4 spermatids (n) \u2192 spermiogenesis (differentiation) \u2192 4 spermatozoa. Testosterone (from Leydig cells) and FSH (from pituitary) regulate. Sertoli cells: support spermatids. Continuous from puberty; ~1500 sperm/sec in adult human.</p>'},
  {lb:'Oogenesis',dr:dQ2,ht:'<p>In ovarian follicles. Oogonium \u2192 primary oocyte (2n) \u2192 meiosis begins in foetal life \u2192 arrested in prophase I until puberty. At ovulation: LH surge \u2192 meiosis I resumes \u2192 secondary oocyte (n) + 1st polar body. Secondary oocyte arrested in metaphase II \u2192 ovulated. Fertilisation: meiosis II completed \u2192 ovum (n) + 2nd polar body. All polar bodies degenerate. Result: 1 large egg with all cytoplasm.</p>'},
  {lb:'Sperm structure and adaptations',dr:dQ2,ht:'<p>Sperm: head (haploid nucleus + acrosome containing hydrolytic enzymes: hyaluronidase, acrosin); midpiece (mitochondria in helix \u2192 ATP for flagellum); flagellum (9+2 microtubule arrangement; propulsion). Produced in millions (compensates for losses in female tract). Capacitation: sperm undergo changes in female reproductive tract making them capable of fertilisation.</p>'},
  {lb:'Fertilisation events',dr:dQ2,ht:'<p>1. Sperm reach egg; zona pellucida (ZP) binds sperm (species-specific). 2. <b>Acrosome reaction:</b> acrosome fuses with sperm plasma membrane; enzymes released; digest ZP. 3. Sperm plasma membrane fuses with egg membrane. 4. <b>Cortical reaction</b> (polyspermy block): Ca\u00b2\u207a wave \u2192 cortical granules fuse with egg membrane \u2192 contents harden ZP (zona reaction) \u2192 prevents second sperm entry. 5. Meiosis II completed. 6. Pronuclei fuse \u2192 diploid zygote.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Oogenesis differs from spermatogenesis in that: 1=oogenesis produces 4 equal cells, 2=oogenesis produces 1 large egg and 3 small polar bodies (unequal cytoplasm division), with meiosis arrested until fertilisation.',a:2,w:'Oogenesis: unequal division (all cytoplasm to egg); arrested in meiosis II; completed only if fertilised. Answer: 2.'},{q:'The cortical reaction prevents polyspermy by: 1=blocking the acrosome of all sperm, 2=releasing cortical granule contents that harden the zona pellucida, preventing additional sperm from penetrating.',a:2,w:'Cortical reaction: Ca\u00b2\u207a wave \u2192 granule exocytosis \u2192 ZP modifications \u2192 polyspermy block. Answer: 2.'},{q:'The acrosome in sperm contains: 1=DNA for fertilisation, 2=hydrolytic enzymes that digest the zona pellucida, allowing sperm to penetrate the egg.',a:2,w:'Acrosome: hyaluronidase + acrosin digest ZP. Without acrosome reaction, sperm cannot penetrate. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Oogenesis: 1 egg + 3 polar bodies; arrested in meiosis II. Cortical reaction: ZP hardened. Acrosome: digestive enzymes.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Reproduction',ti:'Early Development',su:'Describe fertilisation through to gastrulation and germ layer formation.',steps:[
  {lb:'Cleavage and blastocyst',dr:dQ3,ht:'<p>After fertilisation, zygote undergoes rapid mitotic divisions (cleavage): 2 \u2192 4 \u2192 8 \u2192 16 cells (morula, solid ball). Cell size decreases with each division (total volume same). ~Day 4: morula becomes blastocyst: fluid-filled cavity (blastocoel) forms; two cell types: <b>inner cell mass (ICM)</b> = embryo proper; <b>trophoblast</b> = outer layer = forms placenta and extra-embryonic membranes.</p>'},
  {lb:'Implantation',dr:dQ3,ht:'<p>Day 6\u20137: blastocyst sheds zona pellucida; trophoblast invades endometrium (implantation). Trophoblast differentiates into cytotrophoblast and syncytiotrophoblast (invades deeply; erodes maternal blood vessels \u2192 access to maternal blood supply). trophoblast secretes hCG (from day 8\u201310) \u2192 maintains corpus luteum \u2192 progesterone continued \u2192 endometrium maintained. Detected by pregnancy tests from ~day 14.</p>'},
  {lb:'Gastrulation and germ layers',dr:dQ3,ht:'<p>~Week 3: gastrulation converts bilaminar into trilaminar disc. ICM cells form epiblast \u2192 primitive streak forms \u2192 cells migrate through (ingress) \u2192 form three primary germ layers: <b>Ectoderm</b> (outer: skin, nervous system, sense organs, pituitary). <b>Mesoderm</b> (middle: muscle, bone, cartilage, blood, kidneys, gonads, heart). <b>Endoderm</b> (inner: gut epithelium, liver, pancreas, respiratory epithelium, thyroid, bladder).</p>'},
  {lb:'Organogenesis and development',dr:dQ3,ht:'<p><b>Neurulation:</b> neural plate folds to form neural tube \u2192 brain and spinal cord. <b>Somites:</b> mesodermal blocks \u2192 vertebrae, muscles. Heart: first functional organ (~day 22). Limb buds appear week 4\u20135. By week 8: all major organ systems present (foetus); most sensitive period for teratogens (drugs, alcohol, radiation, infection like rubella). Placenta fully functional ~week 10\u201312: replaces corpus luteum as progesterone source.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'The trophoblast cells of the blastocyst give rise to: 1=the embryo itself (brain, heart, etc.), 2=the placenta and extra-embryonic membranes.',a:2,w:'Trophoblast: forms chorion, placenta, amnion, yolk sac. ICM \u2192 embryo proper. Answer: 2.'},{q:'Neural tube defects (e.g. spina bifida) result from failure of: 1=gastrulation, 2=the neural plate to fold and close correctly during neurulation.',a:2,w:'Neural tube: neural plate folds \u2192 closes \u2192 brain+spinal cord. Failure \u2192 spina bifida/anencephaly. Prevented by folic acid. Answer: 2.'},{q:'The mesoderm gives rise to: 1=the nervous system and skin, 2=muscle, bone, blood and the kidneys.',a:2,w:'Mesoderm: muscle, skeleton, circulatory system, kidneys, gonads, dermis. Ectoderm: skin, NS. Endoderm: gut. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Trophoblast: placenta. Neural tube: neurulation (neural plate folds). Mesoderm: muscle, bone, blood.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Reproduction',ti:'The Placenta',su:'Describe the structure and functions of the placenta.',steps:[
  {lb:'Placenta structure',dr:dQ4,ht:'<p>Placenta: developed from trophoblast (foetal) + decidua basalis (maternal endometrium). Chorionic villi: finger-like projections of foetal tissue; contain foetal capillaries; bathed in maternal blood (intervillous space). Very large SA (~14 m\u00b2). Foetal and maternal blood DO NOT MIX (separated by placental barrier = 2\u20133 cell layers). Umbilical cord: 2 arteries (deoxygenated from foetus) + 1 vein (oxygenated to foetus).</p>'},
  {lb:'Placental functions',dr:dQ4,ht:'<p>(1) <b>Gas exchange:</b> O\u2082 diffuses maternal\u2192foetal blood; CO\u2082 foetal\u2192maternal. Foetal Hb (higher O\u2082 affinity) ensures uptake from maternal blood. (2) <b>Nutrient transfer:</b> glucose, amino acids, fatty acids, vitamins, water cross to foetus. (3) <b>Waste removal:</b> CO\u2082, urea pass to maternal blood. (4) <b>Immunoglobulin transfer:</b> IgG crosses to foetus (passive immunity for first months after birth). (5) <b>Hormone production:</b> from ~week 12, placenta produces progesterone (replaces corpus luteum), oestrogen, hPL, hCG.</p>'},
  {lb:'Placental barrier and harmful substances',dr:dQ4,ht:'<p>Most bacteria, RBCs, most large proteins: cannot cross. Viruses: some cross (HIV, CMV, rubella virus). Drugs: most lipid-soluble drugs cross (alcohol, nicotine, heroin, thalidomide \u2014 caused limb deformities in 1960s). IgG: crosses by receptor-mediated transcytosis (provides neonatal immunity). Carbon monoxide (smoking): crosses; reduces O\u2082 transport; causes IUGR (intrauterine growth restriction). Alcohol: FAS (foetal alcohol syndrome).</p>'},
  {lb:'Pregnancy complications',dr:dQ4,ht:'<p><b>Pre-eclampsia:</b> hypertension + proteinuria after 20 weeks; defective placentation; oedema; risk of eclampsia (seizures). Treatment: antihypertensives, magnesium sulfate; delivery if severe. <b>Placenta praevia:</b> placenta overlies cervix; painless antepartum haemorrhage; Caesarean delivery. <b>IUGR:</b> small foetus due to placental insufficiency. <b>Ectopic pregnancy:</b> implantation outside uterus (usually fallopian tube); medical emergency.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Foetal and maternal blood do not mix in the placenta because: 1=blood types would be incompatible, 2=they are separated by the placental barrier (chorionic villi walls), though substances diffuse across.',a:2,w:'Placenta: foetal capillaries in villi bathed in maternal blood in intervillous space; exchange by diffusion/active transport; no direct mixing. Answer: 2.'},{q:'Foetal haemoglobin (HbF) has higher O\u2082 affinity than adult Hb (HbA). This allows: 1=the foetus to release O\u2082 to the placenta, 2=O\u2082 to transfer from maternal blood to foetal blood at the placenta.',a:2,w:'HbF: higher affinity \u2192 loads O\u2082 at lower pO\u2082; steals O\u2082 from maternal HbA in placenta. Answer: 2.'},{q:'Alcohol is dangerous in pregnancy because: 1=it is too large to cross the placenta, 2=it crosses the placental barrier and causes foetal alcohol syndrome (brain damage, growth restriction, facial abnormalities).',a:2,w:'Alcohol: lipid-soluble; crosses placenta freely; teratogenic; FAS. No safe level in pregnancy. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Placental barrier: exchange without mixing. HbF: higher O\u2082 affinity steals O\u2082. Alcohol: lipid-soluble, crosses placenta.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Reproduction',ti:'Plant Reproduction — Extended',su:'Describe sexual reproduction in flowering plants in detail.',steps:[
  {lb:'Angiosperm life cycle',dr:dQ5,ht:'<p>Flowering plant (angiosperm) sexual reproduction: meiosis in flower \u2192 pollen grains (male gametophyte, n) and embryo sac (female gametophyte, n). Pollination: pollen transferred to stigma. Germination: pollen tube grows down style. <b>Double fertilisation:</b> one sperm nucleus + egg \u2192 zygote (2n, embryo); one sperm nucleus + 2 polar nuclei \u2192 endosperm (3n, food store). Unique to angiosperms and Ephedra (gymnosperms).</p>'},
  {lb:'Pollen and embryo sac',dr:dQ5,ht:'<p>Pollen grain: generative nucleus + tube nucleus (or 2 sperm cells in mature pollen). <b>Embryo sac</b> (female gametophyte): 8-nucleate, 7-celled structure: 3 antipodal cells, 2 synergids, 1 egg cell, central cell with 2 polar nuclei. Synergids: guide pollen tube entry; secrete attractants. Antipodal cells: unclear function (may nourish). Central cell + 2 polar nuclei \u2192 after fertilisation \u2192 3n endosperm.</p>'},
  {lb:'From fertilisation to seed',dr:dQ5,ht:'<p>After double fertilisation: zygote (2n) \u2192 embryo (by mitosis); endosperm (3n) \u2192 food reserve in seed; ovule \u2192 seed; ovary wall \u2192 fruit (pericarp). Embryo: radicle (root), plumule (shoot), cotyledon(s). Seed: embryo + endosperm + testa (seed coat, from integuments). Fruit: protects and aids dispersal. WAEC: draw and label T.S. of ovary/seed after fertilisation.</p>'},
  {lb:'Germination and seedling development',dr:dQ5,ht:'<p>Germination requires: water, oxygen, suitable temperature (NOT light for most). Water activates enzymes; gibberellins stimulate amylase production in aleurone layer of cereal seeds \u2192 starch \u2192 sugars for respiration. Cotyledons: hypogeal (remain underground, bean) or epigeal (rise above soil, pea, bean alternative). Seedling: root grows first (positive geotropism) then shoot (negative geotropism).</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Double fertilisation is unique to angiosperms because: 1=they have two parents, 2=one sperm fertilises the egg (forming diploid zygote) and a second sperm fertilises the polar nuclei (forming triploid endosperm).',a:2,w:'Double fertilisation: sperm 1 + egg \u2192 2n zygote (embryo); sperm 2 + 2 polar nuclei \u2192 3n endosperm. Answer: 2.'},{q:'The endosperm in a seed develops from: 1=the fertilised egg cell, 2=the fusion of one sperm nucleus with the two polar nuclei (triploid, 3n).',a:2,w:'Endosperm: 3n (1n sperm + 2n from 2 polar nuclei); food store for embryo. Answer: 2.'},{q:'Germination requires oxygen because: 1=it is needed for photosynthesis, 2=the seedling respires aerobically to produce ATP for growth.',a:2,w:'Germination: aerobic respiration using seed food reserves (starch, oil, protein) \u2192 ATP for cell division and elongation. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Double fertilisation: embryo (2n) + endosperm (3n). Endosperm: 3n food store. Germination: aerobic respiration.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Reproduction',ti:'Reproductive Hormones — Extended',su:'Describe the hormonal control of the menstrual cycle, pregnancy and parturition.',steps:[
  {lb:'Menstrual cycle hormones',dr:dQ6,ht:'<p>FSH (anterior pituitary): stimulates follicle development; oestrogen secretion. Oestrogen (growing follicle): repairs endometrium; at high concentration \u2192 positive feedback \u2192 LH surge. LH surge: triggers ovulation; corpus luteum formation. Progesterone (corpus luteum): maintains endometrium; inhibits FSH/LH (negative feedback). If no pregnancy: corpus luteum degenerates \u2192 progesterone falls \u2192 menstruation.</p>'},
  {lb:'Pregnancy hormones',dr:dQ6,ht:'<p>hCG (trophoblast, from ~day 8): maintains corpus luteum \u2192 progesterone continues \u2192 no menstruation; basis of pregnancy test. ~Week 12: placenta takes over progesterone + oestrogen production; corpus luteum regresses. Progesterone + oestrogen: suppress FSH/LH throughout pregnancy (no new cycle); prepare breasts. hPL (human placental lactogen): alters maternal metabolism; insulin antagonist \u2192 more glucose for foetus. Relaxin: loosens pelvic ligaments; cervix softens.</p>'},
  {lb:'Parturition (birth)',dr:dQ6,ht:'<p>Parturition triggered by: foetal cortisol production \u2192 maternal prostaglandins \u2192 uterine contractions begin. Positive feedback: contractions \u2192 stretch receptors in cervix \u2192 oxytocin from posterior pituitary \u2192 stronger contractions \u2192 more stretch \u2192 more oxytocin (runs to completion). Progesterone levels fall; oestrogen promotes oxytocin receptors. Stages: (1) dilation, (2) expulsion (delivery), (3) placental stage.</p>'},
  {lb:'Lactation',dr:dQ6,ht:'<p>Milk production: prolactin (anterior pituitary); stimulated by suckling; inhibited during pregnancy by high oestrogen/progesterone. Milk ejection: oxytocin (posterior pituitary); released by suckling reflex; contracts myoepithelial cells around alveoli. Colostrum (first milk): high IgA, IgG, white cells, protein, low fat; passive immunity to neonate. Breast-feeding: prolactin inhibits GnRH \u2192 anovulation (natural child spacing). WHO recommends exclusive breastfeeding for 6 months.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'hCG is important in early pregnancy because: 1=it stimulates contractions, 2=it prevents corpus luteum degeneration, maintaining progesterone production to keep the endometrium.',a:2,w:'hCG: rescues corpus luteum; continued progesterone \u2192 endometrium maintained; no menstruation. Answer: 2.'},{q:'Parturition involves positive feedback because: 1=cortisol from foetus reduces contractions, 2=uterine contractions stretch the cervix \u2192 more oxytocin released \u2192 stronger contractions, amplifying until birth.',a:2,w:'Oxytocin-contraction positive feedback: amplifies until baby delivered; then feedback loop ends. Answer: 2.'},{q:'Prolactin inhibits ovulation during breastfeeding because: 1=it directly blocks the ovaries, 2=prolactin suppresses GnRH from the hypothalamus, reducing FSH and LH release.',a:2,w:'Prolactin \u2192 suppresses GnRH \u2192 less FSH/LH \u2192 no follicle development \u2192 anovulation. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['hCG: saves corpus luteum. Parturition: oxytocin positive feedback. Prolactin: suppresses GnRH \u2192 anovulation.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Reproduction',ti:'Assisted Reproductive Technologies',su:'Evaluate IVF, ICSI, PGD and surrogacy.',steps:[
  {lb:'IVF procedure',dr:dQ7,ht:'<p>In vitro fertilisation (IVF): (1) Superovulation: FSH injections \u2192 multiple follicles. (2) Trigger injection (hCG): final maturation. (3) Egg collection: transvaginal ultrasound-guided aspiration. (4) Sperm sample: washed and concentrated. (5) Fertilisation: eggs + sperm mixed in dish (or ICSI: single sperm injected). (6) Embryo culture: 3\u20135 days to blastocyst. (7) Embryo transfer: 1\u20132 embryos replaced in uterus. (8) Luteal support: progesterone. Success rate: ~30\u201340% per cycle under 35.</p>'},
  {lb:'ICSI and embryo selection',dr:dQ7,ht:'<p>ICSI (intracytoplasmic sperm injection): single sperm selected and injected directly into egg cytoplasm with micromanipulator. Indicated for: severe male infertility (low count, poor motility, no acrosome reaction), previous IVF fertilisation failure. <b>Preimplantation genetic diagnosis (PGD/PGT):</b> biopsy of 1\u20132 cells from Day 3 embryo or trophectoderm from blastocyst; PCR or array-CGH tests for genetic conditions, chromosomal abnormalities; only healthy embryos transferred.</p>'},
  {lb:'Ethical considerations',dr:dQ7,ht:'<p>Ethical issues: (1) Surplus embryos: status; research vs destruction. (2) Multiple pregnancy: risk from multiple transfer. (3) PGD: selecting against disability (eugenics concerns); sex selection for non-medical reasons. (4) Older mothers. (5) Commercial surrogacy: exploitation concerns. (6) Donor eggs/sperm: anonymity, donor-conceived persons\u2019 rights. (7) Access and equity: expensive; mainly available to wealthy. Religious objections (IVF in some faiths).</p>'},
  {lb:'Success factors and limitations',dr:dQ7,ht:'<p>IVF success: maternal age is strongest predictor. Under 35: ~40% per cycle. Over 42: <5%. Cumulative success over multiple cycles higher. Limitation: invasive, expensive (~\u00a35000-10000/cycle UK, much more in Nigeria), emotional burden, physical side effects (OHSS: ovarian hyperstimulation syndrome). <b>Cryopreservation:</b> spare embryos/eggs frozen in liquid N\u2082; can be used in subsequent cycles; fertility preservation before cancer treatment.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'ICSI is used instead of standard IVF when: 1=the eggs are difficult to retrieve, 2=there is severe male infertility (very low or poorly motile sperm) or previous failed fertilisation.',a:2,w:'ICSI: single sperm injected; bypasses need for natural fertilisation; used in male factor infertility. Answer: 2.'},{q:'PGD (preimplantation genetic diagnosis) allows couples to: 1=choose the sex of a child for any reason, 2=identify and select embryos free from known genetic conditions before implantation.',a:2,w:'PGD: screen for serious genetic conditions (CF, Huntington\u2019s, chromosomal abnormalities); select unaffected embryos. Answer: 2.'},{q:'A key ethical concern with creating surplus IVF embryos is: 1=the cost of storage, 2=the moral status of the embryo and what should happen to embryos not used for transfer.',a:2,w:'Moral status: if embryo has full human status from fertilisation, creating/destroying surplus raises profound ethical questions. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['ICSI: male infertility. PGD: screen for genetic conditions. Surplus embryos: ethical debate.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Reproduction',ti:'Reproductive Patterns Across Taxa',su:'Compare reproductive strategies in different animal groups.',steps:[
  {lb:'Oviparous, viviparous, ovoviviparous',dr:dQ8,ht:'<p><b>Oviparous:</b> lay eggs outside body; embryo develops in egg; most fish, amphibia, reptiles, birds, monotremes (platypus, echidna). Eggs range from unprotected (fish: many small eggs) to highly protected (birds: albumen + shell). <b>Viviparous:</b> live birth; embryo nourished by mother via placenta; most mammals. <b>Ovoviviparous:</b> eggs retained inside mother but nourished by yolk (no placenta); some sharks, guppies, scorpions. <b>Marsupials:</b> brief gestation \u2192 underdeveloped young in pouch.</p>'},
  {lb:'r vs K selection',dr:dQ8,ht:'<p>r-selected species (opportunist): fast growth, many small offspring, little parental care, short lifespan, boom-bust populations; exploit temporary resources; e.g. insects, annual plants, mice, bacteria. K-selected species (equilibrium): slow growth, few large offspring, extensive parental care, long lifespan, populations near carrying capacity K; stable environments; e.g. elephants, humans, whales, large trees. Continuum, not absolute categories.</p>'},
  {lb:'Parental care',dr:dQ8,ht:'<p>Parental care: energetically costly; increases offspring survival. Ranges from: none (broadcast spawning fish) to decades (humans). Tradeoff: more care per offspring \u2192 fewer offspring. Types: incubation (birds), brooding in mouth (cichlids), pouch (marsupials, seahorse \u2014 male), cooperative breeding (meerkats, African wild dogs: helpers at the nest). Kin selection theory explains helpers (related individuals share fitness benefit).</p>'},
  {lb:'Reproductive cycles and seasonality',dr:dQ8,ht:'<p>Reproductive timing: synchronised with seasons to maximise offspring survival. Cues: photoperiod (day length), temperature, food availability. Short-day breeders (deer, sheep): breed in autumn (long nights). Long-day breeders (horses, birds): breed in spring/summer. Melatonin (pineal gland): signals night length; mediates seasonal reproduction. Continuous breeding: humans, rats, some tropical species (food available year-round). Monoestrous (once/yr: bears) vs polyestrous (multiple cycles/yr: dogs).</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'An r-selected species is characterised by: 1=few offspring with extensive parental care, 2=many small offspring with little parental care, rapid development, and high mortality rate.',a:2,w:'r-selection: many offspring, little care, short lifespan; exploits temporary abundant resources. Answer: 2.'},{q:'Marsupials differ from placental mammals in reproduction because: 1=they lay eggs, 2=they have a very short gestation period and young complete development in an external pouch.',a:2,w:'Marsupials: brief gestation \u2192 tiny, underdeveloped joey \u2192 pouch; placenta is simple/short-lived. Answer: 2.'},{q:'Photoperiod (day length) is used by many animals to time reproduction because: 1=it affects food directly, 2=it is a reliable predictor of season, helping animals time breeding when conditions are optimal for offspring survival.',a:2,w:'Photoperiod: predictable; melatonin signals night length \u2192 seasonal reproductive physiology. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['r-selection: many offspring, little care. Marsupials: short gestation, pouch. Photoperiod: reliable season predictor.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Reproduction',ti:'Stem Cell Biology',su:'Describe sources and applications of stem cells in medicine.',steps:[
  {lb:'Types of stem cells',dr:dQ9,ht:'<p><b>Totipotent:</b> can give rise to embryonic and extra-embryonic structures; zygote and cells up to 16-cell stage. <b>Pluripotent:</b> can give rise to any body cell type; embryonic stem cells (from ICM of blastocyst, 5\u20137 days). <b>Multipotent:</b> restricted to cell types of one lineage; adult stem cells (haematopoietic: bone marrow; mesenchymal: marrow/fat; neural stem cells). <b>Induced pluripotent stem cells (iPSC):</b> adult cells reprogrammed to pluripotency (Yamanaka, 2006; Nobel 2012).</p>'},
  {lb:'Applications',dr:dQ9,ht:'<p>Current clinical: haematopoietic stem cell transplant (bone marrow transplant): treats leukaemia, lymphoma, aplastic anaemia. Skin grafts from stem cells. Limbal stem cells (eye: corneal regeneration). In clinical trials: Parkinson\u2019s (dopaminergic neurons from iPSC), type 1 diabetes (beta-cells from hESC), spinal cord injury, macular degeneration (retinal pigment epithelium from iPSC). iPSC: patient\u2019s own cells \u2192 no rejection; but safety concerns (tumour formation).</p>'},
  {lb:'Ethical issues',dr:dQ9,ht:'<p>hESC: require destruction of blastocyst; ethical controversy. iPSC: avoid embryo destruction; patient-specific; overcome ethical objection. Safety: undifferentiated cells cause teratomas; must ensure complete differentiation. Regulatory framework: HFEA (UK); strict guidelines on embryo research (14-day rule: embryo not kept beyond 14 days). Debate about extending 14-day rule for research. Commercialisation of stem cell therapies: unregulated clinics offering unproven treatments.</p>'},
  {lb:'Disease modelling and drug testing',dr:dQ9,ht:'<p>iPSC from patients with disease \u2192 differentiate into affected cell type \u2192 model disease in vitro. Examples: iPSC from Parkinson\u2019s patients \u2192 dopaminergic neurons \u2192 study disease mechanism; test drugs. <b>Organoids:</b> 3D mini-organs grown from stem cells (intestinal organoid, brain organoid, liver organoid); better disease models than 2D cultures; could replace some animal testing. CRISPR + iPSC: correct disease-causing mutation in patient cells \u2192 transplant back (gene therapy + stem cell therapy combined).</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'Induced pluripotent stem cells (iPSC) are generated by: 1=extracting cells from embryos, 2=reprogramming adult somatic cells back to a pluripotent state using transcription factors (Yamanaka factors: Oct4, Sox2, Klf4, c-Myc).',a:2,w:'iPSC: Yamanaka 2006; retroviruses deliver 4 transcription factors into adult cells \u2192 pluripotency re-established. Nobel Prize 2012. Answer: 2.'},{q:'iPSC have an advantage over embryonic stem cells because: 1=they are less potent, 2=they can be derived from the patient\'s own cells, avoiding immune rejection and not requiring embryo destruction.',a:2,w:'iPSC: autologous (patient\u2019s own); no rejection; no ethical issue of embryo use. Answer: 2.'},{q:'Organoids are useful for drug testing because: 1=they are large enough to implant into patients, 2=they are 3D mini-organ structures that better replicate in vivo tissue architecture than 2D cell cultures.',a:2,w:'Organoids: 3D structure; cell polarity; tissue architecture; more physiologically relevant; reduces animal testing. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['iPSC: Yamanaka factors reprogram adult cells. iPSC: autologous, no embryo. Organoids: 3D, better models.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Reproduction',ti:'Mixed Reproduction Questions',su:'Integrated questions across all Y12-REP-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Sexual: variation (crossing over, independent assortment). Oogenesis: 1 egg+3 polar bodies; arrested in meiosis II. Fertilisation: acrosome reaction + cortical reaction. Placenta: exchange, HbF, hormones (progesterone from wk12). Double fertilisation: embryo (2n) + endosperm (3n). iPSC: adult cells reprogrammed. hCG: maintains corpus luteum.</p>'},
  {lb:'WAEC integration',dr:dQ10,ht:'<p>WAEC tests: compare sexual and asexual reproduction; describe spermatogenesis/oogenesis with diagrams; explain the acrosome and cortical reactions; describe functions of the placenta; explain IVF procedure; describe double fertilisation; distinguish r from K selection. Always draw labelled diagrams when describing structures; define terms precisely.</p>'},
  {lb:'WAEC essay technique: reproduction',dr:dQ10,ht:'<p>For essays on reproduction: (1) Define the term; (2) Describe the process step-by-step; (3) Name specific hormones/cells/structures; (4) State the significance (why it matters); (5) Give a specific example. For comparison questions: use a table with clear criteria. Avoid vague statements; use precise biological terminology throughout.</p>'},
  {lb:'Calculations: fertility statistics',dr:dQ10,ht:'<div class="fm">Success rate (%) = successful cycles / total cycles \u00d7 100</div><div class="fm">Chromosome number in gamete = 2n / 2 = n</div><p>Human: 2n=46, n=23. After meiosis: 23 chromosomes. After fertilisation: 46 restored. Polar bodies: n (23 chromosomes, same as egg).</p>'},
