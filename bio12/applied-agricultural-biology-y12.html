<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Food production and agriculture','#2E7D32',13,'middle',true));
[['Crop improvement','selective breeding, hybridisation, GM crops, mutation breeding'],['Pest management','pesticides, biological control, IPM, resistant varieties'],['Soil management','fertilisers (organic/inorganic), pH, tillage, crop rotation'],['Irrigation','drip (efficient), sprinkler, flood; prevents waterlogging'],['Post-harvest','storage, food preservation, processing to reduce spoilage'],['Biotechnology','tissue culture, cloning, GM organisms, bioremediation']].forEach(function(r,i){if(i<p+1){o.push(R(10,40+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(130,57+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(340,57+i*33,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Biological control','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,42,'#F1F8F1','#2E7D32',1.5));o.push(T(240,54,'Use of living organisms to control pests','#333',10,'middle',true));o.push(T(240,72,'Advantages: specific, self-sustaining, no chemical residues, no resistance','#555',8,'middle',false));}
if(p>=2){o.push(R(10,92,460,42,'#F1F8F1','#2E7D32',1.5));o.push(T(240,108,'Examples: Encarsia wasp \u2192 controls whitefly; Bacillus thuringiensis \u2192 kills caterpillars','#333',10,'middle',false));o.push(T(240,126,'Myxomatosis virus \u2192 rabbits; Cane toad (Australia) \u2014 disastrous example','#555',8,'middle',false));}
if(p>=3){o.push(R(10,148,460,42,'#F1F8F1','#2E7D32',1.5));o.push(T(240,164,'Disadvantages: slow, may not eradicate pest, may become invasive','#333',10,'middle',false));o.push(T(240,182,'May attack non-target species; requires research and monitoring','#555',8,'middle',false));}
if(p>=4){o.push(R(10,204,460,40,'#C8E6C9','#2E7D32',1));o.push(T(240,220,'IPM: Integrated Pest Management = combine biological + chemical + cultural methods','#2E7D32',9,'middle',false));o.push(T(240,236,'Use pesticides only when necessary; minimise ecological impact','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Microorganisms in food production','#2E7D32',12,'middle',true));
[['Yoghurt','Lactobacillus; ferments lactose \u2192 lactic acid; lowers pH; milk proteins denature'],['Cheese','Lactobacillus + rennet (chymosin); curds separated from whey; matured'],['Bread','Saccharomyces cerevisiae (yeast); anaerobic: glucose \u2192 CO\u2082 + ethanol; CO\u2082 raises dough'],['Beer/wine','Yeast fermentation; anaerobic; glucose \u2192 ethanol + CO\u2082; hops for flavour in beer'],['Vinegar','Acetobacter oxidises ethanol \u2192 ethanoic acid; aerobic fermentation'],['Mycoprotein','Fusarium venenatum; aerobic fermentation; filtered, textured; Quorn\u2122']].forEach(function(r,i){if(i<p+1){o.push(R(10,40+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(80,57+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(310,57+i*33,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Sewage treatment','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,52,'Primary treatment: screening (removes solids) + sedimentation (sludge settles)','#333',10,'middle',false));o.push(T(240,70,'Sludge digested anaerobically \u2192 biogas (CH\u2084); used for energy','#555',8,'middle',false));}
if(p>=2){o.push(R(10,90,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,104,'Secondary treatment: activated sludge (aerobic) or trickling filter','#333',10,'middle',false));o.push(T(240,122,'Bacteria and fungi break down organic matter; BOD reduced','#555',8,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,156,'Tertiary treatment: nutrient removal (denitrification), UV/chlorination, sand filtration','#333',10,'middle',false));o.push(T(240,174,'Removes nitrates and phosphates (prevents eutrophication in receiving water)','#555',8,'middle',false));}
if(p>=4){o.push(R(10,194,460,40,'#C8E6C9','#2E7D32',1));o.push(T(240,210,'Biogas: anaerobic digestion of sludge/organic waste \u2192 CH\u2084 + CO\u2082 + fertiliser slurry','#333',9,'middle',false));o.push(T(240,226,'Biogas digesters used in developing countries for cooking/electricity (sustainable)','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ3(p);}
function dQ8(p){dQ4(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Agricultural biology summary','#2E7D32',13,'middle',true));
[['Selective breeding','choose parents with desired traits; generations needed; reduces gene pool'],['GM crops','specific gene inserted; herbicide-resistant (Roundup Ready), pest-resistant (Bt)'],['Biological control','living organisms control pests; IPM combines methods'],['Yoghurt','Lactobacillus; lactic acid fermentation'],['Biogas','anaerobic digestion; CH\u2084; sewage sludge/organic waste'],['Water purification','sedimentation\u2192aeration\u2192filtration\u2192chlorination'],['Antibiotic resistance','overuse\u2192selection\u2192spread; MRSA; reduce agricultural antibiotics']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F1F8F1','#C8E6C9',1));o.push(T(120,52+i*30,r[0],'#2E7D32',10,'middle',true));o.push(T(330,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Applied Biology',ti:'Crop Production and Improvement',su:'Describe methods to improve crop yield and quality.',steps:[
  {lb:'Selective breeding of crops',dr:dQ1,ht:'<p>Selective breeding: choose parents with desired traits (high yield, disease resistance, drought tolerance, nutritional quality); cross; select offspring with desired traits; repeat over many generations. Examples: Norman Borlaug\u2019s Green Revolution wheat (semi-dwarf, high-yield, disease-resistant); Triticale (wheat \u00d7 rye). Limitation: slow; reduces genetic diversity (inbreeding depression); limited to variation already in species.</p>'},
  {lb:'Hybridisation and mutation breeding',dr:dQ1,ht:'<p><b>Hybridisation:</b> crossing two pure-breeding varieties \u2192 F1 hybrids (heterosis/hybrid vigour): more productive than either parent. Disadvantage: F2 generation loses vigour; farmers must buy new seed each year (commercially advantageous for seed companies). <b>Mutation breeding:</b> expose seeds to mutagens (X-rays, gamma rays, chemicals) \u2192 increase mutation rate \u2192 select beneficial mutations. Used to develop disease-resistant and improved varieties.</p>'},
  {lb:'GM crops',dr:dQ1,ht:'<p>GM crops: specific gene inserted using Agrobacterium tumefaciens (Ti plasmid vector) or gene gun. Examples: Bt cotton/maize (Bacillus thuringiensis toxin gene \u2192 kills insects feeding on plant); Roundup Ready soya (glyphosate resistance); Golden Rice (beta-carotene gene \u2192 vitamin A); virus-resistant papaya; drought-tolerant maize. Benefits and controversies: yield vs biodiversity, gene flow, corporate control.</p>'},
  {lb:'Soil management and fertilisers',dr:dQ1,ht:'<p><b>Inorganic (artificial) fertilisers:</b> NPK fertilisers; fast-acting; easily leached; can cause eutrophication. <b>Organic fertilisers</b> (manure, compost): slow-release; improve soil structure; add humus; less eutrophication risk. <b>Crop rotation:</b> prevents nutrient depletion; breaks pest cycles; includes legumes to fix nitrogen. <b>Irrigation:</b> drip (most efficient, 90% water use), sprinkler (60%), flood (40%); salinisation risk with overuse.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Golden Rice was developed to address: 1=drought in developing countries, 2=vitamin A deficiency by introducing a gene for beta-carotene synthesis.',a:2,w:'Golden Rice: beta-carotene gene from daffodil+maize; addresses VAD blindness in developing world. Answer: 2.'},{q:'Crop rotation with legumes is beneficial because: 1=legumes add pesticides to soil, 2=legume root nodules contain Rhizobium which fix atmospheric N\u2082, improving soil nitrogen.',a:2,w:'Legumes + Rhizobium: N\u2082 fixation \u2192 soil nitrogen improved; next crop benefits. Answer: 2.'},{q:'F1 hybrid crops show heterosis, meaning: 1=they are always genetically identical to parents, 2=they show hybrid vigour \u2014 greater yield and performance than either parent variety.',a:2,w:'Heterosis: F1 hybrids outperform parents due to complementation of alleles; declines in F2. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Golden Rice: vitamin A. Legumes: N\u2082 fixation. Heterosis: hybrid vigour.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Applied Biology',ti:'Pest and Disease Management',su:'Compare chemical, biological and integrated pest management.',steps:[
  {lb:'Chemical pesticides',dr:dQ2,ht:'<p>Pesticides: insecticides, herbicides, fungicides. Advantages: fast-acting, effective, predictable. Disadvantages: non-specific (kill non-target organisms), persistence in environment, bioaccumulation, development of resistance, cost. Systemic insecticides (neonicotinoids): absorbed by plant; effective against sucking insects; harm bees (implicated in colony collapse disorder). Organochlorines (DDT): highly persistent; banned in most countries.</p>'},
  {lb:'Biological control',dr:dQ2,ht:'<p>Use of living organisms to suppress pest populations. Examples: <em>Bacillus thuringiensis</em> (Bt) spray \u2192 pore-forming toxin kills lepidopteran larvae; <em>Encarsia formosa</em> (parasitic wasp) \u2192 controls greenhouse whitefly; ladybirds \u2192 aphids; <em>Phasmarhabditis</em> nematode \u2192 slugs; sterile insect technique (SIT): mass release of sterile males \u2192 reduces reproduction. Classic caution: cane toad introduction in Australia \u2192 became invasive pest.</p>'},
  {lb:'Integrated pest management (IPM)',dr:dQ2,ht:'<p>IPM: combine multiple methods to minimise pest impact while reducing chemical use. Components: (1) monitoring (economic threshold \u2014 spray only when pests exceed damage threshold); (2) cultural control (crop rotation, resistant varieties, timing of planting); (3) biological control; (4) targeted pesticide use when necessary; (5) habitat management (field margins for natural enemies). Reduces pesticide resistance and environmental damage.</p>'},
  {lb:'Disease management in crops',dr:dQ2,ht:'<p>Plant diseases: fungal (late blight <em>Phytophthora</em>, mildews, rusts), bacterial (crown gall, fire blight), viral (tobacco mosaic virus, potato virus Y). Control: resistant varieties (most sustainable), crop rotation (breaks disease cycle), fungicides/bactericides, quarantine, certified disease-free planting material, removal and burning of infected plants. WAEC: describe symptoms and transmission of specific plant diseases.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Biological control is preferable to chemical control because: 1=it is always faster, 2=it is species-specific, sustainable, and does not leave chemical residues or cause resistance.',a:2,w:'Biological control: specific, self-sustaining, no chemicals, no resistance. But: slower, may not fully eradicate. Answer: 2.'},{q:'The sterile insect technique (SIT) controls pests by: 1=poisoning wild insects, 2=releasing large numbers of sterile males, reducing reproduction in wild population.',a:2,w:'SIT: sterile males mate with females; no offspring; population declines. Used against tsetse fly, Mediterranean fruit fly. Answer: 2.'},{q:'Economic threshold in IPM means: 1=the maximum amount a farmer can spend on pesticides, 2=the pest population level at which the cost of damage exceeds the cost of control.',a:2,w:'Economic threshold: pest density where control becomes economically justified. Below threshold: don\u2019t spray. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Biological control: specific, no residues. SIT: sterile males. Economic threshold: spray when damage > cost of control.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Applied Biology',ti:'Microorganisms in Food Production',su:'Describe the role of microorganisms in food production and industrial fermentation.',steps:[
  {lb:'Dairy fermentation',dr:dQ3,ht:'<p><b>Yoghurt:</b> pasteurised milk inoculated with <em>Lactobacillus bulgaricus</em> + <em>Streptococcus thermophilus</em>; incubated at 40\u201345\u00b0C; anaerobic; lactose \u2192 lactic acid; pH falls \u2192 milk proteins (casein) denature and coagulate \u2192 thick consistency. Flavours added. <b>Cheese:</b> similar bacteria + rennet (chymosin, now produced by GM bacteria); curds (casein + fat) separated from whey; pressed; ripened (matured) by moulds (<em>Penicillium</em>) or bacteria.</p>'},
  {lb:'Fermented beverages and bread',dr:dQ3,ht:'<p><b>Beer:</b> barley starch \u2192 malting (germination releases amylase) \u2192 mashing (amylase converts starch \u2192 maltose) \u2192 wort + yeast \u2192 fermentation (anaerobic: glucose \u2192 ethanol + CO\u2082) + hops (flavour, antimicrobial). <b>Wine:</b> grape sugars + yeast; anaerobic; ~12% ethanol. <b>Bread:</b> yeast (<em>Saccharomyces cerevisiae</em>); CO\u2082 causes dough to rise; ethanol evaporates during baking. Active substance: zymase enzymes.</p>'},
  {lb:'Industrial fermenters',dr:dQ3,ht:'<p>Industrially, microorganisms produced in large fermenters (bioreactors). Key features: temperature control (water jacket), pH monitoring and adjustment, stirrer (ensures mixing and O\u2082 distribution), aeration system, nutrient inlet, sample port, foam breaker. Batch vs continuous culture. Downstream processing: separation, purification, formulation. Products: antibiotics (penicillin from <em>Penicillium</em>), insulin (GM <em>E. coli</em>), citric acid (<em>Aspergillus</em>), enzymes.</p>'},
  {lb:'Single-cell protein (SCP) and mycoprotein',dr:dQ3,ht:'<p><b>Single-cell protein:</b> microorganisms (yeast, bacteria, fungi) grown on cheap substrates (sugar cane waste, methanol, straw) as protein-rich food supplement. <b>Mycoprotein (Quorn\u2122):</b> <em>Fusarium venenatum</em> grown aerobically on glucose syrup; continuous culture; harvested; textured (steam-treated, shaped); high protein (~45%), high fibre, low fat, low saturated fat. Sustainable alternative to meat; uses less land and water.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Yoghurt forms when Lactobacillus produces lactic acid because: 1=lactic acid acts as a preservative only, 2=lactic acid lowers pH causing casein (milk protein) to denature and coagulate.',a:2,w:'Lactic acid: pH falls to ~4.5 \u2192 casein denatures and precipitates \u2192 yoghurt texture. Answer: 2.'},{q:'In beer production, malting is essential because: 1=it adds flavour, 2=germination of barley produces amylase which converts starch to fermentable sugars.',a:2,w:'Malting: barley germinates \u2192 amylase produced \u2192 starch \u2192 maltose \u2192 yeast can ferment it. Answer: 2.'},{q:'An advantage of mycoprotein over traditional meat is: 1=it has more saturated fat, 2=it is produced sustainably using less land and water, and has high protein and fibre content.',a:2,w:'Mycoprotein: high protein, high fibre, low fat; sustainable; less land/water than beef. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Lactic acid: pH falls, casein denatures. Malting: amylase from germination. Mycoprotein: sustainable, high protein.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Applied Biology',ti:'Sewage Treatment and Water Purification',su:'Describe biological sewage treatment. Evaluate biogas production.',steps:[
  {lb:'Sewage treatment stages',dr:dQ4,ht:'<p><b>Primary (physical):</b> screening (removes large solids: rags, plastic); grit removal; sedimentation tank (suspended solids settle \u2192 primary sludge). <b>Secondary (biological):</b> activated sludge (aerobic; aerated tanks; bacteria break down BOD) or trickling filter (bacteria on stones, air circulates). BOD reduced by ~90%. <b>Tertiary:</b> further nutrient removal, UV/chlorination for pathogens, sand filtration. Effluent released to river/sea.</p>'},
  {lb:'Anaerobic digestion and biogas',dr:dQ4,ht:'<p>Primary sludge + secondary sludge \u2192 <b>anaerobic digester</b> (closed, 35\u00b0C): bacteria break down organic matter without O\u2082 \u2192 <b>biogas</b> (~60\u201370% CH\u2084 + ~30% CO\u2082 + traces H\u2082S). Used for electricity/heat generation. Residual sludge (digestate): nutrient-rich fertiliser. Also produced from agricultural waste (slurry, crop residues), food waste. Biogas digesters widespread in India, China, Nigeria.</p>'},
  {lb:'Water purification',dr:dQ4,ht:'<p>Drinking water treatment: (1) Screening/coarse filtration; (2) Flocculation/coagulation (alum \u2192 Al(OH)\u2083 floc entraps colloidal particles); (3) Sedimentation; (4) Rapid sand filtration; (5) Slow sand filtration (biological film of bacteria and algae; Schmutzdecke breaks down organic compounds); (6) Chlorination (kills pathogens; residual chlorine maintained); (7) Fluoridation (where policy dictates). BOD and turbidity tested.</p>'},
  {lb:'Composting',dr:dQ4,ht:'<p>Composting: aerobic decomposition of organic waste (garden waste, food scraps). Conditions: (1) C:N ratio ~25\u201330:1 (balance carbon-rich and nitrogen-rich materials); (2) moisture (50\u201360%); (3) aeration (turning); (4) temperature (55\u201365\u00b0C in active phase \u2192 kills weed seeds and pathogens). Mesophilic bacteria (initial) \u2192 thermophilic bacteria (heat phase) \u2192 maturation. Product: humus-rich compost; improves soil structure, water retention, nutrient content.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Secondary sewage treatment reduces BOD by: 1=adding chlorine, 2=aerobic bacteria breaking down dissolved organic matter in the effluent.',a:2,w:'Secondary: bacteria respire aerobically; break down dissolved organic compounds \u2192 BOD falls ~90%. Answer: 2.'},{q:'Biogas from anaerobic digestion consists mainly of: 1=CO\u2082 and O\u2082, 2=methane (CH\u2084) and CO\u2082.',a:2,w:'Biogas: ~65% CH\u2084 + ~35% CO\u2082; CH\u2084 is the combustible fraction used for energy. Answer: 2.'},{q:'Slow sand filtration differs from rapid sand filtration because: 1=it is faster, 2=slow sand filtration has a biological layer (Schmutzdecke) that breaks down organic compounds.',a:2,w:'Slow sand: biological film (bacteria, algae) on surface; Schmutzdecke biodegrades organics. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Secondary: aerobic bacteria reduce BOD. Biogas: CH\u2084 + CO\u2082. Slow sand: biological Schmutzdecke.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Applied Biology',ti:'Antibiotic Production and Resistance',su:'Describe penicillin production. Explain antibiotic resistance mechanisms.',steps:[
  {lb:'Penicillin production',dr:dQ5,ht:'<p><em>Penicillium chrysogenum</em>: produces penicillin (beta-lactam antibiotic). Industrial production: large fermenters; batch culture; secondary metabolite (produced when growth limited by nutrient shortage); conditions optimised (pH 6.5, ~25\u00b0C, aeration). Corn steep liquor as nitrogen source; glucose/lactose carbon source. Extracted, purified, concentrated. Semi-synthetic penicillins (ampicillin, amoxicillin) made chemically from natural penicillin.</p>'},
  {lb:'Mechanisms of antibiotic action',dr:dQ5,ht:'<p>Antibiotics target specific bacterial structures not present in eukaryotes: <b>Cell wall synthesis</b> (penicillin, cephalosporins: block transpeptidase \u2192 weak cell wall \u2192 osmotic lysis); <b>Protein synthesis</b> (streptomycin, tetracycline: bind 70S ribosome subunits \u2014 selective for prokaryotes); <b>DNA/RNA synthesis</b> (rifampicin: blocks RNA polymerase); <b>Cell membrane</b> (polymyxins: disrupt membrane). Narrow vs broad spectrum.</p>'},
  {lb:'Antibiotic resistance',dr:dQ5,ht:'<p>Resistance develops by natural selection: random mutation \u2192 resistant bacteria \u2192 selection pressure (antibiotic) \u2192 resistant bacteria survive and reproduce \u2192 resistance spreads. Horizontal gene transfer: resistance genes on plasmids transferred between bacteria by conjugation, transformation, transduction. MRSA (methicillin-resistant <em>Staphylococcus aureus</em>); MDR-TB (multidrug-resistant tuberculosis); NDM-1 (carbapenem-resistant).</p>'},
  {lb:'Prevention of resistance spread',dr:dQ5,ht:'<p>Strategies: (1) complete antibiotic courses; (2) do not use for viral infections; (3) reduce agricultural antibiotic use (growth promotion banned EU); (4) new antibiotic development; (5) bacteriophage therapy (viruses that infect bacteria); (6) strict hygiene in hospitals; (7) surveillance and reporting. One Health approach: human, animal and environmental health linked. WAEC: explain the role of natural selection in resistance development.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Penicillin is bactericidal because: 1=it enters bacteria and destroys DNA, 2=it inhibits cell wall synthesis, causing bacteria to lyse (burst) due to osmotic pressure.',a:2,w:'Penicillin: blocks transpeptidase \u2192 weak cell wall \u2192 osmotic lysis. Targets bacterial cell wall (absent in mammals). Answer: 2.'},{q:'Antibiotic resistance spreads between bacteria via: 1=airborne droplets, 2=horizontal gene transfer (plasmids carrying resistance genes transferred by conjugation).',a:2,w:'Horizontal gene transfer: R-plasmids passed between bacteria by conjugation (cell-to-cell contact). Answer: 2.'},{q:'Completing a full course of antibiotics helps prevent resistance because: 1=it gives more profit to pharmaceutical companies, 2=it kills all bacteria including partially resistant ones, preventing selection of resistant survivors.',a:2,w:'Incomplete course: partially resistant bacteria survive, reproduce, and resistant genes spread. Full course: kills all. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Penicillin: cell wall inhibitor \u2192 lysis. Resistance: horizontal gene transfer. Full course: kills resistant bacteria.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Applied Biology',ti:'Biotechnology and Genetic Engineering',su:'Describe applications of biotechnology in medicine and agriculture.',steps:[
  {lb:'Recombinant DNA technology',dr:dQ6,ht:'<p>Process: (1) Identify and isolate gene of interest (using restriction enzymes to cut out gene from donor DNA, or use mRNA + reverse transcriptase to make cDNA). (2) Insert into vector (plasmid or viral vector) using DNA ligase (sticky ends join). (3) Introduce into host organism (<em>E. coli</em>, yeast, plant cell, animal cell). (4) Identify transformed cells (antibiotic resistance, fluorescence, replica plating). (5) Culture transformed cells to produce protein product.</p>'},
  {lb:'Medical applications',dr:dQ6,ht:'<p>(1) Insulin: human insulin gene in <em>E. coli</em>; safer than pig/cow insulin; no allergy. (2) Factor VIII (haemophilia): produced by GM hamster cells. (3) Erythropoietin (EPO): anaemia treatment; also abused in sport. (4) Vaccines: subunit vaccines from GM organisms (hepatitis B surface antigen). (5) Monoclonal antibodies: cancer treatment (trastuzumab \u2192 HER2+ breast cancer). (6) Gene therapy: viral vectors deliver corrected gene; CRISPR-Cas9 for precise gene editing.</p>'},
  {lb:'Agricultural applications',dr:dQ6,ht:'<p>(1) GM crops (see Q1 above). (2) Transgenic animals: sheep produce AAT (alpha-1 antitrypsin) in milk. (3) Cloning: somatic cell nuclear transfer (SCNT \u2014 Dolly); commercial cloning of elite livestock. (4) Genetic testing: identify disease-resistant varieties; parentage testing; wildlife conservation (DNA profiling). (5) Biopesticides: GM microorganisms producing toxins; <em>Bt</em> crops.</p>'},
  {lb:'CRISPR-Cas9 gene editing',dr:dQ6,ht:'<p>CRISPR-Cas9: guide RNA targets specific DNA sequence; Cas9 nuclease cuts DNA; cell repair mechanisms used to knock out gene OR insert new sequence. More precise than earlier GM methods; cheaper; applicable to many species. Applications: disease treatment (sickle cell, beta-thalassaemia clinical trials), disease-resistant crops, gene drives (suppress insect pest populations), de-extinction. Ethical concerns: germline editing, designer organisms, equity of access.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Restriction enzymes are used in recombinant DNA technology to: 1=join DNA fragments together, 2=cut DNA at specific recognition sequences, producing fragments with sticky ends.',a:2,w:'Restriction enzymes: cut at specific palindromic sequences; leave sticky ends for hybridisation with complementary sequences. Answer: 2.'},{q:'Human insulin produced by GM bacteria is preferred over animal insulin because: 1=it is identical to human insulin and less likely to cause immune reactions, 2=it is cheaper to extract from pigs.',a:1,w:'GM human insulin: identical sequence to human insulin; no allergic reactions; unlimited supply. Answer: 1.'},{q:'CRISPR-Cas9 differs from earlier GM techniques because: 1=it uses viral vectors to insert genes, 2=it allows precise editing of specific DNA sequences with greater accuracy and lower cost.',a:2,w:'CRISPR: guide RNA directs Cas9 to exact target; precise cut; cheaper; faster. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Restriction enzymes: cut DNA. GM insulin: identical to human. CRISPR: precise, cheap editing.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Applied Biology',ti:'Animal Husbandry',su:'Describe methods used to improve livestock production.',steps:[
  {lb:'Selective breeding in animals',dr:dQ7,ht:'<p>Selective breeding: choose parents with high yield (milk, eggs, meat), disease resistance, docility, reproductive rate. Over generations: significant improvement in performance. Examples: Holstein-Friesian cattle (high milk yield ~10,000 L/yr); Broiler chickens (6 weeks to market weight); Landrace pigs (lean meat). Disadvantage: reduced genetic diversity; inbreeding depression; welfare concerns.</p>'},
  {lb:'Artificial insemination and embryo transfer',dr:dQ7,ht:'<p><b>AI (artificial insemination):</b> semen from superior bull collected, checked, diluted, frozen in liquid N\u2082, thawed and used to inseminate many cows. One bull can sire thousands of offspring. <b>Embryo transfer:</b> superovulation (FSH injections) of superior cow \u2192 many eggs \u2192 fertilised \u2192 embryos flushed from donor uterus \u2192 transferred to surrogate cows \u2192 multiplies offspring from genetically superior female. Combined with IVF and genetic testing (PGD).</p>'},
  {lb:'Intensive vs extensive farming',dr:dQ7,ht:'<p><b>Intensive farming:</b> high inputs (feed, drugs, energy), high outputs per animal, controlled environment (battery hens, indoor pigs, feedlots). Issues: animal welfare, antibiotic use, disease spread, pollution. <b>Extensive farming:</b> lower inputs, free-range, more land needed, lower yield per animal. <b>Organic farming:</b> no synthetic pesticides/fertilisers, no GM, restricted antibiotic use, higher animal welfare standards. WAEC: evaluate trade-offs.</p>'},
  {lb:'Feed conversion efficiency',dr:dQ7,ht:'<p><b>Feed conversion ratio (FCR):</b> kg feed per kg live weight gain. Broiler chicken: ~1.8 (efficient). Pig: ~2.5. Beef: ~8 (inefficient, also lose energy as heat). Lower trophic level = more efficient. FCR improved by: controlled environment (less energy wasted on thermoregulation), optimised diet, growth hormones (banned in EU), selective breeding. Understanding FCR links to ecological efficiency concepts.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var feed=rnd(200,600),gain=rnd(30,80);var fcr=parseFloat((feed/gain).toFixed(2));var type=pick(['fcr','gain','feed']);if(type==='fcr')return{question:'Feed consumed = <b>'+feed+' kg</b>. Live weight gain = <b>'+gain+' kg</b>. Feed conversion ratio?',hints:['FCR = feed consumed / weight gain'],ans:fcr,tol:fcr*0.05,unit:'',working:'FCR = '+feed+'/'+gain+' = '+fcr};if(type==='gain'){var fcr2=rnd(15,30)/10,feed2=rnd(200,500),gain2=parseFloat((feed2/fcr2).toFixed(1));return{question:'Feed = <b>'+feed2+' kg</b>, FCR = <b>'+fcr2+'</b>. Live weight gain?',hints:['gain = feed / FCR'],ans:gain2,tol:gain2*0.05,unit:'kg',working:'gain = '+feed2+'/'+fcr2+' = '+gain2+' kg'};}var fcr3=rnd(15,35)/10,gain3=rnd(30,80),feed3=parseFloat((fcr3*gain3).toFixed(0));return{question:'FCR = <b>'+fcr3+'</b>, weight gain = <b>'+gain3+' kg</b>. Feed consumed?',hints:['feed = FCR \u00d7 gain'],ans:feed3,tol:feed3*0.05,unit:'kg',working:'feed = '+fcr3+'\u00d7'+gain3+' = '+feed3+' kg'};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Applied Biology',ti:'Bioremediation and Environmental Biotechnology',su:'Describe uses of microorganisms in environmental clean-up.',steps:[
  {lb:'Bioremediation',dr:dQ8,ht:'<p><b>Bioremediation:</b> use of microorganisms (or plants) to break down or remove pollutants from contaminated environments. In situ (treated at site) or ex situ (removed and treated elsewhere). Natural attenuation: indigenous bacteria break down pollutants without intervention. Biostimulation: add nutrients/O\u2082 to stimulate existing bacteria. Bioaugmentation: introduce specialised bacteria.</p>'},
  {lb:'Oil spills and hydrocarbon degradation',dr:dQ8,ht:'<p>Bacteria that degrade hydrocarbons: <em>Alcanivorax</em>, <em>Pseudomonas</em>, <em>Rhodococcus</em>. Break down alkanes, benzene, PAHs using oxygenase enzymes. Adding nitrogen + phosphorus fertilisers stimulates these bacteria. Used after Exxon Valdez (1989) and Deepwater Horizon (2010) spills. Limitations: toxic intermediates may form; incomplete degradation; anaerobic conditions slow; temperature affects rate.</p>'},
  {lb:'Phytoremediation and mycoremediation',dr:dQ8,ht:'<p><b>Phytoremediation:</b> plants absorb heavy metals/organic pollutants; hyperaccumulators (e.g. <em>Thlaspi caerulescens</em>) take up Zn, Cd; arsenic-accumulating ferns. Harvest and dispose/recover metals. <b>Mycoremediation:</b> fungi (especially white rot fungi, <em>Phanerochaete chrysosporium</em>) degrade persistent organics (PCBs, pesticides, explosives) using ligninase/laccase enzymes. Mushroom mycelium can filter runoff water (mycofiltration).</p>'},
  {lb:'Biosensors and environmental monitoring',dr:dQ8,ht:'<p><b>Biosensors:</b> combine biological component (enzyme, antibody, microorganism) + transducer to detect specific substances. Examples: glucose biosensor (glucose oxidase + electrode \u2014 diabetic monitoring); BOD biosensor; heavy metal sensors. <b>Environmental DNA (eDNA):</b> collect water sample; extract DNA; PCR amplify target species DNA; detects rare/invasive species without catching them. Revolutionising biodiversity monitoring.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Bioremediation uses microorganisms to: 1=produce antibiotics from contaminated soil, 2=break down or transform pollutants into less harmful substances.',a:2,w:'Bioremediation: bacteria/fungi/plants metabolise pollutants (oil, heavy metals, PCBs) into less toxic forms. Answer: 2.'},{q:'Biostimulation differs from bioaugmentation because: 1=biostimulation adds new bacteria; bioaugmentation adds nutrients, 2=biostimulation adds nutrients to stimulate indigenous bacteria; bioaugmentation introduces new specialised organisms.',a:2,w:'Biostimulation: enhance existing microbes with nutrients/O\u2082. Bioaugmentation: add specialist organisms. Answer: 2.'},{q:'Phytoremediation uses plants to remove pollutants. Hyperaccumulators are useful because: 1=they are very large plants, 2=they absorb and concentrate high levels of heavy metals (e.g. Zn, Cd) in their tissues.',a:2,w:'Hyperaccumulators: tolerate and accumulate metals; harvested to remove metals from soil. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Bioremediation: break down pollutants. Biostimulation: nutrients for indigenous microbes. Hyperaccumulators: metals in tissues.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Applied Biology',ti:'Medical Applications of Biology',su:'Describe biological basis of vaccines, blood transfusion and organ transplants.',steps:[
  {lb:'Vaccines and immunity',dr:dQ9,ht:'<p>Vaccines: introduce antigen (weakened/killed pathogen, toxoid, subunit, mRNA) to stimulate primary immune response \u2192 memory B and T cells. On real infection: rapid secondary response destroys pathogen before illness develops. Types: live-attenuated (MMR, BCG), inactivated (polio Salk), subunit (Hepatitis B), toxoid (tetanus, diphtheria), mRNA (COVID-19). Herd immunity: ~95% of population immune \u2192 protects non-immune individuals.</p>'},
  {lb:'Blood transfusion and ABO/Rh',dr:dQ9,ht:'<p>ABO system: Type O (no antigens, universal donor plasma has both antibodies). Type AB (both antigens, no antibodies, universal recipient). Cross-matching essential before transfusion. Rh system: D antigen; Rh\u207b person produces anti-D after exposure. Haemolytic disease of newborn (HDN): Rh\u207b mother sensitised by first Rh\u207a baby \u2192 anti-D IgG crosses placenta in 2nd pregnancy \u2192 destroys foetal RBCs. Prevention: Anti-D immunoglobulin given within 72 hours of first delivery.</p>'},
  {lb:'Organ transplantation',dr:dQ9,ht:'<p>Transplant: replace non-functioning organ with healthy donor organ. Major histocompatibility complex (MHC)/HLA matching: HLA-A, B, C (class I), HLA-DR, DQ, DP (class II); mismatches trigger rejection. Immunosuppressants (cyclosporin \u2014 inhibits T cell activation): prevent rejection but increase infection risk. Types: autograft (self), allograft (same species), xenograft (different species). Shortage of donor organs: ethical issues; xenotransplantation (pig organs \u2192 humans, CRISPR removes pig antigens).</p>'},
  {lb:'Monoclonal antibodies in medicine',dr:dQ9,ht:'<p>Production: inject antigen into mouse \u2192 B lymphocytes produce antibodies \u2192 fuse with myeloma cells \u2192 hybridoma cells (immortal + antibody-producing) \u2192 clone hybridoma \u2192 harvest monoclonal antibodies. Uses: (1) Diagnosis \u2014 pregnancy tests (anti-hCG), cancer diagnosis; (2) Treatment \u2014 trastuzumab (Herceptin, HER2+ breast cancer), rituximab (NHL); (3) Drug delivery \u2014 antibody-drug conjugates target tumour cells specifically.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'Vaccines produce immunity by: 1=directly killing pathogens, 2=stimulating primary immune response and formation of memory cells, enabling rapid secondary response on real infection.',a:2,w:'Vaccine: antigen \u2192 primary response (slow) \u2192 memory cells. Real infection \u2192 rapid secondary response \u2192 pathogen destroyed before disease. Answer: 2.'},{q:'A Rh-negative mother may have a problem with a second Rh-positive baby because: 1=the blood groups are incompatible, 2=her anti-D antibodies from first pregnancy cross the placenta and attack the second baby\'s RBCs.',a:2,w:'HDN: mother sensitised in first pregnancy; anti-D IgG crosses placenta in second pregnancy \u2192 foetal haemolysis. Answer: 2.'},{q:'Hybridoma cells are used to make monoclonal antibodies because: 1=they are small, 2=they combine an antibody-producing B cell with an immortal myeloma cell, producing unlimited quantities of a single specific antibody.',a:2,w:'Hybridoma: B cell (antibody) + myeloma (immortal) \u2192 divides indefinitely making one specific antibody. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Vaccines: memory cells. HDN: anti-D crosses placenta. Hybridoma: B cell + myeloma.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Applied Biology',ti:'Mixed Applied Biology Questions',su:'Integrated questions across all Y12-ECO-02 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Selective breeding: slow, needs variation. GM: specific gene, fast. Biological control: specific, sustainable. Penicillin: Penicillium; batch fermentation. Biogas: CH\u2084 from anaerobic digestion. FCR: feed/weight gain. Hybridoma: monoclonal antibodies. Vaccines: memory cells.</p>'},
  {lb:'WAEC application: food security',dr:dQ10,ht:'<p>Food security: sufficient, safe, nutritious food for all people. Challenges: population growth (~10 billion by 2050), climate change (droughts, floods), land degradation, water scarcity, food waste (~33% of production wasted). Solutions: improved crop varieties, precision agriculture, reduced food waste, dietary shift (less meat), sustainable intensification, urban agriculture, vertical farming.</p>'},
  {lb:'WAEC question types',dr:dQ10,ht:'<p>Common WAEC applied biology questions: describe penicillin production process; explain how antibiotic resistance develops; describe sewage treatment stages; evaluate biological vs chemical pest control; calculate feed conversion ratio; describe monoclonal antibody production; explain how vaccines work; compare selective breeding with genetic engineering.</p>'},
  {lb:'Calculation: yield and efficiency',dr:dQ10,ht:'<div class="fm">FCR = feed consumed / live weight gain</div><div class="fm">% protein conversion = protein in product / protein in feed \u00d7 100</div><div class="fm">Yield = mass of product / mass of raw material \u00d7 100%</div>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['fcr','yield','biogas']);if(type==='fcr'){var feed=rnd(100,400),gain=rnd(30,80);return{question:'Feed consumed = <b>'+feed+' kg</b>. Weight gain = <b>'+gain+' kg</b>. FCR?',hints:['FCR = feed/gain'],ans:parseFloat((feed/gain).toFixed(2)),tol:0.05,unit:'',working:'FCR = '+feed+'/'+gain+' = '+parseFloat((feed/gain).toFixed(2))};}if(type==='yield'){var mass_in=rnd(100,500),pct=rnd(60,90),mass_out=Math.round(mass_in*pct/100);return{question:'Raw material = <b>'+mass_in+' kg</b>. % yield = <b>'+pct+'%</b>. Product mass?',hints:['product = raw material \u00d7 % yield/100'],ans:mass_out,tol:0,unit:'kg',working:'product = '+mass_in+'\u00d7'+pct+'/100 = '+mass_out+' kg'};}var organic=rnd(100,500),ch4_pct=rnd(55,70);var biogas_vol=rnd(2,5)*organic;return{question:'Organic waste = <b>'+organic+' kg</b>. Biogas yield = <b>'+rnd(2,5)+' m\u00b3/kg</b>. If biogas is <b>'+ch4_pct+'% CH\u2084</b>, what % is NOT methane?',hints:['% not methane = 100 \u2212 % methane'],ans:100-ch4_pct,tol:0,unit:'%',working:'100\u2212'+ch4_pct+' = '+(100-ch4_pct)+'%'};})},
]},
];

function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
function render(){bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').innerHTML=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+st.ht;st.dr(si);bDT();document.getElementById('pb').disabled=si===0;document.getElementById('nb').textContent=si===q.steps.length-1?'Restart':'Next';}
document.getElementById('pb').addEventListener('click',function(){if(si>0){si--;render();}});
