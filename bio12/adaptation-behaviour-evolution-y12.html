<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Darwin\'s theory of natural selection','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,52,'1. VARIATION: individuals vary due to mutations and sexual reproduction','#333',10,'middle',false));o.push(T(240,70,'Heritable variation in population','#555',8,'middle',false));}
if(p>=2){o.push(R(10,90,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,104,'2. OVERPRODUCTION: more offspring than environment can support','#333',10,'middle',false));o.push(T(240,122,'Malthus: populations grow exponentially; resources do not','#555',8,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,156,'3. STRUGGLE FOR EXISTENCE: competition for limited resources','#333',10,'middle',false));o.push(T(240,174,'Most offspring die before reproducing','#555',8,'middle',false));}
if(p>=4){o.push(R(10,194,460,54,'#C8E6C9','#2E7D32',1));o.push(T(240,212,'4. SURVIVAL OF THE FITTEST: best-adapted individuals survive and reproduce','#2E7D32',10,'middle',true));o.push(T(240,228,'5. INHERITANCE: advantageous alleles passed to offspring','#333',9,'middle',false));o.push(T(240,244,'\u2192 Over generations: allele frequencies change; populations evolve','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Types of adaptation','#2E7D32',12,'middle',true));
o.push(R(10,36,220,210,'#F1F8F1','#2E7D32',2));o.push(T(120,54,'STRUCTURAL','#2E7D32',11,'middle',true));
o.push(R(248,36,222,210,'#F1F8F1','#2E7D32',2));o.push(T(359,54,'BEHAVIOURAL','#2E7D32',11,'middle',true));
var str=['Streamlined body (fish)','Large ears (fennec fox, heat loss)','Thick fur (Arctic fox)','Long neck (giraffe, feeding)','Succulent stems (cacti, water store)','Haemoglobin affinity (altitude)'];
var beh=['Migration (avoid harsh conditions)','Hibernation (conserve energy)','Camouflage behaviour (stay still)','Schooling in fish (reduce predation)','Warning display (aposematism)','Altruism in social insects'];
str.forEach(function(v,i){if(i<p+1)o.push(T(120,72+i*26,v,'#333',8,'middle',false));});
beh.forEach(function(v,i){if(i<p+1)o.push(T(359,72+i*26,v,'#333',8,'middle',false));});
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Speciation','#2E7D32',13,'middle',true));
if(p>=1){o.push(R(10,38,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,54,'Speciation: formation of new species from an ancestral population','#333',10,'middle',false));o.push(T(240,72,'Requires: isolation + divergence (different selection pressures) + reproductive isolation','#555',8,'middle',false));}
if(p>=2){o.push(R(10,90,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,108,'ALLOPATRIC: geographic barrier separates population','#2E7D32',10,'middle',true));o.push(T(240,124,'Different selection \u2192 different mutations \u2192 reproductively isolated \u2192 new species','#555',8,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,'#F1F8F1','#2E7D32',1.5));o.push(T(240,164,'SYMPATRIC: same area; different ecological niches or polyploidy (plants)','#2E7D32',10,'middle',true));o.push(T(240,180,'Ecological isolation \u2192 genetic divergence without geographic barrier','#555',8,'middle',false));}
if(p>=4){o.push(R(10,202,460,44,'#C8E6C9','#2E7D32',1));o.push(T(240,220,'Reproductive isolation: prezygotic (no mating) vs postzygotic (sterile hybrid)','#333',9,'middle',false));o.push(T(240,236,'Darwin\'s finches: classic allopatric speciation; 14 species from 1 ancestor','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Hardy-Weinberg equilibrium','#2E7D32',12,'middle',true));
o.push(R(10,36,460,44,'#F1F8F1','#2E7D32',2));o.push(T(240,52,'p + q = 1 &nbsp;&nbsp;&nbsp;&nbsp; p\u00b2 + 2pq + q\u00b2 = 1','#1b5e20',14,'middle',true));o.push(T(240,72,'p = dominant allele freq; q = recessive allele freq','#555',9,'middle',false));
if(p>=1){o.push(R(10,90,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,104,'p\u00b2 = homozygous dominant (AA) freq','#333',10,'middle',false));o.push(T(240,122,'2pq = heterozygous (Aa) freq &nbsp;&nbsp; q\u00b2 = homozygous recessive (aa) freq','#333',9,'middle',false));}
if(p>=2){o.push(R(10,142,460,40,'#F1F8F1','#2E7D32',1.5));o.push(T(240,156,'HWE conditions: no mutation, no selection, large population, no gene flow, random mating','#333',10,'middle',false));o.push(T(240,174,'If conditions not met: allele frequencies change \u2192 evolution occurring','#555',8,'middle',false));}
if(p>=3){o.push(R(10,194,460,54,'#C8E6C9','#2E7D32',1));o.push(T(240,214,'Example: cystic fibrosis (aa). q\u00b2 = 1/2500. q = 0.02. p = 0.98.','#333',9,'middle',false));o.push(T(240,232,'Carrier frequency (2pq) = 2\u00d70.98\u00d70.02 = 0.039 = ~1 in 25','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ3(p);}
function dQ7(p){dQ4(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Evolution summary','#2E7D32',13,'middle',true));
[['Natural selection','variation + struggle + survival of fittest + inheritance'],['Genetic drift','random allele frequency change; stronger in small populations'],['Speciation','allopatric (geographic isolation) vs sympatric (ecological/polyploidy)'],['Reproductive isolation','prezygotic vs postzygotic barriers'],['Hardy-Weinberg','p+q=1; p\u00b2+2pq+q\u00b2=1; equilibrium if no evolution'],['Evidence for evolution','fossils, comparative anatomy, molecular, direct observation'],['Coevolution','species evolve together (host-parasite, flower-pollinator)']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F1F8F1','#C8E6C9',1));o.push(T(120,52+i*30,r[0],'#2E7D32',10,'middle',true));o.push(T(330,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Biology \u2022 Evolution',ti:'Darwin\'s Theory of Natural Selection',su:'Describe the evidence for and mechanism of natural selection.',steps:[
  {lb:'Darwin\'s four observations',dr:dQ1,ht:'<p>Darwin (1859, <em>On the Origin of Species</em>) observed: (1) Variation exists within populations. (2) Organisms overproduce offspring. (3) Most offspring die (struggle for existence). (4) Those with advantageous traits survive and reproduce (survival of the fittest). (5) Offspring inherit parental traits. Over many generations \u2192 change in population = evolution. Key influence: Malthus (population growth), Lyell (gradual geological change), Wallace (independent co-discovery).</p>'},
  {lb:'Mechanisms of variation',dr:dQ1,ht:'<p>Darwin did not know the mechanism of inheritance (discovered by Mendel, 1866; significance recognised ~1900). Modern synthesis: combines Darwin + Mendel + population genetics. Sources of variation: <b>mutation</b> (random change in DNA; source of new alleles), <b>sexual reproduction</b> (crossing over, independent assortment, random fertilisation). Without variation, natural selection cannot operate.</p>'},
  {lb:'Evidence for evolution',dr:dQ1,ht:'<p>(1) <b>Fossil record:</b> progressive change in forms over time; transitional fossils (<em>Tiktaalik</em>, <em>Archaeopteryx</em>). (2) <b>Comparative anatomy:</b> homologous structures (pentadactyl limb); vestigial organs (appendix, whale pelvis). (3) <b>Molecular evidence:</b> cytochrome c, ribosomal RNA sequences; more similar = more closely related. (4) <b>Direct observation:</b> antibiotic resistance, Galapagos finch beak changes, peppered moth melanism (industrial melanism \u2014 Kettlewell).</p>'},
  {lb:'Industrial melanism case study',dr:dQ1,ht:'<p>Peppered moth (<em>Biston betularia</em>): pale (typica) and dark (carbonaria) forms. Pre-industrial: pale form common (camouflaged on lichen-covered trees); dark form rare. After industrialisation: soot killed lichens \u2192 dark bark; pale moths visible to birds \u2192 predated; dark moths survived and reproduced \u2192 dark form increased. Post-Clean Air Act: pale form returned. Direct evidence of natural selection changing allele frequencies.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Industrial melanism in peppered moths shows natural selection because: 1=moths deliberately changed colour to match their background, 2=dark moths had a selective advantage when tree bark was darkened, leading to increased frequency of dark allele.',a:2,w:'Selection: dark moths camouflaged on sooty bark survived; pale moths were eaten; dark allele increased in frequency. Answer: 2.'},{q:'Which type of evidence for evolution compares the sequences of proteins such as cytochrome c? 1=fossil record, 2=molecular evidence.',a:2,w:'Molecular: cytochrome c differences proportional to time since divergence; more similar = more closely related. Answer: 2.'},{q:'The modern evolutionary synthesis combines: 1=Lamarck and Darwin only, 2=Darwinian natural selection with Mendelian genetics and population genetics.',a:2,w:'Modern synthesis: Darwin (selection) + Mendel (inheritance) + population genetics (allele frequencies). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Industrial melanism: selection by predation. Molecular: cytochrome c. Modern synthesis: Darwin + Mendel.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y12 Biology \u2022 Evolution',ti:'Adaptations',su:'Describe structural, physiological and behavioural adaptations with examples.',steps:[
  {lb:'Structural adaptations',dr:dQ2,ht:'<p>Structural: physical features. <b>Desert animals:</b> long ears (fennec fox: large SA for heat loss), concentrated urine (kidney tubule adaptations), nocturnal. <b>Aquatic:</b> streamlined body (fish, dolphins), countercurrent heat exchanger (rete mirabile), gills. <b>Arctic:</b> thick blubber and fur, white coat (camouflage), small ears (reduce heat loss). <b>Plants:</b> succulent stems (water storage), reduced leaves (spines: reduce water loss), deep roots.</p>'},
  {lb:'Physiological adaptations',dr:dQ2,ht:'<p>Internal processes adapted. High-altitude animals: more RBCs, more Hb per RBC, Hb with higher O\u2082 affinity (llama, bar-headed goose). Camels: oval RBCs (can change shape; survive dehydration); metabolise fat in hump \u2192 water (metabolic water). Deep-sea fish: TMAO (trimethylamine oxide) stabilises enzymes under pressure; antifreeze proteins (Arctic fish). C4 photosynthesis (maize, sugarcane): adaptation to hot, dry climates; reduces photorespiration.</p>'},
  {lb:'Behavioural adaptations',dr:dQ2,ht:'<p>Innate behaviour: genetically determined; same in all individuals of species; reflexes, taxes, kineses, fixed action patterns (FAPs). <b>Migration:</b> seasonal movement to exploit food/climate. <b>Hibernation:</b> reduce metabolic rate to survive winter. <b>Bees:</b> waggle dance (Karl von Frisch) communicates food source direction and distance. <b>Altruism</b> in social insects: workers sacrifice reproduction (kin selection; Hamilton\'s rule: rB > C).</p>'},
  {lb:'Camouflage and warning coloration',dr:dQ2,ht:'<p><b>Camouflage (cryptic coloration):</b> blend with background; reduces predation; e.g. stick insects, flatfish, leaf-tailed gecko. <b>Aposematism (warning coloration):</b> bright colours warn predators of toxicity/unpalatability; e.g. poison dart frogs, wasps, cinnabar moth caterpillars. <b>Mimicry:</b> Batesian (harmless mimics dangerous) or M\u00fcllerian (two dangerous species resemble each other). Counter-shading: dark above, pale below (many fish and birds).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Bar-headed geese can fly over the Himalayas because: 1=they are larger than other geese, 2=they have haemoglobin with higher O\u2082 affinity than most birds, enabling O\u2082 uptake at very low pO\u2082.',a:2,w:'Bar-headed geese: modified Hb with higher affinity; can load O\u2082 at very high altitude (low pO\u2082). Answer: 2.'},{q:'C4 photosynthesis is an adaptation to hot, dry conditions because: 1=it uses more water, 2=CO\u2082 is concentrated around RuBisCO, allowing stomata to close (saving water) without reducing photosynthesis.',a:2,w:'C4: CO\u2082 pump concentrates CO\u2082 \u2192 RuBisCO works efficiently with stomata more closed \u2192 less water lost. Answer: 2.'},{q:'Aposematic coloration in poison dart frogs: 1=helps them blend into background, 2=warns predators of toxicity through bright conspicuous colours.',a:2,w:'Aposematism: bright colours = warning signal; predators learn to avoid. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Bar-headed geese: high-affinity Hb. C4: CO\u2082 concentrating mechanism saves water. Aposematism: bright = warning.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y12 Biology \u2022 Evolution',ti:'Animal Behaviour',su:'Describe innate and learned behaviour. Explain examples of animal communication.',steps:[
  {lb:'Innate and learned behaviour',dr:dQ3,ht:'<p><b>Innate (instinctive):</b> genetically determined; present from birth; same in all individuals of species; no learning needed. Examples: reflex arc, taxes (e.g. positive phototaxis in Euglena), kineses (woodlice aggregate in damp areas), fixed action patterns (FAPs: hatching, suckling, birdsong). <b>Learned behaviour:</b> modified by experience. Types: habituation, classical conditioning, operant conditioning, insight learning, imprinting.</p>'},
  {lb:'Learning mechanisms',dr:dQ3,ht:'<p><b>Habituation:</b> repeated stimulus \u2192 decreasing response (e.g. snail withdrawing into shell less after repeated harmless taps). <b>Classical conditioning</b> (Pavlov): neutral stimulus paired with natural stimulus \u2192 conditioned reflex. <b>Operant conditioning</b> (Skinner): behaviour reinforced by reward or punishment. <b>Insight learning</b> (Kohler, chimps): solve novel problems without trial and error. <b>Imprinting:</b> critical period (Lorenz, geese): follow first moving object seen.</p>'},
  {lb:'Communication in animals',dr:dQ3,ht:'<p>Communication: transmit information between individuals. Types: visual (facial expressions, displays, bioluminescence), auditory (birdsong, echolocation, ultrasound), chemical (pheromones: ant trails, sex attractants, alarm substances), tactile (grooming, waggle dance in bees). <b>Bee waggle dance</b> (von Frisch): duration \u221d distance; angle from vertical = angle from sun; figure-of-8 pattern. Extraordinary example of symbolic communication in invertebrates.</p>'},
  {lb:'Social behaviour and altruism',dr:dQ3,ht:'<p>Social behaviour: living in groups. Benefits: better predator detection (many eyes), cooperative hunting, warmth, information sharing. Costs: competition for food, disease transmission. <b>Altruism:</b> helping others at own cost. Explained by: kin selection (Hamilton\u2019s rule: rB > C; where r = relatedness, B = benefit to recipient, C = cost to actor); reciprocal altruism (help now \u2192 helped later). Eusocial insects (ants, bees): workers sterile; reproduce through queen (full siblings share 75% genes in Hymenoptera).</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Habituation is best described as: 1=learning through reward and punishment, 2=a decrease in response to a repeated harmless stimulus (the organism learns to ignore it).',a:2,w:'Habituation: repeated stimulus with no consequence \u2192 response declines; saves energy. Answer: 2.'},{q:'The bee waggle dance communicates: 1=only the direction of food, 2=both the direction (angle from vertical) and distance (duration of waggle run) of a food source.',a:2,w:'Waggle dance: angle from vertical = direction from sun; duration of waggle run = distance. Answer: 2.'},{q:'Kin selection explains altruism because: 1=organisms help strangers to survive, 2=helping close relatives (who share alleles) increases the frequency of shared alleles in future generations (inclusive fitness).',a:2,w:'Kin selection: Hamilton\u2019s rule rB > C; altruism toward relatives increases fitness of shared alleles. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Habituation: decreasing response to harmless stimulus. Waggle dance: angle+duration. Kin selection: shared alleles.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y12 Biology \u2022 Evolution',ti:'Hardy-Weinberg Equilibrium',su:'Use Hardy-Weinberg equations to calculate allele and genotype frequencies.',steps:[
  {lb:'Hardy-Weinberg principle',dr:dQ4,ht:'<p>Hardy-Weinberg equilibrium: in a population, allele and genotype frequencies remain constant from generation to generation IF: (1) no mutation; (2) no natural selection; (3) large population (no genetic drift); (4) no gene flow (no migration); (5) random mating. In practice, these are never all met \u2192 allele frequencies change \u2192 evolution occurs. H-W provides a mathematical null hypothesis for detecting evolution.</p>'},
  {lb:'H-W equations',dr:dQ4,ht:'<p>Let p = frequency of dominant allele (A), q = frequency of recessive allele (a). Then: <b>p + q = 1</b> (allele frequencies sum to 1). Genotype frequencies: <b>p\u00b2 + 2pq + q\u00b2 = 1</b> where p\u00b2 = AA (homozygous dominant), 2pq = Aa (heterozygous, carriers), q\u00b2 = aa (homozygous recessive). The aa individuals are the only ones we can identify by phenotype (if a is recessive).</p>'},
  {lb:'Applying H-W: worked example',dr:dQ4,ht:'<p>Cystic fibrosis (aa): incidence = 1 in 2500 in UK. q\u00b2 = 1/2500 = 0.0004. \u2234 q = \u221a0.0004 = 0.02. p = 1 \u2212 0.02 = 0.98. Carrier frequency (2pq) = 2 \u00d7 0.98 \u00d7 0.02 = 0.039 \u2248 1 in 25. AA frequency (p\u00b2) = 0.98\u00b2 = 0.96. WAEC tip: always start with q\u00b2 (recessive phenotype) as this is observable; then calculate q, then p, then 2pq.</p>'},
  {lb:'Genetic drift and gene flow',dr:dQ4,ht:'<p><b>Genetic drift:</b> random change in allele frequencies due to chance sampling (not selection). More significant in small populations. <b>Bottleneck effect:</b> sudden population reduction \u2192 loss of alleles; low genetic diversity. <b>Founder effect:</b> small isolated group establishes new population; limited gene pool. <b>Gene flow:</b> movement of alleles between populations by migration; homogenises populations; can introduce new alleles.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var q2=pick([0.01,0.04,0.09,0.0025,0.0016,0.0049]);var q=parseFloat(Math.sqrt(q2).toFixed(4));var p=parseFloat((1-q).toFixed(4));var carrier=parseFloat((2*p*q).toFixed(4));var type=pick(['find_q','find_p','find_carrier']);if(type==='find_q')return{question:'Recessive disorder frequency (q\u00b2) = <b>'+q2+'</b>. Find q (recessive allele freq).',hints:['q = \u221a(q\u00b2)'],ans:q,tol:0.001,unit:'',working:'q = \u221a'+q2+' = '+q};if(type==='find_p')return{question:'q = <b>'+q+'</b>. Find p (dominant allele freq).',hints:['p + q = 1, so p = 1 \u2212 q'],ans:p,tol:0.001,unit:'',working:'p = 1\u2212'+q+' = '+p};return{question:'p = <b>'+p+'</b>, q = <b>'+q+'</b>. Carrier frequency (2pq)?',hints:['carrier = 2pq'],ans:carrier,tol:0.002,unit:'',working:'2pq = 2\u00d7'+p+'\u00d7'+q+' = '+carrier};})},
]},
{ey:'Q5 \u2022 Y12 Biology \u2022 Evolution',ti:'Speciation',su:'Describe allopatric and sympatric speciation with examples.',steps:[
  {lb:'Definition and requirements',dr:dQ5,ht:'<p>Speciation: the formation of new species from an ancestral population. Requirements: (1) populations become <b>isolated</b> (gene flow stops); (2) different <b>selection pressures</b> act on each population; (3) populations accumulate different <b>mutations</b> and genetic divergence; (4) eventually populations cannot interbreed (<b>reproductive isolation</b>): new species.</p>'},
  {lb:'Allopatric speciation',dr:dQ5,ht:'<p>Allopatric (other country): geographic barrier separates population. Barrier: mountain range, ocean, river, desert, glacier. Each isolated population: different mutations, different selection, genetic drift. Divergence occurs independently \u2192 if reunited, cannot interbreed \u2192 different species. Examples: Darwin\u2019s finches (Galapagos), Hawaiian honeycreepers, cichlid fish in African lakes, Abert\u2019s vs Kaibab squirrel (Grand Canyon).</p>'},
  {lb:'Sympatric speciation',dr:dQ5,ht:'<p>Sympatric (same country): no geographic barrier. Mechanisms: (1) <b>Polyploidy</b> (mainly plants): chromosome number doubling \u2192 cannot mate with original species; instantaneous speciation. Example: bread wheat (hexaploid, 6 genomes from 3 ancestral species). (2) <b>Ecological isolation:</b> different niches, habitats or timing. Example: apple maggot fly \u2014 some populations shifted to hawthorn vs apple; now partially reproductively isolated.</p>'},
  {lb:'Reproductive isolation mechanisms',dr:dQ5,ht:'<p><b>Prezygotic barriers</b> (before fertilisation): habitat isolation (different habitat/season), temporal isolation (breed at different times), behavioural isolation (no attraction), mechanical isolation (incompatible genitalia/flowers), gametic isolation (sperm cannot penetrate egg). <b>Postzygotic barriers</b> (after fertilisation): hybrid inviability (hybrid dies early), hybrid sterility (mule), hybrid breakdown (F2 generation weak).</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Allopatric speciation requires: 1=two species to live in the same area but exploit different resources, 2=geographic isolation followed by genetic divergence until reproductive isolation occurs.',a:2,w:'Allopatric: geographic barrier \u2192 no gene flow \u2192 divergence \u2192 reproductive isolation \u2192 new species. Answer: 2.'},{q:'Polyploidy causes instant speciation in plants because: 1=it creates more DNA, 2=the polyploid cannot mate with the original diploid species (incompatible chromosome numbers at meiosis).',a:2,w:'Polyploid (e.g. 4n) crossed with diploid (2n) \u2192 triploid (3n): infertile; cannot produce viable gametes. Answer: 2.'},{q:'A mule (horse \u00d7 donkey) is an example of: 1=prezygotic isolation, 2=postzygotic isolation (hybrid sterility).',a:2,w:'Mule is produced (fertilisation occurs) but is sterile = postzygotic isolation (hybrid sterility). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Allopatric: geographic barrier. Polyploidy: chromosome incompatibility. Mule: postzygotic (hybrid sterile).'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y12 Biology \u2022 Evolution',ti:'Selection Types',su:'Distinguish stabilising, directional and disruptive selection. Explain artificial selection.',steps:[
  {lb:'Types of natural selection',dr:dQ6,ht:'<p><b>Stabilising selection:</b> extreme phenotypes selected against; intermediate phenotype favoured; narrows variation; population stabilises around mean. Example: human birth weight (too large or too small = higher mortality). <b>Directional selection:</b> one extreme phenotype selected for; mean shifts; variation may narrow. Example: antibiotic resistance, industrial melanism. <b>Disruptive (diversifying) selection:</b> both extremes favoured; intermediate eliminated; can lead to two sub-populations and eventually speciation.</p>'},
  {lb:'Sexual selection',dr:dQ6,ht:'<p>Darwin\u2019s second mechanism (alongside natural selection). <b>Intersexual selection:</b> one sex (usually female) chooses mates; other sex (usually male) has elaborate displays, plumage, songs (peacock\u2019s tail, bird of paradise). <b>Intrasexual selection:</b> competition within one sex for access to mates; antlers, size (elephant seals, stags). Result: sexual dimorphism. Traits may be costly to survival but increase reproductive success (honest signalling of genetic quality).</p>'},
  {lb:'Artificial selection',dr:dQ6,ht:'<p>Artificial (selective) breeding: humans choose parents based on desired traits. Rapid change compared to natural selection. Examples: dogs (wolves domesticated \u2192 200+ breeds in ~15,000 yrs), cattle, crops (wild teosinte \u2192 maize in ~9,000 yrs). Negative consequences: reduced genetic diversity, inbreeding depression, health problems (bulldogs\u2019 breathing, dachshund spine problems). Evidence that selection can change populations rapidly.</p>'},
  {lb:'Coevolution',dr:dQ6,ht:'<p>Coevolution: two or more species evolve together in response to each other. Arms race: host-parasite (pathogen evolves better at infecting; host evolves better resistance). Mutualism: flower-pollinator coevolution (orchid Angraecum + Darwin\u2019s hawk moth: flower nectar spur = 30 cm; moth proboscis = 30 cm). Plant-herbivore: plants evolve toxins; herbivores evolve resistance. Red Queen hypothesis: must keep evolving just to maintain fitness relative to co-evolving species.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Stabilising selection reduces variation because: 1=all extreme phenotypes are favoured, 2=extreme phenotypes are selected against, leaving intermediate phenotypes.',a:2,w:'Stabilising: intermediate = optimal; extremes die; variation narrows; mean stable. Answer: 2.'},{q:'Sexual selection can produce costly traits (e.g. peacock tail) because: 1=they increase survival, 2=they increase mating success, outweighing the survival cost.',a:2,w:'Peacock tail: energetically costly, makes predation more likely; BUT increases mating success \u2192 reproductive advantage. Answer: 2.'},{q:'Coevolution between a flower and its pollinator means: 1=only the flower evolves, 2=each species exerts selection pressure on the other, causing both to evolve in response.',a:2,w:'Coevolution: mutual selection; flower shape matches pollinator; pollinator morphology matches flower. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Stabilising: intermediates survive. Sexual selection: mating success > survival cost. Coevolution: mutual selection.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y12 Biology \u2022 Evolution',ti:'Human Evolution',su:'Describe the fossil and molecular evidence for human evolution.',steps:[
  {lb:'Hominid evolution',dr:dQ7,ht:'<p>Humans (Homo sapiens) belong to family Hominidae (great apes). Key ancestral milestones: <em>Australopithecus</em> (~4 mya, bipedal, small brain), <em>Homo habilis</em> (~2.3 mya, first stone tools, larger brain), <em>Homo erectus</em> (~1.8 mya, fire, migrated out of Africa), <em>Homo heidelbergensis</em> (~600 kya, common ancestor of H. sapiens and Neanderthals), <em>Homo neanderthalensis</em> (Europe, 400\u201340 kya), <em>Homo sapiens</em> (Africa ~300 kya; global migration ~60\u201370 kya).</p>'},
  {lb:'Key human adaptations',dr:dQ7,ht:'<p>Bipedalism: frees hands; foramen magnum under skull; S-shaped spine; bowl-shaped pelvis; non-opposable big toe; shorter arms. <b>Brain size:</b> cranial capacity increased from ~450 cm\u00b3 (Australopithecus) to ~1350 cm\u00b3 (H. sapiens); associated with tool use, language, social complexity. <b>Reduced facial prognathism</b> (less jutting jaw). <b>Opposable thumb</b> for precision grip. Loss of body hair (thermoregulation; sweating).</p>'},
  {lb:'Molecular evidence for human evolution',dr:dQ7,ht:'<p>Molecular clock: rate of mutation used to date divergence. DNA comparison: humans and chimpanzees share ~98\u201399% of DNA sequence. Mitochondrial DNA analysis: all humans descended from a common female ancestor (~200 kya, "Mitochondrial Eve" in Africa). Y-chromosome analysis: "Y-chromosomal Adam". Interbreeding with Neanderthals and Denisovans: non-African modern humans carry ~2% Neanderthal DNA (protective against some viruses).</p>'},
  {lb:'Cultural evolution',dr:dQ7,ht:'<p>Cultural evolution: transmission of information/behaviour by learning (not genes). Much faster than biological evolution. Includes: language, technology, agriculture, medicine. Uniquely powerful in humans due to cumulative culture (build on previous knowledge), teaching, symbolic communication, writing. Cultural evolution has largely replaced biological evolution as the primary driver of human change in recent millennia. WAEC: distinguish biological from cultural evolution.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Bipedalism in human ancestors can be identified from fossils by: 1=the size of the skull, 2=the position of the foramen magnum (underneath skull), bowl-shaped pelvis, and angled femur.',a:2,w:'Bipedalism: foramen magnum shifts forward; pelvis widens; femur angles inward; foot arch. Answer: 2.'},{q:'Modern non-African humans carry ~2% Neanderthal DNA because: 1=Neanderthals were human ancestors, 2=H. sapiens and Neanderthals interbred when they encountered each other in Europe/Asia.',a:2,w:'Interbreeding (hybridisation) between H. sapiens and Neanderthals occurred as sapiens migrated out of Africa. Answer: 2.'},{q:'The molecular clock is used in evolution to: 1=measure speed of heartbeat, 2=estimate when two species diverged by comparing mutation rates in DNA sequences.',a:2,w:'Molecular clock: mutations accumulate at ~constant rate; more differences = longer since divergence. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Bipedalism: foramen magnum, pelvis shape. Neanderthal DNA: interbreeding. Molecular clock: mutation rate = time.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y12 Biology \u2022 Evolution',ti:'Population Genetics and Microevolution',su:'Describe mechanisms of microevolution. Apply Hardy-Weinberg to detect selection.',steps:[
  {lb:'Microevolution vs macroevolution',dr:dQ8,ht:'<p><b>Microevolution:</b> small-scale change in allele frequencies within a population over generations. Causes: natural selection, genetic drift, mutation, gene flow. <b>Macroevolution:</b> large-scale evolution above the species level; origin of new phyla, classes, orders; long-term accumulation of microevolutionary changes; documented in fossil record. Debate: is macroevolution just accumulated microevolution, or are there additional mechanisms?</p>'},
  {lb:'Genetic drift in small populations',dr:dQ8,ht:'<p>Genetic drift: random fluctuations in allele frequency; more significant in small populations. <b>Bottleneck:</b> catastrophic reduction in population size \u2192 loss of genetic variation; surviving alleles may not be representative of original. Example: cheetahs (extremely low genetic diversity after bottleneck ~10,000 yrs ago). <b>Founder effect:</b> small group colonises new area; carries limited alleles; high frequency of certain diseases in isolated populations.</p>'},
  {lb:'Detecting evolution using H-W',dr:dQ8,ht:'<p>If a population is in H-W equilibrium: no evolution occurring. Compare observed vs expected genotype frequencies: if significantly different (chi-squared test) \u2192 one or more H-W assumptions violated \u2192 evolution occurring. Example: observed frequency of Aa higher than 2pq expected \u2192 heterozygote advantage (overdominance) \u2192 selection maintaining both alleles (e.g. sickle cell trait in malaria regions = balanced polymorphism).</p>'},
  {lb:'Balanced polymorphism and selection',dr:dQ8,ht:'<p><b>Balanced polymorphism:</b> two or more alleles maintained in population at high frequency by selection. Mechanisms: (1) Heterozygote advantage (sickle cell: HbS/HbA protected from malaria); (2) frequency-dependent selection (rare allele advantages when predators have search image for common form); (3) environment varies spatially/temporally. Result: allele frequencies stabilise at equilibrium rather than one allele going to fixation.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var q2=pick([0.01,0.04,0.09,0.16,0.25]);var q=parseFloat(Math.sqrt(q2).toFixed(3));var p=parseFloat((1-q).toFixed(3));var pq2=parseFloat((2*p*q).toFixed(4));var p2=parseFloat((p*p).toFixed(4));var type=pick(['carrier','homdom','alleles']);if(type==='carrier')return{question:'q\u00b2 = <b>'+q2+'</b>. Find carrier (2pq) frequency.',hints:['q=\u221a(q\u00b2); p=1\u2212q; carrier=2pq'],ans:pq2,tol:0.003,unit:'',working:'q='+q+', p='+p+', 2pq=2\u00d7'+p+'\u00d7'+q+'='+pq2};if(type==='homdom')return{question:'p = <b>'+p+'</b>. Find homozygous dominant (p\u00b2) frequency.',hints:['p\u00b2 = p \u00d7 p'],ans:p2,tol:0.002,unit:'',working:'p\u00b2='+p+'\u00b2='+p2};return{question:'In a population, q\u00b2 = <b>'+q2+'</b>. Find recessive allele frequency (q).',hints:['q = \u221a(q\u00b2)'],ans:q,tol:0.002,unit:'',working:'q=\u221a'+q2+'='+q};})},
]},
{ey:'Q9 \u2022 Y12 Biology \u2022 Evolution',ti:'Extinction and Mass Extinctions',su:'Describe causes of extinction. Evaluate conservation of endangered species.',steps:[
  {lb:'Causes of extinction',dr:dQ9,ht:'<p>Extinction: permanent loss of all individuals of a species. Causes: (1) Habitat destruction (main current cause); (2) Overexploitation (hunting, fishing beyond sustainable levels); (3) Introduced invasive species (outcompete, prey on, or infect natives); (4) Disease (chestnut blight, chytrid fungus in amphibians); (5) Climate change; (6) Pollution; (7) Small population vulnerability (Allee effect, inbreeding, stochastic events).</p>'},
  {lb:'Mass extinctions',dr:dQ9,ht:'<p>Five mass extinctions in Earth history (>75% species lost): (1) Ordovician (444 mya, glaciation); (2) Devonian (375 mya, ocean anoxia); (3) Permian (252 mya, worst: ~96% species lost; volcanic activity); (4) Triassic (201 mya); (5) Cretaceous (66 mya, asteroid + volcanism; killed dinosaurs). Current biodiversity crisis called 6th mass extinction. Background extinction rate: ~1\u201310 species/yr. Current: 100\u20131000\u00d7 above background.</p>'},
  {lb:'Conservation genetics',dr:dQ9,ht:'<p>Small populations: vulnerable to inbreeding depression (loss of heterozygosity \u2192 expression of deleterious recessives), genetic drift (loss of alleles), environmental stochasticity. Minimum viable population (MVP): smallest size with >95% chance of persistence for 100 yrs (varies; often hundreds to thousands). Conservation: maintain genetic diversity; habitat corridors (gene flow); avoid inbreeding (mate with unrelated individuals in zoo programmes).</p>'},
  {lb:'Species recovery programmes',dr:dQ9,ht:'<p>Successful examples: Arabian oryx (extinct in wild 1972 \u2192 captive breeding \u2192 reintroduced 1982; now ~1000 in wild). California condor (27 individuals 1987 \u2192 600+ today). Black-footed ferret, whooping crane, giant panda (population increasing). Critical factors: habitat restoration, control of threats (hunting, predators), disease monitoring, genetic management, public engagement. WAEC: evaluate specific programmes.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'The main driver of current species extinctions is: 1=volcanic eruptions, 2=habitat destruction caused by human activities (agriculture, urbanisation, deforestation).',a:2,w:'Habitat destruction: main cause of current extinction crisis; directly removes homes and food. Answer: 2.'},{q:'Inbreeding depression in small populations occurs because: 1=inbreeding increases genetic diversity, 2=inbreeding increases homozygosity, expressing deleterious recessive alleles.',a:2,w:'Inbreeding: close relatives \u2192 more homozygous offspring \u2192 deleterious recessives expressed \u2192 reduced fitness. Answer: 2.'},{q:'Habitat corridors help prevent extinction because: 1=they keep populations isolated, 2=they allow individuals to move between habitat patches, maintaining gene flow and increasing effective population size.',a:2,w:'Corridors: gene flow between patches \u2192 reduces inbreeding \u2192 maintains genetic diversity \u2192 larger effective population. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Extinction: habitat destruction (main). Inbreeding: homozygosity, deleterious recessives. Corridors: gene flow.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y12 Biology \u2022 Evolution',ti:'Mixed Evolution Questions',su:'Integrated questions across all Y12-EVO-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Natural selection: variation + struggle + survival of fittest + inheritance. H-W: p+q=1; p\u00b2+2pq+q\u00b2=1. Speciation: allopatric (geographic) vs sympatric (polyploidy/ecological). Types of selection: stabilising, directional, disruptive. Genetic drift: random; small populations. Coevolution: arms race or mutualism.</p>'},
  {lb:'WAEC integration',dr:dQ10,ht:'<p>WAEC often asks: describe how natural selection leads to antibiotic resistance; explain H-W equilibrium; compare allopatric and sympatric speciation; describe adaptations of named organisms to their environment; discuss evidence for evolution; explain genetic drift and its effects. Link mechanisms to specific examples in all answers.</p>'},
  {lb:'WAEC essay structure: evolution',dr:dQ10,ht:'<p>For a WAEC question on evolution: (1) Define evolution (change in allele frequencies); (2) State mechanism (natural selection: variation, overproduction, struggle, survival, inheritance); (3) Give specific example; (4) State outcome (adaptation or speciation); (5) Mention genetic drift if relevant; (6) Link to H-W if relevant. Avoid stating organisms "try" or "want" to evolve \u2014 selection acts on variation that already exists.</p>'},
  {lb:'H-W and selection calculations',dr:dQ10,ht:'<div class="fm">p + q = 1 &nbsp;&nbsp; p\u00b2 + 2pq + q\u00b2 = 1</div><div class="fm">Start with q\u00b2 (observable recessive phenotype)</div><div class="fm">q = \u221a(q\u00b2) \u2192 p = 1\u2212q \u2192 2pq (carriers)</div>'},
