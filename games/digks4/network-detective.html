<html lang="en">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network Detective — ABC Learning Portal</title>
<style>
:root{--red:#C0272D;--dark:#8f1c21;--cream:#FBF6F0;--ink:#241412;--line:#EBD8D5;--gold:#C8922A;--good:#2e7d32;--goodbg:#e8f5e9;--bad:#a01f24;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;}
header{background:var(--red);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
header h1{font-size:16px;font-weight:700;}
.stat{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:5px 10px;}
.wrap{max-width:560px;margin:0 auto;padding:22px 14px 60px;}
.intro,.results{background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px 24px;text-align:center;}
.intro h2,.results h2{font-family:Georgia,serif;font-size:22px;margin-bottom:10px;}
.intro p{font-size:14px;color:#555;line-height:1.6;margin-bottom:20px;}
.start-btn{background:var(--red);color:#fff;border:none;border-radius:5px;padding:13px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.start-btn:hover{background:var(--dark);}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;text-align:center;}
.round-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;}
.qtext{font-size:19px;font-weight:700;line-height:1.5;margin:6px 0 20px;font-family:Georgia,serif;}
.qtext code, .code-block{display:block;background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:'Courier New',monospace;font-size:14px;text-align:left;white-space:pre;line-height:1.6;}
.code-line{cursor:pointer;padding:2px 4px;border-radius:3px;}
.code-line:hover{background:#FFF3E0;}
.code-line.correct{background:var(--goodbg);color:var(--good);font-weight:700;}
.code-line.wrong{background:#fde8e8;color:var(--bad);}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.opt-btn{background:#fff;border:2px solid var(--line);border-radius:7px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
.opt-btn:hover{border-color:var(--gold);}
.opt-btn.correct{border-color:var(--good);background:var(--goodbg);color:var(--good);}
.opt-btn.wrong{border-color:var(--bad);background:#fde8e8;color:var(--bad);}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bin-btn{border:2px solid var(--line);border-radius:8px;padding:14px 10px;font-size:14px;font-weight:700;cursor:pointer;background:#fff;font-family:inherit;}
.bin-btn:hover{border-color:var(--gold);}
.bin-btn.correct{border-color:var(--good);background:var(--goodbg);color:var(--good);}
.bin-btn.wrong{border-color:var(--bad);background:#fde8e8;color:var(--bad);}
.built-box{background:var(--cream);border:2px dashed var(--line);border-radius:8px;min-height:56px;padding:10px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;}
.built-word{background:#fff;border:2px solid var(--good);color:var(--good);border-radius:6px;padding:6px 10px;font-size:14px;font-weight:700;cursor:pointer;}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;}
.pool-word{background:#fff;border:2px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;}
.pool-word:hover{border-color:var(--gold);}
.check-btn{background:var(--red);color:#fff;border:none;border-radius:6px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.check-btn:hover{background:var(--dark);}
.check-btn:disabled{opacity:.4;cursor:default;}
#answerInput{font-size:20px;font-weight:700;text-align:center;padding:10px;border:2px solid var(--line);border-radius:6px;font-family:inherit;width:180px;}
#answerInput:focus{outline:none;border-color:var(--gold);}
.feedback{font-size:13.5px;font-weight:600;margin-top:12px;min-height:18px;}
.feedback.good{color:var(--good);}
.feedback.bad{color:var(--bad);}
.results .time{font-size:40px;font-weight:800;color:var(--red);margin:10px 0 4px;}
.results .sub{font-size:13px;color:#888;margin-bottom:18px;}
.lb-box{background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:20px;text-align:left;}
.lb-box h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:8px;font-weight:700;}
.abcg-lb-loading,.abcg-lb-empty{color:#999;font-size:12.5px;}
.abcg-lb-head,.abcg-lb-row{display:grid;grid-template-columns:24px 1fr 60px 60px;gap:6px;padding:3px 0;font-size:12.5px;}
.abcg-lb-head{color:#999;font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.05em;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px;}
.abcg-lb-row{color:var(--ink);}
.abcg-lb-me{font-weight:700;color:var(--red);}
.abcg-lb-rank{color:var(--gold);font-weight:700;}
.hidden{display:none;}
</style>
<script src="../../notation.js" defer></script>
</head>
<body>
<header>
  <a href="../games-list.html" class="back">&larr; All Games</a>
  <h1>Network Detective</h1>
  <div class="stat" id="timerStat">0:00</div>
</header>
<div class="wrap">

  <div class="intro" id="intro">
    <h2>Name the term</h2>
    <p>Read the definition and tap the correct networking term. 10 rounds, no skipping wrong taps.</p>
    <button class="start-btn" id="startBtn">Start</button>
  </div>

  <div class="panel hidden" id="game">
    <div class="round-hdr"><span id="roundLbl">Round 1 of 10</span><span id="scoreLbl">0 correct</span></div>
    <div class="qtext" id="qtext" style="font-size:16px"></div>
    <div id="rewardIcon" style="min-height:56px;"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="results hidden" id="results">
    <h2>All rounds complete!</h2>
    <div class="time" id="finalTime">0:00</div>
    <div class="sub">time taken</div>
    <div class="lb-box"><h4>Leaderboard</h4><div id="lbList"></div></div>
    <button class="start-btn" id="againBtn">Play Again</button>
    <div style="margin-top:10px;"><a href="../games-list.html" style="font-size:12.5px;color:#888;">All games &rarr;</a></div>
  </div>

</div>
<script>
var GAME_CODE='network-detective-ks4';
var TOTAL_ROUNDS=10;

var BANK = [{"q": "A set of rules that governs how data is transmitted across a network.", "a": "Protocol", "d": ["Packet", "Bandwidth", "Topology"]}, {"q": "A small unit of data sent across a network, containing a header and payload.", "a": "Packet", "d": ["Protocol", "Frame", "Segment"]}, {"q": "The maximum rate of data transfer across a network path.", "a": "Bandwidth", "d": ["Latency", "Throughput", "Protocol"]}, {"q": "The physical or logical arrangement of devices on a network.", "a": "Topology", "d": ["Protocol", "Bandwidth", "Encryption"]}, {"q": "A service that translates domain names into IP addresses.", "a": "DNS", "d": ["DHCP", "HTTP", "FTP"]}, {"q": "A service that automatically assigns IP addresses to devices on a network.", "a": "DHCP", "d": ["DNS", "VPN", "NAT"]}, {"q": "A secure, encrypted connection that lets a device access a network remotely.", "a": "VPN", "d": ["Firewall", "Proxy", "LAN"]}, {"q": "The process of scrambling data so it cannot be read without a key.", "a": "Encryption", "d": ["Compression", "Authentication", "Hashing"]}, {"q": "A technique that allows multiple devices on a LAN to share one public IP address.", "a": "NAT", "d": ["DHCP", "DNS", "VPN"]}, {"q": "The protocol used to transfer web pages between a server and browser.", "a": "HTTP", "d": ["FTP", "SMTP", "TCP"]}, {"q": "The delay between sending and receiving data across a network.", "a": "Latency", "d": ["Bandwidth", "Throughput", "Jitter"]}, {"q": "A server that sits between a client and the internet, often for security or caching.", "a": "Proxy server", "d": ["DNS server", "Web server", "File server"]}];
function rnd(n){return Math.floor(Math.random()*n);}
var ICONS={
  'Protocol':'<rect x="8" y="20" width="54" height="20" rx="4" fill="#D6EAF8" stroke="#1565C0" stroke-width="2"/><path d="M14 30 h10 M28 30 h10 M42 30 h10" stroke="#1565C0" stroke-width="2" stroke-dasharray="2,2"/>',
  'Packet':'<rect x="16" y="18" width="38" height="24" rx="3" fill="#E8F8F0" stroke="#2E7D32" stroke-width="2"/><rect x="16" y="18" width="12" height="24" fill="#82C99A"/>',
  'Bandwidth':'<line x1="10" y1="42" x2="10" y2="10" stroke="#888" stroke-width="1.5"/><line x1="10" y1="42" x2="60" y2="42" stroke="#888" stroke-width="1.5"/><rect x="16" y="30" width="8" height="12" fill="#F5B041"/><rect x="28" y="20" width="8" height="22" fill="#F5B041"/><rect x="40" y="12" width="8" height="30" fill="#F5B041"/>',
  'Topology':'<circle cx="35" cy="30" r="4" fill="#1565C0"/><circle cx="15" cy="15" r="4" fill="#1565C0"/><circle cx="55" cy="15" r="4" fill="#1565C0"/><circle cx="15" cy="45" r="4" fill="#1565C0"/><circle cx="55" cy="45" r="4" fill="#1565C0"/><line x1="35" y1="30" x2="15" y2="15" stroke="#1565C0" stroke-width="1.5"/><line x1="35" y1="30" x2="55" y2="15" stroke="#1565C0" stroke-width="1.5"/><line x1="35" y1="30" x2="15" y2="45" stroke="#1565C0" stroke-width="1.5"/><line x1="35" y1="30" x2="55" y2="45" stroke="#1565C0" stroke-width="1.5"/>',
  'DNS':'<rect x="8" y="20" width="54" height="20" rx="10" fill="#D6EAF8" stroke="#1565C0" stroke-width="2"/><text x="35" y="34" text-anchor="middle" font-size="10" fill="#1565C0" font-weight="700">abc.sch.ng</text>',
  'DHCP':'<rect x="8" y="18" width="54" height="24" rx="4" fill="#E8F8F0" stroke="#2E7D32" stroke-width="2"/><text x="35" y="34" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="700">192.168.x</text>',
  'VPN':'<rect x="14" y="16" width="42" height="28" rx="4" fill="#F1948A" stroke="#a01f24" stroke-width="2"/><rect x="26" y="26" width="18" height="14" rx="2" fill="#fff" stroke="#a01f24" stroke-width="1.5"/><path d="M29 26 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#a01f24" stroke-width="2"/>',
  'Encryption':'<rect x="20" y="26" width="30" height="20" rx="3" fill="#F9E9F3" stroke="#8E44AD" stroke-width="2"/><path d="M25 26 v-6 a10 10 0 0 1 20 0 v6" fill="none" stroke="#8E44AD" stroke-width="2"/><circle cx="35" cy="36" r="3" fill="#8E44AD"/>',
  'NAT':'<rect x="8" y="24" width="20" height="14" rx="2" fill="#D6EAF8" stroke="#1565C0" stroke-width="1.5"/><rect x="42" y="24" width="20" height="14" rx="2" fill="#E8F8F0" stroke="#2E7D32" stroke-width="1.5"/><path d="M28 31 h14" stroke="#888" stroke-width="2" marker-end="none"/><path d="M38 27 l4 4 l-4 4" fill="none" stroke="#888" stroke-width="2"/>',
  'HTTP':'<rect x="8" y="18" width="54" height="24" rx="3" fill="#EAF2F8" stroke="#1565C0" stroke-width="2"/><text x="35" y="34" text-anchor="middle" font-size="11" fill="#1565C0" font-weight="700">http://</text>',
  'Latency':'<circle cx="35" cy="28" r="18" fill="none" stroke="#F5B041" stroke-width="2"/><line x1="35" y1="28" x2="35" y2="16" stroke="#F5B041" stroke-width="2"/><line x1="35" y1="28" x2="44" y2="32" stroke="#F5B041" stroke-width="2"/>',
  'Proxy server':'<rect x="16" y="8" width="38" height="14" rx="2" fill="#B0BEC5" stroke="#607D8B" stroke-width="1.5"/><rect x="16" y="26" width="38" height="14" rx="2" fill="#B0BEC5" stroke="#607D8B" stroke-width="1.5"/><circle cx="48" cy="15" r="3" fill="#F5B041"/>'
};
function iconSvg(name){
  var body=ICONS[name];
  if(!body) return '';
  return '<svg width="70" height="52" viewBox="0 0 70 52">'+body+'</svg>';
}
var usedIdx=[];
function pickItem(){
  var pool=BANK.map(function(b,i){return i;}).filter(function(i){return usedIdx.indexOf(i)===-1;});
  if(pool.length===0){usedIdx=[];pool=BANK.map(function(b,i){return i;});}
  var idx=pool[rnd(pool.length)];
  usedIdx.push(idx);
  return BANK[idx];
}
function genRound(){
  var item=pickItem();
  var opts=[item.a].concat(item.d);
  for(var i=opts.length-1;i>0;i--){var j=rnd(i+1);var t=opts[i];opts[i]=opts[j];opts[j]=t;}
  return {q:item.q,correct:item.a,opts:opts};
}
var el=function(id){return document.getElementById(id);};
var round=0,correctCount=0,current=null,startTime=null,timerInt=null;
function nextRound(){
  current=genRound();
  el('roundLbl').textContent='Round '+(round+1)+' of '+TOTAL_ROUNDS;
  el('qtext').textContent=current.q;
  el('feedback').textContent='';
  if(el('rewardIcon')) el('rewardIcon').innerHTML='';
  var box=el('opts');box.innerHTML='';
  current.opts.forEach(function(w){
    var btn=document.createElement('button');
    btn.className='opt-btn';
    btn.textContent=w;
    btn.addEventListener('click',function(){onOptionClick(w,btn,box);});
    box.appendChild(btn);
  });
}
function onOptionClick(word, btnEl, box){
  if(box.dataset.locked==='1')return;
  if(word===current.correct){
    box.dataset.locked='1';
    btnEl.classList.add('correct');
    if(el('rewardIcon')) el('rewardIcon').innerHTML=iconSvg(current.correct);
    el('feedback').className='feedback good';
    el('feedback').textContent='Correct!';
    correctCount++;
    el('scoreLbl').textContent=correctCount+' correct';
    round++;
    if(round>=TOTAL_ROUNDS){ setTimeout(finishGame,700); }
    else{ setTimeout(function(){box.dataset.locked='';nextRound();},700); }
  }else{
    btnEl.classList.add('wrong');
    el('feedback').className='feedback bad';
    el('feedback').textContent='Not quite — try again.';
  }
}
function startGame(){
  round=0;correctCount=0;usedIdx=[];
  el('intro').classList.add('hidden');el('results').classList.add('hidden');
  el('game').classList.remove('hidden');
  el('scoreLbl').textContent='0 correct';
  nextRound();
  startTime=Date.now();
  clearInterval(timerInt);
  timerInt=setInterval(function(){
    var s=Math.floor((Date.now()-startTime)/1000);
    el('timerStat').textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
  },500);
}
function finishGame(){
  clearInterval(timerInt);
  var secs=Math.floor((Date.now()-startTime)/1000);
  var mm=Math.floor(secs/60),ss=secs%60;
  el('game').classList.add('hidden');
  el('results').classList.remove('hidden');
  el('finalTime').textContent=mm+':'+(ss<10?'0':'')+ss;
  var score=Math.max(0,1500-secs*3);
  if(window.ABCGame){
    window.ABCGame.submitScore(GAME_CODE,score,secs).then(function(){
      window.ABCGame.renderLeaderboard(GAME_CODE,el('lbList'),{limit:10});
    });
  }
}
el('startBtn').addEventListener('click',startGame);
el('againBtn').addEventListener('click',startGame);

</script>
</body>
</html>
