<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balancing Act — ABC Learning Portal</title>
<style>
:root{--red:#C0272D;--dark:#8f1c21;--cream:#FBF6F0;--ink:#241412;--line:#EBD8D5;--gold:#C8922A;--good:#2e7d32;--goodbg:#e8f5e9;--bad:#a01f24;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;}
header{background:var(--red);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
header h1{font-size:16px;font-weight:700;}
.stat{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:5px 10px;}
.wrap{max-width:540px;margin:0 auto;padding:22px 14px 60px;}
.intro,.results{background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px 24px;text-align:center;}
.intro h2,.results h2{font-family:Georgia,serif;font-size:22px;margin-bottom:10px;}
.intro p{font-size:14px;color:#555;line-height:1.6;margin-bottom:20px;}
.start-btn{background:var(--red);color:#fff;border:none;border-radius:5px;padding:13px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.start-btn:hover{background:var(--dark);}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px;text-align:center;}
.round-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;}
.eqn{font-size:22px;font-weight:700;margin:10px 0 26px;font-family:Georgia,serif;line-height:1.8;}
.coef{display:inline-block;min-width:26px;border-bottom:3px solid var(--gold);color:var(--gold);cursor:pointer;padding:0 2px;}
.coef.active{background:#FFF3E0;border-radius:4px;}
.coef.correct{border-color:var(--good);color:var(--good);}
.sub{font-size:11px;vertical-align:sub;}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:320px;margin:0 auto;}
.num-btn{background:#fff;border:2px solid var(--line);border-radius:7px;padding:12px 0;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;}
.num-btn:hover{border-color:var(--gold);}
.check-btn{width:100%;max-width:320px;margin:16px auto 0;background:var(--red);color:#fff;border:none;border-radius:6px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:block;}
.check-btn:hover{background:var(--dark);}
.feedback{font-size:13.5px;font-weight:600;margin-top:12px;min-height:18px;}
.feedback.good{color:var(--good);}
.feedback.bad{color:var(--bad);}
.results .time{font-size:40px;font-weight:800;color:var(--red);margin:10px 0 4px;}
.results .sub2{font-size:13px;color:#888;margin-bottom:18px;}
.lb-box{background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:20px;text-align:left;}
.lb-box h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:8px;font-weight:700;}
.abcg-lb-loading,.abcg-lb-empty{color:#999;font-size:12.5px;}
.abcg-lb-head,.abcg-lb-row{display:grid;grid-template-columns:24px 1fr 60px 60px;gap:6px;padding:3px 0;font-size:12.5px;}
.abcg-lb-head{color:#999;font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.05em;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px;}
.abcg-lb-row{color:var(--ink);}
.abcg-lb-me{font-weight:700;color:var(--red);}
.abcg-lb-rank{color:var(--gold);font-weight:700;}
.hidden{display:none;}
</style>
<script src="../../notation.js" defer></script>
</head>
<body>
<header>
  <a href="../games-list.html" class="back">&larr; All Games</a>
  <h1>Balancing Act</h1>
  <div class="stat" id="timerStat">0:00</div>
</header>
<div class="wrap">

  <div class="intro" id="intro">
    <h2>Balance the equation</h2>
    <p>Tap a gap to select it, then tap the correct number to fill it in. Balance every equation to move on. 8 rounds.</p>
    <button class="start-btn" id="startBtn">Start</button>
  </div>

  <div class="panel hidden" id="game">
    <div class="round-hdr"><span id="roundLbl">Equation 1 of 8</span><span id="scoreLbl">0 correct</span></div>
    <div class="eqn" id="eqnDisplay"></div>
    <div class="numpad" id="numpad"></div>
    <button class="check-btn" id="checkBtn">Check</button>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="results hidden" id="results">
    <h2>All equations balanced!</h2>
    <div class="time" id="finalTime">0:00</div>
    <div class="sub2">time taken</div>
    <div class="lb-box"><h4>Leaderboard</h4><div id="lbList"></div></div>
    <button class="start-btn" id="againBtn">Play Again</button>
    <div style="margin-top:10px;"><a href="../games-list.html" style="font-size:12.5px;color:#888;">All games &rarr;</a></div>
  </div>

</div>
<script>
var GAME_CODE='balancing-act';
var TOTAL_ROUNDS=8;

// Each equation defined as parts (array of {coef, formula}) with reactants/products split,
// plus the correct coefficients array in order they appear (blanks).
var BANK=[
  { parts:['__H<sub class="sub">2</sub>','+','__O<sub class="sub">2</sub>','\u2192','__H<sub class="sub">2</sub>O'], coefs:[2,1,2] },
  { parts:['__Mg','+','__O<sub class="sub">2</sub>','\u2192','__MgO'], coefs:[2,1,2] },
  { parts:['__N<sub class="sub">2</sub>','+','__H<sub class="sub">2</sub>','\u2192','__NH<sub class="sub">3</sub>'], coefs:[1,3,2] },
  { parts:['__Fe','+','__O<sub class="sub">2</sub>','\u2192','__Fe<sub class="sub">2</sub>O<sub class="sub">3</sub>'], coefs:[4,3,2] },
  { parts:['__CH<sub class="sub">4</sub>','+','__O<sub class="sub">2</sub>','\u2192','__CO<sub class="sub">2</sub>','+','__H<sub class="sub">2</sub>O'], coefs:[1,2,1,2] },
  { parts:['__Na','+','__Cl<sub class="sub">2</sub>','\u2192','__NaCl'], coefs:[2,1,2] },
  { parts:['__Zn','+','__HCl','\u2192','__ZnCl<sub class="sub">2</sub>','+','__H<sub class="sub">2</sub>'], coefs:[1,2,1,1] },
  { parts:['__H<sub class="sub">2</sub>','+','__Cl<sub class="sub">2</sub>','\u2192','__HCl'], coefs:[1,1,2] },
  { parts:['__C','+','__O<sub class="sub">2</sub>','\u2192','__CO<sub class="sub">2</sub>'], coefs:[1,1,1] },
  { parts:['__CaCO<sub class="sub">3</sub>','\u2192','__CaO','+','__CO<sub class="sub">2</sub>'], coefs:[1,1,1] }
];

function rnd(n){return Math.floor(Math.random()*n);}

var el=function(id){return document.getElementById(id);};
var round=0,correctCount=0,current=null,userVals=[],activeGap=null,startTime=null,timerInt=null;

function renderEquation(){
  var box=el('eqnDisplay');
  var gapIdx=0;
  var html='';
  current.parts.forEach(function(part){
    if(part.indexOf('__')===0){
      var val=userVals[gapIdx];
      var display = val===null ? '&nbsp;&nbsp;' : val;
      html+='<span class="coef" data-gap="'+gapIdx+'">'+display+'</span>'+part.slice(2)+' ';
      gapIdx++;
    }else{
      html+=part+' ';
    }
  });
  box.innerHTML=html;
  box.querySelectorAll('.coef').forEach(function(c){
    c.addEventListener('click',function(){selectGap(Number(c.dataset.gap));});
    if(Number(c.dataset.gap)===activeGap) c.classList.add('active');
  });
}

function selectGap(i){
  activeGap=i;
  renderEquation();
}

function renderNumpad(){
  var pad=el('numpad');pad.innerHTML='';
  for(var n=1;n<=6;n++){
    (function(n){
      var btn=document.createElement('button');
      btn.className='num-btn';
      btn.textContent=n;
      btn.addEventListener('click',function(){
        if(activeGap===null)return;
        userVals[activeGap]=n;
        renderEquation();
      });
      pad.appendChild(btn);
    })(n);
  }
}

function checkAnswer(){
  var allFilled=userVals.every(function(v){return v!==null;});
  if(!allFilled){
    el('feedback').className='feedback bad';
    el('feedback').textContent='Fill in every gap first.';
    return;
  }
  var ok=userVals.every(function(v,i){return v===current.coefs[i];});
  if(ok){
    el('feedback').className='feedback good';
    el('feedback').textContent='Balanced correctly!';
    el('eqnDisplay').querySelectorAll('.coef').forEach(function(c){c.classList.add('correct');});
    correctCount++;
    el('scoreLbl').textContent=correctCount+' correct';
    round++;
    if(round>=TOTAL_ROUNDS){
      setTimeout(finishGame,800);
    }else{
      setTimeout(nextRound,800);
    }
  }else{
    el('feedback').className='feedback bad';
    el('feedback').textContent='Not balanced yet — check the atom counts and try again.';
  }
}

function nextRound(){
  current=BANK[rnd(BANK.length)];
  userVals=current.coefs.map(function(){return null;});
  activeGap=0;
  el('roundLbl').textContent='Equation '+(round+1)+' of '+TOTAL_ROUNDS;
  el('feedback').textContent='';
  renderEquation();
}

function startGame(){
  round=0;correctCount=0;
  el('intro').classList.add('hidden');el('results').classList.add('hidden');
  el('game').classList.remove('hidden');
  el('scoreLbl').textContent='0 correct';
  renderNumpad();
  nextRound();
  startTime=Date.now();
  clearInterval(timerInt);
  timerInt=setInterval(function(){
    var s=Math.floor((Date.now()-startTime)/1000);
    el('timerStat').textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
  },500);
}

function finishGame(){
  clearInterval(timerInt);
  var secs=Math.floor((Date.now()-startTime)/1000);
  var mm=Math.floor(secs/60),ss=secs%60;
  el('game').classList.add('hidden');
  el('results').classList.remove('hidden');
  el('finalTime').textContent=mm+':'+(ss<10?'0':'')+ss;

  var score=Math.max(0,1500-secs*3);
  if(window.ABCGame){
    window.ABCGame.submitScore(GAME_CODE,score,secs).then(function(){
      window.ABCGame.renderLeaderboard(GAME_CODE,el('lbList'),{limit:10});
    });
  }
}

el('startBtn').addEventListener('click',startGame);
el('checkBtn').addEventListener('click',checkAnswer);
el('againBtn').addEventListener('click',startGame);
</script>
</body>
</html>
