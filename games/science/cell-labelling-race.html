<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--red:#C0272D;--dark:#8f1c21;--cream:#FBF6F0;--ink:#241412;--line:#EBD8D5;--gold:#C8922A;--good:#2e7d32;--goodbg:#e8f5e9;--bad:#a01f24;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;}
header{background:var(--red);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
header h1{font-size:16px;font-weight:700;}
.stat{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:5px 10px;}
.wrap{max-width:480px;margin:0 auto;padding:22px 14px 60px;}
.intro,.results{background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px 24px;text-align:center;}
.intro h2,.results h2{font-family:Georgia,serif;font-size:22px;margin-bottom:10px;}
.intro p{font-size:14px;color:#555;line-height:1.6;margin-bottom:20px;}
.start-btn{background:var(--red);color:#fff;border:none;border-radius:5px;padding:13px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.start-btn:hover{background:var(--dark);}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;text-align:center;}
.round-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;}
.target{font-size:19px;font-weight:800;margin:4px 0 14px;font-family:Georgia,serif;color:var(--red);}
#diagBox{display:flex;justify-content:center;margin-bottom:10px;}
#diagSvg{width:100%;max-width:340px;height:auto;}
.part-hit{fill:transparent;cursor:pointer;stroke:transparent;stroke-width:3;}
.part-hit.correct{fill:rgba(46,125,50,.25);stroke:var(--good);}
.part-hit.wrong{fill:rgba(160,31,36,.25);stroke:var(--bad);}
.feedback{font-size:13.5px;font-weight:600;margin-top:6px;min-height:18px;}
.feedback.good{color:var(--good);}
.feedback.bad{color:var(--bad);}
.results .time{font-size:40px;font-weight:800;color:var(--red);margin:10px 0 4px;}
.results .sub{font-size:13px;color:#888;margin-bottom:18px;}
.lb-box{background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:20px;text-align:left;}
.lb-box h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:8px;font-weight:700;}
.abcg-lb-loading,.abcg-lb-empty{color:#999;font-size:12.5px;}
.abcg-lb-head,.abcg-lb-row{display:grid;grid-template-columns:24px 1fr 60px 60px;gap:6px;padding:3px 0;font-size:12.5px;}
.abcg-lb-head{color:#999;font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.05em;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px;}
.abcg-lb-row{color:var(--ink);}
.abcg-lb-me{font-weight:700;color:var(--red);}
.abcg-lb-rank{color:var(--gold);font-weight:700;}
.hidden{display:none;}
</style>
<script src="../../notation.js" defer></script>
</head>
<body>
<header>
  <a href="../games-list.html" class="back">&larr; All Games</a>
  <h1>Cell Labelling Race</h1>
  <div class="stat" id="timerStat">0:00</div>
</header>
<div class="wrap">

  <div class="intro" id="intro">
    <h2>Label the cell</h2>
    <p>You'll see an animal or plant cell. Tap the part named at the top as fast as you can. 10 rounds, no skipping wrong taps.</p>
    <button class="start-btn" id="startBtn">Start</button>
  </div>

  <div class="panel hidden" id="game">
    <div class="round-hdr"><span id="roundLbl">Round 1 of 10</span><span id="scoreLbl">0 correct</span></div>
    <div class="target" id="targetLbl"></div>
    <div id="diagBox"><svg id="diagSvg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="results hidden" id="results">
    <h2>All rounds complete!</h2>
    <div class="time" id="finalTime">0:00</div>
    <div class="sub">time taken</div>
    <div class="lb-box"><h4>Leaderboard</h4><div id="lbList"></div></div>
    <button class="start-btn" id="againBtn">Play Again</button>
    <div style="margin-top:10px;"><a href="../games-list.html" style="font-size:12.5px;color:#888;">All games &rarr;</a></div>
  </div>

</div>
<script>
var GAME_CODE='cell-labelling-race';
var TOTAL_ROUNDS=10;
var NS='http://www.w3.org/2000/svg';

function rnd(n){return Math.floor(Math.random()*n);}
function svgEl(tag,attrs){var e=document.createElementNS(NS,tag);for(var k in attrs){e.setAttribute(k,attrs[k]);}return e;}

// Animal cell: outer membrane (ellipse), nucleus (circle), cytoplasm (fill region), mitochondria (small ellipses)
var ANIMAL_PARTS=[
  {name:'Cell membrane', shape:'ellipse', attrs:{cx:150,cy:150,rx:130,ry:110,fill:'#FDEBD0',stroke:'#C8922A','stroke-width':4}, hit:{shape:'ellipse',cx:150,cy:150,rx:130,ry:110}},
  {name:'Cytoplasm', shape:'ellipse', attrs:{cx:150,cy:150,rx:120,ry:100,fill:'#FCF3CF',opacity:0.5}, hit:{shape:'ellipse',cx:150,cy:150,rx:120,ry:100}},
  {name:'Nucleus', shape:'circle', attrs:{cx:150,cy:150,r:45,fill:'#AED6F1',stroke:'#1565C0','stroke-width':3}, hit:{shape:'circle',cx:150,cy:150,r:45}},
  {name:'Mitochondria', shape:'ellipse', attrs:{cx:90,cy:100,rx:18,ry:10,fill:'#F5B7B1',stroke:'#a01f24','stroke-width':2}, hit:{shape:'ellipse',cx:90,cy:100,rx:18,ry:10}}
];

var PLANT_PARTS=[
  {name:'Cell wall', shape:'rect', attrs:{x:20,y:20,width:260,height:260,fill:'none',stroke:'#2E7D32','stroke-width':6}, hit:{shape:'rectRing',x:20,y:20,w:260,h:260,thick:14}},
  {name:'Cell membrane', shape:'rect', attrs:{x:34,y:34,width:232,height:232,fill:'#E8F8F0',stroke:'#66BB6A','stroke-width':2}, hit:{shape:'rect',x:34,y:34,w:232,h:232}},
  {name:'Nucleus', shape:'circle', attrs:{cx:110,cy:110,r:40,fill:'#AED6F1',stroke:'#1565C0','stroke-width':3}, hit:{shape:'circle',cx:110,cy:110,r:40}},
  {name:'Chloroplast', shape:'ellipse', attrs:{cx:210,cy:200,rx:22,ry:12,fill:'#82C99A',stroke:'#2E7D32','stroke-width':2}, hit:{shape:'ellipse',cx:210,cy:200,rx:22,ry:12}},
  {name:'Vacuole', shape:'ellipse', attrs:{cx:190,cy:100,rx:38,ry:28,fill:'#D6EAF8',stroke:'#5DADE2','stroke-width':2}, hit:{shape:'ellipse',cx:190,cy:100,rx:38,ry:28}}
];

var el=function(id){return document.getElementById(id);};
var round=0,correctCount=0,currentParts=[],currentTarget=null,startTime=null,timerInt=null;

function pointInHit(hit){
  if(hit.shape==='circle'||hit.shape==='ellipse'){
    return {tag:'circle'}; // handled by drawing actual shape as hit target directly
  }
  return null;
}

function drawDiagram(parts){
  var svg=el('diagSvg');
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  var bg=svgEl('rect',{x:0,y:0,width:300,height:300,fill:'#FBF6F0'});
  svg.appendChild(bg);

  // draw visible shapes first (cytoplasm/background parts before nucleus etc. — order as defined)
  parts.forEach(function(p){
    var shape;
    if(p.shape==='ellipse') shape=svgEl('ellipse',p.attrs);
    else if(p.shape==='circle') shape=svgEl('circle',p.attrs);
    else if(p.shape==='rect') shape=svgEl('rect',p.attrs);
    svg.appendChild(shape);
  });

  // draw invisible/interactive hit targets on top, matching each part's actual visible shape (or ring for cell wall)
  parts.forEach(function(p){
    var hit=p.hit;
    var hitEl;
    if(hit.shape==='circle'){
      hitEl=svgEl('circle',{cx:hit.cx,cy:hit.cy,r:hit.r,class:'part-hit'});
    }else if(hit.shape==='ellipse'){
      hitEl=svgEl('ellipse',{cx:hit.cx,cy:hit.cy,rx:hit.rx,ry:hit.ry,class:'part-hit'});
    }else if(hit.shape==='rect'){
      hitEl=svgEl('rect',{x:hit.x,y:hit.y,width:hit.w,height:hit.h,class:'part-hit'});
    }else if(hit.shape==='rectRing'){
      // approximate ring by four thin rects along the border
      var g=svgEl('g',{class:'part-hit'});
      g.appendChild(svgEl('rect',{x:hit.x,y:hit.y,width:hit.w,height:hit.thick}));
      g.appendChild(svgEl('rect',{x:hit.x,y:hit.y+hit.h-hit.thick,width:hit.w,height:hit.thick}));
      g.appendChild(svgEl('rect',{x:hit.x,y:hit.y,width:hit.thick,height:hit.h}));
      g.appendChild(svgEl('rect',{x:hit.x+hit.w-hit.thick,y:hit.y,width:hit.thick,height:hit.h}));
      hitEl=g;
    }
    hitEl.dataset.name=p.name;
    hitEl.addEventListener('click',function(){onPartClick(p.name,hitEl);});
    svg.appendChild(hitEl);
  });
}

function nextRound(){
  var isAnimal=rnd(2)===0;
  currentParts = isAnimal ? ANIMAL_PARTS : PLANT_PARTS;
  currentTarget = currentParts[rnd(currentParts.length)];
  el('roundLbl').textContent='Round '+(round+1)+' of '+TOTAL_ROUNDS;
  el('targetLbl').textContent='Tap the: '+currentTarget.name+' ('+(isAnimal?'animal':'plant')+' cell)';
  el('feedback').textContent='';
  drawDiagram(currentParts);
}

function onPartClick(name, hitEl){
  if(el('diagSvg').dataset.locked==='1')return;
  if(name===currentTarget.name){
    el('diagSvg').dataset.locked='1';
    if(hitEl.tagName==='g'){hitEl.querySelectorAll('rect').forEach(function(r){r.classList.add('correct');});}
    hitEl.classList.add('correct');
    el('feedback').className='feedback good';
    el('feedback').textContent='Correct!';
    correctCount++;
    el('scoreLbl').textContent=correctCount+' correct';
    round++;
    if(round>=TOTAL_ROUNDS){
      setTimeout(finishGame,700);
    }else{
      setTimeout(function(){el('diagSvg').dataset.locked='';nextRound();},700);
    }
  }else{
    hitEl.classList.add('wrong');
    el('feedback').className='feedback bad';
    el('feedback').textContent='Not quite — try again.';
    setTimeout(function(){hitEl.classList.remove('wrong');},400);
  }
}

function startGame(){
  round=0;correctCount=0;
  el('intro').classList.add('hidden');el('results').classList.add('hidden');
  el('game').classList.remove('hidden');
  el('scoreLbl').textContent='0 correct';
  nextRound();
  startTime=Date.now();
  clearInterval(timerInt);
  timerInt=setInterval(function(){
    var s=Math.floor((Date.now()-startTime)/1000);
    el('timerStat').textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
  },500);
}

function finishGame(){
  clearInterval(timerInt);
  var secs=Math.floor((Date.now()-startTime)/1000);
  var mm=Math.floor(secs/60),ss=secs%60;
  el('game').classList.add('hidden');
  el('results').classList.remove('hidden');
  el('finalTime').textContent=mm+':'+(ss<10?'0':'')+ss;

  var score=Math.max(0,1400-secs*3);
  if(window.ABCGame){
    window.ABCGame.submitScore(GAME_CODE,score,secs).then(function(){
      window.ABCGame.renderLeaderboard(GAME_CODE,el('lbList'),{limit:10});
    });
  }
}

el('startBtn').addEventListener('click',startGame);
el('againBtn').addEventListener('click',startGame);
</script>
</body>
</html>
