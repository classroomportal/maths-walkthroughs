<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function parseLinearExpr(str,vars){
  if(!str)return null;
  str=str.replace(/\s+/g,'').toLowerCase();
  if(str==='')return null;
  var coeffs={};vars.forEach(function(v){coeffs[v]=0;});
  var constant=0;
  var re=/([+-]?\d*)([a-z])|([+-]?\d+)(?![a-z])/g;var m;var matchedAny=false;var idx=0;
  while((m=re.exec(str))){
    if(m.index!==idx)return null;
    idx=re.lastIndex;matchedAny=true;
    if(m[2]){
      var c=m[1],v=m[2];
      if(vars.indexOf(v)===-1)return null;
      if(c===''||c==='+')c='1';else if(c==='-')c='-1';
      coeffs[v]+=parseInt(c,10);
    } else if(m[3]!==undefined){
      constant+=parseInt(m[3],10);
    }
  }
  if(!matchedAny||idx!==str.length)return null;
  coeffs._const=constant;
  return coeffs;
}

function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();
  ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}

function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  var ex=o.extraHTML||'';
  var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  var ansBox=o.frac
    ? '<div class="ar"><div class="fracbox"><input type="number" step="any" placeholder="num" class="try-num" data-tryid="'+id+'"/><div class="fracline"></div><input type="number" step="any" placeholder="den" class="try-den" data-tryid="'+id+'"/></div><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    : o.vars
    ? '<div class="ar"><input type="text" placeholder="'+(o.placeholder||'e.g. 5x + 3')+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    : '<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>';
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">✔ Your Turn'
    +' <button class="newq-btn" data-tryid="'+id+'">↻ New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'+ex
    +ansBox
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'</div>';
}

function newQ(id){
  var e=ST[id]; if(!e||!e.genFn)return;
  var o=e.genFn(); e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');
  if(!box)return;
  var tmp=document.createElement('div');
  tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);
  ST[id]={o:o,genFn:e.genFn};
}

function ckById(id){
  var e=ST[id]; if(!e)return;
  var o=e.o;
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!fb)return;
  if(o.frac){
    var ni=document.querySelector('.try-num[data-tryid="'+id+'"]');
    var di=document.querySelector('.try-den[data-tryid="'+id+'"]');
    if(!ni||!di)return;
    var nv=parseFloat(ni.value),dv=parseFloat(di.value);
    if(isNaN(nv)||isNaN(dv)||dv===0){fb.className='try-fb fb er';fb.textContent='Enter a valid fraction (numerator and denominator).';return;}
    var ok=o.fracExact?(nv===o.ansN&&dv===o.ansD):(Math.abs(nv/dv-o.ansN/o.ansD)<1e-6);
    if(ok){
      fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
    }else if(o.fracExact&&Math.abs(nv/dv-o.ansN/o.ansD)<1e-6){
      fb.className='try-fb fb er';fb.textContent='That’s an equivalent fraction, but not fully simplified — try again.';
    }else{
      fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
    }
    return;
  }
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  if(!inp)return;
  if(o.vars){
    var parsed=parseLinearExpr(inp.value,o.vars);
    if(!parsed){fb.className='try-fb fb er';fb.textContent='Enter an expression, e.g. '+(o.placeholder||'5x + 3').replace('e.g. ','');return;}
    var ok2=true;
    for(var i=0;i<o.vars.length;i++){var vv=o.vars[i];if(parsed[vv]!==o.coeffs[vv])ok2=false;}
    var expectedConst=(o.constant!=null)?o.constant:0;
    if(parsed._const!==expectedConst)ok2=false;
    if(ok2){fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;}
    else{fb.className='try-fb fb er';fb.textContent='Not quite — try again.';}
    return;
  }
  var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(o.range){
    if(v>o.rangeMin && v<o.rangeMax){
      fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
    }else{
      fb.className='try-fb fb er';fb.textContent='Not quite — that’s outside the range. Try again.';
    }
    return;
  }
  var tol = o.tol!=null ? o.tol : (o.exact!=null ? o.exact : 0.5);
  if(Math.abs(v-o.ans)<=tol){
    fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
  }else{
    fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
  }
}

document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){
    newQ(btn.getAttribute('data-tryid'));
  } else if(btn.classList.contains('try-ck')){
    ckById(btn.getAttribute('data-tryid'));
  }
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial,sans-serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#C0272D')+'" stroke-width="'+(w||2)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fce8d8')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'"/>';}
function dQ1(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  var seq=[3,7,11,15,19];
  seq.forEach(function(v,i){o.push(R(20+i*92,20,80,44,'#fff5f0','#C0272D',1.5));o.push(T(60+i*92,48,v,'#C0272D',20,'middle',true));});
  if(p>=1){o.push(T(240,85,'Differences: +4, +4, +4, +4 \u2192 arithmetic','#888',12,'middle',false));}
  if(p>=2){o.push(T(240,108,'nth term = 4n \u2212 1','#1a5a8a',16,'middle',true));o.push(T(240,128,'Check n=1: 4(1)\u22121 = 3 \u2713','#888',11,'middle',false));}
  if(p>=3){o.push(R(80,145,320,42,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,171,'10th term = 4(10)\u22121 = 39','#1a7a3a',15,'middle',true));}
  s.innerHTML=o.join('');}

function dQ2(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'A decreasing sequence','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Find the nth term of 25, 20, 15, 10, ...','#241A17',14,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'Common difference = \u22125','#C0272D',14,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'nth term = \u22125n + 30','#1a7a3a',14,'middle',true));}s.innerHTML=o.join('');}

function dQ3(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Working backwards: is a value in the sequence?','#C0272D',12,'middle',true));if(p>=1){o.push(T(240,60,'nth term is 3n+2. Is 47 a term?','#241A17',15,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'Set 3n+2=47, solve for n','#C0272D',13,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'n=15 (whole number) \u2192 YES','#1a7a3a',14,'middle',true));}s.innerHTML=o.join('');}

function dQ4(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Finding which term equals a value','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'nth term is 5n\u22123. Which term equals 42?','#241A17',14,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'5n\u22123=42','#C0272D',16,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'5n=45, n=9','#1a7a3a',18,'middle',true));}s.innerHTML=o.join('');}

function dQ5(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'A common mistake','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Sequence 6,10,14,18 \u2014 is the nth term just 4n?','#241A17',13,'middle'));}if(p>=2){o.push(R(140,76,200,34,'#fde8e8','#C0272D',1.5));o.push(T(240,98,'4n gives 4,8,12,16 \u2014 NOT matching!','#C0272D',12,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'Correct: 4n + 2','#1a7a3a',15,'middle',true));}if(p>=4){o.push(T(240,178,'ALWAYS check your formula against n=1 before finalizing','#888',11,'middle',false));}s.innerHTML=o.join('');}

// ── Auto-reader ───────────────────────────────────────────────────────
var voiceSelEl = document.getElementById('voiceSel');
var readerStatusEl = document.getElementById('readerStatus');
var readBtnEl = document.getElementById('readBtn');
var autoBtnEl = document.getElementById('autoBtn');
var stopBtnEl = document.getElementById('stopReadBtn');
var autoPlaying = false;
var userPickedVoice = false;

function populateVoices(){
  var voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){return v.lang.indexOf('en')===0;});
  voiceSelEl.innerHTML = '<option value="">Default voice</option>' + voices.map(function(v,i){return '<option value="'+i+'">'+v.name+' ('+v.lang+')</option>';}).join('');
}
if (window.speechSynthesis) {
  populateVoices();
  speechSynthesis.onvoiceschanged = populateVoices;
}
voiceSelEl.addEventListener('change', function(){ userPickedVoice = (voiceSelEl.value !== ''); });
function currentVoice(){
  if (!userPickedVoice) return null;
  var voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){return v.lang.indexOf('en')===0;});
  return voices[parseInt(voiceSelEl.value,10)] || null;
}
function hasInteractiveQuestion(st){ return st.ht.indexOf('data-tryid')>-1; }

function stopReading(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  autoPlaying = false;
  readBtnEl.disabled = false; autoBtnEl.disabled = false;
  stopBtnEl.style.display = 'none';
  readerStatusEl.textContent = '';
  window.__activeUtterance = null;
}

function speakStep(st, onDone){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech isn’t supported on this browser.'; if(onDone) onDone(); return; }
  if (!st.speak) { if(onDone) onDone(); return; }
  var u = new SpeechSynthesisUtterance(st.speak);
  var v = currentVoice();
  if (v) u.voice = v;
  u.rate = 0.95;
  u.onend = function(){ window.__activeUtterance = null; if (onDone) onDone(); };
  u.onerror = function(ev){
    window.__activeUtterance = null;
    readerStatusEl.textContent = 'Couldn’t play audio (' + (ev && ev.error ? ev.error : 'unknown error') + '). Check the device isn’t muted and try again.';
    if (onDone) onDone();
  };
  window.__activeUtterance = u;
  speechSynthesis.speak(u);
  setTimeout(function(){
    if (window.__activeUtterance === u && !speechSynthesis.speaking && !speechSynthesis.pending) {
      readerStatusEl.textContent = 'No audio started — try tapping the button again, or check the device isn’t on silent/muted.';
    }
  }, 600);
}

readBtnEl.addEventListener('click', function(){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech not supported on this device.'; return; }
  speechSynthesis.cancel();
  readBtnEl.disabled = true; autoBtnEl.disabled = true; stopBtnEl.style.display = 'inline-block';
  readerStatusEl.textContent = 'Reading…';
  var st = QS[qi].steps[si];
  speakStep(st, function(){
    readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
  });
});

autoBtnEl.addEventListener('click', function(){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech not supported on this device.'; return; }
  speechSynthesis.cancel();
  autoPlaying = true;
  readBtnEl.disabled = true; autoBtnEl.disabled = true; stopBtnEl.style.display = 'inline-block';
  autoStep();
});

stopBtnEl.addEventListener('click', stopReading);

function autoStep(){
  if (!autoPlaying) return;
  var q = QS[qi], st = q.steps[si];
  readerStatusEl.textContent = 'Reading step '+(si+1)+' of '+q.steps.length+'…';
  speakStep(st, function(){
    if (!autoPlaying) return;
    if (hasInteractiveQuestion(st)) {
      autoPlaying = false;
      readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
      readerStatusEl.textContent = 'Your turn — try the question below.';
      return;
    }
    if (si < q.steps.length-1) {
      si++;
      var p=document.getElementById('pn'); var nst=q.steps[si];
      p.innerHTML='<div class="sl">'+nst.lb+'</div>'+nst.ht; nst.dr(si);
      p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');
      bDT();
      autoStep();
    } else {
      autoPlaying = false;
      readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
      readerStatusEl.textContent = 'Question narrated.';
    }
  });
}

render();

</script>
