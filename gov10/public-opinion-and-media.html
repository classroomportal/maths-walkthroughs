<style>

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Public Opinion and Political Participation',ACC,12,'middle',true));
var rows=[['Public opinion','The collective views/attitudes of citizens on political issues'],['Political socialisation','Process by which people learn political values (family, school, media)'],['Voting','Most common form of participation; expresses public preferences'],['Political party','Organised group seeking to win elections and form government'],['Pressure group','Group that seeks to influence policy without seeking power itself'],['Mass media','Shapes and reflects public opinion (TV, radio, internet, newspapers'],['Civil society','Organisations between government and individuals that promote interests']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,30+i*30,460,24,CRM,LINE,1));o.push(T(130,44+i*30,r[0],ACC,8,'middle',true));o.push(T(330,44+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Types of Pressure Groups',ACC,12,'middle',true));
var rows=[['Sectional/interest','Protect narrow interests of specific groups (NMA, NBA, NLC)'],['Promotional/cause','Promote a cause beyond their membership (Amnesty International)'],['Insider groups','Have regular access to government; consulted by policy makers'],['Outsider groups','No formal access to government; rely on public campaigns'],['Lobby groups','Professionally paid to represent interests before government'],['Think tanks','Research organisations influencing policy through ideas']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(120,52+i*32,r[0],ACC,8,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Public Opinion and Participation — Summary',ACC,12,'middle',true));
var rows=[['Public opinion','Collective views of citizens; shaped by media, parties, groups'],['Political socialisation','Family, school, media, peers shape political values'],['Pressure groups','Sectional (NMA, NBA) or cause-based (Amnesty); insider or outsider'],['Media','TV, radio, internet shape and reflect public opinion'],['Participation','Voting, parties, pressure groups, protests, community service'],['WAEC tip','Know types of pressure groups with Nigerian examples']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(100,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov \u2022 ELE',ti:'What is Public Opinion?',su:'Define public opinion and examine its formation.',steps:[
{lb:'Definition and importance',dr:dQ1,ht:'<p><b>Public opinion</b> refers to the collective views, attitudes and preferences of citizens on political issues and policies. It is important because: (1) In democracies, governments are responsive to public opinion — failure to do so risks losing elections. (2) Public opinion shapes the policy agenda — what issues government addresses. (3) Public opinion legitimises or delegitimises government decisions. (4) Measuring public opinion (through polls and surveys) helps governments understand citizen preferences. However, "the public" is not monolithic — opinions vary by education, region, ethnicity, religion, age and income in Nigeria.</p>'},
{lb:'How public opinion is formed — political socialisation',dr:dQ2,ht:'<p><b>Political socialisation</b> is the process through which people learn and internalise political values, beliefs and behaviours. Key agents: (1) <b>Family</b> — primary and earliest influence; children often adopt parents\' political leanings. (2) <b>Schools and education</b> — citizenship education; exposure to diverse views. (3) <b>Mass media</b> — television, radio, newspapers, internet and social media shape political views. (4) <b>Peer groups</b> — social circles and communities influence political attitudes. (5) <b>Religion</b> — particularly influential in Nigeria; religious leaders shape political views of their congregations. (6) <b>Political parties</b> — mobilise opinion and provide political identities.</p>'},
{lb:'The role of mass media',dr:dQ1,ht:'<p>The <b>mass media</b> plays a critical role in shaping public opinion: (1) <b>Agenda-setting</b> — the media decides which issues receive attention, influencing what citizens think about. (2) <b>Framing</b> — how an issue is presented shapes how people think about it. (3) <b>Gatekeeping</b> — media decides what information reaches the public. (4) <b>Watchdog role</b> — investigative journalism holds government to account. (5) In Nigeria, both traditional media (NTA, AIT, The Punch, Guardian) and social media (Twitter/X, WhatsApp, Facebook) are powerful opinion-shapers. Social media has democratised opinion formation — anyone can now contribute to public discourse.</p>'},
{lb:'Public opinion and democracy',dr:dQ2,ht:'<p>In a democracy, public opinion is fundamental: (1) Elections translate public opinion into political power. (2) Governments must remain responsive to changing public opinion to maintain legitimacy. (3) Public opinion polls help quantify citizen views. (4) Dangers: uninformed public opinion (based on misinformation); manipulation by elites through propaganda; majority tyranny (the majority\'s opinion suppressing minority rights). (5) In Nigeria, public opinion is heavily influenced by ethnicity, religion and region — making it particularly diverse and complex. For WAEC: know what public opinion is, how it is formed, its importance, and its limitations.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Public opinion refers to:',o:['The official position of the government on political issues','The collective views and attitudes of citizens on political issues','The position of the most educated members of society','The views expressed in newspaper editorials only'],a:2,w:'Public opinion = the collective views, attitudes and preferences of citizens on political issues and policies. It is diverse, constantly changing and fundamental to democratic governance.'},{q:'Political socialisation is the process by which:',o:['Politicians are trained in government schools','Citizens register to vote in elections','People learn and internalise political values, beliefs and behaviours','Political parties recruit new members'],a:3,w:'Political socialisation — the process through which individuals learn political values, beliefs and behaviours from agents including family, school, media, peers and religion.'},{q:'The media\'s "agenda-setting" function means:',o:['The media can force governments to adopt specific policies','The media decides which issues receive public attention, influencing what people think about','The media has a formal constitutional role in setting government agenda','The media appoints the chairs of parliamentary committees'],a:2,w:'Agenda-setting — the media\'s power to decide which issues receive attention. By highlighting certain topics and ignoring others, the media influences what citizens consider important.'},{q:'Which of these is the PRIMARY agent of political socialisation?',o:['Political parties','The mass media','The family — the earliest and most direct influence on political values','The government\'s civic education programmes'],a:3,w:'The family is the primary agent of political socialisation — the earliest and most pervasive influence on political attitudes. Children often adopt their parents\' political leanings before any other influence is felt.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 ELE',ti:'Pressure Groups',su:'Define pressure groups and distinguish their types.',steps:[
{lb:'What is a pressure group?',dr:dQ2,ht:'<p>A <b>pressure group</b> (also called an interest group or lobby group) is an organised group that seeks to influence government policy and decisions without seeking to form a government itself. This distinguishes pressure groups from political parties (which seek to win elections and govern). Pressure groups: represent specific interests or causes; lobby legislators, ministers and officials; conduct public campaigns; use media to build support; may take court action; participate in public consultations. They are a crucial feature of democratic pluralism — multiple groups compete to influence policy, preventing any single interest from dominating.</p>'},
{lb:'Types of pressure groups',dr:dQ2,ht:'<p>Two main types: (1) <b>Sectional/Interest groups</b> — represent the interests of a specific section of society: Nigerian Medical Association (NMA — doctors); Nigerian Bar Association (NBA — lawyers); Nigeria Labour Congress (NLC — workers); Manufacturers Association of Nigeria (MAN). (2) <b>Cause/Promotional groups</b> — promote a cause or set of values for the benefit of society broadly, beyond their own membership: Amnesty International (human rights); WWF Nigeria (environment); Save the Children; religious organisations acting politically. Some groups can overlap both categories.</p>'},
{lb:'Insider vs outsider pressure groups',dr:dQ1,ht:'<p>Groups are also classified by their access to government: <b>Insider groups</b> — have regular, formal access to government; consulted by policy makers; included in committees and consultations; e.g. NMA is consulted on health policy; NLC is consulted on labour legislation. <b>Outsider groups</b> — lack formal access; rely on public campaigns, protests, media and direct action to influence policy; e.g. human rights groups without government partnerships; environmental activist groups. Insider status gives more direct influence but may compromise independence. Outsider groups may be more radical but have less direct policy access.</p>'},
{lb:'Methods of pressure group activity',dr:dQ2,ht:'<p>Methods used by pressure groups: (1) <b>Lobbying</b> — directly meeting and persuading legislators and officials. (2) <b>Public campaigns</b> — advertising, marches, petitions to build public support. (3) <b>Media campaigns</b> — press releases, social media, interviews. (4) <b>Legal action</b> — taking government to court (e.g. SERAP suing the federal government). (5) <b>Direct action</b> — strikes (NLC), boycotts, sit-ins (more extreme). (6) <b>Research and publications</b> — publishing reports that influence policy debate. In Nigeria, the NLC\'s strike threat is a powerful lobbying tool; SERAP\'s court actions have forced government transparency.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The key difference between a pressure group and a political party is that:',o:['Pressure groups are larger than political parties','Pressure groups seek to influence policy without seeking to govern; parties seek to win elections and form government','Pressure groups operate internationally while parties operate only nationally','Pressure groups are funded by government while parties are funded privately'],a:2,w:'Pressure groups seek to INFLUENCE policy decisions without forming a government. Political PARTIES seek to win elections and form a government. This is the fundamental distinction.'},{q:'The Nigerian Medical Association (NMA) is an example of:',o:['A cause/promotional pressure group — it promotes health for all Nigerians','A sectional/interest pressure group — it represents the specific interests of medical doctors','A political party that campaigns on healthcare issues','An international pressure group with its headquarters abroad'],a:2,w:'NMA = sectional/interest pressure group. It represents the specific professional interests of medical doctors in Nigeria (salaries, working conditions, licensing). This contrasts with cause groups that promote broader societal interests.'},{q:'An "insider" pressure group is one that:',o:['Has the largest membership of any pressure group in the country','Uses exclusively illegal methods to influence government','Has regular formal access to government and is consulted on relevant policy decisions','Is based inside Nigeria rather than being an international organisation'],a:3,w:'Insider pressure groups have regular formal access to government — consulted in policy committees, invited to submit evidence, involved in regulatory processes. They trade some independence for direct influence.'},{q:'SERAP in Nigeria primarily influences government through:',o:['Fielding candidates in elections to win legislative seats','Going on strike and organising workers\' boycotts','Taking legal action — suing the government in court on accountability and rights issues','Publishing magazines and newspapers to shift public opinion'],a:3,w:'SERAP (Socio-Economic Rights Accountability Project) primarily uses legal action — suing the federal and state governments in court on transparency, budget accountability and socio-economic rights issues.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 ELE',ti:'Political Parties',su:'Examine political parties, their functions and Nigeria\'s party system.',steps:[
{lb:'What is a political party?',dr:dQ3,ht:'<p>A <b>political party</b> is an organised group of people with shared political ideologies who seek to win elections, gain power and implement their policies through government. Parties are the central organisational unit of democratic politics. Functions of political parties: (1) Recruiting and selecting candidates for election. (2) Formulating policies and manifestos. (3) Mobilising voters. (4) Forming and organising governments. (5) Providing loyal opposition (parties not in power hold the government to account). (6) Aggregating diverse interests into coherent policy positions. (7) Political education and socialisation of citizens.</p>'},
{lb:'Types of party systems',dr:dQ4,ht:'<p>Types of party systems: (1) <b>One-party system</b> — only one party exists and rules (China, Cuba, pre-1991 Soviet Union). No genuine electoral competition; authoritarian. (2) <b>Two-party system</b> — two dominant parties alternate in power (USA: Democrats/Republicans; UK historically: Labour/Conservative). Simple and stable but limits choice. (3) <b>Multi-party system</b> — three or more significant parties (Germany, France, Nigeria in some periods). More choice and representation; may require coalition governments. Nigeria has had periods of two-party (1992-93: SDP/NRC) and multi-party (post-1999: PDP dominance, then APC emergence) systems.</p>'},
{lb:'Nigeria\'s party system',dr:dQ3,ht:'<p>Nigeria\'s post-1999 party system: 1999-2015: PDP (People\'s Democratic Party) dominance — won four consecutive presidential elections. 2015-present: APC (All Progressives Congress) emerged and defeated PDP in 2015 — Nigeria\'s first democratic power transfer. 2023 election: Labour Party\'s Peter Obi emerged as a significant third-force candidate (received 25% of votes). Key parties currently: APC (Bola Tinubu won 2023 elections), PDP (main opposition), Labour Party, NNPP, and many others. INEC registers political parties and ensures they meet constitutional requirements (including national spread of membership).</p>'},
{lb:'Strengths and weaknesses of parties in Nigeria',dr:dQ4,ht:'<p>Strengths of Nigerian political parties: Many parties offer citizens choice; parties have facilitated peaceful democratic transitions (2015 power transfer). Weaknesses: (1) Ideology is weak — parties are primarily patronage vehicles, not ideological. (2) Party switching is common — politicians change parties opportunistically. (3) Godfatherism — powerful political patrons control party nominations. (4) Money politics — parties depend on wealthy individuals rather than membership dues. (5) Federal Character requirements for party offices. For WAEC: know the functions of political parties, types of party systems, and Nigerian examples (PDP, APC, Labour Party).</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'A political party differs from a pressure group primarily because:',o:['Political parties have more members than pressure groups','Political parties seek to WIN elections and form government; pressure groups seek to INFLUENCE policy without governing','Political parties are funded publicly while pressure groups are funded privately','Political parties operate nationally while pressure groups only operate locally'],a:2,w:'Political parties seek to WIN POWER through elections and FORM GOVERNMENT. Pressure groups seek to INFLUENCE policy decisions without seeking to govern. This is the fundamental distinction.'},{q:'A "two-party system" refers to:',o:['A system where only two parties are allowed by law','A system where two dominant parties dominate electoral competition and alternate in power','A system where two parties always form a coalition government together','A system where parties must have at least two candidates for every election'],a:2,w:'A two-party system (e.g. USA, UK historically) is one where two dominant parties consistently win most seats and alternate in power. Other parties exist but rarely win significant legislative power.'},{q:'Nigeria\'s first peaceful democratic transfer of power from one party to another occurred in:',o:['1999 when Obasanjo defeated military rule','2007 when Yar\'Adua succeeded Obasanjo (both PDP)','2015 when APC\'s Buhari defeated incumbent PDP President Jonathan','2023 when Tinubu of APC won the presidential election'],a:3,w:'2015 — Nigeria\'s first democratic power transfer between parties: Muhammadu Buhari (APC) defeated sitting President Goodluck Jonathan (PDP), who conceded before results were finalised. This was historic for Nigerian democracy.'},{q:'The primary function of political parties in a democracy is to:',o:['Advise the government on all decisions without being elected','Recruit candidates, formulate policies, mobilise voters and form governments','Protect the interests of specific professional groups in society','Monitor the media and prevent publication of false information'],a:2,w:'Political parties\' primary functions: recruit/select candidates; formulate policies; mobilise voters to vote for them; form governments when they win; provide opposition when they lose.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 ELE',ti:'Elections and Electoral Systems',su:'Examine elections and electoral systems in Nigeria.',steps:[
{lb:'What is an election?',dr:dQ4,ht:'<p>An <b>election</b> is a formal process by which citizens choose their representatives or decide policy issues. Elections are the cornerstone of representative democracy. Types of elections in Nigeria: (1) Presidential election — every 4 years; first and second round system (winner must get at least 25% in 2/3 of states). (2) Governorship elections — each state every 4 years. (3) National Assembly elections — Senate and House of Representatives every 4 years. (4) State House of Assembly elections. (5) Local Government elections — conducted by State Independent Electoral Commissions (SIECs). INEC (Independent National Electoral Commission) conducts federal elections in Nigeria.</p>'},
{lb:'Nigeria\'s electoral system',dr:dQ4,ht:'<p>Nigeria uses the <b>First-Past-the-Post (FPTP)</b> system for most elections (whoever gets the most votes wins). Special rule for the presidential election: the winner must get the most votes overall AND at least 25% of votes in at least 24 states (two-thirds of 36 states). This prevents a purely regional candidate from winning the presidency with a concentrated northern or southern vote. If no candidate meets this threshold, a run-off election is held. Electoral reforms: the Electoral Act 2022 introduced BVAS (Bimodal Voter Accreditation System) and IReV (INEC Result Viewing Portal) to reduce fraud and improve transparency.</p>'},
{lb:'INEC and electoral administration',dr:dQ3,ht:'<p><b>INEC</b> (Independent National Electoral Commission) is the body responsible for organising and supervising federal elections in Nigeria. Functions: (1) Voter registration and the Permanent Voter Card (PVC). (2) Delimiting (setting) constituency boundaries. (3) Registering and deregistering political parties. (4) Conducting elections and announcing results. (5) Monitoring political parties\' finances and compliance with regulations. Challenges facing INEC: electoral violence; logistics in remote areas; voter apathy; allegations of bias; funding limitations; manipulation of results. The 2022 Electoral Act sought to strengthen INEC\'s independence and introduce technology.</p>'},
{lb:'Electoral malpractice and reforms',dr:dQ4,ht:'<p>Electoral malpractice in Nigeria has included: vote buying; ballot box snatching; voter intimidation; results manipulation; under-age voting; multiple registration; impersonation. Consequences: undermines legitimacy; reduces voter turnout; distorts public opinion. Reforms: BVAS (Biometric Voter Accreditation System — introduced 2023); IReV (online results portal); electronic transmission of results (partial implementation); stronger penalties for electoral offences; increased INEC budget; Civil Society observation (TMG, Yiaga Africa). For WAEC: know what INEC is, FPTP system, the presidential 25% rule, and at least three types of electoral malpractice with remedies.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'Nigeria uses which electoral system for most elections?',o:['Proportional Representation — seats allocated proportionally to votes','First-Past-the-Post (FPTP) — candidate with most votes wins','Single Transferable Vote — voters rank candidates','Two-round system — if no majority, top two candidates have a run-off'],a:2,w:'Nigeria uses FPTP (First-Past-the-Post) for most elections — the candidate with the most votes wins, even without an absolute majority. The presidential election has an additional 25% threshold requirement.'},{q:'For a presidential candidate in Nigeria to win WITHOUT a run-off, they must:',o:['Get more than 50% of all votes cast nationwide','Get the most votes overall AND at least 25% of votes in at least 24 of the 36 states','Get more votes than all other candidates combined','Win in at least 30 of the 36 states regardless of the national vote share'],a:2,w:'Nigeria\'s constitutional requirement: win the most votes overall AND get at least 25% in at least 2/3 of states (24 out of 36). This prevents purely regional candidates from winning the presidency.'},{q:'INEC stands for:',o:['Independent National Electoral Commission','Institute of National Elections and Campaigns','Integrated National Elections Committee','Independent National Executive Commission'],a:1,w:'INEC = Independent National Electoral Commission — the federal body responsible for organising Nigerian presidential, gubernatorial and National Assembly elections, registering parties and administering the electoral process.'},{q:'BVAS in Nigeria\'s electoral context refers to:',o:['Biometric Voter Accreditation System — used to verify voters and reduce fraud','Budget Verification and Allocation System — used by INEC for financial planning','Ballot Verification and Accreditation System — used to count votes electronically','Bank Verification Account System — used to pay electoral officers'],a:1,w:'BVAS = Biometric Voter Accreditation System — introduced for Nigeria\'s 2023 elections to verify voters biometrically (fingerprint and facial recognition) and eliminate multiple voting and impersonation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 ELE',ti:'WAEC Prep — Public Opinion and Participation',su:'Practise WAEC-style questions on public opinion and political participation.',steps:[
{lb:'WAEC essay structure',dr:dQ5,ht:'<p>For WAEC questions on public opinion and political participation: (1) Define public opinion and how it is formed (political socialisation). (2) Discuss agents of socialisation (family, school, media, religion, parties). (3) Describe forms of political participation (voting, parties, pressure groups, protests, community service). (4) Discuss pressure groups (definition; types; methods; examples). (5) Discuss political parties (definition; functions; party systems). (6) Discuss elections and INEC. (7) Evaluate the health of democratic participation in Nigeria.</p>'},
{lb:'Key terms and examples',dr:dQ5,ht:'<p>Key terms: Public opinion = collective views of citizens. Political socialisation = learning political values. Political participation = any action aimed at influencing government. Pressure group = sectional (NMA, NBA, NLC) or cause (Amnesty, SERAP). Insider (formal access) vs outsider (public campaigns). Political party = seeks to govern; party system = one-party/two-party/multi-party. Election = formal choice; FPTP; INEC; BVAS; IReV. Electoral malpractice = vote buying; ballot snatching; rigging. Voter apathy = reluctance to participate. Active citizenship = NYSC, civil society, voting, reporting corruption.</p>'},
{lb:'Pressure groups — detailed review',dr:dQ2,ht:'<p>Pressure group review for WAEC: Definition — organised group that seeks to influence government policy without seeking to govern. Types: Sectional/Interest — NMA (doctors), NBA (lawyers), NLC (workers), MAN (manufacturers). Cause/Promotional — Amnesty International, SERAP, WWF, Save the Children, religious bodies. Methods: lobbying, public campaigns, media, legal action, strikes, research/publications. Insider (consulted by government) vs outsider (rely on campaigns). Key distinction from parties: pressure groups do NOT seek power themselves. Significance: represent diverse interests; counterbalance government power; hold government accountable.</p>'},
{lb:'Common WAEC mistakes',dr:dQ1,ht:'<p>Avoid: Confusing political parties (seek power) with pressure groups (seek influence). Saying all pressure groups use the same methods — they use different methods depending on their resources and access. Saying public opinion is fixed — it changes constantly. Attributing political socialisation only to the media — family is primary. Saying INEC conducts local government elections (SIECs do). Saying Nigeria always had a two-party system (it has been multi-party since 1999). Not giving Nigerian examples for pressure groups — WAEC expects local examples (NMA, NBA, NLC, SERAP, TMG).</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'Political participation includes which of the following activities?',o:['Only voting in elections','Only membership in a political party','Voting, joining parties, belonging to pressure groups, community service, protests, and civic engagement','Only activities that directly challenge the government'],a:3,w:'Political participation = any action aimed at influencing government or political outcomes: voting, party membership, pressure group activity, community service, protests, public hearings, civil society work.'},{q:'The Nigeria Labour Congress (NLC) is an example of:',o:['A cause/promotional pressure group promoting workers\' rights for all Nigerians','A sectional/interest pressure group representing the specific interests of organised labour/workers','A political party that fields candidates in elections on workers\' issues','An insider government body that advises the Ministry of Labour'],a:2,w:'NLC = sectional/interest pressure group. It represents the specific interests of organised workers (wages, conditions, rights). It is Nigeria\'s largest and most powerful trade union federation.'},{q:'Which electoral body is responsible for conducting LOCAL GOVERNMENT elections in Nigeria?',o:['INEC (Independent National Electoral Commission)','The Supreme Court','SIECs (State Independent Electoral Commissions)','The National Assembly elections committee'],a:3,w:'SIECs (State Independent Electoral Commissions) conduct local government elections in Nigeria. INEC conducts federal elections (presidential, governorship, National Assembly). This division was established in the 1999 Constitution.'},{q:'Voter apathy refers to:',o:['Citizens voting for the wrong candidate','Citizens registering to vote but not showing up on election day — lack of interest or willingness to participate','Citizens spoiling their ballot papers in protest','Citizens who vote more than once in an election'],a:2,w:'Voter apathy — the reluctance or unwillingness of eligible voters to participate in elections. Causes: cynicism; belief that participation makes no difference; poverty; poor logistics; electoral violence and mistrust of the process.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 ELE',ti:'Mixed Questions — Public Opinion and Participation',su:'Integrated revision across GOV-ELE-08.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Public opinion = collective views of citizens; shaped by political socialisation (family, school, media, religion, parties). Mass media: agenda-setting, framing, watchdog. Political participation: voting, parties, pressure groups, protests, community service. Pressure groups: sectional (NMA, NBA, NLC, MAN) or cause (Amnesty, SERAP, WWF). Insider (formal access) vs outsider (campaigns). Methods: lobbying, media, legal action, strikes. Political parties: seek to govern; one-party/two-party/multi-party. Nigeria: PDP dominance → APC 2015 → Labour Party 2023. INEC conducts federal elections. FPTP system. Presidential 25% rule. BVAS for 2023 elections. Electoral malpractice types and remedies.</p>'},
{lb:'Critical evaluation',dr:dQ10,ht:'<p>Critical evaluation of political participation in Nigeria: Voter registration has increased (over 93 million registered for 2023). Voter turnout has been low and declining (2023: ~27%). Public opinion is heavily influenced by ethnicity and religion, not just policy. Pressure groups like NLC have influenced policy (minimum wage increases); SERAP has won court judgments. Electoral reforms (BVAS, IReV) improved transparency in 2023. Challenges: vote buying; violence; INEC capacity; results disputes. Progress: 2015 peaceful power transfer; growing civil society; youth mobilisation (EndSARS, Labour Party 2023). Democracy is deepening but unevenly.</p>'},
{lb:'Comparing participation channels',dr:dQ1,ht:'<p>Comparison: Voting — most accessible but once every 4 years; determines who governs. Parties — ongoing participation; requires more commitment. Pressure groups — continuous influence; can target specific policy areas; not tied to elections. Community service/NYSC — civic contribution; builds social capital. Protests — dramatic; grabs attention but may face repression. Media/social media — democratises voice; anyone can participate. Each channel has strengths and weaknesses. In Nigeria, social media (especially Twitter/X and WhatsApp) has emerged as the most dynamic space for political discussion and mobilisation among young people.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final revision: Know definitions for public opinion, political socialisation, pressure group, political party, election. Know the difference between sectional and cause pressure groups with Nigerian examples. Know insider vs outsider distinction. Know Nigeria\'s electoral system (FPTP, presidential 25% rule, INEC, BVAS). Know types of party systems. Know Nigerian party history (PDP, APC, Labour Party). For essays: define → types → examples → methods → importance → evaluation. Include Nigerian examples wherever possible — WAEC rewards local application. Always evaluate: what works well, what needs reform.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'The "watchdog" role of the media in a democracy refers to:',o:['The media watching and reporting sports events for citizens','The media\'s role in investigating and reporting on government conduct, holding power to account','The government using the media to watch and monitor citizens\' behaviour','The media\'s role in setting the government\'s daily agenda'],a:2,w:'The watchdog role: the media investigates and reports on government misconduct, corruption and abuses of power, holding those in authority to account. Investigative journalism is a key democratic function of the free press.'},{q:'A pressure group that operates through court actions and legal challenges (like SERAP in Nigeria) is using which method?',o:['Direct action — strikes and boycotts','Lobbying — private meetings with ministers','Legal action — taking government to court','Electoral action — fielding candidates in elections'],a:3,w:'Legal action — using the courts to challenge government decisions or inaction. SERAP has successfully sued both federal and state governments on budget transparency, freedom of information and socio-economic rights.'},{q:'Political parties in Nigeria are required by the 1999 Constitution to:',o:['Have their headquarters in the Federal Capital Territory Abuja only','Demonstrate a national spread of membership, not just regional or ethnic concentration','Field candidates in every single local government in Nigeria','Publish their financial accounts only in government-owned newspapers'],a:2,w:'Section 222 of the 1999 Constitution requires political parties to demonstrate national spread — their membership, offices and activities must not be limited to one ethnic group, religion or region.'},{q:'The 2015 Nigerian presidential election was historically significant because:',o:['It was the first election conducted using BVAS technology','It was the first election where a woman won the presidency','It was Nigeria\'s first peaceful, democratic transfer of power from one ruling party to another','It was the first election where all votes were cast electronically'],a:3,w:'2015 — Nigeria\'s first-ever peaceful democratic transfer of power between parties: APC\'s Buhari defeated PDP\'s incumbent Jonathan, who conceded before results were finalised. This was a major democratic milestone.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 ELE',ti:'Additional Practice',su:'Further revision questions on public opinion and participation.',steps:[
{lb:'Social media and democracy',dr:dQ7,ht:'<p>Social media has transformed political participation: (1) Low barrier to entry — anyone with a smartphone can participate in political discourse. (2) Rapid mobilisation — protests like EndSARS (2020) were organised primarily via Twitter/X, WhatsApp and Instagram. (3) Accountability — videos of government misconduct go viral and force responses. (4) Information access — citizens access political information directly, bypassing traditional media gatekeepers. (5) Risks: misinformation and fake news can spread faster than truth; echo chambers (only seeing views you agree with); coordinated manipulation campaigns; government attempts to shut down or tax social media. In Nigeria, the government attempted to ban Twitter (2021-22) following criticism of the EndSARS crackdown.</p>'},
{lb:'The Transition Monitoring Group (TMG)',dr:dQ7,ht:'<p>The <b>Transition Monitoring Group (TMG)</b> is Nigeria\'s leading election observation coalition — a non-governmental, non-partisan network of civil society organisations that monitors elections, voter education and democratic transition. Functions: (1) Parallel vote tabulation — independently tallying election results to detect fraud. (2) Deployment of accredited observers to polling units nationwide. (3) Voter education and civic awareness campaigns. (4) Reports on election credibility. TMG, along with international observers (EU, African Union, ECOWAS, Carter Center), provides independent assessment of election credibility. Observation deters malpractice and documents violations for legal challenges.</p>'},
{lb:'From opinion to policy — how it works',dr:dQ8,ht:'<p>How public opinion influences policy in Nigeria: (1) Public opinion is expressed through elections — voters choose parties whose policies align with their views. (2) Pressure groups lobby legislators and ministers to adopt specific policies. (3) Media campaigns create public pressure that forces government to respond. (4) Petitions and public consultations give citizens direct input. (5) Civil society organisations represent specific interests in policy processes. (6) Social media creates real-time pressure on governments to respond to public concerns. (7) Electoral threat — governments know that ignoring unpopular policies may cost them elections. The quality of this chain depends on citizens being informed, engaged and protected from manipulation.</p>'},
{lb:'WAEC revision questions',dr:dQ7,ht:'<p>WAEC revision: Public opinion = collective citizen views; formed through political socialisation (family primary, then school, media, peers, religion). Mass media role = agenda-setting, framing, gatekeeping, watchdog. Pressure groups = sectional (NMA, NBA, NLC) or cause (Amnesty, SERAP, WWF); insider (formal access) or outsider (campaigns). Political parties = seek to govern; functions = recruit candidates, formulate policies, mobilise voters, form government. Elections = FPTP; presidential 25% rule; INEC; BVAS/IReV (2023). Electoral malpractice = vote buying, ballot snatching, rigging. Active citizenship = NYSC, civil society, voting, accountability.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'The Transition Monitoring Group (TMG) in Nigeria is primarily a:',o:['Government agency responsible for monitoring government transitions','Coalition of civil society organisations that observes elections and monitors democratic transitions','Political party that monitors other parties\' campaigns','Judicial body that supervises electoral petitions'],a:2,w:'TMG = Transition Monitoring Group — Nigeria\'s leading non-governmental, non-partisan election observation coalition. It deploys civil society observers to polling units and conducts voter education.'},{q:'The Nigerian government attempted to restrict which social media platform in 2021-22?',o:['Facebook','WhatsApp','YouTube','Twitter (now X)'],a:4,w:'The Nigerian government suspended Twitter (now X) in June 2021 after Twitter deleted a tweet by President Buhari. The ban lasted until January 2022, raising major freedom of expression concerns.'},{q:'Which of these is an example of a CAUSE/PROMOTIONAL pressure group?',o:['Nigerian Medical Association (NMA)','Nigeria Labour Congress (NLC)','Amnesty International Nigeria (human rights advocacy)','Manufacturers Association of Nigeria (MAN)'],a:3,w:'Amnesty International Nigeria = cause/promotional group — it promotes human rights for all people, not just its own membership. NMA, NLC and MAN are all sectional/interest groups protecting specific professional/economic interests.'},{q:'A parallel vote tabulation by civil society during elections means:',o:['Counting votes twice to check for arithmetical errors','Civil society independently tallying election results from polling unit results sheets to detect fraud or manipulation in official results','Citizens voting in two different polling stations simultaneously','Running practice elections before the real election takes place'],a:2,w:'Parallel vote tabulation (PVT) — civil society organisations independently collect results forms from polling units and tally them to create an independent count that can be compared to the official INEC results to detect fraud.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 ELE',ti:'Public Opinion — Final Practice',su:'Final revision questions on public opinion, parties and elections.',steps:[
{lb:'Comparing pressure groups and political parties',dr:dQ8,ht:'<p>Final comparison: <b>Pressure groups</b> — seek to INFLUENCE policy; represent specific interests or causes; use lobbying, campaigns, legal action, strikes; do not field candidates; operate continuously between elections; can be more specialised and focused. <b>Political parties</b> — seek to WIN POWER through elections; represent broader coalitions of interests; formulate comprehensive policy programmes; field candidates for all offices; mobilise voters; form governments when they win. Both are essential to democracy — parties aggregate and translate public preferences into government; pressure groups represent the diversity of interests that no party can fully accommodate.</p>'},
{lb:'Voting behaviour in Nigeria',dr:dQ8,ht:'<p>What influences how Nigerians vote: (1) Ethnicity — voters often vote for candidates of their own ethnic group. (2) Religion — particularly significant in northern Nigeria. (3) Region — north-south patterns are persistent in presidential elections. (4) Incumbency — sitting presidents and governors have advantages. (5) Vote buying — cash payments at polling units influence many voters. (6) Party identification — loyalty to PDP or APC can be strong in some areas. (7) Candidate quality — sometimes individuals break ethnic/party patterns. (8) Economic conditions — anti-incumbency votes increase when economies are poor. Understanding these factors is essential for analysing Nigerian electoral politics.</p>'},
{lb:'The role of women in political participation',dr:dQ8,ht:'<p>Women\'s participation in Nigerian politics: Women have equal constitutional rights to participate. However, actual participation is limited: National Assembly female representation is below 10% (one of the lowest in Africa). Barriers: patriarchal norms; high cost of campaigns; violence and harassment; limited party support; double burden of domestic responsibilities. Progress: some female governors (e.g. Dame Virgy Etiaba — Anambra 2006-07); female ministers in every administration; female chief justices. The 35% affirmative action target (from Beijing 1995) has not been achieved. The Gender Equal Opportunity Bill has been rejected by the National Assembly multiple times. Genuine equality in political participation remains a goal.</p>'},
{lb:'WAEC final preparation',dr:dQ8,ht:'<p>Final WAEC preparation: Know definitions and distinguish between public opinion, political socialisation, pressure group, political party, election. Know agents of political socialisation (family primary, school, media, religion, peers). Know types of pressure groups (sectional vs cause; insider vs outsider) with Nigerian examples. Know functions of political parties and party system types. Know Nigeria\'s FPTP system, presidential 25% rule, INEC, BVAS. Know electoral malpractice types and reforms. For essays: always give Nigerian examples; structure as define → types/agents/forms → examples → importance/advantages → disadvantages/challenges → conclusion. 25 marks = 5-7 well-developed points.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'The primary influence on voting behaviour in Nigerian presidential elections has historically been:',o:['The quality and education level of the candidates','Economic performance of the incumbent government','Ethnicity, religion and regional identity','The specific policies in each party\'s manifesto'],a:3,w:'Research on Nigerian voting behaviour consistently shows ethnicity, religion and region as the strongest predictors of presidential election outcomes. This reflects the significance of identity politics in Nigeria\'s fragmented political landscape.'},{q:'Nigeria\'s female representation in the National Assembly is approximately:',o:['40% — reflecting the gender balance of the population','25% — reflecting some progress toward the 35% Beijing target','Below 10% — one of the lowest levels of female parliamentary representation in Africa','50% — reflecting full gender equality in the legislature'],a:3,w:'Nigeria\'s National Assembly has consistently had below 10% female membership — far below the African average (~24%) and the 35% Beijing Platform for Action target. This represents a major participation gap.'},{q:'A political party\'s manifesto is:',o:['A list of all the party\'s candidates for elections','A formal statement of the party\'s policy positions and commitments to voters','The party\'s internal rules for selecting its leadership','A financial report showing the party\'s funding sources'],a:2,w:'A manifesto is a formal document setting out a political party\'s policy positions, promises and programme of government — what they will do if elected. Voters use manifestos to assess parties\' plans.'},{q:'Vote buying in Nigerian elections undermines democracy by:',o:['Making elections too expensive for poor candidates to contest','Replacing citizens\' policy-based voting choices with cash transactions, disconnecting elections from accountability','Causing voter turnout to increase to unsustainable levels','Making it impossible for political parties to form stable governments'],a:2,w:'Vote buying replaces informed, policy-based voting with cash transactions. When citizens vote for money rather than policy, elections no longer hold governments accountable — they become expensive exercises in purchasing support.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 ELE',ti:'WAEC Prep — Detailed Practice',su:'Advanced WAEC preparation on public opinion and participation topics.',steps:[
{lb:'Structure for WAEC essays',dr:dQ9,ht:'<p>WAEC essay structures: "Discuss the role of pressure groups in a democratic state": (1) Define pressure group. (2) Types — sectional and cause; insider and outsider. (3) Methods — lobbying, campaigns, legal action, strikes, research. (4) Functions/importance — represent specific interests; hold government accountable; supplement parties; promote pluralism. (5) Nigerian examples — NMA, NBA, NLC, SERAP, TMG, Amnesty. (6) Limitations — unequal access; may represent narrow interests; can be manipulative. (7) Conclusion. 25 marks = 5 minutes plan + 20 minutes writing. Aim for 7 well-developed points.</p>'},
{lb:'Structure for WAEC essays continued',dr:dQ9,ht:'<p>"Examine the factors that influence public opinion in Nigeria": (1) Define public opinion. (2) Political socialisation and its agents. (3) Mass media (traditional + social). (4) Ethnicity and religion as particularly powerful factors in Nigeria. (5) Political parties and their mobilising role. (6) Economic conditions and personal experience. (7) Pressure groups and civil society advocacy. (8) Evaluate: is Nigerian public opinion healthily diverse or is it manipulated? (9) Conclusion on the importance of civic education. Always conclude with application to Nigeria specifically — WAEC rewards answers that demonstrate knowledge of the Nigerian political context.</p>'},
{lb:'Practice application',dr:dQ9,ht:'<p>Application scenarios for WAEC: Scenario 1 — The government proposes a new health policy. Which pressure group would most likely lobby against/for it, and how? → NMA (doctors) might lobby on professional grounds; patient rights groups on access grounds; pharmaceutical companies on commercial grounds. Scenario 2 — A state governor becomes unpopular due to a corruption scandal. How does public opinion change? → Media reports; social media pressure; opposition parties capitalise; civil society demands accountability; potential recall petition. Scenario 3 — Voter turnout drops in an election. What might explain this? → Voter apathy; electoral malpractice deterring voters; logistics problems; cynicism from previous failed promises; violence fear.</p>'},
{lb:'Key distinctions for WAEC',dr:dQ1,ht:'<p>WAEC key distinctions: (1) Public opinion ≠ one person\'s opinion (it is collective). (2) Political socialisation ≠ radicalisation (it is normal learning of values). (3) Pressure group ≠ political party (influence vs power). (4) Sectional pressure group ≠ cause pressure group (narrow membership interest vs broad societal cause). (5) Insider ≠ outsider pressure group (formal access vs public campaigns). (6) INEC ≠ SIEC (federal elections vs local government elections). (7) FPTP ≠ proportional representation (most votes wins vs proportional seat allocation). (8) Vote buying ≠ normal political campaigning (illegal corruption vs legitimate persuasion).</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'An essay question asks you to "discuss the role of pressure groups in a democratic state." You should NOT include which of the following in your answer?',o:['Types of pressure groups (sectional and cause)','Methods pressure groups use to influence government','How pressure groups seek to win elections and form governments','Advantages and disadvantages of pressure groups'],a:3,w:'Pressure groups do NOT seek to win elections and form governments — that is what POLITICAL PARTIES do. Including this in an essay about pressure groups would show a fundamental confusion between the two concepts.'},{q:'Which of these is the most effective method for a Nigerian pressure group wanting to challenge an unconstitutional government policy?',o:['Organising a national strike','Going to court to have the policy declared unconstitutional (legal action/judicial review)','Writing a letter to the President','Fielding a candidate in the next election to run against the government'],a:2,w:'For an unconstitutional policy, the most effective method is legal action — challenging it in court. Judicial review allows courts to declare government policies or actions unconstitutional and therefore void. SERAP uses this frequently.'},{q:'Political socialisation occurs through which of the following agents? (choose the most comprehensive answer)',o:['Only through formal school education','Only through the mass media and internet','Through family, school, mass media, peers, religion and political parties','Only through personal experience of government policies'],a:3,w:'Political socialisation agents include: FAMILY (primary); SCHOOL (formal civic education); MASS MEDIA (TV, radio, internet, social media); PEERS (social circles); RELIGION (especially influential in Nigeria); POLITICAL PARTIES (mobilising and shaping).'},{q:'Which institution is responsible for registering political parties in Nigeria?',o:['The National Assembly (through a special committee)','The President\'s office (Ministry of the Interior)','INEC (Independent National Electoral Commission)','The Supreme Court (through the Chief Justice)'],a:3,w:'INEC registers and deregisters political parties in Nigeria. Section 222 of the 1999 Constitution sets out the requirements parties must meet to be registered (national spread, internal democracy, financial transparency).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov \u2022 ELE',ti:'Mixed Questions — GOV-ELE-08 Full Revision',su:'Integrated final revision across all GOV-ELE-08 topics.',steps:[
{lb:'Complete summary',dr:dQ10,ht:'<p>Public opinion = collective citizen views; shaped by political socialisation (family primary, school, media, peers, religion, parties). Mass media role = agenda-setting, framing, gatekeeping, watchdog. Political participation forms: voting, parties, pressure groups, protests, community service, social media. Pressure groups: sectional (NMA, NBA, NLC, MAN) or cause (Amnesty, SERAP, WWF, TMG); insider (formal access) vs outsider (campaigns). Methods: lobbying, media, legal action, strikes. Political parties: seek to govern; functions = recruit, formulate, mobilise, govern. Party systems: one-party, two-party, multi-party. Nigeria: FPTP; presidential 25% rule; INEC; BVAS/IReV. Electoral malpractice. Active citizenship.</p>'},
{lb:'Relationships between concepts',dr:dQ10,ht:'<p>How concepts connect: Public opinion → Political parties (aggregate it for elections) → Election (translates it into power) → Government (implements policies that shape public opinion again). Simultaneously: Pressure groups → Lobby government on specific issues. Media → Shapes public opinion continuously. Civil society → Holds government accountable. Citizens → Express opinion through voting, parties, pressure groups, protests, social media. This cycle means that: healthy democracy requires: informed public opinion; competitive elections; active civil society; free media; responsive government. Failures in any part of the chain weaken the whole democratic system.</p>'},
{lb:'Nigeria-specific application',dr:dQ9,ht:'<p>Nigeria-specific examples: Public opinion shaped by: Channels TV, AIT, The Punch; social media (Twitter/X, WhatsApp, Facebook). Pressure groups: NMA (healthcare policy); NLC (minimum wage — won N30,000 minimum wage 2019, N70,000 in 2024); SERAP (court actions on transparency); TMG (election observation). Political parties: PDP (1998-2015 dominance) → APC (2015 power transfer) → Labour Party (significant 2023). Elections: INEC; BVAS (2023); IReV (results portal). Electoral malpractice: vote buying, ballot snatching. Reforms: 2022 Electoral Act; BVAS. Active citizenship: NYSC; EndSARS (2020 youth mobilisation).</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Top tips: Know public opinion, political socialisation, pressure groups, political parties, elections as distinct but connected concepts. For each: know definition, types, Nigerian examples, methods (for groups), functions, advantages and limitations. Practice essay structures for: (a) pressure groups in democracy; (b) factors shaping public opinion; (c) functions of political parties; (d) electoral malpractice and remedies. Include specific Nigerian examples — INEC, NLC, SERAP, BVAS, 2015 power transfer, EndSARS, NYSC. Evaluate strengths and weaknesses — WAEC rewards balanced, analytical answers. Allow 25-30 minutes for 25-mark essays.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'A public opinion poll indicates that 65% of Nigerians disapprove of the government\'s economic policies. In a healthy democracy, the most appropriate response from government would be:',o:['Ignore the poll — public opinion is not binding on government','Arrest the pollsters for spreading negativity about the government','Review the economic policies and consider revisions that address citizens\' concerns','Wait until the next election to see if public disapproval is genuine'],a:3,w:'In a healthy democracy, government should be responsive to public opinion. Reviewing unpopular policies (especially those with 65% disapproval) is the appropriate democratic response — governments that ignore public opinion risk losing the next election.'},{q:'The Nigeria Labour Congress (NLC) succeeded in winning a minimum wage increase for Nigerian workers in 2024. This is an example of:',o:['A pressure group winning an election and forming the government','A sectional/interest pressure group successfully influencing government policy through lobbying and strike threats','Civil society taking court action to force government to increase wages','The National Assembly introducing the wage increase without any pressure group involvement'],a:2,w:'NLC = sectional pressure group (workers\' interests). Its success in winning the N70,000 minimum wage (2024) through negotiation, strike threats and lobbying demonstrates how sectional groups can effectively influence government policy.'},{q:'Which of these best explains why voter turnout in Nigeria has been declining in recent elections?',o:['Nigerians are increasingly satisfied with democracy and feel no need to vote','Voter registration has become more difficult and expensive since 2015','A combination of voter apathy (cynicism about change), vote buying normalising passive behaviour, logistical challenges, and distrust of INEC and results','Nigerian law now allows citizens to vote online, reducing the need to queue at polling units'],a:3,w:'Nigeria\'s declining voter turnout (from ~53% in 2011 to ~27% in 2023) reflects: voter apathy/cynicism; vote buying creating passive consumers instead of active citizens; logistical challenges; distrust of results. There is no online voting in Nigeria.'},{q:'For a WAEC Government examination question asking you to "distinguish between a political party and a pressure group," the MOST important distinction is:',o:['Size — parties are larger than pressure groups','Funding — parties are publicly funded while groups are privately funded','Purpose — parties seek to WIN POWER by forming government; groups seek to INFLUENCE policy without governing','Age — parties are older institutions while pressure groups are newer organisations'],a:3,w:'The fundamental distinction is PURPOSE: political parties seek to WIN ELECTIONS and FORM GOVERNMENT. Pressure groups seek to INFLUENCE GOVERNMENT without seeking power themselves. This is the first and most important point in any comparison.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
