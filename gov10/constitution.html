<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}

.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}

.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Constitution — Overview',ACC,12,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'Constitution: fundamental law/rules governing a state\'s political system',DARK,10,'middle',false));o.push(T(240,74,'Defines: organs of government, their powers, citizens\' rights, amendment','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,40,CRM,ACC,1.5));o.push(T(240,110,'Written vs Unwritten: UK (unwritten/uncodified) vs Nigeria, USA (written)','#333',10,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,CRM,ACC,1.5));o.push(T(240,160,'Rigid vs Flexible: rigid requires special procedure to amend','#333',10,'middle',false));o.push(T(240,178,'Nigeria 1999: rigid — requires 2/3 NASS + 2/3 state houses','#555',9,'middle',false));}
if(p>=4){o.push(R(10,192,460,60,LINE,ACC,1));o.push(T(240,212,'Supremacy: constitution is the supreme law; inconsistent laws are void','#333',9,'middle',false));o.push(T(240,232,'Nigeria s.1(1): "This Constitution is supreme and its provisions shall have binding force"','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Nigeria\'s Constitutional History',ACC,12,'middle',true));
[['Constitution','Year','Key Feature'],['Clifford','1922','First legislature with elected Africans (Lagos/Calabar)'],['Richards','1946','Regional councils; first regional divisions'],['Macpherson','1951','Wider African participation; regional assemblies'],['Lyttleton','1954','True federalism; three regions'],['Independence','1960','Sovereignty; Westminster system; 3 regions'],['Republican','1963','President replaces Queen; republic'],['Second Republic','1979','Presidential system; 5 states → 19 states'],['1999','1999','Current; presidential; 36 states; federal']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(70,34+i*28,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(170,34+i*28,r[1],'#444',7,'middle',false));o.push(T(350,34+i*28,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Constitution — Summary',ACC,13,'middle',true));
[['Written','Codified in one document (Nigeria, USA, Germany)'],['Unwritten','Not codified; conventions + statutes (UK, Israel, NZ)'],['Rigid','Special procedure to amend (Nigeria — 2/3 NASS + 2/3 SHAs)'],['Flexible','Ordinary legislative procedure to amend (UK)'],['Supremacy','Constitution is the highest law; s.1(1) 1999 Constitution'],['Nigeria history','Clifford 1922 → Lyttleton 1954 → 1960 → 1963 → 1979 → 1999'],['Sources','Legislature, judicial decisions, conventions, customs, precedent']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(100,52+i*30,r[0],ACC,9,'middle',true));o.push(T(310,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Government \u2022 Elements',ti:'Meaning and Definition of Constitution',su:'Define constitution and explain its importance.',steps:[
  {lb:'Definition',dr:dQ1,ht:'<p>A <b>constitution</b> is the fundamental law that establishes the structure, functions and limits of government and guarantees citizens\' rights. It is the supreme law of the land — all other laws and government actions must be consistent with it. A constitution answers: Who governs? How do they govern? What are the limits of their power? What are citizens\' rights? How can the constitution be changed? It provides the framework within which all political activity takes place.</p>'},
  {lb:'Importance of a constitution',dr:dQ1,ht:'<p>A constitution is important because it: (1) Prevents tyranny — limits government power. (2) Protects fundamental rights — citizens know their rights. (3) Establishes the rule of law — no one is above the law. (4) Provides legitimacy — government derives authority from the constitution. (5) Ensures stability — provides predictable rules for political life. (6) Defines relationships — between arms of government; between federal and state governments; between government and citizens.</p>'},
  {lb:'Written vs unwritten constitutions',dr:dQ1,ht:'<p><b>Written (codified)</b>: contained in one or more documents. Nigeria (1999 Constitution), USA (1787), Germany. Merits: clear, accessible, difficult to abuse. Demerits: rigid; may not keep pace with change; requires formal amendment. <b>Unwritten (uncodified)</b>: not contained in a single document — consists of statutes, conventions, judicial decisions, customs. UK, Israel, New Zealand. Merits: flexible; adaptable. Demerits: less clear; easier to manipulate; no single reference point.</p>'},
  {lb:'Rigid vs flexible constitutions',dr:dQ1,ht:'<p><b>Rigid constitution</b>: can only be amended through a special, more difficult procedure than ordinary legislation. Nigeria\'s 1999 Constitution (s.9): some provisions require 2/3 of National Assembly members + approval of 2/3 of State Houses of Assembly. USA: 2/3 of Congress + ratification by 3/4 of states. <b>Flexible constitution</b>: can be amended by ordinary legislative procedure. UK\'s unwritten constitution is the most flexible — Parliament can change any constitutional rule by simple majority. Rigidity protects rights from easy removal by majorities.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What does it mean for a constitution to be "the supreme law of the land"?',o:['The constitution has more pages than ordinary laws','All government actions and laws must be consistent with it; inconsistent laws are void','The constitution can only be changed by the courts','The Supreme Court writes the constitution'],a:2,w:'Constitutional supremacy means the constitution overrides all other laws. In Nigeria, s.1(1) declares it supreme and any inconsistent law is void.'},{q:'Which country is the best example of an UNWRITTEN (uncodified) constitution?',o:['United States','Nigeria','Germany','United Kingdom'],a:4,w:'The UK has an unwritten/uncodified constitution — there is no single constitutional document. It is based on statutes (Magna Carta, Parliament Acts), conventions and judicial decisions.'},{q:'Nigeria\'s 1999 Constitution is described as RIGID because:',o:['It is very long and difficult to read','It can only be amended through a special procedure requiring 2/3 majorities','It was written by a military government','It has never been amended'],a:2,w:'A rigid constitution requires special (more demanding) procedures to amend. Nigeria\'s s.9 requires 2/3 of National Assembly members + 2/3 of State Houses of Assembly for most amendments.'},{q:'Which of these is an ADVANTAGE of a written/codified constitution?',o:['It is very flexible and easily changed','Citizens and government can clearly identify constitutional rights and limits','It can be changed by a simple majority in parliament','It doesn\'t need to be enforced by courts'],a:2,w:'A written constitution is clear and accessible — citizens can read their rights; courts can enforce constitutional limits on government power.'},{q:'What is the opposite of a "rigid" constitution, in constitutional classification?',o:['A flexible constitution, amendable by ordinary procedure','A dead constitution','An unwritten constitution only','A federal constitution'],a:1,w:'A flexible constitution can be amended through ordinary legislative procedure, unlike a rigid one.'},{q:'Which country is a classic example of a WRITTEN and CODIFIED constitution?',o:['The United States','The United Kingdom','New Zealand','Israel'],a:1,w:'The United States has a classic written, codified constitution.'},{q:'What does it mean for a constitution to be "codified"?',o:['It is contained in a single, formal written document','It is based only on court rulings','It cannot ever be changed','It applies only to the military'],a:1,w:'A codified constitution is contained in a single, formal written document.'},{q:'Why might a country prefer an unwritten constitution, as in the UK?',o:['It allows flexibility to adapt through convention and precedent','It removes the need for any government','It guarantees permanent stability','It prevents any political change'],a:1,w:'An unwritten constitution allows gradual adaptation through convention and precedent.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government \u2022 Elements',ti:'Sources of a Constitution',su:'Identify and explain the sources of constitutional law.',steps:[
  {lb:'Statute law (legislation)',dr:dQ2,ht:'<p><b>Statute law</b> is the most important source — laws formally enacted by the legislature. In Nigeria, the 1999 Constitution itself is the primary source. Ordinary statutes that have constitutional significance (e.g. Electoral Act, National Assembly Act, Independent National Electoral Commission Act) are secondary sources. In the UK, statutes like the Magna Carta (1215), Bill of Rights (1689), Parliament Acts (1911, 1949), Human Rights Act (1998) are major constitutional sources.</p>'},
  {lb:'Judicial decisions (case law)',dr:dQ2,ht:'<p><b>Judicial decisions</b> (case law/precedents) interpret the constitution and fill gaps. Nigeria\'s Supreme Court decisions are binding on all lower courts. Landmark cases define constitutional meaning: e.g. courts\' interpretations of fundamental rights, federal-state boundaries, and presidential powers. In the USA, Supreme Court decisions like Marbury v Madison (1803 — established judicial review) are as important as the written constitution itself.</p>'},
  {lb:'Constitutional conventions',dr:dQ2,ht:'<p><b>Conventions</b> are unwritten but binding political practices. In the UK: the Queen must give Royal Assent to bills passed by Parliament; the Prime Minister must have the confidence of the House of Commons. In Nigeria: the zoning/rotation of the presidency between North and South is a convention (not in the constitution but politically powerful). Conventions are not legally enforceable but are politically obligatory — their violation causes political crises.</p>'},
  {lb:'Customs, precedents and opinions of authorities',dr:dQ2,ht:'<p>Other sources: (1) <b>Customs and traditions</b> — long-established political practices (e.g. question time in parliament). (2) <b>Precedents</b> — ways things have been done before. (3) <b>Opinions of constitutional scholars</b> — academic writings (in the UK, works of scholars like Dicey, Bagehot have quasi-constitutional authority). (4) <b>International agreements</b> — Nigeria\'s ratified treaties become part of its law (ECOWAS Treaty, UN Charter provisions incorporated). (5) <b>Electoral laws</b> — regulate how the constitution is given effect.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The US Supreme Court case that established the principle of judicial review (courts can strike down unconstitutional laws) is:',o:['Brown v Board of Education','Roe v Wade','Marbury v Madison','Bush v Gore'],a:3,w:'Marbury v Madison (1803) — Chief Justice John Marshall established the principle that the Supreme Court can strike down laws inconsistent with the Constitution.'},{q:'A constitutional CONVENTION is best described as:',o:['A formal amendment to the constitution','An unwritten but politically binding political practice','A meeting of constitutional lawyers','A formal law passed by parliament'],a:2,w:'Conventions are unwritten political practices that are not legally enforceable but are politically obligatory (e.g. the Queen must give Royal Assent to Bills in the UK).'},{q:'Nigeria\'s zoning/rotation of the presidency between North and South is an example of:',o:['A provision in the 1999 Constitution','An INEC regulation','A constitutional convention (not legally required but politically powerful)','A Supreme Court ruling'],a:3,w:'Zoning is a convention — it is not in the 1999 Constitution but has been politically powerful in Nigerian politics (though increasingly contested).'},{q:'Which statute is considered the foundation of English constitutional law?',o:['The Bill of Rights 1689','The Parliament Act 1911','The Magna Carta 1215','The Human Rights Act 1998'],a:3,w:'Magna Carta (1215) — the Great Charter limiting royal power — is considered the foundation of English constitutional law and the rule of law.'},{q:'What year was the Magna Carta signed, establishing early limits on royal power?',o:['1066','1215','1689','1789'],a:2,w:'The Magna Carta was signed in 1215, establishing early limits on royal power.'},{q:'What principle did the Magna Carta first establish regarding the monarch?',o:['That the king was above the law','That even the king was subject to the law','That parliament had no power','That the church ruled England'],a:2,w:'The Magna Carta established that even the king was subject to the law.'},{q:'What is the significance of the Bill of Rights 1689 in English constitutional history?',o:['It limited royal power and established parliamentary rights','It created the first written constitution','It ended the monarchy entirely','It created judicial review'],a:1,w:'The Bill of Rights 1689 limited royal power and established key parliamentary rights.'},{q:'What is an example of a constitutional convention outside Nigeria, similar to zoning?',o:['The unwritten expectation the PM must be a sitting MP','A formal law requiring a specific party to win','A Supreme Court ruling on elections','An international treaty'],a:1,w:'The expectation that a UK Prime Minister must be a sitting MP is an unwritten constitutional convention.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government \u2022 Elements',ti:'Nigeria\'s Constitutional Development',su:'Trace Nigeria\'s constitutional history from 1922 to 1999.',steps:[
  {lb:'Clifford Constitution 1922',dr:dQ2,ht:'<p>The <b>Clifford Constitution (1922)</b> — named after Governor Hugh Clifford — was significant as the first Nigerian constitution to introduce elected African representation. It created the Nigerian Legislative Council with 27 officials and 19 unofficials (including 4 elected Africans — 3 from Lagos, 1 from Calabar). This was very limited, but it sparked political activity: Herbert Macaulay founded the NNDP (1923) to participate in these elections. The North was excluded from the council.</p>'},
  {lb:'Richards (1946) and Macpherson (1951)',dr:dQ2,ht:'<p><b>Richards Constitution (1946)</b>: Created three regional councils (North, West, East) — the foundation of Nigeria\'s regional structure. First time Nigeria was treated as one unit. Criticised for being made without adequate African consultation. <b>Macpherson Constitution (1951)</b>: Named after Governor John Macpherson; drafted with significant Nigerian participation. Created regional Houses of Assembly with wider powers. Led to the emergence of regional parties (NPC, NCNC, AG). Broke down due to "Action Group crisis" and the Kano riots (1953).</p>'},
  {lb:'Lyttleton (1954) and Independence (1960)',dr:dQ2,ht:'<p><b>Lyttleton Constitution (1954)</b>: Introduced true federalism — divided Nigeria into three autonomous regions (North, West, East) plus the Federal Territory of Lagos. The Federal government and regions had defined exclusive and concurrent powers. The model for Nigeria\'s current federal structure. <b>Independence Constitution (1960)</b>: Gave full sovereignty; Westminster (parliamentary) system; Prime Minister Tafawa Balewa; Governor-General (Queen\'s representative); 3 regions. Nigeria became independent within the Commonwealth.</p>'},
  {lb:'Republican (1963), 1979 and 1999 Constitutions',dr:dQ2,ht:'<p><b>1963</b>: Republic — replaced Queen with executive President (Azikiwe); still parliamentary. <b>1979</b>: Adopted USA-style presidential system; created 19 states; Sharia courts provision. Second Republic (1979-83) ended by Buhari coup. <b>1989</b>: Drafted but never used (Babangida annulled Third Republic). <b>1999</b>: Current constitution; promulgated 29 May 1999; presidential system; 36 states + FCT; Chapter IV rights; federal character. Has been amended multiple times (e.g. Independent candidacy provisions).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Clifford Constitution (1922) was significant because it:',o:['Gave Nigeria full independence','Introduced the presidential system','Was the first to allow elected African representatives in a Nigerian legislature','Created the three regional system'],a:3,w:'The Clifford Constitution (1922) created the first Nigerian Legislative Council with elected African members — 3 from Lagos, 1 from Calabar.'},{q:'Which constitution introduced TRUE FEDERALISM with autonomous regions and defined federal/regional powers?',o:['Clifford 1922','Richards 1946','Macpherson 1951','Lyttleton 1954'],a:4,w:'The Lyttleton Constitution (1954) established true federalism — three autonomous regions (North, West, East) with divided legislative powers.'},{q:'Nigeria adopted the PRESIDENTIAL system (replacing the Westminster model) under which constitution?',o:['The 1963 Republican Constitution','The 1979 Constitution','The 1989 Constitution','The 1999 Constitution'],a:2,w:'The 1979 Constitution introduced the presidential system — directly elected executive President, separate from and independent of the legislature.'},{q:'Nigeria\'s current constitution was promulgated on:',o:['1 October 1999','29 May 1999','15 January 1999','1 January 2000'],a:2,w:'The 1999 Constitution was promulgated on 29 May 1999, when President Obasanjo was inaugurated as Nigeria transitioned from military to civilian rule.'},{q:'Which Nigerian constitution first introduced the federal system with three regions?',o:['Clifford 1922','Richards 1946','Macpherson 1951','Lyttleton 1954'],a:2,w:'The Richards Constitution (1946) first introduced the federal system with three regions.'},{q:'What was a key feature of the Macpherson Constitution (1951)?',o:['It introduced greater Nigerian participation in central government','It gave Nigeria full independence','It created the presidential system','It abolished regional government'],a:1,w:'The Macpherson Constitution (1951) introduced greater Nigerian participation in central government.'},{q:'Which constitution granted Nigeria self-government in the regions before full independence?',o:['Clifford 1922','Richards 1946','Macpherson 1951','Lyttleton 1954'],a:4,w:'The Lyttleton Constitution (1954) granted regional self-government before full independence.'},{q:'What major political change did Nigeria undergo between 1960 and 1966?',o:['It moved from parliamentary system towards instability and the first military coup','It adopted the presidential system','It became fully unitary','It gained independence for the first time'],a:1,w:'Between 1960 and 1966, political instability led to Nigeria\'s first military coup.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government \u2022 Elements',ti:'Constitutional Supremacy',su:'Explain the doctrine of constitutional supremacy and its implications.',steps:[
  {lb:'The doctrine of supremacy',dr:dQ4,ht:'<p>Section 1(1) of Nigeria\'s 1999 Constitution: <em>"This Constitution is supreme and its provisions shall have binding force on all authorities and persons throughout the Federal Republic of Nigeria."</em> Section 1(3): <em>"If any other law is inconsistent with the provisions of this Constitution, this Constitution shall prevail, and that other law shall to the extent of the inconsistency be void."</em> This is the doctrine of constitutional supremacy — the constitution overrides everything else.</p>'},
  {lb:'Judicial review — the guardian of supremacy',dr:dQ4,ht:'<p><b>Judicial review</b> is the power of courts to examine whether laws and executive actions are consistent with the constitution. In Nigeria, the Federal High Court, Court of Appeal and Supreme Court can declare laws unconstitutional and void. This power makes the judiciary the "guardian of the constitution." Without judicial review, constitutional supremacy would be an empty promise — there would be no enforcement mechanism. An independent judiciary is therefore essential to constitutional government.</p>'},
  {lb:'Constitutional supremacy vs parliamentary supremacy',dr:dQ4,ht:'<p>Two models: (1) <b>Constitutional supremacy</b> (Nigeria, USA, Germany): the constitution is above parliament; courts can strike down parliamentary laws that violate the constitution. (2) <b>Parliamentary supremacy</b> (UK): parliament is the highest authority; courts cannot strike down Acts of Parliament (though Human Rights Act 1998 gave courts power to make "declarations of incompatibility"). Nigeria\'s presidential system uses constitutional supremacy; the UK\'s unwritten constitution uses parliamentary supremacy.</p>'},
  {lb:'Limitations on government powers',dr:dQ4,ht:'<p>Constitutional supremacy limits government in several ways: (1) <b>Bill of Rights</b> (Chapter IV): government cannot violate fundamental rights. (2) <b>Separation of powers</b>: each arm is limited to its constitutional role. (3) <b>Federalism</b>: federal and state governments have defined jurisdictions. (4) <b>Amendment procedures</b>: government cannot easily change the constitution to extend its power. (5) <b>Term limits</b>: President limited to two 4-year terms (s.137). These limits are what make a constitution a genuine "grundnorm" (Kelsen\'s term — the basic norm).</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'Section 1(1) of Nigeria\'s 1999 Constitution declares it:',o:['The oldest law in Nigeria','Supreme and binding on all authorities and persons','Subject to ECOWAS law','Amendable by the President alone'],a:2,w:'S.1(1) — "This Constitution is supreme and its provisions shall have binding force on all authorities and persons throughout the Federal Republic of Nigeria."'},{q:'Judicial review is the power of courts to:',o:['Review judges\' performance','Examine and strike down laws/actions inconsistent with the constitution','Appoint ministers and advisers','Conduct elections'],a:2,w:'Judicial review = the power of courts to examine whether laws and executive actions conform to the constitution, and to strike down those that do not.'},{q:'The UK operates parliamentary supremacy, which means:',o:['Parliament meets every year without exception','The courts can strike down any Act of Parliament','Parliament is the highest legal authority and its Acts cannot be invalidated by courts (traditionally)','The Prime Minister can override Parliament'],a:3,w:'UK parliamentary supremacy means Parliament (in theory) can pass any law it wishes and courts cannot invalidate Acts of Parliament.'},{q:'Nigeria\'s Constitution limits presidential terms to:',o:['One 4-year term','Two 4-year terms (maximum 8 years)','Three 4-year terms','No limit if re-elected'],a:2,w:'S.137 of the 1999 Constitution: a person who has held office as President for two terms is no longer eligible — maximum 8 years.'},{q:'What is the relationship between the Nigerian Constitution and any other law that conflicts with it?',o:['The other law automatically overrides the constitution','The other law is void to the extent of the inconsistency','Both laws apply equally','The National Assembly decides which applies'],a:2,w:'Section 1(1) — any law inconsistent with the Constitution is void to the extent of the inconsistency.'},{q:'Which arm of Nigerian government has the power of judicial review over unconstitutional laws?',o:['The Legislature','The Executive','The Judiciary','INEC'],a:3,w:'The Judiciary (the courts) exercises judicial review over unconstitutional laws.'},{q:'What does "separation of powers" mean in a constitutional system?',o:['Power is divided among the legislature, executive and judiciary','All power belongs to one branch','Power is divided by geography only','Power is held only by the president'],a:1,w:'Separation of powers divides authority among the legislature, executive and judiciary, each checking the others.'},{q:'Why is the presidential term limit (two terms of four years) considered important for democracy?',o:['It prevents any one leader from holding power indefinitely','It ensures elections never happen','It gives the president unlimited power','It removes the need for elections'],a:1,w:'Term limits prevent any one leader from holding power indefinitely, protecting democratic renewal.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government \u2022 Elements',ti:'Amending the Constitution',su:'Explain constitutional amendment procedures and their importance.',steps:[
  {lb:'Why constitutions need amendment',dr:dQ5,ht:'<p>Constitutions need amendment because: (1) Social, economic and political circumstances change. (2) Defects or gaps in the original document need correction. (3) New rights need to be recognised. (4) Institutions may need restructuring. However, amendment must not be too easy (would undermine stability and rights) or too difficult (would make the constitution out of touch with reality). The balance between rigidity and flexibility is crucial. Nigeria\'s constitution has been amended multiple times since 1999.</p>'},
  {lb:'Amendment procedure in Nigeria',dr:dQ5,ht:'<p>Section 9 of Nigeria\'s 1999 Constitution provides different amendment procedures depending on the provision: (1) <b>Basic provisions</b>: approved by 2/3 majority of all members of each House of the National Assembly + resolution of 2/3 of all State Houses of Assembly. (2) <b>Some other provisions</b>: simple 2/3 majority of both Houses. (3) <b>Fundamental rights</b> (Chapter IV), executive powers, legislative powers — require the full 2/3 NASS + 2/3 state houses procedure. This makes the Nigerian constitution quite rigid.</p>'},
  {lb:'Amendment vs ordinary legislation',dr:dQ5,ht:'<p>The difference: ordinary legislation requires a simple majority vote in the National Assembly + President\'s assent (or override of veto). Constitutional amendment requires: 2/3 of National Assembly members + 2/3 of all State Houses of Assembly (for major provisions). This higher threshold means: (1) Rights cannot be easily removed by a simple majority government. (2) Minority interests are protected. (3) Changes must have broad consensus. In 2010, Nigeria amended its constitution through the first major amendment process since 1999.</p>'},
  {lb:'Notable amendments to Nigeria\'s 1999 Constitution',dr:dQ5,ht:'<p>Key amendments to Nigeria\'s 1999 Constitution: (1st Amendment 2010): strengthened electoral provisions; President must present budget by September. (2nd Amendment 2010): provision on devolution of powers. (3rd Amendment 2010): independent candidacy provisions. (4th Amendment 2017): provisions on not-guilty plea before charge. On-going debates for further amendments: devolution (more powers to states), electoral reforms (electronic transmission), creation of new states, local government autonomy. Constitutional reform is a live political issue in Nigeria.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'Section 9 of Nigeria\'s 1999 Constitution deals with:',o:['Fundamental rights','The amendment procedure','The separation of powers','Nigeria\'s foreign policy objectives'],a:2,w:'Section 9 of the 1999 Constitution lays out the procedures for amending the constitution — requiring various levels of super-majority depending on the provision.'},{q:'To amend a fundamental provision of Nigeria\'s 1999 Constitution, you need:',o:['A simple majority of the National Assembly only','2/3 of National Assembly + 2/3 of all State Houses of Assembly','The President\'s approval alone','A national referendum'],a:2,w:'Major amendments require 2/3 of all members of each House of the National Assembly PLUS approval by 2/3 of all 36 State Houses of Assembly.'},{q:'Why is it important that constitutions are difficult to amend?',o:['To prevent any change ever occurring','To protect rights and stability — so majorities cannot easily strip minority rights','To give judges more work to do','To ensure the founding generation\'s wishes are permanent'],a:2,w:'Rigid amendment procedures protect fundamental rights and stability — they prevent a simple parliamentary majority from removing rights or extending its own power.'},{q:'The term "grundnorm" (basic norm) was coined by which legal philosopher to describe the constitution?',o:['Aristotle','Montesquieu','Hans Kelsen','AV Dicey'],a:3,w:'Hans Kelsen (Austrian legal philosopher) coined "grundnorm" — the basic norm from which all other legal norms derive their validity.'},{q:'Why do most constitutions require a special procedure to amend fundamental provisions?',o:['To protect the constitution from being changed too easily by temporary majorities','To make amendments impossible','To give the President sole power to amend','To remove the National Assembly\'s role'],a:1,w:'A special amendment procedure protects fundamental provisions from being changed by temporary political majorities.'},{q:'What does Hans Kelsen\'s concept of the "grundnorm" refer to?',o:['The basic underlying norm from which all laws derive validity','A specific chapter of the constitution','A type of court ruling','A method of voting'],a:1,w:'Kelsen\'s grundnorm is the basic underlying norm from which all other laws derive their validity.'},{q:'Besides the National Assembly, whose approval is required to amend fundamental provisions of Nigeria\'s constitution?',o:['At least two-thirds of the State Houses of Assembly','The President alone','The Supreme Court','INEC'],a:1,w:'Amending fundamental provisions requires approval of at least two-thirds of State Houses of Assembly, alongside the National Assembly.'},{q:'What risk does a very rigid constitution create, according to constitutional theory?',o:['It may become difficult to adapt to changing needs over time','It guarantees permanent stability with no risks','It automatically prevents corruption','It removes the need for courts'],a:1,w:'A very rigid constitution may struggle to adapt to changing social and political needs over time.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government \u2022 Elements',ti:'Features of Nigeria\'s 1999 Constitution',su:'Identify and explain key features of Nigeria\'s current constitution.',steps:[
  {lb:'Federalism and three tiers',dr:dQ6,ht:'<p>The 1999 Constitution establishes: (1) A <b>federal</b> system with powers divided between federal government and 36 states. Exclusive legislative list (items only federal can legislate on), Concurrent list (both federal and state), and Residual (states). (2) <b>Three tiers</b>: federal, state (36 states + FCT), local (774 LGAs). (3) <b>Federal character</b> principle (s.14(3)): appointments must reflect Nigeria\'s diversity. (4) Revenue sharing through the Federation Account (FAAC) — federal government, states and LGAs share oil and other revenues.</p>'},
  {lb:'Presidential system and separation of powers',dr:dQ6,ht:'<p>The 1999 Constitution establishes: (1) <b>Presidential system</b>: directly elected President (s.130-143); fixed 4-year term; maximum two terms. (2) <b>Separation of powers</b>: Legislature (National Assembly, Part I Chapter V), Executive (President, Chapter VI), Judiciary (Supreme Court etc., Chapter VII) are separate. (3) <b>Checks and balances</b>: legislature can impeach president; senate confirms appointments; president can veto bills; judiciary reviews executive actions. (4) <b>Vice President</b>: s.140 — takes over if President is incapacitated or removed.</p>'},
  {lb:'Fundamental rights (Chapter IV)',dr:dQ6,ht:'<p>Chapter IV (sections 33-46) guarantees fundamental rights: s.33 — Right to life. s.34 — Dignity of the human person (no torture, slavery). s.35 — Personal liberty (no unlawful detention). s.36 — Fair hearing (right to trial). s.37 — Private and family life. s.38 — Freedom of thought, conscience and religion. s.39 — Freedom of expression and press. s.40 — Freedom of peaceful assembly and association. s.41 — Freedom of movement. s.42 — Freedom from discrimination. These rights can be enforced in court (s.46).</p>'},
  {lb:'Fundamental objectives (Chapter II)',dr:dQ6,ht:'<p>Chapter II contains the <b>Fundamental Objectives and Directive Principles of State Policy</b> — aspirational goals for government: political objectives (democracy, social justice), economic objectives (security of lives and property, opportunity for citizens), social objectives (education, health, welfare), educational objectives (free compulsory education), foreign policy objectives (African integration). Key: these are NOT justiciable (cannot be enforced in court — s.6(6)(c)) unlike Chapter IV rights. But they guide policy.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What does s.14(3) of the 1999 Constitution (federal character principle) require?',o:['All states must have the same number of representatives','Presidential appointments must reflect Nigeria\'s geographical and ethnic diversity','Only southerners can be vice president','Federal character applies only to the military'],a:2,w:'S.14(3) requires that the composition of government and its agencies must reflect Nigeria\'s federal character — representing diverse states and ethnic groups.'},{q:'Which chapter of the 1999 Constitution contains ENFORCEABLE fundamental human rights?',o:['Chapter I','Chapter II','Chapter III','Chapter IV'],a:4,w:'Chapter IV (ss.33-46) contains fundamental rights that are enforceable in court. Chapter II contains aspirational objectives that are NOT justiciable.'},{q:'Why are Chapter II (Fundamental Objectives) provisions NOT enforceable in court?',o:['They are too vague to enforce','S.6(6)(c) of the constitution specifically excludes them from judicial enforcement','The courts have not yet decided to enforce them','They apply only to the President'],a:2,w:'S.6(6)(c) of the 1999 Constitution explicitly excludes Chapter II provisions from the jurisdiction of courts — making them non-justiciable (political obligations, not legal rights).'},{q:'What is the maximum period a person can serve as Nigeria\'s President?',o:['4 years','6 years','8 years (two 4-year terms)','There is no limit'],a:3,w:'S.137(1)(b) of the 1999 Constitution — a person who has held the office of President for two terms is not eligible for election again.'},{q:'What is the difference between Chapter II and Chapter IV of Nigeria\'s 1999 Constitution?',o:['Chapter II is enforceable, Chapter IV is not','Chapter II contains non-enforceable objectives; Chapter IV contains enforceable rights','They cover the same content','Chapter II applies only to the military'],a:2,w:'Chapter II contains non-enforceable Fundamental Objectives; Chapter IV contains enforceable Fundamental Rights.'},{q:'Give an example of a right protected under Chapter IV of Nigeria\'s Constitution.',o:['The right to life','The right to free housing','The right to a government job','The right to free international travel'],a:1,w:'The right to life is a Chapter IV enforceable fundamental right.'},{q:'What is the purpose of the federal character principle under s.14(3)?',o:['To ensure no particular ethnic or geographic group dominates appointments','To give the President unlimited appointment powers','To reduce the number of states','To abolish elections'],a:1,w:'Federal character (s.14(3)) ensures no single ethnic or geographic group dominates government appointments.'},{q:'According to the Constitution, who has the power to declare a state of emergency in Nigeria?',o:['The President, subject to National Assembly approval','State governors acting alone','The Chief Justice','INEC'],a:1,w:'The President may declare a state of emergency, subject to National Assembly approval.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government \u2022 Elements',ti:'Rule of Law and Constitutionalism',su:'Explain the rule of law and its connection to constitutional government.',steps:[
  {lb:'Definition of rule of law',dr:dQ7,ht:'<p>The <b>rule of law</b> (AV Dicey, Introduction to the Study of the Law of the Constitution, 1885) means: (1) <b>Supremacy of law</b>: law is supreme; no person or institution is above the law. (2) <b>Equality before the law</b>: everyone — citizens and government officials — is subject to the same law and courts. (3) <b>Constitutional basis of rights</b>: individual rights result from judicial decisions, not from government discretion. The rule of law is the opposite of arbitrary government (rule of men, not law).</p>'},
  {lb:'Dicey\'s three pillars',dr:dQ7,ht:'<p>Dicey\'s three meanings of the rule of law: (1) Supremacy of regular law over arbitrary power — no man can be punished except for a distinct breach of law. (2) Equality — every person, regardless of rank, is subject to the ordinary law. Government officials have no special exemption. (3) Constitutional law as the consequence of rights — in England, the constitution is the result of the ordinary rights of individuals, not the other way round. These principles underlie Nigeria\'s constitution (especially s.1(1) and Chapter IV).</p>'},
  {lb:'Rule of law in Nigeria — challenges',dr:dQ7,ht:'<p>Rule of law is frequently violated in Nigeria: (1) <b>Impunity</b>: powerful people escape prosecution (e.g. high-profile corruption cases dropped). (2) <b>Police brutality</b>: unlawful arrests, torture, extortion (#EndSARS 2020). (3) <b>Delays in justice</b>: cases take years; courts overwhelmed. (4) <b>Executive lawlessness</b>: governments defy court orders. (5) <b>Selective prosecution</b>: anti-corruption agencies used against political opponents. Despite constitutional guarantees, the practice of rule of law in Nigeria remains far from the ideal.</p>'},
  {lb:'Constitutionalism',dr:dQ7,ht:'<p><b>Constitutionalism</b> means more than having a constitution — it means actually governing in accordance with constitutional principles: respect for rights, separation of powers, regular elections, independent judiciary, free press, civil society. A state can have a constitution and not practise constitutionalism (authoritarian states with constitutions they ignore). In Nigeria, constitutionalism has improved since 1999 (regular elections, civilian transfers of power) but challenges remain (electoral malpractice, executive dominance, corruption).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'AV Dicey\'s first pillar of the rule of law is:',o:['Equality before the law','Constitutional basis of rights','Supremacy of law — no person is above the law','Separation of powers'],a:3,w:'Dicey\'s first pillar: supremacy of regular law — no man can be punished except for a breach of law established in the ordinary courts.'},{q:'What is the difference between having a constitution and practising CONSTITUTIONALISM?',o:['There is no difference — a constitution automatically means constitutionalism','Constitutionalism means actually governing according to constitutional principles (rights, separation of powers, rule of law)','Constitutionalism means the constitution has been recently amended','Only democracies can have constitutionalism'],a:2,w:'Many states have constitutions they ignore. Constitutionalism means the principles of the constitution are genuinely followed in practice.'},{q:'The #EndSARS protests in Nigeria (2020) were primarily against:',o:['High electricity tariffs','Police brutality and violation of citizens\' rights (especially by SARS)','The COVID-19 lockdown restrictions','Unemployment among graduates'],a:2,w:'#EndSARS was a protest movement against the Special Anti-Robbery Squad (SARS) — notorious for extortion, torture, and killings of young Nigerians.'},{q:'Which of these is a VIOLATION of the rule of law?',o:['Arresting a suspect after a court warrant is issued','A court ordering the government to pay compensation to a citizen','The President pardoning a convicted criminal without due process','All of the above are violations'],a:3,w:'Presidential pardons without due process can be a rule of law violation — especially if used to shield political allies from legitimate convictions.'},{q:'What is AV Dicey\'s SECOND pillar of the rule of law?',o:['Equality before the law','Supremacy of law only','Separation of powers','Federal character'],a:1,w:'Dicey\'s second pillar is equality before the law — all persons subject to the same laws and courts.'},{q:'What is AV Dicey\'s THIRD pillar of the rule of law?',o:['The constitutional basis of individual rights','Absolute monarchy','Military supremacy','Religious authority'],a:1,w:'Dicey\'s third pillar is the constitutional basis of individual rights arising from ordinary law.'},{q:'Why is judicial independence considered essential to the rule of law?',o:['So courts can apply the law fairly without political interference','So judges can ignore the constitution','So the President can control court rulings','So elections become unnecessary'],a:1,w:'Judicial independence allows courts to apply the law fairly, free from political interference.'},{q:'What reform was one major demand of the #EndSARS protests in Nigeria?',o:['Disbanding SARS and reforming the police','Ending all elections','Abolishing the National Assembly','Reducing fuel prices'],a:1,w:'#EndSARS protesters demanded the disbanding of SARS and broader police reform.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government \u2022 Elements',ti:'Constitutions and Human Rights',su:'Explain how constitutions protect human rights.',steps:[
  {lb:'Constitutions and rights',dr:dQ8,ht:'<p>Modern constitutions typically contain a <b>Bill of Rights</b> — a catalogue of fundamental rights that government must respect and protect. These rights are "entrenched" — protected from easy removal by ordinary legislation. Nigeria\'s Chapter IV. USA\'s First Ten Amendments (1791). UK\'s Human Rights Act (1998) incorporates the European Convention on Human Rights. The UN Universal Declaration of Human Rights (1948) has influenced most post-war constitutions. Rights in constitutions are enforceable in court — citizens can sue the government for violations.</p>'},
  {lb:'Types of rights in Nigeria\'s constitution',dr:dQ8,ht:'<p>Nigeria\'s constitution protects: <b>Civil and political rights</b> (Chapter IV): life, liberty, fair trial, expression, association, movement. <b>Economic and social objectives</b> (Chapter II — not justiciable): right to work, education, health care. Note: in Nigeria, economic and social rights are not enforceable in court (unlike South Africa\'s constitution which makes socio-economic rights justiciable). This is a major debate — should the right to education and health be legally enforceable?</p>'},
  {lb:'Limitations on rights',dr:dQ8,ht:'<p>Rights are not absolute — the constitution allows limitations in certain circumstances. Nigeria\'s constitution allows derogation from rights: (1) In the <b>public interest</b> — e.g. freedom of movement may be restricted for public order. (2) In a <b>state of emergency</b> — some rights may be suspended (s.305). (3) <b>National security</b> — some information may be withheld. The key test: are the limitations <b>reasonable and justifiable in a democratic society</b>? Courts apply this test when government restricts rights.</p>'},
  {lb:'Enforcement of rights in Nigeria',dr:dQ8,ht:'<p>Section 46 of the 1999 Constitution: any person who alleges that their fundamental rights have been violated may apply to the High Court for redress. The <b>Fundamental Rights (Enforcement Procedure) Rules</b> streamline this. Citizens have successfully sued: the police for unlawful detention (s.35), the government for torture (s.34), for violations of the right to fair hearing (s.36). The National Human Rights Commission (NHRC) also investigates human rights violations. Enforcement remains challenging due to cost, delays and lack of legal awareness.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'The US Bill of Rights consists of the first how many amendments to the US Constitution?',o:['5','8','10','12'],a:3,w:'The US Bill of Rights comprises the first ten amendments to the Constitution, ratified in 1791.'},{q:'Section 46 of Nigeria\'s 1999 Constitution allows citizens to:',o:['Vote in presidential elections','Apply to the High Court for redress when fundamental rights are violated','Recall their senators','Form political parties'],a:2,w:'S.46 — "Any person who alleges that any of the provisions of this Chapter has been, is being or is likely to be contravened... may apply to a High Court."'},{q:'Why are Chapter II rights (e.g. right to education, health) NOT enforceable in Nigerian courts?',o:['They are too expensive to enforce','Nigerians do not want these rights','S.6(6)(c) expressly excludes Chapter II from judicial jurisdiction','The Supreme Court has not yet ruled on them'],a:3,w:'S.6(6)(c) of the 1999 Constitution explicitly excludes Chapter II (Fundamental Objectives) from the jurisdiction of any court.'},{q:'The UN Universal Declaration of Human Rights was adopted in which year?',o:['1945','1948','1951','1960'],a:2,w:'The UDHR was adopted by the UN General Assembly on 10 December 1948, following the horrors of World War II.'},{q:'What is the purpose of a "Bill of Rights" within a constitution?',o:['To formally guarantee and protect citizens\' fundamental rights','To list government ministries','To outline tax rates','To define international borders'],a:1,w:'A Bill of Rights formally guarantees and protects citizens\' fundamental rights.'},{q:'Which international document is most closely linked to the rights protected in Nigeria\'s Chapter IV?',o:['The Universal Declaration of Human Rights','The Geneva Convention only','The UN Charter only','The Treaty of Versailles'],a:1,w:'Chapter IV rights closely mirror the Universal Declaration of Human Rights (UDHR).'},{q:'What legal remedy can a Nigerian citizen seek if their fundamental right is violated?',o:['Approach the High Court for redress','Appeal directly to the United Nations only','Contact the President directly','There is no legal remedy'],a:1,w:'Section 46 allows citizens to approach the High Court for redress when fundamental rights are violated.'},{q:'Which of these rights is typically classified as a "fundamental right" rather than a Chapter II objective in Nigeria?',o:['The right to personal liberty','The right to free housing','The right to a government job','The right to free healthcare'],a:1,w:'The right to personal liberty is a Chapter IV enforceable fundamental right, unlike Chapter II objectives.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government \u2022 Elements',ti:'WAEC Exam Preparation — The Constitution',su:'Practise WAEC-style questions on constitutional topics.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC constitution questions: (1) Define constitution clearly. (2) Classify (written/unwritten; rigid/flexible). (3) Sources (statute, case law, conventions). (4) Nigeria-specific content (constitutional history: Clifford → Lyttleton → 1960 → 1963 → 1979 → 1999; features of 1999 constitution). (5) Rule of law, supremacy, amendment. (6) Lessons and evaluation. Common questions: "Distinguish between written and unwritten constitutions." / "Trace Nigeria\'s constitutional development." / "What is meant by constitutional supremacy?"</p>'},
  {lb:'Key facts for WAEC',dr:dQ9,ht:'<p>WAEC fact bank: Clifford 1922 (first elected Africans). Richards 1946 (three regions). Macpherson 1951 (wider participation). Lyttleton 1954 (true federalism). 1960 (independence/parliamentary). 1963 (republic). 1979 (presidential/19 states). 1999 (current/36 states). S.1(1) — constitutional supremacy. Chapter II — non-justiciable objectives. Chapter IV (ss.33-46) — justiciable rights. S.9 — amendment procedure. AV Dicey — rule of law (3 pillars). S.14(3) — federal character.</p>'},
  {lb:'Common WAEC mistakes to avoid',dr:dQ9,ht:'<p>Avoid: Saying Clifford Constitution gave Nigeria independence (it only gave limited elected representation). Confusing Macpherson (1951) and Lyttleton (1954) — Macpherson had wider African participation; Lyttleton introduced TRUE federalism. Saying 1979 Constitution created 36 states (it created 19; 36 came with 1996 state creation). Saying Chapter II rights are justiciable (they are not). Saying the UK has NO constitution (it has an unwritten/uncodified one). Confusing supreme law (constitution) with ordinary statute law.</p>'},
  {lb:'Linking constitution to other topics',dr:dQ9,ht:'<p>The constitution connects to all other Government topics: Rule of law → Separation of powers → Checks and balances. Federalism → Exclusive/Concurrent/Residual lists. Democracy → Elections → INEC → Electoral law. Fundamental rights → Citizenship → Duties. Arms of government → Executive/Legislature/Judiciary. Military rule → Constitution suspended. Understanding the constitution is the foundation for all other Government topics.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'AV Dicey identified three pillars of the rule of law. Which is NOT one of them?',o:['Supremacy of law','Equality before the law','Separation of church and state','Constitutional basis of individual rights'],a:3,w:'Dicey\'s three pillars: (1) supremacy of law, (2) equality before the law, (3) constitutional basis of rights. Separation of church and state is not one of them.'},{q:'The Lyttleton Constitution (1954) is significant because it introduced:',o:['The first elected Africans in Nigerian legislature','Parliamentary system at independence','True federalism with autonomous regions','The presidential system'],a:3,w:'The Lyttleton Constitution (1954) introduced true federalism — making the three regions (North, West, East) genuinely autonomous with defined powers.'},{q:'WAEC regularly asks about "constitutionalism." The best definition is:',o:['Having a written constitution','Governing strictly in accordance with constitutional principles (rights, rule of law, separation of powers)','Amending the constitution regularly','Having the longest constitution'],a:2,w:'Constitutionalism means actually governing in line with constitutional principles — not just having a document, but respecting rights, rule of law and separation of powers.'},{q:'Which section of the 1999 Constitution provides the procedure for constitutional amendment?',o:['Section 1','Section 9','Section 14','Section 46'],a:2,w:'Section 9 of the 1999 Constitution lays out the amendment procedure — requiring super-majorities in the National Assembly and State Houses of Assembly.'},{q:'Which of Dicey\'s pillars concerns individual rights arising from ordinary law rather than a special declaration?',o:['The constitutional basis of individual rights','Separation of powers','Federal character','Popular sovereignty'],a:1,w:'Dicey\'s third pillar concerns individual rights arising from the ordinary law of the land.'},{q:'What is the WAEC-expected difference between "constitution" and "constitutionalism"?',o:['A constitution is a document; constitutionalism is governing according to its principles','They are identical terms','Constitutionalism means having no constitution','Constitution means having elections only'],a:1,w:'A constitution is a document; constitutionalism is the practice of governing according to its principles.'},{q:'Which Nigerian constitution is credited with introducing regional self-government before independence?',o:['Clifford 1922','Richards 1946','Macpherson 1951','Lyttleton 1954'],a:4,w:'The Lyttleton Constitution (1954) introduced regional self-government before independence.'},{q:'According to WAEC syllabus expectations, what should a constitutional essay always include?',o:['Relevant sections/provisions and Nigerian examples','Only foreign examples','Personal opinions with no evidence','A list of unrelated dates'],a:1,w:'WAEC essays should cite relevant constitutional sections and appropriate Nigerian examples.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Government \u2022 Elements',ti:'Mixed Questions — The Constitution',su:'Integrated revision across all constitution topics.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Constitution = fundamental law; defines structure, limits, rights. Written (Nigeria) vs unwritten (UK). Rigid (special amendment) vs flexible (ordinary procedure). Sources: statutes, case law, conventions, customs. History: Clifford 1922 → Richards 1946 → Macpherson 1951 → Lyttleton 1954 → 1960 → 1963 → 1979 → 1999. 1999: federal, presidential, 36 states, Chapter IV rights, Chapter II objectives, s.1(1) supremacy, s.9 amendment, s.14(3) federal character. Rule of law (Dicey): supremacy, equality, constitutional rights.</p>'},
  {lb:'Key sections of Nigeria\'s 1999 Constitution',dr:dQ10,ht:'<p>Know these sections: s.1(1) — constitutional supremacy. s.9 — amendment procedure. s.14(3) — federal character. s.25-27 — citizenship. s.33-46 — fundamental rights (Chapter IV). s.6(6)(c) — Chapter II not justiciable. s.130-143 — the President. s.277 — definition of "state." s.318 — interpretation (definitions). s.320 — "This Constitution may be cited as the Constitution of the Federal Republic of Nigeria 1999." 2nd Schedule (Exclusive/Concurrent legislative lists).</p>'},
  {lb:'Evaluating Nigeria\'s constitution',dr:dQ10,ht:'<p>Strengths of the 1999 Constitution: (1) Codified rights (Chapter IV). (2) Federal structure managing diversity. (3) Separation of powers. (4) Term limits. Weaknesses/challenges: (1) Made by military — not by elected convention. (2) Over-centralised (states lack fiscal autonomy). (3) Chapter II not justiciable. (4) Revenue sharing formula disputed. (5) Federal character imperfectly implemented. (6) LGA autonomy undermined by state governors. Nigerian civil society continues to push for constitutional reform (devolution, electoral reforms, LG autonomy).</p>'},
  {lb:'WAEC final tips',dr:dQ10,ht:'<p>Final revision: Distinguish written vs unwritten (not "Nigeria has a constitution; UK has none"). Distinguish rigid vs flexible. Know Nigeria\'s constitutional history in order (7 key constitutions). Know Chapter II vs Chapter IV (one justiciable, one not). Know Dicey\'s rule of law (3 pillars). Know s.1(1), s.9, s.14(3), s.46. For essay questions: define → classify → sources → history → features → evaluation → lessons. Time management: 25-mark essays in 25-30 minutes.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'What is the correct order of Nigeria\'s constitutions?',o:['Richards → Clifford → Macpherson → Lyttleton → 1960 → 1963 → 1979 → 1999','Clifford → Richards → Macpherson → Lyttleton → 1960 → 1963 → 1979 → 1999','Macpherson → Clifford → Lyttleton → Richards → 1963 → 1960 → 1999 → 1979','Lyttleton → Clifford → Richards → Macpherson → 1960 → 1979 → 1963 → 1999'],a:2,w:'Clifford (1922) → Richards (1946) → Macpherson (1951) → Lyttleton (1954) → Independence (1960) → Republican (1963) → 1979 → 1999.'},{q:'Chapter II of the 1999 Constitution is NOT enforceable in court. What does it contain?',o:['Fundamental rights like life and liberty','Fundamental Objectives and Directive Principles of State Policy','The amendment procedure','The electoral law provisions'],a:2,w:'Chapter II contains Fundamental Objectives and Directive Principles — aspirational policy goals (education, health, welfare) that are not justiciable (s.6(6)(c)).'},{q:'AV Dicey\'s rule of law requires "equality before the law." In the Nigerian context, this means:',o:['All citizens earn the same salary','The President and an ordinary citizen are subject to the same courts and law','Only educated citizens understand the law','Equality of outcome for all citizens'],a:2,w:'Equality before the law (Dicey\'s second pillar) means no person — including the President — is above the law or exempt from ordinary courts.'},{q:'The 1979 Constitution was significant for Nigeria because it introduced:',o:['The first elected Africans','Independence from Britain','The presidential system (replacing Westminster)','36 states'],a:3,w:'The 1979 Constitution introduced the American-style presidential system — directly elected executive president, separate from the legislature — replacing the Westminster model of independence.'},{q:'Which constitution first gave Nigeria full independence from Britain?',o:['The 1960 Independence Constitution','The 1963 Republican Constitution','The 1979 Constitution','The 1999 Constitution'],a:1,w:'The 1960 Independence Constitution first gave Nigeria full independence from Britain.'},{q:'What major change did the 1963 Republican Constitution bring?',o:['Nigeria became a republic, replacing the Queen with a President','Nigeria gained independence for the first time','Nigeria adopted the presidential system','Nigeria created 36 states'],a:1,w:'The 1963 Republican Constitution made Nigeria a republic, replacing the Queen with a Nigerian President.'},{q:'Under the 1999 Constitution, what body has final authority to interpret the constitution in disputes?',o:['The Supreme Court','The National Assembly','The President','INEC'],a:1,w:'The Supreme Court, as the apex judiciary, has final authority to interpret the Constitution.'},{q:'Why is Nigeria\'s 1999 Constitution described as the current supreme legal framework?',o:['It has remained in force since 29 May 1999, governing all subsequent laws','It was replaced by a newer constitution in 2015','It only applies to state governments','It has never been amended'],a:1,w:'The 1999 Constitution has remained in force since 29 May 1999, governing all subsequent laws and government actions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
