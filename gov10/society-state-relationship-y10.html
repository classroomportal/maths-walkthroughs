var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});

{ey:'Q1 \u2022 Government • Y10',ti:'Meaning of Society',su:'Understand what a society is.',steps:[
  {lb:'What is society?',dr:dQ1,ht:'<p>A society is a group of people living together in a defined area, sharing common customs, values, laws and institutions, and interacting in an organised way over time.</p>'},
  {lb:'Key features of society',dr:dQ1,ht:'<p>Features include: a shared culture and set of norms, social institutions (family, religion, education), interdependence among members, and continuity across generations.</p>'},
  {lb:'Society vs population',dr:dQ1,ht:'<p>A society is more than just a collection of people (population) — it implies organisation, shared identity and ongoing relationships. A crowd at a market is a population, not necessarily a \'society\' in the political sense.</p>'},
  {lb:'Why society matters for Government',dr:dQ1,ht:'<p>Studying society helps us understand the human context within which political institutions, laws and government operate — government exists to serve and regulate the needs of society.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'A society is best defined as:',o:["Any random crowd of people", "A group sharing common customs, values, laws and institutions, interacting in an organised way", "A single family only", "A type of government building"],a:2,w:'Society is an organised group of people sharing common culture, values, laws and institutions over time.'},{q:'Which of these is a key feature of society?',o:["Total isolation of every individual", "Shared culture, norms and social institutions", "No interaction between members", "A single ruler with absolute power"],a:2,w:'A defining feature of society is shared culture and norms, supported by institutions like family, religion and education.'},{q:'How does \'society\' differ from \'population\'?',o:["They are identical concepts", "Society implies organisation and shared identity; population is just a headcount of people", "Population always excludes children", "Society only refers to elected officials"],a:2,w:'Population is simply the number of people in an area; society implies organised, ongoing relationships and shared identity.'},{q:'Why is understanding society important for the study of Government?',o:["Because government has no connection to society", "Because government exists to serve and regulate the needs of the society it governs", "Because society and government are the same thing", "Because society only matters in economics"],a:2,w:'Government operates within and serves the society it governs, making an understanding of society essential to Government studies.'},{q:'Which of these is an example of a social institution within a society?',o:["The family", "A single grain of sand", "An individual's private diary", "A random weather pattern"],a:1,w:'The family is a core social institution that helps organise and transmit values within a society.'},{q:'A crowd gathered briefly at a market is best described as:',o:["A fully organised society with shared institutions", "A temporary population without the ongoing organisation that defines a society", "A government", "A state"],a:2,w:'A brief market crowd is a population, lacking the ongoing organisation, shared institutions and continuity that define a society.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government • Y10',ti:'Types of Society',su:'Explore different types of society.',steps:[
  {lb:'Traditional/rural society',dr:dQ2,ht:'<p>Traditional or rural societies are typically small-scale, based on agriculture, with strong extended family ties, communal values, and authority often resting with elders or traditional rulers.</p>'},
  {lb:'Modern/urban society',dr:dQ2,ht:'<p>Modern or urban societies are typically larger, industrialised or service-based, more individualistic, with formal institutions (courts, schools, hospitals) and authority based on law rather than custom alone.</p>'},
  {lb:'Homogeneous vs heterogeneous society',dr:dQ2,ht:'<p>A homogeneous society has a single dominant ethnic group, language or religion (relatively rare in practice), while a heterogeneous society — like Nigeria, with over 250 ethnic groups — has significant ethnic, linguistic and religious diversity.</p>'},
  {lb:'Open vs closed society',dr:dQ2,ht:'<p>An open society allows social mobility, free flow of information, and political participation (as in a democracy). A closed society restricts these — limiting movement between social classes, information access, or political freedoms (as under authoritarian rule).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'A traditional/rural society is typically characterised by:',o:["High industrialisation and anonymity", "Agriculture, strong extended family ties, and authority resting with elders/traditional rulers", "Total absence of any social organisation", "Only formal written law with no custom"],a:2,w:'Traditional/rural societies are typically agricultural, with strong family ties and authority based on custom and elders.'},{q:'Which best describes Nigeria in terms of homogeneity?',o:["Nigeria is a homogeneous society with one ethnic group", "Nigeria is a heterogeneous society with over 250 ethnic groups", "Nigeria has no distinct ethnic groups", "Nigeria is entirely rural with no urban centres"],a:2,w:'Nigeria is a heterogeneous society, with over 250 ethnic groups, multiple languages and diverse religions.'},{q:'An \'open society\', in the political sense, is characterised by:',o:["Social mobility, free information flow, and political participation", "Total restriction of movement between social classes", "Banning all political parties", "No access to information at all"],a:1,w:'An open society allows social mobility, free information and political participation, typical of democratic systems.'},{q:'A \'closed society\' is best illustrated by:',o:["Free and fair competitive elections", "Restrictions on movement between classes, limited information access, and constrained political freedoms", "Full freedom of the press", "Open markets and free trade"],a:2,w:'A closed society restricts social mobility, information flow and political freedoms, often under authoritarian systems.'},{q:'Modern/urban societies typically differ from traditional/rural societies by having:',o:["No formal institutions at all", "Formal institutions (courts, schools, hospitals) and authority based more on law than custom", "Authority based solely on the eldest member of each family", "No industry or services"],a:2,w:'Modern/urban societies rely more on formal institutions and legal authority, compared to custom-based authority in traditional societies.'},{q:'Why is Nigeria\'s heterogeneity significant for Government studies?',o:["It has no effect on governance at all", "It shapes challenges like federal character, resource allocation and managing ethnic diversity in governance", "It means Nigeria has only one language", "It eliminates the need for a constitution"],a:2,w:'Nigeria\'s ethnic and religious diversity shapes major governance issues, including federal character, power-sharing and resource allocation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government • Y10',ti:'Relationship Between Society, State and Government',su:'Understand how society, state and government relate.',steps:[
  {lb:'Society as the foundation',dr:dQ3,ht:'<p>Society is the human community that exists prior to, and independently of, any specific government. Government and the state are institutions created to organise and serve that society.</p>'},
  {lb:'The state as organised society',dr:dQ3,ht:'<p>A state is a politically organised society with defined territory, population, government and sovereignty. In a sense, the state is society organised for political purposes under a recognised authority.</p>'},
  {lb:'Government as the instrument',dr:dQ3,ht:'<p>Government is the specific machinery (institutions and office-holders) through which the state exercises authority over society at any given time. Governments change through elections or other means; the underlying society and state generally continue.</p>'},
  {lb:'Interdependence in practice',dr:dQ3,ht:'<p>In practice these three interact constantly: society\'s needs and values shape the laws government makes; government\'s performance affects social stability and cohesion; and the state provides the overarching legal-political framework within which both operate.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'Which best describes the relationship between society and the state?',o:["They are identical and interchangeable terms", "Society is the human community; the state is that society organised politically with territory, government and sovereignty", "The state always predates society", "Society only exists after government is formed"],a:2,w:'Society is the underlying human community; the state is that society organised politically, with defined territory, government and sovereignty.'},{q:'Government, in relation to society and the state, is best understood as:',o:["Exactly the same as society", "The specific machinery/instrument through which the state exercises authority over society at a given time", "A concept unrelated to the state", "Something that exists independently of the state"],a:2,w:'Government is the concrete institutional machinery through which the state\'s authority is exercised over society, and it can change while the state continues.'},{q:'Which of these persists even when a government changes through elections?',o:["The particular ruling party only", "The underlying society and state", "Neither society nor the state", "Only the president's personal staff"],a:2,w:'When governments change through elections or other means, the underlying society and state generally continue to exist.'},{q:'How does society influence government in practice?',o:["Society has no influence on government at all", "Society's needs, values and pressures shape the laws and policies government makes", "Government dictates society's culture entirely with no feedback", "Society only matters in economics, not politics"],a:2,w:'Society\'s needs and values influence the laws and policies that government creates, reflecting a two-way relationship.'},{q:'What role does the state play relative to society and government?',o:["The state provides the overarching legal-political framework within which society and government interact", "The state has no legal role", "The state is smaller than government", "The state only exists in dictatorships"],a:1,w:'The state provides the legal-political framework — territory, sovereignty and institutions — within which society and government function.'},{q:'Why is it useful to distinguish society, state and government as separate concepts?',o:["Because they mean exactly the same thing", "Because distinguishing them helps explain political continuity, change, and the roles institutions play relative to the people they serve", "Because only government matters in political science", "Because society is a purely economic term"],a:2,w:'Distinguishing these concepts helps explain why states and societies persist through changes of government, and clarifies each institution\'s role.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government • Y10',ti:'Social Institutions and Their Role',su:'Explore the key institutions that organise society.',steps:[
  {lb:'The family',dr:dQ4,ht:'<p>The family is society\'s most basic institution, responsible for the early socialisation of children, transmission of values, and provision of care — forming the foundation on which wider social organisation is built.</p>'},
  {lb:'Religion',dr:dQ4,ht:'<p>Religious institutions shape moral values, provide community cohesion, and, in many African societies including Nigeria, significantly influence social norms, festivals, and even political attitudes and voting patterns.</p>'},
  {lb:'Education',dr:dQ4,ht:'<p>Educational institutions (schools, universities) transmit knowledge, skills and civic values across generations, and are essential for preparing citizens to participate effectively in society and governance.</p>'},
  {lb:'Government and law',dr:dQ4,ht:'<p>Government and the legal system provide formal rules and enforcement mechanisms that regulate behaviour across the whole society, resolving disputes and maintaining order beyond what family or community alone can achieve.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'Which institution is generally considered society\'s most basic, responsible for early socialisation?',o:["The stock exchange", "The family", "The national parliament", "A multinational corporation"],a:1,w:'The family is the most basic social institution, responsible for the early socialisation and upbringing of children.'},{q:'How does religion influence Nigerian society, according to Government studies?',o:["It has no influence on social or political attitudes", "It shapes moral values, community cohesion and, often, political attitudes and voting patterns", "It only affects economic policy", "It replaces the need for government entirely"],a:1,w:'Religion significantly shapes moral values, cohesion and even political attitudes and voting behaviour in Nigerian society.'},{q:'What is a key role of educational institutions in society?',o:["To eliminate the need for family", "Transmitting knowledge, skills and civic values needed for participation in society and governance", "To replace government entirely", "To collect taxes"],a:1,w:'Educational institutions transmit knowledge and civic values, preparing citizens for participation in society and governance.'},{q:'Government and the legal system are needed in society mainly to:',o:["Provide formal rules and enforcement beyond what family/community alone can achieve", "Replace the family as the basic social unit", "Eliminate religion", "Prevent all social change"],a:0,w:'Government and law provide formal, enforceable rules for regulating behaviour society-wide, beyond what family or community alone can manage.'},{q:'Why do political scientists study social institutions when studying government?',o:["Because institutions like family, religion and education shape citizens' values and behaviour, which in turn shapes political life", "Because social institutions have no bearing on politics", "Because only government institutions matter", "Because family and religion are purely private matters with no public relevance"],a:0,w:'Social institutions shape citizens\' values and behaviours, which in turn influence political attitudes, participation and governance.'},{q:'Which best illustrates the interaction between social institutions and government in Nigeria?',o:["Religious and ethnic considerations often influence voting patterns and political appointments", "Social institutions never affect elections", "Only economic institutions matter in Nigerian politics", "Family structures have no bearing on Nigerian society"],a:0,w:'Religious and ethnic identities, rooted in social institutions, commonly influence Nigerian voting patterns and political appointments.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government • Y10',ti:'Social Change and Its Causes',su:'Understand how and why societies change over time.',steps:[
  {lb:'What is social change?',dr:dQ5,ht:'<p>Social change refers to significant alterations in a society\'s structure, culture, or institutions over time — such as shifts in family structure, urbanisation, or changing attitudes toward gender roles.</p>'},
  {lb:'Causes of social change',dr:dQ5,ht:'<p>Key causes include: technological innovation (e.g. mobile phones, internet), education, urbanisation and migration, economic development, and contact with other cultures through trade, colonialism or globalisation.</p>'},
  {lb:'Social change in Nigeria',dr:dQ5,ht:'<p>Nigeria has experienced significant social change: colonial-era disruption of traditional systems, rapid urbanisation (e.g. growth of Lagos), rising education levels, and, more recently, the influence of social media on youth culture and political activism.</p>'},
  {lb:'Government\'s role in managing change',dr:dQ5,ht:'<p>Government can both drive social change (through education policy, laws on marriage age or gender equality) and respond to change (adjusting policy for urbanisation, youth unemployment, or evolving social attitudes).</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'Social change refers to:',o:["A society remaining completely static forever", "Significant alterations in a society's structure, culture, or institutions over time", "Only changes in government leadership", "Only changes to a country's currency"],a:1,w:'Social change describes significant shifts in a society\'s structure, culture, or institutions over time.'},{q:'Which of these is a common cause of social change?',o:["Technological innovation such as mobile phones and the internet", "A society having no contact with any outside influence", "Government banning all forms of change", "Total isolation of all citizens"],a:0,w:'Technological innovation is a major driver of social change, altering communication, work and social interaction.'},{q:'Which best illustrates significant social change in Nigeria?',o:["Rapid urbanisation and growth of cities like Lagos", "No change at all since pre-colonial times", "The complete disappearance of all ethnic groups", "A ban on all technology"],a:0,w:'Rapid urbanisation, such as the growth of Lagos, is a clear example of significant social change in Nigeria.'},{q:'How can government drive social change?',o:["Only by doing nothing at all", "Through education policy and laws affecting issues like marriage age or gender equality", "By banning all social institutions", "By eliminating the concept of society"],a:1,w:'Government can drive social change through deliberate policy, such as education reform or laws on marriage age and gender equality.'},{q:'Which modern factor has notably influenced youth culture and political activism in Nigeria?',o:["Social media", "The complete absence of technology", "Feudal land tenure", "Colonial-era railways alone"],a:0,w:'Social media has significantly influenced Nigerian youth culture and political activism in recent years.'},{q:'Why must government respond to social change?',o:["Because ignoring social change has no consequences", "Because unaddressed social change (e.g. urbanisation, youth unemployment) can create new policy challenges requiring government response", "Because social change never affects government policy", "Because government cannot influence society at all"],a:1,w:'Social changes like urbanisation and youth unemployment create new challenges that government must address through policy.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government • Y10',ti:'Social Stratification',su:'Understand how societies are structured into layers or classes.',steps:[
  {lb:'What is social stratification?',dr:dQ6,ht:'<p>Social stratification refers to the way society is structured into layers or classes based on factors such as wealth, occupation, education, or, in some societies, birth/caste — creating differences in status, power and access to resources.</p>'},
  {lb:'Bases of stratification',dr:dQ6,ht:'<p>Common bases include: economic class (rich, middle class, poor), occupation and education level, and in some traditional societies, hereditary status (e.g. royal lineage, caste-like distinctions).</p>'},
  {lb:'Stratification in Nigeria',dr:dQ6,ht:'<p>Nigerian society shows stratification based on wealth and education (urban elite vs rural poor), as well as some lingering influence of traditional titles and royal lineage in certain communities, alongside modern class divisions.</p>'},
  {lb:'Effects of stratification on politics',dr:dQ6,ht:'<p>Stratification affects political access and influence — wealthier or more educated citizens often have greater access to political office, resources for campaigns, and influence over policy, raising ongoing questions about equality and representation.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'Social stratification refers to:',o:["The complete absence of social differences", "Society structured into layers or classes based on wealth, occupation, education or birth", "A type of government building", "A form of election"],a:1,w:'Social stratification describes how society is layered into classes based on wealth, occupation, education, or birth/status.'},{q:'Which of these is a common basis for social stratification?',o:["Economic class (wealth and occupation)", "The colour of a country's flag", "The number of political parties", "The size of the national anthem"],a:0,w:'Economic class, based on wealth and occupation, is one of the most common bases of social stratification.'},{q:'Which best illustrates stratification\'s effect on Nigerian politics?',o:["Wealthier or more educated citizens often have greater access to political office and resources for campaigns", "All citizens have exactly equal political influence regardless of wealth", "Stratification has no effect on political access at all", "Only rural citizens can access political office"],a:0,w:'Stratification affects political access, with wealthier or more educated citizens typically having greater access to office and campaign resources.'},{q:'In some traditional Nigerian communities, which factor can still influence social status alongside modern class divisions?',o:["Royal lineage or traditional titles", "Only internet access", "Only a person's age in months", "Only a person's blood type"],a:0,w:'Royal lineage and traditional titles can still influence social status in some Nigerian communities, alongside modern economic class divisions.'},{q:'Why do political scientists study social stratification?',o:["Because it has no relevance to governance", "Because it raises important questions about equality of political access and representation", "Because it only concerns religious matters", "Because stratification cannot be measured"],a:1,w:'Studying stratification helps explain inequalities in political access and representation, a key concern in governance.'},{q:'Which pairing correctly matches basis of stratification to description?',o:["Occupation \u2014 a person's job and its associated status/income", "Feudalism \u2014 a form of election", "Communism \u2014 a religious institution", "Democracy \u2014 a basis of social stratification"],a:0,w:'Occupation, and its associated status and income, is a recognised basis of social stratification.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government • Y10',ti:'Society and National Integration',su:'Explore the challenges of building national unity in a diverse society.',steps:[
  {lb:'National integration defined',dr:dQ7,ht:'<p>National integration is the process of unifying diverse groups within a society (different ethnicities, religions, regions) into a cohesive nation with a shared sense of identity and common purpose.</p>'},
  {lb:'Challenges in Nigeria',dr:dQ7,ht:'<p>Nigeria\'s diversity (over 250 ethnic groups, multiple religions, regional differences) creates integration challenges: ethnic rivalry, religious tension, regional inequality, and, historically, events like the Nigerian Civil War (1967–70).</p>'},
  {lb:'Tools for national integration',dr:dQ7,ht:'<p>Tools used to promote integration include: the National Youth Service Corps (NYSC), federal character principle in appointments, a shared national language framework (English as official language plus indigenous languages), and national symbols (flag, anthem).</p>'},
  {lb:'Ongoing debates',dr:dQ7,ht:'<p>Debates continue over how best to achieve integration — whether through stronger central government, greater regional autonomy (restructuring/federalism debates), or more inclusive power-sharing arrangements among Nigeria\'s diverse groups.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'National integration refers to:',o:["Dividing a country into smaller separate nations", "Unifying diverse groups within a society into a cohesive nation with shared identity", "Banning all ethnic groups", "Removing all regional governments"],a:1,w:'National integration is the process of unifying diverse groups into a cohesive nation with a shared sense of identity.'},{q:'Which historical event illustrates a major challenge to Nigeria\'s national integration?',o:["The 1999 Constitution's adoption", "The Nigerian Civil War (1967\u201370)", "The founding of NYSC", "The building of the Third Mainland Bridge"],a:1,w:'The Nigerian Civil War (1967–70) was a major crisis of national integration, rooted in ethnic and regional tensions.'},{q:'Which programme was specifically established to promote national integration among Nigerian youth?',o:["The National Youth Service Corps (NYSC)", "The Central Bank of Nigeria", "The Nigerian Stock Exchange", "The Federal Road Safety Corps"],a:0,w:'NYSC was established to promote national unity by posting graduates to serve in states other than their own.'},{q:'The federal character principle in Nigeria\'s Constitution aims to:',o:["Give one ethnic group permanent dominance", "Ensure fair representation of Nigeria's diverse states and ethnic groups in appointments", "Abolish all state governments", "Remove the need for elections"],a:1,w:'Federal character (s.14(3) of the 1999 Constitution) requires appointments to reflect Nigeria\'s diversity of states and groups.'},{q:'Debates about \'restructuring\' in Nigeria mainly concern:',o:["Whether to have more regional autonomy/federalism versus stronger central government", "Whether to abolish the national anthem", "Whether to remove the judiciary entirely", "Whether to end all international relations"],a:0,w:'Restructuring debates in Nigeria centre on adjusting the balance between central government power and regional/state autonomy.'},{q:'Why is national integration particularly challenging in Nigeria?',o:["Because Nigeria has no ethnic or religious diversity", "Because of Nigeria's significant ethnic, religious and regional diversity (over 250 ethnic groups)", "Because Nigeria has only one language", "Because Nigeria has no history of conflict"],a:1,w:'Nigeria\'s integration challenges stem largely from its significant ethnic, religious and regional diversity.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government • Y10',ti:'Civil Society and Its Role',su:'Understand the role of civil society organisations in relation to the state.',steps:[
  {lb:'What is civil society?',dr:dQ8,ht:'<p>Civil society refers to the space of voluntary organisations and associations — NGOs, trade unions, professional bodies, religious groups, community associations — that operate independently of government and the market.</p>'},
  {lb:'Functions of civil society',dr:dQ8,ht:'<p>Civil society organisations advocate for citizens\' interests, monitor government performance, promote human rights, provide services government may not adequately deliver, and mobilise public opinion on key issues.</p>'},
  {lb:'Civil society in Nigeria',dr:dQ8,ht:'<p>Examples of Nigerian civil society include human rights groups, market women associations, professional bodies (e.g. the Nigerian Bar Association), and social movements such as those advocating for electoral reform or against police brutality.</p>'},
  {lb:'Civil society and government accountability',dr:dQ8,ht:'<p>A vibrant civil society strengthens democracy by holding government accountable between elections — through advocacy, investigative reporting partnerships, protests, and public interest litigation — complementing formal checks like the legislature and judiciary.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'Civil society refers to:',o:["Only government ministries", "Voluntary organisations and associations operating independently of government and the market", "Only the military", "Only foreign embassies"],a:1,w:'Civil society comprises voluntary organisations (NGOs, unions, professional bodies) independent of both government and the market.'},{q:'Which is a key function of civil society organisations?',o:["Monitoring government performance and advocating for citizens' interests", "Replacing the judiciary entirely", "Controlling the national currency", "Conducting national elections directly"],a:0,w:'Civil society organisations monitor government, advocate for citizen interests and promote accountability.'},{q:'Which is an example of civil society in Nigeria?',o:["The Nigerian Bar Association", "The Federal Ministry of Finance", "The National Assembly", "The Central Bank of Nigeria"],a:0,w:'The Nigerian Bar Association is a professional civil society body, distinct from government institutions.'},{q:'How does civil society strengthen democracy?',o:["By replacing the need for elections entirely", "By holding government accountable between elections through advocacy, protest and public interest litigation", "By eliminating the judiciary", "By controlling all media outlets directly"],a:1,w:'Civil society strengthens democracy by holding government accountable between elections, complementing formal checks like the judiciary and legislature.'},{q:'Which best describes the relationship between civil society and the state?',o:["Civil society organisations operate independently of, and often as a check on, the state", "Civil society is a formal part of government structure", "Civil society has no interaction with government at all", "Civil society only exists in non-democratic states"],a:0,w:'Civil society operates independently of the state and often serves as a check on government power and performance.'},{q:'Which movement/example best illustrates Nigerian civil society mobilising public opinion?',o:["Protests advocating for electoral reform or against police brutality", "The passing of a federal budget by the National Assembly", "A presidential inauguration ceremony", "A Supreme Court ruling on a private contract dispute"],a:0,w:'Public protests and advocacy movements, such as those for electoral reform or against police brutality, illustrate civil society mobilising public opinion.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government • Y10',ti:'WAEC Exam Preparation — Society and the State',su:'Practise WAEC-style questions on society, social institutions and the state.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions on society: (1) Define society clearly. (2) Identify relevant types or institutions. (3) Distinguish society from state/government where required. (4) Use Nigerian examples (NYSC, federal character, civil society groups). (5) Discuss implications for governance.</p>'},
  {lb:'Common WAEC question patterns',dr:dQ9,ht:'<p>Typical questions: \'Distinguish between society, state and government\', \'Discuss the role of social institutions in nation-building\', \'Explain the challenges of national integration in Nigeria\', \'What is civil society? Discuss its role in a democracy\'.</p>'},
  {lb:'Key facts to memorise',dr:dQ9,ht:'<p>Society = human community with shared culture/institutions. State = society organised politically (population, territory, government, sovereignty). Government = the instrument exercising state authority. NYSC and federal character = key Nigerian integration tools.</p>'},
  {lb:'Common mistakes to avoid',dr:dQ9,ht:'<p>Avoid treating \'society\', \'state\' and \'government\' as interchangeable — WAEC expects clear distinctions. Avoid ignoring Nigeria\'s ethnic diversity when discussing integration. Always give at least one concrete example (institution, policy, or event) per point.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'When WAEC asks students to distinguish society, state and government, markers expect:',o:["A statement that they are identical", "Clear distinctions: society (human community), state (politically organised society), government (the instrument exercising authority)", "Only a definition of government", "No examples at all"],a:1,w:'WAEC expects candidates to clearly distinguish society, state and government as related but distinct concepts.'},{q:'A strong WAEC answer on national integration in Nigeria should mention:',o:["That Nigeria has no ethnic diversity", "Nigeria's ethnic/religious diversity and tools like NYSC and federal character", "Only the size of Nigeria's population", "Only Nigeria's currency"],a:1,w:'WAEC expects reference to Nigeria\'s diversity and specific integration tools such as NYSC and the federal character principle.'},{q:'Which term should be defined first if asked \'What is civil society? Discuss its role in a democracy\'?',o:["Civil society, as voluntary organisations independent of government and the market", "The national currency", "The stock exchange only", "The military"],a:0,w:'The question requires a precise definition of civil society before discussing its role — defining it as independent voluntary organisations.'},{q:'A common WAEC mistake to avoid on this topic is:',o:["Using Nigerian examples", "Treating society, state and government as exactly the same concept", "Discussing social institutions", "Mentioning NYSC or federal character"],a:1,w:'A frequent error is failing to distinguish society, state and government, when WAEC expects clear differentiation.'},{q:'For full marks on \'role of social institutions in nation-building\', students should reference:',o:["Only the military", "Institutions like family, religion, education and their role in shaping values and cohesion", "Only the stock exchange", "Only foreign embassies"],a:1,w:'A complete answer covers institutions like family, religion and education, and how they shape values and social cohesion relevant to nation-building.'},{q:'Which structure earns the most marks for a WAEC essay on society/state/government?',o:["A single undefined sentence", "Clear definitions, distinctions, relevant Nigerian examples, and a concluding point on significance", "Only a list of unrelated facts", "Copying the question without any explanation"],a:1,w:'WAEC rewards essays that define terms clearly, draw distinctions, use relevant examples and conclude with significance.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Government • Y10',ti:'Mixed Questions — Society and the State',su:'Integrated revision across society, institutions, stratification and integration.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Society = organised human community with shared culture/institutions. Types: traditional/modern, homogeneous/heterogeneous, open/closed. Institutions: family, religion, education, government/law. Stratification: layered by wealth/occupation/education. Integration tools: NYSC, federal character. Civil society: independent watchdog/advocacy space.</p>'},

strates the ongoing interaction between society and government in Nigeria?',o:["Federal character ensuring diverse representation in appointments, shaped by society's ethnic diversity", "A government operating with no reference to the society it governs", "A society existing with absolutely no government or laws", "A stock exchange operating independently of all social factors"],a:0,w:'Federal character directly reflects how Nigeria\'s diverse society shapes government policy on representation and appointments.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
