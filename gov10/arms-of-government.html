<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Three Arms of Government — Government</title>
<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Three Arms of Government',ACC,12,'middle',true));
var rows=[['Arm','Function','Examples'],['Legislature','Makes laws (law-making)','National Assembly; Parliament; Congress'],['Executive','Implements/enforces laws','President; Prime Minister; Cabinet'],['Judiciary','Interprets laws; settles disputes','Supreme Court; Court of Appeal; High Court'],['Separation','Each arm is independent','Prevents abuse of power'],['Checks/balances','Each arm checks the others','Keeps government accountable'],['WAEC tip','Know the functions AND examples for each arm','Nigeria: NASS; President; Supreme Court']];
rows.forEach(function(r,i){if(i<=p){o.push(R(10,16+i*33,460,28,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(90,32+i*33,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(250,32+i*33,r[1],'#444',7,'middle',false));o.push(T(400,32+i*33,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Checks and Balances — How Arms Control Each Other',ACC,11,'middle',true));
var rows=[['Legislature checks Executive','Approves budget; can impeach president'],['Legislature checks Judiciary','Approves judges; can amend laws they interpret'],['Executive checks Legislature','Can veto bills; can call special sessions'],['Executive checks Judiciary','Appoints judges; can pardon convicts'],['Judiciary checks Legislature','Can declare laws unconstitutional (judicial review)'],['Judiciary checks Executive','Can declare executive actions unconstitutional']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(130,52+i*32,r[0],ACC,8,'middle',true));o.push(T(330,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Arms of Government — Summary',ACC,13,'middle',true));
var rows=[['Legislature','Makes laws; approves budget; Nigeria: National Assembly (Senate + Reps)'],['Executive','Implements laws; runs the state; Nigeria: President + Cabinet + Civil Service'],['Judiciary','Interprets laws; settles disputes; Nigeria: Supreme Court, Appeal, High Courts'],['Separation','Prevents concentration of power in one hand'],['Checks/Balances','Each arm oversees and limits the others'],['Montesquieu','French philosopher who theorised separation of powers (Spirit of the Laws, 1748)']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(100,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov \u2022 ELE',ti:'The Legislature',su:'Examine the legislature — its functions, structure and role.',steps:[
{lb:'What is the legislature?',dr:dQ1,ht:'<p>The <b>legislature</b> is the arm of government responsible for making laws. It is also called: Parliament (UK, many Commonwealth countries); National Assembly (Nigeria, USA and others); Congress (USA); Diet (Japan). In Nigeria, the National Assembly (NASS) consists of: (1) The Senate — 109 senators, 3 per state plus 1 for the FCT. (2) The House of Representatives — 360 members. Together, they form the bicameral legislature. A <b>bicameral</b> legislature has two chambers; a <b>unicameral</b> legislature has only one.</p>'},
{lb:'Functions of the legislature',dr:dQ2,ht:'<p>Functions of the legislature: (1) <b>Law-making</b> — the primary function; bills are debated, amended and passed. (2) <b>Approving the budget</b> — no money can be spent without legislative approval. (3) <b>Oversight</b> — monitoring the executive\'s implementation of laws and policies. (4) <b>Representation</b> — representing constituents\' interests. (5) <b>Amendment of the constitution</b> — in most countries, the legislature must approve constitutional changes. (6) <b>Impeachment</b> — the legislature can remove the president/executive for misconduct.</p>'},
{lb:'Bicameral vs unicameral',dr:dQ1,ht:'<p><b>Bicameral</b> legislature (two chambers): Nigeria (Senate + House of Reps); USA (Senate + House of Representatives); UK (House of Lords + House of Commons). Advantages: thorough debate; second chamber can revise and improve bills; prevents hasty legislation. <b>Unicameral</b> (one chamber): Smaller or unitary states often prefer this. Advantages: faster law-making; less expensive; less duplication. WAEC: know the difference and the examples. Nigeria has a federal bicameral legislature.</p>'},
{lb:'Nigeria\'s National Assembly',dr:dQ2,ht:'<p>Nigeria\'s National Assembly (created by the 1999 Constitution): Senate — 109 senators (3 per state × 36 states + 1 for Abuja FCT); President of the Senate leads it. House of Representatives — 360 members allocated by population; Speaker leads it. For a bill to become law: it must be passed by both chambers, then signed by the President. The President can veto (withhold assent); the National Assembly can override the veto with a two-thirds majority. Senate confirms presidential appointments (ministers, ambassadors, judges).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The primary function of the legislature is:',o:['Implementing and enforcing laws','Making laws','Interpreting laws and settling disputes','Appointing government ministers'],a:2,w:'The legislature\'s primary function is LAW-MAKING. The executive implements laws; the judiciary interprets them. Each arm has its distinct primary function.'},{q:'A legislature with two chambers is called:',o:['Unilateral','Unicameral','Bicameral','Multilateral'],a:3,w:'A bicameral legislature has two chambers (bi = two). Nigeria\'s National Assembly has the Senate and the House of Representatives. Unicameral means one chamber only.'},{q:'In Nigeria, the National Assembly consists of:',o:['The House of Representatives only','The Senate only','The Senate (109 members) and the House of Representatives (360 members)','The National Council of State and the Federal Executive Council'],a:3,w:'Nigeria\'s National Assembly has two chambers: the Senate (109 senators) and the House of Representatives (360 members) — a bicameral federal legislature.'},{q:'The legislature can remove the president for misconduct through a process called:',o:['Judicial review','A vote of no confidence','Impeachment','Constitutional amendment'],a:3,w:'Impeachment — the process by which the legislature formally removes the president or other senior officials for gross misconduct. In Nigeria, the National Assembly can impeach the President.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 ELE',ti:'The Executive',su:'Examine the executive — its functions, structure and role.',steps:[
{lb:'What is the executive?',dr:dQ2,ht:'<p>The <b>executive</b> is the arm of government responsible for implementing and enforcing laws and running the day-to-day affairs of the state. It is also called the government in the narrow sense. Forms: (1) <b>Presidential</b> — President is both head of state and head of government, elected separately (Nigeria, USA). (2) <b>Parliamentary/Cabinet</b> — Prime Minister is head of government; Monarch/President is head of state (UK, India). (3) <b>Hybrid/Semi-presidential</b> — Both President and Prime Minister share executive power (France). Nigeria operates the presidential system.</p>'},
{lb:'Functions of the executive',dr:dQ1,ht:'<p>Functions of the executive: (1) <b>Policy formulation and implementation</b> — develops and carries out government programmes. (2) <b>Enforcement of laws</b> — ensures laws are obeyed through the police, army and other agencies. (3) <b>Foreign policy</b> — conducts international relations, signs treaties. (4) <b>Appointment</b> — appoints ministers, ambassadors and judges (subject to legislative confirmation). (5) <b>Budget preparation</b> — the executive prepares the budget (the legislature approves it). (6) <b>Commander-in-chief</b> — the president typically commands the armed forces.</p>'},
{lb:'Nigeria\'s executive arm',dr:dQ2,ht:'<p>Nigeria\'s executive (1999 Constitution): President — head of state, head of government, commander-in-chief, elected for a maximum of two four-year terms. Vice-President — assists the President; acts as President when the President is absent or incapacitated. Cabinet (Ministers) — head the various ministries; nominated by the President, confirmed by the Senate. The Civil Service — permanent bureaucracy that implements government programmes regardless of which political party is in power. Governors lead executive government at state level; Local Government Chairmen at the local level.</p>'},
{lb:'Executive vs other arms',dr:dQ1,ht:'<p>Key distinctions: Executive (implements laws) vs Legislature (makes laws) vs Judiciary (interprets laws). The executive is checked by: (1) Legislature — approves budget; can impeach; must confirm appointments. (2) Judiciary — can declare executive actions unconstitutional. In presidential systems (Nigeria), the executive is elected separately from the legislature — they can be from different parties, creating potential for executive-legislative conflict. In parliamentary systems (UK), the executive comes from the legislature — the Prime Minister must maintain majority support to govern.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The primary function of the executive is:',o:['Making laws for the state','Implementing and enforcing laws; running the day-to-day affairs of the state','Interpreting laws and settling legal disputes','Amending the constitution when necessary'],a:2,w:'The executive\'s primary function is implementing and enforcing laws and running the state\'s day-to-day affairs. The legislature makes laws; the judiciary interprets them.'},{q:'In Nigeria\'s presidential system, the President is:',o:['Only head of state, not head of government','Only head of government, not head of state','Both head of state AND head of government, elected separately from the legislature','The leader of the party with the most seats in the National Assembly'],a:3,w:'In Nigeria\'s presidential system, the President is both head of state (representing the nation) AND head of government (running the government), elected separately from the National Assembly.'},{q:'The executive in Nigeria prepares the budget, but it must be:',o:['Signed by the Chief Justice of Nigeria','Approved by the National Assembly (legislature) before implementation','Approved by the National Council of State','Reviewed by a special Economic Advisory Committee'],a:2,w:'Budget preparation is an executive function; budget approval is a legislative function. The executive (President) prepares and submits the budget; the National Assembly must approve it before money is spent.'},{q:'A system where the Prime Minister is head of government but a Monarch is head of state is called:',o:['Presidential system','Federal system','Parliamentary/Cabinet system','Military system'],a:3,w:'In the parliamentary/cabinet system (e.g. UK), the elected Prime Minister heads the government while the Monarch (or ceremonial President) is head of state. Nigeria uses the presidential system instead.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 ELE',ti:'The Judiciary',su:'Examine the judiciary — its functions, structure and role.',steps:[
{lb:'What is the judiciary?',dr:dQ3,ht:'<p>The <b>judiciary</b> is the arm of government responsible for interpreting laws and settling disputes. It is the guardian of the constitution and the protector of citizens\' rights. Key principles: (1) <b>Independence</b> — the judiciary must be free from interference by the executive and legislature. (2) <b>Impartiality</b> — judges must decide cases without bias or favour. (3) <b>Rule of law</b> — everyone, including government officials, is subject to the law and can be held accountable through the courts. Without an independent judiciary, all other rights are insecure.</p>'},
{lb:'Functions of the judiciary',dr:dQ4,ht:'<p>Functions of the judiciary: (1) <b>Interpretation of laws</b> — courts give authoritative meaning to legislation. (2) <b>Settlement of disputes</b> — between individuals; between individuals and the state; between states; between arms of government. (3) <b>Protection of rights</b> — fundamental rights can be enforced in court. (4) <b>Judicial review</b> — courts can declare laws or executive actions unconstitutional and void. (5) <b>Punishment of offenders</b> — courts impose sentences on those convicted of crimes. (6) <b>Guardian of the constitution</b> — the Supreme Court is the final interpreter of the constitution.</p>'},
{lb:'Nigeria\'s court structure',dr:dQ3,ht:'<p>Nigeria\'s court hierarchy (from highest): (1) <b>Supreme Court</b> — highest court; final appellate court; interprets the constitution. (2) <b>Court of Appeal</b> — hears appeals from High Courts. (3) <b>Federal High Court</b> — federal matters (revenue, immigration, admiralty). (4) <b>State High Courts</b> — major civil and criminal cases at state level. (5) <b>Sharia Court of Appeal / Customary Court of Appeal</b> — where applicable. (6) <b>Magistrates\' Courts</b> — minor criminal and civil cases. (7) <b>Customary Courts</b> — local level. Cases move upward on appeal.</p>'},
{lb:'Judicial independence',dr:dQ4,ht:'<p>Judicial independence means judges must decide cases without fear of consequences from the executive or legislature. Safeguards of judicial independence in Nigeria: (1) Security of tenure — judges cannot easily be removed (only by the National Judicial Council process). (2) Financial security — judicial salaries are charged to the Consolidated Revenue Fund, not subject to annual legislative appropriation. (3) Immunity from legal action for judicial decisions. (4) The Chief Justice of Nigeria is the head of the judiciary, not appointed by the legislature. Without judicial independence, the rule of law collapses.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'The primary function of the judiciary is:',o:['Making laws for the state','Implementing and enforcing government policies','Interpreting laws and settling disputes','Appointing government ministers and officials'],a:3,w:'The judiciary\'s primary function is interpreting laws and settling disputes. The legislature makes laws; the executive implements them; the judiciary interprets them when disputes arise.'},{q:'Judicial review is the power of courts to:',o:['Review the budget prepared by the executive','Declare laws or executive actions unconstitutional and void','Review the qualifications of candidates for public office','Review the records of the legislature\'s proceedings'],a:2,w:'Judicial review — the power of courts (especially the Supreme Court) to declare laws passed by the legislature or actions taken by the executive to be unconstitutional and therefore void.'},{q:'In Nigeria, the highest court is the:',o:['Court of Appeal','Federal High Court','Supreme Court','Chief Justice\'s Court'],a:3,w:'The Supreme Court of Nigeria is the highest court — the final appellate court that gives authoritative interpretation of the constitution. No further appeal is possible from a Supreme Court decision.'},{q:'Judicial independence is protected in Nigeria by ensuring that judges\' salaries are:',o:['Determined annually by the legislature in the appropriation act','Paid from a special international fund to prevent local political influence','Charged to the Consolidated Revenue Fund — not subject to annual legislative appropriation','Set by the President with Senate confirmation each year'],a:3,w:'Charging judicial salaries to the Consolidated Revenue Fund means they flow automatically without annual legislative approval — preventing the legislature from using budget cuts to pressure judges.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 ELE',ti:'Separation of Powers and Checks and Balances',su:'Examine the doctrine of separation of powers and checks and balances.',steps:[
{lb:'Separation of powers — theory',dr:dQ4,ht:'<p>The doctrine of <b>separation of powers</b> holds that the three arms of government (legislature, executive, judiciary) should be separate and independent, each exercising its own distinct functions. Originated with the French philosopher <b>Montesquieu</b> in his work <em>The Spirit of the Laws</em> (1748). His argument: "When the legislative and executive powers are united in the same person, there can be no liberty." If all power is concentrated in one hand, tyranny results. The USA (1787 Constitution) was the first modern state to codify separation of powers formally.</p>'},
{lb:'Checks and balances',dr:dQ2,ht:'<p><b>Checks and balances</b> refers to the system by which each arm of government can limit and oversee the others, preventing any single arm from becoming too powerful. Key examples: Legislature checks Executive (approves budget; can impeach). Legislature checks Judiciary (approves judges; can amend laws). Executive checks Legislature (can veto bills; can call special sessions). Executive checks Judiciary (appoints judges; can pardon convicts). Judiciary checks Legislature (judicial review — can void unconstitutional laws). Judiciary checks Executive (can declare executive actions unconstitutional).</p>'},
{lb:'Fusion of powers vs separation',dr:dQ4,ht:'<p>Not all systems fully separate powers: <b>Fusion of powers</b> (UK parliamentary system) — the executive (Prime Minister and Cabinet) comes from and remains part of the legislature. The PM must maintain majority support in Parliament. Advantages: efficient; no deadlock. Disadvantages: less clear separation; executive dominates legislature. <b>Separation of powers</b> (Nigeria, USA presidential system) — executive and legislature are separately elected and can be from different parties. Advantage: genuine separation. Disadvantage: potential deadlock between executive and legislature.</p>'},
{lb:'Importance of separation of powers',dr:dQ2,ht:'<p>Importance: (1) Prevents tyranny and abuse of power — no single person or body controls everything. (2) Protects individual rights — an independent judiciary can check both executive and legislative overreach. (3) Promotes accountability — each arm must justify its actions to the others. (4) Ensures rule of law — no one is above the law, including those in power. (5) Stability — distributes power so the collapse of one arm does not bring down the whole system. Weaknesses: can lead to deadlock; the arms may not be truly independent in practice (executive often controls legislature).</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'The doctrine of separation of powers was theorised by:',o:['John Locke in the Second Treatise of Government','Jean-Jacques Rousseau in The Social Contract','Montesquieu in The Spirit of the Laws (1748)','Thomas Hobbes in Leviathan'],a:3,w:'Montesquieu\'s "The Spirit of the Laws" (1748) theorised that liberty is only secured when legislative, executive and judicial powers are separated. The USA Constitution embodied this theory.'},{q:'Checks and balances means that:',o:['Each arm of government operates completely independently with no interaction','Each arm can limit and oversee the others, preventing any single arm from becoming too powerful','The military checks all three arms of government to prevent corruption','Citizens check the government through elections only'],a:2,w:'Checks and balances — the system by which each arm oversees and limits the others. E.g. Legislature approves budget/impeaches; Executive appoints judges/vetoes bills; Judiciary reviews constitutionality.'},{q:'When the Supreme Court declares a law passed by the legislature to be unconstitutional, this is called:',o:['Legislative override','Executive veto','Judicial review','Constitutional amendment'],a:3,w:'Judicial review — the power of courts to examine legislation or executive actions and declare them void if they violate the constitution. A key check by the judiciary on the other arms.'},{q:'A system where the Prime Minister (head of government) comes from and remains part of the legislature is called:',o:['Federal system','Presidential system','Unitary system','Parliamentary/Cabinet system (fusion of powers)'],a:4,w:'In the parliamentary system (UK, India), the executive (PM and Cabinet) comes from the legislature and must maintain its confidence. This "fusion of powers" contrasts with the presidential separation (Nigeria, USA).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 ELE',ti:'WAEC Prep — Arms of Government',su:'Practise WAEC-style questions on the three arms of government.',steps:[
{lb:'WAEC essay structure',dr:dQ5,ht:'<p>For WAEC questions on arms of government: (1) Define each arm and its primary function. (2) Give the structure (Nigeria: NASS Senate+HoR; President+VP+Cabinet; Supreme Court+hierarchy). (3) Explain checks and balances between arms. (4) Evaluate the importance of separation of powers. (5) Compare presidential vs parliamentary systems. Common questions: "Examine the functions of the legislature." / "Discuss the importance of judicial independence." / "How do the arms of government check each other in Nigeria?"</p>'},
{lb:'Key facts for WAEC',dr:dQ5,ht:'<p>WAEC fact bank: Legislature = law-making; bicameral in Nigeria (Senate 109 + HoR 360). Executive = implementation; presidential in Nigeria (President + VP + Cabinet). Judiciary = interpretation; Supreme Court is highest in Nigeria. Montesquieu theorised separation of powers (1748). Presidential system: USA and Nigeria — separate election of executive and legislature. Parliamentary system: UK — PM from legislature. Judicial review = courts can void unconstitutional laws. Impeachment = legislature removes president for misconduct.</p>'},
{lb:'Comparing the three arms',dr:dQ1,ht:'<p>WAEC comparison table: Legislature — makes laws; elected; can impeach; approves budget. Executive — implements laws; elected (presidential) or from legislature (parliamentary); prepares budget; appoints judges. Judiciary — interprets laws; appointed; independent; can declare laws void (judicial review); final arbiter of constitutional meaning. All three: must be independent for democracy to function; each has primary functions but also oversight roles over the others; separation of powers prevents any one arm from dominating.</p>'},
{lb:'Common WAEC mistakes',dr:dQ2,ht:'<p>Avoid: Saying the executive makes laws (it implements them). Saying the legislature interprets laws (the judiciary does). Attributing separation of powers to Rousseau or Locke (it is Montesquieu). Saying Nigeria has a unicameral legislature (it is bicameral: Senate + HoR). Confusing impeachment (removing the president for misconduct) with a vote of no confidence (parliamentary system only). Forgetting to mention Nigeria-specific structures when asked. Always define before explaining — WAEC awards marks for definitions.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'Which of the following correctly matches each arm to its primary function?',o:['Legislature=implements laws; Executive=makes laws; Judiciary=interprets laws','Legislature=interprets laws; Executive=implements laws; Judiciary=makes laws','Legislature=makes laws; Executive=implements laws; Judiciary=interprets laws','Legislature=makes laws; Executive=interprets laws; Judiciary=implements laws'],a:3,w:'Legislature=MAKES laws; Executive=IMPLEMENTS/enforces laws; Judiciary=INTERPRETS laws and settles disputes. This is the fundamental distinction between the three arms of government.'},{q:'The philosopher who theorised separation of powers was:',o:['John Locke','Thomas Hobbes','Jean-Jacques Rousseau','Montesquieu (Charles-Louis de Secondat)'],a:4,w:'Montesquieu (1689-1755) theorised separation of powers in "The Spirit of the Laws" (1748). He argued that liberty requires separating legislative, executive and judicial powers.'},{q:'Nigeria\'s National Assembly has how many senators?',o:['36 senators (one per state)','60 senators','109 senators (3 per state + 1 for FCT)','120 senators'],a:3,w:'Nigeria\'s Senate has 109 members: 3 senators per state (36 states × 3 = 108) plus 1 senator for the Federal Capital Territory (Abuja). Total = 109.'},{q:'Judicial review gives courts the power to:',o:['Review the annual budget prepared by the executive','Set the salaries of legislators and judges','Declare laws or executive actions unconstitutional and therefore void','Review the credentials of candidates standing for election'],a:3,w:'Judicial review — courts examine whether laws or executive actions conform to the constitution. If they do not, the court can declare them unconstitutional and therefore void and of no effect.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 ELE',ti:'Mixed Questions — Arms of Government',su:'Integrated revision across GOV-ELE-06.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Three arms: Legislature (makes laws; Nigeria: Senate 109 + HoR 360 = National Assembly). Executive (implements laws; Nigeria: President + VP + Cabinet + Civil Service; presidential system). Judiciary (interprets laws; Nigeria: Supreme Court → Court of Appeal → Federal/State High Courts; judicial review). Separation of powers (Montesquieu, 1748). Checks and balances (each arm oversees the others). Presidential (Nigeria, USA): separate election. Parliamentary (UK): PM from legislature (fusion). Impeachment: legislature removes president. Judicial review: courts void unconstitutional laws.</p>'},
{lb:'How the arms interact',dr:dQ10,ht:'<p>Key interactions: Executive PREPARES budget → Legislature APPROVES budget. President NOMINATES ministers/judges → Senate CONFIRMS. President ASSENTS to bills or VETOES them → Legislature can OVERRIDE veto (two-thirds majority). Courts can DECLARE laws void (judicial review). Legislature can IMPEACH president. Executive PARDONS convicted persons. These interactions ensure no arm becomes dominant. In practice, the executive often has the most power because it controls resources and implementation — that is why checks and balances matter.</p>'},
{lb:'Nigerian examples',dr:dQ1,ht:'<p>Nigerian examples of arms in action: Legislature — National Assembly debates and passes Petroleum Industry Act (2021). Executive — President assents to the bill, making it law; ministries implement it. Judiciary — Supreme Court settles electoral disputes (e.g. 2023 presidential election petition). Checks: National Assembly probes ministries in oversight hearings. Senate confirms or rejects ministerial nominees. Courts rule on whether presidential actions are constitutional. In practice, executive dominance is a challenge in Nigeria — the strength of other arms depends on the political will and institutional independence.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final revision: Know all three arms with their functions, Nigeria-specific structures and examples. Know Montesquieu (1748). Know bicameral (2 chambers) vs unicameral (1 chamber). Know judicial review and impeachment as key check-and-balance mechanisms. Know presidential vs parliamentary systems. For essays: define → structure → functions → checks and balances → importance → Nigeria examples → evaluation. Always include specific Nigerian context — WAEC expects knowledge of the Nigerian constitutional system, not just general theory.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'The arm of government that approves the budget prepared by the executive is the:',o:['Judiciary','Civil Service','Legislature (National Assembly in Nigeria)','National Economic Council'],a:3,w:'The legislature (National Assembly in Nigeria) approves the budget. The executive (President/Finance Minister) prepares it; no money can be spent until the legislature approves the appropriation bill.'},{q:'When the President nominates ministers, who must confirm them before they take office?',o:['The Chief Justice of Nigeria','The National Council of State','The Senate (as part of the National Assembly)','The Governor of the President\'s home state'],a:3,w:'In Nigeria\'s presidential system, the President nominates ministers but the Senate must screen and confirm (or reject) them before they can take office — a key legislature check on executive appointments.'},{q:'Which arm of government in Nigeria is headed by the President of the Senate and the Speaker of the House?',o:['The Executive','The Judiciary','The Legislature (National Assembly)','The Civil Service'],a:3,w:'The National Assembly (Nigeria\'s legislature) has two leaders: the President of the Senate (upper chamber) and the Speaker of the House of Representatives (lower chamber).'},{q:'The independence of the judiciary is essential for democracy because:',o:['Judges need high salaries to motivate good work','An independent judiciary ensures no one — including the government — is above the law (rule of law)','Judges must be independent to make their work easier','Independent judges are less likely to make mistakes in court'],a:2,w:'Judicial independence upholds the rule of law — the principle that everyone, including government officials, is subject to the law. Without independence, courts become tools of the powerful rather than guardians of rights.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 ELE',ti:'The Arms in Practice — Nigeria',su:'Examine how the three arms function in Nigeria\'s political system.',steps:[
{lb:'The 1999 Constitution and the arms',dr:dQ7,ht:'<p>Nigeria\'s 1999 Constitution (as amended) establishes the three arms: Chapter V (Part I) — National Assembly (legislature). Chapter VI — Federal Executive (president, VP, cabinet, civil service). Chapter VII — The Judicature (courts). The constitution also creates the State Houses of Assembly (36 states), State Governors, and State High Courts — meaning the structure is replicated at federal and state levels. At local government level, there are legislative councils and chairmen. Each level has its own separation of arms, though the federal level is dominant in Nigeria\'s federal system.</p>'},
{lb:'Executive-legislature relations in Nigeria',dr:dQ7,ht:'<p>In Nigeria, executive-legislature tension is common: The President presents the budget; the National Assembly frequently adjusts it — sometimes significantly. Presidential nominees are sometimes rejected by the Senate. The National Assembly has used its oversight powers to probe executive agencies. Cases of deadlock: In 2018, the National Assembly passed the Electoral Act but President Buhari declined assent. In 2021-22, the National Assembly and executive clashed over the Petroleum Industry Bill. These tensions, though sometimes frustrating, are the healthy exercise of separation of powers and checks and balances.</p>'},
{lb:'Judiciary in practice',dr:dQ8,ht:'<p>The judiciary in Nigeria has become increasingly important: Electoral petition tribunals settle disputed election results (increasingly common since 1999). The Supreme Court has ruled on the constitutionality of various executive actions. Courts have upheld fundamental rights cases against government agencies. However, challenges remain: judicial delays (cases taking years); corruption allegations; executive pressure on judges. The National Judicial Council (NJC) was created to insulate the judiciary from direct executive control over appointments and discipline of judges.</p>'},
{lb:'Weaknesses and reforms needed',dr:dQ8,ht:'<p>Weaknesses of the three arms in Nigeria\'s practice: (1) Executive dominance — the president controls significant resources and patronage. (2) Legislative-executive collusion rather than oversight — legislators may avoid challenging the executive for political favours. (3) Judiciary — delays, corruption and executive pressure undermine independence. (4) Civil society and media are essential fourth-tier checks that supplement the formal arms. Reforms needed: strengthen financial independence of legislature and judiciary; enforce judicial timelines; prosecute judicial corruption; ensure legislature truly represents citizens.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'Nigeria\'s National Assembly is created and its powers defined by:',o:['An Act of Parliament passed in 1960','The Presidential Decree of 1993','Chapter V of the 1999 Constitution (as amended)','The Electoral Act of 2022'],a:3,w:'Chapter V of the 1999 Constitution creates the National Assembly (Senate + House of Representatives) and defines its composition, powers and procedures.'},{q:'The National Judicial Council (NJC) in Nigeria was created to:',o:['Set the salaries of all judges in Nigeria','Allow the President to appoint all judges at federal and state levels','Insulate the judiciary from direct executive control over judicial appointments and discipline','Coordinate the work of all three arms of government'],a:3,w:'The NJC was created to handle judicial appointments and discipline of judges independently, reducing the ability of the executive or politicians to control judges through the threat of removal.'},{q:'When the National Assembly significantly adjusts the President\'s budget, this is an example of:',o:['Unconstitutional behaviour by the legislature','Checks and balances — the legislature exercising its power to oversee and modify executive proposals','Judicial review of executive financial proposals','The Executive Council overriding presidential decisions'],a:2,w:'The legislature\'s power to approve (and modify) the budget is a fundamental check on the executive. The National Assembly adjusting presidential budget proposals is a normal and constitutional exercise of legislative power.'},{q:'Electoral petition tribunals in Nigeria are part of which arm?',o:['The executive arm — they are appointed by the President','The legislative arm — the National Assembly sets them up for each election','The judicial arm — they are courts that settle disputes about election results','A separate independent arm outside the three main arms'],a:3,w:'Electoral petition tribunals are courts — part of the judicial arm. They hear petitions challenging election results. Their decisions can be appealed through the court system up to the Supreme Court.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 ELE',ti:'Doctrine Review — Arms of Government',su:'Review key doctrines and concepts.',steps:[
{lb:'Key doctrines',dr:dQ8,ht:'<p>Key doctrines: (1) <b>Separation of powers</b> — each arm has distinct functions and personnel; independence prevents tyranny (Montesquieu, 1748). (2) <b>Checks and balances</b> — each arm oversees the others; prevents any single arm from becoming too powerful. (3) <b>Judicial independence</b> — judges must be free from executive and legislative interference to uphold the rule of law. (4) <b>Rule of law</b> — everyone, including government, is subject to the law; the judiciary enforces this. (5) <b>Judicial review</b> — courts can void unconstitutional laws or actions.</p>'},
{lb:'Comparing presidential and parliamentary',dr:dQ8,ht:'<p>Presidential vs parliamentary: <b>Presidential</b> (Nigeria, USA) — executive and legislature separately elected; executive not removable by legislature except through impeachment; executive need not maintain legislative majority; greater separation. <b>Parliamentary</b> (UK, India) — executive (PM and Cabinet) drawn from legislature; PM must maintain majority support or fall; PM can dissolve parliament and call elections; fusion of executive and legislative powers; faster decision-making. Nigeria adopted presidential system in 1979 (second republic) and again in 1999 (fourth republic).</p>'},
{lb:'The role of the civil service',dr:dQ1,ht:'<p>The <b>civil service</b> is the permanent, professional bureaucracy that implements government programmes regardless of which party is in power. Unlike ministers (political appointments), civil servants are appointed on merit and serve continuously across administrations. Key features: (1) Permanence — continuity of government operations. (2) Political neutrality — serve whichever government is in power. (3) Anonymity — civil servants act in the name of their ministers. (4) Expertise — professional knowledge of government operations. The civil service is technically part of the executive arm but is distinct from the political executive (ministers and president).</p>'},
{lb:'WAEC essay techniques',dr:dQ2,ht:'<p>Exam technique for arms of government essays: (1) Start with a clear definition. (2) State the three arms with their primary functions. (3) Give specific Nigerian examples (NASS, President, Supreme Court). (4) Explain checks and balances with specific examples. (5) Discuss the importance of separation of powers. (6) Give a balanced evaluation — strengths and weaknesses in Nigerian practice. (7) End with a conclusion. Time management: 25-mark essays need 25-30 minutes. Allocate roughly one paragraph per major point — aim for 5-7 well-developed points.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'Which feature of the parliamentary system means the PM must resign or call elections if they lose the majority in parliament?',o:['Judicial review','Impeachment','Vote of no confidence / collective responsibility','Separation of powers'],a:3,w:'In the parliamentary system, the Prime Minister and Cabinet must maintain the confidence of the legislature. If the legislature passes a vote of no confidence, the PM must resign or call a general election.'},{q:'The civil service is described as "permanent" because:',o:['Civil servants can never be dismissed under any circumstances','Civil servants serve across different governments regardless of which party wins elections','Civil servants have the same job for life even if they underperform','Civil servants are appointed by the constitution, not by ministers'],a:2,w:'The civil service is permanent in the sense that career civil servants remain in post across different elected governments, providing continuity of government operations and institutional memory.'},{q:'Nigeria adopted the presidential system of government in its current form (Fourth Republic) in:',o:['1960 at independence','1963 when it became a republic','1979 (Second Republic) and again in 1999 (current Fourth Republic)','1993 during the Babangida transition'],a:3,w:'Nigeria first adopted the presidential system in 1979 (Second Republic — Shehu Shagari); this ended in the 1983 coup. The current Fourth Republic presidential system began in 1999 with President Olusegun Obasanjo.'},{q:'Who theorised separation of powers and in which work?',o:['John Locke, Two Treatises of Government (1689)','Thomas Hobbes, Leviathan (1651)','Montesquieu, The Spirit of the Laws (1748)','Jean-Jacques Rousseau, The Social Contract (1762)'],a:3,w:'Montesquieu (Charles-Louis de Secondat, Baron de Montesquieu) theorised separation of powers in "De l\'Esprit des Lois" (The Spirit of the Laws), published in 1748 in France.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 ELE',ti:'WAEC Prep — Deep Dive',su:'Advanced WAEC preparation on the three arms.',steps:[
{lb:'Advanced WAEC question types',dr:dQ9,ht:'<p>Advanced WAEC question types on arms of government: (1) "Examine the functions of the National Assembly in Nigeria" — legislative functions + oversight + budget approval + impeachment power + specific examples. (2) "Discuss the importance of separation of powers" — prevents tyranny; promotes accountability; protects rights; enables rule of law; Montesquieu; Nigerian Constitution. (3) "Compare the presidential and parliamentary systems" — election method; removal process; executive-legislature relationship; examples (Nigeria/UK). (4) "Assess judicial independence in Nigeria" — safeguards + challenges + NJC + electoral tribunals.</p>'},
{lb:'The budget process in detail',dr:dQ9,ht:'<p>The budget process (Nigeria): (1) Executive (Ministry of Finance) prepares estimates in consultation with MDAs (Ministries, Departments and Agencies). (2) President presents the Appropriation Bill to the National Assembly (usually in October/November). (3) National Assembly debates, reviews and may amend the bill (Senate and HoR committees). (4) Both chambers pass an agreed version. (5) President assents to the bill (it becomes the Appropriation Act). (6) Executive implements the budget. (7) Auditor-General audits expenditure. (8) National Assembly reviews audit reports in oversight. This full cycle illustrates executive-legislative interaction.</p>'},
{lb:'Electoral system and the legislature',dr:dQ1,ht:'<p>How legislators are elected affects the nature of the legislature: <b>First-Past-the-Post (FPTP)</b> — the candidate with the most votes wins, even without a majority (Nigeria, UK). Simple and decisive; can produce a legislature that does not reflect the overall vote distribution. <b>Proportional Representation (PR)</b> — seats allocated roughly in proportion to votes received (many European countries). More representative; may produce coalition governments. <b>Mixed systems</b> — combine both (Germany). Nigeria uses FPTP for all elections (including NASS). Elected legislators represent both their constituency and the national interest.</p>'},
{lb:'The role of committees',dr:dQ2,ht:'<p>Legislative committees are essential tools: (1) <b>Standing committees</b> — permanent committees for each sector (finance, defence, education, etc.). (2) <b>Ad hoc committees</b> — created for specific investigations or tasks. (3) Functions: scrutinise bills in detail; conduct oversight hearings of executive agencies; investigate corruption and misconduct; approve appointments and treaty ratifications (Senate). In Nigeria, committees are often where the detailed legislative work happens. Committee hearings can expose executive misconduct. However, committees are also sometimes accused of using hearings for personal gain (the "oversight hearing" corruption problem).</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'The Nigerian President presents the annual budget (Appropriation Bill) to the National Assembly usually in:',o:['January, at the start of the new year','March, at the start of the financial year','October/November, for the following year','July, at mid-year'],a:3,w:'The Nigerian President typically presents the Appropriation Bill to the National Assembly in October or November for the following financial year. The Nigerian financial year runs January to December.'},{q:'First-Past-the-Post (FPTP) means:',o:['The candidate who reaches 50%+1 of votes first wins','The candidate with the most votes wins, even without an absolute majority','Votes are counted proportionally and seats allocated accordingly','The first candidate nominated by a party automatically wins the primary'],a:2,w:'FPTP (also called simple plurality) — the candidate with the most votes wins, even if they do not have a majority (over 50%). Nigeria uses FPTP for elections to the National Assembly.'},{q:'Standing committees of the National Assembly are:',o:['Committees created only for specific investigations and then dissolved','Permanent committees that handle legislation and oversight in specific sectors','Committees of the whole house when all members consider a bill together','Committees made up of senators and representatives from both chambers'],a:2,w:'Standing committees are permanent committees (e.g. Finance Committee, Education Committee) that exist continuously to scrutinise bills and conduct oversight in their assigned sectors.'},{q:'When the President declines to sign (assents to) an Appropriation Bill passed by the National Assembly, this is called:',o:['Judicial review','Impeachment','A presidential veto (withholding assent)','A constitutional crisis'],a:3,w:'When the President declines to sign a bill into law, this is a presidential veto (withholding assent). The National Assembly can override the veto with a two-thirds majority of both chambers.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov \u2022 ELE',ti:'Mixed Questions — Arms of Government',su:'Integrated revision across all GOV-ELE-06 topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Three arms: Legislature (makes laws; Nigeria: Senate 109 + HoR 360; bicameral; approves budget; oversight; impeachment). Executive (implements laws; Nigeria: President + VP + Cabinet + Civil Service; presidential; prepares budget; appoints; commander-in-chief). Judiciary (interprets laws; Nigeria: Supreme Court hierarchy; judicial review; judicial independence; electoral tribunals). Montesquieu (1748) theorised separation. Checks and balances — each arm oversees others. Presidential (Nigeria/USA) vs parliamentary (UK). Bicameral vs unicameral. Civil service = permanent, neutral bureaucracy.</p>'},
{lb:'Exam revision grid',dr:dQ10,ht:'<p>Quick-reference grid: Legislature: who? elected members; what? make laws, approve budget, oversight, impeachment, confirm appointments. Executive: who? president/cabinet/civil service; what? implement laws, foreign policy, prepare budget, appoint, commander-in-chief. Judiciary: who? appointed judges; what? interpret laws, settle disputes, judicial review, protect rights, guard constitution. Key checks: Legislature — approves budget, impeaches, confirms. Executive — vetoes, appoints, pardons. Judiciary — judicial review, rules on constitutionality. Montesquieu 1748. Nigeria: NASS, President, Supreme Court.</p>'},
{lb:'Application questions',dr:dQ9,ht:'<p>Application: Scenario 1 — The President issues a decree banning all opposition parties. Which arm can challenge this and how? → Judiciary: declare it unconstitutional (judicial review). Scenario 2 — The President\'s minister is accused of stealing public funds. What action can the legislature take? → Oversight hearing; can recommend impeachment or prosecution. Scenario 3 — The National Assembly passes a bill that takes away citizens\' fundamental rights. What remedy exists? → Judicial review — Supreme Court can declare it void. These scenarios test understanding of how the arms interact in practice.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final revision: Know all three arms with functions, Nigerian structures and examples. Know Montesquieu 1748. Know bicameral (Senate+HoR) vs unicameral. Know judicial review and impeachment. Know presidential (Nigeria) vs parliamentary (UK) systems. Know checks and balances with specific examples in both directions. Know the budget process (executive prepares; legislature approves). Know judicial independence safeguards (NJC; financial security; security of tenure). For essays: define each term → give structure → functions → checks and balances → Nigeria examples → evaluation → conclusion.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'If the Supreme Court declares a presidential executive order to be unconstitutional, this illustrates:',o:['The legislature checking the executive','The judiciary checking the executive through judicial review','The executive checking itself through internal review','The legislature checking the judiciary'],a:2,w:'The Supreme Court declaring a presidential executive order unconstitutional is the JUDICIARY checking the EXECUTIVE through judicial review — a key example of checks and balances in action.'},{q:'Nigeria\'s Senate has 109 members because:',o:['There are 109 local government areas in Nigeria','There are 36 states × 3 senators each = 108, plus 1 senator for the FCT','The 1999 Constitution specified 109 as a round number','There is one senator per federal constituency'],a:2,w:'36 states × 3 senators = 108, plus 1 senator for the Federal Capital Territory (Abuja) = 109 senators total in Nigeria\'s Senate.'},{q:'Which is the correct description of Nigeria\'s system of government?',o:['Parliamentary — the Prime Minister comes from and is responsible to the National Assembly','Unicameral presidential — President elected separately; one-chamber legislature','Bicameral presidential — President elected separately; two-chamber legislature (Senate + HoR)','Hybrid — President and Prime Minister share executive power'],a:3,w:'Nigeria has a BICAMERAL PRESIDENTIAL system: the President is elected separately from the legislature (presidential), and the legislature has two chambers — Senate and House of Representatives (bicameral).'},{q:'What is the main difference between the presidential and parliamentary systems in terms of executive-legislative relationship?',o:['In both systems, the executive must win a vote of confidence in the legislature to govern','In presidential systems, the executive is separately elected and not removable by legislature vote; in parliamentary systems, the executive comes from and is accountable to the legislature','In presidential systems, the PM leads; in parliamentary systems, the President leads','There is no significant difference — both require majority legislative support to govern'],a:2,w:'Presidential (Nigeria/USA): executive separately elected, can\'t be removed by legislature vote (only impeachment for misconduct). Parliamentary (UK): PM from legislature, must maintain majority confidence — can be removed by vote of no confidence.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
