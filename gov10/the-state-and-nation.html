<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The State and Nation — Key Concepts',ACC,12,'middle',true));
[['Concept','Definition','Example'],['State','Political unit: territory, population, government, sovereignty','Nigeria as a state'],['Nation','Group sharing culture, language, history, identity','Igbo, Yoruba, Hausa as nations'],['Nation-state','When national and state boundaries coincide','Japan, Somalia (approx.)'],['Multinational state','One state with many nations','Nigeria (250+ ethnic groups)'],['Nationalism','Strong identification with one\'s nation','Nigerian nationalism pre-1960'],['Nationality','Legal membership of a state','Nigerian nationality / citizenship'],['Stateless nation','A nation without its own state','Kurds (Iraq/Turkey/Syria/Iran)']].forEach(function(r,i){if(i<=p){o.push(R(10,22+i*24,460,20,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(70,34+i*24,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(220,34+i*24,r[1],'#444',7,'middle',false));o.push(T(400,34+i*24,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'State vs Nation — Comparison',ACC,12,'middle',true));
[['Basis','State','Nation'],['Definition','Political/legal entity','Cultural/ethnic community'],['Requirements','Territory, population, govt, sovereignty','Shared history, culture, language'],['Permanence','More fixed (territory/borders)','Can exist without territory'],['Legal status','Has international legal standing','May or may not have a state'],['Example','Nigeria (as a sovereign state)','Yoruba (a nation within Nigeria'],['Key diff','Defined by law and borders','Defined by identity and belonging']].forEach(function(r,i){if(i<=p){o.push(R(10,24+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(70,40+i*32,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(230,40+i*32,r[1],'#444',8,'middle',false));o.push(T(380,40+i*32,r[2],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}

function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'State and Nation — Summary',ACC,13,'middle',true));
[['State','Political unit; territory, population, govt, sovereignty'],['Nation','Cultural unit; shared identity, history, language'],['Nation-state','State and nation coincide (Japan, Iceland)'],['Multinational state','One state, many nations (Nigeria, India, UK)'],['Nationalism','Pride in and loyalty to one\'s nation/state'],['Nationality','Legal bond between person and state'],['Nigeria','Multinational state — 250+ ethnic groups / nations']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,9,'middle',true));o.push(T(310,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Government \u2022 Elements',ti:'What is a State?',su:'Define a state and identify its four essential elements.',steps:[
  {lb:'Definition of a state',dr:dQ1,ht:'<p>A <b>state</b> is a politically organised community occupying a definite territory, with a permanent population, an effective government, and sovereignty (supreme authority within its borders). The Montevideo Convention on the Rights and Duties of States (1933) codified four essential elements: population, territory, government and sovereignty. The state is a legal and political entity — it has international standing and can enter into treaties, declare war and conduct diplomacy.</p>'},
  {lb:'Population',dr:dQ1,ht:'<p><b>Population</b> is the first element of a state — the people who inhabit and owe allegiance to the state. There is no minimum or maximum population requirement — Vatican City has about 800 people; China has 1.4 billion. The population must be permanent (not nomadic groups that move across borders). Nigerian citizens form the population of the Nigerian state. Population size affects a state\'s power, economic capacity and international influence.</p>'},
  {lb:'Territory',dr:dQ1,ht:'<p><b>Territory</b> is the defined geographical area over which the state exercises authority — including land, internal waters, territorial sea (up to 12 nautical miles) and airspace. Borders must be sufficiently defined (some disputed border states still qualify as states). Nigeria\'s territory is approximately 923,768 km². Territory disputes (e.g. Bakassi Peninsula between Nigeria and Cameroon — resolved by ICJ 2002) can cause conflict between states.</p>'},
  {lb:'Government and sovereignty',dr:dQ1,ht:'<p><b>Government</b>: organised authority to make and enforce law within the territory. <b>Sovereignty</b>: the state\'s supreme authority — internally (no higher authority within the territory) and externally (independence from foreign control). A state without effective government (a "failed state" like Somalia) struggles to maintain sovereignty in practice. Sovereignty is the defining feature that distinguishes a state from other organised communities (cities, ethnic groups, companies).</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which international convention (1933) codified the four elements of a state?',o:['The UN Charter','The Geneva Convention','The Montevideo Convention','The Vienna Convention'],a:3,w:'The Montevideo Convention on the Rights and Duties of States (1933) listed population, territory, government and sovereignty as the four elements.'},{q:'Nigeria\'s territory approximately covers how many square kilometres?',o:['500,000 km²','923,768 km²','1.2 million km²','250,000 km²'],a:2,w:'Nigeria covers approximately 923,768 km² — making it the 32nd largest country in the world.'},{q:'A "failed state" lacks effective:',o:['Population','Territory','Government and sovereignty in practice','A constitution'],a:3,w:'Failed states (like Somalia) have territory and population but lack effective government and cannot exercise real sovereignty.'},{q:'The territorial sea over which a state has full sovereignty extends up to:',o:['3 nautical miles','12 nautical miles','200 nautical miles','50 nautical miles'],a:2,w:'Under UNCLOS, a state has full sovereignty over its territorial sea extending 12 nautical miles from its coast.'},{q:'Which of these is NOT one of the four Montevideo elements of a state?',o:['Population','Territory','Recognition by other states','Government'],a:3,w:'Recognition by other states is not one of the four Montevideo elements (population, territory, government, sovereignty).'},{q:'What is Nigeria\'s approximate population rank in Africa?',o:['The most populous country in Africa','The second most populous','The least populous','Roughly average'],a:1,w:'Nigeria is the most populous country in Africa.'},{q:'Beyond the territorial sea, what zone extends up to 200 nautical miles giving a state economic rights?',o:['The Exclusive Economic Zone (EEZ)','The continental shelf only','The high seas','The contiguous zone only'],a:1,w:'The Exclusive Economic Zone (EEZ) extends up to 200 nautical miles, granting economic rights.'},{q:'Which of the following is an example of a "failed state" scenario?',o:['A government unable to control its territory or provide basic services','A wealthy country with stable institutions','A monarchy with strong central control','A federal state with many regions'],a:1,w:'A failed state cannot effectively control its territory or provide basic services to its population.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government \u2022 Elements',ti:'What is a Nation?',su:'Define a nation and distinguish it from a state.',steps:[
  {lb:'Definition of a nation',dr:dQ2,ht:'<p>A <b>nation</b> is a large group of people who share a common identity — typically including a common language, culture, history, traditions, and a sense of belonging together. Unlike a state, a nation need not have its own territory or government. Nations are defined by subjective identity — people feel they belong to the same nation. Examples: the Yoruba nation, the Igbo nation, the Hausa-Fulani nation (all within Nigeria), the Jewish nation (existed without a state for centuries).</p>'},
  {lb:'Nation vs state',dr:dQ2,ht:'<p>Key differences: (1) State = legal/political unit; nation = cultural/ethnic community. (2) State requires territory; nation can exist without territory (e.g. Jews before 1948; Kurds today). (3) State has international legal standing; nations may not. (4) One state may contain many nations (multinational state — e.g. Nigeria, India, UK). (5) One nation may span several states (e.g. the Arab nation spans 22 states). (6) State is defined by law; nation is defined by identity and belonging.</p>'},
  {lb:'Nation-state',dr:dQ2,ht:'<p>A <b>nation-state</b> is the ideal where state and nation boundaries coincide — one nation, one state. Examples: Japan (largely ethnically homogeneous), Iceland, Portugal. In practice, very few true nation-states exist — most states are multinational. After World War I (Versailles, 1919), President Wilson\'s principle of "national self-determination" tried to draw borders along national lines in Europe — but with limited success and often creating new minority problems.</p>'},
  {lb:'Multinational states and stateless nations',dr:dQ2,ht:'<p><b>Multinational state</b>: one state containing multiple nations. Nigeria (250+ ethnic groups), India, Russia, UK, South Africa. Challenge: managing national differences to prevent ethnic conflict and separatism. <b>Stateless nation</b>: a nation without its own state. The Kurds (35-40 million people spread across Turkey, Iraq, Syria, Iran) are the world\'s largest stateless nation. Palestine is a partially recognised state. Managing the claims of stateless nations is a major challenge in international relations.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What primarily defines a nation (as opposed to a state)?',o:['A defined territory with recognised borders','A government with sovereignty','Shared identity, culture, language and history','International legal recognition'],a:3,w:'A nation is defined by shared identity, culture, language and history — subjective bonds of belonging, not legal or territorial criteria.'},{q:'The Yoruba, Igbo and Hausa-Fulani are best described as:',o:['Separate states','Nations within the multinational state of Nigeria','Ethnic minorities without political significance','Tribes without national consciousness'],a:2,w:'These are nations (large groups with shared identity) within Nigeria — a multinational state containing 250+ ethnic groups.'},{q:'Which is the world\'s largest stateless nation today?',o:['Palestinians','Tibetans','Kurds','Rohingya'],a:3,w:'The Kurds (35-40 million people) spread across Turkey, Iraq, Syria and Iran are generally considered the world\'s largest stateless nation.'},{q:'President Wilson\'s post-WWI principle that each nation should have its own state is called:',o:['Sovereign equality','National self-determination','Federal character','Popular sovereignty'],a:2,w:'National self-determination — Wilson\'s principle that each nation should have the right to determine its own political status, including having its own state.'},{q:'What is a "multinational state"?',o:['A single state containing more than one nation/ethnic group','A state with multiple presidents','A group of states sharing one currency','A state recognised by many nations'],a:1,w:'A multinational state contains more than one nation or ethnic group within its borders.'},{q:'Which factor is NOT typically used to define a nation?',o:['Shared language','Shared culture','A defined system of international recognition','Shared history'],a:3,w:'International recognition defines statehood, not nationhood, which relies on shared culture, language and history.'},{q:'What common feature distinguishes a "nation-state" from a multinational state?',o:['A nation-state has one dominant nation matching its political borders','A nation-state has no government','A nation-state has no borders','A nation-state is always small'],a:1,w:'A nation-state has one dominant nation whose identity matches the political borders of the state.'},{q:'Which region is often cited alongside Kurdistan as home to a large stateless nation?',o:['Palestine','Scotland','Quebec','Catalonia'],a:1,w:'Palestinians are frequently cited alongside Kurds as a major stateless nation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government \u2022 Elements',ti:'Nationalism',su:'Define nationalism and explain its forms and effects.',steps:[
  {lb:'Definition of nationalism',dr:dQ3,ht:'<p><b>Nationalism</b> is the strong identification of a group of individuals with a nation — the belief that the nation is the primary unit of political organisation, and that each nation deserves its own government and freedom from external control. Nationalism has two faces: (1) <b>Positive</b> — anti-colonial nationalism that drives independence movements (West Africa, 1940s-60s). (2) <b>Negative</b> — ethnic nationalism, chauvinism, that leads to conflict and exclusion (e.g. Nazi Germany, Rwandan genocide).</p>'},
  {lb:'Types of nationalism',dr:dQ3,ht:'<p>(1) <b>Civic nationalism</b>: based on shared citizenship and values, not ethnicity (French model). (2) <b>Ethnic nationalism</b>: based on shared ethnic/racial identity (German model — dangerous when exclusionary). (3) <b>Cultural nationalism</b>: based on shared language, culture, religion. (4) <b>Anti-colonial nationalism</b>: resistance to foreign rule — Nigeria\'s pre-independence movement (NCNC, AG, NPC). (5) <b>Pan-nationalism</b>: nationalism beyond the state — Pan-Africanism (Nkrumah) or Pan-Arabism (Nasser).</p>'},
  {lb:'Nigerian nationalism',dr:dQ3,ht:'<p>Nigerian nationalism emerged in the 1920s-1950s as Nigerians united to end British colonial rule. Key figures: Herbert Macaulay (the "father of Nigerian nationalism" — founded NNDP 1923), Nnamdi Azikiwe (NCNC), Obafemi Awolowo (AG), Ahmadu Bello (NPC). They used newspapers, political parties, strikes and negotiations to press for independence. Nigeria achieved independence on 1 October 1960. After independence, ethnic/regional nationalism often overshadowed national unity — a challenge still faced today.</p>'},
  {lb:'Effects of nationalism',dr:dQ3,ht:'<p>Positive effects: Independence from colonial rule; national unity; cultural pride; self-governance; international recognition. Negative effects: Ethnic conflict; separatism; xenophobia; war (both World Wars had nationalist roots); genocide (Rwanda, Bosnia). In Nigeria: nationalism united Nigerians pre-independence but ethnic nationalism has since caused: civil war (1967-70), political instability, resource conflicts (Niger Delta), and religious/ethnic tensions. Good governance must channel nationalism positively.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'Who is known as the "father of Nigerian nationalism"?',o:['Nnamdi Azikiwe','Obafemi Awolowo','Herbert Macaulay','Ahmadu Bello'],a:3,w:'Herbert Macaulay (1864-1946) founded the Nigerian National Democratic Party (NNDP) in 1923 and is regarded as the father of Nigerian nationalism.'},{q:'Anti-colonial nationalism in West Africa was primarily aimed at:',o:['Promoting trade with Britain','Ending foreign (colonial) rule and achieving self-governance','Creating ethnic states for each tribe','Promoting European education'],a:2,w:'Anti-colonial nationalism was the drive to end British/French/Portuguese colonial rule and achieve self-determination and independence.'},{q:'Pan-Africanism, associated with Ghana\'s Kwame Nkrumah, is an example of:',o:['Civic nationalism','Ethnic nationalism','Pan-nationalism (nationalism beyond one state)','Anti-colonial nationalism only'],a:3,w:'Pan-Africanism is pan-nationalism — promoting the unity and solidarity of all African peoples and states, transcending individual state boundaries.'},{q:'Which NEGATIVE effect of nationalism contributed to both World War I and World War II?',o:['Civic nationalism','National self-determination','Extreme ethnic nationalism and chauvinism','Pan-Africanism'],a:3,w:'Extreme ethnic nationalism (especially in Germany — Nazism; and competing nationalisms in WWI Europe) was a major cause of both world wars.'},{q:'What was a major goal of the National Council of Nigeria and the Cameroons (NCNC), founded in 1944?',o:['To promote British interests','To campaign for Nigerian self-government against colonial rule','To create separate ethnic states','To support continued colonial rule'],a:2,w:'The NCNC campaigned for Nigerian self-government and unity against colonial rule.'},{q:'Which Nigerian nationalist leader founded the Action Group (AG) political party?',o:['Obafemi Awolowo','Nnamdi Azikiwe','Ahmadu Bello','Herbert Macaulay'],a:1,w:'Obafemi Awolowo founded the Action Group, a major Nigerian nationalist political party.'},{q:'What distinguishes "civic nationalism" from "ethnic nationalism"?',o:['Civic nationalism is based on shared citizenship and values, not ethnicity','Civic nationalism excludes minorities','Ethnic nationalism is always peaceful','They are identical concepts'],a:1,w:'Civic nationalism is based on shared citizenship and civic values rather than ethnic identity.'},{q:'What was one major achievement resulting from West African anti-colonial nationalism?',o:['Independence of countries such as Ghana and Nigeria','Permanent continuation of colonial rule','Creation of new European colonies','Abolition of all African borders'],a:1,w:'Anti-colonial nationalism led to the independence of countries such as Ghana (1957) and Nigeria (1960).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government \u2022 Elements',ti:'Nationality and Citizenship',su:'Distinguish between nationality and citizenship.',steps:[
  {lb:'Nationality defined',dr:dQ4,ht:'<p><b>Nationality</b> is the legal bond between an individual and a state that confers mutual rights and duties. Nationality determines a person\'s legal status in international law — which country\'s diplomatic protection you are entitled to, which passport you carry, and the international legal obligations you owe. Nationality is not the same as ethnicity — you can be of Yoruba ethnicity but hold Nigerian, British or American nationality. Nationality is determined by: birth (jus soli — place of birth; jus sanguinis — parentage), naturalisation, or marriage.</p>'},
  {lb:'Citizenship defined',dr:dQ4,ht:'<p><b>Citizenship</b> is the full membership of a political community — with the right to participate in its governance. Citizens enjoy rights: vote, stand for election, hold public office, access to social services. They owe duties: pay taxes, obey laws, serve in the military if conscripted, loyalty to the state. In many countries, nationality = citizenship. In some: non-citizen nationals (e.g. US nationals in territories like Puerto Rico) have nationality but limited citizenship rights.</p>'},
  {lb:'How nationality is acquired in Nigeria',dr:dQ4,ht:'<p>Under Nigeria\'s 1999 Constitution (Section 25-32): <b>By birth</b> (s.25): born in Nigeria when at least one parent is a citizen; or born outside Nigeria to a Nigerian citizen father. <b>By registration</b> (s.26): foreign woman married to Nigerian citizen; person of Nigerian descent resident for 15 years. <b>By naturalisation</b> (s.27): resident for 15 of preceding 20 years; good character; adequate knowledge of Nigerian language/customs. <b>Renunciation and deprivation</b> also possible.</p>'},
  {lb:'Rights and duties of citizens',dr:dQ4,ht:'<p><b>Rights</b> (Chapter IV, 1999 Constitution): Right to life (s.33); dignity (s.34); personal liberty (s.35); fair hearing (s.36); private/family life (s.37); freedom of thought, conscience, religion (s.38); expression and press (s.39); peaceful assembly (s.40); movement (s.41); freedom from discrimination (s.42). <b>Duties</b>: pay taxes, obey laws, defend the country, respect others\' rights, vote, protect public property. WAEC regularly tests rights and duties of citizens.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What is the legal term for acquiring nationality by place of birth?',o:['Jus sanguinis','Jus soli','Naturalisation','Registration'],a:2,w:'Jus soli (Latin: "right of soil") — acquiring nationality by being born in a country\'s territory.'},{q:'Under Nigeria\'s 1999 Constitution, which section covers citizenship by birth?',o:['Section 14','Section 25','Section 33','Section 42'],a:2,w:'Section 25 of the 1999 Constitution deals with citizenship by birth in Nigeria.'},{q:'Citizenship differs from nationality primarily in that citizenship includes:',o:['Holding a passport','International diplomatic protection','The right to participate in governance (vote, hold office)','The right to work anywhere'],a:3,w:'Citizenship includes full political membership — voting, standing for election, holding public office — beyond just legal nationality.'},{q:'Which chapter of Nigeria\'s 1999 Constitution guarantees fundamental human rights?',o:['Chapter I','Chapter II','Chapter III','Chapter IV'],a:4,w:'Chapter IV of the 1999 Constitution (Sections 33-46) guarantees fundamental rights including life, dignity, liberty, fair hearing and freedom of expression.'},{q:'What is the legal term for acquiring citizenship through descent from a citizen parent?',o:['Jus sanguinis','Jus soli','Naturalisation','Registration'],a:1,w:'Jus sanguinis refers to acquiring citizenship through descent (bloodline) from a citizen parent.'},{q:'Under Nigerian law, can a Nigerian citizen legally hold dual citizenship?',o:['No, it is completely forbidden','Yes, in certain circumstances','Only if born abroad','Only military officers may'],a:2,w:'Nigerian law permits dual citizenship in certain circumstances, particularly for citizens by birth.'},{q:'What is "naturalisation"?',o:['The legal process by which a foreigner becomes a citizen','Citizenship by birthplace only','Citizenship inherited automatically','A type of international treaty'],a:1,w:'Naturalisation is the legal process by which a foreigner formally becomes a citizen of a country.'},{q:'Besides voting, what right does citizenship typically grant that mere residency does not?',o:['The right to hold public office and a national passport','The right to own any property','The right to unlimited travel visas','The right to avoid all taxation'],a:1,w:'Citizenship typically grants the right to hold public office and obtain a national passport, unlike mere residency.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government \u2022 Elements',ti:'Nigeria — A Multinational State',su:'Analyse Nigeria\'s character as a multinational state and the challenge of national unity.',steps:[
  {lb:'Nigeria\'s diversity',dr:dQ5,ht:'<p>Nigeria is one of the most diverse countries in the world: over 250 ethnic groups; 500+ languages; major religions — Islam (mainly North), Christianity (mainly South), ATR. The three largest groups: Hausa-Fulani (29%), Yoruba (21%), Igbo (18%) — together making up roughly 60% of the population. This diversity is both a strength (rich cultural heritage) and a challenge (ethnic competition, religious tension, regional imbalance).</p>'},
  {lb:'Challenges of a multinational state',dr:dQ5,ht:'<p>Key challenges Nigeria faces as a multinational state: (1) <b>Ethnic conflict</b> — communal clashes (Middle Belt, Niger Delta). (2) <b>Religious tension</b> — Muslim/Christian fault lines. (3) <b>Regional imbalance</b> — north vs south economic disparities. (4) <b>Separatism</b> — Biafra (1967-70 civil war), IPOB agitation. (5) <b>Resource distribution</b> — oil revenue sharing (derivation formula debates). (6) <b>Political exclusion</b> — zoning, federal character imperfectly applied.</p>'},
  {lb:'Mechanisms for managing diversity',dr:dQ5,ht:'<p>Nigeria uses these mechanisms to manage diversity: (1) <b>Federalism</b> — 36 states allowing regional self-governance. (2) <b>Federal character principle</b> — proportional representation in appointments. (3) <b>Quota system</b> — university admissions, civil service. (4) <b>Zoning</b> — presidential power rotation between North and South. (5) <b>NYSC</b> — National Youth Service Corps posts graduates to other regions to promote integration. (6) <b>National language</b> — English as official language avoids favouring one group.</p>'},
  {lb:'National unity and identity',dr:dQ5,ht:'<p>Building a sense of "Nigerian-ness" has been an ongoing project: National symbols — green-white-green flag, "Arise O Compatriots" anthem, coat of arms ("Unity and Faith, Peace and Progress"). National institutions — military, NYSC, federal universities. Public holidays (Oct 1 — Independence Day). Sports (Super Eagles, Super Falcons uniting the country). The challenge: foster national identity without suppressing legitimate ethnic/regional identities. Unity in diversity should be the goal.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'Approximately how many ethnic groups does Nigeria have?',o:['About 50','About 100','Over 250','Exactly 36'],a:3,w:'Nigeria has over 250 ethnic groups, making it one of the most ethnically diverse countries in the world.'},{q:'The Nigeria-Biafra civil war (1967-70) was caused by:',o:['A military coup against a civilian government','Ethnic/regional tensions leading to Igbo secession (Biafra)','A foreign invasion from Cameroon','A dispute over oil pricing with Western nations'],a:2,w:'The civil war arose from ethnic/political tensions following coups, pogroms against Igbos, and the declaration of the Republic of Biafra by Odumegwu Ojukwu.'},{q:'The National Youth Service Corps (NYSC) promotes national unity by:',o:['Teaching only English language skills','Training youth for the military','Posting graduates to states other than their home state to foster integration','Providing jobs for unemployed graduates'],a:3,w:'NYSC (established 1973) posts university graduates to serve in states outside their home region for one year, promoting inter-ethnic understanding.'},{q:'Nigeria\'s official language is English. This helps national unity because:',o:['English is spoken by all Nigerians from birth','It avoids giving political advantage to Hausa, Yoruba or Igbo over the others','The British insisted on it','It is easier to learn than Nigerian languages'],a:2,w:'Choosing English as the official language (rather than Hausa, Yoruba or Igbo) avoids favouring any major ethnic group, reducing linguistic political tensions.'},{q:'What is one benefit often cited for Nigeria\'s federal structure regarding ethnic diversity?',o:['It allows different ethnic groups some self-government within states','It abolishes all ethnic identities','It forces one language on everyone','It removes state governments entirely'],a:1,w:'Federalism allows different ethnic groups a degree of self-government within their own states.'},{q:'Which Nigerian region declared itself the Republic of Biafra in 1967?',o:['The Eastern Region','The Northern Region','The Western Region','The Mid-Western Region'],a:1,w:'The Eastern Region, dominated by the Igbo, declared itself the Republic of Biafra in 1967.'},{q:'What is a common strategy used by governments to manage ethnic diversity and prevent conflict?',o:['Power-sharing arrangements such as federal character','Banning all ethnic languages','Favouring one ethnic group permanently','Abolishing elections'],a:1,w:'Power-sharing arrangements like federal character help manage ethnic diversity and prevent conflict.'},{q:'Approximately how many major/dominant ethnic groups are often cited in Nigeria alongside numerous minorities?',o:['Two','Three','Five','Seven'],a:2,w:'Nigeria has three major/dominant ethnic groups (Hausa-Fulani, Yoruba, Igbo) alongside many minorities.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government \u2022 Elements',ti:'Recognition of States',su:'Explain international recognition and its importance.',steps:[
  {lb:'What is recognition?',dr:dQ6,ht:'<p><b>Recognition</b> is the formal acknowledgement by one state of the existence and legitimacy of another state (or government). It is a political act — not strictly required for statehood (sovereignty exists independently under Montevideo) — but practically essential for participation in international life. Recognition allows: diplomatic relations, treaty-making, membership in international organisations, trade agreements, and access to international financial institutions (IMF, World Bank).</p>'},
  {lb:'Constitutive vs declaratory theory',dr:dQ6,ht:'<p>Two theories of recognition: (1) <b>Constitutive theory</b>: a state only becomes a subject of international law when recognised by other states — recognition creates statehood. Problem: if one state recognises and another doesn\'t, what is the entity\'s status? (2) <b>Declaratory theory</b>: a state exists as soon as it meets the Montevideo criteria — recognition merely acknowledges an existing fact. Most modern international law supports the declaratory view. Palestine is recognised by 139 states but denied recognition by others.</p>'},
  {lb:'De jure vs de facto recognition',dr:dQ6,ht:'<p><b>De jure recognition</b>: formal, full, permanent recognition — the recognized state is acknowledged as the legitimate government. <b>De facto recognition</b>: practical acknowledgement that an entity controls territory, without full formal recognition. China was de facto recognised by many states while de jure recognition went to Taiwan (Republic of China) until 1971 when the UN switched. Taiwan is still not a UN member despite functioning effectively as a state.</p>'},
  {lb:'Effects of recognition',dr:dQ6,ht:'<p>Effects of recognition: (1) Diplomatic relations can be established (embassies). (2) Treaties can be signed. (3) Membership in international organisations (UN, AU, ECOWAS). (4) Access to international finance and aid. (5) Legal standing in international courts. Withdrawal of recognition (rare) is a powerful diplomatic tool. Non-recognition: Israel is not recognised by many Arab/Muslim states. Kosovo (declared independence 2008) is not recognised by about 90 states including Russia and China.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'Under the declaratory theory, a state becomes a subject of international law when:',o:['Other major powers formally recognise it','It joins the United Nations','It meets the Montevideo criteria (population, territory, govt, sovereignty)','It adopts a written constitution'],a:3,w:'Declaratory theory: statehood exists as soon as the Montevideo criteria are met — recognition merely acknowledges this fact.'},{q:'De facto recognition means:',o:['Full, permanent, formal recognition of a state','Practical acknowledgement that an entity controls territory, without full formal recognition','Recognition of a government in exile','Recognition granted by the United Nations'],a:2,w:'De facto recognition is practical acknowledgement of control — stopping short of full formal (de jure) recognition.'},{q:'Palestine is recognised by approximately 139 states. Why does it NOT have full UN membership?',o:['It has not applied for membership','The US and other Security Council members have vetoed or opposed full membership','It lacks a permanent population','Its territory is too small for UN membership'],a:2,w:'Palestine is recognised by many states but the US (as a Security Council permanent member with veto power) has blocked full UN membership.'},{q:'In 1971, the United Nations transferred China\'s seat from the Republic of China (Taiwan) to the People\'s Republic of China. This is an example of:',o:['Creating a new state','Switching de jure recognition from one government to another','Withdrawing recognition entirely','Applying the constitutive theory'],a:2,w:'The UN transferred de jure recognition of the legitimate Chinese government from Taiwan (ROC) to Beijing (PRC) in 1971 via Resolution 2758.'},{q:'What is the "constitutive theory" of statehood, in contrast to the declaratory theory?',o:['A state only exists once other states formally recognise it','A state exists automatically once it meets objective criteria','Only the UN can create states','Recognition is irrelevant to statehood'],a:1,w:'The constitutive theory holds that a state only exists once other states formally recognise it.'},{q:'Which international body most commonly grants formal (de jure) recognition to new states through membership?',o:['The United Nations','The African Union only','NATO','The World Bank'],a:1,w:'UN membership is a common form of formal, de jure recognition of statehood.'},{q:'What does "de jure" recognition mean, as opposed to "de facto"?',o:['Full, formal, legal recognition','Temporary, practical acknowledgement only','No recognition at all','Recognition granted only by neighbouring states'],a:1,w:'De jure recognition is full, formal and legal, unlike the merely practical de facto recognition.'},{q:'Why might a state choose only to give "de facto" recognition to another entity?',o:['To acknowledge practical control without endorsing full legitimacy','Because it is required by international law','Because the entity has no government','Because it wants to invade the territory'],a:1,w:'De facto recognition acknowledges practical control without granting full legal endorsement.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government \u2022 Elements',ti:'Sovereignty — Internal and External',su:'Analyse sovereignty and its challenges in the modern world.',steps:[
  {lb:'Internal sovereignty',dr:dQ7,ht:'<p><b>Internal sovereignty</b> is the state\'s supreme authority over all persons, groups and organisations within its territory. No individual, corporation, religious group or ethnic nationality can override the state\'s legitimate laws. In Nigeria: the federal government has internal sovereignty — it can ban organisations (as it banned IPOB in 2017), enforce tax laws, operate courts, and use force to maintain order. Internal sovereignty can be challenged by: insurgency (Boko Haram), separatism (IPOB), organised crime, and religious extremism.</p>'},
  {lb:'External sovereignty',dr:dQ7,ht:'<p><b>External sovereignty</b> is the state\'s independence from foreign control — it is free to make its own laws, elect its own leaders, conduct its own foreign policy. Under the UN Charter (Article 2), all member states are sovereign equals regardless of size. In practice: powerful states exert influence over weaker ones (through economic pressure, sanctions, military power). Nigeria\'s external sovereignty has been challenged by: IMF structural adjustment conditions (1980s-90s), Western pressure on human rights, and oil multinationals\' influence.</p>'},
  {lb:'Sovereignty in the modern world',dr:dQ7,ht:'<p>Sovereignty is increasingly constrained in the modern world: (1) <b>Globalisation</b>: economic interdependence limits policy choices. (2) <b>International law</b>: states are bound by treaties they sign (WTO rules, human rights conventions). (3) <b>International organisations</b>: UN, WTO, IMF, AU — all impose requirements on members. (4) <b>Humanitarian intervention</b>: "Responsibility to Protect" (R2P) doctrine allows intervention in states that commit atrocities against their own citizens. (5) <b>Regional integration</b>: ECOWAS, EU — member states pool aspects of sovereignty.</p>'},
  {lb:'Challenges to Nigerian sovereignty',dr:dQ7,ht:'<p>Nigeria\'s sovereignty faces these challenges: (1) <b>Insurgency</b>: Boko Haram/ISWAP controls areas in the North-East. (2) <b>Separatist agitation</b>: IPOB agitates for Biafra independence. (3) <b>Foreign economic pressure</b>: debt conditionality, sanctions. (4) <b>Cross-border crime</b>: arms trafficking, herder-farmer conflicts with cross-border dimensions. (5) <b>ECOWAS obligations</b>: free movement of persons protocol limits border control. Understanding these challenges is important for WAEC essays on sovereignty and national security.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'UN Charter Article 2 establishes the principle that all member states are:',o:['Subject to Security Council decisions at all times','Sovereign equals regardless of size','Required to contribute troops to UN peacekeeping','Under the authority of the Secretary-General'],a:2,w:'UN Charter Article 2(1) — "The Organisation is based on the principle of the sovereign equality of all its Members."'},{q:'The "Responsibility to Protect" (R2P) doctrine challenges traditional sovereignty by allowing:',o:['States to invade neighbours for economic reasons','International intervention when a state commits mass atrocities against its people','The UN to take over governments of small states','Regional organisations to override the UN Security Council'],a:2,w:'R2P (adopted by UN World Summit, 2005) holds that sovereignty is not absolute — the international community may intervene to protect populations from genocide, war crimes, ethnic cleansing and crimes against humanity.'},{q:'Nigeria\'s government banned IPOB in 2017 under which power?',o:['External sovereignty','Internal sovereignty — supreme authority over groups within its territory','Federal character principle','ECOWAS security protocol'],a:2,w:'Banning IPOB was an exercise of internal sovereignty — the state\'s supreme authority over organisations operating within its territory.'},{q:'IMF structural adjustment conditions in Nigeria (1980s-90s) are an example of:',o:['Strengthening Nigerian sovereignty','A challenge to external sovereignty through economic conditionality','Internal sovereignty being exercised','Nigeria voluntarily choosing economic reform'],a:2,w:'SAP conditions attached to IMF loans constrained Nigeria\'s policy choices — a challenge to external sovereignty through economic conditionality.'},{q:'What is "external sovereignty"?',o:['A state\'s independence and equality among other states','A state\'s control over its own citizens only','A state\'s control over its economy only','A type of internal law'],a:1,w:'External sovereignty refers to a state\'s independence and equality among other states in the international system.'},{q:'Which international body is primarily responsible for authorising R2P interventions?',o:['The UN Security Council','The International Court of Justice','The African Union alone','NATO alone'],a:1,w:'The UN Security Council authorises Responsibility to Protect (R2P) interventions.'},{q:'What is one criticism often raised against the Responsibility to Protect (R2P) doctrine?',o:['It can justify unwanted foreign intervention in internal affairs','It always prevents war','It has never been invoked','It only applies to economic issues'],a:1,w:'Critics argue R2P can be used to justify unwanted foreign intervention in a state\'s internal affairs.'},{q:'How can international trade agreements affect a state\'s sovereignty?',o:['They can limit a state\'s freedom to set its own economic policies','They always increase sovereignty','They have no effect on sovereignty','They only affect military policy'],a:1,w:'Trade agreements and economic conditionality can limit a state\'s freedom over its own economic policy.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government \u2022 Elements',ti:'Nigeria\'s Path to Statehood',su:'Trace Nigeria\'s emergence as a state and nation.',steps:[
  {lb:'Pre-colonial political units',dr:dQ8,ht:'<p>Before British colonisation, the area now called Nigeria contained diverse political units: Oyo Empire (Yoruba), Benin Kingdom (Edo), Sokoto Caliphate (Hausa-Fulani), Igbo republican communities, Kanuri Borno Empire. These were separate states/nations — not one political unit. Some were centralised monarchies; others were decentralised republics (Igbo). British colonisation imposed a single political boundary over this diversity — the origin of Nigeria\'s "national question."</p>'},
  {lb:'Amalgamation 1914',dr:dQ8,ht:'<p>On 1 January 1914, Lord Frederick Lugard amalgamated the Colony and Protectorate of Southern Nigeria with the Protectorate of Northern Nigeria into the "Colony and Protectorate of Nigeria." This was primarily for administrative convenience and economic efficiency — not based on cultural or national coherence. Lady Flora Shaw (later Lugard) coined the name "Nigeria" in 1897. The amalgamation is often called "a mistake" by critics — it joined peoples with very different political systems and cultures without their consent.</p>'},
  {lb:'Independence 1960',dr:dQ8,ht:'<p>Nigeria achieved independence from Britain on 1 October 1960, becoming a sovereign state within the Commonwealth with a parliamentary (Westminster) system. The first Prime Minister: Tafawa Balewa. The first Governor-General: Nnamdi Azikiwe (became first President when Nigeria became a republic on 1 October 1963). Nigeria adopted the 1960 Constitution (independence) and then the 1963 Republican Constitution, which replaced the Queen with a President as head of state.</p>'},
  {lb:'Building the Nigerian state',dr:dQ8,ht:'<p>Post-independence Nigeria has been building its statehood through: (1) Multiple constitutions (1960, 1963, 1979, 1999). (2) Federal structure evolving from 3 regions → 4 → 12 states (1967) → 19 → 21 → 30 → 36 states (1996). (3) Military and civilian governments alternating. (4) Surviving the civil war (1967-70). (5) Building national institutions (military, INEC, judiciary, EFCC). (6) Economic development (oil discovery 1956, OPEC membership). Nigeria remains a work-in-progress as a nation-building project.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'Who amalgamated Northern and Southern Nigeria in 1914?',o:['Lord Macpherson','Lord Lugard','Lord Richards','Lord Clifford'],a:2,w:'Lord Frederick Lugard amalgamated the Colony of Southern Nigeria with the Protectorate of Northern Nigeria on 1 January 1914.'},{q:'Who coined the name "Nigeria"?',o:['Lord Lugard','Nnamdi Azikiwe','Lady Flora Shaw (later Lugard)','Herbert Macaulay'],a:3,w:'Lady Flora Shaw (a journalist who later married Lord Lugard) coined the name "Nigeria" in an 1897 article in The Times of London.'},{q:'Nigeria became a republic (replacing the Queen with a President) on:',o:['1 October 1960','1 October 1963','29 May 1999','15 January 1966'],a:2,w:'1 October 1963 — Nigeria became a republic under the 1963 Constitution, with Nnamdi Azikiwe as the first President.'},{q:'How many states does Nigeria currently have?',o:['19','30','36','42'],a:3,w:'Nigeria currently has 36 states plus the Federal Capital Territory (FCT, Abuja), created through several state creation exercises since 1967.'},{q:'What was Nigeria\'s status between 1960 and 1963, before becoming a republic?',o:['A fully independent republic','An independent state still recognising the British monarch as head of state','A British colony','A French protectorate'],a:1,w:'Between 1960 and 1963, Nigeria was independent but still recognised the British monarch as head of state.'},{q:'What event took place in Nigeria on 1 October 1960?',o:['Nigeria gained independence from British colonial rule','Nigeria became a republic','Nigeria adopted a new constitution','Nigeria\'s civil war ended'],a:1,w:'Nigeria gained independence from British colonial rule on 1 October 1960.'},{q:'How many geopolitical zones is Nigeria commonly divided into for political analysis?',o:['Four','Six','Eight','Twelve'],a:1,w:'Nigeria is commonly divided into six geopolitical zones.'},{q:'What was the primary purpose of the 1914 Amalgamation, according to British colonial administrators?',o:['To create one administrative unit for easier, cheaper governance','To immediately grant independence','To divide Nigeria into more colonies','To establish a federal system immediately'],a:1,w:'The 1914 Amalgamation aimed to create one administrative unit for cheaper, more efficient colonial governance.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government \u2022 Elements',ti:'WAEC Exam Preparation — State and Nation',su:'Practise WAEC-style questions on state, nation and nationalism.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions on this topic: (1) Define the key term precisely. (2) Identify elements/features. (3) Compare with related concept (state vs nation). (4) Give Nigerian and international examples. (5) State challenges and solutions. (6) Draw lessons. Common questions: "Distinguish between a state and a nation." / "Explain the elements of a state." / "Assess the role of nationalism in Nigerian independence." / "Discuss the challenges of national unity in Nigeria."</p>'},
  {lb:'Key facts for WAEC',dr:dQ9,ht:'<p>WAEC fact bank: Montevideo Convention 1933 — 4 elements of a state. Herbert Macaulay — father of Nigerian nationalism (NNDP 1923). Nigeria — 250+ ethnic groups; official language English. Amalgamation — 1 January 1914 (Lugard). Independence — 1 October 1960. Republic — 1 October 1963. Current constitution — 1999. States — 36 + FCT. LGAs — 774. Federal character — s.14(3). NYSC — 1973. Nigerian civil war — 1967-1970 (Biafra).</p>'},
  {lb:'Comparing key concepts',dr:dQ9,ht:'<p>WAEC comparison table: State vs Nation — state is legal/political; nation is cultural/ethnic; state has territory; nation may not; state has international standing; nation may not. Nationality vs Citizenship — nationality is the legal bond; citizenship adds political participation rights. Nationalism vs Patriotism — nationalism is identification with a nation (can be ethnic); patriotism is love for one\'s country/state. De jure vs De facto recognition — formal vs practical acknowledgement.</p>'},
  {lb:'Common WAEC mistakes',dr:dQ9,ht:'<p>Avoid these errors: Saying Nigeria is a nation-state (it is a multinational state). Saying Lugard "created" Nigeria (he amalgamated two existing colonial territories). Confusing the 1960 and 1963 constitutions (1960 = independence/parliamentary/Queen; 1963 = republic/President). Saying jus soli means nationality by descent (it means place of birth — jus sanguinis is descent). Saying all 250+ ethnic groups in Nigeria are "tribes" — the preferred academic term is ethnic groups or nations.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'Nigeria is best described as a:',o:['Nation-state (one nation, one state)','Multinational state (one state, many nations/ethnic groups)','Confederation of ethnic states','Unitary state with no ethnic diversity'],a:2,w:'Nigeria is a multinational state — one sovereign state containing over 250 distinct ethnic groups (nations).'},{q:'Which of these is a CORRECT distinction between nationality and citizenship?',o:['They mean exactly the same thing','Nationality is ethnic identity; citizenship is legal status','Nationality is the legal bond with a state; citizenship adds the right to participate in governance','Citizenship is more limited than nationality'],a:3,w:'Nationality = legal bond between individual and state (passport, diplomatic protection). Citizenship adds political rights — vote, stand for office, hold public positions.'},{q:'The Nigerian civil war (1967-1970) arose primarily because of:',o:['A foreign invasion','Ethnic/regional tensions and the declaration of the Republic of Biafra','A dispute over who won the 1966 election','A religious war between Muslims and Christians'],a:2,w:'The civil war arose from ethnic political tensions, military coups, anti-Igbo pogroms, and the declaration of the Republic of Biafra by Odumegwu Ojukwu in 1967.'},{q:'What does jus sanguinis mean as a basis for nationality?',o:['Nationality by place of birth','Nationality by descent/blood (parentage)','Nationality by naturalisation','Nationality by marriage'],a:2,w:'Jus sanguinis (Latin: "right of blood") — acquiring nationality by descent, through one\'s parents, regardless of where you were born.'},{q:'What is meant by describing Nigeria as a "plural society"?',o:['A society made up of many different ethnic and cultural groups','A society with only one ethnic group','A society with no government','A society with no religions'],a:1,w:'A plural society is made up of many different ethnic, religious and cultural groups, as in Nigeria.'},{q:'Which of these best describes "statelessness"?',o:['Lacking any recognised nationality or citizenship','Having too many citizenships','Living outside one\'s home country temporarily','Having dual passports'],a:1,w:'Statelessness means lacking any recognised nationality or citizenship of a state.'},{q:'What long-term political effect did the Nigerian Civil War have on the country\'s structure?',o:['It contributed to the creation of more states','It ended the federal system','It led to the country splitting permanently','It abolished the presidency'],a:1,w:'The civil war contributed to the later creation of more states to address regional imbalance.'},{q:'What is one key argument for why nationality alone is not enough to fully participate in a state\'s governance?',o:['Only citizenship grants full political rights like voting and office-holding','Nationality already grants all political rights','They are exactly the same','Neither grants any rights'],a:1,w:'Only citizenship, not mere nationality, grants full political rights such as voting and holding office.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Government \u2022 Elements',ti:'Mixed Questions — The State and Nation',su:'Integrated revision across all GOV-ELE-02 topics.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>State: 4 elements (population, territory, government, sovereignty) — Montevideo 1933. Nation: cultural unit (shared identity, history, language). Nation-state: rare — Japan, Iceland. Multinational state: Nigeria (250+), India, UK. Nationalism: positive (anti-colonial) and negative (ethnic conflict). Nationality: legal bond; jus soli (place of birth) / jus sanguinis (descent) / naturalisation. Sovereignty: internal (supreme authority) + external (independence). Nigeria: amalgamated 1914; independence 1960; republic 1963; 36 states + FCT; 1999 Constitution.</p>'},
  {lb:'Key references',dr:dQ10,ht:'<p>WAEC references: Montevideo Convention 1933 (4 elements of state). 1999 Constitution s.25-27 (citizenship). s.14(3) (federal character). s.33-46 (fundamental rights, Chapter IV). Chapter II (Fundamental Objectives). Lugard — amalgamation 1914. Macaulay — father of nationalism (NNDP 1923). Independence 1 October 1960. Republic 1 October 1963. Civil war 1967-70. NYSC 1973. 36 states. 774 LGAs.</p>'},
  {lb:'Thematic connections',dr:dQ10,ht:'<p>Key connections: Diversity → Multinational state → Federalism → Federal character → National unity. Nationalism → Independence → Sovereignty → Foreign policy. Citizenship → Rights and duties → Democracy → Good governance. Sovereignty → Globalisation → International organisations → Constrained sovereignty. Bad governance → Ethnic tensions → Separatism → Threat to state integrity. Understanding these chains helps with essay questions asking for analysis.</p>'},
  {lb:'WAEC final tips',dr:dQ10,ht:'<p>Tips for this topic: Always define in multiple senses (state has 4 elements; nation has identity criteria). Use Nigerian examples — Yoruba/Igbo/Hausa as nations within Nigeria; 1914 amalgamation; NYSC for unity. Know the correct dates (1914 amalgamation; 1960 independence; 1963 republic; 1967-70 civil war; 1999 constitution). Don\'t confuse jus soli and jus sanguinis. Know the three ways of acquiring Nigerian citizenship (birth, registration, naturalisation). Give at least 5 points per essay.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Which of these is NOT an element of a state under the Montevideo Convention?',o:['Population','Recognition by other states','Territory','Sovereignty'],a:2,w:'Recognition is NOT one of the four Montevideo elements (population, territory, government, sovereignty). The declaratory theory says a state exists without needing recognition.'},{q:'Nigeria\'s "Amalgamation of 1914" joined which two territories?',o:['Nigeria and Cameroon','The Colony of Lagos and the Northern Protectorate','The Colony and Protectorate of Southern Nigeria and the Protectorate of Northern Nigeria','Yorubaland and Hausaland'],a:3,w:'The 1914 amalgamation joined the Colony and Protectorate of Southern Nigeria with the Protectorate of Northern Nigeria under Lord Lugard.'},{q:'The principle of jus soli means a child born in Nigeria to foreign parents:',o:['Automatically gets Nigerian citizenship','May qualify for Nigerian citizenship by birth if at least one parent is Nigerian','Can never be Nigerian','Must apply for naturalisation at age 18'],a:2,w:'Under Nigeria\'s constitution s.25, birth in Nigeria confers citizenship only if at least one parent is a Nigerian citizen — modified jus soli.'},{q:'Herbert Macaulay is called the "father of Nigerian nationalism" because he:',o:['Led Nigeria to independence in 1960','Was the first Nigerian president','Founded the NNDP (1923) — Nigeria\'s first political party — to fight for Nigerian interests','Wrote the 1960 independence constitution'],a:3,w:'Herbert Macaulay founded the Nigerian National Democratic Party (NNDP) in 1923 — the first Nigerian political party — making him the pioneer of Nigerian nationalism.'},{q:'What is the significance of the year 1914 in Nigerian history?',o:['The amalgamation of Northern and Southern Protectorates','Nigeria\'s independence','The start of the civil war','The adoption of the 1999 Constitution'],a:1,w:'1914 marked the amalgamation of the Northern and Southern Protectorates into one Nigeria.'},{q:'Which of these is a criterion under jus soli-based citizenship laws generally?',o:['Being born within the territory of the state','Having a parent who is a citizen, regardless of birthplace','Marrying a citizen','Living in the country for ten years'],a:1,w:'Jus soli grants citizenship based on being born within the territory of the state.'},{q:'Herbert Macaulay is remembered in Nigerian history primarily as:',o:['An early nationalist and founder of Nigeria\'s first political party','Nigeria\'s first military head of state','The author of Nigeria\'s 1999 Constitution','Nigeria\'s first elected president'],a:1,w:'Herbert Macaulay founded the NNDP in 1923, Nigeria\'s first political party, earning him the title "father of Nigerian nationalism."'},{q:'What is a key legacy of early Nigerian nationalist movements like the NNDP?',o:['They laid groundwork for later independence movements','They supported permanent colonial rule','They dissolved Nigeria\'s ethnic groups','They created Nigeria\'s current constitution'],a:1,w:'Early nationalist movements like the NNDP laid important groundwork for the independence movements that followed.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
