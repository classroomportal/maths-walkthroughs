<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}

.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}

.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}

.btn.p{background:var(--red);color:#fff;}

.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}

.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}

.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}

@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Meaning and Scope of Government',ACC,12,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'Government: the organisation or machinery through which a state is governed',DARK,10,'middle',false));o.push(T(240,74,'Also refers to the people/group that rules a state at any given time','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,40,CRM,ACC,1.5));o.push(T(240,110,'Three senses: the activity of governing; the institution; the people governing','#333',10,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,CRM,ACC,1.5));o.push(T(240,160,'Three arms: Legislature (law-making), Executive (law-execution), Judiciary','#333',10,'middle',false));}
if(p>=4){o.push(R(10,192,460,60,LINE,ACC,1));o.push(T(240,212,'Scope: making laws, maintaining order, providing services, defence','#333',9,'middle',false));o.push(T(240,232,'Necessity: prevent chaos, protect rights, promote welfare, manage resources','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Why Government is Necessary',ACC,12,'middle',true));
[['Without government','Life would be "nasty, brutish and short" (Hobbes)'],['Order','Prevent anarchy; resolve disputes peacefully'],['Rights','Protect life, liberty and property of citizens'],['Services','Provide roads, schools, hospitals, security'],['Economy','Regulate trade, taxation, national resources'],['Defence','Protect territory from external aggression'],['Justice','Punish crime; ensure fair treatment under law']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(130,46+i*32,r[0],ACC,8,'middle',true));o.push(T(330,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Meaning and Scope — Summary',ACC,13,'middle',true));
[['Government (activity)','The process/act of governing a state'],['Government (institution)','The three arms: Legislature, Executive, Judiciary'],['Government (people)','The ruling group/party in power at a time'],['Necessity','Order, rights, services, defence, justice, economy'],['Hobbes','Without government: "state of nature" — constant war'],['Locke','Government exists to protect life, liberty, property'],['WAEC tip','Always define government in THREE senses first']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,9,'middle',true));o.push(T(310,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Government \u2022 Elements',ti:'Definition of Government',su:'Define government in its three senses.',steps:[
  {lb:'Government as activity',dr:dQ1,ht:'<p>Government as <b>activity</b> refers to the act or process of governing — the exercise of authority, making laws, enforcing them, and adjudicating disputes. It is what happens when organised political authority is exercised over a people and territory. This is the functional or operational sense of the word.</p>'},
  {lb:'Government as institution',dr:dQ1,ht:'<p>Government as <b>institution</b> refers to the machinery or structure through which a state is governed. It includes the three arms: the <b>Legislature</b> (law-making body e.g. National Assembly), the <b>Executive</b> (law-executing body e.g. President/Cabinet), and the <b>Judiciary</b> (law-interpreting body e.g. Supreme Court). These institutions are permanent regardless of who occupies them.</p>'},
  {lb:'Government as people',dr:dQ1,ht:'<p>Government as <b>people</b> refers to the individuals who exercise political authority at any given time — the ruling group. In Nigeria, this means the President, Vice President, Ministers and other officials in power. This sense changes when elections occur or governments change. It is the most common everyday usage: "the government announced..."</p>'},
  {lb:'Why government is necessary',dr:dQ2,ht:'<p>Thomas Hobbes argued that without government, human life would be "solitary, poor, nasty, brutish and short" (Leviathan, 1651) — a "state of nature" of constant war. Government is necessary to: (1) Maintain law and order. (2) Protect citizens\' rights (life, liberty, property — Locke). (3) Provide essential services (education, health, infrastructure). (4) Defend the territory from external threats. (5) Regulate the economy. (6) Ensure justice.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which philosopher said without government life would be "nasty, brutish and short"?',o:['John Locke','Jean-Jacques Rousseau','Thomas Hobbes','Aristotle'],a:3,w:'Thomas Hobbes in Leviathan (1651) described the "state of nature" without government as a war of all against all.'},{q:'Government as an INSTITUTION refers to:',o:['The ruling group currently in power','The act or process of governing','The three arms — Legislature, Executive and Judiciary','The constitution of a country'],a:3,w:'Government as institution = the machinery/structure of governance: Legislature, Executive and Judiciary.'},{q:'Which of the following is NOT a reason why government is necessary?',o:['Maintain law and order','Protect citizens\' rights','Ensure one political party stays in power forever','Provide essential services'],a:3,w:'Government is not meant to keep one party in power — that would be a dictatorship. Its purpose is to serve the public good.'},{q:'John Locke said government exists primarily to protect:',o:['The king\'s divine right to rule','Life, liberty and property of citizens','The interests of the wealthy class','Military security above all else'],a:2,w:'John Locke\'s Second Treatise of Government argued that the purpose of government is to protect the natural rights of life, liberty and property.'},{q:'What did Aristotle mean by describing man as "a political animal"?',o:['Humans are naturally violent','Humans naturally form political communities','Humans need no government','Humans are ruled by animals'],a:2,w:'Aristotle meant that humans naturally form political communities and government to live well together.'},{q:'Which of the following best describes government as an ACTIVITY?',o:['The physical buildings of parliament','The process of making and enforcing laws and policies','A specific political party','The national anthem'],a:2,w:'Government as an activity refers to the process of making and enforcing laws and policies for society.'},{q:'Which theory of the origin of government claims rulers derive authority from God?',o:['Divine Right Theory','Social Contract Theory','Force Theory','Evolutionary Theory'],a:1,w:'The Divine Right Theory holds that rulers derive their authority directly from God.'},{q:'Why did Hobbes argue people needed a strong sovereign (a "Leviathan")?',o:['To collect taxes efficiently','To escape the chaos of a lawless state of nature','To promote trade','To fight foreign wars only'],a:2,w:'Hobbes argued a strong sovereign was needed to escape the brutal chaos of the state of nature.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government \u2022 Elements',ti:'Scope of Government',su:'Describe the scope and functions of government.',steps:[
  {lb:'Law-making',dr:dQ2,ht:'<p>One of government\'s primary functions is <b>law-making</b> — enacted by the Legislature. Laws regulate behaviour, protect rights, and define the limits of government itself. In Nigeria, the National Assembly (Senate + House of Representatives) makes federal laws. State Houses of Assembly make state laws. Laws must conform to the constitution (the supreme law). Without law, there is no ordered society.</p>'},
  {lb:'Maintenance of order',dr:dQ2,ht:'<p>Government maintains internal order through: (1) The police — prevent crime, arrest offenders. (2) The courts — try offenders and impose penalties. (3) The prison service — punish and rehabilitate offenders. (4) The military — internal security in extreme cases. Order is the foundation of all other government activities. Without security, economic development, education and health services cannot function effectively.</p>'},
  {lb:'Provision of services',dr:dQ2,ht:'<p>Government provides essential public goods and services that the private sector may not adequately supply: education (schools, universities), healthcare (hospitals, clinics), infrastructure (roads, electricity, water), social welfare (support for the poor, elderly, disabled). In Nigeria, both federal and state governments provide these services. The quality of government service delivery is a major measure of governance quality.</p>'},
  {lb:'External relations and defence',dr:dQ2,ht:'<p>Government conducts <b>foreign policy</b> — Nigeria\'s relationships with other countries. This includes: diplomacy (embassies, negotiations), international trade agreements, membership in international organisations (UN, AU, ECOWAS), and peacekeeping (ECOMOG). The <b>military</b> (Army, Navy, Air Force) defends the territory from external aggression. Nigeria\'s foreign policy has "Africa as the centrepiece."</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'In Nigeria, which body is responsible for making federal laws?',o:['The Supreme Court','The National Assembly (Senate + House of Reps)','The Federal Executive Council','The Independent National Electoral Commission'],a:2,w:'The National Assembly (Senate + House of Representatives) is Nigeria\'s federal law-making body.'},{q:'Which of the following is a public good that government typically provides?',o:['Private company profits','Fashion and entertainment','Roads, hospitals and schools','Foreign exchange for businesses'],a:3,w:'Public goods like roads, hospitals and schools are typically provided by government because private markets may underprovide them.'},{q:'Nigeria\'s foreign policy is often described as having which region as its "centrepiece"?',o:['Europe','Asia','The Middle East','Africa'],a:4,w:'Nigeria\'s foreign policy has "Africa as the centrepiece" — reflecting its leadership role and continental identity.'},{q:'The function of maintaining internal order in Nigeria primarily belongs to:',o:['The National Assembly','The police, courts and prison service','The Central Bank of Nigeria','The INEC'],a:2,w:'Maintaining internal order is the role of the police (prevention/arrest), courts (trial/judgment) and prisons (punishment/rehabilitation).'},{q:'Which arm of government is primarily responsible for interpreting the law?',o:['The Legislature','The Executive','The Judiciary','The Civil Service'],a:3,w:'The Judiciary interprets the law and settles disputes about its meaning and application.'},{q:'What is a key function of government relating to citizens\' welfare?',o:['Providing social services such as healthcare and education','Controlling all private businesses','Preventing all migration','Owning all land'],a:1,w:'Providing essential social services like healthcare and education is a core welfare function of government.'},{q:'Nigeria\'s Ministry of Foreign Affairs primarily handles:',o:['Local government elections','Relations with other countries and international bodies','State police forces','Federal taxation only'],a:2,w:'The Ministry of Foreign Affairs manages Nigeria\'s relations with other countries and international organisations.'},{q:'Which of these is an economic function of government?',o:['Writing school textbooks only','Regulating trade and managing the national currency','Running religious institutions','Selecting football teams'],a:2,w:'Regulating trade and managing the national currency are core economic functions of government.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government \u2022 Elements',ti:'Theories of the Origin of Government',su:'Explain theories of how government came about.',steps:[
  {lb:'Divine right theory',dr:dQ3,ht:'<p>The <b>Divine Right Theory</b> holds that government (specifically monarchy) is ordained by God. Kings rule because God appoints them — therefore to disobey the king is to disobey God. Advocated by King James I of England. Drawbacks: it was used to justify absolute monarchy and tyranny. It provided no mechanism for removing bad rulers. The Glorious Revolution of 1688 effectively ended this theory in England.</p>'},
  {lb:'Social contract theory',dr:dQ3,ht:'<p>Social contract theorists argue government arose from an agreement among people: <b>Thomas Hobbes</b> (Leviathan, 1651) — people surrendered all rights to a sovereign to escape the state of nature. <b>John Locke</b> (Two Treatises, 1689) — people surrendered some rights to protect the rest; government that breaks the contract can be overthrown. <b>Jean-Jacques Rousseau</b> (Social Contract, 1762) — the "general will" of the people is sovereign. Locke most influenced modern democracy.</p>'},
  {lb:'Force/conquest theory',dr:dQ3,ht:'<p>The <b>Force Theory</b> holds that government arose when strong individuals or groups conquered and subdued weaker ones. The strongest imposed their will. Many historical empires (Mongol, Roman, British) began through conquest. Modern implications: might does not make right; conquest cannot confer legitimate authority in today\'s world. Force alone cannot sustain government — consent and legitimacy are necessary for stability.</p>'},
  {lb:'Evolutionary theory',dr:dQ3,ht:'<p>The <b>Evolutionary Theory</b> holds that government evolved naturally from the family — the most basic social unit. Family → clan → tribe → city-state → nation-state. As communities grew, more organised leadership became necessary. Aristotle supported this view: "Man is by nature a political animal." Government is the natural product of human social development. This theory emphasises continuity and organic growth rather than a sudden contract or conquest.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'Which theory says government arose from an agreement among people to escape the state of nature?',o:['Divine Right Theory','Force Theory','Social Contract Theory','Evolutionary Theory'],a:3,w:'Social Contract Theory — Hobbes, Locke and Rousseau argued government arose from a contract among people.'},{q:'John Locke differed from Hobbes in that Locke believed:',o:['People surrendered ALL rights to the sovereign','A government that breaks the contract can be overthrown by the people','Kings are appointed by God','Government arose naturally from the family'],a:2,w:'Locke believed government was limited — if it broke the social contract (violated rights), people had the right to overthrow it.'},{q:'Aristotle\'s view that "man is by nature a political animal" supports which theory?',o:['Divine right theory','Social contract theory','Force theory','Evolutionary theory'],a:4,w:'Aristotle\'s view that humans naturally form communities supports the Evolutionary Theory — government grows from the family.'},{q:'The Divine Right Theory was used to justify:',o:['Democracy and elections','Absolute monarchy and tyranny','Social contracts between rulers and citizens','Federal systems of government'],a:2,w:'Divine Right Theory was used by monarchs like James I to justify absolute rule, claiming they were answerable only to God.'},{q:'According to Force Theory, how did government first arise?',o:['Through conquest by the strong over the weak','Through voluntary agreement','Through divine appointment','Through gradual evolution of the family'],a:1,w:'Force Theory holds that government arose from conquest, with the strong dominating the weak.'},{q:'Which theory suggests government evolved naturally from the family and clan structure?',o:['Evolutionary Theory','Force Theory','Divine Right Theory','Social Contract Theory'],a:1,w:'Evolutionary (Historical) Theory sees government as developing naturally from family and clan structures.'},{q:'What is a main criticism of the Divine Right Theory today?',o:['It gives too much power to the people','It has been used to justify tyranny and cannot be proven','It requires elections','It supports federalism'],a:2,w:'Divine Right Theory is criticised for being unprovable and historically used to justify tyranny.'},{q:'Rousseau\'s version of the social contract emphasised what concept?',o:['The general will of the people','The divine right of kings','Military conquest','Ethnic federalism'],a:1,w:'Rousseau emphasised the "general will" of the people as the basis of legitimate government.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government \u2022 Elements',ti:'Government and the State',su:'Distinguish between government and the state.',steps:[
  {lb:'The state defined',dr:dQ4,ht:'<p>A <b>state</b> is a politically organised community with a defined territory, a permanent population, a government, and sovereignty (supremacy within its borders and recognition from other states — the Montevideo Convention, 1933). The state is <b>permanent</b> — it continues even when governments change. Nigeria as a state continues whether PDP or APC is in government. The state is an abstract entity; government is its concrete instrument.</p>'},
  {lb:'Difference: state vs government',dr:dQ4,ht:'<p>Key differences: (1) The state is permanent; government is temporary (changes through elections). (2) The state includes all citizens; government is a small group. (3) The state has sovereignty; government exercises that sovereignty on the state\'s behalf. (4) The state exists independently of any one government; governments can be overthrown without destroying the state. (5) Citizens owe allegiance to the state (patriotism), not just to the current government.</p>'},
  {lb:'Elements of a state',dr:dQ4,ht:'<p>Four essential elements of a state (Montevideo, 1933): (1) <b>Population</b> — people who inhabit the territory. (2) <b>Territory</b> — defined geographical area with recognised borders. (3) <b>Government</b> — organised authority to make and enforce law. (4) <b>Sovereignty</b> — supreme authority within the territory; independence from external control. Some add: recognition by other states (though sovereignty does not depend on recognition). Nigeria has all four elements.</p>'},
  {lb:'Sovereignty',dr:dQ4,ht:'<p><b>Sovereignty</b> is the supreme power within a state. <b>Internal sovereignty</b>: absolute authority over all persons and groups within the territory. <b>External sovereignty</b>: independence from foreign control; equal standing among nations. In a democracy, sovereignty ultimately belongs to the people (popular sovereignty). In international law, all sovereign states are equal regardless of size (UN Charter principle). Nigeria\'s sovereignty means no outside power can legally dictate its laws.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'According to the Montevideo Convention, how many elements constitute a state?',o:['2','3','4','5'],a:3,w:'The Montevideo Convention (1933) identifies four elements: population, territory, government and sovereignty.'},{q:'Which element of a state refers to its independence from external control?',o:['Territory','Population','Government','Sovereignty'],a:4,w:'Sovereignty — the state\'s supreme authority within its territory and its independence from external control.'},{q:'The key difference between a state and a government is that:',o:['The state has a president; government has a parliament','The state is permanent; government is temporary','The state makes laws; government enforces them','The state has sovereignty; government has none'],a:2,w:'The state is permanent and continuous; governments change through elections, coups or other means, but the state persists.'},{q:'Popular sovereignty means:',o:['The most popular politician has supreme power','Supreme power ultimately belongs to the people','Sovereignty is shared equally among all states','The sovereign is chosen by popular vote only'],a:2,w:'Popular sovereignty means ultimate political authority rests with the people, not with kings or rulers.'},{q:'Which of the four elements of a state refers to the people living within its borders?',o:['Population','Territory','Government','Sovereignty'],a:1,w:'Population is one of the four elements of a state under the Montevideo Convention.'},{q:'What term describes a state\'s supreme authority over its own internal affairs?',o:['Internal sovereignty','External sovereignty','Popular sovereignty','Legal sovereignty'],a:1,w:'Internal sovereignty refers to supreme authority within the state\'s own borders.'},{q:'Which of these best distinguishes a "nation" from a "state"?',o:['A nation is a group sharing common culture; a state is a political/legal entity','They mean exactly the same thing','A nation always has one state only','A state is always smaller than a nation'],a:1,w:'A nation is defined by shared culture/identity, while a state is a political and legal entity.'},{q:'Which body historically claimed "legal sovereignty" as the supreme law-making authority in the UK?',o:['Parliament','The Monarch','The Prime Minister','The Supreme Court'],a:1,w:'The UK Parliament has traditionally been regarded as holding supreme legal sovereignty.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government \u2022 Elements',ti:'Importance of Government',su:'Explain why good governance matters for national development.',steps:[
  {lb:'Security and stability',dr:dQ5,ht:'<p>Government\'s most fundamental role is providing security — without which no other development is possible. Where government fails to provide security (failed states — Somalia, parts of the Sahel), investment dries up, businesses collapse, citizens flee. Security covers: physical safety from crime and violence, border security, food security, and economic stability. Nigeria\'s security challenges (Boko Haram, banditry, IPOB) illustrate what happens when government\'s security function is weakened.</p>'},
  {lb:'Economic development',dr:dQ5,ht:'<p>Government drives economic development through: (1) Infrastructure (roads, power, ports). (2) Fiscal policy (taxation, government spending). (3) Monetary policy (via the Central Bank). (4) Trade regulation (tariffs, trade agreements). (5) Protection of property rights (encouraging investment). Bad governance — corruption, poor infrastructure, weak institutions — is the primary reason many developing countries remain poor despite rich natural resources. Nigeria\'s oil wealth has not translated into broad development largely due to governance failures.</p>'},
  {lb:'Social welfare and human development',dr:dQ5,ht:'<p>Government ensures social welfare through: Universal basic education (UBE in Nigeria). National health insurance scheme. Social protection for the poor and vulnerable. Employment creation policies. The UN\'s Human Development Index (HDI) measures countries on health, education and income — all areas where government plays a central role. Countries with effective governments (Scandinavia, Singapore) consistently rank highest on human development indicators.</p>'},
  {lb:'National unity and identity',dr:dQ5,ht:'<p>Government builds national unity through: Common citizenship and nationality. National symbols (flag, anthem, public holidays). National language policy. Federal character (in Nigeria — ensuring representation of all groups). Conflict resolution mechanisms. In a multi-ethnic, multi-religious country like Nigeria (over 250 ethnic groups), government\'s role in managing diversity and promoting unity is critical. Federal structure was specifically designed for this purpose.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'Why is security considered the MOST fundamental function of government?',o:['It is the easiest to provide','Without security, no other development can take place','Security generates the most revenue','Security is mentioned first in the constitution'],a:2,w:'Without security, investment, education, health and all other development become impossible — making it the foundation of all governance.'},{q:'The Human Development Index (HDI) measures countries based on:',o:['Military strength, GDP and population','Health, education and income','Democracy, transparency and corruption','Trade, investment and technology'],a:2,w:'HDI measures three dimensions: health (life expectancy), education (years of schooling) and income (GNI per capita).'},{q:'Nigeria\'s policy of "federal character" aims to:',o:['Give Lagos more representation due to its size','Ensure all regions and groups are represented in government','Make federal government more powerful than states','Reduce the number of political parties'],a:2,w:'Federal character principle (s.14(3) of the 1999 Constitution) ensures that appointments reflect Nigeria\'s diversity of states and ethnic groups.'},{q:'Which of these is an example of BAD governance harming economic development?',o:['Building new roads and ports','Reducing corruption and improving property rights','Oil wealth failing to translate into development due to corruption','Signing beneficial trade agreements'],a:3,w:'Nigeria\'s case shows how natural resource wealth (oil) can fail to produce development when governance is poor, corrupt and extractive.'},{q:'Besides security, which is considered a fundamental function of government for development?',o:['Providing infrastructure such as roads and electricity','Running football leagues','Printing newspapers','Selling farmland to foreigners'],a:1,w:'Providing infrastructure like roads and electricity is a fundamental development function.'},{q:'What does "good governance" typically include, according to World Bank indicators?',o:['Transparency, accountability and rule of law','Maximum military spending','One-party rule','Total state ownership of industry'],a:1,w:'Good governance indicators emphasise transparency, accountability and the rule of law.'},{q:'Which of these best illustrates the "resource curse" affecting some oil-rich nations?',o:['Abundant resources always guaranteeing prosperity','Abundant natural resources leading to corruption and poor development','Resources causing immediate industrialisation','Resources eliminating the need for government'],a:2,w:'The resource curse describes how abundant natural resources can lead to corruption and poor development outcomes.'},{q:'Nigeria\'s federal character principle mainly promotes fairness in which area?',o:['Public appointments and resource allocation across regions/groups','Only presidential elections','Only the judiciary','Only foreign policy'],a:1,w:'Federal character promotes fairness in public appointments and resource allocation across Nigeria\'s diverse regions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government \u2022 Elements',ti:'Forms and Types of Government',su:'Introduce different forms of government — preview before GOV-ELE-05.',steps:[
  {lb:'Classification by who rules',dr:dQ6,ht:'<p>Aristotle classified government by who rules and for whose benefit: (1) <b>Monarchy</b> — rule by one (for common good). (2) <b>Aristocracy</b> — rule by few, best people (for common good). (3) <b>Polity</b> — rule by many (for common good). Their corrupt forms: Tyranny (one for self), Oligarchy (few for self), Democracy (majority for self — Aristotle\'s view). Modern usage: democracy is now considered the best form. This classification is still the starting point for Government essays on WAEC.</p>'},
  {lb:'Unitary vs federal systems',dr:dQ6,ht:'<p><b>Unitary system</b>: power concentrated at the centre; local units are subordinate (UK, France, Ghana). <b>Federal system</b>: power divided between central and component units by the constitution (Nigeria, USA, Germany). <b>Confederal system</b>: loose association; component units retain sovereignty (e.g. early USA under Articles of Confederation). Nigeria operates a federal system — 36 states + FCT, with powers divided by the Exclusive, Concurrent and Residual legislative lists.</p>'},
  {lb:'Presidential vs parliamentary',dr:dQ6,ht:'<p><b>Presidential system</b> (Nigeria, USA): Executive President directly elected; separate from legislature; fixed term; clear separation of powers. <b>Parliamentary system</b> (UK, India): Executive (Prime Minister) drawn from and accountable to legislature; government falls if it loses confidence vote; fusion of powers. Nigeria adopted the presidential system in 1979 (abandoning the Westminster model of independence). WAEC compares these systems extensively.</p>'},
  {lb:'Democracy and its features',dr:dQ6,ht:'<p>Democracy — government of the people, by the people, for the people (Lincoln). Features: (1) Popular sovereignty — people are the source of power. (2) Rule of law — no one is above the law. (3) Free and fair elections. (4) Fundamental human rights. (5) Separation of powers. (6) Independent judiciary. (7) Free press and civil society. (8) Periodic change of government. Nigeria is a constitutional democracy — though imperfectly practised. WAEC: know features, merits and demerits.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'In Nigeria, which legislative list contains powers exercised ONLY by the federal government?',o:['Residual List','Concurrent List','Exclusive List','Federal List'],a:3,w:'The Exclusive Legislative List (Second Schedule, 1999 Constitution) contains matters only the National Assembly can legislate on (e.g. defence, immigration, currency).'},{q:'Abraham Lincoln defined democracy as "government of the people, by the people..."',o:['above the people','through the people','for the people','with the people'],a:3,w:'Lincoln\'s Gettysburg Address (1863): "government of the people, by the people, for the people."'},{q:'What is the key difference between a presidential and parliamentary system?',o:['Presidential has a president; parliamentary has a king','In a presidential system the executive is separate from the legislature; in parliamentary they are fused','Presidential systems are always democratic; parliamentary are not','Parliamentary systems have no constitution'],a:2,w:'Presidential system: executive is separately elected and independent of legislature. Parliamentary: executive is drawn from and answerable to the legislature.'},{q:'Nigeria switched from parliamentary (Westminster) to presidential system in which year?',o:['1960','1966','1979','1999'],a:3,w:'Nigeria adopted the presidential system in 1979 under the Second Republic constitution, abandoning the Westminster parliamentary model of independence.'},{q:'Which legislative list contains powers exercised by BOTH federal and state governments in Nigeria?',o:['The Concurrent List','The Exclusive List','The Residual List','The Federal List'],a:1,w:'The Concurrent List contains powers shared by both federal and state governments.'},{q:'In a parliamentary system, who typically becomes the head of government?',o:['The elected president directly','The leader of the majority party in parliament','The monarch alone','The chief justice'],a:2,w:'In a parliamentary system, the leader of the majority party typically becomes head of government (Prime Minister).'},{q:'Which is an example of a unitary system of government?',o:['A system where power is shared equally among many independent states','A system where all power is concentrated in a single central government','A system with no central government at all','A system led entirely by regional governors'],a:2,w:'A unitary system concentrates power in a single central government, as in France.'},{q:'What is a main advantage often cited for a federal system, as practised in Nigeria?',o:['It allows regional diversity to be accommodated within one country','It eliminates the need for a constitution','It removes all regional governments','It guarantees permanent one-party rule'],a:1,w:'Federalism allows regional diversity to be accommodated while remaining one country.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government \u2022 Elements',ti:'Government vs Governance',su:'Distinguish between government and governance.',steps:[
  {lb:'What is governance?',dr:dQ7,ht:'<p><b>Governance</b> is broader than government — it refers to the processes, traditions and institutions by which authority is exercised in a country. Good governance encompasses: accountability, transparency, rule of law, participation, effectiveness, responsiveness, equity. The UN Development Programme (UNDP) defines good governance as "the exercise of economic, political and administrative authority to manage a country\'s affairs at all levels." Government is the institution; governance is how that institution exercises its power.</p>'},
  {lb:'Good governance indicators',dr:dQ7,ht:'<p>World Bank indicators of good governance: (1) Voice and accountability. (2) Political stability and absence of violence. (3) Government effectiveness. (4) Regulatory quality. (5) Rule of law. (6) Control of corruption. Countries that score high on these indicators (e.g. Norway, Singapore, New Zealand) tend to be more prosperous and stable. Nigeria scores poorly on several indicators — especially corruption control and political stability.</p>'},
  {lb:'Bad governance and its effects',dr:dQ7,ht:'<p>Bad governance includes: corruption, nepotism, weak institutions, lack of accountability, impunity. Effects: poverty despite resources; brain drain; political instability; conflict; underdevelopment. Transparency International\'s Corruption Perception Index (CPI) ranks countries by perceived corruption. Nigeria has consistently ranked among the more corrupt nations. Bad governance is Africa\'s development challenge number one — not lack of resources.</p>'},
  {lb:'Accountability and transparency',dr:dQ7,ht:'<p><b>Accountability</b>: leaders must answer for their actions to the people and institutions. Mechanisms: elections, parliament, courts, audit agencies (e.g. Nigeria\'s EFCC, ICPC), freedom of information laws, civil society and media. <b>Transparency</b>: government activities are open to scrutiny; budgets are published; contracts are competitive. In Nigeria: NEITI (Nigeria Extractive Industries Transparency Initiative) promotes transparency in oil revenues. Without accountability, corruption thrives.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'Good governance is BROADER than government because it includes:',o:['More government officials','Processes, traditions and institutions through which authority is exercised','More laws and regulations','Higher military spending'],a:2,w:'Governance encompasses the wider processes, institutions and traditions of how authority is exercised — beyond just the structure of government.'},{q:'Which World Bank governance indicator refers to citizens\' ability to participate in choosing their government?',o:['Control of corruption','Government effectiveness','Voice and accountability','Rule of law'],a:3,w:'Voice and accountability measures the extent to which citizens can participate in selecting their government and enjoy freedom of expression and association.'},{q:'The EFCC in Nigeria is primarily responsible for:',o:['Conducting elections','Enforcing economic and financial crimes laws (anti-corruption)','Regulating the banking sector','Managing foreign policy'],a:2,w:'The EFCC (Economic and Financial Crimes Commission) investigates and prosecutes economic and financial crimes, including corruption and money laundering.'},{q:'Transparency International\'s Corruption Perception Index measures:',o:['Actual corruption in monetary terms','How transparent government budgets are','The perceived level of corruption in countries\'s public sectors','The effectiveness of anti-corruption agencies'],a:3,w:'The CPI ranks countries by their perceived levels of public sector corruption based on expert opinions and surveys.'},{q:'Which Nigerian agency primarily investigates and prosecutes corruption among public officials?',o:['INEC','The ICPC','The Central Bank','The Ministry of Education'],a:2,w:'The ICPC (Independent Corrupt Practices Commission), alongside the EFCC, investigates public sector corruption.'},{q:'What does "rule of law" mean as a governance indicator?',o:['Only citizens must obey the law','Everyone, including leaders, is subject to and accountable under the law','Laws can be changed by the President alone','Judges are above the law'],a:2,w:'Rule of law means everyone, including leaders, is subject to and accountable under the law.'},{q:'What is a common consequence of poor governance in developing countries?',o:['Increased foreign investment automatically','Reduced investment, poverty and instability','Immediate economic growth','Stronger currency automatically'],a:2,w:'Poor governance typically leads to reduced investment, poverty and political instability.'},{q:'What does "government effectiveness" measure, as a World Bank indicator?',o:['The number of political parties','The quality of public services and policy implementation','The size of the military','The number of elections held'],a:2,w:'Government effectiveness measures the quality of public services and policy implementation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government \u2022 Elements',ti:'Nigerian Government — Overview',su:'Describe the structure of Nigeria\'s government.',steps:[
  {lb:'The 1999 Constitution',dr:dQ8,ht:'<p>Nigeria\'s 1999 Constitution (as amended) is the supreme law. It establishes: a federal republic with three tiers (federal, state, local). Separation of powers among three arms. Fundamental human rights (Chapter IV). Federal character principle. It was promulgated on 29 May 1999 during the transition from military to civilian rule. Nigeria has had multiple constitutions: 1960 (independence), 1963 (republic), 1979 (presidential), 1989 (never used), 1999 (current, with amendments).</p>'},
  {lb:'The three arms of government',dr:dQ8,ht:'<p><b>Legislature</b>: National Assembly — Senate (109 senators: 3 per state + 1 FCT) + House of Representatives (360 members). Makes laws, approves budget, confirms appointments. <b>Executive</b>: President + Vice President + Ministers. Implements laws, manages government, directs foreign policy. <b>Judiciary</b>: Supreme Court (apex), Court of Appeal, Federal High Court, State courts. Interprets law, settles disputes, protects rights. The arms are designed to check and balance each other.</p>'},
  {lb:'Federal, state and local government',dr:dQ8,ht:'<p>Nigeria\'s three tiers: (1) <b>Federal</b>: 36 items on Exclusive List. President, National Assembly, Federal ministries. (2) <b>State</b>: 36 states + FCT; Governor, State House of Assembly, State ministries. Concurrent List (shared with federal). Residual powers in some interpretations. (3) <b>Local Government</b>: 774 LGAs; Chairman, Councillors. Closest government to the people. Delivers local services (primary health, primary education, sanitation).</p>'},
  {lb:'Checks and balances in Nigeria',dr:dQ8,ht:'<p>Examples of checks and balances in Nigeria\'s 1999 Constitution: Legislature checks Executive — can impeach President, override veto, approve appointments, pass budget. Executive checks Legislature — President can veto bills; appoints key officials without legislature. Judiciary checks both — can declare laws or executive actions unconstitutional. These checks prevent concentration of power. The challenge: in practice, executive dominance has often undermined these checks.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'How many senators does each state send to Nigeria\'s Senate?',o:['1','2','3','4'],a:3,w:'Each of Nigeria\'s 36 states sends 3 senators; the FCT sends 1 — making 109 senators total.'},{q:'The 1999 Constitution was promulgated on which date?',o:['1 October 1960','1 October 1963','29 May 1999','29 May 2003'],a:3,w:'The 1999 Constitution was promulgated on 29 May 1999, marking Nigeria\'s return to civilian rule.'},{q:'How many Local Government Areas (LGAs) does Nigeria currently have?',o:['36','360','774','500'],a:3,w:'Nigeria has 774 Local Government Areas created by the 1976 local government reform and continued under the 1999 Constitution.'},{q:'Which body in Nigeria\'s National Assembly has 360 members?',o:['The Senate','The House of Representatives','The Federal Executive Council','The Supreme Court'],a:2,w:'The House of Representatives has 360 members, allocated to states based on population.'},{q:'How many geopolitical zones does Nigeria have?',o:['Four','Six','Eight','Ten'],a:2,w:'Nigeria is commonly divided into six geopolitical zones for political analysis.'},{q:'What is the minimum age requirement to run for President in Nigeria under current law?',o:['30 years','35 years','40 years','21 years'],a:2,w:'Nigerian electoral law sets the minimum age for presidential candidacy at 35 years.'},{q:'How many Senatorial Districts does Nigeria have in total?',o:['74','109','360','774'],a:2,w:'Nigeria has 109 Senatorial Districts (36 states x 3, plus the FCT\'s single seat).'},{q:'Which body conducts elections in Nigeria?',o:['The National Assembly','INEC','The Supreme Court','The Ministry of Interior'],a:2,w:'INEC (Independent National Electoral Commission) conducts Nigeria\'s elections.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government \u2022 Elements',ti:'WAEC Exam Preparation — Government Basics',su:'Practise WAEC-style questions on meaning and scope of government.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC Government questions on meaning/scope: (1) Define government in all three senses. (2) Identify the specific aspect asked about. (3) Give examples from Nigeria. (4) Draw on theorists (Hobbes, Locke, Rousseau, Aristotle). (5) State relevance and lessons. Common questions: "What do you understand by government?" / "Explain the necessity of government" / "Distinguish between a state and a government."</p>'},
  {lb:'Key theorists to know',dr:dQ9,ht:'<p>WAEC regularly tests political theorists. Know: <b>Aristotle</b> (man is political animal; classification of governments). <b>Hobbes</b> (state of nature; Leviathan; surrender all rights). <b>Locke</b> (natural rights; limited government; right to revolt). <b>Rousseau</b> (general will; social contract; popular sovereignty). <b>Montesquieu</b> (separation of powers; checks and balances — influenced 1787 US Constitution). <b>Lincoln</b> (democracy = of the people, by the people, for the people).</p>'},
  {lb:'Nigeria-specific facts',dr:dQ9,ht:'<p>WAEC Nigeria Government facts: 36 states + FCT. 774 LGAs. National Assembly: 109 senators + 360 House members. 1999 Constitution (current). Presidential system since 1979. Exclusive List (federal only), Concurrent List (federal + state), Residual (state only). INEC conducts elections. Judiciary apex: Supreme Court. Federal character principle (s.14(3)). Nigeria\'s foreign policy: "Africa as centrepiece." ECOWAS/AU/UN membership.</p>'},
  {lb:'Common WAEC mistakes',dr:dQ9,ht:'<p>Avoid these errors: Defining government in only ONE sense (always give three). Confusing the state and government — state is permanent, government is temporary. Saying Nigeria has a parliamentary system (it has presidential since 1979). Saying the Senate has 360 members (House of Reps does). Confusing Hobbes (surrender ALL rights) with Locke (surrender SOME rights). Not giving examples from Nigeria when asked about government functions.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'WAEC expects you to define government in how many senses?',o:['One (the ruling group)','Two (institution and people)','Three (activity, institution, people)','Four (including sovereignty)'],a:3,w:'WAEC expects three senses: government as activity (governing), institution (the three arms) and people (the ruling group).'},{q:'Which philosopher is associated with "separation of powers" and influenced the US Constitution?',o:['Rousseau','Hobbes','Montesquieu','Locke'],a:3,w:'Montesquieu (The Spirit of the Laws, 1748) developed the doctrine of separation of powers, which heavily influenced the US Constitution of 1787.'},{q:'What is the WAEC-expected answer when asked to distinguish state from government?',o:['They are the same thing described differently','The state is permanent; government is temporary and changes','The state has more power than the government','The government creates the state'],a:2,w:'The key distinction: state is permanent/continuous; government is temporary and changes through elections or other means.'},{q:'Nigeria\'s current constitution was enacted in which year?',o:['1979','1989','1995','1999'],a:4,w:'Nigeria\'s current constitution is the 1999 Constitution, promulgated on 29 May 1999 at the transition to civilian rule.'},{q:'Which philosopher is most associated with the Social Contract theory alongside Hobbes and Locke?',o:['Jean-Jacques Rousseau','Karl Marx','Plato','Machiavelli'],a:1,w:'Jean-Jacques Rousseau is one of the key Social Contract theorists alongside Hobbes and Locke.'},{q:'For WAEC essays, what should students always do when naming a theory of government?',o:['Just name the theory','Explain the theory\'s key idea and name its main proponent(s)','List every theory without explanation','Avoid mentioning philosophers'],a:2,w:'WAEC awards marks for explaining a theory\'s key idea and correctly naming its proponents.'},{q:'What is the WAEC-expected definition of "sovereignty"?',o:['The supreme, final authority within a state','A type of election','A government ministry','A foreign policy tool'],a:1,w:'Sovereignty is defined as the supreme, final authority within a state.'},{q:'Which arm of government, according to WAEC syllabus, is responsible for law-making?',o:['The Legislature','The Executive','The Judiciary','The Civil Service'],a:1,w:'The Legislature is responsible for making laws.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Government \u2022 Elements',ti:'Mixed Questions — Meaning and Scope of Government',su:'Integrated revision across all GOV-ELE-01 topics.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Government: 3 senses (activity, institution, people). State: 4 elements (population, territory, government, sovereignty). Theories: Divine Right; Social Contract (Hobbes/Locke/Rousseau); Force; Evolutionary. Functions: law-making, order, services, defence, economy. Good governance: accountability, transparency, rule of law. Nigeria: federal, presidential, 1999 Constitution, 36 states, 774 LGAs, 109 senators, 360 Reps.</p>'},
  {lb:'Key quotes for WAEC essays',dr:dQ10,ht:'<p>Learn these for essays: Hobbes — "solitary, poor, nasty, brutish and short." Locke — government protects "life, liberty and property." Rousseau — the "general will." Lincoln — "government of the people, by the people, for the people." Aristotle — "man is by nature a political animal." Montesquieu — separation of powers prevents tyranny. WAEC awards marks for correctly attributing ideas to the right philosopher.</p>'},
  {lb:'Connecting concepts',dr:dQ10,ht:'<p>Key connections: Sovereignty → state → government → laws → order → development. Social contract → consent of governed → democracy → elections → accountability. Bad governance → corruption → poverty → instability → conflict. Good governance → accountability → development → human welfare → stability. Understanding these chains helps you answer WAEC questions that ask you to "explain the importance of" or "analyse the effects of."</p>'},
  {lb:'WAEC final tips',dr:dQ10,ht:'<p>Tips: Never say "government is the president" — give all three definitions. Know the difference between Hobbes, Locke and Rousseau\'s social contracts. In Nigeria-specific questions, use Nigerian examples (National Assembly not "parliament"; President not "Prime Minister"). Always give at least 5 points for WAEC essay questions. For 25-mark essays: introduction (define), body (5-7 points with examples), conclusion (significance/lessons).</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'The four elements of a state as defined by the Montevideo Convention are:',o:['President, parliament, courts, constitution','Population, territory, government, sovereignty','Citizens, borders, laws, elections','Rulers, subjects, army, taxes'],a:2,w:'Montevideo Convention (1933): population, territory, government and sovereignty — the four essential elements of a state.'},{q:'Which sense of government refers to the National Assembly, Executive and Judiciary?',o:['Government as activity','Government as people','Government as institution','Government as sovereignty'],a:3,w:'Government as institution refers to the three arms: Legislature (National Assembly), Executive (President/Cabinet) and Judiciary.'},{q:'Locke argued that government which violates the social contract can be:',o:['Forgiven if it apologises','Strengthened by the people','Overthrown/revolted against by the people','Ignored but not removed'],a:3,w:'Locke\'s key idea: government that breaks the social contract (violates natural rights) loses its legitimacy and the people may overthrow it.'},{q:'Nigeria\'s "federal character" principle ensures:',o:['Federal government is stronger than states','All regions and groups are fairly represented in government','Only northerners can be president','The president must speak all major languages'],a:2,w:'Federal character (s.14(3) of 1999 Constitution) requires that government appointments reflect Nigeria\'s diversity of states and ethnic groups.'},{q:'Which sense of government describes the specific ruling party/administration in power?',o:['Government as activity','Government as institution','Government as the people (ruling group)','Government as sovereignty'],a:3,w:'Government as "the people" refers to the specific ruling group currently in office.'},{q:'According to Montesquieu, why is separation of powers important?',o:['To make government slower','To prevent the concentration and abuse of power in one body','To reduce the number of laws','To eliminate the judiciary'],a:2,w:'Montesquieu argued separation of powers prevents the concentration and abuse of power.'},{q:'What is the key function of the Exclusive Legislative List in Nigeria\'s federal system?',o:['It lists matters only the federal government can legislate on','It lists matters only states can legislate on','It lists matters no government can touch','It lists international treaties only'],a:1,w:'The Exclusive List contains matters only the federal government has power to legislate on.'},{q:'Why is the concept of "sovereignty" central to defining a state?',o:['Because it determines a state\'s population size','Because it establishes the state\'s supreme authority, free from external control','Because it decides the state\'s official language','Because it fixes the state\'s borders permanently'],a:2,w:'Sovereignty establishes a state\'s supreme authority, independent of external control.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
