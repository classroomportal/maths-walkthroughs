<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}

var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Rule of Law — Key Principles',ACC,12,'middle',true));
[['Principle','Meaning'],['Supremacy of law','No one is above the law'],['Equality','All equal before the law'],['Constitutional rights','Rights from law, not govt favour'],['Legality','Can only punish for breach of law'],['Independent judiciary','Courts free from political pressure'],['Separation of powers','Arms check each other']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(110,46+i*32,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(330,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Democracy — Features and Types',ACC,12,'middle',true));
[['Feature/Type','Description'],['Popular sovereignty','People are the ultimate source of power'],['Free and fair elections','Regular; competitive; INEC independent'],['Fundamental rights','Speech, press, assembly protected by law'],['Rule of law','All — including rulers — subject to same law'],['Direct democracy','Citizens vote directly (referenda)'],['Representative','Citizens elect representatives (Nigeria, UK, USA)']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(130,46+i*32,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(340,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Rule of Law and Democracy — Summary',ACC,13,'middle',true));
[['Rule of law','Supremacy, equality, constitutional rights (Dicey 1885)'],['Democracy','Govt of/by/for the people (Lincoln 1863)'],['Direct democracy','Citizens vote directly (referenda, Athens 508 BC)'],['Representative','Elect reps to govern on their behalf (Nigeria)'],['Liberal democracy','Rights + elections + rule of law + separation of powers'],['Cleisthenes','Father of Athenian democracy (508 BC)'],['Nigeria','Federal republic; presidential; elections since 1999']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,9,'middle',true));o.push(T(320,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Government \u2022 Elements',ti:'The Rule of Law',su:'Define the rule of law and explain its three pillars.',steps:[
  {lb:'AV Dicey\'s rule of law',dr:dQ1,ht:'<p>A.V. Dicey (1835-1922), in <em>Introduction to the Study of the Law of the Constitution</em> (1885), identified the rule of law as a cornerstone of the English constitution. He gave three meanings: (1) Supremacy of law — no one can be punished except for a breach of law established in ordinary courts. (2) Equality before the law — everyone is subject to the same law; officials have no special immunity. (3) Constitutional law as the consequence of individual rights — in England, rights flow from court decisions, not from a written constitution.</p>'},
  {lb:'Supremacy of law',dr:dQ1,ht:'<p><b>First pillar — supremacy of law</b>: no person or institution is above the law. Government power must be based on law; officials must act within their legal authority. If a government official exceeds their legal power, they can be challenged in court. In Nigeria, this means: the President cannot act unconstitutionally even if he wants to; no one can be detained without legal authority. This pillar distinguishes constitutional government from tyranny and arbitrary rule by decree.</p>'},
  {lb:'Equality before the law',dr:dQ1,ht:'<p><b>Second pillar — equality</b>: all persons — whether president, minister, police officer or ordinary citizen — are subject to the same courts and the same law. No person has special immunity because of their position. Implications: Government officials who commit crimes can be prosecuted. Citizens can sue the government. Discrimination by the state is illegal (s.42 of Nigeria\'s 1999 Constitution). In practice, equality is often compromised by wealth and political power — but the principle stands.</p>'},
  {lb:'The rule of law vs military rule',dr:dQ1,ht:'<p>Nigeria\'s military periods (1966-79; 1983-99) provide the starkest contrast with rule of law: Military decrees overrode court decisions. Citizens were detained without trial. Special military tribunals replaced ordinary courts. Press was censored. Elections were suspended. The return to civilian rule in 1999 restored formal rule of law — though enforcement remains imperfect. The rule of law is not just about having courts — it requires courts to be genuinely independent and their decisions to be respected.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'AV Dicey identified how many pillars/meanings of the rule of law?',o:['2','3','4','5'],a:2,w:'Dicey identified three meanings: supremacy of law, equality before the law, and constitutional law as the consequence of individual rights.'},{q:'Dicey\'s second pillar means that in Nigeria, government officials:',o:['Are above the law as elected or appointed persons','Can be sued and prosecuted like ordinary citizens','Only answer to the President','Have immunity from prosecution while in office'],a:2,w:'Equality before the law means government officials are subject to the same courts and law as ordinary citizens.'},{q:'Which period in Nigeria\'s history MOST violated the rule of law?',o:['The First Republic (1960-66)','Military government periods (1966-79 and 1983-99)','The Second Republic (1979-83)','The Fourth Republic (1999-present)'],a:2,w:'Nigeria\'s military periods saw decrees override courts, detention without trial, and special military tribunals — all severe violations of the rule of law.'},{q:'Section 42 of Nigeria\'s 1999 Constitution (freedom from discrimination) expresses Dicey\'s:',o:['First pillar — supremacy of law','Second pillar — equality before the law','Third pillar — constitutional basis of rights','Separation of powers principle'],a:2,w:'S.42 (freedom from discrimination) is an expression of Dicey\'s second pillar — equality before the law, protecting all citizens regardless of ethnicity, sex or religion.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government \u2022 Elements',ti:'Democracy — Meaning and Origins',su:'Define democracy and trace its origins.',steps:[
  {lb:'Definition of democracy',dr:dQ2,ht:'<p><b>Democracy</b> (Greek: <em>demos</em> = people; <em>kratos</em> = rule) — literally "rule by the people." Abraham Lincoln\'s classic formulation (Gettysburg Address, 1863): "government of the people, by the people, for the people." Key elements: the people are the source of political authority (popular sovereignty); the people exercise this power directly or through elected representatives; government serves the people\'s interests. Democracy is contrasted with autocracy (rule by one) and oligarchy (rule by a few).</p>'},
  {lb:'Origins — Ancient Greece',dr:dQ2,ht:'<p>Democracy originated in ancient Athens (5th century BC) under Cleisthenes (508 BC — the "father of Athenian democracy") and Pericles. Athenian democracy was <b>direct</b> — all adult male citizens participated directly in the assembly that made laws. Limitation: women, slaves and foreigners were excluded — only about 10-20% of the population were full citizens. Despite limitations, Athens pioneered the democratic principle of citizen participation in governance.</p>'},
  {lb:'Modern representative democracy',dr:dQ2,ht:'<p>Modern democracies are primarily <b>representative</b> (indirect) — citizens elect representatives to govern on their behalf. Origins: English Parliament (Magna Carta 1215); US Constitution (1787); French Revolution (1789). The 19th-20th centuries saw gradual extension of the franchise: women\'s suffrage (UK 1918/1928; US 1920; Nigeria — women voted from independence 1960). Universal adult suffrage is now the democratic standard — all adult citizens have the right to vote.</p>'},
  {lb:'Democracy in Nigeria',dr:dQ2,ht:'<p>Nigeria\'s democratic experience: First Republic 1960-66 (civilian); Military 1966-79; Second Republic 1979-83 (civilian); Military 1983-99; Fourth Republic 1999-present (longest democratic period). Nigeria has successfully transferred power peacefully (2015: Buhari defeated Jonathan — first peaceful transfer between rival parties). Democracy is deepening but challenges remain: electoral fraud, money politics, insecurity.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Greek word "demos" (in democracy) means:',o:['Law','Rule','People','State'],a:3,w:'Democracy derives from Greek: demos (people) + kratos (rule) = rule by the people.'},{q:'Who is known as the "father of Athenian democracy" (508 BC)?',o:['Pericles','Aristotle','Cleisthenes','Socrates'],a:3,w:'Cleisthenes introduced democratic reforms in Athens around 508 BC — father of Athenian democracy.'},{q:'Lincoln\'s 1863 definition: "government of the people, by the people..."',o:['above the people','with the people','for the people','through the people'],a:3,w:'Lincoln\'s complete formulation: "government of the people, by the people, for the people."'},{q:'The first peaceful transfer of power between rival parties in Nigeria was in:',o:['1979','1999','2011','2015'],a:4,w:'In 2015, President Jonathan (PDP) conceded defeat to Buhari (APC) — Nigeria\'s first peaceful transfer to an opposition party.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government \u2022 Elements',ti:'Types of Democracy',su:'Distinguish between direct and representative democracy.',steps:[
  {lb:'Direct democracy',dr:dQ3,ht:'<p><b>Direct democracy</b>: citizens participate directly in making political decisions — no representatives. Forms: (1) <b>Referendum</b>: voters decide yes/no on a specific question (UK Brexit 2016; Swiss referenda are frequent). (2) <b>Initiative</b>: citizens petition to put a new law on the ballot. (3) <b>Recall</b>: citizens vote to remove an elected official before their term ends. (4) <b>Town meetings</b>: citizens gather to decide local issues (US New England). Athens (508 BC) is the classic ancient example of direct democracy.</p>'},
  {lb:'Representative (indirect) democracy',dr:dQ3,ht:'<p><b>Representative democracy</b>: citizens elect representatives who make decisions on their behalf. Most modern democracies use this form because direct democracy is impractical at large scale. Features: regular elections; multiple parties; accountability of representatives to voters; freedom of press and speech. Nigeria: President, 109 Senators, 360 Reps, 36 Governors all elected by citizens. This is the model used in Nigeria, UK, USA, Germany and most modern democracies.</p>'},
  {lb:'Liberal democracy',dr:dQ3,ht:'<p><b>Liberal democracy</b>: representative democracy PLUS constitutionally protected individual rights. Even if 99% vote to remove rights of 1%, a liberal democracy\'s constitution prevents it. Features: rule of law; independent judiciary; free press; protected minority rights; separation of powers; regular competitive elections. Nigeria (formally) is a liberal democracy. <b>Illiberal democracy</b>: elections occur but rights are suppressed (e.g. Hungary, Russia — elections exist but are not genuinely free).</p>'},
  {lb:'Social democracy',dr:dQ3,ht:'<p><b>Social democracy</b>: combines democracy with social welfare — the state provides extensive public services (healthcare, education, pensions) funded by progressive taxation. Examples: Nordic countries (Sweden, Norway, Denmark). Social democracies have market economies but with strong welfare states. Nigeria debates aspects of social democracy (free education, national health insurance). The 1999 Constitution\'s Chapter II (Fundamental Objectives) echoes social democratic ideals — though not justiciable in court.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'A national REFERENDUM is an example of:',o:['Representative democracy','Social democracy','Direct democracy','Liberal democracy'],a:3,w:'A referendum is direct democracy — citizens vote directly on a specific question (e.g. Brexit 2016) rather than electing representatives to decide.'},{q:'Nigeria\'s democratic system is best described as:',o:['Direct democracy','Social democracy','Liberal representative democracy','Theocracy'],a:3,w:'Nigeria operates a liberal representative democracy — citizens elect representatives; rights are constitutionally protected (Chapter IV); elections are regular.'},{q:'An "illiberal democracy" is one where:',o:['Elections occur but individual rights are suppressed and institutions are not genuinely free','There are no elections at all','The state provides extensive welfare services','Only property owners can vote'],a:1,w:'Illiberal democracy: elections occur (giving a democratic label) but civil liberties are curtailed, courts are not independent, and the press is not free.'},{q:'Social democracy is best exemplified by which countries?',o:['USA and Nigeria','Saudi Arabia and Iran','Nordic countries (Sweden, Norway, Denmark)','China and Russia'],a:3,w:'Nordic countries — Sweden, Norway, Denmark — are the classic examples of social democracy: market economy + extensive publicly funded welfare state.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government \u2022 Elements',ti:'Features and Merits of Democracy',su:'Identify the features and evaluate the merits of democracy.',steps:[
  {lb:'Key features of democracy',dr:dQ4,ht:'<p>Features of democracy: (1) <b>Popular sovereignty</b> — people are the source of all political authority. (2) <b>Regular free and fair elections</b> — competitive, periodic, universal suffrage. (3) <b>Fundamental human rights</b> — speech, press, assembly, religion protected. (4) <b>Rule of law</b> — all subject to the same law. (5) <b>Majority rule with minority rights</b> — majority decides; minority is protected. (6) <b>Separation of powers</b> — executive, legislature, judiciary independent. (7) <b>Free press and civil society</b> — check on government. (8) <b>Peaceful transfer of power</b> — through elections.</p>'},
  {lb:'Merits of democracy',dr:dQ4,ht:'<p>Merits: (1) Promotes freedom and human dignity. (2) Government is accountable — can be voted out. (3) Peaceful resolution of political disputes. (4) Diverse views represented. (5) Protects minority rights (in liberal form). (6) Associated with economic development and openness to investment. (7) Rule of law creates predictability for business and social life. (8) Prevents concentration of power and tyranny. Winston Churchill: "Democracy is the worst form of government, except for all those other forms that have been tried."</p>'},
  {lb:'Demerits of democracy',dr:dQ4,ht:'<p>Demerits: (1) Slow decision-making — consensus and debate take time. (2) Expensive — campaigns, elections, legislative processes. (3) Can be manipulated by money and media. (4) Majority may oppress minority (tyranny of majority). (5) Short-termism — politicians focus on next election, not long-term planning. (6) Voter apathy and low turnout undermine legitimacy. (7) Vulnerable to demagoguery. Plato critiqued democracy for these reasons, preferring rule by philosopher-kings.</p>'},
  {lb:'Conditions for successful democracy',dr:dQ4,ht:'<p>For democracy to work: (1) Independent judiciary and rule of law. (2) Free and independent press. (3) Educated, engaged citizenry. (4) Strong civil society (NGOs, trade unions, religious bodies). (5) Credible electoral commission (Nigeria\'s INEC). (6) Political parties that compete fairly. (7) Peaceful military. (8) Economic development reduces desperation. Nigeria\'s democracy is challenged by: weak institutions, electoral fraud, money politics, ethnic voting, insecurity, and corruption.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'Churchill\'s famous quote about democracy:',o:['Democracy is the perfect form of government','Democracy is the worst form of government, except for all those other forms tried','Democracy always leads to prosperity','Democracy requires educated citizens to work'],a:2,w:'Churchill: "Democracy is the worst form of government, except for all those other forms that have been tried from time to time."'},{q:'Which philosopher CRITICISED democracy, preferring "philosopher-kings" as rulers?',o:['Aristotle','Locke','Plato','Rousseau'],a:3,w:'Plato (in The Republic) criticised democracy as the rule of the ignorant masses, preferring wise philosopher-kings trained in virtue and knowledge.'},{q:'Popular sovereignty means:',o:['The most popular politician is always right','The people are the ultimate source of political authority','Sovereignty belongs to the UN','Decisions are made by the most educated'],a:2,w:'Popular sovereignty: the people (not kings, not God) are the ultimate source of all political authority in a democracy.'},{q:'A major DEMERIT of democracy is:',o:['Leaders are always accountable','Decision-making is slow due to consultation and debate','Rights are always perfectly protected','Elections are always free and fair'],a:2,w:'Slow decision-making is a genuine demerit — democracy requires consensus, debate and procedural steps that authoritarian systems bypass quickly.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government \u2022 Elements',ti:'Democracy in Nigeria',su:'Assess the practice of democracy in Nigeria since 1999.',steps:[
  {lb:'Nigeria\'s democratic journey',dr:dQ5,ht:'<p>Nigeria returned to democracy on 29 May 1999 (Fourth Republic) after 16 years of military rule. Key milestones: 1999 — Obasanjo elected; 2003 — Obasanjo re-elected; 2007 — Yar\'Adua elected; 2010 — Jonathan sworn in after Yar\'Adua\'s death; 2011 — Jonathan elected; 2015 — Buhari elected, Jonathan concedes (landmark); 2019 — Buhari re-elected; 2023 — Tinubu elected (contested in courts). Nigeria has had 24+ years of continuous civilian rule — a historic achievement for a country that spent much of its post-independence history under military rule.</p>'},
  {lb:'INEC and elections',dr:dQ5,ht:'<p>The <b>Independent National Electoral Commission (INEC)</b> conducts Nigeria\'s federal elections every 4 years. Challenges: electoral violence, ballot box stuffing, voter intimidation, results manipulation. Improvements: biometric voter registration (PVC — Permanent Voter Card), BVAS (Bimodal Voter Accreditation System, 2023) to prevent multiple voting, IREV (Results Viewing Portal) for transparency. Nigeria\'s elections are imperfect but improving. The 2023 IREV data controversy showed both the progress and ongoing challenges.</p>'},
  {lb:'Achievements of Nigeria\'s democracy',dr:dQ5,ht:'<p>Achievements since 1999: (1) Longest uninterrupted civilian rule in Nigeria\'s history. (2) Two peaceful transfers of power (2007 Obasanjo→Yar\'Adua; 2015 Jonathan→Buhari). (3) Growth of civil society and free press. (4) More assertive legislature. (5) Anti-corruption institutions (EFCC, ICPC) established. (6) Some economic growth. (7) National Human Rights Commission active. Democracy has delivered more than military rule, despite its failures in electoral integrity and governance quality.</p>'},
  {lb:'Challenges facing Nigerian democracy',dr:dQ5,ht:'<p>Challenges: (1) <b>Electoral fraud</b>: manipulation, violence, vote buying. (2) <b>Money politics</b>: only the wealthy can contest. (3) <b>Insecurity</b>: Boko Haram, banditry, IPOB. (4) <b>Corruption</b>: EFCC conviction rate low; political impunity. (5) <b>Ethnic and religious voting</b>: identity overrides performance. (6) <b>Executive dominance</b>: legislature and judiciary not fully independent. (7) <b>Poverty</b>: Nigeria has the world\'s largest extreme poor population. Democracy cannot be consolidated without addressing basic welfare.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'INEC stands for:',o:['International Nigerian Electoral Commission','Independent National Electoral Commission','Independent National Electoral Corporation','International National Electoral Committee'],a:2,w:'INEC — Independent National Electoral Commission — conducts presidential and National Assembly elections in Nigeria.'},{q:'The BVAS (Bimodal Voter Accreditation System) was introduced to:',o:['Speed up new voter registration','Prevent multiple voting and accreditation fraud','Conduct online voting from home','Count votes faster'],a:2,w:'BVAS was introduced for the 2023 elections to prevent ballot stuffing and multiple voting by electronically verifying voters\' biometrics.'},{q:'Nigeria\'s landmark 2015 election was significant because:',o:['It was the first election ever in Nigeria','It was the first time a sitting president was defeated and peacefully handed power to an opposition candidate','INEC declared results within 24 hours','No electoral violence occurred anywhere'],a:2,w:'2015: Jonathan (PDP) conceded to Buhari (APC) — Nigeria\'s first peaceful transfer of power between rival parties.'},{q:'Which of these is a CHALLENGE to consolidating democracy in Nigeria?',o:['A growing youth population','An independent press','Electoral fraud and vote buying','The existence of multiple political parties'],a:3,w:'Electoral fraud and vote buying undermine democratic legitimacy — votes are purchased rather than earned through good governance.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government \u2022 Elements',ti:'Electoral Systems',su:'Compare FPTP and proportional representation.',steps:[
  {lb:'First-past-the-post (FPTP)',dr:dQ6,ht:'<p><b>FPTP</b>: the candidate with the most votes wins, even if less than 50%. Used in: UK, USA, Canada, India, Nigeria (for National Assembly). Merits: simple; produces clear winners; strong constituency link. Demerits: votes for losing candidates are "wasted"; minority parties underrepresented; can produce a government with a minority of votes. Nigeria\'s presidential election adds a threshold to make it national: the winner must also get 25% in at least 24 of 36 states.</p>'},
  {lb:'Proportional Representation (PR)',dr:dQ6,ht:'<p><b>PR</b>: seats allocated in proportion to votes received. If a party gets 30% of votes, it gets about 30% of seats. Types: Party List (Germany, Israel); Single Transferable Vote (Ireland, Malta). Merits: more accurate representation; fewer wasted votes; minority parties represented. Demerits: complex; often produces coalition governments that can be unstable; weak constituency link. Many African democracies use PR (South Africa, Kenya).</p>'},
  {lb:'Nigeria\'s electoral system',dr:dQ6,ht:'<p>Nigeria uses modified FPTP: Presidential election — winner needs the highest votes AND at least 25% in at least 24 of 36 states (+ FCT) — ensuring national support. If no candidate meets this threshold, a run-off occurs. National Assembly: FPTP — candidate with most votes wins in each constituency. The 25%+24-states threshold was controversial in 2023 (contested in courts). Electoral Act 2022 introduced electronic transmission of results via IREV portal.</p>'},
  {lb:'INEC and the electoral process',dr:dQ6,ht:'<p>Nigeria\'s electoral process: Voter registration → Constituency delimitation → Party registration → Campaign → Voting (PVCs + BVAS) → Collation → Declaration → Tribunal (if disputed). INEC is an independent constitutional body (s.153 of 1999 Constitution). The Electoral Act 2022 allows electronic transmission of results — a major reform. Improvements needed: reducing electoral violence; separating elections from excessive money; ensuring INEC staff neutrality; faster tribunal resolution.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'In Nigeria\'s presidential election, the winner must get 25% in at least how many states?',o:['12 states','18 states','24 states (two-thirds of 36)','36 states (all)'],a:3,w:'Nigeria\'s constitution requires a presidential winner to have the highest votes plus at least 25% in at least 24 of 36 states (two-thirds) plus FCT.'},{q:'Which electoral system is used for Nigeria\'s National Assembly elections?',o:['Proportional Representation','Single Transferable Vote','First-past-the-post (highest votes wins)','Run-off if no majority'],a:3,w:'Nigeria uses FPTP for National Assembly elections — the candidate with the highest number of votes in each constituency wins.'},{q:'A MERIT of Proportional Representation is:',o:['It always produces a single-party government','Parties get seats proportional to their vote share — fewer wasted votes','It creates a strong constituency link between MP and voters','It is simpler than FPTP to understand'],a:2,w:'PR\'s main merit: parties get seats proportional to their vote share, meaning fewer wasted votes and more accurate representation of voters\' preferences.'},{q:'The Electoral Act 2022 was significant in Nigeria because it:',o:['Reduced the voting age to 16','Created INEC','Allowed electronic transmission of election results (IREV)','Banned all independent candidacy'],a:3,w:'The Electoral Act 2022 provided for electronic transmission of results — leading to the IREV portal used in the 2023 elections for result transparency.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government \u2022 Elements',ti:'Political Parties and Democracy',su:'Explain the role of political parties in a democracy.',steps:[
  {lb:'Definition and importance of political parties',dr:dQ7,ht:'<p>A <b>political party</b> is an organised group of people with shared political beliefs who seek to win government power through elections. Parties are essential to modern democracy: (1) They aggregate citizens\' diverse interests into coherent policies. (2) They provide candidates for election. (3) They form governments (or opposition). (4) They organise and mobilise voters. (5) They hold the government accountable. Without parties, elections would be chaotic and incoherent.</p>'},
  {lb:'Types of party systems',dr:dQ7,ht:'<p>(1) <b>One-party system</b>: only one legal party — authoritarian (North Korea, China). Not democratic. (2) <b>Two-party system</b>: two dominant parties alternate in power (USA — Republicans/Democrats; UK — Conservative/Labour). Stable but may squeeze out minority views. (3) <b>Multi-party system</b>: many parties compete; often leads to coalition governments (Germany, Nigeria). Broader representation but potential instability. Nigeria has many parties but has been dominated by APC and PDP since 2015.</p>'},
  {lb:'Political parties in Nigeria',dr:dQ7,ht:'<p>Nigeria\'s key parties: <b>PDP</b> (People\'s Democratic Party — ruled 1999-2015; 16 years; now main opposition). <b>APC</b> (All Progressives Congress — formed 2013 from merger of four parties; won 2015, 2019, 2023). Other parties: Labour Party (Peter Obi 2023 — significant showing), APGA (popular in South-East). Nigeria has 18 registered parties. Money politics and cross-carpeting (politicians switching parties) weaken ideological coherence. Parties are more personality-driven than policy-driven.</p>'},
  {lb:'Functions of opposition parties',dr:dQ7,ht:'<p>In a democracy, the opposition is as important as the government. Opposition parties: (1) Scrutinise and criticise government policies. (2) Hold the government accountable for failures. (3) Propose alternative policies. (4) Act as "government in waiting." (5) Represent citizens who voted against the government. Without an effective opposition, democracy degenerates into one-party rule. Nigeria\'s challenge: PDP has been weakened by defections; but media, civil society and Labour Party provide some accountability.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'Nigeria\'s ruling party since 2015 is:',o:['PDP (People\'s Democratic Party)','APC (All Progressives Congress)','Labour Party','APGA'],a:2,w:'APC (All Progressives Congress) won the 2015, 2019 and 2023 presidential elections.'},{q:'A one-party system is NOT democratic because:',o:['It produces stable government','There is no choice at elections — citizens cannot vote the ruling party out','It is only used in communist countries','It prevents corruption'],a:2,w:'Democracy requires competition and the possibility of removal from power. A one-party state denies citizens this ability.'},{q:'The APC was formed in 2013 as a merger of how many political parties?',o:['Two','Three','Four','Five'],a:3,w:'The APC was formed in 2013 from a merger of four parties: ACN, CPC, ANPP, and a faction of APGA.'},{q:'Cross-carpeting (politicians switching parties) weakens Nigerian democracy because:',o:['It creates more political parties','It violates the constitution','It shows parties are driven by personalities rather than ideology','It reduces the number of candidates'],a:3,w:'Cross-carpeting shows Nigerian parties are personal vehicles rather than ideological movements — weakening programmatic politics.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government \u2022 Elements',ti:'Human Rights and Democracy',su:'Explain the relationship between human rights and democracy.',steps:[
  {lb:'Rights as the foundation of democracy',dr:dQ8,ht:'<p>Democracy and human rights are inseparable: (1) <b>Freedom of expression</b>: citizens must be free to criticise government; press must be free. (2) <b>Freedom of assembly</b>: citizens must be free to organise, protest, and campaign. (3) <b>Freedom of association</b>: citizens must be free to form and join political parties. (4) <b>Rule of law</b>: equal treatment prevents powerful individuals from suppressing opposition. Without these rights, "elections" are meaningless performances — as in authoritarian states like Russia and Belarus.</p>'},
  {lb:'Threats to rights in Nigerian democracy',dr:dQ8,ht:'<p>Threats to rights in Nigeria: (1) <b>#EndSARS</b> (2020) — police brutality, Lekki toll gate shooting. (2) <b>Press freedom</b> — journalists arrested, critical outlets harrassed. (3) <b>Freedom of assembly</b> — protests sometimes violently dispersed. (4) <b>Ethnic discrimination</b> — despite s.42. (5) <b>Detention without trial</b> — DSS detentions. (6) <b>Twitter/X banned</b> 2021 for 7 months by Buhari government (freedom of expression). (7) <b>Corruption in courts</b> — justice delayed/denied. Yet rights have improved since the military era.</p>'},
  {lb:'Civil society and media',dr:dQ8,ht:'<p><b>Civil society</b> and <b>independent media</b> are essential pillars of democracy: They monitor government. They amplify citizens\' voices. They hold officials accountable. In Nigeria: NLC (Nigerian Labour Congress) — workers\' rights; The Punch, Channels TV, TheCable — press scrutiny; Enough is Enough, Yiaga Africa, BudgIT — civil society accountability groups. Social media (Twitter/X, YouTube) has enabled citizen journalism and mass mobilisation (e.g. #EndSARS was largely organised and documented via social media).</p>'},
  {lb:'ECOWAS and African democracy',dr:dQ8,ht:'<p>ECOWAS has been more decisive on democracy than the AU: sanctions against Niger, Mali, Guinea and Burkina Faso after coups (2020-23). Nigeria plays a key role in promoting democracy in West Africa — hosting exiled governments, leading ECOWAS mediation. The AU Charter on Democracy, Elections and Governance (2007) commits member states to democratic governance. Yet Nigeria\'s own democratic deficiencies (electoral fraud, money politics) limit its moral authority as a democracy promoter.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'The #EndSARS protests of 2020 primarily protested against:',o:['Freedom of religion violations','Right to education violations','Police brutality and extortion (SARS violations of dignity and liberty)','Right to vote violations'],a:3,w:'#EndSARS protested against police brutality by SARS — violations of the right to dignity (s.34) and personal liberty (s.35) of the 1999 Constitution.'},{q:'Buhari\'s 2021 Twitter/X ban violated which fundamental right?',o:['Freedom of movement','Freedom of expression and information','Right to fair hearing','Freedom of religion'],a:2,w:'Banning Twitter violated freedom of expression (s.39 of the 1999 Constitution) and international norms of internet freedom.'},{q:'ECOWAS responded to coups in Niger, Mali and Burkina Faso (2020-23) by:',o:['Recognising the coup governments','Imposing sanctions and threatening military intervention','Ignoring the coups','Inviting coup leaders to join ECOWAS leadership'],a:2,w:'ECOWAS imposed sanctions and debated military intervention — asserting that unconstitutional changes of government are unacceptable under the AU Charter on Democracy.'},{q:'BudgIT, Yiaga Africa and Enough is Enough are:',o:['Nigerian political parties','International donor organisations','Nigerian civil society organisations promoting accountability and democratic participation','INEC sub-commissions'],a:3,w:'These are Nigerian civil society organisations: BudgIT tracks government budgets; Yiaga Africa monitors elections; Enough is Enough promotes civic engagement.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government \u2022 Elements',ti:'WAEC Prep — Rule of Law and Democracy',su:'Practise WAEC-style questions on rule of law and democracy.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions on rule of law and democracy: (1) Define clearly (Dicey for rule of law; Lincoln/Greeks for democracy). (2) State features/pillars. (3) Give types (direct vs representative; liberal vs social). (4) Apply to Nigeria with examples. (5) Evaluate merits and demerits. (6) Draw lessons. Common questions: "Discuss the rule of law and its application in Nigeria." / "What are the features of a democratic government?" / "Assess the practice of democracy in Nigeria since 1999."</p>'},
  {lb:'Key facts for WAEC',dr:dQ9,ht:'<p>WAEC fact bank: AV Dicey — rule of law; 3 pillars (supremacy, equality, constitutional rights). Democracy: Lincoln 1863 — "of/by/for the people." Greek: demos + kratos. Cleisthenes 508 BC — father of Athenian democracy. Direct vs representative democracy. Nigeria: Fourth Republic 1999-present; INEC; PVC; BVAS; 2015 landmark transfer. APC (ruling since 2015); PDP (ruling 1999-2015). Nigeria\'s threshold: 25% in 24 states. Electoral Act 2022 (IREV). #EndSARS 2020.</p>'},
  {lb:'Comparing rule of law and democracy',dr:dQ9,ht:'<p>Rule of law and democracy reinforce each other: democracy needs rule of law to function (without law, election results can be ignored); rule of law is more robust in democracies (citizens can challenge government; press can expose abuses). WAEC comparison: Rule of law = legal principle (law is supreme; equality; rights). Democracy = political system (sovereignty; elections; representation). They are different concepts but complementary — and WAEC sometimes asks you to explain how they are connected.</p>'},
  {lb:'Common WAEC mistakes',dr:dQ9,ht:'<p>Avoid: Saying democracy just means elections (it requires rights, rule of law, free press too). Confusing Plato (critic of democracy) with Aristotle (moderate supporter). Saying Dicey was Nigerian (he was British, writing in 1885). Saying Nigeria has perfect rule of law (it has formal rule of law with many practical violations). Saying the PDP has always ruled Nigeria (PDP: 1999-2015; APC: 2015-present). Not giving Nigerian-specific examples when asked about democracy in practice.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'Dicey\'s third pillar of the rule of law says that individual rights are:',o:['Given by the government as a privilege','The result of judicial decisions, not constitutional grants','Absolute and unlimited in all circumstances','Subject to military override in emergencies'],a:2,w:'Dicey\'s third pillar: in England, constitutional law is the consequence of ordinary rights as declared by courts — not from a written constitution granting them from above.'},{q:'Direct democracy differs from representative democracy in that:',o:['Direct democracy only exists in large countries','In direct democracy, citizens make decisions themselves (referenda, initiatives) rather than electing representatives','Direct democracy always produces better outcomes','Direct democracy is used in Nigeria for all major decisions'],a:2,w:'Direct democracy: citizens vote on decisions themselves. Representative democracy: citizens elect representatives to make decisions on their behalf.'},{q:'Nigeria\'s PDP ruled from 1999. When did APC first win power?',o:['2011','2013','2015','2019'],a:3,w:'APC first won the Nigerian presidency in 2015 when Buhari defeated Jonathan (PDP) — the first peaceful transfer of power to an opposition party.'},{q:'AV Dicey wrote his famous analysis of the rule of law in:',o:['The Leviathan','The Social Contract','The Republic','Introduction to the Study of the Law of the Constitution (1885)'],a:4,w:'AV Dicey\'s Introduction to the Study of the Law of the Constitution (1885) is where he identified the three meanings of the rule of law.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Government \u2022 Elements',ti:'Mixed Questions — Rule of Law and Democracy',su:'Integrated revision across rule of law and democracy.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Rule of law (Dicey 1885): supremacy of law; equality before law; constitutional basis of rights. Democracy: demos+kratos; Lincoln — of/by/for the people; Cleisthenes 508 BC; direct (referenda) vs representative (Nigeria/UK/USA); liberal (rights+elections), social (welfare state). Nigeria\'s democracy: 1999-present; INEC; PVC/BVAS/IREV; 2015 landmark; APC 2015-. Electoral system: modified FPTP; 25% in 24 states for president. Parties: APC (ruling), PDP (main opposition). Threats: corruption, electoral fraud, insecurity, money politics.</p>'},
  {lb:'Key references',dr:dQ10,ht:'<p>WAEC references: Dicey 1885 — rule of law. Lincoln 1863 — Gettysburg Address. Cleisthenes 508 BC — Athenian democracy. Plato (critic). Churchill — "worst form except all others tried." Nigeria: 1999 Constitution s.1(1) (supremacy), Chapter IV (rights). INEC (s.153). Electoral Act 2022 (IREV). 2015 — first peaceful opposition transfer. #EndSARS 2020. ECOWAS coups 2020-23. AU Charter on Democracy 2007.</p>'},
  {lb:'Connecting rule of law, democracy and rights',dr:dQ10,ht:'<p>The three concepts form a triangle: RULE OF LAW ensures no one is above the law — government cannot ignore election results or court decisions. DEMOCRACY ensures government reflects the people\'s will — elections determine who governs. HUMAN RIGHTS ensure citizens are free to participate — without rights, "elections" are meaningless. Each depends on the others. Nigeria\'s challenges: weak rule of law undermines election results; money politics undermines democratic legitimacy; violated rights chill democratic participation.</p>'},
  {lb:'WAEC final tips',dr:dQ10,ht:'<p>Final revision tips: Never say democracy = just elections. Always give Dicey\'s three pillars, not just "the law rules." Use Nigerian examples for every principle (INEC for elections; s.42 for equality; EFCC for accountability; 2015 for peaceful transfer). Know the difference between direct and representative democracy. Know Churchill\'s quote and why Plato criticised democracy. For 25-mark essays: at least 5 substantive points with examples. State the point → explain it → apply to Nigeria → evaluate.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Dicey\'s first pillar (supremacy of law) says:',o:['Equality means all citizens pay equal taxes','Constitutional rights cannot be amended','No person can be punished except for a breach of law established in ordinary courts','Separation of powers prevents any arm from becoming supreme'],a:3,w:'Dicey\'s first pillar (supremacy of law): no person can be punished arbitrarily — only for a distinct breach of law established in ordinary courts.'},{q:'The Greek roots of "democracy" translate as:',o:['Good governance','People\'s law','Rule by the people (demos = people, kratos = rule)','Power of the state'],a:3,w:'Democracy: demos (people) + kratos (rule) = rule by the people.'},{q:'Nigeria\'s 25%-in-24-states presidential threshold ensures:',o:['The election is cheaper to run','The president has genuinely national support across regions, not just one area','It was demanded by the opposition parties','It reduces the number of candidates'],a:2,w:'The 25%-in-24-states threshold ensures the president has spread of support across Nigeria\'s diverse regions — preventing a candidate who wins only one region from becoming president.'},{q:'The #EndSARS movement of 2020 showed:',o:['Perfect protection of citizens\' rights in Nigeria','Active civil society that can mobilise millions to demand accountability','A government that always respects protesters\' rights','A police force with no history of excess force'],a:2,w:'#EndSARS demonstrated Nigeria\'s vibrant civil society and social media-mobilised democracy — millions demanded police reform, showing democratic accountability from below.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
