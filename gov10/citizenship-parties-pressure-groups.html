<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Citizenship — Key Concepts',ACC,12,'middle',true));
var rows=[['Citizenship','Legal membership of a state; bundle of rights and duties'],['Natural-born','Acquired by birth (jus soli — place; jus sanguinis — parentage)'],['Naturalisation','Acquiring citizenship through application after meeting conditions'],['Rights','Privileges belonging to citizens: vote, hold office, passport'],['Duties','Obligations of citizens: pay tax, obey laws, defend the state'],['Dual citizenship','Holding citizenship of two countries simultaneously']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(120,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Rights and Duties of Citizens',ACC,12,'middle',true));
var rows=[['Right to vote','Elect representatives in free and fair elections'],['Right to hold office','Stand for election; serve in government'],['Right to a passport','Travel document; consular protection abroad'],['Duty to pay tax','Fund government services for the public good'],['Duty to obey laws','Respect the legal order of the state'],['Duty to defend the state','Military/national service when called upon'],['Duty to vote','Civic responsibility to participate in democracy']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,28+i*30,460,24,CRM,LINE,1));o.push(T(130,42+i*30,r[0],ACC,8,'middle',true));o.push(T(320,42+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Citizenship — Summary',ACC,13,'middle',true));
var rows=[['Jus soli','Right of the soil — citizenship by place of birth'],['Jus sanguinis','Right of blood — citizenship by parentage'],['Naturalisation','Citizenship by application; must meet stated conditions'],['Rights','Vote, hold office, passport, equal protection, welfare'],['Duties','Obey laws, pay tax, defend state, vote, public service'],['Nigeria','1999 Constitution Chapter III: citizenship by birth, descent, registration or naturalisation']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(100,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Gov \u2022 ELE',ti:'Meaning and Types of Citizenship',su:'Define citizenship and explain how it is acquired.',steps:[
{lb:'What is citizenship?',dr:dQ1,ht:'<p>Citizenship is the legal status of being a member of a state. A citizen has a defined set of <b>rights</b> (entitlements from the state) and <b>duties</b> (obligations to the state). Citizenship is different from residency (living in a country) and nationality (broader cultural/ethnic identity). T.H. Marshall (1950) identified three elements of citizenship: (1) Civil rights — freedom of speech, assembly, rule of law. (2) Political rights — right to vote and hold office. (3) Social rights — right to education, welfare, healthcare. Full citizenship integrates all three elements.</p>'},
{lb:'Methods of acquiring citizenship',dr:dQ2,ht:'<p>Citizenship can be acquired by: (1) <b>Birth — Jus Soli</b> ("right of the soil") — citizenship granted to anyone born within the country\'s territory (USA, Canada apply this). (2) <b>Birth — Jus Sanguinis</b> ("right of blood") — citizenship acquired through one or both parents\' citizenship regardless of place of birth (Nigeria, UK for first generation). (3) <b>Naturalisation</b> — a foreigner applies to become a citizen after meeting conditions (period of residence, language, oath, good character). (4) <b>Registration</b> — certain categories automatically entitled (e.g. spouses; children born abroad). (5) <b>Honour</b> — honorary citizenship for distinguished persons.</p>'},
{lb:'Nigerian citizenship (1999 Constitution, Chapter III)',dr:dQ1,ht:'<p>Nigeria\'s 1999 Constitution (Chapter III, Sections 25-32) provides for citizenship by: (1) Birth — person born in Nigeria whose parents are Nigerian citizens. (2) Descent — person born outside Nigeria to a Nigerian parent. (3) Registration — women who marry Nigerian citizens; children born outside Nigeria registered before age 21. (4) Naturalisation — Section 27 — must have lived in Nigeria for 15 of the 20 years immediately preceding application, be of good character, intend to remain, renounce former citizenship. Honorary citizenship can also be granted. Note: Nigeria does not generally recognise dual citizenship by law, though many Nigerians hold it informally.</p>'},
{lb:'Rights and duties of citizens',dr:dQ2,ht:'<p>Rights of citizens: Right to vote and hold public office. Right to a Nigerian passport and consular protection abroad. Right to live and work anywhere in Nigeria. Equal protection of the law. Access to government welfare services. Duties of citizens: Obey the laws of the federation. Pay taxes honestly. Defend the state when called upon (national service). Vote in elections (civic duty, though voting is not legally compulsory in Nigeria). Participate in community development. Declare assets honestly when required. The relationship between rights and duties is reciprocal: the state provides rights; the citizen owes duties in return.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Citizenship acquired by being born within the territory of a country is called:',o:['Jus sanguinis (right of blood)','Jus soli (right of the soil)','Naturalisation','Honorary citizenship'],a:2,w:'Jus soli (Latin: right of the soil) — citizenship granted because of the place of birth within the country\'s territory. USA and Canada strongly apply this principle.'},{q:'A foreigner who applies to become a citizen after living in a country for a required period is acquiring citizenship by:',o:['Jus soli','Jus sanguinis','Naturalisation','Registration'],a:3,w:'Naturalisation — the process by which a foreigner applies and is granted citizenship after meeting conditions set by the state (period of residence, oath, language, good character, renunciation of former citizenship).'},{q:'Nigeria\'s constitution requires that a person applying for naturalisation must have lived in Nigeria for how many years (out of 20)?',o:['5 years out of the last 10','10 years out of the last 15','15 years out of the last 20','All 20 of the last 20 years'],a:3,w:'Section 27 of the 1999 Constitution requires 15 years of residence in Nigeria within the 20 years immediately before application for naturalisation — the most demanding requirement.'},{q:'T.H. Marshall identified three elements of citizenship. Which correctly identifies all three?',o:['Civil, political and economic rights','Civil, political and social rights','Natural, legal and civic rights','Fundamental, derivative and honorary rights'],a:2,w:'T.H. Marshall (1950) identified: civil rights (freedom, rule of law), political rights (vote and hold office) and social rights (education, welfare, healthcare) as the three elements of full citizenship.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Gov \u2022 ELE',ti:'Rights and Duties of Citizens',su:'Examine the rights and duties of citizens in a democratic state.',steps:[
{lb:'Fundamental rights in Nigeria',dr:dQ2,ht:'<p>Nigeria\'s 1999 Constitution Chapter IV (Sections 33-46) guarantees Fundamental Rights: Right to life (s.33). Right to dignity of the human person (s.34). Right to personal liberty (s.35). Right to fair hearing (s.36). Right to private and family life (s.37). Right to freedom of thought, conscience and religion (s.38). Right to freedom of expression and the press (s.39). Right to peaceful assembly and association (s.40). Right to freedom of movement (s.41). Right to freedom from discrimination (s.42). These rights are enforceable in court. They can be limited only in specific circumstances prescribed by law.</p>'},
{lb:'Political rights',dr:dQ1,ht:'<p>Political rights of citizens: (1) Right to vote in free and fair elections. (2) Right to stand for election (subject to qualification requirements). (3) Right to join political parties. (4) Right to contest election results through the courts. (5) Right to participate in government through public service. These rights distinguish full citizens from mere residents or subjects. In Nigeria, voting is open to citizens aged 18 and above registered with INEC. The right to stand for election is subject to additional requirements: age (35 for president); educational qualifications; residency; party membership.</p>'},
{lb:'Duties of citizens',dr:dQ2,ht:'<p>Duties of citizens (Chapter II of Nigeria\'s 1999 Constitution — though these are Fundamental Objectives, not enforceable rights): (1) Respect the constitution and its ideals. (2) Participate actively in the community. (3) Render civic duties (jury service, national youth service). (4) Declare assets honestly. (5) Pay taxes honestly and promptly. (6) Protect public property. (7) Defend Nigeria. (8) Foster national unity. Note: Section 24 — Every citizen has the duty to abide by the Constitution; respect the dignity of other citizens; make positive and useful contributions to the advancement of the country.</p>'},
{lb:'Rights vs duties — the balance',dr:dQ1,ht:'<p>Rights and duties are two sides of the same coin: Rights without duties lead to irresponsibility — a citizen who demands rights but evades taxes or disobeys laws undermines the state that provides the rights. Duties without rights lead to oppression — the state that demands obedience but gives citizens no rights is tyrannical. The social contract (Rousseau, Locke, Hobbes) suggests: citizens give up some freedoms and accept duties; the state guarantees rights in return. Active citizenship — going beyond minimum compliance to actively participate in community and public life — is the ideal in a healthy democracy.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Nigeria\'s Fundamental Rights are found in which chapter of the 1999 Constitution?',o:['Chapter I (General Provisions)','Chapter II (Fundamental Objectives)','Chapter III (Citizenship)','Chapter IV (Fundamental Rights — Sections 33-46)'],a:4,w:'Chapter IV of Nigeria\'s 1999 Constitution (Sections 33-46) contains the Fundamental Rights. These are justiciable (enforceable in court). Chapter II contains Fundamental Objectives, which are not directly enforceable.'},{q:'The minimum age for voting in Nigerian elections is:',o:['16 years','18 years','21 years','25 years'],a:2,w:'Citizens must be 18 years or older AND registered with INEC (Independent National Electoral Commission) to vote in Nigerian elections.'},{q:'Which philosopher\'s idea of the "social contract" best explains the relationship between rights and duties?',o:['Montesquieu (separation of powers)','Aristotle (politics as natural)','Locke/Rousseau/Hobbes (social contract theory)','Karl Marx (class struggle)'],a:3,w:'Locke, Rousseau and Hobbes all developed social contract theory: citizens give up some freedoms (accept duties) in exchange for the state protecting their rights. This explains the rights-duties balance.'},{q:'Section 24 of Nigeria\'s 1999 Constitution states that every citizen has the duty to:',o:['Pay a minimum tax regardless of income','Serve in the military for at least two years','Abide by the Constitution; respect other citizens; make positive contributions to the nation','Report all crime they witness to the police immediately'],a:3,w:'Section 24 — "It shall be the duty of every citizen to: (a) abide by the Constitution and respect its ideals and institutions; (b) respect the dignity of other citizens; (c) make positive and useful contributions to the advancement of the wellbeing and progress of Nigeria."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Gov \u2022 ELE',ti:'Loss and Renunciation of Citizenship',su:'Examine how citizenship can be lost or renounced.',steps:[
{lb:'Ways of losing citizenship',dr:dQ3,ht:'<p>Citizenship can be lost by: (1) <b>Renunciation</b> — voluntary giving up of citizenship (often required when naturalising in another country). (2) <b>Deprivation</b> — the state strips citizenship for certain acts (treason; obtaining citizenship by fraud; voluntary service in a foreign military without permission). (3) <b>Lapse</b> — failure to register; failure to return to the country within a specified period; marriage laws (some older laws). (4) <b>Acquisition of foreign citizenship</b> — in states that do not permit dual citizenship (formally), taking a foreign citizenship may result in loss of original citizenship.</p>'},
{lb:'Statelessness',dr:dQ4,ht:'<p><b>Statelessness</b> occurs when a person has no citizenship of any country — not a citizen of any state. Causes: Conflicts between jus soli and jus sanguinis where neither applies. Dissolution of states (e.g. USSR). Discriminatory stripping of citizenship. Marriage or gender-based citizenship rules that excluded women. The 1954 UN Convention on the Status of Stateless Persons and the 1961 Convention on the Reduction of Statelessness protect stateless persons. Statelessness is a serious problem: stateless people cannot access: passports, education (often), healthcare, legal employment, courts, or vote.</p>'},
{lb:'Dual citizenship',dr:dQ3,ht:'<p><b>Dual citizenship</b> means holding the citizenship of two countries simultaneously. Permitted in: UK, USA, Canada, France and many others. Not fully recognised in: Nigeria\'s law does not formally recognise dual citizenship (Section 28: a Nigerian who acquires another citizenship loses Nigerian citizenship — though this is rarely enforced in practice). Arguments FOR dual citizenship: reflects globalisation; allows diaspora to maintain home ties; brings foreign investment and skills. Arguments AGAINST: potential conflict of loyalties; which state do you defend?; security concerns; inequality (not all citizens can travel abroad to naturalise elsewhere).</p>'},
{lb:'Citizenship and national identity',dr:dQ4,ht:'<p>Citizenship is closely linked to national identity — the sense of belonging to and identifying with a nation. However, they are distinct: national identity is cultural and emotional; citizenship is legal and formal. In Nigeria, the challenge of national identity is significant: 250+ ethnic groups; multiple religions; regional identities often stronger than national identity. Promoting good citizenship requires: civic education; respect for diversity; shared values around democratic governance; equal treatment under the law regardless of ethnicity or religion. Nigeria\'s Federal Character Principle attempts to ensure equitable representation across regions and groups.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'A person who holds the citizenship of two countries simultaneously has:',o:['Naturalised citizenship','Dual citizenship','Honorary citizenship','Registered citizenship'],a:2,w:'Dual citizenship — holding the legal citizenship of two countries at the same time. Common in countries like the USA and UK. Not formally recognised in Nigerian law (Section 28), though widely held in practice.'},{q:'Statelessness occurs when:',o:['A person does not know which country they are a citizen of','A person is temporarily living in a foreign country without a visa','A person has no citizenship of any country — not recognised as a citizen by any state','A person\'s passport has expired and they cannot renew it'],a:3,w:'Statelessness — having no citizenship of any country. The stateless person cannot access a passport, vote, or access many services. Protected by the 1954 and 1961 UN Conventions on Statelessness.'},{q:'Nigeria\'s Section 28 of the 1999 Constitution states that a Nigerian who voluntarily acquires the citizenship of another country:',o:['Must apply for dual citizenship recognition from the Nigerian government','Automatically loses Nigerian citizenship','Must surrender their Nigerian passport within 30 days','May keep Nigerian citizenship if they apply within one year'],a:2,w:'Section 28 — Nigeria does not formally recognise dual citizenship. A Nigerian who acquires another country\'s citizenship loses Nigerian citizenship. However, this provision is rarely enforced in practice.'},{q:'The Federal Character Principle in Nigeria was designed to:',o:['Ensure the federal government has three equal arms','Guarantee that every ethnic group has at least one minister','Ensure equitable representation of different regions and groups in government appointments and institutions','Give each state equal funding regardless of population'],a:3,w:'Federal Character Principle (Section 14(3) of the 1999 Constitution) — requires that federal appointments and institutions reflect Nigeria\'s federal character, ensuring no group monopolises federal positions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Gov \u2022 ELE',ti:'Active Citizenship and Good Governance',su:'Examine the role of active citizenship in promoting good governance.',steps:[
{lb:'Active citizenship',dr:dQ4,ht:'<p><b>Active citizenship</b> goes beyond passive compliance (obeying laws, paying taxes) to active participation in public life. Forms of active citizenship: (1) Voting in elections. (2) Standing for election. (3) Joining political parties. (4) Community service and volunteerism. (5) Holding government accountable through oversight bodies, media, civil society. (6) Paying taxes and declaring assets. (7) Reporting corruption. (8) Participating in town hall meetings and public hearings. A democracy needs active citizens, not just passive subjects. When citizens disengage, governments become less accountable and more corrupt.</p>'},
{lb:'Civil society and citizenship',dr:dQ4,ht:'<p><b>Civil society</b> refers to the network of organisations outside the government and market: NGOs, trade unions, religious bodies, professional associations, community groups, media. Civil society plays a critical role in: (1) Holding government accountable. (2) Educating citizens about their rights. (3) Providing services where government fails. (4) Advocating for policy change. (5) Monitoring elections. In Nigeria, civil society organisations (e.g. Transition Monitoring Group, SERAP, Enough is Enough Nigeria) have been important in electoral monitoring, anti-corruption advocacy and civic education. A strong civil society is essential for healthy democracy.</p>'},
{lb:'Obstacles to active citizenship in Nigeria',dr:dQ4,ht:'<p>Obstacles to active citizenship in Nigeria: (1) Poverty — many citizens focused on survival, not civic participation. (2) Illiteracy — limits understanding of rights and political processes. (3) Apathy and cynicism — citizens may feel their participation makes no difference. (4) Vote buying — undermines meaningful electoral participation. (5) Ethnic and religious divisions — civic identity often subsumed under group identity. (6) Government suppression — sometimes NGOs and civil society face restrictions. (7) Lack of civic education — schools often do not teach citizenship effectively. Addressing these obstacles is essential for deepening democracy in Nigeria.</p>'},
{lb:'Citizenship and development',dr:dQ4,ht:'<p>Good citizenship is fundamental to national development: (1) Tax compliance funds public services. (2) Civic participation ensures government responds to citizen needs. (3) Accountability reduces corruption which diverts development resources. (4) Rule of law creates the predictable environment needed for investment and economic growth. (5) National service (NYSC in Nigeria — National Youth Service Corps) builds national unity and provides social services. (6) Active citizens who report corruption, demand accountability and participate in governance are the essential foundation of sustainable development. Rights are only as real as citizens\' willingness to claim and defend them.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'Active citizenship differs from passive citizenship in that:',o:['Active citizens are those who have been naturalised, while passive citizens are natural-born','Active citizens participate beyond minimum legal compliance — they engage in public life, hold government accountable and serve the community','Active citizens pay more taxes than passive citizens','Active citizens hold dual citizenship while passive citizens hold only one'],a:2,w:'Active citizenship goes beyond obeying laws and paying taxes to active engagement: voting, civil society participation, community service, holding government accountable. Passive citizenship is mere compliance.'},{q:'SERAP in Nigeria stands for:',o:['Socio-Economic Rights Accountability Project','State Electoral and Referendum Advisory Panel','Supreme Economic Research and Advisory Programme','Special Electoral Reform and Accountability Panel'],a:1,w:'SERAP = Socio-Economic Rights Accountability Project — a Nigerian NGO that advocates for socio-economic rights and accountability, often taking the government to court over budget transparency and corruption.'},{q:'The National Youth Service Corps (NYSC) in Nigeria is an example of:',o:['Military conscription — mandatory military service for all Nigerian youths','Active citizenship — national service that promotes unity, development and civic participation','A political party youth wing that supports government candidates','An economic programme that provides loans to young entrepreneurs'],a:2,w:'NYSC (established 1973) requires Nigerian graduates to serve for one year in a state different from their home state. It promotes national unity, active citizenship and provides services in host communities.'},{q:'Vote buying undermines citizenship because:',o:['It is illegal and therefore makes elections void automatically','It replaces the citizen\'s informed political choice (active citizenship) with a commercial transaction, undermining democratic accountability','It encourages too many people to vote, overloading the electoral system','It gives poor citizens a way to benefit from elections they would otherwise ignore'],a:2,w:'Vote buying reduces citizens from active political participants (who vote based on policy and accountability) to passive recipients of cash. It destroys the link between elections and governance quality — the foundation of democracy.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Gov \u2022 ELE',ti:'WAEC Prep and Mixed Questions — Citizenship',su:'Practise WAEC-style questions and integrated revision on citizenship.',steps:[
{lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions on citizenship: (1) Define citizenship (legal membership of a state with rights and duties). (2) Explain how citizenship is acquired (jus soli, jus sanguinis, naturalisation, registration). (3) Discuss rights of citizens. (4) Discuss duties of citizens. (5) Give Nigerian constitutional provisions (Chapter III; Chapter IV). (6) Evaluate dual citizenship, statelessness, active citizenship. Common questions: "How may citizenship be acquired in Nigeria?" / "Examine the rights and duties of citizens." / "What is active citizenship?"</p>'},
{lb:'Full summary',dr:dQ10,ht:'<p>Citizenship: legal membership of a state; rights and duties. Acquired by: jus soli (place of birth); jus sanguinis (parentage); naturalisation (application — Nigeria: 15 of last 20 years); registration; honour. T.H. Marshall: civil + political + social rights. Nigeria 1999 Constitution: Chapter III (citizenship); Chapter IV (fundamental rights); Section 24 (duties); Section 28 (no dual citizenship). Rights: vote, hold office, passport, equal protection. Duties: obey laws, pay tax, defend state, vote, public service. Dual citizenship: not formally recognised in Nigeria. Statelessness: no citizenship of any country. Active citizenship: beyond compliance to participation.</p>'},
{lb:'Key references for WAEC',dr:dQ9,ht:'<p>WAEC reference bank: 1999 Constitution Chapter III (Sections 25-32 — citizenship). Chapter IV (Sections 33-46 — fundamental rights). Section 24 (duties of citizens). Section 27 (naturalisation — 15 of 20 years). Section 28 (loss of citizenship by acquiring foreign citizenship). Federal Character Principle (Section 14(3)). T.H. Marshall (1950) — civil, political and social rights. Jus soli = right of soil (place of birth). Jus sanguinis = right of blood (parentage). NYSC = active citizenship and national unity. SERAP, TMG, EiE = civil society actors.</p>'},
{lb:'Common WAEC mistakes',dr:dQ1,ht:'<p>Avoid: Saying jus soli means citizenship by blood (it means by place of birth). Saying jus sanguinis means citizenship by place of birth (it means by parentage). Confusing naturalisation (application) with registration (automatic entitlement). Saying Nigeria fully recognises dual citizenship (Section 28 does not). Saying fundamental rights are in Chapter III (they are in Chapter IV). Confusing fundamental rights (justiciable) with fundamental objectives in Chapter II (not directly enforceable). Not giving the specific section numbers for Nigerian constitutional provisions when asked.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'Jus sanguinis is citizenship acquired:',o:['By being born within the territory of a country','Through the citizenship of one or both parents (right of blood)','By applying after a period of residence (naturalisation)','By a special act of parliament for distinguished persons'],a:2,w:'Jus sanguinis (Latin: right of blood) — citizenship acquired through parentage. If your parent is a citizen, you may acquire citizenship regardless of where you were born.'},{q:'Nigeria\'s fundamental rights (Chapter IV of the 1999 Constitution) are:',o:['Aspirational goals that the government should work toward but are not enforceable in court','Enforceable in court — citizens can sue the government if these rights are violated','Rights that apply only to citizens, not to foreigners living in Nigeria','Rights that can be permanently suspended during a state of emergency'],a:2,w:'Chapter IV fundamental rights are justiciable — enforceable in court. Citizens can file a fundamental rights enforcement action if their rights are violated. They apply to all persons in Nigeria, not just citizens.'},{q:'Statelessness is a problem because stateless persons cannot easily access:',o:['International travel only','All services everywhere in the world','A passport, legal employment, education, healthcare or vote in elections','Only military service and national security positions'],a:3,w:'Stateless persons lack citizenship of any country, which means they cannot get a passport (no state to issue one), cannot vote, may be denied education, employment and healthcare, and have no consular protection.'},{q:'Which of these best describes "active citizenship"?',o:['Citizenship acquired through naturalisation rather than birth','Going beyond obeying laws — actively participating in public life, voting, serving the community and holding government accountable','Holding dual citizenship in two active democracies','Citizenship that is renewed every 10 years by paying a fee'],a:2,w:'Active citizenship = participation beyond minimum compliance. Voting, community service, civil society engagement, holding government accountable, reporting corruption — these make democracy work.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Gov \u2022 ELE',ti:'Citizenship — Extended Revision',su:'Further practice on citizenship topics.',steps:[
{lb:'Historical development of citizenship',dr:dQ6,ht:'<p>Citizenship has evolved historically: Ancient Athens — limited citizenship (adult male property-owning citizens only; excluded women, slaves and foreigners). Roman Empire — extended citizenship gradually to conquered peoples (212 AD: Edict of Caracalla gave citizenship to all free men in the empire). French Revolution (1789) — "Liberté, Egalité, Fraternité" — citizenship as universal rights. 19th-20th centuries — expansion to include women, workers, minorities. UN Declaration of Human Rights (1948) — universal human rights framework. Post-colonial Nigeria — citizenship defined by the 1963 and then 1999 constitutions. Each expansion of citizenship has been a political struggle.</p>'},
{lb:'Refugees and asylum seekers vs citizens',dr:dQ6,ht:'<p>Distinctions: <b>Citizen</b> — full legal member of the state; permanent rights. <b>Resident</b> — living in a country without full citizenship; may have some rights. <b>Refugee</b> — person who has fled their country due to persecution, war or violence; protected by the 1951 UN Refugee Convention. <b>Asylum seeker</b> — person who has applied for refugee status and is awaiting a decision. These groups have different rights and levels of protection. Nigeria has received refugees (from Sudan, Democratic Republic of Congo, Cameroon etc.). UNHCR (United Nations High Commissioner for Refugees) protects refugees worldwide.</p>'},
{lb:'Globalisation and citizenship',dr:dQ7,ht:'<p>Globalisation has affected citizenship: (1) Economic migration — more people living outside their country of birth; creates pressure for dual citizenship and recognition of migrants\' rights. (2) Global civil society — organisations like Amnesty International and Human Rights Watch advocate for citizens\' rights globally. (3) Regional citizenship — EU citizenship gives EU nationals rights across 27 member states (to live, work, vote in EU Parliament elections). (4) Diaspora citizenship — Nigerians abroad who maintain ties to Nigeria and may seek to vote in Nigerian elections. The globalisation era has made pure territorial citizenship more complex.</p>'},
{lb:'Civic education and citizenship',dr:dQ6,ht:'<p>Civic education (Government as a school subject) plays a crucial role in forming active citizens: (1) Teaching knowledge of rights and the constitution. (2) Understanding how government works. (3) Values of democracy, accountability, tolerance and participation. (4) Skills: critical thinking, dialogue, civic engagement. Nigeria\'s school curriculum includes Government/Civic Education specifically to develop citizens who understand their rights and responsibilities. The challenge: civic education must go beyond memorising facts to developing attitudes and habits of active participation. This is why WAEC Government questions often ask for practical applications, not just definitions.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'The UN Declaration of Human Rights was adopted in:',o:['1945 (at the end of World War II)','1948','1960 (the year of African independence)','1966'],a:2,w:'The UN Universal Declaration of Human Rights was adopted on 10 December 1948 by the UN General Assembly. It established universal standards of human rights applicable to all people everywhere.'},{q:'A person who has fled their country due to persecution or war and is protected under the 1951 UN Refugee Convention is called a:',o:['Stateless person','Economic migrant','Asylum seeker','Refugee'],a:4,w:'A refugee is a person who has crossed an international border and is outside their country due to persecution, war or violence, and is protected by the 1951 UN Refugee Convention. An asylum seeker is one whose claim is still being processed.'},{q:'EU citizenship means that citizens of EU member states have the right to:',o:['Vote in all elections worldwide','Live, work and vote in EU Parliament elections across all 27 EU member states','Apply for the citizenship of any EU country without any requirements','Avoid paying taxes in their home country'],a:2,w:'EU citizenship (created by the Maastricht Treaty 1992) gives EU nationals the right to live and work in any of the 27 EU member states and to vote in European Parliament elections wherever they reside.'},{q:'Civic education (Government as a school subject) contributes to democracy by:',o:['Teaching students the exact rules to follow to get a government job','Forming active citizens who understand their rights, how government works and value democratic participation','Ensuring that all students eventually become politicians or civil servants','Reducing the cost of government by training future officials in school'],a:2,w:'Civic education forms active citizens who know their constitutional rights, understand how government works, and develop the values (accountability, tolerance, participation) and skills needed for democratic governance.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Gov \u2022 ELE',ti:'Citizenship — Deep Practice',su:'Advanced practice on citizenship and national identity.',steps:[
{lb:'National identity in Nigeria',dr:dQ7,ht:'<p>National identity refers to a sense of shared belonging to a nation. Nigeria\'s national identity is complex: 250+ ethnic groups; 3 major groups (Hausa-Fulani, Yoruba, Igbo) alongside many others; multiple religions (Islam, Christianity, traditional); strong regional and ethnic identities. Challenges to Nigerian national identity: ethnicity often supersedes national identity in political behaviour (voting along ethnic lines). The 1999 Constitution attempts to promote national unity through: Federal Character Principle; National Youth Service Corps; Unity Schools (federal government colleges with national admission); NYSC posting to different states. The creation of a strong national identity alongside ethnic diversity is an ongoing challenge.</p>'},
{lb:'The problem of quota system vs merit',dr:dQ7,ht:'<p>Nigeria\'s Federal Character Principle (quota system) requires that federal appointments reflect the geographic diversity of Nigeria — no state or zone should dominate. This conflicts with pure merit-based appointment. Arguments FOR quota/federal character: prevents domination by any one group; ensures all Nigerians see themselves in the national government; promotes national identity. Arguments AGAINST: may reduce quality if merit is compromised; may entrench ethnic identity rather than national identity; creates inefficiency. This tension is a defining debate in Nigerian governance and has no simple resolution.</p>'},
{lb:'Women and citizenship',dr:dQ8,ht:'<p>Women\'s citizenship: Historically, women were excluded from full citizenship in most countries (no voting rights in UK until 1918; USA 1920; Nigeria — women in the south voted in 1959 federal election; women in the north gained voting rights in 1979). In contemporary Nigeria, women have equal constitutional rights as citizens. However, in practice: political representation remains low (National Assembly membership below 10% female); cultural factors limit women\'s participation in some communities. The Beijing Platform for Action (1995) set a target of 35% women in political representation. Nigeria\'s Gender Policy (2006) also set similar targets. Achieving full equal citizenship in practice remains a challenge.</p>'},
{lb:'Youth and citizenship',dr:dQ7,ht:'<p>Young people and citizenship in Nigeria: Nigeria has one of the world\'s youngest populations (median age ~18). The "Not Too Young to Run" Act (2018) reduced the age for President from 40 to 35; Governor from 35 to 30; National Assembly from 30 to 25; State Assembly from 30 to 25. The EndSARS protests (2020) demonstrated that Nigerian youth are capable of significant civic action. Youth participation in governance remains limited by: poverty; financial barriers to contesting elections; electoral violence deterring participation; dominance of older political elites with financial resources. Meaningful youth citizenship requires removing these structural barriers.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'The Federal Character Principle in Nigeria (Section 14(3), 1999 Constitution) requires:',o:['That the federal government have exactly equal representation from each of the 36 states','That federal appointments and institutions reflect the geographic diversity of Nigeria','That all federal civil servants must rotate between states every three years','That all ethnic groups must be represented in every ministry'],a:2,w:'The Federal Character Principle requires that federal appointments and the composition of federal institutions should reflect the federal character of Nigeria — no one state, zone or group should dominate.'},{q:'Nigeria\'s "Not Too Young to Run" Act (2018) reduced the minimum age for President to:',o:['25 years','30 years','35 years','40 years'],a:3,w:'The "Not Too Young to Run" Act (2018) reduced the presidential age requirement from 40 to 35 years; Governor from 35 to 30; National Assembly from 30 to 25; State Assembly from 30 to 25.'},{q:'The Beijing Platform for Action (1995) on women in politics set a target of:',o:['10% women in national parliaments','25% women in national parliaments','35% women in political representation','50% women in all government positions'],a:3,w:'The Beijing Platform for Action (1995 World Conference on Women) set a target of 35% women in political decision-making positions — a target that most countries, including Nigeria, have not yet achieved.'},{q:'The EndSARS protests (2020) in Nigeria demonstrated:',o:['That protests are never effective in Nigeria\'s political system','That only older, established politicians can bring about change in Nigeria','That young Nigerians are capable of significant civic mobilisation and action','That the government always responds positively to youth demands'],a:3,w:'The #EndSARS protests (October 2020) against police brutality demonstrated the capacity of Nigerian youth for rapid, nationwide civic mobilisation using social media. They represent a new form of active citizenship by young Nigerians.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Gov \u2022 ELE',ti:'Citizenship — Final Revision',su:'Final preparation across all citizenship topics.',steps:[
{lb:'Complete citizenship summary',dr:dQ10,ht:'<p>Definition: Legal membership of a state with rights and duties. Acquisition: jus soli (birth in territory); jus sanguinis (parentage); naturalisation (application; Nigeria: 15/20 years); registration; honour. T.H. Marshall: civil + political + social rights. Nigeria: Chapter III (citizenship); Chapter IV (fundamental rights); Section 24 (duties); Section 28 (loss by foreign citizenship). Rights: vote, hold office, passport, equal protection. Duties: obey laws, pay tax, defend state. Dual citizenship: not formally recognised in Nigeria. Active citizenship: participation beyond compliance. NYSC: national service as active citizenship.</p>'},
{lb:'Constitutional provisions summary',dr:dQ8,ht:'<p>1999 Constitution key sections on citizenship: Section 25 — citizenship by birth (born in Nigeria to Nigerian parent). Section 26 — citizenship by registration (spouses of Nigerians; foreign women who marry Nigerians). Section 27 — naturalisation (15 of last 20 years; good character; renounce other citizenship; intend to remain; take oath). Section 28 — citizenship by birth cannot be revoked; citizenship by naturalisation/registration can. Section 30 — deprivation of citizenship for registration/naturalisation. Section 24 — duties of citizens. Chapter IV (Sections 33-46) — fundamental rights enforceable in court.</p>'},
{lb:'Comparing citizenship systems',dr:dQ1,ht:'<p>Comparing citizenship across systems: USA — jus soli very strong; anyone born on US soil is a citizen (14th Amendment). UK — moved from jus soli to jus sanguinis; citizenship by birth now limited. France — strong jus soli with conditions; also jus sanguinis. Germany — historically jus sanguinis; now includes jus soli elements. Nigeria — jus sanguinis primary; jus soli very limited (must have Nigerian parent). WAEC tip: when asked to compare, know the principles AND the countries that apply them. Know the difference between Nigeria\'s formal law (no dual citizenship) and widespread informal practice (many Nigerians hold dual citizenship).</p>'},
{lb:'WAEC final tips — citizenship',dr:dQ10,ht:'<p>Final revision: Know jus soli vs jus sanguinis with country examples. Know naturalisation requirements in Nigeria (Section 27: 15/20 years). Know Chapter IV fundamental rights (justiciable). Know Chapter III (citizenship). Know Section 24 (duties). Know Section 28 (loss of citizenship). Know T.H. Marshall\'s three elements. Know Federal Character Principle. Know active citizenship vs passive. Know NYSC as national service example. For essays: define → methods of acquisition (with examples) → rights → duties → Nigerian constitutional provisions → evaluation of dual citizenship/statelessness → conclusion.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'Which section of Nigeria\'s 1999 Constitution deals with naturalisation?',o:['Section 24','Section 25','Section 27','Section 33'],a:3,w:'Section 27 of the 1999 Constitution covers naturalisation in Nigeria — requiring 15 years residence out of the 20 immediately preceding application, good character, intent to remain and renunciation of other citizenship.'},{q:'T.H. Marshall\'s three elements of citizenship (1950) are:',o:['Civil, political and economic rights','Natural, legal and civic rights','Civil, political and social rights','Formal, substantive and procedural rights'],a:3,w:'T.H. Marshall (1950) in "Citizenship and Social Class" identified: CIVIL rights (freedom, rule of law); POLITICAL rights (vote and hold office); SOCIAL rights (education, welfare, healthcare).'},{q:'The 1951 UN Refugee Convention protects:',o:['All migrants who move to another country for economic reasons','People who flee their country due to persecution, war or violence','All stateless persons regardless of why they lost citizenship','People who voluntarily renounce their citizenship and then regret it'],a:2,w:'The 1951 UN Refugee Convention defines a refugee as someone outside their country due to a well-founded fear of persecution (race, religion, nationality, political opinion, social group). It does not cover economic migrants.'},{q:'Which of these is NOT a fundamental right in Nigeria\'s 1999 Constitution (Chapter IV)?',o:['Right to life (Section 33)','Right to freedom of expression (Section 39)','Right to free university education','Right to freedom from discrimination (Section 42)'],a:3,w:'The right to free university education is NOT a fundamental right in Chapter IV. It may be an aspiration in Chapter II (Fundamental Objectives) but is not justiciable. The rights in Chapter IV are those listed in Sections 33-46.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Gov \u2022 ELE',ti:'Mixed Questions — Citizenship Part 1',su:'Mixed revision questions on citizenship.',steps:[
{lb:'Review: acquisition of citizenship',dr:dQ9,ht:'<p>Quick review: (1) Jus soli — by place of birth within the territory. Strong in USA; limited in Nigeria. (2) Jus sanguinis — by parentage. Primary method in Nigeria. (3) Naturalisation — application after meeting conditions. Nigeria: Section 27; 15/20 years residence; good character; renounce foreign citizenship; intend to remain; take oath of allegiance. (4) Registration — automatic entitlement for certain categories (spouses; children of Nigerians born abroad registered before 21). (5) Honour — granted by the state for distinguished service. Honorary citizenship does not usually carry full rights (cannot vote).</p>'},
{lb:'Review: rights',dr:dQ9,ht:'<p>Quick review of rights: Fundamental rights (Chapter IV — justiciable): life, dignity, liberty, fair hearing, privacy, thought, expression, assembly, movement, non-discrimination. Political rights: vote (18+; registered with INEC); stand for election (age and qualification conditions); join parties; contest results in court. Social rights (Chapter II — Fundamental Objectives — not directly justiciable): education, healthcare, housing, employment. The distinction between justiciable (Chapter IV) and non-justiciable (Chapter II) rights is important for WAEC — know which is which.</p>'},
{lb:'Review: duties',dr:dQ2,ht:'<p>Quick review of duties (Section 24): (a) Abide by the Constitution and respect its ideals. (b) Respect the dignity of other citizens. (c) Make positive and useful contribution to the advancement of Nigeria. (d) Render civic duties when called upon. (e) Declare assets and pay taxes. (f) Defend Nigeria. (g) Protect public property. (h) Foster national unity. (i) Avoid discrimination and manipulation on grounds of religion, ethnicity or region. These are listed in Section 24 but are not directly enforceable in court — they are civic obligations, not legal sanctions in the same way as criminal law.</p>'},
{lb:'Review: active citizenship',dr:dQ9,ht:'<p>Quick review of active citizenship: Beyond compliance → active participation. Forms: voting; standing for election; party membership; community service; civil society engagement; media participation; accountability advocacy; reporting corruption; public hearing participation; community development. Key Nigerian examples: NYSC (national service — founded 1973); INEC accredited observer groups; SERAP (Socio-Economic Rights Accountability Project); Transition Monitoring Group; Enough is Enough Nigeria. Barriers: poverty; apathy; illiteracy; vote buying; ethnic division; civic education deficit. The EndSARS protests (2020) as new form of youth active citizenship.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'Which method of acquiring citizenship is most commonly used in Nigeria?',o:['Jus soli — most Nigerians are born within Nigerian territory','Jus sanguinis — most Nigerians acquire citizenship through Nigerian parents','Naturalisation — most Nigerians apply to become citizens after residing here','Registration — most Nigerians are registered at birth by the government'],a:2,w:'Jus sanguinis (right of blood) is the primary method in Nigeria — you are a citizen if born to a Nigerian parent, regardless of where you are born. Jus soli (place of birth alone) is very limited in Nigerian law.'},{q:'Which rights in Nigeria\'s constitution can be directly enforced in court?',o:['Chapter II rights (Fundamental Objectives — education, health etc.)','Chapter IV rights (Fundamental Rights — life, dignity, expression, assembly etc.)','Both Chapter II and Chapter IV rights equally','Neither — all rights require an Act of Parliament to become enforceable'],a:2,w:'Chapter IV fundamental rights (Sections 33-46) are justiciable — directly enforceable in court. Chapter II (Fundamental Objectives — education, health, welfare) are not directly justiciable in Nigerian courts.'},{q:'Section 24 of the 1999 Constitution lists duties of citizens. These duties are:',o:['Legally enforceable — violation leads to criminal prosecution','Civic obligations and moral duties — not directly enforceable in the same way as criminal law','Only applicable to citizens who have taken a special oath of allegiance','Only applicable to citizens who hold public office or work for the government'],a:2,w:'Section 24 duties are civic obligations — important but not directly enforceable as criminal offences in the same way as, say, tax laws. They reflect the moral and civic expectations of citizenship.'},{q:'The NYSC (National Youth Service Corps) was established in:',o:['1960 at independence','1963 when Nigeria became a republic','1973, after the Civil War, to promote national unity','1999 when the current constitution was adopted'],a:3,w:'NYSC was established in 1973 by General Yakubu Gowon (Decree No. 24 of 1973) after the Nigerian Civil War, specifically to promote national unity by posting graduates to different states for one year of national service.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Gov \u2022 ELE',ti:'Mixed Questions — Citizenship Part 2',su:'Final mixed revision questions on citizenship.',steps:[
{lb:'Complete revision',dr:dQ10,ht:'<p>Complete citizenship revision: Definition — legal membership of state; rights and duties. T.H. Marshall: civil + political + social rights. Acquisition: jus soli; jus sanguinis; naturalisation (s.27: 15/20 years); registration (s.26); honour. Loss: renunciation; deprivation; acquisition of foreign citizenship (s.28). Statelessness: no citizenship of any country; 1954 and 1961 UN Conventions. Dual citizenship: not formally recognised (s.28) but widely held. Rights (Chapter IV justiciable): life, dignity, liberty, fair hearing, privacy, expression, assembly, movement, non-discrimination. Duties (s.24): obey constitution, respect dignity, contribute, defend, pay taxes. Active citizenship: participation beyond compliance.</p>'},
{lb:'Tricky distinctions for WAEC',dr:dQ10,ht:'<p>WAEC tricky distinctions: Jus soli ≠ jus sanguinis (soil vs blood). Chapter II (Objectives — not justiciable) ≠ Chapter IV (Rights — justiciable). Naturalisation ≠ registration (application vs automatic). Refugee ≠ asylum seeker (status granted vs pending). Stateless ≠ undocumented (no citizenship vs citizen without documents). Active citizenship ≠ political party membership only (active citizenship is much broader). Federal Character ≠ equal representation (not exactly equal, but equitable/proportional). The President of the Senate ≠ Speaker of the House (different titles for the two chambers\' leaders).</p>'},
{lb:'Application scenarios',dr:dQ9,ht:'<p>Scenario practice: (1) A person born in Lagos to Beninese parents with no Nigerian relatives — do they have Nigerian citizenship? → No jus soli; no jus sanguinis; might apply for naturalisation after 15/20 years. (2) A child born in the UK to a Nigerian mother — are they a Nigerian citizen? → Yes — jus sanguinis; born to a Nigerian parent, can be registered. (3) A Nigerian who naturalises as a UK citizen — do they lose their Nigerian citizenship? → Technically yes under Section 28 — but this is rarely enforced. (4) An EU national working in Germany moves to France and wants to vote in French local elections. Can they? → Yes — EU citizenship enables this.</p>'},
{lb:'WAEC final tips — citizenship',dr:dQ10,ht:'<p>Top tips for WAEC citizenship essays: (1) Always define citizenship first. (2) Distinguish acquisition methods clearly with examples. (3) Know the difference between justiciable and non-justiciable rights in Nigeria. (4) Use constitutional section numbers when you know them. (5) Give balanced evaluation of dual citizenship (arguments for and against). (6) Mention NYSC, SERAP, EndSARS as concrete Nigerian examples. (7) For active citizenship: always give examples, not just definition. (8) For comparison questions: contrast Nigeria with at least one other country. (9) End with a conclusion about the importance of citizenship for development. (10) Time: 25-mark essays need 25-30 minutes.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'A child born in the UK to a Nigerian mother who is a Nigerian citizen — can this child become a Nigerian citizen?',o:['No — the child was born outside Nigeria so has no claim to Nigerian citizenship','Yes — through jus sanguinis; the child can be registered as a Nigerian citizen because of the Nigerian parent','Only if the child has lived in Nigeria for at least 5 years','Only if the Nigerian mother renounces her own citizenship first'],a:2,w:'Yes — through jus sanguinis (right of blood). A child born to a Nigerian parent abroad is entitled to Nigerian citizenship by descent. Section 25(1)(b) covers persons born outside Nigeria to Nigerian parents.'},{q:'Honorary citizenship differs from ordinary citizenship because:',o:['Honorary citizens cannot be deprived of their citizenship under any circumstances','Honorary citizens typically cannot vote or hold public office — it is symbolic, not full political citizenship','Honorary citizens pay no taxes and owe no civic duties','Honorary citizenship can only be granted to other African citizens'],a:2,w:'Honorary citizenship is largely symbolic — a formal acknowledgment of exceptional contribution. Honorary citizens typically cannot vote, hold public office or claim the full political rights of ordinary citizens.'},{q:'Which international organisation is primarily responsible for the protection of refugees?',o:['UNICEF (United Nations Children\'s Fund)','WHO (World Health Organisation)','UNHCR (United Nations High Commissioner for Refugees)','UNDP (United Nations Development Programme)'],a:3,w:'UNHCR — the United Nations High Commissioner for Refugees — is the UN agency mandated to protect refugees worldwide. It administers the 1951 Refugee Convention and 1967 Protocol.'},{q:'The primary purpose of the National Youth Service Corps (NYSC) is to:',o:['Provide free university education for all Nigerians','Train young Nigerians as military officers','Promote national unity and active citizenship by posting graduates to serve in different states','Provide employment for all university graduates after they finish their degrees'],a:3,w:'NYSC (1973) promotes national unity and active citizenship by requiring graduates to serve for one year in a state other than their home state, thereby breaking ethnic barriers and contributing to development.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
