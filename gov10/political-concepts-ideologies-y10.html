<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});

var QS=[
{ey:'Q1 \u2022 Government • Y10',ti:'Democracy',su:'Understand democracy as a system of government.',steps:[
  {lb:'Meaning of democracy',dr:dQ1,ht:'<p>Democracy is a system of government in which supreme power rests with the people, exercised directly or through elected representatives. Abraham Lincoln\'s classic definition is \'government of the people, by the people, for the people\'.</p>'},
  {lb:'Types of democracy',dr:dQ1,ht:'<p>Direct democracy: citizens participate directly in decision-making (as in ancient Athens or small referenda). Representative democracy: citizens elect representatives to make decisions on their behalf — the form practised in Nigeria and most modern states.</p>'},
  {lb:'Features of democracy',dr:dQ1,ht:'<p>Key features include: free and fair periodic elections, rule of law, protection of fundamental human rights, separation of powers, an independent judiciary, a free press, and the right to change government peacefully.</p>'},
  {lb:'Merits and demerits',dr:dQ1,ht:'<p>Merits: protects liberty, allows peaceful change of government, promotes accountability. Demerits: can be slow in decision-making, may lead to \'tyranny of the majority\', and can be undermined by vote-buying or weak institutions, as seen in some developing democracies.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Abraham Lincoln defined democracy as government:',o:["Of the rich, by the rich, for the rich", "Of the people, by the people, for the people", "Of the military, by the military, for the military", "Of the elite, by the elite, for the people"],a:2,w:'Lincoln\'s Gettysburg Address definition: \'government of the people, by the people, for the people.\''},{q:'A system where citizens vote directly on laws themselves is called:',o:["Representative democracy", "Direct democracy", "Feudalism", "Communism"],a:2,w:'Direct democracy involves citizens participating directly in decision-making, without elected intermediaries.'},{q:'Nigeria practises which form of democracy?',o:["Direct democracy only", "Representative democracy", "Absolute monarchy", "Military rule"],a:2,w:'Nigeria, like most modern states, practises representative democracy — citizens elect representatives to govern on their behalf.'},{q:'Which is a key feature of democracy?',o:["A single hereditary ruler", "Free and fair periodic elections", "Banning of political parties", "Rule by military decree"],a:2,w:'Free and fair periodic elections are a defining feature of democratic government.'},{q:'A common criticism (\'demerit\') of democracy is that it can:',o:["Never allow any change of government", "Be slow in decision-making due to debate and consensus-building", "Guarantee permanent stability instantly", "Eliminate the need for elections"],a:2,w:'Democracy\'s emphasis on debate, consensus and process can make decision-making slower than in autocratic systems.'},{q:'\'Tyranny of the majority\' refers to the risk that:',o:["The majority may oppress minority interests despite majority rule", "The military always controls elections", "The minority always rules", "Elections never take place"],a:1,w:'Tyranny of the majority describes the risk that majority rule can be used to override or oppress minority rights and interests.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government • Y10',ti:'Communalism',su:'Understand communalism as a traditional African political-economic concept.',steps:[
  {lb:'Meaning of communalism',dr:dQ2,ht:'<p>Communalism is a system in which land, resources and major decisions are held or made collectively by the community rather than by individuals. It was widespread in traditional African societies before colonialism.</p>'},
  {lb:'Features of communalism',dr:dQ2,ht:'<p>Features include communal land ownership, collective labour on farms, decisions made by councils of elders or the whole community, and strong emphasis on the welfare of the group over individual gain.</p>'},
  {lb:'Communalism and social structure',dr:dQ2,ht:'<p>In communalist societies, the extended family and clan were central units of organisation. Wealth and produce were often shared, and mutual aid (e.g. communal farm labour, \'aro\' or cooperative work groups) was common practice.</p>'},
  {lb:'Communalism in modern context',dr:dQ2,ht:'<p>Elements of communalism persist today in Nigerian communities — town unions, age-grade associations, and communal land tenure systems in many rural areas still reflect this traditional value of collective ownership and responsibility.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Communalism is best defined as a system where:',o:["Land and major decisions are held/made individually", "Land, resources and decisions are held or made collectively by the community", "Only the king owns all land", "Foreign companies own all resources"],a:2,w:'Communalism is characterised by collective ownership of land/resources and communal decision-making, rather than individual ownership.'},{q:'Which best describes a feature of traditional communalist societies?',o:["Private ownership of all farmland by individuals", "Decisions made by councils of elders or the whole community", "Rule by a foreign monarch", "A stock exchange for trading land"],a:2,w:'Communalist societies typically made major decisions collectively, often through councils of elders or community consensus.'},{q:'Which of these reflects communalist values still present in Nigeria today?',o:["Town unions and communal land tenure in rural areas", "Multinational stock markets", "Absolute monarchy", "Written constitutions only"],a:1,w:'Town unions, age-grade associations and communal land tenure reflect the persistence of communalist values in parts of Nigeria.'},{q:'In communalist societies, which unit was central to social organisation?',o:["The individual investor", "The extended family and clan", "The multinational corporation", "The stock exchange"],a:2,w:'The extended family and clan were the central organisational units in traditional communalist African societies.'},{q:'Communal labour groups for farming, as practised traditionally, prioritised:',o:["Individual profit over group welfare", "Collective/cooperative work for shared benefit", "Hiring only foreign workers", "Abandoning farming altogether"],a:2,w:'Communal labour groups emphasised cooperative work for the shared benefit of the community, reflecting communalist values.'},{q:'What distinguishes communalism from capitalism?',o:["Communalism emphasises collective ownership; capitalism emphasises private ownership and profit", "They are identical systems", "Capitalism has no markets; communalism does", "Communalism only exists in Europe"],a:1,w:'Communalism stresses collective ownership and communal welfare, while capitalism emphasises private ownership and individual profit.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government • Y10',ti:'Feudalism',su:'Understand feudalism as a historical political-economic system.',steps:[
  {lb:'Meaning of feudalism',dr:dQ3,ht:'<p>Feudalism was a hierarchical system, common in medieval Europe and parts of pre-colonial Northern Nigeria (e.g. the Sokoto Caliphate), in which land was held by lords/rulers who granted use of it to vassals in exchange for loyalty, service or tribute.</p>'},
  {lb:'Structure of feudal society',dr:dQ3,ht:'<p>A feudal hierarchy typically had a monarch or emir at the top, followed by lords/nobles or district heads, then vassals or serfs who worked the land and owed obligations (labour, produce, military service) to those above them.</p>'},
  {lb:'Feudalism in Northern Nigeria',dr:dQ3,ht:'<p>The Sokoto Caliphate and Hausa emirate system historically displayed feudal-like features: the Emir held authority over land, and district/village heads and talakawa (commoners) owed loyalty, tribute or service up the hierarchy.</p>'},
  {lb:'Decline of feudalism',dr:dQ3,ht:'<p>Feudal systems declined with the rise of centralised nation-states, colonial administration, cash economies, and modern land laws that replaced hierarchical land-holding with individual or state land ownership and rights.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'Feudalism is best described as a system in which:',o:["Land is owned equally by all citizens through elections", "Land is held by lords/rulers who grant its use to vassals in exchange for loyalty or service", "All land belongs to foreign investors", "Land ownership is decided by the judiciary alone"],a:2,w:'Feudalism is a hierarchical land-holding system where rulers grant land use to vassals in exchange for service, tribute or loyalty.'},{q:'In a feudal hierarchy, who typically sat at the top?',o:["The ordinary farmer", "A monarch, emir or overlord", "An elected president", "A trade union leader"],a:2,w:'At the top of a feudal hierarchy was typically a monarch, emir or overlord who held ultimate authority over land.'},{q:'Which pre-colonial Nigerian political system showed feudal-like features?',o:["The Sokoto Caliphate / Hausa emirate system", "The Igbo republican village system", "The Yoruba Oyo Empire's council system alone", "Modern Nigerian federalism"],a:1,w:'The Sokoto Caliphate and Hausa emirate system historically displayed feudal-like hierarchical land and loyalty relationships.'},{q:'What did vassals/serfs typically owe to their overlords in a feudal system?',o:["Nothing at all", "Labour, produce or military service in exchange for land use", "Only monetary taxes paid to a central bank", "Votes in a national election"],a:2,w:'Vassals/serfs owed labour, produce, tribute or military service to their overlords in exchange for the right to use land.'},{q:'What contributed to the decline of feudal systems?',o:["The rise of centralised states, cash economies and modern land laws", "An increase in hereditary succession", "The abolition of all governments", "A worldwide return to communalism"],a:1,w:'Feudalism declined as centralised nation-states, cash economies and modern land laws replaced hierarchical land-holding arrangements.'},{q:'How does feudalism differ from communalism?',o:["Feudalism is hierarchical with lords and vassals; communalism is more egalitarian, with collective community ownership", "They are the same system", "Communalism always involves a king; feudalism never does", "Feudalism has no land at all"],a:1,w:'Feudalism is a hierarchical system of lords and vassals, while communalism is a more egalitarian system of collective ownership.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government • Y10',ti:'Capitalism',su:'Understand capitalism as an economic and political ideology.',steps:[
  {lb:'Meaning of capitalism',dr:dQ4,ht:'<p>Capitalism is an economic system based on private ownership of the means of production (land, factories, capital), free markets, competition, and the pursuit of profit, with limited government interference in the economy.</p>'},
  {lb:'Key features',dr:dQ4,ht:'<p>Features include: private property rights, free markets where prices are set by supply and demand, competition between businesses, profit motive as the driver of economic activity, and minimal state control over production and pricing.</p>'},
  {lb:'Merits and demerits',dr:dQ4,ht:'<p>Merits: encourages innovation, efficiency and economic growth through competition. Demerits: can lead to inequality, exploitation of workers, monopolies, and neglect of public goods that are not profitable (e.g. rural healthcare).</p>'},
  {lb:'Capitalism and Nigeria\'s economy',dr:dQ4,ht:'<p>Nigeria operates a largely capitalist mixed economy: private businesses and markets dominate, though government also regulates certain sectors (e.g. oil, telecoms) and provides some public services, making it a \'mixed economy\' rather than pure capitalism.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'Capitalism is an economic system primarily based on:',o:["State ownership of all production", "Private ownership of production and free markets driven by profit", "Communal ownership of all land", "Feudal land tribute"],a:2,w:'Capitalism rests on private ownership of production, free markets, and the profit motive.'},{q:'In a capitalist system, prices are mainly determined by:',o:["A central government committee", "Supply and demand in free markets", "A single monopoly always fixing prices", "Religious authorities"],a:2,w:'In capitalism, prices are set through the interaction of supply and demand in competitive markets.'},{q:'Which is a common criticism of capitalism?',o:["It always eliminates poverty completely", "It can lead to inequality and exploitation of workers", "It never allows innovation", "It bans private property"],a:2,w:'A common criticism of capitalism is that unregulated competition and profit-seeking can lead to inequality and worker exploitation.'},{q:'Which best describes Nigeria\'s economic system?',o:["Pure feudalism", "A largely capitalist mixed economy with some government regulation", "Pure communism with no private property", "A command economy with total state control"],a:2,w:'Nigeria operates a mixed economy — largely capitalist and market-driven, but with government regulation in key sectors like oil.'},{q:'What is a key merit of capitalism often cited by economists?',o:["It always guarantees equal income for everyone", "It encourages innovation and efficiency through competition", "It removes the need for markets entirely", "It eliminates all business failure"],a:2,w:'Capitalism\'s competitive profit motive is often credited with driving innovation and economic efficiency.'},{q:'Private ownership of the means of production is a defining feature of:',o:["Communism", "Capitalism", "Feudalism only", "Absolute monarchy"],a:2,w:'Private ownership of the means of production (factories, land, capital) is a core defining feature of capitalism.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government • Y10',ti:'Socialism',su:'Understand socialism as an alternative economic and political ideology.',steps:[
  {lb:'Meaning of socialism',dr:dQ5,ht:'<p>Socialism is an economic and political system in which the means of production are owned or regulated collectively — often by the state — on behalf of the people, with the aim of reducing inequality and ensuring resources benefit society as a whole.</p>'},
  {lb:'Key features',dr:dQ5,ht:'<p>Features include significant state ownership or control of key industries, redistribution of wealth through taxation and welfare programmes, central economic planning (in stricter forms), and an emphasis on social equality over individual profit.</p>'},
  {lb:'Merits and demerits',dr:dQ5,ht:'<p>Merits: aims to reduce inequality, provides social welfare (health, education, housing) to all citizens. Demerits: can reduce individual incentive to innovate, may lead to inefficiency in state-run enterprises, and can involve heavy bureaucracy.</p>'},
  {lb:'Socialism in African political thought',dr:dQ5,ht:'<p>Several African leaders after independence, including Julius Nyerere of Tanzania (Ujamaa/African Socialism) and Kwame Nkrumah of Ghana, adopted socialist ideas, blending traditional communal values with state-led development strategies.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'Socialism is best defined as a system in which:',o:["The means of production are privately owned for individual profit only", "The means of production are owned/regulated collectively, often by the state, for social benefit", "All property belongs to feudal lords", "Only foreign investors may own industry"],a:2,w:'Socialism emphasises collective or state ownership/regulation of production aimed at benefiting society as a whole.'},{q:'Julius Nyerere\'s socialist policy in Tanzania was known as:',o:["Ujamaa (African Socialism)", "Apartheid", "Feudalism", "Laissez-faire capitalism"],a:1,w:'Julius Nyerere pursued Ujamaa (African Socialism) in Tanzania, blending communal African values with socialist state planning.'},{q:'A key aim of socialism is to:',o:["Maximise individual profit above all else", "Reduce inequality and ensure resources benefit society as a whole", "Eliminate all government involvement in the economy", "Restore feudal land tenure"],a:2,w:'Socialism aims to reduce inequality and ensure that economic resources are used to benefit society broadly, not just individuals.'},{q:'A common criticism (\'demerit\') of socialism is that it can:',o:["Always guarantee rapid economic growth", "Reduce individual incentive to innovate and can create bureaucratic inefficiency", "Eliminate the need for taxation entirely", "Increase private monopolies"],a:2,w:'Critics argue socialism can reduce individual incentives and produce inefficiencies in heavily state-run enterprises.'},{q:'Which African independence-era leader is associated with socialist economic policy?',o:["Kwame Nkrumah of Ghana", "Cecil Rhodes", "Queen Victoria", "Otto von Bismarck"],a:1,w:'Kwame Nkrumah of Ghana pursued socialist-influenced, state-led development policies after independence.'},{q:'Which of these is a typical socialist policy tool?',o:["Complete abolition of all taxation", "Redistribution of wealth through taxation and welfare programmes", "Total ban on public services", "Feudal tribute payments"],a:2,w:'Socialism typically uses taxation and welfare programmes to redistribute wealth and reduce inequality.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government • Y10',ti:'Communism',su:'Understand communism as a radical form of collective ownership.',steps:[
  {lb:'Meaning of communism',dr:dQ6,ht:'<p>Communism is a political and economic ideology, developed by Karl Marx and Friedrich Engels, that calls for the abolition of private property and class distinctions, with the means of production owned collectively and wealth distributed \'according to need\'.</p>'},
  {lb:'Marx\'s theory',dr:dQ6,ht:'<p>Marx argued that capitalism creates class conflict between the bourgeoisie (owners) and proletariat (workers), and predicted a workers\' revolution would overthrow capitalism, leading eventually to a classless, stateless communist society.</p>'},
  {lb:'Communism in practice',dr:dQ6,ht:'<p>In practice, 20th-century communist states (Soviet Union, Maoist China, Cuba) featured single-party rule, state control of the entire economy, and central planning — differing significantly from Marx\'s original vision of a stateless society.</p>'},
  {lb:'Merits and demerits',dr:dQ6,ht:'<p>Merits (claimed): elimination of class-based inequality, guaranteed basic needs for all. Demerits: historically associated with lack of political freedom, economic inefficiency, and, in several cases, authoritarian repression.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'Communism as an ideology was primarily developed by:',o:["Adam Smith", "Karl Marx and Friedrich Engels", "Aristotle", "John Locke"],a:2,w:'Karl Marx and Friedrich Engels developed communist theory, notably in The Communist Manifesto (1848).'},{q:'According to Marx, capitalism creates conflict between which two classes?',o:["Farmers and traders", "The bourgeoisie (owners) and the proletariat (workers)", "Monarchs and priests", "Teachers and students"],a:2,w:'Marx theorised class conflict between the bourgeoisie (owners of production) and the proletariat (working class).'},{q:'Marx predicted that capitalism would eventually be replaced by:',o:["A return to feudalism", "A workers' revolution leading to a classless, stateless communist society", "A permanent monarchy", "Unlimited free-market capitalism"],a:2,w:'Marx predicted a proletarian revolution against capitalism, eventually resulting in a classless, stateless communist society.'},{q:'Which of these was a 20th-century communist state?',o:["The Soviet Union", "The United Kingdom", "Nigeria", "Switzerland"],a:1,w:'The Soviet Union was a major 20th-century communist state, along with Maoist China and Cuba.'},{q:'A common criticism of 20th-century communist states in practice was:',o:["Too much political freedom and competition", "Lack of political freedom and economic inefficiency under central planning", "Excessive private property rights", "Feudal land tribute systems"],a:2,w:'Historical communist states were widely criticised for restricted political freedom and inefficiencies from rigid central economic planning.'},{q:'How does communism differ from socialism in its ultimate goal?',o:["Communism aims for the complete abolition of private property and a classless, stateless society; socialism allows more mixed ownership", "They are identical in every respect", "Socialism always bans elections; communism never does", "Communism supports feudal land tenure"],a:1,w:'Communism (Marxist theory) envisions the complete abolition of private property and eventual statelessness, while socialism typically allows a more mixed system of ownership and state regulation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government • Y10',ti:'Comparing the Ideologies',su:'Compare democracy, communalism, feudalism, capitalism, socialism and communism.',steps:[
  {lb:'Political vs economic concepts',dr:dQ7,ht:'<p>Democracy is primarily a political concept (how power is exercised), while communalism, feudalism, capitalism, socialism and communism are primarily economic concepts (how property and production are organised) — though all have political implications.</p>'},
  {lb:'Spectrum of ownership',dr:dQ7,ht:'<p>These ideologies can be placed on a spectrum of ownership: communalism and communism sit toward collective ownership; feudalism sits with hierarchical control by lords; capitalism sits toward private/individual ownership; socialism sits between capitalism and communism.</p>'},
  {lb:'Historical progression',dr:dQ7,ht:'<p>Many societies historically moved through stages: communalism (traditional) → feudalism (in some regions) → capitalism (with industrialisation) → in some cases, socialism or communism as a reaction to capitalism\'s inequalities.</p>'},
  {lb:'Relevance to Nigeria today',dr:dQ7,ht:'<p>Nigeria shows elements of several systems: traditional communalist values persist in rural land tenure; the economy is largely capitalist/mixed; and the political system is a representative democracy, illustrating how ideologies can blend rather than exist in pure form.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'Which of these is primarily a POLITICAL concept, rather than an economic one?',o:["Capitalism", "Socialism", "Democracy", "Communism"],a:3,w:'Democracy is primarily about how political power is exercised, while the others are primarily economic systems concerning ownership of production.'},{q:'On a spectrum of ownership, which two systems lean most toward collective/communal ownership?',o:["Capitalism and feudalism", "Communalism and communism", "Democracy and capitalism", "Feudalism and capitalism"],a:2,w:'Communalism and communism both emphasise collective ownership, in contrast to capitalism\'s private ownership.'},{q:'Which system is characterised by hierarchical land control by lords over vassals?',o:["Capitalism", "Feudalism", "Communism", "Democracy"],a:2,w:'Feudalism is defined by a hierarchy in which lords control land and vassals owe them service or tribute.'},{q:'Which best describes Nigeria\'s blend of systems today?',o:["Pure communism with no private property", "A mix of representative democracy, a largely capitalist economy, and lingering communal land practices in rural areas", "Absolute monarchy with feudal land tenure only", "Total central economic planning"],a:2,w:'Nigeria blends representative democracy (political system), a largely capitalist/mixed economy, and some persisting communal land practices.'},{q:'Historically, which ideology often emerged as a reaction to inequalities created by capitalism?',o:["Feudalism", "Socialism/communism", "Communalism", "Absolute monarchy"],a:2,w:'Socialism and communism emerged largely as reactions to the class inequalities associated with industrial capitalism.'},{q:'Why is it useful to compare these ideologies on a single spectrum?',o:["Because it shows there is only one correct system for every country", "Because it helps illustrate how societies organise ownership and power differently, and can blend features of each", "Because ideologies never change over time", "Because only capitalism is a valid economic system"],a:2,w:'Comparing ideologies on a spectrum helps show the range of ways societies can organise ownership and power, and how real societies often blend features.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government • Y10',ti:'Nigeria and Ideology in Practice',su:'See how these ideologies have shaped Nigerian political and economic life.',steps:[
  {lb:'Pre-colonial ideological diversity',dr:dQ8,ht:'<p>Pre-colonial Nigeria showed ideological diversity: the largely communalist, decentralised Igbo village-republican system contrasted with the more feudal, hierarchical Hausa/Fulani emirate system and the Yoruba\'s blend of monarchy and councils.</p>'},
  {lb:'Post-independence economic choices',dr:dQ8,ht:'<p>At independence (1960), Nigeria adopted a mixed economy, blending capitalist private enterprise with state involvement in strategic sectors such as railways, electricity, and later, oil — avoiding a purely socialist or purely capitalist path.</p>'},
  {lb:'Structural Adjustment and liberalisation',dr:dQ8,ht:'<p>From the 1980s, Nigeria adopted Structural Adjustment Programmes (SAP) under IMF/World Bank guidance, shifting further toward market liberalisation, privatisation and reduced state control — a more capitalist direction.</p>'},
  {lb:'Democracy as the political framework',dr:dQ8,ht:'<p>Regardless of economic policy shifts, Nigeria\'s political system since 1999 has remained a representative democracy, providing the constitutional and electoral framework within which these varied economic ideologies have been pursued.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'Which pre-colonial Nigerian political system was most notably communalist/decentralised?',o:["The Sokoto Caliphate emirate system", "The Igbo village-republican system", "The British colonial system", "The modern federal system"],a:2,w:'The Igbo village-republican system was largely decentralised and communalist, without a strong centralised monarchy.'},{q:'Nigeria\'s economic policy at and after independence (1960) is best described as:',o:["Pure communism", "A mixed economy blending private enterprise with state involvement in strategic sectors", "Pure feudalism", "Total central planning like the Soviet Union"],a:2,w:'Nigeria adopted a mixed economy at independence, combining private capitalist enterprise with state involvement in key sectors.'},{q:'Structural Adjustment Programmes (SAP) from the 1980s pushed Nigeria\'s economy toward:',o:["More communal land tenure", "Greater market liberalisation and privatisation, a more capitalist direction", "Pure socialism", "A return to feudal tribute systems"],a:2,w:'SAP, guided by the IMF/World Bank, pushed Nigeria toward market liberalisation, privatisation and a more capitalist economic direction.'},{q:'Since 1999, Nigeria\'s political system has remained a:',o:["Absolute monarchy", "Representative democracy", "Communist one-party state", "Pure feudal hierarchy"],a:2,w:'Nigeria has operated as a representative democracy since the return to civilian rule in 1999.'},{q:'Which best shows the blend of pre-colonial systems in Nigeria?',o:["Every region had identical political systems", "The Igbo (communalist), Hausa/Fulani (feudal-like emirate) and Yoruba (monarchy with councils) systems differed significantly", "Only the Yoruba had any political system at all", "All regions were purely capitalist"],a:2,w:'Nigeria\'s pre-colonial regions showed genuine ideological diversity — from communalist Igbo systems to feudal-like Hausa/Fulani emirates.'},{q:'What does Nigeria\'s economic history illustrate about ideologies?',o:["Countries must pick one pure ideology forever", "Real economies often blend elements of capitalism, socialism and state control depending on the era", "Democracy always requires pure communism", "Feudalism is Nigeria's current system"],a:2,w:'Nigeria\'s shifting economic policies show that real-world economies often blend capitalist, socialist and state-directed elements rather than following one pure ideology.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government • Y10',ti:'WAEC Exam Preparation — Political Concepts',su:'Practise WAEC-style questions on democracy and the economic ideologies.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions on ideologies: (1) Define the concept. (2) State its key features. (3) Give a historical or Nigerian example. (4) Discuss merits and demerits where asked. (5) Compare with a related ideology if the question requires it.</p>'},
  {lb:'Common WAEC question patterns',dr:dQ9,ht:'<p>Typical questions: \'Distinguish between capitalism and socialism\', \'Explain communalism as practised in traditional African society\', \'Discuss the features of democracy\', \'Account for the features of feudalism in pre-colonial Nigeria\'.</p>'},
  {lb:'Key facts to memorise',dr:dQ9,ht:'<p>Marx & Engels = communism. Nyerere\'s Ujamaa = African socialism. Montevideo-style features of democracy = elections, rule of law, rights. Sokoto Caliphate = feudal-like emirate system. Private ownership = capitalism; collective ownership = communalism/communism.</p>'},
  {lb:'Common mistakes to avoid',dr:dQ9,ht:'<p>Avoid confusing socialism with communism (socialism allows more mixed ownership; communism calls for total abolition of private property). Avoid describing Nigeria as \'purely capitalist\' or \'purely socialist\' — it is a mixed economy.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'When WAEC asks you to \'distinguish between capitalism and socialism\', markers expect you to highlight:',o:["That they are identical", "That capitalism emphasises private ownership/profit while socialism emphasises collective/state ownership and equality", "That capitalism has no markets", "That socialism always means communism"],a:2,w:'WAEC expects the core distinction: capitalism emphasises private ownership and profit; socialism emphasises collective/state ownership and reducing inequality.'},{q:'A precise WAEC answer on communalism should reference:',o:["Stock exchanges", "Collective ownership of land and communal decision-making in traditional African society", "Central bank policy", "Feudal tribute to a European king"],a:2,w:'WAEC expects communalism answers to describe collective land ownership and communal decision-making in traditional African societies.'},{q:'Which historical example is commonly used to illustrate feudalism in a Nigerian WAEC answer?',o:["The Igbo village-republican system", "The Sokoto Caliphate/Hausa emirate system", "Modern Nigeria's federal constitution", "The Niger Delta oil industry"],a:2,w:'The Sokoto Caliphate/Hausa emirate system is the standard Nigerian example used to illustrate feudal-like features.'},{q:'A common WAEC mistake is treating socialism and communism as:',o:["Correctly distinct concepts", "Identical, when in fact communism calls for total abolition of private property while socialism allows mixed ownership", "Both types of monarchy", "Both forms of feudalism"],a:2,w:'Students often wrongly treat socialism and communism as identical; WAEC expects the distinction that communism seeks total abolition of private property while socialism permits a more mixed system.'},{q:'For full marks on a \'features of democracy\' question, students should mention:',o:["Only that elections happen occasionally", "Elections, rule of law, human rights, separation of powers and a free press", "Only the name of the current president", "Only military strength"],a:2,w:'A complete WAEC answer on democracy\'s features covers elections, rule of law, rights, separation of powers and free press.'},{q:'Nyerere\'s Ujamaa policy is best used by students as an example of:',o:["Capitalism", "African Socialism blending communal values with state planning", "Feudalism", "Communism in its pure Marxist form"],a:2,w:'Nyerere\'s Ujamaa is the standard example of African Socialism, blending traditional communal values with state-led development.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Government • Y10',ti:'Mixed Questions — Political Concepts',su:'Integrated revision across all six ideologies.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Democracy = political system, power with the people. Communalism = collective African traditional ownership. Feudalism = hierarchical lord–vassal land system. Capitalism = private ownership, free markets. Socialism = collective/state ownership, equality focus. Communism = total abolition of private property (Marx).</p>'},
  {lb:'Connecting concepts',dr:dQ10,ht:'<p>Chain: Communalism (traditional) → sometimes evolved into feudalism (hierarchy) → disrupted by capitalism (colonial/industrial economies) → socialism/communism arose as reactions to capitalism\'s inequality. Democracy is the political system that can accompany any of these economic arrangements.</p>'},
  {lb:'Nigeria-specific facts',dr:dQ10,ht:'<p>Nigeria: representative democracy since 1999; mixed capitalist economy since independence, more market-oriented after SAP (1980s); communalist land practices persist in parts of rural Nigeria; Sokoto Caliphate shows historical feudal-like features.</p>'},
  {lb:'Final revision tips',dr:dQ10,ht:'<p>Always separate political concepts (democracy) from economic ideologies (the other five). Know one clear Nigerian or historical example for each concept. Be ready to compare any two ideologies directly if asked — practise writing short comparison paragraphs.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Which concept is unique among the six for being primarily political rather than economic?',o:["Feudalism", "Democracy", "Capitalism", "Socialism"],a:2,w:'Democracy concerns political power; the other five (communalism, feudalism, capitalism, socialism, communism) are primarily economic ownership systems.'},{q:'Which ideology calls for the total abolition of private property?',o:["Capitalism", "Communism", "Democracy", "Feudalism"],a:2,w:'Communism, per Marx, calls for the complete abolition of private property and eventual classless society.'},{q:'Which system is defined by a hierarchy of lords and vassals owing service for land use?',o:["Feudalism", "Capitalism", "Communism", "Democracy"],a:1,w:'Feudalism is defined by its hierarchical land-holding relationships between lords and vassals.'},{q:'Nigeria\'s post-1980s Structural Adjustment Programme pushed its economy in which direction?',o:["Toward pure communism", "Toward greater market liberalisation (a more capitalist direction)", "Toward feudal tribute systems", "Toward direct democracy only"],a:2,w:'SAP pushed Nigeria toward market liberalisation and privatisation — a more capitalist economic direction.'},{q:'Which best captures the relationship between socialism and capitalism?',o:["They are identical systems", "Socialism developed partly as a reaction to inequalities associated with capitalism", "Capitalism developed from socialism", "Neither concept relates to ownership of production"],a:2,w:'Socialism developed significantly as a reaction against the class inequalities produced by industrial capitalism.'},{q:'Which of these correctly matches concept to example?',o:["Communism \u2013 Julius Nyerere's Ujamaa", "Feudalism \u2013 the Sokoto Caliphate/emirate system", "Capitalism \u2013 traditional Igbo communal land tenure", "Democracy \u2013 hereditary monarchy only"],a:2,w:'The Sokoto Caliphate/Hausa emirate system is the standard example used to illustrate feudalism in Nigerian Government studies.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
