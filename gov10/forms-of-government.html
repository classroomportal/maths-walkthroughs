<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Forms of Government — Classification',ACC,12,'middle',true));
[['Form','Who rules','Example'],['Monarchy','One hereditary ruler','UK (constitutional); Saudi Arabia (absolute)'],['Republic','Elected head of state / no hereditary rule','Nigeria, USA, Germany'],['Democracy','People (directly or through reps)','Nigeria, UK, USA'],['Aristocracy','A few "best" persons (by merit)','Ancient Rome (Senate)'],['Oligarchy','A few (by wealth/power, not merit)','Historical; modern authoritarian'],['Dictatorship','One person; absolute power; no accountability','Military Nigeria, North Korea'],['Theocracy','Religious law/leader governs','Iran, Vatican City']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(80,34+i*28,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(220,34+i*28,r[1],'#444',7,'middle',false));o.push(T(390,34+i*28,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Presidential vs Parliamentary',ACC,12,'middle',true));
[['Feature','Presidential','Parliamentary'],['Head of state','Elected president','Monarch or ceremonial president'],['Executive source','Separately elected','Drawn from legislature'],['Term','Fixed (Nigeria: 4 yrs)','Not fixed; falls with confidence'],['Accountability','To the people','To the legislature'],['Separation','Clear (separate)','Fusion of powers'],['Examples','Nigeria, USA, Kenya','UK, India, Ghana'],['Nigeria switch','1979 — Westminster → Presidential','American model adopted']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(70,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(210,34+i*28,r[1],'#444',7,'middle',false));o.push(T(370,34+i*28,r[2],'#444',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Forms of Government — Summary',ACC,13,'middle',true));
[['Monarchy','One hereditary ruler; constitutional or absolute'],['Republic','Elected head of state; no hereditary rule'],['Democracy','People\'s rule; direct or representative'],['Presidential','Exec separate from legislature; fixed term'],['Parliamentary','Exec from legislature; no fixed term'],['Federal','Power divided: centre + components (Nigeria)'],['Unitary','Power concentrated at centre (UK, France)'],['Theocracy','Religious law governs (Iran)']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*27,460,22,CRM,LINE,1));o.push(T(90,50+i*27,r[0],ACC,9,'middle',true));o.push(T(300,50+i*27,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Government \u2022 Elements',ti:'Monarchy',su:'Define monarchy and distinguish constitutional from absolute monarchy.',steps:[
  {lb:'Definition of monarchy',dr:dQ1,ht:'<p>A <b>monarchy</b> is a form of government in which supreme power is nominally or actually held by a single hereditary ruler — a king, queen, emperor or emir. Monarchy is one of the oldest forms of government. Two main types: (1) <b>Absolute monarchy</b>: the monarch has unlimited power (Saudi Arabia, historical European monarchies). (2) <b>Constitutional monarchy</b>: the monarch\'s power is limited by a constitution; they reign but do not govern (UK, Sweden, Japan, Netherlands). The monarch is a ceremonial head of state; a Prime Minister exercises executive power.</p>'},
  {lb:'Constitutional monarchy — the UK model',dr:dQ1,ht:'<p>The UK\'s constitutional monarchy evolved over centuries: Magna Carta (1215) — first limits on royal power. Civil War (1640s) and execution of Charles I. Glorious Revolution (1688) — Parliament\'s supremacy established. Bill of Rights (1689) — King cannot tax or raise army without Parliament. Today the UK monarch (King Charles III) has no real political power — a purely ceremonial role: appoints Prime Minister (must have Commons majority); gives Royal Assent to bills; opens Parliament. The monarch "reigns but does not rule."</p>'},
  {lb:'Absolute monarchy',dr:dQ1,ht:'<p>In an <b>absolute monarchy</b>, the king or emir has supreme, unchecked power: legislates by decree, controls the military, taxes without parliament, appoints officials at will. Saudi Arabia: King is head of state and government; Sharia law is the constitution; no elected legislature (Consultative Assembly is appointed). Louis XIV of France: "L\'état c\'est moi" (I am the state). Absolute monarchies have mostly disappeared. Contrast: Nigeria is a republic — no monarchy.</p>'},
  {lb:'Merits and demerits of monarchy',dr:dQ1,ht:'<p>Constitutional monarchy merits: (1) Political stability above partisan politics. (2) National unity symbol. (3) Separation of ceremonial and political roles. (4) Soft power and tourism. Demerits: (1) Undemocratic in principle — head of state not elected. (2) Hereditary succession — no merit basis. (3) Expensive. (4) Can become outdated. For WAEC: know the difference between absolute and constitutional monarchy; know that Nigeria is a republic NOT a monarchy.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'In a CONSTITUTIONAL monarchy, the monarch:',o:['Has absolute unlimited power','Reigns but does not govern — executive power lies with Prime Minister','Is elected by the people','Is appointed by Parliament'],a:2,w:'Constitutional monarchy: monarch reigns (ceremonially) but does not govern. Executive power lies with an elected Prime Minister.'},{q:'Saudi Arabia is an example of:',o:['Constitutional monarchy','Absolute monarchy (King rules under Islamic law)','A republic','A federal democracy'],a:2,w:'Saudi Arabia is an absolute monarchy where the King has supreme power, governing under Islamic (Sharia) law.'},{q:'The Glorious Revolution of 1688 was significant because it:',o:['Made the UK a republic','Established Parliament\'s supremacy over the monarchy','Gave women the right to vote','Created the Commonwealth'],a:2,w:'The Glorious Revolution (1688) established Parliamentary supremacy via the Bill of Rights (1689), entrenching constitutional monarchy in Britain.'},{q:'Nigeria is NOT a monarchy because:',o:['Nigeria is too large to have a king','Nigeria has traditional rulers instead','Nigeria is a republic — the President is elected, not hereditary','Nigerians rejected monarchy in 2000'],a:3,w:'Nigeria is a federal republic — its head of state (the President) is directly elected by citizens, not determined by hereditary succession.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 Government \u2022 Elements',ti:'Republic',su:'Define a republic and compare it with a monarchy.',steps:[
  {lb:'Definition of a republic',dr:dQ2,ht:'<p>A <b>republic</b> (from Latin <em>res publica</em> — "public thing") is a form of government in which the state is considered a public matter; there is no monarchy; and officials are appointed or elected to represent the people. Key features: head of state is elected (not hereditary); government is accountable to the people; rule of law applies to rulers as much as to citizens. Nigeria is a federal republic — the President is elected for a fixed term and is accountable to the constitution and the people.</p>'},
  {lb:'Republic vs monarchy',dr:dQ2,ht:'<p>Key differences: (1) Head of state: republic — elected/appointed; monarchy — hereditary. (2) Accountability: republic — accountable to constitution and people; monarchy — traditionally to God (divine right) or tradition. (3) Duration: republic — fixed terms; monarchy — for life (usually). (4) Succession: republic — electoral/constitutional; monarchy — hereditary. Nigeria became a republic on 1 October 1963 — replacing the Queen (Governor-General) with an elected President. Most African states are republics.</p>'},
  {lb:'Types of republics',dr:dQ2,ht:'<p>Types of republic: (1) <b>Presidential republic</b>: separately elected president with executive power (Nigeria, USA, Kenya, Ghana). (2) <b>Parliamentary republic</b>: president elected by parliament; prime minister holds executive power (Germany, Italy, Israel). (3) <b>Semi-presidential republic</b>: both president (directly elected) and prime minister share executive power (France, Russia). (4) <b>People\'s republic</b>: communist single-party state claiming to rule in the people\'s name (China, North Korea — in practice authoritarian).</p>'},
  {lb:'Nigeria as a federal republic',dr:dQ2,ht:'<p>Nigeria\'s official title is "Federal Republic of Nigeria" (Constitution s.2(1)). It is: <b>Federal</b> — power divided between federal, state and LGA tiers. <b>Republic</b> — elected president; no monarchy; public accountability. <b>Presidential</b> — directly elected president with executive power; separate from legislature. <b>Democratic</b> — regular elections; fundamental rights. Nigeria has been a republic since 1963, and a presidential republic since 1979.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Latin origin of "republic" (res publica) means:',o:['Government of kings','The people\'s law','Public thing / public affair','The state\'s wealth'],a:3,w:'Res publica — "public thing" or "public affair" — indicating the state belongs to all citizens, not to a monarch.'},{q:'Nigeria\'s official constitutional name is:',o:['Republic of Nigeria','Nigerian Federation','Federal Republic of Nigeria','Democratic Republic of Nigeria'],a:3,w:'S.2(1) of the 1999 Constitution: "Nigeria is one indivisible and indissoluble sovereign state to be known by the name of the Federal Republic of Nigeria."'},{q:'A key difference between a REPUBLIC and a MONARCHY is:',o:['Republics always have elections; monarchies never do','In a republic, the head of state is elected or appointed, not hereditary','Republics are always democracies; monarchies are never democratic','Republics have constitutions; monarchies do not'],a:2,w:'The defining feature of a republic: no hereditary rule; head of state is elected or appointed through a non-hereditary process.'},{q:'France is best described as a:',o:['Presidential republic','Parliamentary republic','Semi-presidential republic (elected president + prime minister share power)','Constitutional monarchy'],a:3,w:'France is a semi-presidential republic — the directly elected President and the Prime Minister (who needs parliamentary confidence) share executive power.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 Government \u2022 Elements',ti:'Presidential vs Parliamentary Systems',su:'Compare presidential and parliamentary systems of government.',steps:[
  {lb:'Presidential system — features',dr:dQ2,ht:'<p><b>Presidential system</b> features: (1) President is both head of state AND head of government. (2) President is directly elected by the people — separate from legislature. (3) Fixed term — president serves set years regardless of legislative support (Nigeria: 4 years; USA: 4 years). (4) Clear separation of powers — executive and legislature are separate, elected independently, check each other. (5) President is not a member of the legislature. (6) Veto power — president can refuse to sign bills. Nigeria adopted this in 1979 (modelled on USA).</p>'},
  {lb:'Parliamentary system — features',dr:dQ2,ht:'<p><b>Parliamentary system</b> features: (1) Head of state (monarch or ceremonial president) is separate from head of government (Prime Minister). (2) Prime Minister is NOT directly elected — emerges from and is accountable to the legislature. (3) PM must maintain the confidence of parliament — loses office if parliament passes a vote of no confidence. (4) No fixed term — elections can be called early. (5) Fusion of powers — executive is drawn from and dependent on legislature. UK, India, Canada, Australia, Ghana. Nigeria used this 1960-63 (First Republic).</p>'},
  {lb:'Nigeria: from Westminster to Presidential',dr:dQ2,ht:'<p>Nigeria\'s constitutional history: <b>1960-63</b>: Westminster parliamentary model — Prime Minister Tafawa Balewa (executive), Governor-General Azikiwe (ceremonial). <b>Military interlude 1966-79</b>. <b>1979</b>: Presidential system adopted — first directly elected executive president (Shehu Shagari). Rationale: Nigeria\'s multi-ethnic complexity required a stronger, directly elected national executive; parliamentary coalitions were too fragile in a diverse federation. Nigeria has maintained the presidential system since 1979.</p>'},
  {lb:'Merits and demerits of each system',dr:dQ2,ht:'<p>Presidential: Merits — stable (fixed term); clear accountability; strong executive; prevents frequent government changes. Demerits — gridlock if president and legislature clash; hard to remove a bad president; executive can become too powerful; expensive. Parliamentary: Merits — flexible; government can be removed quickly if failing; executive and legislature work together; cheaper. Demerits — unstable (governments can fall); prime minister not directly chosen by people; coalition politics can be messy. Nigeria prefers presidential; UK prefers parliamentary.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'In a parliamentary system, the Prime Minister can be removed by:',o:['A presidential election','A vote of no confidence in the legislature','A referendum of all citizens','The military'],a:2,w:'The PM must maintain the confidence of parliament — a vote of no confidence passed by the legislature removes the government.'},{q:'Nigeria adopted the presidential system under which constitution?',o:['1960 Constitution','1963 Constitution','1979 Constitution','1999 Constitution'],a:3,w:'The 1979 Constitution introduced Nigeria\'s presidential system — directly elected executive president, separate from the National Assembly.'},{q:'A known DEMERIT of the presidential system is:',o:['The president is accountable to parliament','Government can be removed quickly if it fails','"Gridlock" — if the president and legislature strongly disagree, both have fixed terms and neither can easily force the other out','The prime minister is more powerful than the president'],a:3,w:'Gridlock is a demerit of presidential systems — the president and legislature have different mandates and fixed terms, so neither can easily force the other out.'},{q:'In the UK\'s parliamentary system, who holds REAL executive power?',o:['The King/Queen','The Speaker of the House of Commons','The Prime Minister','The Lord Chancellor'],a:3,w:'The Prime Minister is the UK\'s head of government — holding real executive power. The King is head of state but has no real political power.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 Government \u2022 Elements',ti:'Federal, Unitary and Confederal Systems',su:'Compare federal, unitary and confederal systems.',steps:[
  {lb:'Federal system',dr:dQ4,ht:'<p>A <b>federal system</b> divides power between a central government and component units (states/provinces) by the constitution. Both levels have defined powers and cannot unilaterally abolish each other. Features: written constitution distributing powers; federal and state courts; each citizen is subject to both levels of government; component units are constitutionally protected. Examples: Nigeria (36 states), USA (50 states), Germany (16 Länder), India (28 states), Canada (10 provinces). Suits diverse, large or pluralistic societies.</p>'},
  {lb:'Unitary system',dr:dQ4,ht:'<p>A <b>unitary system</b> concentrates power in the central government. Sub-national units (local governments, regions) derive their powers from the centre — which can create or abolish them, and override their decisions. Features: parliament is supreme; no constitutionally guaranteed sub-national powers; uniform laws and administration. Examples: UK (devolution to Scotland/Wales is not constitutionally guaranteed), France, Ghana, Kenya. Merits: uniformity; decisive; simpler administration. Demerits: may not suit diverse/large countries; centralises power.</p>'},
  {lb:'Confederal system',dr:dQ4,ht:'<p>A <b>confederation</b> is a loose association of sovereign states that agree to coordinate on certain matters (defence, trade) while retaining their own sovereignty. The central body has only the powers that member states grant it. Historical examples: USA under Articles of Confederation (1781-89 — too weak, replaced by federal constitution); Swiss Confederation (1291-1848); EU today has some confederal characteristics. Most confederations have either become federations (too weak) or fallen apart.</p>'},
  {lb:'Nigeria\'s federal structure',dr:dQ4,ht:'<p>Nigeria\'s federal structure: 3 tiers (federal, 36 states, 774 LGAs). Powers divided by 2nd Schedule: <b>Exclusive List</b> (68 items — only federal): defence, foreign affairs, currency, immigration. <b>Concurrent List</b> (30 items — both federal and state): agriculture, education, health, labour. <b>Residual</b>: historically for states. LGAs are constitutionally recognised (s.7) but in practice controlled by state governors who often withhold their funds — undermining local government autonomy.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'In a UNITARY system, sub-national governments:',o:['Have constitutionally guaranteed powers','Derive their powers from the central government, which can create or abolish them','Have more power than the central government','Share power equally with the centre'],a:2,w:'Unitary system: sub-national units get powers from the centre — which can revoke or remove those powers.'},{q:'Nigeria\'s Exclusive Legislative List contains matters that:',o:['Both federal and state governments can legislate on','Only state governments can legislate on','Only the federal government can legislate on','Local governments exclusively manage'],a:3,w:'The Exclusive List (2nd Schedule, 1999 Constitution) contains 68 items — only the National Assembly can legislate on them (defence, currency, foreign affairs).'},{q:'The USA\'s Articles of Confederation (1781-89) were replaced because:',o:['They gave too much power to the central government','The central government was too weak — couldn\'t tax, states ignored it, couldn\'t regulate interstate trade','The articles had no provision for a president','Too many states refused to join'],a:2,w:'The Articles created too weak a central government — it could not tax or enforce laws on individuals. It was replaced by the stronger federal Constitution (1787).'},{q:'A MERIT of federalism for a country like Nigeria is:',o:['It creates uniform laws across the country','It is simpler and cheaper than a unitary system','It allows diverse regions/groups to self-govern while remaining part of one state','The central government can always override states'],a:3,w:'Federalism allows regional diversity — states can adapt laws to local conditions while being part of one nation. This suits Nigeria\'s enormous cultural and geographic diversity.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 Government \u2022 Elements',ti:'Dictatorship and Totalitarianism',su:'Define dictatorship and explain its features and effects.',steps:[
  {lb:'Dictatorship defined',dr:dQ5,ht:'<p>A <b>dictatorship</b> is a form of government in which one person or a small group holds absolute power without meaningful accountability to the people. Features: no free elections; no opposition; no free press; no independent judiciary; extensive use of force and fear; personality cult; secret police. Examples: military regimes in Nigeria (Gowon, Murtala, Buhari 1983, Babangida, Abacha); Hitler\'s Germany; Stalin\'s USSR; North Korea (Kim dynasty); Mugabe\'s Zimbabwe. Aristotle called this "tyranny" — the corrupt form of monarchy.</p>'},
  {lb:'Totalitarianism',dr:dQ5,ht:'<p><b>Totalitarianism</b> is an extreme form of dictatorship that seeks to control ALL aspects of public and private life: political (one party), economic (state-controlled), social (propaganda), cultural (art/literature controlled), and even private (surveillance, informers). Examples: Nazi Germany (Hitler); Soviet USSR (Stalin); North Korea. Distinguished from authoritarianism (which controls politics but allows some private sphere). Theorist Hannah Arendt (<em>The Origins of Totalitarianism</em>, 1951) identified it as a uniquely destructive form of government.</p>'},
  {lb:'Military rule in Nigeria — an example of dictatorship',dr:dQ5,ht:'<p>Nigeria\'s military periods (1966-79; 1983-99) shared features of dictatorship: (1) Constitution suspended; replaced by decrees. (2) Legislative and political party activities banned. (3) Press censored; critical journalists arrested. (4) Courts bypassed; special military tribunals. (5) Citizens detained without trial (Decree 2). General Abacha\'s regime (1993-98) was the most repressive: Ken Saro-Wiwa and others executed (1995); Wole Soyinka fled into exile; MKO Abiola (winner of annulled 1993 election) imprisoned. Abacha\'s sudden death (1998) enabled the 1999 transition.</p>'},
  {lb:'How dictatorships end',dr:dQ5,ht:'<p>Dictatorships end through: (1) <b>Natural death</b>: Abacha (1998), Kim Jong-il (2011). (2) <b>Popular uprising</b>: Tunisia (2011 Arab Spring — Ben Ali fled), Libya (Gaddafi killed 2011), Romania (Ceaușescu executed 1989). (3) <b>Coup</b>: one dictator replaced by another. (4) <b>Military defeat</b>: Hitler (1945); Saddam Hussein (2003). (5) <b>Negotiated transition</b>: South Africa (apartheid end 1994); Spain (Francoist transition 1975-78). Nigeria\'s 1999 transition combined Abacha\'s death + Abubakar\'s willingness to hand over + international pressure.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'Aristotle\'s term for the corrupt form of monarchy (one person ruling for self) is:',o:['Oligarchy','Tyranny','Aristocracy','Democracy'],a:2,w:'Aristotle: Monarchy (good) → Tyranny (corrupt). Aristocracy (good) → Oligarchy (corrupt). Polity (good) → Democracy (corrupt in Aristotle\'s view).'},{q:'Totalitarianism differs from ordinary authoritarianism because:',o:['It is only found in communist countries','It seeks to control ALL aspects of life — including private life','It uses elections to maintain power','It is always militarily aggressive'],a:2,w:'Arendt distinguished totalitarianism — total control of every aspect of life including private — from authoritarianism, which controls politics but allows some private sphere.'},{q:'General Sani Abacha\'s regime (1993-98) is known for:',o:['Being the first military government in Nigeria','Peacefully transitioning to democracy in 1996','Executing Ken Saro-Wiwa, imprisoning MKO Abiola, and exiling Wole Soyinka','Handing power to civilians in 1999'],a:3,w:'Abacha\'s regime (1993-98) was Nigeria\'s most repressive — executing Saro-Wiwa and Ogoni activists, imprisoning Abiola, and exiling intellectuals like Soyinka.'},{q:'Ken Saro-Wiwa was executed in 1995 because he:',o:['Attempted a military coup','Led the Biafra secession movement','Advocated for Ogoni people\'s rights and environmental justice in the Niger Delta','Was a leader of PDP'],a:3,w:'Ken Saro-Wiwa led MOSOP (Movement for the Survival of the Ogoni People), campaigning for environmental justice against oil company damage in the Niger Delta.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 Government \u2022 Elements',ti:'Theocracy and Other Forms',su:'Explain theocracy and other less common forms of government.',steps:[
  {lb:'Theocracy',dr:dQ6,ht:'<p>A <b>theocracy</b> is a form of government in which God is recognised as the supreme ruler and divine law governs. In practice, religious leaders exercise political power in God\'s name. Examples: Iran (Islamic Republic — Supreme Leader Ayatollah Khamenei; clerics govern; Sharia law); Vatican City (Pope is absolute ruler); Taliban\'s Afghanistan. Nigeria\'s northern states apply Sharia criminal law in a limited sense — but Nigeria as a whole is constitutionally secular. Section 10 of the 1999 Constitution: "The Government of the Federation or of a State shall not adopt any religion as State Religion."</p>'},
  {lb:'Aristocracy and oligarchy',dr:dQ6,ht:'<p><b>Aristocracy</b> (Aristotle\'s term): rule by the "best" people — selected by merit, virtue and wisdom for the common good. Historical: Roman Republic\'s Senate (patricians); English House of Lords (hereditary peers). <b>Oligarchy</b>: rule by a small group for their own benefit (the corrupt form of aristocracy). Modern forms: Russian oligarchs\' political influence; Gulf states ruled by ruling families. Nigeria\'s critics argue its democracy is an "oligarchy" — dominated by a small elite of politicians and business interests.</p>'},
  {lb:'Other forms of government',dr:dQ6,ht:'<p><b>Plutocracy</b>: rule by the wealthy. <b>Technocracy</b>: rule by technical experts. <b>Gerontocracy</b>: rule by the elderly (some African states). <b>Military junta</b>: rule by a council of military officers (Nigeria 1966-79; 1983-99; recent coups in Mali, Niger, Burkina Faso). <b>Meritocracy</b>: governance based purely on merit/ability — Singapore is often cited. These forms help WAEC students compare and contrast different systems of government.</p>'},
  {lb:'Secularism in Nigeria',dr:dQ6,ht:'<p>Section 10 of Nigeria\'s 1999 Constitution: "The Government of the Federation or of a State shall not adopt any religion as State Religion." Nigeria is officially a secular state — neither a Christian nor an Islamic theocracy. However: Sharia criminal law operates in 12 northern states. The Christian Association of Nigeria (CAN) and the Jama\'atu Nasril Islam (JNI) both exercise significant political influence. Religion in politics: a persistent tension in Nigeria between secular constitutional ideals and the reality of religious identity\'s role in governance and elections.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'Which section of Nigeria\'s 1999 Constitution makes Nigeria a secular state?',o:['Section 1','Section 10','Section 14','Section 42'],a:2,w:'Section 10 of the 1999 Constitution: "The Government of the Federation or of a State shall not adopt any religion as State Religion."'},{q:'Iran is an example of a theocracy because:',o:['It has multi-party elections for president','Religious leaders (especially the Supreme Leader/Ayatollah) hold supreme power under Islamic law','Its constitution is based on the UN Charter','Iran is a constitutional monarchy'],a:2,w:'Iran\'s Islamic Republic places the Supreme Leader (a religious scholar/Ayatollah) above the elected president — government operates under divine authority as interpreted by clerics.'},{q:'What makes oligarchy different from aristocracy in Aristotle\'s classification?',o:['Oligarchs always use force','Oligarchy rules for the rulers\' own benefit, not for the common good','Oligarchs are always hereditary rulers','Oligarchy has no courts or laws'],a:2,w:'For Aristotle: aristocracy = rule by the best for the common good. Oligarchy = rule by the few for their own benefit — the corrupt deviation.'},{q:'A military junta is a government formed by:',o:['A single charismatic civilian leader','A council of military officers who seize power by force','Elected representatives of the armed forces','An alliance of religious and military leaders'],a:2,w:'A military junta is a government formed by a group of military officers who have seized power, often through a coup d\'état.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 Government \u2022 Elements',ti:'Merits and Demerits of Forms of Government',su:'Evaluate the merits and demerits of different governmental forms.',steps:[
  {lb:'Merits and demerits of monarchy',dr:dQ7,ht:'<p>Constitutional monarchy merits: political stability above parties; national unity symbol; continuity of state. Demerits: undemocratic in principle; expensive; hereditary not merit-based. Absolute monarchy: no accountability; tyranny possible; arbitrary rule. WAEC essay approach: for each form — define → merits (at least 3) → demerits (at least 3) → give examples (Nigeria or international) → evaluate. Constitutional monarchy works well (UK, Japan, Netherlands, Sweden) because democratic norms constrain the monarch to a ceremonial role.</p>'},
  {lb:'Merits and demerits of democracy',dr:dQ7,ht:'<p>Democracy merits: (1) Accountability. (2) Rights protected. (3) Peaceful conflict resolution. (4) Citizen participation. Demerits: (1) Slow; (2) Expensive; (3) Demagoguery; (4) Money politics; (5) Majority tyranny if rights not protected. Churchill: "worst form except all others tried." Apply to Nigeria: democracy has been imperfect (electoral fraud, money politics, ethnic voting) but better than military rule. The quality of democracy depends on institutions, civil society and rule of law.</p>'},
  {lb:'Merits and demerits of federal vs unitary',dr:dQ7,ht:'<p>Federal merits: suits diversity; local governance; prevents tyranny (power divided). Federal demerits: expensive; duplication; potential for weak centre; inter-governmental conflicts. Unitary merits: efficient; uniform; decisive; clear accountability. Unitary demerits: may not suit diversity; centralises power; may neglect regions. Nigeria is federal: suits 250+ ethnic groups; but over-centralisation (too much in Abuja) has been criticised — many argue more devolution needed. Know which form Nigeria uses and why it was chosen for WAEC.</p>'},
  {lb:'Why Nigeria chose its current system',dr:dQ7,ht:'<p>Nigeria\'s combination of presidential + federal was chosen because: (1) Multi-ethnic diversity requires a directly elected, nationally accountable president — not one drawn from a single region\'s parliamentary majority. (2) Federal structure respects regional autonomy and manages ethnic tensions. (3) Presidential fixed terms prevent governmental instability. (4) The parliamentary system failed (1st Republic — regional parties caused instability; 1966 coup). The combination aims to balance national unity with regional diversity. It has survived longer than any previous arrangement (1999-2024+).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'A MERIT of the presidential system (over parliamentary) is:',o:['The president is accountable to parliament','Government can be removed quickly if it loses confidence','Fixed terms provide stability — government cannot fall between elections','The prime minister is directly elected by all citizens'],a:3,w:'Fixed terms are a merit of the presidential system — the president serves a defined term regardless of parliamentary support, providing stability.'},{q:'A DEMERIT of the federal system is:',o:['It suits diverse societies','It prevents concentration of power','It is expensive — duplication (36 state governments + federal in Nigeria)','It allows regional self-governance'],a:3,w:'Federalism is expensive — maintaining 36 state governments, their legislatures, and the federal government creates duplication and high overhead costs.'},{q:'Nigeria\'s 1979 Constitution abandoned the parliamentary system because:',o:['The British demanded a presidential system','Parliamentary coalition governments proved too fragile for Nigeria\'s multi-ethnic diversity, contributing to the 1966 coup','The president was more popular than the prime minister','The US promised aid only under a presidential system'],a:2,w:'The 1st Republic\'s parliamentary system produced fragile regional coalitions, political crises and the 1966 coup. The 1979 presidential system aimed to create a stronger, nationally-elected executive.'},{q:'A key advantage of a UNITARY system is:',o:['It suits very large and diverse countries','It divides power between many levels','Uniform administration and clearer lines of responsibility','It guarantees regional autonomy through the constitution'],a:3,w:'Unitary systems benefit from simpler, uniform administration — one set of laws, one government, clearer accountability than federalism\'s divided jurisdictions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 Government \u2022 Elements',ti:'Aristotle\'s Classification of Governments',su:'Apply Aristotle\'s classification to modern governments.',steps:[
  {lb:'Aristotle\'s six forms',dr:dQ8,ht:'<p>Aristotle (<em>Politics</em>, 4th century BC) classified governments by <b>who rules</b> and <b>for whose benefit</b>: One ruler for common good = <b>Monarchy</b>; for self = <b>Tyranny</b>. Few rulers for common good = <b>Aristocracy</b>; for self = <b>Oligarchy</b>. Many rulers for common good = <b>Polity</b>; for self = <b>Democracy</b> (Aristotle\'s view — he was sceptical of popular rule). Aristotle preferred <b>Polity</b> (a mixed constitution) — combining aristocratic (wise leaders) and democratic (broad participation) elements. His classification is the starting point for WAEC essays on forms of government.</p>'},
  {lb:'Applying Aristotle to Nigeria',dr:dQ8,ht:'<p>Nigeria\'s government in Aristotelian terms: (1) Presidential republic with universal suffrage — closest to Polity or Democracy. (2) Critics argue it functions as an Oligarchy — a small elite (politicians, military, business) governs for their own benefit. (3) Military rule (1966-79; 1983-99) = Tyranny. (4) The aspiration of the 1999 Constitution = Polity (good government for all). For WAEC: be able to define Aristotle\'s six forms and apply them with examples. Never say Nigeria is a "monarchy" — it is a republic with democratic aspiration.</p>'},
  {lb:'Modern applications of Aristotle\'s framework',dr:dQ8,ht:'<p>Modern applications: Liberal democracy ≈ Polity (Aristotle\'s ideal). Single-party state/authoritarian ≈ Oligarchy or Tyranny. Constitutional monarchy ≈ Modified Monarchy. Technocracy ≈ Aristocracy (rule by the most capable). Plutocracy ≈ Oligarchy. Theocracy = not in Aristotle\'s original classification but could be a form of monarchy (rule by one religious leader for what they claim is God\'s will). Aristotle\'s framework remains useful for WAEC essays because it asks: <em>who governs and for whose benefit?</em></p>'},
  {lb:'Plato vs Aristotle on government',dr:dQ8,ht:'<p>Both Greek philosophers offered critiques: <b>Plato</b> (Republic): democracy is the second-worst form (before tyranny); ordinary people are too ignorant to govern; philosopher-kings (wise, trained rulers) are best. <b>Aristotle</b>: preferred the "golden mean" — Polity, a mixed constitution; warned against both oligarchy and extreme democracy; the middle class is the best basis for stable government. WAEC essays: Plato as critic of democracy; Aristotle as nuanced analyst who preferred mixed government. Lincoln (democracy) vs Plato (philosopher-kings) is a classic contrast.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'In Aristotle\'s classification, the CORRUPT form of aristocracy is:',o:['Tyranny','Oligarchy','Democracy','Polity'],a:2,w:'Aristotle: Aristocracy (few for common good) → Oligarchy (few for self/own benefit). Oligarchy is the corrupt deviation from aristocracy.'},{q:'Aristotle\'s preferred form — the "golden mean" — is called:',o:['Democracy','Monarchy','Polity','Aristocracy'],a:3,w:'Aristotle preferred Polity — a mixed constitution combining aristocratic wisdom with broad democratic participation, rooted in a stable middle class.'},{q:'If Nigeria\'s government serves a small elite rather than the common good, Aristotle would classify it as:',o:['Monarchy','Aristocracy','Democracy','Oligarchy'],a:4,w:'Oligarchy: rule by a few for their own benefit. Critics argue much of Nigerian governance serves a small elite rather than the common good.'},{q:'Plato\'s alternative to democracy was:',o:['A federal republic','Rule by philosopher-kings (the wise, trained to govern)','A constitutional monarchy','Universal suffrage with PR'],a:2,w:'Plato proposed rule by philosopher-kings — persons trained from youth in wisdom and the art of governance.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 Government \u2022 Elements',ti:'WAEC Prep — Forms of Government',su:'Practise WAEC-style questions on forms of government.',steps:[
  {lb:'WAEC essay structure for forms',dr:dQ9,ht:'<p>For WAEC questions on forms of government: (1) Define the specific form asked about. (2) Features (at least 4-5). (3) Examples (Nigeria and/or international). (4) Merits (at least 3). (5) Demerits (at least 3). (6) Comparison with contrasting form if asked. (7) Conclusion — evaluation and lessons for Nigeria. Common WAEC questions: "Distinguish between presidential and parliamentary systems." / "Discuss the features of a federal system." / "Compare monarchy and republic." / "Apply Aristotle\'s classification of governments."</p>'},
  {lb:'Key facts for WAEC',dr:dQ9,ht:'<p>WAEC fact bank: Aristotle — 6 forms (monarchy/tyranny; aristocracy/oligarchy; polity/democracy). Plato — philosopher-kings. Lincoln — government of/by/for the people. Nigeria: federal + presidential + republic since 1979. UK: constitutional monarchy + parliamentary. Saudi Arabia: absolute monarchy. Iran: theocracy. Nigeria s.10 — secular state. Exclusive/Concurrent/Residual legislative lists. 36 states + FCT + 774 LGAs. Abacha (dictatorship 1993-98). Ken Saro-Wiwa (executed 1995). 1999 — return to democracy.</p>'},
  {lb:'Common WAEC mistakes to avoid',dr:dQ9,ht:'<p>Avoid: Saying Aristotle approved of democracy (he was sceptical — he preferred Polity). Saying Nigeria has a parliamentary system (it has presidential since 1979). Confusing constitutional monarchy (ceremonial) with absolute monarchy (real power). Saying the UK has no head of government (the PM is head of government; the King is head of state). Saying theocracy means religion is practised freely (it means religious leaders/law govern). Saying Nigeria has no traditional rulers — it has many, but they have no constitutional governmental power at the federal level.</p>'},
  {lb:'Connecting forms of government to other topics',dr:dQ9,ht:'<p>Connections: Presidential system → Separation of powers → Checks and balances. Federal system → Exclusive/Concurrent lists → Revenue sharing (FAAC). Democracy → Elections → INEC → Rule of law. Military dictatorship → Constitution suspended → Rights violated → 1999 transition. Theocracy → s.10 of 1999 Constitution → secular Nigeria → Sharia debate in northern states. Aristotle → Forms → WAEC classification questions. Monarchy → Constitutional vs absolute → UK model → Nigeria chose republic.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'The KEY distinction between unitary and federal systems:',o:['Federal systems always have more states','In federal systems, powers are constitutionally divided; in unitary systems, all power derives from the centre','Federal systems are always democracies; unitary are always authoritarian','Unitary systems have a written constitution; federal systems do not'],a:2,w:'Federal = powers constitutionally shared; unitary = all powers derive from the central government, which can delegate or remove sub-national powers at will.'},{q:'The most relevant merit of the presidential system for Nigeria specifically:',o:['It produces coalition governments with broad representation','Fixed terms provide stability in a diverse, multi-ethnic nation where parliamentary coalitions would be fragile','The prime minister is always more powerful','It prevents separation of powers'],a:2,w:'For Nigeria specifically, fixed terms and a directly elected national executive provide stability in a multi-ethnic federation where parliamentary coalitions led to the 1966 instability and coup.'},{q:'Aristotle\'s "polity" is best described as:',o:['Rule by the people for self-interest','One person ruling wisely for the common good','A mixed constitution — aristocratic wisdom + broad participation — for the common good','A theocracy combining religious and political rule'],a:3,w:'Polity: Aristotle\'s preferred form — a mixed constitution combining elements of aristocracy (wise governance) and democracy (broad participation), oriented toward the common good.'},{q:'In WAEC essays on "Aristotle\'s classification," you should mention:',o:['Only three forms (monarchy, democracy, aristocracy)','Six forms: monarchy/tyranny, aristocracy/oligarchy, polity/democracy — three good, three corrupt','Only democracy and dictatorship','Five forms based on number of rulers only'],a:2,w:'Aristotle\'s six forms: Monarchy (good) → Tyranny (corrupt); Aristocracy (good) → Oligarchy (corrupt); Polity (good) → Democracy (corrupt in his view). Always present all six.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 Government \u2022 Elements',ti:'Mixed Questions — Forms of Government',su:'Integrated revision across all forms of government topics.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Aristotle: monarchy/tyranny; aristocracy/oligarchy; polity/democracy (6 forms). Monarchy: constitutional (UK — reign not govern) vs absolute (Saudi Arabia). Republic: elected head of state; Nigeria = federal republic. Presidential: exec separate (Nigeria, USA). Parliamentary: exec from legislature (UK, India). Federal: power divided constitutionally (Nigeria, USA). Unitary: all power from centre (UK, France, Ghana). Confederate: loose association (early USA). Theocracy: religious law governs (Iran). Dictatorship: absolute power, no accountability (military Nigeria, Nazi Germany, Abacha).</p>'},
  {lb:'Nigeria-specific connections',dr:dQ10,ht:'<p>Nigeria facts for essays: Federal republic + presidential since 1979. 36 states + FCT + 774 LGAs. s.2(1) — Federal Republic of Nigeria. s.10 — secular (no state religion). 2nd Schedule — Exclusive/Concurrent lists. Military rule (1966-99) = tyranny/dictatorship. 1999 return to democracy. APC ruling since 2015; PDP 1999-2015. 2015 landmark peaceful transfer. INEC, BVAS, IREV. Federal character s.14(3). 109 senators, 360 reps, 36 governors. Aristotle: Nigeria aims for polity; critics say it functions as oligarchy.</p>'},
  {lb:'WAEC essay planning',dr:dQ10,ht:'<p>For a 25-mark essay: spend 3-5 mins planning. Structure: Introduction (define the concept — 2-3 sentences). Body paragraph 1 (first major point + example). Body paragraph 2 (second point). Continue for 5-7 points. Conclusion (evaluation + lessons for Nigeria). Each paragraph: Point → Explanation → Nigerian or international Example → Significance. Avoid: writing only definitions. Include: Aristotle, Dicey, Locke, Lincoln, Churchill where relevant. Always include Nigerian examples — WAEC markers reward contextual application.</p>'},
  {lb:'WAEC final tips — forms of government',dr:dQ10,ht:'<p>Final tips: Know all of Aristotle\'s 6 forms. Know presidential vs parliamentary clearly (Nigeria adopted presidential in 1979 — say why). Know federal vs unitary (Nigeria is federal — 36 states, Exclusive/Concurrent lists). Know constitutional vs absolute monarchy (UK vs Saudi Arabia). Know republic (Nigeria) vs monarchy (UK, Saudi). Know theocracy (Iran) vs secular state (Nigeria s.10). Know dictatorship/military rule in Nigeria\'s context. Be ready to evaluate: is Nigeria\'s current form suitable? What improvements are needed?</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Which form of government does Aristotle consider THE BEST for most states?',o:['Monarchy','Democracy','Aristocracy','Polity (a mixed constitution)'],a:4,w:'Aristotle preferred Polity — a mixed constitution combining aristocratic wisdom and democratic participation, grounded in a stable middle class.'},{q:'Nigeria\'s s.10 (no state religion) means Nigeria is:',o:['An atheist state where religion is banned','A secular state — no level of government can adopt any religion as official','A Christian state that tolerates other religions','A state that enforces Sharia law nationally'],a:2,w:'S.10 makes Nigeria a secular state — neither federal nor state governments can adopt any religion as an official state religion.'},{q:'The critical difference between FEDERAL and CONFEDERAL systems:',o:['Federal states have more territory','In a federation, the central government has constitutional powers and acts directly on citizens; in a confederation, member states retain sovereignty','Confederations always have more members','Federal systems always have a presidential executive'],a:2,w:'Federation: central government has constitutional powers, acts directly on citizens. Confederation: member states retain sovereignty; central body only has powers delegated by states.'},{q:'Nigeria\'s switch from parliamentary (1960) to presidential (1979) was primarily because:',o:['The USA demanded it','Parliamentary coalition governments were too fragile for Nigeria\'s multi-ethnic diversity — the 1966 coup followed First Republic instability','Nigeria wanted to copy the USA in everything','WAEC recommended the presidential system'],a:2,w:'The 1st Republic\'s parliamentary system produced fragile regional coalitions and the 1966 coup. The presidential system aimed to create a stronger, nationally-elected executive.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
