<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC Learning Portal — Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #C0272D;
      color: white;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
    .subtitle { font-size: 0.85rem; opacity: 0.85; border-left: 1px solid rgba(255,255,255,0.4); padding-left: 14px; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    .card-header {
      background: #C0272D;
      color: white;
      padding: 28px 32px 24px;
      text-align: center;
    }
    .card-header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .card-header p  { font-size: 0.85rem; opacity: 0.85; }

    .card-body { padding: 32px; }

    .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 28px; }
    .tab {
      flex: 1; text-align: center; padding: 10px;
      cursor: pointer; font-size: 0.9rem; font-weight: 600; color: #888;
      border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s;
    }
    .tab.active { color: #C0272D; border-bottom-color: #C0272D; }

    .form-group { margin-bottom: 18px; }
    label {
      display: block; font-size: 0.82rem; font-weight: 600; color: #444;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"],
    select {
      width: 100%; padding: 10px 12px; border: 1.5px solid #ddd;
      border-radius: 5px; font-size: 0.95rem; color: #222;
      transition: border-color 0.2s; background: white;
    }
    input:focus, select:focus { outline: none; border-color: #C0272D; }

    .btn {
      width: 100%; padding: 12px; background: #C0272D; color: white;
      border: none; border-radius: 5px; font-size: 1rem;
      font-weight: 700; cursor: pointer; margin-top: 8px; transition: background 0.2s;
    }
    .btn:hover { background: #a01f24; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .message { margin-top: 16px; padding: 10px 14px; border-radius: 5px; font-size: 0.88rem; display: none; }
    .message.error   { background: #fde8e8; color: #a01f24; display: block; }
    .message.success { background: #e8f5e9; color: #2e7d32; display: block; }

    .panel { display: none; }
    .panel.active { display: block; }

    footer { text-align: center; padding: 16px; font-size: 0.78rem; color: #aaa; }
  </style>
<script src="notation.js" defer></script>
</head>
<body>

<header>
  <div class="logo" id="header-logo">ABC</div>
  <div class="subtitle" id="header-subtitle">Adorable British College — ABC Learning Portal</div>
</header>

<main>
  <div class="card">
    <div class="card-header">
      <h1>Welcome Back</h1>
      <p>Sign in with your school email and password</p>
    </div>
    <div class="card-body">

      <div class="tabs" style="display:none">
        <div class="tab active" onclick="switchTab('login')">Sign In</div>
      </div>

      <!-- SIGN IN -->
      <div class="panel active" id="panel-login">
        <div class="form-group">
          <label>School</label>
          <select id="login-school" onchange="onSchoolChange()">
            <option value="">Loading schools…</option>
          </select>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn" id="login-btn" onclick="handleLogin()">Sign In</button>
        <div class="message" id="login-msg"></div>
        <div style="text-align:center;margin-top:14px">
          <a href="#" onclick="clearAndRetry()" style="font-size:0.8rem;color:#aaa;text-decoration:underline">Having trouble signing in? Click here to reset</a>
        </div>
      </div>

      <!-- Register panel removed - accounts created by admin only -->
      <div class="panel" id="panel-register" style="display:none"></div>

    </div>
  </div>
</main>

<footer>© Adorable British College — ABC Learning Portal</footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const SUPABASE_URL  = 'https://lnwinoghbefmjpvmixzo.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

  let schoolsList = [];

  // ── Populate school picker ──
  async function loadSchools() {
    const { data, error } = await supabase.from('schools').select('id, name, school_code, logo_url, primary_color').order('name');
    const sel = document.getElementById('login-school');
    if (error || !data || data.length === 0) {
      sel.innerHTML = '<option value="">Adorable British College</option>';
      return;
    }
    schoolsList = data;
    sel.innerHTML = data.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    // Default to ABC if present, else first school
    const abc = data.find(s => s.school_code === 'abc');
    sel.value = abc ? abc.id : data[0].id;
    onSchoolChange();
  }

  window.onSchoolChange = function() {
    const sel = document.getElementById('login-school');
    const school = schoolsList.find(s => s.id === sel.value);
    if (!school) return;
    applyBranding(school);
  };

  function applyBranding(school) {
    const logoEl = document.getElementById('header-logo');
    const subtitleEl = document.getElementById('header-subtitle');
    const cardHeader = document.querySelector('.card-header');
    const isAbc = school.school_code === 'abc';

    logoEl.innerHTML = '';
    if (school.logo_url) {
      const img = document.createElement('img');
      img.src = school.logo_url;
      img.alt = school.name;
      img.style.cssText = 'height:28px;display:block';
      logoEl.appendChild(img);
    } else {
      logoEl.textContent = isAbc ? 'ABC' : school.name;
    }
    subtitleEl.textContent = isAbc ? 'Adorable British College — ABC Learning Portal' : school.name + ' — Learning Portal';

    const color = school.primary_color || '#C0272D';
    document.querySelectorAll('header, .card-header, .btn').forEach(el => el.style.background = color);
    document.querySelectorAll('.tab.active').forEach(el => el.style.color = color);
    const styleTag = document.getElementById('dynamic-brand-style') || (() => {
      const s = document.createElement('style'); s.id = 'dynamic-brand-style'; document.head.appendChild(s); return s;
    })();
    styleTag.textContent = `.tab.active{color:${color};border-bottom-color:${color}} input:focus,select:focus{border-color:${color}} .btn:hover{filter:brightness(0.88)}`;
  }

  await loadSchools();

  // ── If already logged in, redirect immediately ──
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    console.log('Already logged in, redirecting…');
    await redirectByRole(session.user.id);
  }

  // ── Clear stale session and retry ──
  window.clearAndRetry = async function() {
    await supabase.auth.signOut();
    // Clear any stored tokens
    Object.keys(localStorage).forEach(key => {
      if (key.includes('supabase') || key.includes('sb-')) {
        localStorage.removeItem(key);
      }
    });
    window.location.reload();
  };

  // ── Sign In ──
  window.handleLogin = async function() {
    const email      = document.getElementById('login-email').value.trim();
    const password   = document.getElementById('login-password').value;
    const schoolId   = document.getElementById('login-school').value;
    const msg        = document.getElementById('login-msg');
    const btn        = document.getElementById('login-btn');

    if (!email || !password) { showMsg(msg, 'error', 'Please enter your email and password.'); return; }
    if (!schoolId) { showMsg(msg, 'error', 'Please select your school.'); return; }

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showMsg(msg, 'error', 'Incorrect email or password. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }

    // ── Confirm this account actually belongs to the selected school ──
    const { data: profile } = await supabase.from('profiles').select('school_id').eq('id', data.user.id).maybeSingle();
    if (!profile || profile.school_id !== schoolId) {
      showMsg(msg, 'error', 'That account does not belong to the selected school. Please choose the correct school and try again.');
      await supabase.auth.signOut();
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }

    showMsg(msg, 'success', 'Signed in! Redirecting…');
    await redirectByRole(data.user.id);
  };

  // ── Register ──
  window.handleRegister = async function() {
    const name     = document.getElementById('reg-name').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const role     = document.getElementById('reg-role').value;
    const year     = parseInt(document.getElementById('reg-year').value);
    const msg      = document.getElementById('reg-msg');
    const btn      = document.getElementById('reg-btn');

    if (!name || !email || !password) { showMsg(msg, 'error', 'Please fill in all fields.'); return; }
    if (password.length < 6) { showMsg(msg, 'error', 'Password must be at least 6 characters.'); return; }

    btn.disabled = true;
    btn.textContent = 'Creating account…';

    const { data, error } = await supabase.auth.signUp({
      email, password,
      options: { data: { full_name: name, role } }
    });

    if (error) {
      showMsg(msg, 'error', error.message);
      btn.disabled = false;
      btn.textContent = 'Create Account';
      return;
    }

    if (role === 'student' && data.user) {
      await supabase.from('profiles').update({ year_group: year }).eq('id', data.user.id);
    }

    showMsg(msg, 'success', 'Account created! You can now sign in.');
    btn.disabled = false;
    btn.textContent = 'Create Account';
    switchTab('login');
  };

  // ── Redirect by role ──
  async function redirectByRole(userId) {
    console.log('Checking role for user:', userId);

    const { data: profile, error } = await supabase
      .from('profiles')
      .select('role')
      .eq('id', userId)
      .maybeSingle();

    console.log('Profile:', profile, 'Error:', error);

    if (!profile) {
      console.log('No profile found — staying on login page');
      return;
    }

    if (profile.role === 'admin' || profile.role === 'teacher') {
      window.location.href = 'dashboard-staff.html';
    } else {
      window.location.href = 'dashboard-student.html';
    }
  }

  // ── Tab switching ──
  window.switchTab = function(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-register').classList.toggle('active', tab === 'register');
  };

  // ── Show/hide year group ──
  window.toggleYearGroup = function() {
    const role = document.getElementById('reg-role').value;
    document.getElementById('year-group-row').style.display = role === 'student' ? 'block' : 'none';
  };

  // ── Helper ──
  function showMsg(el, type, text) {
    el.className = 'message ' + type;
    el.textContent = text;
  }
</script>

</body>
</html>
