<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Advanced Punctuation & Sentence Accuracy — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge English (Y11): Advanced Punctuation & Sentence Accuracy</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Avoiding comma splices", "teach": ["A comma splice joins two complete sentences with just a comma \u2014 this is a common accuracy error at this level.", "Fix it by using a full stop, a semicolon, or adding a connective (and/but/so/because).", "Example: 'It was late, we went home' should be 'It was late, so we went home' or 'It was late; we went home.'"], "yt_prompt": "Which sentence correctly avoids a comma splice?"}, {"title": "Avoiding sentence fragments", "teach": ["A sentence fragment is an incomplete sentence, often missing a verb or a subject, wrongly punctuated as if complete.", "Example: 'Because it was raining.' is a fragment \u2014 it needs a main clause attached to be complete.", "Fragments are sometimes used deliberately for effect in creative writing, but should be avoided in formal writing."], "yt_prompt": "Which of these is a complete sentence (not a fragment)?"}, {"title": "Subject-verb agreement", "teach": ["The verb must agree in number with its subject: singular subjects need singular verbs, plural subjects need plural verbs.", "Example: 'The list of items IS long' (not 'are') \u2014 the subject is 'list' (singular), not 'items'.", "Watch out for phrases between the subject and verb that can make agreement trickier to spot."], "yt_prompt": "Which sentence has correct subject-verb agreement?"}, {"title": "Correct use of the semicolon", "teach": ["A semicolon joins two independent clauses that are closely related, without needing a connective word.", "Example: 'The results were disappointing; the team had trained hard all season.'", "Both sides of a semicolon must be able to stand alone as complete sentences."], "yt_prompt": "Which sentence uses the semicolon correctly?"}, {"title": "Correct use of the colon", "teach": ["A colon introduces an explanation, a list, or an example, directly following a complete sentence.", "Example: 'She had made her decision: she would resign at the end of term.'", "Never use a colon after an incomplete phrase \u2014 the part before it must be a full sentence."], "yt_prompt": "Which sentence uses the colon correctly?"}, {"title": "Apostrophes in complex cases", "teach": ["For plural nouns already ending in s, add just an apostrophe after the s: 'the students' results' (belonging to several students).", "For irregular plurals not ending in s, add apostrophe + s: 'the children's books'.", "Its (belonging to it) never has an apostrophe; it's (it is/it has) always does."], "yt_prompt": "Which sentence uses the apostrophe correctly?"}, {"title": "Punctuating embedded clauses", "teach": ["An embedded (parenthetical) clause adds extra information mid-sentence and needs punctuation on BOTH sides \u2014 usually commas, or a pair of dashes/brackets.", "Example: 'The results, which surprised everyone, were announced on Friday.'", "Forgetting the second comma (or dash) is a common accuracy mistake \u2014 always punctuate both sides."], "yt_prompt": "Which sentence correctly punctuates the embedded clause?"}, {"title": "Consistent tense", "teach": ["Within a single piece of writing (or even a single sentence), keep your tense consistent unless there's a clear reason to shift.", "Example: 'She walked into the room and sees her friend' is inconsistent \u2014 should be 'walked... saw' or 'walks... sees'.", "Tense shifts are one of the most common accuracy errors examiners look for."], "yt_prompt": "Which sentence has consistent tense?"}, {"title": "Correcting run-on sentences", "teach": ["A run-on sentence joins multiple complete ideas together with no punctuation or connectives at all.", "Fix it by breaking it into separate sentences, or adding appropriate punctuation and connectives.", "Example: 'I went to the shop I bought bread I came home' needs full stops or connectives between each idea."], "yt_prompt": "Which correctly fixes this run-on sentence?"}, {"title": "Mixed practice", "teach": ["You've now covered comma splices, fragments, subject-verb agreement, semicolons, colons, apostrophes, embedded clauses, and tense consistency.", "These accuracy skills are exactly what examiners assess in the 'technical accuracy' marks for writing tasks.", "Proofreading specifically for these errors \u2014 not just for spelling \u2014 will noticeably improve your writing scores."], "yt_prompt": "Which sentence is fully correct?"}];
function ytGen_0() { const opts=['It was late, so we went home.','It was late, we went home.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_1() { const opts=['Because it was raining, the match was postponed.','Because it was raining.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_2() { const opts=['The list of items is long.','The list of items are long.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_3() { const opts=['The results were disappointing; the team had trained hard.','The results were disappointing; because the team had trained hard.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_4() { const opts=['She had made her decision: she would resign.','She had made her decision to: resign.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_5() { const opts=["The children's books were returned.","The childrens' books were returned."]; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_6() { const opts=['The results, which surprised everyone, were announced on Friday.','The results, which surprised everyone were announced on Friday.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_7() { const opts=['She walked into the room and saw her friend.','She walked into the room and sees her friend.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_8() { const opts=['I went to the shop, bought bread, and came home.','I went to the shop I bought bread I came home.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_9() { const opts=['The team, who had trained hard, were disappointed; they had expected to win.','The team who had trained hard were disappointed they had expected to win.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }

const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^-?\d+\.\d+$/.test(ans)) {
    const num = parseFloat(ans);
    const decimals = (ans.split('.')[1]||'').length;
    const deltas = [0.1,-0.1,0.01,-0.01,1,-1,0.5,-0.5].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = (num + d).toFixed(decimals);
      if (c !== ans && !candidates.includes(c)) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+%$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [5,-5,10,-10,2,-2,1,-1].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d) + '%';
      if (c !== ans && !candidates.includes(c) && (num+d) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  }

  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>

<script type="module">

  const { data: { session } } = await supabase.auth.getSession();
