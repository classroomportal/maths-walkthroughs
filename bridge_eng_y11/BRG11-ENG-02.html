<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Retrieval, Inference & Summary Skills — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge English (Y11): Retrieval, Inference & Summary Skills</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Retrieval questions", "teach": ["Retrieval questions ask you to locate specific information that's directly stated in the text.", "Scan for keywords from the question, then find the exact fact nearby \u2014 don't add your own interpretation.", "These questions are usually worth fewer marks but should be quick and accurate if you read carefully."], "yt_prompt": "Given the clue, what is the retrieved fact?"}, {"title": "Multiple retrieval points", "teach": ["Some questions ask you to find SEVERAL pieces of information from the text, often worth multiple marks.", "Go through the text systematically rather than trying to remember everything \u2014 list each point as you find it.", "Check the mark allocation: if a question is worth 3 marks, you likely need 3 distinct points."], "yt_prompt": "How many separate points does this question require?"}, {"title": "Inference \u2014 reading between the lines", "teach": ["Inference means understanding something the text implies without stating it directly, based on evidence.", "Always be ready to justify your inference by pointing to the specific words or details that led you there.", "Avoid wild guesses \u2014 a good inference should feel like the OBVIOUS conclusion once you see the evidence."], "yt_prompt": "Given the clue text, what is the strongest inference?"}, {"title": "Distinguishing fact from opinion", "teach": ["A fact can be proven true or false with evidence; an opinion is a personal viewpoint that can't be objectively proven.", "Example: 'The bridge is 500 metres long' is a fact; 'The bridge is beautiful' is an opinion.", "Persuasive texts often blend facts and opinions together to make the opinions seem more credible."], "yt_prompt": "Is this statement a fact or an opinion?"}, {"title": "Summarising a paragraph", "teach": ["A good summary captures the main idea in your OWN words, cutting out examples and repeated details.", "Aim to identify the single most important point of a paragraph, then express it concisely.", "Avoid simply copying whole sentences \u2014 a summary should show you've understood, not just located, the text."], "yt_prompt": "Which is the best one-sentence summary?"}, {"title": "Selecting relevant information for a summary", "teach": ["When summarising, you must select ONLY the information relevant to the specific question \u2014 irrelevant detail loses marks.", "Re-read the question carefully to check exactly what you're being asked to summarise.", "It's common for a passage to contain information relevant to several possible questions \u2014 stay focused on the one you're answering."], "yt_prompt": "Which detail would be MOST relevant to include in a summary about the character's feelings?"}, {"title": "Combining information from different parts of a text", "teach": ["Some questions require you to combine information from different parts of a passage to form a complete answer.", "Don't assume all the relevant information is in one place \u2014 scan the whole text for connected details.", "This skill is especially important for longer non-fiction texts with multiple paragraphs on related ideas."], "yt_prompt": "Given clues from two different parts of a text, what combined conclusion can you draw?"}, {"title": "Identifying the writer's main argument", "teach": ["In non-fiction or persuasive texts, identify the writer's overall main argument or viewpoint before looking at supporting details.", "Ask yourself: 'What is this writer ultimately trying to convince me of?'", "Supporting details and examples exist to strengthen this main argument \u2014 always link back to it."], "yt_prompt": "What is the writer's main argument in this described text?"}, {"title": "Evaluating evidence", "teach": ["Not all evidence in a text is equally strong \u2014 some evidence is well-supported (statistics, expert opinion), while some is weaker (unsupported claims).", "When evaluating a text, consider: is this evidence specific and verifiable, or vague and unsupported?", "This higher-level skill involves judging the QUALITY of information, not just retrieving or summarising it."], "yt_prompt": "Which is the stronger piece of evidence?"}, {"title": "Mixed practice", "teach": ["You've now covered retrieval, inference, fact vs opinion, summarising, and combining information across a text.", "These are exactly the skills tested in IGCSE and WAEC comprehension and summary questions.", "Always check the mark allocation and question wording carefully \u2014 they tell you exactly what kind of answer is needed."], "yt_prompt": "Given the clue, what is the retrieved fact?"}];
function ytGen_0() { const opts=[['"The shop opens at 8am." What time does the shop open?','8am'],['"She scored 95% on the test." What was her score?','95%']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_1() { const opts=[['"List THREE reasons the author gives for the policy change." (3 marks)','3'],['"State ONE reason for the delay." (1 mark)','1']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_2() { const opts=[['"He slammed the door and refused to speak for the rest of the evening." What can you infer about his mood?','He was angry or upset'],['"She hummed a tune while tidying her desk." What can you infer about her mood?','She was content or relaxed']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_3() { const opts=[['The bridge is 500 metres long.','Fact'],['The bridge is the most beautiful in the country.','Opinion']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['Fact','Opinion'], answer:p[1]}; }
function ytGen_4() { const opts=['A summary captures the main idea concisely, in your own words.','A summary copies the exact sentences from the text.']; return {q:'Which describes a good summary?', options:opts, answer:opts[0]}; }
function ytGen_5() { const opts=['"Her hands trembled as she read the letter."','"The letter was three pages long."']; return {q:'For a summary about feelings, which is more relevant?', options:opts, answer:opts[0]}; }
function ytGen_6() { const opts=[['Para 1: "He had saved for years." Para 3: "He finally bought the car." → ','His saving led to the purchase'],['Para 1: "The weather turned cold." Para 4: "The crops failed." → ','The cold weather likely caused the crop failure']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }
function ytGen_7() { const opts=['That the policy should be reconsidered due to its unintended consequences','That the weather has been unusually warm this year']; return {q:'A persuasive article about policy reform argues...', options:opts, answer:opts[0]}; }
function ytGen_8() { const opts=['"Studies show a 40% increase over five years."','"Everyone knows this is a huge problem."']; return {q:'Which is the stronger evidence?', options:opts, answer:opts[0]}; }
function ytGen_9() { const opts=[['"The concert starts at 7:30pm." What time does it start?','7:30pm'],['"The book has 320 pages." How many pages?','320']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1]}; }

const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^-?\d+\.\d+$/.test(ans)) {
    const num = parseFloat(ans);
    const decimals = (ans.split('.')[1]||'').length;
    const deltas = [0.1,-0.1,0.01,-0.01,1,-1,0.5,-0.5].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = (num + d).toFixed(decimals);
      if (c !== ans && !candidates.includes(c)) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+%$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [5,-5,10,-10,2,-2,1,-1].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d) + '%';
      if (c !== ans && !candidates.includes(c) && (num+d) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  }

  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
