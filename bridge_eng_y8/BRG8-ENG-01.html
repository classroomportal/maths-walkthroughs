<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sentence Types & Core Punctuation — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge English (Y8): Sentence Types & Core Punctuation</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Simple, compound and complex sentences", "teach": ["A simple sentence has one main idea: 'The rain stopped.' A compound sentence joins two ideas with and/but/or/so: 'The rain stopped, but the ground stayed wet.'", "A complex sentence joins a main idea with a subordinate one, using words like because, although, when: 'The match continued although the rain stopped.'", "Mixing all three types makes your writing more varied and shows control over sentence structure."], "yt_prompt": "What type of sentence is this?"}, {"title": "Full stops and capital letters", "teach": ["Every sentence starts with a capital letter and ends with a full stop, question mark, or exclamation mark.", "Capital letters are also needed for proper nouns \u2014 names of people, places, days, and months.", "A common mistake is forgetting the capital letter after a full stop when writing quickly."], "yt_prompt": "Which sentence is correctly capitalised and punctuated?"}, {"title": "Commas in lists", "teach": ["Use commas to separate items in a list of three or more things: 'I bought rice, beans, and yams.'", "No comma is needed before the very last item if you use 'and' \u2014 though some styles do include it (the 'Oxford comma').", "Lists without commas are hard to read and can even change the meaning of a sentence."], "yt_prompt": "Which sentence uses commas correctly in a list?"}, {"title": "Commas after introductory phrases", "teach": ["A comma is used after an introductory phrase or clause that comes before the main part of the sentence.", "Example: 'After the match ended, the players shook hands.' The comma comes after the introductory phrase.", "Without the comma, sentences like this can be confusing or run together awkwardly."], "yt_prompt": "Which sentence uses the introductory comma correctly?"}, {"title": "Apostrophes for contractions", "teach": ["Apostrophes show where letters have been left out in a contraction: 'do not' becomes 'don't', 'it is' becomes 'it's'.", "The apostrophe goes exactly where the missing letters were removed \u2014 not just anywhere in the word.", "Common mix-ups: 'its' (belonging to it) has no apostrophe, but 'it's' (it is) does."], "yt_prompt": "Which is the correct contraction?"}, {"title": "Apostrophes for possession", "teach": ["An apostrophe + s shows something belongs to someone: 'the boy's book' means the book belonging to the boy.", "For plural nouns already ending in s, just add an apostrophe after the s: 'the boys' books' (belonging to several boys).", "Never use an apostrophe just to make a normal word plural \u2014 'apples' needs no apostrophe."], "yt_prompt": "Which sentence uses the apostrophe correctly?"}, {"title": "Question marks and exclamation marks", "teach": ["A question mark ends a direct question: 'Where are you going?' An exclamation mark shows strong emotion or emphasis: 'Watch out!'", "Don't use an exclamation mark after every sentence \u2014 save it for genuinely urgent or emotional moments.", "A sentence reporting a question (not asking one directly) doesn't need a question mark: 'She asked where I was going.'"], "yt_prompt": "Which punctuation mark is needed?"}, {"title": "Speech marks basics", "teach": ["Speech marks (quotation marks) go around the exact words someone says: 'I'm ready,' she said.", "A comma usually separates the spoken words from the rest of the sentence, placed inside the speech marks.", "Each new speaker usually starts on a new line in a longer piece of dialogue."], "yt_prompt": "Which sentence uses speech marks correctly?"}, {"title": "Common punctuation errors", "teach": ["A comma splice joins two full sentences with just a comma \u2014 this is usually incorrect: 'It was raining, we stayed inside' should be 'It was raining, so we stayed inside.'", "Missing capital letters at the start of a sentence is one of the most common careless errors in writing.", "Proofreading your own writing out loud helps you catch punctuation mistakes you might otherwise miss."], "yt_prompt": "Which sentence has a punctuation error?"}, {"title": "Mixed practice", "teach": ["You've now covered sentence types, commas, apostrophes, and end punctuation.", "In your own writing, aim to vary your sentence types and always proofread for capital letters and correct punctuation.", "This final question checks your overall punctuation accuracy."], "yt_prompt": "Which sentence is correctly punctuated?"}];
function ytGen_0() { const opts=[['The sun was shining.','simple'],['I ran fast, but I still lost the race.','compound'],['Although I was scared, I jumped anyway.','complex']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['simple','compound','complex'], answer:p[1]}; }
function ytGen_1() { const opts=[['we went to lagos on monday.','We went to Lagos on Monday.'],['My friend Ada lives in Abuja.','my friend ada lives in abuja']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0]+' / '+p[1], options:[p[0],p[1]], answer:p[1].charAt(0)===p[1].charAt(0).toUpperCase()?p[1]:p[0]}; }
function ytGen_2() { const opts=['I bought rice, beans, and yams.','I bought rice beans and yams.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_3() { const opts=['After the match ended, the players shook hands.','After the match ended the players shook hands.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_4() { const pairs=[['do not','don\'t'],['it is','it\'s'],['cannot','can\'t'],['they are','they\'re']]; const p=pairs[Math.floor(Math.random()*pairs.length)]; const wrong=p[1].replace("'",''); return {q:p[0], options:[p[1],wrong], answer:p[1]}; }
function ytGen_5() { const opts=["the boy's book","the boys book"]; return {q:"belonging to one boy", options:opts, answer:opts[0]}; }
function ytGen_6() { const opts=[['Where are you going','?'],['Watch out','!'],['I like rice','.']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], options:['?','!','.'], answer:p[1]}; }
function ytGen_7() { const opts=['"I\'m ready," she said.','I\'m ready she said.']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }
function ytGen_8() { const opts=['It was raining, we stayed inside.','It was raining, so we stayed inside.']; return {q:'Which has an error (comma splice)?', options:opts, answer:opts[0]}; }
function ytGen_9() { const opts=['She said, "I am ready."','she said i am ready']; return {q:opts.join(' / '), options:opts, answer:opts[0]}; }

const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^-?\d+\.\d+$/.test(ans)) {
    const num = parseFloat(ans);
    const decimals = (ans.split('.')[1]||'').length;
    const deltas = [0.1,-0.1,0.01,-0.01,1,-1,0.5,-0.5].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = (num + d).toFixed(decimals);
      if (c !== ans && !candidates.includes(c)) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+%$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [5,-5,10,-10,2,-2,1,-1].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d) + '%';
      if (c !== ans && !candidates.includes(c) && (num+d) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  }

  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
