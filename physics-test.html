<!DOCTYPE html>
<html>
<head><title>Physics Map Test</title><script src="notation.js" defer></script>
</head>
<body>
<h2>Physics Walkthrough Files Test</h2>
<div id="out"></div>
<script>
const PHYSICS_WALKTHROUGH_FILES = {
    'Y10-MEA-01': 'phy10/physical-quantities-y10.html',
    'Y10-MEC-01': 'phy10/motion-y10.html',
    'Y10-MEC-02': 'phy10/mass-weight-density-y10.html',
    'Y10-MEC-03': 'phy10/forces-y10.html',
    'Y10-MEC-04': 'phy10/momentum-y10.html',
    'Y10-ENE-01': 'phy10/energy-y10.html',
    'Y10-MEC-05': 'phy10/pressure-y10.html',
    'Y10-THE-01': 'phy10/particle-model-y10.html',
    'Y10-THE-02': 'phy10/thermal-physics-y10.html',
    'Y11-WAV-01': 'phy11/waves-y11.html',
    'Y11-WAV-02': 'phy11/light-y11.html',
    'Y11-WAV-03': 'phy11/electromagnetic-spectrum-y11.html',
    'Y11-WAV-04': 'phy11/sound-y11.html',
    'Y11-ELE-01': 'phy11/magnetism-y11.html',
    'Y11-ELE-02': 'phy11/electricity-y11.html',
    'Y11-ELE-03': 'phy11/electric-circuits-y11.html',
    'Y11-ELE-04': 'phy11/electrical-safety-y11.html',
    'Y11-ELE-05': 'phy11/electromagnetism-y11.html',
    'Y11-NUC-01': 'phy11/nuclear-physics-y11.html',
    'Y11-SPA-01': 'phy11/space-physics-y11.html',
};

const codes = ['Y11-WAV-01','Y11-WAV-02','Y11-WAV-03','Y11-WAV-04',
  'Y11-ELE-01','Y11-ELE-02','Y11-ELE-03','Y11-ELE-04','Y11-ELE-05',
  'Y11-NUC-01','Y11-SPA-01'];

let html = '<table border="1" cellpadding="6">';
html += '<tr><th>Code</th><th>File</th><th>Status</th></tr>';
codes.forEach(c => {
  const f = PHYSICS_WALKTHROUGH_FILES[c];
  html += `<tr><td>${c}</td><td>${f||'undefined'}</td><td style="color:${f?'green':'red'}">${f?'OK':'MISSING'}</td></tr>`;
});
html += '</table>';
document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
