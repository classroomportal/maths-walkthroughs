<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Holiness — Key Concepts',ACC,12,'middle',true));
var rows=[['Holy','Set apart for God; sacred; pure'],['Sanctification','Process of being made holy'],['Divine call','God choosing a person for a purpose'],['Consecration','Formal setting apart for service'],['Obedience','Response required to divine call'],['Unworthiness','Human recognition of God\'s holiness']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,36+i*33,460,26,CRM,LINE,1));o.push(T(110,52+i*33,r[0],ACC,9,'middle',true));o.push(T(330,52+i*33,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Pattern of the Divine Call',ACC,12,'middle',true));
var rows=[['Divine encounter','God appears or speaks to the person'],['Human response','Awe, fear, sense of unworthiness'],['Reassurance','God addresses the fear: "I am with you"'],['Commission','God gives the specific task or mission'],['Objection','Person raises doubts or personal excuses'],['God\'s answer','God overcomes every objection given'],['Acceptance','Person goes and fulfils the call faithfully']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,30+i*30,460,24,CRM,LINE,1));o.push(T(110,44+i*30,r[0],ACC,8,'middle',true));o.push(T(320,44+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Holiness and Divine Call — Summary',ACC,13,'middle',true));
var rows=[['Isaiah (Is.6)','Vision of throne; coal cleanses lips; "Here am I, send me"'],['Moses (Ex.3)','Burning bush; "I AM WHO I AM"; 5 objections overcome'],['Jeremiah (Jer.1)','Called before birth; too young; God touches his mouth'],['Samuel (1Sam.3)','Voice in the night; Eli guides; delivers hard message'],['Ezekiel (Ezek.1-3)','Glory vision; scroll eaten; appointed as watchman'],['Holiness (Lev.19:2)','Be holy because I, the LORD your God, am holy']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(110,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 OT',ti:'Isaiah\'s Call and Vision of Holiness',su:'Examine Isaiah\'s call (Isaiah 6) and what it reveals about God\'s holiness.',steps:[
  {lb:'The vision (Isaiah 6:1-4)',dr:dQ1,ht:'<p>In the year King Uzziah died (~740 BC), Isaiah saw God seated on a high throne. Seraphim called: <em>"Holy, holy, holy is the LORD Almighty; the whole earth is full of his glory"</em> (Is.6:3). The repetition "holy" three times — the <b>Trisagion</b> — is the most emphatic expression possible in Hebrew. God\'s holiness is absolute and overwhelming. The temple shook and filled with smoke at the divine presence.</p>'},
  {lb:'Isaiah\'s response — unworthiness',dr:dQ1,ht:'<p>Isaiah cried: <em>"Woe is me! I am ruined! For I am a man of unclean lips, and I live among a people of unclean lips, and my eyes have seen the King, the LORD Almighty"</em> (Is.6:5). He recognised that no sinful human can stand before a holy God. This is the characteristic human response to divine holiness — an overwhelming sense of one\'s own unworthiness and sin before God\'s perfection.</p>'},
  {lb:'Cleansing and commissioning',dr:dQ2,ht:'<p>A seraph touched Isaiah\'s lips with a live coal from the altar: <em>"Your guilt is taken away and your sin atoned for"</em> (Is.6:7). Then God asked: <em>"Whom shall I send?"</em> Isaiah responded: <em>"Here am I. Send me!"</em> (Is.6:8). The cleansing came before the commission — God makes the person fit for service before sending them. No one serves God in their own righteousness.</p>'},
  {lb:'Lessons from Isaiah\'s call',dr:dQ1,ht:'<p>Isaiah 6 teaches: (1) God\'s holiness demands recognition of human sinfulness. (2) God provides cleansing before commissioning. (3) "Here am I, send me" — willing surrender is the model response. (4) God\'s glory fills all creation. (5) Service flows from encounter with God, not human qualification. WAEC: know the setting, Isaiah\'s reaction, the coal cleansing, and God\'s commission (Is.6:1-9).</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'In Isaiah 6, the seraphim sang "Holy, holy, holy" — this threefold repetition is called:',o:['The Gloria','The Trisagion','The Sanctus Maximus','The Doxology'],a:2,w:'The Trisagion (Greek: "thrice holy") — the threefold "holy" in Is.6:3 is the most emphatic expression of God\'s absolute holiness in Hebrew.'},{q:'Isaiah cried "Woe is me! I am a man of unclean lips" because:',o:['He had told a lie to the king','He recognised his sinfulness before God\'s perfect holiness','He had eaten unclean food','He was afraid of the seraphim'],a:2,w:'Isaiah\'s reaction illustrates the universal response to God\'s holiness — recognition of one\'s sinfulness and unworthiness before a perfectly holy God.'},{q:'Before commissioning Isaiah, God did what to prepare him?',o:['Gave him a scroll to eat','Sent him to the desert for 40 days','A seraph touched his lips with a live coal, atoning for his sin','Filled him with the Holy Spirit'],a:3,w:'A seraph took a live coal from the altar and touched Isaiah\'s lips: "Your guilt is taken away and your sin atoned for" (Is.6:7) — cleansing before commissioning.'},{q:'Isaiah\'s response "Here am I, send me" demonstrates:',o:['Pride and self-confidence','Reluctance and many excuses','Willing surrender and readiness for service','Questioning of God\'s choice'],a:3,w:'"Here am I, send me!" (Is.6:8) is the model of willing, immediate surrender to God\'s call — after being cleansed and hearing God\'s need.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 OT',ti:'Moses and the Burning Bush',su:'Examine Moses\' divine call (Exodus 3-4).',steps:[
  {lb:'The burning bush (Exodus 3:1-6)',dr:dQ2,ht:'<p>Moses was tending his father-in-law Jethro\'s flock near Mount Horeb when he saw a bush burning but not consumed. God called from within the bush: <em>"Moses! Moses!"</em> and identified Himself as the God of Abraham, Isaac and Jacob (Ex.3:6). Moses hid his face — afraid to look at God. God told him: <em>"the place where you are standing is holy ground"</em> — the divine presence sanctifies whatever it touches. Remove your sandals; this is holy ground.</p>'},
  {lb:'The commission and God\'s name',dr:dQ2,ht:'<p>God told Moses: <em>"I have seen the misery of my people in Egypt"</em> (Ex.3:7) and commissioned him: <em>"Go. I am sending you to Pharaoh to bring my people the Israelites out of Egypt"</em> (Ex.3:10). When Moses asked God\'s name, God replied: <em>"I AM WHO I AM"</em> — Hebrew <b>YHWH/Yahweh</b> (Ex.3:14). This revealed God as self-existent, eternal and unchanging — the God who is always present with His people.</p>'},
  {lb:'Moses\'s five objections',dr:dQ2,ht:'<p>Moses raised five objections: (1) "Who am I?" — God: "I will be with you." (2) "What is your name?" — God: "I AM WHO I AM." (3) "What if they do not believe me?" — God gives signs (staff/serpent; leprous hand; water to blood). (4) "I am not eloquent" — God: "I made your mouth; I will teach you." (5) "Please send someone else" — God gives Aaron as spokesman. Human weakness met with divine sufficiency at every point.</p>'},
  {lb:'Lessons from Moses\'s call',dr:dQ2,ht:'<p>Lessons: (1) God notices and responds to suffering. (2) God calls in ordinary situations (tending sheep). (3) God\'s presence makes ordinary places holy. (4) Human inadequacy is no barrier to God\'s call. (5) God equips those He calls. (6) "I AM" reveals God\'s eternal, self-existent nature. (7) Obedience is required even when the task seems impossible. Moses eventually obeyed and led Israel to freedom from 430 years of slavery.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'God appeared to Moses in:',o:['A whirlwind on Mount Sinai','A pillar of cloud in the wilderness','A burning bush that was not consumed','A vision at night'],a:3,w:'God appeared to Moses in a burning bush (Exodus 3) at Mount Horeb — the bush burned but was not consumed, attracting Moses\'s attention.'},{q:'The name God revealed to Moses — "I AM WHO I AM" — is known in Hebrew as:',o:['Elohim','Adonai','YHWH (Yahweh)','El Shaddai'],a:3,w:'YHWH/Yahweh (Exodus 3:14) — "I AM WHO I AM" — reveals God as self-existent, eternal and always present. This is God\'s personal covenant name.'},{q:'How many objections did Moses raise when called?',o:['One','Two','Three','Five'],a:4,w:'Moses raised five objections (Ex.3-4): Who am I? What is your name? What if they do not believe me? I am not eloquent. Please send someone else.'},{q:'God\'s instruction to remove his sandals taught that:',o:['Shoes are forbidden in worship','God\'s presence makes a place holy','Moses had dirty sandals','Mount Horeb was always holy'],a:2,w:'The removal of sandals signified reverence before God\'s holy presence — God\'s nearness sanctified the ordinary ground, not the ground itself.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 OT',ti:'Jeremiah\'s Call',su:'Examine Jeremiah\'s divine call (Jeremiah 1:4-10).',steps:[
  {lb:'Jeremiah called before birth (Jer.1:4-5)',dr:dQ1,ht:'<p>Jeremiah received his call during the reign of Josiah (~627 BC). God declared: <em>"Before I formed you in the womb I knew you, before you were born I set you apart; I appointed you as a prophet to the nations"</em> (Jer.1:5). God\'s call preceded Jeremiah\'s birth — it was not based on his achievements but on God\'s sovereign foreknowledge and choice. This is the most pre-birth emphasis of any prophetic call in the Old Testament.</p>'},
  {lb:'Jeremiah\'s objection and God\'s answer',dr:dQ1,ht:'<p>Jeremiah protested: <em>"I do not know how to speak; I am too young"</em> (Jer.1:6). God replied: <em>"Do not say \'I am too young.\' You must go to everyone I send you to and say whatever I command you"</em> (Jer.1:7). Then God touched Jeremiah\'s mouth: <em>"I have put my words in your mouth"</em> (Jer.1:9). Compare with Isaiah — both had their mouths divinely touched, but for different purposes (Isaiah: cleansing; Jeremiah: enabling speech).</p>'},
  {lb:'The commission and task',dr:dQ2,ht:'<p>God\'s commission to Jeremiah was vast: <em>"I appoint you over nations and kingdoms to uproot and tear down, to destroy and overthrow, to build and to plant"</em> (Jer.1:10). His ministry covered both judgment and restoration. God promised: <em>"Do not be afraid, for I am with you and will rescue you"</em> (Jer.1:8). Jeremiah prophesied for approximately 40 years, through the fall of Jerusalem (586 BC) to Babylon.</p>'},
  {lb:'Lessons from Jeremiah\'s call',dr:dQ2,ht:'<p>Lessons: (1) God\'s sovereignty — He calls before birth. (2) God\'s enabling — He puts His words in the prophet\'s mouth. (3) Holiness means being set apart for God\'s purpose from the very beginning. (4) Youth is no disqualification for God\'s call. (5) A prophet\'s authority comes from God, not human credentials. (6) The called person must go regardless of personal feelings. Jeremiah later confessed great personal cost — "like a burning fire shut up in my bones" (Jer.20:9).</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'God told Jeremiah he was set apart as a prophet:',o:['When he was a young man in Anathoth','When he fasted for 40 days','Before he was formed in the womb','When he visited the temple'],a:3,w:'Jeremiah 1:5 — "Before I formed you in the womb I knew you, before you were born I set you apart" — God\'s call predated Jeremiah\'s birth.'},{q:'Jeremiah\'s objection to his call was:',o:['I am too old and weak','I do not know how to speak; I am too young','I am sinful and unworthy','I have already served and am tired'],a:2,w:'Jeremiah 1:6 — "I do not know how to speak; I am too young" — both a speech limitation and a youth excuse combined.'},{q:'How did God equip Jeremiah for prophetic speech?',o:['By giving him a scroll to eat','By filling him with the Holy Spirit','By touching his mouth and putting His words in it','By sending an angel to teach him'],a:3,w:'Jeremiah 1:9 — "Then the LORD... touched my mouth and said... I have put my words in your mouth" — similar to Isaiah but different purpose.'},{q:'Jeremiah\'s commission (Jer.1:10) included both:',o:['To destroy enemies and to build an army','Destructive tasks (uproot, tear down) AND constructive ones (build, plant)','To judge kings AND to crown new ones','To interpret dreams AND to give prophecies'],a:2,w:'Jer.1:10 — "to uproot and tear down, to destroy and overthrow, to build and to plant" — Jeremiah\'s ministry covered both judgment and restoration.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 OT',ti:'Samuel\'s Call',su:'Examine Samuel\'s call at Shiloh (1 Samuel 3).',steps:[
  {lb:'The setting (1 Samuel 3:1-4)',dr:dQ2,ht:'<p>Samuel was a young boy serving in the temple at Shiloh under the priest Eli, whose sons (Hophni and Phinehas) were corrupt. <em>"In those days the word of the LORD was rare"</em> (1Sam.3:1) — Israel was spiritually low. One night, God called: <em>"Samuel! Samuel!"</em> Samuel ran to Eli three times, thinking the old priest was calling. After the third time, Eli realised it was God and told Samuel: <em>"Speak, LORD, for your servant is listening."</em></p>'},
  {lb:'Samuel\'s response and the message',dr:dQ2,ht:'<p>Samuel said: <em>"Speak, for your servant is listening"</em> (1Sam.3:10). God revealed a message of judgment on Eli\'s household because of his sons\' wickedness. Samuel was afraid to tell Eli the vision. But Eli pressed him, and Samuel told him everything faithfully. Eli accepted God\'s judgment: <em>"He is the LORD; let him do what is good in his eyes"</em> (1Sam.3:18). Delivering hard messages faithfully is part of holiness.</p>'},
  {lb:'Samuel established as prophet',dr:dQ1,ht:'<p><em>"The LORD was with Samuel as he grew up, and he let none of Samuel\'s words fall to the ground. And all Israel from Dan to Beersheba recognised that Samuel was attested as a prophet of the LORD"</em> (1Sam.3:19-20). Lessons: (1) God can call children. (2) Spiritual discernment (Eli\'s guidance) helps recognise God\'s voice. (3) Faithfulness in delivering difficult messages is part of holiness. (4) God\'s call restores spiritual vitality to a nation.</p>'},
  {lb:'Samuel\'s life of holiness',dr:dQ1,ht:'<p>Samuel\'s whole life demonstrated holiness: dedicated to God before birth by his mother Hannah; raised in the temple; responsive to God\'s call; faithful in delivering God\'s word even when hard. He anointed both Saul and David as kings. At the end of his life he said: <em>"I have not defrauded anyone... nor have I taken a bribe"</em> (1Sam.12:3-4). Samuel shows that holiness means being wholly set apart and faithful throughout a lifetime of service.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Samuel heard God\'s voice but initially thought it was:',o:['His mother Hannah','The prophet Nathan','The priest Eli','An angel in the temple'],a:3,w:'Samuel ran to Eli three times — Eli was the only other person Samuel knew who might call at night in the temple.'},{q:'What instruction did Eli give Samuel on the third occasion?',o:['Go back to sleep; it is only a dream','Say "Speak, LORD, for your servant is listening"','Run outside, for God will appear to you','Anoint the doorposts with oil'],a:2,w:'After the third time, Eli understood it was God calling and instructed Samuel: "Go and lie down, and if he calls you, say, \'Speak, LORD, for your servant is listening.\'"'},{q:'The message God gave Samuel concerned:',o:['The coming of the Messiah','Judgment on Eli\'s household because of his sons\' wickedness','The defeat of the Philistines','The building of the temple'],a:2,w:'God\'s message to Samuel was of judgment on Eli\'s house — because Eli failed to restrain his sons Hophni and Phinehas who were blaspheming God (1Sam.3:11-14).'},{q:'"From Dan to Beersheba" (1Sam.3:20) means Samuel was recognised as a prophet:',o:['Only in the two cities of Dan and Beersheba','Throughout the whole of Israel, north to south','In the temple region only','Among the tribe of Levi only'],a:2,w:'"From Dan to Beersheba" is the Hebrew expression for the whole land of Israel — from the northernmost point (Dan) to the southernmost (Beersheba).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 OT',ti:'The Meaning of Holiness in the Old Testament',su:'Explain what holiness means and its demands on God\'s people.',steps:[
  {lb:'God\'s holiness — the foundation',dr:dQ1,ht:'<p>In the OT, the Hebrew word for holy is <em>qadosh</em> — meaning "set apart" or "other." God is holy in the most absolute sense: He is wholly other than creation, morally perfect and utterly pure. The Holiness Code (Leviticus 17-26) declares repeatedly: <em>"Be holy because I, the LORD your God, am holy"</em> (Lev.19:2). God\'s holiness is the foundation of all moral demands on Israel — His character is the standard, not human opinion or cultural norms.</p>'},
  {lb:'Holiness in worship',dr:dQ1,ht:'<p>Israel\'s worship system reflected God\'s holiness: (1) The <b>Tabernacle/Temple</b> — courts leading to the Holy of Holies (only the High Priest entered, once per year). (2) <b>Priests</b> — consecrated and set apart for God\'s service. (3) <b>Sacrifices</b> — covering sin so worshippers could approach a holy God. (4) <b>Sabbath</b> — a holy day set apart for God. (5) <b>Dietary laws</b> — marking Israel as separate from surrounding nations. All said: God is holy; approach Him with reverence.</p>'},
  {lb:'Holiness in daily life (Leviticus 19)',dr:dQ2,ht:'<p>The Holiness Code demanded holiness in everyday life: (1) Honour parents (v.3). (2) No idols (v.4). (3) Leave food for the poor — gleaning laws (v.9-10). (4) No theft, lies or deceit (v.11). (5) Fair wages (v.13). (6) No partiality in courts (v.15). (7) Love your neighbour as yourself (v.18). (8) No mediums or spiritists (v.31). Holiness was not only ritual purity but ethical living that reflected God\'s own character.</p>'},
  {lb:'Israel as a holy nation',dr:dQ2,ht:'<p>Israel was called to be a <em>"kingdom of priests and a holy nation"</em> (Ex.19:6) — set apart from all other nations to be God\'s special witness. This required: separation from pagan practices; faithfulness to the covenant; moral integrity; compassion for the stranger and poor. Isaiah, Amos and the prophets condemned Israel for seeking ritual holiness while practising social injustice. True holiness integrates worship and ethics — a lesson that applies equally to Christians today (1Pet.1:15-16).</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The Hebrew word for "holy" (qadosh) primarily means:',o:['Perfect and sinless in character','Set apart or other — different from the ordinary','Dedicated to temple service only','Morally superior to other nations'],a:2,w:'Qadosh means "set apart" or "other" — holy things, people and places are distinguished from ordinary ones. God is holy because He is utterly other than creation.'},{q:'The verse "Be holy because I, the LORD your God, am holy" is from:',o:['Exodus 20','Deuteronomy 6','Leviticus 19:2','Isaiah 6'],a:3,w:'Leviticus 19:2 — the foundational verse of the Holiness Code — God\'s own holiness is the basis and standard for His people\'s holiness.'},{q:'Israel was called to be "a kingdom of priests and a holy nation" in:',o:['Genesis 12','Exodus 19:6','Deuteronomy 28','Numbers 6'],a:2,w:'Exodus 19:6 — God\'s covenant declaration at Sinai: Israel was to be a kingdom of priests (mediators) and a holy nation (set apart for God).'},{q:'The OT prophets criticised Israel for seeking ritual holiness while:',o:['Studying the Law too much','Practising social injustice and oppressing the poor','Worshipping too loudly in the temple','Following Moses\'s laws too strictly'],a:2,w:'Isaiah, Amos and Micah condemned Israel for offering sacrifices while oppressing the poor and perverting justice — true holiness must integrate worship AND ethics.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 OT',ti:'Ezekiel\'s Call and Vision of Glory',su:'Examine Ezekiel\'s vision and his call as watchman (Ezekiel 1-3).',steps:[
  {lb:'The vision of God\'s glory (Ezekiel 1)',dr:dQ2,ht:'<p>Ezekiel (a priest exiled in Babylon, ~593 BC) saw an overwhelming vision: a stormy wind from the north, a great cloud with fire, and four living creatures (cherubim — each with four faces: man, lion, ox, eagle). Above them was a crystal expanse; above that, a sapphire throne; and on the throne was a figure like a man surrounded by radiance like a rainbow. Ezekiel wrote: <em>"This was the appearance of the likeness of the glory of the LORD"</em> (1:28). He fell face down in awe.</p>'},
  {lb:'The commission and scroll',dr:dQ2,ht:'<p>God told Ezekiel to stand up, and the Spirit entered him. God commissioned him to go to Israel — <em>"a rebellious nation"</em> (2:3). God told him to eat a scroll written with laments and woe (2:9-3:3). Ezekiel ate it and <em>"it tasted as sweet as honey"</em> (3:3) — receiving God\'s word internally before proclaiming it externally. This symbolised the prophet\'s need to internalise God\'s message before declaring it to others.</p>'},
  {lb:'Ezekiel as watchman (Ezekiel 3:17-18)',dr:dQ1,ht:'<p>God appointed Ezekiel as a <em>watchman</em>: <em>"When I say to a wicked person, \'You will surely die,\' and you do not warn them... I will hold you accountable for their blood"</em> (3:18). But if Ezekiel warned and they did not repent, their blood was on their own hands. This makes the prophet personally responsible for faithful proclamation — prophetic courage and accountability are part of holiness and the divine call.</p>'},
  {lb:'Lessons from Ezekiel',dr:dQ1,ht:'<p>Ezekiel\'s call teaches: (1) God\'s glory transcends location — even in Babylon, God appeared. (2) Internalising God\'s word (eating the scroll) precedes proclaiming it. (3) Prophets bear responsibility for faithful warning. (4) God\'s holiness can be revealed even to a defeated, exiled people. This last point was revolutionary — Israelites thought God lived only in Jerusalem\'s temple. Ezekiel showed God is everywhere sovereign.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Ezekiel was by profession:',o:['A shepherd like Amos','A farmer from the north','A priest exiled to Babylon','A soldier in David\'s army'],a:3,w:'Ezekiel was a priest (Ezekiel 1:3) exiled to Babylon around 597 BC, where he received his prophetic call in 593 BC.'},{q:'What did Ezekiel do with the scroll, and what did it taste like?',o:['He burned it; it smelled sweet','He hid it; it was sealed','He ate it; it tasted as sweet as honey','He gave it to the elders; they refused'],a:3,w:'Ezekiel 3:1-3 — God told Ezekiel to eat the scroll; "it tasted as sweet as honey in my mouth" — receiving God\'s word internally before proclaiming it.'},{q:'God appointed Ezekiel as a "watchman" meaning:',o:['He guarded the temple in Jerusalem','He was responsible for warning the wicked — or bear responsibility for their blood','He watched for signs of the enemy army','He assessed other prophets\' accuracy'],a:2,w:'Ezekiel 3:17-18 — appointed watchman: responsible to warn the wicked; if he failed to warn and they died in sin, God would hold Ezekiel accountable for their blood.'},{q:'Ezekiel\'s vision of God\'s glory in Babylon showed:',o:['God had abandoned Israel for Babylon','Babylon was holier than Jerusalem','God\'s glory is not limited to the Jerusalem temple — He is everywhere sovereign','Nebuchadnezzar was God\'s chosen king'],a:3,w:'Ezekiel\'s vision in Babylon was revolutionary — Israelites thought God\'s presence was confined to Jerusalem\'s temple. God\'s appearance in Babylon showed He is omnipresent and sovereign.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 OT',ti:'Gideon and Elijah — Called in Weakness',su:'Examine God\'s call of Gideon and Elijah despite their weakness.',steps:[
  {lb:'Gideon\'s call (Judges 6)',dr:dQ1,ht:'<p>Israel was oppressed by the Midianites. Gideon was threshing wheat in a winepress (hiding) when the angel of the LORD appeared: <em>"The LORD is with you, mighty warrior"</em> (Judg.6:12). Gideon objected: (1) If the LORD is with us, why has all this happened? (2) My clan is the weakest in Manasseh, and I am the least in my family (v.15). God responded: <em>"I will be with you, and you will strike down all the Midianites"</em> (v.16). God graciously gave Gideon signs — the fleece tests — to strengthen his faith.</p>'},
  {lb:'Elijah at Mount Horeb (1 Kings 19)',dr:dQ2,ht:'<p>After his great victory over the prophets of Baal at Carmel, Elijah fled from Jezebel, collapsed under a broom tree and prayed to die: <em>"I have had enough, LORD. Take my life"</em> (1Kings19:4). God did not rebuke him but sent an angel twice with food and water. Then God came — not in wind, earthquake or fire, but in a <em>"gentle whisper"</em> (v.12 NIV) / "still small voice" (KJV). God re-commissioned Elijah with three new tasks.</p>'},
  {lb:'The gentle whisper and God\'s correction',dr:dQ2,ht:'<p>God asked: <em>"What are you doing here, Elijah?"</em> (1Kings19:9,13). Elijah complained: "I am the only one left." God corrected him: there were still 7,000 in Israel who had not bowed to Baal (v.18). Lessons: (1) God comes gently to the exhausted. (2) God corrects self-pity with truth. (3) God does not abandon a fleeing prophet. (4) The gentle whisper suggests God is often found in quiet, not only in spectacular displays. (5) God\'s commission continues even through weakness.</p>'},
  {lb:'Lessons from Gideon and Elijah',dr:dQ1,ht:'<p>Both were called when weak and afraid — showing holiness does not mean absence of fear. God: (1) Sees beyond human weakness to His own power. (2) Provides physical care before spiritual recommissioning (Elijah\'s food). (3) Corrects false beliefs ("I alone am left" — not true). (4) Patiently answers requests for signs. (5) Restores and re-commissions the fallen. These stories give hope that God uses imperfect, weak people for His holy purposes.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'When Gideon was called, he objected that his clan was the weakest and he was:',o:['Too old to fight','The least in his family','A foreigner not born in Israel','Blind and unable to lead'],a:2,w:'Judges 6:15 — "My clan is the weakest in Manasseh, and I am the least in my family" — Gideon saw himself as doubly insignificant but God called him anyway.'},{q:'God came to Elijah at Mount Horeb in:',o:['A mighty wind that tore the mountains apart','An earthquake that shook the ground','A fire from heaven','A gentle whisper (still small voice)'],a:4,w:'1 Kings 19:11-12 — God was not in wind, earthquake or fire, but in a "still small voice" (KJV) / "gentle whisper" (NIV) — God meets the exhausted gently.'},{q:'Elijah\'s complaint to God at Mount Horeb was:',o:['The Israelites had killed all the animals','The temple had been destroyed','He was the only prophet of the LORD left and his life was in danger','God had not answered his prayers for rain'],a:3,w:'1 Kings 19:10 — "I am the only one left, and now they are trying to kill me too" — Elijah felt completely alone. God corrected him: 7,000 had not bowed to Baal.'},{q:'God corrected Elijah\'s sense of isolation by revealing:',o:['That no prophets of Baal remained','That Jezebel had already repented','That 7,000 in Israel had not bowed the knee to Baal','That the king of Aram would protect him'],a:3,w:'1 Kings 19:18 — "Yet I reserve seven thousand in Israel — all whose knees have not bowed down to Baal" — Elijah was not alone; God had a faithful remnant.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 OT',ti:'Holiness in the Psalms',su:'Explore what the Psalms teach about holiness and approaching God.',steps:[
  {lb:'Psalm 24 — Who may ascend?',dr:dQ1,ht:'<p>Psalm 24 asks: <em>"Who may ascend the mountain of the LORD? Who may stand in his holy place?"</em> (v.3). The answer: <em>"The one who has clean hands and a pure heart, who does not trust in an idol or swear by a false name"</em> (v.4). This connects holiness to: (1) Moral purity — clean hands (actions). (2) Inner purity — pure heart (motives). (3) Exclusive devotion to God — no idols. (4) Truthfulness — no false oaths. Holiness is both inward and outward, not merely ritual.</p>'},
  {lb:'Psalm 51 — Confession and renewal',dr:dQ2,ht:'<p>Psalm 51 (David\'s repentance after the Bathsheba/Uriah affair) cries: <em>"Create in me a pure heart, O God, and renew a steadfast spirit within me"</em> (v.10). It teaches: (1) Holiness, once broken by sin, can be restored through repentance. (2) God desires truth in the inner parts (v.6) — integrity, not performance. (3) A broken and contrite heart is the sacrifice God desires (v.17). (4) Restored holiness leads to renewed service: "Then I will teach transgressors your ways" (v.13).</p>'},
  {lb:'Psalm 99 — The Holy God enthroned',dr:dQ1,ht:'<p>Psalm 99 repeatedly declares: <em>"Holy is he"</em> (vv.3,5,9). It presents God as king enthroned above the cherubim (v.1), exalted above all nations. He established justice and righteousness (v.4). He answered Moses, Aaron and Samuel when they called (vv.6-7). The psalm connects holiness with: justice, answered prayer, forgiveness of sins, and just accountability. God\'s holiness is not cold distance but engaged, just, responsive kingship.</p>'},
  {lb:'Implications for worship and life',dr:dQ2,ht:'<p>The Psalms teach that approaching a holy God requires: (1) Repentance (Ps.51). (2) Moral integrity — clean hands and pure heart (Ps.24). (3) Reverence and awe (Ps.99 — "let them tremble"). (4) Praise and thanksgiving. (5) Trust that God forgives (Ps.51:1 — "blot out my transgressions"). WAEC: be able to quote from these Psalms and explain what each reveals about God\'s holiness and the response required.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Psalm 24 says the person who may stand in God\'s holy place must have:',o:['Offered the correct sacrifices at the temple','Clean hands and a pure heart — moral and inner purity','Been ordained as a Levite priest','Observed all the dietary laws'],a:2,w:'Psalm 24:3-4 — "clean hands and a pure heart" — holiness is both outward (actions/hands) and inward (heart/motives), not merely ritual status.'},{q:'Psalm 51 was written by David following his sin involving:',o:['The killing of Goliath','Disobeying God at the Red Sea','The Bathsheba and Uriah affair','His flight from Absalom'],a:3,w:'Psalm 51 is David\'s prayer of repentance after Nathan confronted him about his adultery with Bathsheba and murder of Uriah her husband (2 Samuel 11-12).'},{q:'The sacrifice God truly desires, according to Psalm 51:17, is:',o:['A burnt offering of a bull','A grain offering with incense','A broken spirit and a contrite heart','A peace offering shared with the priests'],a:3,w:'Psalm 51:17 — "My sacrifice, O God, is a broken spirit; a broken and contrite heart you, God, will not despise" — inward repentance over outward ritual.'},{q:'Psalm 99 connects God\'s holiness with:',o:['God\'s distance from human affairs','Justice, righteousness, answered prayer and accountability','The building of the temple and priestly duties','The victory of Israel over its enemies'],a:2,w:'Psalm 99 connects holiness with: justice and righteousness (v.4), God answering Moses, Aaron and Samuel (v.6), forgiveness and accountability (v.8).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 OT',ti:'WAEC Prep — Holiness and Divine Call',su:'Practise WAEC-style questions on holiness and divine call.',steps:[
  {lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC questions on holiness and divine call: (1) Define the concept. (2) Give the pattern of divine call. (3) Discuss specific calls with scripture references. (4) State the lessons. (5) Apply to Christian life today. Common questions: "Discuss the call of Isaiah." / "What does the OT teach about holiness?" / "Compare the calls of Moses and Jeremiah." Always give chapter references (e.g. Isaiah 6, Exodus 3, Jeremiah 1) — WAEC awards marks for specific references.</p>'},
  {lb:'Key scripture references',dr:dQ1,ht:'<p>WAEC reference bank: Isaiah 6:1-9 (vision, coal, "Here am I"). Exodus 3 (burning bush, "I AM WHO I AM"). Jeremiah 1:4-10 (before birth, too young, mouth touched). 1 Samuel 3 (Samuel, "Speak LORD", judgment on Eli). Ezekiel 1-3 (glory vision, scroll eaten, watchman). Judges 6 (Gideon, weakest clan). 1 Kings 19 (Elijah, gentle whisper, 7,000 remnant). Leviticus 19:2 ("Be holy because I am holy"). Exodus 19:6 ("kingdom of priests").</p>'},
  {lb:'Comparing the divine calls',dr:dQ2,ht:'<p>WAEC comparison points: Moses — burning bush; "I AM"; 5 objections; miraculous signs. Isaiah — temple vision; coal on lips; "Here am I, send me"; no objection. Jeremiah — called before birth; too young; mouth touched; 40-year ministry. Samuel — voice in night; child; Eli\'s guidance; hard message. Ezekiel — overwhelming vision; scroll eaten; watchman role; exile. Common: divine encounter, commission, God\'s assurance of presence.</p>'},
  {lb:'Common WAEC mistakes',dr:dQ1,ht:'<p>Avoid: Confusing Isaiah\'s coal (cleansing) with Ezekiel\'s scroll (internalising the word). Saying Moses had no objections (he had five). Saying Jeremiah was old when called (he was young). Mixing up Elijah (1 Kings) and Elisha (his successor). Forgetting Ezekiel was a priest AND a prophet. Not knowing the scripture references — WAEC expects book and chapter, not just the story. Never say "it is written" without stating the exact reference.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Which prophet\'s call involved eating a scroll that tasted like honey?',o:['Isaiah','Jeremiah','Ezekiel','Samuel'],a:3,w:'Ezekiel 3:1-3 — God told Ezekiel to eat the scroll; "it tasted as sweet as honey in my mouth." Isaiah had a coal; Jeremiah had God touch his mouth.'},{q:'"Before I formed you in the womb I knew you" is from God\'s call of:',o:['Moses','Samuel','Isaiah','Jeremiah'],a:4,w:'Jeremiah 1:5 — God\'s call of Jeremiah specifically stated he was known and set apart before his birth — the most pre-birth emphasis of any prophetic call.'},{q:'What did Isaiah\'s call (Is.6) and Ezekiel\'s call (Ezek.1-3) have in common?',o:['Both involved a burning bush','Both revealed God\'s glory and led to a prophetic commission','Both came during the reign of King Josiah','Both involved the prophet refusing to go'],a:2,w:'Both Isaiah and Ezekiel had overwhelming visions of God\'s glory followed by a prophetic commission — though in different settings with different symbolic elements.'},{q:'The Holiness Code repeatedly commanding "Be holy because I am holy" is found in:',o:['Exodus','Numbers','Leviticus','Deuteronomy'],a:3,w:'The Holiness Code is found in Leviticus 17-26, with the foundational command in Leviticus 19:2 — God\'s holiness is the basis of the demand for human holiness.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 OT',ti:'Mixed Questions — Holiness and Divine Call',su:'Integrated revision across all CRS-OT-06 topics.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Holiness (qadosh): set apart; God\'s absolute purity; basis of all moral demands. Calls: Isaiah (Is.6 — coal, "Here am I"); Moses (Ex.3 — bush, "I AM", 5 objections); Jeremiah (Jer.1 — before birth, too young, mouth touched); Samuel (1Sam.3 — voice in night, Eli\'s guidance); Ezekiel (Ezek.1-3 — glory vision, scroll eaten, watchman); Gideon (Judg.6 — weakest clan); Elijah (1Kings19 — gentle whisper, 7,000 remnant). Lev.19:2: "Be holy because I am holy."</p>'},
  {lb:'Key connections',dr:dQ10,ht:'<p>God\'s holiness → human unworthiness → divine cleansing → commission → obedient service. The calls show: God uses the weak (Gideon, Elijah, Jeremiah). God cleanses before commissioning (Isaiah\'s coal, Jeremiah\'s mouth). God\'s presence makes places holy (Moses\'s burning bush). God\'s word must be internalised (Ezekiel\'s scroll). God\'s call can come at any age (Samuel as child; Jeremiah before birth). God\'s call is sovereign, not based on human merit or qualification.</p>'},
  {lb:'Application to Christian life',dr:dQ1,ht:'<p>Lessons for Christians: (1) God still calls people today for specific purposes. (2) No one is too weak, young, old or unworthy for God\'s call. (3) God always provides what the called person needs. (4) Holiness is not just ritual but ethical — justice, honesty, care for the poor. (5) Responding to God\'s call requires courage. (6) The call is for service, not privilege. (7) God\'s presence is the promise that sustains the called person through difficulties and opposition.</p>'},
  {lb:'WAEC final tips',dr:dQ10,ht:'<p>Final revision: Know all seven calls (Isaiah, Moses, Jeremiah, Samuel, Ezekiel, Gideon, Elijah) with chapter references. Know the common pattern of divine call. Know the Holiness Code (Leviticus). Know the difference between Isaiah\'s coal (moral cleansing) and Ezekiel\'s scroll (word internalised). Know Elijah\'s gentle whisper. For essays: define → examples with scripture → lessons → apply to today. 5 minimum points for full WAEC marks. Spend 25-30 minutes on 25-mark essays.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Which call involved someone hiding from oppressors when they were called?',o:['Isaiah (Is.6)','Jeremiah (Jer.1)','Gideon (Judg.6)','Elijah (1Kings19)'],a:3,w:'Gideon was threshing wheat in a winepress — hiding from Midianite oppressors — when the angel of the LORD appeared to him (Judges 6:11-12).'},{q:'The "gentle whisper" at Mount Horeb (1Kings19) teaches that:',o:['God is always silent and never speaks clearly','God meets the exhausted prophet gently, not always in dramatic displays','Mount Horeb is the only place God speaks','Elijah was wrong to be afraid'],a:2,w:'The still small voice contrasted with wind, earthquake and fire — teaching that God often comes quietly to the burned-out and fearful prophet.'},{q:'The key difference between Isaiah\'s coal and Ezekiel\'s scroll is:',o:['Isaiah\'s coal was from heaven; Ezekiel\'s scroll was from the altar','The coal cleansed Isaiah from sin; the scroll equipped Ezekiel with God\'s word to internalise','Both had the same purpose but different symbols','Isaiah refused; Ezekiel accepted immediately'],a:2,w:'Isaiah 6 — coal from the altar cleansed Isaiah\'s sin (moral preparation). Ezekiel 3 — eating the scroll internalised God\'s word (message preparation). Different purposes.'},{q:'The pattern common to ALL the divine calls studied is:',o:['God appears in fire; prophet objects; prophet obeys','Divine encounter → unworthiness/objection → reassurance → commission','The prophet must fast 40 days before the call','Only priests and Levites receive divine calls'],a:2,w:'The common pattern: God encounters the person → person responds with fear/unworthiness/objection → God reassures and equips → commission → obedience.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
