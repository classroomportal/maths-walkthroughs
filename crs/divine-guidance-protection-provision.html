<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Divine Guidance, Protection and Provision',ACC,11,'middle',true));
[['Event','Reference','Key Theme'],['The Exodus','Exodus 12-14','Deliverance from slavery by God\'s power'],['Crossing the Red Sea','Exodus 14','Protection and miraculous deliverance'],['Manna and quails','Exodus 16','Daily provision in the wilderness'],['Water from the rock','Exodus 17','Provision when resources fail'],['The bronze serpent','Numbers 21','Healing through faith and obedience'],['Pillar of cloud/fire','Exodus 13:21','Guidance day and night'],['The Ten Plagues','Exodus 7-12','God\'s power over Egypt\'s gods']].forEach(function(r,i){if(i<=p){o.push(R(10,22+i*24,460,20,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(80,34+i*24,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(210,34+i*24,r[1],'#444',7,'middle',false));o.push(T(370,34+i*24,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}

if(p>=2){o.push(R(10,90,460,40,CRM,ACC,1.5));o.push(T(240,108,'Passover: blood of lamb on doorposts; death angel passed over Israel','#333',10,'middle',false));}
if(p>=3){o.push(R(10,140,460,40,CRM,ACC,1.5));o.push(T(240,158,'Pillar of cloud (day) and fire (night) guided Israel (Ex 13:21)','#333',10,'middle',false));}
if(p>=4){o.push(R(10,190,460,60,LINE,ACC,1));o.push(T(240,210,'Red Sea: God parted the waters; Israel crossed; army drowned (Ex 14)','#333',9,'middle',false));o.push(T(240,230,'Significance: God delivers His people from impossible situations','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Wilderness Provision (Exodus 16-17, Numbers 21)',ACC,11,'middle',true));
if(p>=1){o.push(R(10,38,460,42,CRM,ACC,2));o.push(T(240,56,'Manna (Ex 16): bread from heaven, daily provision; double on Friday',DARK,10,'middle',false));o.push(T(240,74,'Quails (Ex 16:13): meat provided when people complained','#555',9,'middle',false));}
if(p>=2){o.push(R(10,90,460,40,CRM,ACC,1.5));o.push(T(240,108,'Water at Marah (Ex 15:25): Moses threw a stick; bitter water sweetened','#333',10,'middle',false));}
if(p>=3){o.push(R(10,140,460,40,CRM,ACC,1.5));o.push(T(240,158,'Water from the rock (Ex 17): Moses struck the rock at Horeb','#333',10,'middle',false));o.push(T(240,176,'Later at Meribah (Num 20): Moses struck twice — his greatest failure','#555',9,'middle',false));}
if(p>=4){o.push(R(10,190,460,60,LINE,ACC,1));o.push(T(240,210,'Bronze serpent (Num 21): snake bites; Moses made bronze snake on pole','#333',9,'middle',false));o.push(T(240,230,'John 3:14-15: just as Moses lifted up serpent, so must Son of Man be lifted','#555',9,'middle',false));}
s.innerHTML=o.join('');}

[['Exodus','God delivers from slavery; 10 plagues; Passover'],['Red Sea','God parts waters; army destroyed; Ex 14:14 "Lord will fight"'],['Manna','Daily bread from heaven; double on Sabbath eve (Ex 16)'],['Quails','God provides meat in the wilderness (Ex 16:13)'],['Water from rock','Struck at Horeb; Ex 17:6 — water for 2 million+'],['Bronze serpent','Look and live (Num 21); foreshadows Christ (John 3:14)'],['Key lesson','God guides, protects and provides for His people always']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(100,52+i*30,r[0],ACC,9,'middle',true));o.push(T(300,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Old Testament',ti:'The Exodus — God\'s Deliverance',su:'Describe the Exodus and what it reveals about God\'s character.',steps:[
  {lb:'Background — Israel in Egypt',dr:dQ2,ht:'<p>Genesis 46 — Jacob\'s family (70 people) moved to Egypt during the famine. After Joseph\'s death, a new Pharaoh arose who did not know Joseph (Ex 1:8) and enslaved Israel. Israel grew to perhaps 2 million people over 400 years. Exodus 1:11-14 — they were forced to build Pithom and Rameses as store cities. Pharaoh ordered male babies killed. God heard their cry (Ex 2:24-25) and remembered His covenant with Abraham, Isaac and Jacob.</p>'},
  {lb:'The Ten Plagues',dr:dQ2,ht:'<p>God sent 10 plagues, each targeting Egyptian gods: Water to blood (Nile god); Frogs (frog goddess Heqet); Gnats/Lice; Flies; Livestock disease; Boils; Hail; Locusts; Darkness (sun god Ra); Death of firstborn (including Pharaoh\'s son). Exodus 12:12 — <em>"I will bring judgment on all the gods of Egypt."</em> Pharaoh repeatedly hardened his heart (some plagues), or God hardened it (others) — demonstrating God\'s sovereignty over both Pharaoh and Egypt\'s religion.</p>'},
  {lb:'The Passover',dr:dQ2,ht:'<p>Exodus 12 — each Israelite household killed a lamb and put its blood on the doorposts and lintel. The angel of death passed over houses with blood. Egypt\'s firstborn died; Israel\'s were spared. Pharaoh released Israel. The Passover became Israel\'s most important annual festival, commemorated to this day. Christians see the Passover as a foreshadow of Christ — <em>"Christ our Passover lamb has been sacrificed"</em> (1 Cor 5:7). Blood brings deliverance.</p>'},
  {lb:'God\'s guidance in the wilderness',dr:dQ2,ht:'<p>Exodus 13:21-22 — <em>"By day the Lord went ahead of them in a pillar of cloud to guide their way, and by night in a pillar of fire to give them light."</em> God\'s presence was tangible and visible. At the Red Sea, the pillar moved behind Israel to protect them from Pharaoh\'s army. God parted the sea (Ex 14:21 — a strong east wind all night). Israel crossed; when Pharaoh\'s army followed, the waters returned and drowned them.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Exodus 1:8 says a new Pharaoh arose who "did not know..."',o:['God','The Hebrews','Joseph','Moses'],a:3,w:'Exodus 1:8 — "a new king came to power in Egypt who did not know about Joseph."'},{q:'What was the 10th and final plague on Egypt?',o:['Darkness for 3 days','Death of all livestock','Hail and fire','Death of every firstborn'],a:4,w:'Exodus 12:29 — at midnight, the Lord struck down all the firstborn in Egypt.'},{q:'What did Israelites put on their doorposts on the night of the Passover?',o:['Oil','Water','The blood of a lamb','Ashes'],a:3,w:'Exodus 12:7 — they put the blood of the lamb on the sides and tops of the doorframes.'},{q:'1 Corinthians 5:7 says "Christ our Passover lamb..." — this means:',o:['Jesus celebrated the Passover feast','Jesus\' death is the fulfillment of the Passover sacrifice','Jesus was killed on the same day as Passover','Jesus freed Israel from Egypt'],a:2,w:'1 Corinthians 5:7 — "Christ, our Passover lamb, has been sacrificed" — His death fulfills what the Passover lamb foreshadowed.'},{q:'Which leader did God call from a burning bush to lead Israel out of Egypt?',o:['Aaron','Moses','Joshua','Joseph'],a:2,w:'Exodus 3 — God called Moses from the burning bush.'},{q:'What was the first of the ten plagues on Egypt?',o:['Frogs','The Nile turning to blood','Locusts','Boils'],a:2,w:'Exodus 7:20 — the first plague turned the Nile\'s water to blood.'},{q:'What were the Israelites commanded to eat with the Passover lamb?',o:['Fish and honey','Unleavened bread and bitter herbs','Fruit only','Manna'],a:2,w:'Exodus 12:8 — the lamb was eaten with unleavened bread and bitter herbs.'},{q:'According to Exodus 12:13, what would the blood on the doorposts cause?',o:['Blessing of wealth on the house','The Lord to pass over the house, sparing the firstborn','The house to be marked for destruction','An angel to guard the door only'],a:2,w:'Exodus 12:13 — the blood was a sign; the Lord would pass over that house.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Old Testament',ti:'Crossing the Red Sea',su:'Narrate the crossing of the Red Sea and its significance.',steps:[
  {lb:'Israel trapped at the Red Sea',dr:dQ2,ht:'<p>Exodus 14:1-9 — After leaving Egypt, God led Israel towards the Red Sea. Pharaoh changed his mind and pursued with 600 chariots. Israel saw the Egyptian army approaching and panicked — they cried out to Moses: <em>"Was it because there were no graves in Egypt that you brought us to the desert to die?"</em> (Ex 14:11). They were trapped — sea ahead, army behind. This is when God acts most powerfully — when the situation is humanly impossible.</p>'},
  {lb:'Moses\' response',dr:dQ2,ht:'<p>Exodus 14:13-14 — Moses said: <em>"Do not be afraid. Stand firm and you will see the deliverance the Lord will bring you today. The Egyptians you see today you will never see again. The Lord will fight for you; you need only to be still."</em> God then told Moses to raise his staff over the sea. The pillar of cloud moved between Egypt and Israel — bringing darkness to the Egyptians and light to Israel. God used the natural (a strong east wind, Ex 14:21) to achieve the miraculous.</p>'},
  {lb:'The crossing',dr:dQ2,ht:'<p>Exodus 14:21-22 — Moses stretched out his hand; God drove back the sea with a strong east wind all night, turning it into dry land. Israel walked through on dry ground with walls of water on either side. When the Egyptians followed, God confused them — their chariot wheels got stuck (v25). Moses again stretched out his hand; the sea returned and covered the entire army. Not one of them survived. It was a total, miraculous deliverance.</p>'},
  {lb:'Response and significance',dr:dQ2,ht:'<p>Exodus 15 — Moses and Israel sang the Song of the Sea: <em>"I will sing to the Lord, for he is highly exalted; the horse and its rider he has hurled into the sea."</em> Miriam led the women in dancing with tambourines. The Red Sea crossing became Israel\'s defining act of salvation — what the cross is to Christians. It demonstrated: God fights for His people, the impossible is possible with God, and God keeps His covenant promises.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Exodus 14:14 declares "The Lord will fight for you; you need only to be..."',o:['brave','obedient','still','faithful'],a:3,w:'Exodus 14:14 — "The Lord will fight for you; you need only to be still."'},{q:'What natural phenomenon did God use to part the Red Sea?',o:['An earthquake','A strong east wind','A pillar of fire','Moses\' staff turning into a snake'],a:2,w:'Exodus 14:21 — "the Lord drove the sea back with a strong east wind and turned it into dry land."'},{q:'What happened to the Egyptian army when they followed Israel into the sea?',o:['They turned back','Their chariots bogged down and the sea covered them — all drowned','They were blinded','They surrendered'],a:2,w:'Exodus 14:27-28 — the sea returned; the entire army drowned. "Not one of them survived."'},{q:'Who led the women in dancing after the Red Sea crossing?',o:['Deborah','Ruth','Miriam','Zippora'],a:3,w:'Exodus 15:20 — "Miriam the prophetess, Aaron\'s sister, took a tambourine and led the women in dancing."'},{q:'What did Moses do with his staff to part the sea, as God commanded?',o:['Struck the ground','Stretched it out over the sea','Threw it into the water','Broke it in half'],a:2,w:'Exodus 14:16 — Moses stretched out his staff over the sea to divide it.'},{q:'What song did Moses and Israel sing after crossing the Red Sea?',o:['The Song of Moses','The Lord\'s Prayer','Psalm 23','The Song of Deborah'],a:1,w:'Exodus 15 records the Song of Moses, celebrating the Lord\'s victory over Pharaoh\'s army.'},{q:'How did Israel cross the Red Sea, according to Exodus 14:22?',o:['By boat','On dry ground, with walls of water on both sides','By swimming','Over a bridge Moses built'],a:2,w:'Exodus 14:22 — the Israelites went through the sea on dry ground, water forming a wall on each side.'},{q:'What did Israel express toward Moses just before the sea parted?',o:['Confidence and joy','Complaint and fear of being caught','Indifference','Anger only at Aaron'],a:2,w:'Exodus 14:10-12 — the people were terrified and complained to Moses, fearing Pharaoh\'s army.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Old Testament',ti:'Manna and Quails in the Wilderness',su:'Describe God\'s provision of manna and quails.',steps:[
  {lb:'Israel\'s complaint',dr:dQ3,ht:'<p>Exodus 16:1-3 — In the Desert of Sin, the whole Israelite community grumbled against Moses and Aaron: <em>"If only we had died by the Lord\'s hand in Egypt! There we sat around pots of meat and ate all the food we wanted, but you have brought us out into this desert to starve this entire assembly to death."</em> Israel\'s grumbling is a recurring theme. Yet God responded with provision, not punishment — showing His grace despite their faithlessness.</p>'},
  {lb:'God provides manna',dr:dQ3,ht:'<p>Exodus 16:4-5 — God told Moses: <em>"I will rain down bread from heaven for you. The people are to go out each day and gather enough for that day."</em> On the 6th day they could gather double (for the Sabbath). The manna appeared each morning — a thin flake like frost (v14). It tasted like wafers made with honey (v31). It could not be kept overnight (it went bad) — teaching daily dependence on God. Manna provided for 40 years until Israel entered Canaan (Josh 5:12).</p>'},
  {lb:'God provides quails',dr:dQ3,ht:'<p>Exodus 16:13 — <em>"That evening quail came and covered the camp."</em> God provided meat when Israel craved it. Later in Numbers 11, Israel again craved meat: God sent quail so abundantly that it was piled 3 feet high for a day\'s walk in every direction (Num 11:31). However, Numbers 11:33 — while the meat was still in their mouths, God struck those who had craved meat with a plague. Provision came, but greed and ingratitude had consequences.</p>'},
  {lb:'Significance of manna',dr:dQ3,ht:'<p>Deuteronomy 8:3 — <em>"He humbled you, causing you to hunger and then feeding you with manna... to teach you that man does not live on bread alone but on every word that comes from the mouth of God."</em> Jesus quoted this in the wilderness temptation (Matt 4:4). Jesus also called Himself the <em>"Bread of Life"</em> (John 6:35) — "greater than Moses" who gave the true bread from heaven. Manna points to complete dependence on God for all provision.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'In Exodus 16, Israel complained that in Egypt they sat around pots of:',o:['fish','bread','meat','fruit'],a:3,w:'Exodus 16:3 — they complained about leaving behind "pots of meat" and eating "all the food we wanted."'},{q:'How long did God provide manna for Israel in the wilderness?',o:['7 years','20 years','40 years','Until they left Egypt'],a:3,w:'Exodus 16:35 — "The Israelites ate manna forty years, until they came to a land that was settled."'},{q:'Deuteronomy 8:3 says God fed Israel with manna to teach them that:',o:['Moses was a great leader','God loves generous giving','Man does not live on bread alone but on every word from God','They should always carry food'],a:3,w:'Deuteronomy 8:3 — "man does not live on bread alone but on every word that comes from the mouth of God."'},{q:'John 6:35 — Jesus declared "I am the..."',o:['Light of the world','Way, truth and life','Bread of life','Good shepherd'],a:3,w:'John 6:35 — "I am the bread of life. Whoever comes to me will never go hungry." Jesus fulfills what manna foreshadowed.'},{q:'What did the manna look like, according to Exodus 16:31?',o:['Black and bitter','White, like coriander seed, tasting of honey','Red and sour','Green and leafy'],a:2,w:'Exodus 16:31 — the manna was white like coriander seed and tasted like honey wafers.'},{q:'What happened to manna kept overnight, except before the Sabbath?',o:['It turned to gold','It bred worms and spoiled','It multiplied','It turned into bread'],a:2,w:'Exodus 16:20 — manna kept overnight bred worms and began to smell, except on the Sabbath eve.'},{q:'Besides manna, what meat did God provide for Israel in the wilderness?',o:['Quail','Fish','Lamb','Goat'],a:1,w:'Exodus 16:13 — quail covered the camp in the evening, providing meat.'},{q:'What name did the Israelites give the wilderness food, meaning "What is it?"?',o:['Manna','Quail','Bread','Honeycomb'],a:1,w:'Exodus 16:15 — the Israelites called it "manna," meaning "What is it?"'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Old Testament',ti:'Water from the Rock',su:'Describe the miracle of water from the rock and its lessons.',steps:[
  {lb:'Thirst at Rephidim (Exodus 17)',dr:dQ4,ht:'<p>Exodus 17:1-3 — At Rephidim, there was no water. The people quarrelled with Moses: <em>"Give us water to drink."</em> Moses replied: <em>"Why do you quarrel with me? Why do you test the Lord?"</em> The people grumbled and said Moses had brought them out of Egypt to kill them. Moses cried to God: <em>"What am I to do with these people? They are almost ready to stone me!"</em> God answered Moses\' prayer — not Israel\'s grumbling.</p>'},
  {lb:'The miracle',dr:dQ4,ht:'<p>Exodus 17:5-6 — God told Moses: take elders, take the staff, go to the rock at Horeb. <em>"I will stand there before you by the rock at Horeb. Strike the rock, and water will come out of it for the people to drink."</em> Moses obeyed. Water gushed from the rock, providing for the entire nation (perhaps 2 million people) in the desert. Moses called the place <em>Massah</em> ("testing") and <em>Meribah</em> ("quarrelling") — reminders of Israel\'s faithlessness.</p>'},
  {lb:'Moses\' failure at Meribah (Numbers 20)',dr:dQ4,ht:'<p>Numbers 20 — A second water crisis. God told Moses to speak to the rock. But Moses, angry at the people\'s complaining, struck the rock twice with his staff (v11). Water came out — but God said to Moses and Aaron: <em>"Because you did not trust in me enough to honour me as holy... you will not bring this community into the land I give them."</em> Moses\' sin: anger and disobedience cost him entry to the Promised Land. Even great leaders must obey God precisely.</p>'},
  {lb:'Spiritual significance',dr:dQ4,ht:'<p>1 Corinthians 10:4 — Paul wrote that Israel <em>"drank from the spiritual rock that accompanied them, and that rock was Christ."</em> The water-giving rock is a type (picture) of Christ — the source of living water (John 4:10 — "living water"; John 7:38 — "rivers of living water"). God\'s miraculous provision in the desert points forward to the ultimate provision in Christ. No physical or spiritual need is too great for God to meet.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What were the two names Moses gave the place of the first water miracle?',o:['Gilgal and Bethel','Massah and Meribah','Horeb and Sinai','Paran and Zin'],a:2,w:'Exodus 17:7 — Moses called the place Massah ("testing") and Meribah ("quarrelling").'},{q:'At the second Meribah (Numbers 20), God told Moses to SPEAK to the rock. What did Moses do instead?',o:['Prayed over it','Poured oil on it','Struck it twice with his staff','Sent Aaron to speak to it'],a:3,w:'Numbers 20:11 — Moses struck the rock twice with his staff — disobeying God\'s specific instruction to speak to it.'},{q:'What was the consequence for Moses at the second Meribah?',o:['He lost his position as leader immediately','He was forbidden from entering the Promised Land','He had to fast for 40 days','He lost his ability to perform miracles'],a:2,w:'Numbers 20:12 — God told Moses: "you will not bring this community into the land I give them."'},{q:'1 Corinthians 10:4 says the rock that gave water in the wilderness was:',o:['A natural spring','A sign of Abraham\'s faith','Christ (a type pointing to Christ)','A symbol of Moses\' power'],a:3,w:'1 Corinthians 10:4 — "They drank from the spiritual rock that accompanied them, and that rock was Christ."'},{q:'Where did the first water-from-the-rock miracle take place?',o:['Rephidim (near Horeb)','Kadesh only','Mount Nebo','Jericho'],a:1,w:'Exodus 17:6 — God told Moses to strike the rock at Horeb, near Rephidim.'},{q:'What did Israel do that provoked the naming "Massah" and "Meribah"?',o:['They worshipped an idol','They quarrelled with Moses and tested the Lord','They refused to travel further','They built an altar'],a:2,w:'Exodus 17:7 — the place was named for Israel\'s quarrelling and testing of the Lord.'},{q:'Why was Moses\' striking the rock at Meribah (Numbers 20) a serious failure?',o:['He struck the wrong rock','God told him to speak, not strike, and he disobeyed in anger','He struck it too gently','He asked Aaron to do it instead'],a:2,w:'Numbers 20:8-12 — God commanded Moses to speak to the rock, but he struck it in anger instead.'},{q:'What does 1 Corinthians 10:4 suggest about the rock that provided water?',o:['It was just an ordinary rock','It was a spiritual type pointing to Christ','It was a meteor','It was made by Moses'],a:2,w:'1 Corinthians 10:4 — "that rock was Christ," a spiritual type pointing forward to Him.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Old Testament',ti:'The Bronze Serpent',su:'Describe the bronze serpent and its New Testament significance.',steps:[
  {lb:'Israel\'s sin and the serpents',dr:dQ5,ht:'<p>Numbers 21:4-6 — Israel became impatient on the road and spoke against God and Moses: <em>"Why have you brought us up out of Egypt to die in the wilderness? There is no bread! There is no water! And we detest this miserable food!"</em> God sent venomous snakes among them; many Israelites died. The people recognised their sin: <em>"We sinned when we spoke against the Lord and against you"</em> (v7). They asked Moses to pray for the snakes to be taken away.</p>'},
  {lb:'The bronze serpent',dr:dQ5,ht:'<p>Numbers 21:8-9 — God told Moses: <em>"Make a snake and put it up on a pole; anyone who is bitten can look at it and live."</em> Moses made a bronze snake and put it on a pole. When anyone was bitten by a snake and looked at the bronze snake, they lived. The healing required: (1) Acknowledging the snake had bitten them (admitting need). (2) Looking in faith at the bronze serpent on the pole. A simple act of faith brought healing — not magic or ritual, but trusting God\'s provision.</p>'},
  {lb:'The serpent and Jesus (John 3:14-15)',dr:dQ5,ht:'<p>John 3:14-15 — Jesus told Nicodemus: <em>"Just as Moses lifted up the snake in the wilderness, so the Son of Man must be lifted up, that everyone who believes may have eternal life in him."</em> The parallel: bronze serpent lifted on a pole = Jesus lifted on the cross. Looking in faith = believing in Jesus. Healing from snake bite = salvation from sin. This is one of the clearest Old Testament types pointing to the crucifixion and salvation through faith.</p>'},
  {lb:'Later misuse of the serpent',dr:dQ5,ht:'<p>2 Kings 18:4 — Centuries later, King Hezekiah destroyed the bronze serpent because the Israelites had been burning incense to it and called it <em>Nehushtan</em> ("a piece of bronze"). The Israelites had turned a God-given provision into an idol. This pattern — taking something God gave for good and worshipping it instead of God — is a constant danger. What God provides must not become the object of worship. God alone is worthy of worship.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'Why did God send snakes to bite the Israelites in Numbers 21?',o:['They refused to fight the Canaanites','They spoke against God and Moses, complaining about the manna','They built an idol while Moses was away','They tried to return to Egypt'],a:2,w:'Numbers 21:5-6 — they spoke against God and detested the manna; God sent venomous snakes as judgment.'},{q:'What did God tell Moses to do to provide healing from the snake bites?',o:['Kill all the snakes','Pray over those bitten','Make a bronze serpent on a pole; those who look at it will live','Sprinkle the camp with blood'],a:3,w:'Numbers 21:8 — "Make a snake and put it up on a pole; anyone who is bitten can look at it and live."'},{q:'John 3:14-15 says the Son of Man must be "lifted up" — this refers to:',o:['Jesus ascending to heaven','Jesus being exalted as king','Jesus being crucified on the cross','Jesus being raised from the dead'],a:3,w:'John 3:14 — just as Moses lifted up the serpent, so the Son of Man must be lifted up — on the cross.'},{q:'King Hezekiah destroyed the bronze serpent (2 Kings 18:4) because:',o:['It was too old to keep safely','Moses had commanded its destruction','Israel had been worshipping it as an idol','It was taken as a trophy by enemies'],a:3,w:'2 Kings 18:4 — Israel had been burning incense to the bronze serpent; Hezekiah destroyed it to stop the idolatry.'},{q:'What material did God instruct Moses to use to make the serpent?',o:['Gold','Bronze','Silver','Wood only'],a:2,w:'Numbers 21:9 — Moses made a bronze serpent and put it on a pole.'},{q:'What did people need to do to be healed after being bitten by a snake?',o:['Touch the serpent','Look at the bronze serpent on the pole','Offer a sacrifice','Drink a special potion'],a:2,w:'Numbers 21:9 — anyone bitten who looked at the bronze serpent lived.'},{q:'What name was later given to the bronze serpent when Israel worshipped it as an idol?',o:['Nehushtan','Asherah','Baal','Molech'],a:1,w:'2 Kings 18:4 — Hezekiah destroyed the bronze serpent, called Nehushtan, because Israel had been burning incense to it.'},{q:'What spiritual lesson does the bronze serpent teach, according to John 3:14-15?',o:['Salvation requires many rituals','Simple faith/looking to Christ brings life','Only priests can be saved','Salvation is earned by good works'],a:2,w:'John 3:14-15 — just as looking at the serpent brought healing, looking to Christ in faith brings eternal life.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 Old Testament',ti:'Significance of God\'s Provision',su:'Draw lessons from God\'s guidance, protection and provision for Israel.',steps:[
  {lb:'God meets every need',dr:dQ6,ht:'<p>In the wilderness, Israel had every conceivable need met supernaturally: guidance (pillar of cloud and fire), food (manna and quails), water (from the rock), healing (bronze serpent), protection (Red Sea crossing, the cloud between Israel and Egypt). Philippians 4:19 — <em>"My God will meet all your needs according to the riches of his glory in Christ Jesus."</em> The wilderness journey is a picture of God\'s comprehensive care for His people.</p>'},
  {lb:'Provision requires faith and obedience',dr:dQ6,ht:'<p>God\'s provision always required faith and obedience: Blood on doorposts (Passover) — obedience to an unusual command. Standing still at the Red Sea — trusting God to fight. Gathering manna daily — not hoarding. Striking the rock — doing exactly as God said. Looking at the bronze serpent — simple faith. Those who grumbled and disobeyed did not experience the provision in the same way. Faith is the key to receiving what God provides.</p>'},
  {lb:'Lessons about God\'s character',dr:dQ6,ht:'<p>The wilderness provision reveals God\'s character: (1) <b>Faithful</b> — He kept His promise to bring Israel to Canaan. (2) <b>Patient</b> — He bore with Israel\'s repeated grumbling. (3) <b>Generous</b> — He provided more than the bare minimum (quails, not just manna). (4) <b>Personal</b> — He guided them day and night, always present. (5) <b>Holy</b> — He disciplined disobedience (Numbers 11, 21). (6) <b>Powerful</b> — no natural obstacle was too great for Him.</p>'},
  {lb:'Application for Christians today',dr:dQ6,ht:'<p>The wilderness journey speaks to Christians today: (1) Trust God in difficult circumstances — the wilderness was God\'s training ground. (2) Daily dependence — manna was given daily; we need God daily. (3) Remember God\'s past faithfulness — Israel was commanded to remember the Exodus (Deut 8:2). (4) Avoid grumbling — it is ingratitude and unbelief. (5) God can provide where there is no natural source. (6) Every provision points to Christ — the ultimate bread, water and healer.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'Philippians 4:19 promises God will meet all needs "according to..."',o:['our faith','our prayers','the riches of his glory in Christ Jesus','our obedience'],a:3,w:'Philippians 4:19 — "my God will meet all your needs according to the riches of his glory in Christ Jesus."'},{q:'What is the common requirement in all the wilderness provision miracles?',o:['Sacrifice','Large numbers of people','Faith and obedience — doing what God said','Prior knowledge of the miracle'],a:3,w:'Every provision required faith and obedience — looking at the serpent, striking the rock, gathering manna, putting blood on doorposts.'},{q:'Deuteronomy 8:2 commands Israel to "remember how the Lord your God led you all the way in the wilderness..." Why?',o:['To make them feel guilty','To humble them and test them, knowing what was in their hearts','To give Moses material for his speeches','To prepare them for more suffering'],a:2,w:'Deuteronomy 8:2 — "to humble and test you in order to know what was in your heart."'},{q:'Which New Testament figure called Himself the "Living Water"?',o:['Moses','John the Baptist','Paul','Jesus'],a:4,w:'John 4:10 — Jesus told the Samaritan woman about "living water" — fulfilling what the water from the rock foreshadowed.'},{q:'What title did Jesus give Himself in John 4, speaking to the woman at the well?',o:['Bread of life','Living Water','Good shepherd','Light of the world'],a:2,w:'John 4:10-14 — Jesus offered the woman at the well "living water."'},{q:'According to Philippians 4:19, whose riches does God use to meet needs?',o:['Our own effort','The riches of His glory in Christ Jesus','The wealth of Egypt','The temple treasury'],a:2,w:'Philippians 4:19 — God meets all needs according to the riches of His glory in Christ Jesus.'},{q:'What did each wilderness provision miracle require from Israel, according to this lesson?',o:['Large armies','Faith and obedience — doing what God said','Wealth','Political alliances'],a:2,w:'Each provision miracle required Israel to trust and obey what God instructed.'},{q:'According to Deuteronomy 8:2, what did the wilderness journey reveal about Israel\'s hearts?',o:['Their wealth','Whether they would keep God\'s commands','Their military skill','Their leadership ability'],a:2,w:'Deuteronomy 8:2 — God led them to humble and test them, to know what was in their hearts.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 Old Testament',ti:'Israel\'s Grumbling and God\'s Response',su:'Understand the pattern of Israel\'s grumbling and God\'s response.',steps:[
  {lb:'The pattern of grumbling',dr:dQ7,ht:'<p>Israel grumbled repeatedly in the wilderness: At the Red Sea (Ex 14:11-12 — "were there no graves in Egypt?"). At Marah/bitter water (Ex 15:24). About food (Ex 16:2-3). About water at Rephidim (Ex 17:3). About the manna (Num 11:4-6 — craving meat). About the land (Num 14 — refusing to enter Canaan after the spies\' report). Against Moses and Aaron (Num 16 — Korah\'s rebellion). Grumbling is fundamentally unbelief — failing to trust God\'s goodness and power.</p>'},
  {lb:'God\'s response to grumbling',dr:dQ7,ht:'<p>God\'s responses varied: Grace (manna, quails, water — provided despite grumbling). Discipline (venomous snakes, Num 21; plague for craving meat, Num 11:33). Judgment (death of the generation that refused to enter Canaan, Num 14:29-32 — they would wander 40 years until that generation died). Patience (God bore with Israel for 40 years). Even when providing, God sometimes allowed consequences to teach dependence and trust.</p>'},
  {lb:'The 40 years as discipline',dr:dQ7,ht:'<p>Numbers 14 — the 10 spies brought a bad report; the people refused to enter Canaan. God\'s judgment: the entire generation (except Caleb and Joshua, who trusted God) would die in the wilderness — one year for each of the 40 days the spies explored the land. Deuteronomy 8:2 explains the wilderness: God led them to humble them, test them, and know what was in their hearts. Discipline is part of God\'s love and sovereign plan.</p>'},
  {lb:'Caleb and Joshua — the alternative',dr:dQ7,ht:'<p>Numbers 14:6-9 — Caleb and Joshua tore their clothes: <em>"The land we passed through and explored is exceedingly good. If the Lord is pleased with us, he will lead us into that land... do not rebel against the Lord. And do not be afraid of the people of the land... their protection is gone, but the Lord is with us."</em> Numbers 14:24 — God said of Caleb: <em>"he has a different spirit and follows me wholeheartedly."</em> Faith and trust bring God\'s favour.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'How many times did Israel grumble/rebel in the wilderness before Num 14?',o:['2','5','10 (many times)','Only once'],a:3,w:'Israel grumbled repeatedly — at the Red Sea, Marah, about food, about water, about the manna. Their grumbling was a recurring sin.'},{q:'Why were the Israelites condemned to 40 years in the wilderness (Num 14)?',o:['They made the golden calf','They refused to enter Canaan after the spies\' bad report','They rebelled against Moses at Meribah','They worshipped the bronze serpent'],a:2,w:'Numbers 14:29-34 — because they refused to trust God and enter Canaan, that generation died in the wilderness (one year per day of spying).'},{q:'Numbers 14:24 says Caleb had "a different spirit" because:',o:['He was stronger than the others','He followed God wholeheartedly','He had fought in more battles','He was older and wiser'],a:2,w:'Numbers 14:24 — "my servant Caleb has a different spirit and follows me wholeheartedly, I will bring him into the land."'},{q:'Deuteronomy 8:2 says God led Israel through the wilderness "to humble you and to..."',o:['punish you for Egypt','destroy your enemies','test you in order to know what was in your heart','show His power to the nations'],a:3,w:'Deuteronomy 8:2 — "to humble and test you in order to know what was in your heart."'},{q:'What report did ten of the twelve spies bring back about Canaan?',o:['A good report of blessing','A bad, discouraging report that the land could not be taken','A report of an empty land','A report that Canaan had already fallen'],a:2,w:'Numbers 13:31-33 — ten spies gave a discouraging report, saying the land could not be taken.'},{q:'Along with Caleb, which spy also brought a faithful report about Canaan?',o:['Joshua','Aaron','Nahshon','Phinehas'],a:1,w:'Numbers 14:6-9 — Joshua joined Caleb in urging Israel to trust God and take the land.'},{q:'What consequence did God pronounce for the generation that rebelled after the spies\' report?',o:['Immediate destruction','40 years wandering, dying in the wilderness','Enslavement again in Egypt','Loss of the covenant forever'],a:2,w:'Numbers 14:33-34 — Israel would wander 40 years, one year for each day the spies explored the land.'},{q:'What attitude did Caleb and Joshua display that the other ten spies lacked?',o:['Fear and doubt','Faith that God would help them conquer the land','Indifference','Anger at Moses'],a:2,w:'Numbers 14:6-9 — Caleb and Joshua trusted God\'s power to give them the land.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 Old Testament',ti:'The New Testament Connections',su:'Trace how the wilderness events point forward to Christ.',steps:[
  {lb:'The Passover and the cross',dr:dQ8,ht:'<p>1 Corinthians 5:7 — <em>"Christ our Passover lamb has been sacrificed."</em> Just as the blood of the Passover lamb protected Israel from death, so the blood of Jesus protects believers from eternal death. John 1:29 — <em>"Look, the Lamb of God, who takes away the sin of the world!"</em> The Passover is the most direct Old Testament type of Christ\'s atoning death. The timing is significant — Jesus was crucified at Passover.</p>'},
  {lb:'Manna and the Bread of Life',dr:dQ8,ht:'<p>John 6:32-35 — Jesus said: <em>"Moses did not give you the bread from heaven, but it is my Father who gives you the true bread from heaven... I am the bread of life. Whoever comes to me will never go hungry, and whoever believes in me will never be thirsty."</em> Manna sustained physical life temporarily; Jesus is the bread that gives eternal life. The Lord\'s Supper (bread and cup) continues this theme — we "feed on Christ" by faith.</p>'},
  {lb:'The rock and living water',dr:dQ8,ht:'<p>1 Corinthians 10:4 — the rock was Christ. John 4:10-14 — Jesus offered "living water" to the Samaritan woman. John 7:37-38 — on the last day of the Feast of Tabernacles (when priests poured water), Jesus cried: <em>"Let anyone who is thirsty come to me and drink. Whoever believes in me... rivers of living water will flow from within them."</em> Jesus is the ultimate water from the rock — quenching spiritual thirst forever.</p>'},
  {lb:'The bronze serpent and salvation',dr:dQ8,ht:'<p>John 3:14-16 — Jesus told Nicodemus that just as Moses lifted up the serpent in the wilderness, so the Son of Man must be lifted up, that everyone who believes may have eternal life. John 3:16 follows immediately: <em>"For God so loved the world that he gave his one and only Son."</em> The bronze serpent is one of the most direct types of the crucifixion — look and live; believe and have eternal life. The pattern: confession of need + faith = healing/salvation.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'John 6:35 says Jesus is "the bread of life." What happens to whoever comes to Him?',o:['They will never die','They will never go hungry or thirsty','They will receive great wealth','They will become leaders'],a:2,w:'John 6:35 — "Whoever comes to me will never go hungry, and whoever believes in me will never be thirsty."'},{q:'1 Corinthians 5:7 calls Christ our "Passover lamb." What does this mean?',o:['Jesus celebrated Passover every year','Jesus was killed during Passover week','Jesus\' death fulfills what the Passover lamb foreshadowed — His blood protects from judgment','Jesus was born during Passover'],a:3,w:'Christ our Passover lamb — His blood protects believers from spiritual death, just as the lamb\'s blood protected Israel.'},{q:'John 7:37 — on the last day of the feast, Jesus invited those who were thirsty to:',o:['Come and eat bread','Come to Him and drink','Go to the temple and pray','Observe the Passover'],a:2,w:'John 7:37 — "Let anyone who is thirsty come to me and drink." Jesus is the living water the rock foreshadowed.'},{q:'What is the pattern in both the bronze serpent (Num 21) and salvation (John 3)?',o:['Sacrifice + prayer + ritual','Knowledge + obedience + sacrifice','Acknowledging need + simple faith = healing/life','Fasting + repentance + baptism'],a:3,w:'Both require: acknowledging the problem (snake bite/sin) and looking/believing in faith = healing/eternal life.'},{q:'What Old Testament event does the Lord\'s Supper especially recall?',o:['The manna in the wilderness','The Passover and the blood of the covenant','The bronze serpent','The parting of the Red Sea'],a:2,w:'The Lord\'s Supper recalls the Passover and the blood of the covenant, fulfilled in Christ.'},{q:'According to Hebrews, how is Jesus compared to Moses?',o:['As equal but no greater','As a greater and faithful leader/mediator than Moses','As inferior to Moses','As unrelated to Moses\' ministry'],a:2,w:'Hebrews 3:3-6 — Jesus is considered worthy of greater honour than Moses, as a faithful Son over God\'s house.'},{q:'Which NT experience is compared to Israel\'s Red Sea crossing as a picture of deliverance?',o:['Baptism','Confirmation','The Lord\'s Supper only','Ordination'],a:1,w:'1 Corinthians 10:1-2 — Paul describes Israel as "baptised into Moses" in the cloud and the sea.'},{q:'What does the manna in the wilderness foreshadow, according to John 6?',o:['Earthly wealth','Jesus, the true bread of life from heaven','The temple offerings','The Ten Commandments'],a:2,w:'John 6:32-35 — Jesus is the true bread from heaven, of which manna was a foreshadowing.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 Old Testament',ti:'WAEC Exam Preparation — Guidance and Provision',su:'Practise WAEC-style questions on divine guidance, protection and provision.',steps:[
  {lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions on this topic: (1) State the situation (Israel in the wilderness). (2) Identify the specific need or problem. (3) Describe Israel\'s response (usually grumbling). (4) Narrate God\'s miraculous provision. (5) State the significance/lesson. (6) Make NT connection if relevant. Common questions: "Describe God\'s provision of manna in the wilderness" / "How did God guide Israel in the wilderness?" / "What lessons can Christians learn from the bronze serpent?"</p>'},
  {lb:'Key facts for WAEC',dr:dQ9,ht:'<p>WAEC fact bank: Passover — blood on doorposts; death angel passed over. Red Sea — strong east wind; Moses stretched hand; all Egypt\'s army drowned. Ex 14:14 — "Lord will fight for you." Manna — fell each morning; tasted like honey; double on 6th day; 40 years. Quails — covered camp evening. Water from rock — Moses struck at Horeb; "Massah and Meribah." Bronze serpent — on pole; look and live; destroyed by Hezekiah; John 3:14.</p>'},
  {lb:'Common WAEC mistakes',dr:dQ9,ht:'<p>Avoid these errors: Saying the manna lasted forever (it stopped when Israel entered Canaan — Josh 5:12). Saying God told Moses to strike the rock the second time (He said speak to it — Num 20:8). Saying all Egypt\'s soldiers were killed at the Red Sea (correct — but do not say "some escaped"). Confusing the two water miracles (Horeb/Massah = Ex 17; Meribah = Num 20). Saying the bronze serpent healed everyone (only those who looked at it in faith).</p>'},
  {lb:'Drawing lessons — key themes',dr:dQ9,ht:'<p>Standard WAEC lessons from this topic: (1) God provides for His people in impossible situations. (2) Daily dependence on God is necessary (manna). (3) Grumbling and unbelief are serious sins. (4) Simple faith is the key to receiving God\'s provision (look and live). (5) What God provides should not become an idol (bronze serpent). (6) Every OT provision points forward to Christ — the ultimate bread, water and healer. (7) God\'s discipline is part of His love.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'On which day did Israel gather double the amount of manna? Why?',o:['Monday — the first day of the week','The 6th day — so they would not work on the Sabbath','Any day they chose','The 7th day — the Sabbath itself'],a:2,w:'Exodus 16:22-26 — they gathered double on the 6th day so they could rest on the Sabbath (7th day).'},{q:'Joshua 5:12 says the manna stopped when:',o:['The wilderness ended','Moses died','The people crossed the Red Sea','The day after they ate produce from Canaan'],a:4,w:'Joshua 5:12 — "The manna stopped the day after they ate this food from the land; there was no longer any manna for the Israelites."'},{q:'What did God tell Moses at the second water crisis (Numbers 20)?',o:['Strike the rock twice','Pour water over the rock','Speak to the rock','Pray beside the rock'],a:3,w:'Numbers 20:8 — "Speak to that rock before their eyes and it will pour out its water." Moses struck it instead.'},{q:'John 3:14-15 connects the bronze serpent to:',o:['Moses\' leadership','Jesus being lifted up on the cross so that all who believe have eternal life','The healing ministry of Jesus in Galilee','The temple sacrifice in Jerusalem'],a:2,w:'John 3:14-15 — just as Moses lifted up the serpent, so the Son of Man must be lifted up, that everyone who believes may have eternal life.'},{q:'For WAEC essays on divine provision, which details should always be included?',o:['Only opinions','Specific Bible references and lessons drawn','A summary with no examples','A list of plagues only'],a:2,w:'WAEC awards marks for specific Bible references and the lessons drawn from each event.'},{q:'Which reference records the parting of the Red Sea?',o:['Exodus 12','Exodus 14','Exodus 16','Exodus 20'],a:2,w:'Exodus 14 records the parting of the Red Sea.'},{q:'Which reference records the first water-from-the-rock miracle at Horeb?',o:['Exodus 17','Numbers 20','Numbers 21','Deuteronomy 8'],a:1,w:'Exodus 17 records the first water-from-the-rock miracle at Horeb.'},{q:'Which reference records the making of the bronze serpent?',o:['Numbers 14','Numbers 20','Numbers 21','Numbers 25'],a:3,w:'Numbers 21 records the plague of snakes and the making of the bronze serpent.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 Old Testament',ti:'Mixed Questions — Divine Guidance and Provision',su:'Integrated revision across all guidance, protection and provision topics.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Exodus from Egypt: 10 plagues (targeting Egypt\'s gods); Passover (blood on doorposts); pillar of cloud/fire (guidance). Red Sea: parted by east wind; Israel crossed; army drowned; Ex 14:14. Manna: daily bread for 40 years; Deut 8:3. Quails: Ex 16:13; Num 11. Water: Ex 17 (Horeb/Massah/Meribah); Num 20 (Moses struck instead of speaking — his failure). Bronze serpent: Num 21; John 3:14. All point to Christ.</p>'},
  {lb:'NT connections summary',dr:dQ10,ht:'<p>Passover lamb → Christ our Passover (1 Cor 5:7). Manna → Bread of Life (John 6:35). Rock/water → Living Water (John 4:10; 7:37-38); 1 Cor 10:4 (rock = Christ). Bronze serpent → Son of Man lifted up for eternal life (John 3:14-16). Pillar of cloud/fire → Holy Spirit\'s guidance. The entire wilderness journey is a "shadow" pointing to Christ (Col 2:17).</p>'},
  {lb:'Key lessons',dr:dQ10,ht:'<p>Lessons for Christians today: (1) God guides — we have the Holy Spirit and Scripture. (2) God provides — trust Him daily; do not hoard or worry (Matthew 6:25-34). (3) Do not grumble — Philippians 2:14 "do everything without grumbling or arguing." (4) Simple faith accesses God\'s provision — look and live. (5) Discipline is love — the wilderness was God\'s training school. (6) Remember God\'s past faithfulness — it strengthens faith for current challenges.</p>'},
  {lb:'WAEC final review',dr:dQ9,ht:'<p>Key references to quote in WAEC answers: Ex 13:21 (pillar of cloud/fire). Ex 14:14 (Lord will fight for you). Ex 16:35 (manna 40 years). Ex 17:6 (strike rock). Num 21:8-9 (bronze serpent). Deut 8:3 (not by bread alone). John 3:14-15 (bronze serpent — eternal life). John 6:35 (bread of life). 1 Cor 5:7 (Christ our Passover). 1 Cor 10:4 (rock was Christ). Always explain the significance after narrating the event.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'What guided Israel during the day and during the night?',o:['An angel and a prophet','Moses with a staff and Aaron with a trumpet','A pillar of cloud by day and pillar of fire by night','The sun and stars'],a:3,w:'Exodus 13:21 — "By day the Lord went ahead of them in a pillar of cloud to guide their way, and by night in a pillar of fire."'},{q:'Deuteronomy 8:3 says man does not live on bread alone but on:',o:['The blessings of the covenant','Every word that comes from the mouth of God','The fruit of their labour','The promises of the patriarchs'],a:2,w:'Deuteronomy 8:3 — "man does not live on bread alone but on every word that comes from the mouth of God."'},{q:'Which book and verse says "The Lord will fight for you; you need only to be still"?',o:['Deuteronomy 20:4','Numbers 14:9','Exodus 14:14','Psalm 46:10'],a:3,w:'Exodus 14:14 — spoken by Moses as Pharaoh\'s army approached the Red Sea.'},{q:'John 3:16 follows directly after Jesus\' words about the bronze serpent. What does John 3:16 declare?',o:['Whoever believes will be healed','For God so loved the world that He gave His one and only Son','Moses was greater than the prophets','The law was given through Moses, grace through Jesus'],a:2,w:'John 3:16 — "For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life."'},{q:'Which miracle provided meat for Israel in addition to manna?',o:['The quail','Fish from the Nile','Lamb from Canaan','Goat\'s milk'],a:1,w:'Exodus 16:13 — quail covered the camp, providing meat alongside the manna.'},{q:'Which two names did Moses give the place of the first water-from-rock miracle?',o:['Massah and Meribah','Horeb and Sinai','Gilgal and Bethel','Kadesh and Paran'],a:1,w:'Exodus 17:7 — Moses named the place Massah and Meribah.'},{q:'Which OT event is most directly connected to Jesus\' words in John 3:14-15 about being "lifted up"?',o:['The manna','The bronze serpent lifted on a pole','The Red Sea crossing','The pillar of fire'],a:2,w:'John 3:14-15 — Jesus compares His being lifted up on the cross to the bronze serpent lifted on a pole.'},{q:'Which two spies alone believed Israel could conquer Canaan?',o:['Joshua and Caleb','Aaron and Hur','Nadab and Abihu','Eleazar and Ithamar'],a:1,w:'Numbers 14:6-9 — only Joshua and Caleb urged Israel to trust God and take the land.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
