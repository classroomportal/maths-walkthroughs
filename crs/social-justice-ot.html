<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Social Justice — Key OT Themes',ACC,12,'middle',true));
var rows=[['Care for the poor','Gleaning laws; tithes; year of Jubilee (Lev.19; Deut.15)'],['Justice in courts','No bribery; no partiality; fair weights (Lev.19:15)'],['Care for strangers','Love the alien; remember Egypt (Lev.19:33-34)'],['Widows and orphans','Do not exploit; God defends them (Ex.22:22-24)'],['Prophetic condemnation','Amos, Isaiah, Micah condemn oppression of the poor'],['Sabbath Year','Every 7 years: debts cancelled; slaves freed (Deut.15)'],['Year of Jubilee','Every 50 years: land returned to original owners (Lev.25)']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,30+i*30,460,24,CRM,LINE,1));o.push(T(130,44+i*30,r[0],ACC,8,'middle',true));o.push(T(330,44+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Prophets and Social Justice',ACC,12,'middle',true));
var rows=[['Amos','Justice must roll like a river (5:24); condemned rich oppressors'],['Isaiah','Learn to do right; seek justice; defend the oppressed (1:17)'],['Micah','Act justly, love mercy, walk humbly with God (6:8)'],['Jeremiah','Do justice; do not oppress the alien, widow or orphan (7:6)'],['Ezekiel','Condemned extortion, false weights, oppression of the poor'],['Zechariah','Show mercy; do not oppress the widow, fatherless, alien (7:9-10)']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(80,52+i*32,r[0],ACC,9,'middle',true));o.push(T(300,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Social Justice OT — Summary',ACC,13,'middle',true));
var rows=[['Amos 5:24','Let justice roll on like a river, righteousness like a never-failing stream'],['Micah 6:8','Act justly, love mercy, walk humbly with your God'],['Isaiah 1:17','Learn to do right; seek justice; defend the oppressed'],['Gleaning laws','Leave crops for the poor; Lev.19:9-10; Ruth model'],['Jubilee','Every 50 years: land returns; debts cancelled; Lev.25'],['WAEC tip','Know which prophet said what; use exact references']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(100,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 OT',ti:'Amos and Social Justice',su:'Examine Amos\'s message of social justice.',steps:[
  {lb:'Who was Amos?',dr:dQ1,ht:'<p>Amos was a shepherd and fig-grower from Tekoa in Judah (Amos 1:1), called to prophesy in the northern kingdom of Israel during the reign of Jeroboam II (~760 BC). He was not a professional prophet ("I am not a prophet, nor a prophet\'s son" — 7:14). He delivered a powerful message of social justice, condemning the wealthy class for their exploitation of the poor. Amos is the earliest writing prophet whose book has survived.</p>'},
  {lb:'The indictment of the rich (Amos 2:6-7)',dr:dQ2,ht:'<p>Amos condemned Israel\'s wealthy: <em>"They sell the innocent for silver, and the needy for a pair of sandals. They trample on the heads of the poor as on the dust of the ground and deny justice to the oppressed"</em> (2:6-7). The wealthy were: selling the poor into debt-slavery for trivial debts; using false weights in trade (8:5); holding lavish feasts while ignoring poverty (6:4-6); bribing courts to get unjust verdicts. God took all of this personally — injustice to the poor is an offence against Him.</p>'},
  {lb:'Amos 5:24 — the vision of justice',dr:dQ1,ht:'<p>Amos\'s most famous verse: <em>"But let justice roll on like a river, righteousness like a never-failing stream!"</em> (5:24). This came after God rejected Israel\'s worship because it was not accompanied by justice: "I hate, I despise your religious festivals; your assemblies are a stench to me" (5:21). The message: religious ritual without social justice is an abomination to God. True worship must be expressed in just treatment of the poor and vulnerable.</p>'},
  {lb:'Lessons from Amos',dr:dQ1,ht:'<p>Amos teaches: (1) God is deeply concerned with economic justice, not only ritual worship. (2) Exploiting the poor is a serious sin that God judges. (3) Prosperity does not equal God\'s approval — Israel was prosperous but condemned. (4) God uses ordinary people (a shepherd) to speak His truth. (5) Social justice is inseparable from true religion. (6) The church/community today must speak prophetically on social issues. Application: Christians in Nigeria must address poverty and corruption as matters of faith.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Amos was by occupation:',o:['A Levitical priest','A shepherd and fig-grower from Tekoa','A court prophet in Jerusalem','A scribe in the temple'],a:2,w:'Amos 1:1 — Amos was among the shepherds of Tekoa; 7:14 — "I am not a prophet... I was a shepherd and I also took care of sycamore-fig trees."'},{q:'In Amos 2:6-7, the rich were condemned for selling the poor:',o:['Into foreign slavery for large sums','For silver and for a pair of sandals (trivial debts)','To the Assyrians as tribute payment','Into the army of the king of Aram'],a:2,w:'Amos 2:6 — "They sell the innocent for silver, and the needy for a pair of sandals" — debt-slavery for trivially small amounts shows contempt for the poor.'},{q:'Amos 5:24 says: "But let justice roll on like a river, righteousness like a..."',o:['Mountain that cannot be moved','Never-failing stream','Fire that purifies all it touches','Light that dispels all darkness'],a:2,w:'Amos 5:24 — "let justice roll on like a river, righteousness like a never-failing stream!" — the most famous verse in Amos, calling for consistent, flowing justice.'},{q:'Why did God reject Israel\'s worship festivals (Amos 5:21-24)?',o:['They were on the wrong days of the week','They did not offer the right sacrifices','They were not accompanied by social justice for the poor','The priests were not properly ordained'],a:3,w:'God said "I hate, I despise your religious festivals" (5:21) because the same people conducting worship were oppressing the poor — worship without justice is an abomination.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 OT',ti:'Isaiah and Micah on Justice',su:'Examine Isaiah and Micah\'s messages of social justice.',steps:[
  {lb:'Isaiah\'s call to justice (Isaiah 1)',dr:dQ2,ht:'<p>Isaiah 1 contains God\'s indictment of Judah. Despite their religious activity, God said: "Your hands are full of blood!" (v.15). The remedy: <em>"Learn to do right; seek justice. Defend the oppressed. Take up the cause of the fatherless; plead the case of the widow"</em> (1:17). Isaiah condemned: bribery in courts (1:23); unjust rulers (10:1-2); exploitation of the poor; those who acquire land by oppression (5:8 — "Woe to you who add house to house and join field to field").</p>'},
  {lb:'Micah 6:8 — the summary of true religion',dr:dQ1,ht:'<p>Micah\'s most famous verse: <em>"He has shown you, O mortal, what is good. And what does the LORD require of you? To act justly and to love mercy and to walk humbly with your God"</em> (6:8). This verse summarises the whole prophetic tradition\'s message: three requirements — justice (social ethics), mercy (personal compassion) and humility before God (spiritual attitude). These three together define authentic covenant living. The verse is one of the most quoted in the entire Old Testament.</p>'},
  {lb:'Micah\'s condemnation of exploitation',dr:dQ2,ht:'<p>Micah condemned: (1) Rulers who tear the skin from people and flesh from their bones (3:2-3). (2) Priests who teach for pay; prophets who divine for money (3:11). (3) Merchants using dishonest scales (6:11). (4) Those who "covet fields and seize them" (2:2). Micah predicted that Jerusalem would fall because of injustice (3:12) — a radical claim in his time (the temple was thought to guarantee God\'s protection). True security comes from justice, not from religious institutions alone.</p>'},
  {lb:'Lessons from Isaiah and Micah',dr:dQ2,ht:'<p>Isaiah and Micah teach: (1) Religious observance without justice is worthless. (2) The whole person (justice + mercy + humility) is what God requires. (3) Economic injustice — land grabbing, dishonest commerce — is a covenant violation. (4) Religious institutions (priests, prophets, temple) can become corrupt; God judges them too. (5) God\'s people are called to actively defend the oppressed — "plead the case of the widow" (Isaiah). Application: Micah 6:8 remains the summary of Christian social responsibility today.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Isaiah 1:17 calls for God\'s people to:',o:['Offer more sacrifices and observe more festivals','Learn to do right; seek justice; defend the oppressed; plead for the widow','Separate themselves from all contact with sinners','Build a larger and more impressive temple'],a:2,w:'Isaiah 1:17 — "Learn to do right; seek justice. Defend the oppressed. Take up the cause of the fatherless; plead the case of the widow." Active justice, not mere ritual.'},{q:'Micah 6:8 says God requires three things. Which of these is NOT one of them?',o:['Act justly','Love mercy','Offer many sacrifices','Walk humbly with your God'],a:3,w:'Micah 6:8 — "Act justly AND love mercy AND walk humbly with your God." Sacrifices/ritual are not among the three requirements — the prophets consistently elevated ethics above ritual.'},{q:'Micah\'s bold prediction that Jerusalem would fall (Micah 3:12) was controversial because:',o:['He was a foreign prophet with no right to speak','Most Israelites believed the temple guaranteed God\'s protection of the city','He made the prediction without any sign from God','Micah had previously predicted Jerusalem would be saved'],a:2,w:'The temple was widely believed to guarantee God\'s presence and protection of Jerusalem. Micah\'s claim that injustice would cause Jerusalem to fall was seen as shocking blasphemy.'},{q:'What did Isaiah condemn in Isaiah 5:8?',o:['Idolatry in the high places','Adding house to house and joining field to field — land accumulation by the wealthy','Failure to observe the Sabbath properly','Intermarriage with foreign nations'],a:2,w:'Isaiah 5:8 — "Woe to you who add house to house and join field to field till no space is left" — condemning the wealthy class\'s accumulation of land at the expense of the poor.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 OT',ti:'The Law and Social Justice',su:'Examine how the Mosaic Law enshrined social justice.',steps:[
  {lb:'Gleaning laws (Leviticus 19:9-10)',dr:dQ1,ht:'<p>The Mosaic Law required: <em>"When you reap the harvest of your land, do not reap to the very edges of your field or gather the gleanings of your harvest. Do not go over your vineyard a second time or pick up the grapes that have fallen. Leave them for the poor and the foreigner"</em> (Lev.19:9-10). This built provision for the poor into the agricultural system. The book of Ruth illustrates this law beautifully — Ruth gleaned in Boaz\'s field (Ruth 2). The law prevented the total exclusion of the poor from God\'s provision.</p>'},
  {lb:'Protection of the vulnerable (Exodus 22)',dr:dQ1,ht:'<p>Exodus 22 protected specific vulnerable groups: (1) <em>"Do not take advantage of a widow or an orphan. If you do and they cry out to me, I will certainly hear their cry. My anger will be aroused"</em> (Ex.22:22-24). (2) Lending to the poor must be interest-free: "Do not charge interest" (Ex.22:25). (3) If you take a poor person\'s cloak as pledge, return it by sunset — it is their only covering (Ex.22:26-27). The law gave the vulnerable direct recourse to God\'s protection.</p>'},
  {lb:'The Sabbath Year and Jubilee (Deuteronomy 15; Leviticus 25)',dr:dQ2,ht:'<p><b>Sabbath Year</b> (every 7 years): cancel all debts; release Hebrew slaves; let the land rest. Deut.15:4 — "There should be no poor among you." <b>Year of Jubilee</b> (every 50 years): all land returns to its original tribal owners; all Hebrew slaves freed; all debts cancelled. Lev.25:10 — "Proclaim liberty throughout the land to all its inhabitants." These laws prevented permanent poverty and permanent accumulation of wealth. They built systemic equity into Israel\'s social and economic structure.</p>'},
  {lb:'Fair dealings (Leviticus 19:35-36)',dr:dQ2,ht:'<p>Leviticus 19:35-36: <em>"Do not use dishonest standards when measuring length, weight or quantity. Use honest scales and honest weights, an honest ephah and an honest hin"</em>. This reflects God\'s concern for economic fairness in everyday trade. Amos, Micah and Ezekiel all condemned the use of false weights to cheat buyers. In modern application: dishonest business practices, corruption in commerce, and economic exploitation are all violations of OT justice principles that the prophets addressed.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The gleaning laws (Lev.19:9-10) required farmers to:',o:['Give a tenth of their harvest to the priests','Leave the edges of fields and fallen grapes for the poor and foreigner','Sell excess crops at reduced prices to the poor','Store grain for seven years against famine'],a:2,w:'Lev.19:9-10 — farmers must not reap to the field\'s edge or gather fallen grapes — leave them for the poor and the alien to glean. Ruth 2 illustrates this in practice.'},{q:'The Year of Jubilee (Leviticus 25) occurred every:',o:['7 years','10 years','25 years','50 years'],a:4,w:'The Year of Jubilee occurred every 50th year (after 7 cycles of 7 sabbath years). It involved return of land, release of slaves, and cancellation of debts.'},{q:'Deuteronomy 15:4 states that in Israel, because of the sabbath year laws, there should be:',o:['No foreigners living among the people','No sacrifices except at the central sanctuary','No poor among you','No more than one king at a time'],a:3,w:'Deut.15:4 — "There need be no poor people among you, for in the land the LORD your God is giving you... he will richly bless you" — the sabbath year debt cancellation aimed to prevent permanent poverty.'},{q:'What do Amos, Micah and Ezekiel all condemn in common?',o:['Failure to observe the Sabbath','Intermarriage with foreign nations','Use of dishonest weights and measures in trade','Sacrificing at the high places'],a:3,w:'All three prophets explicitly condemned dishonest scales and false weights (Amos 8:5; Micah 6:11; Ezekiel 45:10) — cheating in trade violates God\'s demand for economic justice.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 OT',ti:'Care for the Stranger and Foreigner',su:'Examine OT teaching on care for strangers and foreigners.',steps:[
  {lb:'The alien/stranger in OT law',dr:dQ2,ht:'<p>One of the most repeated commandments in the OT is care for the stranger (Hebrew: <em>ger</em> — resident alien): <em>"The foreigner residing among you must be treated as your native-born. Love them as yourself, for you were foreigners in Egypt. I am the LORD your God"</em> (Lev.19:34). This command appears over 36 times in the Pentateuch — more than almost any other social command. The motivation: Israel\'s own experience as strangers in Egypt creates empathy and obligation to others in the same position.</p>'},
  {lb:'Specific protections for strangers',dr:dQ1,ht:'<p>The Law gave strangers specific protections: (1) Gleaning rights — share in the harvest (Lev.19:10). (2) Sabbath rest — strangers must also rest on the Sabbath (Ex.20:10). (3) Equal justice — one law for the citizen and the alien (Lev.24:22). (4) Fair wages — do not withhold wages from the alien (Deut.24:14-15). (5) Participation in worship — the alien could join Israel\'s Passover if circumcised (Ex.12:48). These protections show that OT justice was not limited to "insiders" but extended to the vulnerable outsider.</p>'},
  {lb:'Ruth — a model of inclusion',dr:dQ2,ht:'<p>The book of Ruth illustrates OT social justice beautifully: Ruth, a Moabite (foreigner), was welcomed into Israel. Boaz obeyed the gleaning laws and even instructed his workers to leave extra for Ruth (2:15-16). He acted as kinsman-redeemer, restoring Naomi\'s family inheritance (the Jubilee principle in practice). Ruth was eventually included in the ancestry of King David — and of Jesus (Matt.1:5). The story shows that God\'s justice and inclusion extend beyond ethnic boundaries.</p>'},
  {lb:'Application for today',dr:dQ2,ht:'<p>The OT\'s extensive protection of strangers has direct application: (1) Treatment of migrants and refugees — God is concerned with the vulnerable foreigner. (2) Economic inclusion — strangers deserve fair wages and protection. (3) Legal equality — one law for all, regardless of origin. (4) In Nigeria: Fulani-farmer conflicts, displacement of communities, treatment of internal migrants — all have OT social justice dimensions. The church is called to advocate for the vulnerable, whatever their origin, as part of covenant faithfulness.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Leviticus 19:34 commands Israel to love the foreigner as themselves because:',o:['Foreigners were economically valuable to Israel','They were foreigners in Egypt themselves and should remember that experience','God had promised to bless those who were kind to strangers','Foreigners often became the best soldiers in Israel\'s army'],a:2,w:'Lev.19:34 — "Love them as yourself, for you were foreigners in Egypt" — Israel\'s own experience of being strangers/slaves creates the obligation to care for others in that position.'},{q:'The Hebrew word for resident alien/stranger in OT law is:',o:['Nakim','Ger','Avodah','Mishpat'],a:2,w:'The Hebrew word ger refers to the resident alien or stranger living among Israel — a vulnerable person without the legal protections of full citizenship.'},{q:'In the book of Ruth, Boaz\'s actions illustrated social justice by:',o:['Giving Ruth a paid job in his household','Obeying the gleaning laws and leaving extra grain for Ruth, and acting as kinsman-redeemer','Refusing to let Moabites enter Israel\'s worship','Reporting Naomi to the elders for leaving Bethlehem'],a:2,w:'Boaz obeyed gleaning laws (Lev.19), gave instructions to leave extra for Ruth (Ruth 2:15-16), and acted as kinsman-redeemer (Ruth 4) — restoring the family\'s inheritance.'},{q:'The principle that one law applies equally to the native-born AND the stranger is stated in:',o:['Deuteronomy 5','Numbers 15 and Leviticus 24:22','Exodus 12 only','Genesis 12:1-3'],a:2,w:'Lev.24:22 — "You are to have the same law for the foreigner and the native-born" — and Numbers 15:16 — "The same rules and regulations will apply both to you and to the foreigner residing among you."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 OT',ti:'Justice in the Courts',su:'Examine OT demands for justice in the legal system.',steps:[
  {lb:'No partiality or bribery (Leviticus 19:15)',dr:dQ1,ht:'<p>Leviticus 19:15: <em>"Do not pervert justice; do not show partiality to the poor or favouritism to the great, but judge your neighbour fairly."</em> God demanded complete impartiality in courts — neither favouritism toward the rich (bribery) nor special treatment for the poor (sentimentality). Deuteronomy 16:19: <em>"Do not pervert justice or show partiality. Do not accept a bribe, for a bribe blinds the eyes of the wise and twists the words of the innocent."</em> Corruption in courts was a repeated prophetic target.</p>'},
  {lb:'Multiple witnesses required',dr:dQ1,ht:'<p>Deuteronomy 17:6: <em>"On the testimony of two or three witnesses a person is to be put to death. No one is to be put to death on the testimony of only one witness."</em> And 19:15: <em>"One witness is not enough to convict anyone accused of any crime or offence they may have committed. A matter must be established by the testimony of two or three witnesses."</em> This protected the accused from false accusation — a remarkable legal protection in the ancient world. False witnesses were to receive the same punishment they sought for the accused (Deut.19:19).</p>'},
  {lb:'Prophetic condemnation of corrupt courts',dr:dQ2,ht:'<p>The prophets consistently condemned corrupt courts: Amos: "You oppress the innocent and take bribes and you deprive the poor of justice in the courts" (5:12). Isaiah: "Your rulers are rebels, companions of thieves; they all love bribes and chase after gifts. They do not defend the cause of the fatherless; the widow\'s case does not come before them" (1:23). Micah: "Her leaders judge for a bribe, her priests teach for a price, and her prophets tell fortunes for money" (3:11). Corruption in courts was condemned as an assault on God\'s justice.</p>'},
  {lb:'Cities of Refuge — justice and mercy',dr:dQ2,ht:'<p>Numbers 35 and Deuteronomy 19 established six <b>Cities of Refuge</b> where someone who accidentally killed another could flee to avoid blood revenge, until they could stand trial. This distinguished between deliberate murder (requiring death) and accidental killing (requiring protection). It introduced a form of due process — the accused had the right to a fair hearing before being punished. These cities were distributed throughout the land so that no one was too far from protection. This showed the law\'s concern for proportionate justice.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Leviticus 19:15 commands judges to:',o:['Always side with the poor, who are disadvantaged','Always side with the rich, who maintain social order','Show partiality to neither the poor nor the great — judge fairly','Seek the advice of the High Priest before deciding'],a:3,w:'Lev.19:15 — "Do not pervert justice; do not show partiality to the poor or favouritism to the great, but judge your neighbour fairly" — complete impartiality in all cases.'},{q:'Under OT law, conviction in a serious criminal case required:',o:['The testimony of only one reliable witness','The testimony of two or three witnesses','Confession by the accused under oath','Approval by the High Priest'],a:2,w:'Deut.17:6 and 19:15 — "One witness is not enough... a matter must be established by the testimony of two or three witnesses" — protection against false accusation.'},{q:'Amos 5:12 condemned Israel\'s leaders for:',o:['Worshipping at the wrong sanctuary','Oppressing the innocent, taking bribes, and depriving the poor of justice in courts','Failing to enforce the Sabbath laws','Allowing foreigners to participate in worship'],a:2,w:'Amos 5:12 — "You oppress the innocent and take bribes and you deprive the poor of justice in the courts" — court corruption was a specific target of prophetic condemnation.'},{q:'The Cities of Refuge in OT law were established to:',o:['Provide sanctuary for priests fleeing persecution','Protect those who accidentally killed someone from blood revenge until they could have a fair trial','House lepers and those with skin diseases','Store the temple treasures in times of war'],a:2,w:'Numbers 35 / Deut.19 — Cities of Refuge gave the person who accidentally killed another a place of safety until a fair trial could determine whether the act was deliberate or accidental.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 OT',ti:'Nehemiah and Ezra — Justice in Restoration',su:'Examine Nehemiah\'s social justice reforms.',steps:[
  {lb:'Nehemiah\'s protest against exploitation (Neh.5)',dr:dQ2,ht:'<p>When Nehemiah returned to rebuild Jerusalem\'s walls, he discovered that wealthy Jews were exploiting poorer Jews: charging interest on loans; taking their fields, vineyards and homes as pledges; even selling their children into slavery to pay debts. Nehemiah was angry: <em>"I rebuked the nobles and officials... You are charging your own people interest!"</em> (5:7). He called a great assembly and made the wealthy return the pledged fields and vineyards and cancel the interest. Nehemiah himself set an example of selfless leadership.</p>'},
  {lb:'Nehemiah\'s personal example',dr:dQ1,ht:'<p>Nehemiah refused to take the governor\'s food allowance, which his predecessors had taken as a burden on the people (5:14-18). Instead, he fed 150 Jewish officials at his own table daily. He said: <em>"Out of reverence for God I did not act like that"</em> (5:15). And: <em>"I devoted myself to the work on this wall. All my men were assembled there for the work; we did not acquire any land"</em> (5:16). Nehemiah modelled the servant-leader who refuses to use position for personal enrichment — a rare example in OT narrative.</p>'},
  {lb:'Ezra\'s reform and the covenant',dr:dQ2,ht:'<p>Ezra led a spiritual renewal among the returned exiles, calling Israel back to covenant faithfulness. He read the Law publicly for a whole day, with Levites explaining it to the people (Neh.8:1-8). The people wept when they heard the Law. Ezra and Nehemiah together called the community to: (1) Separate from pagan practices. (2) Keep the Sabbath. (3) Cancel debts in the seventh year. (4) Bring tithes to support the Levites and the poor. The reforms connected social justice directly to covenant renewal and religious faithfulness.</p>'},
  {lb:'Lessons from Nehemiah and Ezra',dr:dQ2,ht:'<p>Lessons: (1) Leadership must model the justice it demands from others. (2) Economic exploitation by the powerful destroys community. (3) Social justice reforms must be backed by spiritual renewal (hearing God\'s word). (4) Even within the community of faith, the powerful can exploit the weak. (5) Nehemiah shows that righteous anger at injustice, channelled constructively, produces reform. (6) The tithe system provided for the poor and Levites — a structured way of sharing resources within the community.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'In Nehemiah 5, the wealthy Jews were exploiting the poor by:',o:['Selling them to foreign nations as slaves','Charging interest on loans and taking their fields as pledges for debts','Preventing them from working on the Sabbath','Forcing them to work on the wall without pay'],a:2,w:'Neh.5:1-5 — the poor were mortgaging fields and homes, paying interest, and even selling their children into slavery to pay debts to wealthier fellow Jews.'},{q:'How did Nehemiah personally model justice as governor?',o:['He paid the highest salary to all workers','He refused to take the governor\'s food allowance, which burdened the people, and fed officials at his own expense','He gave all his personal property to the poor','He required all officials to take an oath of poverty'],a:2,w:'Neh.5:14-18 — Nehemiah refused the governor\'s food allowance (which previous governors had taken), feeding 150 officials at his own expense: "Out of reverence for God I did not act like that."'},{q:'Ezra\'s public reading of the Law (Nehemiah 8) produced what response from the people?',o:['Immediate rebellion against Ezra\'s authority','Joy and celebration without any repentance','Weeping — when they heard the Law and recognised they had broken it','Silence — no one understood what was being read'],a:3,w:'Neh.8:9 — when the people heard the Law read, "all the people had been weeping as they listened to the words of the Law" — recognition of failure brought genuine grief.'},{q:'Nehemiah\'s social justice reforms were directly connected to:',o:['Military victory over surrounding nations','Political independence from Persia','Spiritual renewal — hearing God\'s law and covenant faithfulness','Economic prosperity from trade routes'],a:3,w:'Nehemiah\'s reforms (cancelling debts, returning land) were driven by covenant faithfulness and directly connected to Ezra\'s spiritual renewal through public reading of God\'s law.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 OT',ti:'God as Defender of the Poor',su:'Examine the OT\'s portrait of God as defender of the poor and oppressed.',steps:[
  {lb:'God\'s special concern for the vulnerable',dr:dQ1,ht:'<p>Throughout the OT, God is portrayed as the special defender of the poor, widows, orphans and strangers. Psalm 68:5 — God is "a father to the fatherless, a defender of widows." Psalm 146:7-9 — God "upholds the cause of the oppressed... gives food to the hungry... sets prisoners free... watches over the foreigner... sustains the fatherless and the widow." Isaiah 61:1 — God sends his servant "to proclaim good news to the poor." This is not social theory — it is a foundational attribute of God\'s character in the OT.</p>'},
  {lb:'The Exodus as the model of liberation',dr:dQ2,ht:'<p>The Exodus is the foundational social justice event of the OT: God heard the cry of enslaved Israel (Ex.3:7), acted to deliver them from oppression, and commanded Israel to remember this in all their dealings with the vulnerable. The Exodus became the standard by which all justice was measured: "Remember that you were slaves in Egypt" (Deut.5:15; 15:15; 16:12; 24:22) — said five times as the motivation for various social justice laws. God\'s character as liberator shaped Israel\'s social ethics.</p>'},
  {lb:'The prophets and God\'s bias toward the poor',dr:dQ2,ht:'<p>The prophets proclaimed God\'s special concern for the poor: Amos — God will punish those who "trample the needy and do away with the poor of the land" (8:4). Isaiah — God\'s servant brings "good news to the poor" (61:1). Jeremiah — true knowledge of God is expressed in "defending the cause of the poor and needy" (22:16). Proverbs 19:17 — "Whoever is kind to the poor lends to the LORD, and he will reward them for what they have done." Ignoring the poor means ignoring God.</p>'},
  {lb:'Application: social justice as worship',dr:dQ1,ht:'<p>The OT consistently presents caring for the poor not as optional charity but as: (1) Covenant obligation — part of the agreement with God. (2) Worship of God — Jer.22:16 says knowing God IS expressed in caring for the poor. (3) Reflection of God\'s character — because God defends the poor, His people must do the same. (4) A matter of life and death — the cry of the oppressed reaches God and calls down His judgment (Ex.22:23). Application for Nigeria: poverty, corruption and exploitation of the vulnerable are not just social problems but spiritual/religious issues requiring prophetic response.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Psalm 68:5 describes God as:',o:['A mighty warrior who defeats all enemies','A father to the fatherless and defender of widows','The creator who sustains all living things','A judge who punishes all sin without mercy'],a:2,w:'Psalm 68:5 — "A father to the fatherless, a defender of widows, is God in his holy dwelling" — God\'s special care for the most vulnerable is a core divine attribute.'},{q:'The OT repeats "Remember that you were slaves in Egypt" as the motivation for social justice laws. This appears approximately how many times in Deuteronomy?',o:['Once only','Twice','Five times','Ten times'],a:3,w:'The phrase "remember that you were slaves in Egypt" appears five times in Deuteronomy (5:15; 15:15; 16:12; 24:18; 24:22) — Israel\'s liberation experience creates perpetual obligation to the vulnerable.'},{q:'Jeremiah 22:16 says that truly knowing God is expressed by:',o:['Offering correct sacrifices at the temple','Observing all the Mosaic purity laws','Defending the cause of the poor and needy','Reading the Law every day'],a:3,w:'Jer.22:16 — God spoke of King Josiah: "He defended the cause of the poor and needy... Is that not what it means to know me?" — justice IS knowledge of God.'},{q:'The Exodus event (God delivering Israel from slavery) became the model for OT social justice because:',o:['It showed that military power is always available to the oppressed','It revealed God\'s character as one who hears the cry of the oppressed and acts to deliver them','It proved that Egypt was wrong to have slaves in the first place','It showed that obedience to the Law brings prosperity'],a:2,w:'The Exodus showed God\'s character: He heard enslaved Israel\'s cry (Ex.3:7) and acted. This became the model — God\'s people must treat others as God treated them: liberating, not oppressing.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 OT',ti:'Social Justice and Worship',su:'Examine the OT\'s connection between justice and worship.',steps:[
  {lb:'Isaiah 58 — true and false fasting',dr:dQ2,ht:'<p>Israel complained that they fasted but God did not notice. God replied: your fasting day brings quarrelling and exploitation. The fast God chooses: <em>"Is it not to share your food with the hungry and to provide the poor wanderer with shelter — when you see the naked, to clothe them"</em> (Is.58:7). The promise: if you do this, "then your light will break forth like the dawn... and your righteousness will go before you" (v.8). Justice IS worship; worship without justice is empty performance.</p>'},
  {lb:'Amos 5:21-24 — rejected worship',dr:dQ1,ht:'<p>God told Israel through Amos: <em>"I hate, I despise your religious festivals; your assemblies are a stench to me. Even though you bring me burnt offerings and grain offerings, I will not accept them... Away with the noise of your songs! I will not listen to the music of your harps"</em> (5:21-23). Why? Because the same people conducting elaborate worship were exploiting the poor (2:6-7). The remedy: <em>"But let justice roll on like a river, righteousness like a never-failing stream!"</em> (5:24). Justice must accompany worship.</p>'},
  {lb:'Micah 6:6-8 — what God requires',dr:dQ1,ht:'<p>Micah presented a man asking: what shall I bring to God? Thousands of rams? Rivers of oil? My firstborn child? God\'s answer: <em>"He has shown you, O mortal, what is good. And what does the LORD require of you? To act justly and to love mercy and to walk humbly with your God"</em> (6:8). No sacrifice, however expensive, can substitute for justice and mercy. This is the OT prophetic tradition\'s summary of true religion — a text that bridges law, prophecy and wisdom.</p>'},
  {lb:'The integration of justice and worship',dr:dQ1,ht:'<p>The OT\'s message on justice and worship: (1) Worship is not a separate compartment from ethics. (2) God observes how worshippers treat their employees, neighbours and the poor. (3) Expensive ritual cannot compensate for social sin. (4) The community of faith must be characterised by justice — in courts, commerce, agriculture and care for the vulnerable. (5) When justice is present, worship is acceptable. (6) God\'s rejection of hollow worship is a warning to all religious communities that prioritise ritual over righteousness.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Isaiah 58 says the fast God truly chooses involves:',o:['Going without food and water for 40 days','Wearing sackcloth and sitting in ashes','Sharing food with the hungry, sheltering wanderers, clothing the naked','Attending the temple for the full day of fasting'],a:3,w:'Isaiah 58:6-7 — the true fast includes loosening chains of injustice, freeing the oppressed, sharing food with the hungry, sheltering the wanderer and clothing the naked.'},{q:'Why did God reject Israel\'s worship in Amos 5:21-24?',o:['They worshipped at the wrong location','The priests were not properly ordained','The same people conducting worship were exploiting the poor','They had added foreign elements to the worship'],a:3,w:'God rejected their worship because it was contradicted by their social injustice — the worshippers were exploiting the poor (2:6-7) while offering lavish sacrifices and singing.'},{q:'Micah 6:8 says God requires three things. Select all three:',o:['Offer many sacrifices, observe festivals, walk humbly','Act justly, love mercy, walk humbly with God','Fast often, pray always, give to priests','Build a temple, observe Sabbath, pay tithes'],a:2,w:'Micah 6:8 — three requirements: ACT JUSTLY (social ethics), LOVE MERCY (personal compassion), WALK HUMBLY WITH GOD (spiritual attitude). No sacrifices mentioned.'},{q:'The common theme running through Isaiah 58, Amos 5:21-24 and Micah 6:6-8 is:',o:['Expensive sacrifices guarantee God\'s blessing','Worship and social justice cannot be separated — ritual without justice is rejected by God','Fasting is the highest form of worship','The temple is the only acceptable place to worship'],a:2,w:'All three passages teach the same truth: God rejects worship (however elaborate) when it is not accompanied by social justice — justice and worship are inseparable.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 OT',ti:'WAEC Prep — Social Justice in the OT',su:'Practise WAEC-style questions on OT social justice.',steps:[
  {lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC questions on OT social justice: (1) Define social justice in the OT context. (2) Identify the key OT laws (gleaning, Jubilee, Sabbath Year, care for strangers, honest courts). (3) Discuss the prophetic tradition (Amos, Isaiah, Micah) with specific references. (4) Apply to contemporary Christian life. Common questions: "Discuss OT teaching on care for the poor." / "How did the prophets address social injustice?" / "Examine OT laws protecting the vulnerable."</p>'},
  {lb:'Key references for WAEC',dr:dQ1,ht:'<p>WAEC reference bank: Amos 5:24 (justice like a river). Amos 2:6-7 (selling the poor for sandals). Micah 6:8 (act justly, love mercy, walk humbly). Isaiah 1:17 (seek justice, defend oppressed). Isaiah 58:6-7 (true fast). Lev.19:9-10 (gleaning). Lev.19:15 (no partiality in courts). Lev.19:34 (love the foreigner). Lev.25 (Jubilee). Deut.15 (Sabbath Year, cancel debts). Ex.22:22-24 (widows and orphans). Neh.5 (Nehemiah\'s reforms). Jer.22:16 (knowing God = defending the poor).</p>'},
  {lb:'Comparing prophetic voices on justice',dr:dQ2,ht:'<p>WAEC comparison: Amos — most focused on economic exploitation of poor; "let justice roll" (5:24). Isaiah — connects justice to worship; "defend the oppressed" (1:17); true fasting (58). Micah — summary of the whole: act justly, love mercy, walk humbly (6:8). Nehemiah — practical reform; cancelled debts; modelled servant leadership (5). Ezra — connected social reform to spiritual renewal; public reading of law. All agree: injustice toward the poor is incompatible with covenant faithfulness.</p>'},
  {lb:'Common WAEC mistakes',dr:dQ2,ht:'<p>Avoid: Attributing Amos 5:24 to Isaiah or Micah. Saying Micah 6:8 is from Amos. Confusing the Sabbath Year (every 7 years) with the Year of Jubilee (every 50 years). Forgetting that the gleaning laws are in Leviticus 19, not just in Ruth. Not giving specific scripture references — WAEC expects book, chapter and verse where possible. Not connecting justice to God\'s character — it is not merely social policy but a reflection of who God is.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which prophet said "Let justice roll on like a river, righteousness like a never-failing stream"?',o:['Isaiah','Micah','Amos','Jeremiah'],a:3,w:'Amos 5:24 — this is one of the most famous verses in the OT prophetic tradition, calling for consistent, flowing justice rather than occasional ritual.'},{q:'Micah 6:8 is the OT\'s greatest summary of what God requires. Which is the correct quote?',o:['Let justice roll on like a river, righteousness like a never-failing stream','Learn to do right; seek justice; defend the oppressed; take up the cause of the fatherless','Act justly and love mercy and walk humbly with your God','He has told you what is good: to love the LORD with all your heart'],a:3,w:'Micah 6:8 — "And what does the LORD require of you? To act justly and to love mercy and to walk humbly with your God" — three requirements, no sacrifices.'},{q:'The Year of Jubilee (Lev.25) occurred every 50 years and involved:',o:['A special sacrificial festival at the temple','Return of land to original owners, release of slaves, cancellation of debts','Fasting and mourning for the sins of the nation','Military campaigns to expand Israel\'s territory'],a:2,w:'Lev.25 — Jubilee (every 50th year): all land returned to original tribal owners, Hebrew slaves freed, debts cancelled. Lev.25:10 — "Proclaim liberty throughout the land."'},{q:'Jeremiah 22:16 says that truly knowing God is shown by:',o:['Offering correct sacrifices at the temple','Studying the Law day and night','Defending the cause of the poor and needy','Observing all the purity laws'],a:3,w:'Jer.22:16 — speaking of King Josiah: "He defended the cause of the poor and needy... Is that not what it means to know me? declares the LORD" — justice IS knowledge of God.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 OT',ti:'Mixed Questions — Social Justice in the OT',su:'Integrated revision across all CRS-OT-07 topics.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>OT social justice themes: care for poor (gleaning, Lev.19:9-10); strangers (Lev.19:34); widows/orphans (Ex.22:22); fair courts (Lev.19:15; Deut.17:6); Sabbath Year (Deut.15 — debts cancelled); Jubilee (Lev.25 — land returned every 50 years). Prophets: Amos (5:24 — justice like a river; 2:6-7 — sold for sandals); Isaiah (1:17 — defend oppressed; 58 — true fast); Micah (6:8 — act justly, love mercy, walk humbly). Nehemiah (ch.5 — cancelled debts; modelled servant leadership). God defends the poor (Ps.68:5; Jer.22:16).</p>'},
  {lb:'Connecting themes',dr:dQ10,ht:'<p>Key connections: God\'s character (defender of poor) → OT Law (gleaning, Jubilee, courts) → Prophetic condemnation (Amos, Isaiah, Micah) → Practical reform (Nehemiah) → True worship inseparable from justice (Amos 5, Isaiah 58, Micah 6). The Exodus is the model — God who liberated Israel from oppression expects Israel to liberate and protect the vulnerable in their midst. Justice is not optional charitable add-on; it is covenant faithfulness, knowledge of God, and true worship.</p>'},
  {lb:'Application to Nigerian context',dr:dQ1,ht:'<p>OT social justice applied to Nigeria: Gleaning laws → policies that ensure basic provision for the poor. Jubilee → debt relief and land reform. Care for strangers → treatment of displaced persons, IDP camps, migrants. Fair courts → fighting corruption and ensuring equal access to justice. Prophetic voice → the church must speak on corruption, poverty and exploitation. Nehemiah\'s servant leadership → politicians and officials who serve rather than exploit. These are not political opinions but covenant responsibilities rooted in God\'s character.</p>'},
  {lb:'WAEC final tips',dr:dQ10,ht:'<p>Final revision: Know Amos 5:24 (justice like a river) and Micah 6:8 (act justly, love mercy, walk humbly) as the two most quoted texts. Know the difference between Sabbath Year (7 years) and Jubilee (50 years). Know that gleaning laws are Lev.19 (illustrated by Ruth). Know Isaiah 58 (true fast = justice). Know that Nehemiah cancelled debts and modelled servant leadership. For essays: define → law provisions → prophetic message with references → God\'s character → application today. Always give book and chapter.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Which OT law was Ruth benefiting from when she gleaned in Boaz\'s field?',o:['The Jubilee law (Lev.25)','The gleaning law (Lev.19:9-10)','The Sabbath Year law (Deut.15)','The kinship law (Deut.25)'],a:2,w:'The gleaning laws (Lev.19:9-10) required farmers to leave the edges of fields and fallen produce for the poor and the foreigner. Ruth, as a Moabite (foreigner), was gleaning under this law.'},{q:'Amos, Isaiah and Micah all agreed that:',o:['Sacrifices and ritual are the most important aspect of religion','God is not concerned with social matters, only with worship','Worship without social justice is rejected by God','Military strength is the key to God\'s blessing'],a:3,w:'All three prophets taught that God rejects elaborate worship when it is not accompanied by social justice — Amos 5:21-24, Isaiah 1:11-17, Micah 6:6-8 all make this same point.'},{q:'The Jubilee (Lev.25) built systemic equity into Israel by:',o:['Making all Israelites equal in wealth at all times','Preventing permanent accumulation of wealth by returning land every 50 years','Forbidding all trade and commerce within Israel','Requiring annual redistribution of all income'],a:2,w:'The Jubilee prevented permanent economic inequality — land could be sold but always returned to the original family every 50 years, preventing permanent landlessness.'},{q:'Nehemiah\'s response to the exploitation of the poor (Neh.5) was to:',o:['Pray about it and wait for God to act','Call a great assembly, rebuke the wealthy, and require them to return pledged fields and cancel interest','Write a letter of complaint to the Persian king','Expel the wealthy nobles from Jerusalem'],a:2,w:'Neh.5:7-12 — Nehemiah rebuked the nobles publicly, called a great assembly, and required the wealthy to return the mortgaged fields, vineyards and homes, and cancel the interest charged.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
