<style>

var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){

document.addEventListener('click',function(e){
  var el=e.target;

    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;

});

{lb:'The death of James',dr:dQ1,ht:'<p>Herod had the apostle <b>James, son of Zebedee</b> (brother of John), <b>killed with the sword</b> (Acts 12:2) &mdash; making him the first of the twelve apostles to be martyred.</p>'},
{lb:'Peter\'s arrest',dr:dQ1,ht:'<p>Seeing that this pleased the Jewish leaders, Herod also had <b>Peter arrested</b> during the <b>Passover/Feast of Unleavened Bread</b>, placing him under heavy guard with four squads of soldiers, intending to bring him to public trial after the festival (Acts 12:3-4).</p>'},
{lb:'The church\'s response: earnest prayer',dr:dQ1,ht:'<p>While Peter was imprisoned, the church responded not with despair but with <b>earnest, persistent prayer</b> (Acts 12:5) &mdash; a model of the Christian community\'s response to persecution that recurs throughout Acts.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which king persecuted the church in Acts 12?","o":["Herod Agrippa I","Pontius Pilate","Emperor Nero","King David"],"a":0,"w":"King Herod Agrippa I persecuted the church in Acts 12."},{"q":"Why did Herod extend persecution against the church?","o":["To please the Roman Emperor specifically","To please the Jewish religious leaders who opposed the Christian movement","To gain wealth from Christian believers","To convert to Christianity himself"],"a":1,"w":"Herod persecuted the church to please the Jewish religious leaders who opposed it."},{"q":"Which apostle did Herod have killed with the sword?","o":["Paul","Peter","James, son of Zebedee","Stephen"],"a":2,"w":"Herod had James, son of Zebedee, killed with the sword."},{"q":"What distinction does James's death hold among the twelve apostles?","o":["He died of natural causes, not martyrdom","He was the last apostle to die of any cause","He was never actually one of the twelve apostles","He was the first of the twelve to be martyred"],"a":3,"w":"James was the first of the twelve apostles to be martyred."},{"q":"During which festival was Peter arrested?","o":["The Passover/Feast of Unleavened Bread","Pentecost","The Day of Atonement","The Feast of Tabernacles"],"a":0,"w":"Peter was arrested during the Passover/Feast of Unleavened Bread."},{"q":"How many squads of soldiers guarded Peter in prison?","o":["One","Four","Twelve","Two"],"a":1,"w":"Four squads of soldiers guarded Peter in prison."},{"q":"What was Herod's intention regarding Peter after the festival?","o":["To make him a co-ruler","To immediately release him","To bring him to public trial","To send him to Rome for execution by the Emperor"],"a":2,"w":"Herod intended to bring Peter to public trial after the festival."},{"q":"How did the church respond to Peter's imprisonment, according to Acts 12:5?","o":["With a formal legal appeal to Rome","With immediate armed rebellion","With complete despair and disbanding","With earnest, persistent prayer"],"a":3,"w":"The church responded to Peter's imprisonment with earnest, persistent prayer."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'Walking past the guards',dr:dQ2,ht:'<p>The angel instructed Peter to dress and follow him; they walked past the first and second guard posts, and an <b>iron gate opened by itself</b>, leading them into the city (Acts 12:8-10).</p>'},
{lb:'Peter realises it is real',dr:dQ2,ht:'<p>Peter initially thought he was seeing a vision, but upon the angel\'s departure, he <b>realised the Lord had truly rescued him</b> from Herod\'s plan and from the expectations of the Jewish people (Acts 12:11).</p>'},
{lb:'Rhoda and the praying church',dr:dQ2,ht:'<p>Peter went to the house where believers were <b>praying for him</b>; a servant girl named <b>Rhoda</b> was so astonished to hear his voice at the door that she left him standing outside while she ran to tell the others, who initially did not believe her (Acts 12:12-16).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Who appeared in Peter's cell the night before his trial?","o":["An angel of the Lord","Herod himself","The apostle John","A Roman centurion"],"a":0,"w":"An angel of the Lord appeared in Peter's cell the night before his trial."},{"q":"How was Peter bound in his cell?","o":["He was not bound at all","With chains, sleeping between two soldiers","Locked alone in a windowless cell","Chained to a wall by his neck only"],"a":1,"w":"Peter was bound with chains, sleeping between two soldiers."},{"q":"What happened to Peter's chains when the angel struck his side?","o":["They turned to gold","They tightened further","They fell off","Nothing happened to them at all"],"a":2,"w":"Peter's chains fell off when the angel struck his side."},{"q":"What opened by itself as Peter and the angel left the prison?","o":["A tunnel","A wooden door","A window","An iron gate"],"a":3,"w":"An iron gate opened by itself as Peter and the angel left the prison."},{"q":"What did Peter initially think was happening, according to Acts 12:9?","o":["That he was seeing a vision","That he was already dead","That Herod had released him officially","That the guards had helped him escape deliberately"],"a":0,"w":"Peter initially thought he was seeing a vision, not a real event."},{"q":"What did Peter realise once the angel departed?","o":["That he had imagined the entire escape","That the Lord had truly rescued him from Herod's plan","That he needed to return to prison immediately","That Herod had actually released him willingly"],"a":1,"w":"Peter realised the Lord had truly rescued him from Herod's plan."},{"q":"Which servant girl was so astonished to hear Peter's voice that she left him at the door?","o":["Martha","Mary","Rhoda","Lydia"],"a":2,"w":"Rhoda was so astonished to hear Peter's voice that she left him standing at the door."},{"q":"What was the church doing in the house Peter went to, according to Acts 12:12?","o":["Debating theology","Celebrating a festival","Sleeping, unaware of his imprisonment","Praying for him"],"a":3,"w":"The church was praying for Peter in the house he went to after his escape."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS • Acts & Epistles',ti:'Paul and Silas Imprisoned at Philippi',su:'Explain the imprisonment and deliverance of Paul and Silas at Philippi.',steps:[
{lb:'Casting out a spirit of divination',dr:dQ1,ht:'<p>In Philippi, Paul cast a <b>spirit of divination</b> out of a slave girl who had been earning her owners money through fortune-telling (Acts 16:16-18), angering her owners, who lost their source of income.</p>'},
{lb:'Arrest and severe flogging',dr:dQ1,ht:'<p>The girl\'s owners dragged Paul and Silas before the authorities, who had them <b>severely flogged</b> and thrown into prison, with their feet fastened in <b>stocks</b> (Acts 16:19-24).</p>'},
{lb:'Praying and singing at midnight',dr:dQ1,ht:'<p>Despite their painful wounds, at <b>midnight</b> Paul and Silas were <b>praying and singing hymns</b> to God, with the other prisoners listening to them (Acts 16:25) &mdash; a striking example of praising God amid suffering.</p>'},
{lb:'The earthquake and the jailer\'s conversion',dr:dQ1,ht:'<p>A sudden <b>earthquake</b> shook the prison\'s foundations, opening all the doors and loosening every prisoner\'s chains. The terrified jailer, believing prisoners had escaped, was about to kill himself before Paul stopped him; the jailer then asked what he must do to be saved, and he and his household believed and were baptised that very night (Acts 16:26-34).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What did Paul cast out of a slave girl in Philippi?","o":["A spirit of divination","A demon of madness","An unclean spirit of sickness","Nothing — this event did not occur"],"a":0,"w":"Paul cast out a spirit of divination from a slave girl in Philippi."},{"q":"Why did the slave girl's owners become angry with Paul?","o":["Paul had insulted the Roman Emperor","They lost their source of income from her fortune-telling","Paul had refused to pay them money","Paul had converted them to Judaism"],"a":1,"w":"The owners became angry because they lost their income from the girl's fortune-telling."},{"q":"What happened to Paul and Silas after their arrest in Philippi?","o":["They were made local officials","They were immediately released with an apology","They were severely flogged and put in stocks in prison","They were sent directly to Rome"],"a":2,"w":"Paul and Silas were severely flogged and put in stocks in prison after their arrest."},{"q":"What were Paul and Silas doing at midnight in prison, according to Acts 16:25?","o":["Arguing with the other prisoners","Sleeping soundly with no disturbance","Planning an escape","Praying and singing hymns to God"],"a":3,"w":"Paul and Silas were praying and singing hymns to God at midnight in prison."},{"q":"What natural event shook the prison and loosened everyone's chains?","o":["An earthquake","A flood","A fire","A storm at sea"],"a":0,"w":"An earthquake shook the prison and loosened everyone's chains."},{"q":"What was the jailer about to do when he saw the prison doors open?","o":["Immediately release all the prisoners","Kill himself, believing prisoners had escaped","Call for reinforcements","Flee the city himself"],"a":1,"w":"The jailer was about to kill himself, believing the prisoners had escaped."},{"q":"What stopped the jailer from killing himself?","o":["Silas overpowered him","An angel physically restrained him","Paul called out that all the prisoners were still {ey:'Q4 \u2022 CRS • Acts & Epistles',ti:'Paul Stoned at Lystra',su:'Explain the account of Paul\'s stoning at Lystra and his remarkable perseverance.',steps:[
{lb:'Paul and Barnabas mistaken for gods',dr:dQ2,ht:'<p>At <b>Lystra</b>, after Paul healed a man lame from birth, the crowds mistook Paul and Barnabas for the Greek gods <b>Hermes and Zeus</b>, attempting to offer sacrifices to them &mdash; which Paul and Barnabas urgently stopped (Acts 14:8-18).</p>'},
{lb:'Opponents turn the crowd',dr:dQ2,ht:'<p>Jewish opponents arrived from Antioch and Iconium and <b>won the crowds over</b>, turning the same people who had wanted to worship Paul into a mob that <b>stoned him</b> (Acts 14:19).</p>'},
{lb:'Left for dead',dr:dQ2,ht:'<p>Paul was dragged out of the city and left for <b>dead</b>. However, when the disciples gathered around him, he <b>got up</b> and, remarkably, went back into the city, before leaving the next day for Derbe (Acts 14:19-20).</p>'},
{lb:'Remarkable perseverance',dr:dQ2,ht:'<p>This episode illustrates Paul\'s extraordinary <b>perseverance</b> in mission &mdash; being stoned nearly to death did not stop him from continuing his missionary journey, later even <b>revisiting Lystra</b> to strengthen the believers there (Acts 14:21-22).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"At which city were Paul and Barnabas mistaken for Greek gods?","o":["Lystra","Philippi","Damascus","Jerusalem"],"a":0,"w":"Paul and Barnabas were mistaken for Greek gods at Lystra."},{"q":"What miracle did Paul perform at Lystra that led to this mistaken identity?","o":["Raising someone from the dead","Healing a man lame from birth","Calming a storm","Casting out an evil spirit"],"a":1,"w":"Paul healed a man lame from birth at Lystra, leading to the crowd's mistaken identification."},{"q":"Which two Greek gods did the crowd mistake Paul and Barnabas for?","o":["Poseidon and Ares","Apollo and Athena","Hermes and Zeus","Hades and Dionysus"],"a":2,"w":"The crowd mistook Paul and Barnabas for the Greek gods Hermes and Zeus."},{"q":"What did the crowd attempt to do, believing Paul and Barnabas were gods?","o":["Exile them from the city","Imprison them immediately","Crown them as kings","Offer sacrifices to them"],"a":3,"w":"The crowd attempted to offer sacrifices to Paul and Barnabas, believing them to be gods."},{"q":"Who turned the crowd against Paul, leading to his stoning?","o":["Jewish opponents who arrived from Antioch and Iconium","The Roman governor of the region","Paul's own missionary companions","The healed lame man himself"],"a":0,"w":"Jewish opponents who arrived from Antioch and Iconium turned the crowd against Paul."},{"q":"What happened to Paul after he was stoned at Lystra?","o":["He was immediately killed and buried","He was dragged out of the city and left for dead","He was arrested and imprisoned instead","He fled the city before being stoned"],"a":1,"w":"Paul was dragged out of the city and left for dead after being stoned."},{"q":"What did Paul do after the disciples gathered around him?","o":["He immediately left the region permanently","He remained unconscious for several days","He got up and went back into the city","He renounced his faith"],"a":2,"w":"Paul got up and went back into the city after the disciples gathered around him."},{"q":"What does this episode illustrate about Paul's character?","o":["A complete rejection of preaching to Gentiles","A decision to abandon missionary work after this event","Fear that prevented him from ever returning to Lystra","Extraordinary perseverance in mission despite severe suffering"],"a":3,"w":"This episode illustrates Paul's extraordinary perseverance in mission despite severe suffering."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS • Acts & Epistles',ti:'Paul\'s Catalogue of Sufferings',su:'Examine Paul\'s own account of the sufferings he endured for the gospel.',steps:[
{lb:'Paul\'s remarkable list',dr:dQ1,ht:'<p>In <b>2 Corinthians 11:23-28</b>, Paul provides a striking personal catalogue of his sufferings for the gospel, defending his apostolic credentials against false teachers who questioned his authority.</p>'},
{lb:'Physical sufferings',dr:dQ1,ht:'<p>Paul lists being <b>imprisoned</b> frequently, <b>flogged</b> severely (receiving "forty lashes minus one" five times, and beaten with rods three times), <b>stoned once</b>, and shipwrecked three times, spending a night and a day adrift at sea.</p>'},
{lb:'Dangers on his travels',dr:dQ1,ht:'<p>Paul recounts constant <b>dangers</b> &mdash; from rivers, bandits, his own countrymen, Gentiles, in the city, in the country, at sea, and from false believers &mdash; alongside <b>hard labour, sleepless nights, hunger and thirst</b>.</p>'},
{lb:'Daily pressure of concern for the churches',dr:dQ1,ht:'<p>Beyond physical suffering, Paul mentions the daily <b>pressure of his concern for all the churches</b> (2 Corinthians 11:28) &mdash; showing that his suffering included profound emotional and pastoral burden, not only physical hardship.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"In which letter does Paul provide his personal catalogue of sufferings?","o":["2 Corinthians","Romans","Galatians","Philippians"],"a":0,"w":"Paul provides his catalogue of sufferings in 2 Corinthians 11:23-28."},{"q":"Why did Paul list his sufferings in this letter?","o":["To request financial compensation from the church","To defend his apostolic credentials against false teachers questioning his authority","To complain about his circumstances with no purpose","To announce his retirement from ministry"],"a":1,"w":"Paul listed his sufferings to defend his apostolic credentials against false teachers."},{"q":"How many times was Paul given \"forty lashes minus one,\" according to this passage?","o":["Ten times","Once","Five times","Never — he was never flogged"],"a":2,"w":"Paul received \"forty lashes minus one\" five times, according to 2 Corinthians 11."},{"q":"How many times was Paul shipwrecked, according to this passage?","o":["Ten times","Never","Once","Three times"],"a":3,"w":"Paul was shipwrecked three times, according to this passage."},{"q":"Which of these dangers does Paul mention facing on his travels?","o":["Dangers from rivers, bandits, and even false believers","Only danger from wild animals","Only danger from foreign armies","No dangers at all — his travels were entirely safe"],"a":0,"w":"Paul mentions dangers from rivers, bandits, his own countrymen, Gentiles, and even false believers."},{"q":"Besides physical suffering, what other burden does Paul mention in 2 Corinthians 11:28?","o":["A burden of excessive wealth","The daily pressure of his concern for all the churches","A burden of political responsibility","No other burden is mentioned"],"a":1,"w":"Paul mentions the daily pressure of his concern for all the churches, beyond physical suffering."},{"q":"What does this catalogue reveal about the nature of Paul's suffering?","o":["It was exaggerated and not genuinely experienced","It was entirely physical, with no emotional dimension at all","It included profound emotional and pastoral burden, not only physical hardship","It occurred only once in his entire ministry"],"a":2,"w":"This catalogue reveals that Paul's suffering included profound emotional and pastoral burden, not only physical hardship."},{"q":"What overall impression does this passage give of Paul's commitment to his mission?","o":["No real commitment at all","A reluctant commitment that he frequently abandoned","A commitment limited only to comfortable circumstances","A remarkable, sustained commitment despite extraordinary suffering"],"a":3,"w":"This passage gives the impression of a remarkable, sustained commitment despite extraordinary suffering."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS • Acts & Epistles',ti:'Theological Understanding of Suffering',su:'Explore the New Testament\'s theological teaching on suffering for the Christian faith.',steps:[
{lb:'Nothing can separate us from God\'s love',dr:dQ2,ht:'<p>In <b>Romans 8:35-39</b>, Paul asks what can separate believers from the love of Christ &mdash; listing trouble, hardship, persecution and even death &mdash; and concludes that <b>nothing</b> in all creation can separate believers from God\'s love.</p>'},
{lb:'Suffering as a privilege',dr:dQ2,ht:'<p>Philippians 1:29 remarkably states that believers have been <b>granted</b> not only to believe in Christ but also to <b>suffer for him</b> &mdash; framing suffering for the faith as a privilege connected to genuine discipleship, not merely an unfortunate accident.</p>'},
{lb:'Do not be surprised by suffering',dr:dQ2,ht:'<p><b>1 Peter 4:12-16</b> instructs believers not to be surprised by "the fiery ordeal" they suffer, but to <b>rejoice</b> that they participate in Christ\'s sufferings, and to consider it a blessing to suffer specifically for bearing the name "Christian."</p>'},
{lb:'Suffering produces character',dr:dQ2,ht:'<p>Romans 5:3-4 teaches that suffering produces <b>perseverance</b>, perseverance produces <b>character</b>, and character produces <b>hope</b> &mdash; framing suffering as potentially productive for spiritual growth, not merely something to be endured passively.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"In Romans 8:35-39, what does Paul conclude can separate believers from God's love?","o":["Nothing in all creation","Only severe persecution","Only death, but nothing else","Only personal sin"],"a":0,"w":"Paul concludes that nothing in all creation can separate believers from God's love."},{"q":"What things does Paul list in Romans 8:35 that cannot separate believers from Christ's love?","o":["Only minor inconveniences","Trouble, hardship, persecution and even death","Only financial hardship","Only physical illness"],"a":1,"w":"Paul lists trouble, hardship, persecution and even death as things that cannot separate believers from Christ's love."},{"q":"What does Philippians 1:29 say believers have been granted, alongside believing in Christ?","o":["To avoid all hardship forever","To become wealthy through him","To suffer for him","To rule over other believers"],"a":2,"w":"Philippians 1:29 says believers have been granted to suffer for Christ, alongside believing in him."},{"q":"How does Philippians 1:29 frame suffering for the faith?","o":["As proof that God has abandoned the believer","As a punishment for insufficient faith","As something entirely accidental with no meaning","As a privilege connected to genuine discipleship"],"a":3,"w":"Philippians 1:29 frames suffering for the faith as a privilege connected to genuine discipleship."},{"q":"What does 1 Peter 4:12 instruct believers not to be, regarding suffering?","o":["Surprised by \"the fiery ordeal\" they suffer","Completely unaware that suffering exists","Angry at other believers","Silent about their faith"],"a":0,"w":"1 Peter 4:12 instructs believers not to be surprised by \"the fiery ordeal\" they suffer."},{"q":"What does 1 Peter 4:16 say about suffering specifically for bearing the name \"Christian\"?","o":["It should be hidden and denied","It should be considered a blessing","It should never be discussed","It proves the believer has sinned"],"a":1,"w":"1 Peter 4:16 says suffering for bearing the name \"Christian\" should be considered a blessing."},{"q":"According to Romans 5:3-4, what does suffering produce first?","o":["Immediate freedom from all suffering","Immediate wealth","Perseverance","Public recognition"],"a":2,"w":"According to Romans 5:3-4, suffering produces perseverance first."},{"q":"What is the full chain of outcomes Romans 5:3-4 describes, starting from suffering?","o":["Suffering → isolation → bitterness → unbelief","Suffering → despair → anger → revenge","Suffering → wealth → power → pride","Suffering → perseverance → character → hope"],"a":3,"w":"Romans 5:3-4 describes the chain: suffering produces perseverance, perseverance produces character, and character produces hope."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS • Acts & Epistles',ti:'The Church\'s Response to Persecution',su:'Explain how the early Church responded to persecution with prayer and boldness.',steps:[
{lb:'Peter and John released, then threatened',dr:dQ1,ht:'<p>After Peter and John were arrested, questioned, and released by the Sanhedrin with orders to stop speaking about Jesus, they returned to the believers and reported everything (Acts 4:23).</p>'},
{lb:'The church\'s prayer for boldness',dr:dQ1,ht:'<p>Rather than praying for the threats to stop, the believers prayed for <b>boldness</b> to continue speaking God\'s word despite the danger, and asked God to continue performing signs and wonders through the name of Jesus (Acts 4:24-30).</p>'},
{lb:'The place was shaken',dr:dQ1,ht:'<p>After they prayed, the place where they were meeting was <b>shaken</b>, and they were all <b>filled with the Holy Spirit</b> and spoke the word of God <b>boldly</b> (Acts 4:31) &mdash; a direct, visible answer to their specific prayer.</p>'},
{lb:'A pattern for facing persecution',dr:dQ1,ht:'<p>This episode establishes a recurring biblical pattern: facing persecution not by avoiding danger, but by seeking <b>God\'s empowering presence</b> to continue faithful witness despite the risks involved.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What had Peter and John been ordered to stop doing by the Sanhedrin?","o":["Speaking about Jesus","Praying together","Meeting in homes","Baptising new believers"],"a":0,"w":"Peter and John had been ordered by the Sanhedrin to stop speaking about Jesus."},{"q":"What did the believers pray for, rather than praying for the threats to stop?","o":["Immediate revenge against their persecutors","Boldness to continue speaking God's word","Wealth and safety above all else","Permission to leave Jerusalem permanently"],"a":1,"w":"The believers prayed for boldness to continue speaking God's word, rather than for the threats to stop."},{"q":"What else did the believers ask God to continue doing, according to Acts 4:30?","o":["Send an army to defend them","Immediately end all Roman rule","Perform signs and wonders through the name of Jesus","Grant them personal wealth"],"a":2,"w":"The believers also asked God to continue performing signs and wonders through the name of Jesus."},{"q":"What happened to the place where the believers were meeting, after they prayed?","o":["Nothing happened at all","It caught fire","It collapsed entirely","It was shaken"],"a":3,"w":"The place where the believers were meeting was shaken after they prayed."},{"q":"What were the believers filled with after this shaking, according to Acts 4:31?","o":["The Holy Spirit","Fear and confusion","Anger at the Sanhedrin","Doubt about their faith"],"a":0,"w":"The believers were filled with the Holy Spirit after the shaking."},{"q":"What did the believers do as a result of being filled with the Holy Spirit?","o":["They immediately fled the city","They spoke the word of God boldly","They stopped preaching altogether","They demanded revenge on their persecutors"],"a":1,"w":"As a result, the believers spoke the word of God boldly."},{"q":"What pattern does this episode establish for facing persecution?","o":["Seeking violent revenge against persecutors","Avoiding all danger by staying completely silent","Seeking God's empowering presence to continue faithful witness despite risk","Abandoning the faith to avoid further trouble"],"a":2,"w":"This episode establishes seeking God's empowering presence to continue faithful witness despite risk."},{"q":"Why is this episode considered a direct answer to prayer?","o":["No prayer was actually offered in this passage","The prayer had no connection to what followed","The believers prayed for something entirely different","The specific request for boldness was immediately followed by boldness through the Spirit"],"a":3,"w":"This is considered a direct answer to prayer because the specific request for boldness was immediately followed by Spirit-given boldness."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS • Acts & Epistles',ti:'Persecution Today: Modern Application',su:'Apply biblical teaching on persecution to the experience of Christians today.',steps:[
{lb:'A continuing reality',dr:dQ2,ht:'<p>Persecution of Christians for their faith remains a <b>present-day reality</b> in many parts of the world, with believers in some regions facing legal restriction, social discrimination, or violent attack because of their faith, echoing the experiences recorded in Acts.</p>'},
{lb:'Lessons in perseverance',dr:dQ2,ht:'<p>The examples of Peter, Paul and the early church &mdash; enduring imprisonment, flogging and stoning without abandoning their mission &mdash; provide a model of <b>perseverance</b> for Christians facing hardship or opposition today, whether severe or milder forms.</p>'},
{lb:'Prayer as the first response',dr:dQ2,ht:'<p>Following Acts 4\'s example, Christians today are encouraged to respond to opposition and difficulty first through <b>prayer for boldness</b>, rather than despair or purely human strategies alone.</p>'},
{lb:'Solidarity with the persecuted church',dr:dQ2,ht:'<p>Christian communities worldwide, including in Nigeria, often express <b>solidarity</b> with persecuted believers elsewhere &mdash; through prayer, advocacy and support &mdash; recognising a shared identity as members of one global Church body, echoing Paul\'s own "concern for all the churches."</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Is persecution of Christians for their faith only a historical, ancient phenomenon?","o":["No, it remains a present-day reality in many parts of the world","Yes, it ended entirely after the book of Acts","Yes, it ended with the Roman Empire's fall","No, it has never actually occurred at any point in history"],"a":0,"w":"Persecution of Christians remains a present-day reality in many parts of the world."},{"q":"What kinds of persecution do Christians face in some regions today, according to this lesson?","o":["Only mild inconvenience with no real consequence","Legal restriction, social discrimination, or violent attack","No forms of persecution exist anywhere today","Only economic taxation, with no other form"],"a":1,"w":"Christians today can face legal restriction, social discrimination, or violent attack because of their faith."},{"q":"What model do the examples of Peter, Paul and the early church provide for believers today?","o":["A model of abandoning faith when challenged","A model of avoiding all difficulty entirely","A model of perseverance amid hardship or opposition","A model with no relevance to modern believers"],"a":2,"w":"These examples provide a model of perseverance for believers facing hardship or opposition today."},{"q":"Following Acts 4's example, what should be the first response to opposition, according to this lesson?","o":["Purely human strategies with no reliance on prayer","Immediate legal action only","Silence and complete withdrawal from public life","Prayer for boldness"],"a":3,"w":"Following Acts 4's example, prayer for boldness should be the first response to opposition."},{"q":"What do Christian communities worldwide, including in Nigeria, often express toward persecuted believers elsewhere?","o":["Solidarity, through prayer, advocacy and support","Indifference, with no connection to other believers","Criticism for not avoiding persecution entirely","Complete separation, with no shared identity"],"a":0,"w":"Christian communities worldwide often express solidarity with persecuted believers elsewhere through prayer, advocacy and support."},{"q":"What shared identity does this solidarity reflect, according to this lesson?","o":["A shared identity based only on nationality","A shared identity as members of one global Church body","No shared identity of any kind","A shared identity limited only to a single denomination"],"a":1,"w":"This solidarity reflects a shared identity as members of one global Church body."},{"q":"Which of Paul's own attitudes does this modern solidarity echo?","o":["His arrest in Philippi specifically","His stoning at Lystra specifically","His \"concern for all the churches\" (2 Corinthians 11:28)","His conversion on the Damascus road"],"a":2,"w":"This modern solidarity echoes Paul's own \"concern for all the churches\" mentioned in 2 Corinthians 11:28."},{"q":"What overall lesson does this topic draw for Christians facing difficulty today?","o":["To seek revenge against those who cause difficulty","To avoid all forms of Christian identity publicly","To abandon faith whenever facing any difficulty","To respond with prayer, perseverance and solidarity, following the early Church's example"],"a":3,"w":"The overall lesson is to respond with prayer, perseverance and solidarity, following the early Church's example."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS • Acts & Epistles',ti:'WAEC Exam Preparation — Persecution',su:'Practise WAEC-style questions on persecution in Acts and the Epistles.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on persecution: (1) Identify the <b>specific passage or event</b> asked about. (2) Give the <b>precise Bible reference</b>. (3) Explain <b>what happened and how those involved responded</b>. (4) Draw out the <b>theological lesson</b> or modern application.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "Describe Peter\'s miraculous deliverance from prison in Acts 12." / "Explain what happened to Paul and Silas at Philippi." / "Discuss the New Testament teaching on suffering for the faith." / "What can Christians today learn from the persecution of the early Church?"</p>'},
{lb:'Key references to remember',dr:dQ1,ht:'<p>Key references: <b>Acts 12</b> (Herod, James\'s death, Peter\'s escape); <b>Acts 16</b> (Paul and Silas at Philippi); <b>Acts 14</b> (Paul stoned at Lystra); <b>2 Corinthians 11:23-28</b> (Paul\'s sufferings); <b>Romans 8:35-39, Philippians 1:29, 1 Peter 4:12-16</b> (theology of suffering); <b>Acts 4</b> (prayer for boldness).</p>'},
{lb:'Applying theology to modern life',dr:dQ1,ht:'<p>WAEC essays should connect biblical persecution accounts to <b>modern application</b> &mdash; the reality of persecution today, the model of perseverance, and the priority of prayer &mdash; rather than treating these passages as only ancient history.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on persecution?","o":["Identify the specific passage or event asked about","Immediately give a personal opinion with no facts","List unrelated facts with no explanation","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on persecution should begin by identifying the specific passage or event asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Describe Peter's miraculous deliverance from prison in Acts 12.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"Describe Peter's miraculous deliverance from prison in Acts 12\" is a typical WAEC-style question on this topic."},{"q":"Which chapter of Acts records Herod's persecution and Peter's escape?","o":["Acts 14","Acts 16","Acts 12","Acts 4"],"a":2,"w":"Acts 12 records Herod's persecution and Peter's miraculous escape."},{"q":"Which chapter of Acts records Paul and Silas's imprisonment at Philippi?","o":["Acts 4","Acts 12","Acts 14","Acts 16"],"a":3,"w":"Acts 16 records Paul and Silas's imprisonment at Philippi."},{"q":"Which chapter of Acts records Paul being stoned at Lystra?","o":["Acts 14","Acts 12","Acts 16","Acts 4"],"a":0,"w":"Acts 14 records Paul being stoned at Lystra."},{"q":"Which epistle passage contains Paul's catalogue of his sufferings?","o":["Romans 12","2 Corinthians 11:23-28","Philippians 4","1 Peter 1"],"a":1,"w":"2 Corinthians 11:23-28 contains Paul's catalogue of his sufferings."},{"q":"Which chapter of Acts records the church's prayer for boldness under threat?","o":["Acts 16","Acts 12","Acts 4","Acts 14"],"a":2,"w":"Acts 4 records the church's prayer for boldness under threat."},{"q":"Why should WAEC essays on this topic connect biblical accounts to modern application?","o":["WAEC forbids discussing anything beyond the Bible text itself","Modern application is irrelevant to WAEC marking","Only ancient history should ever be discussed","To show the theology remains relevant to Christians facing difficulty today"],"a":3,"w":"Connecting biblical accounts to modern application shows the theology remains relevant to Christians today, which WAEC rewards."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS • Acts & Epistles',ti:'Mixed Questions — Persecution',su:'Integrated revision across the persecution accounts and theology in Acts and the Epistles.',steps:[
{lb:'Summary of key events',dr:dQ2,ht:'<p>Persecution features throughout Acts: <b>Herod\'s execution of James and arrest of Peter</b> (Acts 12), <b>Paul and Silas\'s imprisonment at Philippi</b> (Acts 16), and <b>Paul\'s stoning at Lystra</b> (Acts 14) &mdash; each met with prayer, perseverance and continued faithful witness.</p>'},
{lb:'Key references and names to remember',dr:dQ2,ht:'<p>Must-know facts: <b>Acts 12</b> (Herod, James, Peter\'s escape, Rhoda); <b>Acts 16</b> (Philippi, earthquake, jailer\'s conversion); <b>Acts 14</b> (Lystra, stoning); <b>2 Corinthians 11:23-28</b> (Paul\'s sufferings); <b>Romans 8:35-39, Philippians 1:29, 1 Peter 4:12-16</b> (theology).</p>'},
{lb:'Lessons for today',dr:dQ2,ht:'<p>The persecution accounts teach that suffering for the faith, while real and painful, cannot separate believers from God\'s love, can produce spiritual growth, and should be met with prayer for boldness rather than despair or abandonment of faith.</p>'},
{lb:'Final exam tips',dr:dQ2,ht:'<p>Always give the <b>precise Bible reference</b>, explain what happened <b>and how those involved responded</b>, and conclude by connecting the passage to a clear theological or modern lesson.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which apostle did Herod have killed with the sword in Acts 12?","o":["James, son of Zebedee","Peter","Paul","Stephen"],"a":0,"w":"Herod had James, son of Zebedee, killed with the sword in Acts 12."},{"q":"How did Peter escape from prison in Acts 12?","o":["He bribed the guards","An angel appeared and led him out, his chains falling off","He dug a tunnel over several weeks","He was formally released by Herod"],"a":1,"w":"An angel appeared and led Peter out of prison, his chains falling off."},{"q":"What natural event freed Paul and Silas from prison at Philippi?","o":["A fire","A flood","An earthquake","A famine"],"a":2,"w":"An earthquake freed Paul and Silas from prison at Philippi."},{"q":"What happened to Paul at Lystra after healing a lame man?","o":["He converted the entire city instantly","He was immediately made a king","He was arrested and executed","He was mistaken for a god, then later stoned by a turned crowd"],"a":3,"w":"Paul was mistaken for a god, then later stoned by a crowd turned against him at Lystra."},{"q":"In which letter does Paul list his many sufferings for the gospel?","o":["2 Corinthians","Romans","Galatians","Ephesians"],"a":0,"w":"Paul lists his many sufferings for the gospel in 2 Corinthians 11."},{"q":"According to Romans 8:35-39, what can separate believers from God's love?","o":["Only severe persecution","Nothing in all creation","Only personal sin","Only death, but nothing else"],"a":1,"w":"According to Romans 8:35-39, nothing in all creation can separate believers from God's love."},{"q":"What did the church pray for in Acts 4, rather than for the threats to stop?","o":["Wealth and safety above all else","Immediate revenge on their persecutors","Boldness to continue speaking God's word","Permission to leave Jerusalem"],"a":2,"w":"The church prayed for boldness to continue speaking God's word, rather than for the threats to stop."},{"q":"What overall lesson unites the persecution accounts studied in this topic?","o":["Suffering for the faith should always be met with violent resistance","Suffering for the faith always leads to abandoning the mission","Suffering for the faith never actually occurred in the early Church","Suffering for the faith is real, but met with prayer, perseverance and continued faithful witness"],"a":3,"w":"The unifying lesson is that suffering for the faith is real, but met with prayer, perseverance and continued faithful witness."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
