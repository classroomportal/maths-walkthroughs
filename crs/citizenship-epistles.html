.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}

.fi{animation:fi .4s ease;}

.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}

document.addEventListener('click',function(e){
  var el=e.target;

{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What did Peter and the apostles declare when ordered to stop preaching, in Acts 5:29?","o":["\"We must obey God rather than human beings!\"","\"We will obey any order given to us\"","\"We refuse to preach the gospel any further\"","\"Human authority always outweighs God's command\""],"a":0,"w":"Peter and the apostles declared, \"We must obey God rather than human beings!\" (Acts 5:29)."},{"q":"What does this declaration establish about civil obedience, according to this lesson?","o":["Civil obedience is always absolute and unquestionable","Civil obedience has real, but not absolute, limits","Civil obedience is entirely unnecessary for believers","Civil authority always outranks God's commands"],"a":1,"w":"This declaration establishes that civil obedience has real, but not absolute, limits."},{"q":"What did the Hebrew midwives Shiphrah and Puah do, according to Exodus 1:15-21?","o":["Reported the Israelites to Pharaoh","Obeyed Pharaoh's order without question","Disobeyed Pharaoh's order to kill Israelite baby boys","Fled Egypt immediately in fear"],"a":2,"w":"The Hebrew midwives disobeyed Pharaoh's order to kill Israelite baby boys (Exodus 1:15-21)."},{"q":"How did God respond to the midwives' defiance of Pharaoh's unjust command?","o":["He required them to apologise to Pharaoh","He punished them for disobedience","He remained indifferent to their actions","He rewarded their courageous defiance"],"a":3,"w":"God rewarded the midwives' courageous defiance of Pharaoh's unjust command."},{"q":"What did Daniel continue doing, despite a royal decree forbidding it, in Daniel 6:10?","o":["Praying to God openly three times a day","Serving in the royal court silently","Fleeing the kingdom in secret","Publicly denouncing the king"],"a":0,"w":"Daniel continued praying to God openly three times a day, despite the royal decree (Daniel 6:10)."},{"q":"What risk did Daniel accept rather than compromise his faith?","o":["Losing his position at court","Being thrown into the lions' den","Public humiliation only","Exile from the kingdom"],"a":1,"w":"Daniel accepted the risk of the lions' den rather than compromise his faith."},{"q":"When, according to this lesson, is disobedience to authority justified?","o":["In every circumstance, without exception","Whenever it is personally convenient","Only when authorities command direct violation of God's clear commands","Only when the authority is a foreign power"],"a":2,"w":"This lesson says disobedience is justified only when authorities command direct violation of God's clear commands."},{"q":"What does this lesson say such disobedience should NOT be used as?","o":["A response grounded in obedience to God","A principled response to unjust commands","An example set by biblical figures","A convenient excuse for personal preference"],"a":3,"w":"This lesson says such disobedience should not be used as a convenient excuse for personal preference."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

ten under Roman imperial rule, often hostile to Christians."},{"q":"What does this circumstance show about praying for leaders, according to this lesson?","o":["It is required only when leaders are already sympathetic","It is expected even when leaders are not sympathetic to the faith","It should be avoided under hostile governments","It has no relevance under difficult political conditions"],"a":1,"w":"This shows praying for leaders is expected even when they are not sympathetic to the faith, according to this lesson."},{"q":"What does 1 Timothy 2:3 say about such prayer for leaders?","o":["It displeases God if the leader is unjust","It is merely a formality with no real meaning","It is good, and pleases God our Saviour","It is optional and of no spiritual value"],"a":2,"w":"1 Timothy 2:3 says such prayer is good, and pleases God our Saviour."},{"q":"How does this lesson describe prayer for leaders, beyond civic duty?","o":["A practice reserved only for church leaders","A purely political obligation, with no spiritual dimension","An outdated practice with no relevance today","A genuine act of Christian devotion"],"a":3,"w":"This lesson describes prayer for leaders as a genuine act of Christian devotion, beyond civic duty."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:"Q4 \u2022 CRS \u2022 Acts & Epistles",ti:"Citizens of Heaven",su:"Explain Paul\u2019s teaching that believers hold a heavenly citizenship alongside their earthly one.",steps:[
{lb:"A citizenship in heaven",dr:dQ2,ht:"<p>Philippians 3:20 declares, <em>\"our citizenship is in heaven. And we eagerly await a Saviour from there, the Lord Jesus Christ\"</em> &mdash; believers' ultimate identity and allegiance belong to God's kingdom.</p>"},
{lb:"Living as strangers and exiles",dr:dQ2,ht:"<p>1 Peter 2:11 describes believers as <b>\"foreigners and exiles\"</b> in this world &mdash; a reminder that earthly citizenship, however important, is not a believer's ultimate home or identity.</p>"},
{lb:"Seeking the welfare of the city",dr:dQ2,ht:"<p>Jeremiah 29:7 instructs exiles in Babylon to <em>\"seek the peace and prosperity of the city... pray to the Lord for it\"</em> &mdash; heavenly citizenship does not excuse neglect of earthly community responsibility.</p>"},
{lb:"Dual citizenship, rightly ordered",dr:dQ2,ht:"<p>Believers hold both earthly and heavenly citizenship, but heavenly citizenship takes <b>ultimate priority</b>, shaping how they engage responsibly with their earthly nation.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Philippians 3:20 declare about believers' citizenship?","o":["\"Our citizenship is in heaven\"","\"Our citizenship belongs only to Rome\"","\"Citizenship has no spiritual significance\"","\"Believers should reject all earthly citizenship\""],"a":0,"w":"Philippians 3:20 declares, \"Our citizenship is in heaven.\""},{"q":"What does this lesson say believers' ultimate identity and allegiance belong to?","o":["Only their earthly nation","God's kingdom","No particular allegiance at all","Only their local community"],"a":1,"w":"This lesson says believers' ultimate identity and allegiance belong to God's kingdom."},{"q":"How does 1 Peter 2:11 describe believers in this world?","o":["\"Rulers and masters\"","\"Permanent, unquestioned citizens\"","\"Foreigners and exiles\"","\"Owners of the entire earth\""],"a":2,"w":"1 Peter 2:11 describes believers as \"foreigners and exiles\" in this world."},{"q":"What does this description remind believers, according to this lesson?","o":["Earthly citizenship is more important than heavenly citizenship","Earthly citizenship is entirely irrelevant","Believers should reject all earthly community involvement","Earthly citizenship is not their ultimate home or identity"],"a":3,"w":"This description reminds believers that earthly citizenship is not their ultimate home or identity, according to this lesson."},{"q":"What does Jeremiah 29:7 instruct exiles in Babylon to seek?","o":["The peace and prosperity of the city, praying to the Lord for it","Immediate escape from Babylon at any cost","Open rebellion against Babylonian rule","Complete isolation from Babylonian society"],"a":0,"w":"Jeremiah 29:7 instructs exiles to seek the peace and prosperity of the city, praying to the Lord for it."},{"q":"What does this instruction show about heavenly citizenship, according to this lesson?","o":["It requires complete withdrawal from earthly society","It does not excuse neglect of earthly community responsibility","It has no bearing on earthly community engagement","It replaces all need for civic responsibility"],"a":1,"w":"This instruction shows heavenly citizenship does not excuse neglect of earthly community responsibility."},{"q":"What kind of citizenship do believers hold, according to this lesson?","o":["Only earthly citizenship, with no heavenly dimension","Only heavenly citizenship, with no earthly relevance","Both earthly and heavenly citizenship","Neither earthly nor heavenly citizenship"],"a":2,"w":"Believers hold both earthly and heavenly citizenship, according to this lesson."},{"q":"Which citizenship takes ultimate priority, according to this lesson?","o":["Priority depends entirely on personal preference","Earthly citizenship","Neither takes priority over the other","Heavenly citizenship"],"a":3,"w":"Heavenly citizenship takes ultimate priority, according to this lesson."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q5 \u2022 CRS \u2022 Acts & Epistles",ti:"Living as Salt and Light in Society",su:"Explain Jesus\u2019s teaching on believers\u2019 positive influence within wider society.",steps:[
{lb:"Salt of the earth",dr:dQ1,ht:"<p>Jesus taught, <em>\"You are the salt of the earth\"</em> (Matthew 5:13) &mdash; believers are called to preserve moral and spiritual health within society, preventing decay and corruption.</p>"},
{lb:"Light of the world",dr:dQ1,ht:"<p>Jesus also said, <em>\"You are the light of the world... let your light shine before others\"</em> (Matthew 5:14-16) &mdash; a visible, positive example that draws attention to God, not to oneself.</p>"},
{lb:"Salt losing its saltiness",dr:dQ1,ht:"<p>Jesus warned that salt which loses its saltiness <em>\"is no longer good for anything\"</em> (Matthew 5:13) &mdash; believers who blend indistinguishably into society lose their transformative influence.</p>"},
{lb:"Good deeds glorifying God",dr:dQ1,ht:"<p>The purpose of this visible influence is that others <em>\"may see your good deeds and glorify your Father in heaven\"</em> (Matthew 5:16) &mdash; social engagement should ultimately point to God.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What did Jesus call His followers, in Matthew 5:13?","o":["\"The salt of the earth\"","\"The rulers of the earth\"","\"The judges of the nations\"","\"The kings of this world\""],"a":0,"w":"Jesus called His followers \"the salt of the earth\" (Matthew 5:13)."},{"q":"What role does this lesson say believers play in society, as salt?","o":["Providing entertainment for society","Preserving moral and spiritual health, preventing decay and corruption","Accumulating wealth for personal gain","Avoiding all interaction with wider society"],"a":1,"w":"This lesson says believers preserve moral and spiritual health, preventing decay and corruption, as salt."},{"q":"What did Jesus call His followers, in Matthew 5:14?","o":["\"The silence of the world\"","\"The shadow of the world\"","\"The light of the world\"","\"The mystery of the world\""],"a":2,"w":"Jesus called His followers \"the light of the world\" (Matthew 5:14)."},{"q":"What instruction does Matthew 5:16 give about this light?","o":["\"Only shine your light among fellow believers\"","\"Hide your light entirely from others\"","\"Extinguish your light in public settings\"","\"Let your light shine before others\""],"a":3,"w":"Matthew 5:16 instructs, \"Let your light shine before others.\""},{"q":"What warning does Jesus give about salt losing its saltiness, in Matthew 5:13?","o":["It is no longer good for anything","It becomes even more valuable","It has no real consequence at all","It automatically regains its saltiness over time"],"a":0,"w":"Jesus warns that salt losing its saltiness is no longer good for anything (Matthew 5:13)."},{"q":"What does this warning illustrate about believers who blend indistinguishably into society, according to this lesson?","o":["They become even more effective witnesses","They lose their transformative influence","They gain greater social acceptance with no cost","They fulfil their calling more completely"],"a":1,"w":"This warning illustrates that believers who blend indistinguishably into society lose their transformative influence, according to this lesson."},{"q":"What purpose does Matthew 5:16 give for this visible influence?","o":["That believers may accumulate wealth and status","That believers may gain personal recognition and praise","That others may see good deeds and glorify the Father in heaven","That society may adopt Christian rituals without genuine faith"],"a":2,"w":"Matthew 5:16 gives the purpose that others may see good deeds and glorify the Father in heaven."},{"q":"What should social engagement ultimately point to, according to this lesson?","o":["Material success","The believer's own reputation","Political power","God"],"a":3,"w":"Social engagement should ultimately point to God, according to this lesson."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q6 \u2022 CRS \u2022 Acts & Epistles",ti:"Doing Good to All People",su:"Explain Paul\u2019s teaching on the believer\u2019s responsibility to contribute positively to wider society.",steps:[
{lb:"Living peaceably with everyone",dr:dQ2,ht:"<p>Romans 12:18 instructs, <em>\"If it is possible, as far as it depends on you, live at peace with everyone\"</em> &mdash; believers should actively pursue harmonious relationships within their communities.</p>"},
{lb:"Doing good to all people",dr:dQ2,ht:"<p>Galatians 6:10 teaches, <em>\"as we have opportunity, let us do good to all people, especially to those who belong to the family of believers\"</em> &mdash; good works extend beyond the church to wider society.</p>"},
{lb:"Overcoming evil with good",dr:dQ2,ht:"<p>Romans 12:21 concludes, <em>\"Do not be overcome by evil, but overcome evil with good\"</em> &mdash; positive, constructive engagement, not retaliation or withdrawal, is the Christian response to social wrongdoing.</p>"},
{lb:"Respected by outsiders",dr:dQ2,ht:"<p>1 Thessalonians 4:11-12 encourages believers to live quiet, industrious lives, <em>\"so that... you may win the respect of outsiders\"</em> &mdash; godly conduct itself serves as a positive witness in society.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Romans 12:18 instruct believers to do, as far as it depends on them?","o":["Live at peace with everyone","Avoid all social interaction","Seek conflict wherever possible","Depend entirely on others for peace"],"a":0,"w":"Romans 12:18 instructs believers to live at peace with everyone, as far as it depends on them."},{"q":"What does this lesson say believers should actively pursue, based on Romans 12:18?","o":["Isolation from wider society","Harmonious relationships within their communities","Conflict with those who disagree with them","Dependence entirely on government provision"],"a":1,"w":"This lesson says believers should actively pursue harmonious relationships within their communities."},{"q":"What does Galatians 6:10 instruct believers to do \"as we have opportunity\"?","o":["Avoid all contact with unbelievers","Do good only to fellow believers, never anyone else","Do good to all people","Focus only on personal spiritual growth"],"a":2,"w":"Galatians 6:10 instructs believers to do good to all people as they have opportunity."},{"q":"According to this lesson, where does this good extend, based on Galatians 6:10?","o":["Nowhere in particular","Only within the church community","Only to family members","Beyond the church to wider society"],"a":3,"w":"This good extends beyond the church to wider society, according to this lesson, based on Galatians 6:10."},{"q":"What does Romans 12:21 instruct believers to do with evil?","o":["Overcome evil with good","Overcome evil with greater evil","Ignore evil entirely","Retaliate against evil in kind"],"a":0,"w":"Romans 12:21 instructs believers to overcome evil with good."},{"q":"What does this lesson say is the Christian response to social wrongdoing, based on Romans 12:21?","o":["Complete withdrawal from society","Positive, constructive engagement, not retaliation or withdrawal","Retaliation in exact proportion to the wrong suffered","Passive indifference to wrongdoing"],"a":1,"w":"This lesson says positive, constructive engagement, not retaliation or withdrawal, is the Christian response."},{"q":"What does 1 Thessalonians 4:11-12 encourage believers to live, in relation to outsiders?","o":["Lives focused only on criticising outsiders","Lives entirely separated from outsiders","Quiet, industrious lives that win the respect of outsiders","Lives that depend entirely on outsiders for support"],"a":2,"w":"1 Thessalonians 4:11-12 encourages quiet, industrious lives that win the respect of outsiders."},{"q":"What does this lesson say godly conduct itself serves as?","o":["A purely internal church concern","An irrelevant private matter","A source of unnecessary conflict","A positive witness in society"],"a":3,"w":"This lesson says godly conduct itself serves as a positive witness in society."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q7 \u2022 CRS \u2022 Acts & Epistles",ti:"Justice and Righteousness in Society",su:"Explain the biblical call for believers to promote justice and righteousness within their communities.",steps:[
{lb:"Seeking justice for the oppressed",dr:dQ1,ht:"<p>Isaiah 1:17 instructs, <em>\"seek justice, defend the oppressed... plead the case of the widow\"</em> &mdash; concern for justice extends specifically to society's most vulnerable members.</p>"},
{lb:"Micah's summary of true religion",dr:dQ1,ht:"<p>Micah 6:8 summarises what God requires: <em>\"To act justly and to love mercy and to walk humbly with your God\"</em> &mdash; justice is inseparable from genuine devotion to God.</p>"},
{lb:"Rescuing the weak and needy",dr:dQ1,ht:"<p>Psalm 82:3-4 calls leaders and believers alike to <em>\"defend the weak and the fatherless... rescue the weak and the needy\"</em> &mdash; active advocacy, not mere sympathy, is expected.</p>"},
{lb:"A society reflecting God's character",dr:dQ1,ht:"<p>These teachings show that promoting justice within society reflects <b>God's own character</b> &mdash; His concern for fairness, protection of the vulnerable, and righteous dealing among people.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Isaiah 1:17 instruct believers to seek?","o":["Justice, defending the oppressed and pleading the widow's case","Only personal wealth and comfort","Political power above all else","Isolation from social concerns"],"a":0,"w":"Isaiah 1:17 instructs seeking justice, defending the oppressed and pleading the widow's case."},{"q":"To whom does this concern for justice specifically extend, according to this lesson?","o":["Only the wealthy and powerful","Society's most vulnerable members","Only religious leaders","Only members of one's own family"],"a":1,"w":"This concern for justice extends specifically to society's most vulnerable members, according to this lesson."},{"q":"What three things does Micah 6:8 say God requires?","o":["To gain wealth and political power","To offer many sacrifices and rituals only","To act justly, love mercy, and walk humbly with God","To avoid all social engagement entirely"],"a":2,"w":"Micah 6:8 says God requires acting justly, loving mercy, and walking humbly with Him."},{"q":"What does this lesson say Micah 6:8 shows about justice and devotion to God?","o":["Devotion to God requires no concern for justice","Justice has no real connection to religious devotion","Justice matters only in political contexts, not faith","Justice is inseparable from genuine devotion to God"],"a":3,"w":"This lesson says Micah 6:8 shows justice is inseparable from genuine devotion to God."},{"q":"What does Psalm 82:3-4 call leaders and believers to do?","o":["Defend the weak and fatherless, rescue the weak and needy","Ignore the needs of the vulnerable","Focus exclusively on personal spiritual growth","Depend entirely on government provision for the poor"],"a":0,"w":"Psalm 82:3-4 calls leaders and believers to defend the weak and fatherless, rescue the weak and needy."},{"q":"What kind of response does this lesson say is expected, based on Psalm 82:3-4?","o":["Passive sympathy, with no practical action","Active advocacy, not mere sympathy","Complete indifference to social need","Advocacy only when personally convenient"],"a":1,"w":"This lesson says active advocacy, not mere sympathy, is expected, based on Psalm 82:3-4."},{"q":"What does this lesson say promoting justice within society reflects?","o":["Nothing of spiritual significance","Only human political ideals","God's own character","A purely secular concern unrelated to faith"],"a":2,"w":"This lesson says promoting justice within society reflects God's own character."},{"q":"What aspects of God's character does this lesson say are reflected in promoting justice?","o":["His approval of social inequality","His indifference to human suffering","His exclusive concern for religious ritual","His concern for fairness, protection of the vulnerable, and righteous dealing"],"a":3,"w":"This lesson describes God's concern for fairness, protection of the vulnerable, and righteous dealing as reflected in promoting justice."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q8 \u2022 CRS \u2022 Acts & Epistles",ti:"The Believer as a Model Citizen",su:"Explain how believers are called to model exemplary conduct as citizens within their nations.",steps:[
{lb:"Submitting for the Lord's sake",dr:dQ2,ht:"<p>1 Peter 2:13-14 instructs believers to <em>\"submit yourselves for the Lord's sake to every human authority\"</em> &mdash; civic obedience is itself an act of Christian obedience and witness.</p>"},
{lb:"Living good lives among unbelievers",dr:dQ2,ht:"<p>1 Peter 2:12 instructs believers to <em>\"live such good lives among the pagans that... they may see your good deeds and glorify God\"</em> &mdash; exemplary conduct counters false accusations and draws people to faith.</p>"},
{lb:"Honouring everyone, loving fellow believers",dr:dQ2,ht:"<p>1 Peter 2:17 summarises: <em>\"Show proper respect to everyone... honour the emperor\"</em> &mdash; a balanced call to respect both fellow believers and civic authority, even under difficult political conditions.</p>"},
{lb:"A witness through excellent conduct",dr:dQ2,ht:"<p>This teaching shows that believers' <b>everyday conduct</b> as citizens &mdash; law-abiding, respectful, diligent &mdash; is itself a powerful form of Christian witness within society.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does 1 Peter 2:13-14 instruct believers to do, for the Lord's sake?","o":["Submit to every human authority","Rebel against every human authority","Ignore all civic responsibilities","Submit only to religious authorities"],"a":0,"w":"1 Peter 2:13-14 instructs submitting to every human authority, for the Lord's sake."},{"q":"What does this lesson say civic obedience is, according to 1 Peter 2:13-14?","o":["A purely secular obligation with no spiritual meaning","An act of Christian obedience and witness","Irrelevant to Christian faith","Required only of church leaders"],"a":1,"w":"This lesson says civic obedience is itself an act of Christian obedience and witness."},{"q":"What does 1 Peter 2:12 instruct believers to live, among unbelievers?","o":["Lives focused only on avoiding all social interaction","Lives entirely separated from unbelievers","Good lives, so that people may see good deeds and glorify God","Lives with no visible difference from unbelievers"],"a":2,"w":"1 Peter 2:12 instructs living good lives among unbelievers, so that people may see good deeds and glorify God."},{"q":"What does this lesson say exemplary conduct counters, based on 1 Peter 2:12?","o":["The need for genuine faith","Nothing of any real significance","Only political criticism, with no spiritual effect","False accusations, and draws people to faith"],"a":3,"w":"This lesson says exemplary conduct counters false accusations and draws people to faith, based on 1 Peter 2:12."},{"q":"What summary instruction does 1 Peter 2:17 give?","o":["\"Show proper respect to everyone... honour the emperor\"","\"Disrespect all civic authorities equally\"","\"Honour only fellow believers, ignoring all others\"","\"Avoid engaging with civic authority entirely\""],"a":0,"w":"1 Peter 2:17 summarises, \"Show proper respect to everyone... honour the emperor.\""},{"q":"What balanced call does this lesson describe, based on 1 Peter 2:17?","o":["Respecting only fellow believers, never civic authority","Respecting both fellow believers and civic authority, even under difficult conditions","Respecting only civic authority, never fellow believers","No real balance is described at all"],"a":1,"w":"This lesson describes a balanced call to respect both fellow believers and civic authority, even under difficult conditions."},{"q":"What does this lesson say believers' everyday conduct as citizens represents?","o":["A purely secular concern, unrelated to Christian faith","An irrelevant private matter with no wider effect","A powerful form of Christian witness within society","A concern only for church leaders, not ordinary believers"],"a":2,"w":"This lesson describes believers' everyday conduct as citizens as a powerful form of Christian witness within society."},{"q":"What qualities does this lesson highlight in exemplary citizenship?","o":["Conduct entirely indifferent to civic responsibility","Rebellious, disrespectful conduct","Conduct focused solely on personal advantage","Law-abiding, respectful, diligent conduct"],"a":3,"w":"This lesson highlights law-abiding, respectful, diligent conduct in exemplary citizenship."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q9 \u2022 CRS \u2022 Acts & Epistles",ti:"WAEC Exam Preparation \u2014 Citizenship",su:"Practise WAEC-style questions on citizenship and civic responsibility in the Epistles.",steps:[
{lb:"WAEC essay structure",dr:dQ1,ht:"<p>For WAEC essays on citizenship: (1) Identify the <b>specific passage or theme</b>. (2) Give the <b>precise reference</b>. (3) Explain the teaching <b>clearly</b>. (4) Draw out a <b>practical application</b>.</p>"},
{lb:"Common WAEC question patterns",dr:dQ1,ht:"<p>Common patterns include: \"Explain Paul's teaching on submission to governing authorities.\" / \"When is disobedience to civil authority justified?\" / \"Discuss the believer's dual citizenship, according to Philippians 3:20.\"</p>"},
{lb:"Key references to remember",dr:dQ1,ht:"<p>Key references: <b>Romans 13:1-7</b> (submission to authority); <b>Acts 5:29</b> (obeying God rather than man); <b>1 Timothy 2:1-3</b> (praying for leaders); <b>Philippians 3:20</b> (heavenly citizenship); <b>Matthew 5:13-16</b> (salt and light); <b>1 Peter 2:12-17</b> (model citizen).</p>"},
{lb:"Connecting to practical citizenship",dr:dQ1,ht:"<p>WAEC essays should always connect teaching to <b>practical citizenship today</b> &mdash; law-abiding conduct, civic engagement, and prayer for leaders &mdash; rather than treating citizenship only as an abstract theme.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on citizenship?","o":["Identify the specific passage or theme asked about","Give a personal opinion with no facts","List unrelated facts","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on citizenship should begin by identifying the specific passage or theme asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the geography of Lake Chad.\"","\"When is disobedience to civil authority justified?\"","\"Define a redox reaction.\"","\"List Nigeria's national parks.\""],"a":1,"w":"\"When is disobedience to civil authority justified?\" is a typical WAEC-style question."},{"q":"Which passage should be cited when discussing submission to governing authorities?","o":["Philippians 3:20","Acts 5:29","Romans 13:1-7","1 Peter 2:12"],"a":2,"w":"Romans 13:1-7 should be cited when discussing submission to governing authorities."},{"q":"Which verse should be cited when discussing the limits of obedience to civil authority?","o":["Matthew 5:13","Romans 13:7","1 Timothy 2:2","Acts 5:29"],"a":3,"w":"Acts 5:29 should be cited when discussing the limits of obedience to civil authority."},{"q":"Which passage should be cited when discussing prayer for governing leaders?","o":["1 Timothy 2:1-3","Philippians 3:20","Matthew 5:14-16","Romans 12:18"],"a":0,"w":"1 Timothy 2:1-3 should be cited when discussing prayer for governing leaders."},{"q":"Which verse should be cited when discussing the believer's heavenly citizenship?","o":["Romans 13:1","Philippians 3:20","1 Peter 2:17","Isaiah 1:17"],"a":1,"w":"Philippians 3:20 should be cited when discussing the believer's heavenly citizenship."},{"q":"Which passage should be cited when discussing believers as salt and light in society?","o":["Micah 6:8","Acts 5:29","Matthew 5:13-16","1 Peter 2:12"],"a":2,"w":"Matthew 5:13-16 should be cited when discussing believers as salt and light in society."},{"q":"Why should WAEC essays connect teaching to practical citizenship today?","o":["WAEC forbids discussing daily life applications","Practical application is irrelevant to WAEC marking","Only abstract theology should be discussed","It shows the theology remains relevant to real Christian life"],"a":3,"w":"Connecting to practical citizenship shows the theology remains relevant to real Christian life, which WAEC rewards."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q10 \u2022 CRS \u2022 Acts & Epistles",ti:"Mixed Questions \u2014 Citizenship",su:"Integrated revision across biblical teaching on citizenship, civic duty and heavenly identity.",steps:[
{lb:"Summary of key themes",dr:dQ2,ht:"<p>Believers are called to submit respectfully to civil authorities as instituted by God, pray for leaders, live as salt and light within society, while ultimately holding heavenly citizenship as their primary identity.</p>"},
{lb:"Key references to remember",dr:dQ2,ht:"<p>Must-know facts: <b>Romans 13:1-7</b> (submission to authority); <b>Acts 5:29</b> (obey God rather than man); <b>1 Timothy 2:1-3</b> (praying for leaders); <b>Philippians 3:20</b> (heavenly citizenship); <b>Matthew 5:13-16</b> (salt and light).</p>"},
{lb:"Lessons for today",dr:dQ2,ht:"<p>These teachings call believers to be responsible, law-abiding citizens, pray for their leaders, promote justice, and remember their ultimate citizenship belongs to God's kingdom.</p>"},
{lb:"Final exam tips",dr:dQ2,ht:"<p>Always give the <b>precise reference</b>, explain the teaching <b>clearly and accurately</b>, and conclude by connecting the passage to a practical, everyday example of citizenship.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Romans 13:1 say about the origin of governing authorities?","o":["They have been established by God","They arise entirely by human accident","They have no real spiritual significance","They should never be obeyed by believers"],"a":0,"w":"Romans 13:1 says governing authorities have been established by God."},{"q":"What did Peter and the apostles declare when ordered to stop preaching, in Acts 5:29?","o":["\"We will obey any order given to us\"","\"We must obey God rather than human beings!\"","\"We refuse to preach the gospel any further\"","\"Human authority always outweighs God's command\""],"a":1,"w":"Peter and the apostles declared, \"We must obey God rather than human beings!\" (Acts 5:29)."},{"q":"What does 1 Timothy 2:1-2 instruct believers to make for kings and those in authority?","o":["Silent indifference","Only public criticism and protest","Petitions, prayers, intercession and thanksgiving","Only occasional, reluctant acknowledgement"],"a":2,"w":"1 Timothy 2:1-2 instructs petitions, prayers, intercession and thanksgiving for kings and those in authority."},{"q":"What does Philippians 3:20 declare about believers' citizenship?","o":["\"Believers should reject all earthly citizenship\"","\"Our citizenship belongs only to Rome\"","\"Citizenship has no spiritual significance\"","\"Our citizenship is in heaven\""],"a":3,"w":"Philippians 3:20 declares, \"Our citizenship is in heaven.\""},{"q":"What did Jesus call His followers, in Matthew 5:13?","o":["\"The salt of the earth\"","\"The rulers of the earth\"","\"The judges of the nations\"","\"The kings of this world\""],"a":0,"w":"Jesus called His followers \"the salt of the earth\" (Matthew 5:13)."},{"q":"What three things does Micah 6:8 say God requires?","o":["To offer many sacrifices and rituals only","To act justly, love mercy, and walk humbly with God","To gain wealth and political power","To avoid all social engagement entirely"],"a":1,"w":"Micah 6:8 says God requires acting justly, loving mercy, and walking humbly with Him."},{"q":"What does 1 Peter 2:13-14 instruct believers to do, for the Lord's sake?","o":["Ignore all civic responsibilities","Rebel against every human authority","Submit to every human authority","Submit only to religious authorities"],"a":2,"w":"1 Peter 2:13-14 instructs submitting to every human authority, for the Lord's sake."},{"q":"What overall lesson unites the themes studied in this topic?","o":["Citizenship has no real connection to Christian faith","Believers should reject all earthly civic engagement entirely","Only political leaders bear responsibility for justice","Believers should be responsible earthly citizens while holding heavenly citizenship as ultimate"],"a":3,"w":"The unifying lesson is that believers should be responsible earthly citizens while holding heavenly citizenship as ultimate."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
