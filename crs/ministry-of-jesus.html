<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Miracles of Jesus — Categories',ACC,12,'middle',true));
[['Category','Example','Reference'],['Healing','Ten lepers cleansed','Luke 17:11-19'],['Exorcism','Gerasene demoniac','Mark 5:1-20'],['Nature miracle','Feeding 5,000','Matthew 14:13-21'],['Raising the dead','Lazarus raised','John 11:1-44'],['Healing','Blind Bartimaeus','Mark 10:46-52'],['Nature miracle','Calming the storm','Mark 4:35-41'],['Healing','Paralysed man forgiven','Mark 2:1-12']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(100,34+i*28,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(240,34+i*28,r[1],'#444',7,'middle',false));o.push(T(390,34+i*28,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Calling of the Disciples',ACC,12,'middle',true));
[['Disciple(s)','Occupation','Reference'],['Simon Peter & Andrew','Fishermen','Matthew 4:18-20'],['James & John (Zebedee\'s sons)','Fishermen','Matthew 4:21-22'],['Matthew (Levi)','Tax collector','Matthew 9:9'],['Philip & Bartholomew','Unknown','John 1:43-51'],['Thomas, James son of Alphaeus','Unknown','Matthew 10:3'],['Thaddaeus, Simon the Zealot','Unknown','Matthew 10:3'],['Judas Iscariot','Later betrayed Jesus','Matthew 10:4']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(150,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(275,34+i*28,r[1],'#444',7,'middle',false));o.push(T(400,34+i*28,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Ministry of Jesus — Summary',ACC,13,'middle',true));
[['Calling disciples','\"Follow me\" — immediate response required (Mt.4:19)'],['Healing miracles','Compassion for suffering; faith required; Kingdom breaking in'],['Nature miracles','Jesus\' authority over creation — he is Lord'],['Exorcisms','Kingdom of God confronting the kingdom of darkness'],['Teaching','Parables; Sermon on the Mount; \"you have heard... but I say\"'],['Transfiguration','Moses/Elijah; \"This is my Son\" (Mt.17:5)'],['WAEC tip','Know specific miracles with refs; link miracles to Kingdom of God']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(130,52+i*30,r[0],ACC,9,'middle',true));o.push(T(330,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Gospels',ti:'The Calling of the Disciples',su:'Examine how Jesus called his disciples and what this meant.',steps:[
{lb:'The call of Peter, Andrew, James and John',dr:dQ2,ht:'<p>Walking along the Sea of Galilee, Jesus saw Simon Peter and his brother Andrew casting their nets. He said: <em>"Come, follow me, and I will send you out to fish for people"</em> (Mt.4:19). At once they left their nets and followed him. Going on, he saw James and John in a boat with their father Zebedee, mending their nets. He called them and immediately they left the boat and their father and followed him. The immediacy of the response is remarkable — no bargaining, no conditions, no delay.</p>'},
{lb:'Matthew the tax collector (Matthew 9:9)',dr:dQ2,ht:'<p>Jesus saw Matthew (also called Levi) sitting at the tax collector\'s booth. Tax collectors were despised as collaborators with Rome and extortioners. Jesus said simply: <em>"Follow me."</em> Matthew got up and followed him. Jesus then ate at Matthew\'s house with many tax collectors and sinners. When Pharisees complained, Jesus said: <em>"It is not the healthy who need a doctor, but the sick. I have not come to call the righteous, but sinners"</em> (Mt.9:12-13). The call of Matthew shows that no one is beyond Jesus\' call — even the despised and outcast.</p>'},
{lb:'The twelve apostles (Matthew 10:1-4)',dr:dQ2,ht:'<p>From his larger group of followers, Jesus chose twelve — called <b>apostles</b> (Greek: sent ones): Simon Peter and Andrew; James and John (sons of Zebedee); Philip and Bartholomew; Matthew and Thomas; James son of Alphaeus, Thaddaeus, Simon the Zealot; Judas Iscariot. The number twelve echoes the twelve tribes of Israel — Jesus is reconstituting a new Israel around himself. He gave them authority to drive out evil spirits and heal diseases. He sent them out two by two (Mk.6:7) for mutual support and the requirement of two witnesses (Deut.17:6).</p>'},
{lb:'What discipleship means',dr:dQ2,ht:'<p>Jesus\' call "Follow me" had radical implications: (1) <b>Leaving behind</b> — nets, tax booth, family, security. (2) <b>Learning from the Rabbi</b> — disciples followed teachers literally, learning by imitation and instruction. (3) <b>Sharing the mission</b> — Jesus sent them to do what he did (preach, heal, cast out demons). (4) <b>Suffering with him</b> — "take up your cross and follow me" (Mt.16:24). (5) <b>Becoming like him</b> — the goal of discipleship is conformity to Christ\'s character. WAEC: know the specific disciples called, their backgrounds, and the meaning of leaving everything.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What were Peter and Andrew doing when Jesus called them?',o:['Fishing in a boat near the shore','Casting their nets into the Sea of Galilee','Mending their nets with their father Zebedee','Paying their taxes at the toll booth'],a:2,w:'Matthew 4:18 — "Simon called Peter and his brother Andrew casting a net into the lake, for they were fishermen." Jesus called them while they were working — ordinary people in ordinary circumstances.'},{q:'Why was Matthew\'s calling particularly surprising to the Jewish community?',o:['He was too young to be a disciple','Tax collectors were despised as Roman collaborators and extortioners — outcasts from Jewish society','He was a Gentile and not a Jew','He was already a disciple of the Pharisees'],a:2,w:'Tax collectors (publicans) collaborated with Rome to collect taxes, often taking extra for themselves. They were considered traitors and were excluded from synagogue worship. Jesus\' call of Matthew showed no one was beyond his grace.'},{q:'Jesus chose twelve apostles. The number twelve recalls:',o:['The twelve months of the year','The twelve sons of Jacob — the twelve tribes of Israel','The twelve books of the Torah','The twelve gates of Jerusalem'],a:2,w:'The twelve apostles deliberately echo the twelve tribes of Israel (the sons of Jacob/Israel). Jesus was reconstituting a new Israel around himself — the new covenant community with him at the centre.'},{q:'The command "Follow me" in the context of first-century Jewish discipleship meant:',o:['Join my political movement and fight the Romans','Attend my weekly teachings on the Sabbath','Leave your current life to learn from and imitate the rabbi, sharing his mission and way of life','Accept Jesus\' teachings intellectually while continuing your own career'],a:3,w:'In first-century Judaism, a disciple (talmid) literally followed the rabbi everywhere, learning by imitation and instruction. Jesus\' disciples left their livelihoods to travel with him — radical, total commitment. Unlike other rabbis, Jesus sought his disciples rather than waiting for them to come to him.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Gospels',ti:'Healing Miracles',su:'Examine Jesus\' healing miracles and their significance.',steps:[
{lb:'The paralysed man (Mark 2:1-12)',dr:dQ1,ht:'<p>Four men carried a paralysed friend to Jesus. Unable to enter through the crowd, they lowered him through the roof. Jesus saw their faith and said: <em>"Son, your sins are forgiven"</em> (Mk.2:5). The scribes accused him of blasphemy — only God can forgive sins. Jesus replied: <em>"Which is easier: to say...\'Your sins are forgiven,\' or to say...\'Get up and walk\'?"</em> (Mk.2:9). Then he healed the man — to prove <em>"the Son of Man has authority on earth to forgive sins"</em> (Mk.2:10). The healing authenticated the forgiveness — both point to Jesus\' divine authority.</p>'},
{lb:'The ten lepers (Luke 17:11-19)',dr:dQ1,ht:'<p>Ten lepers called to Jesus from a distance (required by law — Lev.13:45-46). Jesus told them to show themselves to the priests. As they went, they were cleansed. One — a Samaritan — returned to give thanks, throwing himself at Jesus\' feet. Jesus said: <em>"Were not all ten cleansed? Where are the other nine? Has no one returned to give praise to God except this foreigner?"</em> (Lk.17:17-18). He told the Samaritan: <em>"Rise and go; your faith has made you well"</em> (Lk.17:19). The miracle teaches gratitude, and that faith transcends ethnic/religious boundaries.</p>'},
{lb:'Blind Bartimaeus (Mark 10:46-52)',dr:dQ1,ht:'<p>Blind Bartimaeus sat begging outside Jericho. Hearing Jesus was passing, he cried: <em>"Jesus, Son of David, have mercy on me!"</em> (Mk.10:47). The crowd rebuked him but he shouted louder. Jesus called him. Bartimaeus threw off his cloak, jumped up and came to Jesus. Jesus asked: <em>"What do you want me to do for you?"</em> He replied: <em>"Rabbi, I want to see."</em> Jesus said: <em>"Go, your faith has healed you."</em> Immediately he could see and followed Jesus on the road (Mk.10:52). He is a model of persistent faith that overcomes obstacles to reach Jesus.</p>'},
{lb:'Significance of the healing miracles',dr:dQ1,ht:'<p>Jesus\' healings are signs of the Kingdom of God breaking into the world. They show: (1) God\'s compassion for the suffering — Jesus was "moved with compassion." (2) Faith is essential — "your faith has healed/saved you." (3) Jesus has authority over sickness — as Creator, disease has no ultimate power over him. (4) Healing can also involve forgiveness — the whole person is saved. (5) They fulfil Isaiah 35:5-6 (blind see, deaf hear, lame walk). (6) They point beyond physical healing to spiritual salvation — "sozo" (healed/saved) is the same Greek word. WAEC: give specific examples with references and link each to the Kingdom of God.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'In the healing of the paralysed man (Mk.2), Jesus first said "Your sins are forgiven" to:',o:['Shame the scribes who were criticising him','Show that spiritual healing is more important than physical healing, and to prove his divine authority to forgive','Indicate the man\'s paralysis was caused by his personal sins','Avoid the crowd\'s attention before the miracle'],a:2,w:'Jesus used the visible healing (which all could see) to authenticate the invisible forgiveness (which only God can give). "Son of Man has authority on earth to forgive sins" (Mk.2:10) — healing proved forgiveness, and both demonstrated divine authority.'},{q:'In the story of the ten lepers, who was the only one who returned to give thanks?',o:['A Pharisee from Jerusalem','A Jewish priest from Jericho','A Samaritan — a foreigner despised by Jews','A Roman centurion from Caesarea'],a:3,w:'Luke 17:16 — "and he was a Samaritan." The irony is powerful: the nine Jews (who had greater religious privilege) did not return, but the Samaritan outcast showed the greatest gratitude. Jesus highlighted this to challenge Jewish assumptions about who truly honours God.'},{q:'Bartimaeus addressed Jesus as "Son of David." This title is significant because:',o:['David was the greatest king and this was a common compliment','It acknowledged Jesus as the Messiah — the promised descendant of David who would restore Israel\'s kingdom','It showed Bartimaeus knew Jesus was a relative of King David','It was a polite way to address any Jewish teacher'],a:2,w:'"Son of David" (Mk.10:47) is a messianic title — the promised king from David\'s line (2Sam.7:12-16). Bartimaeus, though blind, had spiritual insight that Jesus was the Messiah. His persistent crying of this title despite the crowd\'s rebuke shows bold, persistent faith.'},{q:'The Greek word "sozo" (used in "your faith has saved/healed you") means both:',o:['Praise and worship','Strength and courage','Healed and saved — physical restoration and spiritual salvation','Forgiven and blessed'],a:3,w:'"Sozo" carries both meanings simultaneously — physical healing and spiritual salvation. When Jesus says "your faith has saved you," he means more than the immediate physical cure. The healing is a sign of the full salvation he brings. This is why the miracles are called "signs" in John\'s Gospel.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Gospels',ti:'Nature Miracles',su:'Examine the nature miracles of Jesus and their significance.',steps:[
{lb:'Feeding of the 5,000 (Matthew 14:13-21)',dr:dQ2,ht:'<p>A large crowd followed Jesus to a remote place. Evening came — the disciples wanted to send the crowd away to buy food. Jesus said: <em>"You give them something to eat"</em> (Mt.14:16). With five loaves and two fish, Jesus looked up to heaven, gave thanks, broke the loaves and gave them to the disciples. All five thousand men (plus women and children) ate and were satisfied, and twelve baskets of pieces were left over. This miracle echoes Moses feeding Israel with manna (Ex.16) — Jesus is the new Moses. The Eucharistic language (took, blessed, broke, gave) points forward to the Last Supper.</p>'},
{lb:'Calming the storm (Mark 4:35-41)',dr:dQ2,ht:'<p>Jesus was asleep in the stern of a boat when a fierce storm arose. The disciples woke him: <em>"Teacher, don\'t you care if we drown?"</em> (Mk.4:38). Jesus rebuked the wind and said to the waves: <em>"Quiet! Be still!"</em> The wind died and it was completely calm. He asked: <em>"Why are you so afraid? Do you still have no faith?"</em> The disciples were terrified and asked: <em>"Who is this? Even the wind and the waves obey him!"</em> (Mk.4:41). The OT background: God alone controls the sea (Ps.107:23-30; Job 38:8-11). Jesus does what only God does.</p>'},
{lb:'Walking on water (Matthew 14:22-33)',dr:dQ2,ht:'<p>The disciples were in a boat on the lake when Jesus came walking on the water towards them. They thought he was a ghost and were terrified. Jesus said: <em>"Take courage! It is I. Do not be afraid"</em> (Mt.14:27). Peter asked to come to Jesus on the water — he stepped out and walked briefly, then became afraid and began to sink: <em>"Lord, save me!"</em> Jesus caught him: <em>"You of little faith, why did you doubt?"</em> (Mt.14:31). When they got into the boat, the wind died. The disciples worshipped: <em>"Truly you are the Son of God"</em> (Mt.14:33). Peter\'s faith and failure is a model for all disciples.</p>'},
{lb:'Significance of the nature miracles',dr:dQ2,ht:'<p>The nature miracles demonstrate: (1) Jesus has authority over creation — he is Lord of nature, not subject to it. (2) They reveal his divine identity — only God controls wind, sea, provision. (3) They call for faith — the disciples\' question "who is this?" is the one every person must answer. (4) They show God\'s provision — the feeding recalls God\'s manna in the wilderness. (5) They have symbolic dimensions — storm on the lake = disciples facing persecution; Jesus\' presence = peace. (6) The Eucharistic language in the feeding anticipates the Last Supper. WAEC: name specific miracles, their OT background, and their theological significance.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'In the feeding of the 5,000, how many loaves and fish did Jesus begin with?',o:['Two loaves and five fish','Five loaves and two fish','Seven loaves and a few fish','Ten loaves and one fish'],a:2,w:'Matthew 14:17 — "We have here only five loaves of bread and two fish." Jesus worked with what the disciples had — a tiny amount — and multiplied it to feed thousands. The miracle demonstrates that God\'s provision always exceeds human limitation.'},{q:'The disciples\' question "Who is this? Even the wind and the waves obey him!" (Mk.4:41) points to:',o:['Jesus being a powerful weather forecaster','Jesus\' identity as divine — in the OT, only God controls the sea (Psalm 107, Job 38)','Jesus being a very experienced sailor','The disciples\' surprise that he was awake'],a:2,w:'The OT background is crucial: Psalm 107:23-30 and Job 38:8-11 show God alone controls the sea. When Jesus commands the storm with divine authority, the disciples\' question is really: "Is this God?" — the correct christological conclusion.'},{q:'When Peter stepped out of the boat to walk to Jesus, he began to sink when:',o:['He realised he did not know how to swim','The other disciples laughed at him','He became frightened and took his eyes off Jesus','Jesus told him to return to the boat'],a:3,w:'Matthew 14:30 — "when he saw the wind, he was afraid and, beginning to sink, cried out, \'Lord, save me!\'" Peter\'s walk was sustained by faith focused on Jesus; fear transferred his focus to the storm. The account is a model: faith walks on water; fear sinks.'},{q:'The Eucharistic language in the feeding of the 5,000 (took, gave thanks, broke, gave) points forward to:',o:['The miracle of water into wine at Cana','The feeding of the 4,000 in Matthew 15','The Last Supper (institution of the Eucharist/Communion)','The breakfast of fish after the resurrection'],a:3,w:'Matthew\'s feeding uses identical language to the Last Supper (Mt.26:26): "took bread, gave thanks, broke it, gave it to his disciples." The feeding anticipates the Eucharist — Jesus as the bread of life (John 6) who gives himself for the life of the world.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Gospels',ti:'The Transfiguration',su:'Examine the Transfiguration of Jesus (Matthew 17:1-13).',steps:[
{lb:'The setting (Matthew 17:1-2)',dr:dQ2,ht:'<p>Six days after Peter\'s confession at Caesarea Philippi, Jesus took Peter, James and John up a high mountain. There <em>"he was transfigured before them. His face shone like the sun, and his clothes became as white as the light"</em> (Mt.17:2). The Greek word "metamorphoō" (transfigured) indicates a change in outward form — the divine glory within Jesus became visible externally. The mountain setting recalls Moses and Elijah meeting God on Mount Sinai/Horeb. The event occurred at the midpoint of Jesus\' ministry — a turning point before the journey to Jerusalem.</p>'},
{lb:'Moses and Elijah appear (Matthew 17:3-4)',dr:dQ2,ht:'<p>Moses and Elijah appeared and were talking with Jesus. Luke tells us they spoke about Jesus\' departure ("exodus") which he was about to bring to fulfilment in Jerusalem (Lk.9:31). Moses represents the <b>Law</b> and Elijah represents the <b>Prophets</b> — together, "the Law and the Prophets" is the OT as a whole. Their presence affirms that Jesus is the fulfilment of all Scripture. Peter offered to build three shelters — a misguided attempt to prolong the experience and perhaps to elevate Moses and Elijah to Jesus\' level.</p>'},
{lb:'The divine voice (Matthew 17:5-8)',dr:dQ2,ht:'<p>A bright cloud enveloped them (echoing the Shekinah cloud of God\'s presence — Ex.40:34) and a voice said: <em>"This is my Son, whom I love; with him I am well pleased. Listen to him!"</em> (Mt.17:5). The disciples fell face down, terrified. Jesus touched them: <em>"Get up. Don\'t be afraid."</em> When they looked, they saw only Jesus — Moses and Elijah had gone. The addition "Listen to him!" at the Transfiguration (absent from the baptism account) is crucial: it commands the disciples to focus on Jesus alone as the authoritative voice, superseding even Moses and Elijah.</p>'},
{lb:'Significance of the Transfiguration',dr:dQ2,ht:'<p>Significance: (1) <b>Confirmation of identity</b> — the Father\'s voice repeats the baptism declaration. (2) <b>Fulfilment of OT</b> — Law (Moses) and Prophets (Elijah) point to and yield to Jesus. (3) <b>Preparation for the cross</b> — the disciples need to see Jesus\' glory before witnessing his humiliation. (4) <b>Preview of resurrection glory</b> — Peter refers to it as the "majestic glory" (2Pet.1:17). (5) <b>Supersession</b> — "listen to him" means Jesus\' authority exceeds Moses and the prophets. (6) <b>Fear and comfort</b> — the pattern of divine encounter (Mt.17:6-7) parallels OT theophanies. WAEC: know all details with reference Matthew 17:1-13.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The three disciples who witnessed the Transfiguration were:',o:['Peter, Andrew and John','Peter, James and John','Matthew, Mark and Luke','Peter, James and Thomas'],a:2,w:'Matthew 17:1 — "Jesus took with him Peter, James and John the brother of James, and led them up a high mountain." These three were also present at Gethsemane (Mt.26:37) — witnesses to both the highest glory and the deepest agony.'},{q:'Moses and Elijah appearing at the Transfiguration represents:',o:['The two most important people in Jewish history who needed to meet Jesus','The Law (Moses) and the Prophets (Elijah) — the entire OT pointing to and being fulfilled in Jesus','Two angels disguised as biblical figures to test the disciples','The past and the future meeting in the present moment'],a:2,w:'"The Law and the Prophets" was the Jewish way of referring to the entire OT. Moses = the Law giver; Elijah = the greatest prophet. Their appearance with Jesus affirms he is the fulfilment of all Scripture — and the voice commands the disciples to "listen to him" (Jesus) above both.'},{q:'The voice at the Transfiguration added what command not present at the baptism?',o:['"Do not be afraid" — a new reassurance','\"Go and make disciples\" — the Great Commission','\"Listen to him!\" — commanding submission to Jesus\' authority over Moses and Elijah','\"He is risen\" — pointing forward to the resurrection'],a:3,w:'Matthew 17:5 adds "Listen to him!" to the baptism declaration. This is the crucial instruction: as Moses and Elijah disappear and only Jesus remains, the disciples are commanded to make Jesus — not the Law or the Prophets — their ultimate authority.'},{q:'Peter\'s offer to build three shelters (tabernacles) was misguided because:',o:['There were not enough materials on the mountain','It would have attracted too many other disciples','It attempted to prolong and equalise — making Moses and Elijah permanent and equal to Jesus','Shelters were forbidden on holy mountains in Jewish law'],a:3,w:'Peter\'s offer (Mt.17:4) tried to make the experience permanent and to honour Moses, Elijah and Jesus equally (three shelters — one each). But the divine response swept it aside: the voice focused only on Jesus, and Moses and Elijah disappeared. Jesus alone is the centre.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Gospels',ti:'Conflict with Religious Leaders',su:'Examine Jesus\' conflict with the Pharisees, scribes and Sadducees.',steps:[
{lb:'The Pharisees and the Sabbath (Mark 2:23-3:6)',dr:dQ1,ht:'<p>As Jesus\' disciples walked through grain fields on the Sabbath, they plucked heads of grain. Pharisees accused them of breaking the Sabbath. Jesus replied with the example of David eating the consecrated bread (1Sam.21:1-6) and declared: <em>"The Sabbath was made for man, not man for the Sabbath. So the Son of Man is Lord even of the Sabbath"</em> (Mk.2:27-28). Then, in a synagogue, Jesus healed a man with a shrivelled hand on the Sabbath. The Pharisees were furious and began to plot how to kill him. Jesus was angry at their hard hearts — they valued rules over human welfare.</p>'},
{lb:'Traditions of men (Mark 7:1-23)',dr:dQ1,ht:'<p>Pharisees challenged Jesus because his disciples ate without ceremonially washing their hands. Jesus called them hypocrites, quoting Isaiah 29:13: <em>"These people honour me with their lips, but their hearts are far from me"</em> (Mk.7:6). He accused them of replacing God\'s commands with human traditions — specifically the "Corban" practice (declaring money "given to God" to avoid using it for elderly parents, thus breaking the fifth commandment). Jesus declared all foods clean (Mk.7:19) and taught that defilement comes from within — from the human heart — not from external observance.</p>'},
{lb:'Confrontation in the Temple (Matthew 21:12-16)',dr:dQ2,ht:'<p>At the start of the final week, Jesus entered the temple and drove out all who bought and sold, overturning the tables of the money-changers and the seats of those selling doves. He quoted Isaiah 56:7: <em>"My house will be called a house of prayer"</em> and Jeremiah 7:11: <em>"but you are making it a den of robbers"</em> (Mt.21:13). The chief priests and teachers of the law were indignant when they saw the miracles he performed and children crying "Hosanna." The cleansing was both a prophetic act (claiming divine authority over the temple) and a challenge to the religious establishment\'s financial corruption.</p>'},
{lb:'The Great Commandment and the question of David\'s Son',dr:dQ2,ht:'<p>When asked which is the greatest commandment, Jesus replied: <em>"Love the Lord your God with all your heart and with all your soul and with all your mind"</em> (the Shema — Deut.6:4-5) and <em>"Love your neighbour as yourself"</em> (Lev.19:18) — <em>"All the Law and the Prophets hang on these two commandments"</em> (Mt.22:37-40). Jesus then posed a counter-question: if the Messiah is David\'s son, why does David call him "Lord" in Psalm 110:1? The religious leaders could not answer — silenced by the question that revealed the Messiah was more than a human descendant.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Jesus said "The Sabbath was made for man, not man for the Sabbath." This means:',o:['The Sabbath rule can be ignored whenever convenient','The Sabbath is a gift to serve human need and wellbeing — not a burden that crushes human need in the name of religious observance','Man made up the Sabbath rule himself','The Sabbath only applies to Jewish people, not all humanity'],a:2,w:'Mark 2:27 — the Sabbath (rest) was given as a gift for human flourishing (Genesis 2:1-3). The Pharisees had turned a gift into a weapon. Jesus\' principle: God\'s laws serve human good; when rigorously applied laws crush human dignity, the spirit of the law must prevail.'},{q:'Jesus accused the Pharisees of "Corban" — a tradition where they:',o:['Refused to pay Temple taxes to protest Roman rule','Declared money "given to God" to avoid using it to support their elderly parents, breaking the fifth commandment','Ate food dedicated to pagan idols and called it holy','Made offerings at Gentile temples while appearing to worship at Jerusalem'],a:2,w:'Mark 7:9-13 — "Corban" (dedicated to God) was used to avoid parental support. Jesus charged them with nullifying God\'s command to honour parents (Ex.20:12) with a human tradition that conveniently excused them from financial duty.'},{q:'When Jesus cleansed the Temple, he quoted two prophets:',o:['Isaiah 53 (suffering servant) and Psalm 22 (My God, my God)','Isaiah 56:7 ("house of prayer for all nations") and Jeremiah 7:11 ("den of robbers")','Amos 5 (social justice) and Micah 6 (do justice, love mercy)','Malachi 3 (messenger coming) and Zechariah 9 (king on a donkey)'],a:2,w:'Matthew 21:13 — Isaiah 56:7 ("My house will be called a house of prayer for all nations") + Jeremiah 7:11 ("you have made it a den of robbers"). Jesus was claiming the Temple was failing its original purpose and had become a corrupt marketplace.'},{q:'Jesus\' answer about the greatest commandment combined two OT texts:',o:['Genesis 1:1 and Exodus 20:1','Deuteronomy 6:4-5 (love God) and Leviticus 19:18 (love neighbour)','Isaiah 40:1 and Micah 6:8','Numbers 6:24-26 and Psalm 23:1'],a:2,w:'Matthew 22:37-40 — the Shema (Deut.6:4-5: love God with all your heart, soul and mind) + Leviticus 19:18 (love your neighbour as yourself). Jesus says these two commandments summarise the entire Law and Prophets — love is the fulfilment of all moral obligation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 Gospels',ti:'Raising the Dead',su:'Examine accounts of Jesus raising the dead.',steps:[
{lb:'Jairus\' daughter (Mark 5:21-43)',dr:dQ2,ht:'<p>Jairus, a synagogue ruler, fell at Jesus\' feet and begged him to heal his dying daughter. On the way, news came: "Your daughter is dead" (Mk.5:35). Jesus told Jairus: <em>"Don\'t be afraid; just believe"</em> (Mk.5:36). Taking only Peter, James and John with him, Jesus put everyone out of the house (they were weeping and wailing). He took the girl\'s hand and said: <em>"Talitha kum!"</em> (Aramaic: "Little girl, I say to you, get up!") (Mk.5:41). Immediately she stood and walked. Jesus told them to give her something to eat and commanded them not to tell anyone.</p>'},
{lb:'The widow\'s son at Nain (Luke 7:11-17)',dr:dQ2,ht:'<p>Jesus and his disciples met a funeral procession at the gate of Nain — the only son of a widow was being carried out. When Jesus saw the mother, he had compassion on her: <em>"Don\'t cry"</em> (Lk.7:13). He touched the bier and the bearers stopped. He said: <em>"Young man, I say to you, get up!"</em> The dead man sat up and began to talk. Jesus gave him back to his mother. The crowd was filled with awe: <em>"God has come to help his people"</em> (Lk.7:16). This miracle closely parallels Elijah raising the widow\'s son (1Kgs.17:17-24) — Jesus is the new Elijah, and more.</p>'},
{lb:'Lazarus (John 11:1-44)',dr:dQ2,ht:'<p>Lazarus, the beloved friend of Jesus, died while Jesus was two days away. By the time Jesus arrived, Lazarus had been dead four days. Jesus wept (Jn.11:35 — the shortest verse in the Bible). At the tomb, Jesus prayed and then commanded: <em>"Lazarus, come out!"</em> (Jn.11:43). Lazarus came out, still bound in grave clothes. Before the miracle, Jesus had declared: <em>"I am the resurrection and the life. The one who believes in me will live, even though they die"</em> (Jn.11:25). The raising of Lazarus was the decisive miracle that prompted the authorities to plan Jesus\' arrest (Jn.11:47-53).</p>'},
{lb:'Significance of raising the dead',dr:dQ2,ht:'<p>The three raisings show a progression: Jairus\' daughter (just died), widow\'s son (day of burial), Lazarus (four days — unmistakably dead, body decomposing). Together they demonstrate: (1) Jesus has power over death — the last enemy. (2) Jesus\' compassion especially for bereaved parents and loved ones. (3) These are signs pointing to the ultimate resurrection. (4) Jesus is the fulfilment of Elijah and Elisha\'s raisings but surpasses them. (5) "I am the resurrection and the life" — Jesus is not merely one who gives life but is Life itself. WAEC: know all three with references; know the "I am" declaration in John 11:25.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Aramaic words "Talitha kum" mean:',o:['"Peace be with you, child"','"Little girl, I say to you, get up!"','"Your faith has made you well"','"Do not be afraid, only believe"'],a:2,w:'Mark 5:41 — "Talitha kum!" which means "Little girl, I say to you, get up!" Mark preserves the original Aramaic words of Jesus — adding immediacy and authenticity to the account. The girl "immediately stood up and began to walk."'},{q:'What did the crowd say after Jesus raised the widow\'s son at Nain?',o:['\"This is truly the prophet Elijah come back to life\"','\"He is the Son of God; we must follow him\"','\"God has come to help his people\" — recognising divine visitation','\"This is a great prophet who has appeared among us\"'],a:3,w:'Luke 7:16 — "God has visited his people" (or "come to help his people"). The crowd recognised a divine visitation — echoing Elijah\'s raising of the widow\'s son (1Kgs.17). Luke 7:17 says news spread through all Judea.'},{q:'Before raising Lazarus, Jesus declared "I am the resurrection and the life." This means:',o:['Jesus will exist at the future resurrection but is not involved before then','Jesus is not merely one who gives life, but is himself the source and essence of resurrection life','Jesus was already resurrected before he died on the cross','Believers become immortal immediately when they believe in Jesus'],a:2,w:'John 11:25 — "I am the resurrection and the life" is the fifth "I AM" statement in John. Jesus is not merely a miracle worker who can raise the dead; he is the source of resurrection life itself. The raising of Lazarus is a sign of the greater reality he embodies.'},{q:'The raising of Lazarus (John 11) led directly to:',o:['The Triumphal Entry into Jerusalem','The Last Supper','The authorities deciding to arrest and kill Jesus','The Transfiguration on the mountain'],a:3,w:'John 11:47-53 — after the Lazarus miracle, the chief priests and Pharisees called a council: "What are we accomplishing? Here is this man performing many signs." Caiaphas said: "it is better for you that one man die for the people." The raising of Lazarus was the tipping point that led directly to the plot to kill Jesus.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 Gospels',ti:'Jesus and the Marginalised',su:'Examine Jesus\' ministry to those on the margins of society.',steps:[
{lb:'Jesus and tax collectors (Luke 19:1-10)',dr:dQ2,ht:'<p>Zacchaeus was the chief tax collector in Jericho — rich and despised. He climbed a sycamore tree to see Jesus. Jesus looked up and said: <em>"Zacchaeus, come down immediately. I must stay at your house today"</em> (Lk.19:5). The crowd grumbled: "He has gone to be the guest of a sinner." But Zacchaeus stood up: <em>"Look, Lord! Here and now I give half of my possessions to the poor, and if I have cheated anybody out of anything, I will pay back four times the amount"</em> (Lk.19:8). Jesus declared: <em>"Today salvation has come to this house...For the Son of Man came to seek and to save the lost"</em> (Lk.19:9-10).</p>'},
{lb:'Jesus and women (Luke 7:36-50)',dr:dQ2,ht:'<p>A Pharisee called Simon invited Jesus to eat with him. A sinful woman came and wept at Jesus\' feet, wiping them with her hair, kissing them, and anointing them with expensive perfume. Simon thought: if Jesus were a prophet he would know what kind of woman she is. Jesus told the parable of two debtors — one forgiven 500 denarii, one 50: who loves more? Simon admitted the one forgiven more. Jesus said: <em>"Her many sins have been forgiven — as her great love has shown"</em> and told her: <em>"Your faith has saved you; go in peace"</em> (Lk.7:50). Jesus honoured her publicly while reproving the religious host.</p>'},
{lb:'The Samaritan woman (John 4:1-26)',dr:dQ2,ht:'<p>At Jacob\'s Well in Samaria, Jesus spoke with a Samaritan woman — crossing three barriers: (1) Jew-Samaritan hostility. (2) Male-female customs (men did not converse publicly with women). (3) She was a moral outcast (five husbands). Jesus asked her for water, then offered her "living water" (eternal life). When she revealed her marital history, Jesus showed prophetic knowledge: "You have had five husbands, and the man you now have is not your husband" (Jn.4:18). She became an evangelist to her town: "Come, see a man who told me everything I ever did. Could this be the Messiah?" (Jn.4:29).</p>'},
{lb:'Jesus\' approach to the marginalised',dr:dQ2,ht:'<p>Jesus consistently crossed social boundaries to reach the marginalised: Tax collectors (Matthew, Zacchaeus), sinners, women, Samaritans, lepers, Gentiles (the Syrophoenician woman, the Roman centurion). His approach: (1) Initiated contact — he sought them out. (2) Treated them with dignity — asked their names, looked them in the eye. (3) Offered salvation — not just social inclusion. (4) Challenged their community — Zacchaeus\' repentance was public and practical. (5) Was criticised for it — "friend of tax collectors and sinners" (Mt.11:19) was meant as an insult; Jesus accepted it as a description of his mission. Luke\'s Gospel especially highlights Jesus\' concern for the poor, women and outsiders.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Jesus said about Zacchaeus: "Today salvation has come to this house." What demonstrated that Zacchaeus had genuinely changed?',o:['He joined the group of disciples and left Jericho','He promised to pray three times a day and fast twice a week','He volunteered to give half his possessions to the poor and repay anyone he had cheated four times over','He was baptised in the Jordan River by John'],a:3,w:'Luke 19:8 — Zacchaeus\' repentance was immediate, practical and generous: half his possessions to the poor + fourfold repayment to those he cheated (more than the Mosaic requirement of adding a fifth, Num.5:7). Real repentance produces tangible restitution.'},{q:'In the parable of the two debtors (Luke 7), the woman who had been forgiven much:',o:['Showed little love because she had been forgiven of only minor sins','Showed great love because great forgiveness produces great gratitude','Was actually more righteous than Simon the Pharisee','Received forgiveness without any demonstration of repentance'],a:2,w:'Luke 7:47 — "Whoever has been forgiven little loves little." Jesus\' parable teaches that the depth of love is proportional to the awareness of one\'s own sin and the depth of forgiveness received. The sinful woman\'s extravagant love revealed her deep awareness of forgiveness.'},{q:'The Samaritan woman went to the well at noon (the hottest time) because:',o:['She worked night shifts and this was her morning','She preferred to avoid other women who came in the cool of the morning — she was a social outcast','Jesus had arranged to meet her there at noon','It was a market day when only foreigners used the well'],a:2,w:'John 4 implies she came at noon (the sixth hour) to avoid the other women who came in the morning or evening. Her five marriages made her a social outcast in Samaria. Jesus meeting her — alone, at noon, at a well — recalls OT betrothal scenes (Gen.24, Gen.29, Ex.2).'},{q:'Jesus was criticised as "a friend of tax collectors and sinners" (Matthew 11:19). Jesus\'s response to this accusation was:',o:['To deny it and defend his reputation','To accept it — it accurately described his mission to seek and save the lost','To limit his contact with sinners to avoid further criticism','To explain that the accusations were politically motivated'],a:2,w:'Luke 15:1-2 shows Jesus continued eating with sinners despite criticism. In Luke 19:10 he affirmed: "The Son of Man came to seek and to save the lost." "Friend of sinners" was meant as an insult; Jesus wore it as a mission statement.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 Gospels',ti:'Peter\'s Confession and Its Significance',su:'Examine Peter\'s confession at Caesarea Philippi (Matthew 16:13-23).',steps:[
{lb:'The question at Caesarea Philippi',dr:dQ1,ht:'<p>At Caesarea Philippi, Jesus asked his disciples: <em>"Who do people say the Son of Man is?"</em> They replied with various opinions: John the Baptist, Elijah, Jeremiah, one of the prophets. Then Jesus asked directly: <em>"But what about you? Who do you say I am?"</em> (Mt.16:15). Simon Peter replied: <em>"You are the Messiah, the Son of the living God"</em> (Mt.16:16). This is the pivotal confession of the Gospel — the turning point after which Jesus begins to teach explicitly about his suffering, death and resurrection.</p>'},
{lb:'Jesus\' response to Peter\'s confession',dr:dQ1,ht:'<p>Jesus praised Peter: <em>"Blessed are you, Simon son of Jonah, for this was not revealed to you by flesh and blood, but by my Father in heaven"</em> (Mt.16:17). Jesus renamed him: <em>"And I tell you that you are Peter (Petros), and on this rock (petra) I will build my church, and the gates of Hades will not overcome it"</em> (Mt.16:18). He gave Peter "the keys of the kingdom of heaven" — authority to bind and loose (declaring what is and is not permitted). The confession that Jesus is Messiah is the foundation of the church. Jesus then commanded them to tell no one — the <b>Messianic Secret</b>.</p>'},
{lb:'Jesus predicts his death — Peter\'s rebuke',dr:dQ1,ht:'<p>Immediately after the confession, Jesus began to teach that he must go to Jerusalem, suffer, be killed and rise on the third day. Peter rebuked him: <em>"Never, Lord! This shall never happen to you!"</em> Jesus turned to Peter: <em>"Get behind me, Satan! You are a stumbling block to me; you do not have in mind the concerns of God, but merely human concerns"</em> (Mt.16:22-23). Peter had just received divine revelation; minutes later he became a mouthpiece for the devil. The juxtaposition is stark — even those closest to Jesus can fail by applying human thinking to divine purposes.</p>'},
{lb:'The cost of discipleship (Matthew 16:24-28)',dr:dQ1,ht:'<p>Jesus then taught the crowd: <em>"Whoever wants to be my disciple must deny themselves and take up their cross and follow me. For whoever wants to save their life will lose it, but whoever loses their life for me will find it"</em> (Mt.16:24-25). This teaching follows the passion prediction — the cross is not only for Jesus but is the pattern for all disciples. The Messianic revelation leads immediately to the call to self-denial. WAEC: know Peter\'s exact confession (Mt.16:16), Jesus\' response about "the rock" and the keys (16:17-19), and the passion prediction with Peter\'s rebuke (16:21-23).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Peter\'s confession "You are the Messiah, the Son of the living God" was made at:',o:['The Mount of Transfiguration','Jerusalem, on the day of the Triumphal Entry','Caesarea Philippi','The Sea of Galilee after the feeding of the 5,000'],a:3,w:'Matthew 16:13 — "When Jesus came to the region of Caesarea Philippi..." Caesarea Philippi was a city known for pagan temples (including one dedicated to Caesar as divine) — a provocative location for Peter\'s confession that Jesus (not Caesar) is the Son of God.'},{q:'Jesus\' words "upon this rock I will build my church" — "the rock" most likely refers to:',o:['Peter himself as an infallible pope','The literal rock on which they were standing','The confession "You are the Messiah, the Son of God" — the truth Peter declared','The city of Jerusalem where the church would be founded'],a:3,w:'There is a play on words: Peter (Petros, a small stone) — on this rock (petra, bedrock). The church is built on the confession Peter made by divine revelation, not on Peter\'s personal character (which failed repeatedly). The foundation of the church is the truth that Jesus is the Messiah.'},{q:'Jesus called Peter "Satan" when Peter rebuked him for predicting his death because:',o:['Peter had secretly been working with the Pharisees','Peter\'s denial of the necessity of suffering was the same temptation as the third temptation in the wilderness — to achieve God\'s ends without the cross','Peter was demon-possessed at that moment','Jesus meant Satan only as a metaphor for a bad friend'],a:2,w:'The devil in the wilderness tempted Jesus with power without suffering; Peter was now repeating the temptation — suggesting Jesus could be the Messiah without the cross. Jesus recognised the same satanic strategy: human wisdom that rejects divine necessity.'},{q:'"Take up your cross and follow me" was taught immediately after the passion prediction because:',o:['Jesus wanted the disciples to literally carry wooden crosses to Jerusalem','It explained why the disciples would need to carry equipment for the crucifixion','The Messiah\'s pattern of suffering-death-resurrection is also the pattern for all disciples','Jesus knew Peter would carry his cross at the time of crucifixion'],a:3,w:'Matthew 16:24 — Jesus\' passion prediction and the call to cross-bearing are inseparable. The shape of discipleship mirrors the shape of Jesus\' own life: self-denial, suffering, death to self-interest, and ultimately resurrection/life. The cross is both Jesus\' history and every disciple\'s calling.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 Gospels',ti:'WAEC Prep — Ministry of Jesus',su:'Practise WAEC-style questions on the ministry of Jesus.',steps:[
{lb:'WAEC essay approach — ministry',dr:dQ1,ht:'<p>For WAEC essays on Jesus\' ministry: (1) Name the event with specific reference. (2) Give a clear narrative (who, what, where, when). (3) Explain the significance — theological and practical. (4) State one lesson for Christians today. Common WAEC questions: "Describe the calling of any two disciples." "Give an account of any one healing miracle." "Describe the feeding of the 5,000 and its significance." "Give an account of the Transfiguration." "Narrate Peter\'s confession at Caesarea Philippi." "Describe Jesus\' conflict with the Pharisees over the Sabbath."</p>'},
{lb:'Key references to memorise',dr:dQ2,ht:'<p>Essential references: Calling of Peter and Andrew: Mt.4:18-20. Calling of Matthew: Mt.9:9. Twelve apostles: Mt.10:1-4. Feeding of 5,000: Mt.14:13-21. Calming storm: Mk.4:35-41. Healing of paralysed man: Mk.2:1-12. Ten lepers: Lk.17:11-19. Blind Bartimaeus: Mk.10:46-52. Jairus\' daughter: Mk.5:21-43. Widow of Nain: Lk.7:11-17. Lazarus: Jn.11:1-44. Transfiguration: Mt.17:1-13. Peter\'s confession: Mt.16:13-20. Zacchaeus: Lk.19:1-10. Cleansing Temple: Mt.21:12-16. Greatest commandment: Mt.22:37-40.</p>'},
{lb:'Common WAEC mistakes to avoid',dr:dQ2,ht:'<p>Avoid: Confusing which disciples were called first (Peter and Andrew, then James and John — all fishermen — then Matthew). Saying the Transfiguration had four disciples present (only three: Peter, James, John). Confusing the widow\'s son at Nain (Lk.7) with Jairus\' daughter (Mk.5) or Lazarus (Jn.11). Saying Jesus broke the Sabbath law (he reinterpreted it, he did not break God\'s law). Missing the OT allusions in the miracles (e.g. feeding recalling manna; storm recalling Psalm 107). Forgetting that "sozo" means both saved and healed. Not naming the Aramaic "Talitha kum" for the healing of Jairus\' daughter.</p>'},
{lb:'Lessons from Jesus\' ministry',dr:dQ2,ht:'<p>Key lessons: (1) Jesus\' miracles are signs of the Kingdom — God\'s rule breaking into the world. (2) Faith is the key that unlocks the miracle — "your faith has saved you." (3) Jesus crosses social barriers — no one is beyond his reach. (4) Jesus\' authority exceeds all human authority (wind, sea, death, Moses, Elijah). (5) True discipleship costs everything — leave your nets, tax booth, comfort. (6) The Messianic secret reveals the paradox: Jesus is the powerful Messiah who comes through weakness. (7) Repentance leads to restitution — Zacchaeus. (8) Great forgiveness produces great love — the sinful woman.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which miracle most directly caused the chief priests to plot Jesus\' arrest and death?',o:['The feeding of the 5,000 in Galilee','The healing of Blind Bartimaeus in Jericho','The raising of Lazarus from the dead in Bethany','The cleansing of the Temple in Jerusalem'],a:3,w:'John 11:47-53 — after the raising of Lazarus, the Sanhedrin met: "What are we accomplishing? This man is performing many signs." Caiaphas declared it better for one man to die for the people. The miracle was the final tipping point leading to the arrest and crucifixion.'},{q:'The "Messianic Secret" refers to Jesus\' repeated command to:',o:['Keep his messianic identity hidden — he told healed people and disciples not to tell others (most clearly in Mark\'s Gospel)','Meet him secretly at night for special teaching','Hide his disciples\' identities from the Roman authorities','Keep the contents of the Sermon on the Mount confidential'],a:1,w:'In Mark\'s Gospel especially, Jesus repeatedly commands silence after healings and at the Transfiguration (Mk.1:44; 5:43; 7:36; 8:30; 9:9). Scholars debate why — possibly to prevent premature political misunderstanding of his messiahship.'},{q:'Jesus said "the gates of Hades will not overcome" the church. This means:',o:['The church will never face persecution or difficulty','Death and the powers of the underworld cannot ultimately defeat the community founded on the truth that Jesus is the Messiah','Church buildings must have strong gates to resist demons','Hades is a physical location that Jesus has physically locked'],a:2,w:'Matthew 16:18 — "gates of Hades" (death/the grave) will not prevail against the church. The resurrection is the basis: if Jesus conquered death, the community built on faith in him cannot ultimately be destroyed by death. The church is indestructible because its Lord conquered death.'},{q:'Jesus had compassion on the crowd "because they were harassed and helpless, like sheep without a shepherd" (Matthew 9:36). This image echoes:',o:['Ezekiel 34, where God condemns unfaithful shepherds of Israel and promises to shepherd his people himself','Psalm 1, comparing the righteous to trees planted by water','Isaiah 40, comparing humanity to grass that withers','Genesis 4, where Abel was the first shepherd'],a:1,w:'Ezekiel 34 — God condemned the leaders (shepherds) of Israel for exploiting rather than caring for the people. Matthew 9:36 applies this to Jesus\' day: the religious leaders (Pharisees, scribes) were failing the people. Jesus comes as the Good Shepherd (John 10:11) — fulfilling Ezekiel\'s prophecy.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Ministry of Jesus',su:'Integrated revision across all Ministry of Jesus topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Ministry of Jesus summary: Calling disciples: "Follow me" — immediate response; fishermen, tax collector; twelve apostles (twelve tribes). Healing miracles: paralysed man (forgiveness + healing); ten lepers (gratitude; one Samaritan); Bartimaeus (persistent faith; "sozo"). Nature miracles: feeding 5,000 (manna echo; Eucharistic language); calming storm (God controls sea); walking on water (Peter\'s faith and failure). Raising dead: Jairus\' daughter (Talitha kum); widow of Nain (Elijah echo); Lazarus (I am the resurrection). Transfiguration: Peter/James/John; Moses/Elijah; cloud; "Listen to him." Peter\'s confession: "Messiah, Son of the living God"; the Rock; keys; passion prediction; take up your cross.</p>'},
{lb:'Key themes',dr:dQ10,ht:'<p>Key themes in Jesus\' ministry: (1) <b>Kingdom of God</b> — miracles are signs that God\'s rule is breaking in. (2) <b>Faith</b> — the consistent requirement: "your faith has saved you." (3) <b>Authority</b> — over disease, nature, death, religious tradition, demons. (4) <b>Compassion</b> — Jesus was "moved with compassion" — he felt human suffering. (5) <b>Inclusion</b> — women, sinners, tax collectors, Samaritans, Gentiles welcomed. (6) <b>Fulfilment</b> — every miracle has OT roots (manna, Elijah, Isaiah 35). (7) <b>Cost</b> — "take up your cross" — discipleship is not comfortable. (8) <b>Identity</b> — who is this? The question every hearer must answer.</p>'},
{lb:'Miracles and the Kingdom',dr:dQ1,ht:'<p>When Jesus replied to John the Baptist\'s question ("Are you the one?"), he pointed to his miracles as evidence of the Kingdom (Mt.11:4-5). These deeds of power demonstrated: (1) The Kingdom of God had arrived in Jesus\' person. (2) Isaiah\'s prophecy of the new age was being fulfilled. (3) Satan\'s dominion was being challenged and overcome. (4) The "already and not yet" tension of the Kingdom — healing now, but full healing awaits the resurrection. Every miracle was a foretaste of the new creation where there will be no sickness, death, or mourning (Rev.21:4). The miracles are previews of the resurrection world.</p>'},
{lb:'WAEC final tips',dr:dQ2,ht:'<p>Final WAEC tips for ministry: (1) Always name the specific miracle/event with reference — not just "Jesus healed a blind man." (2) Know the three raisings in order of decay: just died (Jairus); day of burial (Nain); four days decomposing (Lazarus). (3) Know the Transfiguration witnesses (Peter, James, John) and the significance of Moses and Elijah. (4) Know Peter\'s exact confession (Mt.16:16) and Jesus\' response (16:17-19). (5) Link every miracle to the OT background and to the Kingdom of God. (6) Know "sozo" means both saved and healed. (7) Know the feeding\'s Eucharistic language. (8) Know that the raising of Lazarus triggered the plot to kill Jesus.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The "I AM" declaration in John 11:25 is "I am the resurrection and the life." What was the context?',o:['Jesus was speaking to his disciples after the Transfiguration','Jesus said this at the Last Supper when explaining the bread and wine','Jesus said it to Martha before raising Lazarus — claiming to be not just a miracle worker but the source of life itself','Jesus said it to the Pharisees who questioned his authority to forgive sins'],a:3,w:'John 11:25 — Jesus said to Martha, just before raising Lazarus: "I am the resurrection and the life. The one who believes in me will live, even though they die." The raising of Lazarus was the sign that illustrated the claim. Jesus is the source of life, not merely one who channels it.'},{q:'At the Transfiguration, the disciples fell face down "terrified." Jesus then:',o:['Left them on the mountain while he descended alone','Told them to build three shelters immediately','Touched them and said "Get up. Don\'t be afraid" — comfort after divine encounter','Called the twelve other disciples to join them on the mountain'],a:3,w:'Matthew 17:7 — "Jesus came and touched them. \'Get up,\' he said. \'Don\'t be afraid.\'" The pattern of divine encounter (overwhelming fear) followed by divine comfort ("don\'t be afraid") runs throughout Scripture: Isaiah\'s call (6:5-7), Daniel\'s visions (8:17), the Resurrection appearances.'},{q:'Jesus rebuked Peter "Get behind me, Satan!" because Peter had:',o:['Denied that Jesus had performed miracles','Suggested Jesus should avoid Jerusalem altogether and stay in Galilee','Rejected the necessity of Jesus\' suffering and death — applying human thinking to God\'s plan','Questioned whether Judas should be one of the twelve'],a:3,w:'Matthew 16:22-23 — Peter rebuked Jesus for predicting his death. Jesus saw in Peter\'s response the same satanic strategy as the third wilderness temptation: power and messiahship without the cross. "You do not have in mind the concerns of God, but merely human concerns."'},{q:'The twelve baskets of leftovers after the feeding of the 5,000 suggest:',o:['Jesus deliberately made too much food as a lesson','The disciples were inefficient in distributing the bread and fish','God\'s provision is superabundant — always more than enough for his people\'s needs','The twelve apostles each took home a basket for their families'],a:3,w:'Twelve baskets remaining (one per apostle/tribe) after all are satisfied demonstrates superabundance — God\'s provision never runs short. The miracle echoes the manna: God fed Israel in the wilderness; Jesus feeds his new Israel. There was enough and to spare.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
