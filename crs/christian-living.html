<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Christian Living',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'New creation (2 Cor 5:17); dying/rising (Rom 6)',DARK,10,'middle',false));o.push(T(240,74,'Put off/put on (Eph 4, Col 3)','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,CRM,ACC,1.5));o.push(T(240,110,'Fruit of Spirit vs works of flesh (Gal 5)',DARK,10,'middle',false));o.push(T(240,128,'Living by faith (Gal 2:20, Heb 11)','#555',9,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,CRM,ACC,1.5));o.push(T(240,164,'Love: greatest virtue (1 Cor 13)',DARK,10,'middle',false));o.push(T(240,182,'Holy living (Rom 12, 1 Pet 1)','#555',9,'middle',false));}
if(p>=4){o.push(R(10,200,460,60,CRM,ACC,1));o.push(T(240,218,'One body, many gifts (Rom 12:3-8, 1 Cor 12)',DARK,10,'middle',false));o.push(T(240,236,'Genuine transformation, not mere doctrine','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Key Themes and References',ACC,12,'middle',true));
[['2 Cor 5:17','New creation — old gone, new here'],['Romans 6','Dead to sin, alive to God'],['Ephesians 4','Put off old self, put on new self'],['Galatians 5:22-23','Fruit of the Spirit — 9 qualities'],['1 Corinthians 13','Love — the greatest virtue']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ4(p){dQ2(p);}

o.push(T(240,20,'Christian Living — Summary',ACC,13,'middle',true));
[['2 Cor 5:17','New creation in Christ'],['Romans 6','Dying to sin, rising to new life'],['Ephesians 4:22-32','Put off old self, put on new self'],['Galatians 5:22-23','Fruit of the Spirit (9 qualities)'],['Galatians 2:20 / Hebrews 11','Living by faith'],['1 Corinthians 13','Love — the greatest virtue'],['Romans 12 / 1 Peter 1','Holy living; one body, many gifts']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS • Acts & Epistles',ti:'New Creation in Christ',su:'Explain what it means to become a "new creation" in Christ.',steps:[
{lb:'The declaration of 2 Corinthians 5:17',dr:dQ1,ht:'<p>Paul declares, <em>"If anyone is in Christ, the new creation has come: The old has gone, the new is here!"</em> (2 Corinthians 5:17) &mdash; describing conversion not as mere self-improvement, but as a genuine, radical <b>transformation of identity</b>.</p>'},
{lb:'The old has gone',dr:dQ1,ht:'<p>"The old has gone" refers to the believer\'s former way of life &mdash; enslavement to sin, separation from God, and old patterns of thinking &mdash; which are decisively left behind through union with Christ.</p>'},
{lb:'The new has come',dr:dQ1,ht:'<p>"The new is here" points to a genuinely new identity, purpose and relationship with God, made possible entirely through <b>Christ\'s death and resurrection</b>, not through human effort or self-reformation alone.</p>'},
{lb:'Living out the new identity',dr:dQ1,ht:'<p>Because believers are new creations, Christian living involves consciously <b>living out this new identity</b> daily &mdash; not striving to earn a new status, but growing into the reality of a transformation that has already occurred.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which verse declares that \"if anyone is in Christ, the new creation has come\"?","o":["2 Corinthians 5:17","Romans 6:1","Galatians 5:22","Ephesians 4:22"],"a":0,"w":"2 Corinthians 5:17 declares that anyone in Christ is a new creation."},{"q":"How does this lesson describe conversion, according to 2 Corinthians 5:17?","o":["Mere self-improvement through willpower","A genuine, radical transformation of identity","A temporary change with no lasting effect","A purely symbolic ritual with no real change"],"a":1,"w":"Conversion is described as a genuine, radical transformation of identity, not mere self-improvement."},{"q":"What does \"the old has gone\" refer to?","o":["A believer's nationality","A believer's physical age","The believer's former way of life, enslaved to sin","A believer's family relationships"],"a":2,"w":"\"The old has gone\" refers to the believer's former way of life, enslaved to sin."},{"q":"What does \"the new is here\" point to?","o":["A new name given by the church","A new physical body immediately","A new country of citizenship","A genuinely new identity, purpose and relationship with God"],"a":3,"w":"\"The new is here\" points to a genuinely new identity, purpose and relationship with God."},{"q":"What makes this new identity possible, according to this lesson?","o":["Christ's death and resurrection","Human effort and self-reformation alone","A person's own good deeds","A person's family heritage"],"a":0,"w":"Christ's death and resurrection make this new identity possible, not human effort alone."},{"q":"What does Christian living involve, given this new identity?","o":["Ignoring the new identity entirely","Consciously living out the new identity daily","Returning to the old way of life periodically","Waiting passively with no active effort"],"a":1,"w":"Christian living involves consciously living out the new identity daily."},{"q":"Is growing into this new identity about earning a new status, according to this lesson?","o":["Yes, the new creation only applies after death","Yes, believers must earn their new status through good works","No, it is about growing into a transformation that has already occurred","No new identity is actually given at all"],"a":2,"w":"It is about growing into a transformation that has already occurred, not earning a new status."},{"q":"What overall message does 2 Corinthians 5:17 convey about the believer's identity?","o":["The change only applies to a believer's future, not their present life","No real change occurs at conversion at all","Only a partial change occurs, with the old identity remaining dominant","A decisive, complete change from old to new through union with Christ"],"a":3,"w":"2 Corinthians 5:17 conveys a decisive, complete change from old to new through union with Christ."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS • Acts & Epistles',ti:'Dying to Sin, Rising to New Life',su:'Explain Paul\'s teaching in Romans 6 on dying to sin and living for God.',steps:[
{lb:'United with Christ in His death',dr:dQ2,ht:'<p>In <b>Romans 6</b>, Paul teaches that believers, through baptism, are united with Christ in His <b>death</b> &mdash; their old sinful self was, in a spiritual sense, crucified with Him, breaking sin\'s controlling power over their lives.</p>'},
{lb:'United with Christ in His resurrection',dr:dQ2,ht:'<p>Just as Christ was raised from the dead, believers are raised to <b>walk in newness of life</b> (Romans 6:4) &mdash; a genuine, present-tense transformation, not merely a future hope.</p>'},
{lb:'No longer slaves to sin',dr:dQ2,ht:'<p>Paul argues believers are <b>no longer slaves to sin</b> (Romans 6:6), and should therefore not let sin reign in their mortal bodies, nor offer themselves to sin, but rather offer themselves to God as instruments of righteousness (Romans 6:12-13).</p>'},
{lb:'The wages of sin versus the gift of God',dr:dQ2,ht:'<p>Romans 6:23 famously contrasts <em>"the wages of sin is death,"</em> with <em>"the gift of God is eternal life in Christ Jesus our Lord"</em> &mdash; summarising the entire chapter\'s argument about death to the old life and life in the new.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"In which chapter does Paul teach about dying to sin and rising to new life?","o":["Romans 6","1 Corinthians 13","Galatians 5","Ephesians 4"],"a":0,"w":"Paul teaches about dying to sin and rising to new life in Romans 6."},{"q":"Through what does Paul say believers are united with Christ's death, according to Romans 6?","o":["Fasting","Baptism","Church attendance alone","Tithing"],"a":1,"w":"Paul says believers are united with Christ's death through baptism."},{"q":"What does Paul say believers are raised to do, according to Romans 6:4?","o":["Return to their old way of life","Wait passively for death","Walk in newness of life","Focus only on future judgment"],"a":2,"w":"Believers are raised to walk in newness of life, according to Romans 6:4."},{"q":"According to Romans 6:6, what are believers no longer, regarding sin?","o":["Superior to all other believers","Completely free from any temptation ever","Immune to physical death","Slaves to sin"],"a":3,"w":"Believers are no longer slaves to sin, according to Romans 6:6."},{"q":"What does Paul instruct believers to offer themselves as, according to Romans 6:13?","o":["Instruments of righteousness to God","Instruments of sin to the world","Servants only to themselves","Servants to no one at all"],"a":0,"w":"Paul instructs believers to offer themselves as instruments of righteousness to God."},{"q":"What does Romans 6:23 say is \"the wages of sin\"?","o":["Eternal life","Death","Wealth","Temporary discomfort only"],"a":1,"w":"Romans 6:23 says the wages of sin is death."},{"q":"What does Romans 6:23 say is \"the gift of God\"?","o":["Physical health","Wealth and prosperity","Eternal life in Christ Jesus our Lord","Fame and recognition"],"a":2,"w":"Romans 6:23 says the gift of God is eternal life in Christ Jesus our Lord."},{"q":"What overall argument does Romans 6 make about the Christian life?","o":["That baptism has no spiritual significance at all","That sin has no real consequence for believers","That believers must earn eternal life through good works","Death to the old sinful life and genuine new life in Christ"],"a":3,"w":"Romans 6 argues for death to the old sinful life and genuine new life in Christ."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS • Acts & Epistles',ti:'Put Off the Old Self, Put On the New',su:'Explain Paul\'s imagery of putting off the old self and putting on the new in Ephesians and Colossians.',steps:[
{lb:'The clothing imagery',dr:dQ1,ht:'<p>In <b>Ephesians 4:22-24</b> and <b>Colossians 3:9-10</b>, Paul uses the imagery of <b>changing clothes</b>: believers are to "put off" the old self, corrupted by deceitful desires, and "put on" the new self, created to be like God in true righteousness and holiness.</p>'},
{lb:'Renewed in the attitude of the mind',dr:dQ1,ht:'<p>Ephesians 4:23 specifically emphasises being <b>"renewed in the attitude of your minds"</b> &mdash; showing that genuine transformation begins with a changed way of thinking, not merely external behaviour.</p>'},
{lb:'Practical instructions in Ephesians 4:25-32',dr:dQ1,ht:'<p>Paul gives concrete, practical examples of this "putting off/putting on" pattern: putting off <b>falsehood</b> for truthfulness, putting off theft for honest work and generosity, and putting off <b>unwholesome talk</b> for words that build others up (Ephesians 4:25-29).</p>'},
{lb:'Kindness instead of bitterness',dr:dQ1,ht:'<p>Ephesians 4:31-32 instructs believers to put away <b>bitterness, rage, anger, brawling and slander</b>, and instead be <b>kind and compassionate</b>, forgiving one another just as God forgave them in Christ.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What imagery does Paul use in Ephesians 4:22-24 to describe Christian transformation?","o":["Changing clothes — putting off the old, putting on the new","Building a house","Planting a garden","Sailing a ship"],"a":0,"w":"Paul uses the imagery of changing clothes to describe putting off the old self and putting on the new."},{"q":"What is the \"old self\" described as, in Ephesians 4:22?","o":["Perfect and without fault","Corrupted by deceitful desires","Identical to the new self","A purely physical, not spiritual, concept"],"a":1,"w":"The old self is described as corrupted by deceitful desires in Ephesians 4:22."},{"q":"What does Ephesians 4:23 say believers should be renewed in?","o":["Only their financial status","Only their physical appearance","The attitude of their minds","Only their social relationships"],"a":2,"w":"Ephesians 4:23 says believers should be renewed in the attitude of their minds."},{"q":"What should believers put off instead of falsehood, according to Ephesians 4:25?","o":["Excessive speech with no content","More falsehood","Silence about everything","Truthfulness"],"a":3,"w":"Believers should put on truthfulness instead of falsehood, according to Ephesians 4:25."},{"q":"What should a thief do instead of stealing, according to Ephesians 4:28?","o":["Do honest work and share with those in need","Steal more discreetly","Only steal from wealthy people","Continue stealing without any change"],"a":0,"w":"A thief should do honest work and share with those in need, instead of continuing to steal."},{"q":"What kind of talk does Ephesians 4:29 instruct believers to avoid?","o":["All forms of speech entirely","Unwholesome talk","Only talk about money","Only talk about religion"],"a":1,"w":"Ephesians 4:29 instructs believers to avoid unwholesome talk."},{"q":"What does Ephesians 4:31 instruct believers to put away?","o":["Truthfulness and honesty","Kindness and compassion","Bitterness, rage, anger, brawling and slander","Generosity and hard work"],"a":2,"w":"Ephesians 4:31 instructs believers to put away bitterness, rage, anger, brawling and slander."},{"q":"What should replace bitterness and anger, according to Ephesians 4:32?","o":["Revenge against those who wronged them","More anger and resentment","Complete silence and withdrawal","Kindness, compassion and forgiveness"],"a":3,"w":"Kindness, compassion and forgiveness should replace bitterness and anger, according to Ephesians 4:32."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS • Acts & Epistles',ti:'Fruit of the Spirit and Works of the Flesh',su:'Contrast the fruit of the Spirit with the works of the flesh in Galatians 5.',steps:[
{lb:'The works of the flesh',dr:dQ2,ht:'<p>In <b>Galatians 5:19-21</b>, Paul lists the "works of the flesh": sexual immorality, idolatry, hatred, discord, jealousy, fits of rage, envy, drunkenness, and similar behaviours, warning that those who live this way will not inherit the kingdom of God.</p>'},
{lb:'The fruit of the Spirit',dr:dQ2,ht:'<p>By contrast, <b>Galatians 5:22-23</b> lists the "fruit of the Spirit": <b>love, joy, peace, forbearance, kindness, goodness, faithfulness, gentleness and self-control</b> &mdash; against which, Paul notes, "there is no law."</p>'},
{lb:'Fruit, not fruits: a single, unified character',dr:dQ2,ht:'<p>Notably, Paul uses the singular "fruit" (not "fruits") &mdash; suggesting these nine qualities are not a checklist to select from, but a single, unified <b>character</b> that develops together as one grows in the Spirit.</p>'},
{lb:'Walking by the Spirit',dr:dQ2,ht:'<p>Galatians 5:25 concludes: <em>"Since we live by the Spirit, let us keep in step with the Spirit"</em> &mdash; framing the fruit of the Spirit not as achieved through willpower alone, but as the natural <b>outgrowth</b> of a life genuinely led by God\'s Spirit.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which chapter contrasts the works of the flesh with the fruit of the Spirit?","o":["Galatians 5","Romans 6","Ephesians 4","1 Corinthians 13"],"a":0,"w":"Galatians 5 contrasts the works of the flesh with the fruit of the Spirit."},{"q":"Which of these is listed among the \"works of the flesh\" in Galatians 5:19-21?","o":["Love","Sexual immorality","Peace","Self-control"],"a":1,"w":"Sexual immorality is listed among the works of the flesh in Galatians 5:19-21."},{"q":"What does Paul warn about those who habitually practise the works of the flesh?","o":["They are automatically forgiven with no consequence","They will receive extra spiritual blessings","They will not inherit the kingdom of God","They cannot ever be truly converted at all"],"a":2,"w":"Paul warns that those who habitually practise the works of the flesh will not inherit the kingdom of God."},{"q":"Which of these is listed among the \"fruit of the Spirit\" in Galatians 5:22-23?","o":["Drunkenness","Idolatry","Jealousy","Love"],"a":3,"w":"Love is listed among the fruit of the Spirit in Galatians 5:22-23."},{"q":"How many qualities are listed as the fruit of the Spirit?","o":["Nine","Five","Twelve","Three"],"a":0,"w":"Nine qualities are listed as the fruit of the Spirit."},{"q":"What does Paul say about the fruit of the Spirit in Galatians 5:23?","o":["\"These things are forbidden by the law\"","\"Against such things there is no law\"","\"Only priests may display these qualities\"","\"These qualities apply only to Gentiles\""],"a":1,"w":"Paul says \"against such things there is no law\" regarding the fruit of the Spirit."},{"q":"Why is it significant that Paul uses the singular \"fruit,\" not \"fruits\"?","o":["It means only one quality is actually required","It has no particular significance at all","It suggests a single, unified character developing together, not a checklist to pick from","It means the list is incomplete and open to addition"],"a":2,"w":"The singular \"fruit\" suggests a single, unified character developing together, not a checklist to pick from."},{"q":"What does Galatians 5:25 instruct believers to do?","o":["Focus only on avoiding the works of the flesh, with no positive fruit","Rely only on their own willpower","Ignore the Spirit's guidance entirely","Keep in step with the Spirit"],"a":3,"w":"Galatians 5:25 instructs believers to keep in step with the Spirit."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS • Acts & Epistles',ti:'Living by Faith',su:'Explain the New Testament teaching on living the Christian life by faith.',steps:[
{lb:'Crucified with Christ',dr:dQ1,ht:'<p>In <b>Galatians 2:20</b>, Paul writes, <em>"I have been crucified with Christ and I no longer live, but Christ lives in me. The life I now live in the body, I live by faith in the Son of God."</em></p>'},
{lb:'The righteous shall live by faith',dr:dQ1,ht:'<p>This principle, quoted from <b>Habakkuk 2:4</b> and repeated in <b>Romans 1:17</b> and <b>Galatians 3:11</b>, teaches that a right relationship with God, and the ongoing Christian life, is sustained through <b>trust in God</b>, not through human effort to earn merit.</p>'},
{lb:'The great "hall of faith"',dr:dQ1,ht:'<p><b>Hebrews 11</b>, often called the "hall of faith," recounts figures such as Abraham, Noah, Moses and others who lived by faith, defining faith as <em>"confidence in what we hope for and assurance about what we do not see"</em> (Hebrews 11:1).</p>'},
{lb:'Faith working through love',dr:dQ1,ht:'<p>Galatians 5:6 clarifies that genuine faith is not merely intellectual belief, but <b>"faith expressing itself through love"</b> &mdash; showing that living by faith naturally produces visible, practical love toward others.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which verse contains Paul's statement, \"I have been crucified with Christ... the life I now live... I live by faith\"?","o":["Galatians 2:20","Romans 6:4","Ephesians 4:24","1 Corinthians 13:1"],"a":0,"w":"Galatians 2:20 contains Paul's statement about being crucified with Christ and living by faith."},{"q":"From which Old Testament prophet does the principle \"the righteous shall live by faith\" originate?","o":["Isaiah","Habakkuk","Jeremiah","Ezekiel"],"a":1,"w":"The principle originates from the prophet Habakkuk (Habakkuk 2:4)."},{"q":"In which two New Testament letters is \"the righteous shall live by faith\" repeated?","o":["Ephesians and Colossians","1 and 2 Corinthians","Romans and Galatians","1 and 2 Thessalonians"],"a":2,"w":"This principle is repeated in Romans (1:17) and Galatians (3:11)."},{"q":"What is the Christian life sustained through, according to this principle?","o":["Physical strength and health","Human effort alone, with no trust required","Wealth and social status","Trust in God, not human effort to earn merit"],"a":3,"w":"The Christian life is sustained through trust in God, not human effort to earn merit."},{"q":"Which chapter of Hebrews is often called the \"hall of faith\"?","o":["Hebrews 11","Hebrews 1","Hebrews 6","Hebrews 13"],"a":0,"w":"Hebrews 11 is often called the \"hall of faith.\""},{"q":"How does Hebrews 11:1 define faith?","o":["Certainty based only on visible proof","Confidence in what we hope for and assurance about what we do not see","A feeling with no real substance","Agreement with a set of religious rules"],"a":1,"w":"Hebrews 11:1 defines faith as confidence in what we hope for and assurance about what we do not see."},{"q":"According to Galatians 5:6, how does genuine faith express itself?","o":["Through political power","Through wealth accumulation","Through love","Through isolation from others"],"a":2,"w":"According to Galatians 5:6, genuine faith expresses itself through love."},{"q":"What does this teaching about faith working through love show about genuine faith?","o":["It is identical to simply following religious rules","It requires no visible expression at all","It is purely a private, internal matter with no outward effect","It naturally produces visible, practical love toward others"],"a":3,"w":"This shows genuine faith naturally produces visible, practical love toward others."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS • Acts & Epistles',ti:'Love: The Greatest Virtue',su:'Explain Paul\'s teaching on the supremacy of love in 1 Corinthians 13.',steps:[
{lb:'Without love, nothing else matters',dr:dQ2,ht:'<p>In <b>1 Corinthians 13:1-3</b>, Paul argues that even the most impressive spiritual gifts &mdash; eloquent speech, prophecy, deep knowledge, mountain-moving faith, or radical self-sacrifice &mdash; amount to <b>"nothing"</b> without genuine love.</p>'},
{lb:'What love is and is not',dr:dQ2,ht:'<p><b>1 Corinthians 13:4-7</b> describes love in practical terms: it is <b>patient and kind</b>; it does not envy, boast, or act rudely; it is not self-seeking or easily angered; it keeps no record of wrongs and always <b>protects, trusts, hopes and perseveres</b>.</p>'},
{lb:'Love never fails',dr:dQ2,ht:'<p>Paul contrasts love\'s permanence with the temporary nature of spiritual gifts: prophecies will cease, tongues will be stilled, knowledge will pass away, but <b>love never fails</b> (1 Corinthians 13:8).</p>'},
{lb:'The greatest of these is love',dr:dQ2,ht:'<p>The chapter concludes with the famous statement: <em>"And now these three remain: faith, hope and love. But the greatest of these is love"</em> (1 Corinthians 13:13) &mdash; establishing love as the supreme Christian virtue.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"According to 1 Corinthians 13:1-3, what happens to impressive spiritual gifts without love?","o":["They amount to \"nothing\"","They become even more powerful","They are automatically doubled","They have no connection to love at all"],"a":0,"w":"According to 1 Corinthians 13:1-3, impressive spiritual gifts amount to \"nothing\" without love."},{"q":"Which of these does 1 Corinthians 13:4 say love is?","o":["Envious and boastful","Patient and kind","Rude and self-seeking","Easily angered"],"a":1,"w":"1 Corinthians 13:4 says love is patient and kind."},{"q":"According to 1 Corinthians 13:5, what does love NOT keep?","o":["Any trust at all","Any hope at all","A record of wrongs","Any patience at all"],"a":2,"w":"1 Corinthians 13:5 says love keeps no record of wrongs."},{"q":"According to 1 Corinthians 13:7, what does love always do?","o":["Keeps careful account of every wrong done","Gives up quickly when things get difficult","Seeks only its own benefit","Protects, trusts, hopes and perseveres"],"a":3,"w":"1 Corinthians 13:7 says love always protects, trusts, hopes and perseveres."},{"q":"What does Paul say about love's permanence, compared to spiritual gifts?","o":["Love never fails, while prophecies, tongues and knowledge will pass away","Love will eventually fail, unlike spiritual gifts","All spiritual gifts and love are equally permanent","Love is temporary, unlike spiritual gifts which are eternal"],"a":0,"w":"Paul says love never fails, unlike prophecies, tongues and knowledge, which will pass away."},{"q":"What three things does 1 Corinthians 13:13 say \"remain\"?","o":["Wisdom, knowledge and power","Faith, hope and love","Prophecy, tongues and miracles","Wealth, status and fame"],"a":1,"w":"1 Corinthians 13:13 says faith, hope and love remain."},{"q":"Which of these three does Paul say is \"the greatest\"?","o":["Hope","Faith","Love","They are all exactly equal, with no greatest"],"a":2,"w":"Paul says love is the greatest of the three: faith, hope and love."},{"q":"What overall point does 1 Corinthians 13 make about the Christian life?","o":["Hope is more important than both faith and love","Spiritual gifts matter more than love","Faith is more important than love","Love is the supreme virtue, without which nothing else has real value"],"a":3,"w":"1 Corinthians 13 makes the point that love is the supreme virtue, without which nothing else has real value."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS • Acts & Epistles',ti:'Holy Living',su:'Explain the New Testament call to holy living in Romans 12 and 1 Peter 1.',steps:[
{lb:'Living sacrifices',dr:dQ1,ht:'<p>Romans 12:1 urges believers to offer their bodies as <b>"living sacrifices, holy and pleasing to God"</b> &mdash; describing this as their <b>"true and proper worship,"</b> extending worship beyond ritual into everyday conduct.</p>'},
{lb:'Transformed, not conformed',dr:dQ1,ht:'<p>Romans 12:2 instructs believers: <em>"Do not conform to the pattern of this world, but be transformed by the renewing of your mind."</em> Genuine holiness involves an internal, mental transformation, not mere external conformity to religious rules.</p>'},
{lb:'Be holy, for God is holy',dr:dQ1,ht:'<p><b>1 Peter 1:15-16</b> commands, <em>"Just as he who called you is holy, so be holy in all you do... \'Be holy, because I am holy.\'"</em> &mdash; grounding the call to holiness directly in <b>God\'s own character</b>.</p>'},
{lb:'Holiness as a lifestyle, not a single act',dr:dQ1,ht:'<p>Both passages present holiness not as a one-time decision, but as an ongoing, daily <b>lifestyle</b> of worship, mental renewal, and conduct that reflects God\'s own character consistently.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Romans 12:1 urge believers to offer as \"living sacrifices\"?","o":["Their bodies","Only their money","Only their time","Only their words"],"a":0,"w":"Romans 12:1 urges believers to offer their bodies as living sacrifices."},{"q":"What does Romans 12:1 call this act of offering?","o":["A purely symbolic ritual with no real meaning","\"True and proper worship\"","An outdated Old Testament practice","An optional extra for especially devout believers only"],"a":1,"w":"Romans 12:1 calls this act of offering \"true and proper worship.\""},{"q":"What does Romans 12:2 instruct believers not to do?","o":["Ever renew their minds","Ever change their behaviour at all","Conform to the pattern of this world","Worship God in any form"],"a":2,"w":"Romans 12:2 instructs believers not to conform to the pattern of this world."},{"q":"What does Romans 12:2 say believers should be transformed by?","o":["Only their financial status","Only external religious rituals","Only their physical appearance","The renewing of their minds"],"a":3,"w":"Romans 12:2 says believers should be transformed by the renewing of their minds."},{"q":"Which epistle contains the command \"Be holy, because I am holy\"?","o":["1 Peter","Romans","Galatians","Ephesians"],"a":0,"w":"1 Peter contains the command \"Be holy, because I am holy\" (1 Peter 1:16)."},{"q":"What does 1 Peter 1:15-16 ground the call to holiness in?","o":["Human tradition alone","God's own holy character","Cultural expectations alone","Personal preference alone"],"a":1,"w":"1 Peter 1:15-16 grounds the call to holiness in God's own holy character."},{"q":"How do Romans 12 and 1 Peter 1 present holiness?","o":["As something only for religious professionals","As a single event that never needs repeating","As an ongoing, daily lifestyle, not a one-time decision","As entirely optional for genuine believers"],"a":2,"w":"Both passages present holiness as an ongoing, daily lifestyle, not a single one-time decision."},{"q":"What does \"true and proper worship,\" as described in Romans 12:1, extend beyond?","o":["Only financial giving","Only formal church services","Only private prayer","Ritual, into everyday conduct"],"a":3,"w":"\"True and proper worship\" extends beyond ritual into everyday conduct."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS • Acts & Epistles',ti:'One Body, Many Members',su:'Explain Paul\'s teaching on spiritual gifts and unity within the body of Christ.',steps:[
{lb:'Different gifts, one body',dr:dQ2,ht:'<p><b>Romans 12:3-8</b> and <b>1 Corinthians 12</b> teach that believers, though many, form <b>"one body in Christ,"</b> each equipped with different gifts &mdash; prophecy, serving, teaching, encouraging, giving, leadership, and mercy &mdash; to be exercised according to God\'s grace.</p>'},
{lb:'No gift is unimportant',dr:dQ2,ht:'<p>1 Corinthians 12:14-26 uses the analogy of a physical body, arguing that just as an eye cannot say to a hand, "I don\'t need you," every believer\'s gift, however seemingly small, is <b>necessary</b> to the health of the whole community.</p>'},
{lb:'Humility, not pride, in the use of gifts',dr:dQ2,ht:'<p>Romans 12:3 warns believers not to think of themselves <b>"more highly than you ought,"</b> but to think with sober judgment &mdash; framing spiritual gifts as tools for serving others, not badges of personal status or superiority.</p>'},
{lb:'Practical expressions of gifts',dr:dQ2,ht:'<p>Romans 12:6-8 lists practical examples: if a gift is <b>serving</b>, serve; if <b>teaching</b>, teach; if giving, give generously; if showing mercy, do it <b>cheerfully</b> &mdash; showing spiritual gifts are meant for practical, everyday community life.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What do Romans 12:3-8 and 1 Corinthians 12 teach about believers, despite their differences?","o":["They form \"one body in Christ,\" each with different gifts","They are entirely separate, with no real connection","Only some believers truly belong to the body of Christ","Spiritual gifts are given only to church leaders"],"a":0,"w":"These passages teach that believers, though many, form one body in Christ, each with different gifts."},{"q":"Which of these is listed among the spiritual gifts in Romans 12?","o":["Only prophecy, with no other gifts listed","Teaching","Only leadership, with no other gifts listed","Only giving, with no other gifts listed"],"a":1,"w":"Teaching is listed among the spiritual gifts in Romans 12."},{"q":"What analogy does 1 Corinthians 12:14-26 use to illustrate the body of Christ?","o":["A single brick in a wall","A single tree with many branches","A physical human body, with different parts","A single instrument in an orchestra"],"a":2,"w":"1 Corinthians 12:14-26 uses the analogy of a physical human body with different parts."},{"q":"What does this analogy argue about every believer's gift, however small it may seem?","o":["It belongs only to church leaders, not ordinary believers","It is unimportant compared to more visible gifts","It should be hidden and never used","It is necessary to the health of the whole community"],"a":3,"w":"This analogy argues that every believer's gift, however small, is necessary to the health of the whole community."},{"q":"What does Romans 12:3 warn believers against?","o":["Thinking of themselves more highly than they ought","Ever using their spiritual gifts at all","Ever serving others in any way","Having any gifts at all"],"a":0,"w":"Romans 12:3 warns believers against thinking of themselves more highly than they ought."},{"q":"How does Romans 12:3 say believers should think of themselves instead?","o":["With excessive pride","With sober judgment","With complete self-hatred","With total indifference to their own gifts"],"a":1,"w":"Romans 12:3 says believers should think of themselves with sober judgment."},{"q":"How does Romans 12:8 say a gift of showing mercy should be exercised?","o":["Only when convenient","Reluctantly","Cheerfully","Only in private, never publicly"],"a":2,"w":"Romans 12:8 says a gift of showing mercy should be exercised cheerfully."},{"q":"What is the overall purpose of spiritual gifts, according to this lesson?","o":["Private use only, with no benefit to the wider community","Personal status and recognition within the church","Competition among believers for the most impressive gift","Practical service within the community, not personal status"],"a":3,"w":"The overall purpose of spiritual gifts is practical service within the community, not personal status."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS • Acts & Epistles',ti:'WAEC Exam Preparation — Christian Living',su:'Practise WAEC-style questions on Christian living in the Epistles.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on Christian living: (1) Identify the <b>specific passage or theme</b> asked about. (2) Give the <b>precise Bible reference</b>. (3) Explain the <b>teaching</b> clearly. (4) Draw out a <b>practical application</b> for Christian life today.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "Explain what it means to be a \'new creation\' in Christ." / "Distinguish between the works of the flesh and the fruit of the Spirit." / "Discuss Paul\'s teaching on love in 1 Corinthians 13." / "What does the Bible teach about holy living?"</p>'},
{lb:'Key references to remember',dr:dQ1,ht:'<p>Key references: <b>2 Corinthians 5:17</b> (new creation); <b>Romans 6</b> (dying to sin); <b>Ephesians 4</b> (put off/put on); <b>Galatians 5</b> (fruit of the Spirit); <b>Galatians 2:20, Hebrews 11</b> (faith); <b>1 Corinthians 13</b> (love); <b>Romans 12, 1 Peter 1</b> (holy living/one body).</p>'},
{lb:'Applying teaching to daily life',dr:dQ1,ht:'<p>WAEC essays should always connect biblical teaching to <b>practical daily conduct</b> &mdash; honesty, kindness, forgiveness, humble use of gifts &mdash; rather than treating these passages as only abstract theology.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on Christian living?","o":["Identify the specific passage or theme asked about","Immediately give a personal opinion with no facts","List unrelated facts with no explanation","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on Christian living should begin by identifying the specific passage or theme asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Distinguish between the works of the flesh and the fruit of the Spirit.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"Distinguish between the works of the flesh and the fruit of the Spirit\" is a typical WAEC-style question on this topic."},{"q":"Which verse should be cited when discussing being a \"new creation\" in Christ?","o":["Galatians 5:22","Romans 6:4","2 Corinthians 5:17","1 Corinthians 13:1"],"a":2,"w":"2 Corinthians 5:17 should be cited when discussing being a \"new creation\" in Christ."},{"q":"Which chapter should be cited when discussing the fruit of the Spirit?","o":["1 Corinthians 13","Romans 6","Ephesians 4","Galatians 5"],"a":3,"w":"Galatians 5 should be cited when discussing the fruit of the Spirit."},{"q":"Which chapter should be cited when discussing Paul's teaching on love?","o":["1 Corinthians 13","Romans 12","Ephesians 4","Galatians 5"],"a":0,"w":"1 Corinthians 13 should be cited when discussing Paul's teaching on love."},{"q":"Which chapters should be cited when discussing holy living and one body/many gifts?","o":["1 Corinthians 13 only","Romans 12 and 1 Peter 1","Galatians 5 only","Ephesians 4 only"],"a":1,"w":"Romans 12 and 1 Peter 1 should be cited when discussing holy living and spiritual gifts."},{"q":"Why should WAEC essays connect biblical teaching to practical daily conduct?","o":["Only abstract theology should ever be discussed","Practical application is irrelevant to WAEC marking","It shows the theology remains relevant to real Christian life, not just abstract ideas","WAEC forbids discussing daily life applications"],"a":2,"w":"Connecting to practical daily conduct shows the theology remains relevant to real Christian life, which WAEC rewards."},{"q":"What should a strong WAEC essay conclusion on Christian living include?","o":["A criticism of the Bible's reliability","Only a repetition of the Bible reference, with no further comment","An unrelated historical fact","A practical application for Christian life today"],"a":3,"w":"A strong conclusion should include a practical application for Christian life today."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS • Acts & Epistles',ti:'Mixed Questions — Christian Living',su:'Integrated revision across the key themes of Christian living in the Epistles.',steps:[
{lb:'Summary of key themes',dr:dQ2,ht:'<p>Christian living flows from being a <b>new creation</b> (2 Cor 5:17), dying to sin and living for God (Romans 6), putting off the old self for the new (Ephesians 4), bearing the <b>fruit of the Spirit</b> (Galatians 5), living by faith, prioritising <b>love</b> above all (1 Corinthians 13), pursuing holiness, and serving within the body of Christ using one\'s gifts.</p>'},
{lb:'Key references to remember',dr:dQ2,ht:'<p>Must-know facts: <b>2 Corinthians 5:17</b> (new creation); <b>Romans 6:23</b> (wages of sin/gift of God); <b>Ephesians 4:22-24</b> (old/new self); <b>Galatians 5:22-23</b> (fruit of the Spirit, 9 qualities); <b>1 Corinthians 13:13</b> (faith, hope, love — greatest is love); <b>Romans 12:1-2</b> (living sacrifice, renewed mind).</p>'},
{lb:'Lessons for today',dr:dQ2,ht:'<p>These teachings call Christians today to a lived-out faith &mdash; not merely believing correct doctrine, but genuinely being transformed in character, relationships and daily conduct through the ongoing work of the Holy Spirit.</p>'},
{lb:'Final exam tips',dr:dQ2,ht:'<p>Always give the <b>precise Bible reference</b>, explain the teaching <b>clearly and accurately</b>, and conclude by connecting the passage to a practical, everyday application of Christian living.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which verse declares that believers in Christ are a \"new creation\"?","o":["2 Corinthians 5:17","Romans 6:4","Galatians 5:22","1 Corinthians 13:1"],"a":0,"w":"2 Corinthians 5:17 declares that believers in Christ are a new creation."},{"q":"What does Romans 6:23 say is \"the wages of sin\"?","o":["Eternal life","Death","Wealth","Happiness"],"a":1,"w":"Romans 6:23 says the wages of sin is death."},{"q":"What imagery does Ephesians 4:22-24 use for spiritual transformation?","o":["Planting a new garden","Building a new house","Putting off old clothes and putting on new clothes","Sailing to a new land"],"a":2,"w":"Ephesians 4:22-24 uses the imagery of putting off old clothes and putting on new ones."},{"q":"How many qualities make up the \"fruit of the Spirit\" in Galatians 5:22-23?","o":["Three","Five","Twelve","Nine"],"a":3,"w":"Nine qualities make up the fruit of the Spirit."},{"q":"According to 1 Corinthians 13:13, which of faith, hope and love is \"the greatest\"?","o":["Love","Faith","Hope","They are all exactly equal"],"a":0,"w":"According to 1 Corinthians 13:13, love is the greatest of faith, hope and love."},{"q":"What does Romans 12:1 call the act of offering one's body as a living sacrifice?","o":["An outdated Old Testament ritual","\"True and proper worship\"","A purely symbolic act with no real meaning","An optional practice for especially devout believers"],"a":1,"w":"Romans 12:1 calls this \"true and proper worship.\""},{"q":"What analogy is used in 1 Corinthians 12 to describe believers with different spiritual gifts?","o":["A single instrument in an orchestra","A single tree with many branches","A physical human body with different parts","A single brick in a wall"],"a":2,"w":"1 Corinthians 12 uses the analogy of a physical human body with different parts."},{"q":"What overall lesson unites all the themes studied in this topic?","o":["A set of separate, unrelated teachings with no common theme","Correct doctrine alone, with no practical application needed","Rules to follow with no relationship to genuine faith","Genuine transformation in character and conduct, flowing from new life in Christ"],"a":3,"w":"The unifying lesson is genuine transformation in character and conduct, flowing from new life in Christ."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
