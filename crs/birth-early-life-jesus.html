<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}

.ht{font-size:15px;font-weight:700;}

.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}

.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}

.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}

.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}

.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}

var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Annunciation and Birth of Jesus',ACC,12,'middle',true));
[['Event','Reference','Key detail'],['Annunciation to Mary','Luke 1:26-38','Angel Gabriel; \"Greetings, favoured one!\"'],['Mary visits Elizabeth','Luke 1:39-45','Elizabeth: \"Blessed are you among women\"'],['Mary\'s Magnificat','Luke 1:46-55','\"My soul glorifies the Lord\"'],['Joseph\'s dream','Matthew 1:18-25','Angel: \"Do not be afraid to take Mary\"'],['Birth in Bethlehem','Luke 2:1-7','No room in inn; laid in a manger'],['Angels to shepherds','Luke 2:8-20','\"Good news of great joy for all people\"'],['Magi from the East','Matthew 2:1-12','Followed a star; brought gold, frankincense, myrrh']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(130,34+i*28,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(255,34+i*28,r[1],'#555',7,'middle',false));o.push(T(400,34+i*28,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}

o.push(T(240,20,'The Early Life of Jesus',ACC,12,'middle',true));

s.innerHTML=o.join('');}

function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Birth & Early Life — Summary',ACC,13,'middle',true));
[['Annunciation','Gabriel to Mary: \"You will conceive and give birth to a Son\"'],['Mary\'s response','\"I am the Lord\'s servant. May your word be fulfilled.\" (Lk 1:38)'],['Birth','Bethlehem; manger; shepherds; angels announce (Luke 2)'],['Magi','East; star; gold/frankincense/myrrh; warned not to return to Herod'],['Flight/Return','Egypt; return after Herod\'s death; Nazareth'],['Temple at 12','\"Did you not know I must be in my Father\'s house?\" (Lk 2:49)'],['WAEC tip','Know annunciation, birth, magi, presentation, temple at 12 with references']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,9,'middle',true));o.push(T(320,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Gospels',ti:'The Annunciation',su:'Examine the announcement of Jesus\' birth to Mary (Luke 1:26-38).',steps:[
{lb:'Gabriel appears to Mary',dr:dQ1,ht:'<p>In the sixth month of Elizabeth\'s pregnancy, God sent the angel Gabriel to Nazareth to a virgin named Mary, pledged to Joseph. Gabriel greeted her: <em>"Greetings, you who are highly favoured! The Lord is with you"</em> (Lk.1:28). Mary was greatly troubled and wondered what kind of greeting this was. Gabriel told her not to be afraid: she had found favour with God. She would conceive and give birth to a son called <b>Jesus</b>, who would be great, called the Son of the Most High, and given David\'s throne forever.</p>'},
{lb:'Mary\'s question and Gabriel\'s answer',dr:dQ1,ht:'<p>Mary asked: <em>"How will this be, since I am a virgin?"</em> (Lk.1:34). Gabriel answered: <em>"The Holy Spirit will come on you, and the power of the Most High will overshadow you. So the holy one to be born will be called the Son of God"</em> (Lk.1:35). Gabriel also told her that her relative Elizabeth was six months pregnant — <em>"For no word from God will ever fail"</em> (Lk.1:37). Mary\'s question was one of genuine inquiry (how?), not unbelief — unlike Zechariah who had been struck mute for doubting.</p>'},
{lb:'Mary\'s acceptance — the Fiat',dr:dQ1,ht:'<p>Mary responded: <em>"I am the Lord\'s servant. May your word to me be fulfilled"</em> (Lk.1:38). This response — called the <b>Fiat</b> (Latin: "let it be done") — is the model of faithful surrender to God\'s will. Mary accepted: (1) the miraculous nature of the conception; (2) the social risk (betrothed but pregnant); (3) the sovereign plan of God. Her willingness contrasts with human attempts to control God\'s plans. She is called "blessed among women" (Lk.1:42) and "the mother of my Lord" by Elizabeth.</p>'},
{lb:'Significance of the Annunciation',dr:dQ1,ht:'<p>Theological significance: (1) Jesus\'s divine origin — conceived by the Holy Spirit, not by human means. (2) Jesus fulfils OT prophecy — Isaiah 7:14 ("the virgin will conceive"). (3) Jesus is the Son of David — Gabriel mentions David\'s throne (fulfilment of 2 Sam.7). (4) Jesus is the Son of God — unique divine identity. (5) Mary\'s faith is the model for disciples. WAEC: know Gabriel\'s greeting, Mary\'s question, Gabriel\'s answer about the Holy Spirit, and Mary\'s Fiat with the reference Luke 1:26-38.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The angel who appeared to Mary at the Annunciation was:',o:['Michael','Raphael','Gabriel','Uriel'],a:3,w:'Gabriel (Luke 1:26) — the same angel who appeared to Zechariah (Luke 1:19) and to Daniel (Daniel 8:16). Gabriel is the angel of divine announcements.'},{q:'Mary asked \"How will this be?\" because:',o:['She did not believe God could do miracles','She was engaged to Joseph and was a virgin','She had already planned to remain single forever','She was afraid of the angel'],a:2,w:'Mary\'s question (Lk 1:34) was about the biological reality — she was a virgin (Greek: parthenos). Her question was genuine inquiry, not disbelief. Gabriel answered that the Holy Spirit would be the agent of conception.'},{q:'Gabriel told Mary that the child would be called Son of God because:',o:['Joseph was a descendant of God through the priesthood','Mary was especially holy','The Holy Spirit would overshadow her — the child\'s origin was divine','He would perform many miracles'],a:3,w:'Luke 1:35 — "The Holy Spirit will come on you, and the power of the Most High will overshadow you. So the holy one to be born will be called the Son of God" — divine conception = divine identity.'},{q:'Mary\'s response "I am the Lord\'s servant. May your word be fulfilled" is called:',o:['The Magnificat','The Benedictus','The Fiat','The Nunc Dimittis'],a:3,w:'The Fiat (Latin: "let it be done") — Mary\'s willing surrender to God\'s will (Luke 1:38). The Magnificat is her song of praise (1:46-55); the Benedictus is Zechariah\'s (1:68-79); the Nunc Dimittis is Simeon\'s (2:29-32).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Gospels',ti:'The Birth of Jesus',su:'Examine the birth narratives in Matthew and Luke.',steps:[
{lb:'The birth (Luke 2:1-7)',dr:dQ1,ht:'<p>Caesar Augustus decreed a census of the whole Roman world. Joseph took Mary from Nazareth to Bethlehem (his ancestral city, being of David\'s line). While there, Mary gave birth to her firstborn son, wrapped him in cloths and placed him in a <b>manger</b> — because there was no guest room for them. This humble birth fulfilled Micah 5:2: <em>"But you, Bethlehem Ephrathah... out of you will come for me one who will be ruler over Israel."</em> The census served God\'s purpose of bringing Joseph to Bethlehem.</p>'},
{lb:'Angels and shepherds (Luke 2:8-20)',dr:dQ1,ht:'<p>Nearby shepherds were watching their flocks. An angel appeared and the glory of the Lord shone around them — they were terrified. The angel said: <em>"Do not be afraid. I bring you good news that will cause great joy for all the people. Today in the town of David a Saviour has been born to you; he is the Messiah, the Lord"</em> (Lk.2:10-11). The sign: a baby wrapped in cloths in a manger. A multitude of angels praised God: <em>"Glory to God in the highest heaven, and on earth peace to those on whom his favour rests"</em> (Lk.2:14).</p>'},
{lb:'The Magi (Matthew 2:1-12)',dr:dQ2,ht:'<p>Magi from the East came to Jerusalem asking: <em>"Where is the one who has been born king of the Jews? We saw his star when it rose and have come to worship him"</em> (Mt.2:2). Herod was disturbed. Chief priests identified Bethlehem from Micah 5:2. The Magi followed the star to the house, bowed down and worshipped Jesus, and presented gifts: <b>gold</b> (kingship), <b>frankincense</b> (divinity/priesthood), <b>myrrh</b> (suffering/death). Warned in a dream, they returned by another route.</p>'},
{lb:'Flight to Egypt and return (Matthew 2:13-23)',dr:dQ2,ht:'<p>Herod, furious at being outwitted, ordered the massacre of all boys under two in Bethlehem — the <b>Massacre of the Innocents</b> (fulfilling Jeremiah 31:15: "A voice is heard in Ramah... Rachel weeping for her children"). Joseph had been warned in a dream and fled with Mary and Jesus to Egypt (fulfilling Hosea 11:1: "Out of Egypt I called my son"). After Herod died, the family returned and settled in Nazareth (fulfilling: "He will be called a Nazarene").</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Jesus was born in Bethlehem because:',o:['Mary chose Bethlehem for safety','A Roman census required Joseph to register in his ancestral city of Bethlehem','Bethlehem was the largest city near Nazareth','An angel told them to go to Bethlehem'],a:2,w:'Luke 2:1-4 — Caesar Augustus\' census required everyone to register in their hometown. Joseph was of the house of David, whose city was Bethlehem. God used the census to fulfil Micah\'s prophecy (5:2).'},{q:'The angel told the shepherds the sign by which they would find the baby:',o:['A bright star shining over the stable','Wrapped in cloths and lying in a manger','Surrounded by animals and angels','Held by a woman dressed in blue'],a:2,w:'Luke 2:12 — "This will be a sign to you: You will find a baby wrapped in cloths and lying in a manger." The manger (animal feeding trough) was the unlikely sign of the Messiah\'s birth.'},{q:'The gifts of the Magi — gold, frankincense and myrrh — symbolise respectively:',o:['Wealth, worship and medicine','Kingship, divinity/priesthood and suffering/death','Power, purity and healing','History, prophecy and fulfilment'],a:2,w:'Gold = kingship (Jesus is King). Frankincense = divinity/priesthood (burned in temple worship). Myrrh = suffering and death (used in burial ointments) — all pointing to who Jesus is and what he came to do.'},{q:'Herod ordered the Massacre of the Innocents. Jesus escaped because:',o:['Herod changed his mind after speaking with the Magi','An angel appeared to the Magi to protect Jesus','Joseph was warned in a dream and fled with Mary and Jesus to Egypt','The shepherds hid the family in their fields'],a:3,w:'Matthew 2:13 — "an angel of the Lord appeared to Joseph in a dream. \'Get up,\' he said, \'take the child and his mother and escape to Egypt.\'" The family fled before Herod\'s soldiers arrived.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Gospels',ti:'Presentation and Early Childhood',su:'Examine the Presentation in the Temple and Jesus at age 12.',steps:[
{lb:'Presentation in the Temple (Luke 2:22-38)',dr:dQ2,ht:'<p>In accordance with Mosaic Law (Lev.12), Mary and Joseph brought Jesus to the Jerusalem temple to be consecrated to God and to offer a sacrifice (a pair of doves — the offering of the poor, showing the family\'s humble means). Simeon, a righteous man who had been promised he would see the Messiah before death, took the child and praised God: <em>"Sovereign Lord... my eyes have seen your salvation, which you have prepared in the sight of all nations: a light for revelation to the Gentiles, and the glory of your people Israel"</em> (Lk.2:29-32) — the <b>Nunc Dimittis</b>.</p>'},
{lb:'Simeon\'s prophecy and Anna',dr:dQ2,ht:'<p>Simeon also told Mary: <em>"This child is destined to cause the falling and rising of many in Israel... And a sword will pierce your own soul too"</em> (Lk.2:34-35) — a prophecy of Mary\'s future grief at the crucifixion. The prophetess <b>Anna</b> (84 years old, who had been fasting and praying in the temple for decades) also gave thanks to God and "spoke about the child to all who were looking forward to the redemption of Jerusalem" (Lk.2:38). Both Simeon and Anna represent the faithful remnant of Israel awaiting the Messiah.</p>'},
{lb:'Jesus in the Temple at 12 (Luke 2:41-52)',dr:dQ2,ht:'<p>Every year Jesus\' family went to Jerusalem for Passover. When Jesus was twelve, he stayed behind in the temple while his parents returned to Nazareth. After three days, they found him sitting with the teachers, listening and asking questions — <em>"Everyone who heard him was amazed at his understanding and his answers"</em> (Lk.2:47). Mary said: "Son, why have you treated us like this?" Jesus replied: <em>"Did you not know I had to be in my Father\'s house?"</em> (Lk.2:49) — his first recorded words, asserting his unique relationship with God.</p>'},
{lb:'The hidden years and growth',dr:dQ2,ht:'<p>Luke 2:52 summarises Jesus\'s development: <em>"And Jesus grew in wisdom and stature, and in favour with God and man."</em> This single verse covers approximately 18 years (ages 12–30) — known as the "hidden years" or "silent years." It shows that Jesus\'s development was fully human: intellectual (wisdom), physical (stature), spiritual (favour with God) and social (favour with man). The Incarnation means Jesus truly grew as a human being while remaining the Son of God. Joseph is last mentioned here; he was probably dead before Jesus\' public ministry.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The song Simeon sang when he held the baby Jesus is called:',o:['The Magnificat','The Benedictus','The Nunc Dimittis','The Gloria'],a:3,w:'The Nunc Dimittis (Latin: "Now dismiss") — Luke 2:29-32. Simeon\'s song of praise and release, having seen the Messiah. The Magnificat (1:46-55) is Mary\'s; the Benedictus (1:68-79) is Zechariah\'s.'},{q:'Simeon\'s prophecy "A sword will pierce your own soul too" was addressed to:',o:['Elizabeth','Mary','Anna','The High Priest'],a:2,w:'Luke 2:35 — spoken to Mary, foreshadowing the grief she would experience at the crucifixion of her son. It is one of the most poignant prophecies in Luke\'s Gospel.'},{q:'When Jesus was found in the temple at age 12, what was he doing?',o:['Teaching the scribes about the Law','Sitting with the teachers, listening and asking questions','Praying alone in the temple courts','Helping the priests with sacrifices'],a:2,w:'Luke 2:46-47 — "sitting among the teachers, listening to them and asking them questions. Everyone who heard him was amazed at his understanding and his answers." Active engagement with Torah learning.'},{q:'Jesus\'s response "Did you not know I had to be in my Father\'s house?" (Lk 2:49) is significant because:',o:['It shows Jesus was being disrespectful to his parents','It is his first recorded statement, revealing his awareness of his unique relationship with God','It proves Jesus attended synagogue school in Nazareth','It means Jesus refused to obey human authority'],a:2,w:'Luke 2:49 — Jesus\' first recorded words. They reveal his self-awareness as the Son of God with a special relationship to the Father — even at 12. The response puzzled Mary and Joseph but Luke notes Mary "treasured all these things in her heart" (2:51).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Gospels',ti:'The Baptism of Jesus',su:'Examine the baptism of Jesus and its significance (Matthew 3:13-17).',steps:[
{lb:'John the Baptist\'s ministry',dr:dQ1,ht:'<p>John the Baptist came preaching in the desert: <em>"Repent, for the kingdom of heaven has come near"</em> (Mt.3:2). He baptised people in the Jordan River, calling them to repentance and confess their sins. John wore camel\'s hair and ate locusts and wild honey — deliberately echoing the prophet Elijah (2Kgs.1:8). He was the fulfilment of Isaiah 40:3: <em>"A voice of one calling in the wilderness, \'Prepare the way for the Lord.\'"</em> He warned the Pharisees and Sadducees coming for baptism: <em>"You brood of vipers! Who warned you to flee from the coming wrath?"</em> (Mt.3:7).</p>'},
{lb:'Jesus comes to be baptised (Matthew 3:13-15)',dr:dQ1,ht:'<p>Jesus came from Galilee to the Jordan to be baptised by John. John tried to prevent him: <em>"I need to be baptised by you, and do you come to me?"</em> (Mt.3:14). Jesus insisted: <em>"Let it be so now; it is proper for us to do this to fulfil all righteousness"</em> (Mt.3:15). Jesus had no sin to confess — his baptism was not for personal repentance. Rather, it was: (1) identification with sinful humanity; (2) inauguration of his public ministry; (3) fulfilment of God\'s righteous plan.</p>'},
{lb:'The heavenly affirmation (Matthew 3:16-17)',dr:dQ2,ht:'<p>As Jesus came up out of the water, heaven was opened and he saw the Spirit of God descending like a dove and landing on him. Then a voice from heaven said: <em>"This is my Son, whom I love; with him I am well pleased"</em> (Mt.3:17). This moment is a <b>Trinitarian revelation</b>: the Son being baptised; the Holy Spirit descending as a dove; the Father speaking from heaven. The dove symbolises peace and divine approval. The Father\'s words echo Psalm 2:7 ("You are my Son") and Isaiah 42:1 ("my chosen one in whom I delight").</p>'},
{lb:'Significance of the baptism',dr:dQ2,ht:'<p>The baptism of Jesus is significant: (1) <b>Divine endorsement</b> — the Father declares Jesus His beloved Son. (2) <b>Anointing</b> — the Spirit descends to equip Jesus for ministry (like OT anointing of kings/prophets). (3) <b>Identification</b> — Jesus stands with sinful humanity he came to save. (4) <b>Public beginning</b> — the baptism marks the start of his 3-year public ministry. (5) <b>Trinitarian</b> — all three persons of the Trinity are present and active. WAEC: know Matthew 3:13-17; John\'s objection; Jesus\' response; the dove and the voice.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'John the Baptist\'s objection to baptising Jesus was:',o:['Jesus was too important and should go to the Temple instead','John himself needed to be baptised by Jesus, not the reverse','Jesus had already been baptised by God in heaven','John did not recognise Jesus at the Jordan'],a:2,w:'Matthew 3:14 — John said "I need to be baptised by you, and do you come to me?" — John recognised Jesus\' superior holiness and felt unworthy to baptise him. Jesus insisted, to "fulfil all righteousness."'},{q:'The voice from heaven at Jesus\' baptism said:',o:['"You are my Son; today I have become your Father"','"This is my Son, whom I love; with him I am well pleased"','"Behold the Lamb of God, who takes away the sin of the world"','"Go and make disciples of all nations"'],a:2,w:'Matthew 3:17 — "This is my Son, whom I love; with him I am well pleased." The Father publicly endorses Jesus at the outset of his ministry. The words echo Psalm 2:7 and Isaiah 42:1.'},{q:'The Holy Spirit descended at Jesus\' baptism in the form of:',o:['A pillar of fire','A dove','A rushing wind','A cloud of glory'],a:2,w:'Matthew 3:16 — "he saw the Spirit of God descending like a dove and alighting on him." The dove symbolises peace and divine favour — the Spirit anointing Jesus for his ministry.'},{q:'The baptism of Jesus was a Trinitarian moment because:',o:['It happened three times in three rivers','Father, Son and Holy Spirit were all present and active simultaneously','The number three appears three times in the account','John baptised in the name of the Trinity'],a:2,w:'All three persons of the Trinity are simultaneously present: the Son is baptised; the Holy Spirit descends as a dove; the Father speaks from heaven — one of the clearest Trinitarian moments in the Gospels.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Gospels',ti:'The Temptation of Jesus',su:'Examine the temptation of Jesus in the wilderness (Matthew 4:1-11).',steps:[
{lb:'Into the wilderness (Matthew 4:1-2)',dr:dQ2,ht:'<p>After his baptism, Jesus was <em>"led by the Spirit into the wilderness to be tempted by the devil"</em> (Mt.4:1). He fasted for <b>forty days and forty nights</b> — echoing Moses\' forty days on Sinai (Ex.34:28) and Israel\'s forty years in the wilderness. The number forty in Scripture typically indicates a period of testing and preparation. After forty days of fasting, Jesus was hungry — the temptations came at his point of greatest physical weakness. The devil ("diabolos" — the accuser) came to test him.</p>'},
{lb:'The three temptations',dr:dQ2,ht:'<p>Temptation 1 — <b>Bread from stones</b> (Mt.4:3-4): "If you are the Son of God, tell these stones to become bread." Jesus replied from Deuteronomy 8:3: <em>"Man shall not live on bread alone, but on every word that comes from the mouth of God."</em> Temptation 2 — <b>Jump from the temple pinnacle</b> (Mt.4:5-7): The devil quoted Psalm 91. Jesus replied: Deut.6:16: <em>"Do not put the Lord your God to the test."</em> Temptation 3 — <b>All kingdoms for worship</b> (Mt.4:8-10): Jesus replied: Deut.6:13: <em>"Worship the Lord your God, and serve him only."</em></p>'},
{lb:'Nature of the temptations',dr:dQ2,ht:'<p>Each temptation targeted a different area: (1) <b>Physical needs</b> — use power for self-provision (bread). (2) <b>Pride/presumption</b> — force God\'s hand through a spectacular sign. (3) <b>Power/compromise</b> — achieve God\'s ends (world dominion) by Satan\'s means (worship). These mirror the three categories in 1 John 2:16: "the lust of the flesh, the lust of the eyes, and the pride of life." Jesus overcame each with <b>Scripture</b> — specifically three quotations from Deuteronomy 6-8 (Israel\'s wilderness instructions). Where Israel failed in the wilderness, Jesus succeeded.</p>'},
{lb:'Significance and application',dr:dQ2,ht:'<p>The temptation shows: (1) Jesus was fully human — genuinely tempted, not just acting. (2) Jesus was sinless — he overcame every temptation. (3) Scripture is the weapon against temptation — Jesus used Deuteronomy, not miracles. (4) Jesus identified with Israel\'s wilderness experience but succeeded where Israel failed. (5) Satan uses Scripture (Ps.91 in temptation 2) — but misquotes it by removing context; Jesus corrected with proper interpretation. After the temptations, angels came and ministered to Jesus (Mt.4:11). WAEC: know all three temptations, Jesus\' three responses from Deuteronomy, and the significance.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'How long did Jesus fast in the wilderness before the temptations began?',o:['Twelve days','Twenty-one days','Forty days and forty nights','Seven weeks'],a:3,w:'Matthew 4:2 — "after fasting forty days and forty nights, he was hungry." The number forty echoes Moses on Sinai and Israel in the wilderness — periods of testing and divine preparation.'},{q:'Jesus answered each temptation by quoting from:',o:['The Psalms','Isaiah','Genesis','Deuteronomy (chapters 6-8)'],a:4,w:'All three of Jesus\' responses come from Deuteronomy 6-8: Deut.8:3 (bread/word); Deut.6:16 (do not test God); Deut.6:13 (worship God only). These were Moses\' instructions to Israel facing wilderness temptations.'},{q:'The third temptation offered Jesus "all the kingdoms of the world" in exchange for:',o:['Turning stones into bread','Performing a miracle in Jerusalem','Worshipping Satan','Denying his divine sonship'],a:3,w:'Matthew 4:8-9 — Satan showed Jesus all the kingdoms of the world and offered them in exchange for falling down and worshipping him. Jesus refused: "Worship the Lord your God, and serve him only" (Deut.6:13).'},{q:'The temptation of Jesus is significant for Christians because:',o:['It shows Jesus was uncertain about his own identity','It proves the devil is stronger than angels','It demonstrates that Jesus genuinely faced temptation and overcame it — he can help those who are tempted','It shows that fasting always leads to spiritual victory'],a:3,w:'Hebrews 4:15 — "we have one who has been tempted in every way, just as we are — yet he did not sin." Jesus\' victory in the wilderness means he is able to help believers who face temptation (Heb.4:16).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 Gospels',ti:'Jesus and John the Baptist',su:'Examine John\'s role as forerunner and his relationship with Jesus.',steps:[
{lb:'John\'s identity and mission',dr:dQ1,ht:'<p>John the Baptist was the forerunner of Jesus — prophesied in Isaiah 40:3 ("A voice calling in the wilderness") and Malachi 3:1 ("I will send my messenger ahead of you"). Jesus later identified John as the Elijah who was to come (Mt.11:14; Mal.4:5). John\'s mission was to prepare Israel for the Messiah: (1) Call to repentance. (2) Baptism of water as a symbol of cleansing. (3) Identification of Jesus as the Messiah. John came "in the spirit and power of Elijah" (Lk.1:17) — not as a reincarnation but in a similar prophetic role.</p>'},
{lb:'John\'s testimony to Jesus',dr:dQ1,ht:'<p>John testified: <em>"After me comes one who is more powerful than I, whose sandals I am not worthy to carry. He will baptise you with the Holy Spirit and fire"</em> (Mt.3:11). John\'s baptism was with water for repentance; Jesus\' baptism would be with the Holy Spirit — bringing inner transformation, not just outward symbol. When Jesus was pointed out, John declared: <em>"Look, the Lamb of God, who takes away the sin of the world!"</em> (Jn.1:29) — identifying Jesus as the ultimate sacrifice, fulfilling the OT sacrificial system.</p>'},
{lb:'John\'s imprisonment and question (Matthew 11:2-11)',dr:dQ2,ht:'<p>Herod Antipas imprisoned John for condemning his marriage to Herodias (his brother Philip\'s wife). From prison, John sent disciples to ask Jesus: <em>"Are you the one who is to come, or should we expect someone else?"</em> (Mt.11:3). Jesus replied with evidence from his miracles (echoing Isaiah 35:5-6 and 61:1): "the blind receive sight, the lame walk, those with leprosy are cleansed, the deaf hear, the dead are raised, and the good news is proclaimed to the poor." Jesus praised John: <em>"Among those born of women there has not risen anyone greater than John the Baptist"</em> (Mt.11:11).</p>'},
{lb:'John\'s death and its significance',dr:dQ2,ht:'<p>Herod had John beheaded at Herodias\'s request, prompted by her daughter Salome\'s dance (Mt.14:1-12; Mk.6:14-29). John\'s death foreshadowed Jesus\' own: (1) Both were killed by corrupt political rulers. (2) Both challenged the powerful at personal cost. (3) Both died in faithfulness to their mission. (4) John\'s disciples came and buried him, then told Jesus. Jesus withdrew to a solitary place — beginning the final phase leading to the crucifixion. John is a model of prophetic courage: he confronted Herod\'s sin regardless of the personal cost.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'John the Baptist\'s role as forerunner was prophesied in:',o:['Ezekiel 37 and Joel 2','Isaiah 40:3 and Malachi 3:1','Deuteronomy 18 and Numbers 11','Psalm 22 and Isaiah 53'],a:2,w:'Isaiah 40:3 ("A voice calling in the wilderness, prepare the way for the Lord") and Malachi 3:1 ("I will send my messenger ahead of you") — both quoted in the Gospels as fulfilled by John the Baptist.'},{q:'John declared "Look, the Lamb of God, who takes away the sin of the world!" This identifies Jesus as:',o:['A gentle shepherd who cares for his flock','The ultimate sacrifice for sin, fulfilling the OT sacrificial system','A person who was meek and mild in personality','The Passover lamb eaten at the Last Supper only'],a:2,w:'John 1:29 — "Lamb of God" identifies Jesus as the fulfilment of all OT sacrifices, particularly the Passover lamb (Ex.12) and the suffering servant of Isaiah 53:7. Jesus\' death would take away (not merely cover) sin.'},{q:'John was imprisoned by Herod because:',o:['He refused to pay Roman taxes','He condemned Herod\'s unlawful marriage to Herodias, his brother Philip\'s wife','He baptised members of Herod\'s army','He declared himself to be the Messiah'],a:2,w:'Matthew 14:3-4 — Herod had arrested John because John had said: "It is not lawful for you to have her" — Herodias was Philip\'s wife. John\'s prophetic courage in confronting power led to his imprisonment and death.'},{q:'When John\'s disciples asked if Jesus was "the one to come," Jesus replied by:',o:['Quoting Psalm 2 about the Son of God','Performing a miracle to prove his identity','Pointing to his works: blind see, lame walk, deaf hear, dead raised, poor hear good news','Referring them to his baptism by John'],a:3,w:'Matthew 11:4-5 — Jesus pointed to the evidence of his messianic works, echoing Isaiah 35:5-6 and 61:1. His deeds confirmed his identity more than any verbal claim.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 Gospels',ti:'Old Testament Prophecies Fulfilled',su:'Examine how the birth and early life of Jesus fulfilled OT prophecy.',steps:[
{lb:'The role of fulfilment in Matthew',dr:dQ2,ht:'<p>Matthew\'s Gospel is particularly structured around OT fulfilment — he uses the formula <em>"This was to fulfil what was spoken by the prophet"</em> repeatedly. Key fulfilments in the birth narrative: (1) <b>Isaiah 7:14</b>: "The virgin will conceive and give birth to a son, and will call him Immanuel" — Matthew quotes this at Mt.1:23. (2) <b>Micah 5:2</b>: "But you, Bethlehem... out of you will come... one who will be ruler over Israel" — Mt.2:6. (3) <b>Hosea 11:1</b>: "Out of Egypt I called my son" — the flight and return, Mt.2:15.</p>'},
{lb:'Further fulfilments',dr:dQ2,ht:'<p>Continued fulfilments in Matthew 2: (4) <b>Jeremiah 31:15</b>: "A voice heard in Ramah... Rachel weeping for her children" — the Massacre of the Innocents (Mt.2:18). (5) <b>"He will be called a Nazarene"</b> — return to Nazareth (Mt.2:23). (6) <b>Isaiah 40:3 / Malachi 3:1</b>: John the Baptist\'s preparation (Mt.3:3). (7) <b>Psalm 2:7 / Isaiah 42:1</b>: The Father\'s words at baptism (Mt.3:17). (8) <b>Deuteronomy 6-8</b>: Jesus\' three responses in temptation (Mt.4:4,7,10).</p>'},
{lb:'Immanuel — God with us',dr:dQ1,ht:'<p>The name <b>Immanuel</b> (Hebrew: God-with-us) from Isaiah 7:14 is the theological centre of the Incarnation. Matthew frames his Gospel with this theme: at the beginning, "they will call him Immanuel" (1:23); at the end, "I am with you always, to the very end of the age" (28:20). The Incarnation means God did not remain remote — He entered human history, was born as a baby, grew up, was tempted, suffered and died. This "God with us" is the heart of Christian faith and the basis of mission.</p>'},
{lb:'Significance for faith',dr:dQ2,ht:'<p>The fulfilment of prophecy in Jesus\' life teaches: (1) The Bible is a unified story — OT and NT form one coherent whole. (2) God is sovereign in history — events centuries apart connect in His plan. (3) Jesus is the intended culmination of Israel\'s story. (4) Faith in Jesus is rooted in historical events, not myths. (5) For WAEC: when asked about Jesus fulfilling prophecy, always give the OT text, the NT fulfilment, and the significance. Matthew\'s "fulfilment formula" is a key literary device — know at least five specific prophecy-fulfilment pairs.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The prophecy "The virgin will conceive and give birth to a son, and will call him Immanuel" is from:',o:['Micah 5:2','Jeremiah 31:15','Isaiah 7:14','Hosea 11:1'],a:3,w:'Isaiah 7:14 — quoted in Matthew 1:23. "Immanuel" means "God with us" — the theological heart of the Incarnation. Matthew frames his entire Gospel with this theme of God\'s presence.'},{q:'The prophecy "Out of Egypt I called my son" was fulfilled when:',o:['Moses led Israel out of Egypt','The family returned from Egypt after Herod\'s death','Israel was taken into Babylonian exile','The Israelites crossed the Red Sea'],a:2,w:'Matthew 2:15 applies Hosea 11:1 to Jesus\' return from Egypt after Herod died. Matthew sees Jesus as the true Israel — recapitulating (reliving and perfecting) Israel\'s story.'},{q:'"A voice heard in Ramah... Rachel weeping for her children" (Jeremiah 31:15) is applied to:',o:['Israel\'s exile in Babylon','The destruction of Jerusalem in 70 AD','The Massacre of the Innocents by Herod','Mary\'s grief at the crucifixion'],a:3,w:'Matthew 2:18 applies Jeremiah\'s image of Rachel\'s mourning to the mothers of Bethlehem weeping for their children killed by Herod — continuing the pattern of Jesus\' life recapitulating Israel\'s history.'},{q:'The name "Immanuel" means:',o:['Saviour of the world','King of Israel','Prince of Peace','God with us'],a:4,w:'Immanuel (Hebrew: Im = with; anu = us; El = God) means "God with us." Matthew bookends his Gospel with this theme: the Incarnation (1:23) and the Great Commission\'s promise "I am with you always" (28:20).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 Gospels',ti:'Mary and Joseph — Models of Faith',su:'Examine the faith and role of Mary and Joseph in the birth narratives.',steps:[
{lb:'Joseph\'s faith (Matthew 1:18-25)',dr:dQ1,ht:'<p>When Joseph found Mary was pregnant, he planned to divorce her quietly (Jewish betrothal had legal force). But an angel appeared to him in a dream: <em>"Joseph son of David, do not be afraid to take Mary home as your wife, because what is conceived in her is from the Holy Spirit"</em> (Mt.1:20). Joseph obeyed: <em>"When Joseph woke up, he did what the angel of the Lord had commanded him"</em> (Mt.1:24). Joseph appears in Matthew as a man of dreams, obedience, and legal righteousness — he is called "a righteous man" (Mt.1:19).</p>'},
{lb:'Mary\'s faith and the Magnificat (Luke 1:46-55)',dr:dQ2,ht:'<p>Mary\'s Magnificat (Latin: "magnifies") is one of the great songs of Scripture. Key themes: (1) God\'s mercy to the humble: <em>"He has been mindful of the humble state of his servant"</em> (v.48). (2) God\'s power over the powerful: <em>"He has scattered those who are proud"</em> (v.51); <em>"He has brought down rulers from their thrones but has lifted up the humble"</em> (v.52). (3) God\'s faithfulness: <em>"He has helped his servant Israel, remembering to be merciful to Abraham and his descendants"</em> (v.54-55). The Magnificat echoes Hannah\'s prayer (1Sam.2:1-10).</p>'},
{lb:'Simeon and Anna — the faithful remnant',dr:dQ2,ht:'<p>Simeon and Anna at the Presentation represent the faithful remnant of Israel awaiting the Messiah. Simeon was "righteous and devout" and "the Holy Spirit was on him" (Lk.2:25). He recognised Jesus immediately. Anna "never left the temple but worshipped night and day, fasting and praying" (Lk.2:37) — 84 years old. Both model: (1) Patient, expectant faith. (2) Spirit-filled discernment. (3) Worshipping God in old age. (4) Immediate proclamation when the Messiah arrived. Their joy at seeing Jesus fulfilled their lifelong waiting.</p>'},
{lb:'Mary as model for believers',dr:dQ2,ht:'<p>Mary is honoured in CRS as the model of: (1) <b>Humble acceptance</b> — "I am the Lord\'s servant" (Lk.1:38). (2) <b>Faithful endurance</b> — she stood at the cross (Jn.19:25). (3) <b>Prayerful community</b> — she was in the upper room at Pentecost (Acts 1:14). (4) <b>Pondering heart</b> — "Mary treasured all these things in her heart" (Lk.2:19, 51). She is not worshipped (CRS distinguishes veneration from adoration) but honoured as a supreme example of faith. The title "Blessed among women" (Lk.1:42) acknowledges her unique role in salvation history.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Matthew describes Joseph as "a righteous man" because:',o:['He paid all his taxes and obeyed Roman law','He planned to divorce Mary quietly (protecting her from public disgrace) rather than exposing her','He refused to believe the angel\'s message at first','He built the manger where Jesus was born'],a:2,w:'Matthew 1:19 — "because Joseph her husband was faithful to the law and yet did not want to expose her to public disgrace, he had in mind to divorce her quietly." His righteousness combined legal compliance with personal mercy.'},{q:'Mary\'s Magnificat (Luke 1:46-55) closely resembles:',o:['David\'s lament over Saul','The 23rd Psalm','Hannah\'s prayer (1 Samuel 2:1-10)','The Song of Solomon'],a:3,w:'The Magnificat echoes Hannah\'s prayer (1Sam.2:1-10) in themes: God lifting up the humble, scattering the proud, filling the hungry. Mary, like Hannah, praises God for reversing human expectations through a miraculous birth.'},{q:'Which statement about the Magnificat is TRUE?',o:['It focuses mainly on the glory of the Roman Empire','It celebrates God\'s mercy to the powerful and the rich','It declares that God reverses human power — lifting the humble and bringing down the proud','It is primarily about Mary\'s personal holiness and virtue'],a:3,w:'The Magnificat is a revolutionary song of God\'s reversal of human power: "He has brought down rulers from their thrones but has lifted up the humble. He has filled the hungry with good things but has sent the rich away empty" (Lk.1:52-53).'},{q:'Mary "treasured all these things in her heart" — Luke mentions this twice (2:19, 2:51). This detail suggests:',o:['Mary kept a diary about Jesus\' childhood','Mary was Luke\'s likely source for the birth and childhood narratives','Mary was confused by the events she experienced','Mary was the only one who knew the truth about Jesus\' birth'],a:2,w:'Mary\'s pondering (the Greek word is "symballo" — pondering by comparing) suggests she was reflecting on and interpreting events. Many scholars believe Luke used Mary as a primary source for chapters 1-2 — she would have known these details intimately.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 Gospels',ti:'WAEC Prep — Birth and Early Life',su:'Practise WAEC-style questions on the birth and early life of Jesus.',steps:[
{lb:'WAEC essay approach',dr:dQ1,ht:'<p>For WAEC CRS essays on the birth and early life: (1) State the event clearly with book, chapter and verse. (2) Narrate the key details — who, what, where, when. (3) Explain the theological significance. (4) Draw one lesson for Christians today. Common WAEC questions: "Describe the Annunciation" (Luke 1:26-38). "Give an account of the birth of Jesus" (Luke 2:1-20). "What do the Magi\'s gifts symbolise?" "Describe the Presentation in the Temple." "What happened when Jesus was found in the Temple at 12?" "Describe the temptation of Jesus."</p>'},
{lb:'Key scripture references to memorise',dr:dQ2,ht:'<p>Essential references: Annunciation: Lk.1:26-38 ("I am the Lord\'s servant"). Mary visits Elizabeth: Lk.1:39-45. Magnificat: Lk.1:46-55. Birth in Bethlehem: Lk.2:1-7. Angels to shepherds: Lk.2:8-20 ("Glory to God in the highest"). Magi: Mt.2:1-12 (gold, frankincense, myrrh). Flight to Egypt: Mt.2:13-15. Presentation: Lk.2:22-38 (Simeon\'s Nunc Dimittis). Jesus at 12: Lk.2:41-52 ("my Father\'s house"). Baptism: Mt.3:13-17 ("This is my Son"). Temptation: Mt.4:1-11 (three temptations, three Deuteronomy quotes).</p>'},
{lb:'Common WAEC mistakes to avoid',dr:dQ1,ht:'<p>Avoid: Confusing the Magnificat, Benedictus and Nunc Dimittis (Mary/Zechariah/Simeon). Saying John baptised Jesus with the Holy Spirit (John baptised with water; Jesus baptises with the Holy Spirit). Saying the Magi were at the manger (Matthew says "house" not "stable"; they came later). Saying Jesus sinned before resisting temptation. Confusing Herod the Great (birth narrative) with Herod Antipas (who killed John). Missing the OT fulfilment quotations. Not specifying reference verses — WAEC examiners credit scriptural references.</p>'},
{lb:'Lessons from the birth narrative',dr:dQ2,ht:'<p>Key lessons from Jesus\' birth and early life: (1) God uses ordinary people (shepherds, a poor young woman, a carpenter). (2) God uses ordinary circumstances (a census, a stable, a night shift). (3) God keeps His promises — every OT prophecy is fulfilled. (4) Jesus identified with the poor from birth (manger, dove offering). (5) Faithful waiting is rewarded — Simeon and Anna. (6) Temptation can be overcome through Scripture. (7) God\'s plan cannot be thwarted — Herod\'s massacre fails. (8) Growing in "wisdom, stature and favour" is the model for human development.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The Nunc Dimittis ("Now, Lord, you may dismiss your servant in peace") was sung by:',o:['Mary at the Annunciation','Zechariah at John\'s birth','Simeon at the Presentation in the Temple','The angels at Jesus\' birth'],a:3,w:'Simeon (Luke 2:29-32) — the Nunc Dimittis. He had been promised he would not die before seeing the Messiah. Holding the baby Jesus, he could die in peace. Mary\'s song = Magnificat. Zechariah\'s = Benedictus. Angels\' = Gloria.'},{q:'When Jesus quoted Deuteronomy 8:3 in the first temptation, he meant:',o:['Bread is not important for spiritual people','God\'s word and commands sustain life more fundamentally than physical food','People should always fast in the wilderness','Moses was a greater example than Adam'],a:2,w:'"Man shall not live on bread alone, but on every word that comes from the mouth of God" (Deut.8:3, Mt.4:4) — Jesus rejected using his power for self-provision. Spiritual nourishment from God\'s word is primary; physical needs are secondary.'},{q:'The Magi\'s gifts of gold, frankincense and myrrh pointed to Jesus as:',o:['A wealthy king who would become rich','King (gold), divine priest (frankincense) and one who would suffer and die (myrrh)','A prophet who would teach in the temple','A Levite who would serve in the temple'],a:2,w:'Gold = kingship (Jesus is King of Kings). Frankincense = divinity and priesthood (offered in temple worship to God). Myrrh = used in burial ointments, symbolising Jesus\' suffering and death. The gifts prophetically summarise his entire mission.'},{q:'Jesus said "Did you not know I had to be in my Father\'s house?" (Lk 2:49). This was said:',o:['When he drove out the money-changers from the Temple','When he was 12 and had stayed behind in Jerusalem','When he was baptised by John','During the temptation in the wilderness'],a:2,w:'Luke 2:49 — Jesus\' first recorded words, spoken at age 12 when found in the temple after his parents\' three-day search. These words are his first self-revelation — he knew his unique relationship with God ("my Father") even as a child.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Birth and Early Life',su:'Integrated revision across the birth and early life topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Birth and early life summary: Annunciation (Lk.1:26-38): Gabriel, Mary\'s Fiat. Magnificat (Lk.1:46-55): God reverses human power. Birth (Lk.2:1-7): Bethlehem, manger, census. Shepherds (Lk.2:8-20): angels, "good news of great joy". Magi (Mt.2:1-12): star, gold/frankincense/myrrh, Herod. Flight/Return (Mt.2:13-23): Egypt, Massacre of Innocents, Nazareth. Presentation (Lk.2:22-38): Simeon\'s Nunc Dimittis, Anna, Mary\'s sword. Temple at 12 (Lk.2:41-52): "my Father\'s house." Growth (Lk.2:52): wisdom, stature, favour. Baptism (Mt.3:13-17): dove, voice. Temptation (Mt.4:1-11): three temptations, three Deuteronomy responses.</p>'},
{lb:'Key people',dr:dQ10,ht:'<p>Key people: Mary — "favoured one"; the Fiat; Magnificat; pondering heart; at the cross; Pentecost. Joseph — righteous man; four dreams; protector and provider. Gabriel — angel of divine announcements. Elizabeth — "blessed are you among women"; Spirit-filled recognition. Zechariah — struck mute for doubt; Benedictus at John\'s naming. Simeon — righteous; Spirit-guided; Nunc Dimittis; sword prophecy. Anna — 84 years old; night-and-day prayer and fasting; proclaimed Jesus. Magi — East; star; three gifts; warned in dream. Herod — threatened; ordered massacre; died in Jericho. John the Baptist — forerunner; Elijah; Lamb of God; imprisoned; beheaded.</p>'},
{lb:'Theological themes',dr:dQ1,ht:'<p>Theological themes: (1) Incarnation — God becomes human. (2) Fulfilment — Jesus completes OT prophecy. (3) Humility — the King born in poverty. (4) Reversal — God exalts the humble (Magnificat). (5) Immanuel — God with us. (6) Divine sonship — Father\'s voice at baptism. (7) Victory over temptation — through Scripture. (8) Human development — Jesus grew fully. (9) Faithful remnant — Simeon, Anna await the Messiah. (10) Mission — the birth is for "all people" (Lk.2:10), "a light for the Gentiles" (Lk.2:32). The Incarnation is the foundation of all Christian theology.</p>'},
{lb:'WAEC final tips',dr:dQ2,ht:'<p>Final WAEC tips: (1) Always give chapter and verse — examiners reward this. (2) Know the difference between Luke\'s account (shepherds focus) and Matthew\'s (Magi focus). (3) Know the four songs: Magnificat (Mary), Benedictus (Zechariah), Gloria (angels), Nunc Dimittis (Simeon). (4) Know all three temptations and the specific Deuteronomy response to each. (5) Know all the OT prophecies fulfilled — at least Isa.7:14, Mic.5:2, Hos.11:1, Jer.31:15. (6) Know the significance of each Magi gift. (7) Know why the baptism is Trinitarian. (8) Know Jesus\' first recorded words and their significance (Lk.2:49).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which of the four songs in Luke\'s birth narrative was sung by Zechariah?',o:['The Magnificat','The Benedictus','The Gloria','The Nunc Dimittis'],a:2,w:'The Benedictus (Luke 1:68-79) — Zechariah\'s song of praise at the naming of John the Baptist, after his nine months of silence ended. Magnificat = Mary (1:46). Gloria = angels (2:14). Nunc Dimittis = Simeon (2:29).'},{q:'Jesus\' growing "in wisdom and stature, and in favour with God and man" (Lk 2:52) shows:',o:['Jesus was fully divine and only appeared to grow','Jesus grew fully as a human being — intellectually, physically, spiritually and socially','Jesus needed the help of human teachers to learn','Jesus became divine gradually as he grew older'],a:2,w:'Luke 2:52 affirms the full humanity of Jesus — he genuinely grew and developed. Wisdom = intellectual. Stature = physical. Favour with God = spiritual. Favour with man = social. The Incarnation means Jesus truly shared human experience, including growth.'},{q:'Which OT book is quoted in Matthew 2:6 about the ruler coming from Bethlehem?',o:['Isaiah','Jeremiah','Hosea','Micah'],a:4,w:'Micah 5:2 — "But you, Bethlehem Ephrathah, though you are small among the clans of Judah, out of you will come for me one who will be ruler over Israel" — quoted in Matthew 2:6 when the chief priests answer Herod\'s question about where the Messiah was to be born.'},{q:'After the three temptations, Matthew says (Mt 4:11):',o:['Jesus returned immediately to Galilee to begin preaching','Jesus remained in the wilderness for another forty days','The devil left him, and angels came and attended to him','Jesus went to Jerusalem to pray in the temple'],a:3,w:'Matthew 4:11 — "Then the devil left him, and angels came and attended to him." After the completion of the testing, heavenly ministry replaced diabolic assault — the angels fulfilled the role the devil had tried to force Jesus to demand from them (Mt.4:6).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
