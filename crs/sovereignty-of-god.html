<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Sovereignty of God',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'Sovereignty = God\'s supreme authority and control over all creation',DARK,10,'middle',false));o.push(T(240,74,'Nothing happens outside God\'s knowledge or permission','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,40,CRM,ACC,1.5));o.push(T(240,110,'Creation: Gen 1 — God created the heavens and the earth (ex nihilo)','#333',10,'middle',false));o.push(T(240,128,'God said "Let there be…" — sovereign word brings all things into being','#555',9,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,CRM,ACC,1.5));o.push(T(240,160,'Control: God sustains and governs all He has made','#333',10,'middle',false));o.push(T(240,178,'Ps 24:1 "The earth is the Lord\'s and everything in it"','#555',9,'middle',false));}
if(p>=4){o.push(R(10,192,460,60,LINE,ACC,1));o.push(T(240,212,'Providence: God works all things for His purposes','#333',9,'middle',false));o.push(T(240,232,'Rom 8:28 — all things work together for good for those who love God','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Creation — Key Passages',ACC,12,'middle',true));
[['Genesis 1:1','In the beginning God created the heavens and the earth'],['Genesis 1:26','Let us make mankind in our image, in our likeness'],['Genesis 2:7','God formed man from the dust and breathed life into him'],['Psalm 24:1','The earth is the Lord\'s and everything in it'],['Psalm 104:24','How many are your works, Lord! In wisdom you made them all'],['Colossians 1:16','All things were created through him and for him'],['Revelation 4:11','You are worthy to receive glory — you created all things']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,8,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Sovereignty of God — Summary',ACC,13,'middle',true));
[['Creation','God made all things from nothing (ex nihilo) — Gen 1:1'],['Control','God sustains and governs all creation — Ps 24:1'],['Providence','God works all things for His purposes — Rom 8:28'],['Omnipotence','God is all-powerful; nothing is impossible for Him'],['Omniscience','God knows all things past, present and future'],['Omnipresence','God is present everywhere — Ps 139:7-10'],['Implication','Humans are accountable to God as Creator and Lord']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Old Testament',ti:'Creation — God Made All Things',su:'Describe God\'s creation of the world and its significance.',steps:[
  {lb:'Creation from nothing',dr:dQ1,ht:'<p>Genesis 1:1 — <em>"In the beginning God created the heavens and the earth."</em> God created everything <em>ex nihilo</em> (out of nothing). He needed no pre-existing material. This shows His absolute sovereignty — He is not part of creation but stands above it as its Author and Lord.</p>'},
  {lb:'The six days of creation',dr:dQ1,ht:'<p>Day 1: Light. Day 2: Sky and waters. Day 3: Land and vegetation. Day 4: Sun, moon and stars. Day 5: Fish and birds. Day 6: Animals and mankind. Day 7: God rested (the Sabbath). Each creative act shows God\'s power and wisdom. The repeated phrase <em>"God saw that it was good"</em> shows creation reflects His character.</p>'},
  {lb:'Man made in God\'s image',dr:dQ1,ht:'<p>Genesis 1:26-27 — God made mankind (<em>male and female</em>) in His image (<em>imago Dei</em>). This means humans uniquely reflect God\'s character — rational, moral, relational and creative. This gives every person dignity and worth. Mankind was given dominion over creation (Gen 1:28) — not to exploit but to steward responsibly.</p>'},
  {lb:'Significance of creation',dr:dQ2,ht:'<p>Creation teaches: (1) God is sovereign — He owns all things (Ps 24:1). (2) Creation is not God — we must not worship created things (idolatry). (3) Man is dependent on God for life and breath (Acts 17:25). (4) Creation calls us to worship the Creator (Ps 19:1). (5) We are accountable to God for how we treat His creation.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What does the Latin phrase <b>ex nihilo</b> mean?',o:['Out of chaos','Out of nothing','Out of water','Out of light'],a:2,w:'Ex nihilo means "out of nothing" — God needed no pre-existing material to create.'},{q:'On which day did God create mankind?',o:['Day 4','Day 5','Day 6','Day 7'],a:3,w:'Day 6 — God created land animals and then mankind on the sixth day.'},{q:'Which psalm declares "The earth is the Lord\'s and everything in it"?',o:['Psalm 23','Psalm 24','Psalm 100','Psalm 139'],a:2,w:'Psalm 24:1 — "The earth is the Lord\'s and everything in it."'},{q:'What does <em>imago Dei</em> mean?',o:['Image of creation','Image of man','Image of God','Image of angels'],a:3,w:'Imago Dei means "image of God" — mankind uniquely reflects God\'s character.'},{q:'What did God make mankind in, according to Genesis 1:26?',o:['Image of angels','Image and likeness of God','Image of animals','Image of nature'],a:2,w:'Genesis 1:26 — God said "Let us make mankind in our image, in our likeness."'},{q:'On which day did God create the sun, moon and stars?',o:['Day 2','Day 3','Day 4','Day 5'],a:3,w:'Day 4 — God made the sun, moon and stars to govern day and night.'},{q:'What repeated phrase in Genesis 1 shows creation reflects God\'s character?',o:['"God rested"','"God saw that it was good"','"God blessed them"','"God spoke"'],a:2,w:'The repeated phrase "God saw that it was good" shows creation reflects His character.'},{q:'What responsibility did Genesis 1:28 give mankind over creation?',o:['Full ownership to exploit as they wish','Responsible stewardship (dominion)','No responsibility at all','Worship of nature'],a:2,w:'Genesis 1:28 gives dominion as a mandate for responsible stewardship, not exploitation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Old Testament',ti:'God\'s Control Over Creation',su:'Explain how God controls and sustains His creation.',steps:[
  {lb:'God sustains creation',dr:dQ2,ht:'<p>God did not create the world and then abandon it — He continuously sustains it. Colossians 1:17 — <em>"In him all things hold together."</em> Hebrews 1:3 — God upholds all things by His powerful word. Nehemiah 9:6 — <em>"You give life to everything."</em> Without God\'s sustaining power, creation would cease to exist.</p>'},
  {lb:'God controls nature',dr:dQ1,ht:'<p>Scripture shows God\'s control over nature: He sent rain and withheld it (1 Kings 17-18 — Elijah and the drought). He parted the Red Sea (Exodus 14). He controlled the sun (Joshua 10:12-13). He calmed the storm (Mark 4:39 — Jesus). These acts demonstrate that natural forces obey their Creator.</p>'},
  {lb:'God controls nations and history',dr:dQ2,ht:'<p>Daniel 2:21 — <em>"He changes times and seasons; he sets up kings and deposes them."</em> God used Assyria as His instrument of judgment (Isaiah 10:5). He raised up Cyrus to release Israel from exile (Isaiah 45:1). No nation or ruler acts outside His sovereign plan — history is moving towards His purposes.</p>'},
  {lb:'God\'s power over death',dr:dQ1,ht:'<p>God\'s control extends even over death: He restored the Shunammite\'s son through Elisha (2 Kings 4). He raised Lazarus (John 11). The ultimate demonstration is the resurrection of Jesus (Acts 2:24 — <em>"God raised him from the dead"</em>). Death itself is under God\'s authority.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Which verse says "In him all things hold together"?',o:['Hebrews 1:3','Colossians 1:17','Romans 8:28','Psalm 104:24'],a:2,w:'Colossians 1:17 — "In him all things hold together."'},{q:'Who controlled the drought to demonstrate God\'s power over nature?',o:['Isaiah','Jeremiah','Elijah','Elisha'],a:3,w:'Elijah called a drought in 1 Kings 17 to demonstrate God\'s sovereignty over Baal worship.'},{q:'What does Daniel 2:21 say God does with kings?',o:['Guides them','Tests them','Sets up and deposes them','Blesses them'],a:3,w:'Daniel 2:21 — "He sets up kings and deposes them."'},{q:'Which king did God raise up to release Israel from exile in Babylon?',o:['Nebuchadnezzar','Darius','Cyrus','Artaxerxes'],a:3,w:'Isaiah 45:1 — God raised up Cyrus of Persia to release Israel from exile.'},{q:'Which event shows God\'s control over the sea?',o:['Noah\'s flood','The parting of the Red Sea (Exodus 14)','The Tower of Babel','Jonah\'s storm'],a:2,w:'Exodus 14 — God parted the Red Sea for Israel to cross on dry ground.'},{q:'Which book records the sun standing still at Joshua\'s request?',o:['Genesis','Exodus','Joshua','Judges'],a:3,w:'Joshua 10:12-13 — God controlled the sun at Joshua\'s request during battle.'},{q:'Which nation did God use as an instrument of judgment on Israel, per Isaiah 10:5?',o:['Egypt','Assyria','Babylon','Persia'],a:2,w:'Isaiah 10:5 — God used Assyria as "the rod of my anger" to discipline Israel.'},{q:'What did Jesus do to demonstrate power over nature in Mark 4:39?',o:['Healed the sick','Calmed the storm','Fed five thousand','Turned water to wine'],a:2,w:'Mark 4:39 — Jesus rebuked the storm and it became completely calm.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Old Testament',ti:'God\'s Providence',su:'Define providence and give biblical examples.',steps:[
  {lb:'What is providence?',dr:dQ1,ht:'<p>Providence is God\'s ongoing care, guidance and provision for His creation and His people. It means God works through both extraordinary and ordinary events to fulfil His purposes. Romans 8:28 — <em>"In all things God works for the good of those who love him."</em> Providence does not remove human responsibility — God works through human choices.</p>'},
  {lb:'Joseph — providence in suffering',dr:dQ2,ht:'<p>Joseph\'s story (Genesis 37-50) is the greatest Old Testament example of providence. His brothers sold him into slavery — yet God used this to make Joseph ruler of Egypt and save many lives. Genesis 50:20 — <em>"You intended to harm me, but God intended it for good."</em> What appeared as tragedy was part of God\'s plan.</p>'},
  {lb:'Esther — providence in danger',dr:dQ1,ht:'<p>Esther 4:14 — <em>"Who knows whether you have not come to the kingdom for such a time as this?"</em> God placed Esther as queen at the exact moment needed to save the Jewish people from Haman\'s plot. God\'s name is not mentioned in Esther — yet His hand is seen throughout. Providence often works invisibly through natural events.</p>'},
  {lb:'Ruth — providence in loyalty',dr:dQ2,ht:'<p>Ruth\'s loyalty to Naomi (Ruth 1:16 — <em>"Where you go I will go"</em>) led her to Boaz\'s field "by chance" (Ruth 2:3) — but God providentially guided her steps. Ruth became an ancestor of King David and ultimately of Jesus (Matthew 1:5). God works through ordinary daily decisions to fulfil extraordinary purposes.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is the key verse on providence in Romans?',o:['Romans 3:23','Romans 6:23','Romans 8:28','Romans 12:1'],a:3,w:'Romans 8:28 — "In all things God works for the good of those who love him."'},{q:'What did Joseph say to his brothers in Genesis 50:20?',o:['God will punish you','You intended harm but God intended good','I forgive you','God has blessed me'],a:2,w:'Genesis 50:20 — "You intended to harm me, but God intended it for good."'},{q:'In which book does the famous phrase "for such a time as this" appear?',o:['Ruth','Daniel','Esther','Nehemiah'],a:3,w:'Esther 4:14 — Mordecai said this to Esther about her role as queen.'},{q:'Ruth\'s loyalty led her to become an ancestor of which king?',o:['Saul','Solomon','David','Hezekiah'],a:3,w:'Ruth is listed in the genealogy of King David and ultimately of Jesus (Matthew 1:5).'},{q:'Which Old Testament book never mentions God\'s name directly, yet shows His providence throughout?',o:['Ruth','Esther','Nehemiah','Ezra'],a:2,w:'God\'s name never appears in Esther, yet His providential hand is seen throughout the book.'},{q:'In Ruth 2:3, whose "chance" arrival at Boaz\'s field reveals God\'s providence?',o:['Orpah','Ruth','Naomi','Rahab'],a:2,w:'Ruth 2:3 — Ruth "happened" to glean in Boaz\'s field, though God was guiding her steps.'},{q:'According to Matthew 1:5, Ruth\'s line eventually led to whom?',o:['King Saul','King David and Jesus','The prophet Samuel','The priest Eli'],a:2,w:'Matthew 1:5 lists Ruth in the genealogy leading to King David and ultimately Jesus.'},{q:'What position did God\'s providence eventually give Joseph in Egypt?',o:['A slave','A prisoner','Ruler over Egypt','A shepherd'],a:3,w:'Genesis 41 — Joseph was made ruler over Egypt, positioned to save many lives.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Old Testament',ti:'Attributes of God',su:'Describe God\'s key attributes as shown in creation and Scripture.',steps:[
  {lb:'Omnipotence',dr:dQ1,ht:'<p>Omnipotence means God is all-powerful. Genesis 18:14 — <em>"Is anything too hard for the Lord?"</em> Jeremiah 32:17 — <em>"Nothing is too hard for you."</em> God created the universe from nothing by His word alone. He parted seas, raised the dead, and controls natural forces. His power is unlimited — yet He uses it in accordance with His holy character.</p>'},
  {lb:'Omniscience',dr:dQ2,ht:'<p>Omniscience means God knows all things. Psalm 139:1-4 — <em>"You know when I sit and when I rise; you perceive my thoughts from afar."</em> Proverbs 15:3 — <em>"The eyes of the Lord are everywhere."</em> God knows the past, present and future. He knows every person\'s thoughts, words and deeds. Nothing is hidden from Him (Hebrews 4:13).</p>'},
  {lb:'Omnipresence',dr:dQ1,ht:'<p>Omnipresence means God is present everywhere. Psalm 139:7-10 — <em>"Where can I flee from your presence? If I go up to the heavens, you are there; if I make my bed in the depths, you are there."</em> Jeremiah 23:24 — <em>"Do I not fill heaven and earth?"</em> God is not limited to any location — He is fully present everywhere simultaneously.</p>'},
  {lb:'Holiness and love',dr:dQ2,ht:'<p>Holiness: God is completely separate from sin and morally perfect. Isaiah 6:3 — <em>"Holy, holy, holy is the Lord Almighty."</em> Love: 1 John 4:8 — <em>"God is love."</em> John 3:16 — <em>"God so loved the world."</em> His holiness means sin must be judged; His love means He provides a way of salvation. The cross is where God\'s holiness and love meet perfectly.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What does "omnipotent" mean?',o:['All-knowing','All-present','All-powerful','All-holy'],a:3,w:'Omnipotent means all-powerful — God has unlimited power.'},{q:'Which Psalm shows God\'s omnipresence most clearly?',o:['Psalm 23','Psalm 46','Psalm 100','Psalm 139'],a:4,w:'Psalm 139:7-10 — "Where can I flee from your presence?" demonstrates omnipresence.'},{q:'What does 1 John 4:8 declare about God?',o:['God is holy','God is love','God is just','God is great'],a:2,w:'1 John 4:8 — "God is love" — love is not just what God does but who He is.'},{q:'Isaiah 6:3 records the angels crying "Holy, holy, holy". What does this repetition emphasise?',o:['God\'s power','God\'s anger','God\'s perfect moral purity','God\'s presence'],a:3,w:'The threefold repetition in Hebrew (Trisagion) is the strongest possible emphasis — God\'s absolute moral purity.'},{q:'Which verse asks, "Is anything too hard for the Lord?"',o:['Jeremiah 32:17','Genesis 18:14','Job 42:2','Psalm 33:9'],a:2,w:'Genesis 18:14 — God asks Abraham this rhetorical question about Sarah bearing a child.'},{q:'According to Psalm 139:1-4, what does God know about each person?',o:['Only their future decisions','Their thoughts from afar','Only their prayers','Only their sins'],a:2,w:'Psalm 139:1-4 — "You perceive my thoughts from afar" shows God\'s complete knowledge.'},{q:'Which verse states that nothing is hidden from God?',o:['Hebrews 4:13','Psalm 23:1','1 Corinthians 13:4','John 1:1'],a:1,w:'Hebrews 4:13 — "Nothing in all creation is hidden from God\'s sight."'},{q:'Which two attributes of God meet perfectly at the cross?',o:['Power and wisdom','Holiness and love','Mercy and judgment','Justice and peace'],a:2,w:'God\'s holiness demands sin be judged; His love provides salvation — both meet at the cross.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Old Testament',ti:'Human Response to God\'s Sovereignty',su:'Explain how people should respond to God as sovereign Creator.',steps:[
  {lb:'Worship and praise',dr:dQ1,ht:'<p>The natural response to God\'s sovereignty is worship. Psalm 95:6 — <em>"Come, let us bow down in worship, let us kneel before the Lord our Maker."</em> Revelation 4:11 — <em>"You are worthy to receive glory and honour and power, for you created all things."</em> To recognise God as Creator is to owe Him worship — CRS examiners often ask about the response to God\'s attributes.</p>'},
  {lb:'Obedience and trust',dr:dQ2,ht:'<p>If God is sovereign, we can trust His plans even when we cannot see them (Proverbs 3:5-6 — <em>"Trust in the Lord with all your heart"</em>). Abraham obeyed God\'s call without knowing where he was going (Hebrews 11:8). Job trusted God through extreme suffering (Job 1:21 — <em>"The Lord gave and the Lord has taken away; may the name of the Lord be praised"</em>).</p>'},
  {lb:'Stewardship of creation',dr:dQ1,ht:'<p>Since God owns creation (Ps 24:1), humans are stewards, not owners. Genesis 1:28 — <em>"Fill the earth and subdue it."</em> This is a mandate of responsible care, not exploitation. Environmental responsibility, care for animals and conservation are all part of the human response to God\'s sovereignty over creation. We answer to the Creator for how we treat His world.</p>'},
  {lb:'Humility and repentance',dr:dQ2,ht:'<p>God\'s sovereignty exposes human pride and sinfulness. Isaiah 6:5 — when Isaiah saw God\'s holiness, he cried <em>"Woe to me! I am ruined!"</em> Job 40:4 — confronted by God, Job said <em>"I am unworthy."</em> God\'s sovereignty calls us to humility — recognising we are creatures before the Creator, dependent on His grace and in need of His forgiveness.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What does Psalm 95:6 call people to do in response to God being Creator?',o:['Sing songs','Bow down and worship','Bring offerings','Study Scripture'],a:2,w:'Psalm 95:6 — "Come, let us bow down in worship, let us kneel before the Lord our Maker."'},{q:'What principle does Proverbs 3:5-6 teach about responding to God\'s sovereignty?',o:['Trust in your own wisdom','Trust in the Lord with all your heart','Seek advice from elders','Study hard and plan carefully'],a:2,w:'Proverbs 3:5-6 — "Trust in the Lord with all your heart and lean not on your own understanding."'},{q:'What did Job say when God confronted him with His sovereign power?',o:['I am righteous','I am unworthy','I do not understand','I will obey'],a:2,w:'Job 40:4 — "I am unworthy — how can I reply to you?"'},{q:'The Genesis 1:28 command to "subdue the earth" means humans should:',o:['Exploit natural resources freely','Worship nature','Act as responsible stewards of God\'s creation','Avoid using natural resources'],a:3,w:'The dominion mandate is a call to stewardship — responsible care of God\'s creation, not exploitation.'},{q:'Which verse declares, "You are worthy to receive glory and honour and power, for you created all things"?',o:['Psalm 24:1','Revelation 4:11','Isaiah 6:3','Colossians 1:17'],a:2,w:'Revelation 4:11 — the twenty-four elders worship God as sovereign Creator.'},{q:'According to Hebrews 11:8, how did Abraham respond to God\'s call?',o:['He refused to obey','He obeyed without knowing where he was going','He questioned God repeatedly','He waited until he understood everything'],a:2,w:'Hebrews 11:8 — Abraham obeyed by faith, not knowing where he was going.'},{q:'What did Isaiah cry out when he saw God\'s holiness (Isaiah 6:5)?',o:['"Here am I, send me"','"Woe to me! I am ruined!"','"Holy, holy, holy"','"I am unworthy"'],a:2,w:'Isaiah 6:5 — confronted by God\'s holiness, Isaiah cried "Woe to me! I am ruined!"'},{q:'What does true stewardship of creation involve, according to Genesis 1:28?',o:['Exploiting resources for profit','Responsible care of creation','Avoiding all use of resources','Worshipping creation'],a:2,w:'The dominion mandate calls for responsible stewardship, not exploitation or worship of nature.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 Old Testament',ti:'Contrasting Views on Creation',su:'Compare the biblical account of creation with other views.',steps:[
  {lb:'Creation vs evolution',dr:dQ1,ht:'<p>The biblical account (Genesis 1-2) presents God as the personal Creator who made all things intentionally and purposefully. Evolution as a theory describes a natural process over billions of years without a designer. Key difference: the Bible teaches creation is <em>purposeful</em> (made by God, for God\'s glory, with mankind as the pinnacle) not an accident. Many Christians hold various views on the relationship between Genesis and science.</p>'},
  {lb:'African traditional religion',dr:dQ2,ht:'<p>Many African traditional religions (ATR) acknowledge a Supreme Being (Chukwu, Olodumare, Nyame) who created the world. However, ATR often involves worship of lesser spirits and ancestors as intermediaries, which differs from biblical monotheism. The Bible teaches direct access to the one Creator God through prayer — no spirit intermediaries are needed (1 Timothy 2:5).</p>'},
  {lb:'Animism and idolatry',dr:dQ1,ht:'<p>Animism holds that spirits dwell in natural objects (trees, rivers, animals). This directly contradicts biblical teaching: God alone is to be worshipped; creation is not divine. Romans 1:25 warns against worshipping <em>"created things rather than the Creator."</em> The first and second commandments (Exodus 20:3-4) forbid placing anything before God or making idols.</p>'},
  {lb:'Implications for life',dr:dQ2,ht:'<p>Believing in God as sovereign Creator affects how we live: (1) We have purpose — we are not accidents but made in God\'s image. (2) We have dignity — every human life has worth. (3) We have responsibility — we answer to our Creator. (4) We have hope — the God who made all things can redeem and restore. Romans 8:21 — creation itself will be liberated from decay.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What does Romans 1:25 warn against?',o:['Worshipping idols in temples','Worshipping created things rather than the Creator','Neglecting prayer','Disobeying parents'],a:2,w:'Romans 1:25 — they "worshipped and served created things rather than the Creator."'},{q:'What is the main difference between biblical creation and animism?',o:['The Bible says creation took 6 days','The Bible forbids worshipping nature or spirits within creation','The Bible denies the existence of spirits','The Bible teaches reincarnation'],a:2,w:'Animism sees spirits in natural objects; the Bible teaches only God is to be worshipped.'},{q:'Which commandment forbids making idols?',o:['1st commandment','2nd commandment','3rd commandment','4th commandment'],a:2,w:'The 2nd commandment (Exodus 20:4) — "You shall not make for yourself an image."'},{q:'What does belief in creation as purposeful give to human beings?',o:['Freedom from all rules','Purpose, dignity and responsibility','Power over nature','Eternal life automatically'],a:2,w:'Creation teaches we have purpose (made in God\'s image), dignity (every life has worth) and responsibility (we answer to the Creator).'},{q:'What term describes the belief that spirits dwell in natural objects like trees and rivers?',o:['Monotheism','Animism','Pantheism','Deism'],a:2,w:'Animism holds that spirits inhabit natural objects — this contradicts biblical teaching.'},{q:'According to 1 Timothy 2:5, how do believers approach God?',o:['Through ancestor spirits','Through one mediator, Christ Jesus','Through priests only','Through nature spirits'],a:2,w:'1 Timothy 2:5 — "There is one mediator between God and mankind, the man Christ Jesus."'},{q:'Which names for a Supreme Being are used in some African traditional religions?',o:['Baal, Molech, Dagon','Chukwu, Olodumare, Nyame','Zeus, Ra, Marduk','Vishnu, Shiva, Brahma'],a:2,w:'Chukwu (Igbo), Olodumare (Yoruba) and Nyame (Akan) are names for a Supreme Being in ATR.'},{q:'What does Romans 8:21 say creation will one day experience?',o:['Be destroyed forever','Be liberated from decay','Remain unchanged forever','Be worshipped by angels'],a:2,w:'Romans 8:21 — creation itself will be liberated from its bondage to decay.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 Old Testament',ti:'Key Passages on God\'s Sovereignty',su:'Identify and explain key scripture passages on God\'s sovereignty.',steps:[
  {lb:'Genesis 1:1',dr:dQ2,ht:'<p><em>"In the beginning God created the heavens and the earth."</em> This verse establishes: (1) God existed before creation — He is eternal. (2) God created — He is the source of all things. (3) "Heavens and earth" = everything that exists. No other gods, forces or materials existed before. This single verse rules out atheism, polytheism and dualism. WAEC often asks students to quote and explain key verses.</p>'},
  {lb:'Psalm 139',dr:dQ1,ht:'<p>Psalm 139 is David\'s meditation on God\'s all-knowing, all-present nature. Key sections: v1-6 (omniscience — "you know when I sit and rise"), v7-12 (omnipresence — "where can I flee from your presence?"), v13-16 (God forms each person in the womb — personal providence), v23-24 (response — "search me O God"). Shows sovereignty extends to each individual person.</p>'},
  {lb:'Isaiah 40:21-28',dr:dQ2,ht:'<p>Isaiah 40 contrasts the greatness of God with the insignificance of nations and idols. v22 — God sits above the circle of the earth; people are like grasshoppers. v25-26 — God created and names every star. v28 — <em>"The Lord is the everlasting God, the Creator of the ends of the earth. He will not grow tired or weary."</em> Written to comfort exiled Israel — their God is greater than Babylon\'s gods.</p>'},
  {lb:'Daniel 4:34-35',dr:dQ1,ht:'<p>After his period of madness, Nebuchadnezzar declared God\'s sovereignty: <em>"His dominion is an eternal dominion; his kingdom endures from generation to generation. All the peoples of the earth are regarded as nothing. He does as he pleases with the powers of heaven and the peoples of the earth."</em> Even the most powerful earthly king acknowledged God\'s supreme authority. A key WAEC passage on sovereignty.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Complete the verse: "In the beginning God created..."',o:['...man and woman','...the heavens and the earth','...light and darkness','...the sea and sky'],a:2,w:'Genesis 1:1 — "In the beginning God created the heavens and the earth."'},{q:'Which chapter of Isaiah contrasts God\'s greatness with the smallness of nations?',o:['Isaiah 6','Isaiah 40','Isaiah 53','Isaiah 60'],a:2,w:'Isaiah 40:21-28 describes God sitting above the circle of the earth and naming every star.'},{q:'In Daniel 4, who declared "His dominion is an eternal dominion"?',o:['Daniel','Shadrach','Nebuchadnezzar','Darius'],a:3,w:'Nebuchadnezzar made this declaration after his period of madness — Daniel 4:34-35.'},{q:'Psalm 139 v13-16 shows God\'s sovereignty extends to:',o:['The nations','The stars','Each individual person formed in the womb','The angels'],a:3,w:'Psalm 139:13-16 — God knitted David together in his mother\'s womb — personal providence.'},{q:'According to Genesis 1:1, what existed before God created the heavens and the earth?',o:['Chaos and water','Other gods','Nothing — God alone existed','Angels only'],a:3,w:'Genesis 1:1 rules out any pre-existing material, other gods, or forces — God alone was eternal.'},{q:'Which section of Psalm 139 focuses on God\'s omnipresence?',o:['v1-6','v7-12','v13-16','v23-24'],a:2,w:'Psalm 139:7-12 — "Where can I flee from your presence?" is the omnipresence section.'},{q:'In Isaiah 40, what are the nations compared to, showing their insignificance before God?',o:['Ants','Grasshoppers','Dust','Shadows'],a:2,w:'Isaiah 40:22 — before God, the nations "are like grasshoppers."'},{q:'What title does Isaiah 40:28 give to God?',o:['The everlasting God, Creator of the ends of the earth','The God of Israel only','A tired and weary God','The God of the nations only'],a:1,w:'Isaiah 40:28 — "The Lord is the everlasting God, the Creator of the ends of the earth."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 Old Testament',ti:'Sovereignty and Suffering',su:'Explain how God\'s sovereignty relates to human suffering and pain.',steps:[
  {lb:'The problem of suffering',dr:dQ1,ht:'<p>If God is all-powerful and all-good, why does suffering exist? This is one of the deepest questions in theology. The Bible does not give a simple answer but provides several important perspectives: (1) Suffering can result from sin and its consequences (Genesis 3). (2) Suffering can be a test of faith (Job). (3) Suffering can produce character (Romans 5:3-4). (4) God can bring good from suffering (Romans 8:28).</p>'},
  {lb:'Job — suffering and sovereignty',dr:dQ2,ht:'<p>Job was righteous yet suffered terribly. His three friends argued suffering was punishment for sin — God corrected them (Job 42:7). Job\'s suffering was a test and ultimately led to greater blessing. Key lesson: we cannot always explain suffering by pointing to sin. Job 1:21 — <em>"The Lord gave and the Lord has taken away; may the name of the Lord be praised."</em> Sovereignty means trusting God even without explanation.</p>'},
  {lb:'Sovereignty does not mean evil is God\'s will',dr:dQ1,ht:'<p>God permits suffering but is not the author of evil (James 1:13 — <em>"God cannot be tempted by evil, nor does he tempt anyone."</em>). God can bring good from evil without causing the evil. Genesis 50:20 — Joseph\'s brothers intended harm; God intended good. God\'s sovereignty means He overrules evil for His purposes — not that He endorses it or causes it.</p>'},
  {lb:'The cross — sovereignty and redemption',dr:dQ2,ht:'<p>The greatest example of God bringing good from suffering is the cross. Acts 2:23 — the crucifixion happened <em>"by God\'s deliberate plan and foreknowledge"</em> — yet the crucifiers were responsible for their actions. The worst event in history (the murder of the Son of God) became the means of salvation. This shows God\'s sovereignty working even through the greatest evil for the greatest good.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What did Job say when he lost everything? (Job 1:21)',o:['God has abandoned me','Why have you done this?','The Lord gave and the Lord has taken away; praised be His name','I will curse God and die'],a:3,w:'Job 1:21 — "The Lord gave and the Lord has taken away; may the name of the Lord be praised."'},{q:'What does James 1:13 say about God and evil?',o:['God tests people with evil','God allows all evil','God cannot be tempted by evil, nor does he tempt anyone','God causes suffering to teach us'],a:3,w:'James 1:13 — "God cannot be tempted by evil, nor does he tempt anyone."'},{q:'What was wrong with Job\'s three friends\' explanation of his suffering?',o:['They said he had no faith','They wrongly argued his suffering was punishment for sin','They denied God\'s existence','They said God was weak'],a:2,w:'Job\'s friends wrongly linked all suffering to sin — God corrected them in Job 42:7.'},{q:'Acts 2:23 says the crucifixion happened by God\'s:',o:['Accident','Permission','Deliberate plan and foreknowledge','Command to Pilate'],a:3,w:'Acts 2:23 — "by God\'s deliberate plan and foreknowledge" — sovereignty over the greatest evil.'},{q:'According to Romans 5:3-4, what can suffering produce in a believer\'s life?',o:['Perseverance, character and hope','Anger and doubt','Punishment','Nothing of value'],a:1,w:'Romans 5:3-4 — suffering produces perseverance, character and hope.'},{q:'Which book focuses on a righteous man suffering though he was not being punished for sin?',o:['Job','Ecclesiastes','Lamentations','Ruth'],a:1,w:'The book of Job shows a righteous man suffering for reasons beyond personal sin.'},{q:'In Job 42:7, what did God say about Job\'s three friends\' speeches?',o:['They spoke rightly about God','They had not spoken the truth about Him','They should be praised','They should be rewarded'],a:2,w:'Job 42:7 — God said Job\'s friends had not spoken of Him what was right, unlike Job.'},{q:'What does Genesis 3 show as one source of suffering in the world?',o:['God\'s cruelty','Sin and its consequences','Random chance','Angels\' rebellion'],a:2,w:'Genesis 3 — the fall introduces sin and its consequences, including suffering, into the world.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 Old Testament',ti:'WAEC Exam Preparation — Sovereignty',su:'Practise WAEC-style questions on the sovereignty of God.',steps:[
  {lb:'WAEC essay structure',dr:dQ1,ht:'<p>WAEC CRS essays should: (1) Define the key term. (2) Give biblical examples with references. (3) Draw lessons/moral implications. (4) Conclude with relevance to Christians today. For "sovereignty" questions: define it, give creation examples, give providence examples (Joseph, Esther), give control examples (Elijah, Daniel), then draw lessons on trust, worship and obedience.</p>'},
  {lb:'Common WAEC questions',dr:dQ2,ht:'<p>Common patterns in WAEC CRS on sovereignty: "Narrate how God demonstrated His sovereignty in..." / "Discuss the sovereignty of God as seen in..." / "What lessons can Christians learn from God\'s control over...?" Always: give the Bible reference, explain the event, and state the lesson clearly. WAEC awards marks for: correct references, clear narrative, and application to Christian life.</p>'},
  {lb:'Key vocabulary',dr:dQ1,ht:'<p>Learn these terms for WAEC essays: <b>Sovereignty</b> — God\'s supreme authority. <b>Omnipotence</b> — all-powerful. <b>Omniscience</b> — all-knowing. <b>Omnipresence</b> — present everywhere. <b>Providence</b> — God\'s ongoing care and guidance. <b>Ex nihilo</b> — creation from nothing. <b>Imago Dei</b> — image of God. <b>Stewardship</b> — responsible care of creation. <b>Transcendent</b> — above and beyond creation.</p>'},
  {lb:'Linking sovereignty to other topics',dr:dQ2,ht:'<p>Sovereignty connects to: Covenant (God sovereignly initiates His covenant with Noah, Abraham, Israel). Leadership (God raises up and removes leaders — Joseph, Moses, David). Prophets (God sends His word through them to govern history). Faith and courage (trusting a sovereign God motivates courageous action). Social justice (the sovereign God demands justice from His people). Know these links for WAEC essays.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'A WAEC essay on sovereignty should begin with:',o:['A long introduction about the Bible','A clear definition of sovereignty','A list of all Bible verses','A discussion of evolution'],a:2,w:'Always begin by defining the key term — "Sovereignty refers to God\'s supreme authority over all creation."'},{q:'Which story is the best Old Testament example of God\'s providence?',o:['The flood of Noah','The Tower of Babel','The story of Joseph','The plagues of Egypt'],a:3,w:'Joseph\'s story (Genesis 37-50) is the classic OT example of providence — Gen 50:20.'},{q:'What does WAEC expect after narrating a Bible story in an essay?',o:['Another Bible story','The exact Bible text copied out','Lessons/moral implications for Christians today','A conclusion that God is great'],a:3,w:'WAEC awards marks for application — drawing lessons and showing relevance to Christian life.'},{q:'Which term means God created the world from nothing?',o:['Imago Dei','Ex nihilo','Sola fide','Gloria Dei'],a:2,w:'Ex nihilo — Latin for "out of nothing." God needed no pre-existing material to create.'},{q:'What four elements should a strong WAEC CRS essay include?',o:['Definition, examples, lessons, and relevance today','Only Bible verses','A list of characters only','An opinion with no references'],a:1,w:'WAEC essays should define, give examples with references, draw lessons, and show relevance today.'},{q:'Which two attributes should you know for WAEC essays linking sovereignty to power and knowledge?',o:['Omnipotence and omniscience','Holiness and mercy','Grace and truth','Faith and hope'],a:1,w:'Omnipotence (all-powerful) and omniscience (all-knowing) are key vocabulary for such essays.'},{q:'What does "providence" mean in CRS vocabulary?',o:['God\'s anger','God\'s ongoing care and guidance','God\'s judgement','God\'s silence'],a:2,w:'Providence is God\'s ongoing care, guidance and provision for His creation and people.'},{q:'Which topic links to sovereignty through God raising up and removing leaders?',o:['Leadership','Worship only','Marriage','Diet laws'],a:1,w:'Sovereignty connects to Leadership — God raises up and removes leaders such as Joseph, Moses and David.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:'Q10 \u2022 CRS \u2022 Old Testament',ti:'Mixed Questions — The Sovereignty of God',su:'Integrated revision across all aspects of God\'s sovereignty.',steps:[
  {lb:'Summary of key points',dr:dQ10,ht:'<p>God\'s sovereignty covers: (1) Creation — made all things ex nihilo (Gen 1:1). (2) Control — sustains and governs all creation (Col 1:17). (3) Providence — works all things for good (Rom 8:28). (4) Attributes — omnipotent, omniscient, omnipresent, holy, loving. (5) Response — worship, trust, obedience, stewardship, humility. (6) Suffering — God permits but does not cause evil; brings good from it.</p>'},
  {lb:'Key Bible references',dr:dQ2,ht:'<p>Must-know references: Gen 1:1 (creation), Gen 50:20 (providence/Joseph), Ps 24:1 (God owns all), Ps 139:7-10 (omnipresence), Prov 3:5-6 (trust), Isa 6:3 (holiness), Isa 40:28 (eternal Creator), Dan 2:21 (God controls kings), Dan 4:34-35 (Nebuchadnezzar\'s declaration), Rom 8:28 (all things for good), Col 1:17 (all things hold together), Heb 4:13 (nothing hidden from God).</p>'},
  {lb:'Lessons for Christians today',dr:dQ1,ht:'<p>God\'s sovereignty teaches Christians: (1) <b>Trust</b> — God is in control even when life seems chaotic. (2) <b>Worship</b> — the Creator deserves our full devotion. (3) <b>Stewardship</b> — care for creation as God\'s managers. (4) <b>Courage</b> — those who know their God can act boldly (Dan 11:32). (5) <b>Humility</b> — we are creatures before the Creator. (6) <b>Hope</b> — God\'s sovereign purposes cannot ultimately be frustrated.</p>'},
  {lb:'Final exam tips',dr:dQ2,ht:'<p>For WAEC CRS sovereignty questions: Always quote the Bible reference (Gen 1:1, not just "Genesis says"). Use theological vocabulary (providence, omnipotence, ex nihilo). Give at least 3 biblical examples. State lessons clearly: "From this we learn that..." End with relevance to Christians today. Time allocation: for a 25-mark essay, spend about 20-25 minutes — plan first (2 mins), then write.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Which verse says "The earth is the Lord\'s and everything in it"?',o:['Psalm 23:1','Psalm 24:1','Psalm 100:1','Psalm 46:1'],a:2,w:'Psalm 24:1 — "The earth is the Lord\'s and everything in it."'},{q:'What three attributes of God begin with "omni"?',o:['Omnipotent, omniscient, omnipresent','Omnipotent, omnivore, omnipresent','Omniscient, omnipresent, omnivore','Omnifaith, omnipotent, omniscient'],a:1,w:'Omnipotent (all-powerful), omniscient (all-knowing), omnipresent (present everywhere).'},{q:'Romans 8:28 says all things work together for good for those who:',o:['Are rich and blessed','Go to church regularly','Love God','Obey the law'],a:3,w:'Romans 8:28 — "for those who love him, who have been called according to his purpose."'},{q:'What lesson does Joseph\'s story teach about God\'s sovereignty?',o:['God prevents all suffering','God punishes those who sin against us','God can bring good even from evil and suffering','God always explains His plans to us'],a:3,w:'Genesis 50:20 — "You intended harm but God intended good." Providence brings good from evil.'},{q:'Which reference is the key verse for creation ex nihilo?',o:['Genesis 1:1','Psalm 90:2','John 1:3','Hebrews 11:3'],a:1,w:'Genesis 1:1 — "In the beginning God created the heavens and the earth."'},{q:'Which reference shows God\'s control over kings and nations?',o:['Daniel 2:21','Psalm 23:1','1 John 4:8','Romans 12:1'],a:1,w:'Daniel 2:21 — "He sets up kings and deposes them."'},{q:'Which of these is NOT one of the six areas of sovereignty in the summary?',o:['Creation','Control','Entertainment','Providence'],a:3,w:'The six areas are creation, control, providence, attributes, response and suffering — not entertainment.'},{q:'What is the recommended time allocation for a 25-mark WAEC essay?',o:['5 minutes total','About 20-25 minutes, planning first','60 minutes','No time limit'],a:2,w:'For a 25-mark essay, spend about 20-25 minutes, planning first (about
