<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Missionary Journeys of Paul',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'1st journey (Acts 13-14): Cyprus, Galatia',DARK,10,'middle',false));o.push(T(240,74,'2nd journey (Acts 15-18): Macedonia, Greece','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,CRM,ACC,1.5));o.push(T(240,110,'3rd journey (Acts 18-21): Ephesus (3 yrs)',DARK,10,'middle',false));o.push(T(240,128,'Journey to Rome (Acts 27-28): shipwreck, house arrest','#555',9,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,CRM,ACC,1.5));o.push(T(240,164,'Companions: Barnabas, Silas, Timothy, Luke, Titus',DARK,10,'middle',false));o.push(T(240,182,'Method: synagogue first, urban centres, tentmaking','#555',9,'middle',false));}
if(p>=4){o.push(R(10,200,460,60,CRM,ACC,1));o.push(T(240,218,'Letters linked: Thessalonians, Corinthians, Romans',DARK,10,'middle',false));o.push(T(240,236,'Prison epistles: Ephesians, Philippians, Colossians, Philemon','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Four Journeys',ACC,12,'middle',true));
[['1st journey','Cyprus, Pisidian Antioch, Iconium, Lystra, Derbe'],['2nd journey','Macedonian call; Philippi, Athens, Corinth'],['3rd journey','Ephesus (riot); Troas (Eutychus); Miletus'],['Rome journey','Shipwreck (Malta); 2 years house arrest'],['Companions','Barnabas, Silas, Timothy, Luke, Priscilla/Aquila, Titus']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Missionary Journeys — Summary',ACC,13,'middle',true));
[['Acts 13-14','First journey — Cyprus, Galatia'],['Acts 15:36-18:22','Second journey — Macedonia, Greece'],['Acts 18:23-21:16','Third journey — Ephesus, Miletus'],['Acts 27-28','Journey to Rome — shipwreck, house arrest'],['Method','Synagogue first; strategic cities; tentmaking'],['Companions','Barnabas, Silas, Timothy, Luke, Titus'],['Letters','Thessalonians, Corinthians, Romans, prison epistles']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS • Acts & Epistles',ti:'Paul\'s First Missionary Journey',su:'Trace the events of Paul\'s first missionary journey through Cyprus and Asia Minor.',steps:[
{lb:'Set apart by the Holy Spirit',dr:dQ1,ht:'<p>The church at <b>Antioch</b> (in Syria), while worshipping and fasting, was instructed by the <b>Holy Spirit</b> to "set apart Barnabas and Saul" for the work to which He had called them (Acts 13:1-3) &mdash; marking the formal beginning of organised Christian missionary work.</p>'},
{lb:'Ministry in Cyprus',dr:dQ1,ht:'<p>Barnabas and Saul (soon called <b>Paul</b>) travelled first to <b>Cyprus</b>, preaching in Salamis and Paphos, where the Roman proconsul <b>Sergius Paulus</b> believed after Paul struck the opposing sorcerer <b>Elymas</b> blind (Acts 13:4-12).</p>'},
{lb:'Preaching in Pisidian Antioch and Iconium',dr:dQ1,ht:'<p>In <b>Antioch in Pisidia</b>, Paul\'s synagogue sermon led many Gentiles to believe, but jealous Jewish leaders stirred up persecution, expelling them from the region; a similar pattern of belief and plotted violence followed in <b>Iconium</b> (Acts 13:13-14:6).</p>'},
{lb:'Lystra, Derbe, and the return journey',dr:dQ1,ht:'<p>At <b>Lystra</b>, Paul was stoned and left for dead (Acts 14:19-20) before continuing to <b>Derbe</b>, where many became disciples. On their return route, Paul and Barnabas <b>appointed elders</b> in each church before reporting back to the sending church at Antioch (Acts 14:21-28).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which church commissioned Barnabas and Saul for missionary work, per Acts 13:1-3?","o":["The church at Antioch (Syria)","The church at Jerusalem","The church at Corinth","The church at Rome"],"a":0,"w":"The church at Antioch in Syria, instructed by the Holy Spirit, commissioned Barnabas and Saul."},{"q":"Which island did Barnabas and Saul visit first on the journey?","o":["Crete","Cyprus","Malta","Sicily"],"a":1,"w":"Barnabas and Saul visited Cyprus first on the journey."},{"q":"Which Roman official believed after witnessing Elymas the sorcerer struck blind?","o":["Pontius Pilate","Herod Agrippa","Sergius Paulus, the proconsul","Gallio"],"a":2,"w":"Sergius Paulus, the Roman proconsul, believed after witnessing Elymas struck blind."},{"q":"What happened to Paul in Pisidian Antioch after his synagogue sermon?","o":["He converted the entire city instantly","He was immediately made a local ruler","He was welcomed by all with no opposition","Jealous Jewish leaders stirred up persecution and expelled him"],"a":3,"w":"Jealous Jewish leaders stirred up persecution, expelling Paul from the region after his sermon."},{"q":"What happened to Paul at Lystra during this journey?","o":["He was stoned and left for dead","He was welcomed as a king","He was arrested and imprisoned","He was shipwrecked"],"a":0,"w":"Paul was stoned and left for dead at Lystra during this journey."},{"q":"What did Paul and Barnabas do in each church on their return route?","o":["Demanded money for themselves","Appointed elders","Disbanded the local congregations","Left without any further instruction"],"a":1,"w":"Paul and Barnabas appointed elders in each church on their return route."},{"q":"To which church did Paul and Barnabas report back after completing the journey?","o":["The church at Corinth","The church at Rome","The church at Antioch (Syria)","The church at Ephesus"],"a":2,"w":"Paul and Barnabas reported back to the church at Antioch after completing the journey."},{"q":"What does the commissioning at Antioch mark the beginning of?","o":["The founding of the Roman Empire","The very first Christian conversion ever","The end of all persecution against Christians","Organised Christian missionary work"],"a":3,"w":"This commissioning marks the beginning of organised Christian missionary work."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS • Acts & Epistles',ti:'Paul\'s Second Missionary Journey',su:'Trace the events of Paul\'s second missionary journey, including the Macedonian call.',steps:[
{lb:'A sharp disagreement and a new companion',dr:dQ2,ht:'<p>Paul and Barnabas had a <b>sharp disagreement</b> over whether to bring John Mark again, leading them to <b>separate</b>: Barnabas took Mark to Cyprus, while Paul chose <b>Silas</b> and set out through Syria and Cilicia (Acts 15:36-41).</p>'},
{lb:'Timothy joins, and the Macedonian call',dr:dQ2,ht:'<p>At <b>Lystra</b>, <b>Timothy</b> joined Paul\'s team. Later, Paul received a vision of a <b>man of Macedonia</b> pleading, "Come over and help us," prompting the team to cross into Europe for the first time (Acts 16:1-10).</p>'},
{lb:'Philippi, Thessalonica and Berea',dr:dQ2,ht:'<p>In <b>Philippi</b>, Lydia was converted and Paul and Silas were later imprisoned (Acts 16). In <b>Thessalonica</b>, Paul preached for three sabbaths with mixed response; in <b>Berea</b>, the Jews were commended as "noble" for examining the Scriptures daily to verify Paul\'s teaching (Acts 17:1-15).</p>'},
{lb:'Athens and Corinth',dr:dQ2,ht:'<p>In <b>Athens</b>, Paul addressed the philosophers at the <b>Areopagus</b>, referencing an altar "to an unknown god" (Acts 17:16-34). In <b>Corinth</b>, Paul stayed <b>18 months</b>, meeting fellow tentmakers <b>Aquila and Priscilla</b>, during the proconsulship of Gallio (Acts 18:1-17).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What disagreement caused Paul and Barnabas to separate before the second journey?","o":["Whether to bring John Mark again","A dispute over theology","A dispute over money","A dispute over which city to visit first"],"a":0,"w":"Paul and Barnabas disagreed over whether to bring John Mark again, leading to their separation."},{"q":"Who did Paul choose as his companion after separating from Barnabas?","o":["Timothy only, with no one else","Silas","Luke only, with no one else","Titus"],"a":1,"w":"Paul chose Silas as his companion after separating from Barnabas."},{"q":"At which city did Timothy join Paul's missionary team?","o":["Athens","Philippi","Lystra","Corinth"],"a":2,"w":"Timothy joined Paul's team at Lystra."},{"q":"What vision prompted Paul's team to cross into Europe for the first time?","o":["A vision of a burning bush","A vision of an angel in a Roman prison","A vision of the Jerusalem temple","A vision of a man of Macedonia pleading for help"],"a":3,"w":"A vision of a man of Macedonia pleading, \"Come over and help us,\" prompted the crossing into Europe."},{"q":"Who was converted in Philippi and became an early supporter of Paul's mission?","o":["Lydia","Priscilla","Aquila","Sergius Paulus"],"a":0,"w":"Lydia was converted in Philippi and became an early supporter of Paul's mission."},{"q":"Why were the Bereans described as \"noble\" in Acts 17:11?","o":["They gave Paul large sums of money","They examined the Scriptures daily to verify Paul's teaching","They immediately expelled Paul from their city","They refused to listen to Paul at all"],"a":1,"w":"The Bereans were described as noble because they examined the Scriptures daily to verify Paul's teaching."},{"q":"Where did Paul reference an altar \"to an unknown god\" in his famous sermon?","o":["Philippi","Corinth","Athens, at the Areopagus","Thessalonica"],"a":2,"w":"Paul referenced the altar to an unknown god in his Areopagus sermon in Athens."},{"q":"Which fellow tentmakers did Paul meet in Corinth?","o":["Barnabas and John Mark","Timothy and Titus","Silas and Luke","Aquila and Priscilla"],"a":3,"w":"Paul met fellow tentmakers Aquila and Priscilla in Corinth."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS • Acts & Epistles',ti:'Paul\'s Third Missionary Journey',su:'Trace the events of Paul\'s third missionary journey, centred on his extended ministry in Ephesus.',steps:[
{lb:'An extended ministry in Ephesus',dr:dQ1,ht:'<p>Paul spent approximately <b>three years</b> in <b>Ephesus</b> (Acts 19), his longest stay in any single city, where disciples who had only known John\'s baptism received the Holy Spirit, and <b>believers publicly burned their scrolls of sorcery</b>, valued at 50,000 pieces of silver.</p>'},
{lb:'The riot of the silversmiths',dr:dQ1,ht:'<p>A silversmith named <b>Demetrius</b>, whose trade making silver shrines of the goddess Artemis was threatened by Paul\'s preaching, incited a riot with the crowd chanting <em>"Great is Artemis of the Ephesians!"</em> for about two hours (Acts 19:23-41).</p>'},
{lb:'Raising Eutychus at Troas',dr:dQ1,ht:'<p>At <b>Troas</b>, during a long night sermon, a young man named <b>Eutychus</b> fell asleep, fell from a third-storey window, and was picked up dead; Paul went down, embraced him, and he was found <b>alive</b> (Acts 20:7-12).</p>'},
{lb:'The farewell at Miletus',dr:dQ1,ht:'<p>Paul called the <b>Ephesian elders</b> to meet him at <b>Miletus</b>, delivering an emotional farewell speech, warning of "savage wolves" who would distort the truth, and declaring he had "not hesitated to proclaim the whole will of God" (Acts 20:17-38).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"In which city did Paul spend his longest single stay, approximately three years, on this journey?","o":["Ephesus","Corinth","Athens","Philippi"],"a":0,"w":"Paul spent approximately three years in Ephesus, his longest stay in any single city."},{"q":"What did new believers in Ephesus publicly do with their scrolls of sorcery?","o":["Sold them for profit","Burned them","Hid them for safekeeping","Gave them to the Roman authorities"],"a":1,"w":"Believers in Ephesus publicly burned their scrolls of sorcery."},{"q":"Who incited the riot in Ephesus against Paul's ministry?","o":["Gallio","Sergius Paulus","Demetrius, a silversmith","Felix"],"a":2,"w":"Demetrius, a silversmith whose trade was threatened by Paul's preaching, incited the riot."},{"q":"What chant did the rioting crowd in Ephesus repeat for about two hours?","o":["\"Peace to Ephesus!\"","\"Long live Caesar!\"","\"Crucify him!\"","\"Great is Artemis of the Ephesians!\""],"a":3,"w":"The crowd chanted \"Great is Artemis of the Ephesians!\" for about two hours."},{"q":"What happened to the young man Eutychus at Troas?","o":["He fell asleep, fell from a window, and was found dead, then alive again","He was arrested by Roman soldiers","He led the riot against Paul","He betrayed Paul to the authorities"],"a":0,"w":"Eutychus fell asleep, fell from a window and was found dead, but Paul restored him to life."},{"q":"Where did Paul deliver his emotional farewell speech to the Ephesian elders?","o":["Ephesus itself","Miletus","Corinth","Jerusalem"],"a":1,"w":"Paul delivered his farewell speech to the Ephesian elders at Miletus."},{"q":"What did Paul warn the Ephesian elders about in his farewell speech?","o":["A coming famine","An imminent Roman invasion","\"Savage wolves\" who would distort the truth","A plan to relocate the church to Rome"],"a":2,"w":"Paul warned the elders about \"savage wolves\" who would distort the truth after his departure."},{"q":"What did Paul declare about his own ministry in his farewell speech?","o":["That his ministry had achieved nothing of value","That he regretted his missionary work entirely","That he had never preached in Ephesus","That he had not hesitated to proclaim the whole will of God"],"a":3,"w":"Paul declared that he had not hesitated to proclaim the whole will of God."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS • Acts & Epistles',ti:'Paul\'s Journey to Rome',su:'Explain the events surrounding Paul\'s arrest, shipwreck, and imprisonment in Rome.',steps:[
{lb:'Arrest and appeal to Caesar',dr:dQ2,ht:'<p>After being arrested in <b>Jerusalem</b> amid accusations from his opponents, Paul, as a <b>Roman citizen</b>, exercised his legal right to <b>appeal to Caesar</b>, resulting in his transfer to Rome for trial (Acts 21-26).</p>'},
{lb:'Shipwreck near Malta',dr:dQ2,ht:'<p>During the sea voyage, the ship encountered a violent storm and was eventually <b>wrecked</b>, but everyone on board reached land safely on the island of <b>Malta</b>, exactly as Paul had assured them would happen (Acts 27).</p>'},
{lb:'The viper on Malta',dr:dQ2,ht:'<p>On Malta, a <b>venomous snake</b> bit Paul\'s hand as he gathered firewood; the islanders expected him to die, but he suffered <b>no ill effects</b>, leading them to believe he was a god (Acts 28:1-6).</p>'},
{lb:'House arrest in Rome',dr:dQ2,ht:'<p>In Rome, Paul lived under <b>house arrest for two years</b>, at his own expense, welcoming all who visited him and <b>boldly and without hindrance</b> proclaiming the kingdom of God and teaching about the Lord Jesus Christ (Acts 28:30-31).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"In which city was Paul arrested before being sent to Rome?","o":["Jerusalem","Ephesus","Corinth","Athens"],"a":0,"w":"Paul was arrested in Jerusalem before being sent to Rome."},{"q":"What legal right did Paul exercise as a Roman citizen, leading to his transfer to Rome?","o":["A right to immediate release","An appeal to Caesar","A right to a jury of his peers","A right to be tried by the Sanhedrin only"],"a":1,"w":"Paul exercised his right as a Roman citizen to appeal to Caesar."},{"q":"What happened to the ship carrying Paul to Rome?","o":["It was captured by pirates","It arrived safely with no incident","It was wrecked in a violent storm","It sank with all hands lost"],"a":2,"w":"The ship carrying Paul was wrecked in a violent storm."},{"q":"On which island did everyone from the shipwreck reach land safely?","o":["Sicily","Cyprus","Crete","Malta"],"a":3,"w":"Everyone from the shipwreck reached land safely on the island of Malta."},{"q":"What happened to Paul on Malta while gathering firewood?","o":["A venomous snake bit his hand, with no ill effect","He was arrested again","He caught a serious illness","He was shipwrecked a second time"],"a":0,"w":"A venomous snake bit Paul's hand on Malta, but he suffered no ill effects."},{"q":"What did the islanders on Malta conclude after Paul suffered no harm from the snakebite?","o":["That he was a criminal deserving punishment","That he was a god","That the snake was not truly venomous","That he had used magic to protect himself"],"a":1,"w":"The islanders concluded Paul must be a god after he suffered no harm from the snakebite."},{"q":"For how long did Paul live under house arrest in Rome?","o":["Ten years","Six months","Two years","One week"],"a":2,"w":"Paul lived under house arrest in Rome for two years."},{"q":"How does Acts describe Paul's preaching during his house arrest in Rome?","o":["He was forbidden from preaching at all","Secretly and in fear","Only to Roman soldiers, with no other visitors","Boldly and without hindrance"],"a":3,"w":"Acts describes Paul as preaching boldly and without hindrance during his house arrest."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS • Acts & Epistles',ti:'Paul\'s Missionary Method and Strategy',su:'Analyse the strategic principles behind Paul\'s missionary approach.',steps:[
{lb:'"To the Jew first"',dr:dQ1,ht:'<p>In each new city, Paul typically went first to the local <b>synagogue</b>, preaching to Jews and God-fearing Gentiles there, before turning more fully to the wider <b>Gentile</b> population &mdash; a consistent pattern reflecting his theological principle of the gospel going "to the Jew first, and also to the Gentile" (Romans 1:16).</p>'},
{lb:'Strategic urban centres',dr:dQ1,ht:'<p>Paul deliberately targeted major <b>urban centres</b> along key trade and travel routes &mdash; Ephesus, Corinth, Philippi, Thessalonica &mdash; provincial capitals from which the gospel could naturally spread outward to surrounding regions through trade and travel networks.</p>'},
{lb:'Planting and strengthening churches',dr:dQ1,ht:'<p>Paul\'s method involved <b>planting new churches</b>, then deliberately <b>returning or sending companions</b> to strengthen them, appoint local elders, and address emerging problems &mdash; treating church-planting as an ongoing process, not a single event.</p>'},
{lb:'Financial self-sufficiency',dr:dQ1,ht:'<p>Paul frequently supported himself through his trade as a <b>tentmaker</b> (Acts 18:3), avoiding being a financial burden on young, often poor congregations, while still receiving support from established churches like Philippi when appropriate (Philippians 4:15-16).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Where did Paul typically preach first upon arriving in a new city?","o":["The local synagogue","The marketplace only","The Roman governor's palace","The nearest temple to a Greek god"],"a":0,"w":"Paul typically preached first in the local synagogue upon arriving in a new city."},{"q":"What theological principle from Romans 1:16 describes this pattern?","o":["The gospel being only for Gentiles","The gospel going \"to the Jew first, and also to the Gentile\"","The gospel being only for Jews","The gospel having no particular order of priority"],"a":1,"w":"Romans 1:16 describes the gospel going \"to the Jew first, and also to the Gentile.\""},{"q":"What kind of locations did Paul deliberately target for his missionary work?","o":["Only locations with no existing population","Only small, isolated rural villages","Major urban centres along key trade and travel routes","Only locations within the Roman Emperor's own household"],"a":2,"w":"Paul deliberately targeted major urban centres along key trade and travel routes."},{"q":"Why were these urban centres strategically valuable?","o":["They were entirely isolated from surrounding regions","They had no strategic value at all","They were the only places with any population","The gospel could naturally spread outward through trade and travel networks"],"a":3,"w":"These urban centres were valuable because the gospel could spread outward through trade and travel networks."},{"q":"What did Paul do after planting a new church, according to his method?","o":["Returned or sent companions to strengthen it and appoint elders","Abandoned it immediately with no further contact","Demanded it send him money regularly","Closed it down after a short time"],"a":0,"w":"Paul returned or sent companions to strengthen new churches and appoint elders."},{"q":"What trade did Paul use to support himself financially?","o":["Fishing","Tentmaking","Farming","Blacksmithing"],"a":1,"w":"Paul used tentmaking to support himself financially."},{"q":"Why did Paul often choose to support himself rather than rely on new congregations?","o":["Because tentmaking was more profitable than ministry","Because no congregation was ever willing to support him","To avoid being a financial burden on young, often poor congregations","Because he had no interest in ministry at all"],"a":2,"w":"Paul avoided being a financial burden on young, often poor congregations by supporting himself."},{"q":"Which established church did Paul accept financial support from, according to Philippians 4:15-16?","o":["No church ever supported Paul financially","The church at Ephesus","The church at Corinth only","The church at Philippi"],"a":3,"w":"Paul accepted financial support from the church at Philippi, according to Philippians 4:15-16."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS • Acts & Epistles',ti:'Key Companions of Paul',su:'Identify Paul\'s key missionary companions and their roles.',steps:[
{lb:'Barnabas: the encourager',dr:dQ2,ht:'<p><b>Barnabas</b> (whose name means "son of encouragement") was Paul\'s companion on the first missionary journey, having earlier vouched for Paul\'s genuine conversion to the wary Jerusalem church (Acts 9:26-27).</p>'},
{lb:'Silas and Timothy',dr:dQ2,ht:'<p><b>Silas</b> accompanied Paul on the second journey after his split with Barnabas; <b>Timothy</b>, a young disciple from Lystra with a Jewish mother and Greek father, joined at Lystra and became one of Paul\'s closest, most trusted co-workers, later receiving two personal letters from Paul.</p>'},
{lb:'Luke the physician',dr:dQ2,ht:'<p><b>Luke</b>, described by Paul as "the beloved physician" (Colossians 4:14), likely accompanied Paul for portions of his journeys, as suggested by the "we" passages in Acts, and is traditionally credited as the author of both <b>Luke\'s Gospel and Acts</b>.</p>'},
{lb:'Priscilla and Aquila, and Titus',dr:dQ2,ht:'<p><b>Priscilla and Aquila</b>, a married couple and fellow tentmakers, worked closely with Paul in Corinth and Ephesus; <b>Titus</b>, another close companion, was later left by Paul in <b>Crete</b> to organise the church there.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does the name \"Barnabas\" mean?","o":["\"Son of encouragement\"","\"Son of thunder\"","\"Beloved physician\"","\"Man of sorrows\""],"a":0,"w":"\"Barnabas\" means \"son of encouragement.\""},{"q":"What had Barnabas done for Paul earlier, before their missionary journey together?","o":["Betrayed Paul to the Sanhedrin","Vouched for Paul's genuine conversion to the wary Jerusalem church","Refused to associate with Paul at all","Led the riot against Paul in Ephesus"],"a":1,"w":"Barnabas had vouched for Paul's genuine conversion to the wary Jerusalem church."},{"q":"Who accompanied Paul on the second missionary journey after his split with Barnabas?","o":["Luke","Titus","Silas","Aquila"],"a":2,"w":"Silas accompanied Paul on the second missionary journey."},{"q":"At which city did Timothy join Paul's missionary team?","o":["Athens","Ephesus","Corinth","Lystra"],"a":3,"w":"Timothy joined Paul's missionary team at Lystra."},{"q":"What is notable about Timothy's family background?","o":["He had a Jewish mother and a Greek father","Both his parents were Roman citizens","Both his parents were high priests","He was an orphan with no known family"],"a":0,"w":"Timothy had a Jewish mother and a Greek father."},{"q":"How does Paul describe Luke in Colossians 4:14?","o":["\"The zealous Pharisee\"","\"The beloved physician\"","\"The faithful tax collector\"","\"The wandering fisherman\""],"a":1,"w":"Paul describes Luke as \"the beloved physician\" in Colossians 4:14."},{"q":"What two New Testament books is Luke traditionally credited with writing?","o":["Matthew and Mark","Romans and Galatians","Luke's Gospel and Acts","1 and 2 Corinthians"],"a":2,"w":"Luke is traditionally credited with writing Luke's Gospel and Acts."},{"q":"Where did Paul leave Titus to organise the church there?","o":["Philippi","Rome","Ephesus","Crete"],"a":3,"w":"Paul left Titus in Crete to organise the church there."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS • Acts & Epistles',ti:'Paul\'s Letters and the Missionary Journeys',su:'Connect Paul\'s epistles to the specific missionary journeys and circumstances in which they were written.',steps:[
{lb:'Letters from the second journey: Corinth',dr:dQ1,ht:'<p>Paul wrote <b>1 and 2 Thessalonians</b> from Corinth during his second missionary journey, addressing a young church he had only recently visited, encouraging them amid persecution and clarifying confusion about Christ\'s return.</p>'},
{lb:'Letters from the third journey: Ephesus and Corinth',dr:dQ1,ht:'<p>During his third journey, Paul wrote <b>1 Corinthians</b> from Ephesus, addressing serious divisions and moral problems in the Corinthian church, and later <b>Romans</b> from Corinth, his most theologically comprehensive letter, likely written in anticipation of a visit to Rome he had not yet made.</p>'},
{lb:'The prison epistles',dr:dQ1,ht:'<p>During his <b>Roman imprisonment</b> (house arrest), Paul wrote what are called the "prison epistles": <b>Ephesians, Philippians, Colossians</b>, and the short personal letter <b>Philemon</b>, all reflecting mature theological reflection from confinement.</p>'},
{lb:'Reading letters in their historical context',dr:dQ1,ht:'<p>Understanding <b>where and when</b> Paul wrote each letter helps readers interpret its content accurately &mdash; for example, Philippians\' repeated theme of "joy" carries particular weight given it was written from prison, not comfortable circumstances.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"From which city did Paul write 1 and 2 Thessalonians, during his second missionary journey?","o":["Corinth","Ephesus","Rome","Athens"],"a":0,"w":"Paul wrote 1 and 2 Thessalonians from Corinth during his second missionary journey."},{"q":"From which city did Paul write 1 Corinthians, during his third missionary journey?","o":["Corinth itself","Ephesus","Rome","Philippi"],"a":1,"w":"Paul wrote 1 Corinthians from Ephesus during his third missionary journey."},{"q":"What issue did 1 Corinthians primarily address?","o":["A dispute over circumcision only","A dispute over Roman taxation","Serious divisions and moral problems in the Corinthian church","A dispute over the location of a new church building"],"a":2,"w":"1 Corinthians primarily addressed serious divisions and moral problems in the Corinthian church."},{"q":"From which city did Paul write Romans, his most theologically comprehensive letter?","o":["Philippi","Ephesus","Rome","Corinth"],"a":3,"w":"Paul wrote Romans from Corinth."},{"q":"Why is Romans thought to have been written in anticipation of a future event?","o":["A visit to Rome Paul had not yet made","A visit to Jerusalem he had already completed","His imminent execution, which he expected soon","His retirement from all missionary work"],"a":0,"w":"Romans is thought to anticipate a visit to Rome that Paul had not yet made."},{"q":"Which four letters are known as the \"prison epistles\"?","o":["Romans, Galatians, 1 and 2 Corinthians","Ephesians, Philippians, Colossians and Philemon","1 and 2 Thessalonians, 1 and 2 Timothy","Titus, Philemon, James and Jude"],"a":1,"w":"Ephesians, Philippians, Colossians and Philemon are known as the prison epistles."},{"q":"During which circumstance were the prison epistles written?","o":["Paul's shipwreck on Malta","Paul's first missionary journey","Paul's Roman imprisonment (house arrest)","Paul's time as a persecutor before conversion"],"a":2,"w":"The prison epistles were written during Paul's Roman imprisonment."},{"q":"Why does knowing the historical context of a letter like Philippians matter for interpretation?","o":["Context only matters for the Old Testament, not the Epistles","Historical context never affects how a letter should be understood","Philippians was actually written before Paul's conversion","It shows the theme of \"joy\" carries particular weight, given it was written from prison"],"a":3,"w":"Knowing the context shows Philippians' theme of joy carries particular weight, given it was written from prison."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS • Acts & Epistles',ti:'Challenges and Opposition Paul Faced',su:'Evaluate the range of challenges and opposition Paul encountered during his missionary work.',steps:[
{lb:'Opposition from Jewish communities',dr:dQ2,ht:'<p>Paul repeatedly faced opposition from <b>Jewish communities</b> who rejected his message, sometimes plotting against his life (as at Damascus, Acts 9:23-25) or inciting local authorities against him (as at Pisidian Antioch and Thessalonica).</p>'},
{lb:'Riots and civil unrest',dr:dQ2,ht:'<p>Paul\'s preaching sometimes provoked <b>civil unrest</b>, most dramatically the Ephesian riot incited by Demetrius the silversmith (Acts 19), when local economic interests felt directly threatened by the gospel\'s spread.</p>'},
{lb:'Physical suffering',dr:dQ2,ht:'<p>As his own catalogue in 2 Corinthians 11:23-28 details, Paul endured <b>repeated physical suffering</b>: floggings, beatings, stoning (at Lystra), and shipwreck &mdash; suffering that never stopped his continued missionary work.</p>'},
{lb:'Opposition and division within churches',dr:dQ2,ht:'<p>Beyond external opposition, Paul also faced <b>internal challenges</b> within the churches he founded &mdash; false teachers undermining his authority, moral failures (as in Corinth), and theological disputes (such as the circumcision controversy) requiring careful pastoral correction.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What kind of opposition did Paul repeatedly face from Jewish communities?","o":["Rejection of his message and sometimes plots against his life","Complete and immediate acceptance everywhere he went","Financial support with no opposition at all","Support only from Jewish communities, opposition only from Gentiles"],"a":0,"w":"Paul repeatedly faced rejection and sometimes plots against his life from Jewish communities."},{"q":"At which city did Jewish opponents plot against Paul's life shortly after his conversion?","o":["Corinth","Damascus","Athens","Rome"],"a":1,"w":"Jewish opponents plotted against Paul's life at Damascus shortly after his conversion."},{"q":"What kind of civil unrest did Paul's preaching provoke in Ephesus?","o":["A formal legal trial with no violence","A peaceful public celebration","A riot incited by Demetrius the silversmith","A complete absence of any unrest"],"a":2,"w":"Paul's preaching provoked a riot in Ephesus, incited by Demetrius the silversmith."},{"q":"Why did Demetrius feel threatened by Paul's preaching?","o":["He supported Paul's message completely","He was a secret follower of Paul already","He had no connection to Paul's ministry at all","His trade making silver shrines of Artemis was economically threatened"],"a":3,"w":"Demetrius felt economically threatened because his trade making silver shrines of Artemis was affected by Paul's preaching."},{"q":"Which passage details Paul's catalogue of physical sufferings?","o":["2 Corinthians 11:23-28","Romans 8:35-39","Philippians 1:29","1 Peter 4:12-16"],"a":0,"w":"2 Corinthians 11:23-28 details Paul's catalogue of physical sufferings."},{"q":"What kinds of physical suffering does this catalogue mention?","o":["Only minor inconveniences with no real hardship","Floggings, beatings, stoning and shipwreck","Only imprisonment, with no physical harm","No suffering of any kind is mentioned"],"a":1,"w":"The catalogue mentions floggings, beatings, stoning and shipwreck among Paul's sufferings."},{"q":"What kind of internal challenge did Paul face within the church at Corinth?","o":["A refusal to ever communicate with Paul","Complete unity with no problems of any kind","Moral failures requiring careful pastoral correction","An immediate agreement on every issue"],"a":2,"w":"Paul faced moral failures within the Corinthian church, requiring careful pastoral correction."},{"q":"Which theological dispute required Paul's careful pastoral involvement, alongside other apostles?","o":["A dispute over the Nigerian Civil War","A dispute over Roman taxation","A dispute over the location of the temple","The circumcision controversy"],"a":3,"w":"The circumcision controversy required Paul's careful pastoral involvement, resolved at the Jerusalem Council."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS • Acts & Epistles',ti:'WAEC Exam Preparation — Missionary Journeys of Paul',su:'Practise WAEC-style questions on Paul\'s missionary journeys.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on Paul\'s journeys: (1) Identify the <b>specific journey or event</b> asked about. (2) Give the <b>precise Bible reference</b>. (3) Describe <b>key places, people and events</b> in sequence. (4) Draw out a <b>lesson</b> for Christian mission today.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "Trace the events of Paul\'s first missionary journey." / "Describe Paul\'s ministry in Ephesus." / "Discuss the circumstances of Paul\'s journey to Rome." / "What lessons can Christians learn from Paul\'s missionary strategy?"</p>'},
{lb:'Key references to remember',dr:dQ1,ht:'<p>Key references: <b>Acts 13-14</b> (first journey); <b>Acts 15:36-18:22</b> (second journey, Macedonian call, Athens, Corinth); <b>Acts 18:23-21:16</b> (third journey, Ephesus, Miletus); <b>Acts 27-28</b> (journey to Rome, shipwreck).</p>'},
{lb:'Using a timeline approach',dr:dQ1,ht:'<p>Building a clear mental <b>timeline</b> of the four journeys/phases &mdash; first (Cyprus, Galatia) &rarr; second (Macedonia, Greece) &rarr; third (Ephesus) &rarr; journey to Rome &mdash; helps structure confident, well-organised WAEC answers.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on Paul's missionary journeys?","o":["Identify the specific journey or event asked about","Immediately give a personal opinion with no facts","List unrelated facts with no explanation","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on this topic should begin by identifying the specific journey or event asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Describe Paul's ministry in Ephesus.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"Describe Paul's ministry in Ephesus\" is a typical WAEC-style question on this topic."},{"q":"Which chapters of Acts record Paul's first missionary journey?","o":["Acts 18:23-21:16","Acts 15:36-18:22","Acts 13-14","Acts 27-28"],"a":2,"w":"Acts 13-14 records Paul's first missionary journey."},{"q":"Which chapters of Acts record Paul's second missionary journey?","o":["Acts 27-28","Acts 13-14","Acts 18:23-21:16","Acts 15:36-18:22"],"a":3,"w":"Acts 15:36-18:22 records Paul's second missionary journey."},{"q":"Which chapters of Acts record Paul's third missionary journey?","o":["Acts 18:23-21:16","Acts 13-14","Acts 15:36-18:22","Acts 27-28"],"a":0,"w":"Acts 18:23-21:16 records Paul's third missionary journey."},{"q":"Which chapters of Acts record Paul's journey to Rome?","o":["Acts 13-14","Acts 27-28","Acts 15:36-18:22","Acts 18:23-21:16"],"a":1,"w":"Acts 27-28 records Paul's journey to Rome, including the shipwreck."},{"q":"Why is building a mental timeline of the four journeys/phases useful for WAEC preparation?","o":["It is discouraged by WAEC examiners","It replaces the need for any specific facts","It helps structure confident, well-organised answers","It only applies to essays about the Old Testament"],"a":2,"w":"A mental timeline helps structure confident, well-organised WAEC answers on this topic."},{"q":"What should a WAEC essay draw out after describing key places, people and events?","o":["A criticism of the Bible's reliability","Nothing further — the essay should end abruptly","An unrelated historical fact","A lesson for Christian mission today"],"a":3,"w":"A WAEC essay should draw out a lesson for Christian mission today after describing the events."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS • Acts & Epistles',ti:'Mixed Questions — Missionary Journeys of Paul',su:'Integrated revision across all four phases of Paul\'s missionary work.',steps:[
{lb:'Summary of the four journeys',dr:dQ2,ht:'<p>Paul\'s missionary work spans four phases: the <b>first journey</b> (Cyprus, Galatia, Acts 13-14), the <b>second journey</b> (Macedonia, Greece, Acts 15:36-18:22), the <b>third journey</b> (centred on Ephesus, Acts 18:23-21:16), and the <b>journey to Rome</b> (Acts 27-28).</p>'},
{lb:'Key names and places to remember',dr:dQ2,ht:'<p>Must-know facts: <b>Barnabas</b> (first journey); <b>Silas and Timothy</b> (second journey); the <b>Macedonian call</b>; <b>Areopagus</b> sermon in Athens; <b>Ephesus</b> (three years, riot); <b>Miletus</b> farewell; <b>Malta</b> shipwreck; Roman <b>house arrest</b>.</p>'},
{lb:'Lessons for today',dr:dQ2,ht:'<p>Paul\'s journeys teach enduring lessons about strategic, sacrificial mission, perseverance amid opposition, the importance of nurturing new churches, and boldness in proclaiming the gospel "without hindrance" regardless of circumstance.</p>'},
{lb:'Final exam tips',dr:dQ2,ht:'<p>Always give the <b>precise Bible reference</b> for each journey, name key people and places in the correct sequence, and conclude by connecting Paul\'s example to lessons for Christian mission and perseverance today.</p>'},
