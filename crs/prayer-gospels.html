<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}

body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});

{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What prompted Jesus to give the Lord's Prayer, according to Matthew 6?","o":["The disciples asking Him to teach them to pray","A public debate with the Pharisees","A miracle He had just performed","A question from Roman soldiers"],"a":0,"w":"The disciples asking Jesus to teach them to pray prompted the Lord's Prayer."},{"q":"How does the Lord's Prayer address God, at its opening?","o":["\"Almighty Judge\"","\"Our Father in heaven\"","\"Distant Creator\"","\"Righteous King\""],"a":1,"w":"The Lord's Prayer opens by addressing God as \"Our Father in heaven.\""},{"q":"What does the prayer say about God's name?","o":["\"Hidden be your name\"","\"Feared be your name\"","\"Hallowed be your name\"","\"Questioned be your name\""],"a":2,"w":"The prayer says, \"Hallowed be your name.\""},{"q":"What does this lesson say worship and reverence do, in relation to personal requests in the prayer?","o":["They replace the need for requests entirely","They come only after requests are made","They have no particular order at all","They precede any personal requests"],"a":3,"w":"Worship and reverence precede any personal requests in the Lord's Prayer, according to this lesson."},{"q":"What does the prayer ask regarding God's kingdom and will?","o":["\"Your kingdom come, your will be done, on earth as it is in heaven\"","\"Your kingdom delay, your will be questioned\"","\"My kingdom come, my will be done\"","Nothing regarding God's kingdom or will"],"a":0,"w":"The prayer asks, \"Your kingdom come, your will be done, on earth as it is in heaven.\""},{"q":"What comes before requests for personal provision, according to this lesson's structure of the prayer?","o":["A list of personal complaints","Submission to God's purposes","A recitation of past sins only","Nothing comes before such requests"],"a":1,"w":"Submission to God's purposes comes before requests for personal provision, according to this lesson."},{"q":"What request follows submission to God's will in the Lord's Prayer?","o":["Political power","Permanent wealth","Daily bread","Military victory"],"a":2,"w":"A request for daily bread follows submission to God's will in the Lord's Prayer."},{"q":"What condition does the prayer attach to receiving forgiveness of sins?","o":["No condition is attached","Only after a period of fasting","Only after public confession","As we forgive others"],"a":3,"w":"The prayer attaches forgiving others as the condition for receiving forgiveness of sins."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:"Q2 \u2022 CRS \u2022 Gospels",ti:"Jesus\u2019s Example of Prayer",su:"Explain how Jesus\u2019s own prayer life models a disciplined and dependent relationship with the Father.",steps:[
{lb:"Early morning prayer",dr:dQ2,ht:"<p>Mark 1:35 records, <em>\"Very early in the morning, while it was still dark, Jesus... went off to a solitary place, where he prayed\"</em> &mdash; showing prayer as a disciplined priority, even amid a busy ministry.</p>"},

{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Mark 1:35 say Jesus did very early in the morning?","o":["Went to a solitary place and prayed","Taught in the synagogue","Healed the sick","Fed a large crowd"],"a":0,"w":"Mark 1:35 says Jesus went to a solitary place and prayed very early in the morning."},{"q":"What does this lesson say Jesus's early morning prayer shows, despite His busy ministry?","o":["Prayer as an occasional, optional activity","Prayer as a disciplined priority","A lack of commitment to His mission","No real pattern of prayer at all"],"a":1,"w":"Jesus's early morning prayer shows prayer as a disciplined priority, despite a busy ministry."},{"q":"What does Luke 5:16 say Jesus often did?","o":["Prayed only in public settings","Avoided all forms of solitude","Withdrew to lonely places and prayed","Delegated prayer to His disciples"],"a":2,"w":"Luke 5:16 says Jesus often withdrew to lonely places and prayed."},{"q":"What did Jesus do before choosing the twelve apostles, according to Luke 6:12?","o":["Made the decision without any prayer","Consulted the Pharisees","Held a public vote among His followers","Spent the night praying to God"],"a":3,"w":"Luke 6:12 says Jesus spent the night praying to God before choosing the twelve apostles."},{"q":"What does this lesson say Jesus was seeking through this night of prayer?","o":["The Father's guidance before a significant decision","Physical rest before a long journey","Approval from the religious leaders","Nothing of any real significance"],"a":0,"w":"Jesus was seeking the Father's guidance before a significant decision, according to this lesson."},{"q":"What did Jesus pray in Gethsemane, according to Luke 22:42?","o":["\"My will alone must be done\"","\"Not my will, but yours be done\"","\"Let this cup pass with no further thought\"","\"I refuse this task entirely\""],"a":1,"w":"Jesus prayed, \"Not my will, but yours be done,\" in Gethsemane (Luke 22:42)."},{"q":"What emotional state accompanied Jesus's prayer in Gethsemane?","o":["Indifference","Complete peace with no struggle","Anguish","Joyful celebration"],"a":2,"w":"Jesus's prayer in Gethsemane was accompanied by anguish."},{"q":"What does this lesson say Gethsemane models for believers?","o":["That prayer is unnecessary during hardship","That prayer removes all suffering immediately","That true prayer never involves any struggle","The ultimate model of surrender to the Father's will, even facing suffering"],"a":3,"w":"Gethsemane models the ultimate surrender to the Father's will, even facing suffering, according to this lesson."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Why did Jesus tell the Parable of the Persistent Widow, according to Luke 18:1?","o":["To show that they should always pray and not give up","To criticise the temple authorities","To explain the coming destruction of Jerusalem","To describe the future kingdom of God"],"a":0,"w":"Luke 18:1 says Jesus told this parable to show that they should always pray and not give up."},{"q":"What is the central lesson of this parable, according to this lesson?","o":["Justice always comes immediately","Perseverance, not giving up too soon, in prayer","Prayer is unnecessary if God already knows our needs","Only widows should pray persistently"],"a":1,"w":"Perseverance in prayer, not giving up too soon, is the central lesson of this parable."},{"q":"How is the judge described in Luke 18:2?","o":["A close friend of the widow","A deeply devout and compassionate man","Neither fearing God nor caring what people thought","A relative of the widow's adversary"],"a":2,"w":"Luke 18:2 describes the judge as neither fearing God nor caring what people thought."},{"q":"What did the widow repeatedly ask the judge for?","o":["Release of a family member from prison","Financial compensation","Permission to remarry","Justice against her adversary"],"a":3,"w":"The widow repeatedly asked the judge for justice against her adversary."},{"q":"Why did the judge eventually grant the widow's request, according to Luke 18:5?","o":["Her persistent coming was wearing him out","He suddenly became a righteous man","She offered him a bribe","A higher authority ordered him to"],"a":0,"w":"Luke 18:5 says the judge granted her request because her persistent coming was wearing him out."},{"q":"What does this lesson say even a reluctant, unjust judge demonstrates?","o":["That justice is always immediate and effortless","That persistence can produce results, even from an unwilling party","That prayer has no real effect on outcomes","That only judges can grant true justice"],"a":1,"w":"This lesson notes that even a reluctant, unjust judge shows persistence can produce results."},{"q":"What question does Jesus ask in Luke 18:7 about God's chosen ones?","o":["\"Should believers avoid persistent prayer?\"","\"Does God ever answer prayer at all?\"","\"Will not God bring about justice for his chosen ones...?\"","\"Is justice ever truly possible?\""],"a":2,"w":"Jesus asks, \"Will not God bring about justice for his chosen ones...?\" in Luke 18:7."},{"q":"What comparison does Jesus draw between the unjust judge and God?","o":["God requires no persistence in prayer at all","God is less likely to respond than an unjust judge","There is no meaningful comparison intended","If even an unjust judge responds to persistence, God will certainly respond to His people"],"a":3,"w":"Jesus draws the comparison that if even an unjust judge responds to persistence, God will certainly respond to His people."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:"Two men praying",dr:dQ2,ht:"<p>Luke 18:9-14 describes two men who went to the temple to pray: a <b>Pharisee</b>, confident in his own righteousness, and a <b>tax collector</b>, aware of his sin.</p>"},
{lb:"The Pharisee's prayer",dr:dQ2,ht:"<p>The Pharisee prayed, <em>\"God, I thank you that I am not like other people... I fast twice a week and give a tenth of all I get\"</em> (Luke 18:11-12) &mdash; a prayer of self-congratulation, not humility.</p>"},
{lb:"The tax collector's prayer",dr:dQ2,ht:"<p>By contrast, the tax collector would not even look up to heaven, but beat his breast and said, <em>\"God, have mercy on me, a sinner\"</em> (Luke 18:13) &mdash; a prayer of honest confession.</p>"},
{lb:"Justified before God",dr:dQ2,ht:"<p>Jesus declares that the tax collector, not the Pharisee, <em>\"went home justified before God\"</em> (Luke 18:14), because <b>\"those who exalt themselves will be humbled, and those who humble themselves will be exalted.\"</b></p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Who are the two men described in Luke 18:9-14?","o":["A Pharisee and a tax collector","Two Roman soldiers","Two disciples of Jesus","A priest and a Levite"],"a":0,"w":"A Pharisee and a tax collector are the two men described in Luke 18:9-14."},{"q":"How did the Pharisee begin his prayer, in Luke 18:11?","o":["\"God, have mercy on me, a sinner\"","\"God, I thank you that I am not like other people\"","\"God, forgive my many sins\"","\"God, I do not deserve to be here\""],"a":1,"w":"The Pharisee began, \"God, I thank you that I am not like other people\" (Luke 18:11)."},{"q":"What two religious practices did the Pharisee mention in his prayer?","o":["Reading Scripture and attending synagogue","Praying five times daily and giving alms","Fasting twice a week and giving a tenth of his income","Making pilgrimages and offering sacrifices"],"a":2,"w":"The Pharisee mentioned fasting twice a week and giving a tenth of his income (Luke 18:12)."},{"q":"How does this lesson describe the Pharisee's prayer?","o":["A prayer focused entirely on others' needs","A prayer of genuine repentance","A model prayer for all believers","A prayer of self-congratulation, not humility"],"a":3,"w":"This lesson describes the Pharisee's prayer as self-congratulatory, not humble."},{"q":"How did the tax collector pray, according to Luke 18:13?","o":["\"God, have mercy on me, a sinner\"","\"God, I thank you for my righteousness\"","\"God, judge my enemies\"","\"God, reward my good deeds\""],"a":0,"w":"The tax collector prayed, \"God, have mercy on me, a sinner\" (Luke 18:13)."},{"q":"What physical actions accompanied the tax collector's prayer?","o":["He raised his hands and looked upward","He would not look up to heaven and beat his breast","He knelt with hands folded quietly","He prayed while walking through the temple"],"a":1,"w":"The tax collector would not look up to heaven and beat his breast (Luke 18:13)."},{"q":"Who did Jesus say went home justified before God, in Luke 18:14?","o":["Both men equally","The Pharisee","The tax collector","Neither man"],"a":2,"w":"Jesus said the tax collector went home justified before God (Luke 18:14)."},{"q":"What principle does Jesus state about exaltation and humility, in Luke 18:14?","o":["Only religious leaders can be truly humble","Self-exaltation always leads to greater honour","Humility has no bearing on one's standing before God","Those who exalt themselves will be humbled, and those who humble themselves will be exalted"],"a":3,"w":"Jesus states that those who exalt themselves will be humbled, and those who humble themselves will be exalted (Luke 18:14)."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q5 \u2022 CRS \u2022 Gospels",ti:"Praying in Secret",su:"Explain Jesus\u2019s teaching on prayer as a private, sincere act rather than public performance.",steps:[
{lb:"Not like the hypocrites",dr:dQ1,ht:"<p>Jesus warned, <em>\"when you pray, do not be like the hypocrites, for they love to pray standing in the synagogues and on the street corners to be seen by others\"</em> (Matthew 6:5).</p>"},
{lb:"They have received their reward",dr:dQ1,ht:"<p>Jesus states such people <em>\"have received their reward in full\"</em> (Matthew 6:5) &mdash; the public admiration they sought is the only reward they will ever get.</p>"},
{lb:"Go into your room",dr:dQ1,ht:"<p>Instead, Jesus instructs, <em>\"go into your room, close the door and pray to your Father, who is unseen\"</em> (Matthew 6:6) &mdash; genuine prayer prioritises intimacy with God over public visibility.</p>"},
{lb:"Rewarded by the Father",dr:dQ1,ht:"<p>Jesus concludes, <em>\"then your Father, who sees what is done in secret, will reward you\"</em> (Matthew 6:6) &mdash; sincerity before God, not human approval, is the true measure of prayer.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Jesus warn against in Matthew 6:5?","o":["Praying to be seen by others, like the hypocrites","Praying at all in public settings","Praying too briefly","Praying only in the temple"],"a":0,"w":"Matthew 6:5 warns against praying to be seen by others, like the hypocrites."},{"q":"Where does Matthew 6:5 say the hypocrites love to pray?","o":["Only in their own private homes","Standing in the synagogues and street corners","Only at the temple altar","Only during the Sabbath"],"a":1,"w":"Matthew 6:5 says the hypocrites love to pray standing in the synagogues and street corners."},{"q":"What does Jesus say the hypocrites have already received, in Matthew 6:5?","o":["A reward from God alone","No reward of any kind","Their reward in full","A greater reward than sincere believers"],"a":2,"w":"Jesus says the hypocrites have received their reward in full (Matthew 6:5)."},{"q":"What reward does this lesson say the hypocrites' public admiration represents?","o":["No real reward at all, even temporarily","A partial reward, with more to come from God","A reward that is later multiplied by God","The only reward they will ever get"],"a":3,"w":"This lesson explains the public admiration is the only reward the hypocrites will ever get."},{"q":"What does Jesus instruct in Matthew 6:6 instead of public prayer?","o":["Go into your room, close the door, and pray to your Father","Pray only in large public gatherings","Avoid prayer altogether","Pray only through an appointed priest"],"a":0,"w":"Matthew 6:6 instructs going into your room, closing the door, and praying to your Father."},{"q":"How does Matthew 6:6 describe God, in relation to this private prayer?","o":["A distant, uninvolved observer","\"Your Father, who is unseen\"","Only visible in the temple","Only present in public gatherings"],"a":1,"w":"Matthew 6:6 describes God as \"your Father, who is unseen.\""},{"q":"What does this lesson say genuine prayer prioritises?","o":["Neither intimacy nor visibility matters","Public visibility over private sincerity","Intimacy with God over public visibility","Only the length and formality of the prayer"],"a":2,"w":"Genuine prayer prioritises intimacy with God over public visibility, according to this lesson."},{"q":"Who does Matthew 6:6 say will reward secret prayer?","o":["Only religious leaders with spiritual insight","Only fellow believers who happen to notice","No one — secret prayer goes unnoticed and unrewarded","The Father, who sees what is done in secret"],"a":3,"w":"Matthew 6:6 says the Father, who sees what is done in secret, will reward such prayer."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q6 \u2022 CRS \u2022 Gospels",ti:"Ask, Seek, Knock",su:"Explain Jesus\u2019s teaching on confident, persistent asking in prayer.",steps:[
{lb:"Ask, seek, knock",dr:dQ2,ht:"<p>Jesus teaches, <em>\"Ask and it will be given to you; seek and you will find; knock and the door will be opened to you\"</em> (Matthew 7:7) &mdash; three active verbs describing confident, persistent prayer.</p>"},
{lb:"Everyone who asks receives",dr:dQ2,ht:"<p>Jesus reinforces this with a universal principle: <em>\"everyone who asks receives; the one who seeks finds; and to the one who knocks, the door will be opened\"</em> (Matthew 7:8).</p>"},
{lb:"A father's good gifts",dr:dQ2,ht:"<p>Jesus reasons that if imperfect human fathers know how to give good gifts to their children, <em>\"how much more will your Father in heaven give good gifts to those who ask him\"</em> (Matthew 7:11).</p>"},
{lb:"Good gifts, not every wish",dr:dQ2,ht:"<p>This teaching emphasises confident trust in God's <b>goodness</b>, not a guarantee that every specific request will be granted exactly as asked &mdash; God gives what is truly good.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What three actions does Jesus describe in Matthew 7:7?","o":["Ask, seek, knock","Fast, pray, give","Confess, repent, believe","Sing, dance, rejoice"],"a":0,"w":"Matthew 7:7 describes asking, seeking and knocking."},{"q":"What does Jesus promise will happen to those who ask, according to Matthew 7:7?","o":["Nothing will ever be given","It will be given to them","Only a select few will receive anything","Only religious leaders will receive answers"],"a":1,"w":"Matthew 7:7 promises that it will be given to those who ask."},{"q":"What universal principle does Jesus state in Matthew 7:8?","o":["Seeking is pointless, since answers come only by asking","Only some people who ask will ever receive anything","Everyone who asks receives; the one who seeks finds; the one who knocks, the door is opened","Knocking has no real effect on receiving an answer"],"a":2,"w":"Matthew 7:8 states everyone who asks receives, the one who seeks finds, and the one who knocks finds the door opened."},{"q":"What comparison does Jesus draw in Matthew 7:11 regarding human fathers?","o":["Human fathers are better than God at giving good gifts","Human fathers never give good gifts to their children","Fathers are irrelevant to understanding God's character","Even imperfect fathers know how to give good gifts to their children"],"a":3,"w":"Jesus compares that even imperfect human fathers know how to give good gifts to their children (Matt 7:11)."},{"q":"What does Matthew 7:11 say about God's giving, compared to human fathers?","o":["God will give good gifts even more so to those who ask Him","God gives less generously than human fathers","God never gives any gifts to those who ask","God's giving has no connection to human giving"],"a":0,"w":"Matthew 7:11 says God will give good gifts even more so to those who ask Him."},{"q":"What does this lesson say this teaching emphasises about prayer?","o":["A guarantee that every specific request will be granted exactly as asked","Confident trust in God's goodness","That prayer is entirely unnecessary","That only wealthy people receive answers to prayer"],"a":1,"w":"This teaching emphasises confident trust in God's goodness, according to this lesson."},{"q":"What distinction does this lesson draw about the nature of God's answers to prayer?","o":["God never answers prayer in any form","God always grants every wish exactly as requested","God gives what is truly good, not necessarily every specific wish","Prayer requests are entirely irrelevant to outcomes"],"a":2,"w":"This lesson distinguishes that God gives what is truly good, not necessarily every specific wish."},{"q":"What overall confidence does Matthew 7:7-11 encourage in believers?","o":["Confidence only in one's own abilities, not God's","Confidence that God is indifferent to requests","Confidence that prayer is a wasted effort","Confidence to ask God, trusting His good character"],"a":3,"w":"Matthew 7:7-11 encourages confidence to ask God, trusting His good character."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q7 \u2022 CRS \u2022 Gospels",ti:"Prayer in Jesus\u2019s Name",su:"Explain the significance of praying in Jesus\u2019s name.",steps:[
{lb:"A new basis for prayer",dr:dQ1,ht:"<p>Jesus told His disciples, <em>\"whatever you ask in my name, this I will do, that the Father may be glorified in the Son\"</em> (John 14:13) &mdash; introducing prayer offered on the basis of His authority and merit.</p>"},
{lb:"Not a magic formula",dr:dQ1,ht:"<p>Praying <b>\"in Jesus's name\"</b> does not function as a magic phrase, but expresses alignment with Christ's character, will and purposes &mdash; asking as His representative, not merely adding His name to any request.</p>"},
{lb:"Complete joy",dr:dQ1,ht:"<p>John 16:24 promises, <em>\"Ask and you will receive, and your joy will be complete\"</em> &mdash; prayer in Jesus's name is connected to genuine spiritual joy and fulfilment.</p>"},
{lb:"Direct access to the Father",dr:dQ1,ht:"<p>This teaching reflects a new intimacy made possible through Christ: believers now have <b>direct access</b> to the Father through the Son, rather than through human priests or intermediaries alone.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What did Jesus promise regarding prayer offered in His name, in John 14:13?","o":["\"Whatever you ask in my name, this I will do\"","\"Only some requests in my name will be granted\"","\"Prayer in my name has no special significance\"","\"Only the apostles may pray in my name\""],"a":0,"w":"John 14:13 says, \"Whatever you ask in my name, this I will do.\""},{"q":"What purpose does John 14:13 give for answering prayer offered in Jesus's name?","o":["Only to satisfy the disciples' personal wishes","That the Father may be glorified in the Son","To demonstrate Jesus's power over Rome","No stated purpose is given"],"a":1,"w":"John 14:13 says the purpose is that the Father may be glorified in the Son."},{"q":"According to this lesson, what does praying \"in Jesus's name\" NOT function as?","o":["A basis rooted in His authority and merit","An expression of alignment with Christ's will","A magic formula","A new intimacy with the Father"],"a":2,"w":"Praying in Jesus's name does not function as a magic formula, according to this lesson."},{"q":"What does praying in Jesus's name express, according to this lesson?","o":["Superior status compared to other believers","A guarantee that any request will be granted instantly","Nothing beyond a customary closing phrase","Alignment with Christ's character, will and purposes"],"a":3,"w":"Praying in Jesus's name expresses alignment with Christ's character, will and purposes."},{"q":"What does John 16:24 promise about asking and receiving?","o":["\"Ask and you will receive, and your joy will be complete\"","\"Asking has no connection to receiving\"","\"Only the joyless should ask in prayer\"","\"Receiving depends solely on human effort\""],"a":0,"w":"John 16:24 promises, \"Ask and you will receive, and your joy will be complete.\""},{"q":"What does this lesson connect prayer in Jesus's name to?","o":["Political success","Genuine spiritual joy and fulfilment","Material wealth exclusively","Nothing of lasting spiritual value"],"a":1,"w":"This lesson connects prayer in Jesus's name to genuine spiritual joy and fulfilment."},{"q":"What new intimacy does this teaching reflect, according to this lesson?","o":["No real change in access to God at all","Access to the Father only through human priests","Direct access to the Father through the Son","Access limited only to the original apostles"],"a":2,"w":"This teaching reflects direct access to the Father through the Son, according to this lesson."},{"q":"What overall significance does praying in Jesus's name carry?","o":["It only applies to prayers said in church buildings","It functions purely as an empty formality","It has no theological significance at all","It grounds prayer in Christ's authority, will, and the believer's relationship with Him"],"a":3,"w":"Praying in Jesus's name grounds prayer in Christ's authority, will, and the believer's relationship with Him."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q8 \u2022 CRS \u2022 Gospels",ti:"The Model of Corporate Prayer",su:"Explain the significance of believers praying together in the early church.",steps:[
{lb:"Devoted to prayer",dr:dQ2,ht:"<p>Acts 2:42 describes the early church as <b>devoted</b> to the apostles' teaching, fellowship, breaking of bread, and <b>prayer</b> &mdash; corporate prayer was a foundational, regular practice.</p>"},
{lb:"Praying for boldness",dr:dQ2,ht:"<p>When Peter and John were threatened, the believers gathered and prayed together for <b>boldness</b> to continue preaching, not for the threats to simply disappear (Acts 4:23-31).</p>"},
{lb:"The place was shaken",dr:dQ2,ht:"<p>After this united prayer, <em>\"the place where they were meeting was shaken. And they were all filled with the Holy Spirit and spoke the word of God boldly\"</em> (Acts 4:31).</p>"},
{lb:"Prayer for one another",dr:dQ2,ht:"<p>James 5:16 instructs, <em>\"confess your sins to each other and pray for each other so that you may be healed\"</em> &mdash; corporate prayer includes mutual confession and intercession for healing.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What four things was the early church devoted to, according to Acts 2:42?","o":["Teaching, fellowship, breaking of bread, and prayer","Only public preaching","Only financial giving","Only the observance of Jewish festivals"],"a":0,"w":"Acts 2:42 says the early church was devoted to teaching, fellowship, breaking of bread, and prayer."},{"q":"What does this lesson say about the place of corporate prayer in the early church?","o":["It was rare and only occasional","It was a foundational, regular practice","It was reserved only for the apostles","It had no real structure or regularity"],"a":1,"w":"Corporate prayer was a foundational, regular practice in the early church, according to this lesson."},{"q":"What did the believers pray for when Peter and John were threatened, in Acts 4:23-31?","o":["Personal safety above all else","The threats to simply disappear","Boldness to continue preaching","Revenge against their persecutors"],"a":2,"w":"The believers prayed for boldness to continue preaching, when Peter and John were threatened (Acts 4:23-31)."},{"q":"What happened after this united prayer, according to Acts 4:31?","o":["The believers scattered in fear","Nothing changed at all","The apostles were immediately arrested","The place where they were meeting was shaken"],"a":3,"w":"Acts 4:31 says the place where they were meeting was shaken after this united prayer."},{"q":"What filled the believers after their place of meeting was shaken, in Acts 4:31?","o":["The Holy Spirit","A sense of fear","Confusion and doubt","Complete silence"],"a":0,"w":"The believers were filled with the Holy Spirit, according to Acts 4:31."},{"q":"What did the believers do after being filled with the Holy Spirit, according to Acts 4:31?","o":["Remained silent out of fear","Spoke the word of God boldly","Left Jerusalem immediately","Argued among themselves"],"a":1,"w":"They spoke the word of God boldly, according to Acts 4:31."},{"q":"What does James 5:16 instruct believers to do for one another?","o":["Pray only in complete isolation","Avoid confessing sin to anyone","Confess sins and pray for each other, so they may be healed","Judge one another's sins publicly"],"a":2,"w":"James 5:16 instructs believers to confess sins and pray for each other, so they may be healed."},{"q":"What overall pattern does this lesson describe for corporate prayer?","o":["A pattern found only in the Old Testament","Corporate prayer with no real spiritual effect","Prayer that should always be done alone, never together","Regular, united prayer that strengthens boldness, healing and mutual support"],"a":3,"w":"This lesson describes a pattern of regular, united prayer that strengthens boldness, healing and mutual support."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q9 \u2022 CRS \u2022 Gospels",ti:"WAEC Exam Preparation \u2014 Prayer",su:"Practise WAEC-style questions on prayer in the Gospels.",steps:[
{lb:"WAEC essay structure",dr:dQ1,ht:"<p>For WAEC essays on prayer: (1) Identify the <b>specific passage</b>. (2) Give the <b>precise reference</b>. (3) Explain the teaching <b>clearly</b>. (4) Draw out a <b>practical application</b>.</p>"},
{lb:"Common WAEC question patterns",dr:dQ1,ht:"<p>Common patterns include: \"Explain the structure of the Lord's Prayer.\" / \"What does the Parable of the Persistent Widow teach about prayer?\" / \"Contrast the prayers of the Pharisee and the tax collector.\"</p>"},
{lb:"Key references to remember",dr:dQ1,ht:"<p>Key references: <b>Matthew 6:9-13</b> (Lord's Prayer); <b>Mark 1:35 / Luke 22:42</b> (Jesus's prayer example); <b>Luke 18:1-14</b> (persistent widow; Pharisee and tax collector); <b>Matthew 6:5-6</b> (secret prayer); <b>Matthew 7:7-11</b> (ask, seek, knock).</p>"},
{lb:"Connecting to practical prayer",dr:dQ1,ht:"<p>WAEC essays should always connect teaching to <b>practical prayer today</b> &mdash; humility, persistence, and sincerity &mdash; rather than treating prayer only as an abstract ritual.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on prayer?","o":["Identify the specific passage asked about","Give a personal opinion with no facts","List unrelated facts","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on prayer should begin by identifying the specific passage asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the geology of the Niger Delta.\"","\"Contrast the prayers of the Pharisee and the tax collector.\"","\"Define an ionic compound.\"","\"List Nigeria's major rivers.\""],"a":1,"w":"\"Contrast the prayers of the Pharisee and the tax collector\" is a typical WAEC-style question."},{"q":"Which passage should be cited when discussing the model prayer Jesus taught?","o":["Luke 18:9-14","John 14:13","Matthew 6:9-13","Acts 4:23-31"],"a":2,"w":"Matthew 6:9-13 should be cited when discussing the model prayer Jesus taught."},{"q":"Which verse should be cited when discussing Jesus's own example of prayer?","o":["John 16:24","Matthew 7:7","James 5:16","Mark 1:35"],"a":3,"w":"Mark 1:35 should be cited when discussing Jesus's own example of prayer."},{"q":"Which passage should be cited when discussing perseverance in prayer?","o":["Luke 18:1-8 (the persistent widow)","Matthew 6:5-6","John 14:13","Acts 2:42"],"a":0,"w":"Luke 18:1-8, the persistent widow, should be cited when discussing perseverance in prayer."},{"q":"Which passage should be cited when discussing humility in prayer?","o":["Matthew 7:7-11","Luke 18:9-14 (Pharisee and tax collector)","Mark 1:35","John 16:24"],"a":1,"w":"Luke 18:9-14, the Pharisee and tax collector, should be cited when discussing humility in prayer."},{"q":"Which passage should be cited when discussing praying in secret rather than for show?","o":["James 5:16","Acts 4:23-31","Matthew 6:5-6","John 14:13"],"a":2,"w":"Matthew 6:5-6 should be cited when discussing praying in secret rather than for show."},{"q":"Why should WAEC essays connect teaching to practical prayer today?","o":["WAEC forbids discussing daily life applications","Practical application is irrelevant to WAEC marking","Only abstract theology should be discussed","It shows the theology remains relevant to real Christian life"],"a":3,"w":"Connecting to practical prayer shows the theology remains relevant to real Christian life, which WAEC rewards."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q10 \u2022 CRS \u2022 Gospels",ti:"Mixed Questions \u2014 Prayer",su:"Integrated revision across the Lord\u2019s Prayer, Jesus\u2019s example and key parables on prayer.",steps:[
{lb:"Summary of key themes",dr:dQ2,ht:"<p>Prayer, modelled by Jesus's own disciplined life and the Lord's Prayer, calls believers to humility, persistence, sincerity and confident trust in God's good character, both individually and corporately.</p>"},
{lb:"Key references to remember",dr:dQ2,ht:"<p>Must-know facts: <b>Matthew 6:9-13</b> (Lord's Prayer); <b>Mark 1:35</b> (Jesus's example); <b>Luke 18:1-8</b> (persistent widow); <b>Luke 18:9-14</b> (Pharisee and tax collector); <b>Matthew 6:5-6</b> (secret prayer); <b>Matthew 7:7-11</b> (ask, seek, knock).</p>"},
{lb:"Lessons for today",dr:dQ2,ht:"<p>These teachings call believers to pray with humility, persistence and sincerity, trusting God's goodness rather than seeking public recognition or giving up too soon.</p>"},
{lb:"Final exam tips",dr:dQ2,ht:"<p>Always give the <b>precise reference</b>, explain the teaching <b>clearly and accurately</b>, and conclude by connecting the passage to a practical, everyday example of prayer.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"How does the Lord's Prayer address God, at its opening?","o":["\"Our Father in heaven\"","\"Almighty Judge\"","\"Distant Creator\"","\"Righteous King\""],"a":0,"w":"The Lord's Prayer opens by addressing God as \"Our Father in heaven.\""},{"q":"What did Jesus do very early in the morning, according to Mark 1:35?","o":["Taught in the synagogue","Went to a solitary place and prayed","Healed the sick","Fed a large crowd"],"a":1,"w":"Mark 1:35 says Jesus went to a solitary place and prayed very early in the morning."},{"q":"What is the central lesson of the Parable of the Persistent Widow?","o":["Only widows should pray","Justice always comes immediately","Perseverance in prayer, not giving up too soon","Prayer is unnecessary"],"a":2,"w":"Perseverance in prayer is the central lesson of the Parable of the Persistent Widow."},{"q":"Who went home justified before God in the Parable of the Pharisee and the Tax Collector?","o":["Neither man","The Pharisee","Both men equally","The tax collector"],"a":3,"w":"The tax collector went home justified before God, according to Luke 18:14."},{"q":"What does Jesus instruct in Matthew 6:6 regarding prayer?","o":["Go into your room, close the door, and pray to your Father","Pray only in public settings","Avoid prayer altogether","Pray only through a priest"],"a":0,"w":"Matthew 6:6 instructs going into your room and praying to the Father in secret."},{"q":"What three actions does Jesus describe in Matthew 7:7?","o":["Fast, pray, give","Ask, seek, knock","Confess, repent, believe","Sing, dance, rejoice"],"a":1,"w":"Matthew 7:7 describes asking, seeking and knocking."},{"q":"What did Jesus pray in Gethsemane, according to Luke 22:42?","o":["\"Let this cup pass with no further thought\"","\"My will alone must be done\"","\"Not my will, but yours be done\"","\"I refuse this task entirely\""],"a":2,"w":"Jesus prayed, \"Not my will, but yours be done,\" in Gethsemane."},{"q":"What overall lesson unites the themes studied in this topic?","o":["Prayer has no real spiritual significance","Prayer is a public performance meant to impress others","Only religious professionals should pray","Prayer should be humble, persistent, sincere, and rooted in trust in God"],"a":3,"w":"The unifying lesson is that prayer should be humble, persistent, sincere, and rooted in trust in God."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
