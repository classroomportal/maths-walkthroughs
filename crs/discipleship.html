<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}
function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,"Discipleship",ACC,13,'middle',true));
BULLETS.forEach(function(b,i){if(p>=i+1){o.push(R(10,38+i*54,460,44,i===0?CRM:CRM,ACC,i===0?2:1.5));o.push(T(240,56+i*54,b[0],DARK,10,'middle',false));o.push(T(240,74+i*54,b[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Key References',ACC,12,'middle',true));
REFS.forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,"Discipleship" + ' \u2014 Summary',ACC,13,'middle',true));
SUMMARY.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}

function dQ4(p){dQ2(p);}

function dQ8(p){dQ2(p);}

var BULLETS=[["Immediate response: left nets to follow (Matt 4:20)", "Leaving everything: Luke 5:11"], ["Deny self, take up cross (Matt 16:24)", "Count the cost first (Luke 14:28-30)"]];
var REFS=[["Matt 4:19-20", "The call of the first disciples"], ["Matt 16:24-25", "Deny self, take up the cross"], ["John 13:35", "Love as the mark of discipleship"], ["Matt 28:19-20", "The Great Commission"], ["John 21:15-17", "Peter restored by the lake"]];

var QS=[
{ey:"Q1 \u2022 CRS \u2022 Gospels",ti:"The Call to Discipleship",su:"Explain what it means to be called as a disciple of Jesus.",steps:[
{lb:"The first disciples",dr:dQ1,ht:"<p>Jesus called His first disciples &mdash; fishermen Simon Peter, Andrew, James and John &mdash; with the simple invitation, <em>\"Follow me, and I will send you out to fish for people\"</em> (Matthew 4:19).</p>"},
{lb:"An immediate response",dr:dQ1,ht:"<p>Matthew 4:20 records that they <b>\"immediately\"</b> left their nets and followed Him &mdash; showing discipleship demands a decisive, wholehearted response, not a delayed or partial one.</p>"},
{lb:"Leaving everything behind",dr:dQ1,ht:"<p>Luke 5:11 adds that after the miraculous catch of fish, the disciples <b>\"left everything and followed him\"</b> &mdash; discipleship required leaving behind their livelihood and security.</p>"},
{lb:"A relationship, not just a task",dr:dQ1,ht:"<p>To be a disciple means to be a <b>learner and follower</b> of Jesus, in continual relationship with Him, not merely someone completing a religious duty or ritual.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"Which words did Jesus use to call His first disciples?","o":["\"Follow me, and I will send you out to fish for people\"","\"Go and tell no one what you have seen\"","\"Take up your bed and walk\"","\"Let the little children come to me\""],"a":0,"w":"Jesus called His first disciples with \"Follow me, and I will send you out to fish for people\" (Matt 4:19)."},{"q":"What was the occupation of the first disciples Jesus called?","o":["Tax collectors","Fishermen","Shepherds","Carpenters"],"a":1,"w":"The first disciples Jesus called, Peter, Andrew, James and John, were fishermen."},{"q":"How did the first disciples respond to Jesus's call, according to Matthew 4:20?","o":["They refused and stayed with their nets","They asked for time to consider","They immediately left their nets and followed Him","They asked their families for permission first"],"a":2,"w":"Matthew 4:20 says they immediately left their nets and followed Him."},{"q":"What does Luke 5:11 say the disciples left behind to follow Jesus?","o":["Nothing at all","Only their old clothes","Only their boats, keeping their nets","Everything"],"a":3,"w":"Luke 5:11 says the disciples left everything and followed Jesus."},{"q":"What event in Luke 5 preceded the disciples leaving everything to follow Jesus?","o":["A miraculous catch of fish","A wedding at Cana","The feeding of the five thousand","The raising of Lazarus"],"a":0,"w":"A miraculous catch of fish preceded the disciples leaving everything to follow Jesus in Luke 5."},{"q":"What does this lesson say discipleship demands, based on the disciples' response?","o":["A slow, cautious response over many years","A decisive, wholehearted response, not a delayed one","No real response at all","A response only from religious professionals"],"a":1,"w":"Discipleship demands a decisive, wholehearted response, not a delayed or partial one."},{"q":"What did following Jesus cost the first disciples, practically speaking?","o":["Only a small amount of their time","Nothing of any real value","Their livelihood and security","Only their reputation among friends"],"a":2,"w":"Following Jesus cost the first disciples their livelihood and security as fishermen."},{"q":"How does this lesson describe the nature of discipleship?","o":["An entirely optional add-on for especially devoted believers","A single one-off religious ceremony","A purely private, internal belief with no practical impact","A relationship of continual learning and following, not just a ritual task"],"a":3,"w":"Discipleship is described as a relationship of continual learning and following, not just a ritual task."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q2 \u2022 CRS \u2022 Gospels",ti:"The Cost of Discipleship",su:"Explain Jesus's teaching on the cost involved in following Him.",steps:[
{lb:"Taking up the cross",dr:dQ2,ht:"<p>Jesus taught, <em>\"Whoever wants to be my disciple must deny themselves and take up their cross and follow me\"</em> (Matthew 16:24) &mdash; using the image of a criminal carrying his own execution cross to describe radical self-denial.</p>"},
{lb:"Losing life to save it",dr:dQ2,ht:"<p>Matthew 16:25 continues: <em>\"whoever loses their life for me will find it\"</em> &mdash; teaching that true life is found not in self-preservation but in wholehearted surrender to Christ.</p>"},
{lb:"Counting the cost",dr:dQ2,ht:"<p>In Luke 14:28-30, Jesus compares discipleship to a builder who must first <b>count the cost</b> of a tower before starting, warning against half-hearted commitment that cannot finish what it begins.</p>"},
{lb:"Loving Christ above all",dr:dQ2,ht:"<p>Luke 14:26 uses deliberate hyperbole, saying a disciple must love Christ so much that love for father, mother or even one's own life appears like <b>\"hate\"</b> by comparison &mdash; Christ demands supreme loyalty.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Jesus say a disciple must do, according to Matthew 16:24?","o":["Deny themselves and take up their cross","Avoid all forms of hardship","Seek wealth and comfort first","Follow only when convenient"],"a":0,"w":"Matthew 16:24 says a disciple must deny themselves and take up their cross."},{"q":"What image does Jesus use in Matthew 16:24 to describe radical self-denial?","o":["Building a house","Carrying one's own cross","Planting a vineyard","Catching fish"],"a":1,"w":"Jesus uses the image of carrying one's own cross to describe radical self-denial."},{"q":"According to Matthew 16:25, what happens to whoever loses their life for Jesus?","o":["They gain nothing of value","They lose it permanently with no reward","They will find it","They are excluded from His kingdom"],"a":2,"w":"Matthew 16:25 says whoever loses their life for Jesus will find it."},{"q":"What does Jesus compare discipleship to in Luke 14:28-30?","o":["A fisherman counting his catch","A shepherd counting his sheep","A farmer counting his harvest","A builder counting the cost of a tower before starting"],"a":3,"w":"Jesus compares discipleship to a builder counting the cost of a tower before starting, in Luke 14:28-30."},{"q":"What does the parable of the tower-builder warn against?","o":["Half-hearted commitment that cannot finish what it begins","Building anything at all","Counting money before giving it away","Trusting builders with no experience"],"a":0,"w":"The parable warns against half-hearted commitment that cannot finish what it begins."},{"q":"What language device does Jesus use in Luke 14:26 regarding loving family versus Christ?","o":["A literal command to hate one's family","Deliberate hyperbole, using the word \"hate\" for emphasis","A parable about a lost sheep","A direct legal ruling"],"a":1,"w":"Jesus uses deliberate hyperbole in Luke 14:26, using the word \"hate\" for emphasis, not a literal command."},{"q":"What does Luke 14:26 teach about the priority of loving Christ?","o":["Christ has no real claim on personal loyalty","Family should always be loved more than Christ","Christ demands supreme loyalty, above even family ties","Loyalty to Christ is entirely optional"],"a":2,"w":"Luke 14:26 teaches that Christ demands supreme loyalty, above even family ties."},{"q":"What overall theme unites Matthew 16:24-25 and Luke 14:26-30?","o":["Cost has no relevance to genuine faith","Discipleship is entirely free of cost or sacrifice","Only some believers are called to costly discipleship","Discipleship carries a real cost that must be honestly counted"],"a":3,"w":"These passages unite around the theme that discipleship carries a real cost that must be honestly counted."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q3 \u2022 CRS \u2022 Gospels",ti:"Characteristics of a True Disciple",su:"Identify the marks of genuine discipleship according to the Gospels.",steps:[
{lb:"Abiding in His word",dr:dQ1,ht:"<p>John 8:31 teaches, <em>\"If you hold to my teaching, you are really my disciples\"</em> &mdash; continued obedience to Christ's teaching, not a single decision, marks genuine discipleship.</p>"},
{lb:"Bearing fruit",dr:dQ1,ht:"<p>John 15:8 states, <em>\"This is to my Father's glory, that you bear much fruit, showing yourselves to be my disciples\"</em> &mdash; a transformed, fruitful life is evidence of true discipleship.</p>"},
{lb:"Loving one another",dr:dQ1,ht:"<p>John 13:35 gives the definitive mark: <em>\"By this everyone will know that you are my disciples, if you love one another\"</em> &mdash; genuine love for fellow believers identifies true disciples to the watching world.</p>"},
{lb:"Producing fruit that lasts",dr:dQ1,ht:"<p>These marks together show discipleship is proven over <b>time</b>, through obedience, transformed character and love, not merely through an initial profession of faith.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does John 8:31 say marks a genuine disciple?","o":["Holding to Christ's teaching","A single emotional experience","Wealth and social status","Physical descent from Abraham"],"a":0,"w":"John 8:31 says holding to Christ's teaching marks a genuine disciple."},{"q":"According to John 15:8, what brings glory to the Father?","o":["Avoiding all forms of service","Bearing much fruit","Seeking personal recognition","Accumulating wealth"],"a":1,"w":"John 15:8 says bearing much fruit brings glory to the Father."},{"q":"What does bearing fruit show, according to John 15:8?","o":["That one has never sinned","Nothing of spiritual significance","That one is truly Christ's disciple","That one is wealthy"],"a":2,"w":"John 15:8 says bearing fruit shows that one is truly Christ's disciple."},{"q":"What does John 13:35 identify as the definitive mark of discipleship to the watching world?","o":["Public displays of wealth","Wearing distinctive clothing","Avoiding all unbelievers","Loving one another"],"a":3,"w":"John 13:35 identifies loving one another as the definitive mark of discipleship to the watching world."},{"q":"According to John 13:35, how will everyone know someone is a disciple of Jesus?","o":["If they love one another","If they perform public miracles","If they hold political power","If they own significant property"],"a":0,"w":"John 13:35 says everyone will know by their love for one another."},{"q":"How does this lesson describe the timing over which discipleship is proven?","o":["Instantly, at the moment of a single decision","Over time, through obedience, character and love","Only after death, with no evidence in this life","Only through outward religious ritual"],"a":1,"w":"Discipleship is proven over time, through obedience, transformed character and love."},{"q":"What single event does this lesson say discipleship is NOT proven merely by?","o":["A transformed, fruitful life","Continued obedience over time","An initial profession of faith alone","Genuine love for fellow believers"],"a":2,"w":"Discipleship is not proven merely by an initial profession of faith alone."},{"q":"What overall picture of a true disciple emerges from John 8, 13 and 15?","o":["One who never faces any struggle or difficulty","One who seeks status without any real transformation","One who avoids all relationship with fellow believers","One who continues in Christ's word, bears fruit, and loves others"],"a":3,"w":"A true disciple continues in Christ's word, bears fruit, and loves others, according to John 8, 13 and 15."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:"Q4 \u2022 CRS \u2022 Gospels",ti:"The Great Commission",su:"Explain the disciples' commission to make disciples of all nations.",steps:[

{lb:"Baptising believers",dr:dQ2,ht:"<p>The Great Commission includes <b>baptising</b> new believers <em>\"in the name of the Father and of the Son and of the Holy Spirit\"</em> (Matthew 28:19) &mdash; marking entry into the Christian community.</p>"},
{lb:"Teaching obedience",dr:dQ2,ht:"<p>Matthew 28:20 adds, <em>\"teaching them to obey everything I have commanded you\"</em> &mdash; discipleship involves ongoing instruction in obedience, not simply an initial conversion experience.</p>"},
{lb:"Christ's abiding presence",dr:dQ2,ht:"<p>The commission closes with the promise, <em>\"I am with you always, to the very end of the age\"</em> (Matthew 28:20) &mdash; assuring disciples of Christ's continual presence in their mission.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What command does Jesus give in Matthew 28:19?","o":["\"Go and make disciples of all nations\"","\"Stay in Jerusalem and wait\"","\"Return to your former occupations\"","\"Tell no one what you have seen\""],"a":0,"w":"Jesus commands, \"Go and make disciples of all nations\" in Matthew 28:19."},{"q":"To whom does the Great Commission extend the call to discipleship?","o":["Only the original twelve disciples","All nations, beyond the original twelve","Only the people of Israel","Only wealthy and educated people"],"a":1,"w":"The Great Commission extends the call to discipleship to all nations, beyond the original twelve."},{"q":"In whose name does Matthew 28:19 instruct new believers to be baptised?","o":["The name of the apostles","Only the name of Jesus alone, with no mention of the Trinity","The Father, Son and Holy Spirit","No specific name at all"],"a":2,"w":"Matthew 28:19 instructs baptism in the name of the Father, Son and Holy Spirit."},{"q":"What does baptism mark, according to this lesson?","o":["A legal requirement with no spiritual meaning","A purely private, invisible event","The end of any further spiritual growth","Entry into the Christian community"],"a":3,"w":"Baptism marks entry into the Christian community."},{"q":"What does Matthew 28:20 say disciples should be taught to do?","o":["Obey everything Christ commanded","Only memorise Scripture with no application","Avoid all contact with unbelievers","Focus solely on personal comfort"],"a":0,"w":"Matthew 28:20 says disciples should be taught to obey everything Christ commanded."},{"q":"What does this lesson say discipleship involves, based on Matthew 28:20?","o":["A single conversion experience with no further teaching","Ongoing instruction in obedience, not just an initial conversion","No instruction of any kind","Instruction only in Old Testament law"],"a":1,"w":"Discipleship involves ongoing instruction in obedience, not just an initial conversion experience."},{"q":"What promise does Jesus give at the end of the Great Commission?","o":["\"I will return within your lifetime\"","\"You will never face any hardship\"","\"I am with you always, to the very end of the age\"","\"You must complete this task alone\""],"a":2,"w":"Jesus promises, \"I am with you always, to the very end of the age,\" at the end of the Great Commission."},{"q":"What does this promise of Christ's presence provide for disciples engaged in mission?","o":["A promise limited only to the apostles' own lifetimes","No real comfort or assurance at all","A guarantee of easy circumstances","Assurance of His continual presence in their mission"],"a":3,"w":"This promise provides assurance of Christ's continual presence in their mission."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q5 \u2022 CRS \u2022 Gospels",ti:"Discipleship and Suffering",su:"Explain Jesus's teaching that following Him may involve suffering and persecution.",steps:[
{lb:"A warning of persecution",dr:dQ1,ht:"<p>Jesus warned His disciples plainly: <em>\"If the world hates you, keep in mind that it hated me first\"</em> (John 15:18) &mdash; discipleship should not be expected to bring universal approval.</p>"},
{lb:"Blessed when persecuted",dr:dQ1,ht:"<p>In the Beatitudes, Jesus said, <em>\"Blessed are those who are persecuted because of righteousness\"</em> (Matthew 5:10) &mdash; reframing suffering for Christ as a mark of blessing, not failure.</p>"},
{lb:"The servant is not above the master",dr:dQ1,ht:"<p>John 15:20 reasons, <em>\"If they persecuted me, they will persecute you also\"</em> &mdash; since disciples follow a suffering Master, they should expect to share in similar treatment.</p>"},
{lb:"Rejoicing in suffering",dr:dQ1,ht:"<p>Matthew 5:12 instructs disciples to <b>\"rejoice and be glad\"</b> when persecuted, since their reward in heaven is great, and the prophets before them were treated the same way.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What did Jesus warn His disciples about the world's response to them, in John 15:18?","o":["That the world may hate them, as it hated Him first","That the world would always love and accept them","That persecution was impossible for true disciples","That only the original twelve would ever face hatred"],"a":0,"w":"John 15:18 warns that if the world hates the disciples, it hated Jesus first."},{"q":"What does Matthew 5:10 say about those persecuted because of righteousness?","o":["They have failed as disciples","They are blessed","They should never have followed Christ","They are cursed by God"],"a":1,"w":"Matthew 5:10 says those persecuted because of righteousness are blessed."},{"q":"How does Matthew 5:10 reframe suffering for Christ?","o":["As something to avoid at all costs","As proof of God's displeasure","As a mark of blessing, not failure","As irrelevant to genuine faith"],"a":2,"w":"Matthew 5:10 reframes suffering for Christ as a mark of blessing, not failure."},{"q":"What reasoning does John 15:20 give for why disciples may be persecuted?","o":["Persecution only happened to the original disciples","Persecution has no connection to following Jesus","Only unfaithful disciples are ever persecuted","Since they persecuted Jesus, they will persecute His followers too"],"a":3,"w":"John 15:20 reasons that since Jesus was persecuted, His followers will be persecuted too."},{"q":"What principle from John 15:20 explains why disciples should expect similar treatment to their Master?","o":["The servant is not above the master","Disciples are always treated better than their Master","Servants and masters share no common experience","This principle has no bearing on discipleship"],"a":0,"w":"The principle \"the servant is not above the master\" explains why disciples should expect similar treatment."},{"q":"What does Matthew 5:12 instruct disciples to do when persecuted?","o":["Retaliate against their persecutors","Rejoice and be glad","Abandon their faith quietly","Hide their beliefs from everyone"],"a":1,"w":"Matthew 5:12 instructs disciples to rejoice and be glad when persecuted."},{"q":"Why does Matthew 5:12 say disciples should rejoice when persecuted?","o":["Because it proves they were wrong to follow Christ","Because persecution has no real cost","Because their reward in heaven is great","Because it guarantees an easy life afterward"],"a":2,"w":"Matthew 5:12 says disciples should rejoice because their reward in heaven is great."},{"q":"Who else, according to Matthew 5:12, were treated the same way as persecuted disciples?","o":["Only the Roman authorities","Only wealthy religious leaders","No one else in biblical history","The prophets before them"],"a":3,"w":"Matthew 5:12 says the prophets before them were treated the same way."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q6 \u2022 CRS \u2022 Gospels",ti:"Peter\u2019s Discipleship Journey",su:"Trace Peter\u2019s journey as a disciple, including failure and restoration.",steps:[
{lb:"A bold confession",dr:dQ2,ht:"<p>At Caesarea Philippi, Peter confessed, <em>\"You are the Messiah, the Son of the living God\"</em> (Matthew 16:16) &mdash; a moment of profound spiritual insight and boldness.</p>"},
{lb:"A moment of denial",dr:dQ2,ht:"<p>Despite this boldness, Peter later <b>denied knowing Jesus three times</b> during His trial (Luke 22:54-62), showing that even sincere disciples can fail under pressure and fear.</p>"},
{lb:"Restoration by the lake",dr:dQ2,ht:"<p>After the resurrection, Jesus restored Peter by the Sea of Galilee, asking three times, <em>\"Do you love me?\"</em> and commissioning him: <em>\"Feed my sheep\"</em> (John 21:15-17).</p>"},
{lb:"Failure is not final",dr:dQ2,ht:"<p>Peter's story shows that discipleship involves genuine <b>struggle and failure</b>, but Christ's grace offers restoration and renewed purpose, not permanent rejection.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What did Peter confess about Jesus at Caesarea Philippi?","o":["\"You are the Messiah, the Son of the living God\"","\"You are a great prophet, but nothing more\"","\"I do not know who you are\"","\"You are only a wise teacher\""],"a":0,"w":"Peter confessed, \"You are the Messiah, the Son of the living God,\" at Caesarea Philippi (Matt 16:16)."},{"q":"How many times did Peter deny knowing Jesus during His trial?","o":["Once only","Three times","Seven times","He never denied Jesus"],"a":1,"w":"Peter denied knowing Jesus three times during His trial (Luke 22:54-62)."},{"q":"What does Peter's denial show about even sincere disciples?","o":["They are immune to fear or weakness","They never experience any struggle","They can fail under pressure and fear","They cannot truly be forgiven"],"a":2,"w":"Peter's denial shows that even sincere disciples can fail under pressure and fear."},{"q":"Where did Jesus restore Peter after the resurrection?","o":["At the Mount of Olives","In the upper room in Jerusalem","On the road to Emmaus","By the Sea of Galilee"],"a":3,"w":"Jesus restored Peter by the Sea of Galilee (John 21)."},{"q":"What question did Jesus ask Peter three times during his restoration?","o":["\"Do you love me?\"","\"Are you afraid?\"","\"Will you deny me again?\"","\"Do you understand my teaching?\""],"a":0,"w":"Jesus asked Peter three times, \"Do you love me?\" during his restoration."},{"q":"What commission did Jesus give Peter after each affirmation of love, in John 21:15-17?","o":["\"Build my temple\"","\"Feed my sheep\"","\"Judge my people\"","\"Guard my treasure\""],"a":1,"w":"Jesus commissioned Peter to \"Feed my sheep\" after each affirmation of love."},{"q":"What does this lesson say about the relationship between failure and discipleship?","o":["True disciples never experience any failure","Failure permanently disqualifies someone from discipleship","Discipleship involves genuine struggle and failure, but Christ offers restoration","Failure has no bearing on one's relationship with Christ"],"a":2,"w":"Discipleship involves genuine struggle and failure, but Christ's grace offers restoration."},{"q":"What overall message does Peter's journey convey to struggling disciples today?","o":["Peter's story has no relevance to believers today","Once someone fails, they can never serve Christ again","Only perfect people are qualified to be disciples","Failure is not final; Christ offers renewed purpose"],"a":3,"w":"Peter's journey conveys that failure is not final, and Christ offers renewed purpose."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q7 \u2022 CRS \u2022 Gospels",ti:"The Rich Young Ruler",su:"Examine the encounter between Jesus and the rich young ruler as a test of discipleship.",steps:[
{lb:"A sincere question",dr:dQ1,ht:"<p>A wealthy young ruler approached Jesus asking, <em>\"What good thing must I do to get eternal life?\"</em> (Matthew 19:16) &mdash; showing genuine spiritual interest and moral seriousness.</p>"},
{lb:"Keeping the commandments",dr:dQ1,ht:"<p>When told to keep the commandments, the man replied he had kept them all, yet still felt something <b>lacking</b> in his relationship with God (Matthew 19:20).</p>"},
{lb:"The costly invitation",dr:dQ1,ht:"<p>Jesus responded, <em>\"go, sell your possessions and give to the poor... Then come, follow me\"</em> (Matthew 19:21) &mdash; identifying wealth as the specific obstacle to this man's wholehearted discipleship.</p>"},
{lb:"Walking away sad",dr:dQ1,ht:"<p>The man <b>\"went away sad, because he had great wealth\"</b> (Matthew 19:22) &mdash; illustrating that discipleship demands surrendering whatever competes with total allegiance to Christ.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What question did the rich young ruler ask Jesus?","o":["\"What good thing must I do to get eternal life?\"","\"Who is my neighbour?\"","\"Why do the wicked prosper?\"","\"When will the kingdom come?\""],"a":0,"w":"The rich young ruler asked, \"What good thing must I do to get eternal life?\" (Matt 19:16)."},{"q":"What did the man say about his obedience to the commandments?","o":["He admitted he had broken most of them","He claimed to have kept them all","He said the commandments were irrelevant","He refused to answer the question"],"a":1,"w":"The man claimed to have kept all the commandments (Matt 19:20)."},{"q":"Despite keeping the commandments, what did the man feel about his relationship with God?","o":["He felt he had earned salvation fully","He felt completely satisfied","Something was still lacking","He felt no need for further discipleship"],"a":2,"w":"The man felt something was still lacking, despite keeping the commandments."},{"q":"What specific instruction did Jesus give the man in Matthew 19:21?","o":["Marry and raise a family","Offer additional sacrifices at the temple","Study the law more diligently","Sell his possessions, give to the poor, then follow Him"],"a":3,"w":"Jesus instructed the man to sell his possessions, give to the poor, then follow Him (Matt 19:21)."},{"q":"What obstacle did Jesus identify as blocking this man's wholehearted discipleship?","o":["His wealth","His age","His family background","His level of education"],"a":0,"w":"Jesus identified the man's wealth as the obstacle to his wholehearted discipleship."},{"q":"How did the man respond to Jesus's instruction, according to Matthew 19:22?","o":["He immediately obeyed with great joy","He went away sad, because he had great wealth","He asked Jesus further questions","He rebuked Jesus for the request"],"a":1,"w":"Matthew 19:22 says the man went away sad, because he had great wealth."},{"q":"What does this encounter illustrate about the demands of discipleship?","o":["Discipleship requires nothing to be given up","Wealth is always compatible with true discipleship","Discipleship demands surrendering whatever competes with total allegiance to Christ","Only poor people are able to become true disciples"],"a":2,"w":"This encounter illustrates that discipleship demands surrendering whatever competes with total allegiance to Christ."},{"q":"What broader lesson does the rich young ruler's story teach about following Jesus?","o":["This story has no application to believers today","Keeping rules is always sufficient for true discipleship","Wealth guarantees a right relationship with God","Sincerity alone is not enough; wholehearted surrender is required"],"a":3,"w":"The story teaches that sincerity alone is not enough; wholehearted surrender is required."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q8 \u2022 CRS \u2022 Gospels",ti:"Discipleship and Family Priorities",su:"Explain Jesus's challenging teaching on discipleship and family relationships.",steps:[
{lb:"A hard saying",dr:dQ2,ht:"<p>Jesus said, <em>\"Anyone who loves their father or mother more than me is not worthy of me\"</em> (Matthew 10:37) &mdash; placing loyalty to Him above even the closest family bonds.</p>"},
{lb:"Not peace, but a sword",dr:dQ2,ht:"<p>Matthew 10:34-36 records Jesus warning that His coming may bring division even within families, since <b>allegiance to Him</b> can set family members against one another.</p>"},
{lb:"The plough and looking back",dr:dQ2,ht:"<p>In Luke 9:62, Jesus warns that <em>\"no one who puts a hand to the plough and looks back is fit for service in the kingdom of God\"</em> &mdash; discipleship requires forward-looking, undivided commitment.</p>"},
{lb:"Immediate priority",dr:dQ2,ht:"<p>When a would-be disciple asked to first bury his father, Jesus replied, <em>\"Follow me, and let the dead bury their own dead\"</em> (Matthew 8:22) &mdash; even urgent family duties cannot delay the call of Christ.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Jesus say about loving father or mother more than Him, in Matthew 10:37?","o":["Such a person is not worthy of Him","Family should always come before Christ","This has no bearing on discipleship","Family love and love for Christ are identical"],"a":0,"w":"Matthew 10:37 says anyone who loves father or mother more than Christ is not worthy of Him."},{"q":"What does Jesus warn His coming may bring, according to Matthew 10:34-36?","o":["Immediate peace to all families","Division even within families","No impact on family relationships at all","Guaranteed wealth for all believers"],"a":1,"w":"Matthew 10:34-36 warns that Jesus's coming may bring division even within families."},{"q":"Why, according to this lesson, can allegiance to Christ set family members against one another?","o":["Because family relationships are inherently sinful","Because Christ commands hatred of family members","Because not everyone in a family responds to Christ the same way","Because this teaching is purely symbolic with no real meaning"],"a":2,"w":"Allegiance to Christ can divide families because not everyone responds to Christ the same way."},{"q":"What image does Jesus use in Luke 9:62 to describe undivided commitment?","o":["Catching fish in a net","Building a house on solid rock","Planting a mustard seed","Putting a hand to the plough without looking back"],"a":3,"w":"Jesus uses the image of ploughing without looking back to describe undivided commitment (Luke 9:62)."},{"q":"According to Luke 9:62, who is unfit for service in the kingdom of God?","o":["Anyone who looks back after starting to follow","Anyone who has ever made a mistake","Anyone from a wealthy family","No one is described as unfit"],"a":0,"w":"Luke 9:62 says anyone who looks back after starting to follow is unfit for kingdom service."},{"q":"What request did a would-be disciple make in Matthew 8:21?","o":["To first gather his possessions","To first go and bury his father","To first consult his family elders","To first complete a pilgrimage"],"a":1,"w":"A would-be disciple asked to first go and bury his father, in Matthew 8:21."},{"q":"How did Jesus respond to this request, in Matthew 8:22?","o":["\"Family duties always come first\"","\"Take as long as you need\"","\"Follow me, and let the dead bury their own dead\"","He refused to answer"],"a":2,"w":"Jesus responded, \"Follow me, and let the dead bury their own dead,\" in Matthew 8:22."},{"q":"What overall principle do these teachings establish about discipleship and family?","o":["Only unmarried people can truly follow Christ","Family duties always take priority over following Christ","Family relationships have no connection to discipleship at all","Even urgent family duties cannot delay the call of Christ"],"a":3,"w":"These teachings establish that even urgent family duties cannot delay the call of Christ."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q9 \u2022 CRS \u2022 Gospels",ti:"WAEC Exam Preparation \u2014 Discipleship",su:"Practise WAEC-style questions on discipleship in the Gospels.",steps:[
{lb:"WAEC essay structure",dr:dQ1,ht:"<p>For WAEC essays on discipleship: (1) Identify the <b>specific passage</b> asked about. (2) Give the <b>precise reference</b>. (3) Explain the teaching <b>clearly</b>. (4) Draw out a <b>practical application</b>.</p>"},
{lb:"Common WAEC question patterns",dr:dQ1,ht:"<p>Common patterns include: \"Explain the cost of discipleship according to Luke 14.\" / \"What does Peter's denial and restoration teach about discipleship?\" / \"Discuss the rich young ruler's encounter with Jesus.\"</p>"},
{lb:"Key references to remember",dr:dQ1,ht:"<p>Key references: <b>Matthew 4:19-20</b> (the call); <b>Matthew 16:24-25</b> (cost); <b>John 13:35</b> (love as the mark); <b>Matthew 28:19-20</b> (Great Commission); <b>John 21:15-17</b> (Peter restored); <b>Matthew 19:16-22</b> (rich young ruler).</p>"},
{lb:"Connecting to practical discipleship",dr:dQ1,ht:"<p>WAEC essays should always connect teaching to <b>practical discipleship today</b> &mdash; obedience, sacrifice, and love for others &mdash; rather than treating discipleship only as an abstract idea.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on discipleship?","o":["Identify the specific passage asked about","Give a personal opinion with no facts","List unrelated facts","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on discipleship should begin by identifying the specific passage asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the geography of the Jordan valley.\"","\"What does Peter's denial and restoration teach about discipleship?\"","\"Define an isotope.\"","\"List Nigeria's exports.\""],"a":1,"w":"\"What does Peter's denial and restoration teach about discipleship?\" is a typical WAEC-style question."},{"q":"Which verse should be cited when discussing the call of the first disciples?","o":["Luke 14:26","John 21:15","Matthew 4:19-20","Matthew 19:21"],"a":2,"w":"Matthew 4:19-20 should be cited when discussing the call of the first disciples."},{"q":"Which passage should be cited when discussing the cost of discipleship?","o":["Matthew 10:37","John 13:35","Matthew 28:19-20","Matthew 16:24-25"],"a":3,"w":"Matthew 16:24-25 should be cited when discussing the cost of discipleship."},{"q":"Which verse should be cited when discussing the definitive mark of discipleship?","o":["John 13:35","Matthew 4:19","Luke 9:62","Matthew 8:22"],"a":0,"w":"John 13:35 should be cited when discussing the definitive mark of discipleship."},{"q":"Which passage should be cited when discussing the Great Commission?","o":["Luke 5:11","Matthew 28:19-20","Matthew 10:34-36","John 15:18"],"a":1,"w":"Matthew 28:19-20 should be cited when discussing the Great Commission."},{"q":"Which passage should be cited when discussing failure and restoration in discipleship?","o":["Matthew 5:10-12","Matthew 19:16-22","John 21:15-17","Luke 14:28-30"],"a":2,"w":"John 21:15-17 should be cited when discussing failure and restoration in discipleship."},{"q":"Why should WAEC essays connect teaching to practical discipleship today?","o":["WAEC forbids discussing daily life applications","Practical application is irrelevant to WAEC marking","Only abstract theology should be discussed","It shows the theology remains relevant to real Christian life"],"a":3,"w":"Connecting to practical discipleship shows the theology remains relevant to real Christian life, which WAEC rewards."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q10 \u2022 CRS \u2022 Gospels",ti:"Mixed Questions \u2014 Discipleship",su:"Integrated revision across the call, cost and marks of discipleship.",steps:[
{lb:"Summary of key themes",dr:dQ2,ht:"<p>Discipleship begins with a decisive <b>call</b> to follow Christ, demands counting the <b>cost</b> of self-denial and sacrifice, is marked by continued obedience, fruitfulness and love, and involves both failure and gracious <b>restoration</b>.</p>"},
{lb:"Key references to remember",dr:dQ2,ht:"<p>Must-know facts: <b>Matthew 4:19-20</b> (call); <b>Matthew 16:24</b> (deny self, take up cross); <b>John 13:35</b> (love as mark); <b>Matthew 28:19-20</b> (Great Commission); <b>John 21:15-17</b> (Peter restored); <b>Matthew 19:21-22</b> (rich young ruler).</p>"},
{lb:"Lessons for today",dr:dQ2,ht:"<p>These teachings call believers to respond wholeheartedly to Christ's call, embrace the cost of following Him, and live lives marked by obedience, fruitfulness and genuine love for others.</p>"},
{lb:"Final exam tips",dr:dQ2,ht:"<p>Always give the <b>precise reference</b>, explain the teaching <b>clearly and accurately</b>, and conclude by connecting the passage to a practical, everyday example of discipleship.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What words did Jesus use to call the first disciples?","o":["\"Follow me, and I will send you out to fish for people\"","\"Go and sin no more\"","\"Your faith has healed you\"","\"Peace be with you\""],"a":0,"w":"Jesus called the first disciples with \"Follow me, and I will send you out to fish for people.\""},{"q":"What must a disciple do, according to Matthew 16:24?","o":["Avoid all forms of hardship","Deny themselves and take up their cross","Seek wealth above all else","Follow only when convenient"],"a":1,"w":"Matthew 16:24 says a disciple must deny themselves and take up their cross."},{"q":"According to John 13:35, what identifies true disciples to the world?","o":["Political power","Wearing distinctive clothing","Loving one another","Public wealth"],"a":2,"w":"John 13:35 says loving one another identifies true disciples to the world."},{"q":"What command forms the heart of the Great Commission in Matthew 28:19?","o":["\"Return to your former occupations\"","\"Stay in Jerusalem forever\"","\"Avoid all other nations\"","\"Go and make disciples of all nations\""],"a":3,"w":"\"Go and make disciples of all nations\" forms the heart of the Great Commission."},{"q":"How many times did Peter deny Jesus before his restoration?","o":["Three times","Once only","Never","Seven times"],"a":0,"w":"Peter denied Jesus three times before his restoration."},{"q":"What did Jesus tell the rich young ruler to do, in Matthew 19:21?","o":["Multiply his wealth through wise investment","Sell his possessions, give to the poor, then follow Him","Marry immediately","Offer additional temple sacrifices"],"a":1,"w":"Jesus told the rich young ruler to sell his possessions, give to the poor, then follow Him."},{"q":"What did the rich young ruler do in response to Jesus's instruction?","o":["He gave away only half his possessions","He obeyed immediately with great joy","He went away sad, because he had great wealth","He asked to become an apostle instead"],"a":2,"w":"The rich young ruler went away sad, because he had great wealth."},{"q":"What overall lesson unites the themes studied in this topic?","o":["Following Christ guarantees an easy, trouble-free life","Discipleship requires no real commitment or sacrifice","Only the original twelve were ever called to be disciples","Discipleship requires wholehearted, costly commitment marked by love and obedience"],"a":3,"w":"The unifying lesson is that discipleship requires wholehearted, costly commitment marked by love and obedience."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
