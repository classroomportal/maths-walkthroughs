<style>

.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}

.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'

}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}

function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}

function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}
function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,"Work and Diligence",ACC,13,'middle',true));
BULLETS.forEach(function(b,i){if(p>=i+1){o.push(R(10,38+i*54,460,44,i===0?CRM:CRM,ACC,i===0?2:1.5));o.push(T(240,56+i*54,b[0],DARK,10,'middle',false));o.push(T(240,74+i*54,b[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Key References',ACC,12,'middle',true));
REFS.forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,"Work and Diligence" + ' \u2014 Summary',ACC,13,'middle',true));
SUMMARY.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}

function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
var BULLETS=[["Adam worked Eden before the Fall (Gen 2:15)", "Working as for the Lord (Col 3:23)"], ["Ant's diligence: no commander needed (Prov 6:6-8)", "Diligent hands bring wealth (Prov 10:4)"]];
var REFS=[["Gen 2:15", "Work before the Fall"], ["Col 3:23", "Working as for the Lord"], ["Prov 6:6-11", "Diligence \u2014 the ant"], ["2 Thess 3:8-12", "Paul's example"], ["James 5:4", "Fair wages"]];
var SUMMARY=[["Gen 2:15", "Work as God-given calling"], ["Prov 6:6-11, 10:4, 12:24", "Diligence and its rewards"], ["2 Thess 3:8-12", "Paul's example and instruction"], ["Ephesians 6:5-9 / James 5:4", "Fair treatment of workers"], ["Prov 11:1, 22:1", "Integrity and a good name"], ["1 Tim 5:8", "Provision for family"]];
var QS=[
{ey:"Q1 \u2022 CRS \u2022 Acts & Epistles",ti:"Work as a Christian Calling",su:"Explain the biblical view of work as a meaningful calling, not merely a necessity.",steps:[
{lb:"Work before the Fall",dr:dQ1,ht:"<p>Genesis 2:15 shows God placed Adam in Eden <em>\"to work it and take care of it\"</em> &mdash; work existed before sin entered the world, as part of God's good design for humanity.</p>"},
{lb:"Working as for the Lord",dr:dQ1,ht:"<p>Colossians 3:23 instructs, <em>\"Whatever you do, work at it with all your heart, as working for the Lord, not for human masters\"</em> &mdash; even ordinary labour is an act of worship when offered to God.</p>"},
{lb:"Reflecting God's own work",dr:dQ1,ht:"<p>God is presented throughout Genesis 1 as a <b>worker</b>, creating and forming the world; humanity, made in His image, is likewise called to purposeful, productive labour.</p>"},
{lb:"Dignity in all honest work",dr:dQ1,ht:"<p>This teaching gives dignity to <b>all forms of honest work</b>, whether manual, professional or domestic, since all can be offered to God as meaningful service.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What did God place Adam in Eden to do, according to Genesis 2:15?","o":["Work it and take care of it","Rest permanently with no responsibility","Explore other lands","Build a temple immediately"],"a":0,"w":"Genesis 2:15 says God placed Adam in Eden to work it and take care of it."},{"q":"What does this lesson say about the origin of work, based on Genesis 2:15?","o":["Work began only after the Fall as a punishment","Work existed before sin entered the world","Work has no connection to God's original design","Work was invented by later human civilisations"],"a":1,"w":"This lesson notes that work existed before sin entered the world, based on Genesis 2:15."},{"q":"What does Colossians 3:23 instruct believers to do in their work?","o":["Work only when being observed by others","Work only enough to avoid punishment","Work at it with all their heart, as working for the Lord","Avoid working altogether"],"a":2,"w":"Colossians 3:23 instructs believers to work with all their heart, as working for the Lord."},{"q":"What does this lesson say ordinary labour becomes, when offered to God?","o":["Irrelevant to Christian faith","A purely secular activity with no spiritual value","A burden to be avoided","An act of worship"],"a":3,"w":"Ordinary labour becomes an act of worship when offered to God, according to this lesson."},{"q":"How is God presented throughout Genesis 1, according to this lesson?","o":["As a worker, creating and forming the world","As entirely inactive","As opposed to the concept of work","As uninvolved in the created order"],"a":0,"w":"God is presented as a worker, creating and forming the world, throughout Genesis 1."},{"q":"What does this lesson say humanity, made in God's image, is likewise called to?","o":["A life entirely free of responsibility","Purposeful, productive labour","Avoidance of all forms of work","Only spiritual activity, with no practical labour"],"a":1,"w":"Humanity, made in God's image, is called to purposeful, productive labour, according to this lesson."},{"q":"What does this teaching give to all forms of honest work?","o":["No spiritual value at all","Only limited value, restricted to religious work","Dignity","Value only if publicly recognised"],"a":2,"w":"This teaching gives dignity to all forms of honest work."},{"q":"What overall view of work does this lesson present?","o":["Work has no connection to Christian faith","Work is a curse with no positive meaning","Work matters only for religious professionals","Work is a meaningful calling, not merely a necessity"],"a":3,"w":"This lesson presents work as a meaningful calling, not merely a necessity."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q2 \u2022 CRS \u2022 Acts & Epistles",ti:"The Value of Diligence",su:"Explain the biblical teaching on diligence and its rewards, especially from Proverbs.",steps:[
{lb:"The ant's example",dr:dQ2,ht:"<p>Proverbs 6:6-8 points to the <b>ant</b>, which, without any commander, stores its provisions in summer, harvesting at harvest time &mdash; a model of self-motivated diligence.</p>"},
{lb:"Diligent hands bring wealth",dr:dQ2,ht:"<p>Proverbs 10:4 teaches, <em>\"Lazy hands make for poverty, but diligent hands bring wealth\"</em> &mdash; consistent, careful effort produces tangible benefit over time.</p>"},
{lb:"The diligent are rewarded",dr:dQ2,ht:"<p>Proverbs 12:24 adds, <em>\"Diligent hands will rule, but laziness ends in forced labour\"</em> &mdash; diligence brings opportunity and responsibility, while laziness brings dependency and hardship.</p>"},
{lb:"A warning against laziness",dr:dQ2,ht:"<p>Proverbs 6:9-11 warns the sluggard that poverty will come <b>\"like a thief\"</b> &mdash; a vivid image of laziness's slow but certain, and often unexpected, cost.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What creature does Proverbs 6:6-8 point to as a model of diligence?","o":["The ant","The eagle","The lion","The sheep"],"a":0,"w":"Proverbs 6:6-8 points to the ant as a model of diligence."},{"q":"What does the ant do without any commander, according to Proverbs 6:7-8?","o":["Waits idly for others to provide food","Stores its provisions in summer, harvesting at harvest time","Refuses to work at all","Depends entirely on other creatures"],"a":1,"w":"Proverbs 6:7-8 says the ant stores provisions in summer without any commander."},{"q":"What does Proverbs 10:4 say about lazy hands?","o":["They have no real consequence","They always bring hidden wealth","They make for poverty","They lead to instant success"],"a":2,"w":"Proverbs 10:4 says lazy hands make for poverty."},{"q":"What does Proverbs 10:4 say diligent hands bring?","o":["Only recognition, with no material benefit","Only temporary success","Nothing of lasting value","Wealth"],"a":3,"w":"Proverbs 10:4 says diligent hands bring wealth."},{"q":"What does Proverbs 12:24 say diligent hands will do?","o":["Rule","Fail regardless of effort","Remain unrewarded","Bring only exhaustion with no benefit"],"a":0,"w":"Proverbs 12:24 says diligent hands will rule."},{"q":"What does Proverbs 12:24 say laziness ends in?","o":["Guaranteed wealth","Forced labour","Immediate success","No consequence at all"],"a":1,"w":"Proverbs 12:24 says laziness ends in forced labour."},{"q":"What image does Proverbs 6:9-11 use to describe poverty coming upon the sluggard?","o":["Like a slow but welcome guest","Like a gentle breeze","Like a thief","Like an expected reward"],"a":2,"w":"Proverbs 6:9-11 describes poverty coming upon the sluggard like a thief."},{"q":"What does this image of a thief convey about laziness's consequences, according to this lesson?","o":["A cost that only affects wealthy people","An immediate and obvious cost with clear warning","No real cost at all","A slow but certain, and often unexpected, cost"],"a":3,"w":"This image conveys a slow but certain, and often unexpected, cost of laziness, according to this lesson."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q3 \u2022 CRS \u2022 Acts & Epistles",ti:"Paul\u2019s Example and Teaching on Work",su:"Explain Paul\u2019s personal example and instruction regarding work and self-sufficiency.",steps:[
{lb:"Working with his own hands",dr:dQ1,ht:"<p>Paul reminded the Thessalonians, <em>\"we worked night and day, labouring and toiling so as not to be a burden to any of you\"</em> (2 Thessalonians 3:8) &mdash; modelling diligent self-support even while doing ministry.</p>"},
{lb:"Tentmaking in Corinth",dr:dQ1,ht:"<p>Acts 18:1-3 records Paul working as a <b>tentmaker</b> alongside Aquila and Priscilla in Corinth &mdash; a practical trade sustaining his ministry without dependence on others.</p>"},
{lb:"The one who is unwilling to work",dr:dQ1,ht:"<p>Paul gave the direct instruction, <em>\"the one who is unwilling to work shall not eat\"</em> (2 Thessalonians 3:10) &mdash; addressing believers who were idle, expecting others to provide for them.</p>"},
{lb:"Working quietly and earning their own living",dr:dQ1,ht:"<p>Paul urged such believers <em>\"to settle down and earn the bread they eat\"</em> (2 Thessalonians 3:12) &mdash; diligent, quiet work is expected of every believer able to labour.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What did Paul remind the Thessalonians he did, in 2 Thessalonians 3:8?","o":["Worked night and day so as not to be a burden to them","Relied entirely on their financial support","Refused to work at all during his ministry","Demanded payment for his preaching"],"a":0,"w":"Paul reminded them he worked night and day so as not to be a burden to them (2 Thess 3:8)."},{"q":"What does this example show, according to this lesson?","o":["That ministry work excuses one from manual labour","Diligent self-support even while doing ministry","That Paul depended entirely on the churches he founded","That Paul avoided all forms of work"],"a":1,"w":"This example shows diligent self-support even while doing ministry, according to this lesson."},{"q":"What trade did Paul practise, according to Acts 18:1-3?","o":["Carpentry","Fishing","Tentmaking","Farming"],"a":2,"w":"Paul practised tentmaking, according to Acts 18:1-3."},{"q":"With whom did Paul work as a tentmaker in Corinth?","o":["Barnabas alone","Timothy and Titus","Peter and John","Aquila and Priscilla"],"a":3,"w":"Paul worked as a tentmaker with Aquila and Priscilla in Corinth."},{"q":"What instruction did Paul give regarding those unwilling to work, in 2 Thessalonians 3:10?","o":["\"The one who is unwilling to work shall not eat\"","\"All believers should be supported regardless of effort\"","\"Only the wealthy are expected to work\"","\"Work is optional for devoted believers\""],"a":0,"w":"Paul instructed, \"The one who is unwilling to work shall not eat\" (2 Thess 3:10)."},{"q":"Who was Paul specifically addressing with this instruction?","o":["Believers who were physically unable to work","Believers who were idle, expecting others to provide for them","Only unbelievers outside the church","Church leaders exclusively"],"a":1,"w":"Paul was addressing believers who were idle, expecting others to provide for them."},{"q":"What did Paul urge idle believers to do, in 2 Thessalonians 3:12?","o":["Abandon the church community","Rely entirely on the generosity of others","Settle down and earn the bread they eat","Focus solely on prayer, with no practical work"],"a":2,"w":"Paul urged idle believers to settle down and earn the bread they eat (2 Thess 3:12)."},{"q":"What overall expectation does this lesson say Paul places on believers able to work?","o":["Idleness is acceptable if one is devoted to prayer","Work is entirely optional for genuine believers","Only some believers are expected to work","Diligent, quiet work is expected of every believer able to labour"],"a":3,"w":"This lesson says diligent, quiet work is expected of every believer able to labour."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q4 \u2022 CRS \u2022 Acts & Epistles",ti:"Employers, Employees and Fair Treatment",su:"Explain biblical teaching on the relationship between workers and those who employ them.",steps:[
{lb:"Obeying earthly masters",dr:dQ2,ht:"<p>Ephesians 6:5-6 instructs servants to <em>\"obey your earthly masters... just as you would obey Christ,\"</em> not merely to please people, but as service rendered ultimately to God.</p>"},
{lb:"Masters treating workers fairly",dr:dQ2,ht:"<p>Ephesians 6:9 instructs masters likewise to treat their servants well, <em>\"since you know that he who is both their Master and yours is in heaven, and there is no favouritism with him\"</em>.</p>"},
{lb:"Withholding wages condemned",dr:dQ2,ht:"<p>James 5:4 strongly condemns employers who withhold wages: <em>\"the wages you failed to pay the workers... are crying out against you\"</em> &mdash; fair, prompt payment is a matter of justice, not mere generosity.</p>"},
{lb:"The worker deserves wages",dr:dQ2,ht:"<p>Luke 10:7 states plainly, <em>\"the worker deserves their wages\"</em> &mdash; fair compensation for labour reflects God's own justice and concern for the dignity of workers.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Ephesians 6:5-6 instruct servants to do regarding their earthly masters?","o":["Obey them just as they would obey Christ","Disobey whenever it is inconvenient","Serve only when directly supervised","Serve only to gain personal advantage"],"a":0,"w":"Ephesians 6:5-6 instructs servants to obey their earthly masters just as they would obey Christ."},{"q":"According to this lesson, whom is such service ultimately rendered to?","o":["Only the earthly master, with no wider significance","God","No one in particular","Only oneself, for personal gain"],"a":1,"w":"According to this lesson, such service is ultimately rendered to God."},{"q":"What does Ephesians 6:9 instruct masters to do regarding their servants?","o":["Ignore their wellbeing entirely","Treat them however is most convenient","Treat them well, since God shows no favouritism","Treat them only according to social status"],"a":2,"w":"Ephesians 6:9 instructs masters to treat their servants well, since God shows no favouritism."},{"q":"What does James 5:4 condemn regarding employers?","o":["Providing workers with rest days","Paying workers too generously","Employing too many workers","Withholding wages owed to workers"],"a":3,"w":"James 5:4 condemns employers who withhold wages owed to workers."},{"q":"What does James 5:4 say about withheld wages?","o":["They are crying out against the employer","They have no real consequence","They are a minor issue of no importance","They only matter if publicly reported"],"a":0,"w":"James 5:4 says withheld wages are crying out against the employer."},{"q":"How does this lesson describe fair, prompt payment of wages?","o":["An optional kindness, with no moral weight","A matter of justice, not mere generosity","Irrelevant to genuine Christian faith","A concern only for wealthy employers"],"a":1,"w":"This lesson describes fair, prompt payment as a matter of justice, not mere generosity."},{"q":"What does Luke 10:7 {ey:"Q5 \u2022 CRS \u2022 Acts & Epistles",ti:"Excellence and Integrity at Work",su:"Explain the biblical call to work with excellence, honesty and integrity.",steps:[
{lb:"Working heartily, not half-heartedly",dr:dQ1,ht:"<p>Colossians 3:23 calls believers to work <em>\"with all your heart\"</em> &mdash; excellence in work reflects genuine devotion, not mere minimal compliance with expectations.</p>"},
{lb:"Not with eye-service",dr:dQ1,ht:"<p>Ephesians 6:6 warns against <em>\"eye-service, as people-pleasers\"</em> &mdash; consistent integrity is required whether or not a supervisor is watching.</p>"},
{lb:"Honest weights and measures",dr:dQ1,ht:"<p>Proverbs 11:1 declares, <em>\"The Lord detests dishonest scales, but accurate weights find favour with him\"</em> &mdash; honesty in business dealings, including small details, matters deeply to God.</p>"},
{lb:"A good name is better than riches",dr:dQ1,ht:"<p>Proverbs 22:1 teaches, <em>\"A good name is more desirable than great riches\"</em> &mdash; a reputation for integrity carries greater lasting value than wealth gained through dishonesty.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Colossians 3:23 call believers to bring to their work?","o":["All their heart","Only minimal effort required to avoid punishment","Effort only when being supervised","No real effort at all"],"a":0,"w":"Colossians 3:23 calls believers to bring all their heart to their work."},{"q":"What does this lesson say excellence at work reflects?","o":["Only a desire for promotion","Genuine devotion, not mere minimal compliance","A purely secular pursuit of success","Nothing of spiritual significance"],"a":1,"w":"This lesson says excellence at work reflects genuine devotion, not mere minimal compliance."},{"q":"What does Ephesians 6:6 warn against?","o":["Serving one's employer honestly","Working diligently at all times","\"Eye-service, as people-pleasers\"","Excellence in one's work"],"a":2,"w":"Ephesians 6:6 warns against \"eye-service, as people-pleasers.\""},{"q":"What kind of integrity does this lesson say Ephesians 6:6 requires?","o":["Integrity only in one's personal life, not at work","Integrity only when being directly observed","No real integrity requirement at all","Consistent integrity, whether or not a supervisor is watching"],"a":3,"w":"Ephesians 6:6 requires consistent integrity, whether or not a supervisor is watching, according to this lesson."},{"q":"What does Proverbs 11:1 say the Lord detests?","o":["Dishonest scales","Honest business dealings","Hard work and diligence","Fair wages for workers"],"a":0,"w":"Proverbs 11:1 says the Lord detests dishonest scales."},{"q":"What does Proverbs 11:1 say finds favour with the Lord?","o":["Large profits, regardless of method","Accurate weights","Dishonest scales, if undetected","Wealth gained through deception"],"a":1,"w":"Proverbs 11:1 says accurate weights find favour with the Lord."},{"q":"What does Proverbs 22:1 say is more desirable than great riches?","o":["Political power","Additional wealth","A good name","Physical strength"],"a":2,"w":"Proverbs 22:1 says a good name is more desirable than great riches."},{"q":"What does this lesson say a reputation for integrity carries, compared to dishonestly gained wealth?","o":["Value only in religious contexts","Less practical value","No real value at all","Greater lasting value"],"a":3,"w":"This lesson says a reputation for integrity carries greater lasting value than dishonestly gained wealth."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q6 \u2022 CRS \u2022 Acts & Epistles",ti:"Rest and the Rhythm of Work",su:"Explain the biblical principle of rest as a necessary complement to diligent work.",steps:[
{lb:"God rested on the seventh day",dr:dQ2,ht:"<p>Genesis 2:2-3 records that God <b>rested</b> on the seventh day after creation, and blessed and made it holy &mdash; establishing rest as part of a healthy rhythm of life from the very beginning.</p>"},
{lb:"The Sabbath command",dr:dQ2,ht:"<p>Exodus 20:8-10 commands, <em>\"Remember the Sabbath day by keeping it holy... you shall not do any work\"</em> &mdash; rest was built into Israel's law as a non-negotiable rhythm, not merely a suggestion.</p>"},
{lb:"Rest is not laziness",dr:dQ2,ht:"<p>Diligence and rest are not opposites; rather, <b>regular rest</b> sustains long-term diligence, preventing the burnout and poor judgement that come from ceaseless, unbroken labour.</p>"},
{lb:"Come to me and rest",dr:dQ2,ht:"<p>Jesus invited, <em>\"Come to me, all you who are weary and burdened, and I will give you rest\"</em> (Matthew 11:28) &mdash; ultimate rest is found not only in physical cessation from labour, but in relationship with Christ.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What did God do on the seventh day of creation, according to Genesis 2:2-3?","o":["Rested, and blessed and made the day holy","Created even more than on previous days","Destroyed part of His earlier creation","Left the world incomplete"],"a":0,"w":"Genesis 2:2-3 says God rested on the seventh day, and blessed and made it holy."},{"q":"What does this lesson say God's rest establishes, from the very beginning?","o":["That work is inherently sinful","Rest as part of a healthy rhythm of life","That rest has no real spiritual significance","That God required rest due to weakness"],"a":1,"w":"God's rest establishes rest as part of a healthy rhythm of life, from the very beginning, according to this lesson."},{"q":"What does Exodus 20:8-10 command regarding the Sabbath?","o":["Observe it only during religious festivals","Ignore it in favour of continuous labour","Remember it by keeping it holy and not doing any work","Treat it as entirely optional"],"a":2,"w":"Exodus 20:8-10 commands remembering the Sabbath by keeping it holy and not working."},{"q":"How does this lesson describe the Sabbath's place in Israel's law?","o":["A minor detail with no real importance","An entirely optional custom","A rule only for religious leaders","A non-negotiable rhythm, not merely a suggestion"],"a":3,"w":"This lesson describes the Sabbath as a non-negotiable rhythm, not merely a suggestion, in Israel's law."},{"q":"What does this lesson say about the relationship between diligence and rest?","o":["They are not opposites; rest sustains long-term diligence","Rest always undermines diligence","Diligence requires the complete avoidance of rest","Rest and diligence have no real connection"],"a":0,"w":"This lesson says diligence and rest are not opposites; rest sustains long-term diligence."},{"q":"What does regular rest prevent, according to this lesson?","o":["All forms of hard work entirely","Burnout and poor judgement from ceaseless labour","Any need for future diligence","Nothing of any real consequence"],"a":1,"w":"Regular rest prevents burnout and poor judgement from ceaseless labour, according to this lesson."},{"q":"What invitation did Jesus give in Matthew 11:28?","o":["\"Rest is unnecessary for true disciples\"","\"Work harder, and rest will never be needed\"","\"Come to me, all you who are weary and burdened, and I will give you rest\"","\"Only the wealthy deserve rest\""],"a":2,"w":"Jesus invited, \"Come to me, all you who are weary and burdened, and I will give you rest\" (Matt 11:28)."},{"q":"Where does this lesson say ultimate rest is found, according to Matthew 11:28?","o":["Nowhere — true rest is impossible in this life","Only in complete physical inactivity","Only in accumulated wealth","Not only in physical cessation from labour, but in relationship with Christ"],"a":3,"w":"Ultimate rest is found not only in physical cessation from labour, but in relationship with Christ, according to this lesson."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q7 \u2022 CRS \u2022 Acts & Epistles",ti:"Stewardship of Talents and Gifts in Work",su:"Explain how believers are called to use their God-given talents diligently in their work.",steps:[
{lb:"Gifts given by God",dr:dQ1,ht:"<p>Romans 12:6 teaches that believers <em>\"have different gifts, according to the grace given to each of us\"</em> &mdash; skills and abilities used in work are themselves gifts from God, not merely personal achievements.</p>"},
{lb:"Using gifts diligently",dr:dQ1,ht:"<p>Romans 12:6-8 instructs believers to use their specific gifts &mdash; whether serving, teaching, encouraging, giving, leading or showing mercy &mdash; with <b>diligence and sincerity</b>.</p>"},
{lb:"The Parable of the Talents revisited",dr:dQ1,ht:"<p>As in Matthew 25:14-30, whatever ability or resource one is given for work should be actively invested and developed, not left idle out of fear or laziness.</p>"},
{lb:"Working as unto the Lord",dr:dQ1,ht:"<p>Whatever specific talent a believer brings to their profession &mdash; whether trade, business, teaching or craft &mdash; it should be exercised as an offering of worship to God, not merely for personal gain.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Romans 12:6 say believers have, according to the grace given to each?","o":["Different gifts","Identical gifts for everyone","No particular gifts at all","Gifts only for church leaders"],"a":0,"w":"Romans 12:6 says believers have different gifts, according to the grace given to each of us."},{"q":"How does this lesson describe skills and abilities used in work?","o":["Entirely the product of personal effort alone","Gifts from God, not merely personal achievements","Irrelevant to Christian faith","Only relevant to religious professions"],"a":1,"w":"This lesson describes skills and abilities as gifts from God, not merely personal achievements."},{"q":"What examples of gifts does Romans 12:6-8 mention?","o":["Only manual labour skills","Only preaching and prophecy","Serving, teaching, encouraging, giving, leading, showing mercy","Only musical talent"],"a":2,"w":"Romans 12:6-8 mentions serving, teaching, encouraging, giving, leading and showing mercy as examples of gifts."},{"q":"How does Romans 12:6-8 instruct believers to use their gifts?","o":["Only for personal benefit","Only when publicly recognised","Reluctantly and half-heartedly","With diligence and sincerity"],"a":3,"w":"Romans 12:6-8 instructs believers to use their gifts with diligence and sincerity."},{"q":"What does the Parable of the Talents teach about ability or resources given for work?","o":["They should be actively invested and developed, not left idle","They should be hidden away for safekeeping","They have no real connection to diligence","They should be given away entirely, with no personal use"],"a":0,"w":"The Parable of the Talents teaches that ability or resources should be actively invested and developed, not left idle."},{"q":"What does the Parable of the Talents warn against, regarding one's gifts?","o":["Investing them wisely for growth","Leaving them idle out of fear or laziness","Sharing them generously with others","Recognising them as gifts from God"],"a":1,"w":"The Parable of the Talents warns against leaving one's gifts idle out of fear or laziness."},{"q":"How should a believer's specific talent in their profession be exercised, according to this lesson?","o":["Without any reference to God at all","Only for maximum personal financial benefit","As an offering of worship to God, not merely for personal gain","Only within explicitly religious contexts"],"a":2,"w":"A believer's talent should be exercised as an offering of worship to God, not merely for personal gain, according to this lesson."},{"q":"What overall connection does this lesson draw between talents and work?","o":["Talents should be reserved only for church activities","Talents have no real connection to how one works","Only religious talents matter for Christian living","God-given talents should be diligently developed and used in one's work as worship"],"a":3,"w":"This lesson draws the connection that God-given talents should be diligently developed and used in one's work as worship."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q8 \u2022 CRS \u2022 Acts & Epistles",ti:"Work and Provision for the Family",su:"Explain the biblical teaching that diligent work is connected to caring responsibly for one\u2019s family.",steps:[
{lb:"Providing for one's own household",dr:dQ2,ht:"<p>Paul writes, <em>\"Anyone who does not provide for their relatives, and especially for their own household, has denied the faith\"</em> (1 Timothy 5:8) &mdash; strong language showing the seriousness of this responsibility.</p>"},
{lb:"The virtuous woman's industry",dr:dQ2,ht:"<p>Proverbs 31:10-27 describes a diligent, industrious woman who works with her hands, manages a household, and engages in trade, providing generously for her family.</p>"},
{lb:"Working to share with others",dr:dQ2,ht:"<p>Ephesians 4:28 instructs the former thief to <em>\"do something useful with their own hands, that they may have something to share with those in need\"</em> &mdash; diligent work enables generosity toward others, not just self-provision.</p>"},
{lb:"Balancing work and family life",dr:dQ2,ht:"<p>These teachings show that diligent work is not opposed to family life, but is a primary way believers responsibly <b>love and care</b> for those depending on them.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does 1 Timothy 5:8 say about someone who fails to provide for their own household?","o":["They have denied the faith","They have committed only a minor error","This has no real spiritual consequence","This applies only to unbelievers"],"a":0,"w":"1 Timothy 5:8 says such a person has denied the faith."},{"q":"What does this lesson say about the language used in 1 Timothy 5:8?","o":["Mild language, suggesting a minor issue","Strong language showing the seriousness of this responsibility","Language with no real theological weight","Language directed only at church leaders"],"a":1,"w":"This lesson notes the strong language in 1 Timothy 5:8 shows the seriousness of family provision."},{"q":"What does Proverbs 31 describe the virtuous woman as doing?","o":["Depending entirely on others for provision","Avoiding all forms of practical work","Working with her hands, managing a household, and engaging in trade","Neglecting her household responsibilities"],"a":2,"w":"Proverbs 31 describes the virtuous woman working with her hands, managing a household, and engaging in trade."},{"q":"What does Ephesians 4:28 instruct the former thief to do?","o":["Depend entirely on the church for support","Continue their former dishonest practices quietly","Avoid all forms of work entirely","Do something useful with their hands, to share with those in need"],"a":3,"w":"Ephesians 4:28 instructs the former thief to do something useful with their hands, to share with those in need."},{"q":"What does diligent work enable, according to Ephesians 4:28?","o":["Generosity toward others, not just self-provision","Only self-provision, with no capacity for generosity","Nothing of any real benefit to others","Only personal wealth accumulation"],"a":0,"w":"Diligent work enables generosity toward others, not just self-provision, according to Ephesians 4:28."},{"q":"What does this lesson say diligent work is, in relation to family life?","o":["Entirely opposed to family life","A primary way believers responsibly love and care for those depending on them","Irrelevant to how believers care for their families","Only relevant to unmarried believers"],"a":1,"w":"This lesson says diligent work is a primary way believers responsibly love and care for their families."},{"q":"What overall balance does this lesson describe between work and family?","o":["Family must always take priority over work, with no room for labour","Work must always take priority over family, with no balance","Diligent work and caring for family are complementary, not opposed","Work and family have no real connection to each other"],"a":2,"w":"This lesson describes diligent work and caring for family as complementary, not opposed."},{"q":"What broader principle unites 1 Timothy 5:8, Proverbs 31 and Ephesians 4:28?","o":["Family provision is solely the government's responsibility","Work has no connection to caring for one's family","Only wealthy people can adequately provide for their families","Diligent work is a responsible expression of love for one's family and others"],"a":3,"w":"These passages unite around the principle that diligent work is a responsible expression of love for family and others."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q9 \u2022 CRS \u2022 Acts & Epistles",ti:"WAEC Exam Preparation \u2014 Work and Diligence",su:"Practise WAEC-style questions on work and diligence in the Epistles and Wisdom Literature.",steps:[
{lb:"WAEC essay structure",dr:dQ1,ht:"<p>For WAEC essays on work and diligence: (1) Identify the <b>specific passage or theme</b>. (2) Give the <b>precise reference</b>. (3) Explain the teaching <b>clearly</b>. (4) Draw out a <b>practical application</b>.</p>"},
{lb:"Common WAEC question patterns",dr:dQ1,ht:"<p>Common patterns include: \"Explain the biblical teaching on diligence from Proverbs.\" / \"Discuss Paul's example and teaching on work.\" / \"What does the Bible teach about fair treatment of workers?\"</p>"},
{lb:"Key references to remember",dr:dQ1,ht:"<p>Key references: <b>Genesis 2:15</b> (work before the Fall); <b>Colossians 3:23</b> (working for the Lord); <b>Proverbs 6:6-11, 10:4, 12:24</b> (diligence); <b>2 Thessalonians 3:8-12</b> (Paul's example); <b>James 5:4</b> (fair wages); <b>1 Timothy 5:8</b> (providing for family).</p>"},
{lb:"Connecting to practical work ethics",dr:dQ1,ht:"<p>WAEC essays should always connect teaching to <b>practical work ethics today</b> &mdash; diligence, honesty, fair treatment and provision for family &mdash; rather than treating work only as an abstract theme.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on work and diligence?","o":["Identify the specific passage or theme asked about","Give a personal opinion with no facts","List unrelated facts","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on work and diligence should begin by identifying the specific passage or theme asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe Nigeria's mineral resources.\"","\"Discuss Paul's example and teaching on work.\"","\"Define a covalent bond.\"","\"List West African capital cities.\""],"a":1,"w":"\"Discuss Paul's example and teaching on work\" is a typical WAEC-style question."},{"q":"Which verse should be cited when discussing the origin of work before the Fall?","o":["Proverbs 10:4","Colossians 3:23","Genesis 2:15","1 Timothy 5:8"],"a":2,"w":"Genesis 2:15 should be cited when discussing the origin of work before the Fall."},{"q":"Which passage should be cited when discussing diligence using the image of the ant?","o":["James 5:4","2 Thessalonians 3:8","Ephesians 6:5-6","Proverbs 6:6-8"],"a":3,"w":"Proverbs 6:6-8, the ant, should be cited when discussing diligence."},{"q":"Which passage should be cited when discussing Paul's personal example of work?","o":["2 Thessalonians 3:8-12","Genesis 2:15","Proverbs 22:1","Romans 12:6-8"],"a":0,"w":"2 Thessalonians 3:8-12 should be cited when discussing Paul's personal example of work."},{"q":"Which passage should be cited when discussing fair treatment of workers?","o":["Proverbs 6:6-8","James 5:4","Colossians 3:23","Genesis 2:2-3"],"a":1,"w":"James 5:4 should be cited when discussing fair treatment of workers."},{"q":"Which passage should be cited when discussing work and provision for family?","o":["Matthew 11:28","Exodus 20:8-10","1 Timothy 5:8","Ephesians 6:9"],"a":2,"w":"1 Timothy 5:8 should be cited when discussing work and provision for family."},{"q":"Why should WAEC essays connect teaching to practical work ethics today?","o":["WAEC forbids discussing daily life applications","Practical application is irrelevant to WAEC marking","Only abstract theology should be discussed","It shows the theology remains relevant to real Christian life"],"a":3,"w":"Connecting to practical work ethics shows the theology remains relevant to real Christian life, which WAEC rewards."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q10 \u2022 CRS \u2022 Acts & Epistles",ti:"Mixed Questions \u2014 Work and Diligence",su:"Integrated revision across biblical teaching on work, diligence and stewardship.",steps:[
{lb:"Summary of key themes",dr:dQ2,ht:"<p>Work is a God-given calling rooted in creation, to be pursued with diligence, honesty and excellence, offered to God as worship, balanced with rest, and used to provide responsibly for family and to bless others.</p>"},
{lb:"Key references to remember",dr:dQ2,ht:"<p>Must-know facts: <b>Genesis 2:15</b> (work before the Fall); <b>Colossians 3:23</b> (working for the Lord); <b>Proverbs 6:6-11, 10:4</b> (diligence); <b>2 Thessalonians 3:10</b> (unwilling to work); <b>James 5:4</b> (fair wages); <b>1 Timothy 5:8</b> (family provision).</p>"},
{lb:"Lessons for today",dr:dQ2,ht:"<p>These teachings call believers to work diligently and honestly, treat others fairly, rest wisely, and use their gifts and income to care for their families and bless those in need.</p>"},
{lb:"Final exam tips",dr:dQ2,ht:"<p>Always give the <b>precise reference</b>, explain the teaching <b>clearly and accurately</b>, and conclude by connecting the passage to a practical, everyday example of diligent work.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What did God place Adam in Eden to do, according to Genesis 2:15?","o":["Work it and take care of it","Rest permanently with no responsibility","Explore other lands","Build a temple immediately"],"a":0,"w":"Genesis 2:15 says God placed Adam in Eden to work it and take care of it."},{"q":"What creature does Proverbs 6:6-8 point to as a model of diligence?","o":["The eagle","The ant","The lion","The sheep"],"a":1,"w":"Proverbs 6:6-8 points to the ant as a model of diligence."},{"q":"What trade did Paul practise, according to Acts 18:1-3?","o":["Carpentry","Fishing","Tentmaking","Farming"],"a":2,"w":"Paul practised tentmaking, according to Acts 18:1-3."},{"q":"What instruction did Paul give regarding those unwilling to work, in 2 Thessalonians 3:10?","o":["\"Work is optional for devoted believers\"","\"All believers should be supported regardless of effort\"","\"Only the wealthy are expected to work\"","\"The one who is unwilling to work shall not eat\""],"a":3,"w":"Paul instructed, \"The one who is unwilling to work shall not eat\" (2 Thess 3:10)."},{"q":"What does James 5:4 condemn regarding employers?","o":["Withholding wages owed to workers","Paying workers too generously","Employing too many workers","Providing workers with rest days"],"a":0,"w":"James 5:4 condemns employers who withhold wages owed to workers."},{"q":"What does Proverbs 22:1 say is more desirable than great riches?","o":["Additional wealth","A good name","Political power","Physical strength"],"a":1,"w":"Proverbs 22:1 says a good name is more desirable than great riches."},{"q":"What does 1 Timothy 5:8 say about someone who fails to provide for their own household?","o":["This has no real spiritual consequence","They have committed only a minor error","They have denied the faith","This applies only to unbelievers"],"a":2,"w":"1 Timothy 5:8 says such a person has denied the faith."},{"q":"What overall lesson unites the themes studied in this topic?","o":["Work has no real spiritual significance for believers","Work is a curse to be avoided wherever possible","Only wealthy people are expected to work diligently","Diligent, honest work, offered to God, is central to responsible Christian living"],"a":3,"w":"The unifying lesson is that diligent, honest work, offered to God, is central to responsible Christian living."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
