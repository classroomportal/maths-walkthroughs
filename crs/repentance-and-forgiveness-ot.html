var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Repentance and Forgiveness — Key Concepts',ACC,12,'middle',true));
var rows=[['Repentance','Turning away from sin and returning to God (Hebrew: shub)'],['Forgiveness','God\'s pardoning of sin; removal of guilt and consequences'],['Confession','Acknowledging sin honestly before God (Psalm 51)'],['Atonement','Covering or removal of sin; restored relationship with God'],['Restoration','Return to right standing; renewed covenant relationship'],['Discipline','God\'s corrective action to bring his people back (Heb.12:6)']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(120,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Key Repentance Texts in the OT',ACC,12,'middle',true));
var rows=[['Psalm 51','David after Bathsheba: "Create in me a pure heart"'],['Isaiah 55:7','Let the wicked forsake their way; the LORD will have mercy'],['Hosea 6:1','Come, let us return to the LORD; he will heal us'],['Joel 2:12-13','Return with all your heart; rend your heart not your garment'],['Jonah 3','Nineveh repented at Jonah\'s preaching; God relented'],['2 Chr.7:14','Humble, pray, seek face, turn — I will hear and heal']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(110,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Repentance and Forgiveness — Summary',ACC,13,'middle',true));
var rows=[['Ps.51','Genuine repentance: acknowledge sin; pure heart; broken spirit'],['2 Chr.7:14','Humble, pray, seek face, turn; hear, forgive, heal land'],['Joel 2:13','Rend heart not garment — inward, not outward only'],['Jonah 3','Even Nineveh repented; God relents for all who turn'],['Hosea 6:1','Come, return to the LORD — restoration is His desire'],['shub','Hebrew for repentance = turning; true repentance changes direction']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(100,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 OT',ti:'The Meaning of Repentance',su:'Examine what repentance means in the Old Testament.',steps:[
{lb:'Hebrew concept — shub',dr:dQ1,ht:'<p>The primary Hebrew word for repentance is <em>shub</em> — meaning "to turn" or "to return." True repentance is a U-turn: away from sin and back toward God. It requires a change of direction, not merely feeling sorry. God\'s repeated call: <em>"Return to me and I will return to you"</em> (Mal.3:7). Joel 2:12-13 commands returning with fasting, weeping and mourning. God is always portrayed as waiting, eager for the return of His people.</p>'},
{lb:'Components of genuine repentance',dr:dQ2,ht:'<p>OT repentance involves: (1) <b>Recognition</b> — acknowledging sin honestly ("I have sinned against the LORD" — 2Sam.12:13). (2) <b>Remorse</b> — genuine grief over the sin (Ps.51:17 — broken and contrite heart). (3) <b>Confession</b> — naming the sin before God (Ps.32:5). (4) <b>Restitution</b> — making right what was wronged where possible. (5) <b>Redirection</b> — actually turning away from the sin in practice.</p>'},
{lb:'Joel 2:12-13 — rend your heart, not your garment',dr:dQ1,ht:'<p>Joel 2:13: <em>"Rend your heart and not your garments. Return to the LORD your God, for he is gracious and compassionate, slow to anger and abounding in love, and he relents from sending calamity."</em> The key: "rend your heart, not your garments." Tearing garments was an outward sign of grief. Joel says outward signs are worthless without inward transformation. God desires a broken heart (Ps.51:17), not dramatic performance. The basis for repentance: God\'s character — gracious, compassionate, slow to anger.</p>'},
{lb:'God who forgives — His character',dr:dQ1,ht:'<p>The OT consistently portrays God as eager to forgive: (1) "Ready to forgive" (Ps.86:5). (2) "Gracious and compassionate, slow to anger and abounding in love" (Joel 2:13; Ex.34:6-7). (3) "He casts all our sins into the depths of the sea" (Mic.7:19). (4) "I will remember their sins no more" (Jer.31:34). (5) "Repent and live!" (Ezek.18:32) — God takes no pleasure in death. God in the OT is not reluctant to forgive the truly repentant — He actively calls them back.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Hebrew word "shub" (repentance) primarily means:',o:['To feel deep remorse for past actions','To offer the required sacrifice for sin','To turn or return — a change of direction back to God','To fast and pray until forgiveness is granted'],a:3,w:'"Shub" = to turn or return. Repentance is a U-turn: away from sin and back toward God. It requires actual change of direction, not just emotion or ritual.'},{q:'Joel 2:13 says "Rend your heart and not your garments." This means:',o:['Outward grief expressions are sinful and wrong','Physical fasting is more important than emotional grief','God desires inward heart-change over outward ritual performance','Only priests can perform official acts of national repentance'],a:3,w:'Joel 2:13 — tearing garments was an outward sign of grief; Joel says the sign without inward change is worthless. God wants a broken heart (Ps.51:17), not a dramatic public performance.'},{q:'Joel 2:13 describes God\'s character for those who repent as:',o:['Holy and demanding; requiring full restitution before forgiving','Gracious and compassionate, slow to anger and abounding in love','Distant and silent, testing sincerity over many years','Forgiving only small sins; great sins require extraordinary sacrifice'],a:2,w:'Joel 2:13 — "he is gracious and compassionate, slow to anger and abounding in love, and he relents from sending calamity." This description echoes Exodus 34:6, God\'s own declaration of His character.'},{q:'Micah 7:19 says God\'s complete forgiveness involves:',o:['Writing sin in a record to be reviewed at judgment','Casting all our sins into the depths of the sea','A period of punishment before full forgiveness','Forgiving only if the person never sins again'],a:2,w:'Micah 7:19 — "you will hurl all our iniquities into the depths of the sea" — complete, permanent disposal of forgiven sin. Not retrieved, not remembered, not used against the person again.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 OT',ti:'David\'s Repentance — Psalm 51',su:'Examine David\'s model of repentance (Psalm 51).',steps:[
{lb:'The background to Psalm 51',dr:dQ1,ht:'<p>Psalm 51 is the most profound personal expression of repentance in the OT. Its heading states it was written after Nathan confronted David about his adultery with Bathsheba and the murder of Uriah her husband (2Sam.11-12). David\'s sin involved: adultery; arranging Uriah\'s death; abuse of royal power; cover-up. When Nathan confronted him with the parable of the stolen lamb, David immediately said: <em>"I have sinned against the LORD"</em> (2Sam.12:13). Psalm 51 gives us the inner life of that moment.</p>'},
{lb:'Three words for sin (Psalm 51:1-4)',dr:dQ2,ht:'<p>David\'s confession uses three different Hebrew words for sin: (1) <em>Pesha</em> — transgressions (deliberate rebellion against God). (2) <em>Awon</em> — iniquity (twisted inner nature). (3) <em>Chatta\'ah</em> — sin (missing the mark). By using all three, David acknowledges the full depth of his failure. He also declares: <em>"Against you, you only, have I sinned"</em> (v.4) — recognising that sin, even when it harms others, is fundamentally a violation of relationship with God.</p>'},
{lb:'Cleansing and renewal (Psalm 51:7-12)',dr:dQ2,ht:'<p>David asked: <em>"Create in me a pure heart, O God, and renew a steadfast spirit within me"</em> (v.10). The word "create" (bara) is the same used in Genesis 1 — only God can create what human effort cannot produce. He prayed: "Do not cast me from your presence or take your Holy Spirit from me" (v.11). Relationship with God — not just forgiveness of penalty — is what David most feared losing. Cleansing (hyssop, v.7) and inner renewal (pure heart) are the twin requests.</p>'},
{lb:'The outcome of forgiveness (Psalm 51:13-17)',dr:dQ2,ht:'<p>David promised: "Then I will teach transgressors your ways, so that sinners will turn back to you" (v.13) — forgiven people become witnesses. He declared: <em>"My sacrifice, O God, is a broken spirit; a broken and contrite heart you, God, will not despise"</em> (v.17). No sacrifice substitutes for a broken, humble heart. This is one of the OT\'s clearest statements that God desires inward reality over ritual performance — a theme that Jesus, Amos, Hosea and Micah all echoed.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Psalm 51 was written by David following his sin of:',o:['Counting the fighting men of Israel (the census)','Adultery with Bathsheba and arranging the murder of Uriah','Worshipping idols set up by his foreign wives','Disobeying God by not destroying all the Amalekites'],a:2,w:'Psalm 51\'s heading — "after Nathan the prophet had come to him, after David had committed adultery with Bathsheba" — Nathan\'s parable of the stolen lamb broke David\'s year of denial (2Sam.12).'},{q:'David used three Hebrew words for sin in Psalm 51. Which is NOT one of them?',o:['Pesha (transgression — deliberate rebellion)','Awon (iniquity — twisted nature)','Chatta\'ah (sin — missing the mark)','Kaphar (atonement — covering)'],a:4,w:'The three words David used are pesha (transgression), awon (iniquity) and chatta\'ah (sin). Kaphar (atone/cover) is the root of Yom Kippur — it describes the action of forgiveness, not the sin itself.'},{q:'David asked God to "create" a pure heart (Ps.51:10). The word "bara" is significant because:',o:['It shows David was being poetic and dramatic','It is the same word used for creation in Genesis 1 — only God can create what humans cannot produce','It means he expected an immediate miracle without further effort','It was the standard word used in all temple prayers'],a:2,w:'"Bara" (create) in Gen.1 and Ps.51:10 — David knew his own effort could not produce a pure heart. Only God\'s creative act could bring what was needed. Repentance depends on God\'s action, not human willpower.'},{q:'Psalm 51:17 says the sacrifice God truly accepts is:',o:['A burnt offering of bulls at the altar','A grain offering with frankincense','A broken spirit and a contrite heart','Annual fasting at the Day of Atonement'],a:3,w:'Ps.51:17 — "My sacrifice, O God, is a broken spirit; a broken and contrite heart you, God, will not despise" — inward reality (humility, brokenness) over ritual performance.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 OT',ti:'Jonah and the Repentance of Nineveh',su:'Examine the repentance of Nineveh (Jonah 3).',steps:[
{lb:'Background to Jonah',dr:dQ3,ht:'<p>Jonah was an Israelite prophet sent by God to preach to Nineveh — the capital of Assyria, Israel\'s most feared enemy and one of the most brutal empires of the ancient world. Jonah\'s response: he fled in the opposite direction by ship to Tarshish. God sent a great storm; Jonah was thrown overboard and swallowed by a great fish. After three days in the fish\'s belly, he prayed and was delivered. He then obeyed God\'s second call and went to Nineveh to preach.</p>'},
{lb:'Nineveh\'s repentance (Jonah 3:4-9)',dr:dQ4,ht:'<p>Jonah preached: <em>"Forty more days and Nineveh will be overthrown"</em> (3:4) — just five words in Hebrew. The result: <em>"The Ninevites believed God. A fast was proclaimed, and all of them, from the greatest to the least, put on sackcloth"</em> (3:5). Even the king rose from his throne, removed his royal robes, covered himself with sackcloth and sat in dust (3:6). The king\'s decree: everyone must fast, call urgently on God and "turn from their evil ways and from the violence in their hands" (3:8).</p>'},
{lb:'God\'s response to Nineveh',dr:dQ3,ht:'<p><em>"When God saw what they did and how they turned from their evil ways, he relented and did not bring on them the destruction he had threatened"</em> (3:10). God\'s response to genuine repentance is compassion — even for Israel\'s most feared enemy. This was exactly what Jonah had feared (4:2): "I knew that you are a gracious and compassionate God, slow to anger and abounding in love, a God who relents from sending calamity." God\'s mercy extends beyond Israel to any who genuinely repent.</p>'},
{lb:'Lessons from Jonah',dr:dQ4,ht:'<p>Lessons: (1) Repentance is possible for anyone — even the most wicked nations. (2) God\'s mercy extends beyond the covenant community. (3) Genuine repentance involves turning from evil, not just outward ceremony — Nineveh "turned from their evil ways" (3:10). (4) Jonah\'s prejudice (fleeing, then angry at forgiveness) is corrected by God\'s broader compassion. (5) Jesus cited Nineveh as a model (Matt.12:41): "The men of Nineveh will stand up at the judgment with this generation and condemn it; for they repented at the preaching of Jonah."</p>'},
{lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'Why did Jonah initially flee from God\'s command to preach to Nineveh?',o:['He was too afraid of the sea journey','He could not speak the Assyrian language','He was prejudiced — he feared God would forgive Israel\'s enemy if they repented (Jonah 4:2)','He had no message to give from God'],a:3,w:'Jonah 4:2 — Jonah admitted he fled because "I knew that you are a gracious and compassionate God" — he feared God would forgive Nineveh if they repented, which he did not want.'},{q:'The extent of Nineveh\'s repentance (Jonah 3:5-7) included:',o:['Only the poor and common people, not the powerful','The king, nobles and all the people — from greatest to least — fasting and wearing sackcloth','Only the priests and religious officials of Nineveh','A few days of quiet prayer without public declaration'],a:2,w:'Jonah 3:5-7 — "from the greatest to the least" put on sackcloth; even the king rose from his throne, removed his robes, sat in dust and issued a public decree of repentance and fasting.'},{q:'God\'s response to Nineveh\'s repentance (Jonah 3:10) was:',o:['He destroyed them anyway as a warning to other nations','He reduced the punishment to 40 years of drought instead','He relented from the threatened disaster — He did not bring destruction','He required further years of fasting before forgiving them'],a:3,w:'Jonah 3:10 — "When God saw what they did and how they turned from their evil ways, he relented and did not bring on them the destruction he had threatened" — genuine repentance met with full forgiveness.'},{q:'Jesus referred to Nineveh\'s repentance (Matthew 12:41) to:',o:['Show that Assyrians were generally more righteous than Israelites','Condemn his generation for not repenting at his greater-than-Jonah preaching','Prove that only dramatic national repentance is genuine','Explain why God destroyed Nineveh later despite earlier repentance'],a:2,w:'Matt.12:41 — the Ninevites "repented at the preaching of Jonah, and now something greater than Jonah is here" — their repentance condemns those who refused to respond to Jesus.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 OT',ti:'2 Chronicles 7:14 — National Repentance',su:'Examine the call to national repentance in 2 Chronicles 7:14.',steps:[
{lb:'The context',dr:dQ4,ht:'<p>After Solomon dedicated the temple, God appeared to him at night: <em>"If my people, who are called by my name, will humble themselves and pray and seek my face and turn from their wicked ways, then I will hear from heaven, and I will forgive their sin and will heal their land"</em> (2Chr.7:14). This verse has become the central OT text on national repentance. It was spoken in the context of potential crises: drought, locusts and plague — all covenant curses (Deut.28) that could be reversed by national repentance.</p>'},
{lb:'The four conditions',dr:dQ2,ht:'<p>God\'s four conditions: (1) <b>Humble themselves</b> — turning from pride and self-reliance; acknowledging dependence on God. (2) <b>Pray</b> — active seeking of God. (3) <b>Seek God\'s face</b> — seek God Himself, not only His blessings. (4) <b>Turn from wicked ways</b> — actual behavioural change, not just ceremony. The three promises: (1) I will <b>hear</b> from heaven (access to God). (2) I will <b>forgive</b> their sin (restoration). (3) I will <b>heal their land</b> (national renewal). All four conditions are required; all three promises follow.</p>'},
{lb:'"My people, who are called by my name"',dr:dQ1,ht:'<p>The phrase "my people, who are called by my name" means repentance is primarily the responsibility of God\'s people, not of unbelievers. National healing begins with the repentance of the faith community. This is radical: God does not tell Israel to wait for the surrounding nations to repent. The community of faith leads. Application: in Nigeria, the church is called to lead national repentance, not wait for politicians. When believers humble themselves, pray and turn from sin, God responds with national healing.</p>'},
{lb:'Application',dr:dQ2,ht:'<p>2 Chr.7:14 applied today: (1) Humbling — the church must acknowledge its own sin and corruption, not just the nation\'s. (2) Prayer — not just prayer rallies but sustained, persistent intercession. (3) Seeking God\'s face — relationship with God, not just requests from God. (4) Turning from wicked ways — real ethical change in how Christians conduct business, treat employees, relate to the poor. (5) "Heal their land" — God can heal communities, economies and societies in response to genuine corporate repentance. This is the OT\'s promise of national redemption.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The four conditions in 2 Chronicles 7:14 are:',o:['Pray, fast, give offerings, attend temple','Humble themselves, pray, seek God\'s face, turn from wicked ways','Confess, fast, build the temple, observe Sabbath','Offer sacrifices, anoint with oil, sound trumpets, march around the city'],a:2,w:'2 Chr.7:14 — four conditions: (1) humble themselves, (2) pray, (3) seek my face, (4) turn from their wicked ways. All four together constitute genuine national repentance.'},{q:'God\'s three promises in response to the four conditions in 2 Chr.7:14 are:',o:['Send rain, restore harvests, protect the borders','Hear from heaven, forgive their sin, heal their land','Give them a new king, restore the temple, expand their territory','Silence enemies, provide abundance, give peace'],a:2,w:'2 Chr.7:14 — three promises: "I will hear from heaven" (access), "I will forgive their sin" (restoration), "I will heal their land" (national renewal).'},{q:'"My people, who are called by my name" (2 Chr.7:14) means repentance is primarily the responsibility of:',o:['The political leaders and government of the nation','Foreign nations who have oppressed God\'s people','God\'s own people — the faith community — not only unbelievers','The Levitical priesthood alone'],a:3,w:'"My people, who are called by my name" — God addresses believers, not unbelievers. National healing begins with the repentance of God\'s own community, not with reforming outsiders.'},{q:'2 Chronicles 7:14 was originally spoken in the context of:',o:['Israel\'s return from Babylonian exile','Hezekiah\'s religious reform','Solomon\'s dedication of the temple — God appeared to Solomon at night in response','Nehemiah\'s rebuilding of Jerusalem\'s walls'],a:3,w:'2 Chr.7:11-14 — God appeared to Solomon at night after Solomon had finished building the temple and his palace, giving conditional promises of blessing and warning of covenant curse.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 OT',ti:'Hosea — God\'s Call to Return',su:'Examine Hosea\'s message of repentance and God\'s persistent love.',steps:[
{lb:'Hosea\'s marriage as parable (Hosea 1-3)',dr:dQ5,ht:'<p>God commanded Hosea to marry an unfaithful woman (Gomer) as a living parable of Israel\'s relationship with God. Gomer was repeatedly unfaithful; yet God commanded Hosea to take her back (ch.3). This was God\'s message: Israel had been unfaithful (worshipping Baals), yet God\'s love was persistent and pursuing. The extraordinary verse: <em>"Therefore I am now going to allure her; I will lead her into the wilderness and speak tenderly to her"</em> (2:14). God\'s response to unfaithfulness is not abandonment but tender wooing back.</p>'},
{lb:'Hosea 6:1 — Come, let us return to the LORD',dr:dQ6,ht:'<p>Hosea 6:1-3: <em>"Come, let us return to the LORD. He has torn us to pieces but he will heal us; he has injured us but he will bind up our wounds."</em> Key points: (1) "Come, let us return" — corporate repentance, not just individual. (2) God who wounds is the same God who heals — judgment and restoration come from the same hand. (3) The goal of discipline is always restoration. (4) God\'s desire is for His people to "live in his presence" (6:2) — relationship, not just compliance.</p>'},
{lb:'Hosea 6:6 — mercy, not sacrifice',dr:dQ5,ht:'<p>Hosea 6:6: <em>"For I desire mercy (chesed), not sacrifice, and acknowledgment of God rather than burnt offerings."</em> Jesus quoted this verse twice in Matthew (9:13 and 12:7). God\'s desire: (1) <em>Chesed</em> — covenant love, steadfast loyalty, mercy, faithful kindness. (2) Knowledge of God — genuine relationship, not just ritual compliance. This verse is in the same tradition as Micah 6:8, Amos 5:21-24 and Isaiah 58 — God values inner reality of relationship over outward performance of religion.</p>'},
{lb:'Hosea 14 — God\'s final call',dr:dQ5,ht:'<p>Hosea 14:1-4: <em>"Return, Israel, to the LORD your God... Take words with you and return to the LORD. Say to him: \'Forgive all our sins and receive us graciously.\'"</em> God then promises: "I will heal their waywardness and love them freely, for my anger has turned away from them" (14:4). The book closes: "The ways of the LORD are right; the righteous walk in them" (14:9). Hosea\'s final message: God\'s invitation to return is always open; His love is freely given to those who repent.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'God commanded Hosea to marry an unfaithful woman as:',o:['A punishment for Hosea\'s own sins','A test of Hosea\'s obedience alone','A living parable of Israel\'s spiritual unfaithfulness to God through Baal worship','A demonstration that marriage vows can be broken under extreme circumstances'],a:3,w:'Hosea 1:2 — God commanded Hosea to marry Gomer as a parable: just as Gomer was unfaithful to Hosea, Israel was unfaithful to God through Baal worship (spiritual adultery).'},{q:'Hosea 6:6 says God desires:',o:['Magnificent temple sacrifices and regular burnt offerings','Mercy (chesed) and knowledge/acknowledgment of God rather than sacrifice','Fasting and mourning as the primary expression of repentance','Military victory over enemies as proof of God\'s blessing'],a:2,w:'Hosea 6:6 — "I desire mercy (chesed), not sacrifice, and acknowledgment of God rather than burnt offerings." Jesus quoted this in Matt.9:13 and 12:7. Inner relationship over ritual.'},{q:'Hosea 6:1 calls Israel to:',o:['Return to the LORD — He has torn us but He will heal us (corporate repentance)','Offer more sacrifices at the temple to appease God\'s anger','Send armies to fight Israel\'s enemies as proof of covenant loyalty','Fast for 40 days as Moses did on Mount Sinai'],a:1,w:'Hosea 6:1 — "Come, let us return to the LORD. He has torn us to pieces but he will heal us" — a call to corporate repentance with confidence that the God who disciplines also restores.'},{q:'In Hosea 2:14, God\'s response to Israel\'s unfaithfulness is to:',o:['Destroy them permanently and begin again with a new people','Allure and speak tenderly to her — pursuing her with love despite unfaithfulness','Require seven years of fasting before restoration','Hand her over permanently to her enemies'],a:2,w:'Hosea 2:14 — "I am now going to allure her; I will lead her into the wilderness and speak tenderly to her" — God pursues the unfaithful with tender love, not permanent rejection.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 OT',ti:'Ezekiel 18 — Individual Repentance',su:'Examine Ezekiel\'s teaching on individual responsibility and repentance.',steps:[
{lb:'Ezekiel 18 — individual accountability',dr:dQ6,ht:'<p>Ezekiel 18 is the OT\'s most explicit statement on individual accountability. Israel was using a proverb: "The parents eat sour grapes, and the children\'s teeth are set on edge" (18:2) — blaming their fathers\' sins for their own punishment. God rejected this: <em>"The one who sins is the one who will die"</em> (18:4). Each person is accountable for their own choices. This was revolutionary — not a denial of generational patterns, but a declaration that each person can choose to repent and live.</p>'},
{lb:'The wicked who repents will live',dr:dQ6,ht:'<p><em>"But if a wicked person turns away from all the sins they have committed and keeps all my decrees and does what is just and right, that person will surely live; they will not die"</em> (18:21). God\'s extraordinary declaration: <em>"Do I take any pleasure in the death of the wicked? declares the Sovereign LORD. Rather, am I not pleased when they turn from their ways and live?"</em> (18:23). And: <em>"Repent! Turn away from all your offences... For I take no pleasure in the death of anyone... Repent and live!"</em> (18:30-32).</p>'},
{lb:'Jeremiah 31:34 — sins remembered no more',dr:dQ7,ht:'<p>Jeremiah 31 contains the promise of the New Covenant: <em>"For I will forgive their wickedness and will remember their sins no more"</em> (31:34). "Remember no more" means God chooses never to act on the memory of forgiven sin — it will not be held against the person, brought up again, or used as a basis for further judgment. Complete forgiveness. This is quoted in Hebrews 8:12 as fulfilled in Christ, but its roots are in God\'s OT declaration of His own character and longing for restored relationship.</p>'},
{lb:'Isaiah 55:6-7 — seek the LORD while He may be found',dr:dQ6,ht:'<p>Isaiah 55:6-7: <em>"Seek the LORD while he may be found; call on him while he is near. Let the wicked forsake their ways and the unrighteous their thoughts. Let them turn to the LORD, and he will have mercy on them, and to our God, for he will freely pardon."</em> Key elements: (1) Urgency — "while he may be found." (2) Action — forsake wicked ways and unrighteous thoughts (both behaviour and mindset). (3) Promise — "he will have mercy... he will freely pardon." Repentance is always followed by free, generous pardon.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'Ezekiel 18:23 says God takes no pleasure in:',o:['The repentance of the wicked, which He finds too easy','The death of the wicked — He is pleased when they turn from sin and live','Excessive sacrifice rituals by the priests','The prayers of those who have committed great sins'],a:2,w:'Ezekiel 18:23 — "Do I take any pleasure in the death of the wicked? declares the Sovereign LORD. Rather, am I not pleased when they turn from their ways and live?" — God wants repentance, not death.'},{q:'Jeremiah 31:34 promises that God will:',o:['Give Israel a new law written on stone tablets','Rebuild the temple with greater glory','Forgive wickedness and remember sins no more','Send a new prophet greater than Moses'],a:3,w:'Jer.31:34 — "I will forgive their wickedness and will remember their sins no more" — complete, permanent forgiveness. God chooses never to act on the memory of forgiven sin again.'},{q:'Isaiah 55:7 commands the wicked to:',o:['Offer double sacrifices for a full year','Forsake their ways and unrighteous thoughts, turn to the LORD who will freely pardon','Fast for 40 days as Moses did','Confess to the priests who will intercede for them'],a:2,w:'Isaiah 55:7 — "Let the wicked forsake their ways and the unrighteous their thoughts. Let them turn to the LORD, and he will have mercy on them, and to our God, for he will freely pardon."'},{q:'The proverb Israel was using in Ezekiel 18:2 was: "The parents eat sour grapes, and the children\'s teeth are set on edge." God rejected this because:',o:['The proverb was about physical health, not spiritual things','It showed disrespect to the parents of Israel','It denied individual accountability — each person is responsible for their own choices','The fathers had not actually sinned in the way Israel claimed'],a:3,w:'Ezekiel 18 — Israel was using the proverb to blame their situation on their fathers rather than taking personal responsibility. God\'s response: "The one who sins is the one who will die" (18:4) — individual accountability.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 OT',ti:'The Day of Atonement — Yom Kippur',su:'Examine the OT system of atonement (Leviticus 16).',steps:[
{lb:'What is atonement?',dr:dQ7,ht:'<p>Atonement means the covering or removal of sin to restore relationship with God. The Hebrew word <em>kaphar</em> (to atone/cover) gives us "Yom Kippur" — the Day of Atonement, the most solemn day in Israel\'s calendar. It occurred on the 10th of Tishri, ten days after the New Year. It was the one day per year when the High Priest could enter the Holy of Holies — the innermost sanctuary where God\'s presence dwelt. Leviticus 16 describes the ceremony in detail.</p>'},
{lb:'The ceremony (Leviticus 16)',dr:dQ8,ht:'<p>The High Priest: (1) Bathed and put on plain white linen garments (humility). (2) Offered a bull as a sin offering for himself and his household. (3) Took two goats: one was killed as a sin offering; the other became the <b>scapegoat</b> (azazel). (4) Entered the Holy of Holies with blood and incense. (5) Sprinkled blood on the mercy seat (atonement cover of the Ark). (6) Laid hands on the scapegoat, confessed all Israel\'s sins over it; the goat was sent into the wilderness, never to return.</p>'},
{lb:'The two goats',dr:dQ7,ht:'<p>The two goats illustrated two aspects of atonement: (1) <b>The slain goat</b> — blood shed as the cost of sin; "without the shedding of blood there is no forgiveness of sins" (Heb.9:22). Sin requires a cost. (2) <b>The scapegoat</b> — carrying the sins away, out of the camp, never to return. Together: sin is dealt with (cost paid) AND removed (taken away). Hebrews 9-10 interprets Christ as both: His death is the payment (slain goat) and the complete removal of sin (scapegoat) — once, not annually.</p>'},
{lb:'Significance',dr:dQ8,ht:'<p>Key significance: (1) Sin is serious — it requires annual national ceremony. (2) Access to God requires atonement — no one could approach without blood. (3) The whole community needed atonement — the scapegoat was national. (4) The High Priest himself needed atonement first — he was not sinless. NT contrast: Christ entered not a human tabernacle but heaven itself, with His own blood, "once for all" (Heb.9:12). The OT ceremony pointed forward to and was fulfilled in Christ\'s atoning work.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'The Hebrew word "kaphar" (the root of Yom Kippur) means:',o:['Shub — to turn and return','Chesed — steadfast love','To cover or atone — giving us Yom Kippur (Day of Atonement)','Mishpat — justice'],a:3,w:'"Kaphar" means to cover or atone. Yom = day; Kippur = atonement/covering. Yom Kippur is the Day of Atonement — the most solemn day in the Jewish calendar.'},{q:'On the Day of Atonement, only the High Priest could enter:',o:['The outer court of the temple','The inner court beyond the bronze altar','The Holy Place beyond the lampstand','The Holy of Holies — only once per year, on Yom Kippur'],a:4,w:'Only the High Priest could enter the Holy of Holies (Lev.16) — and only once per year, on Yom Kippur, with blood and incense. This access required full atonement preparation.'},{q:'The "scapegoat" (azazel) in Leviticus 16 symbolised:',o:['The punishment Israel deserved being passed to their enemies','The complete removal of Israel\'s sins — carried away into the wilderness, never to return','The High Priest\'s sacrifice of his own wealth for the people','The annual killing of Israel\'s enemies as national purification'],a:2,w:'Lev.16:21-22 — the High Priest laid hands on the scapegoat, confessed all Israel\'s sins over it, and it was led into the wilderness — symbolising the REMOVAL of sin from the community.'},{q:'The two goats together on Yom Kippur illustrated that forgiveness involves both:',o:['Individual and corporate dimensions of sin','The king\'s role and the High Priest\'s role in atonement','Payment for sin (slain goat) AND removal of sin (scapegoat)','The old covenant and anticipation of the new covenant'],a:3,w:'The slain goat = COST of sin (blood shed). The scapegoat = REMOVAL of sin (carried away never to return). Together they show two aspects of complete atonement: sin paid for AND taken away.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 OT',ti:'Isaiah 53 — The Suffering Servant',su:'Examine Isaiah 53 as the OT\'s vision of vicarious atonement.',steps:[
{lb:'Isaiah 53 overview',dr:dQ8,ht:'<p>Isaiah 52:13-53:12 is the fourth and greatest Servant Song. A figure suffers vicariously for others — despised and rejected, "a man of suffering, familiar with pain" (53:3). He was pierced for the transgressions of others; crushed for their iniquities. <em>"We all, like sheep, have gone astray... and the LORD has laid on him the iniquity of us all"</em> (53:6). He was led like a lamb to the slaughter (53:7). The NT understands this as prophetically describing Jesus Christ — Philip explained it to the Ethiopian eunuch in Acts 8.</p>'},
{lb:'Key verses of Isaiah 53',dr:dQ8,ht:'<p>Isaiah 53:4-6: <em>"Surely he took up our pain and bore our suffering... he was pierced for our transgressions, he was crushed for our iniquities; the punishment that brought us peace was on him, and by his wounds we are healed. We all, like sheep, have gone astray, each of us has turned to our own way; and the LORD has laid on him the iniquity of us all."</em> Six references to "our" — pain, suffering, transgressions, iniquities, peace, healing — all accomplished through the suffering of one. This is substitutionary atonement in its OT form.</p>'},
{lb:'Isaiah 53 and repentance',dr:dQ7,ht:'<p>Isaiah 53 connects to repentance and forgiveness: (1) It diagnoses the human condition — "we all, like sheep, have gone astray" — the universal need for forgiveness. (2) It shows God\'s initiative — "the LORD has laid on him the iniquity of us all" — God acts to provide forgiveness. (3) It shows the cost of forgiveness — "by his wounds we are healed." (4) It anticipates complete restoration — the servant "will see the light of life and be satisfied" (53:11). Forgiveness in the OT always depends on God\'s own provision.</p>'},
{lb:'NT use of Isaiah 53',dr:dQ8,ht:'<p>Isaiah 53 is one of the most quoted OT passages in the NT: Acts 8:32-33 (Philip and the Ethiopian eunuch). Matthew 8:17 ("he took up our infirmities"). Luke 22:37 ("numbered with the transgressors"). Romans 10:16. 1Peter 2:22-25 ("by his wounds you have been healed"). The NT sees Isaiah 53 as fulfilled in Christ — His suffering is the ultimate provision for the forgiveness that the OT\'s sacrificial system anticipated. OT atonement looked forward; NT declares it accomplished.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'Isaiah 53:6 says: "We all, like sheep, have gone astray... and the LORD has laid on him..."',o:['The responsibility of teaching us God\'s law','The task of building a new kingdom','The iniquity of us all','The glory of His eternal presence'],a:3,w:'Isaiah 53:6 — "the LORD has laid on him the iniquity of us all" — the servant bears the sin of all others, placed there by God. This is the OT\'s most explicit statement of vicarious/substitutionary atonement.'},{q:'Isaiah 53:5 — "by his wounds we are..."',o:['Protected from all future enemies','Declared righteous before God','Healed','Freed from all obligation to the law'],a:3,w:'Isaiah 53:5 — "by his wounds we are healed" — one of the most quoted verses in Scripture. The servant\'s suffering brings healing and forgiveness to others. NT: 1Peter 2:24.'},{q:'Who explained Isaiah 53 to the Ethiopian eunuch (Acts 8)?',o:['Peter, after the Day of Pentecost','The apostle Paul on his first missionary journey','Philip the evangelist, who told him the good news about Jesus from that passage','Stephen, just before his martyrdom'],a:3,w:'Acts 8:26-35 — Philip explained Isaiah 53 to the Ethiopian eunuch who was reading it and asked "Who is the prophet talking about?" Philip "began with that very passage of Scripture and told him the good news about Jesus."'},{q:'Isaiah 53:7 describes the servant as:',o:['A mighty warrior who fights to the end','A wise counsellor who negotiates his release','Led like a lamb to the slaughter, silent before his shearers','A king who reigns from his throne in the midst of suffering'],a:3,w:'Isaiah 53:7 — "He was oppressed and afflicted, yet he did not open his mouth; he was led like a lamb to the slaughter, and as a sheep before its shearers is silent, so he did not open his mouth."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 OT',ti:'WAEC Prep — Repentance and Forgiveness',su:'Practise WAEC-style questions on OT repentance and forgiveness.',steps:[
{lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions on repentance and forgiveness: (1) Define repentance (shub = turn/return; genuine change of direction). (2) Give components (recognition, remorse, confession, restitution, redirection). (3) Discuss key examples (David/Ps.51; Nineveh/Jonah 3; national/2Chr.7:14; Hosea). (4) Explain God\'s character in relation to forgiveness. (5) Apply to Christian life. Common questions: "What is repentance in the OT?" / "Examine the repentance of Nineveh." / "Discuss 2 Chronicles 7:14."</p>'},
{lb:'Key references for WAEC',dr:dQ9,ht:'<p>WAEC reference bank: Psalm 51 ("create in me a pure heart"; "broken and contrite heart"). Joel 2:12-13 ("rend heart not garment"; "gracious and compassionate"). 2 Chr.7:14 (4 conditions; 3 promises). Jonah 3 (Nineveh repented; "even the king"; God relented). Hosea 6:1 ("Come, return to the LORD"). Hosea 6:6 ("mercy not sacrifice"; Jesus quoted twice). Micah 7:19 ("cast sins into depths of sea"). Jer.31:34 ("remember sins no more"). Ezek.18:23,32 ("no pleasure in death"; "Repent and live!"). Isaiah 55:7 ("forsake wicked way; freely pardon"). Isaiah 53 (vicarious suffering; "by his wounds we are healed").</p>'},
{lb:'Key distinctions',dr:dQ2,ht:'<p>WAEC distinctions: Repentance (shub = turn) vs remorse (feeling sorry without changing direction). Individual repentance (Ps.51; Ezek.18) vs national repentance (2Chr.7:14; Jonah 3). Slain goat (cost of sin) vs scapegoat (removal of sin) — Day of Atonement. Hosea 6:6 ("mercy not sacrifice") parallels Amos 5:24, Micah 6:8, Isaiah 58 — the consistent prophetic theme that inner reality matters more than ritual. God forgives completely: "remember no more" (Jer.31:34); "cast into depths of sea" (Mic.7:19).</p>'},
{lb:'Common WAEC mistakes',dr:dQ1,ht:'<p>Avoid: Saying Joel 2:12-13 is from Amos. Attributing "rend your heart not your garment" to Isaiah. Saying Nineveh was in Egypt (it was the Assyrian capital). Confusing the scapegoat (removal of sin) with the slain goat (cost of sin). Saying the High Priest entered the Holy of Holies every day (only once per year). Forgetting Hosea 6:6 is quoted twice by Jesus in Matthew. Not giving chapter references. Always state what God promises to do in response to repentance, not just what people must do.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'The Hebrew word for repentance "shub" primarily means:',o:['To feel deep remorse for past actions','To perform the required sacrifices for sin','To turn or return — a change of direction back to God','To fast and pray until forgiveness is granted'],a:3,w:'"Shub" = to turn or return. Repentance is a U-turn: away from sin and back toward God. It requires actual change of direction, not just emotion or ritual performance.'},{q:'Which verse says God will hear, forgive and heal the land if His people humble themselves, pray, seek His face and turn from wicked ways?',o:['Psalm 51:10','Isaiah 55:7','2 Chronicles 7:14','Joel 2:13'],a:3,w:'2 Chronicles 7:14 — the central OT text on national repentance: four conditions (humble, pray, seek face, turn) and three promises (hear, forgive, heal land).'},{q:'"Rend your heart and not your garments" (Joel 2:13) means:',o:['Tearing clothes in grief is a sin that must be confessed','God desires inward heart-change over outward ritual performance of repentance','Physical acts of mourning are required alongside prayer','Only the High Priest can perform official national repentance'],a:2,w:'Joel 2:13 — the outward sign (tearing garments) is worthless without inward change (broken heart). God wants genuine inner repentance, not dramatic public performance without sincerity.'},{q:'Jeremiah 31:34 says God will:',o:['Give Israel a new set of laws stricter than Moses','Require annual sacrifices to maintain forgiveness','Forgive wickedness and remember sins no more','Send a new prophet greater than Moses'],a:3,w:'Jer.31:34 — "I will forgive their wickedness and will remember their sins no more" — complete, permanent forgiveness: God chooses not to act on the memory of forgiven sin ever again.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 OT',ti:'Mixed Questions — Repentance and Forgiveness',su:'Integrated revision across all CRS-OT-09 topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Repentance (shub = turn): recognition + remorse + confession + restitution + redirection. Key texts: Psalm 51 ("create in me a pure heart"; broken spirit); Joel 2:12-13 (rend heart not garment; gracious and compassionate God); 2Chr.7:14 (humble, pray, seek face, turn; hear, forgive, heal); Jonah 3 (Nineveh; God relented); Hosea 6:1 (return; He will heal); 6:6 (mercy not sacrifice); Ezek.18:23,32 (no pleasure in death; "Repent and live!"); Jer.31:34 (remember sins no more); Is.53 (vicarious atonement; by His wounds we are healed); Mic.7:19 (sins cast into depths of sea).</p>'},
{lb:'God\'s character in forgiveness',dr:dQ10,ht:'<p>God\'s forgiveness is: (1) Eager — "Repent and live!" (Ezek.18:32). (2) Compassionate — "gracious and compassionate, slow to anger" (Joel 2:13; Ex.34:6). (3) Complete — "remember sins no more" (Jer.31:34). (4) Universal — even Nineveh (Jonah 3). (5) Costly — Isaiah 53 shows forgiveness has a price from God\'s side. (6) Restoring — "I will heal their waywardness and love them freely" (Hos.14:4). God is not reluctant to forgive but actively calls: "Return to me" (Mal.3:7).</p>'},
{lb:'Personal and national dimensions',dr:dQ9,ht:'<p>Repentance operates at two levels: Individual — David (Ps.51); Ezekiel 18 (each person responsible for own repentance). National — Nineveh (Jonah 3); Israel (2Chr.7:14; Joel 2; Hosea). Both levels are necessary. The church in Nigeria is called to: (1) Individual repentance — each person\'s own walk with God. (2) Corporate repentance — the faith community leading the nation back. 2Chr.7:14 specifically addresses "my people" — God holds His community responsible for the nation\'s spiritual state.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final revision: Know shub (turn/return). Know Psalm 51 (David; "create in me a pure heart"; Ps.51:17 — broken spirit). Know 2Chr.7:14 (4 conditions; 3 promises). Know Joel 2:13 (rend heart not garment; gracious and compassionate). Know Jonah 3 (Nineveh repented; God relented). Know Hosea 6:1 (return to the LORD). Know 6:6 (mercy not sacrifice — Jesus quoted twice). Know Jer.31:34 (remember sins no more). Know Isaiah 53:6 (we all like sheep; LORD laid our iniquity on him). For essays: define → examples with references → God\'s character → application today.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Psalm 51 was written following which sin of David?',o:['The census that killed 70,000 people','The adultery with Bathsheba and murder of Uriah','His building of the altar at Araunah\'s threshing floor','His flight from his son Absalom'],a:2,w:'Psalm 51\'s heading — "after Nathan the prophet had come to him, after David had committed adultery with Bathsheba" — it is David\'s prayer of repentance following his adultery and murder of Uriah.'},{q:'The book of Jonah teaches about repentance by showing:',o:['Jonah\'s repentance from his fear and depression','Only that God can save prophets from drowning','That even Israel\'s most feared enemy (Nineveh/Assyria) can repent and receive God\'s forgiveness','That repentance must always begin with 40 days of fasting'],a:3,w:'Jonah 3 — Nineveh (capital of Assyria, Israel\'s greatest enemy) repented at Jonah\'s preaching and God forgave them. God\'s willingness to forgive extends beyond Israel to all who genuinely repent.'},{q:'The scapegoat (Leviticus 16) symbolised the:',o:['Cost of sin — blood must be shed for forgiveness','Removal of sin — carried away into the wilderness, never to return','High Priest\'s own sin needing atonement first','People\'s willingness to sacrifice their most valued possession'],a:2,w:'The scapegoat (azazel — Lev.16:21-22) had Israel\'s sins confessed over it and was led into the wilderness — symbolising the complete REMOVAL of sin. The slain goat symbolised the COST.'},{q:'Hosea 6:6 — "I desire mercy (chesed), not sacrifice" — was quoted by Jesus in Matthew:',o:['When he healed on the Sabbath and when he drove out money-changers','When he ate with tax collectors (Matt.9:13) and when disciples ate grain on the Sabbath (Matt.12:7)','When he forgave the adulterous woman and raised Lazarus','When he entered Jerusalem and instituted the Last Supper'],a:2,w:'Jesus quoted Hos.6:6 in Matt.9:13 (eating with tax collectors) and Matt.12:7 (disciples eating grain on the Sabbath) — both times correcting Pharisaic ritual-over-mercy thinking.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
