<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});

var QS=[
{ey:'Q1 \u2022 CRS \u2022 Old Testament',ti:'What is a Covenant?',su:'Define covenant and explain its importance in the Bible.',steps:[
  {lb:'Definition of covenant',dr:dQ1,ht:'<p>A covenant (<em>berith</em> in Hebrew) is a solemn, binding agreement — stronger than a contract because it involves the whole person and is sealed with an oath. Biblical covenants are between God and humans. Key feature: God always initiates the covenant — it is His grace, not human merit, that establishes it. Covenants are the backbone of the entire Bible\'s storyline.</p>'},
  {lb:'Elements of a covenant',dr:dQ1,ht:'<p>Biblical covenants typically include: (1) <b>Parties</b> — God and a person/group. (2) <b>Promise/terms</b> — what God commits to do. (3) <b>Conditions</b> — sometimes conditional (Sinai) sometimes unconditional (Abraham). (4) <b>Sign</b> — a visible reminder (rainbow, circumcision, Sabbath). (5) <b>Oath/seal</b> — makes it binding. God never breaks His covenants (Ps 89:34).</p>'},
  {lb:'Major covenants in the OT',dr:dQ1,ht:'<p>Five major covenants: (1) <b>Noah</b> (Gen 9) — never flood earth again. (2) <b>Abraham</b> (Gen 12, 15, 17) — land, descendants, blessing. (3) <b>Sinai/Moses</b> (Ex 19-20) — law, people, land. (4) <b>Davidic</b> (2 Sam 7) — eternal throne/kingdom. (5) <b>New Covenant</b> (Jer 31:31-34) — law on hearts; fulfilled in Christ. Each covenant builds on and extends the previous ones.</p>'},
  {lb:'God\'s faithfulness to the covenant',dr:dQ1,ht:'<p>Psalm 89:34 — <em>"I will not violate my covenant or alter what my lips have uttered."</em> Even when Israel broke the covenant repeatedly, God remained faithful. Lamentations 3:22-23 — <em>"His compassions never fail; they are new every morning."</em> The covenants show that salvation depends on God\'s faithfulness, not human performance. WAEC often asks about the significance of covenants.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What is the Hebrew word for covenant?',o:['Shalom','Berith','Torah','Hesed'],a:2,w:'Berith is the Hebrew word for covenant — a solemn binding agreement.'},{q:'Who always initiates the biblical covenants?',o:['The people','The priests','God','The prophets'],a:3,w:'God always initiates the covenant — it is His grace, not human merit, that establishes it.'},{q:'Psalm 89:34 says God will never:',o:['Forget His people','Violate His covenant','Punish sin','Allow suffering'],a:2,w:'Psalm 89:34 — "I will not violate my covenant or alter what my lips have uttered."'},{q:'Which of these is NOT a major OT covenant?',o:['Noahic covenant','Abrahamic covenant','Solomonic covenant','Davidic covenant'],a:3,w:'There is no "Solomonic covenant" in Scripture. The five major covenants are: Noah, Abraham, Sinai, Davidic, New Covenant.'},{q:'What is the general term for a solemn, binding agreement stronger than a contract, sealed with an oath?',o:['Covenant','Testament','Decree','Statute'],a:1,w:'A covenant (berith) is a solemn, binding agreement sealed with an oath.'},{q:'According to this lesson, what always precedes a covenant\'s establishment?',o:['Human merit','God\'s initiative and grace','Priestly ritual only','National law'],a:2,w:'God always initiates the covenant — it is His grace, not human merit.'},{q:'Which covenant is described as conditional, depending on Israel\'s obedience?',o:['Noahic','Sinai','Abrahamic','Davidic'],a:2,w:'The Sinai covenant (Ex 19:5) was conditional: "If you obey me fully..."'},{q:'According to this lesson, biblical covenants are described as the ___ of the entire Bible\'s storyline.',o:['backbone','footnote','conclusion','side note'],a:1,w:'Covenants are the backbone of the entire Bible\'s storyline.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Old Testament',ti:'Covenant with Noah',su:'Narrate the covenant with Noah and explain its significance.',steps:[
  {lb:'Background — human wickedness',dr:dQ2,ht:'<p>Genesis 6:5 — <em>"The Lord saw how great the wickedness of the human race had become on the earth, and that every inclination of the thoughts of the human heart was only evil all the time."</em> God was grieved (v6). This shows the seriousness of sin. Yet God found Noah — <em>"a righteous man, blameless among the people of his time"</em> (Gen 6:9) — who <em>"walked faithfully with God."</em></p>'},
  {lb:'The flood',dr:dQ2,ht:'<p>God commanded Noah to build an ark (Gen 6:14) of specific dimensions. Noah, his family, and animals (2 of each unclean, 7 of each clean) entered the ark. Rain fell for 40 days and nights; waters rose for 150 days, covering all mountains. All outside the ark perished. The flood is an act of divine judgment on sin — but the ark is an act of divine grace for Noah\'s family.</p>'},
  {lb:'The covenant',dr:dQ2,ht:'<p>Genesis 9:8-17 — After the flood, God established His covenant with Noah and <em>"every living creature."</em> The promise: <em>"Never again will I destroy all life"</em> by a flood (v11). The sign: the <b>rainbow</b> in the clouds (v13) — a visible reminder of God\'s promise. This is the first explicit covenant in Scripture. It is unconditional — not dependent on Noah\'s continued obedience.</p>'},
  {lb:'Significance',dr:dQ2,ht:'<p>The Noahic covenant teaches: (1) God judges sin seriously. (2) God shows grace to the righteous (Noah). (3) God keeps His promises — the rainbow still reminds us today. (4) It is a <em>universal</em> covenant — for all humanity and creation. (5) It establishes the pattern: God initiates, provides a sign, makes an unconditional promise. WAEC often asks students to narrate this and draw lessons.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What was the sign of God\'s covenant with Noah?',o:['A burning bush','Circumcision','The rainbow','The Sabbath'],a:3,w:'Genesis 9:13 — God placed the rainbow in the clouds as the sign of the covenant.'},{q:'How long did it rain during the flood?',o:['7 days','40 days and nights','100 days','150 days'],a:2,w:'Genesis 7:12 — rain fell for 40 days and 40 nights.'},{q:'Genesis 6:9 describes Noah as:',o:['A prophet and priest','Righteous and blameless, who walked with God','The first king of Israel','A mighty warrior'],a:2,w:'Genesis 6:9 — "Noah was a righteous man, blameless among the people of his time, and he walked faithfully with God."'},{q:'What was unique about the Noahic covenant?',o:['It only applied to Israel','It required circumcision','It was universal — for all humanity and creation','It was broken by Noah'],a:3,w:'The Noahic covenant (Gen 9:9-10) was made with Noah, his descendants, AND every living creature — universal scope.'},{q:'What did God say about human wickedness before the flood (Genesis 6:5)?',o:['Humanity was mostly good','Every inclination of the heart was only evil continually','Only a few people sinned','Wickedness was limited to one nation'],a:2,w:'Genesis 6:5 — every inclination of the human heart was only evil all the time.'},{q:'How many of each clean animal did Noah bring onto the ark?',o:['Two','Seven','Twelve','Forty'],a:2,w:'Genesis 7:2 — seven pairs of every kind of clean animal.'},{q:'How long did the floodwaters remain, covering the mountains?',o:['40 days','100 days','150 days','One year'],a:3,w:'Genesis 7:24 — the waters flooded the earth for 150 days.'},{q:'What kind of covenant was the Noahic covenant, regarding its conditions?',o:['Conditional on obedience','Unconditional','Temporary','National only'],a:2,w:'The Noahic covenant was unconditional — not dependent on Noah\'s continued obedience.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Old Testament',ti:'Covenant with Abraham',su:'Describe God\'s covenant with Abraham and its three promises.',steps:[
  {lb:'The call of Abraham',dr:dQ3,ht:'<p>Genesis 12:1-3 — God called Abram (later Abraham) out of Ur of the Chaldeans: <em>"Go from your country, your people and your father\'s household to the land I will show you."</em> Three promises: (1) I will make you a great nation. (2) I will bless you and make your name great. (3) All peoples on earth will be blessed through you. Abraham obeyed — by faith, not knowing where he was going (Heb 11:8).</p>'},
  {lb:'The covenant ceremony (Genesis 15)',dr:dQ3,ht:'<p>God confirmed the covenant with a solemn ceremony: Abraham prepared animals and cut them in two. Usually both parties walked between the pieces, binding themselves. But only God (as a smoking firepot and flaming torch) passed through — meaning <em>God alone</em> bound Himself to the promise. Abraham was asleep! This shows the covenant is unconditional — God\'s promise, not Abraham\'s performance.</p>'},
  {lb:'Circumcision as sign (Genesis 17)',dr:dQ3,ht:'<p>Genesis 17 — God appeared to 99-year-old Abram, renamed him <b>Abraham</b> ("father of many nations") and confirmed the covenant. The sign: <b>circumcision</b> of every male on the 8th day. This permanent physical mark identified covenant membership. Sarah was renamed (v15) and promised a son — Isaac. Despite their old age, Abraham believed God (Gen 15:6 — <em>"credited to him as righteousness"</em>).</p>'},
  {lb:'Testing of Abraham (Genesis 22)',dr:dQ3,ht:'<p>God tested Abraham: <em>"Take your son, your only son Isaac, and offer him."</em> Abraham obeyed. At the last moment, the angel stopped him: <em>"Now I know that you fear God"</em> (v12). God provided a ram. The place was named <em>Jehovah-Jireh</em> — "the Lord will provide." God reconfirmed the covenant (v16-18). This foreshadows God providing His own Son as the ultimate sacrifice.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'What were the three promises in Genesis 12:1-3?',o:['Wealth, health, long life','Nation, blessing, blessing to all peoples','Land, law, priesthood','Throne, kingdom, peace'],a:2,w:'Genesis 12:2-3: great nation, personal blessing, and blessing to all peoples on earth.'},{q:'What was the sign of the Abrahamic covenant?',o:['The rainbow','The Sabbath','Circumcision','Baptism'],a:3,w:'Genesis 17:10-11 — circumcision was the sign of the covenant with Abraham.'},{q:'What does the name "Abraham" mean?',o:['Father of one son','Father of many nations','Father of Israel','Blessed by God'],a:2,w:'Genesis 17:5 — "No longer will you be called Abram; your name will be Abraham, for I have made you a father of many nations."'},{q:'What name did Abraham give the place where God provided the ram?',o:['Jehovah-Shalom','Jehovah-Jireh','Jehovah-Nissi','Bethel'],a:2,w:'Genesis 22:14 — Abraham called that place "The Lord Will Provide" (Jehovah-Jireh).'},{q:'In Genesis 15, who alone passed between the pieces of the sacrificed animals?',o:['Abraham alone','God alone','Both Abraham and God','Sarah'],a:2,w:'Only God (as a smoking firepot and flaming torch) passed through — He alone bound Himself to the promise.'},{q:'What did God rename Sarai to, in Genesis 17?',o:['Sarah','Rebekah','Rachel','Leah'],a:1,w:'Genesis 17:15 — Sarai was renamed Sarah.'},{q:'According to Genesis 15:6, what was credited to Abraham as righteousness?',o:['His obedience to the law','His faith','His wealth','His circumcision'],a:2,w:'Genesis 15:6 — Abraham believed the Lord, and it was credited to him as righteousness.'},{q:'In Genesis 22, what stopped Abraham from sacrificing Isaac?',o:['Sarah\'s plea','The angel of the Lord','Isaac\'s cries','A storm'],a:2,w:'Genesis 22:11-12 — the angel of the Lord stopped Abraham at the last moment.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Old Testament',ti:'Covenant at Sinai',su:'Describe the Sinai covenant and the Ten Commandments.',steps:[
  {lb:'Context — after the Exodus',dr:dQ4,ht:'<p>After delivering Israel from Egypt (Exodus 14), God led them to Mount Sinai. Exodus 19:4-6 — God reminded them: <em>"I carried you on eagles\' wings and brought you to myself."</em> He offered a covenant: <em>"If you obey me fully and keep my covenant, then out of all nations you will be my treasured possession... a kingdom of priests and a holy nation."</em> The people agreed: "We will do everything the Lord has said."</p>'},
  {lb:'The Ten Commandments (Exodus 20)',dr:dQ4,ht:'<p>God gave the Ten Commandments amid thunder, lightning and smoke on Sinai. Duties to God (1-4): No other gods; no idols; not misuse God\'s name; keep the Sabbath. Duties to neighbour (5-10): Honour parents; do not murder; do not commit adultery; do not steal; do not give false testimony; do not covet. These commandments remain the foundation of moral law for Jews and Christians.</p>'},
  {lb:'The blood of the covenant',dr:dQ4,ht:'<p>Exodus 24:3-8 — Moses read the Book of the Covenant to the people; they responded: <em>"We will do everything the Lord has said; we will obey."</em> Moses built an altar, offered sacrifices, and sprinkled blood on both the altar and the people: <em>"This is the blood of the covenant that the Lord has made with you."</em> Blood seals the covenant — later echoed at the Last Supper (Matthew 26:28).</p>'},
  {lb:'Israel breaks the covenant',dr:dQ4,ht:'<p>While Moses was on the mountain (40 days), the people made a golden calf (Exodus 32) — breaking the covenant immediately. Moses smashed the tablets. God threatened to destroy Israel but Moses interceded. God renewed the covenant (Ex 34). This pattern — Israel\'s unfaithfulness, God\'s judgment, Moses\' intercession, God\'s renewal — recurs throughout the OT. It shows both human weakness and God\'s persistent grace.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'Exodus 19:6 describes Israel as "a kingdom of priests and a..."',o:['Chosen race','Holy nation','Righteous people','Blessed community'],a:2,w:'Exodus 19:6 — "a kingdom of priests and a holy nation."'},{q:'How many commandments concern duties to God?',o:['3','4','5','6'],a:2,w:'The first four commandments (Ex 20:1-11) concern duties to God: no other gods, no idols, misuse of name, Sabbath.'},{q:'What did Moses sprinkle on the people in Exodus 24?',o:['Water','Oil','Wine','Blood of the covenant'],a:4,w:'Exodus 24:8 — "Moses took the blood, sprinkled it on the people and said, This is the blood of the covenant."'},{q:'What did Israel do while Moses was on Sinai for 40 days?',o:['Built the tabernacle','Prayed and fasted','Made a golden calf','Fought the Amalekites'],a:3,w:'Exodus 32 — the people made a golden calf while Moses was on the mountain — immediately breaking the covenant.'},{q:'What promise did God remind Israel of before offering the Sinai covenant (Exodus 19:4)?',o:['He carried them on eagles\' wings','He gave them a king','He built them a temple','He sent them manna only'],a:1,w:'Exodus 19:4 — "I carried you on eagles\' wings and brought you to myself."'},{q:'What did the people say in response to hearing the covenant terms (Exodus 19:8)?',o:['"We refuse"','"We will do everything the Lord has said"','"Let Moses decide"','"We need more time"'],a:2,w:'Exodus 19:8 — "We will do everything the Lord has said."'},{q:'Who interceded for Israel after the golden calf incident?',o:['Aaron','Moses','Joshua','Caleb'],a:2,w:'Exodus 32:11-14 — Moses interceded, and God relented from destroying Israel.'},{q:'What document did Moses read to the people before they responded in Exodus 24?',o:['The Ten Commandments only','The Book of the Covenant','The Torah scroll','The Psalms'],a:2,w:'Exodus 24:7 — Moses read the Book of the Covenant to the people.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Old Testament',ti:'Significance of the Covenants',su:'Explain the importance of the covenants for Israel and for Christians today.',steps:[
  {lb:'The covenants show God\'s grace',dr:dQ5,ht:'<p>All God\'s covenants are initiated by God — not earned by human achievement. With Noah: God chose a righteous man and saved him. With Abraham: God called an ordinary man and made extraordinary promises. At Sinai: God rescued Israel from slavery before giving the law — salvation came before the commandments. God\'s covenants reveal His character: gracious, faithful, committed to His people.</p>'},
  {lb:'The covenants are progressive',dr:dQ5,ht:'<p>Each covenant builds on the previous: Noah (all humanity) → Abraham (one family) → Sinai (one nation) → Davidic (one king/throne) → New Covenant (all nations again). The story moves from universal to particular and back to universal. God narrows the focus to Abraham\'s family in order to bring blessing to all nations (Gen 12:3) — fulfilled in Jesus, descended from Abraham and David.</p>'},
  {lb:'The New Covenant (Jeremiah 31:31-34)',dr:dQ5,ht:'<p>Jeremiah 31:31-34 — <em>"The days are coming when I will make a new covenant with the people of Israel... I will put my law in their minds and write it on their hearts."</em> Unlike the Sinai covenant (broken by Israel), the New Covenant is internal — transforming the heart. Three promises: personal knowledge of God, forgiveness of sins, law written on hearts. Christians believe this is fulfilled through Christ and the Holy Spirit.</p>'},
  {lb:'Lessons from the covenants',dr:dQ5,ht:'<p>Key lessons: (1) God keeps His promises — He is faithful even when we are not. (2) Covenants are about relationship — "I will be your God and you will be my people." (3) Every covenant points to Christ — He is the fulfillment of all God\'s covenant promises (2 Cor 1:20). (4) Christians are part of the covenant community through faith in Christ (Gal 3:29). (5) We have covenant responsibilities — to love God and neighbour.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'Jeremiah 31:31-34 promises a new covenant with the law written:',o:['On stone tablets','On scrolls in the temple','On hearts and minds','On the doorposts of houses'],a:3,w:'Jeremiah 31:33 — "I will put my law in their minds and write it on their hearts."'},{q:'What is the direction of the covenants from Noah to the New Covenant?',o:['Universal to particular to universal again','Particular to universal','Universal only','Particular only'],a:1,w:'Noah (all humanity) → Abraham (one family) → Sinai (one nation) → New Covenant (all nations) — universal to particular and back.'},{q:'2 Corinthians 1:20 says all God\'s promises are "Yes" in:',o:['Moses','Abraham','David','Christ'],a:4,w:'2 Corinthians 1:20 — "For no matter how many promises God has made, they are \'Yes\' in Christ."'},{q:'Which covenant was conditional — depending on Israel\'s obedience?',o:['Noahic covenant','Abrahamic covenant','Sinai covenant','Davidic covenant'],a:3,w:'The Sinai covenant (Ex 19:5) was conditional: "If you obey fully..." — unlike the unconditional Abrahamic covenant.'},{q:'What preceded the giving of the law at Sinai, showing salvation before obedience?',o:['The building of the temple','God\'s rescue of Israel from slavery','The giving of manna only','The crossing of the Jordan'],a:2,w:'God rescued Israel from Egypt before giving the law — salvation came before the commandments.'},{q:'Which covenant is described as bringing blessing to "all peoples on earth"?',o:['Noahic','Abrahamic','Sinai','Davidic'],a:2,w:'Genesis 12:3 — through Abraham, all peoples on earth would be blessed.'},{q:'According to Galatians 3:29, how do Christians become part of the covenant people?',o:['Through circumcision','Through faith in Christ','Through keeping the Ten Commandments only','Through Jewish ancestry'],a:2,w:'Galatians 3:29 — those who belong to Christ are Abraham\'s seed and heirs of the promise.'},{q:'Which is NOT one of the three New Covenant promises highlighted in Jeremiah 31?',o:['Personal knowledge of God','Forgiveness of sins','Law written on hearts','A physical temple rebuilt'],a:4,w:'Jeremiah 31:31-34 promises knowledge of God, forgiveness of sins, and law on the heart — not a rebuilt temple.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 Old Testament',ti:'The Davidic Covenant',su:'Explain God\'s covenant with David and its significance.',steps:[
  {lb:'God\'s promise to David',dr:dQ6,ht:'<p>2 Samuel 7:8-16 — David wanted to build a temple for God. God\'s response: <em>you</em> will not build me a house — I will build <em>you</em> a house (dynasty). The Davidic covenant: (1) David\'s son will build the temple. (2) God will be a father to him. (3) <em>"Your house and your kingdom shall endure forever before me; your throne shall be established forever."</em> (v16). This is an unconditional, eternal promise.</p>'},
  {lb:'Fulfillment in Solomon',dr:dQ6,ht:'<p>Solomon, David\'s son, built the magnificent temple in Jerusalem (1 Kings 6-8). At its dedication (1 Kings 8:22-53), Solomon prayed, acknowledging God\'s faithfulness. The temple became the centre of Israel\'s worship. However, Solomon later turned to idolatry (1 Kings 11) — showing the covenant\'s partial fulfillment awaited a greater Son of David.</p>'},
  {lb:'The messianic hope',dr:dQ6,ht:'<p>After the kingdom divided and Jerusalem fell (586 BC), the Davidic throne seemed to end. Yet the prophets maintained hope of a coming Messiah (anointed king) from David\'s line. Isaiah 9:7 — <em>"Of the greatness of his government and peace there will be no end. He will reign on David\'s throne... forever."</em> Christians believe this is fulfilled in Jesus — called "Son of David" (Matthew 1:1) throughout the NT.</p>'},
  {lb:'Significance',dr:dQ6,ht:'<p>The Davidic covenant shows: (1) God is faithful — He honours His promises even across centuries. (2) Leadership is a gift from God — David was chosen by God (1 Sam 16:7 — God looks at the heart). (3) The covenant points forward to Christ — the eternal King on David\'s throne. (4) The model of a servant-king — David is described as a man after God\'s own heart (Acts 13:22) despite his failures.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What did David want to build for God in 2 Samuel 7?',o:['An altar','A temple (house)','A city','A monument'],a:2,w:'David wanted to build a temple (house) for God — but God said Solomon would build it instead.'},{q:'2 Samuel 7:16 promises David\'s throne will last:',o:['100 years','Until the exile','Forever','Until Solomon'],a:4,w:'2 Samuel 7:16 — "Your house and your kingdom shall endure forever before me; your throne shall be established forever."'},{q:'Which New Testament book opens by calling Jesus "the Son of David"?',o:['Mark','Luke','John','Matthew'],a:4,w:'Matthew 1:1 — "This is the genealogy of Jesus the Messiah the son of David, the son of Abraham."'},{q:'Acts 13:22 describes David as:',o:['A perfect king without sin','A man after God\'s own heart','The greatest prophet','The builder of the temple'],a:2,w:'Acts 13:22 — "I have found David son of Jesse, a man after my own heart; he will do everything I want him to do."'},{q:'Who actually built the temple, fulfilling part of the Davidic covenant?',o:['David','Solomon','Samuel','Nathan'],a:2,w:'1 Kings 6 — Solomon, David\'s son, built the temple.'},{q:'What happened to Solomon later in his reign, according to 1 Kings 11?',o:['He built more temples','He turned to idolatry','He conquered Egypt','He wrote the Psalms'],a:2,w:'1 Kings 11 — Solomon\'s foreign wives turned his heart to other gods.'},{q:'According to Isaiah 9:7, whose reign and government will have no end?',o:['Solomon\'s','The Messiah\'s','Cyrus\'s','Nebuchadnezzar\'s'],a:2,w:'Isaiah 9:7 — the coming Messiah\'s government and peace will have no end, reigning on David\'s throne forever.'},{q:'Why was David chosen by God, according to 1 Samuel 16:7?',o:['Because of his height','Because God looks at the heart','Because he was the eldest son','Because of his wealth'],a:2,w:'1 Samuel 16:7 — the Lord looks at the heart, not outward appearance.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 Old Testament',ti:'Covenant Signs and Their Meaning',su:'Explain the significance of covenant signs: rainbow, circumcision, Sabbath.',steps:[
  {lb:'The rainbow — Noahic covenant',dr:dQ7,ht:'<p>Genesis 9:12-17 — God said: <em>"I have set my rainbow in the clouds, and it will be the sign of the covenant between me and the earth."</em> The rainbow appears after rain — a reminder that judgment ended and God\'s promise holds. God Himself will see the rainbow and remember (v16). Signs serve as visible reminders of invisible promises. WAEC often asks: "What was the sign of God\'s covenant with Noah?"</p>'},
  {lb:'Circumcision — Abrahamic covenant',dr:dQ7,ht:'<p>Genesis 17:10-11 — <em>"Every male among you shall be circumcised... and it will be the sign of the covenant between me and you."</em> To be performed on the 8th day. Circumcision was a permanent, physical mark of covenant membership. Those not circumcised were "cut off" (v14). Paul later explains (Rom 4:11) that circumcision was a seal of the righteousness Abraham had by faith — the outward sign of an inward reality.</p>'},
  {lb:'The Sabbath — Sinai covenant',dr:dQ7,ht:'<p>Exodus 31:13 — <em>"You must observe my Sabbaths. This will be a sign between me and you for the generations to come."</em> Resting on the 7th day (Saturday) marked Israel as God\'s covenant people — distinct from surrounding nations. The Sabbath recalled both creation (God rested on day 7) and redemption (Deut 5:15 — remember you were slaves in Egypt). Christians moved worship to Sunday (resurrection day).</p>'},
  {lb:'The Lord\'s Supper — New Covenant sign',dr:dQ7,ht:'<p>Luke 22:20 — Jesus at the Last Supper: <em>"This cup is the new covenant in my blood, which is poured out for you."</em> The Lord\'s Supper (Communion) is the sign of the New Covenant — bread (body) and cup (blood) recall Christ\'s sacrifice. Like all covenant signs, it is a visible reminder of an invisible reality: forgiveness of sins and membership in God\'s family. Christians celebrate it regularly to "proclaim the Lord\'s death until he comes" (1 Cor 11:26).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What was the sign of the Noahic covenant?',o:['Circumcision','The Sabbath','The rainbow','Baptism'],a:3,w:'Genesis 9:13 — God placed the rainbow as the sign of the covenant with Noah.'},{q:'On which day was circumcision to be performed according to Genesis 17?',o:['The 1st day','The 3rd day','The 7th day','The 8th day'],a:4,w:'Genesis 17:12 — "Every male among you who is eight days old must be circumcised."'},{q:'Exodus 31:13 says the Sabbath is a sign between God and Israel for:',o:['40 years','One generation','The generations to come','The priests only'],a:3,w:'Exodus 31:13 — "This will be a sign between me and you for the generations to come."'},{q:'Jesus said "This cup is the new covenant in..." — how does He complete this?',o:['My name','My love','My blood','My power'],a:3,w:'Luke 22:20 — "This cup is the new covenant in my blood, which is poured out for you."'},{q:'According to Romans 4:11, what did circumcision seal for Abraham?',o:['His wealth','The righteousness he had by faith','His authority as a father','His marriage to Sarah'],a:2,w:'Romans 4:11 — circumcision was a seal of the righteousness Abraham had by faith.'},{q:'What does the Sabbath recall, according to Deuteronomy 5:15?',o:['Creation only','That Israel were once slaves in Egypt','The giving of manna','The battle of Jericho'],a:2,w:'Deuteronomy 5:15 links the Sabbath to remembering deliverance from slavery in Egypt.'},{q:'To which day did Christians move their regular day of worship, connected to the resurrection?',o:['Friday','Saturday','Sunday','Monday'],a:3,w:'Christians moved worship to Sunday, the day of Christ\'s resurrection.'},{q:'According to 1 Corinthians 11:26, what does taking the Lord\'s Supper proclaim?',o:['The Lord\'s birth','The Lord\'s death until He comes','The exodus from Egypt','The giving of the law'],a:2,w:'1 Corinthians 11:26 — communion proclaims the Lord\'s death until He comes.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 Old Testament',ti:'Israel\'s Response to the Covenant',su:'Describe how Israel kept and broke the covenant, and God\'s response.',steps:[
  {lb:'Initial faithfulness',dr:dQ8,ht:'<p>At Sinai, Israel responded enthusiastically: Exodus 19:8 — <em>"We will do everything the Lord has said."</em> Under Joshua, the people served the Lord (Joshua 24:31). During David\'s reign, Israel largely followed God. These periods show that covenant faithfulness is possible and brings blessing (Deut 28:1-14 — blessings for obedience). Israel\'s best moments came when leaders led them back to God.</p>'},
  {lb:'Repeated unfaithfulness',dr:dQ8,ht:'<p>The cycle of the book of Judges: Faithfulness → Idolatry → Oppression → Crying to God → Deliverance → Peace → Faithfulness (and repeat). Israel consistently chased other gods (Baal, Asherah). Kings like Ahab, Manasseh led Israel into deep apostasy. The prophets (Amos, Hosea, Jeremiah) repeatedly called Israel back — warning of judgment. Covenant breaking has consequences.</p>'},
  {lb:'The exile — judgment for covenant-breaking',dr:dQ8,ht:'<p>Deuteronomy 28:15-68 warned of curses for disobedience — including exile. This came true: Israel (northern kingdom) fell to Assyria (722 BC); Judah (southern kingdom) fell to Babylon (586 BC); Jerusalem and the temple were destroyed. Yet even in exile, God maintained a remnant and promised restoration. Lamentations 3:22-23 — <em>"His compassions never fail; they are new every morning."</em></p>'},
  {lb:'God\'s persistent covenant love (Hesed)',dr:dQ8,ht:'<p><em>Hesed</em> — the Hebrew word for God\'s covenant love/faithfulness. Translated "steadfast love" or "lovingkindness." Appears over 240 times in the OT. Even when Israel broke the covenant, God\'s hesed remained. Hosea 2:14-23 — God wooed unfaithful Israel back like a husband pursuing his wife. God\'s covenant love is persistent, faithful and undeserved — it drives the whole biblical story.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'The book of Judges shows a repeated cycle. What comes AFTER Israel\'s idolatry?',o:['Immediate blessing','God abandons them forever','Oppression and then crying to God','A new covenant'],a:3,w:'The Judges cycle: Faithfulness→Idolatry→Oppression→Crying to God→Deliverance→Peace (repeat).'},{q:'When did the northern kingdom of Israel fall to Assyria?',o:['586 BC','722 BC','605 BC','931 BC'],a:2,w:'722 BC — Israel (northern kingdom) fell to Assyria; Judah fell to Babylon in 586 BC.'},{q:'What is the Hebrew word for God\'s covenant love/faithfulness?',o:['Shalom','Torah','Hesed','Emet'],a:3,w:'Hesed — steadfast love/lovingkindness — appears over 240 times in the OT, describing God\'s faithful covenant love.'},{q:'Lamentations 3:22-23 says God\'s compassions are new every:',o:['Year','Month','Week','Morning'],a:4,w:'Lamentations 3:22-23 — "His compassions never fail; they are new every morning; great is your faithfulness."'},{q:'Under whose leadership did Israel serve the Lord faithfully, according to Joshua 24:31?',o:['Moses','Joshua','Samuel','Saul'],a:2,w:'Joshua 24:31 — Israel served the Lord throughout Joshua\'s lifetime and that of the elders who outlived him.'},{q:'Which two kings led Israel into deep apostasy, according to this lesson?',o:['David and Solomon','Ahab and Manasseh','Saul and Ahab','Hezekiah and Josiah'],a:2,w:'Kings like Ahab and Manasseh led Israel into deep apostasy through idol worship.'},{q:'In which year did Judah (the southern kingdom) fall to Babylon?',o:['722 BC','605 BC','586 BC','931 BC'],a:3,w:'586 BC — Judah fell to Babylon; Jerusalem and the temple were destroyed.'},{q:'According to Hosea 2:14-23, how is God\'s persistent love for unfaithful Israel described?',o:['Like a king punishing subjects','Like a husband pursuing his wife','Like a judge condemning criminals','Like a stranger passing by'],a:2,w:'Hosea 2:14-23 — God pursues unfaithful Israel like a husband wooing back his wife.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 Old Testament',ti:'WAEC Exam Preparation — The Covenant',su:'Practise WAEC-style questions on the covenant.',steps:[
  {lb:'WAEC essay structure for covenant',dr:dQ9,ht:'<p>For WAEC questions on the covenant: (1) Define covenant. (2) Name the specific covenant asked about. (3) Give the background/context. (4) Describe the terms and sign. (5) State the significance. (6) Draw lessons. Typical questions: "Describe the covenant God made with Abraham and state its significance." "What lessons can Christians learn from the Sinai covenant?"</p>'},
  {lb:'Comparing the covenants',dr:dQ1,ht:'<p>Know these comparisons: Noah — unconditional, universal, rainbow. Abraham — unconditional, personal/national, circumcision. Sinai — conditional, national, Sabbath. Davidic — unconditional, royal/messianic, throne. New Covenant — unconditional, universal, Lord\'s Supper/Holy Spirit. WAEC may ask you to compare two covenants — know what makes each distinct.</p>'},
  {lb:'Key vocabulary for essays',dr:dQ9,ht:'<p>Terms to use in WAEC essays: <b>Covenant</b> (berith), <b>Hesed</b> (steadfast love), <b>Ex nihilo</b>, <b>Conditional/unconditional</b>, <b>Sign</b> (visible reminder), <b>Parties</b>, <b>Oath</b>, <b>Ratification</b> (sealing the covenant — blood, animals), <b>Apostasy</b> (turning away from God), <b>Remnant</b> (those who remain faithful), <b>Restoration</b> (God bringing Israel back after exile).</p>'},
  {lb:'Lessons from the covenants',dr:dQ9,ht:'<p>Standard WAEC lessons from covenants: (1) God is faithful and keeps His promises. (2) Sin has consequences — covenant-breaking leads to judgment. (3) God\'s grace is greater than human failure — He restores. (4) Covenant membership requires faithfulness and obedience. (5) God\'s love (hesed) is persistent and unconditional. (6) The covenants point forward to Christ — the fulfillment of all God\'s promises.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'Which covenant had circumcision as its sign?',o:['Noahic','Sinai','Abrahamic','Davidic'],a:3,w:'Genesis 17:10-11 — circumcision was the sign of the Abrahamic covenant.'},{q:'What is "hesed"?',o:['The Hebrew word for law','God\'s covenant love and faithfulness','The sign of the covenant','The name of the temple'],a:2,w:'Hesed is the Hebrew word for God\'s steadfast covenant love — appearing over 240 times in the OT.'},{q:'The Sinai covenant was CONDITIONAL — what does this mean?',o:['God may break it','It depends on Israel\'s obedience','Only priests could enter it','It lasted only 40 years'],a:2,w:'Exodus 19:5 — "If you obey me fully and keep my covenant..." — conditional on Israel\'s faithfulness.'},{q:'What does "apostasy" mean?',o:['Faithful obedience','Turning away from God','A type of offering','A covenant ceremony'],a:2,w:'Apostasy means turning away from or abandoning God — what Israel repeatedly did throughout the OT.'},{q:'According to the WAEC essay structure given, what should come right after defining "covenant"?',o:['Naming the specific covenant asked about','Giving a conclusion','Listing all covenants','Describing the temple'],a:1,w:'After defining the term, name the specific covenant the question asks about.'},{q:'Which covenant\'s sign was the Sabbath?',o:['Noahic','Sinai','Abrahamic','Davidic'],a:2,w:'Exodus 31:13 — the Sabbath was the sign of the Sinai covenant.'},{q:'What does "ratification" mean, as used in these WAEC vocabulary notes?',o:['Breaking the covenant','Sealing the covenant with blood or animals','Renaming a person','Reading the covenant aloud'],a:2,w:'Ratification means sealing/confirming the covenant, often through blood or sacrificed animals.'},{q:'What does "remnant" mean in this context?',o:['Those who remain faithful to God','Foreign invaders','The priestly class only','Broken covenant fragments'],a:1,w:'Remnant refers to those who remain faithful to God, even after Israel\'s widespread unfaithfulness.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 Old Testament',ti:'Mixed Questions — The Covenant',su:'Integrated revision across all aspects of the covenant.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Noahic (Gen 9): never flood again; rainbow. Abrahamic (Gen 12/15/17): land, descendants, blessing; circumcision. Sinaitic (Ex 19-20): law, people; Ten Commandments; conditional; Sabbath. Davidic (2 Sam 7): eternal throne; messianic. New Covenant (Jer 31): law on hearts; fulfilled in Christ. All show: God initiates, God is faithful, God\'s grace exceeds human failure.</p>'},
  {lb:'Key references',dr:dQ1,ht:'<p>Must-know references: Gen 9:11-13 (Noahic/rainbow), Gen 12:1-3 (Abraham\'s call), Gen 15 (covenant ceremony), Gen 17:10-11 (circumcision), Gen 22:14 (Jehovah-Jireh), Ex 19:5-6 (Sinai terms), Ex 20:1-17 (Ten Commandments), Ex 24:8 (blood of covenant), 2 Sam 7:16 (David\'s throne forever), Jer 31:31-34 (New Covenant), Lam 3:22-23 (hesed), 2 Cor 1:20 (all promises in Christ).</p>'},
  {lb:'Lessons for Christians',dr:dQ10,ht:'<p>The covenants teach Christians: (1) We belong to God by covenant — through Christ we are adopted into His family (Gal 3:29). (2) We can trust God\'s promises — His track record of faithfulness spans millennia. (3) Covenant brings responsibility — love God, love neighbour, live holy lives. (4) When we fail, God restores — His hesed never ends. (5) The Lord\'s Supper is our covenant sign — a reminder of belonging.</p>'},
  {lb:'WAEC tips',dr:dQ9,ht:'<p>For the exam: Never confuse the signs — rainbow (Noah), circumcision (Abraham), Sabbath (Sinai). Know which covenants are conditional (Sinai) and which are unconditional (Noah, Abraham, Davidic, New). Always quote references: "As stated in Genesis 9:13..." Give at least 3 lessons in every answer. Conclude with relevance to Christians today — WAEC examiners want application, not just facts.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Match: "Never destroy earth by flood" — which covenant?',o:['Abrahamic','Sinai','Noahic','Davidic'],a:3,w:'Genesis 9:11 — "Never again will all life be destroyed by the waters of a flood" — Noahic covenant.'},{q:'Jeremiah 31:33 says God will write His law on:',o:['Stone tablets','Scrolls','Hearts and minds','The temple walls'],a:3,w:'Jeremiah 31:33 — "I will put my law in their minds and write it on their hearts."'},{q:'Which covenant promised an eternal throne/dynasty?',o:['Noahic','Abrahamic','Sinai','Davidic'],a:4,w:'2 Samuel 7:16 — "Your house and your kingdom shall endure forever" — the Davidic covenant.'},{q:'What does 2 Corinthians 1:20 say about God\'s covenant promises?',o:['They all failed in the exile','They are fulfilled in Moses','They are "Yes" in Christ','They require human effort'],a:3,w:'2 Corinthians 1:20 — "For no matter how many promises God has made, they are \'Yes\' in Christ."'},{q:'Which reference records God\'s call of Abraham out of Ur?',o:['Genesis 9:11-13','Genesis 12:1-3','Exodus 19:5-6','Jeremiah 31:31-34'],a:2,w:'Genesis 12:1-3 records God\'s call and promises to Abraham.'},{q:'Which reference records the blood of the covenant being sprinkled on the people?',o:['Genesis 17:10-11','Exodus 20:1-17','Exodus 24:8','2 Samuel 7:16'],a:3,w:'Exodus 24:8 — Moses sprinkled the blood of the covenant on the people.'},{q:'According to this summary, what do all the covenants show about God?',o:['That He is distant and uninvolved','That He initiates, is faithful, and His grace exceeds human failure','That He punishes without mercy','That covenants depend entirely on human effort'],a:2,w:'All the covenants show God initiating, remaining faithful, and His grace exceeding human failure.'},{q:'According to Galatians 3:29, through whom are Christians adopted into God\'s covenant family?',o:['Through Moses','Through Abraham directly','Through Christ','Through the priesthood'],a:3,w:'Galatians 3:29 — those who belong to Christ are Abraham\'s seed, heirs according to promise.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
