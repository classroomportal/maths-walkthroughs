.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}

.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';

function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){

  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'

document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){

ill","A rejection of any submission at all"],"a":1,"w":"This conclusion models perfect submission to the Father's will despite immense personal cost."},{"q":"What did Jesus find His disciples doing when He returned, according to Matthew 26:40?","o":["Fleeing the garden in fear","Praying fervently alongside Him","Sleeping","Arguing about who was greatest"],"a":2,"w":"Jesus found His disciples sleeping when He returned (Matthew 26:40)."},{"q":"What question did Jesus ask His sleeping disciples, in Matthew 26:40?","o":["\"Why did you not warn me of danger?\"","\"Why have you left me completely alone?\"","\"Do you understand what is about to happen?\"","\"Could you not keep watch with me for one hour?\""],"a":3,"w":"Jesus asked, \"Could you not keep watch with me for one hour?\" (Matthew 26:40)."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:"Forgiveness for His executioners",dr:dQ2,ht:"<p>Jesus prayed, <em>\"Father, forgive them, for they do not know what they are doing\"</em> (Luke 23:34) &mdash; extending forgiveness even to those directly responsible for His death.</p>"},
{lb:"Today in paradise",dr:dQ2,ht:"<p>To the repentant criminal beside Him, Jesus promised, <em>\"today you will be with me in paradise\"</em> (Luke 23:43) &mdash; offering immediate salvation to a dying sinner who believed.</p>"},
{lb:"Why have you forsaken me",dr:dQ2,ht:"<p>Jesus cried out, <em>\"My God, my God, why have you forsaken me?\"</em> (Matthew 27:46), quoting Psalm 22 &mdash; expressing the profound spiritual weight of bearing the sin of the world.</p>"},
{lb:"It is finished",dr:dQ2,ht:"<p>Jesus's final words, <em>\"It is finished\"</em> (John 19:30), declare that the work of redemption was <b>completed</b> &mdash; not a cry of defeat, but of triumphant accomplishment.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What did Jesus pray regarding those crucifying Him, in Luke 23:34?","o":["\"Father, forgive them, for they do not know what they are doing\"","\"Father, condemn them for their cruelty\"","\"Father, let them suffer as I suffer\"","Nothing at all — He remained silent"],"a":0,"w":"Jesus prayed, \"Father, forgive them, for they do not know what they are doing\" (Luke 23:34)."},{"q":"What does this prayer of forgiveness demonstrate, according to this lesson?","o":["A refusal to forgive under any circumstances","Forgiveness extended even to those directly responsible for His death","Anger toward His executioners","Indifference to the act of crucifixion"],"a":1,"w":"This prayer demonstrates forgiveness extended even to those directly responsible for His death."},{"q":"What did Jesus promise the repentant criminal beside Him, in Luke 23:43?","o":["\"Your sins are too great to forgive\"","\"You must wait many years for salvation\"","\"Today you will be with me in paradise\"","\"I cannot help you at this time\""],"a":2,"w":"Jesus promised, \"Today you will be with me in paradise\" (Luke 23:43)."},{"q":"What does this promise to the criminal show about salvation, according to this lesson?","o":["Salvation is never offered to criminals","Salvation always requires years of good works first","Only the original apostles could receive salvation","Immediate salvation is offered to a dying sinner who believed"],"a":3,"w":"This promise shows immediate salvation offered to a dying sinner who believed."},{"q":"What did Jesus cry out in Matthew 27:46?","o":["\"My God, my God, why have you forsaken me?\"","\"Father, I am at complete peace\"","\"This suffering means nothing to me\"","\"I have failed in my mission\""],"a":0,"w":"Jesus cried out, \"My God, my God, why have you forsaken me?\" (Matthew 27:46)."},{"q":"Which Old Testament passage does this cry quote?","o":["Psalm 23","Psalm 22","Isaiah 53","Genesis 3"],"a":1,"w":"This cry quotes Psalm 22."},{"q":"What does this cry express, according to this lesson?","o":["Doubt about His own identity","Simple physical pain with no deeper meaning","The profound spiritual weight of bearing the sin of the world","Anger toward His disciples"],"a":2,"w":"This cry expresses the profound spiritual weight of bearing the sin of the world, according to this lesson."},{"q":"What did Jesus's final words, \"It is finished,\" declare, according to John 19:30?","o":["Nothing of any theological significance","His mission had failed entirely","More suffering was still required","The work of redemption was completed"],"a":3,"w":"\"It is finished\" declares the work of redemption was completed, according to John 19:30."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q5 \u2022 CRS \u2022 Gospels",ti:"The Death and Burial of Jesus",su:"Explain the events surrounding Jesus\u2019s death and burial.",steps:[
{lb:"The temple curtain torn",dr:dQ1,ht:"<p>At the moment of Jesus's death, <em>\"the curtain of the temple was torn in two from top to bottom\"</em> (Matthew 27:51) &mdash; symbolising open access to God, no longer restricted by the temple barrier.</p>"},
{lb:"A centurion's confession",dr:dQ1,ht:"<p>Witnessing these events, the Roman centurion overseeing the crucifixion declared, <em>\"Surely he was the Son of God!\"</em> (Matthew 27:54) &mdash; even a Gentile soldier recognised Jesus's true identity.</p>"},
{lb:"Joseph of Arimathea",dr:dQ1,ht:"<p><b>Joseph of Arimathea</b>, a wealthy member of the Jewish council and secret follower of Jesus, requested Jesus's body from Pilate and buried it in his own new tomb (Matthew 27:57-60).</p>"},
{lb:"A sealed and guarded tomb",dr:dQ1,ht:"<p>At the request of the chief priests, Pilate ordered the tomb to be <b>sealed</b> and a guard posted, to prevent any claim that the disciples had stolen the body (Matthew 27:62-66).</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What happened to the temple curtain at the moment of Jesus's death, according to Matthew 27:51?","o":["It was torn in two from top to bottom","It remained completely unchanged","It was removed by the priests beforehand","It caught fire and was destroyed"],"a":0,"w":"Matthew 27:51 says the temple curtain was torn in two from top to bottom."},{"q":"What does the tearing of the temple curtain symbolise, according to this lesson?","o":["The complete destruction of the temple itself","Open access to God, no longer restricted by the temple barrier","A sign of God's anger with no further meaning","The end of all future worship"],"a":1,"w":"The tearing of the curtain symbolises open access to God, no longer restricted by the temple barrier."},{"q":"What did the Roman centurion declare after witnessing Jesus's death, in Matthew 27:54?","o":["\"Nothing unusual has happened here\"","\"This man deserved his punishment\"","\"Surely he was the Son of God!\"","\"This man was merely a criminal\""],"a":2,"w":"The centurion declared, \"Surely he was the Son of God!\" (Matthew 27:54)."},{"q":"What does this lesson say is significant about who made this confession?","o":["Only the disciples made such confessions","Only Jewish leaders ever recognised Jesus","No one present recognised Jesus's identity","A Gentile soldier recognised Jesus's true identity"],"a":3,"w":"This lesson notes that even a Gentile soldier recognised Jesus's true identity."},{"q":"Who requested Jesus's body from Pilate for burial?","o":["Joseph of Arimathea","Nicodemus alone","Pontius Pilate himself","The Roman centurion"],"a":0,"w":"Joseph of Arimathea requested Jesus's body from Pilate for burial."},{"q":"What was Joseph of Arimathea's status, according to Matthew 27:57?","o":["A poor beggar with no social standing","A wealthy member of the Jewish council and secret follower of Jesus","A Roman soldier stationed in Jerusalem","A member of Jesus's immediate family"],"a":1,"w":"Joseph of Arimathea was a wealthy member of the Jewish council and secret follower of Jesus."},{"q":"Where did Joseph of Arimathea bury Jesus's body?","o":["In the temple courtyard","In a public burial ground","In his own new tomb","In the wilderness"],"a":2,"w":"Joseph of Arimathea buried Jesus's body in his own new tomb."},{"q":"Why did the chief priests request that the tomb be sealed and guarded?","o":["To prepare for a public celebration","To honour Jesus with additional ceremony","To allow easier access for mourners","To prevent any claim that the disciples had stolen the body"],"a":3,"w":"The chief priests requested the tomb be sealed and guarded to prevent claims of a stolen body (Matt 27:62-66)."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q6 \u2022 CRS \u2022 Gospels",ti:"The Resurrection",su:"Explain the biblical accounts of Jesus\u2019s resurrection and its significance.",steps:[
{lb:"An empty tomb",dr:dQ2,ht:"<p>On the first day of the week, the women who came to the tomb found the stone rolled away and the tomb <b>empty</b>, with an angel announcing, <em>\"He is not here; he has risen!\"</em> (Luke 24:1-6).</p>"},
{lb:"Appearances to witnesses",dr:dQ2,ht:"<p>The risen Jesus appeared to <b>Mary Magdalene</b>, the disciples, and over five hundred people at once (1 Corinthians 15:6), providing multiple, verifiable eyewitness accounts of His resurrection.</p>"},
{lb:"Thomas's doubt resolved",dr:dQ2,ht:"<p>When Thomas doubted, Jesus invited him to touch His wounds, prompting Thomas's confession, <em>\"My Lord and my God!\"</em> (John 20:28) &mdash; direct physical evidence overcame his initial disbelief.</p>"},
{lb:"The centrality of the resurrection",dr:dQ2,ht:"<p>Paul writes, <em>\"if Christ has not been raised, your faith is futile\"</em> (1 Corinthians 15:17) &mdash; the resurrection is not a secondary detail, but the very foundation of Christian hope and faith.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What did the women find at the tomb, according to Luke 24:1-3?","o":["The stone rolled away and the tomb empty","Jesus's body still lying inside","A group of Roman guards blocking the entrance","Nothing unusual at all"],"a":0,"w":"Luke 24:1-3 says the women found the stone rolled away and the tomb empty."},{"q":"What did the angel announce to the women at the tomb, in Luke 24:6?","o":["\"His body has been stolen\"","\"He is not here; he has risen!\"","\"He will rise again in three days' time\"","\"You must not enter this tomb\""],"a":1,"w":"The angel announced, \"He is not here; he has risen!\" (Luke 24:6)."},{"q":"To whom did the risen Jesus first appear, according to the Gospel accounts?","o":["Pontius Pilate","Peter alone","Mary Magdalene","The Roman centurion"],"a":2,"w":"The risen Jesus first appeared to Mary Magdalene, according to the Gospel accounts."},{"q":"According to 1 Corinthians 15:6, to how many people did Jesus appear at once?","o":["A single unnamed witness","Only three","Only the twelve apostles","Over five hundred"],"a":3,"w":"1 Corinthians 15:6 says Jesus appeared to over five hundred people at once."},{"q":"What did Thomas require before he would believe in the resurrection, according to John 20?","o":["To touch Jesus's wounds","To hear a voice from heaven","To see an angel personally","To read a written account"],"a":0,"w":"Thomas required touching Jesus's wounds before he would believe, according to John 20."},{"q":"What did Thomas confess after this evidence, in John 20:28?","o":["\"I still do not believe\"","\"My Lord and my God!\"","\"This must be an illusion\"","\"I will tell no one what I have seen\""],"a":1,"w":"Thomas confessed, \"My Lord and my God!\" in John 20:28."},{"q":"What does Paul say happens to faith if Christ has not been raised, in 1 Corinthians 15:17?","o":["Faith becomes stronger regardless","Faith remains entirely unaffected","Faith is futile","Faith transforms into a different religion"],"a":2,"w":"Paul says faith is futile if Christ has not been raised (1 Corinthians 15:17)."},{"q":"What does this lesson say about the resurrection's place in Christian belief?","o":["It applies only to the original disciples' faith","It is a minor, secondary detail","It has no real theological importance","It is the very foundation of Christian hope and faith"],"a":3,"w":"This lesson describes the resurrection as the very foundation of Christian hope and faith."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q7 \u2022 CRS \u2022 Gospels",ti:"The Meaning of Christ\u2019s Death: Atonement",su:"Explain the theological significance of Christ\u2019s death as an atoning sacrifice.",steps:[
{lb:"A ransom for many",dr:dQ1,ht:"<p>Jesus said He came <em>\"to give his life as a ransom for many\"</em> (Mark 10:45) &mdash; His death paid the price to free humanity from bondage to sin.</p>"},
{lb:"Pierced for our transgressions",dr:dQ1,ht:"<p>Isaiah 53:5 prophesied, <em>\"he was pierced for our transgressions, he was crushed for our iniquities\"</em> &mdash; Christ suffered substitutionally, bearing the penalty that sinners deserved.</p>"},
{lb:"Reconciliation with God",dr:dQ1,ht:"<p>2 Corinthians 5:19 explains, <em>\"God was reconciling the world to himself in Christ, not counting people's sins against them\"</em> &mdash; the cross restores the broken relationship between God and humanity.</p>"},
{lb:"The Lamb of God",dr:dQ1,ht:"<p>John the Baptist declared, <em>\"Look, the Lamb of God, who takes away the sin of the world!\"</em> (John 1:29) &mdash; identifying Jesus with the sacrificial system, fulfilling and completing it once for all.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What did Jesus say His life would be given as, in Mark 10:45?","o":["A ransom for many","A reward for the faithful only","A temporary sacrifice with no lasting effect","A demonstration of power"],"a":0,"w":"Jesus said His life would be given as a ransom for many (Mark 10:45)."},{"q":"What does this ransom accomplish, according to this lesson?","o":["It has no real spiritual effect","It pays the price to free humanity from bondage to sin","It only benefits the original twelve disciples","It applies only to future generations"],"a":1,"w":"This ransom pays the price to free humanity from bondage to sin, according to this lesson."},{"q":"What does Isaiah 53:5 prophesy about the coming Messiah?","o":["He would suffer only for His own sins","He would avoid all suffering entirely","He was pierced for our transgressions and crushed for our iniquities","He would never actually die"],"a":2,"w":"Isaiah 53:5 prophesies He was pierced for our transgressions and crushed for our iniquities."},{"q":"What kind of suffering does this lesson say Christ experienced, based on Isaiah 53?","o":["No real suffering at all","Suffering entirely unrelated to human sin","Suffering only as an example, with no substitutionary effect","Substitutionary suffering, bearing the penalty sinners deserved"],"a":3,"w":"Christ experienced substitutionary suffering, bearing the penalty sinners deserved, according to this lesson."},{"q":"What does 2 Corinthians 5:19 say God was doing in Christ?","o":["Reconciling the world to himself, not counting sins against them","Condemning the world with no possibility of reconciliation","Ignoring the reality of human sin entirely","Reconciling only a select few individuals"],"a":0,"w":"2 Corinthians 5:19 says God was reconciling the world to himself in Christ."},{"q":"What does the cross restore, according to 2 Corinthians 5:19?","o":["Only political peace between nations","The broken relationship between God and humanity","Only physical health for believers","Nothing of lasting spiritual significance"],"a":1,"w":"The cross restores the broken relationship between God and humanity, according to 2 Corinthians 5:19."},{"q":"What did John the Baptist call Jesus, in John 1:29?","o":["\"A king with no spiritual significance\"","\"A prophet like Moses, and nothing more\"","\"The Lamb of God, who takes away the sin of the world\"","\"An ordinary teacher of the law\""],"a":2,"w":"John the Baptist called Jesus \"the Lamb of God, who takes away the sin of the world\" (John 1:29)."},{"q":"What does this title connect Jesus to, according to this lesson?","o":["Nothing of theological significance","A completely unrelated pagan ritual","Only the Passover meal, with no wider connection","The Old Testament sacrificial system, which He fulfils and completes"],"a":3,"w":"This title connects Jesus to the Old Testament sacrificial system, which He fulfils and completes."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q8 \u2022 CRS \u2022 Gospels",ti:"The Significance of the Resurrection for Believers",su:"Explain how Christ\u2019s resurrection shapes Christian hope and daily living.",steps:[
{lb:"Victory over death",dr:dQ2,ht:"<p>Paul declares, <em>\"Death has been swallowed up in victory... where, O death, is your sting?\"</em> (1 Corinthians 15:54-55) &mdash; the resurrection breaks death's ultimate power over believers.</p>"},
{lb:"A living hope",dr:dQ2,ht:"<p>1 Peter 1:3 speaks of being <em>\"born again into a living hope through the resurrection of Jesus Christ from the dead\"</em> &mdash; the resurrection grounds Christian hope in a historical, verifiable event.</p>"},
{lb:"New life now",dr:dQ2,ht:"<p>Romans 6:4 teaches that believers are <b>\"raised... to live a new life\"</b> even now &mdash; the resurrection is not only a future hope, but a present power for transformed living.</p>"},
{lb:"Guarantee of future resurrection",dr:dQ2,ht:"<p>1 Corinthians 15:20 calls Christ <em>\"the firstfruits of those who have fallen asleep\"</em> &mdash; His resurrection guarantees believers' own future bodily resurrection.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Paul declare about death, in 1 Corinthians 15:54-55?","o":["\"Death has been swallowed up in victory\"","\"Death remains entirely unconquered\"","\"Death is stronger than the resurrection\"","\"Death has no relevance to faith\""],"a":0,"w":"Paul declares, \"Death has been swallowed up in victory\" (1 Corinthians 15:54-55)."},{"q":"What does the resurrection break, according to this lesson?","o":["Only physical illness, not death itself","Death's ultimate power over believers","Nothing of lasting significance","Only the power of the Roman Empire"],"a":1,"w":"The resurrection breaks death's ultimate power over believers, according to this lesson."},{"q":"What does 1 Peter 1:3 say believers are born again into?","o":["A hope based only on human effort","A cycle of endless despair","A living hope through the resurrection of Jesus Christ","A hope with no historical grounding"],"a":2,"w":"1 Peter 1:3 says believers are born again into a living hope through Christ's resurrection."},{"q":"What does this lesson say grounds Christian hope, based on 1 Peter 1:3?","o":["Only future promises with no present reality","A vague, unproven feeling","A myth with no basis in fact","A historical, verifiable event"],"a":3,"w":"This lesson says Christian hope is grounded in a historical, verifiable event."},{"q":"What does Romans 6:4 say believers are raised to do, even now?","o":["Live a new life","Wait passively for the future resurrection","Continue in their old way of life unchanged","Avoid any real transformation"],"a":0,"w":"Romans 6:4 says believers are raised to live a new life, even now."},{"q":"What does this lesson say the resurrection provides, beyond a future hope?","o":["Only a distant future benefit, with no present relevance","A present power for transformed living","No practical effect on daily life","A reason to avoid engaging with daily responsibilities"],"a":1,"w":"This lesson says the resurrection provides a present power for transformed living, beyond a future hope."},{"q":"What title does 1 Corinthians 15:20 give Christ, in relation to those who have died?","o":["\"An exception, unrelated to human death\"","\"The last of those who have fallen asleep\"","\"The firstfruits of those who have fallen asleep\"","\"A distant memory with no present significance\""],"a":2,"w":"1 Corinthians 15:20 calls Christ \"the firstfruits of those who have fallen asleep.\""},{"q":"What does this title guarantee for believers, according to this lesson?","o":["An uncertain and unclear future","Only a spiritual, non-bodily existence after death","Nothing beyond Christ's own personal resurrection","Their own future bodily resurrection"],"a":3,"w":"This title guarantees believers' own future bodily resurrection, according to this lesson."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q9 \u2022 CRS \u2022 Gospels",ti:"WAEC Exam Preparation \u2014 Passion of Christ",su:"Practise WAEC-style questions on the passion, death and resurrection of Christ.",steps:[
{lb:"WAEC essay structure",dr:dQ1,ht:"<p>For WAEC essays on the Passion: (1) Identify the <b>specific event or theme</b>. (2) Give the <b>precise reference</b>. (3) Explain the event <b>clearly</b>. (4) Draw out its <b>theological or practical significance</b>.</p>"},
{lb:"Common WAEC question patterns",dr:dQ1,ht:"<p>Common patterns include: \"Explain the events of the Last Supper.\" / \"Discuss Jesus's agony in Gethsemane.\" / \"What is the significance of Christ's death as an atoning sacrifice?\" / \"Explain the evidence for the resurrection.\"</p>"},
{lb:"Key references to remember",dr:dQ1,ht:"<p>Key references: <b>Luke 22:19-20</b> (Last Supper); <b>Matthew 26:36-46</b> (Gethsemane); <b>Luke 23:33-46</b> (crucifixion); <b>Matthew 27:51-54</b> (curtain torn, centurion); <b>Luke 24:1-6</b> (empty tomb); <b>Mark 10:45 / Isaiah 53:5</b> (atonement).</p>"},
{lb:"Connecting to practical faith",dr:dQ1,ht:"<p>WAEC essays should always connect these events to <b>practical Christian faith today</b> &mdash; forgiveness, hope, and new life &mdash; rather than treating them only as historical narrative.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on the Passion of Christ?","o":["Identify the specific event or theme asked about","Give a personal opinion with no facts","List unrelated facts","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on the Passion should begin by identifying the specific event or theme asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe Nigeria's vegetation zones.\"","\"Discuss Jesus's agony in Gethsemane.\"","\"Define an exothermic reaction.\"","\"List West African rivers.\""],"a":1,"w":"\"Discuss Jesus's agony in Gethsemane\" is a typical WAEC-style question on this topic."},{"q":"Which passage should be cited when discussing the Last Supper?","o":["Luke 24:1-6","Matthew 27:51-54","Luke 22:19-20","1 Corinthians 15:17"],"a":2,"w":"Luke 22:19-20 should be cited when discussing the Last Supper."},{"q":"Which passage should be cited when discussing Jesus's submission to the Father's will?","o":["Romans 6:4","John 1:29","Isaiah 53:5","Matthew 26:36-46 (Gethsemane)"],"a":3,"w":"Matthew 26:36-46, Gethsemane, should be cited when discussing Jesus's submission to the Father's will."},{"q":"Which passage should be cited when discussing evidence for the resurrection?","o":["Luke 24:1-6 and John 20:24-28","Matthew 26:39","Luke 22:19-20","Mark 10:45"],"a":0,"w":"Luke 24:1-6 and John 20:24-28 should be cited when discussing evidence for the resurrection."},{"q":"Which passage should be cited when discussing the meaning of Christ's death as atonement?","o":["Luke 23:33","Mark 10:45 and Isaiah 53:5","Matthew 27:57-60","John 20:28"],"a":1,"w":"Mark 10:45 and Isaiah 53:5 should be cited when discussing the atonement."},{"q":"Which passage should be cited when discussing symbolic events at Jesus's death?","o":["1 Corinthians 15:6","Luke 22:7-13","Matthew 27:51-54 (the torn curtain, the centurion)","John 1:29"],"a":2,"w":"Matthew 27:51-54, the torn curtain and the centurion, should be cited when discussing symbolic events at Jesus's death."},{"q":"Why should WAEC essays connect the Passion to practical Christian faith today?","o":["WAEC forbids discussing theological application","Practical application is irrelevant to WAEC marking","Only historical narrative should be discussed","It shows the events remain relevant to real Christian life, not just history"],"a":3,"w":"Connecting to practical faith shows the events remain relevant to real Christian life, which WAEC rewards."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q10 \u2022 CRS \u2022 Gospels",ti:"Mixed Questions \u2014 Passion of Christ",su:"Integrated revision across the Last Supper, Gethsemane, crucifixion and resurrection.",steps:[
{lb:"Summary of key themes",dr:dQ2,ht:"<p>The Passion of Christ moves from the Last Supper's institution of the new covenant, through Gethsemane's submission, the crucifixion's atoning sacrifice, to the resurrection's triumphant victory over sin and death.</p>"},
{lb:"Key references to remember",dr:dQ2,ht:"<p>Must-know facts: <b>Luke 22:19-20</b> (Last Supper); <b>Matthew 26:36-46</b> (Gethsemane); <b>Luke 23:33-46</b> (crucifixion); <b>Matthew 27:51-54</b> (torn curtain, centurion); <b>Luke 24:1-6</b> (empty tomb); <b>Mark 10:45</b> (ransom).</p>"},
{lb:"Lessons for today",dr:dQ2,ht:"<p>These events call believers to remember Christ's sacrifice, trust His atoning death for forgiveness, and live in the hope and power of His resurrection.</p>"},
{lb:"Final exam tips",dr:dQ2,ht:"<p>Always give the <b>precise reference</b>, explain the event <b>clearly and accurately</b>, and conclude by connecting the passage to Christian faith and practice today.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What did Jesus say about the bread at the Last Supper, in Luke 22:19?","o":["\"This is my body given for you; do this in remembrance of me\"","\"This bread represents the law of Moses\"","\"This bread has no particular significance\"","\"This bread must never be eaten again\""],"a":0,"w":"Jesus said, \"This is my body given for you; do this in remembrance of me\" (Luke 22:19)."},{"q":"What did Jesus pray in Gethsemane, according to Matthew 26:39?","o":["\"My will alone must prevail\"","\"Yet not as I will, but as you will\"","\"I refuse to accept your will\"","\"There is no will to submit to\""],"a":1,"w":"Jesus prayed, \"Yet not as I will, but as you will\" (Matthew 26:39)."},{"q":"Who did the crowd choose to release instead of Jesus?","o":["A Pharisee","A Roman soldier","Barabbas, a criminal","John the Baptist"],"a":2,"w":"The crowd chose to release Barabbas, a criminal, instead of Jesus."},{"q":"What did the Roman centurion declare after witnessing Jesus's death?","o":["\"This man was merely a criminal\"","\"This man deserved his punishment\"","\"Nothing unusual has happened here\"","\"Surely he was the Son of God!\""],"a":3,"w":"The centurion declared, \"Surely he was the Son of God!\" (Matthew 27:54)."},{"q":"What did the angel announce to the women at the empty tomb?","o":["\"He is not here; he has risen!\"","\"His body has been stolen\"","\"He will rise again in three days' time\"","\"You must not enter this tomb\""],"a":0,"w":"The angel announced, \"He is not here; he has risen!\" (Luke 24:6)."},{"q":"What did Jesus say His life would be given as, in Mark 10:45?","o":["A reward for the faithful only","A ransom for many","A temporary sacrifice with no lasting effect","A demonstration of power"],"a":1,"w":"Jesus said His life would be given as a ransom for many (Mark 10:45)."},{"q":"What did Thomas confess after touching Jesus's wounds, in John 20:28?","o":["\"This must be an illusion\"","\"I still do not believe\"","\"My Lord and my God!\"","\"I will tell no one what I have seen\""],"a":2,"w":"Thomas confessed, \"My Lord and my God!\" in John 20:28."},{"q":"What overall lesson unites the themes studied in this topic?","o":["These events are purely symbolic with no historical basis","The Passion narrative has no real theological significance","Only the crucifixion matters, with no need for the resurrection","Christ's sacrificial death and victorious resurrection form the foundation of Christian faith and hope"],"a":3,"w":"The unifying lesson is that Christ's sacrificial death and victorious resurrection form the foundation of Christian faith and hope."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
