<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}

function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Christian Service',ACC,13,'middle',true));

s.innerHTML=o.join('');}

o.push(T(240,20,'Models and References',ACC,12,'middle',true));
[['Mark 10:45','Son of Man came to serve, not be served'],['John 13',"Jesus washes disciples' feet — the example"],['Philippians 2:6-9',"Christ's self-emptying humility"],['Matthew 25:31-46','Sheep and goats — the least of these'],['Matthew 25:14-30','Parable of the Talents — faithfulness']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});

o.push(T(240,20,'Christian Service — Summary',ACC,13,'middle',true));
[['Mark 10:45',"Service defines Jesus's mission"],['John 13','Foot-washing — the model of service'],['Philippians 2:3-9','Humility as the foundation of service'],['Gal 6:2 / James 1:27','Serving the church community'],['Matthew 25:31-46','Serving the wider world'],['Col 3:23-24 / Matt 6:1-4','Right motivation — for God, not praise'],['Matthew 25:14-30','Faithfulness — the Parable of the Talents']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS • Acts & Epistles',ti:'The Meaning of Christian Service',su:'Define Christian service and explain Jesus\'s own understanding of His mission as service.',steps:[
{lb:'What is Christian service?',dr:dQ1,ht:'<p><b>Christian service</b> means using one\'s time, gifts and resources to meet others\' needs, following Christ\'s own example, and motivated by <b>love</b> rather than obligation or personal gain.</p>'},
{lb:'Jesus\'s own mission statement',dr:dQ1,ht:'<p>In <b>Mark 10:45</b>, Jesus declares, <em>"For even the Son of Man did not come to be served, but to serve, and to give his life as a ransom for many"</em> &mdash; defining His entire mission in terms of service.</p>'},
{lb:'Contrast with worldly leadership',dr:dQ1,ht:'<p>Mark 10:42-44 contrasts Gentile rulers, who <b>"lord it over"</b> their subjects, with Jesus\'s followers, for whom true <b>greatness comes through serving</b> others, not exercising power over them.</p>'},
{lb:'Service as core identity, not an extra',dr:dQ1,ht:'<p>This teaching establishes service not as an optional activity for especially devoted believers, but as a <b>core part of Christian identity</b> for every follower of Christ.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Christian service primarily mean, according to this lesson?","o":["Using one's time, gifts and resources to meet others' needs","Only attending church services regularly","Only giving money to charity","Only praying for oneself"],"a":0,"w":"Christian service means using one's time, gifts and resources to meet others' needs."},{"q":"What motivation should underlie genuine Christian service, according to this lesson?","o":["Only fear of punishment","Love, rather than obligation or personal gain","Only the desire for public recognition","Only financial reward"],"a":1,"w":"Genuine Christian service should be motivated by love, not obligation or personal gain."},{"q":"Which verse contains Jesus's statement that He came \"not to be served, but to serve\"?","o":["Philippians 2:5","John 13:1","Mark 10:45","Matthew 25:31"],"a":2,"w":"Mark 10:45 contains Jesus's statement that He came not to be served, but to serve."},{"q":"What does Jesus say His life would be given as, according to Mark 10:45?","o":["A temporary sacrifice with no lasting effect","A reward for the faithful only","A demonstration of power over others","A ransom for many"],"a":3,"w":"Jesus says His life would be given as a ransom for many, according to Mark 10:45."},{"q":"How does Mark 10:42-44 describe Gentile rulers' approach to leadership?","o":["They \"lord it over\" their subjects","They always serve their subjects humbly","They have no authority over anyone","They refuse all forms of leadership"],"a":0,"w":"Mark 10:42-44 describes Gentile rulers as \"lording it over\" their subjects."},{"q":"According to Jesus's teaching, how is true greatness achieved among His followers?","o":["Through exercising power over others","Through serving others","Through accumulating wealth","Through avoiding all responsibility"],"a":1,"w":"True greatness among Jesus's followers is achieved through serving others."},{"q":"How does this lesson describe the place of service in Christian identity?","o":["A task reserved only for church leaders","An optional activity only for especially devoted believers","A core part of Christian identity for every follower of Christ","An activity with no real spiritual significance"],"a":2,"w":"Service is described as a core part of Christian identity for every follower of Christ."},{"q":"What overall pattern does Jesus's teaching in Mark 10:42-45 establish?","o":["Christian leadership requires no service at all","Power over others is the goal of Christian leadership","Service is only relevant for the poor and marginalised","Service, not power, defines true Christian greatness"],"a":3,"w":"This teaching establishes that service, not power, defines true Christian greatness."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS • Acts & Epistles',ti:'Jesus as the Model Servant',su:'Explain the significance of Jesus washing His disciples\' feet in John 13.',steps:[
{lb:'A servant\'s task',dr:dQ2,ht:'<p>At the Last Supper, Jesus took on the role of the <b>lowest household servant</b>, washing His disciples\' dirty feet (John 13:1-5) &mdash; a task so menial that even Jewish slaves were not typically required to perform it for others.</p>'},
{lb:'Peter\'s resistance',dr:dQ2,ht:'<p><b>Peter initially resisted</b>, saying, "You shall never wash my feet," uncomfortable seeing his Lord perform such a lowly task; Jesus responded that unless He washed him, Peter would have <b>no part with Him</b> (John 13:6-8).</p>'},
{lb:'"I have set you an example"',dr:dQ2,ht:'<p>After washing their feet, Jesus explicitly explained His action: <em>"I have set you an example that you should do as I have done for you"</em> (John 13:14-15) &mdash; establishing this act as a deliberate model for His followers.</p>'},
{lb:'Ultimate humility: Philippians 2',dr:dQ2,ht:'<p>Philippians 2:5-8 describes an even greater act of humble service: Christ, existing in God\'s very nature, <b>"emptied himself,"</b> took the nature of a servant, and humbled himself to death on a cross.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What menial task did Jesus perform for His disciples at the Last Supper?","o":["Washing their feet","Cooking their meal","Cleaning their clothes","Carrying their belongings"],"a":0,"w":"Jesus washed His disciples' feet at the Last Supper."},{"q":"Why was foot-washing considered such a lowly task?","o":["It was considered an honourable task for guests of honour","It was typically performed only by the lowest household servants","It was a task performed only by religious priests","It had no particular social significance at all"],"a":1,"w":"Foot-washing was typically performed only by the lowest household servants, making it a lowly task."},{"q":"How did Peter initially respond to Jesus washing his feet?","o":["He left the room in anger","He immediately welcomed the gesture with joy","He resisted, saying \"You shall never wash my feet\"","He asked Jesus to wash his whole body instead"],"a":2,"w":"Peter initially resisted, saying \"You shall never wash my feet.\""},{"q":"What did Jesus say would happen if Peter refused to let Him wash his feet?","o":["Peter would need to wash Jesus's feet instead","Nothing significant would happen at all","Peter would be immediately excluded from the twelve apostles","Peter would have no part with Jesus"],"a":3,"w":"Jesus said Peter would have no part with Him if he refused the foot-washing."},{"q":"What did Jesus explicitly say about His action, according to John 13:14-15?","o":["\"I have set you an example that you should do as I have done for you\"","\"This action has no lasting significance\"","\"Only I may ever perform this task\"","\"This was merely a cultural custom with no spiritual meaning\""],"a":0,"w":"Jesus said, \"I have set you an example that you should do as I have done for you.\""},{"q":"What does Philippians 2:7 say Christ did, in taking on human form?","o":["Retained all His divine glory with no change at all","\"Emptied himself\" and took the nature of a servant","Refused to take on any human characteristics","Became a servant only temporarily, with no lasting significance"],"a":1,"w":"Philippians 2:7 says Christ \"emptied himself\" and took the nature of a servant."},{"q":"According to Philippians 2:8, to what extent did Christ humble himself?","o":["Only during His earthly ministry, with no ultimate sacrifice","Only to a minor inconvenience","To death on a cross","He did not actually humble himself at all"],"a":2,"w":"Philippians 2:8 says Christ humbled himself to the point of death on a cross."},{"q":"What overall lesson does John 13 and Philippians 2 together teach about service?","o":["Service has no connection to genuine humility","Service should always be performed by others, never by leaders","Only ordinary believers, never Christ Himself, model true service","Genuine service may require setting aside status and comfort for others' sake"],"a":3,"w":"Together these passages teach that genuine service may require setting aside status and comfort for others' sake."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS • Acts & Epistles',ti:'Serving with Humility',su:'Explain Paul\'s teaching on humility as the foundation of Christian service in Philippians 2.',steps:[
{lb:'Valuing others above oneself',dr:dQ1,ht:'<p><b>Philippians 2:3-4</b> instructs believers to do nothing out of selfish ambition, but in humility to <b>"value others above yourselves,"</b> looking not only to one\'s own interests, but also to the interests of others.</p>'},
{lb:'The mind of Christ',dr:dQ1,ht:'<p>Philippians 2:5 calls believers to have <b>"the same mindset as Christ Jesus"</b> &mdash; presenting Christ\'s own humility, described in the verses that follow, as the pattern for all Christian humility and service.</p>'},
{lb:'Christ\'s self-emptying',dr:dQ1,ht:'<p>Philippians 2:6-7 describes how Christ, though existing in the very <b>nature of God</b>, did not consider equality with God something to be used to His own advantage, but instead took the very nature of a <b>servant</b>.</p>'},
{lb:'Humility followed by exaltation',dr:dQ1,ht:'<p>Philippians 2:8-9 shows a consistent biblical pattern: Christ humbled Himself to death, <b>"therefore God exalted him to the highest place"</b> &mdash; humility, not self-promotion, precedes true honour in God\'s economy.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Philippians 2:3 say believers should avoid doing anything out of?","o":["Selfish ambition","Genuine love for others","Careful obedience to Scripture","Honest self-reflection"],"a":0,"w":"Philippians 2:3 says believers should avoid doing anything out of selfish ambition."},{"q":"What does Philippians 2:3 instruct believers to do in humility?","o":["Value themselves above others","Value others above themselves","Ignore others' needs entirely","Compete with others for recognition"],"a":1,"w":"Philippians 2:3 instructs believers to value others above themselves in humility."},{"q":"What does Philippians 2:4 say believers should look to, besides their own interests?","o":["Only their family's interests","Only their own personal advancement","The interests of others","No interests beyond their own"],"a":2,"w":"Philippians 2:4 says believers should look also to the interests of others."},{"q":"What mindset does Philippians 2:5 call believers to have?","o":["A mindset of self-protection above all else","A mindset focused only on personal achievement","A mindset entirely disconnected from Christ's example","The same mindset as Christ Jesus"],"a":3,"w":"Philippians 2:5 calls believers to have the same mindset as Christ Jesus."},{"q":"What does Philippians 2:6-7 say about Christ's nature and choice?","o":["Though existing in God's nature, He took the nature of a servant","He always insisted on His full divine privileges without exception","He never actually possessed divine nature at all","He refused to take on any form of humility"],"a":0,"w":"Philippians 2:6-7 says Christ, though existing in God's nature, took the nature of a servant."},{"q":"What did Christ NOT consider equality with God to be, according to Philippians 2:6?","o":["Something entirely impossible for Him to have","Something to be used to His own advantage","Something irrelevant to His mission","Something He needed to earn through good works"],"a":1,"w":"Christ did not consider equality with God something to be used to His own advantage."},{"q":"What pattern does Philippians 2:8-9 establish about humility and exaltation?","o":["Humility and exaltation have no connection to each other","Self-promotion always leads to greater honour than humility","Humility, not self-promotion, precedes true honour in God's economy","Exaltation always precedes humility, not the other way around"],"a":2,"w":"This pattern shows humility, not self-promotion, precedes true honour in God's economy."},{"q":"What overall foundation does Philippians 2 establish for Christian service?","o":["Avoiding all forms of service to protect one's own status","Personal ambition and competitive achievement","Strict adherence to religious rules with no attitude of heart","Humility, following Christ's own example of self-emptying service"],"a":3,"w":"Philippians 2 establishes humility, following Christ's example, as the foundation for Christian service."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS • Acts & Epistles',ti:'Serving the Church Community',su:'Explain how believers are called to serve one another within the local church community.',steps:[
{lb:'Practising hospitality',dr:dQ2,ht:'<p>Romans 12:13 and 1 Peter 4:9 both call believers to practise <b>hospitality</b> &mdash; welcoming and caring for others, including strangers, <b>"without grumbling."</b></p>'},
{lb:'Bearing one another\'s burdens',dr:dQ2,ht:'<p>Galatians 6:2 instructs, <em>"Carry each other\'s burdens, and in this way you will fulfil the law of Christ"</em> &mdash; describing mutual support during hardship as a core expression of Christian love in community.</p>'},
{lb:'Caring for the vulnerable',dr:dQ2,ht:'<p>James 1:27 defines "pure and faultless" religion as, in part, caring for <b>orphans and widows</b> in their distress &mdash; a concern reflected practically in the early church\'s care for widows (Acts 6:1-6).</p>'},
{lb:'Serving through the local church body',dr:dQ2,ht:'<p>These instructions show that Christian service begins <b>close to home</b>, within the local church community, before it extends outward &mdash; genuine care for fellow believers is foundational, not incidental, to Christian faith.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What practice do Romans 12:13 and 1 Peter 4:9 both call believers to?","o":["Hospitality","Public preaching","Formal church leadership","Financial record-keeping"],"a":0,"w":"Romans 12:13 and 1 Peter 4:9 both call believers to practise hospitality."},{"q":"How does 1 Peter 4:9 say hospitality should be offered?","o":["Only when publicly recognised for doing so","Without grumbling","Only to family members","Only to wealthy guests"],"a":1,"w":"1 Peter 4:9 says hospitality should be offered without grumbling."},{"q":"What does Galatians 6:2 instruct believers to carry for one another?","o":["Only financial debts","Only their own personal problems","Each other's burdens","Nothing — burdens should be carried alone"],"a":2,"w":"Galatians 6:2 instructs believers to carry each other's burdens."},{"q":"What does Galatians 6:2 say this mutual burden-bearing fulfils?","o":["A purely social custom with no spiritual meaning","No particular law or principle","Only Old Testament ceremonial law","The law of Christ"],"a":3,"w":"Galatians 6:2 says carrying each other's burdens fulfils the law of Christ."},{"q":"What does James 1:27 identify as part of \"pure and faultless\" religion?","o":["Caring for orphans and widows in their distress","Only attending religious services regularly","Only following strict dietary rules","Only avoiding all contact with unbelievers"],"a":0,"w":"James 1:27 identifies caring for orphans and widows as part of pure and faultless religion."},{"q":"Which earlier event in Acts reflects the early church's practical concern for widows?","o":["Paul's conversion in Acts 9","The dispute over food distribution in Acts 6:1-6","The Jerusalem Council in Acts 15","Peter's escape from prison in Acts 12"],"a":1,"w":"Acts 6:1-6, the dispute over food distribution, reflects the early church's practical concern for widows."},{"q":"Where does this lesson say Christian service begins, before extending outward?","o":["Only among strangers, never fellow believers","Only in distant mission fields","Close to home, within the local church community","Nowhere — service should never begin anywhere specific"],"a":2,"w":"Christian service is described as beginning close to home, within the local church community."},{"q":"What does this lesson say about care for fellow believers in relation to Christian faith?","o":["It matters only for church leaders, not ordinary believers","It is entirely optional and secondary to faith","It has no real connection to Christian faith at all","It is foundational, not incidental, to genuine faith"],"a":3,"w":"Care for fellow believers is described as foundational, not incidental, to genuine Christian faith."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS • Acts & Epistles',ti:'Serving the Wider World',su:'Explain the Bible\'s teaching on Christian service extending beyond the church to the wider world.',steps:[
{lb:'Doing good to all people',dr:dQ1,ht:'<p>Galatians 6:10 instructs, <em>"as we have opportunity, let us do good to all people, especially to those who belong to the family of believers"</em> &mdash; showing Christian service should extend beyond the church, even while prioritising fellow believers.</p>'},
{lb:'The sheep and the goats',dr:dQ1,ht:'<p>In <b>Matthew 25:31-46</b>, Jesus describes a final judgment where people are separated based on whether they fed the hungry, welcomed the stranger, clothed the naked, and visited the sick and imprisoned.</p>'},
{lb:'Serving "the least of these"',dr:dQ1,ht:'<p>Jesus declares, <em>"Truly I tell you, whatever you did for one of the least of these brothers and sisters of mine, you did for me"</em> (Matthew 25:40) &mdash; identifying Himself directly with the needs of the most vulnerable.</p>'},
{lb:'Serving without expectation of return',dr:dQ1,ht:'<p>These passages present service to the vulnerable and needy not as an optional extra, but as a genuine <b>mark of authentic faith</b>, expected of all believers, without expectation of repayment or recognition.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Galatians 6:10 instruct believers to do \"as we have opportunity\"?","o":["Do good to all people","Do good only to fellow believers, never anyone else","Avoid all contact with unbelievers","Focus only on personal spiritual growth"],"a":0,"w":"Galatians 6:10 instructs believers to do good to all people as they have opportunity."},{"q":"According to Galatians 6:10, who should be especially prioritised in this good work?","o":["Only wealthy and influential people","Those who belong to the family of believers","Only those from the same country","No one in particular — priority is irrelevant"],"a":1,"w":"Those who belong to the family of believers should be especially prioritised, according to Galatians 6:10."},{"q":"What parable does Jesus tell in Matthew 25:31-46?","o":["The Prodigal Son","The Good Samaritan","The sheep and the goats","The Wise and Foolish Builders"],"a":2,"w":"Jesus tells the parable of the sheep and the goats in Matthew 25:31-46."},{"q":"What criteria does Jesus use to separate people in this judgment scene?","o":["Whether they were wealthy or poor","Whether they attended religious services regularly","Whether they held correct theological beliefs alone","Whether they fed the hungry, welcomed strangers, and visited the sick/imprisoned"],"a":3,"w":"Jesus separates people based on whether they fed the hungry, welcomed strangers, and cared for the sick/imprisoned."},{"q":"What does Jesus say about serving \"the least of these,\" according to Matthew 25:40?","o":["Whatever is done for them is done for Jesus Himself","It has no spiritual significance at all","It applies only to serving religious leaders","It applies only to serving one's own family"],"a":0,"w":"Jesus says whatever is done for \"the least of these\" is done for Him, according to Matthew 25:40."},{"q":"What does this teaching suggest about how Jesus identifies with vulnerable people?","o":["He has no particular concern for vulnerable people","He directly identifies Himself with the needs of the most vulnerable","He identifies only with wealthy, powerful people","He identifies only with religious leaders"],"a":1,"w":"This teaching shows Jesus directly identifies Himself with the needs of the most vulnerable."},{"q":"How does this lesson describe service to the vulnerable and needy?","o":["As irrelevant to genuine Christian faith","As an optional extra only for especially devoted believers","As a genuine mark of authentic faith, expected of all believers","As something only church leaders are called to do"],"a":2,"w":"Service to the vulnerable is described as a genuine mark of authentic faith, expected of all believers."},{"q":"With what expectation should such service be offered, according to this lesson?","o":["Only if the recipient can repay the favour","Only with a guarantee of public recognition","Only in exchange for financial reward","Without expectation of repayment or recognition"],"a":3,"w":"Such service should be offered without expectation of repayment or recognition."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS • Acts & Epistles',ti:'Motivation for Christian Service',su:'Explain the proper motivation for Christian service, according to Colossians 3 and Matthew 6.',steps:[
{lb:'Working as for the Lord',dr:dQ2,ht:'<p>Colossians 3:23 instructs, <em>"Whatever you do, work at it with all your heart, as working for the Lord, not for human masters"</em> &mdash; reframing even ordinary tasks as ultimately performed <b>for God</b>, not merely for human approval.</p>'},
{lb:'The reward from the Lord',dr:dQ2,ht:'<p>Colossians 3:24 continues: believers serve <em>"since you know that you will receive an inheritance from the Lord as a reward"</em> &mdash; the ultimate motivation and reward for faithful service comes from <b>God</b>, not human recognition.</p>'},
{lb:'Giving in secret',dr:dQ2,ht:'<p>Matthew 6:1-4 warns against performing acts of righteousness <b>"to be seen by others"</b>; instead, when giving to the needy, believers should do so quietly, so that even "your left hand" does not know what the right hand is doing.</p>'},
{lb:'The Father who sees in secret',dr:dQ2,ht:'<p>Matthew 6:4 concludes that God, <em>"who sees what is done in secret,"</em> will reward such service &mdash; establishing that genuine service seeks <b>God\'s approval</b>, not public praise or applause.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Colossians 3:23 instruct believers to do in their work?","o":["Work at it with all their heart, as working for the Lord","Work only enough to avoid punishment","Work only when being observed by others","Avoid working altogether, relying only on others"],"a":0,"w":"Colossians 3:23 instructs believers to work with all their heart, as working for the Lord."},{"q":"According to Colossians 3:23, for whom is even ordinary work ultimately performed?","o":["Only for human masters, with no spiritual dimension","The Lord, not merely human masters","Only for oneself, with no reference to God","No one — work has no purpose at all"],"a":1,"w":"According to Colossians 3:23, ordinary work is ultimately performed for the Lord, not merely human masters."},{"q":"What reward does Colossians 3:24 say believers will receive?","o":["Only public recognition from others","Only immediate financial payment","An inheritance from the Lord","No reward of any kind"],"a":2,"w":"Colossians 3:24 says believers will receive an inheritance from the Lord as their reward."},{"q":"What does Matthew 6:1 warn against, regarding acts of righteousness?","o":["Avoiding all forms of giving entirely","Performing them at all, under any circumstances","Performing them only in private, never publicly","Performing them \"to be seen by others\""],"a":3,"w":"Matthew 6:1 warns against performing acts of righteousness \"to be seen by others.\""},{"q":"What image does Matthew 6:3 use to describe quiet, humble giving?","o":["Not letting your left hand know what your right hand is doing","Giving with both hands raised publicly","Giving only through official church channels","Giving only after public announcement"],"a":0,"w":"Matthew 6:3 uses the image of not letting your left hand know what your right hand is doing."},{"q":"Who does Matthew 6:4 say sees and rewards service done in secret?","o":["Only fellow church members who happen to notice","God, \"who sees what is done in secret\"","No one — secret service goes entirely unnoticed and unrewarded","Only religious leaders with special spiritual insight"],"a":1,"w":"Matthew 6:4 says God, who sees what is done in secret, rewards such service."},{"q":"What should genuine Christian service ultimately seek, according to this lesson?","o":["Financial reward exclusively","Public praise and applause above all else","God's approval, not public praise or applause","No goal of any kind"],"a":2,"w":"Genuine Christian service should ultimately seek God's approval, not public praise or applause."},{"q":"What overall principle unites Colossians 3:23-24 and Matthew 6:1-4?","o":["Service should only ever be performed reluctantly","Service should always be performed publicly for maximum visibility","Service has no real spiritual dimension at all","Service should be motivated by devotion to God, not human recognition"],"a":3,"w":"Both passages unite around the principle that service should be motivated by devotion to God, not human recognition."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS • Acts & Epistles',ti:'Faithfulness in Service: The Parable of the Talents',su:'Explain the Parable of the Talents and its teaching on faithful stewardship in service.',steps:[
{lb:'The master\'s distribution',dr:dQ1,ht:'<p>In <b>Matthew 25:14-30</b>, a master preparing for a journey entrusts his servants with <b>talents</b> (a large sum of money) &mdash; five to one, two to another, and one to a third &mdash; "each according to his ability."</p>'},
{lb:'Faithful investment',dr:dQ1,ht:'<p>The servants given five and two talents <b>invested them</b> and doubled their money by the time their master returned, earning the commendation: <em>"Well done, good and faithful servant!"</em> (Matthew 25:21, 23).</p>'},
{lb:'The fearful, unfaithful servant',dr:dQ1,ht:'<p>The servant given one talent, out of <b>fear</b>, buried it in the ground rather than risk investing it, returning only the original amount and offering excuses rather than fruit for his master\'s trust.</p>'},
{lb:'The consequence of unfaithfulness',dr:dQ1,ht:'<p>The master condemns this servant as "wicked and lazy," taking away his talent and giving it to the one with ten &mdash; teaching that faithful believers are expected to actively <b>use</b>, not merely preserve untouched, whatever they have been entrusted with.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does the master in Matthew 25:14-30 entrust to his servants before his journey?","o":["Talents (a large sum of money)","Land and property","Farm animals","Books and scrolls"],"a":0,"w":"The master entrusts his servants with talents, a large sum of money, before his journey."},{"q":"On what basis were the talents distributed among the servants?","o":["Equally, with no distinction at all","\"Each according to his ability\"","Randomly, by chance alone","Based only on seniority"],"a":1,"w":"The talents were distributed \"each according to his ability.\""},{"q":"What did the servants given five and two talents do with them?","o":["Spent them immediately on themselves","Buried them for safekeeping","Invested them and doubled the money","Gave them away to strangers"],"a":2,"w":"The servants given five and two talents invested them and doubled the money."},{"q":"What commendation did the faithful servants receive from their master?","o":["A demand for even greater profit","A rebuke for taking unnecessary risks","No response of any kind","\"Well done, good and faithful servant!\""],"a":3,"w":"The faithful servants received the commendation, \"Well done, good and faithful servant!\""},{"q":"What did the servant given one talent do with it?","o":["Buried it in the ground out of fear","Invested it and lost the money","Gave it entirely to the poor","Multiplied it tenfold through wise investment"],"a":0,"w":"The servant given one talent buried it in the ground out of fear."},{"q":"What did the master call this servant, upon his return?","o":["\"Wise and faithful\"","\"Wicked and lazy\"","\"Bold and courageous\"","\"Generous and kind\""],"a":1,"w":"The master called this servant \"wicked and lazy\" upon his return."},{"q":"What happened to the one talent this unfaithful servant had buried?","o":["It was destroyed entirely","It was returned to him with interest","It was taken from him and given to the servant with ten","It was divided equally among all the servants"],"a":2,"w":"The one talent was taken from the unfaithful servant and given to the servant with ten."},{"q":"What overall teaching does this parable convey about faithful service?","o":["Faithfulness has no consequence, positive or negative","Believers should avoid all risk and simply preserve what they are given","Only some believers are ever entrusted with anything at all","Believers are expected to actively use what they are entrusted with, not merely preserve it untouched"],"a":3,"w":"This parable teaches that believers are expected to actively use what they are entrusted with, not merely preserve it."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS • Acts & Epistles',ti:'Sacrificial Service: Paul\'s Example',su:'Examine Paul\'s model of sacrificial, self-giving service to the churches he founded.',steps:[
{lb:'Servants for Jesus\'s sake',dr:dQ2,ht:'<p>In <b>2 Corinthians 4:5</b>, Paul states, <em>"For what we preach is not ourselves, but Jesus Christ as Lord, and ourselves as your servants for Jesus\' sake"</em> &mdash; positioning himself and his co-workers as servants of the churches, not their masters.</p>'},
{lb:'Becoming a slave to all',dr:dQ2,ht:'<p>In <b>1 Corinthians 9:19</b>, Paul writes, <em>"Though I am free and belong to no one, I have made myself a slave to everyone, to win as many as possible"</em> &mdash; voluntarily limiting his own freedom for the sake of others\' salvation.</p>'},
{lb:'Becoming all things to all people',dr:dQ2,ht:'<p>Paul explains further in 1 Corinthians 9:22 that he became <em>"all things to all people"</em> &mdash; adapting his approach to different audiences (Jews, Gentiles, the weak) so that he might, by all possible means, <b>save some</b>.</p>'},
{lb:'Service costing real personal sacrifice',dr:dQ2,ht:'<p>As seen in his catalogue of sufferings (2 Corinthians 11:23-28) and financial self-support through tentmaking (Acts 18:3), Paul\'s service to the churches involved genuine <b>personal cost</b>, not merely convenient acts of kindness.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"How does Paul describe himself and his co-workers in 2 Corinthians 4:5?","o":["As servants of the churches for Jesus' sake","As masters and rulers of the churches","As distant observers with no real involvement","As financial beneficiaries of the churches"],"a":0,"w":"Paul describes himself and his co-workers as servants of the churches for Jesus' sake."},{"q":"What does Paul say he has made himself, according to 1 Corinthians 9:19?","o":["A master over all the churches he founded","A slave to everyone, to win as many as possible","Completely independent, with no obligation to anyone","A permanent resident of only one single city"],"a":1,"w":"Paul says he has made himself a slave to everyone, to win as many as possible."},{"q":"Why does Paul say he voluntarily limited his own freedom, according to 1 Corinthians 9:19?","o":["To avoid all forms of persecution entirely","To gain personal wealth and status","To win as many people as possible to the gospel","To please the Roman authorities"],"a":2,"w":"Paul voluntarily limited his freedom to win as many people as possible to the gospel."},{"q":"What does Paul say he became, according to 1 Corinthians 9:22?","o":["A person who refused to adapt to any audience","A rigid, unchanging preacher regardless of audience","A person who only ever preached to Jews","\"All things to all people\""],"a":3,"w":"Paul says he became \"all things to all people,\" according to 1 Corinthians 9:22."},{"q":"Why did Paul adapt his approach to different audiences?","o":["So that he might, by all possible means, save some","To make himself more comfortable personally","To avoid any form of criticism from anyone","To gain financial advantage from different groups"],"a":0,"w":"Paul adapted his approach so that he might, by all possible means, save some."},{"q":"Which passage details the genuine personal cost of Paul's sacrificial service?","o":["Romans 8:35-39 only","2 Corinthians 11:23-28 (his catalogue of sufferings)","Galatians 5:22-23 only","1 Peter 4:10-11 only"],"a":1,"w":"2 Corinthians 11:23-28, Paul's catalogue of sufferings, details the genuine personal cost of his service."},{"q":"What trade did Paul use to support himself financially while serving the churches?","o":["Farming","Fishing","Tentmaking","Carpentry"],"a":2,"w":"Paul used tentmaking to support himself financially while serving the churches."},{"q":"What overall lesson does Paul's example teach about sacrificial service?","o":["Sacrificial service has no connection to genuine Christian faith","Service should always be comfortable and cost-free","Only apostles like Paul are called to sacrificial service","Genuine service often involves real personal cost, not merely convenient acts of kindness"],"a":3,"w":"Paul's example teaches that genuine service often involves real personal cost, not merely convenient kindness."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS • Acts & Epistles',ti:'WAEC Exam Preparation — Christian Service',su:'Practise WAEC-style questions on Christian service in the Gospels and Epistles.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on Christian service: (1) Identify the <b>specific passage or theme</b> asked about. (2) Give the <b>precise Bible reference</b>. (3) Explain the teaching <b>clearly</b>. (4) Draw out a <b>practical application</b> for believers today.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "Explain the significance of Jesus washing His disciples\' feet." / "Discuss Paul\'s teaching on humility in Philippians 2." / "What does the Parable of the Talents teach about faithful service?" / "Discuss the proper motivation for Christian service."</p>'},
{lb:'Key references to remember',dr:dQ1,ht:'<p>Key references: <b>Mark 10:45</b> (Son of Man came to serve); <b>John 13</b> (foot-washing); <b>Philippians 2:3-9</b> (humility); <b>Galatians 6:2, 10</b> (bearing burdens, doing good); <b>Matthew 25:31-46</b> (sheep and goats); <b>Colossians 3:23-24</b> (working for the Lord); <b>Matthew 25:14-30</b> (talents).</p>'},
{lb:'Connecting teaching to practical service',dr:dQ1,ht:'<p>WAEC essays should always connect biblical teaching to <b>practical service today</b> &mdash; in the local church, the wider community, and daily life &mdash; rather than treating service only as an abstract theological idea.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on Christian service?","o":["Identify the specific passage or theme asked about","Immediately give a personal opinion with no facts","List unrelated facts with no explanation","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on Christian service should begin by identifying the specific passage or theme asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"What does the Parable of the Talents teach about faithful service?\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"What does the Parable of the Talents teach about faithful service?\" is a typical WAEC-style question on this topic."},{"q":"Which verse should be cited when discussing Jesus's own definition of His mission as service?","o":["Philippians 2:7","John 13:14","Mark 10:45","Matthew 25:40"],"a":2,"w":"Mark 10:45 should be cited when discussing Jesus's own definition of His mission as service."},{"q":"Which chapter should be cited when discussing humility as the foundation of service?","o":["1 Corinthians 13","Romans 6","Ephesians 4","Philippians 2"],"a":3,"w":"Philippians 2 should be cited when discussing humility as the foundation of service."},{"q":"Which passage should be cited when discussing service to the vulnerable and needy?","o":["Matthew 25:31-46 (the sheep and the goats)","Romans 12:1-2","Galatians 5:22-23","2 Corinthians 5:17"],"a":0,"w":"Matthew 25:31-46 should be cited when discussing service to the vulnerable and needy."},{"q":"Which passage should be cited when discussing the proper motivation for service?","o":["1 Corinthians 12:8-10","Colossians 3:23-24","Ephesians 4:11","Romans 6:23"],"a":1,"w":"Colossians 3:23-24 should be cited when discussing the proper motivation for service."},{"q":"Why should WAEC essays connect biblical teaching to practical service today?","o":["Only abstract theology should ever be discussed","Practical application is irrelevant to WAEC marking","It shows the theology remains relevant to real Christian life, not just abstract ideas","WAEC forbids discussing daily life applications"],"a":2,"w":"Connecting to practical service shows the theology remains relevant to real Christian life, which WAEC rewards."},{"q":"What should a strong WAEC essay conclusion on Christian service include?","o":["A criticism of the Bible's reliability","Only a repetition of the Bible reference, with no further comment","An unrelated historical fact","A practical application for believers today"],"a":3,"w":"A strong conclusion should include a practical application for believers today."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS • Acts & Epistles',ti:'Mixed Questions — Christian Service',su:'Integrated revision across the meaning, models and motivation of Christian service.',steps:[
{lb:'Summary of key themes',dr:dQ2,ht:'<p>Christian service follows the example of Christ, who <b>came to serve, not to be served</b> (Mark 10:45), modelled ultimate humility in washing His disciples\' feet (John 13) and in His self-emptying (Philippians 2), and calls believers to serve the church, the wider world, and to do so faithfully and sacrificially, motivated by love for God rather than human recognition.</p>'},
{lb:'Key references to remember',dr:dQ2,ht:'<p>Must-know facts: <b>Mark 10:45</b> (ransom for many); <b>John 13:14-15</b> (set an example); <b>Philippians 2:6-8</b> (Christ\'s humility); <b>Galatians 6:2</b> (carry each other\'s burdens); <b>Matthew 25:40</b> (least of these); <b>Colossians 3:23-24</b> (working for the Lord); <b>Matthew 25:21</b> (well done, good and faithful servant).</p>'},
{lb:'Lessons for today',dr:dQ2,ht:'<p>These teachings call believers to serve one another and the wider world with humility, faithfulness and genuine love, following Christ\'s example rather than seeking status, power or public recognition.</p>'},
{lb:'Final exam tips',dr:dQ2,ht:'<p>Always give the <b>precise Bible reference</b>, explain the teaching <b>clearly and accurately</b>, and conclude by connecting the passage to a practical, everyday example of Christian service.</p>'},
