ld prioritise themselves entirely, with no regard for their wives","Love in marriage is purely a legal formality"],"a":1,"w":"Ephesians 5:28-29 reasons that \"he who loves his wife loves himself.\""},{"q":"What language does Ephesians 5:22-33 use to describe the marriage relationship overall?","o":["Language treating marriage as purely a legal contract","Language diminishing the value of marriage","Language elevating the seriousness and significance of marriage","Language with no connection to Christ or the Church at all"],"a":2,"w":"This passage uses language that elevates the seriousness and significance of marriage."},{"q":"What overall balance does Ephesians 5 strike in its teaching on marriage?","o":["No real guidance on how spouses should relate to each other","Total domination by husbands with no responsibility at all","Total domination by wives with no responsibility at all","Mutual submission, with husbands specifically called to sacrificial, Christlike love"],"a":3,"w":"Ephesians 5 strikes a balance of mutual submission, with husbands specifically called to sacrificial, Christlike love."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:'Husbands: honouring wives as co-heirs',dr:dQ1,ht:'<p><b>1 Peter 3:7</b> instructs husbands to be considerate of their wives, treating them with respect as "heirs with you of the gracious gift of life" &mdash; adding a warning that failing to do so can even <b>hinder a husband\'s prayers</b>.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Colossians 3:18 instruct wives to do, \"as is fitting in the Lord\"?","o":["Submit to their husbands","Ignore their husbands entirely","Compete with their husbands for authority","Avoid all responsibility within the marriage"],"a":0,"w":"Colossians 3:18 instructs wives to submit to their husbands, \"as is fitting in the Lord.\""},{"q":"What does Colossians 3:19 warn husbands against?","o":["Loving their wives at all","Being harsh with their wives","Working outside the home","Having any children"],"a":1,"w":"Colossians 3:19 warns husbands against being harsh with their wives."},{"q":"According to 1 Peter 3:1-2, how might an unbelieving husband be \"won over\"?","o":["Only through legal action","Only through direct verbal argument and persuasion","By the respectful, pure conduct of his wife, without words","It is impossible for such a husband ever to be won over"],"a":2,"w":"1 Peter 3:1-2 says an unbelieving husband may be won over by his wife's respectful, pure conduct, without words."},{"q":"What inner quality does 1 Peter 3:4 highlight as being of \"great worth in God's sight\"?","o":["Physical beauty alone","Expensive clothing and jewellery","Public recognition and status","A gentle and quiet spirit"],"a":3,"w":"1 Peter 3:4 highlights a gentle and quiet spirit as being of great worth in God's sight."},{"q":"What does 1 Peter 3:3-4 encourage wives to prioritise over external adornment?","o":["Inner character","Only outward appearance","Only social status","Only financial wealth"],"a":0,"w":"1 Peter 3:3-4 encourages wives to prioritise inner character over external adornment."},{"q":"How does 1 Peter 3:7 instruct husbands to treat their wives?","o":["With indifference and neglect","With consideration and respect, as heirs of the gracious gift of life","With harshness and control","With no particular regard at all"],"a":1,"w":"1 Peter 3:7 instructs husbands to treat their wives with consideration and respect, as co-heirs of life."},{"q":"What warning does 1 Peter 3:7 give to husbands who fail to honour their wives?","o":["It only affects their wives, not themselves","It has no real spiritual consequence at all","It can hinder their prayers","It is entirely acceptable behaviour"],"a":2,"w":"1 Peter 3:7 warns that failing to honour one's wife can hinder a husband's prayers."},{"q":"What common theme unites Colossians 3:18-19 and 1 Peter 3:1-7?","o":["Wives having no role or value within marriage","Total domination by husbands with no responsibility at all","Marriage having no spiritual significance whatsoever","Mutual respect and responsibility within marriage, avoiding harshness or neglect"],"a":3,"w":"Both passages share the theme of mutual respect and responsibility within marriage, avoiding harshness or neglect."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS • Acts & Epistles',ti:'Parents and Children',su:'Explain the New Testament teaching on the relationship between parents and children.',steps:[
{lb:'Children obeying parents',dr:dQ2,ht:'<p><b>Ephesians 6:1</b> and <b>Colossians 3:20</b> both instruct children to <b>obey their parents</b> "in the Lord," describing this as "right" and "pleasing to the Lord."</p>'},
{lb:'The commandment with a promise',dr:dQ2,ht:'<p><b>Ephesians 6:2-3</b> connects this instruction to the fifth of the <b>Ten Commandments</b> &mdash; "Honour your father and mother" &mdash; noting it is "the first commandment with a promise": <em>"that it may go well with you and that you may enjoy long life on the earth."</em></p>'},
{lb:'Fathers not to exasperate their children',dr:dQ2,ht:'<p><b>Ephesians 6:4</b> instructs fathers specifically: <em>"do not exasperate your children; instead, bring them up in the training and instruction of the Lord"</em> &mdash; balancing discipline with genuine, godly nurture.</p>'},
{lb:'Not embittering children',dr:dQ2,ht:'<p><b>Colossians 3:21</b> gives a parallel warning: <em>"Fathers, do not embitter your children, or they will become discouraged"</em> &mdash; emphasising that harsh, inconsistent, or excessive discipline can cause lasting spiritual and emotional harm.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What do Ephesians 6:1 and Colossians 3:20 instruct children to do?","o":["Obey their parents in the Lord","Ignore their parents' instructions entirely","Only obey their parents once they become adults","Obey only their mother, never their father"],"a":0,"w":"Both passages instruct children to obey their parents in the Lord."},{"q":"Which of the Ten Commandments does Ephesians 6:2 connect this instruction to?","o":["\"You shall not steal\"","\"Honour your father and mother\"","\"You shall not commit adultery\"","\"Remember the Sabbath\""],"a":1,"w":"Ephesians 6:2 connects this instruction to \"Honour your father and mother,\" the fifth commandment."},{"q":"What does Ephesians 6:2-3 call this particular commandment?","o":["A commandment that applies only to adults","An outdated commandment with no relevance today","\"The first commandment with a promise\"","A commandment with no practical benefit attached"],"a":2,"w":"Ephesians 6:2-3 calls this \"the first commandment with a promise.\""},{"q":"What promise is attached to honouring one's father and mother, according to Ephesians 6:3?","o":["Guaranteed fame and recognition","Immediate financial wealth","Exemption from all future hardship","That it may go well with you and you may enjoy long life"],"a":3,"w":"The promise is that it may go well with you and you may enjoy long life, according to Ephesians 6:3."},{"q":"What does Ephesians 6:4 instruct fathers not to do to their children?","o":["Exasperate them","Ever discipline them at all","Ever show them affection","Ever spend time with them"],"a":0,"w":"Ephesians 6:4 instructs fathers not to exasperate their children."},{"q":"What does Ephesians 6:4 instruct fathers to do instead?","o":["Ignore their children's spiritual development entirely","Bring their children up in the training and instruction of the Lord","Leave all upbringing entirely to the mother","Focus only on their children's academic success"],"a":1,"w":"Ephesians 6:4 instructs fathers to bring their children up in the training and instruction of the Lord."},{"q":"What parallel warning does Colossians 3:21 give to fathers?","o":["Never correct your children under any circumstances","Always be as strict as possible with your children","Do not embitter your children, or they will become discouraged","Ignore your children's behaviour entirely"],"a":2,"w":"Colossians 3:21 warns fathers not to embitter their children, or they will become discouraged."},{"q":"What balance do Ephesians 6:4 and Colossians 3:21 together emphasise for parenting?","o":["No particular approach to parenting is recommended","Strict discipline alone, with no nurture required","Complete permissiveness, with no discipline at all","Balancing appropriate discipline with genuine, godly nurture, avoiding harshness"],"a":3,"w":"Together, these verses emphasise balancing discipline with genuine, godly nurture, avoiding harshness."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS • Acts & Epistles',ti:'Household Codes: Masters and Servants',su:'Explain the New Testament\'s instructions for masters and servants within the household.',steps:[
{lb:'Servants working as for the Lord',dr:dQ1,ht:'<p><b>Ephesians 6:5-8</b> and <b>Colossians 3:22-24</b> instruct servants (in the ancient context, often bondservants) to obey their earthly masters with sincerity, <b>"just as you would obey Christ"</b> &mdash; working wholeheartedly, as though serving the Lord Himself.</p>'},
{lb:'Masters treating servants fairly',dr:dQ1,ht:'<p><b>Ephesians 6:9</b> instructs masters, in turn, to treat their servants in the same way, without threatening them, <b>"since you know that he who is both their Master and yours is in heaven, and there is no favouritism with him."</b></p>'},
{lb:'Historical context of the household codes',dr:dQ1,ht:'<p>These instructions, addressed within the social structures of the <b>Greco-Roman household</b> of Paul\'s day, apply general Christian principles &mdash; sincerity, wholeheartedness, and fairness &mdash; to relationships that existed within that historical context.</p>'},
{lb:'Enduring principles for the workplace today',dr:dQ1,ht:'<p>While the specific master-servant relationship reflects an ancient social structure, the underlying principles &mdash; <b>working with integrity</b>, and treating those under one\'s authority with <b>fairness and respect</b> &mdash; remain relevant to modern employer-employee relationships.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"According to Ephesians 6:5-8 and Colossians 3:22-24, how should servants obey their earthly masters?","o":["With sincerity, just as they would obey Christ","Only when directly supervised","With visible reluctance and resentment","Only when they personally agree with the master's instructions"],"a":0,"w":"Servants should obey with sincerity, just as they would obey Christ, according to these passages."},{"q":"How does this teaching describe the manner in which servants should work?","o":["Half-heartedly, doing only the minimum required","Wholeheartedly, as though serving the Lord Himself","Only for immediate personal reward","With no genuine effort at all"],"a":1,"w":"Servants should work wholeheartedly, as though serving the Lord Himself."},{"q":"What does Ephesians 6:9 instruct masters to do toward their servants?","o":["Ignore their wellbeing entirely","Threaten them regularly to ensure obedience","Treat them fairly, without threatening them","Treat them with total indifference"],"a":2,"w":"Ephesians 6:9 instructs masters to treat their servants fairly, without threatening them."},{"q":"What reasoning does Ephesians 6:9 give for masters to treat servants fairly?","o":["Fair treatment has no spiritual significance","Servants have no real value as human beings","Masters have no accountability for their treatment of servants","Their own Master is in heaven, and there is no favouritism with him"],"a":3,"w":"Ephesians 6:9 reasons that masters' own Master is in heaven, and there is no favouritism with him."},{"q":"What historical social structure do these instructions address?","o":["The Greco-Roman household of Paul's day","A purely modern corporate workplace","The Nigerian civil service","The Roman military"],"a":0,"w":"These instructions address the Greco-Roman household structure of Paul's day."},{"q":"What underlying principles from these instructions remain relevant today, according to this lesson?","o":["The exact same master-servant social structure, unchanged","Working with integrity, and treating those under one's authority with fairness and respect","No principles remain relevant to the modern world","Only the specific historical details, with no broader application"],"a":1,"w":"The underlying principles of integrity and fair treatment of those under one's authority remain relevant today."},{"q":"How can these ancient instructions be meaningfully applied to modern employer-employee relationships?","o":["Only by literally recreating ancient household structures","They cannot be applied at all to any modern context","Through the enduring principles of wholehearted work and fair treatment","Only by ignoring the historical context entirely"],"a":2,"w":"These instructions can be meaningfully applied through the enduring principles of wholehearted work and fair treatment."},{"q":"What overall value do the household codes still offer readers today, despite reflecting an ancient social structure?","o":["Only relevance to those literally still living in ancient households","No value at all, since the specific structure no longer exists","Only historical interest, with no practical application","General Christian principles of integrity, sincerity and fairness applicable across contexts"],"a":3,"w":"These codes offer general Christian principles of integrity, sincerity and fairness applicable across different contexts."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS • Acts & Epistles',ti:'Family Life as a Reflection of the Gospel',su:'Explain how New Testament family instructions reflect deeper gospel truths.',steps:[
{lb:'Marriage reflecting Christ and the Church',dr:dQ2,ht:'<p>As seen in <b>Ephesians 5:32</b>, the marriage relationship is presented not merely as a social arrangement, but as a living <b>picture</b> of Christ\'s relationship with the Church &mdash; His sacrificial love and the Church\'s responsive devotion.</p>'},
{lb:'Family relationships modelling gospel values',dr:dQ2,ht:'<p>The consistent emphasis on <b>sacrificial love, humility, respect and fairness</b> across marriage, parent-child, and master-servant relationships all model the same gospel values seen in Christ\'s own character and teaching.</p>'},
{lb:'The family as a training ground for character',dr:dQ2,ht:'<p>Family relationships function as a practical <b>training ground</b> for Christian character &mdash; learning patience, forgiveness, selflessness and love within the home prepares believers to embody these same qualities in the wider world.</p>'},
{lb:'Family witness to the watching world',dr:dQ2,ht:'<p>Healthy, Christ-honouring family relationships also serve as a <b>witness</b> to a watching world, demonstrating the practical difference genuine faith makes in ordinary, everyday human relationships.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"According to Ephesians 5:32, what does the marriage relationship serve as a picture of?","o":["Christ's relationship with the Church","A purely legal, contractual arrangement","An outdated cultural custom with no deeper meaning","A relationship with no connection to Christian faith"],"a":0,"w":"Ephesians 5:32 presents marriage as a picture of Christ's relationship with the Church."},{"q":"What consistent values are emphasised across the New Testament's family instructions?","o":["Domination, control and self-interest","Sacrificial love, humility, respect and fairness","Complete disregard for others' needs","No consistent values at all"],"a":1,"w":"Sacrificial love, humility, respect and fairness are consistently emphasised across these family instructions."},{"q":"Whose character do these family values reflect, according to this lesson?","o":["Values entirely disconnected from Christian faith","A purely human, secular set of values","Christ's own character and teaching","No particular character or figure"],"a":2,"w":"These family values reflect Christ's own character and teaching."},{"q":"What role does this lesson say family relationships can play in Christian character development?","o":["A role limited only to children, not adults","No role at all in spiritual development","A purely negative influence to be avoided","A practical training ground for Christian character"],"a":3,"w":"Family relationships are described as a practical training ground for Christian character."},{"q":"What qualities does learning within family relationships help develop, according to this lesson?","o":["Patience, forgiveness, selflessness and love","Only financial management skills","Only academic knowledge","Only physical strength"],"a":0,"w":"Learning within family relationships helps develop patience, forgiveness, selflessness and love."},{"q":"How does this preparation within the family relate to the wider world?","o":["It has no connection to life outside the family at all","It prepares believers to embody these qualities in the wider world","It only matters for church-related activities","It prepares believers only for further family relationships, nothing else"],"a":1,"w":"This preparation helps believers embody these qualities in the wider world beyond the family."},{"q":"What role can healthy, Christ-honouring family relationships play toward outsiders?","o":["A purely private matter with no wider significance","No role at all — family life has no bearing on outsiders' perceptions","A witness, demonstrating the practical difference genuine faith makes","A source of division from the wider community"],"a":2,"w":"Healthy family relationships can serve as a witness, demonstrating the practical difference genuine faith makes."},{"q":"What overall conclusion does this lesson draw about New Testament family instructions?","o":["They apply only to formal church leadership, not ordinary families","They are purely social conventions with no theological significance","They have no lasting relevance beyond the first century","They reflect and embody deeper gospel truths, not merely social convention"],"a":3,"w":"This lesson concludes that these instructions reflect and embody deeper gospel truths, not merely social convention."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS • Acts & Epistles',ti:'Singleness and Devotion to Christ',su:'Explain Paul\'s teaching on the value of singleness for undivided devotion to Christ.',steps:[
{lb:'Paul\'s personal perspective',dr:dQ1,ht:'<p>In <b>1 Corinthians 7:7-8</b>, Paul expresses a wish that all could be as he was (apparently unmarried), while acknowledging that each person has their own gift from God &mdash; some for marriage, some for singleness.</p>'},
{lb:'Undivided devotion to the Lord\'s affairs',dr:dQ1,ht:'<p><b>1 Corinthians 7:32-35</b> notes that an unmarried person can be concerned about the Lord\'s affairs, seeking to please Him, while a married person\'s concerns are naturally divided between pleasing the Lord and their spouse &mdash; Paul presents this <b>not as a criticism of marriage</b>, but as a practical observation.</p>'},
{lb:'Present circumstances',dr:dQ1,ht:'<p>Paul frames some of this counsel around "the present crisis" facing the Corinthian church (1 Corinthians 7:26) &mdash; suggesting his specific practical advice was partly shaped by the <b>particular difficulties</b> of that historical moment.</p>'},
{lb:'Both marriage and singleness as legitimate callings',dr:dQ1,ht:'<p>Overall, Paul presents both marriage and singleness as legitimate, God-given callings, each carrying its own opportunities for faithful <b>service and devotion</b> to Christ, rather than treating one as inherently superior to the other.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"In 1 Corinthians 7:7-8, what does Paul wish for all believers, based on his own apparent situation?","o":["That all could be as he was (unmarried)","That all must marry immediately","That marriage should be entirely abolished","That singleness is sinful and should be avoided"],"a":0,"w":"Paul wishes all could be as he was (apparently unmarried), according to 1 Corinthians 7:7-8."},{"q":"What does Paul acknowledge, alongside this personal wish?","o":["That marriage is always spiritually inferior to singleness","That each person has their own gift from God — some for marriage, some for singleness","That singleness is always spiritually inferior to marriage","That no one has any particular gift regarding this matter"],"a":1,"w":"Paul acknowledges that each person has their own gift from God, whether for marriage or singleness."},{"q":"According to 1 Corinthians 7:32-35, what can an unmarried person be concerned about?","o":["Only their own personal pleasure","Nothing of any real significance","The Lord's affairs, seeking to please Him","Only accumulating wealth"],"a":2,"w":"An unmarried person can be concerned about the Lord's affairs, seeking to please Him."},{"q":"How does Paul describe a married person's concerns, by contrast?","o":["Entirely irrelevant to spiritual devotion","Identical to an unmarried person's concerns in every way","Focused only on their spouse, with no concern for the Lord at all","Naturally divided between pleasing the Lord and their spouse"],"a":3,"w":"A married person's concerns are naturally divided between pleasing the Lord and their spouse."},{"q":"Does Paul present this observation as a criticism of marriage?","o":["No, it is presented as a practical observation, not a criticism","Yes, Paul strongly condemns marriage as inherently sinful","Yes, Paul believes marriage is spiritually harmful in all cases","Paul does not address marriage at all in this passage"],"a":0,"w":"Paul presents this as a practical observation, not a criticism of marriage."},{"q":"What historical circumstance does Paul reference in 1 Corinthians 7:26 that shapes some of his counsel?","o":["A universal, timeless command with no historical context","\"The present crisis\" facing the Corinthian church","A future crisis not yet experienced by anyone","No particular circumstance at all"],"a":1,"w":"Paul references \"the present crisis\" facing the Corinthian church in 1 Corinthians 7:26."},{"q":"How does Paul ultimately present both marriage and singleness?","o":["As singleness being the only acceptable state for believers","As marriage being the only acceptable state for believers","As legitimate, God-given callings, each with its own opportunities for service","As neither state having any spiritual significance at all"],"a":2,"w":"Paul presents both marriage and singleness as legitimate, God-given callings with their own opportunities for service."},{"q":"What overall balance does this lesson draw from Paul's teaching on singleness and marriage?","o":["The topic has no relevance to genuine Christian devotion","Marriage is always treated as spiritually superior","Singleness is always treated as spiritually superior","Neither state is treated as inherently superior to the other"],"a":3,"w":"This lesson draws the balance that neither state is treated as inherently superior to the other."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS • Acts & Epistles',ti:'Divorce and Remarriage in the Epistles',su:'Explain Paul\'s teaching on divorce and remarriage in 1 Corinthians 7.',steps:[
{lb:'The Lord\'s command: do not divorce',dr:dQ2,ht:'<p>In <b>1 Corinthians 7:10-11</b>, Paul reaffirms Jesus\'s own teaching that a wife should not separate from her husband, nor a husband divorce his wife &mdash; and if separation occurs, reconciliation should be sought rather than remarriage to another.</p>'},
{lb:'Marriage to an unbeliever',dr:dQ2,ht:'<p><b>1 Corinthians 7:12-14</b> (Paul\'s own instruction, not directly from Jesus) addresses believers married to unbelievers, advising the believer to remain in the marriage if the unbelieving spouse is willing to stay, since the marriage sanctifies the family relationship.</p>'},
{lb:'If the unbeliever leaves',dr:dQ2,ht:'<p><b>1 Corinthians 7:15</b> allows that if an unbelieving spouse chooses to leave, the believer <b>"is not bound in such circumstances,"</b> since "God has called us to live in peace" &mdash; addressing a specific pastoral situation.</p>'},
{lb:'A pastoral, not merely legalistic, approach',dr:dQ2,ht:'<p>Throughout this chapter, Paul balances firm commitment to the sanctity of marriage with genuine <b>pastoral sensitivity</b> to difficult, real-life circumstances the Corinthian believers faced, rather than offering rigid rules with no consideration of context.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Paul reaffirm in 1 Corinthians 7:10-11, regarding divorce?","o":["Jesus's own teaching that a wife should not separate from her husband, nor a husband divorce his wife","That divorce is always permissible for any reason","That marriage has no binding significance at all","That only wives, never husbands, are bound by this teaching"],"a":0,"w":"Paul reaffirms Jesus's teaching that spouses should not separate or divorce, in 1 Corinthians 7:10-11."},{"q":"What does Paul instruct if separation does occur, according to 1 Corinthians 7:11?","o":["Immediate remarriage is always encouraged","Reconciliation should be sought rather than remarriage to another","No further action is ever required","The separated spouse should never speak to the other again"],"a":1,"w":"Paul instructs that reconciliation should be sought rather than remarriage to another, if separation occurs."},{"q":"Whose instruction does 1 Corinthians 7:12-14 represent, according to Paul himself?","o":["An instruction from the Jerusalem Council","A direct quotation from Jesus's earthly teaching","Paul's own instruction, not directly from Jesus","An instruction with no apostolic authority at all"],"a":2,"w":"1 Corinthians 7:12-14 represents Paul's own instruction, as he himself notes, not a direct quotation from Jesus."},{"q":"What does Paul advise a believer married to an unbeliever, if the unbeliever is willing to stay?","o":["Seek an annulment as soon as possible","Divorce immediately regardless of the unbeliever's wishes","Refuse to live with the unbeliever under any circumstances","Remain in the marriage"],"a":3,"w":"Paul advises the believer to remain in the marriage if the unbelieving spouse is willing to stay."},{"q":"What does Paul say the marriage does for the family relationship, in 1 Corinthians 7:14?","o":["Sanctifies it","Has no spiritual effect at all","Automatically converts the unbelieving spouse","Renders the marriage entirely invalid"],"a":0,"w":"Paul says the marriage sanctifies the family relationship, in 1 Corinthians 7:14."},{"q":"What does 1 Corinthians 7:15 say if an unbelieving spouse chooses to leave?","o":["The believer must forcibly prevent the unbeliever from leaving","The believer is \"not bound\" in such circumstances","The believer is permanently condemned for the unbeliever's choice","No guidance is given for this situation at all"],"a":1,"w":"1 Corinthians 7:15 says the believer is not bound in such circumstances, if the unbeliever leaves."},{"q":"What reason does 1 Corinthians 7:15 give for this allowance?","o":["A legal loophole with no theological basis","A desire to punish the unbelieving spouse","\"God has called us to live in peace\"","No reason is given at all"],"a":2,"w":"1 Corinthians 7:15 gives the reason that \"God has called us to live in peace.\""},{"q":"What overall approach does Paul take throughout 1 Corinthians 7 regarding divorce and remarriage?","o":["An approach with no guidance of any kind","A rigid, legalistic approach with no consideration of context","An approach that entirely permits divorce for any reason","A pastoral approach, balancing firm commitment to marriage with sensitivity to real-life circumstances"],"a":3,"w":"Paul takes a pastoral approach, balancing commitment to marriage with sensitivity to real circumstances."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS • Acts & Epistles',ti:'WAEC Exam Preparation — Marriage and Family',su:'Practise WAEC-style questions on marriage and family in the Epistles.',steps:[
{lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC essays on marriage and family: (1) Identify the <b>specific passage or relationship</b> asked about. (2) Give the <b>precise Bible reference</b>. (3) Explain the teaching <b>clearly and accurately</b>. (4) Draw out a <b>practical application</b> for family life today.</p>'},
{lb:'Common WAEC question patterns',dr:dQ2,ht:'<p>Common patterns include: "Discuss Paul\'s teaching on marriage in Ephesians 5." / "What does the Bible teach about the relationship between parents and children?" / "Explain the household codes regarding masters and servants." / "Discuss Paul\'s teaching on singleness in 1 Corinthians 7."</p>'},
{lb:'Key references to remember',dr:dQ2,ht:'<p>Key references: <b>Hebrews 13:4</b> (marriage honoured); <b>Ephesians 5:21-33</b> (mutual submission, sacrificial love); <b>Colossians 3:18-21, 1 Peter 3:1-7</b> (marriage, parents/children); <b>Ephesians 6:1-9, Colossians 3:22-4:1</b> (children, masters/servants); <b>1 Corinthians 7</b> (marriage and singleness).</p>'},
{lb:'Applying teaching to modern family life',dr:dQ2,ht:'<p>WAEC essays should always connect these ancient instructions to <b>modern family life</b> &mdash; respect, sacrificial love, fair treatment &mdash; rather than treating them only as historical curiosities.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on marriage and family?","o":["Identify the specific passage or relationship asked about","Immediately give a personal opinion with no facts","List unrelated facts with no explanation","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on this topic should begin by identifying the specific passage or relationship asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Discuss Paul's teaching on marriage in Ephesians 5.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"Discuss Paul's teaching on marriage in Ephesians 5\" is a typical WAEC-style question on this topic."},{"q":"Which verse should be cited when discussing marriage as honourable?","o":["Galatians 5:22","Romans 6:23","Hebrews 13:4","1 Corinthians 13:1"],"a":2,"w":"Hebrews 13:4 should be cited when discussing marriage as honourable."},{"q":"Which chapter should be cited when discussing mutual submission and sacrificial love in marriage?","o":["Galatians 5","Romans 12","1 Corinthians 13","Ephesians 5"],"a":3,"w":"Ephesians 5 should be cited when discussing mutual submission and sacrificial love in marriage."},{"q":"Which passages should be cited when discussing parents and children?","o":["Ephesians 6:1-4 and Colossians 3:20-21","1 Corinthians 13 only","Romans 6 only","Galatians 5 only"],"a":0,"w":"Ephesians 6:1-4 and Colossians 3:20-21 should be cited when discussing parents and children."},{"q":"Which chapter should be cited when discussing Paul's teaching on marriage and singleness?","o":["Romans 12","1 Corinthians 7","Ephesians 4","Philippians 2"],"a":1,"w":"1 Corinthians 7 should be cited when discussing Paul's teaching on marriage and singleness."},{"q":"Why should WAEC essays connect these ancient instructions to modern family life?","o":["Only ancient history should ever be discussed","Modern application is irrelevant to WAEC marking","It shows the theology remains relevant to real Christian life today, not just history","WAEC forbids discussing modern family life"],"a":2,"w":"Connecting to modern family life shows the theology remains relevant today, which WAEC rewards."},{"q":"What should a strong WAEC essay conclusion on marriage and family include?","o":["A criticism of the Bible's reliability","Only a repetition of the Bible reference, with no further comment","An unrelated historical fact","A practical application for family life today"],"a":3,"w":"A strong conclusion should include a practical application for family life today."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS • Acts & Epistles',ti:'Mixed Questions — Marriage and Family',su:'Integrated revision across the New Testament\'s teaching on marriage and family relationships.',steps:[
{lb:'Summary of key themes',dr:dQ1,ht:'<p>The Epistles present marriage as <b>honourable</b> (Hebrews 13:4) and deeply significant (Ephesians 5:32), call for <b>mutual submission and sacrificial love</b> between spouses, instruct children to obey and parents to nurture without harshness, and value both marriage and singleness as legitimate callings for Christ\'s service.</p>'},

om","A purely legal, contractual arrangement","Christ's relationship with the Church","A relationship unrelated to Christian faith"],"a":2,"w":"Ephesians 5:32 presents marriage as a picture of Christ's relationship with the Church."},{"q":"What overall lesson unites the themes studied in this topic?","o":["Only marriage, not any other family relationship, matters spiritually","Domination and self-interest should characterise family relationships","Family relationships have no spiritual significance","Mutual respect, sacrificial love and fair treatment should characterise every family relationship"],"a":3,"w":"The unifying lesson is that mutual respect, sacrificial love and fair treatment should characterise every family relationship."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
