{lb:'Themes and connections',dr:dQ1,ht:'<p>Thematic connections: Faith → healing (sozo; "your faith has saved you"). Faith → Kingdom entry (Mark 1:15 "repent and believe"; John 3:3 "born again"). Faith → prayer (Luke 18:1-8 persistent widow; Matt.7:7-11 ask/seek/knock). Faith → discipleship (Matt.4:20 "at once they left their nets"). Faith → confession (Matt.16:16 Peter; John 20:28 Thomas). Faith → the Passion (disciples\' failure; women\'s faithfulness at the cross). Faith → resurrection (Matt.28:17 "when they saw him they worshipped him — though some doubted"). Faith → the Holy Spirit (John 14:12 — believers enabled to do Kingdom works by the Spirit). Faith is not a topic isolated from the rest of CRS — it is the connecting thread that runs through every theme.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>WAEC must-knows for Faith in the Gospels exam: (1) Definition — active trust, not intellectual belief only. (2) Sozo — both healed AND saved. (3) Faith spectrum — no faith, little faith, faith, great faith (with examples). (4) At least 5 faith examples — reference, situation, faith shown, Jesus\' response, one lesson. (5) Two people praised for "great faith" — centurion (Matt.8:10) and Syrophoenician woman (Matt.15:28) — both Gentiles. (6) Intercessory faith — four friends (Mark 2:5). (7) Persistent faith — widow (Luke 18); Jairus after daughter died (Mark 5:36). (8) Faith and doubt — Mark 9:24 "I believe; help my unbelief." (9) Thomas — John 20:28-29 highest Christological confession + blessing for later believers. (10) Always give specific references — WAEC examiners reward chapter and verse.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Which CORRECTLY identifies the meaning of the Greek word pistis and its significance in the Gospels?',o:['Pistis means "religious practice" — attendance at synagogue and temple','Pistis means "intellectual belief in correct doctrines" — agreeing with theological statements','Pistis means "faith/trust" — active, personal reliance on Jesus\' person and power, not merely intellectual agreement; it is the Gospel term for the trust that connects a person to Jesus\' saving work','Pistis means "baptism" — the visible sacrament through which faith is expressed'],a:3,w:'Pistis (πίστις) means trust or faith — active, personal reliance. In the Gospels, it consistently describes something that goes beyond intellectual assent: Bartimaeus threw off his cloak; the woman pushed through the crowd; the four friends broke the roof. This is pistis — active trust that reaches out to Jesus at personal cost and risk. It is the connection through which Jesus\' sozo (saving/healing power) flows to the person.'},{q:'The Parable of the Friend at Midnight (Luke 11:5-8) teaches about faith and prayer by showing:',o:['God will only answer prayer if asked politely and at the right time of day','We should never pray too early in the morning or too late at night','If a human friend will get up at midnight because of a neighbour\'s shameless persistence, how much more will God — who is perfectly loving and just — respond to those who persistently ask him','God gets annoyed by repeated prayer and prefers us to pray only once for each request'],a:3,w:'Luke 11:5-8 — the friend gets up "because of your shameless audacity" (some translations: "shameless persistence"). The logic is from lesser to greater: if a human friend (who is inconvenienced, who needs sleep) responds to persistent asking, then God — who is never inconvenienced, who loves his people, who is perfectly just — will certainly respond to those who persist in prayer. "Shameless boldness" in prayer is modelled and commended.'},{q:'Jesus\' statement "If you have faith as small as a mustard seed, you can say to this mountain, \'Go, throw yourself into the sea,\' and it will be done" (Matt 17:20) teaches:',o:['Mountain-moving miracles are the primary evidence of genuine Christian faith','Only specially gifted Christians can perform miracles of this magnitude','The power behind faith-based prayer is not the quantity of faith but the greatness of the God in whom we trust — even tiny genuine faith connects to unlimited divine power','This was a hyperbole meaning that faith usually does not accomplish much in practice'],a:3,w:'The mustard seed is proverbially tiny — yet genuine. The point is not the size of faith but its quality and the power of the One trusted: even tiny genuine faith, when placed in the almighty God who raised Jesus from the dead, can accomplish what seems impossible. "Nothing will be impossible for you" — the limitlessness comes from God\'s power, not the disciple\'s faith-strength. Size is irrelevant; genuineness is everything.'},{q:'Which of the following faith examples in the Gospels comes from John\'s Gospel rather than the Synoptics (Matthew, Mark or Luke)?',o:['Blind Bartimaeus crying out "Jesus, Son of David, have mercy on me!" (Mark 10)','The four friends lowering the paralysed man through the roof (Mark 2)','The persistent widow who kept coming before the judge (Luke 18)','Thomas confessing "My Lord and my God!" and Jesus\' blessing on those who believe without seeing (John 20:28-29)'],a:4,w:'Thomas\'s confession (John 20:28) and the blessing on those who believe without seeing (John 20:29) are found only in John\'s Gospel. John\'s unique purpose (20:31 — "written that you may believe") makes faith his central theme. The "I AM" statements, the Seven Signs, and the extended discourses all serve John\'s explicit goal: generating and sustaining faith that leads to eternal life.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
