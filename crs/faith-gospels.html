<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Faith in the Gospels — Key Examples',ACC,12,'middle',true));
[['Person','Act of Faith','Outcome'],['Blind Bartimaeus','Cried out despite rebukes; threw off cloak','Sight restored — Mark 10:46-52'],['Centurion','Trusted Jesus\' word alone from a distance','Servant healed — Matt 8:5-13'],['Woman with bleeding','Touched Jesus\' cloak in a crowd','Healed after 12 years — Mark 5:25-34'],['Four friends','Broke through roof to reach Jesus','Paralysed man healed — Mark 2:1-12'],['Jairus','Continued believing after daughter died','Daughter raised — Mark 5:21-43'],['Peter','Stepped out of boat onto water','Walked briefly — Matt 14:28-31'],['Syrophoenician woman','Persisted despite Jesus\' initial refusal','Daughter delivered — Mark 7:24-30']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(130,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(265,34+i*28,r[1],'#444',7,'middle',false));o.push(T(420,34+i*28,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Dimensions of Faith in the Gospels',ACC,12,'middle',true));
[['Dimension','Meaning','Key text'],['Trust','Personal reliance on Jesus\' power and goodness','Mark 9:23 "all things possible for one who believes"'],['Obedience','Faith that acts — stepping out, going, doing','John 2:5 "do whatever he tells you"'],['Persistence','Faith that continues despite obstacles or delay','Luke 18:1-8 persistent widow'],['Confession','Faith that speaks — "Jesus Son of David, have mercy"','Mark 10:47 Bartimaeus'],['Risk','Faith that leaves comfort — Peter on water','Matt 14:29'],['Humility','Faith that acknowledges unworthiness yet asks','Matt 8:8 centurion'],['Little faith','Faith that starts but fails under pressure','Matt 14:31 "you of little faith"']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(110,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(240,34+i*28,r[1],'#444',7,'middle',false));o.push(T(410,34+i*28,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Faith in the Gospels — Summary',ACC,13,'middle',true));
[['Definition','Trust in Jesus\' person and power — not blind belief but active reliance'],['Phrase','\"Your faith has healed/saved you\" (sozo) — Mark 5:34, 10:52, Luke 17:19'],['Key examples','Bartimaeus, centurion, woman with bleeding, four friends, Jairus'],['Obstacles to faith','Fear, little faith, hardness of heart (disciples in storm)'],['Faith and miracles','Jesus often required/noted faith before/after healing'],['WAEC tip','Know at least 4 examples; explain faith shown; link to sozo meaning']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(130,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Gospels',ti:'What is Faith?',su:'Examine the nature of faith as taught in the Gospels.',steps:[
{lb:'Faith — definition and components',dr:dQ2,ht:'<p>In the Gospels, <b>faith</b> (Greek: <em>pistis</em>) is not blind belief but <b>active trust in Jesus\' person and power</b>. Key components: (1) <b>Trust</b> — personal reliance on Jesus: "all things are possible for one who believes" (Mark 9:23). (2) <b>Obedience</b> — faith that acts; "do whatever he tells you" (John 2:5); "go and show yourself to the priest" (Luke 17:14). (3) <b>Confession</b> — faith that speaks; Bartimaeus crying "Jesus, Son of David, have mercy on me!" (Mark 10:47). (4) <b>Persistence</b> — faith that continues despite obstacles; the persistent widow (Luke 18:1-8). (5) <b>Risk</b> — faith that leaves the safety of the boat; Peter stepping onto the water (Matt.14:28-29).</p>'},
{lb:'"Your faith has saved you" — sozo',dr:dQ2,ht:'<p>Jesus repeatedly used the phrase <em>"Your faith has saved/healed you"</em> (Greek: <em>sozo</em> = both healed and saved). Key occurrences: (1) The woman with the bleeding (Mark 5:34): "Daughter, your faith has saved you. Go in peace and be freed from your suffering." (2) Blind Bartimaeus (Mark 10:52): "Go, your faith has saved you." (3) The tenth leper (Luke 17:19 — the Samaritan who returned): "Rise and go; your faith has saved you." The Greek word <em>sozo</em> carries both physical and spiritual dimensions — the healing is a sign of the greater spiritual salvation. Faith is the link between the person and Jesus\' saving power.</p>'},
{lb:'Faith and miracles',dr:dQ2,ht:'<p>In the Gospels, there is a consistent connection between faith and miracles: (1) Jesus often <b>noticed or commended faith</b> before healing: "seeing their faith" (Mark 2:5 — the four friends). (2) Jesus sometimes asked about faith: "Do you believe I am able to do this?" (Matt.9:28). (3) <b>Lack of faith limited miracles</b>: "He did not do many miracles there because of their lack of faith" (Matt.13:58 — Nazareth). (4) Jesus marvelled at great faith: "I have not found such great faith even in Israel" (Matt.8:10 — the centurion). (5) Jesus rebuked <b>little faith</b>: "You of little faith, why did you doubt?" (Matt.14:31 — Peter). Faith is not a technique for obtaining miracles but a relationship of trust that opens the person to receive what God gives.</p>'},
{lb:'Faith in the OT vs Gospels',dr:dQ1,ht:'<p>Faith in the Gospels is continuous with OT faith but focuses on Jesus. OT faith: Abraham believed God and it was credited to him as righteousness (Gen.15:6). Moses chose suffering with God\'s people over Egypt\'s pleasures (Heb.11:25). The prophets trusted God\'s word despite persecution. Gospel faith adds: (1) Faith specifically in <b>Jesus as Messiah and Lord</b>. (2) Faith in <b>Jesus\' healing power</b> — a new specific dimension. (3) Faith connects to <b>new birth and eternal life</b>: "that everyone who believes in him may have eternal life" (John 3:16). (4) Faith is expressed as <b>confession</b>: "You are the Messiah, the Son of the living God" (Matt.16:16 — Peter). The Gospels present Jesus as the object of faith in a way that goes beyond OT faith in God\'s word.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Greek word "sozo" used in "Your faith has saved/healed you" is significant because:',o:['It was a polite farewell phrase with no deeper meaning','It means only physical healing — Jesus was only concerned with the body','It carries both "healed" and "saved" meanings — the physical healing is a sign of the deeper spiritual salvation; faith links the person to Jesus\' saving power','It means specifically "made religiously acceptable" in the Jewish temple system'],a:3,w:'Sozo (σῴζω) means both to heal physically and to save spiritually — and this double meaning is intentional. The physical healing Jesus performed was always a sign of the greater spiritual salvation he offers. Faith — the active trust that brought the person to Jesus — is the connection that received both dimensions of his saving work.'},{q:'Jesus said "He did not do many miracles there because of their lack of faith" (Matt 13:58) about which place?',o:['Jerusalem — the religious capital where the Pharisees controlled the population','The Gentile region of the Decapolis where idol worship dominated','Nazareth — his hometown, where familiarity bred contempt and people took offence at him','The wilderness where the temptation took place'],a:3,w:'Matthew 13:58 (Mark 6:6) — Jesus returned to Nazareth, his hometown. The people took offence: "Is this not the carpenter\'s son?" Familiarity created contempt that blocked faith. Jesus "did not do many miracles there because of their lack of faith." This shows that faith is not a technique to force God to act but a relational openness that receives what God gives.'},{q:'The centurion\'s faith was described by Jesus as greater than any in Israel (Matt 8:10) because:',o:['He had read more of the Hebrew scriptures than any Jewish scholar of his time','He trusted Jesus\' word alone from a distance — without needing Jesus to come and touch his servant, demonstrating extraordinary reliance on the authority of Jesus\' spoken word','He had performed many good deeds for the Jewish community in Capernaum','He had already believed in Jesus before the miracle took place and did not need healing'],a:2,w:'The centurion said: "Lord, I do not deserve to have you come under my roof... just say the word, and my servant will be healed" (Matt.8:8). He understood authority: just as he commanded soldiers by word alone, he trusted Jesus\' word had absolute power over disease — no physical presence needed. This level of faith in Jesus\' word surpassed what Jesus had found among Jews.'},{q:'When Jesus rebuked Peter saying "you of little faith, why did you doubt?" (Matt 14:31), what had happened?',o:['Peter refused to step out of the boat when Jesus called him','Peter began walking on water but became frightened by the wind and began to sink','Peter denied knowing Jesus in the high priest\'s courtyard','Peter argued with Jesus about who was the greatest in the Kingdom'],a:2,w:'Peter stepped out of the boat and walked on water toward Jesus (Matt.14:28-29) — genuine faith. But when "he saw the wind, he was afraid and, beginning to sink, cried out" (14:30). "Little faith" means faith that started well but failed under pressure — not no faith, but fear that transferred Peter\'s focus from Jesus to the storm. His faith was real but insufficient to sustain under trial.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Gospels',ti:'Examples of Faith in the Gospels',su:'Examine specific examples of faith from the Gospel narratives.',steps:[
{lb:'Blind Bartimaeus (Mark 10:46-52)',dr:dQ1,ht:'<p>Blind Bartimaeus sat begging outside Jericho. Hearing Jesus was passing, he cried: <em>"Jesus, Son of David, have mercy on me!"</em> The crowd rebuked him to be quiet — he cried louder. Jesus called him. Bartimaeus <b>threw off his cloak</b> (his only possession, essential for a beggar), jumped up, and came to Jesus. Jesus asked: "What do you want me to do for you?" Bartimaeus: "Rabbi, I want to see." Jesus: <em>"Go, your faith has healed you."</em> Immediately he received sight and followed Jesus. Faith demonstrated: (1) Confession under pressure. (2) Persistence despite rebuke. (3) Reckless abandonment of security (throwing off the cloak). (4) A clear specific request. (5) Immediate follow-through (he followed Jesus on the road).</p>'},
{lb:'The woman with the bleeding (Mark 5:25-34)',dr:dQ1,ht:'<p>A woman who had suffered bleeding for 12 years, spent all her money on doctors with no improvement, heard about Jesus and approached from behind in the crowd. She thought: <em>"If I just touch his clothes, I will be healed."</em> She touched his cloak and immediately felt healed. Jesus felt power go out from him and asked: "Who touched me?" Despite the crowd, she came forward trembling and fell at his feet, telling the whole truth. Jesus said: <em>"Daughter, your faith has saved you. Go in peace and be freed from your suffering."</em> Faith shown: (1) Creative problem-solving (approaching from behind). (2) Bold action despite social prohibition (a bleeding woman was ritually unclean — touching was forbidden). (3) Honesty when confronted. (4) The faith was hers alone — she believed before the healing happened.</p>'},
{lb:'The four friends (Mark 2:1-12)',dr:dQ1,ht:'<p>Jesus was in a house in Capernaum, so packed that no one could get in. Four men brought their paralysed friend on a mat. Unable to reach Jesus through the crowd, they <b>dug through the roof</b> and lowered the mat down. Jesus saw their faith and said: "Son, your sins are forgiven." The scribes accused him of blasphemy; Jesus healed the man to prove his authority to forgive. Faith shown: (1) Teamwork — four friends worked together. (2) Creative persistence — found an alternative route when the door was blocked. (3) The faith of others — Jesus saw THEIR faith and healed the man. (4) Faith that overcomes physical obstacles (the roof was literally their barrier). (5) Unconditional advocacy — they brought him even though he may not have asked or been able to ask.</p>'},
{lb:'The centurion (Matt 8:5-13)',dr:dQ1,ht:'<p>A Roman centurion came to Jesus asking him to heal his servant (paralysed and suffering). Jesus offered to go and heal him. The centurion replied: <em>"Lord, I do not deserve to have you come under my roof. But just say the word, and my servant will be healed."</em> He explained that he understood authority: soldiers obeyed his word — disease would obey Jesus\' word. Jesus marvelled: <em>"I have not found such great faith in Israel."</em> He healed the servant from a distance. Faith shown: (1) Deep humility ("I do not deserve"). (2) Profound trust in Jesus\' spoken word alone. (3) Understanding of Jesus\' authority (comparing it to military command). (4) Crossing social/ethnic boundaries (a Roman officer approaching a Jewish rabbi). (5) Intercessory faith — faith on behalf of another.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Bartimaeus threw off his cloak when Jesus called him. This detail is significant because:',o:['It was a social custom to remove outer garments when approaching a rabbi','It was cold that day and the cloak was heavy — practical convenience','The cloak was a beggar\'s only possession and essential equipment; throwing it away showed reckless abandonment of his security — total commitment to reaching Jesus','He was showing respect by removing his clothing before a teacher'],a:3,w:'A beggar\'s cloak was his sleeping bag, his begging mat, and his only possession. Throwing it away (rather than carefully folding it) before he could even see if Jesus would help him showed extraordinary faith: he committed totally to Jesus before receiving the answer. It was an act of reckless, joyful abandonment of the only security he had.'},{q:'The healing of the woman with the bleeding (Mark 5:25-34) shows that faith can be:',o:['Only effective when asked for by the person in need','Only effective when prayer is made publicly in the synagogue','Creative and bold — she found a way through social and physical obstacles (ritual uncleanness; crowd) by approaching from behind in private, trusting that even touching Jesus\' cloak would be enough','Effective only when the person is already ritually clean and acceptable according to the Law of Moses'],a:3,w:'The woman\'s faith was creative (approaching from behind), bold (touching despite ritual uncleanness prohibition — she would make Jesus "unclean" by touching him), private (she sought healing quietly, not publicly), and specific ("if I just touch his clothes"). Jesus honoured this faith even though it broke conventional rules — her trust in his power surpassed concern for ritual protocol.'},{q:'When Jesus saw the four friends lowering the paralysed man through the roof (Mark 2:1-12), the text says "seeing THEIR faith" — this teaches:',o:['Only the paralysed man\'s own faith was counted by Jesus — the friends were irrelevant','Faith is always and only personal — intercessory faith on behalf of others has no effect','The faith of others can be the pathway for God\'s healing action — we can intercede with genuine faith for those who cannot come themselves','Jesus was impressed by the engineering skill of breaking through the roof, which he interpreted as a sign'],a:3,w:'Mark 2:5 — "seeing their faith" — Jesus responded to the faith of the four friends, not only the paralysed man\'s. This demonstrates intercessory faith: the persistent, creative, barrier-breaking faith of others opened the way for healing. This has profound implications for prayer: we can genuinely intercede for those who are spiritually or physically paralysed and cannot come themselves.'},{q:'The centurion\'s statement "just say the word, and my servant will be healed" demonstrated faith in:',o:['The physical presence of Jesus, which he believed was necessary for healing to occur','Jesus\' authority — his spoken word had power over disease, just as a military officer\'s spoken word had power over soldiers','The Jewish religious system, which the centurion had studied and adopted as a Roman convert','A magical formula he had learned from Jewish rabbis in Capernaum'],a:2,w:'The centurion understood authority: a commander does not need to be physically present — his authoritative word is enough. He applied this to Jesus: "just say the word" — meaning Jesus\' spoken word alone had absolute power over disease regardless of physical distance. This insight into Jesus\' authority exceeded what Jesus had found among Jews, who generally expected physical presence and touch.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Gospels',ti:'Persistent Faith',su:'Examine faith that persists despite delay, obstacles or apparent refusal.',steps:[
{lb:'The Persistent Widow (Luke 18:1-8)',dr:dQ2,ht:'<p>Jesus told the parable of a persistent widow and an unjust judge to teach that disciples "should always pray and not give up" (Luke 18:1). A widow repeatedly came to a judge asking for justice. The judge had no fear of God or respect for people. Eventually he thought: "even though I don\'t fear God or care for people, yet because this widow keeps bothering me, I will see that she gets justice" (18:4-5). Jesus concluded: "And will not God bring about justice for his chosen ones, who cry out to him day and night? Will he keep putting them off? I tell you, he will see that they get justice, and quickly" (18:7-8). If even an unjust judge relents, how much more will a loving God respond to persistent prayer.</p>'},
{lb:'The Syrophoenician/Canaanite woman (Mark 7:24-30; Matt 15:21-28)',dr:dQ2,ht:'<p>A Gentile woman (Syrophoenician in Mark; Canaanite in Matthew) came to Jesus asking him to heal her demon-possessed daughter. Jesus initially seemed to refuse: "I was sent only to the lost sheep of Israel." She knelt and pleaded. Jesus said: "It is not right to take the children\'s bread and toss it to the dogs." She replied: <em>"Yes it is, Lord. Even the dogs eat the crumbs that fall from their master\'s table."</em> Jesus said: "Woman, you have great faith! Your request is granted." Her daughter was healed that very hour. Her faith: (1) Persisted despite apparent refusal. (2) Accepted the hierarchy ("dogs/children") but found a place within it ("crumbs"). (3) Was specifically called "great faith" by Jesus — one of only two times (centurion being the other).</p>'},
{lb:'Jairus (Mark 5:21-43)',dr:dQ2,ht:'<p>Jairus, a synagogue ruler, fell at Jesus\' feet and begged him to heal his dying daughter. While Jesus was on the way (delayed by the healing of the woman with bleeding), news came: "Your daughter is dead. Why bother the teacher any more?" Jesus told Jairus: <em>"Don\'t be afraid; just believe."</em> He continued to the house, put the mourners out, took Peter, James and John with him, took the girl\'s hand and said "Talitha kum!" (Little girl, get up!). She stood up and walked. Faith required: Jairus had to continue believing after receiving the worst possible news — his daughter was already dead. "Just believe" — Jesus called him to sustain faith at the moment when faith seemed most futile. This models faith that holds on when circumstances say it is too late.</p>'},
{lb:'Disciples and little faith',dr:dQ2,ht:'<p>Jesus also addressed <b>failures of faith</b> among his disciples: (1) <b>Storm on the lake</b> (Matt.8:23-27): disciples woke Jesus in panic; Jesus rebuked them: "You of little faith, why are you so afraid?" (2) <b>Peter on the water</b> (Matt.14:28-31): faith started, faltered under fear. (3) <b>Failure to cast out a demon</b> (Matt.17:14-21): disciples could not cast out a demon; Jesus said their failure was due to "too little faith" — "if you have faith as small as a mustard seed" you can move mountains. (4) <b>Post-resurrection doubt</b> (Matt.28:17): even at the resurrection appearance "some doubted." "Little faith" (<em>oligopistia</em>) is a recurring theme — Jesus challenges disciples to deeper, more trusting faith than they naturally possess.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Parable of the Persistent Widow (Luke 18:1-8) teaches disciples to:',o:['Accept injustice patiently since God will eventually punish the wrongdoer in the afterlife','Always pray and not give up — if even an unjust human judge eventually responds to persistence, how much more will a loving God respond to those who cry out to him day and night','Avoid judges and courts since they are all corrupt and unjust','Pray only once for each specific request, trusting God heard and not being repetitive'],a:2,w:'Luke 18:1-8 — Jesus told the parable specifically so disciples "should always pray and not give up" (18:1). The argument is from the lesser to the greater: if an unjust, uncaring judge relents because of persistence, then God — who loves his people and is perfectly just — will certainly respond to those who persist in prayer. Persistence in prayer reflects trust in God\'s character.'},{q:'The Syrophoenician woman\'s response "even the dogs eat the crumbs from their master\'s table" demonstrated:',o:['Anger at being compared to a dog — she was correcting Jesus\' offensive comparison','Resigned acceptance that she was not worthy of full healing','Persistent, humble, creative faith — she accepted the apparent limitation ("dogs/children") but found within it a place for her request; Jesus called this "great faith"','A clever debating trick she had learned from Jewish merchants in Tyre'],a:3,w:'The woman\'s response was a masterpiece of humble persistence: she did not deny the children/dogs distinction but found her place within it — even dogs get crumbs. She was not claiming equality with the children (Israel) but only the overflow of grace. Jesus called this "great faith" — one of only two people Jesus specifically praised for having great faith (the centurion being the other). Persistent, humble trust that finds a way.'},{q:'Jesus said to Jairus "Don\'t be afraid; just believe" (Mark 5:36) at the moment when:',o:['Jairus first approached Jesus in the synagogue to ask for help','Jairus\'s daughter had died and messengers told him it was too late to bother Jesus any more','Jairus was prevented from reaching Jesus by the large crowd following him','The disciples told Jairus that Jesus was too tired to perform another miracle that day'],a:2,w:'The timing is crucial: Jairus had to maintain faith at the moment of apparent total defeat — his daughter was already dead, and a messenger told him not to trouble Jesus any more. "Just believe" — Jesus called him to sustain faith precisely when all hope seemed gone. This models the deepest kind of faith: continuing to trust God when circumstances seem to have made the request permanently unanswerable.'},{q:'Jesus said the disciples could not cast out a demon (Matt 17:14-21) because of their "little faith." He then said:',o:['"You must pray for seven days before attempting exorcism"','"If you have faith as small as a mustard seed, you can say to this mountain, Move from here to there, and it will move. Nothing will be impossible for you"','"Some demons can only be cast out by the High Priest after proper temple sacrifice"','"You need to fast for 40 days as I did before you can perform such powerful miracles"'],a:2,w:'Matthew 17:20 — "if you have faith as small as a mustard seed, you can say to this mountain, \'Move from here to there,\' and it will move. Nothing will be impossible for you." This astonishing promise follows the rebuke for little faith: even tiny faith, if genuine, has enormous power because it connects to God\'s unlimited power. The disciples\' failure was not lack of method but lack of trust.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Gospels',ti:'Faith and Confession',su:'Examine faith expressed through words — confession and testimony.',steps:[
{lb:'Peter\'s confession (Matt 16:13-16)',dr:dQ2,ht:'<p>At Caesarea Philippi, Jesus asked: "Who do you say I am?" Peter replied: <em>"You are the Messiah, the Son of the living God."</em> Jesus said: "Blessed are you, Simon, for this was not revealed to you by flesh and blood, but by my Father in heaven." This is the supreme confession of faith in the Gospels: (1) It is <b>personally voiced</b> — "you say" (not what others say). (2) It is <b>divinely revealed</b> — not deduced by human reasoning but given by the Father. (3) It names Jesus correctly: Messiah (the expected deliverer) and Son of the living God (divine identity). (4) It becomes the <b>foundation of the church</b> (16:18) — the community of faith is built on this confession. Confessing faith is not merely reporting a belief but acknowledging a living relationship.</p>'},
{lb:'Thomas\'s confession (John 20:28)',dr:dQ2,ht:'<p>Thomas, who had not been present when the risen Jesus appeared, refused to believe without seeing the wounds: "Unless I see the nail marks in his hands... I will not believe." A week later Jesus appeared again, and said to Thomas: "Put your finger here; see my hands. Reach out your hand and put it into my side. Stop doubting and believe." Thomas responded: <em>"My Lord and my God!"</em> Jesus said: "Because you have seen me, you have believed; blessed are those who have not seen and yet have believed." Thomas\'s confession is the <b>climax of John\'s Gospel</b>: the highest Christological statement in any Gospel. And the blessing on those who believe without seeing (John 20:29) applies directly to all subsequent believers.</p>'},
{lb:'The ten lepers — faith and thanksgiving (Luke 17:11-19)',dr:dQ2,ht:'<p>Ten lepers called to Jesus from a distance; he told them to show themselves to the priests. <em>"As they went, they were cleansed."</em> One — a Samaritan — seeing he was healed, returned, threw himself at Jesus\' feet and thanked him. Jesus said: "Were not all ten cleansed? Where are the other nine? Has no one returned to give praise to God except this foreigner?" Jesus told him: <em>"Rise and go; your faith has saved you."</em> Only the returning Samaritan received the full depth of healing ("sozo" — saved). This teaches: (1) All ten had faith enough to obey Jesus\' command (go to the priests). (2) Only one expressed gratitude and worship. (3) Full saving faith includes acknowledgment and worship, not just obtaining the desired benefit.</p>'},
{lb:'Faith and doubt — a spectrum',dr:dQ2,ht:'<p>The Gospels present faith as a <b>spectrum</b>, not a binary state: (1) <b>No faith</b> — Nazareth (Matt.13:58); hardness of heart. (2) <b>Little faith</b> (oligopistia) — Peter on water; disciples in storm; disciples who could not cast out the demon. (3) <b>Faith</b> — the normal expectation; "your faith has healed you." (4) <b>Great faith</b> (Matthew only uses this twice) — the centurion (Matt.8:10); the Syrophoenician woman (Matt.15:28). (5) <b>Growing faith</b> — the disciples before and after Pentecost show faith developing. This spectrum challenges simplistic views: faith can coexist with doubt ("I believe; help my unbelief!" — Mark 9:24). The honest cry for more faith is itself an act of faith.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Thomas\'s confession "My Lord and my God!" (John 20:28) is significant because:',o:['It was a polite Jewish greeting used when greeting teachers','It was the highest Christological statement in any Gospel — Thomas confessed Jesus\' full divine identity after doubting; and Jesus blessed those who believe without seeing','Thomas was speaking sarcastically, not genuinely confessing faith','It is the only Gospel text where a human being addresses another human as God, which Jesus later corrected'],a:2,w:'Thomas\' "My Lord and my God!" is the highest confession of faith in John\'s Gospel — the climax of John\'s entire narrative, which opened with "the Word was God" (1:1). After doubting, Thomas moves to the fullest possible confession. Jesus\' blessing on those who believe without seeing (John 20:29) directly addresses the situation of all subsequent Christians who cannot see Jesus physically.'},{q:'In the story of the ten lepers (Luke 17:11-19), only the returning Samaritan received "sozo" (saved) because:',o:['The other nine were Jews and Jews were not allowed to be saved by Jesus','The other nine went to the wrong priest and therefore their healing was invalid','He returned, threw himself at Jesus\' feet in worship, and gave thanks — his faith moved from obtaining a benefit to acknowledging Jesus as Lord; full saving faith includes gratitude and worship, not just receiving the healing','He was more sinful than the others and needed a greater miracle'],a:3,w:'All ten lepers were cleansed physically (they all obeyed and went to the priests). But only the Samaritan returned in gratitude and worship. Jesus\' word "your faith has saved you" (sozo) was spoken to him alone — suggesting he received something beyond physical cleansing: full spiritual salvation. Full saving faith involves more than obtaining benefits from Jesus — it includes acknowledgment of his lordship in worship and gratitude.'},{q:'The father\'s cry "I believe; help my unbelief!" (Mark 9:24) teaches that:',o:['Genuine faith must be total and certain before God will act — partial faith is not honoured','Faith and doubt cannot coexist in the same person — you are either a believer or an unbeliever','Honest acknowledgment of incomplete faith and crying to God for more is itself an act of faith — God responds to the honest, humble request for greater faith','This man\'s faith was insufficient and Jesus only healed his son out of pity, not faith'],a:3,w:'The father in Mark 9:24 is one of the most honestly human figures in the Gospels: he believes but his faith is partial and he knows it. His cry — "help my unbelief!" — is simultaneously a confession of faith (I believe) and a plea for more faith. Jesus responded by healing the boy. This shows that God honours honest, humble faith even when mixed with doubt — the honesty itself is a form of trust.'},{q:'Jesus said "Blessed are those who have not seen and yet have believed" (John 20:29). This blessing was addressed to:',o:['The disciples who were present at the resurrection appearance but still doubted','Thomas specifically — because he eventually believed after seeing the wounds','All subsequent believers — including everyone who reads John\'s Gospel — who believe in the risen Jesus without physical sight','The women who first saw the empty tomb and believed before the male disciples'],a:3,w:'John 20:29 is addressed beyond Thomas to all future believers — including the readers of John\'s Gospel. "Those who have not seen" = everyone who has lived since the resurrection. This blessing directly addresses the situation of all Christians throughout history who believe without physical sight of the risen Jesus. It validates and honours faith that rests on testimony and the Spirit rather than direct physical experience.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Gospels',ti:'Faith and Discipleship',su:'Examine faith as the foundation of following Jesus.',steps:[
{lb:'Faith and the call to follow',dr:dQ1,ht:'<p>Faith in the Gospels leads to discipleship — following Jesus. When the disciples were called, their response was immediate (Matt.4:20,22 — "at once they left their nets and followed him"). This immediacy was an act of faith: (1) They left their livelihoods without a guarantee. (2) They followed someone who had no settled home ("nowhere to lay his head" — Matt.8:20). (3) They could not see where the journey would lead. The call "Follow me" required faith precisely because the destination and cost were unknown. The rich young ruler\'s failure (Matt.19:22) shows what faith-less discipleship looks like: receiving the call but refusing to act on it. Faith is not just believing something — it is the trust that enables you to leave your nets.</p>'},
{lb:'Faith in prayer',dr:dQ2,ht:'<p>Jesus connected faith closely to prayer: (1) "Ask and it will be given to you; seek and you will find; knock and the door will be opened" (Matt.7:7) — an implied promise that trusting prayer receives response. (2) "If you have faith and do not doubt... if you say to this mountain, \'Go, throw yourself into the sea,\' it will be done" (Matt.21:21-22). (3) "Whatever you ask for in prayer, believe that you have received it, and it will be yours" (Mark 11:24). (4) The Lord\'s Prayer begins with addressing God as Father — the posture of a child trusting a good parent, which is faith expressed in address. (5) Gethsemane — Jesus\' prayer "yet not as I will but as you will" (Matt.26:39) — perfect faith that trusts the Father even when it means the cross.</p>'},
{lb:'Faith and the cross',dr:dQ2,ht:'<p>The disciples\' faith was severely tested at the cross. All the male disciples fled (Matt.26:56). Peter denied Jesus three times (Matt.26:69-75). The women remained at the cross (Matt.27:55-56), showing a different kind of faithfulness. The disciples on the Emmaus road were walking away in despair: "We had hoped he was the one to redeem Israel" (Luke 24:21). The resurrection restored their faith: "When they saw him, they worshipped him" (Matt.28:17). The cross is the ultimate test of faith: the disciples\' failure at the cross — and their restoration at the resurrection — shows that faith can survive failure when it returns to Jesus.</p>'},
{lb:'Faith for today',dr:dQ2,ht:'<p>The Gospels\' teaching on faith has direct application: (1) <b>Faith is active</b> — the four friends broke the roof; Bartimaeus threw off his cloak; the woman pushed through the crowd. "Dead faith" (James 2:17) that does not act is not Gospel faith. (2) <b>Faith can be small and grow</b> — "mustard seed faith" (Matt.17:20) is the beginning, not the end. (3) <b>Faith overcomes fear</b> — "Do not be afraid; just believe" (Mark 5:36). (4) <b>Faith prays persistently</b> — the persistent widow; "always pray and not give up" (Luke 18:1). (5) <b>Faith confesses</b> — "You are the Messiah" (Matt.16:16); "My Lord and my God" (John 20:28). Practical faith is the response to Jesus that the Gospels consistently call for and model.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The immediate response of the first disciples ("at once they left their nets and followed him" — Matt 4:20) was primarily an act of faith because:',o:['They already knew Jesus well from synagogue and had discussed the decision for months','They could see exactly where following Jesus would lead — security and a position in his new government','They left their livelihoods without a guaranteed destination, following someone with no fixed home — trusting Jesus without knowing the full cost','They were ordered by the Roman authorities to accompany Jesus as a community service requirement'],a:3,w:'The immediacy ("at once") and totality ("left their nets" — their whole livelihood) of the response was an act of faith precisely because the destination was unknown. Jesus had no fixed home, no salary, no guaranteed outcome. Trusting him with their lives and livelihoods, without seeing where the journey would lead, is the structure of faith that the Gospels present throughout.'},{q:'Jesus\'s prayer in Gethsemane "yet not as I will but as you will" (Matt 26:39) models which aspect of faith?',o:['Faith that demands the removal of all suffering before being able to follow God\'s will','Faith that trusts the Father even when the path leads through the cross — faith that surrenders personal preference to God\'s plan','Faith that refuses to accept that suffering is part of God\'s will','Faith that relies on miraculous rescue from all dangerous situations'],a:2,w:'Gethsemane is the supreme model of faith under pressure: Jesus genuinely asked for the cup to be taken away ("if it is possible" — his human will). But his submission: "yet not as I will but as you will" — shows faith that trusts the Father\'s plan even when that plan involves the cross. This is not passive resignation but active surrender; not the absence of feeling but the triumph of trust.'},{q:'The disciples who fled at the arrest of Jesus (Matt 26:56) showed:',o:['That they were never true believers — genuine faith would never have failed','The failure of faith under extreme pressure — but their restoration after the resurrection shows that faith can survive failure when it returns to Jesus','That following Jesus was purely intellectual for them and had no real personal dimension','That Jesus had set up a plan for them to flee so they would be safe'],a:2,w:'The disciples\' flight (Matt.26:56) and Peter\'s denial (26:69-75) represent real failures of faith under extreme pressure. But the story does not end there: the risen Jesus restored them ("go and tell my disciples" — 28:10; "Feed my sheep" — John 21:17). The disciples\' experience shows that faith can survive failure — the key is returning to Jesus, as Peter did (John 21).'},{q:'Jesus said "if you have faith as small as a mustard seed... nothing will be impossible for you" (Matt 17:20). The point of "mustard seed faith" is:',o:['Even the smallest plant produces some fruit, so any effort is rewarded','The quality and genuineness of faith matters more than its size — even tiny genuine trust in God connects to his unlimited power and can accomplish what seems impossible','Christians who feel their faith is small are automatically excluded from miracles','This was only for the twelve disciples in the first century and does not apply to believers today'],a:2,w:'A mustard seed is tiny — the smallest you can plant. Yet when genuine, it grows and produces. Jesus\' point: it is not the size or strength of your faith that determines what God does, but the genuineness of the trust and the greatness of the God you trust. Even tiny genuine faith connects you to God\'s unlimited power. "Nothing will be impossible" — not because of your faith\'s strength, but because of God\'s power working through genuine trust.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 Gospels',ti:'WAEC Prep — Faith in the Gospels',su:'Practise WAEC-style questions on faith.',steps:[
{lb:'WAEC essay approach',dr:dQ1,ht:'<p>For WAEC essays on faith in the Gospels: Common questions: "Describe TWO/THREE examples of faith in the Gospels and state lessons from each." "What qualities of faith did Jesus commend in those he healed?" "Examine what the Gospels teach about the nature of faith." For each example: (1) Name the person and give the biblical reference. (2) Describe the situation briefly. (3) Identify the specific faith shown (persistence, humility, risk, trust in Jesus\' word, etc.). (4) State what Jesus said about their faith. (5) Give one lesson for Christians today. Essential examples: Bartimaeus; woman with bleeding; four friends; centurion; Jairus; Syrophoenician woman; persistent widow; Thomas; ten lepers (returning Samaritan).</p>'},
{lb:'Key references',dr:dQ2,ht:'<p>Essential faith references for WAEC: "Your faith has saved you" — Mark 5:34 (woman with bleeding); Mark 10:52 (Bartimaeus); Luke 17:19 (Samaritan leper). "I have not found such great faith in Israel" — Matt.8:10 (centurion). "Woman, you have great faith!" — Matt.15:28 (Syrophoenician woman). "Seeing their faith" — Mark 2:5 (four friends). "Do not be afraid; just believe" — Mark 5:36 (Jairus). "You of little faith, why did you doubt?" — Matt.14:31 (Peter). "I believe; help my unbelief!" — Mark 9:24. "If you have faith as small as a mustard seed" — Matt.17:20. "My Lord and my God!" — John 20:28 (Thomas). "Blessed are those who have not seen and yet have believed" — John 20:29.</p>'},
{lb:'Common mistakes',dr:dQ2,ht:'<p>Avoid: Saying faith always results in healing (faith does not guarantee healing — it opens the person to receive what God gives; Jesus healed according to his own will). Confusing "sozo" (saved/healed) with purely physical healing. Saying Thomas\'s faith was "weak" — his final confession "My Lord and my God" is the highest faith statement in John\'s Gospel. Forgetting to give biblical references — examiners specifically reward chapter and verse. Saying the centurion was Jewish (he was a Roman Gentile). Confusing the Persistent Widow parable (Luke 18 — about prayer) with the Prodigal Son (Luke 15 — about forgiveness). Describing faith only as intellectual belief — in the Gospels faith is active trust, not just mental agreement.</p>'},
{lb:'WAEC final tips — faith',dr:dQ1,ht:'<p>Final WAEC tips: (1) Define faith clearly — "active trust in Jesus\' person and power, not merely intellectual belief." (2) Know the meaning of "sozo" — both healed and saved; faith connects to both physical and spiritual dimensions. (3) Know the faith spectrum: no faith (Nazareth); little faith (disciples in storm; Peter on water); great faith (centurion; Syrophoenician woman). (4) Know at least 4 specific examples with references, the faith they showed, and Jesus\' response. (5) Connect faith to prayer — persistent widow; Gethsemane. (6) Note that the Gospels present faith as active (four friends broke through a roof; Bartimaeus threw off his cloak; the woman pushed through a crowd). (7) Thomas\'s confession (John 20:28) and the blessing on those who believe without seeing (John 20:29) are key Johannine faith texts.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Syrophoenician/Canaanite woman was one of only TWO people in the Gospels that Jesus described as having "great faith." The other was:',o:['Blind Bartimaeus','Simon Peter after his confession','The Roman centurion whose servant Jesus healed from a distance','Jairus, who continued to believe after his daughter died'],a:3,w:'Jesus described "great faith" specifically in only two cases: (1) The centurion: "I have not found such great faith even in Israel" (Matt.8:10). (2) The Syrophoenician/Canaanite woman: "Woman, you have great faith!" (Matt.15:28). Both were Gentiles — neither was a member of the Jewish covenant community. This is theologically significant: the greatest examples of faith in the Gospels were outsiders.'},{q:'What does the story of the four friends (Mark 2:1-12) teach specifically about intercessory faith?',o:['Intercessory faith (faith on behalf of others) is ineffective — only personal faith counts','Only prayer in the synagogue counts as genuine intercession','The faith of others can open the way for healing — "seeing their faith" (Mark 2:5), Jesus responded to the four friends and healed their paralysed companion; we can intercede for those who cannot come themselves','Jesus only healed the paralysed man because of the man\'s own faith, not the friends\''],a:3,w:'Mark 2:5 — "seeing their faith" (the four friends, not just the paralysed man). This is the clearest Gospel text on intercessory faith: the faith of others opened the way. The paralysed man could not come himself; the friends\' persistent, creative, barrier-breaking faith brought him to Jesus. This has profound implications for prayer: we can genuinely intercede with faith for those spiritually or physically paralysed.'},{q:'The faith spectrum in the Gospels runs from:',o:['Perfect faith (disciples) to no faith (Pharisees)','No faith (e.g. Nazareth — lack of faith limited miracles) through little faith (disciples in storm; Peter on water) to great faith (centurion; Syrophoenician woman) — with honest faith mixed with doubt (Mark 9:24 father) somewhere in between','Either faith or no faith — the Gospels present a binary','Complete faith (before conversion) to growing faith (after conversion)'],a:2,w:'The Gospels present faith as a spectrum: no faith (Nazareth — Matt.13:58); little faith/oligopistia (disciples in storm, Peter on water, disciples who could not exorcise — Matt.8:26; 14:31; 17:20); genuine faith receiving healing/sozo (Bartimaeus, woman with bleeding); and great faith specifically praised (centurion, Syrophoenician woman). Honest faith mixed with doubt (Mark 9:24) falls between these — and is honoured.'},{q:'Which Gospel specifically records the blessing "Blessed are those who have not seen and yet have believed" (John 20:29)?',o:['Matthew — in the Great Commission','Mark — after the resurrection appearance to the disciples','Luke — in the Emmaus road account','John — spoken by the risen Jesus to Thomas after his confession'],a:4,w:'John 20:29 — Jesus spoke this to Thomas after his "My Lord and my God!" confession: "Because you have seen me, you have believed; blessed are those who have not seen and yet have believed." This Johannine blessing is addressed to all subsequent generations who believe in the risen Jesus without physical sight — directly connecting the narrative to the reader\'s own faith situation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Faith',su:'Integrated revision across all faith topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Faith in the Gospels summary: Definition: active trust in Jesus\' person and power (pistis). Components: trust, obedience, confession, persistence, risk. Sozo: saved/healed — both physical and spiritual. Faith spectrum: no faith (Nazareth); little faith (disciples in storm, Peter); great faith (centurion, Syrophoenician woman). Key examples: Bartimaeus (persistence, threw off cloak); woman with bleeding (creative, bold, touched cloak); four friends (broke through roof; intercessory faith); centurion (trusted Jesus\' word from distance); Jairus (continued after death news); Syrophoenician woman (persisted despite apparent refusal); Thomas (doubted then confessed "My Lord and my God!"). Faith and prayer: persistent widow (Luke 18); Gethsemane ("not as I will"). Faith failure: disciples fled at arrest; Peter denied; but restored by resurrection.</p>'},
{lb:'Key references quick-fire',dr:dQ10,ht:'<p>Quick-fire references: "Your faith has saved you" — Mark 5:34 / 10:52 / Luke 17:19. "Great faith in Israel" — Matt.8:10 (centurion). "Seeing their faith" — Mark 2:5 (four friends). "Just believe" — Mark 5:36 (Jairus). "You of little faith" — Matt.14:31 (Peter). "I believe; help my unbelief" — Mark 9:24. "Mustard seed faith" — Matt.17:20. "My Lord and my God!" — John 20:28 (Thomas). "Blessed... not seen yet believed" — John 20:29. "Always pray and not give up" — Luke 18:1 (persistent widow context). "I have not found such great faith in Israel" — Matt.8:10. "Woman, you have great faith!" — Matt.15:28. Know all of these for WAEC.</p>'},
{lb:'Connecting faith to other topics',dr:dQ2,ht:'<p>Faith connects to all Gospel topics: Kingdom of God — faith is the response required to enter and live in the Kingdom ("repent and believe"). Healing miracles — "your faith has saved you"; faith links to healing. Forgiveness — "your sins are forgiven" (Mark 2:5) — connected to faith shown by the four friends. The Passion — disciples\' faith failed at the cross (Matt.26:56) and was restored at the resurrection. Resurrection — Thomas\' faith confession (John 20:28) is the climax of John\'s resurrection account. Discipleship — "follow me" is a call to faith; immediate response (Matt.4:20) is faith enacted. The Lord\'s Prayer — addressing God as "Father" is itself an act of faith. Baptism — the public confession of faith. Faith is the thread that connects every dimension of Gospel life.</p>'},
{lb:'WAEC final tips — faith',dr:dQ10,ht:'<p>WAEC must-knows for Faith: (1) Define faith as active trust, not just intellectual belief. (2) Know sozo = saved AND healed. (3) Know the spectrum: no faith → little faith → faith → great faith. (4) Know at least 4 examples with: reference, situation, faith shown, Jesus\' response, one lesson. (5) The two people praised for "great faith": centurion (Matt.8:10) and Syrophoenician woman (Matt.15:28) — both Gentiles. (6) Intercessory faith: four friends (Mark 2:5 — "seeing their faith"). (7) The persistent widow (Luke 18:1-8) — faith expressed through persistent prayer. (8) Thomas: doubted → confessed → blessed those who believe without seeing (John 20:28-29). (9) Peter on water: faith started, faith faltered, Jesus caught him — "little faith" not no faith. (10) Gethsemane: "not as I will but as you will" — supreme model of trusting faith.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which of the following CORRECTLY identifies the two people Jesus specifically praised for having "great faith"?',o:['Peter (at his confession, Matt 16:16) and Jairus (who continued believing after his daughter died)','Blind Bartimaeus and the ten lepers\' leader (the Samaritan who returned)','The Roman centurion (Matt 8:10) and the Syrophoenician/Canaanite woman (Matt 15:28) — both Gentiles','Mary Magdalene (who first saw the risen Jesus) and Thomas (who confessed "My Lord and my God!")'],a:3,w:'Jesus specifically praised "great faith" in only two cases: the centurion (Matt.8:10: "I have not found such great faith even in Israel") and the Syrophoenician/Canaanite woman (Matt.15:28: "Woman, you have great faith!"). Significantly, both were Gentiles — outsiders to the covenant community who showed greater faith than many insiders.'},{q:'The phrase "seeing their faith" (Mark 2:5) teaches:',o:['Faith must always be physically demonstrated through visible signs and wonders','The faith of others can open the way for healing and salvation — intercessory faith for those who cannot come themselves is effective and honoured by Jesus','Jesus only responded to the faith of the person needing help, never to the faith of those around them','This was a unique one-time event with no general principle applicable to prayer today'],a:2,w:'Mark 2:5 — when Jesus "saw their faith" (the four friends) and healed the paralysed man, he established a principle of intercessory faith: our persistent, creative trust for others who cannot come to Jesus themselves can open the way for God to act. This validates intercessory prayer: we can genuinely exercise faith on behalf of others.'},{q:'Peter\'s experience of walking on water and then sinking (Matt 14:28-31) demonstrates:',o:['That miracles only work for a brief moment before physics reasserts itself','That Peter was never a genuine believer since genuine faith would not have failed','The difference between faith and "little faith" — faith that began genuinely but faltered when Peter\'s focus shifted from Jesus to the wind; and Jesus\' response (catching Peter) shows he does not abandon those who fail in faith','That only Jesus can walk on water and no human being should attempt to imitate him'],a:3,w:'Peter\'s water-walking illustrates the faith spectrum: genuine faith (he stepped out of the boat; he walked briefly) → little faith (fear took over; he sank) → rescue (Jesus caught him). Jesus\' rebuke "you of little faith, why did you doubt?" shows this was not no faith but insufficient, fear-overwhelmed faith. And Jesus caught him — failure in faith does not end in abandonment when the failing person cries "Lord, save me!"'},{q:'John\'s Gospel specifically records faith-related events and teachings not found in Matthew, Mark or Luke. Which of the following is found ONLY in John?',o:['The call of the disciples from their fishing boats','The Parable of the Sower and four soil types','Thomas\'s confession "My Lord and my God!" and the blessing on those who believe without seeing (John 20:28-29)','The Parable of the Persistent Widow about prayer'],a:3,w:'Thomas\'s confession (John 20:28 — "My Lord and my God!") and the blessing on those who believe without seeing (John 20:29) are found only in John\'s Gospel. John uniquely emphasises belief as his central theme: "these are written that you may believe that Jesus is the Messiah, the Son of God, and that by believing you may have life in his name" (John 20:31) — John\'s stated purpose.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Faith (2)',su:'Further revision on faith in the Gospels.',steps:[
{lb:'Further review',dr:dQ2,ht:'<p>Faith in the Gospels is not a passive state but an active, dynamic relationship of trust with Jesus that overcomes obstacles, persists under pressure, expresses itself in confession and action, and connects the person to God\'s saving power. Key contrasts: No faith (Nazareth — miracles limited) vs great faith (centurion — immediate healing from distance). Fear (disciples in storm) vs faith (centurion\'s trust in Jesus\' word). Little faith that sinks (Peter on water) vs persistent faith that receives (Syrophoenician woman). Doubt that confesses itself (Mark 9:24 — "I believe; help my unbelief") vs doubt that hardens (the scribes who accused Jesus of blasphemy when he forgave). Faith is the thread connecting every Gospel healing and teaching — without it, the power of the Kingdom does not flow.</p>'},
{lb:'Parables about faith and prayer',dr:dQ1,ht:'<p>Parables specifically about faith and persistent prayer: (1) <b>Persistent Widow</b> (Luke 18:1-8) — pray always and do not give up; God answers his chosen ones. (2) <b>Friend at Midnight</b> (Luke 11:5-8) — a man who needs bread at midnight keeps knocking; the friend gets up "because of your shameless audacity." (3) <b>Ask, Seek, Knock</b> (Matt.7:7-11) — escalating persistence in prayer; God as a good Father who gives good gifts. All three teach: persistent, bold, trusting prayer is appropriate before God. Unlike a human friend who is inconvenienced, God is a loving Father who welcomes persistent prayer. The persistent widow\'s judge eventually responds despite being unjust — God responds because he is just and loving.</p>'},
{lb:'Faith and the Holy Spirit',dr:dQ2,ht:'<p>In John\'s Gospel, faith is connected to the Holy Spirit who enables it: (1) "The Spirit gives life; the flesh counts for nothing. The words I have spoken to you are full of the Spirit and life" (John 6:63) — the Spirit enables faith in Jesus\' words. (2) "When he, the Spirit of truth, comes, he will guide you into all truth" (John 16:13) — the Spirit deepens faith by illuminating truth. (3) "Very truly I tell you, whoever believes in me will do the works I have been doing" (John 14:12) — faith in Jesus, empowered by the Spirit, enables continued Kingdom works. (4) After Pentecost (Acts 2), the disciples\' faith became bold and transforming — the same people who had fled at the arrest of Jesus now preached openly in Jerusalem.</p>'},
{lb:'WAEC preparation — faith essays',dr:dQ2,ht:'<p>Model essay paragraph on Bartimaeus: "Bartimaeus (Mark 10:46-52) exemplifies persistent, courageous faith. Sitting blind and begging outside Jericho, he heard Jesus was passing and cried out: \'Jesus, Son of David, have mercy on me!\' The crowd rebuked him to be silent, but he cried louder — demonstrating faith that persists despite opposition. When Jesus called him, he threw off his cloak (his only possession as a beggar), jumping up in reckless abandon — showing faith that risks everything to reach Jesus. Jesus asked what he wanted; Bartimaeus gave a clear, specific request: \'Rabbi, I want to see.\' Jesus declared: \'Go, your faith has healed you,\' and his sight was immediately restored. The lesson for Christians is that faith requires persistence under pressure, specific prayer, and willingness to abandon worldly securities to reach Jesus."</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Why was the Syrophoenician/Canaanite woman\'s faith called "great" by Jesus?',o:['She had memorised large portions of the Jewish Torah, demonstrating deep religious knowledge','She promised to convert to Judaism if Jesus healed her daughter','She persisted in requesting healing for her daughter despite Jesus\' apparent refusal, humbly found a place within the apparent limitation ("even the dogs eat the crumbs"), and refused to be deterred — a combination of humility, persistence and creative trust','She had previously served in the Jerusalem Temple as a volunteer, which gave her a special claim on Jesus\' attention'],a:3,w:'The Syrophoenician woman was called "great faith" because she: (1) Persisted despite apparent refusal (Jesus\' seeming dismissal did not end her request). (2) Was humble (she did not deny the children/dogs distinction). (3) Was creative (finding her place within the apparent limitation: "even dogs eat the crumbs"). (4) Trusted that even the overflow of Jesus\' power was enough for her need. This combination of persistence, humility and creative trust is what Jesus called "great faith."'},{q:'In the Gospel of John, what is the stated purpose of the book (John 20:31)?',o:['To provide a biographical account of Jesus\' life from birth to resurrection','To give detailed historical evidence for Roman legal proceedings about Jesus','"These things are written that you may believe that Jesus is the Messiah, the Son of God, and that by believing you may have life in his name" — faith is John\'s explicit goal for his readers','To correct misunderstandings in the other three Gospels by providing additional eyewitness testimony'],a:3,w:'John 20:31 — the most explicit statement of Gospel purpose in the New Testament: "these are written that you may believe that Jesus is the Messiah, the Son of God, and that by believing you may have life in his name." John wrote his Gospel specifically to generate and sustain faith. This explains why Thomas\'s confession (20:28) and the blessing on those who believe without seeing (20:29) immediately precede this statement.'},{q:'The father\'s cry "I believe; help my unbelief!" (Mark 9:24) is important for understanding faith because:',o:['It proves that faith and doubt can never coexist in a genuine believer','It shows that honest acknowledgment of incomplete faith and crying to God for more is itself an act of faith — God responds to this honest, humble trust','The father\'s son was not healed because of insufficient faith, proving that belief alone is not enough','This was a special dispensation — Jesus made an exception to his usual requirement of perfect faith'],a:2,w:'Mark 9:24 is one of the most important faith texts in the Gospels: it shows that faith can coexist with doubt; that honest acknowledgment of incomplete faith ("help my unbelief") is honoured rather than penalised; and that the cry for more faith is itself an act of trust. Jesus healed the boy — showing he responds to genuine, if imperfect, faith reaching out to him.'},{q:'Which of the following faith examples demonstrates intercessory faith — faith on behalf of another person?',o:['Blind Bartimaeus (Mark 10:46-52) — who cried out for his own healing','The centurion (Matt 8:5-13) — who came to Jesus on behalf of his paralysed servant, trusting Jesus\' word to heal from a distance','Thomas (John 20:28) — who confessed faith after seeing the risen Jesus','The woman with the bleeding (Mark 5:25-34) — who touched Jesus\' cloak for her own healing'],a:2,w:'The centurion (Matt.8:5-13) and the four friends (Mark 2:1-12) are the clearest examples of intercessory faith — faith exercised on behalf of someone else. The centurion came to Jesus for his servant; the friends brought the paralysed man. Both demonstrate that genuine faith can be exercised on behalf of others — a vital principle for understanding Christian intercession.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 Gospels',ti:'WAEC Final Prep — Faith',su:'Final WAEC preparation on faith in the Gospels.',steps:[
{lb:'25-mark essay planning',dr:dQ1,ht:'<p>25-mark essay: "Examine the examples of faith Jesus commended in the Gospels and state the lessons for Christians today." Plan: Intro (define faith; Jesus frequently linked healing to faith; "your faith has saved you"). Body — 5 examples, each paragraph: Name + reference → situation → faith shown → Jesus\' response → lesson. Example structure: "Blind Bartimaeus (Mark 10:46-52) showed persistent, reckless faith — he cried out despite rebukes, threw off his cloak, and made a specific request. Jesus declared \'your faith has healed you.\' The lesson is that faith persists under opposition and requires specific, bold prayer." Conclusion: faith in the Gospels is active, not passive; specific, not vague; persistent, not easily discouraged; transforming — bringing both physical and spiritual wholeness.</p>'},
{lb:'Revision — all faith examples',dr:dQ2,ht:'<p>Complete revision — all faith examples: Bartimaeus (Mark 10:46-52): persistence, threw off cloak, "your faith has saved you." Woman with bleeding (Mark 5:25-34): creative, bold, touched cloak, "your faith has saved you." Four friends (Mark 2:1-12): broke through roof, "seeing their faith." Centurion (Matt 8:5-13): trusted word from distance, "great faith in Israel." Jairus (Mark 5:21-43): continued after death news, "just believe." Syrophoenician woman (Mark 7:24-30; Matt 15:21-28): persisted despite apparent refusal, "great faith." Persistent widow (Luke 18:1-8): "always pray and not give up." Ten lepers/Samaritan (Luke 17:11-19): "your faith has saved you." Thomas (John 20:24-29): doubted then confessed "My Lord and my God!"; blessed are those who believe without seeing. Father of epileptic boy (Mark 9:14-27): "I believe; help my unbelief!" — faith and doubt.</p>'},
{lb:'Connecting faith to the Passion and Resurrection',dr:dQ1,ht:'<p>Faith and the Passion/Resurrection: The disciples\' faith failed at the Passion — they fled (Matt.26:56); Peter denied (Matt.26:69-75). This failure shows faith\'s fragility under extreme pressure. But: (1) The women remained at the cross (Matt.27:55) — a form of faithful witness. (2) Joseph of Arimathea "who was himself a disciple of Jesus" (Matt.27:57) asked for the body — courageous faith at the moment of apparent defeat. (3) The resurrection restored faith: "when they saw him, they worshipped him" (Matt.28:17) — though "some doubted." (4) The Emmaus road disciples (Luke 24): faith rekindled by encounter with the risen Christ. The resurrection is the definitive validation of faith in Jesus — "if Christ has not been raised, your faith is futile" (1 Cor.15:17).</p>'},
{lb:'WAEC final tips',dr:dQ1,ht:'<p>WAEC final must-knows for Faith in the Gospels: (1) Define faith — active trust, not just intellectual belief. (2) Know sozo means both healed AND saved. (3) Know the two people praised for "great faith" — centurion (Matt.8:10) and Syrophoenician woman (Matt.15:28) — both Gentiles. (4) Know at least 5 faith examples with references, faith shown, and Jesus\' response. (5) Know Mark 9:24 — "I believe; help my unbelief!" — faith and doubt coexist. (6) Know Matt.17:20 — mustard seed faith — quality not quantity. (7) Know John 20:28-29 — Thomas\' confession and blessing on those who believe without seeing. (8) Know Mark 2:5 — "seeing their faith" — intercessory faith. (9) Know Luke 18:1-8 — persistent widow — faith as persistent prayer. (10) Connect faith to Kingdom: "repent and believe the good news" — faith is the entry requirement.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The sozo connection in "Your faith has saved you" (Mark 5:34; 10:52; Luke 17:19) is significant because:',o:['It means only physical healing was given in these cases','The same Greek word (sozo) means both physically healed and spiritually saved — the physical healing is a sign of the deeper spiritual salvation; faith connects the person to both dimensions of Jesus\' saving work','Sozo means specifically "made a member of the Jewish covenant community through circumcision"','It means Jesus performed the healing reluctantly and only because he was pressured by large crowds'],a:2,w:'Sozo (σῴζω) carries both "to heal physically" and "to save spiritually" — and this double meaning is intentional in the Gospel narratives. When Jesus says "your faith has saved you," he means more than the physical cure: faith links the person to his full saving work. The healing is a present sign of the greater spiritual salvation he offers. This is why John\'s Gospel especially presents miracles as "signs" pointing to a deeper reality.'},{q:'Which two entry conditions for the Kingdom of God are most closely connected to faith?',o:['Circumcision (Genesis 17) and baptism (Acts 2:38)','Repentance (Mark 1:15) and new birth (John 3:3-5) — both require trust in Jesus and involve a radical reorientation toward God that is the essence of faith','Regular temple worship (Psalm 122) and Torah observance (Deuteronomy 6:4-9)','Good works (Matthew 25:35-36) and church membership (Acts 2:41)'],a:2,w:'Repentance (Mark 1:15 — "repent and believe the good news") is the active turning from sin and toward God in trust — inseparable from faith. New birth (John 3:3-5 — "born of water and Spirit") is the radical transformation that only faith can receive, not earn. Both are facets of the same fundamental act of trusting surrender to God in response to Jesus\' proclamation.'},{q:'What does the story of Jairus (Mark 5:21-43) specifically add to our understanding of faith beyond what the other healing stories teach?',o:['That faith only works for synagogue rulers and other religious leaders','That faith must be expressed with the correct words and rituals before healing can occur','That faith must be sustained even after receiving the worst possible news — "just believe" even when the evidence says it is too late, your daughter is already dead','That only one member of each family can receive healing, and Jesus chose the daughter rather than the father'],a:3,w:'The distinctive element in Jairus\' story: his daughter died WHILE he was with Jesus. The messenger said "Your daughter is dead; why bother the teacher any more?" (Mark 5:35). Jesus then called Jairus to an extraordinary act: "just believe" — continue to trust me even though, from every human perspective, it is now too late. This models faith at its hardest: sustaining trust when circumstances have apparently made the request permanently unanswerable.'},{q:'Jesus specifically said "I have not found such great faith even in Israel" (Matt 8:10) about:',o:['Simon Peter after his confession at Caesarea Philippi','Bartimaeus, who persisted in crying out despite being rebuked by the crowd','The Roman centurion, who trusted Jesus\' spoken word alone to heal his servant from a distance — without Jesus needing to be physically present','Mary Magdalene, who was the first to see the risen Jesus'],a:3,w:'Matthew 8:10 — spoken about the Roman centurion who said "just say the word, and my servant will be healed." The centurion understood authority: his own spoken orders commanded soldiers without physical presence; he trusted Jesus\' word had the same absolute authority over disease. This insight — that Jesus\' word alone was sufficient — was "great faith" that Jesus had not found among Jews. The centurion was also a Gentile — theologically significant.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Faith in the Gospels',su:'Final comprehensive revision on faith.',steps:[
{lb:'Complete summary',dr:dQ10,ht:'<p>Faith in the Gospels complete summary: Definition — active trust in Jesus\' person and power (pistis/sozo). Components — trust, obedience, confession, persistence, risk. Spectrum — no faith (Nazareth) → little faith (disciples in storm/Peter) → faith (Bartimaeus) → great faith (centurion/Syrophoenician woman). Key examples — Bartimaeus (persistence, threw cloak, "your faith saved you"); woman with bleeding (creative bold approach, sozo); four friends (broke roof, intercessory faith); centurion (trusted word, "great faith in Israel"); Jairus ("just believe" after death news); Syrophoenician woman ("great faith"); Thomas ("My Lord and my God!" John 20:28); Mark 9:24 father ("I believe; help my unbelief"). Faith and prayer — persistent widow (Luke 18); Gethsemane ("not as I will"). Faith and discipleship — leaving nets; Gethsemane; Passion failures restored by resurrection.</p>'},
{lb:'Key phrases',dr:dQ10,ht:'<p>Key faith phrases for WAEC: "Your faith has saved you" (sozo) — Mark 5:34; 10:52; Luke 17:19. "Great faith in Israel" — Matt.8:10 (centurion). "Seeing their faith" — Mark 2:5 (four friends). "Just believe" — Mark 5:36 (Jairus). "You of little faith" — Matt.14:31 (Peter on water). "I believe; help my unbelief" — Mark 9:24. "Mustard seed faith" — Matt.17:20. "Woman, you have great faith!" — Matt.15:28. "My Lord and my God!" — John 20:28 (Thomas). "Blessed are those who have not seen and yet have believed" — John 20:29. "Always pray and not give up" — Luke 18:1 (persistent widow context). "These are written that you may believe" — John 20:31 (John\'s purpose). All of these may appear in WAEC questions — know them all.</p>'},
