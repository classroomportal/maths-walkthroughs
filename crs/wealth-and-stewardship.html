 conclude about wealth and salvation?","o":["Wealth guarantees salvation","Wealth makes salvation entirely impossible","Wealth is a serious obstacle, but not an unforgivable barrier","Wealth has no connection to spiritual life at all"],"a":2,"w":"This lesson concludes wealth is a serious obstacle, but not an unforgivable barrier."},{"q":"What overall warning do these passages give about riches?","o":["Wealth is condemned outright in every case","Riches are entirely safe and pose no spiritual risk","Only the poor can ever be saved","Riches carry real spiritual danger and can rival devotion to God"],"a":3,"w":"These passages warn that riches carry real spiritual danger and can rival devotion to God."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

ze of one's barns","One's relationship with God","Public reputation for wealth"],"a":2,"w":"This parable teaches true wealth is measured by one's relationship with God."},{"q":"What overall warning does the Parable of the Rich Fool give?","o":["This parable has no relevance to modern believers","Storing up possessions for the future is always wise","Wealth guarantees a long life","Greedily storing up possessions while neglecting God is foolish"],"a":3,"w":"The parable warns that greedily storing up possessions while neglecting God is foolish."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{lb:"Two small coins",dr:dQ2,ht:"<p>A poor widow came and put in <b>two very small copper coins</b>, worth only a fraction of a penny &mdash; the smallest possible denomination of currency.</p>"},
{lb:"More than all the others",dr:dQ2,ht:"<p>Jesus declared, <em>\"this poor widow has put more into the treasury than all the others\"</em> (Mark 12:43) &mdash; measuring giving by sacrifice, not the raw amount given.</p>"},
{lb:"All she had to live on",dr:dQ2,ht:"<p>Jesus explained: the others gave from their <b>surplus</b>, but she, <em>\"out of her poverty, put in everything &mdash; all she had to live on\"</em> (Mark 12:44).</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Where was Jesus sitting when He observed the widow's offering?","o":["Opposite the temple treasury","In the synagogue","Outside the city gates","On the Mount of Olives"],"a":0,"w":"Jesus was sitting opposite the temple treasury when He observed the widow's offering."},{"q":"What did many rich people do at the treasury, according to Mark 12:41?","o":["Gave nothing at all","Threw in large amounts of money","Argued with the temple officials","Refused to approach the treasury"],"a":1,"w":"Mark 12:41 says many rich people threw in large amounts of money."},{"q":"What did the poor widow put into the treasury?","o":["A basket of grain","A large sum of gold","Two very small copper coins","Nothing at all"],"a":2,"w":"The poor widow put in two very small copper coins."},{"q":"What did Jesus say about the widow's gift compared to all the others, in Mark 12:43?","o":["Her gift was identical in value to theirs","She put in less than all the others","Her gift was worthless compared to theirs","She put in more than all the others"],"a":3,"w":"Jesus said the widow put in more than all the others (Mark 12:43)."},{"q":"By what standard does Jesus measure the widow's giving, according to this lesson?","o":["Sacrifice, not the raw amount given","The exact monetary value alone","Public recognition received","Social status of the giver"],"a":0,"w":"Jesus measures giving by sacrifice, not the raw amount given, according to this lesson."},{"q":"What did the rich people give from, according to Mark 12:44?","o":["Their entire livelihood","Their surplus","Borrowed money","Nothing — they gave from necessity"],"a":1,"w":"Mark 12:44 says the rich people gave from their surplus."},{"q":"What did the widow give from, according to Mark 12:44?","o":["Money borrowed from a neighbour","Her surplus wealth","Her poverty — all she had to live on","A small portion of a large inheritance"],"a":2,"w":"The widow gave from her poverty — all she had to live on (Mark 12:44)."},{"q":"What overall lesson does the widow's offering teach about giving?","o":["Giving has no connection to genuine faith","Only large sums of money count as meaningful giving","Poor people should not be expected to give at all","True generosity is measured by sacrifice, not the amount given"],"a":3,"w":"The widow's offering teaches that true generosity is measured by sacrifice, not the amount given."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:"Q5 \u2022 CRS \u2022 Gospels",ti:"Storing Up Treasure in Heaven",su:"Explain Jesus's teaching on storing up treasure in heaven rather than on earth.",steps:[
{lb:"Treasures that fade",dr:dQ1,ht:"<p>Jesus warned, <em>\"Do not store up for yourselves treasures on earth, where moths and vermin destroy, and where thieves break in and steal\"</em> (Matthew 6:19).</p>"},
{lb:"Treasures that last",dr:dQ1,ht:"<p>Instead, believers should <b>\"store up... treasures in heaven,\"</b> which cannot be destroyed by decay or stolen by thieves (Matthew 6:20) &mdash; investing in what has lasting, eternal value.</p>"},
{lb:"Where your heart is",dr:dQ1,ht:"<p>Jesus concludes, <em>\"where your treasure is, there your heart will be also\"</em> (Matthew 6:21) &mdash; what people treasure most reveals and shapes the deepest loyalties of their heart.</p>"},
{lb:"Practical application",dr:dQ1,ht:"<p>This teaching calls believers to use earthly resources generously for <b>God's kingdom purposes</b> &mdash; giving, serving and caring for others &mdash; rather than hoarding for purely earthly security.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Jesus warn against in Matthew 6:19?","o":["Storing up treasures on earth, where moths and thieves destroy them","Ever owning any possessions","Giving generously to others","Working hard at one's occupation"],"a":0,"w":"Matthew 6:19 warns against storing up treasures on earth, where moths and thieves destroy them."},{"q":"What two things does Matthew 6:19 say threaten earthly treasure?","o":["Fire and flood only","Moths/vermin and thieves","Taxation and inflation","Old age and illness"],"a":1,"w":"Matthew 6:19 says moths/vermin and thieves threaten earthly treasure."},{"q":"What does Jesus instruct believers to store up instead, in Matthew 6:20?","o":["Nothing at all","Larger earthly treasures","Treasures in heaven","Only physical food supplies"],"a":2,"w":"Jesus instructs believers to store up treasures in heaven, in Matthew 6:20."},{"q":"Why are treasures in heaven superior, according to Matthew 6:20?","o":["There is no real difference from earthly treasure","They are simply larger in quantity","They can be seen and touched, unlike earthly wealth","They cannot be destroyed by decay or stolen by thieves"],"a":3,"w":"Treasures in heaven cannot be destroyed by decay or stolen by thieves, according to Matthew 6:20."},{"q":"What does Matthew 6:21 say about the connection between treasure and the heart?","o":["Where your treasure is, there your heart will be also","Treasure and the heart have no real connection","The heart determines treasure, but not the reverse","Only wealthy people have hearts shaped by treasure"],"a":0,"w":"Matthew 6:21 says where your treasure is, there your heart will be also."},{"q":"What does this lesson say a person's treasure reveals?","o":["Only their level of financial literacy","The deepest loyalties of their heart","Nothing of spiritual significance","Only their social class"],"a":1,"w":"A person's treasure reveals the deepest loyalties of their heart, according to this lesson."},{"q":"What practical action does this teaching call believers to take with earthly resources?","o":["Avoid ever using resources for others","Hoard them for purely earthly security","Use them generously for God's kingdom purposes","Spend all resources solely on personal comfort"],"a":2,"w":"This teaching calls believers to use earthly resources generously for God's kingdom purposes."},{"q":"What overall contrast does Matthew 6:19-21 draw?","o":["Personal wealth versus family wealth","Poverty versus wealth, with no reference to heaven","Old wealth versus new wealth","Fading earthly treasure versus lasting heavenly treasure"],"a":3,"w":"Matthew 6:19-21 draws a contrast between fading earthly treasure and lasting heavenly treasure."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q6 \u2022 CRS \u2022 Gospels",ti:"The Parable of the Shrewd Manager",su:"Explain the Parable of the Shrewd Manager and its lesson on using wealth wisely.",steps:[
{lb:"A manager about to be dismissed",dr:dQ2,ht:"<p>In Luke 16:1-8, a manager facing dismissal for mismanaging his master's wealth shrewdly reduces others' debts, securing goodwill and future security for himself.</p>"},
{lb:"Commended for shrewdness",dr:dQ2,ht:"<p>Surprisingly, the master <b>commended</b> the dishonest manager for his shrewdness &mdash; not endorsing his dishonesty, but his foresight in using present resources for future benefit.</p>"},
{lb:"Worldly wisdom applied to eternal matters",dr:dQ2,ht:"<p>Jesus observes that <em>\"the people of this world are more shrewd in dealing with their own kind than the people of the light\"</em> (Luke 16:8) &mdash; challenging believers to be equally strategic with kingdom priorities.</p>"},
{lb:"Gaining friends with worldly wealth",dr:dQ2,ht:"<p>Jesus concludes, <em>\"use worldly wealth to gain friends for yourselves, so that... you will be welcomed into eternal dwellings\"</em> (Luke 16:9) &mdash; using money generously to build lasting spiritual good.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What situation does the manager in Luke 16:1-8 face?","o":["Dismissal for mismanaging his master's wealth","A large inheritance from a relative","A request to build bigger barns","A demand from Roman tax officials"],"a":0,"w":"The manager in Luke 16:1-8 faces dismissal for mismanaging his master's wealth."},{"q":"What did the manager do to secure his future, facing dismissal?","o":["Stole additional money from his master","Reduced others' debts to secure goodwill","Fled the country immediately","Confessed everything publicly with no further action"],"a":1,"w":"The manager reduced others' debts to secure goodwill and future security for himself."},{"q":"How did the master respond to the manager's actions, in Luke 16:8?","o":["He doubled the manager's debts","He had the manager arrested","He commended the manager for his shrewdness","He ignored the manager's actions entirely"],"a":2,"w":"The master commended the manager for his shrewdness (Luke 16:8)."},{"q":"What was the master commending, according to this lesson's explanation?","o":["Nothing of any real value","The manager's dishonesty itself","A recommendation to imitate outright deception","The manager's foresight in using present resources for future benefit"],"a":3,"w":"The master was commending the manager's foresight, not his dishonesty, according to this lesson."},{"q":"What comparison does Jesus draw in Luke 16:8 between \"people of this world\" and \"people of the light\"?","o":["The people of this world are more shrewd with their own kind","People of the light are always more shrewd than worldly people","There is no meaningful comparison drawn at all","Both groups behave identically in every respect"],"a":0,"w":"Jesus compares that people of this world are more shrewd with their own kind than people of the light (Luke 16:8)."},{"q":"What does Jesus instruct believers to do with worldly wealth, in Luke 16:9?","o":["Hoard it entirely for personal security","Use it to gain friends for themselves","Reject it outright as inherently evil","Give it exclusively to religious officials"],"a":1,"w":"Jesus instructs believers to use worldly wealth to gain friends for themselves (Luke 16:9)."},{"q":"What outcome does Luke 16:9 say this wise use of wealth leads to?","o":["Political power and influence","Immediate earthly riches","Being welcomed into eternal dwellings","No outcome of any real significance"],"a":2,"w":"Luke 16:9 says this wise use of wealth leads to being welcomed into eternal dwellings."},{"q":"What overall challenge does this parable present to believers?","o":["To trust wealth for eternal security","To imitate the manager's dishonesty exactly","To avoid all use of money entirely","To be as strategic with kingdom priorities as worldly people are with money"],"a":3,"w":"This parable challenges believers to be as strategic with kingdom priorities as worldly people are with money."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q7 \u2022 CRS \u2022 Gospels",ti:"Do Not Worry About Material Needs",su:"Explain Jesus's teaching on trusting God rather than worrying about material provision.",steps:[
{lb:"Life is more than food",dr:dQ1,ht:"<p>Jesus taught, <em>\"do not worry about your life, what you will eat or drink; or about your body, what you will wear... Is not life more than food, and the body more than clothes?\"</em> (Matthew 6:25).</p>"},
{lb:"The birds of the air",dr:dQ1,ht:"<p>Jesus points to the <b>birds</b>, which neither sow nor reap nor store away in barns, yet God feeds them &mdash; asking, <em>\"Are you not much more valuable than they?\"</em> (Matthew 6:26).</p>"},
{lb:"The lilies of the field",dr:dQ1,ht:"<p>Even <b>Solomon in all his splendour</b> was not dressed as beautifully as the wild flowers, which God clothes so wonderfully, though they exist only briefly (Matthew 6:28-29).</p>"},
{lb:"Seek first His kingdom",dr:dQ1,ht:"<p>Jesus concludes, <em>\"seek first his kingdom and his righteousness, and all these things will be given to you as well\"</em> (Matthew 6:33) &mdash; trust and priority, not anxious striving, should define believers' relationship with material needs.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does Jesus say not to worry about, in Matthew 6:25?","o":["What to eat, drink or wear","Spiritual growth entirely","Prayer and worship","Reading Scripture"],"a":0,"w":"Matthew 6:25 says not to worry about what to eat, drink or wear."},{"q":"What question does Jesus ask about life and food, in Matthew 6:25?","o":["\"Is food more important than life?\"","\"Is not life more than food, and the body more than clothes?\"","\"Should clothing be your highest priority?\"","\"Is worry ever justified for believers?\""],"a":1,"w":"Jesus asks, \"Is not life more than food, and the body more than clothes?\" in Matthew 6:25."},{"q":"What example does Jesus use to illustrate God's provision, in Matthew 6:26?","o":["A powerful king","A wealthy merchant","The birds of the air","A group of soldiers"],"a":2,"w":"Jesus uses the birds of the air to illustrate God's provision, in Matthew 6:26."},{"q":"What does Matthew 6:26 say about the birds' activity, compared to humans?","o":["They receive no provision from God at all","They work even harder than humans do","They store far more food than humans","They neither sow nor reap nor store away in barns"],"a":3,"w":"Matthew 6:26 says birds neither sow nor reap nor store away in barns."},{"q":"What question does Jesus ask about human value compared to birds, in Matthew 6:26?","o":["\"Are you not much more valuable than they?\"","\"Are birds more valuable than people?\"","\"Do birds deserve more of God's care?\"","\"Is human value equal to that of birds?\""],"a":0,"w":"Jesus asks, \"Are you not much more valuable than they?\" in Matthew 6:26."},{"q":"Whose splendour does Jesus compare unfavourably to the wild flowers, in Matthew 6:29?","o":["David's","Solomon's","Herod's","Caesar's"],"a":1,"w":"Jesus compares Solomon's splendour unfavourably to the wild flowers, in Matthew 6:29."},{"q":"What does Jesus instruct believers to seek first, in Matthew 6:33?","o":["Political influence and status","Financial security above all else","God's kingdom and His righteousness","Personal comfort and ease"],"a":2,"w":"Jesus instructs believers to seek first God's kingdom and His righteousness, in Matthew 6:33."},{"q":"What does Matthew 6:33 promise will happen if believers seek God's kingdom first?","o":["Nothing further is promised","They will never need to work again","They will become wealthy immediately","All these things will be given to them as well"],"a":3,"w":"Matthew 6:33 promises that all these things will be given as well, if God's kingdom is sought first."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q8 \u2022 CRS \u2022 Gospels",ti:"The Rich Man and Lazarus",su:"Explain the Parable of the Rich Man and Lazarus and its warning about neglecting the poor.",steps:[
{lb:"Contrasting fortunes",dr:dQ2,ht:"<p>Luke 16:19-21 describes a rich man who lived in luxury, feasting daily, while a poor beggar named <b>Lazarus</b> lay at his gate, covered with sores, longing for scraps.</p>"},
{lb:"Death reverses fortunes",dr:dQ2,ht:"<p>Both men died; Lazarus was carried by angels to <b>Abraham's side</b>, while the rich man found himself in torment, suffering in the afterlife (Luke 16:22-23).</p>"},
{lb:"A great chasm fixed",dr:dQ2,ht:"<p>Abraham explains that a <b>\"great chasm\"</b> has been fixed between them, so that no one can cross from one side to the other, regardless of any later change of heart (Luke 16:26).</p>"},
{lb:"The lesson of the law and prophets",dr:dQ2,ht:"<p>When the rich man begs for someone to warn his brothers, Abraham replies that if they do not listen to <b>Moses and the prophets</b>, they will not be convinced even if someone rises from the dead (Luke 16:29-31).</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"How did the rich man live, according to Luke 16:19?","o":["In luxury, feasting daily","In poverty, struggling to eat","As a humble servant","As a wandering traveller"],"a":0,"w":"The rich man lived in luxury, feasting daily, according to Luke 16:19."},{"q":"What was the name of the poor beggar at the rich man's gate?","o":["Zacchaeus","Lazarus","Bartimaeus","Simeon"],"a":1,"w":"The poor beggar at the rich man's gate was named Lazarus."},{"q":"What was Lazarus's condition, according to Luke 16:20-21?","o":["A respected community leader","Wealthy but lonely","Covered with sores, longing for scraps","Recently arrived from a foreign land"],"a":2,"w":"Lazarus was covered with sores and longing for scraps, according to Luke 16:20-21."},{"q":"What happened to Lazarus after death, according to Luke 16:22?","o":["He returned to earthly life immediately","He was forgotten entirely","He became wealthy in the afterlife","He was carried by angels to Abraham's side"],"a":3,"w":"Lazarus was carried by angels to Abraham's side after death (Luke 16:22)."},{"q":"What happened to the rich man after death, according to Luke 16:23?","o":["He found himself in torment","He also went to Abraham's side","He was reincarnated immediately","Nothing changed for him at all"],"a":0,"w":"The rich man found himself in torment after death (Luke 16:23)."},{"q":"What does Abraham say has been fixed between the rich man and Lazarus, in Luke 16:26?","o":["A small bridge","A great chasm","A temporary barrier","Nothing at all separates them"],"a":1,"w":"Abraham says a great chasm has been fixed between them, in Luke 16:26."},{"q":"What does Abraham say about someone rising from the dead to warn the rich man's brothers, in Luke 16:31?","o":["It was already planned to happen","It would certainly convince them instantly","They would not be convinced even by such a sign, if they ignore Moses and the prophets","It was entirely irrelevant to their situation"],"a":2,"w":"Abraham says they would not be convinced even by someone rising from the dead, if they ignore Moses and the prophets (Luke 16:31)."},{"q":"What overall warning does this parable give about wealth and the poor?","o":["This parable has no bearing on how believers treat the poor","Wealth guarantees a peaceful afterlife","Poverty guarantees eternal reward regardless of character","Neglecting the poor while living in luxury carries serious eternal consequences"],"a":3,"w":"This parable warns that neglecting the poor while living in luxury carries serious eternal consequences."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q9 \u2022 CRS \u2022 Gospels",ti:"WAEC Exam Preparation \u2014 Wealth and Stewardship",su:"Practise WAEC-style questions on wealth and stewardship in the Gospels.",steps:[
{lb:"WAEC essay structure",dr:dQ1,ht:"<p>For WAEC essays on wealth and stewardship: (1) Identify the <b>specific passage</b>. (2) Give the <b>precise reference</b>. (3) Explain the teaching <b>clearly</b>. (4) Draw out a <b>practical application</b>.</p>"},
{lb:"Common WAEC question patterns",dr:dQ1,ht:"<p>Common patterns include: \"Explain the Parable of the Rich Fool.\" / \"What does the widow's offering teach about giving?\" / \"Discuss Zacchaeus's response to Jesus.\" / \"Explain Jesus's teaching on worry and material needs.\"</p>"},
{lb:"Key references to remember",dr:dQ1,ht:"<p>Key references: <b>Matthew 19:24</b> (camel/needle); <b>Luke 12:16-21</b> (rich fool); <b>Luke 19:1-10</b> (Zacchaeus); <b>Mark 12:41-44</b> (widow's offering); <b>Matthew 6:19-21, 25-33</b> (treasure/worry); <b>Luke 16:19-31</b> (rich man and Lazarus).</p>"},
{lb:"Connecting to practical stewardship",dr:dQ1,ht:"<p>WAEC essays should always connect teaching to <b>practical stewardship today</b> &mdash; generous giving, care for the poor, and trust in God &mdash; rather than treating wealth only as an abstract theme.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on wealth and stewardship?","o":["Identify the specific passage asked about","Give a personal opinion with no facts","List unrelated facts","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on wealth and stewardship should begin by identifying the specific passage asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the climate of the Sahel.\"","\"What does the widow's offering teach about giving?\"","\"Define a chemical bond.\"","\"List the Nigerian federal states.\""],"a":1,"w":"\"What does the widow's offering teach about giving?\" is a typical WAEC-style question."},{"q":"Which verse should be cited when discussing the danger of riches?","o":["Luke 5:11","John 13:35","Matthew 19:24","Matthew 28:19"],"a":2,"w":"Matthew 19:24 should be cited when discussing the danger of riches."},{"q":"Which passage should be cited when discussing greed and self-focused planning?","o":["Luke 9:62","John 21:15-17","Matthew 10:37","Luke 12:16-21 (the rich fool)"],"a":3,"w":"Luke 12:16-21, the rich fool, should be cited when discussing greed and self-focused planning."},{"q":"Which passage should be cited when discussing repentant, generous transformation?","o":["Luke 19:1-10 (Zacchaeus)","Matthew 6:19-21","Mark 12:41-44","Luke 16:19-31"],"a":0,"w":"Luke 19:1-10, Zacchaeus, should be cited when discussing repentant, generous transformation."},{"q":"Which passage should be cited when discussing sacrificial giving measured by proportion, not amount?","o":["Matthew 19:16-22","Mark 12:41-44 (the widow's offering)","Luke 14:28-30","Matthew 16:24-25"],"a":1,"w":"Mark 12:41-44, the widow's offering, should be cited when discussing sacrificial giving."},{"q":"Which passage should be cited when discussing trust in God over anxious worry about material needs?","o":["John 15:18","Luke 16:1-8","Matthew 6:25-33","Matthew 8:22"],"a":2,"w":"Matthew 6:25-33 should be cited when discussing trust in God over anxious worry."},{"q":"Why should WAEC essays connect teaching to practical stewardship today?","o":["WAEC forbids discussing daily life applications","Practical application is irrelevant to WAEC marking","Only abstract theology should be discussed","It shows the theology remains relevant to real Christian life"],"a":3,"w":"Connecting to practical stewardship shows the theology remains relevant to real Christian life, which WAEC rewards."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q10 \u2022 CRS \u2022 Gospels",ti:"Mixed Questions \u2014 Wealth and Stewardship",su:"Integrated revision across Jesus's teaching on wealth, giving and stewardship.",steps:[
{lb:"Summary of key themes",dr:dQ2,ht:"<p>Jesus warns that wealth can become a rival to devotion to God, praises sacrificial and generous giving, and calls believers to store up treasure in heaven, trust God for provision, and use resources wisely for kingdom purposes.</p>"},
{lb:"Key references to remember",dr:dQ2,ht:"<p>Must-know facts: <b>Matthew 19:24</b> (camel/needle); <b>Luke 12:16-21</b> (rich fool); <b>Luke 19:1-10</b> (Zacchaeus); <b>Mark 12:41-44</b> (widow's offering); <b>Matthew 6:19-21</b> (treasure in heaven); <b>Luke 16:19-31</b> (rich man and Lazarus).</p>"},
{lb:"Lessons for today",dr:dQ2,ht:"<p>These teachings call believers to hold wealth loosely, give generously and sacrificially, care for the poor, and trust God rather than material security for their deepest needs.</p>"},
{lb:"Final exam tips",dr:dQ2,ht:"<p>Always give the <b>precise reference</b>, explain the teaching <b>clearly and accurately</b>, and conclude by connecting the passage to a practical, everyday example of stewardship.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What image does Jesus use to describe the difficulty of a rich person entering God's kingdom?","o":["A camel going through the eye of a needle","A fish swimming upstream","A bird building a nest","A shepherd searching for a sheep"],"a":0,"w":"Jesus uses the image of a camel going through the eye of a needle."},{"q":"What did God call the rich man in the Parable of the Rich Fool?","o":["A wise planner","A fool","A faithful steward","A generous giver"],"a":1,"w":"God called the rich man a fool in the Parable of the Rich Fool."},{"q":"What did Zacchaeus promise to do with half his possessions?","o":["Invest them for greater profit","Store them in bigger barns","Give them to the poor","Hide them from Roman authorities"],"a":2,"w":"Zacchaeus promised to give half his possessions to the poor."},{"q":"What did the widow give at the temple treasury?","o":["Nothing at all","A large sum of gold","A basket of grain","Two very small copper coins"],"a":3,"w":"The widow gave two very small copper coins at the temple treasury."},{"q":"What does Jesus instruct believers to store up, in Matthew 6:20?","o":["Treasures in heaven","Larger earthly treasures","Nothing of any kind","Only grain and food supplies"],"a":0,"w":"Jesus instructs believers to store up treasures in heaven, in Matthew 6:20."},{"q":"Who was the poor beggar at the rich man's gate, in Luke 16?","o":["Zacchaeus","Lazarus","Bartimaeus","Nicodemus"],"a":1,"w":"Lazarus was the poor beggar at the rich man's gate, in Luke 16."},{"q":"What separates the rich man and Lazarus in the afterlife, according to Luke 16:26?","o":["Nothing at all","A small river","A great chasm","A temporary wall"],"a":2,"w":"A great chasm separates the rich man and Lazarus in the afterlife, according to Luke 16:26."},{"q":"What overall lesson unites the themes studied in this topic?","o":["Wealth has no connection to spiritual life at all","Wealth guarantees a right relationship with God","Only the poor can enter God's kingdom","Wealth must be held loosely and used generously for God's purposes"],"a":3,"w":"The unifying lesson is that wealth must be held loosely and used generously for God's purposes."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
