<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Beatitudes — Matthew 5:3-10',ACC,12,'middle',true));
[['Beatitude','Promise'],['Blessed are the poor in spirit','theirs is the kingdom of heaven'],['Blessed are those who mourn','they will be comforted'],['Blessed are the meek','they will inherit the earth'],['Blessed are those who hunger for righteousness','they will be filled'],['Blessed are the merciful','they will be shown mercy'],['Blessed are the pure in heart','they will see God'],['Blessed are the peacemakers','they will be called children of God'],['Blessed are the persecuted for righteousness','theirs is the kingdom of heaven']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*26,460,22,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(190,32+i*26,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(400,32+i*26,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Sermon on the Mount — Key Teachings',ACC,12,'middle',true));
[['Section','Key verse/idea','Reference'],['Beatitudes','Blessed are the poor in spirit...','Matt 5:3-12'],['Salt and Light','You are the salt of the earth / light of the world','Matt 5:13-16'],['Law fulfilled','\"I came not to abolish but to fulfil\"','Matt 5:17-20'],['Antitheses (6)','\"You have heard... but I say to you\"','Matt 5:21-48'],['Six pious acts','Giving, prayer, fasting — do in secret','Matt 6:1-18'],['Lord\'s Prayer','Our Father... hallowed be your name','Matt 6:9-13'],['Do not worry','\"Seek first the Kingdom of God\"','Matt 6:25-34'],['Judging others','\"Do not judge or you will be judged\"','Matt 7:1-5'],['Golden Rule','\"Do to others what you would have them do to you\"','Matt 7:12'],['Two builders','Build on the rock — hear AND do','Matt 7:24-27']].forEach(function(r,i){if(i<=p){o.push(R(10,14+i*22,460,18,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(90,24+i*22,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(240,24+i*22,r[1],'#444',7,'middle',false));o.push(T(415,24+i*22,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Sermon on the Mount — Summary',ACC,13,'middle',true));
[['Beatitudes','8 blessings describing Kingdom character (Matt 5:3-10)'],['Salt and light','Christians to influence and illuminate society'],['Antitheses','\"You heard... but I say\" — deeper righteousness than Pharisees'],['Lord\'s Prayer','Model prayer: Our Father; hallowed; kingdom; daily bread; forgive'],['Do not worry','Seek first the Kingdom; God knows what you need (Matt 6:33)'],['Golden Rule','Do to others as you want done to you — summary of Law (7:12)'],['Two builders','Hearing alone is not enough; must DO what Jesus says (7:24-27)']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,9,'middle',true));o.push(T(310,52+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Gospels',ti:'The Beatitudes (Matthew 5:3-12)',su:'Examine the Beatitudes and the character of Kingdom citizens.',steps:[
{lb:'The setting and structure',dr:dQ1,ht:'<p>The Sermon on the Mount (Matthew 5-7) is the first of five great discourses in Matthew. Jesus sat down (the rabbinic posture for authoritative teaching), and his disciples came to him. The Beatitudes (from Latin "beatus" — blessed/happy) open the sermon. There are eight Beatitudes (vv.3-10) plus a longer ninth on persecution (vv.11-12). Each follows the pattern: "Blessed are [those who...], for they will [receive...]." The Greek word "makarios" (blessed) means more than happy — it describes a deep inner well-being that circumstances cannot remove.</p>'},
{lb:'The first four Beatitudes',dr:dQ1,ht:'<p>(1) <b>Poor in spirit</b> — recognising one\'s spiritual bankruptcy before God; depending entirely on God, not on self. Kingdom promised now (present tense). (2) <b>Those who mourn</b> — grief over sin and the brokenness of the world; God will comfort (Isaiah 61:2). (3) <b>The meek</b> — not weak but strength under control; humble and teachable (Psalm 37:11). (4) <b>Those who hunger and thirst for righteousness</b> — passionate desire for God\'s justice and right standing; they will be completely satisfied. The first four Beatitudes describe a person\'s attitude toward God — recognising need and depending on God.</p>'},
{lb:'The last four Beatitudes',dr:dQ1,ht:'<p>(5) <b>The merciful</b> — showing compassion to others; they receive mercy (mirror principle — Matthew 6:14-15). (6) <b>The pure in heart</b> — undivided inner loyalty to God; no double-mindedness (Psalm 24:3-4). They will see God — the ultimate blessing. (7) <b>The peacemakers</b> — those who actively create reconciliation, not just avoid conflict; called "children of God" (the highest identity). (8) <b>The persecuted</b> — suffering for righteousness\' sake (not for foolishness); theirs is the kingdom (same promise as the first Beatitude — forming a bookend). The last four describe a person\'s attitude toward others.</p>'},
{lb:'The Beatitudes and Kingdom values',dr:dQ1,ht:'<p>The Beatitudes describe Kingdom character — the values of God\'s reign are opposite to worldly values. The world says: blessed are the powerful, the rich, the proud, the winners. Jesus says: blessed are the dependent, the mourning, the meek, the persecuted. The Beatitudes: (1) Are descriptive, not prescriptive — they describe those who already belong to the Kingdom. (2) Create a community — a counter-cultural group with different values. (3) Are rooted in the OT — echoing Psalms 37, 24, Isaiah 61. (4) Point to the future — most promises are future ("will be"), but the Kingdom is both present and coming. WAEC: know all eight with their promises.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'"Blessed are the meek, for they will inherit the earth" echoes which Psalm?',o:['Psalm 1:1','Psalm 22:1','Psalm 37:11','Psalm 91:1'],a:3,w:'Psalm 37:11 — "the meek will inherit the land and enjoy peace and prosperity." Jesus quotes this psalm directly. Meekness is not weakness but power surrendered to God — Moses was called the most meek man on earth (Num.12:3) yet was a powerful leader.'},{q:'The first and eighth Beatitudes share the same promise: "theirs is the kingdom of heaven." This creates:',o:['A contradiction — the poor in spirit and the persecuted cannot both be blessed','A bookend structure (inclusion) showing all eight Beatitudes describe Kingdom citizens','Two separate groups within the Kingdom — beginners and advanced disciples','A future promise for those who have suffered most in this life'],a:2,w:'The shared promise "theirs is the kingdom of heaven" (Matthew 5:3 and 5:10) forms an inclusion — a literary bookend. All eight Beatitudes together describe a single kind of person: the Kingdom citizen, whose character qualifies them for God\'s reign.'},{q:'The Beatitude "Blessed are the pure in heart, for they will see God" refers to:',o:['Ritual cleanliness — those who observe all purity laws will enter the temple','Moral perfection — only those who have never sinned will see God','Undivided inner devotion to God — a single-hearted loyalty with no divided allegiances','Physical cleanliness — washing before prayer and worship'],a:3,w:'"Pure in heart" (Matthew 5:8) reflects Psalm 24:3-4 — "who may stand in his holy place? The one who has clean hands and a pure heart." The emphasis is on inner singleness: no double-mindedness, no divided loyalty between God and idols.'},{q:'The Beatitude about peacemakers calls them "children of God" because:',o:['Peacemakers are always the most respected people in any community','Creating peace reflects the very character of God, who reconciled humanity to himself through Christ','Jewish law required all children of Abraham to be peacemakers','Peacemakers were the official leaders in the Mosaic community'],a:2,w:'"Children of God" (Matthew 5:9) — peacemakers bear a family resemblance to God, the ultimate peacemaker. "God was reconciling the world to himself in Christ" (2Cor.5:19). Those who actively pursue reconciliation act like their Father in heaven.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Gospels',ti:'Salt, Light and the Law',su:'Examine Matthew 5:13-20 — salt, light and the fulfilment of the Law.',steps:[
{lb:'Salt of the earth (Matthew 5:13)',dr:dQ2,ht:'<p>Jesus declared: <em>"You are the salt of the earth. But if the salt loses its saltiness, how can it be made salty again? It is no longer good for anything, except to be thrown out and trampled underfoot"</em> (Mt.5:13). Salt in the ancient world had multiple functions: (1) Preservative — keeping meat from corruption. (2) Flavouring — enhancing taste. (3) Purifying agent. (4) Covenant symbol — "salt of the covenant" (Lev.2:13). Christians are called to preserve society from moral corruption and to add distinctive "flavour" through Kingdom values. Saltless salt is useless — a disciple who conforms to the world has lost their purpose.</p>'},
{lb:'Light of the world (Matthew 5:14-16)',dr:dQ2,ht:'<p><em>"You are the light of the world. A town built on a hill cannot be hidden. Neither do people light a lamp and put it under a bowl... let your light shine before others, that they may see your good deeds and glorify your Father in heaven"</em> (Mt.5:14-16). In John 8:12, Jesus calls himself "the light of the world" — here he applies the same description to his disciples. Light functions: (1) Reveals — exposes what is hidden in darkness. (2) Guides — shows the path forward. (3) Cannot be hidden — the community of disciples should be visibly different. Good deeds are the "light" — the purpose is that observers give glory to God, not to the disciples.</p>'},
{lb:'Jesus and the Law (Matthew 5:17-20)',dr:dQ2,ht:'<p><em>"Do not think that I have come to abolish the Law or the Prophets; I have not come to abolish them but to fulfil them"</em> (Mt.5:17). Jesus came to bring the Law to its intended completion — he is the one to whom all the Law pointed. <em>"Not the smallest letter, not the least stroke of a pen, will by any means disappear from the Law until everything is accomplished"</em> (Mt.5:18). Then the challenge: <em>"Unless your righteousness surpasses that of the Pharisees and the teachers of the law, you will certainly not enter the kingdom of heaven"</em> (Mt.5:20). The disciples need a deeper righteousness — not more rules but transformed hearts.</p>'},
{lb:'The six Antitheses (Matthew 5:21-48)',dr:dQ2,ht:'<p>Six times Jesus contrasts the traditional interpretation with his own deeper teaching: "You have heard... but I tell you." (1) Murder/anger — the inner attitude matters, not just the outer act. (2) Adultery/lust — sin begins in the heart. (3) Divorce — except for sexual immorality. (4) Oaths — let your yes be yes. (5) Retaliation — "turn the other cheek" (non-violent resistance). (6) Love/enemies — love your enemies and pray for those who persecute you. The pattern shows Jesus as the authoritative interpreter of the Law — not abolishing it but radicalising it. He addresses the heart, not just the hand.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Jesus said "You are the light of the world" — the light refers to:',o:['Supernatural miracles that only apostles can perform','The good deeds of disciples that cause observers to glorify God, not the disciples themselves','Knowledge and education that Christians bring to society','The Bible, which is the light of the world\'s wisdom'],a:2,w:'Matthew 5:16 — "let your light shine before others, that they may see your good deeds and glorify your Father in heaven." The light is practical righteous living. Crucially, the goal is God\'s glory, not the disciples\' recognition.'},{q:'Jesus said he came to "fulfil" the Law — this means:',o:['He came to make the Law easier by summarising it into just two commandments','He came to bring the Law to its intended completion — he is the one to whom the Law pointed','He came to keep all 613 commandments perfectly as an example','He came to apply the Law more strictly than the Pharisees had done'],a:2,w:'Matthew 5:17 — "fulfil" (Greek: plēroō) means to bring to its full intended meaning. Jesus fulfils the Law\'s prophetic pointing (he is who it pointed to), its moral demands (he lived it perfectly), and its ceremonial types (he is the sacrifice the Temple system anticipated).'},{q:'Jesus said "unless your righteousness surpasses that of the Pharisees." This means:',o:['Disciples must observe more external rules than the Pharisees','The disciples need a deeper inner righteousness — transformed hearts, not just external compliance','Disciples should study more scripture than the Pharisees','The Pharisees had no righteousness at all and anything would surpass them'],a:2,w:'The Pharisees were very externally righteous (fasting, tithing, prayer, Sabbath-keeping). Jesus called for deeper righteousness — heart transformation, not just behaviour modification. The Antitheses (5:21-48) elaborate: God\'s law addresses the heart (anger, lust, motives) not just the hands.'},{q:'The sixth Antithesis teaches "Love your enemies and pray for those who persecute you" because:',o:['This will cause enemies to become ashamed and stop persecuting you','God loves only the good — so disciples should only love the lovable','This reflects God\'s own character — he causes sun and rain for both the righteous and the unrighteous','This was a requirement of the Mosaic Law originally followed by all Jews'],a:3,w:'Matthew 5:44-45 — "Love your enemies...that you may be children of your Father in heaven. He causes his sun to rise on the evil and the good, and sends rain on the righteous and the unrighteous." Enemy love reflects God\'s own universal, unconditional love. Disciples imitate the Father.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Gospels',ti:'The Lord\'s Prayer',su:'Examine the Lord\'s Prayer (Matthew 6:9-13) and what it teaches about prayer.',steps:[
{lb:'The context — prayer in secret (Matthew 6:5-8)',dr:dQ1,ht:'<p>Jesus criticised two wrong motives for prayer: (1) <b>The hypocrites</b> — praying to be seen by others, "on street corners" (Mt.6:5). They have their reward — human applause. (2) <b>Babbling pagans</b> — thinking many words will be heard (Mt.6:7). Jesus\' instruction: go into your room, close the door, pray to your Father who sees in secret — He will reward you (Mt.6:6). The principle: prayer is not a performance for human audiences or a mechanical repetition. It is genuine communication with God who already knows what we need (6:8) before we ask. The Lord\'s Prayer is given as a model ("this is how you should pray"), not a formula.</p>'},
{lb:'The Lord\'s Prayer — first half (God-focused)',dr:dQ1,ht:'<p>The Lord\'s Prayer (Mt.6:9-13): <em>"Our Father in heaven"</em> — God is personal (Father), communal (our), and transcendent (heaven). <em>"Hallowed be your name"</em> — God\'s name (reputation, character) be treated as holy by all. <em>"Your kingdom come"</em> — prayer for God\'s reign to be fully established on earth. <em>"Your will be done on earth as in heaven"</em> — perfect alignment of earth with heaven\'s purposes. The first half is entirely God-focused: his name, his kingdom, his will. All human petitions come after the God-centred section. This teaches prayer\'s proper priority: God first, human needs second.</p>'},
{lb:'The Lord\'s Prayer — second half (human needs)',dr:dQ2,ht:'<p>Human petitions: <em>"Give us today our daily bread"</em> — physical needs; dependence on God for each day (echoing manna — daily provision, not stockpiling). <em>"And forgive us our debts, as we also have forgiven our debtors"</em> — forgiveness is conditional on having forgiven others (expanded in Mt.6:14-15). <em>"And lead us not into temptation, but deliver us from the evil one"</em> — protection from trial and from Satan. The later doxology ("For yours is the kingdom, the power and the glory, forever") is not in the earliest manuscripts but reflects the early church\'s liturgical addition. The prayer covers: adoration, petition, confession, and intercession.</p>'},
{lb:'Lessons from the Lord\'s Prayer',dr:dQ2,ht:'<p>The Lord\'s Prayer teaches: (1) <b>God\'s Fatherhood</b> — prayer is addressed to a personal God in relationship. (2) <b>Community</b> — "our" not "my" — prayer is corporate. (3) <b>Priority</b> — God\'s name, kingdom and will come before personal needs. (4) <b>Dependence</b> — daily bread = daily dependence, not self-sufficiency. (5) <b>Forgiveness</b> — receiving forgiveness requires giving it (the most sobering clause). (6) <b>Protection</b> — we need divine help to resist temptation; we cannot resist alone. (7) <b>Simplicity</b> — God already knows our needs; prayer does not inform God but aligns us with him. WAEC: know all six petitions with their order and meaning.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'"Hallowed be your name" in the Lord\'s Prayer means:',o:['May your name be spoken aloud frequently in worship','May your name, character and reputation be treated as holy and honoured by all people','May we be allowed to know your secret personal name','May we pray often in your name'],a:2,w:'"Hallowed" (Greek: hagiasthēto) = "let be made holy/treated as holy." God\'s "name" in Hebrew thought = his character, reputation, identity. This petition asks that all creation honour God as holy — the first Beatitude\'s flip side: God\'s people acknowledge their poverty; this asks God\'s name to be exalted.'},{q:'The petition "give us today our daily bread" echoes:',o:['The feeding of the 5,000 when Jesus multiplied bread and fish','The manna given daily in the wilderness — Israel could only collect what they needed for each day','The presentation of the twelve loaves in the temple','The Last Supper, anticipating the Eucharist'],a:2,w:'Exodus 16 — manna fell daily; Israelites could not hoard it (it went bad). "Daily bread" teaches daily dependence on God, not self-sufficiency or anxiety about the future. Matthew 6:25-34 follows immediately with "do not worry about tomorrow."'},{q:'The most demanding clause in the Lord\'s Prayer is:',o:['Hallowed be your name — it is hard to always treat God\'s name as holy','Your kingdom come — we must actively work to build the kingdom','Forgive us our debts as we have forgiven our debtors — our forgiveness is conditional on our forgiving others','Lead us not into temptation — we must avoid all potentially dangerous situations'],a:3,w:'Matthew 6:12 — "forgive us our debts, as we also have forgiven our debtors." This is the only petition with a human condition attached. Jesus emphasises it in 6:14-15: "if you do not forgive others their sins, your Father will not forgive your sins." Receiving forgiveness requires giving forgiveness.'},{q:'Jesus said not to pray like "the pagans who babble" (Mt.6:7) because:',o:['Pagan prayers are spiritually dangerous and can attract demons','God answers prayer based on quality of words, not quantity','God already knows what we need — prayer is not informing God but aligning with him; repetition that has no heart behind it is hollow','Prayer must always be in Hebrew or Aramaic to be effective'],a:3,w:'Matthew 6:7-8 — "your Father knows what you need before you ask him." Prayer doesn\'t inform an ignorant God but aligns the praying person with God\'s purposes and deepens the relationship. Empty repetition (vain babbling) treats prayer as a mechanical technique to get results.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Gospels',ti:'Giving, Fasting and Priorities',su:'Examine Matthew 6 — the three pious acts and \"do not worry\".',steps:[
{lb:'Giving in secret (Matthew 6:1-4)',dr:dQ2,ht:'<p>Jesus taught on three pious acts: giving, prayer and fasting. All three have the same problem (doing them to be seen by people) and the same solution (doing them before God alone). On giving: <em>"When you give to the needy, do not announce it with trumpets, as the hypocrites do in the synagogues and on the streets, to be honoured by others"</em> (Mt.6:2). Instead: <em>"Do not let your left hand know what your right hand is doing, so that your giving may be in secret"</em> (Mt.6:3-4). The hypocrites receive their reward (human applause) in full — and that\'s all they get. Secret giving receives God\'s recognition, which is far greater.</p>'},
{lb:'Fasting in secret (Matthew 6:16-18)',dr:dQ2,ht:'<p>On fasting: the hypocrites disfigure their faces to show others they are fasting. Jesus said: <em>"When you fast, put oil on your head and wash your face, so that it will not be obvious to others that you are fasting, but only to your Father, who is unseen"</em> (Mt.6:17-18). Fasting is a legitimate spiritual discipline — Jesus says "when you fast" (assuming they will), not "if you fast." But it is directed to God, not to human audiences. These three pious acts (giving, prayer, fasting) represent the core of Jewish religious practice — Jesus is not abolishing them but purifying their motivation.</p>'},
{lb:'Do not worry (Matthew 6:25-34)',dr:dQ2,ht:'<p>Jesus commanded: <em>"Do not worry about your life, what you will eat or drink; or about your body, what you will wear"</em> (Mt.6:25). Arguments: (1) God feeds the birds of the air — you are more valuable than birds. (2) Worry adds nothing — it cannot add a single hour to your life (Mt.6:27). (3) God clothes the grass/flowers — will he not clothe you? (Mt.6:30). (4) The Gentiles (who don\'t know God) run after these things. (5) God knows what you need (Mt.6:32). Conclusion: <em>"Seek first his kingdom and his righteousness, and all these things will be given to you as well"</em> (Mt.6:33). This is the great priority — Kingdom first, then everything else.</p>'},
{lb:'Storing treasures in heaven (Matthew 6:19-24)',dr:dQ2,ht:'<p>Jesus warned: <em>"Do not store up for yourselves treasures on earth, where moths and vermin destroy, and where thieves break in and steal"</em> (Mt.6:19). Instead: <em>"store up for yourselves treasures in heaven"</em> (Mt.6:20). Reason: <em>"Where your treasure is, there your heart will be also"</em> (Mt.6:21). Then the eye (6:22-23) — a single eye (undivided focus) brings light; a double vision brings darkness. And the conclusion: <em>"No one can serve two masters...You cannot serve both God and money"</em> (Mt.6:24). Mammon (Aramaic for wealth/money) is a rival to God — not neutral. Jesus demands undivided loyalty.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Jesus said hypocrites "announce their giving with trumpets" in the synagogues. The lesson is:',o:['Giving should always be done publicly to encourage others to give too','The motive for giving determines its spiritual value — giving for human applause gets only human applause','All giving should be through the synagogue treasurer to ensure it is properly used','Jesus was referring to a literal ancient trumpet tradition in Jerusalem'],a:2,w:'Matthew 6:1-4 — the hypocrites\' reward is human recognition (and that\'s all they get). Jesus teaches that the motive for giving determines its spiritual value. Giving to be seen = human reward. Giving in secret = God\'s reward, which far exceeds human applause.'},{q:'"Seek first his kingdom and his righteousness" (Matthew 6:33) is the conclusion to Jesus\' teaching on:',o:['The Lord\'s Prayer — seeking God\'s kingdom through prayer','Avoiding hypocrisy in the three pious acts (giving, prayer, fasting)','Do not worry — anxiety about material needs is overcome by prioritising God\'s kingdom','Storing treasures in heaven rather than on earth'],a:3,w:'Matthew 6:33 is the climax of the "do not worry" section (6:25-34). Jesus addresses anxiety about food, drink and clothing — and concludes: the antidote to material anxiety is spiritual priority. Seek God\'s kingdom first; trust God to provide what is needed.'},{q:'"No one can serve two masters" (Matthew 6:24) — Jesus names the two masters as:',o:['God and the Roman Emperor','God and the Pharisees','God and Mammon (money/wealth) — these are rival lords demanding ultimate loyalty','God and Satan — you must choose one at conversion'],a:3,w:'Matthew 6:24 — "You cannot serve both God and money (Mammon)." Mammon (Aramaic) is not simply a neutral tool — Jesus describes it as a master that demands loyalty. Financial security can become an idol that competes with God for the heart\'s ultimate trust.'},{q:'Jesus said "Do not let your left hand know what your right hand is doing" when giving. This is:',o:['A literal instruction about using only one hand when putting money in the offering','A hyperbole expressing the principle of complete secrecy — giving should be so private you barely notice yourself doing it','A reference to the Mosaic Law about clean and unclean hands','An instruction specifically for left-handed people in the congregation'],a:2,w:'Matthew 6:3 — a vivid hyperbole (intentional exaggeration for effect). The point: giving should be so free of self-congratulation that the giver barely registers it consciously. Complete unselfconsciousness in generosity is the ideal. The left hand = the self that would take pride in the gift.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Gospels',ti:'Judging Others and the Golden Rule',su:'Examine Matthew 7 — judgment, asking, the narrow gate and the Golden Rule.',steps:[
{lb:'Do not judge (Matthew 7:1-5)',dr:dQ1,ht:'<p><em>"Do not judge, or you too will be judged. For in the same way you judge others, you will be judged, and with the measure you use, it will be measured to you"</em> (Mt.7:1-2). Jesus used the vivid image of a plank in the eye: <em>"Why do you look at the speck of sawdust in your brother\'s eye and pay no attention to the plank in your own eye?"</em> (Mt.7:3). This teaching is often misunderstood as forbidding all moral judgment. But Jesus says "first take the plank out of your own eye, and then you will see clearly to remove the speck" (7:5) — self-examination before correcting others, not permanent non-judgment.</p>'},
{lb:'Ask, seek, knock (Matthew 7:7-11)',dr:dQ1,ht:'<p><em>"Ask and it will be given to you; seek and you will find; knock and the door will be opened to you"</em> (Mt.7:7). The three verbs are progressive: asking (simple request), seeking (active searching), knocking (persistent hammering on a door). All are present imperatives in Greek — keep on asking, seeking, knocking. Jesus ground his confidence in God\'s generosity: <em>"Which of you, if your son asks for bread, will give him a stone?"</em> (Mt.7:9). If sinful parents know how to give good gifts, "how much more will your Father in heaven give good gifts to those who ask him!"</em> (Mt.7:11).</p>'},
{lb:'The Golden Rule (Matthew 7:12)',dr:dQ1,ht:'<p><em>"So in everything, do to others what you would have them do to you, for this sums up the Law and the Prophets"</em> (Mt.7:12). The Golden Rule is the positive formulation — many ancient teachers gave it negatively ("do NOT do to others what you would not want done to you" — Rabbi Hillel). Jesus gave the positive form — not just avoiding harm but actively doing good. He claims this one principle summarises the entire OT moral teaching. The Golden Rule requires imagination and empathy — putting yourself in the other person\'s position before acting.</p>'},
{lb:'The two builders (Matthew 7:24-27)',dr:dQ1,ht:'<p>Jesus ended the Sermon with the parable of two builders: <em>"Everyone who hears these words of mine and puts them into practice is like a wise man who built his house on the rock"</em> (Mt.7:24). When storms came, it stood firm. <em>"But everyone who hears these words of mine and does not put them into practice is like a foolish man who built his house on sand"</em> (Mt.7:26). When storms came, it collapsed — great was its fall. The difference is not hearing vs not hearing, but doing vs not doing. The Sermon ends with a call to obedience. This also provides the criterion for entering the Kingdom: not just saying "Lord, Lord" (7:21) but doing the Father\'s will.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'"Do not judge or you too will be judged" (Matthew 7:1) is best understood as:',o:['A total prohibition on all moral evaluation and discernment','A warning against hypocritical judgment — judging others for faults you have yourself (the plank/speck image)','A command that only God and no human being may ever form a moral opinion','A rule specific to the Jewish community and not binding on Gentile Christians'],a:2,w:'Matthew 7:1-5 forbids hypocritical judgment (judging others for what you yourself do — the plank/speck). Jesus then says "first take the plank out of your own eye, and THEN you will see clearly to remove the speck" — implying correction after self-examination is proper.'},{q:'The three progressive verbs in Matthew 7:7 — ask, seek, knock — describe:',o:['Three stages of spiritual development: conversion, growth, maturity','Three types of prayer: private, family and public','Escalating persistence in prayer — from simple requests to active searching to determined knocking','Three types of requests: for physical needs, spiritual needs and others\' needs'],a:3,w:'The Greek present imperatives mean "keep on asking, keep on seeking, keep on knocking" — persistent, escalating intensity in prayer. The progression (passive asking → active seeking → forceful knocking) suggests increasing urgency and perseverance.'},{q:'The Golden Rule (Matthew 7:12) is distinctive because it is:',o:['The first moral principle ever stated in written human history','The positive form — actively doing good to others — rather than the negative form (merely avoiding harm)','Only found in the teaching of Jesus and nowhere else in ancient literature','A purely private moral principle applying only to personal relationships, not public life'],a:2,w:'Rabbi Hillel\'s negative form: "Do NOT do to others what you would not have done to yourself." Jesus gave the positive: "DO to others what you would have them do to you." The positive is more demanding — it requires active, imaginative goodness, not just restraint from harm.'},{q:'In the parable of the two builders, the difference between the wise and foolish builders was:',o:['The quality of the materials they used — stone vs wood','Where they chose to build — near water vs on a hill','Hearing Jesus\' words: the wise man heard them, the foolish man did not','Doing what Jesus taught: both heard his words, but only the wise man put them into practice'],a:4,w:'Matthew 7:24,26 — both builders heard "these words of mine." The difference: the wise man "puts them into practice" (does them); the foolish man "does not put them into practice" (hears only). Jesus ends the Sermon by demanding obedience, not just intellectual agreement.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 Gospels',ti:'The Sermon and Christian Ethics',su:'Apply the Sermon on the Mount to Christian ethics and living.',steps:[
{lb:'The Sermon as Kingdom ethics',dr:dQ2,ht:'<p>The Sermon on the Mount is not a new law-code or a set of rules to earn salvation. It describes the character and ethics of those who have already entered the Kingdom of God. Jesus begins with the Beatitudes (what Kingdom citizens are like) before giving commands (what they do). The ethic is: (1) <b>Inward</b> — rooted in transformed hearts, not external compliance. (2) <b>Radical</b> — going far beyond the minimum (love enemies, not just neighbours). (3) <b>God-centred</b> — motivated by God\'s glory and kingdom, not human praise or reward. (4) <b>Eschatological</b> — pointing toward the coming fullness of God\'s Kingdom. (5) <b>Christocentric</b> — Jesus himself is the model and the enabler.</p>'},
{lb:'Ethics of the heart',dr:dQ2,ht:'<p>The Antitheses (Matthew 5:21-48) all demonstrate one principle: God\'s law is primarily about the condition of the heart. Anger (not just murder), lust (not just adultery), motives in giving/prayer/fasting — Jesus consistently addresses the inner life. This is rooted in the Old Testament (Deuteronomy 6:4-5 — love God with all your heart; Jeremiah 31:33 — the new covenant writes the law on hearts). Paul develops this: "the letter kills, but the Spirit gives life" (2Cor.3:6). True righteousness is not rule-keeping but heart-transformation. The Holy Spirit makes this possible (Romans 8:3-4).</p>'},
{lb:'Social ethics from the Sermon',dr:dQ2,ht:'<p>The Sermon has profound social implications: (1) <b>Enemy love</b> — a radical programme of non-violent resistance and reconciliation. (2) <b>Golden Rule</b> — empathy as the basis of all social interaction. (3) <b>Peacemaking</b> — active pursuit of reconciliation, not passive non-conflict. (4) <b>Justice</b> — "hunger and thirst for righteousness" drives social engagement. (5) <b>Generosity</b> — giving in secret, caring for the needy. (6) <b>Non-retaliation</b> — "turn the other cheek" (a gesture of dignity, not passivity, in the ancient world). Many social reformers (Mahatma Gandhi, Martin Luther King Jr.) drew on the Sermon for their programmes of non-violent resistance.</p>'},
{lb:'Living out the Sermon today',dr:dQ2,ht:'<p>Application of the Sermon: (1) <b>Prayer life</b> — use the Lord\'s Prayer as a daily framework and model. (2) <b>Forgiveness</b> — actively forgive others as the condition for receiving forgiveness. (3) <b>Integrity</b> — no difference between public and private behaviour. (4) <b>Generosity</b> — give without seeking recognition. (5) <b>Worry</b> — replace anxiety with trust in God\'s provision (Matthew 6:33). (6) <b>Ethics</b> — apply the Golden Rule in all decisions. (7) <b>Discipleship</b> — build life on Jesus\' words by doing them. The Sermon is not an impossible ideal but a description of life in the Spirit — Jesus both sets the standard and provides the power to live it.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Sermon on the Mount is best understood as:',o:['A legal code that must be followed to earn salvation','A description of the character and ethics of those who have already entered the Kingdom of God through faith','An impossible ideal that shows humanity we need grace — not intended to be lived literally','A temporary set of instructions for the disciples before Pentecost, now superseded by Paul\'s letters'],a:2,w:'The Beatitudes begin the Sermon — they describe what Kingdom citizens are like, not what to do to become Kingdom citizens. The ethics of the Sermon flow from Kingdom identity, not toward it. It describes the transformed life, enabled by the Spirit.'},{q:'The teaching that Gandhi and Martin Luther King Jr. drew from the Sermon for non-violent resistance was:',o:['The Beatitudes — "blessed are the meek"','The teaching on prayer — "your kingdom come"','The Antithesis on retaliation — "turn the other cheek" and love your enemies (Mt.5:38-44)','The teaching on judging — "do not judge or you too will be judged"'],a:3,w:'Matthew 5:38-44 — "You have heard... an eye for an eye... but I tell you, do not resist an evil person... turn the other cheek... love your enemies." Gandhi\'s satyagraha and King\'s civil rights movement both drew on these principles as a strategy of non-violent direct action.'},{q:'Jeremiah 31:33 ("I will put my law in their minds and write it on their hearts") is relevant to the Sermon because:',o:['It proves the Sermon replaces the Mosaic Law entirely','It shows that the deeper heart-ethic Jesus taught was always the goal — the new covenant fulfils what the Mosaic law pointed toward','It means Christians no longer need to read the Sermon — the law is already inside them','It applies only to Jewish Christians, not to Gentile converts'],a:2,w:'Jeremiah\'s new covenant promise (31:31-34) speaks of God\'s law written on hearts rather than stone tablets. Jesus\' Sermon embodies this: he goes beyond external rules to the transformation of the inner person. The new covenant makes the Sermon\'s ethics possible through the Spirit.'},{q:'The conclusion of the Sermon — the two builders — teaches that Christian faith requires:',o:['Believing the correct doctrine about Jesus\' resurrection and deity','Attending worship regularly and performing the three pious acts faithfully','Hearing and doing — intellectual assent to Jesus\' teaching must be expressed in obedient practice','Having enough faith to stand through any storm that comes in life'],a:3,w:'Matthew 7:24-27 — the difference is not hearing vs not hearing (both builders heard), but DOING vs not doing. "Everyone who hears these words of mine and PUTS THEM INTO PRACTICE" = the wise builder. Authentic discipleship is always expressed in action, not just belief.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 Gospels',ti:'The Narrow Gate and False Prophets',su:'Examine Matthew 7:13-23 — the two ways and warnings.',steps:[
{lb:'The narrow and wide gates (Matthew 7:13-14)',dr:dQ2,ht:'<p><em>"Enter through the narrow gate. For wide is the gate and broad is the road that leads to destruction, and many enter through it. But small is the gate and narrow the road that leads to life, and only a few find it"</em> (Mt.7:13-14). Jesus presents two roads: the wide road (easy, popular, leading to destruction) and the narrow road (demanding, unpopular, leading to life). The image echoes Deuteronomy 30:15-19 ("I set before you today life and prosperity, death and destruction — choose life"). The Sermon\'s entire teaching is the narrow road — demanding, costly, counter-cultural, but leading to life.</p>'},
{lb:'False prophets (Matthew 7:15-20)',dr:dQ2,ht:'<p><em>"Watch out for false prophets. They come to you in sheep\'s clothing, but inwardly they are ferocious wolves"</em> (Mt.7:15). The danger: they appear like genuine disciples but are predators. The test: <em>"By their fruit you will recognise them. Do people pick grapes from thornbushes, or figs from thistles?"</em> (Mt.7:16). Good trees produce good fruit; bad trees produce bad fruit. The criterion is not charismatic speech, doctrinal claims, or appearances — it is the quality of life produced over time. Fruit = character, lifestyle, the community produced by the teaching. This principle protects the church from being misled by plausible but destructive leaders.</p>'},
{lb:'"Lord, Lord" — not everyone who calls on me (Matthew 7:21-23)',dr:dQ2,ht:'<p><em>"Not everyone who says to me, \'Lord, Lord,\' will enter the kingdom of heaven, but only the one who does the will of my Father who is in heaven"</em> (Mt.7:21). Jesus predicts that on the final day, some will claim: "Lord, did we not prophesy in your name and in your name drive out demons and in your name perform many miracles?" (Mt.7:22). Jesus will tell them: <em>"I never knew you. Away from me, you evildoers!"</em> (Mt.7:23). Extraordinary religious activity (prophesying, exorcism, miracles) is not the criterion — doing the Father\'s will and being known by Jesus is. The most searching warning in the Sermon.</p>'},
{lb:'Summary: the authority of Jesus',dr:dQ2,ht:'<p>The Sermon ended: <em>"When Jesus had finished saying these things, the crowds were amazed at his teaching, because he taught as one who had authority, and not as their teachers of the law"</em> (Mt.7:28-29). The scribes taught by citing previous authorities ("Rabbi X said..."). Jesus taught with sovereign authority: "But I tell you..." (six times in the Antitheses). He spoke as the one who had the right to interpret and fulfil the Law — unprecedented in Judaism. His authority was acknowledged even by those who did not follow him. The Sermon presents Jesus as the authoritative Teacher-King of God\'s Kingdom.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The narrow gate that leads to life is described as narrow because:',o:['It is physically smaller than the wide gate','The life Jesus calls people to is demanding, counter-cultural and costly — it excludes the comfortable, easy path','Only a small number of people in history will ever know about it','It requires passing through a literal narrow gate in Jerusalem'],a:2,w:'Matthew 7:13-14 — the narrowness reflects the demanding nature of the Kingdom life described in the Sermon: enemy love, internal righteousness, single-hearted devotion to God, picking up the cross. This is the opposite of the easy, popular, wide road.'},{q:'The test for recognising false prophets (Matthew 7:15-20) is:',o:['Their doctrinal statements — they must agree with the Mosaic Law','Their spiritual gifts — genuine prophets perform real miracles; false ones perform fake ones','Their fruit — the quality of life, character and community they produce over time','Their background — they must have studied under an approved rabbi'],a:3,w:'Matthew 7:16 — "by their fruit you will recognise them." Fruit = long-term life quality: character, relationships, the kind of community their teaching produces. This test requires time and discernment — plausible leaders can appear genuine for a while.'},{q:'Jesus says "I never knew you" to those who prophesied, cast out demons and performed miracles in his name. This means:',o:['Jesus did not witness their miracles personally','Their miracles were all fake and performed by human trickery','Extraordinary religious activity without genuine relationship with Jesus and obedience to God\'s will is worthless','Jesus had poor memory and could not remember them'],a:3,w:'Matthew 7:23 — "I never knew you" = we never had a genuine, obedient relationship. "Knew" (Greek: ginosko) is the intimate knowing of relationship, not intellectual knowledge. Prophesying, exorcism and miracles are not substitutes for genuine obedience and relationship with Jesus.'},{q:'The crowds were amazed that Jesus taught "as one who had authority, and not as their teachers of the law" because:',o:['Jesus spoke more loudly and with more gestures than the scribes','Jesus cited no previous rabbis — he spoke in his own name with sovereign authority ("I say to you")','Jesus\' disciples were better educated than the scribes','Jesus taught in Greek rather than Aramaic, which was seen as more authoritative'],a:2,w:'The scribes\' method: "Rabbi Akiva said in the name of Rabbi Joshua..." — citing authorities. Jesus: "You have heard... but I SAY TO YOU" — sovereign, first-person authority. He claimed the right to interpret and fulfil the Torah on his own authority — unprecedented. The crowd recognised something qualitatively different.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 Gospels',ti:'WAEC Prep — Sermon on the Mount (1)',su:'Practise WAEC-style questions on the Beatitudes and teaching sections.',steps:[
{lb:'WAEC essay approach',dr:dQ1,ht:'<p>For WAEC essays on the Sermon on the Mount: (1) Identify the specific passage (Matthew 5, 6 or 7). (2) Give a clear, organised account of the content. (3) Explain the theological or ethical significance. (4) State one lesson for Christians today. Common questions: "State and explain any four Beatitudes." "Explain what Jesus meant by \'salt of the earth\' and \'light of the world.\'" "Give an account of the Lord\'s Prayer." "What did Jesus teach about worry?" "Describe the parable of the two builders." "What did Jesus teach about giving, prayer and fasting?"</p>'},
{lb:'The Beatitudes — memorisation aid',dr:dQ1,ht:'<p>Eight Beatitudes with promises (Matthew 5:3-10): (1) Poor in spirit → kingdom of heaven. (2) Mourn → comforted. (3) Meek → inherit the earth. (4) Hunger/thirst for righteousness → filled/satisfied. (5) Merciful → shown mercy. (6) Pure in heart → see God. (7) Peacemakers → called children of God. (8) Persecuted for righteousness → kingdom of heaven (same as 1st). Memory pattern: kingdom bookends (1 and 8). Middle four: earth, filled, mercy, God. The first four focus on relationship with God (spiritual poverty, mourning, meekness, hunger). The last four focus on relationship with others (mercy, purity, peace, persecution).</p>'},
{lb:'Common WAEC mistakes',dr:dQ1,ht:'<p>Avoid: Confusing the Beatitudes — "blessed are the peacemakers" not "blessed are the peace-keepers." Stating "poor" instead of "poor in spirit" (they are different). Confusing the Magnificat with the Beatitudes. Saying "do not judge at all under any circumstances" — Jesus means avoid hypocritical judgment. Forgetting the condition in the Lord\'s Prayer: "forgive us AS we have forgiven." Saying the Golden Rule is "negative" — it is the positive form (DOING good, not just AVOIDING harm). Forgetting the two builders\' key difference is hearing AND doing, not just hearing. Missing references — always give chapter and verse.</p>'},
{lb:'Key quotes to memorise',dr:dQ2,ht:'<p>Essential quotes: "Blessed are the poor in spirit, for theirs is the kingdom of heaven" (Mt.5:3). "You are the salt of the earth" (Mt.5:13). "You are the light of the world" (Mt.5:14). "I have not come to abolish the Law but to fulfil it" (Mt.5:17). "Your Father knows what you need before you ask him" (Mt.6:8). "Our Father in heaven, hallowed be your name" (Mt.6:9). "Seek first his kingdom and his righteousness" (Mt.6:33). "Do to others what you would have them do to you" (Mt.7:12). "Enter through the narrow gate" (Mt.7:13). "By their fruit you will recognise them" (Mt.7:16). "I never knew you" (Mt.7:23).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The promise to "those who mourn" (second Beatitude) is that they:',o:['Will receive the kingdom of heaven (present tense)','Will inherit the earth','Will be comforted','Will see God'],a:3,w:'Matthew 5:4 — "Blessed are those who mourn, for they will be COMFORTED." The mourning includes grief over sin, over the brokenness of the world, and over suffering. God promises comfort — echoing Isaiah 61:2 ("to comfort all who mourn").'},{q:'Jesus said "unless your righteousness surpasses that of the Pharisees and the teachers of the law, you will not enter the kingdom of heaven." This was:',o:['An impossible demand, showing that nobody can enter the kingdom by their own efforts','A statement that the Pharisees were not righteous at all and anything would surpass them','A call for a deeper, inward righteousness of the heart — not just external religious compliance','A requirement that disciples memorise more scripture than the Pharisees had done'],a:3,w:'Matthew 5:20 — the Pharisees were highly externally religious. Jesus calls for deeper righteousness: the Antitheses (5:21-48) show this means addressing anger, lust, motives, love of enemies — the inner life. Not more external rules but transformed hearts.'},{q:'When Jesus says "Your Father who sees what is done in secret will reward you" (giving, prayer, fasting), this means:',o:['God only rewards actions that are kept completely private from all human observation','God values the inner motivation and genuine devotion more than public performance — secret devotion receives eternal reward rather than temporary human applause','Christians must never tell anyone about their religious practices under any circumstances','God does not notice publicly performed religious acts at all'],a:2,w:'The contrast is between two types of reward: human applause (immediate but temporary — the hypocrites "have received their reward in full") and God\'s recognition (less visible but eternally more valuable). Secret devotion is not hiding from shame but expressing genuine God-directed motivation.'},{q:'The Lord\'s Prayer is described by Jesus as "how you should pray" (a model), not a formula, because:',o:['The exact words in Aramaic are the only words God hears','Matthew and Luke give slightly different versions — showing it was meant as a pattern, not a verbatim formula to be recited mechanically','The Lord\'s Prayer is too long for daily use in church services','Jesus never actually prayed these words himself'],a:2,w:'Matthew 6:9 — "This, then, is HOW you should pray" — giving the structure and themes, not a verbatim formula. Luke\'s version (11:2-4) differs slightly, confirming it was a pattern. The prayer covers the essential movements: adoration (God\'s name, kingdom, will), petition (bread, forgiveness, protection).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 Gospels',ti:'WAEC Prep — Sermon on the Mount (2)',su:'Further WAEC preparation on Matthew 6 and 7.',steps:[
{lb:'Extended questions practice',dr:dQ2,ht:'<p>Practice 25-mark WAEC essay: "Give an account of the Sermon on the Mount and examine its relevance for Christians today." Structure: Introduction (context, Matthew 5-7, Jesus as new Moses on mountain). Body: (1) Beatitudes — Kingdom character. (2) Salt and light — Christian influence. (3) Jesus fulfils the Law. (4) Antitheses — righteousness of the heart. (5) Lord\'s Prayer. (6) Do not worry — seek first the Kingdom. (7) Golden Rule. (8) Two builders — hearing and doing. Conclusion: The Sermon is the manifesto of the Kingdom — requiring Spirit-enabled living. Relevance: ethics, prayer, social engagement, personal integrity.</p>'},
{lb:'Connecting the Sermon to the rest of Scripture',dr:dQ2,ht:'<p>Connections: Beatitudes echo Psalms 1, 24, 37, Isaiah 61. "Fulfil the Law" connects to Deuteronomy 6-8 and Jeremiah 31. The Lord\'s Prayer echoes the Kaddish (Jewish synagogue prayer for God\'s name and kingdom). "Do not worry" echoes Psalm 23 (God provides). "By their fruit" echoes Psalm 1:3 (righteous like a tree bearing fruit). The narrow way echoes Deuteronomy 30:15-19 (choose life). Two builders echo the wise/foolish contrast in Proverbs. The Sermon also anticipates: the Great Commandment (love God and neighbour — Mt.22:37-40) and the Great Commission (teaching them to obey everything I commanded — Mt.28:20).</p>'},
{lb:'The Sermon and social justice',dr:dQ2,ht:'<p>Social justice dimensions: Beatitudes (the poor, the mourning, the persecuted). Giving to the needy (Mt.6:2-4). Seeking God\'s righteousness (dikaiosynē = right relationships, justice). Golden Rule as social ethics. Enemy love as basis for non-violent conflict resolution. Martin Luther King Jr. in "Letter from a Birmingham Jail" drew directly on the Sermon: love for enemies, non-violent direct action, seeking justice. The Sermon challenges any interpretation of Christianity that is purely private and individualistic — it has public, social and political implications. "Your kingdom come, your will be done on earth" is fundamentally social: God\'s reign on earth.</p>'},
{lb:'WAEC final tips',dr:dQ2,ht:'<p>Final WAEC tips for the Sermon: (1) Know all eight Beatitudes with promises. (2) Know the Lord\'s Prayer by heart — all six petitions. (3) Know at least three Antitheses ("you have heard... but I say"). (4) Know "salt and light" with their social significance. (5) Know "seek first his kingdom" (6:33) and "by their fruit" (7:16) as key summary verses. (6) Know the two builders with the precise difference. (7) Know the warning of 7:21-23 — extraordinary religious activity without relationship with Jesus is worthless. (8) Know that Jesus taught "as one who had authority" — this is Matthew\'s assessment of the Sermon\'s impact on the crowd. Always give references.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'"Seek first his kingdom and his righteousness, and all these things will be given to you" (Matthew 6:33) is the climax of which section?',o:['The Beatitudes — the first section of the Sermon','The section on giving, prayer and fasting (the three pious acts)','The section on worry — prioritising God\'s kingdom overcomes anxiety about material needs','The two builders — the conclusion of the Sermon'],a:3,w:'Matthew 6:25-34 addresses anxiety about food, drink and clothing. Verse 33 is the conclusion: the antidote to material anxiety is Kingdom priority. If God knows what we need and we seek his kingdom first, material needs fall into their proper place.'},{q:'The Sermon on the Mount is described as Jesus\' "manifesto" because:',o:['It was written as a political manifesto to overthrow Roman rule','It sets out the values, ethics, and character of the Kingdom of God — the programme of the new age Jesus inaugurated','Matthew composed it by combining all Jesus\' teachings about the Law into one document for legal purposes','It was Jesus\' personal statement of his own theology about the nature of God'],a:2,w:'The Sermon (Matthew 5-7) is the inaugural address of Jesus\' Kingdom ministry — setting out the nature of the community, its values, ethics and practices. Like a political manifesto, it describes what life under God\'s reign looks like, who belongs and how they live.'},{q:'The Sermon ends with the crowd "amazed at his teaching, for he taught as one who had authority" (Mt 7:28-29). This response was because:',o:['Jesus was louder and more passionate than other teachers','Jesus\' disciples performed miracles as he spoke to confirm his authority','Jesus taught in his own sovereign name (\"I say to you\") rather than citing previous rabbinical authorities as the scribes did','Jesus had official authorisation from the Sanhedrin to teach in Galilee'],a:3,w:'The scribes\' method: citing previous authorities to validate claims. Jesus: "I tell you" — speaking with direct, sovereign authority as if he himself were the ultimate authority on the Torah. This was unprecedented and astonishing. The crowd recognised something qualitatively new.'},{q:'Which of the following best summarises the Sermon\'s relationship to the Law of Moses?',o:['Jesus abolished the Law and replaced it entirely with the two love commandments','Jesus kept the Law the same as Moses and merely taught people to follow it more carefully','Jesus fulfilled the Law — bringing it to its intended completion and interpreting it from the inside (heart) outward','Jesus rejected the Law of Moses entirely and replaced it with the Sermon on the Mount'],a:3,w:'Matthew 5:17 — "not to abolish but to FULFIL." Jesus did not abolish (he is not anti-law) but fulfilled: (1) He is who the Law pointed to. (2) He lived it perfectly. (3) He reinterpreted it from its deepest intention (heart transformation). (4) In him, the new covenant written on hearts (Jer.31:33) is inaugurated.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Sermon on the Mount',su:'Integrated revision across all Sermon on the Mount topics.',steps:[
{lb:'Complete summary',dr:dQ10,ht:'<p>Sermon on the Mount (Matthew 5-7): Beatitudes (5:3-12): eight blessings — Kingdom character, God-focused and others-focused. Salt/light (5:13-16): Christian influence in society — good deeds that glorify God. Fulfil the Law (5:17-20): Jesus completes OT; deeper righteousness needed. Six Antitheses (5:21-48): murder/anger; adultery/lust; divorce; oaths; retaliation; enemy love. Three pious acts (6:1-18): giving, prayer (Lord\'s Prayer 6:9-13), fasting — in secret. Do not worry (6:25-34): seek first the Kingdom (6:33). Treasure in heaven (6:19-24): no serving two masters. Do not judge (7:1-5): plank/speck. Ask/seek/knock (7:7-11). Golden Rule (7:12). Narrow gate (7:13-14). False prophets (7:15-20): fruit test. Lord, Lord (7:21-23). Two builders (7:24-27).</p>'},
{lb:'Key themes',dr:dQ10,ht:'<p>Key themes: (1) <b>Heart</b> — God\'s law addresses the inner life, not just behaviour. (2) <b>Authenticity</b> — real faith vs religious performance (three pious acts). (3) <b>Kingdom priority</b> — God\'s rule comes first; then everything else. (4) <b>Radical ethics</b> — enemy love, non-retaliation, generosity. (5) <b>Divine Fatherhood</b> — God as Father who provides, forgives, sees in secret. (6) <b>Fruit</b> — life quality is the test of genuine discipleship. (7) <b>Doing</b> — hearing is not enough; obedient action is required. (8) <b>Authority</b> — Jesus teaches as the sovereign interpreter of God\'s will. All themes flow from the central truth: Jesus is the King of the Kingdom he describes.</p>'},
{lb:'Exam practice',dr:dQ1,ht:'<p>Practice questions with key points: "Explain the meaning of the Beatitudes" — give all eight, link to Kingdom character and OT background (Psalms 37, 24, Isaiah 61). "What did Jesus teach about prayer?" — Lord\'s Prayer structure (God-focus first, then human needs); pray in secret; God knows needs already; forgiveness is conditional. "Describe the parable of the two builders" — both hear, only one does; wise man on rock (storms pass); foolish on sand (great fall); discipleship = hearing AND doing. "What does Jesus mean by salt and light?" — salt (preservation, flavour); light (illumination, guidance); good deeds leading to God\'s glory.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final WAEC tips: (1) Memorise all eight Beatitudes with their exact promises. (2) Know the Lord\'s Prayer word-for-word with meaning of each petition. (3) Know at least three Antitheses with their structure ("you have heard X... but I say Y"). (4) Know the condition attached to forgiveness (Mt.6:12,14-15). (5) Know "seek first the Kingdom" (6:33) as the summary of Christian priorities. (6) Know "by their fruit you will recognise them" (7:16) as the test for authentic discipleship and false prophets. (7) Know the two builders with the key difference (doing vs not doing). (8) Know Jesus taught "with authority" — his own sovereign authority, not citing others. Always give references.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'The Lord\'s Prayer has six petitions. The first three concern:',o:['Daily needs: bread, forgiveness, protection','God-centred concerns: his name, his kingdom, his will — before personal requests','The disciples\' personal relationship with Jesus as Lord','The coming judgment on false prophets'],a:2,w:'Matthew 6:9-10 — "hallowed be your name / your kingdom come / your will be done." The first three petitions are entirely God-centred: his honour, his rule, his purposes. Personal needs (bread, forgiveness, protection) come only after this God-ward orientation.'},{q:'"By their fruit you will recognise them" (Matthew 7:16) — the fruit refers to:',o:['The number of miracles a prophet performs','The quantity of converts they produce','The quality of life, character and community their teaching produces over time','Their theological statements and doctrinal positions'],a:3,w:'Matthew 7:16-20 — fruit = long-term evidence of genuine spiritual life. Character, relationships, the kind of community their teaching creates. False prophets appear genuine (sheep\'s clothing) but their lives eventually show who they really are. Time and discernment are required.'},{q:'The phrase "enter through the narrow gate" (Matthew 7:13) contrasts with:',o:['The Temple gate in Jerusalem, which was wide and accessible','The wide gate and broad road that leads to destruction — the easy, popular, comfortable path','The gateway to the promised land that Israel entered after 40 years of wandering','The gate of wisdom that Proverbs describes as hard to find'],a:2,w:'Matthew 7:13-14 — "wide is the gate and broad is the road that leads to destruction, and many enter through it; small is the gate and narrow the road that leads to life, and only a few find it." The narrow way = the costly, counter-cultural life of the Sermon. The broad way = going along with the crowd.'},{q:'The Sermon on the Mount concludes with:',o:['The giving of the Great Commission — "go and make disciples"','The crowd\'s recognition that Jesus taught with unique authority, unlike the teachers of the law','The disciples asking Jesus to teach them to pray (leading to the Lord\'s Prayer)','The Transfiguration on the mountain where Jesus had delivered the Sermon'],a:2,w:'Matthew 7:28-29 — "When Jesus had finished saying these things, the crowds were amazed at his teaching, because he taught as one who had authority, and not as their teachers of the law." This is Matthew\'s conclusion: the crowd recognised Jesus\' unique, sovereign authority — a key Christological statement ending the Sermon.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
