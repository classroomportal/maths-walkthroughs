ntirely physical, non-spiritual change"],"a":1,"w":"This lesson describes this crossing as a decisive spiritual transition already accomplished through faith."},{"q":"When will eternal life be fully realised, according to this lesson?","o":["Only through repeated religious ritual","Immediately upon physical birth","In the resurrection and the new creation","It is never fully realised at all"],"a":2,"w":"Eternal life will be fully realised in the resurrection and the new creation, according to this lesson."},{"q":"What will believers experience when eternal life is fully realised, according to this lesson?","o":["A temporary experience with an eventual end","A return to their present earthly circumstances","Continued uncertainty about their standing with God","Unbroken, perfected fellowship with God forever"],"a":3,"w":"Believers will experience unbroken, perfected fellowship with God forever, according to this lesson."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

{ey:"Q4 \u2022 CRS \u2022 Acts & Epistles",ti:"Hope in the Midst of Suffering",su:"Explain how Christian hope sustains believers through present suffering.",steps:[
{lb:"Present sufferings not worth comparing",dr:dQ2,ht:"<p>Paul writes, <em>\"I consider that our present sufferings are not worth comparing with the glory that will be revealed in us\"</em> (Romans 8:18) &mdash; future hope reframes and gives perspective to present pain.</p>"},
{lb:"Suffering produces perseverance",dr:dQ2,ht:"<p>Romans 5:3-4 describes a progression: <em>\"suffering produces perseverance; perseverance, character; and character, hope\"</em> &mdash; hope is not undermined by suffering, but can be deepened through it.</p>"},
{lb:"Light and momentary troubles",dr:dQ2,ht:"<p>2 Corinthians 4:17 calls present troubles <em>\"light and momentary,\"</em> achieving <em>\"an eternal glory that far outweighs them all\"</em> &mdash; a striking contrast between present hardship and future glory.</p>"},
{lb:"Fixing eyes on the unseen",dr:dQ2,ht:"<p>Believers are called to fix their eyes <em>\"not on what is seen, but on what is unseen\"</em> (2 Corinthians 4:18), since the unseen, eternal realities outlast every present, temporary circumstance.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Paul say about present sufferings, in Romans 8:18?","o":["They are not worth comparing with the coming glory","They will last forever, with no end in sight","They have no connection to future glory at all","They should be avoided at all costs"],"a":0,"w":"Paul says present sufferings are not worth comparing with the coming glory (Romans 8:18)."},{"q":"What does this lesson say future hope does to present pain, based on Romans 8:18?","o":["Eliminates it immediately and completely","Reframes and gives perspective to it","Has no real effect on it at all","Increases its intensity and duration"],"a":1,"w":"This lesson says future hope reframes and gives perspective to present pain, based on Romans 8:18."},{"q":"What progression does Romans 5:3-4 describe, starting with suffering?","o":["Suffering produces anger, then bitterness","Suffering produces despair, with no further progression","Suffering produces perseverance, perseverance produces character, character produces hope","Suffering has no connection to any positive outcome"],"a":2,"w":"Romans 5:3-4 describes suffering producing perseverance, perseverance producing character, and character producing hope."},{"q":"What does this lesson say about hope and suffering, based on Romans 5:3-4?","o":["Hope only exists in the complete absence of suffering","Hope is always destroyed by suffering","Suffering and hope have no real connection","Hope can be deepened through suffering, not undermined by it"],"a":3,"w":"This lesson says hope can be deepened through suffering, not undermined by it."},{"q":"How does 2 Corinthians 4:17 describe present troubles?","o":["\"Light and momentary\"","Permanent and unbearable","Entirely unrelated to eternal glory","Equal in weight to eternal glory"],"a":0,"w":"2 Corinthians 4:17 describes present troubles as \"light and momentary.\""},{"q":"What does 2 Corinthians 4:17 say these troubles achieve?","o":["Nothing of any lasting value","An eternal glory that far outweighs them all","Only temporary relief with no eternal significance","A glory equal only to the suffering itself"],"a":1,"w":"2 Corinthians 4:17 says these troubles achieve an eternal glory that far outweighs them all."},{"q":"What are believers called to fix their eyes on, according to 2 Corinthians 4:18?","o":["Nothing at all — sight is irrelevant to faith","Only what is immediately visible and present","What is unseen, not what is seen","Only their own personal circumstances"],"a":2,"w":"Believers are called to fix their eyes on what is unseen, not what is seen (2 Corinthians 4:18)."},{"q":"Why does 2 Corinthians 4:18 say the unseen matters more than the seen?","o":["Both the seen and unseen are equally temporary","The seen is always more reliable and lasting","The unseen has no real bearing on present life","The unseen, eternal realities outlast every present, temporary circumstance"],"a":3,"w":"The unseen, eternal realities outlast every present, temporary circumstance, according to 2 Corinthians 4:18."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q5 \u2022 CRS \u2022 Acts & Epistles",ti:"The Resurrection Body",su:"Explain Paul\u2019s teaching on the nature of the believer\u2019s future resurrected body.",steps:[
{lb:"Sown perishable, raised imperishable",dr:dQ1,ht:"<p>1 Corinthians 15:42 teaches, <em>\"The body that is sown is perishable, it is raised imperishable\"</em> &mdash; using the image of a planted seed to describe the transformation from mortal to eternal existence.</p>"},
{lb:"Sown in weakness, raised in power",dr:dQ1,ht:"<p>1 Corinthians 15:43 continues, <em>\"it is sown in weakness, it is raised in power\"</em> &mdash; the resurrection body will be free from the frailty, illness and limitation of the present body.</p>"},
{lb:"A spiritual body",dr:dQ1,ht:"<p>1 Corinthians 15:44 describes the resurrection body as a <b>\"spiritual body\"</b> &mdash; not immaterial or ghost-like, but a physical body wholly transformed and empowered by the Spirit.</p>"},
{lb:"Like Christ's glorious body",dr:dQ1,ht:"<p>Philippians 3:21 promises that Christ <em>\"will transform our lowly bodies so that they will be like his glorious body\"</em> &mdash; the pattern for the believer's resurrection is Christ's own resurrected body.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does 1 Corinthians 15:42 say about the body that is sown, compared to the body that is raised?","o":["It is sown perishable, raised imperishable","It is sown imperishable, raised perishable","It remains identical, with no change at all","It is sown in glory, raised in weakness"],"a":0,"w":"1 Corinthians 15:42 says the body is sown perishable, raised imperishable."},{"q":"What image does this lesson say describes this transformation, based on 1 Corinthians 15?","o":["A rebuilt house","A planted seed","A repaired garment","A refined metal"],"a":1,"w":"This lesson says a planted seed describes this transformation, based on 1 Corinthians 15."},{"q":"What does 1 Corinthians 15:43 say about the body sown in weakness?","o":["It is destroyed entirely with no resurrection","It remains weak permanently","It is raised in power","It is raised only partially transformed"],"a":2,"w":"1 Corinthians 15:43 says the body sown in weakness is raised in power."},{"q":"What does this lesson say the resurrection body will be free from?","o":["Only emotional struggles, but not physical ones","All physical existence whatsoever","Any connection to the present body","The frailty, illness and limitation of the present body"],"a":3,"w":"This lesson says the resurrection body will be free from the frailty, illness and limitation of the present body."},{"q":"What term does 1 Corinthians 15:44 use to describe the resurrection body?","o":["\"A spiritual body\"","\"A purely symbolic body\"","\"An identical replica of the present body\"","\"A body with no physical existence at all\""],"a":0,"w":"1 Corinthians 15:44 describes the resurrection body as \"a spiritual body.\""},{"q":"What does this lesson clarify a \"spiritual body\" is NOT?","o":["Physical","Immaterial or ghost-like","Transformed by the Spirit","Connected to the present body"],"a":1,"w":"This lesson clarifies a \"spiritual body\" is not immaterial or ghost-like."},{"q":"What does Philippians 3:21 promise Christ will do to believers' lowly bodies?","o":["Leave them entirely unchanged","Destroy them permanently with no transformation","Transform them to be like His glorious body","Replace them with a purely spiritual, non-bodily existence"],"a":2,"w":"Philippians 3:21 promises Christ will transform believers' lowly bodies to be like His glorious body."},{"q":"What pattern does this lesson say the believer's resurrection follows, based on Philippians 3:21?","o":["Only a temporary, non-permanent transformation","A body entirely different from Christ's resurrection","No particular pattern at all","Christ's own resurrected body"],"a":3,"w":"This lesson says the believer's resurrection follows the pattern of Christ's own resurrected body."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q6 \u2022 CRS \u2022 Acts & Epistles",ti:"The Return of Christ",su:"Explain the biblical hope of Christ\u2019s promised return.",steps:[
{lb:"This same Jesus will come back",dr:dQ2,ht:"<p>At the ascension, angels declared, <em>\"This same Jesus, who has been taken from you into heaven, will come back in the same way you have seen him go\"</em> (Acts 1:11) &mdash; a definite, promised future event.</p>"},
{lb:"The Lord himself will come down",dr:dQ2,ht:"<p>1 Thessalonians 4:16 describes that <em>\"the Lord himself will come down from heaven, with a loud command\"</em> &mdash; a visible, unmistakable, personal return, not a vague or symbolic event.</p>"},
{lb:"The dead in Christ will rise",dr:dQ2,ht:"<p>1 Thessalonians 4:16-17 promises that <em>\"the dead in Christ will rise first,\"</em> followed by living believers being <b>caught up together</b> with them to meet the Lord.</p>"},
{lb:"Encourage one another with these words",dr:dQ2,ht:"<p>Paul concludes this teaching, <em>\"encourage one another with these words\"</em> (1 Thessalonians 4:18) &mdash; the hope of Christ's return is meant to comfort and strengthen believers, especially those grieving loss.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What did the angels declare at Jesus's ascension, according to Acts 1:11?","o":["\"This same Jesus... will come back in the same way you have seen him go\"","\"Jesus has departed permanently, with no return\"","\"Only His teachings will remain, not His person\"","\"His return is uncertain and undefined\""],"a":0,"w":"The angels declared, \"This same Jesus... will come back in the same way you have seen him go\" (Acts 1:11)."},{"q":"What kind of event does this lesson say Christ's return is, based on Acts 1:11?","o":["An uncertain, symbolic idea only","A definite, promised future event","An event that has already occurred invisibly","An irrelevant detail with no real significance"],"a":1,"w":"This lesson says Christ's return is a definite, promised future event, based on Acts 1:11."},{"q":"What does 1 Thessalonians 4:16 say the Lord Himself will do?","o":["Send only a symbolic representative","Remain permanently distant from creation","Come down from heaven with a loud command","Return invisibly with no visible sign"],"a":2,"w":"1 Thessalonians 4:16 says the Lord Himself will come down from heaven with a loud command."},{"q":"What kind of return does this lesson describe, based on 1 Thessalonians 4:16?","o":["An entirely private, unnoticed event","A vague, symbolic event only","An event limited only to a select few witnesses","A visible, unmistakable, personal return"],"a":3,"w":"This lesson describes a visible, unmistakable, personal return, based on 1 Thessalonians 4:16."},{"q":"What does 1 Thessalonians 4:16 promise about the dead in Christ?","o":["They will rise first","They will never rise again","They will rise only after all others","They have no connection to Christ's return"],"a":0,"w":"1 Thessalonians 4:16 promises the dead in Christ will rise first."},{"q":"What happens to living believers after the dead in Christ rise, according to 1 Thessalonians 4:17?","o":["They will remain permanently on earth alone","They will be caught up together with them to meet the Lord","They will be excluded from this event entirely","They will face judgment separately with no reunion"],"a":1,"w":"1 Thessalonians 4:17 says living believers will be caught up together with the risen dead to meet the Lord."},{"q":"What instruction does Paul give in 1 Thessalonians 4:18?","o":["\"Avoid discussing this topic with grieving believers\"","\"Keep this teaching entirely secret\"","\"Encourage one another with these words\"","\"Fear this future event above all else\""],"a":2,"w":"Paul instructs, \"Encourage one another with these words\" (1 Thessalonians 4:18)."},{"q":"What is this teaching about Christ's return meant to do for believers, according to this lesson?","o":["Have no practical, comforting effect at all","Cause fear and anxiety about the future","Discourage hope in any future event","Comfort and strengthen them, especially those grieving loss"],"a":3,"w":"This teaching is meant to comfort and strengthen believers, especially those grieving loss, according to this lesson."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q7 \u2022 CRS \u2022 Acts & Epistles",ti:"Judgement and Accountability",su:"Explain the biblical teaching on final judgement as part of the Christian hope.",steps:[
{lb:"Appearing before the judgement seat",dr:dQ1,ht:"<p>2 Corinthians 5:10 teaches, <em>\"we must all appear before the judgment seat of Christ, so that each of us may receive what is due us\"</em> &mdash; a coming accountability for how believers have lived.</p>"},
{lb:"A day appointed for judgement",dr:dQ1,ht:"<p>Acts 17:31 states God <em>\"has set a day when he will judge the world with justice by the man he has appointed\"</em> &mdash; final judgement is fixed and certain, not an open-ended possibility.</p>"},
{lb:"No condemnation for those in Christ",dr:dQ1,ht:"<p>Romans 8:1 assures believers, <em>\"there is now no condemnation for those who are in Christ Jesus\"</em> &mdash; judgement for believers concerns reward and accountability, not condemnation for sin already forgiven.</p>"},
{lb:"A book of life",dr:dQ1,ht:"<p>Revelation 20:15 warns that <em>\"anyone whose name was not found written in the book of life was thrown into the lake of fire\"</em> &mdash; final judgement carries real, eternal consequence for those who reject Christ.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does 2 Corinthians 5:10 say believers must do?","o":["Appear before the judgment seat of Christ","Avoid all future accountability","Escape judgement entirely, with no consequence","Face judgement only in this present life"],"a":0,"w":"2 Corinthians 5:10 says believers must appear before the judgment seat of Christ."},{"q":"What does this appearance concern, according to 2 Corinthians 5:10?","o":["Only avoiding future punishment","Receiving what is due for how one has lived","A random, unrelated evaluation","No real consequence of any kind"],"a":1,"w":"This appearance concerns receiving what is due for how one has lived, according to 2 Corinthians 5:10."},{"q":"What does Acts 17:31 say God has set?","o":["A day only for judging unbelievers, not believers","No particular day for judgement at all","A day when He will judge the world with justice","An indefinite, uncertain timeline for judgement"],"a":2,"w":"Acts 17:31 says God has set a day when He will judge the world with justice."},{"q":"What does this lesson say about the nature of final judgement, based on Acts 17:31?","o":["It has no real connection to justice at all","It is uncertain and may never occur","It applies only to a select few individuals","It is fixed and certain, not an open-ended possibility"],"a":3,"w":"This lesson says final judgement is fixed and certain, based on Acts 17:31."},{"q":"What does Romans 8:1 assure believers?","o":["There is now no condemnation for those in Christ Jesus","All believers still face condemnation for past sins","Condemnation applies equally to believers and unbelievers","No assurance of any kind is given"],"a":0,"w":"Romans 8:1 assures believers there is now no condemnation for those in Christ Jesus."},{"q":"What does judgement for believers concern, according to this lesson's reading of Romans 8:1?","o":["Condemnation for every sin ever committed","Reward and accountability, not condemnation for forgiven sin","No real distinction from judgement for unbelievers","An entirely irrelevant future event"],"a":1,"w":"This lesson says judgement for believers concerns reward and accountability, not condemnation for forgiven sin."},{"q":"What does Revelation 20:15 warn about names not found in the book of life?","o":["This verse has no real consequence attached","Such people receive a second opportunity automatically","Such people were thrown into the lake of fire","Such people are simply forgotten with no judgement"],"a":2,"w":"Revelation 20:15 warns that those not found in the book of life were thrown into the lake of fire."},{"q":"What does this lesson say final judgement carries, for those who reject Christ?","o":["A consequence identical to that faced by believers","No real consequence at all","Only a temporary, minor penalty","Real, eternal consequence"],"a":3,"w":"This lesson says final judgement carries real, eternal consequence for those who reject Christ."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q8 \u2022 CRS \u2022 Acts & Epistles",ti:"Living in Light of Eternal Hope",su:"Explain how the hope of eternal life should shape believers\u2019 present conduct and priorities.",steps:[
{lb:"Setting hearts on things above",dr:dQ2,ht:"<p>Colossians 3:1-2 instructs, <em>\"Set your hearts on things above... Set your minds on things above, not on earthly things\"</em> &mdash; eternal hope reorders present priorities and values.</p>"},
{lb:"Purifying oneself",dr:dQ2,ht:"<p>1 John 3:2-3 teaches that <em>\"everyone who has this hope in him purifies himself, just as he is pure\"</em> &mdash; genuine hope in Christ's return produces present moral transformation, not complacency.</p>"},
{lb:"Not growing weary in doing good",dr:dQ2,ht:"<p>Galatians 6:9 encourages, <em>\"Let us not become weary in doing good, for at the proper time we will reap a harvest if we do not give up\"</em> &mdash; future reward sustains present perseverance in good works.</p>"},
{lb:"Always giving a reason for hope",dr:dQ2,ht:"<p>1 Peter 3:15 instructs believers to <em>\"always be prepared to give an answer... for the hope that you have\"</em> &mdash; Christian hope should be visible and explainable to a watching world.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Colossians 3:1-2 instruct believers to set their hearts and minds on?","o":["Things above, not earthly things","Only earthly achievements and success","Nothing in particular","Only their own personal comfort"],"a":0,"w":"Colossians 3:1-2 instructs setting hearts and minds on things above, not earthly things."},{"q":"What does this lesson say eternal hope does to present priorities, based on Colossians 3?","o":["Has no real effect on present priorities","Reorders present priorities and values","Makes present priorities entirely irrelevant to consider","Only affects priorities after death, not now"],"a":1,"w":"This lesson says eternal hope reorders present priorities and values, based on Colossians 3."},{"q":"What does 1 John 3:2-3 say everyone who has this hope does?","o":["Focuses only on future reward, ignoring present behaviour","Becomes indifferent to moral conduct","Purifies himself, just as Christ is pure","Rejects the need for any personal transformation"],"a":2,"w":"1 John 3:2-3 says everyone who has this hope purifies himself, just as Christ is pure."},{"q":"What does this lesson say genuine hope in Christ's return produces, based on 1 John 3?","o":["Only a future change, with no present effect","Complete indifference to present conduct","No real change in behaviour at all","Present moral transformation, not complacency"],"a":3,"w":"This lesson says genuine hope produces present moral transformation, not complacency, based on 1 John 3."},{"q":"What does Galatians 6:9 encourage believers not to become?","o":["Weary in doing good","Wealthy through good works","Overly confident in their own efforts","Reluctant to ever begin doing good"],"a":0,"w":"Galatians 6:9 encourages believers not to become weary in doing good."},{"q":"What does Galatians 6:9 promise for those who do not give up?","o":["Immediate reward with no waiting","A harvest at the proper time","No reward of any kind","A harvest only in this present life"],"a":1,"w":"Galatians 6:9 promises a harvest at the proper time for those who do not give up."},{"q":"What does 1 Peter 3:15 instruct believers to always be prepared to give?","o":["No response at all to questions about faith","A defence against all criticism regardless of topic","An answer for the hope that they have","An answer only when convenient"],"a":2,"w":"1 Peter 3:15 instructs believers to always be prepared to give an answer for the hope that they have."},{"q":"What does this lesson say Christian hope should be, according to 1 Peter 3:15?","o":["Something only for religious professionals to explain","Kept entirely private and never discussed","Irrelevant to how believers interact with others","Visible and explainable to a watching world"],"a":3,"w":"This lesson says Christian hope should be visible and explainable to a watching world, according to 1 Peter 3:15."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q9 \u2022 CRS \u2022 Acts & Epistles",ti:"WAEC Exam Preparation \u2014 Hope and Eternal Life",su:"Practise WAEC-style questions on hope and eternal life in the Epistles.",steps:[
{lb:"WAEC essay structure",dr:dQ1,ht:"<p>For WAEC essays on hope and eternal life: (1) Identify the <b>specific passage or theme</b>. (2) Give the <b>precise reference</b>. (3) Explain the teaching <b>clearly</b>. (4) Draw out a <b>practical application</b>.</p>"},
{lb:"Common WAEC question patterns",dr:dQ1,ht:"<p>Common patterns include: \"Explain why the resurrection is the foundation of Christian hope.\" / \"Discuss Paul's teaching on the resurrection body in 1 Corinthians 15.\" / \"How does hope sustain believers through suffering?\"</p>"},
{lb:"Key references to remember",dr:dQ1,ht:"<p>Key references: <b>1 Corinthians 15:17-20</b> (resurrection foundation); <b>John 17:3, 5:24</b> (eternal life present/future); <b>Revelation 21:1-5</b> (new heaven and earth); <b>Romans 8:18</b> (present suffering); <b>1 Thessalonians 4:16-18</b> (Christ's return); <b>2 Corinthians 5:10</b> (judgement).</p>"},
{lb:"Connecting to practical hope",dr:dQ1,ht:"<p>WAEC essays should always connect teaching to <b>practical Christian hope today</b> &mdash; perseverance, purity and comfort in grief &mdash; rather than treating eternal life only as an abstract doctrine.</p>"},
{lb:"Your turn",dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on hope and eternal life?","o":["Identify the specific passage or theme asked about","Give a personal opinion with no facts","List unrelated facts","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on hope and eternal life should begin by identifying the specific passage or theme asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe Nigeria's climate zones.\"","\"Discuss Paul's teaching on the resurrection body in 1 Corinthians 15.\"","\"Define an alkane.\"","\"List West African seaports.\""],"a":1,"w":"\"Discuss Paul's teaching on the resurrection body in 1 Corinthians 15\" is a typical WAEC-style question."},{"q":"Which passage should be cited when discussing the resurrection as the foundation of hope?","o":["Revelation 21:1","John 17:3","1 Corinthians 15:17-20","Acts 17:31"],"a":2,"w":"1 Corinthians 15:17-20 should be cited when discussing the resurrection as the foundation of hope."},{"q":"Which verses should be cited when discussing eternal life as present and future?","o":["Galatians 6:9","1 Thessalonians 4:16","2 Corinthians 5:10","John 17:3 and John 5:24"],"a":3,"w":"John 17:3 and John 5:24 should be cited when discussing eternal life as present and future."},{"q":"Which passage should be cited when discussing the new heaven and new earth?","o":["Revelation 21:1-5","Romans 8:18","Philippians 3:21","1 John 3:2-3"],"a":0,"w":"Revelation 21:1-5 should be cited when discussing the new heaven and new earth."},{"q":"Which verse should be cited when discussing hope sustaining believers through suffering?","o":["Acts 1:11","Romans 8:18","2 Corinthians 5:10","Colossians 3:1-2"],"a":1,"w":"Romans 8:18 should be cited when discussing hope sustaining believers through suffering."},{"q":"Which passage should be cited when discussing Christ's promised return?","o":["John 5:24","1 Corinthians 15:42-44","1 Thessalonians 4:16-18","Revelation 20:15"],"a":2,"w":"1 Thessalonians 4:16-18 should be cited when discussing Christ's promised return."},{"q":"Why should WAEC essays connect teaching to practical Christian hope today?","o":["WAEC forbids discussing daily life applications","Practical application is irrelevant to WAEC marking","Only abstract theology should be discussed","It shows the theology remains relevant to real Christian life"],"a":3,"w":"Connecting to practical hope shows the theology remains relevant to real Christian life, which WAEC rewards."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:"Q10 \u2022 CRS \u2022 Acts & Epistles",ti:"Mixed Questions \u2014 Hope and Eternal Life",su:"Integrated revision across the resurrection, eternal life, Christ\u2019s return and final judgement.",steps:[
{lb:"Summary of key themes",dr:dQ2,ht:"<p>Christian hope is founded on Christ's resurrection, encompasses present and future eternal life, anticipates a renewed creation and Christ's visible return, and calls believers to live purified, persevering lives now.</p>"},
{lb:"Key references to remember",dr:dQ2,ht:"<p>Must-know facts: <b>1 Corinthians 15:17-20</b> (resurrection foundation); <b>John 17:3, 5:24</b> (eternal life); <b>Revelation 21:1-5</b> (new creation); <b>Romans 8:18</b> (suffering and glory); <b>1 Thessalonians 4:16-18</b> (Christ's return); <b>2 Corinthians 5:10</b> (judgement).</p>"},
{lb:"Lessons for today",dr:dQ2,ht:"<p>These teachings call believers to hold firmly to hope, persevere through suffering, live purified lives, and comfort one another with the promise of Christ's return and eternal life.</p>"},
{lb:"Final exam tips",dr:dQ2,ht:"<p>Always give the <b>precise reference</b>, explain the teaching <b>clearly and accurately</b>, and conclude by connecting the passage to a practical, everyday example of Christian hope.</p>"},
{lb:"Your turn",dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What does Paul say happens to faith if Christ has not been raised, in 1 Corinthians 15:17?","o":["Faith is futile","Faith remains entirely unaffected","Faith becomes stronger regardless","Faith transforms into a different religion"],"a":0,"w":"Paul says faith is futile if Christ has not been raised (1 Corinthians 15:17)."},{"q":"How does Jesus define eternal life, in John 17:3?","o":["Simply living forever, with no relational dimension","Knowing God the Father and Jesus Christ, whom He sent","Escaping all physical suffering permanently","Achieving great personal wealth and success"],"a":1,"w":"Jesus defines eternal life in John 17:3 as knowing God the Father and Jesus Christ, whom He sent."},{"q":"What did John see in his vision, according to Revelation 21:1?","o":["A vision limited only to the church","Only a return to the original Eden","A new heaven and a new earth","No lasting future for creation at all"],"a":2,"w":"John saw a new heaven and a new earth, according to Revelation 21:1."},{"q":"What does Paul say about present sufferings, in Romans 8:18?","o":["They should be avoided at all costs","They will last forever, with no end in sight","They have no connection to future glory at all","They are not worth comparing with the coming glory"],"a":3,"w":"Paul says present sufferings are not worth comparing with the coming glory (Romans 8:18)."},{"q":"What did the angels declare at Jesus's ascension, according to Acts 1:11?","o":["\"This same Jesus... will come back in the same way you have seen him go\"","\"Jesus has departed permanently, with no return\"","\"Only His teachings will remain, not His person\"","\"His return is uncertain and undefined\""],"a":0,"w":"The angels declared, \"This same Jesus... will come back in the same way you have seen him go\" (Acts 1:11)."},{"q":"What does 2 Corinthians 5:10 say believers must do?","o":["Avoid all future accountability","Appear before the judgment seat of Christ","Escape judgement entirely, with no consequence","Face judgement only in this present life"],"a":1,"w":"2 Corinthians 5:10 says believers must appear before the judgment seat of Christ."},{"q":"What does 1 John 3:2-3 say everyone who has this hope does?","o":["Focuses only on future reward, ignoring present behaviour","Becomes indifferent to moral conduct","Purifies himself, just as Christ is pure","Rejects the need for any personal transformation"],"a":2,"w":"1 John 3:2-3 says everyone who has this hope purifies himself, just as Christ is pure."},{"q":"What overall lesson unites the themes studied in this topic?","o":["Hope in eternal life is a minor, secondary Christian belief","Christian hope has no connection to present conduct","Only future events matter, with no present relevance","Christian hope, grounded in the resurrection, shapes present perseverance and future confidence"],"a":3,"w":"The unifying lesson is that Christian hope, grounded in the resurrection, shapes present perseverance and future confidence."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
