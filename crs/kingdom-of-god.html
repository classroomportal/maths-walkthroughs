<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Kingdom of God — Parables',ACC,12,'middle',true));
[['Parable','Key Teaching','Reference'],['Mustard Seed','Kingdom starts tiny; grows enormous','Matt 13:31-32'],['Yeast/Leaven','Kingdom works invisibly but transforms all','Matt 13:33'],['Hidden Treasure','Kingdom worth giving everything to obtain','Matt 13:44'],['Pearl of Great Price','Kingdom surpasses all other values','Matt 13:45-46'],['Net/Dragnet','Kingdom gathers all; final judgment separates','Matt 13:47-50'],['Prodigal Son','Kingdom = God\'s radical, costly welcome','Luke 15:11-32'],['Great Banquet','Kingdom open to outcasts when elite refuse','Luke 14:15-24']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(255,34+i*28,r[1],'#444',7,'middle',false));o.push(T(400,34+i*28,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'The Kingdom of God — Key Dimensions',ACC,12,'middle',true));
[['Dimension','Meaning','Key text'],['Present','Kingdom already here in Jesus\' ministry','Luke 11:20 / Matt 12:28'],['Future','Kingdom fully coming at Christ\'s return','Matt 25:31-46'],['Repentance','Entry requires turning from sin','Mark 1:14-15'],['New birth','Must be born again to see/enter','John 3:3-5'],['Righteousness','Kingdom = righteousness, peace, joy in Spirit','Romans 14:17'],['Childlikeness','Must receive like a child','Mark 10:15'],['Radical cost','Worth giving up everything','Matt 13:44-46']].forEach(function(r,i){if(i<=p){o.push(R(10,20+i*28,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(110,34+i*28,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(250,34+i*28,r[1],'#444',7,'middle',false));o.push(T(410,34+i*28,r[2],'#666',6,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Kingdom of God — Summary',ACC,13,'middle',true));
[['Present reality','Already here — in Jesus\' ministry, healings, exorcisms'],['Future hope','Not yet fully — awaits Christ\'s return and final judgment'],['Entry conditions','Repentance, faith, new birth, childlike trust'],['Kingdom vs world','Upside-down values — least are greatest; servant is leader'],['Parables teach','Hidden, growing, inclusive, costly, transforming'],['WAEC tip','Know at least 4 parables + present/future tension + entry conditions']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(140,52+i*32,r[0],ACC,9,'middle',true));o.push(T(330,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Gospels',ti:'What is the Kingdom of God?',su:'Examine the meaning and nature of the Kingdom of God.',steps:[
{lb:'The Kingdom — reign, not territory',dr:dQ2,ht:'<p>The <b>Kingdom of God</b> (also "Kingdom of Heaven" in Matthew) is not a physical territory but the <b>dynamic reign or rule of God</b> — wherever God\'s will is done and his authority acknowledged. Key characteristics: (1) It is <b>present</b> — Jesus declared "the Kingdom of God has come upon you" (Matt.12:28). (2) It is <b>future</b> — not yet fully here; awaits Christ\'s return (Matt.25:31-46). (3) It demands a <b>response</b> — "Repent and believe the good news" (Mark 1:14-15). (4) It is <b>gracious</b> — a gift, not earned. (5) It is <b>transforming</b> — changes individuals, communities and ultimately all creation.</p>'},
{lb:'The "already and not yet"',dr:dQ2,ht:'<p>Theologians describe the Kingdom as <b>"already and not yet"</b>: (1) <b>Already</b> — Jesus brought the Kingdom in his person and ministry. His healings, exorcisms and forgiveness of sins were signs that the Kingdom had arrived: "if I drive out demons by the finger of God, then the Kingdom of God has come upon you" (Luke 11:20). (2) <b>Not yet</b> — the Kingdom is not fully present until Christ returns. Evil, suffering and death still exist. The final judgment is still future (Matt.25). This tension is the central framework for understanding Jesus\' teaching: disciples live between the first coming (Kingdom inaugurated) and the second coming (Kingdom consummated).</p>'},
{lb:'Entering the Kingdom',dr:dQ2,ht:'<p>Jesus described what is required to enter the Kingdom: (1) <b>Repentance and faith</b> — "Repent and believe the good news" (Mark 1:15). (2) <b>New birth</b> — "No one can see the Kingdom of God unless they are born again" (John 3:3); "born of water and the Spirit" (3:5). (3) <b>Childlike trust</b> — "unless you change and become like little children, you will never enter the Kingdom" (Matt.18:3); "Whoever does not receive the Kingdom of God like a little child will never enter it" (Mark 10:15). (4) <b>Radical reorientation</b> — "It is easier for a camel to go through the eye of a needle than for someone who is rich to enter the Kingdom" (Matt.19:24). The Kingdom requires total surrender.</p>'},
{lb:'Kingdom values — upside-down',dr:dQ1,ht:'<p>The Kingdom of God operates on values opposite to worldly kingdoms: (1) <b>The least are greatest</b> — "whoever takes the lowly position of this child is the greatest in the Kingdom" (Matt.18:4). (2) <b>The servant is leader</b> — "whoever wants to be first must be slave of all" (Mark 10:44). (3) <b>The last are first</b> — "many who are first will be last, and many who are last will be first" (Matt.19:30). (4) <b>The poor are blessed</b> — "Blessed are the poor in spirit, for theirs is the Kingdom" (Matt.5:3). (5) <b>The outsider is welcomed</b> — the Prodigal Son, the Samaritan, the tax collector all find a place. The Kingdom subverts all human power hierarchies.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Jesus said "the Kingdom of God has come upon you" when:',o:['He was baptised in the Jordan River by John','He drove out demons by the finger/Spirit of God — showing the Kingdom had arrived in his ministry','He delivered the Sermon on the Mount on a hillside in Galilee','He fed the 5,000 with five loaves and two fish'],a:2,w:'Luke 11:20 / Matthew 12:28 — "if I drive out demons by the finger of God, then the Kingdom of God has come upon you." Jesus linked exorcism directly to the Kingdom\'s arrival — Satan\'s power being broken was evidence that God\'s reign had come.'},{q:'The "already and not yet" of the Kingdom means:',o:['Scholars disagree about whether the Kingdom exists at all','The Kingdom is both present now (inaugurated in Jesus\' ministry) and future (not yet fully here until Christ returns) — disciples live between inauguration and consummation','Some people are already in the Kingdom and others have not yet heard about it','The Kingdom was already complete in the Old Testament and the New Testament merely confirms it'],a:2,w:'The "already and not yet" is the central tension of Kingdom theology: ALREADY — Kingdom arrived in Jesus (healings, forgiveness, exorcism). NOT YET — evil and death remain; final judgment and new creation are future. Disciples live in the overlap, experiencing Kingdom life now while awaiting full consummation.'},{q:'Jesus said "It is easier for a camel to go through the eye of a needle" to teach:',o:['Physical wealth is spiritually irrelevant to entering the Kingdom','The extreme difficulty of trusting God rather than wealth when entering the Kingdom — wealth is the greatest rival to total surrender','Rich people are automatically excluded from the Kingdom of God','This was a proverb meaning that impossible things happen sometimes'],a:2,w:'Matthew 19:24 — the camel/needle image communicates the near-impossibility of the rich entering the Kingdom. The issue is not wealth itself but trust: rich people are tempted to trust wealth rather than God. "With man this is impossible, but with God all things are possible" (19:26) — even the wealthy can enter by God\'s grace.'},{q:'Jesus said we must receive the Kingdom "like a little child." This means:',o:['Adults must physically become children to enter the Kingdom','We must be naive and uninformed about theology to please God','We must receive the Kingdom with childlike dependence, trust and openness — not self-sufficient adult pride','Children are morally better than adults and therefore easier for God to save'],a:3,w:'Mark 10:15 — "like a little child" refers to the posture of a child receiving a gift: dependent, trusting, with no sense of earning or deserving. A child cannot provide for themselves or claim rights — they simply receive. The Kingdom is received, not achieved. This is the opposite of adult self-sufficiency.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Gospels',ti:'Parables of the Kingdom (1)',su:'Examine the parables that describe the nature of the Kingdom.',steps:[
{lb:'The Mustard Seed and Leaven (Matt 13:31-33)',dr:dQ1,ht:'<p><b>Parable of the Mustard Seed</b> (Matt.13:31-32): The Kingdom is like a mustard seed — the smallest of all seeds — which a man planted in his field. It grew and became the largest of garden plants, so that birds came and perched in its branches. Teaching: (1) The Kingdom begins <b>invisibly small</b> (Jesus, 12 disciples, a rejected preacher). (2) It ends <b>enormously large</b> (a worldwide movement). (3) This challenges disciples not to despise small beginnings. <b>Parable of the Yeast/Leaven</b> (Matt.13:33): A woman mixed yeast into a large amount of flour until it worked through all the dough. Teaching: the Kingdom works <b>invisibly</b> but permeates and transforms everything it touches — like yeast that cannot be seen but changes the whole loaf.</p>'},
{lb:'Hidden Treasure and Pearl (Matt 13:44-46)',dr:dQ1,ht:'<p><b>Hidden Treasure</b> (Matt.13:44): A man found a treasure hidden in a field. In his joy, he went and sold everything he had and bought that field. <b>Pearl of Great Price</b> (Matt.13:45-46): A merchant searching for fine pearls found one of great value and went and sold everything he had and bought it. Teaching: (1) The Kingdom is worth <b>any sacrifice</b> — both men sold <b>everything</b> without regret. (2) The Kingdom brings <b>joy</b> — the man with the treasure acted "in his joy." (3) The Kingdom is discovered in different ways — one stumbled upon it (treasure); one was actively seeking (pearl). Both responses are appropriate. (4) Nothing else compares in value to the Kingdom — all other goods become secondary once it is found.</p>'},
{lb:'The Net and Dragnet (Matt 13:47-50)',dr:dQ1,ht:'<p><b>Parable of the Net</b> (Matt.13:47-50): The Kingdom is like a net cast into the lake that caught all kinds of fish. When full, the fishermen pulled it to the shore, sat down and collected the good fish in baskets, throwing the bad away. Teaching: (1) The Kingdom currently <b>gathers all kinds</b> — the church is a mixed community, not a perfect assembly. (2) Judgment is <b>future</b> — God\'s angels will separate the righteous from the wicked at the end of the age. (3) This parable answers those who ask: why are there hypocrites in the church? Answer: final separation is God\'s task, not ours, at the end. (4) This completes the triad: Mustard Seed (Kingdom\'s growth), Hidden Treasure/Pearl (Kingdom\'s value), Net (Kingdom\'s future judgment).</p>'},
{lb:'The Prodigal Son (Luke 15:11-32)',dr:dQ1,ht:'<p>The <b>Parable of the Prodigal Son</b> (Luke 15:11-32) is the supreme illustration of God\'s Kingdom welcome. A younger son demanded his inheritance, wasted it in wild living, came to his senses, and returned home. His father saw him while still far off — ran, embraced, kissed him, and threw a feast. The older son, angry, refused to come in. The father said: "This brother of yours was dead and is alive again; was lost and is found" (15:32). Teaching: (1) God\'s love is <b>prodigal (extravagant)</b> — running, robes, rings, feasts for the undeserving. (2) The Kingdom welcomes <b>those who return</b> regardless of the depth of their failure. (3) The elder son represents <b>religious self-righteousness</b> that cannot rejoice at the sinner\'s restoration. The father pleads with both sons — the Kingdom is wide enough for both.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The Parable of the Mustard Seed (Matt 13:31-32) primarily teaches:',o:['The Kingdom of God grows from tiny, unlikely beginnings into something enormous — challenging disciples not to despise small beginnings','Mustard plants were regarded as sacred in first-century Judaism and symbolised the Temple','The Kingdom will only grow in agricultural communities that understand farming','Jesus was teaching his disciples how to grow crops in the Galilean climate'],a:1,w:'The mustard seed was proverbially the smallest seed in first-century Palestine. Jesus used this to teach that the Kingdom — which began with one person and twelve disciples, rejected by the religious establishment — would grow into something enormous. Do not despise small beginnings.'},{q:'In the Parables of the Hidden Treasure and Pearl (Matt 13:44-46), both main characters sold EVERYTHING because:',o:['They were tricked by a dishonest salesman into overpaying','The Kingdom of God surpasses the value of everything else — no sacrifice to obtain it is too great; both men acted in joy, not reluctant duty','They needed the exact amount of money the field/pearl cost and had no choice','Jesus was teaching that material poverty is required to enter the Kingdom of God'],a:2,w:'Both men sold all their possessions willingly, even joyfully (the treasure man acted "in his joy"). The teaching: the Kingdom is not one valuable thing among many — it is the pearl that makes all other pearls worthless by comparison. Once you truly perceive its value, giving everything for it is not a sacrifice but a delight.'},{q:'The Parable of the Net (Matt 13:47-50) answers the question:',o:['Why did Jesus choose fishermen as his disciples rather than educated scholars?','How should Christians respond to persecution from non-believers in their community?','Why are there hypocrites and bad people in the church? — Because judgment and separation belong to God at the end of the age, not to us now','What should believers do when they catch more fish than they can use?'],a:3,w:'The dragnet gathers all kinds of fish (good and bad) — just as the church is a mixed community now. The separation happens at the end of the age, done by angels. The parable answers impatient disciples who want the church to be a pure community now: God\'s judgment will separate; our task is to proclaim, not to judge.'},{q:'The Parable of the Prodigal Son (Luke 15) reveals God\'s Kingdom welcome through:',o:['The younger son\'s remorse and self-improvement before the father saw him','The father running toward the returning son, embracing him, and throwing a feast before the son had fully explained himself — showing extravagant, proactive, joy-filled welcome','The older son\'s anger, which God approved as righteous indignation against sin','The father demanding repayment of all the wasted inheritance before accepting the son back'],a:2,w:'The father\'s response is astonishing: he saw the son "while he was still a long way off" (suggesting he was watching for him); he RAN (undignified for a Middle Eastern patriarch); he embraced and kissed him before any explanation; he called for the robe, ring, sandals and feast. This is grace — proactive, extravagant, joy-filled welcome that does not wait for the sinner to prove themselves.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Gospels',ti:'Parables of the Kingdom (2)',su:'Examine further Kingdom parables — the Sower, the Talents, and the Great Banquet.',steps:[
{lb:'The Parable of the Sower (Matt 13:1-23)',dr:dQ2,ht:'<p>The <b>Parable of the Sower</b> (Matt.13:1-23) is the foundational Kingdom parable. A farmer sowed seed: (1) On the <b>path</b> — birds ate it (the evil one snatches the word). (2) On <b>rocky ground</b> — grew quickly but withered in sun (receives word with joy but falls away when trouble comes). (3) Among <b>thorns</b> — choked by thorns (word choked by worries, wealth and pleasures). (4) On <b>good soil</b> — produced a crop 100, 60, 30 times more (understands the word and produces fruit). Teaching: The Kingdom\'s growth depends on the <b>condition of the heart</b> (the soil), not the quality of the proclamation. The same word produces radically different responses. Four types of people hear the Gospel — only one produces lasting fruit.</p>'},
{lb:'The Parable of the Talents (Matt 25:14-30)',dr:dQ2,ht:'<p>A man gave his servants talents (large sums of money) before a journey: 5, 2 and 1. The servant with 5 talents earned 5 more; the servant with 2 earned 2 more; the servant with 1 buried his. On return, the master praised the first two: "Well done, good and faithful servant! You have been faithful with a few things; I will put you in charge of many things" (Matt.25:21). The third was condemned: "you wicked, lazy servant." Teaching: (1) The Kingdom requires <b>faithful stewardship</b> of what God has given. (2) Inaction out of fear is condemned — the buried talent is the worst outcome. (3) <b>Reward is proportional</b> to faithfulness, not to the original amount (both 5-talent and 2-talent servants received the same praise). (4) Final judgment will reveal how each person used their gifts.</p>'},
{lb:'The Great Banquet (Luke 14:15-24)',dr:dQ2,ht:'<p>A man prepared a great banquet and invited many. When the time came, all the invited guests made excuses (field to see, oxen to try, married a wife). The host told his servant: go into the streets, invite the poor, the crippled, the blind, the lame. Still there was room, so he sent again: go to the roads and country lanes, compel them to come in. "I tell you, none of those men who were invited will get a taste of my banquet" (Luke 14:24). Teaching: (1) The Jewish establishment (invited guests) rejected God\'s Kingdom invitation. (2) The <b>outcasts and Gentiles</b> were welcomed in their place. (3) Refusal of the invitation has permanent consequences — the original guests were excluded. (4) The Kingdom is <b>urgently inclusive</b> — the host sends multiple times to fill the table.</p>'},
{lb:'The Parable of the Unforgiving Servant (Matt 18:21-35)',dr:dQ2,ht:'<p>Peter asked Jesus how many times to forgive — seven times? Jesus replied: "not seven times but seventy-seven times" (or seventy times seven — unlimited). Then the parable: a king forgave a servant a debt of 10,000 talents (an astronomical sum). That servant then refused to forgive a fellow servant a debt of 100 denarii. The king heard, was angry, and had the unforgiving servant thrown in prison. Jesus concluded: "This is how my heavenly Father will treat each of you unless you forgive your brother or sister from your heart" (Matt.18:35). Teaching: (1) Kingdom citizens have been forgiven an <b>incalculable debt</b>. (2) Experiencing God\'s forgiveness must produce <b>forgiveness toward others</b>. (3) Refusing to forgive is incompatible with Kingdom membership.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'In the Parable of the Sower, the seed falling on "thorny ground" represents:',o:['Those who never hear the Gospel at all — the word is not sown in their lives','Those who hear the word and immediately reject it out of intellectual pride','Those who hear the word but whose spiritual growth is choked by worries of life, deceitfulness of wealth, and desires for other things — no lasting fruit','Those who hear the word in persecution and maintain their faith to the end'],a:3,w:'Matthew 13:22 — "the worries of this life and the deceitfulness of wealth choke the word, making it unfruitful." The thorny ground person initially receives the word but gradually allows competing concerns (financial anxiety, desire for possessions, worldly pleasures) to crowd it out until no spiritual fruit remains.'},{q:'The Parable of the Talents (Matt 25) teaches that the WORST response to what God gives us is:',o:['Using our gifts boldly and making mistakes in the attempt','Giving our resources to the poor rather than investing them for the master','Burying our talent out of fear — inaction that produces nothing rather than risking failure in faithful service','Sharing our gifts with others who did not receive the same original amount'],a:3,w:'The servant who buried his talent was condemned as "wicked and lazy" (Matt.25:26). The master says: "you should have put my money on deposit" — even minimal action was expected. The parable condemns fearful inaction: better to try and fail than to do nothing out of fear. God holds us accountable for the stewardship of what he has given us.'},{q:'In the Parable of the Great Banquet (Luke 14), the original invited guests represent:',o:['Roman soldiers and Gentiles who rejected Jesus','The Jewish religious establishment who rejected God\'s Kingdom invitation — making way for the outcasts (poor, blind, lame) and Gentiles to be welcomed in their place','The twelve disciples who were always present at Jesus\'s teaching','The wealthy Pharisees who eventually converted to Christianity'],a:2,w:'The invited guests who made excuses represent the Jewish religious establishment who rejected Jesus\' proclamation of the Kingdom. Their excuses (field, oxen, wife) represent the ordinary concerns of life placed above God\'s urgent invitation. The poor, crippled, blind and lame who come in their place represent those marginalised by the religious system — and the Gentiles (those on roads and country lanes).'},{q:'The Parable of the Unforgiving Servant (Matt 18) teaches that Kingdom citizens must forgive others because:',o:['Forgiving others earns extra credit in God\'s ledger beyond what Jesus already paid','Forgiveness is optional but earns a special reward in heaven','They have themselves been forgiven an incalculable debt by God — receiving such total forgiveness while refusing to give small forgiveness is incompatible with understanding what they have received','Jesus commands it but the penalty for non-compliance is minor discipline, not serious judgment'],a:3,w:'The contrast is deliberate: 10,000 talents (the astronomical debt God forgives) vs 100 denarii (the tiny debt the servant refuses to forgive). The servant who experienced such complete forgiveness and then refused to extend any forgiveness fundamentally misunderstood the grace he received. Kingdom membership and unforgiveness are incompatible — the king\'s anger (18:34) shows the seriousness of this.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Gospels',ti:'The Kingdom and Ethics',su:'Examine what Kingdom membership demands of daily life.',steps:[
{lb:'Kingdom ethics — the Sermon on the Mount',dr:dQ1,ht:'<p>Jesus taught that the Kingdom demands a <b>deeper righteousness</b> than external religious compliance: "unless your righteousness surpasses that of the Pharisees and the teachers of the law, you will certainly not enter the Kingdom of heaven" (Matt.5:20). The Sermon on the Mount (Matt.5-7) is the ethics of Kingdom citizens: (1) The <b>Beatitudes</b> (5:3-12) describe Kingdom character. (2) The <b>Antitheses</b> (5:21-48) radicalise the Law from external action to inner motivation. (3) The <b>three pious acts</b> (6:1-18) must be done for God, not human approval. (4) <b>Kingdom priorities</b> (6:33): seek first the Kingdom; do not worry about material needs. (5) <b>Doing</b> (7:24-27): hearing the words is not enough; obedience is required.</p>'},
{lb:'The Kingdom and wealth',dr:dQ2,ht:'<p>Jesus taught that wealth is the greatest rival to the Kingdom. Key texts: (1) "You cannot serve both God and money" (Matt.6:24) — wealth functions as a competing lord. (2) "Blessed are the poor in spirit, for theirs is the Kingdom" (Matt.5:3). (3) "The deceitfulness of wealth chokes the word" (Matt.13:22 — thorny ground). (4) "Easier for a camel through a needle\'s eye" (Matt.19:24). (5) Zacchaeus — the wealthy tax collector who gave half his possessions away showed genuine Kingdom entry (Luke 19:8-9). (6) The Rich Young Ruler — who went away sad because he had great wealth (Matt.19:16-22). The Kingdom does not prohibit wealth but demands that wealth be subordinated to God\'s reign.</p>'},
{lb:'The Kingdom and relationships',dr:dQ2,ht:'<p>Kingdom membership transforms relationships: (1) <b>Enemy love</b> — "love your enemies and pray for those who persecute you" (Matt.5:44); this distinguishes Kingdom ethics from normal human ethics. (2) <b>Servant leadership</b> — "whoever wants to become great among you must be your servant" (Matt.20:26); the Kingdom inverts the power pyramid. (3) <b>Radical forgiveness</b> — seventy-seven times; from the heart (Matt.18:22,35). (4) <b>Reconciliation first</b> — leave your gift at the altar and first be reconciled to your brother (Matt.5:23-24). (5) <b>Inclusion of the marginalised</b> — welcoming the "little ones" (children, the weak, the outcast) as welcoming Jesus himself (Matt.18:5; 25:40). Kingdom relationships mirror God\'s own character.</p>'},
{lb:'The Kingdom and the Lord\'s Prayer',dr:dQ2,ht:'<p>The Lord\'s Prayer is a Kingdom prayer. Every petition reflects Kingdom realities: (1) "Our Father in heaven" — God is King; disciples are Kingdom citizens addressing their King as Father. (2) "Hallowed be your name" — God\'s royal reputation exalted everywhere. (3) "Your Kingdom come" — the central petition: the complete establishment of God\'s reign on earth. (4) "Your will be done on earth as in heaven" — Kingdom ethics implemented universally. (5) "Give us today our daily bread" — Kingdom dependence on God, not self-sufficiency. (6) "Forgive us... as we forgive" — Kingdom forgiveness flowing from and to disciples. (7) "Deliver us from the evil one" — Kingdom protection against the kingdom of darkness.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Jesus said "You cannot serve both God and money" (Matt 6:24). This teaches:',o:['Christians must give away all their money to be in the Kingdom','Money itself is evil and should not be used at all','Wealth functions as a competing lord — total loyalty to God and total loyalty to wealth are mutually exclusive; Kingdom membership demands God\'s priority over financial security','Christians should avoid all employment that involves handling money'],a:3,w:'"Mammon" (Aramaic for wealth/money) is described as a master who demands loyalty — not just a tool. The saying does not forbid earning money but identifies the danger: wealth can become a rival to God for the heart\'s ultimate trust. Kingdom life requires that God, not financial security, is the ultimate master.'},{q:'Jesus\'s command to "leave your gift at the altar and first be reconciled to your brother" (Matt 5:23-24) shows:',o:['Temple worship was less important than Old Testament sacrificial law','God values reconciliation in human relationships as a prerequisite for acceptable worship — broken relationships obstruct prayer and worship','The disciples were required to go home before attending synagogue each Sabbath','Jesus was abolishing the temple sacrifice system before the crucifixion'],a:2,w:'This radical teaching (Matt.5:23-24) shows the Kingdom\'s ethical seriousness: if you remember your brother has something against you WHILE you are at the altar offering a gift, leave the gift, go and be reconciled first, THEN offer your gift. God is not pleased with worship offered by those who refuse to seek reconciliation. Kingdom ethics prioritise right relationships.'},{q:'The Rich Young Ruler (Matt 19:16-22) went away sad because:',o:['Jesus told him he had broken all ten commandments and was not saved','He was already a member of the Pharisee party and could not leave','He had great wealth that he was unwilling to surrender — Jesus called him to sell everything and give to the poor, but his possessions had more hold on him than the Kingdom\'s call','He misunderstood the question and thought Jesus was asking him to become a disciple'],a:3,w:'The Rich Young Ruler kept all the commandments (19:20) but when Jesus said "sell your possessions and give to the poor" (19:21), "he went away sad, because he had great wealth" (19:22). His wealth was his real god. Jesus\'s instruction was not a universal rule for everyone but a diagnostic: it exposed what this particular man loved more than God. The Kingdom demands that nothing — not even great wealth — competes with God.'},{q:'The petition "Your Kingdom come" in the Lord\'s Prayer is significant because:',o:['It is the longest petition and therefore the most important mechanically','It asks for the complete establishment of God\'s reign on earth — making the Kingdom the central concern of all prayer, replacing self-centred petitions','It was added by the early church after Jesus\' death and was not in the original prayer','It refers specifically to the second coming of Christ and has no present application'],a:2,w:'"Your Kingdom come" (Matt.6:10) is the heart of the Lord\'s Prayer — immediately after the God-focused opening (hallowed be your name), this petition asks for the total establishment of God\'s rule. It makes the Kingdom the central concern of every prayer, orienting the disciple away from self-centred requests toward God\'s cosmic purposes.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Gospels',ti:'The Kingdom and the Future',su:'Examine the future dimension of the Kingdom — judgment and consummation.',steps:[
{lb:'The Sheep and the Goats (Matt 25:31-46)',dr:dQ1,ht:'<p>Jesus taught that when the Son of Man comes in glory, all nations will be gathered and separated like sheep (on the right — eternal life) and goats (on the left — eternal punishment). The criterion: care for "the least of these my brothers and sisters." "I was hungry and you gave me food; thirsty and you gave me drink; a stranger and you invited me in; needing clothes and you clothed me; sick and you looked after me; in prison and you came to visit me" (Matt.25:35-36). When asked when they did this, the King replied: "whatever you did for one of the least of these brothers and sisters of mine, you did for me" (25:40). The Kingdom\'s final judgment is based on practical compassion for the vulnerable.</p>'},
{lb:'Signs of the Kingdom\'s coming (Matt 24)',dr:dQ2,ht:'<p>In Matthew 24, Jesus described signs preceding his return: (1) False messiahs. (2) Wars and rumours of wars. (3) Famines and earthquakes. (4) Persecution of disciples. (5) Falling away of many. (6) The gospel proclaimed to all nations. (7) The "abomination that causes desolation." (8) Great tribulation. He warned: "No one knows about that day or hour, not even the angels in heaven, nor the Son, but only the Father" (24:36). The response required: be alert, keep watch (24:42-44). The <b>Parable of the Ten Virgins</b> (25:1-13) illustrates: five wise brought extra oil (prepared); five foolish did not (unprepared). "Keep watch, because you do not know the day or the hour" (25:13).</p>'},
{lb:'The Parable of the Ten Virgins (Matt 25:1-13)',dr:dQ2,ht:'<p>Ten virgins went to meet the bridegroom. Five were wise and brought extra oil; five were foolish and brought none. The bridegroom was delayed — all ten slept. At midnight a cry: "Here\'s the bridegroom!" The five foolish asked the wise for oil; they refused (lest there was not enough for all). The foolish went to buy oil. While they were gone the bridegroom came; the door was shut. The foolish returned and knocked: "Lord, open the door!" He replied: "I don\'t know you." Teaching: (1) The Kingdom\'s arrival may be <b>delayed</b> — disciples must sustain prepared faith, not just initial enthusiasm. (2) Spiritual readiness <b>cannot be borrowed</b> — the extra oil represents what only personal faith and relationship with God can provide. (3) Final exclusion is possible — "I don\'t know you" is the most sobering phrase in the parable.</p>'},
{lb:'Final judgment and the Kingdom',dr:dQ2,ht:'<p>The Kingdom of God reaches its climax in final judgment and the new creation. Key texts: (1) Matt.25:31-46 — judgment based on practical compassion. (2) Matt.13:47-50 — angels separate righteous from wicked (Net parable). (3) Matt.7:21-23 — not everyone who says "Lord, Lord" enters — only those who do the Father\'s will. (4) Rev.21:1-4 — the new creation: God dwelling with his people, no more death, mourning or pain. (5) The Kingdom\'s consummation means: sin and death are finally destroyed; God\'s will is done perfectly on earth as in heaven; the prayer Jesus taught is finally answered. The "not yet" becomes fully "already." WAEC: know the sheep and goats (Matt.25:31-46) in detail — criteria for judgment, the King\'s words, the final outcomes.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'In the Parable of the Sheep and Goats (Matt 25), the criterion for entering the Kingdom was:',o:['Believing the correct theological doctrines about the Trinity and the resurrection','Performing religious duties (prayer, fasting, almsgiving) consistently throughout life','Practical care for the hungry, thirsty, stranger, naked, sick and imprisoned — treating "the least of these" as if serving Christ himself','Persevering in Bible study and attending synagogue/church regularly'],a:3,w:'Matthew 25:35-40 — the criterion is not theological knowledge or religious performance but practical compassion for the vulnerable. "Whatever you did for one of the least of these brothers and sisters of mine, you did for me" (25:40). This does not mean salvation is by works alone but that genuine Kingdom faith produces practical mercy.'},{q:'The Parable of the Ten Virgins teaches that spiritual readiness "cannot be borrowed" because:',o:['The five wise virgins were being selfish and Jesus disapproved of their refusal to share','The foolish virgins had failed to develop their own personal relationship with God — spiritual preparedness is not transferable, it must be individually cultivated','Jesus was teaching practical wisdom about storing lamp oil in ancient Palestine','The extra oil represents financial wealth that cannot be shared under Jewish law'],a:2,w:'The five wise virgins could not share their oil — not because of selfishness, but because there would not be enough for all (25:9). The oil represents something that cannot be transferred: genuine personal faith, relationship with God, and spiritual formation. You cannot borrow another person\'s faith at the last moment — the Kingdom requires personal, sustained preparedness.'},{q:'Jesus said "No one knows about that day or hour, not even the angels... nor the Son, but only the Father" (Matt 24:36). The implication for disciples is:',o:['We should calculate the date of Christ\'s return from mathematical patterns in Scripture','The date of Christ\'s return is known by some special prophets who can reveal it to the church','We should remain constantly alert and prepared — the response to not knowing is watchfulness, not calculation or panic','The second coming will never actually happen since even Jesus does not know when'],a:3,w:'The point of "no one knows the hour" is precisely to produce constant watchfulness: if the date were known, people would prepare only near the deadline. Instead, Jesus commands "keep watch" (24:42) and "be ready" (24:44) — meaning live at all times as if Christ could return today. The Ten Virgins parable applies this: be prepared, not just initially enthusiastic.'},{q:'The Kingdom of God\'s final consummation (the new creation — Rev 21) means:',o:['God abandons the material world and takes believers to a spiritual realm with no physical reality','The "not yet" of the Kingdom becomes fully "already" — God dwells with his people, sin and death are destroyed, and God\'s will is done perfectly on earth as in heaven','The Kingdom will become a physical political empire ruled from Jerusalem with Jesus as King','The Kingdom was only for the disciples\' generation and was fulfilled in 70 CE when Jerusalem fell'],a:2,w:'Revelation 21:1-4 describes the new creation: "God himself will be with them and be their God. He will wipe every tear from their eyes. There will be no more death or mourning or crying or pain." This is the "not yet" finally becoming fully "already" — the Lord\'s Prayer finally answered in full: "your Kingdom come, your will be done on earth as in heaven."'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 Gospels',ti:'WAEC Prep — Kingdom of God',su:'Practise WAEC-style questions on the Kingdom of God.',steps:[
{lb:'WAEC essay approach',dr:dQ1,ht:'<p>For WAEC essays on the Kingdom of God: Common questions: "Explain what Jesus meant by the Kingdom of God." "Describe any THREE parables Jesus used to explain the Kingdom of God." "What are the conditions for entering the Kingdom of God?" "What does the Parable of the Sower teach about the Kingdom?" "Describe the Parable of the Sheep and Goats and its significance." For each parable: (1) Name and reference. (2) Narrate the parable clearly. (3) State the specific Kingdom teaching. (4) Give one lesson for Christians today. Key parables to know: Mustard Seed, Leaven, Hidden Treasure, Pearl, Net, Sower, Prodigal Son, Great Banquet, Talents, Ten Virgins, Sheep and Goats, Unforgiving Servant.</p>'},
{lb:'Key concepts and references',dr:dQ2,ht:'<p>Essential references: "The Kingdom of God has come upon you" — Luke 11:20 (exorcism proves Kingdom arrival). "Repent and believe the good news" — Mark 1:14-15 (entry condition). "Unless you are born again" — John 3:3 (new birth condition). "Like a little child" — Mark 10:15 (entry condition). "Seek first the Kingdom" — Matt.6:33 (Kingdom priority). "Your Kingdom come" — Matt.6:10 (Lord\'s Prayer). Mustard Seed: Matt.13:31-32. Hidden Treasure: Matt.13:44. Pearl: Matt.13:45-46. Sower: Matt.13:1-23. Prodigal Son: Luke 15:11-32. Great Banquet: Luke 14:15-24. Talents: Matt.25:14-30. Ten Virgins: Matt.25:1-13. Sheep and Goats: Matt.25:31-46. Know these — WAEC examiners credit specific references.</p>'},
{lb:'Common mistakes to avoid',dr:dQ2,ht:'<p>Avoid: Saying the Kingdom of God is a physical place or territory (it is the reign/rule of God). Saying "not yet" means the Kingdom has not yet started (the Kingdom has already started but is not yet fully consummated). Confusing the Parable of the Sower (Matt.13:1-23 — soil types) with the Parable of the Net (Matt.13:47-50 — fish types). Saying the Sheep and Goats teaches salvation by works alone (it teaches that genuine faith in God produces practical mercy — the criterion is not works as merit but works as evidence of Kingdom character). Forgetting to name the specific Kingdom teaching of each parable — not just narrating the story. Saying "the elder brother was wrong to be angry" — the parable ends with the father pleading with both sons; the elder son represents real religious people whom God also wants inside.</p>'},
{lb:'Lessons from the Kingdom for today',dr:dQ2,ht:'<p>Lessons from the Kingdom of God for Christians today: (1) <b>Present engagement</b> — the Kingdom is already here; Christians participate in its growth through proclamation, justice and compassion. (2) <b>Future hope</b> — the Kingdom is not yet fully here; Christians live with eschatological hope, not despair at current evil. (3) <b>Radical values</b> — Kingdom ethics (enemy love, servant leadership, radical forgiveness) challenge Christians to live counter-culturally. (4) <b>Stewardship</b> — the Talents parable demands faithful use of God-given gifts. (5) <b>Urgency and preparedness</b> — the Ten Virgins and Sheep/Goats demand constant readiness and practical mercy. (6) <b>Inclusive welcome</b> — the Prodigal Son and Great Banquet model God\'s extravagant welcome for all who return.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which parable specifically describes the growth of the Kingdom from tiny beginnings to enormous size?',o:['Parable of the Net (Matt 13:47-50)','Parable of the Mustard Seed (Matt 13:31-32)','Parable of the Hidden Treasure (Matt 13:44)','Parable of the Unforgiving Servant (Matt 18:21-35)'],a:2,w:'The Mustard Seed (Matt.13:31-32) — a seed proverbially tiny grows into the largest garden plant, with birds nesting in it. This teaches that the Kingdom of God, though beginning with a tiny group of disciples led by a rejected preacher, would grow into something enormous encompassing people from all nations.'},{q:'The Parable of the Sower teaches about the Kingdom by showing:',o:['How God chooses which people will enter the Kingdom by predetermining the type of soil they are','That the Kingdom\'s growth depends on the condition of the human heart — the same word of God produces radically different responses in different people','That Jesus was a skilled farmer who knew how to grow crops in Galilean soil conditions','That the Kingdom will never grow because most soil types in Palestine are poor'],a:2,w:'The four soil types (path, rocky, thorny, good) represent four conditions of the human heart in response to the Gospel. The identical seed (word of God) produces radically different results — 0%, 0%, 0%, 30/60/100% — depending on the heart condition. The Kingdom\'s growth is not automatic but depends on receptive hearts.'},{q:'The "already and not yet" of the Kingdom means that Christians living today should:',o:['Withdraw from the world and wait passively for Christ\'s return since the Kingdom is entirely future','Pretend the Kingdom is already fully here and deny that evil and suffering still exist','Engage actively in Kingdom work now (the "already") while maintaining hope for the Kingdom\'s full consummation (the "not yet") — living between inauguration and consummation','Choose either the present or future dimension of the Kingdom and ignore the other'],a:3,w:'The "already and not yet" requires holding both dimensions simultaneously: the Kingdom HAS come (Jesus, Spirit, church, foretaste of salvation) so Christians engage now. But the Kingdom is NOT YET fully here (evil remains, Christ has not returned) so Christians live in hope. Both passive withdrawal (ignoring "already") and triumphalism (ignoring "not yet") are wrong responses.'},{q:'The Parable of the Great Banquet (Luke 14) teaches that the Kingdom of God is:',o:['Only available to those who plan ahead and respond to the initial invitation','An exclusive club for the religiously respectable who prepare adequately','Urgently and radically inclusive — when the originally invited reject it, God sends multiple times to invite the outcast, the marginalised and those outside the religious establishment','A reward for those who have suffered enough to deserve a place at the table'],a:3,w:'The Great Banquet (Luke.14:15-24) shows God\'s extravagant, urgent, multiple-invitation welcome. When the invited guests refused (the Jewish establishment), the host sent three times: first into the streets (poor, crippled, blind, lame); then to the roads and lanes (Gentiles outside the city). The Kingdom is inclusive beyond expectation — none of the originally-comfortable invited guests tasted the banquet.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Kingdom of God (1)',su:'Integrated revision across all Kingdom of God topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Kingdom of God summary: Nature — reign/rule of God, not a territory. Already: Luke 11:20 (exorcisms). Not yet: Matt.25:31-46 (final judgment). Entry: repentance (Mark 1:15); new birth (John 3:3); childlike trust (Mark 10:15). Values: upside-down — least greatest; servant is leader; last is first. Parables: Mustard Seed (growth from tiny); Leaven (invisible transformation); Hidden Treasure/Pearl (supreme value); Net (mixed community; future judgment); Sower (4 soil types; heart condition); Prodigal Son (extravagant welcome); Great Banquet (urgent inclusive invitation); Talents (faithful stewardship); Ten Virgins (constant preparedness); Sheep/Goats (practical compassion as criterion). Ethics: Sermon on the Mount; enemy love; radical forgiveness; servant leadership; Kingdom priority over wealth.</p>'},
{lb:'Key parables summary',dr:dQ10,ht:'<p>Parables summary for WAEC: Mustard Seed (Matt.13:31-32) — tiny beginning, enormous growth. Leaven (Matt.13:33) — invisible, permeates all. Hidden Treasure (Matt.13:44) — worth everything. Pearl (Matt.13:45-46) — surpasses all value. Net (Matt.13:47-50) — mixed community; future separation. Sower (Matt.13:1-23) — heart condition determines fruitfulness. Prodigal Son (Luke 15:11-32) — extravagant welcome for the returning. Great Banquet (Luke 14:15-24) — rejection by some = opportunity for others. Talents (Matt.25:14-30) — faithful stewardship rewarded. Ten Virgins (Matt.25:1-13) — constant preparedness essential. Sheep/Goats (Matt.25:31-46) — practical compassion = Kingdom criterion. Unforgiving Servant (Matt.18:21-35) — received forgiveness must produce given forgiveness.</p>'},
{lb:'Connection to other CRS topics',dr:dQ1,ht:'<p>The Kingdom connects to all other CRS topics: Birth narrative — the angels announce good news of great joy: the Saviour/Messiah/Lord is born. This is the Kingdom arriving in human form. Ministry — every healing, exorcism and miracle is a sign that the Kingdom has come (Luke 11:20). Sermon on the Mount — the ethics of Kingdom citizens. Peter\'s confession — "You are the Messiah" (the King of God\'s Kingdom). Transfiguration — a preview of Kingdom glory. Passion — the cross is the paradoxical enthronement of the King who reigns through sacrifice. Resurrection — the proof that the Kingdom cannot be defeated by death. Great Commission — "go and make disciples of all nations" = extending the Kingdom to its full extent.</p>'},
{lb:'WAEC final tips',dr:dQ2,ht:'<p>Final WAEC tips for Kingdom of God: (1) Define the Kingdom clearly first — the dynamic reign/rule of God. (2) Always mention the "already and not yet" tension — it shows sophisticated understanding. (3) Know the entry conditions: repentance (Mark 1:15); new birth (John 3:3); childlike trust (Mark 10:15); radical surrender. (4) For each parable: name, reference, brief narrative, specific Kingdom teaching. (5) Know the Sheep and Goats (Matt.25:31-46) in detail — the criterion (practical compassion), the King\'s words, the outcomes. (6) Connect Kingdom to ethics: Sermon on the Mount, enemy love, forgiveness, servant leadership. (7) Always give chapter and verse — WAEC examiners reward specific references. (8) For 25-mark essays: at least 5 parables with specific teachings and references.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which of the following CORRECTLY states the teaching of the Parable of the Net (Matt 13:47-50)?',o:['Christians should immediately expel all hypocrites from the church','The Kingdom only admits righteous people — the wicked are excluded at the point of entry','The Kingdom currently gathers all kinds; final separation of righteous from wicked will be done by angels at the end of the age — this is God\'s task, not ours now','Jesus was teaching fishermen that they should sort their catches immediately after hauling them in'],a:3,w:'Matt.13:47-50 — the net (church) gathers all kinds now; judgment and separation happen at the end of the age, performed by angels. This teaches patience: the church is not a perfect assembly of the already-righteous; final sorting is God\'s eschatological task. The parable also warns: the wicked WILL ultimately be separated — final judgment is real.'},{q:'The Parable of the Prodigal Son (Luke 15) ends with:',o:['The younger son marrying and settling down in the father\'s house with his new wealth','The father lecturing the younger son about financial responsibility to prevent future mistakes','The father pleading with the elder brother to come inside and celebrate — the parable ends ambiguously, with the elder brother\'s response not stated, leaving the reader to decide','The elder brother apologising for his anger and joining the party willingly'],a:3,w:'Luke 15:31-32 ends with the father\'s plea to the elder son: "you are always with me, and everything I have is yours... we had to celebrate and be glad." The elder brother\'s response is not stated — this is deliberate. The parable ends with an open invitation: the Kingdom is wide enough for the self-righteous elder brother too, if he will come inside.'},{q:'The Kingdom of God\'s value, according to the Hidden Treasure and Pearl parables, is best expressed as:',o:['The Kingdom is one of many good options available to spiritual seekers — valuable but not uniquely so','The Kingdom is most valuable to the poor who have nothing else to live for','The Kingdom surpasses all other values — those who truly perceive it give everything else joyfully to obtain it','The Kingdom is only valuable after death — in this life other priorities must come first'],a:3,w:'Hidden Treasure (Matt.13:44) and Pearl (Matt.13:45-46) both end with the same action: the discoverer "sold all he had" and bought the Kingdom. The joyfulness of this action (the treasure man acted "in his joy") shows this was not reluctant sacrifice but delighted priority-setting. Once you truly perceive the Kingdom\'s value, everything else becomes secondary.'},{q:'Romans 14:17 defines the Kingdom of God as:',o:['Physical food, drink and territory for the people of God on earth','A future state that believers will enter after death','Righteousness, peace and joy in the Holy Spirit — present spiritual realities available now through the Spirit','The political reign of Christ in Jerusalem that will follow his return'],a:3,w:'Romans 14:17 — "the Kingdom of God is not a matter of eating and drinking, but of righteousness, peace and joy in the Holy Spirit." Paul\'s definition captures both the ethical (righteousness) and experiential (peace, joy) dimensions of present Kingdom life, enabled by the Spirit. This confirms the Kingdom is not primarily physical or political but a present spiritual reality.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Kingdom of God (2)',su:'Further revision across Kingdom of God topics.',steps:[
{lb:'Further review',dr:dQ2,ht:'<p>The Kingdom of God is the central theme of Jesus\' entire ministry. Everything else connects to it: his miracles are Kingdom signs; his parables explain Kingdom dynamics; his ethics are Kingdom ethics; his death is the King\'s sacrifice; his resurrection is Kingdom victory over death. Key summary questions: (1) What is the Kingdom? The dynamic reign of God. (2) Is it present or future? Both — already and not yet. (3) How do you enter? Repentance, faith, new birth, childlike trust. (4) What does it look like? Upside-down values — the Beatitudes, servant leadership, enemy love. (5) How do the parables describe it? Growth (Mustard Seed); transformation (Leaven); value (Treasure/Pearl); inclusivity (Great Banquet); judgment (Net/Sheep-Goats); stewardship (Talents); preparedness (Ten Virgins).</p>'},
{lb:'Parables and their specific teachings',dr:dQ1,ht:'<p>Quick-fire parables review: Mustard Seed → Kingdom grows from tiny to large. Leaven → Kingdom transforms invisibly. Hidden Treasure → Kingdom is worth any sacrifice. Pearl → Kingdom surpasses all other value. Net → Kingdom community is mixed now; judgment is future. Sower → same word; different heart conditions; different fruitfulness. Prodigal Son → God welcomes the returning with extravagant joy. Great Banquet → rejection by some opens Kingdom to all. Talents → faithful use of gifts is required; inaction condemned. Ten Virgins → constant preparedness essential; spiritual readiness non-transferable. Sheep and Goats → practical compassion for the vulnerable is the Kingdom criterion at judgment. Unforgiving Servant → received forgiveness must produce given forgiveness.</p>'},
{lb:'WAEC model essay paragraph',dr:dQ2,ht:'<p>Model WAEC paragraph on one Kingdom parable: "The Parable of the Talents (Matthew 25:14-30) teaches that the Kingdom of God requires faithful stewardship of what God has given. In the parable, a master gave his servants five, two and one talent respectively before a journey. The servants with five and two talents doubled their amounts; the servant with one talent buried his out of fear. On return, the master praised the faithful servants: \'Well done, good and faithful servant!\' (25:21) but condemned the lazy servant. The teaching is that Kingdom members are accountable for the gifts, abilities and opportunities God has given them. Inaction out of fear is not acceptable; faithful effort — even with modest gifts — is rewarded equally. The lesson for Christians is to identify and use their God-given gifts actively rather than passively waiting."</p>'},
{lb:'WAEC final tips',dr:dQ2,ht:'<p>Final WAEC preparation: Most frequently examined Kingdom parables: (1) Mustard Seed — growth from small. (2) Sower — heart conditions. (3) Prodigal Son — God\'s welcome. (4) Sheep and Goats — practical compassion criterion. (5) Talents — stewardship. For each: know the narrative details, the specific teaching, and one lesson. Entry conditions: repentance (Mark 1:15); new birth (John 3:3); childlike trust (Mark 10:15). Key Kingdom verse: "Seek first the Kingdom of God and his righteousness, and all these things will be given to you" (Matt.6:33). Always define the Kingdom before discussing it. Always give references. For 25-mark essays: at least 5 well-developed points with evidence, showing analysis not just description.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'What does the Parable of the Leaven/Yeast (Matt 13:33) teach about the Kingdom?',o:['The Kingdom of God spreads loudly and visibly — everyone can see its growth immediately','The Kingdom works invisibly but permeates and transforms everything it enters — like yeast working through all the dough without being seen','Christians should bake bread as a spiritual discipline to understand the Kingdom','The Kingdom will remain small and hidden like yeast and never become a large visible movement'],a:2,w:'The leaven/yeast (Matt.13:33) teaches the Kingdom\'s invisible, permeating transforming power. A small amount of yeast is hidden in a large quantity of flour — unseen, but it works through the entire batch, fundamentally transforming it. The Kingdom changes individuals, communities and ultimately all creation — not always dramatically visible, but thoroughly real.'},{q:'The conditions for entering the Kingdom of God include all of the following EXCEPT:',o:['Repentance — turning from sin and toward God (Mark 1:15)','New birth by water and the Spirit (John 3:3-5)','Receiving the Kingdom like a little child — in humble, dependent trust (Mark 10:15)','Having a perfect record of obedience to all the commandments from birth'],a:4,w:'Jesus identified repentance (Mark 1:15), new birth (John 3:3-5), and childlike trust (Mark 10:15) as conditions for entering the Kingdom. He specifically did NOT require a perfect record — the Prodigal Son, Zacchaeus and the thief on the cross all entered without one. The Kingdom is received by grace through repentant faith, not earned by perfect obedience.'},{q:'The Parable of the Ten Virgins (Matt 25:1-13) teaches above all:',o:['Christians should always carry spare lamp oil when attending weddings','The time of Christ\'s return is known and believers should prepare precisely one hour before','Spiritual preparedness must be constant and personal — it cannot be borrowed at the last moment, and the Kingdom\'s arrival may be delayed; constant watchfulness is required','Christians who make mistakes in preparation will be given a second chance before the door closes'],a:3,w:'Ten Virgins teaches constant, personal watchfulness: (1) The bridegroom was DELAYED — sustained faith required, not just initial enthusiasm. (2) Spiritual readiness CANNOT be borrowed — the foolish could not receive the wise\'s oil at the last minute. (3) The door was SHUT while they were away — final exclusion is possible. "Keep watch, because you do not know the day or the hour" (25:13).'},{q:'Which statement BEST summarises the Kingdom of God as taught by Jesus?',o:['A future political empire that will physically replace all human governments when Christ returns','The dynamic reign of God — both present now (inaugurated in Jesus\' ministry) and future (fully consummated at Christ\'s return) — requiring repentance, faith and radical reorientation, lived according to upside-down Kingdom values','A spiritual state of inner peace available only after death to those who have lived morally good lives','The institutional church, which is identical to the Kingdom and will eventually rule all nations on earth'],a:2,w:'The most accurate, comprehensive definition: the Kingdom is the dynamic reign of God (not a territory or institution); it is BOTH present (inaugurated in Jesus\' ministry) AND future (consummated at his return); it requires repentance, faith, new birth and childlike trust to enter; it operates on upside-down values (least greatest; servant leader; enemy love); it grows through proclamation and compassion.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 Gospels',ti:'WAEC Prep — Kingdom Revision',su:'Final WAEC preparation on the Kingdom of God.',steps:[
{lb:'25-mark essay structure',dr:dQ1,ht:'<p>25-mark essay: "Examine the parables Jesus used to teach about the Kingdom of God." Structure: Intro (2-3 sentences): define Kingdom as God\'s dynamic reign; Jesus used parables as his primary teaching method for the Kingdom. Body (5-6 parables, each a paragraph): Name + reference → narrative → specific Kingdom teaching → significance. Example paragraph: "The Parable of the Mustard Seed (Matt.13:31-32) illustrates the Kingdom\'s growth from tiny beginnings to enormous size. Jesus compared the Kingdom to a mustard seed — the smallest of seeds — which grew into the largest garden plant with birds nesting in it. The teaching is that the Kingdom, though beginning with a tiny group of disciples, would grow into a worldwide movement. The lesson is that disciples should not despise small beginnings of Kingdom work." Conclusion: significance of parables as a teaching method; their continued relevance.</p>'},
{lb:'Entry conditions — detailed',dr:dQ2,ht:'<p>Entry conditions for the Kingdom (detailed): (1) <b>Repentance</b> (Mark 1:15): "Repent and believe the good news" — active turning from sin and toward God, not merely intellectual agreement. (2) <b>New birth</b> (John 3:3,5): "unless you are born again... born of water and the Spirit" — a radical new beginning enabled by God, not human effort. (3) <b>Childlike trust</b> (Mark 10:15): "receive the Kingdom like a little child" — dependent, trusting, without self-sufficiency or merit. (4) <b>Radical surrender</b> (Matt.19:21): "sell your possessions and give to the poor" — nothing may compete with God for ultimate loyalty. (5) <b>Doing the Father\'s will</b> (Matt.7:21): "not everyone who says \'Lord, Lord\'" — hearing must be accompanied by obedience. These conditions are not sequential steps but facets of the same fundamental reorientation toward God.</p>'},
{lb:'Quick-fire Kingdom revision',dr:dQ2,ht:'<p>Quick-fire Kingdom revision: (1) Luke 11:20: exorcism proves Kingdom has come. (2) Mark 1:14-15: repentance required to enter. (3) John 3:3: new birth required. (4) Mark 10:15: receive like a child. (5) Matt.6:33: seek first the Kingdom. (6) Matt.5:3: poor in spirit → Kingdom. (7) Matt.19:24: camel through needle → wealth danger. (8) Matt.13:31-32: Mustard Seed → growth. (9) Matt.13:33: Leaven → invisible transformation. (10) Matt.13:44: Hidden Treasure → worth everything. (11) Matt.13:45-46: Pearl → supreme value. (12) Matt.13:47-50: Net → mixed community; future judgment. (13) Luke 15:11-32: Prodigal Son → extravagant welcome. (14) Luke 14:15-24: Great Banquet → inclusive invitation. (15) Matt.25:14-30: Talents → faithful stewardship. (16) Matt.25:1-13: Ten Virgins → constant preparedness. (17) Matt.25:31-46: Sheep/Goats → practical compassion criterion.</p>'},
{lb:'WAEC final tips — Kingdom',dr:dQ1,ht:'<p>WAEC final tips: (1) Always define the Kingdom first — "the dynamic reign or rule of God." (2) State the "already and not yet" tension — this shows sophisticated theological understanding. (3) Know the entry conditions (repentance, new birth, childlike trust) with references. (4) For parables: ALWAYS give the reference (Matt./Luke chapter:verse) — examiners reward this. (5) Know at least 5 parables with specific teachings, not just their names. (6) The Sheep and Goats (Matt.25:31-46) is almost always in WAEC papers — know it thoroughly. (7) Know the Prodigal Son narrative in detail — WAEC frequently asks for it. (8) Connect the Kingdom to ethics: Sermon on the Mount, enemy love, radical forgiveness. (9) For evaluation questions: consider both the Kingdom\'s present and future dimensions, and both its demanding entry conditions and its welcoming inclusivity.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The Parable of the Prodigal Son (Luke 15) illustrates which aspect of the Kingdom of God?',o:['The Kingdom\'s demand for financial sacrifice from all who enter','The Kingdom\'s growth from small beginnings to worldwide extent','God\'s extravagant, proactive, joy-filled welcome of those who return — regardless of how far they have strayed','The Kingdom\'s strict judgment of those who have wasted their opportunities'],a:3,w:'The father in the Prodigal Son represents God\'s Kingdom welcome: proactive (he saw the son while still far off — suggesting he was watching), undignified (he ran — unusual for a Middle Eastern patriarch), extravagant (robe, ring, sandals, feast), and unconditional (before full explanation was given). The parable shows the Kingdom welcomes the returning, regardless of the depth of failure.'},{q:'Jesus said "Seek first the Kingdom of God and his righteousness" (Matt 6:33). The context of this verse is:',o:['The Parable of the Hidden Treasure — Jesus was urging disciples to look for the Kingdom','The teaching on not worrying about material needs — Kingdom priority overcomes anxiety about food, clothing and security','Peter\'s confession at Caesarea Philippi — Jesus was explaining what the Messiah\'s Kingdom means','The Beatitudes — Jesus was describing the character of Kingdom citizens'],a:2,w:'"Seek first the Kingdom" (Matt.6:33) is the conclusion of the "do not worry" section (6:25-34). Jesus addressed anxiety about food, drink and clothing — and said the antidote is Kingdom priority: seek God\'s reign and righteousness first, and trust God to provide material needs. The verse is about replacing material anxiety with Kingdom focus.'},{q:'The Parable of the Talents (Matt 25:14-30) teaches that the servant with one talent who buried it was condemned because:',o:['He had only one talent, which was an insultingly small amount and showed the master\'s lack of confidence in him','He tried to invest the talent but failed — and the master expected success','He did nothing out of fear — inaction is condemned; faithful effort with even modest gifts is what God requires','He gave the talent to the poor rather than investing it for the master\'s commercial benefit'],a:3,w:'Matt.25:24-27 — the servant excused his inaction by saying the master was harsh. The master replied: "you should have put my money on deposit" — even minimal action was expected. The condemnation is specifically of INACTION: burying the talent, doing nothing, producing nothing. Both the 5-talent and 2-talent servants who were active received identical praise — it is faithfulness, not amount, that matters.'},{q:'Which of the following entry conditions for the Kingdom is found in John\'s Gospel specifically?',o:['Repentance — "repent and believe the good news" (Mark 1:15)','New birth — "unless a person is born again/born of water and Spirit they cannot enter" (John 3:3,5)','Childlike trust — "receive it like a little child" (Mark 10:15)','Doing the Father\'s will — "not everyone who says Lord, Lord" (Matt 7:21)'],a:2,w:'New birth (John 3:3,5) is specifically from John\'s Gospel: "unless a person is born again, they cannot see the Kingdom of God" and "unless a person is born of water and the Spirit, they cannot enter." The other conditions: repentance (Mark 1:15), childlike trust (Mark 10:15), doing God\'s will (Matt.7:21) are from the Synoptics. WAEC may ask you to identify which Gospel contains a specific teaching.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Kingdom of God',su:'Final comprehensive revision on the Kingdom of God.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Kingdom of God final summary: Definition: the dynamic reign/rule of God. Present: Luke 11:20 (exorcism), healings, forgiveness — Kingdom already here. Future: Matt.25:31-46, new creation (Rev.21) — not yet fully consummated. Entry: repentance (Mark 1:15); new birth (John 3:3-5); childlike trust (Mark 10:15); doing Father\'s will (Matt.7:21). Values: upside-down (least=greatest; servant=leader; last=first). Ethics: Sermon on the Mount; enemy love; radical forgiveness; servant leadership; Kingdom over wealth. Parables: Mustard Seed (growth); Leaven (invisible transformation); Treasure/Pearl (supreme value); Net (mixed community; future judgment); Sower (4 soil types); Prodigal Son (extravagant welcome); Great Banquet (inclusive invitation); Talents (stewardship); Ten Virgins (preparedness); Sheep/Goats (compassion criterion); Unforgiving Servant (forgiveness).</p>'},
{lb:'Key quotes and references',dr:dQ10,ht:'<p>Key Kingdom quotes: "The Kingdom of God has come upon you" (Luke 11:20). "Repent and believe the good news" (Mark 1:14-15). "Unless you are born again... born of water and Spirit" (John 3:3-5). "Receive the Kingdom like a little child" (Mark 10:15). "Seek first the Kingdom" (Matt.6:33). "Your Kingdom come" (Matt.6:10). "Easier for a camel through a needle\'s eye" (Matt.19:24). "Well done, good and faithful servant" (Matt.25:21). "I was hungry and you gave me food" (Matt.25:35). "Whatever you did for the least of these... you did for me" (Matt.25:40). "I don\'t know you" (Matt.25:12). "The Kingdom of God is... righteousness, peace and joy in the Holy Spirit" (Rom.14:17). Know at least 8 of these for WAEC.</p>'},
{lb:'Final evaluation',dr:dQ1,ht:'<p>Evaluation: "Why did Jesus use parables to teach about the Kingdom?" (1) <b>Accessibility</b> — parables used everyday images (farming, fishing, weddings) accessible to all. (2) <b>Revelation and concealment</b> — "The knowledge of the secrets of the Kingdom is given to you, but not to them" (Matt.13:11); parables reveal to the open-hearted and conceal from the hard-hearted. (3) <b>Engagement</b> — stories engage imagination and emotion, not just intellect. (4) <b>Indirect challenge</b> — "You are the man!" (2 Sam.12:7) — parables allow the listener to judge themselves. (5) <b>Fulfilment of prophecy</b> — "I will open my mouth in parables" (Psalm 78:2, quoted in Matt.13:35). Parables are not simplifications — they are sophisticated teaching tools that demand active engagement from the hearer.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>WAEC final must-knows for the Kingdom of God: (1) Definition: dynamic reign/rule of God. (2) Already and not yet — with examples of each. (3) Entry conditions (3+): repentance, new birth, childlike trust, with references. (4) At least 5 parables with specific Kingdom teachings and references. (5) Sheep and Goats (Matt.25:31-46) in full detail. (6) Prodigal Son (Luke 15:11-32) narrative and teaching. (7) Kingdom upside-down values: least=greatest, servant=leader, last=first. (8) Kingdom ethics: Sermon on the Mount, enemy love, radical forgiveness. (9) "Seek first the Kingdom" (Matt.6:33) as the summary Kingdom priority. (10) Connect Kingdom to other CRS topics: birth, ministry, Passion, resurrection. These connections show integrative understanding that WAEC rewards at the highest level.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Romans 14:17 — "the Kingdom of God is not a matter of eating and drinking, but of righteousness, peace and joy in the Holy Spirit" — defines the Kingdom as:',o:['A physical eating-and-drinking community that meets regularly for communion','Entirely future — these qualities will only be available after death','Present spiritual realities available now through the Spirit — righteousness (right living), peace (with God and others) and joy (in the Spirit)','A set of rules about food and drink that Christians must observe'],a:3,w:'Romans 14:17 gives Paul\'s experiential, present-tense definition of Kingdom life: righteousness (ethical transformation), peace (restored relationship with God and others), and joy (the fruit of the Spirit) — all present realities enabled by the Holy Spirit. The Kingdom is not primarily about external observances but these inner Spirit-enabled realities.'},{q:'What does the Parable of the Sower teach about WHY some people do not bear Kingdom fruit?',o:['God predetermined which soil types would produce fruit and which would not','The preacher\'s poor delivery is responsible when hearers do not respond','Three barriers to Kingdom fruitfulness: the evil one snatching the word (path); persecution causing falling away (rocky ground); worries, wealth and desires choking growth (thorny ground)','Most people are inherently unable to produce fruit regardless of circumstances'],a:3,w:'The Sower (Matt.13:18-23) diagnoses three specific barriers: (1) Path — devil snatches the word; (2) Rocky ground — no root; falls away when trouble/persecution comes; (3) Thorny ground — worries of life, deceit of wealth, desires for other things choke the word. These are specific, diagnostic warnings for disciples about what destroys Kingdom fruitfulness — not inevitabilities but dangers to guard against.'},{q:'The phrase "I never knew you" (Matt 7:23) — spoken to those who prophesied and performed miracles in Jesus\' name — teaches:',o:['Miraculous gifts prove genuine Kingdom membership','Religious activity and spiritual gifts, however impressive, do not substitute for genuine relationship with Jesus and obedience to the Father\'s will','Jesus has a poor memory and will not recognise people at the final judgment who did not attend enough services','All prophets and miracle-workers are false and their works are condemned'],a:2,w:'"I never knew you" (Matt.7:23) is addressed to people who performed impressive religious activities — prophecy, exorcism, miracles. Jesus rejected them not because the activities were fake but because they lacked the relational foundation: genuine submission to the Father\'s will. The Kingdom is not about spiritual performance but about genuine knowing — relationship and obedience.'},{q:'Which of the following CORRECTLY identifies all three of the entry conditions for the Kingdom with their references?',o:['Faith (Hebrews 11:6); baptism (Acts 2:38); tithing (Malachi 3:10)','Repentance (Mark 1:15); new birth by water and Spirit (John 3:3-5); receiving the Kingdom like a little child (Mark 10:15)','Prayer (Matthew 6:9); fasting (Matthew 6:16); giving (Matthew 6:1-4)','Circumcision (Genesis 17:10); sacrifice (Leviticus 1:3); Sabbath observance (Exodus 20:8)'],a:2,w:'The three main entry conditions Jesus described: (1) Repentance and faith — "Repent and believe the good news" (Mark 1:15). (2) New birth — "unless a person is born of water and Spirit" (John 3:3-5). (3) Childlike trust — "receive the Kingdom like a little child" (Mark 10:15). These are the standard WAEC answer to "What are the conditions for entering the Kingdom?"'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
