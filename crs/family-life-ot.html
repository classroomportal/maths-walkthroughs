<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Family Life — Key OT Themes',ACC,12,'middle',true));
var rows=[['Marriage','Instituted by God (Gen.2:24); covenant relationship'],['Parental roles','Father: provider and spiritual leader; mother: nurturer'],['Children','Gift from God (Ps.127:3); to be taught the Law (Deut.6:7)'],['Honour parents','Fifth Commandment (Ex.20:12); first with a promise'],['Kinship duty','Levirate marriage; kinsman-redeemer — Boaz and Ruth'],['Discipline','Train up a child in the way (Prov.22:6); discipline with love'],['Faithfulness','Sexual fidelity; care for elderly parents; family prayer']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,30+i*30,460,24,CRM,LINE,1));o.push(T(120,44+i*30,r[0],ACC,8,'middle',true));o.push(T(320,44+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Key Family Life Texts',ACC,12,'middle',true));
var rows=[['Gen.2:24','A man leaves parents and cleaves to wife; two become one flesh'],['Ex.20:12','Honour your father and your mother (Fifth Commandment)'],['Deut.6:4-9','Shema: teach the Law to children diligently at all times'],['Ps.127:3','Children are a heritage from the LORD; a reward from him'],['Prov.22:6','Train up a child in the way he should go'],['Prov.31:10,30','Capable wife — worth above rubies; fears the LORD'],['Mal.2:14,16','Marriage is a covenant; God hates divorce']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,28+i*30,460,24,CRM,LINE,1));o.push(T(90,42+i*30,r[0],ACC,8,'middle',true));o.push(T(310,42+i*30,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Family Life OT — Summary',ACC,13,'middle',true));
var rows=[['Marriage (Gen.2:24)','Leave, cleave, one flesh — God\'s design for lifetime covenant'],['Fifth Commandment','Honour father and mother — first commandment with a promise'],['Deut.6:4-9 (Shema)','Teach children the Law at all times — home is the classroom'],['Prov.31 wife','Capable, industrious, charitable, God-fearing — worth above rubies'],['Ruth and Boaz','Chesed and kinsman-redeemer; loyalty beyond obligation'],['WAEC tip','Know which texts go with which topic: marriage, children, parents']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(110,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 OT',ti:'Marriage in the Old Testament',su:'Examine the OT\'s teaching on marriage.',steps:[
{lb:'The institution of marriage (Genesis 2:18-25)',dr:dQ1,ht:'<p>God declared: "It is not good for the man to be alone. I will make a helper suitable for him" (2:18). After the naming of animals (none was suitable), God created woman from Adam\'s side — equal dignity, different role. Adam\'s response: <em>"This is now bone of my bones and flesh of my flesh"</em> (2:23). God\'s design: <em>"A man leaves his father and mother and is united to his wife, and they become one flesh"</em> (2:24). Three elements: leaving (priority shift), cleaving (covenant commitment), one flesh (union).</p>'},
{lb:'Marriage as covenant (Malachi 2:14-16)',dr:dQ2,ht:'<p>The OT treats marriage as a covenant: "the LORD is the witness between you and the wife of your marriage covenant" (Mal.2:14). This means: (1) A solemn, binding commitment before God. (2) Promises, not just feelings. (3) God as witness and guarantor. (4) Required faithfulness — "guard the spirit of your marriage" (2:15). Malachi 2:16: <em>"The man who hates and divorces his wife... does violence to the one he should protect."</em> God\'s ideal is lifelong faithfulness.</p>'},
{lb:'Proverbs 31 — the capable wife',dr:dQ1,ht:'<p>Proverbs 31:10: <em>"A wife of noble character (chayil — capable, virtuous, strong) who can find? She is worth far more than rubies."</em> She is: industrious (works with her hands); a businesswoman (buys fields); generous to the poor (v.20); wise in speech (v.26); God-fearing. Crucially: <em>"Charm is deceptive, and beauty is fleeting; but a woman who fears the LORD is to be praised"</em> (v.30). The ultimate marital quality is spiritual, not physical. Character over appearance.</p>'},
{lb:'Lessons on marriage',dr:dQ2,ht:'<p>OT teaches: (1) God instituted marriage — it is not a human cultural invention. (2) Leave-cleave-one flesh is the foundational pattern (Gen.2:24). (3) Marriage is a covenant requiring faithfulness. (4) Husband and wife have equal dignity and complementary roles. (5) The capable woman (Prov.31) is industrious, wise, charitable and God-fearing. (6) God is witness to the marriage covenant (Mal.2:14). (7) Divorce represents a departure from God\'s ideal. Application: marriage requires intentional faithfulness, shared faith and mutual honour.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Genesis 2:24 describes three elements of marriage. Which correctly lists all three?',o:['Pray, fast, commit','Leave parents, be united to wife, become one flesh','Exchange gifts, make vows, be fruitful','Promise, love, serve'],a:2,w:'Gen.2:24 — "a man leaves his father and mother (leaving), is united to his wife (cleaving), and they become one flesh (union)" — the three foundational elements of OT marriage.'},{q:'Malachi 2:14 describes marriage as:',o:['A legal contract between two families','A temporary arrangement until children are born','A covenant — "the LORD is the witness between you and the wife of your marriage covenant"','A private matter between two individuals only'],a:3,w:'Malachi 2:14 — "the LORD is acting as the witness between you and the wife of your marriage covenant" — marriage is a covenant (not just a contract) with God as witness and guarantor.'},{q:'Proverbs 31:30 says the most praiseworthy quality in a wife is:',o:['Physical beauty and outward charm','Wealth and social status','Intelligence and educational achievement','Fearing the LORD — "a woman who fears the LORD is to be praised"'],a:4,w:'Proverbs 31:30 — "Charm is deceptive, and beauty is fleeting; but a woman who fears the LORD is to be praised" — spiritual character (God-fearing) is the supreme marital quality.'},{q:'God\'s declaration in Genesis 2:18 that "it is not good for man to be alone" shows that:',o:['Adam was lonely because he did not pray enough','Human beings are created as social beings; relationship is part of God\'s design','Woman was created to be a servant to man','Adam asked God to create a companion for him'],a:2,w:'Gen.2:18 — God\'s own assessment that solitude is not good for humans. Community and relationship are built into God\'s design. Woman was created as a complement, not a servant.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 OT',ti:'Parenting and Children in the OT',su:'Examine OT teaching on the roles of parents and the value of children.',steps:[
{lb:'Children as God\'s gift (Psalm 127:3-5)',dr:dQ2,ht:'<p>Psalm 127:3: <em>"Children are a heritage from the LORD, offspring a reward from him. Like arrows in the hands of a warrior are children born in one\'s youth."</em> Key points: (1) Children are God\'s gift, not merely a social institution. (2) Heritage (nahalah) — they belong to God; parents are stewards. (3) Arrows — purposeful, aimed at God\'s purposes. (4) Blessing flows from a home where children are received as gifts and raised in God\'s ways. Children are not a burden but a responsibility and a privilege.</p>'},
{lb:'The duty to teach (Deuteronomy 6:4-9 — The Shema)',dr:dQ1,ht:'<p>Deuteronomy 6:4-9 contains the Shema — Israel\'s foundational confession: "Hear, O Israel: The LORD our God, the LORD is one. Love the LORD your God with all your heart." The command that follows: <em>"Impress them on your children. Talk about them when you sit at home and when you walk along the road, when you lie down and when you get up"</em> (vv.6-7). Also: tie on hands, forehead, write on doorposts. The primary context for religious education in the OT is not the temple but the home.</p>'},
{lb:'Proverbs on parenting',dr:dQ1,ht:'<p>Proverbs on parenting: (1) Prov.22:6 — <em>"Start children off on the way they should go, and even when they are old they will not turn from it."</em> (2) Prov.13:24 — "Whoever spares the rod hates their children, but the one who loves their children is careful to discipline them." (3) Prov.1:8-9 — "Listen, my son, to your father\'s instruction and do not forsake your mother\'s teaching." The OT holds a high view of intentional, loving, consistent parenting as the key to forming godly character in the next generation.</p>'},
{lb:'Family education in the OT',dr:dQ2,ht:'<p>OT family education included: (1) Telling the story of God\'s acts — "When your children ask... tell them" (Josh.4:21-22). (2) Passover as a family ceremony — children asked, fathers answered (Ex.12:25-27). (3) Fathers teaching trades and Torah to sons. (4) Mothers as primary nurturers (Prov.31:26 — "opens her mouth with wisdom"). (5) Extended family participating in formation. Joshua\'s declaration sums up the spirit: <em>"As for me and my household, we will serve the LORD"</em> (Josh.24:15).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Psalm 127:3 says children are:',o:['A reward for parents who have obeyed God\'s law perfectly','A responsibility that tests a couple\'s faith and endurance','A heritage from the LORD and a reward from him','A sign that God has blessed a family with prosperity'],a:3,w:'Ps.127:3 — "Children are a heritage from the LORD, offspring a reward from him" — children are God\'s gift (heritage = nahalah), not primarily a social achievement or economic asset.'},{q:'Deuteronomy 6:7 commands parents to teach God\'s commandments to their children:',o:['Only at the synagogue or temple on holy days','Once a week at the Sabbath meal','At all times — sitting at home, walking, lying down and getting up','Only when the children ask about God'],a:3,w:'Deut.6:7 — "when you sit at home and when you walk along the road, when you lie down and when you get up" — constant, all-of-life faith education in the home, not just in institutions.'},{q:'Proverbs 22:6 says: "Start children off on the way they should go, and even when they are old..."',o:['They will still need parental guidance','They will remember their childhood with gratitude','They will not turn from it','They will teach their own children the same way'],a:3,w:'Prov.22:6 — "even when they are old they will not turn from it" — godly character formed in childhood tends to persist. Early investment has lifelong effects.'},{q:'In the OT, the primary location for children\'s religious education was:',o:['The temple in Jerusalem','The synagogue with the rabbi','The Levitical city or school for priests','The home — parents were the primary teachers of faith'],a:4,w:'Deut.6:4-9 locates Shema teaching in the home, on the road, at bedtime, at rising — all domestic settings. The OT\'s primary religious education venue is the family home, not an institution.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 OT',ti:'The Fifth Commandment — Honouring Parents',su:'Examine the OT\'s command to honour parents (Exodus 20:12).',steps:[
{lb:'The Fifth Commandment',dr:dQ3,ht:'<p><em>"Honour your father and your mother, so that you may live long in the land the LORD your God is giving you"</em> (Ex.20:12). This is the first commandment with a promise attached (Eph.6:2-3). The word "honour" (Hebrew: kaved — to give weight to, to treat as weighty and significant) implies not just childhood obedience but respect, care and value throughout life. It applies to adult children toward elderly parents, not only to young children. Honouring parents is the foundation of social order.</p>'},
{lb:'Honouring parents in Proverbs',dr:dQ3,ht:'<p>Proverbs reinforces parental honour: (1) "A wise son brings joy to his father, but a foolish son brings grief to his mother" (10:1). (2) "Listen to your father, who gave you life, and do not despise your mother when she is old" (23:22). (3) "Children\'s children are a crown to the aged, and parents are the pride of their children" (17:6). The first nine chapters of Proverbs are a father\'s extended instruction to his son — the whole book presupposes that wise parents transmit wisdom to the next generation through relationship.</p>'},
{lb:'Caring for elderly parents',dr:dQ4,ht:'<p>The duty to honour parents extends to caring for them in old age: Ruth\'s devotion to Naomi — "Where you go I will go" (Ruth 1:16) — loyalty beyond obligation to an elderly mother-in-law. Joseph settling Jacob in Goshen, visiting him in illness (Gen.47-48). Proverbs 23:22 — "Do not despise your mother when she is old" — specifically addressing the temptation to regard elderly parents as burdens. The fifth commandment implicitly covers this: honour does not expire when parents become dependent or frail.</p>'},
{lb:'The family as foundation of society',dr:dQ3,ht:'<p>In OT thought, the family (bet ab — house of the father) was the basic social unit: (1) The economy was family-based (each family had its land portion — Jubilee restored it). (2) Justice was administered partly through family structures (kinsman-redeemer). (3) Religious education happened in the home (Deut.6). (4) National stability depended on family stability. When family structures broke down (as in Judges — "everyone did what was right in their own eyes"), national chaos followed. Strong families = strong nation.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'The Fifth Commandment (Ex.20:12) is "the first commandment with a promise" because:',o:['It is the most important of all the commandments','It contains a specific promise: "so that you may live long in the land"','It is the only commandment that applies to children and not adults','It promises eternal life to all who obey it'],a:2,w:'Eph.6:2-3 — Paul says the fifth commandment is "the first commandment with a promise" — "so that you may live long in the land." Honouring parents carries real-world consequences.'},{q:'The Hebrew word for "honour" in the Fifth Commandment (kaved) means:',o:['To obey immediately and without question','To give weight to — treat as weighty and significant; active respect and care','To fear the consequences of disobedience','To perform expected duties without personal feelings'],a:2,w:'"Kaved" comes from the root meaning "heavy/weighty" — to honour means to treat someone as weighty and significant, not to give them empty or light regard. Active respect, care and valuing throughout life.'},{q:'Ruth\'s declaration "Where you go I will go" (Ruth 1:16) to Naomi demonstrated:',o:['Ruth\'s interest in moving to a better land for economic reasons','Loyalty and honour to an elderly mother-in-law beyond any legal obligation','Ruth\'s belief that Naomi would become wealthy again in Israel','Naomi\'s insistence that Ruth must return to Bethlehem with her'],a:2,w:'Ruth\'s declaration was an extraordinary act of chesed to an elderly, widowed mother-in-law. She had no legal obligation to stay — her loyalty went far beyond what was required.'},{q:'Proverbs 23:22 warns: "Do not despise your mother when she is old." This specifically addresses:',o:['Young children who disobey their mothers in public','The temptation to regard elderly parents as burdens when they become dependent','Sons who marry foreign women who disrespect their mother-in-law','Daughters who move away and stop visiting their parents'],a:2,w:'Prov.23:22 specifically addresses adult children\'s treatment of elderly parents — the temptation to regard them as burdens when they become frail and dependent. Honour does not expire with parental independence.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 OT',ti:'Ruth and Boaz — A Model of OT Family Values',su:'Examine the book of Ruth as a model of OT family values.',steps:[
{lb:'Ruth\'s loyalty (Ruth 1)',dr:dQ4,ht:'<p>During the Judges period, Elimelech\'s family moved to Moab. Both sons married Moabite women. All three men died. Naomi decided to return to Bethlehem and urged her daughters-in-law to go back to their own families. Orpah did. Ruth refused: <em>"Where you go I will go, and where you stay I will stay. Your people will be my people and your God my God"</em> (1:16). Ruth chose Naomi, Israel and God — an extraordinary declaration of covenant loyalty by a Moabite widow, completely beyond any legal obligation.</p>'},
{lb:'Boaz as kinsman-redeemer (Ruth 2-4)',dr:dQ5,ht:'<p>Boaz showed chesed (steadfast love) to Ruth: inviting her to glean in his field; protecting her from other workers; providing extra grain; inviting her to share his workers\' meal. Later, Boaz acted as kinsman-redeemer (go\'el): paying the redemption price for Elimelech\'s land and marrying Ruth to carry on the family name (Levirate marriage principle — Deut.25:5-10). His motivations: duty to family; recognition of Ruth\'s loyalty; faith ("the LORD repay you for what you have done" — 2:12).</p>'},
{lb:'Chesed — covenant love in action',dr:dQ4,ht:'<p>The word chesed (steadfast love, covenant loyalty, faithful kindness) appears three times in Ruth (1:8; 2:20; 3:10): Naomi prays chesed for her daughters-in-law (1:8); Naomi recognises Boaz\'s chesed to the dead and living (2:20); Boaz recognises Ruth\'s chesed in her loyalty (3:10). Chesed is not sentiment but practical, active, costly loyalty that keeps the spirit of relationship alive even when there is no legal obligation. It is the OT\'s highest relational virtue — most often attributed to God Himself.</p>'},
{lb:'Ruth in the ancestry of David and Jesus',dr:dQ5,ht:'<p>The book ends with a genealogy: Boaz fathered Obed, who fathered Jesse, who fathered David (4:21-22). Ruth — a Moabite foreigner — is listed in Matthew 1:5 as an ancestor of Jesus. Extraordinary: God\'s redemptive purposes advanced through a widowed Moabite woman\'s chesed, not through the "right" ethnic or social background. Ruth illustrates: (1) Loyalty and faith matter more than nationality. (2) God includes outsiders in His redemptive purposes. (3) Ordinary faithful acts have extraordinary consequences.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'Ruth\'s declaration "Your people will be my people and your God my God" (Ruth 1:16) shows:',o:['Ruth was simply agreeing to help Naomi find her way home','Ruth chose deliberately to leave her people, land and gods to commit to Naomi, Israel and God','Ruth was afraid to return to Moab because of enemies there','Naomi had convinced Ruth that Israel was more prosperous'],a:2,w:'Ruth 1:16 is one of the greatest declarations of covenant loyalty in Scripture. Ruth chose deliberately to leave her Moabite family, land and gods to commit to Naomi, Israel and the God of Israel.'},{q:'The Hebrew word "go\'el" (kinsman-redeemer) refers to:',o:['The eldest son who inherits family property','A relative who had the right and duty to redeem family land or name','The temple priest who performed marriage ceremonies','The judge who settled family disputes in the city gate'],a:2,w:'The go\'el (redeemer) — a family member who could "buy back" what was lost: land sold in poverty, or the family name by marrying a deceased brother\'s widow (Levirate marriage — Deut.25:5-10).'},{q:'The word chesed appears three times in Ruth (1:8; 2:20; 3:10) and means:',o:['Sacrifice — what must be given up for family','Steadfast love, covenant loyalty, faithful kindness — active faithfulness beyond obligation','Obedience to the Mosaic Law regarding family duties','Grief and mourning for those who have died'],a:2,w:'"Chesed" — the OT\'s highest relational virtue — steadfast love that goes beyond obligation, keeps covenant faithfully even at personal cost. It is the quality most attributed to God in the OT.'},{q:'Ruth\'s place in Israel\'s genealogy means she was:',o:['An insignificant foreigner who happened to be in the right place','The great-grandmother of King David and an ancestor of Jesus (Matthew 1:5)','The mother of the prophet Samuel','The grandmother of Solomon through a second marriage to Boaz'],a:2,w:'Ruth 4:21-22 and Matthew 1:5 — Ruth\'s son was Obed, father of Jesse, father of King David. Matthew lists Ruth in Jesus\'s genealogy — a Moabite woman included in God\'s redemptive story.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 OT',ti:'Hannah and Samuel — Faith in Family Life',su:'Examine Hannah\'s prayer and Samuel\'s dedication (1 Samuel 1).',steps:[
{lb:'Hannah\'s situation (1 Samuel 1)',dr:dQ5,ht:'<p>Hannah was one of two wives of Elkanah. Peninnah had children; Hannah was barren. Peninnah provoked Hannah year after year at the annual worship at Shiloh. Hannah wept and would not eat. Elkanah said: "Don\'t I mean more to you than ten sons?" — kind but missing the depth of her pain. Hannah went to the temple and prayed in bitter distress, making a vow: if God gave her a son, she would give him back to God for his whole life as a Nazirite. Eli initially mistook her silent, moving lips for drunkenness.</p>'},
{lb:'Hannah\'s prayer and God\'s answer',dr:dQ6,ht:'<p>Eli realised Hannah was praying and said: "Go in peace, and may the God of Israel grant you what you have asked" (1:17). Hannah went away and ate; her face was no longer downcast. God remembered Hannah and she conceived and bore a son — Samuel. After weaning him, she brought him to Shiloh and dedicated him to God: <em>"I prayed for this child, and the LORD has granted me what I asked of him. So now I give him to the LORD. For his whole life he will be given over to the LORD"</em> (1:27-28).</p>'},
{lb:'Hannah\'s song (1 Samuel 2:1-10)',dr:dQ5,ht:'<p>Hannah\'s song of praise became the model for Mary\'s Magnificat (Luke 1). Key themes: (1) God\'s strength and salvation. (2) God exalts the humble and humbles the proud. (3) God gives life to the barren. (4) God judges the wicked and guards the faithful. The song is a theological statement: God reverses human expectations; the lowly are lifted up. Hannah\'s personal experience of barrenness and blessing became the lens through which she saw God\'s universal character.</p>'},
{lb:'Lessons from Hannah\'s family story',dr:dQ5,ht:'<p>Lessons: (1) Prayer is the first response to family crisis. (2) God hears the prayers of the desperate. (3) Dedication of children to God is the highest expression of OT parenting. (4) Children given back to God are not lost — Samuel became Israel\'s greatest judge-prophet. (5) Personal blessing becomes public service — Samuel\'s life benefited a whole nation. (6) Family prayer and faith shape the nation\'s future. Joshua 24:15: <em>"As for me and my household, we will serve the LORD"</em> — the spirit of Hannah\'s life expressed in a declaration.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'Why was Hannah in such distress at Shiloh?',o:['Her husband Elkanah had stopped loving her','She had been falsely accused of theft','She was barren while Peninnah, the other wife, had children and provoked her repeatedly','She had lost all her money and could not pay for the sacrifice'],a:3,w:'1Sam.1:6-7 — "Her rival provoked her till she wept and would not eat" — Peninnah deliberately and repeatedly provoked Hannah because of her barrenness. A sustained and painful cruelty.'},{q:'When Hannah brought Samuel to Shiloh, she said: "I prayed for this child... so now I give him to the LORD." This means:',o:['She was abandoning Samuel because she could no longer care for him','She was fulfilling her vow — giving back to God the very gift she had received from God','She was training Samuel to become a Levitical priest as required by law','She wanted Eli to educate Samuel so he could become a successful scribe'],a:2,w:'1Sam.1:27-28 — Hannah fulfilled her vow by dedicating Samuel to lifelong service. "I give him to the LORD" — the child received from God was returned to God. This is OT dedication theology.'},{q:'Hannah\'s song in 1 Samuel 2 became the model for:',o:['David\'s Psalm 23','Solomon\'s Song of Songs','Mary\'s Magnificat in Luke 1','The Benedictus of Zechariah in Luke 1'],a:3,w:'Luke 1:46-55 — Mary\'s Magnificat ("My soul glorifies the Lord; he has lifted up the humble") closely parallels Hannah\'s song in 1Sam.2:1-10 — both celebrate God reversing human expectations.'},{q:'The main lesson of Hannah\'s story is:',o:['Only those who make vows receive answers to prayer','Barrenness is always a punishment for hidden sin','God hears the distressed prayer and reverses human helplessness — the barren bears children','Women should not pray aloud in the temple, only silently'],a:3,w:'Hannah\'s story illustrates God\'s character: He hears the distressed prayer (1:11); He remembers (1:19); He opens the closed womb (1:20); He receives the dedicated child (1:28). God reverses human helplessness.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 OT',ti:'Dysfunctional Families in the OT',su:'Examine how OT families illustrate the consequences of family breakdown.',steps:[
{lb:'David\'s family failures (2 Samuel 13-18)',dr:dQ6,ht:'<p>David\'s household illustrates the consequences of family dysfunction. His son Amnon raped his half-sister Tamar. David was angry but did nothing (13:21). Absalom, Tamar\'s brother, murdered Amnon in revenge and later led a full rebellion against David, forcing the king to flee Jerusalem. The prophetic warning after the Bathsheba/Uriah sin: "The sword will never depart from your house" (2Sam.12:10). David\'s moral failure in his own family — negligence, passivity — contributed directly to national instability and tragedy.</p>'},
{lb:'Isaac and Rebekah\'s favouritism (Genesis 25-27)',dr:dQ7,ht:'<p>Isaac and Rebekah each had a favourite son: "Isaac loved Esau, but Rebekah loved Jacob" (Gen.25:28). This parental favouritism led to: Jacob and Rebekah\'s deception of blind, elderly Isaac to steal Esau\'s blessing (Gen.27). Esau\'s hatred of Jacob and plans to kill him. Jacob\'s flight to Harran for 20 years. Rebekah never saw Jacob again. Parental favouritism — however understandable emotionally — created a family fracture with decades of consequences for the whole family and nation.</p>'},
{lb:'Eli\'s failure as a father (1 Samuel 2-3)',dr:dQ6,ht:'<p>Eli\'s sons Hophni and Phinehas were corrupt priests: taking the best meat from sacrifices by force; sleeping with women at the temple entrance (2:12-17,22). God sent a man of God to Eli: "Why do you honour your sons more than me?" (2:29). Eli\'s failure: he did rebuke his sons (2:23-24) but did not remove them from office. God\'s judgment: the whole family would lose the priesthood; both sons would die on the same day (2:34). Spiritual leadership was subverted by failure to act decisively against family sin.</p>'},
{lb:'Lessons from OT family failures',dr:dQ7,ht:'<p>OT family failures teach: (1) Favouritism destroys family unity (Isaac/Rebekah; Jacob\'s favouritism of Joseph also caused crisis). (2) Parental passivity enables sin — David did nothing about Amnon; Eli did not remove his sons. (3) The sins of parents affect their children — not as an inevitable curse but as a consequence of poor modelling and negligence. (4) Godly families require active, courageous parenting, not passive love. (5) God can bring redemption from family dysfunction — but the damage of family failure has real and lasting consequences.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'David\'s family crisis (Amnon, Tamar, Absalom) was connected to his moral failure because:',o:['God directly caused the crisis as immediate punishment for the Bathsheba sin','The prophet Nathan warned "the sword will never depart from your house" and David\'s passivity in his family enabled the violence','David\'s sons were all wicked from birth regardless of David\'s behaviour','Absalom rebelled because David refused to make him the crown prince'],a:2,w:'2Sam.12:10 — Nathan warned: "the sword will never depart from your house." David\'s passivity (not punishing Amnon — 13:21) enabled the cycle of family violence that culminated in Absalom\'s rebellion.'},{q:'The primary problem with Isaac and Rebekah\'s parenting was:',o:['They neglected to teach their sons the Law of Moses','They allowed their sons to marry foreign women','Each parent had a favourite son — this favouritism led to deception and decades of separation','They were too strict and drove both sons away from the family'],a:3,w:'Gen.25:28 — "Isaac loved Esau... but Rebekah loved Jacob" — this parental favouritism created the conditions for Jacob\'s deception of Isaac (Gen.27) and Esau\'s murderous hatred, separating the family for 20 years.'},{q:'Eli\'s failure as a father (1 Samuel 2) was specifically:',o:['He never taught his sons the Law of Moses','He did not know his sons were corrupt until too late','He knew his sons were corrupt but did not act decisively — honouring his sons more than God','He appointed his sons as priests when they were clearly unfit from childhood'],a:3,w:'1Sam.2:29 — God rebuked Eli: "Why do you honour your sons more than me?" Eli rebuked them mildly (2:23-24) but did not remove them. Passive, insufficient response to serious sin.'},{q:'Jacob\'s own favouritism of Joseph (over his other sons) led to:',o:['Peace and prosperity for the whole family in Canaan','Joseph\'s brothers selling him into slavery — the family fracture that later brought Israel to Egypt','Joseph becoming arrogant and refusing to work alongside his brothers','Jacob losing his birthright blessing from Isaac a second time'],a:2,w:'Gen.37 — Jacob\'s blatant favouritism of Joseph (the coat of many colours; preferential treatment) generated such intense jealousy that his brothers plotted to kill Joseph and sold him into slavery in Egypt.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 OT',ti:'Abraham\'s Family — Faith Across Generations',su:'Examine faith and family in the Abraham narrative.',steps:[
{lb:'Abraham\'s family as the covenant vehicle',dr:dQ7,ht:'<p>God said of Abraham: <em>"I have chosen him, so that he will direct his children and his household after him to keep the way of the LORD by doing what is right and just, so that the LORD will bring about for Abraham what he has promised him"</em> (Gen.18:19). God chose Abraham not only for his own faith but because He expected Abraham to transmit that faith to his household. Family faith is generational, not just individual. The covenant community is formed through faithful families, not through individuals alone.</p>'},
{lb:'Isaac — faith transmitted (Genesis 26)',dr:dQ8,ht:'<p>Isaac received the same covenant promises as Abraham: "I will be with you and will bless you... for the sake of my servant Abraham" (26:3,24). Isaac re-dug the wells that Abraham had dug — re-establishing what his father had built. He built an altar at Beersheba, just as Abraham had. He showed the same patient, non-confrontational character in dealing with disputes (26:18-22). Faith was transmitted: Isaac did not just inherit a story; he personally encountered God and responded in the same faithful way.</p>'},
{lb:'Jacob\'s encounter with God (Genesis 28; 32)',dr:dQ7,ht:'<p>Jacob, despite his deceptive character, also encountered God: At Bethel (Gen.28) — he saw a ladder to heaven; God renewed the covenant. His response: "Surely the LORD is in this place, and I was not aware of it" (28:16) — the beginning of personal faith. At Peniel (Gen.32) — he wrestled with God all night and received a new name: Israel ("one who struggles with God"). Jacob\'s faith was forged through wrestling — second-generation faith is often tested and refined rather than simply assumed.</p>'},
{lb:'Generational transmission of faith',dr:dQ8,ht:'<p>Abraham\'s family shows: (1) God chose a family as vehicle for His purposes — faith is meant to be transmitted across generations. (2) Each generation must personally encounter and respond to God (Isaac\'s altars; Jacob\'s wrestling). (3) Character flaws do not disqualify — both Isaac and Jacob had significant weaknesses yet God worked through them. (4) The covenant promise holds across generations — "the God of Abraham, Isaac and Jacob" (Ex.3:6). Application: parents bear responsibility to transmit faith; but each generation must own it personally, not merely inherit it culturally.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'God said of Abraham in Genesis 18:19 that He chose him specifically so he would:',o:['Become the most powerful nation in all the earth','Direct his children and household to keep the way of the LORD by doing right and just','Build the temple that Moses would later design','Expand the covenant to include all the nations immediately'],a:2,w:'Gen.18:19 — God chose Abraham so he would direct his children and household to keep God\'s way. Family faith transmission was central to God\'s reason for choosing Abraham.'},{q:'How did Isaac show he had personally received and continued Abraham\'s faith?',o:['He re-dug Abraham\'s wells and built an altar at Beersheba, as his father had done','He received the Torah directly from God on Mount Sinai','He sent missionaries to all nations to fulfil the promise of blessing','He gathered Abraham\'s servants for 40 days of corporate worship'],a:1,w:'Gen.26 — Isaac re-dug Abraham\'s wells and built an altar at Beersheba (26:25), just as Abraham had. He re-established what his father had established — faith transmitted through action, not just story.'},{q:'Jacob\'s encounter with God at Peniel (Gen.32) resulted in:',o:['Jacob dying from his wounds after the wrestling match','Jacob receiving a new name — Israel ("one who struggles with God")','God ending Jacob\'s covenant because of his deceptive character','Jacob being commanded to return home without ever seeing Esau'],a:2,w:'Gen.32:28 — "Your name will no longer be Jacob, but Israel, because you have struggled with God and with humans and have overcome" — second-generation faith wrestled and refined, not just inherited.'},{q:'The phrase "the God of Abraham, Isaac and Jacob" (Ex.3:6) is significant because:',o:['God can only be known through three people simultaneously','It limits God\'s relationship to the Jewish nation only','It shows covenant continuity across three generations — faith personally received in each generation','God changed His nature with each generation to suit their circumstances'],a:3,w:'"The God of Abraham, Isaac and Jacob" — used throughout the OT and by Jesus — affirms continuity of covenant across three generations. Each received and personally responded to the same faithful God.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 OT',ti:'Family Life and Worship in the OT',su:'Examine the connection between family and worship in the OT.',steps:[
{lb:'The Passover as a family event (Exodus 12)',dr:dQ8,ht:'<p>The Passover was designed as a family event: each family selected a lamb (12:3), killed it and put blood on the doorposts, roasted and ate it within the family household. God\'s instruction for future generations: <em>"When your children ask you, \'What does this ceremony mean?\' tell them, \'It is the Passover sacrifice to the LORD, who passed over the houses of the Israelites in Egypt\'"</em> (12:26-27). The festival was primarily familial — children asked, fathers answered, and the story of God\'s salvation was retold through family participation.</p>'},
{lb:'The Shema — family faith formation (Deuteronomy 6:4-9)',dr:dQ1,ht:'<p>The Shema is Israel\'s foundational confession: "Hear, O Israel: The LORD our God, the LORD is one. Love the LORD your God with all your heart and with all your soul and with all your strength" (Deut.6:4-5). It is to be taught in the home: on the heart (parent\'s own faith); to the children (next generation); at all times; on the hand, forehead, doorpost (permeating all of life). Jesus identified this as the greatest commandment. Its primary location was the home — family faith and national faith are inseparable.</p>'},
{lb:'Family celebration of festivals',dr:dQ8,ht:'<p>Israel\'s major festivals were family and community occasions: Passover (families — Ex.12). Feast of Weeks/Pentecost (firstfruits; community meal). Feast of Tabernacles (Sukkot — live in booths for a week; Deut.16:13-15 — "Be joyful at your festival — you, your sons and daughters, your servants, and the Levites, the foreigners, the fatherless and the widows who live in your towns"). Even the vulnerable were included. The family of the nation ate together, remembered God\'s acts and celebrated His provision together.</p>'},
{lb:'The family altar and Joshua\'s declaration',dr:dQ2,ht:'<p>Family altars and prayer were normal OT expressions of faith: Abraham built altars at each significant encounter with God (Gen.12:7,8; 13:18). Jacob set up a pillar and made vows at Bethel (Gen.28:18-22). Joshua declared: <em>"As for me and my household, we will serve the LORD"</em> (Josh.24:15). Family commitments to God were public and intentional. The home was the primary place of worship for most Israelites — faith was worked out daily in the domestic spaces of ordinary family life.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'The Passover was designed in Exodus 12 as primarily:',o:['A ceremony only for Levitical priests in the tabernacle','A national ceremony conducted only in Jerusalem','A family event — each household with its own lamb, celebrated in the home','A military celebration of victory over Pharaoh\'s army'],a:3,w:'Ex.12:3 — "each man is to take a lamb for his family, one for each household" — Passover was fundamentally a family event. Children asked questions; fathers explained the significance. The home was the sanctuary.'},{q:'The Shema (Deut.6:4-5) was to be:',o:['Recited only by priests in the temple once per year','Primarily taught in schools run by the Levites','Taught in the home at all times — on hearts, to children, tied on hands, written on doorposts','Memorised and recited by adults only, not explained to young children'],a:3,w:'Deut.6:6-9 — the Shema was to be on parents\' hearts first, impressed on children, talked about at home and on the road, at bedtime and morning. The home was the primary location of faith formation.'},{q:'Joshua 24:15 — "As for me and my household, we will serve the LORD" — establishes the principle that:',o:['Joshua forced his family to worship against their will','Faith is a private and individual matter only','The head of the household takes spiritual leadership and sets the direction for the family\'s covenant commitment','Only the eldest son inherits the responsibility for the family\'s faith'],a:3,w:'Josh.24:15 — Joshua publicly declared his household\'s commitment. This is the OT pattern: the head of the family takes spiritual leadership and sets the direction of the household\'s faith.'},{q:'The Feast of Tabernacles (Deut.16:14) required the celebration to include:',o:['Only the adult males of the covenant community','The immediate family only','Sons and daughters, servants, Levites, foreigners, fatherless and widows — the whole community','Only the firstborn sons dedicated to God'],a:3,w:'Deut.16:14 — "Be joyful at your festival — you, your sons and daughters, your servants, the Levites, the foreigners, the fatherless and the widows" — inclusive celebration extending to all, including the most vulnerable.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 OT',ti:'WAEC Prep — Family Life in the OT',su:'Practise WAEC-style questions on OT family life.',steps:[
{lb:'WAEC essay structure',dr:dQ9,ht:'<p>For WAEC questions on OT family life: (1) Define the OT concept of family (bet ab — household; covenant community). (2) Discuss marriage (Gen.2:24; Mal.2:14-16; Prov.31). (3) Discuss parenting and children (Ps.127:3; Deut.6:4-9; Prov.22:6). (4) Discuss honouring parents (Ex.20:12; Prov.23:22). (5) Give examples — Ruth and Boaz (chesed); Hannah (dedication); Abraham\'s family (faith across generations). (6) Note dysfunctional families (David; Eli; Isaac/Rebekah) and consequences. (7) Apply to Christian family life today.</p>'},
{lb:'Key texts for WAEC',dr:dQ9,ht:'<p>WAEC reference bank: Gen.2:18,24 (leave, cleave, one flesh). Gen.18:19 (Abraham directed household in God\'s way). Ex.20:12 (honour father and mother; long life). Ex.12:26-27 (Passover family ceremony; children ask, father answers). Deut.6:4-9 (Shema; teach children at all times). Ps.127:3 (children are heritage from the LORD). Prov.22:6 (train up a child). Prov.31:10,30 (capable wife; worth above rubies; fears the LORD). Mal.2:14,16 (marriage covenant; God hates divorce). Ruth 1:16 (where you go I will go). Josh.24:15 (as for me and my household). 1Sam.1:27-28 (Hannah dedicates Samuel).</p>'},
{lb:'Key connections',dr:dQ2,ht:'<p>Connections: Marriage (covenant) → Parenting (faith transmission) → Children (God\'s heritage) → Honouring parents (social foundation) → Extended family (kinsman-redeemer/chesed) → National stability. Strong marriages produce stable homes; stable homes produce godly children; godly children honour parents and carry faith forward; extended family provides safety net; the whole creates a stable society. When any element breaks down (David; Eli; Isaac/Rebekah), the consequences ripple outward through community and nation.</p>'},
{lb:'Common WAEC mistakes',dr:dQ1,ht:'<p>Avoid: Saying the Shema is in Exodus (it is Deuteronomy 6). Attributing Gen.2:24 to Proverbs. Confusing Hannah (Samuel\'s mother) with Anna the prophetess who appears in Luke 2. Saying the fifth commandment applies only to young children (it covers adult children caring for elderly parents). Saying Ruth was an Israelite (she was a Moabite). Forgetting chesed appears three times in Ruth and is the book\'s key word. Not giving specific references for marriage, children and parenting texts. Always give the lesson or application at the end.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'Genesis 2:24 describes marriage as involving three things. Which correctly identifies all three?',o:['Pray, commit, be faithful','Leave parents, be united to wife, become one flesh','Make vows, establish a household, be fruitful and multiply','Honour parents, love spouse, raise godly children'],a:2,w:'Gen.2:24 — "A man leaves his father and mother (leaving), is united to his wife (cleaving), and they become one flesh (union)" — three foundational elements of OT marriage.'},{q:'The Shema (Deut.6:4-9) commanded parents to teach God\'s commandments to their children:',o:['At the temple once per year during festivals','Only when children specifically ask about God','At all times — sitting at home, walking, lying down, getting up — in the home','Only after the children reached the age of 12'],a:3,w:'Deut.6:7 — "when you sit at home and when you walk along the road, when you lie down and when you get up" — constant, all-of-life faith education in the family home.'},{q:'The key virtue demonstrated by Ruth in the book of Ruth is:',o:['Wisdom in financial management and business','Military courage in protecting Naomi from enemies','Chesed — steadfast love, covenant loyalty and faithful kindness beyond obligation','Skill in agricultural work and gleaning efficiency'],a:3,w:'Chesed (appears 3 times in Ruth: 1:8; 2:20; 3:10) — Ruth\'s loyalty to Naomi and faithfulness to Boaz exemplify chesed: costly, active, faithful love that goes beyond obligation.'},{q:'The Fifth Commandment (Ex.20:12) is "the first commandment with a promise" because:',o:['It was the first commandment God ever gave to humanity','It contains a specific promise: "so that you may live long in the land"','It is the only commandment that applies to children and not adults','It promises eternal life to all who obey it'],a:2,w:'Ex.20:12 / Eph.6:2-3 — "the first commandment with a promise": "so that you may live long in the land." Paul highlights this in Ephesians 6:2-3. Honouring parents carries real-world consequences.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 OT',ti:'Mixed Questions — Family Life in the OT',su:'Integrated revision across all CRS-OT-10 topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>OT family life: Marriage (Gen.2:24 — leave, cleave, one flesh; Mal.2:14 — covenant; Prov.31 — capable wife, fears LORD). Children (Ps.127:3 — heritage from LORD; Deut.6:4-9 — teach at all times; Prov.22:6 — train up). Honour parents (Ex.20:12 — fifth commandment with promise; Prov.23:22 — do not despise when old). Ruth/Boaz — chesed; kinsman-redeemer. Hannah/Samuel — prayer, dedication, faith. Abraham family — faith across generations. Dysfunctional families — David (passivity), Eli (passivity), Isaac/Rebekah (favouritism) — consequences of family breakdown.</p>'},
{lb:'Key connections',dr:dQ10,ht:'<p>OT family values flow from: (1) God as creator of family (Gen.2:18). (2) Covenant as model for family relationships (Mal.2:14). (3) Faith transmission as the primary family responsibility (Deut.6:4-9). (4) Chesed as the operating principle of family relationships (Ruth). (5) Dedication of children to God as the highest OT parenting expression (Hannah). Applications: building strong marriages; intentional faith formation of children; caring for elderly parents; practising chesed in extended family.</p>'},
{lb:'The family in God\'s redemptive purposes',dr:dQ9,ht:'<p>The family is central to God\'s redemptive plan: (1) Abraham\'s family was chosen as the vehicle for covenant (Gen.12; 18:19). (2) Israel as a nation was God\'s "firstborn son" (Ex.4:22). (3) The Messiah came through a specific family line — Abraham, Isaac, Jacob, Judah, David (Matt.1). (4) Ruth (a foreigner) was included in that line through chesed. (5) Hannah\'s prayer for a son produced the prophet who anointed the king whose line led to Christ. Every faithful family act in the OT contributed to a larger story God was writing across generations.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final revision: Know Gen.2:24 (leave, cleave, one flesh). Know Ex.20:12 (fifth commandment with promise). Know Deut.6:4-9 (Shema; teach children at all times). Know Ps.127:3 (children as heritage). Know Prov.22:6 (train up a child). Know Prov.31:30 (fears the LORD). Know Mal.2:14,16 (marriage covenant; God hates divorce). Know Ruth (chesed; go\'el). Know Hannah (prayer; dedication — 1Sam.1). Know Josh.24:15 (as for me and my household). For essays: define → OT law provisions → examples (Ruth, Hannah, Abraham) → dysfunctional examples → lessons today. Always give references.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Ruth\'s famous declaration "Your people will be my people and your God my God" (Ruth 1:16) was said to:',o:['Boaz, when he asked her to remain in his field','Naomi, when Naomi urged her to return to Moab','Orpah, encouraging her to stay in Israel','The elders at Bethlehem\'s gate when she arrived'],a:2,w:'Ruth 1:16 — Ruth said this to Naomi, refusing to return to Moab when Naomi urged both daughters-in-law to go back to their own families. It is the OT\'s greatest declaration of covenant loyalty.'},{q:'Psalm 127:3 says "Children are a heritage from the LORD." The word "heritage" (nahalah) implies:',o:['Children are the parents\' property to do with as they wish','Children belong to God; parents are stewards of what God has given','Children are primarily an economic asset to support elderly parents','Children must earn their place in the family through obedience'],a:2,w:'"Nahalah" (heritage/inheritance) — children are God\'s gift entrusted to parents. They belong ultimately to God; parents are stewards who give them back to God\'s purposes (as Hannah did with Samuel).'},{q:'Hannah\'s song (1Sam.2:1-10) became the model for which NT prayer?',o:['The Lord\'s Prayer (Matthew 6)','The Benedictus of Zechariah (Luke 1:68-79)','The Magnificat of Mary (Luke 1:46-55)','The High Priestly Prayer of Jesus (John 17)'],a:3,w:'Mary\'s Magnificat (Luke 1:46-55) closely parallels Hannah\'s song — both celebrate God reversing human expectations: exalting the humble, filling the hungry, overthrowing the powerful.'},{q:'Joshua 24:15 — "As for me and my household, we will serve the LORD" — establishes the principle that:',o:['Joshua forced his family to worship against their will','Individual adults must make their own religious choices independently of family','The head of the household takes spiritual leadership and sets the family\'s covenant direction','Only the eldest son inherits responsibility for the family\'s faith'],a:3,w:'Josh.24:15 — Joshua publicly declared his household\'s commitment to God. The OT pattern of family spiritual leadership: the head of the household takes responsibility for the family\'s faith direction.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
