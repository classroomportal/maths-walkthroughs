<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{

      allBtns[o.correct].classList.add('mc-correct');

    }
    return;
  }
});

{ey:'Q1 \u2022 CRS • Acts & Epistles',ti:'Pentecost and the Birth of the Church',su:'Explain the events of Pentecost and their significance for the birth of the Christian Church.',steps:[
{lb:'The events of Pentecost',dr:dQ1,ht:'<p>On the Jewish harvest festival of <b>Pentecost</b> (fifty days after Passover), the <b>Holy Spirit</b> descended upon the disciples gathered in Jerusalem, appearing as "tongues of fire" and enabling them to speak in other languages, as recorded in <b>Acts 2:1-13</b>.</p>'},

{lb:'Mass conversion and baptism',dr:dQ1,ht:'<p>Cut to the heart by Peter\'s message, the crowd asked what they should do; Peter called them to <b>repent and be baptised</b>, and about <b>3,000 people</b> were baptised that day (Acts 2:41) &mdash; traditionally regarded as the Church\'s "birthday."</p>'},

{ey:'Q2 \u2022 CRS • Acts & Epistles',ti:'The Early Church\'s Fellowship and Generosity',su:'Describe the life and fellowship of the earliest Christian community in Jerusalem.',steps:[

mediately began to shrink","The Lord added to their number daily those being saved","The apostles left Jerusalem entirely"],"a":2,"w":"As a direct result, the Lord added to their number daily those who were being saved."},{"q":"Why is this passage often referenced as a \"model\" for Christian community today?","o":["It shows a community focused only on wealth accumulation","It shows a community with no relevance to modern Christian life","It describes only isolated individual practices, not any community","It shows genuine devotion, generosity and daily fellowship contributing to church growth"],"a":3,"w":"This passage is referenced as a model because it shows genuine devotion, generosity and fellowship contributing to church growth."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},

all — he died in silence"],"a":2,"w":"As Stephen died, he prayed that God would not hold this sin against his killers."},{"q":"Which future apostle approved of Stephen's death, according to Acts 7:58-8:1?","o":["Philip","Peter","John","Saul (later Paul)"],"a":3,"w":"Saul, who later became the apostle Paul, approved of Stephen's death."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS • Acts & Epistles',ti:'The Church Scatters: Philip and the Ethiopian Eunuch',su:'Explain how persecution scattered believers and led to the gospel\'s expansion beyond Jerusalem.',steps:[
{lb:'Persecution scatters the believers',dr:dQ2,ht:'<p>Following Stephen\'s death, a <b>great persecution</b> broke out against the Jerusalem church, scattering believers throughout Judea and Samaria (Acts 8:1) &mdash; unintentionally fulfilling Jesus\'s command in <b>Acts 1:8</b> to be witnesses beyond Jerusalem.</p>'},
{lb:'Philip\'s ministry in Samaria',dr:dQ2,ht:'<p><b>Philip</b> (another of the seven chosen in Acts 6) preached in <b>Samaria</b>, performing miracles and casting out unclean spirits; many Samaritans believed and were baptised (Acts 8:4-13) &mdash; a significant step, since Jews and Samaritans traditionally had deep religious hostility.</p>'},
{lb:'The Ethiopian eunuch',dr:dQ2,ht:'<p>An angel directed Philip to a desert road, where he met an <b>Ethiopian eunuch</b>, a court official of Candace, Queen of Ethiopia, reading the prophet Isaiah. Philip explained that the passage pointed to <b>Jesus</b>, and the eunuch believed and was baptised immediately (Acts 8:26-39).</p>'},
{lb:'Significance: crossing boundaries',dr:dQ2,ht:'<p>This episode shows the gospel deliberately <b>crossing ethnic, geographic and social boundaries</b> &mdash; reaching hostile Samaritans and an African court official &mdash; foreshadowing the Church\'s expanding, genuinely universal mission.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What triggered the scattering of believers described in Acts 8:1?","o":["A great persecution following Stephen's death","A famine in Jerusalem","A Roman census","A dispute among the apostles"],"a":0,"w":"A great persecution following Stephen's death scattered believers throughout Judea and Samaria."},{"q":"Which earlier command from Jesus did this scattering unintentionally fulfil?","o":["The Great Commission's instruction to build only one church","Acts 1:8, to be witnesses beyond Jerusalem","A command to remain only in Jerusalem forever","A command to avoid all preaching"],"a":1,"w":"This scattering unintentionally fulfilled Jesus's command in Acts 1:8 to be witnesses beyond Jerusalem."},{"q":"Where did Philip preach after the persecution began?","o":["Egypt","Rome","Samaria","Babylon"],"a":2,"w":"Philip preached in Samaria after the persecution began."},{"q":"Why was Philip's ministry to the Samaritans significant?","o":["Samaritans were Roman citizens with full legal rights","Samaritans and Jews had always been close allies with no tension","Samaria had never heard of Judaism before","Jews and Samaritans traditionally had deep religious hostility toward each other"],"a":3,"w":"This was significant because Jews and Samaritans traditionally had deep religious hostility toward each other."},{"q":"Who did Philip meet on the desert road, as directed by an angel?","o":["An Ethiopian eunuch, a court official of Candace, Queen of Ethiopia","A Roman centurion","A Pharisee named Nicodemus","A Samaritan woman at a well"],"a":0,"w":"Philip met an Ethiopian eunuch, a court official of Candace, Queen of Ethiopia."},{"q":"Which prophet's writing was the Ethiopian eunuch reading when Philip met him?","o":["Jeremiah","Isaiah","Ezekiel","Daniel"],"a":1,"w":"The Ethiopian eunuch was reading the prophet Isaiah when Philip met him."},{"q":"What did Philip explain the passage the eunuch was reading pointed to?","o":["The Sanhedrin","The Roman Emperor","Jesus","The Tower of Babel"],"a":2,"w":"Philip explained that the passage the eunuch was reading pointed to Jesus."},{"q":"What does this episode with the Samaritans and the Ethiopian eunuch illustrate about the gospel's spread?","o":["It excluded all non-Jewish people permanently","It remained confined only to Jerusalem","It only ever reached Roman citizens","It deliberately crossed ethnic, geographic and social boundaries"],"a":3,"w":"This episode illustrates the gospel deliberately crossing ethnic, geographic and social boundaries."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS • Acts & Epistles',ti:'The Conversion of Saul',su:'Explain Saul\'s dramatic conversion on the road to Damascus and its significance.',steps:[
{lb:'Saul the persecutor',dr:dQ1,ht:'<p>Before his conversion, <b>Saul</b> was a zealous persecutor of Christians, present at Stephen\'s stoning, and actively obtaining letters of authority to arrest believers in <b>Damascus</b> and bring them to Jerusalem (Acts 9:1-2).</p>'},
{lb:'The Damascus road encounter',dr:dQ1,ht:'<p>On the road to Damascus, a <b>blinding light from heaven</b> flashed around Saul, and he heard Jesus\'s voice ask, <em>"Saul, Saul, why do you persecute me?"</em> Struck blind, Saul was led by hand into the city (Acts 9:3-9).</p>'},
{lb:'Ananias\'s obedience',dr:dQ1,ht:'<p>Despite his fear of Saul\'s reputation, a disciple named <b>Ananias</b>, directed by God in a vision, went to Saul, restored his sight, and baptised him &mdash; an act of remarkable obedience and trust (Acts 9:10-19).</p>'},
{lb:'From persecutor to preacher',dr:dQ1,ht:'<p>Saul (later known as <b>Paul</b>) immediately began preaching that <b>Jesus is the Son of God</b> in the synagogues, astonishing those who knew of his former reputation, and would go on to become the early Church\'s greatest missionary.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What was Saul doing before his conversion, according to Acts 9:1-2?","o":["Actively persecuting Christians and seeking to arrest believers in Damascus","Serving as a Christian missionary in Rome","Working as a fisherman in Galilee","Serving as a Roman centurion"],"a":0,"w":"Saul was actively persecuting Christians, seeking letters of authority to arrest believers in Damascus."},{"q":"What happened to Saul on the road to Damascus?","o":["He was ambushed by robbers","A blinding light flashed around him and he heard Jesus's voice","He fell asleep and had a dream only","He met the apostle Peter in person"],"a":1,"w":"A blinding light flashed around Saul and he heard Jesus's voice on the road to Damascus."},{"q":"What question did Jesus ask Saul on the Damascus road?","o":["\"Saul, where are you going?\"","\"Saul, why have you abandoned me?\"","\"Saul, Saul, why do you persecute me?\"","\"Saul, who sent you here?\""],"a":2,"w":"Jesus asked Saul, \"Saul, Saul, why do you persecute me?\""},{"q":"What happened to Saul physically as a result of this encounter?","o":["Nothing physical happened to him at all","He was struck deaf","He fell into a deep sleep for days","He was struck blind"],"a":3,"w":"Saul was struck blind as a result of his encounter with Jesus."},{"q":"Who was sent by God to restore Saul's sight and baptise him?","o":["Ananias","Peter","Philip","Stephen"],"a":0,"w":"Ananias was sent by God to restore Saul's sight and baptise him."},{"q":"What did Ananias have to overcome in order to obey God's instruction?","o":["A physical illness of his own","His fear of Saul's reputation as a persecutor","A lack of any knowledge about Saul","Opposition from the Roman authorities"],"a":1,"w":"Ananias had to overcome his fear of Saul's reputation as a persecutor of Christians."},{"q":"What did Saul immediately begin preaching after his conversion?","o":["That Christians should stop meeting together","That the Sanhedrin was correct in its teaching","That Jesus is the Son of God","That the temple should be destroyed"],"a":2,"w":"Saul immediately began preaching that Jesus is the Son of God."},{"q":"What did Saul later become known as, and what role did he play in the early Church?","o":["Philip, an evangelist to Samaria","Peter, the first Pope","Stephen, the first martyr","Paul, the early Church's greatest missionary"],"a":3,"w":"Saul became known as Paul and became the early Church's greatest missionary."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS • Acts & Epistles',ti:'Peter and Cornelius: The Gospel to the Gentiles',su:'Explain the conversion of Cornelius and its significance for the Gentile mission.',steps:[
{lb:'Cornelius the centurion',dr:dQ2,ht:'<p><b>Cornelius</b>, a Roman centurion and devout "God-fearer" (a Gentile who worshipped Israel\'s God without full conversion), received a vision instructing him to send for <b>Peter</b> (Acts 10:1-8).</p>'},
{lb:'Peter\'s vision',dr:dQ2,ht:'<p>Peter received his own vision of a sheet containing ritually <b>"unclean" animals</b>, with a voice telling him, <em>"Do not call anything impure that God has made clean"</em> (Acts 10:9-16) &mdash; preparing him to overcome Jewish scruples about associating with Gentiles.</p>'},
{lb:'The Spirit falls on the Gentiles',dr:dQ2,ht:'<p>Peter visited Cornelius\'s household and preached Christ; remarkably, the <b>Holy Spirit fell upon the Gentiles present</b> even before baptism, astonishing the Jewish believers who had accompanied Peter (Acts 10:34-48).</p>'},
{lb:'A turning point for the mission',dr:dQ2,ht:'<p>This event marked a decisive <b>turning point</b>: the Gospel formally extended beyond Israel to <b>Gentiles</b>, confirming that salvation in Christ was for all peoples, not the Jewish people alone.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What was Cornelius's occupation?","o":["A Roman centurion","A Jewish priest","A Greek philosopher","An Egyptian merchant"],"a":0,"w":"Cornelius was a Roman centurion."},{"q":"What term describes a Gentile like Cornelius who worshipped Israel's God without full conversion?","o":["A Pharisee","A \"God-fearer\"","A Sadducee","A Zealot"],"a":1,"w":"\"God-fearer\" describes a Gentile who worshipped Israel's God without full conversion."},{"q":"What did Cornelius's vision instruct him to do?","o":["Offer a sacrifice at the temple in Jerusalem","Travel immediately to Rome","Send for Peter","Build a new synagogue"],"a":2,"w":"Cornelius's vision instructed him to send for Peter."},{"q":"What did Peter see in his own vision, according to Acts 10:9-16?","o":["A vision of the Tower of Babel","A burning bush","A vision of the crucifixion","A sheet containing ritually \"unclean\" animals"],"a":3,"w":"Peter saw a sheet containing ritually \"unclean\" animals in his vision."},{"q":"What did the voice tell Peter about these animals?","o":["\"Do not call anything impure that God has made clean\"","\"These animals must never be eaten under any circumstances\"","\"Only priests may touch these animals\"","\"These animals belong only to the Gentiles\""],"a":0,"w":"The voice told Peter, \"Do not call anything impure that God has made clean.\""},{"q":"What remarkable event happened while Peter was still preaching to Cornelius's household?","o":["A great earthquake destroyed the house","The Holy Spirit fell upon the Gentiles present, even before baptism","Cornelius immediately died","Peter was struck blind, like Saul had been"],"a":1,"w":"The Holy Spirit fell upon the Gentiles present even before baptism, while Peter was still preaching."},{"q":"Who was astonished by the Holy Spirit falling on the Gentiles?","o":["The Roman Emperor","Cornelius himself, who expected nothing","The Jewish believers who had accompanied Peter","No one was astonished at all"],"a":2,"w":"The Jewish believers who had accompanied Peter were astonished that the Spirit fell on Gentiles."},{"q":"What did this event confirm about the scope of salvation in Christ?","o":["That salvation required full conversion to Judaism first","That salvation was only ever intended for Gentiles, not Jews","That salvation was only for Roman citizens","That salvation was for all peoples, not the Jewish people alone"],"a":3,"w":"This event confirmed that salvation in Christ was for all peoples, not the Jewish people alone."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS • Acts & Epistles',ti:'The Jerusalem Council',su:'Explain the Jerusalem Council\'s resolution of the dispute over Gentile converts and the Law.',steps:[
{lb:'The dispute over circumcision',dr:dQ1,ht:'<p>A serious dispute arose when some believers insisted that Gentile converts must be <b>circumcised</b> and keep the <b>Mosaic Law</b> to be saved &mdash; a teaching Paul and Barnabas strongly opposed (Acts 15:1-5).</p>'},
{lb:'The council convenes in Jerusalem',dr:dQ1,ht:'<p>The apostles and elders gathered in <b>Jerusalem</b> to resolve the matter. <b>Peter</b> spoke of God\'s acceptance of Gentiles (recalling Cornelius), while <b>Paul and Barnabas</b> reported on God\'s work among the Gentiles on their missionary journeys.</p>'},
{lb:'James\'s proposal',dr:dQ1,ht:'<p><b>James</b>, the leader of the Jerusalem church, proposed a compromise: Gentiles need not be circumcised, but should abstain from food sacrificed to idols, from blood, from the meat of strangled animals, and from sexual immorality (Acts 15:19-21).</p>'},
{lb:'The decision and its significance',dr:dQ1,ht:'<p>The council\'s decision (Acts 15:22-29), sent by letter to Gentile churches, preserved <b>unity</b> between Jewish and Gentile believers without imposing the full burden of Jewish law &mdash; considered the <b>first council</b> of the Christian Church.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What dispute prompted the Jerusalem Council, according to Acts 15:1-5?","o":["Whether Gentile converts must be circumcised and keep the Mosaic Law","Whether women could be baptised","Whether the apostles should remain in Jerusalem","Whether the temple should be rebuilt"],"a":0,"w":"The dispute was whether Gentile converts must be circumcised and keep the Mosaic Law to be saved."},{"q":"Which two missionaries strongly opposed requiring circumcision for Gentile converts?","o":["Peter and John","Paul and Barnabas","Stephen and Philip","James and Ananias"],"a":1,"w":"Paul and Barnabas strongly opposed requiring circumcision for Gentile converts."},{"q":"Which earlier event did Peter recall in his speech at the council?","o":["Saul's conversion on the road to Damascus","Stephen's martyrdom","God's acceptance of Gentiles through Cornelius","The Tower of Babel"],"a":2,"w":"Peter recalled God's acceptance of Gentiles through the household of Cornelius."},{"q":"Who proposed the compromise resolution at the Jerusalem Council?","o":["Ananias","Peter","Paul","James"],"a":3,"w":"James, leader of the Jerusalem church, proposed the compromise resolution."},{"q":"What did James's proposal say Gentile converts need NOT do?","o":["Be circumcised","Abstain from food sacrificed to idols","Abstain from sexual immorality","Abstain from blood"],"a":0,"w":"James's proposal said Gentile converts need not be circumcised."},{"q":"Which of these was one of the practices Gentile converts WERE asked to abstain from?","o":["Eating bread","Food sacrificed to idols","Praying together","Meeting in homes"],"a":1,"w":"Gentile converts were asked to abstain from food sacrificed to idols, among other things."},{"q":"How was the council's decision communicated to Gentile churches?","o":["It was never communicated at all","By a single messenger with no written record","By letter","Only by word of mouth, generations later"],"a":2,"w":"The council's decision was communicated to Gentile churches by letter."},{"q":"What is the Jerusalem Council considered to be, in Church history?","o":["A purely political meeting with no theological content","An event with no lasting historical significance","A meeting that caused the Church to permanently split","The first council of the Christian Church"],"a":3,"w":"The Jerusalem Council is considered the first council of the Christian Church."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS • Acts & Epistles',ti:'The Early Church\'s Growth and Challenges',su:'Evaluate the internal and external challenges the early Church faced as it grew rapidly.',steps:[
{lb:'Rapid geographic growth',dr:dQ2,ht:'<p>Despite persecution, the early Church grew rapidly, with Christian communities established across the Roman Empire by the mid-first century, including <b>Antioch, Ephesus, Corinth</b>, and eventually <b>Rome</b> itself.</p>'},
{lb:'Internal challenges: disputes and care for widows',dr:dQ2,ht:'<p>Internal challenges included the earlier <b>dispute over food distribution to widows</b> (Acts 6:1, leading to the appointment of the seven, including Stephen and Philip) and the later dispute over <b>circumcision</b> resolved at the Jerusalem Council.</p>'},
{lb:'External challenges: persecution',dr:dQ2,ht:'<p>External challenges included ongoing persecution, first from the <b>Jewish authorities</b> (Sanhedrin), as seen with Stephen, and increasingly from <b>Roman authorities</b> as Christianity spread and was perceived as a threat to social and religious order.</p>'},
{lb:'The Spirit\'s role in growth',dr:dQ2,ht:'<p>Acts consistently attributes the Church\'s remarkable growth to the active work of the <b>Holy Spirit</b>, bold preaching by ordinary believers, and the compelling example of <b>genuine love and unity</b> within the Christian community.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"By the mid-first century, in which cities had Christian communities been established, according to this lesson?","o":["Antioch, Ephesus, Corinth and Rome","Only Jerusalem, with no expansion elsewhere","Only cities within modern-day Nigeria","Only cities under direct apostolic residence"],"a":0,"w":"By the mid-first century, Christian communities existed in Antioch, Ephesus, Corinth and Rome."},{"q":"What internal dispute in Acts 6:1 led to the appointment of the seven, including Stephen?","o":["A dispute over who should be baptised","A dispute over food distribution to widows","A dispute over church location","A dispute over Roman taxation"],"a":1,"w":"A dispute over food distribution to widows led to the appointment of the seven, including Stephen."},{"q":"What later internal dispute did the Jerusalem Council resolve?","o":["A dispute over the location of the temple","A dispute over who should lead the twelve apostles","The dispute over circumcision and the Mosaic Law for Gentiles","A dispute over Roman citizenship"],"a":2,"w":"The Jerusalem Council resolved the dispute over circumcision and the Mosaic Law for Gentile converts."},{"q":"Which authorities first persecuted the early Church, as seen with Stephen?","o":["The Greek authorities","The Roman authorities exclusively","The Egyptian authorities","The Jewish authorities (Sanhedrin)"],"a":3,"w":"The Jewish authorities (Sanhedrin) first persecuted the early Church, as seen with Stephen."},{"q":"Which authorities increasingly persecuted Christians as the faith spread further?","o":["Roman authorities","Only Jewish authorities, with no other persecution ever occurring","Only Ethiopian authorities","Only Samaritan authorities"],"a":0,"w":"Roman authorities increasingly persecuted Christians as the faith spread and was seen as a threat to social order."},{"q":"What does the book of Acts consistently attribute the Church's growth to?","o":["Roman military support","The active work of the Holy Spirit, bold preaching, and genuine love/unity","Wealth and political power alone","Complete isolation from wider society"],"a":1,"w":"Acts attributes the Church's growth to the Holy Spirit's work, bold preaching, and genuine love and unity."},{"q":"What quality of the Christian community is repeatedly cited as compelling to outsiders?","o":["Military strength","Wealth and luxury","Genuine love and unity","Political power"],"a":2,"w":"The genuine love and unity of the Christian community is repeatedly cited as compelling to outsiders."},{"q":"What overall pattern does this topic show about the early Church's growth?","o":["Growth occurred only after all persecution had permanently ended","Growth occurred with no challenges of any kind","The Church stopped growing entirely after Stephen's death","Growth occurred despite, and sometimes through, both internal disputes and external persecution"],"a":3,"w":"This topic shows growth occurred despite, and sometimes through, both internal disputes and external persecution."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS • Acts & Epistles',ti:'WAEC Exam Preparation — The Early Church',su:'Practise WAEC-style questions on the early Church in Acts.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on the early Church: (1) Identify the <b>specific event or passage</b> asked about. (2) Give the <b>Bible reference</b> precisely. (3) Explain what <b>happened and why it mattered</b>. (4) Draw out the <b>lesson</b> for Christian life today.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "Describe the events of Pentecost and their significance." / "Discuss the causes and effects of Stephen\'s martyrdom." / "Explain the significance of the conversion of Cornelius." / "What was decided at the Jerusalem Council, and why did it matter?"</p>'},
{lb:'Key references to remember',dr:dQ1,ht:'<p>Key references: <b>Acts 2</b> (Pentecost); <b>Acts 6-7</b> (Stephen); <b>Acts 8</b> (Philip, the Ethiopian eunuch); <b>Acts 9</b> (Saul\'s conversion); <b>Acts 10</b> (Cornelius); <b>Acts 15</b> (Jerusalem Council).</p>'},
{lb:'Drawing out lessons for today',dr:dQ1,ht:'<p>WAEC essays should always draw a clear <b>lesson</b> from each passage &mdash; for example, Stephen\'s forgiveness of his killers teaches Christians to forgive even under persecution, while the Jerusalem Council teaches the importance of unity amid disagreement.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on the early Church?","o":["Identify the specific event or passage asked about","Immediately give a personal opinion with no facts","List unrelated facts with no explanation","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on the early Church should begin by identifying the specific event or passage asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Explain the significance of the conversion of Cornelius.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"Explain the significance of the conversion of Cornelius\" is a typical WAEC-style question on this topic."},{"q":"Which chapters of Acts record the events of Stephen's ministry and martyrdom?","o":["Acts 10","Acts 2","Acts 6-7","Acts 15"],"a":2,"w":"Acts 6-7 records the events of Stephen's ministry and martyrdom."},{"q":"Which chapter of Acts records the Jerusalem Council?","o":["Acts 6","Acts 2","Acts 9","Acts 15"],"a":3,"w":"Acts 15 records the Jerusalem Council."},{"q":"Which chapter of Acts records Saul's conversion?","o":["Acts 9","Acts 2","Acts 10","Acts 15"],"a":0,"w":"Acts 9 records Saul's conversion on the road to Damascus."},{"q":"What lesson does Stephen's forgiveness of his killers teach Christians?","o":["To always seek revenge against enemies","To forgive even under persecution","To avoid all forgiveness entirely","To remain silent in the face of injustice"],"a":1,"w":"Stephen's forgiveness teaches Christians to forgive even under persecution."},{"q":"What lesson does the Jerusalem Council teach about handling disagreement?","o":["That councils should never be held","That disagreement should always cause permanent division","The importance of unity amid disagreement","That only one person's opinion should ever be considered"],"a":2,"w":"The Jerusalem Council teaches the importance of unity amid disagreement."},{"q":"Why does WAEC reward drawing out a clear lesson from each passage studied?","o":["Drawing lessons is discouraged by WAEC","Lessons are irrelevant to WAEC marking","Only factual recall is ever rewarded","It shows the ability to apply Scripture meaningfully, not just recite facts"],"a":3,"w":"Drawing out lessons shows the ability to apply Scripture meaningfully, not just recite facts, which WAEC rewards."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS • Acts & Epistles',ti:'Mixed Questions — The Early Church',su:'Integrated revision across the birth, growth and challenges of the early Church.',steps:[
{lb:'Summary of key events',dr:dQ2,ht:'<p>The early Church was born at <b>Pentecost</b> (Acts 2), grew through radical fellowship, survived persecution (Stephen\'s martyrdom), expanded beyond Jerusalem (Philip, Saul\'s conversion, Cornelius), and resolved its first major dispute at the <b>Jerusalem Council</b> (Acts 15).</p>'},
{lb:'Key references and names to remember',dr:dQ2,ht:'<p>Must-know facts: <b>Acts 2</b> (Pentecost, Peter\'s sermon); <b>Acts 6-7</b> (Stephen, first martyr); <b>Acts 8</b> (Philip, Ethiopian eunuch); <b>Acts 9</b> (Saul\'s conversion); <b>Acts 10</b> (Cornelius, Peter\'s vision); <b>Acts 15</b> (Jerusalem Council, James\'s proposal).</p>'},
{lb:'Lessons for today',dr:dQ2,ht:'<p>The early Church\'s story teaches enduring lessons about the Holy Spirit\'s empowering presence, genuine community and generosity, courage under persecution, and the Church\'s calling to cross ethnic and social boundaries with the gospel.</p>'},
{lb:'Final exam tips',dr:dQ2,ht:'<p>Always give the <b>precise Bible reference</b>, explain what happened <b>and why it mattered</b>, and conclude with a clear <b>lesson</b> connecting the passage to Christian life today.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"On which festival did the Holy Spirit descend on the disciples?","o":["Pentecost","Passover","Purim","Tabernacles"],"a":0,"w":"The Holy Spirit descended on the disciples at Pentecost."},{"q":"Who was the Church's first martyr?","o":["Peter","Stephen","Paul","Philip"],"a":1,"w":"Stephen was the Church's first martyr."},{"q":"Who did Philip meet and baptise on the desert road?","o":["The apostle Paul","A Roman centurion named Cornelius","An Ethiopian eunuch","A Pharisee named Nicodemus"],"a":2,"w":"Philip met and baptised an Ethiopian eunuch on the desert road."},{"q":"What happened to Saul on the road to Damascus?","o":["He was baptised by John the Baptist","He was ambushed by robbers","He met with the Sanhedrin","He encountered the risen Jesus and was struck blind"],"a":3,"w":"Saul encountered the risen Jesus and was struck blind on the road to Damascus."},{"q":"Whose household did Peter visit, leading to the Holy Spirit falling on Gentiles?","o":["Cornelius's household","Ananias's household","Stephen's household","Philip's household"],"a":0,"w":"Peter visited Cornelius's household, where the Holy Spirit fell on the Gentiles present."},{"q":"Who proposed the resolution at the Jerusalem Council?","o":["Peter","James","Paul","Stephen"],"a":1,"w":"James proposed the resolution at the Jerusalem Council."},{"q":"What did the Jerusalem Council decide Gentile converts did NOT need to do?","o":["Abstain from food sacrificed to idols","Believe in Jesus","Be circumcised","Show love to one another"],"a":2,"w":"The Jerusalem Council decided Gentile converts did not need to be circumcised."},{"q":"What overall theme unites the events studied in this topic?","o":["A Church with no relationship to the Holy Spirit","A Church that never grew or faced any challenges","A Church confined only to Jerusalem forever","The Church's Spirit-empowered birth, growth and expansion despite challenges"],"a":3,"w":"The unifying theme is the Church's Spirit-empowered birth, growth and expansion despite real challenges."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
