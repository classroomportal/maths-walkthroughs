function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Forgiveness in the Gospels — Summary',ACC,13,'middle',true));
[['Jesus forgives sins','Mark 2:1-12 — divine authority; scribes accused blasphemy'],['Lord\'s Prayer condition','Matt 6:14-15 — if you do not forgive others, God will not forgive you'],['Unlimited forgiveness','Matt 18:22 — 70x7; Unforgiving Servant parable follows'],['Prodigal Son','Luke 15 — God runs, embraces, feasts; proactive costly love'],['Cross forgiveness','Luke 23:34 — Father, forgive them; ultimate costly forgiveness'],['WAEC tip','Know conditions (6:14-15), unlimited (18:22), examples, and the cross']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(130,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 Gospels',ti:'God\'s Forgiveness',su:'Examine the nature and dimensions of God\'s forgiveness in the Gospels.',steps:[
{lb:'Jesus claims authority to forgive sins',dr:dQ2,ht:'<p>When four friends lowered a paralysed man through the roof (Mark 2:1-12), Jesus said: <em>"Son, your sins are forgiven."</em> Scribes thought: "Who can forgive sins but God alone?" Jesus responded: "Which is easier: to say \'Your sins are forgiven,\' or to say \'Get up and walk\'? But I want you to know that the Son of Man has authority on earth to forgive sins." He then healed the man. Significance: (1) Jesus claimed divine authority to forgive sins — the scribes were right that only God could forgive. (2) The healing authenticated the forgiveness — the visible miracle proved the invisible authority. (3) The title "Son of Man" is used for divine authority, not mere humanity. This is the clearest claim to divine forgiveness-authority in the Synoptic Gospels.</p>'},
{lb:'The Prodigal Son — God\'s proactive forgiveness (Luke 15:11-32)',dr:dQ1,ht:'<p>The Prodigal Son is the supreme Gospel portrait of God\'s forgiveness. The father\'s response when his son returned: <em>"While he was still a long way off, his father saw him and was filled with compassion for him; he ran to his son, threw his arms around him and kissed him."</em> (Luke 15:20). The father then called for the robe, ring, sandals and a feast. Dimensions of God\'s forgiveness shown: (1) <b>Proactive</b> — the father watched and ran; he did not wait to be asked. (2) <b>Compassionate</b> — "filled with compassion" — emotional as well as judicial. (3) <b>Restorative</b> — robe (sonship), ring (authority), sandals (not a slave), feast (full family membership). (4) <b>Costly</b> — the robe, ring, feast cost the father; forgiveness is never cheap. (5) <b>Complete</b> — "was dead and is alive again; was lost and is found."</p>'},
{lb:'The Woman who anointed Jesus (Luke 7:36-50)',dr:dQ2,ht:'<p>A sinful woman came to a Pharisee\'s house where Jesus was eating. She wept at his feet, wiped them with her hair, kissed them and anointed them with expensive perfume. Jesus told the Pharisee Simon the parable of two debtors — one forgiven 500 denarii, one 50. Jesus asked: "Which will love more?" Simon: "The one forgiven more." Jesus affirmed this, then said of the woman: <em>"her many sins have been forgiven — as her great love has shown."</em> And to her: <em>"Your sins are forgiven... Your faith has saved you; go in peace."</em> (Luke 7:47-50). Teaching: (1) Forgiveness received produces love expressed. (2) Great awareness of sin + great experience of forgiveness = extravagant love. (3) The Pharisee showed little love because he felt he needed little forgiveness — a dangerous spiritual position.</p>'},
{lb:'Forgiveness at the cross',dr:dQ2,ht:'<p>At the crucifixion, Jesus prayed: <em>"Father, forgive them, for they do not know what they are doing."</em> (Luke 23:34). This prayer is the climax of Gospel teaching on forgiveness: (1) <b>Ultimate test</b> — forgiving those actively killing him, at the moment of maximum agony. (2) <b>Intercessory</b> — Jesus prayed for others\' forgiveness at the point of his own greatest suffering. (3) <b>Unconditional plea</b> — "they do not know what they are doing" — offering them the excuse of ignorance, not demanding acknowledgment of guilt first. (4) <b>Costly</b> — the cross is the price of forgiveness; Jesus bore the cost that makes forgiveness possible. (5) <b>Universal scope</b> — "them" includes soldiers, Pharisees, crowds, disciples who fled — potentially all humanity.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'When Jesus said to the paralysed man "Your sins are forgiven" (Mark 2:5), the scribes objected because:',o:['They believed the man had not truly repented of his sins before coming to Jesus','They thought Jesus should heal the physical condition before addressing spiritual matters','Only God can forgive sins — Jesus was claiming divine authority, which they called blasphemy','They did not believe in the forgiveness of sins at all in Jewish theology'],a:3,w:'Mark 2:7 — "Why does this fellow talk like that? He is blaspheming! Who can forgive sins but God alone?" The scribes correctly identified that Jesus was claiming divine prerogative. The controversy is whether this claim was blasphemy (as they thought) or truth (as Jesus demonstrated by healing the man). The healing proved his authority to forgive.'},{q:'In the Prodigal Son (Luke 15:20), the father ran to meet his son "while he was still a long way off." This detail teaches:',o:['The father had been waiting impatiently and was irritated by the son\'s slow return','Running was the normal way elderly men greeted returning family members in first-century Galilee','God\'s forgiveness is proactive — he watches for the returning sinner and moves toward them before they have fully arrived; forgiveness is not reluctantly given but joyfully extended','The son had sent a message ahead so the father knew exactly when he would arrive and prepared accordingly'],a:3,w:'Running was undignified for a Middle Eastern patriarch — it exposed his legs and was socially inappropriate. Yet the father ran. This dramatic detail shows God\'s forgiveness is not reluctant or grudging but proactive, undignified-in-his-eagerness, watching and running toward the returning sinner. He does not wait for full explanation or proof of repentance first — the return itself is enough to trigger the welcome.'},{q:'In Luke 7:47, Jesus said of the sinful woman: "her many sins have been forgiven — as her great love has shown." This teaches:',o:['Love earns forgiveness — she was forgiven because she showed love first','Great love is evidence of great forgiveness received — those who experience deep forgiveness respond with extravagant love; those who feel little need of forgiveness show little love','This woman was an exception and her experience cannot be generalised','Jesus forgave her because she performed the physical act of anointing his feet'],a:2,w:'The parable of the two debtors (Luke 7:41-43) clarifies the logic: the one forgiven more loves more. The woman\'s extravagant love (tears, hair, kisses, expensive perfume) was the EVIDENCE of forgiveness already received, not the cause of it. "Her sins are forgiven — AS HER GREAT LOVE HAS SHOWN" — the love reveals the forgiveness. This contrasts with Simon the Pharisee who showed little love because he felt little need of forgiveness.'},{q:'Jesus\'s prayer "Father, forgive them, for they do not know what they are doing" (Luke 23:34) models forgiveness because:',o:['Jesus forgave only after his resurrection, when he had fully recovered from the suffering of the cross','It was spoken at the moment of maximum pain — forgiving those actively killing him — showing forgiveness at its most costly and unconditional','Jesus only meant to forgive the Roman soldiers, not the Jewish leaders who had arranged the crucifixion','This prayer was answered immediately and all those present at the crucifixion were automatically saved'],a:2,w:'The cross prayer is the supreme model of forgiveness: spoken at the moment of maximum agony; addressed to those actively inflicting that agony; offering the excuse of ignorance rather than demanding acknowledgment of guilt. This is forgiveness at its most costly — it cost Jesus his life. And it became the template for Christian forgiveness: Stephen prayed the same prayer as he was stoned to death (Acts 7:60).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Gospels',ti:'Conditions for Forgiveness',su:'Examine what the Gospels say is required to receive and give forgiveness.',steps:[
{lb:'The Lord\'s Prayer condition (Matt 6:12,14-15)',dr:dQ1,ht:'<p>The Lord\'s Prayer includes: <em>"Forgive us our debts, as we also have forgiven our debtors."</em> (Matt.6:12). Jesus then uniquely emphasised this petition: <em>"For if you forgive other people when they sin against you, your heavenly Father will also forgive you. But if you do not forgive others their sins, your Father will not forgive your sins."</em> (Matt.6:14-15). This is the most demanding clause in the Lord\'s Prayer — it is the only petition with a human condition attached. The principle: (1) Receiving God\'s forgiveness and refusing to extend forgiveness to others is a fundamental contradiction. (2) Those who truly understand how much they have been forgiven find it possible — though often difficult — to forgive others. (3) Unforgiveness is not a minor failing but a serious spiritual blockage.</p>'},
{lb:'Unlimited forgiveness (Matt 18:21-22)',dr:dQ2,ht:'<p>Peter asked: <em>"Lord, how many times shall I forgive my brother or sister who sins against me? Up to seven times?"</em> Peter thought he was being generous — rabbis generally taught three times. Jesus replied: <em>"I tell you, not seven times, but seventy-seven times"</em> (or "seventy times seven" — 490 times). This was not a new maximum count but a declaration that <b>the question of "how many times?" is the wrong question</b>. Kingdom forgiveness has no limit and does not count. The Parable of the Unforgiving Servant (18:23-35) follows immediately to explain why: the debt forgiven by God is so incomprehensibly large that no human debt could exhaust our capacity to forgive in response.</p>'},
{lb:'The Unforgiving Servant (Matt 18:23-35)',dr:dQ2,ht:'<p>A king forgave a servant a debt of <b>10,000 talents</b> (an astronomical sum — more than the entire annual revenue of the region). That servant immediately demanded repayment from a fellow servant of <b>100 denarii</b> (about four months\' wages) and had him thrown in prison when he could not pay. The king heard, was furious, and handed the first servant over to jailers until he could pay the entire debt back. Jesus concluded: <em>"This is how my heavenly Father will treat each of you unless you forgive your brother or sister from your heart."</em> (18:35). The contrast: 10,000 talents vs 100 denarii; divine forgiveness vs human refusal to forgive. Those who truly understand what God has forgiven them cannot withhold forgiveness from others.</p>'},
{lb:'Forgiveness and repentance',dr:dQ2,ht:'<p>The Gospels also link forgiveness to repentance: (1) Jesus told his disciples: <em>"If your brother or sister sins against you, rebuke them; and if they repent, forgive them. Even if they sin against you seven times in a day and seven times come back to you saying \'I repent,\' you must forgive them."</em> (Luke 17:3-4). (2) The Prodigal Son "came to his senses" (Luke 15:17) and prepared a speech of repentance — repentance was the turning point. (3) John\'s baptism was "a baptism of repentance for the forgiveness of sins" (Mark 1:4). However, the father in the Prodigal Son ran to meet the son before he had finished his confession — God\'s grace meets us even in the process of repentance, not only at its completion.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Jesus said "if you do not forgive others their sins, your Father will not forgive your sins" (Matt 6:15). This teaches:',o:['Forgiving others earns salvation as a work of merit before God','Refusing to forgive others reveals a fundamental misunderstanding of God\'s forgiveness — those who truly grasp the enormity of what God has forgiven them cannot withhold forgiveness from others; unforgiveness is a serious spiritual barrier','This only applies to minor everyday offences, not to serious sins like murder or abuse','Jesus was speaking only to the twelve apostles, not to all Christians generally'],a:2,w:'Matthew 6:14-15 is the most demanding clause in the Lord\'s Prayer — the only petition with a human condition attached. The logic: you cannot genuinely receive God\'s forgiveness (understanding its enormity) while refusing to extend it to others. Unforgiveness reveals that you have not truly grasped what you yourself have been forgiven. This is not earning forgiveness but the fruit of genuinely receiving it.'},{q:'Peter thought he was being generous offering to forgive "up to seven times" (Matt 18:21). Jesus replied "not seven times but 70x7" meaning:',o:['Christians must literally count to 490 and then are released from the obligation to forgive','The question "how many times?" is the wrong question — Kingdom forgiveness does not count and has no limit','Jesus was correcting rabbinic teaching by raising the limit from three times to 490 times','This teaching only applies to forgiveness between close family members, not to strangers or enemies'],a:2,w:'Jesus\' "70x7" (or 77 times) was not a new, higher limit to count toward — it was a declaration that the question of "how many times?" is the wrong question entirely. Kingdom forgiveness is not a rationed resource that runs out. The Unforgiving Servant parable immediately follows (18:23-35) to explain why: God\'s forgiveness is so vast that no human debt could exhaust our capacity to respond in forgiveness.'},{q:'The debt contrast in the Unforgiving Servant parable — 10,000 talents vs 100 denarii — was deliberately extreme because:',o:['Jesus wanted to show that all debts between people are too small to worry about and should simply be dismissed','The large number (10,000) was the largest possible number in Greek and "talents" the largest denomination — making the contrast between God\'s forgiveness and any human debt we could refuse to give literally incomprehensible','Jewish audiences would have recognised 10,000 talents as the exact amount owed by the Roman Empire to the Temple','The parable was specifically about the Temple tax controversy and not about interpersonal forgiveness'],a:2,w:'10,000 talents was a deliberate hyperbole: 10,000 was the largest number in the Greek numerical system; a talent was the largest monetary unit. Together, 10,000 talents represented an incalculably vast sum — more than the total annual tax revenue of the region. The contrast with 100 denarii (about four months\' wages) was to make the absurdity of the servant\'s refusal graphically obvious: he had been forgiven the incalculable; he refused to forgive the manageable.'},{q:'Luke 17:3-4 — "if they repent, forgive them. Even if they sin against you seven times in a day and seven times come back saying \'I repent,\' you must forgive them" — is significant because:',o:['It proves that forgiveness without repentance is always wrong','It sets a maximum of seven times before which unforgiveness becomes legitimate','It shows that forgiveness is connected to repentance but that genuine repentance, however many times repeated in a day, always requires a fresh response of forgiveness — the repetition of repentance does not exhaust the obligation to forgive','It overrides Jesus\'s teaching on 70x7 in Matthew 18 and shows that a maximum does exist'],a:3,w:'Luke 17:3-4 connects forgiveness to repentance AND demands forgiveness even for repeated same-day offences if repentance is genuine each time. This is remarkably demanding: "seven times in a day" — the disciples responded "increase our faith!" (17:5) — understanding it was beyond natural human capacity. It shows that forgiveness is both linked to repentance and unlimited in its frequency requirement.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Gospels',ti:'Forgiveness and Relationships',su:'Examine how forgiveness shapes relationships between people.',steps:[
{lb:'Forgiveness and reconciliation',dr:dQ2,ht:'<p>Jesus connected forgiveness to active reconciliation: (1) <em>"If you are offering your gift at the altar and there remember that your brother or sister has something against you, leave your gift there in front of the altar. First go and be reconciled to them; then come and offer your gift."</em> (Matt.5:23-24). (2) This teaching makes reconciliation a <b>prerequisite for worship</b> — broken relationships obstruct prayer and offering. (3) The word translated "reconciled" (Greek: <em>diallasso</em>) means restored to fellowship, not just verbal apology. (4) Jesus puts the initiative on the offender — even if someone else has something against you, you are to go and seek reconciliation. Forgiveness is not just an inner attitude; it leads to active relational repair.</p>'},
{lb:'Forgiveness and the community of disciples',dr:dQ2,ht:'<p>In Matthew 18, Jesus gave a community process for handling offences: (1) Go to the person privately (18:15). (2) If they do not listen, take two or three witnesses (18:16 — Deut.19:15). (3) If they still refuse, bring it to the church (18:17). (4) If they refuse to listen to the church, treat them as a Gentile or tax collector (18:17 — not vengeful exclusion but a changed relationship). Then Peter asked about forgiving seven times (18:21) — and Jesus replied 70x7. The community process is not an alternative to forgiveness but the responsible structure within which forgiveness is sought. The goal throughout is restoration, not punishment.</p>'},
{lb:'Forgiveness and enemies',dr:dQ2,ht:'<p>Jesus extended forgiveness to include enemies: <em>"Love your enemies and pray for those who persecute you, that you may be children of your Father in heaven."</em> (Matt.5:44-45). This radicalises forgiveness: (1) It is not only for community members but for <b>those who actively harm you</b>. (2) Prayer for persecutors means actively seeking their good before God — the internal disposition of forgiveness expressed outwardly. (3) The model is God himself who "causes his sun to rise on the evil and the good, and sends rain on the righteous and the unrighteous" (5:45) — indiscriminate generosity. (4) The cross prayer "Father, forgive them" (Luke 23:34) is Jesus modelling this teaching in the extreme case — forgiving while being killed by enemies.</p>'},
{lb:'Forgiving as God forgives',dr:dQ1,ht:'<p>The standard for human forgiveness in the Gospels is God\'s own forgiveness — not a reasonable human standard: (1) The Lord\'s Prayer: "forgive us our debts <b>as</b> we have forgiven our debtors" — our forgiveness of others mirrors and is connected to God\'s forgiveness of us. (2) The Unforgiving Servant: the king forgave because he had compassion (18:27) — the standard is compassion, not just transaction. (3) The Prodigal Son: the father did not say "I told you so"; did not require humiliation or probation; did not dock the inheritance. (4) The cross: forgiveness even of those who are not asking for it, who do not understand what they are doing. This is grace — forgiveness that exceeds what is deserved or requested.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Jesus said to leave your offering at the altar and first be reconciled (Matt 5:23-24). The teaching is addressed to:',o:['Only the offended party — the one sinned against should go to the offender and demand an apology','The offender — even if you are the one who has wronged someone else, you should take the initiative to seek reconciliation before worship','Only the priests who offered sacrifices in the Jerusalem Temple','Both parties equally — they should meet in the middle'],a:2,w:'Matthew 5:23-24 is addressed to the one bringing the offering who "remembers that your brother has something against you" — i.e., you are the one who has done something wrong. Jesus places the initiative on the offender: do not wait for the offended party to come to you; take the initiative, go, be reconciled. This is why forgiveness leads to active reconciliation, not just inner attitude.'},{q:'The Matthew 18 community process (go privately → take witnesses → bring to church) for handling offences has what ultimate goal?',o:['Exposing and publicly shaming the person who sinned so they will not repeat it','Legal documentation of the offence for future reference if needed','Excommunicating sinners to keep the community morally pure','Restoration — bringing the offending person back into right relationship with the community; the goal throughout is reconciliation, not punishment'],a:4,w:'Matthew 18:15 — "If your brother or sister sins against you, go and point out their fault, just between the two of you. If they listen to you, you have won them over." The word translated "won them over" is the key: the goal is to WIN the person, restore the relationship. Even the final step ("treat them as a Gentile or tax collector") is not vindictive exclusion but changed relationship — and Jesus himself ate with tax collectors and Gentiles.'},{q:'Jesus\' command to "love your enemies and pray for those who persecute you" (Matt 5:44) goes beyond forgiveness because:',o:['Forgiveness is passive (not seeking revenge) while enemy love is active (actively seeking their good through prayer and practical love)','Enemy love was a new invention of Jesus with no connection to OT teaching','This only applies to personal enemies, not to national or political enemies','Jesus was speaking metaphorically about commercial rivals, not literal enemies'],a:1,w:'Forgiveness can be primarily internal (releasing the debt, not seeking revenge). Enemy love is active: praying for persecutors means actively seeking their good before God; showing kindness means positive action toward them. This goes beyond not retaliating (forgiveness) to actively willing and working for the good of those who harm you. The cross is the supreme example: Jesus did not just passively refrain from revenge; he actively interceded for his killers.'},{q:'The Parable of the Unforgiving Servant ends with the wicked servant "handed over to the jailers until he could pay back all he owed" (Matt 18:34). Jesus applied this to:',o:['The Roman government\'s treatment of tax evaders in Judea','How God will treat those who refuse to forgive others from the heart — the most sobering warning about unforgiveness in the Gospels','Jewish debt law in the first century, which Jesus was explaining to his disciples','A prophecy about the fall of Jerusalem in 70 CE'],a:2,w:'Matthew 18:35 — "This is how my heavenly Father will treat each of you unless you forgive your brother or sister from your heart." The parable closes with the most sobering warning about unforgiveness in any Gospel: God\'s treatment of the unforgiving mirrors the king\'s treatment of the unforgiving servant. The phrase "from your heart" is crucial — not mechanical verbal forgiveness but genuine inner release.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Gospels',ti:'Forgiveness and Salvation',su:'Examine the connection between forgiveness and salvation in the Gospels.',steps:[
{lb:'Forgiveness as salvation',dr:dQ1,ht:'<p>In the Gospels, forgiveness is not merely a relational transaction but the heart of salvation. Key connections: (1) Jesus\'s name: <em>"you are to give him the name Jesus, because he will save his people from their sins"</em> (Matt.1:21) — salvation is defined as deliverance from sin, which includes forgiveness. (2) The Last Supper: <em>"This is my blood of the covenant, which is poured out for many for the forgiveness of sins"</em> (Matt.26:28) — the cross is directly connected to forgiveness. (3) The resurrection commission: the risen Jesus told the disciples: "repentance for the forgiveness of sins will be preached in his name to all nations" (Luke 24:47) — forgiveness is the content of the Gospel proclamation.</p>'},
{lb:'Forgiveness at the Last Supper (Matt 26:28)',dr:dQ2,ht:'<p>At the Last Supper, Jesus took the cup and said: <em>"This is my blood of the covenant, which is poured out for many for the forgiveness of sins."</em> (Matt.26:28). This is the only time Matthew explicitly connects the cross to forgiveness of sins. Key dimensions: (1) <b>Covenant</b> — forgiveness is the basis of the new covenant relationship with God (echoing Jer.31:34: "I will forgive their wickedness and remember their sins no more"). (2) <b>Sacrifice</b> — blood poured out; forgiveness requires sacrifice. (3) <b>Many</b> — the scope is wide, not restricted to the twelve present. (4) <b>Future-oriented</b> — "for the forgiveness of sins" — this is what the death achieves. The Eucharist/Communion remembers and proclaims this sacrificial basis for forgiveness.</p>'},
{lb:'Zacchaeus and the tax collector',dr:dQ2,ht:'<p>Two examples show forgiveness leading to transformation: (1) <b>Zacchaeus</b> (Luke 19:1-10): Jesus invited himself to Zacchaeus\'s house. Zacchaeus declared he would give half his possessions to the poor and repay those he had cheated fourfold. Jesus said: "Today salvation has come to this house." Forgiveness/acceptance → generosity → justice. (2) <b>The tax collector in the temple</b> (Luke 18:9-14): "God, have mercy on me, a sinner." Jesus said he went home "justified rather than the other" (the Pharisee who congratulated himself). The tax collector\'s honest acknowledgment of sin and cry for mercy is the posture that receives forgiveness — not self-righteousness. Zacchaeus and the tax collector model how forgiveness is received: in humility, with acknowledgment of sin, and transforming consequences.</p>'},
{lb:'The woman caught in adultery (John 8:1-11)',dr:dQ2,ht:'<p>Pharisees brought a woman caught in adultery to Jesus (the Law demanded stoning). Jesus wrote in the ground, then said: <em>"Let any one of you who is without sin be the first to throw a stone at her."</em> (John 8:7). They all left. Jesus asked the woman: "Has no one condemned you?" She answered no. Jesus said: <em>"Then neither do I condemn you. Go now and leave your life of sin."</em> (John 8:11). Significance: (1) Jesus refused to condemn — not because sin was unimportant but because his mission was forgiveness, not judgment. (2) Forgiveness came with a call to repentance: "Go and leave your life of sin" — forgiveness does not ignore sin but provides a new beginning. (3) Jesus exposed the accusers\' hypocrisy — no one is qualified to stone the sinner. (4) Mercy triumphed over the Law\'s letter while not dismissing the Law\'s moral seriousness.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'At the Last Supper, Jesus said his blood was poured out "for the forgiveness of sins" (Matt 26:28). This connects the cross to:',o:['Only the sins committed by the twelve disciples present at the Last Supper','Forgiveness as the primary achievement of Jesus\' death — the new covenant is based on the sacrificial forgiveness of sins, fulfilling Jeremiah 31:34 which promised God would forgive and remember sins no more','Jesus\' baptism, which had already accomplished forgiveness before the cross was necessary','A symbolic meal with no actual connection to the cross\'s redemptive significance'],a:2,w:'Matthew 26:28 — "my blood of the covenant, poured out for many for the forgiveness of sins." This is the theological heart of the Last Supper: the cross achieves forgiveness; the new covenant (Jer.31:31-34) is based on forgiveness; the scope is "many" (not just the twelve). The Eucharist/Communion continues to proclaim this — "as often as you eat this bread and drink the cup, you proclaim the Lord\'s death" (1 Cor.11:26).'},{q:'Jesus said to the woman caught in adultery "neither do I condemn you. Go now and leave your life of sin" (John 8:11). This shows that forgiveness in the Gospels:',o:['Ignores the moral seriousness of sin — Jesus was indifferent to whether she sinned again','Is unconditional and requires no change of behaviour after it is received','Does not condemn but also calls to repentance — it provides a new beginning, not a licence to continue sinning; mercy and moral seriousness are both present','Overrides the Mosaic Law entirely — Jesus declared the Ten Commandments invalid'],a:3,w:'"Neither do I condemn you" = mercy, not judgment. "Go now and leave your life of sin" = call to repentance and new life. Both are present: forgiveness without judgment AND a call to leave the sin. This is the Gospel pattern: forgiveness is not cheap (it does not ignore sin) nor is it conditional (it is given first, then the call to repentance follows). Mercy and moral seriousness coexist.'},{q:'Zacchaeus\'s declaration "I give half my possessions to the poor and pay back four times the amount I have cheated" (Luke 19:8) was significant as:',o:['A legal requirement Jesus imposed on all tax collectors before they could be forgiven','The condition Jesus set before he would visit Zacchaeus\'s house','The spontaneous, concrete fruit of the salvation/acceptance that came to his house — forgiveness received produced generous restitution; genuine forgiveness transforms behaviour','A clever strategy by Zacchaeus to impress Jesus and the crowd'],a:3,w:'Jesus visited Zacchaeus BEFORE Zacchaeus made any declaration. The sequence: Jesus sought him (climbed tree; Jesus looked up); Jesus invited himself to Zacchaeus\'s house; acceptance/salvation came. THEN Zacchaeus declared his restitution. The restitution was the FRUIT of salvation received, not the price paid for it. "Today salvation has come to this house" (Luke 19:9) — the salvation preceded the declaration of restitution.'},{q:'The parable of the tax collector in the temple (Luke 18:9-14) teaches which condition for receiving forgiveness?',o:['Performing religious rituals correctly — the tax collector prayed in the right place','Financial generosity — the tax collector later gave money to the temple','Honest acknowledgment of sin and humble cry for mercy — "God, have mercy on me, a sinner" — this posture, not self-righteous pride, is what receives justification before God','Long years of religious service — the Pharisee was eventually also justified after the tax collector'],a:3,w:'"God, have mercy on me, a sinner" (Luke 18:13) — the tax collector\'s prayer is the model of forgiveness-receiving posture: honest acknowledgment of sin (no self-justification); humility (would not look up to heaven, beat his breast); complete dependence on God\'s mercy. "This man, rather than the other, went home justified" (18:14). Self-righteous pride — congratulating yourself for not being like sinners — blocks forgiveness. Humble honesty receives it.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Gospels',ti:'WAEC Prep — Forgiveness',su:'Practise WAEC-style questions on forgiveness in the Gospels.',steps:[
{lb:'WAEC essay approach',dr:dQ1,ht:'<p>For WAEC essays on forgiveness: Common questions: "What does the New Testament teach about forgiveness?" "Describe the Parable of the Unforgiving Servant and state its lessons." "Examine Jesus\' teaching on forgiveness in the Lord\'s Prayer." "Describe THREE examples of forgiveness in the Gospels." "What does Jesus teach about forgiving others?" For each example: (1) Name and reference. (2) Brief situation. (3) The specific teaching about forgiveness. (4) One lesson for Christians. Key passages to know: Lord\'s Prayer (Matt.6:12,14-15); 70x7 (Matt.18:22); Unforgiving Servant (Matt.18:23-35); Prodigal Son (Luke 15:11-32); Woman who anointed Jesus (Luke 7:36-50); Cross prayer (Luke 23:34); Paralysed man (Mark 2:1-12); Woman in adultery (John 8:1-11).</p>'},
{lb:'Key references',dr:dQ2,ht:'<p>Essential forgiveness references: "Forgive us our debts as we have forgiven our debtors" — Matt.6:12. "If you do not forgive others... your Father will not forgive your sins" — Matt.6:15. "Not seven times but 77 times" — Matt.18:22. "Unless you forgive your brother or sister from your heart" — Matt.18:35. "Her many sins have been forgiven — as her great love has shown" — Luke 7:47. "Today salvation has come to this house" — Luke 19:9 (Zacchaeus). "Father, forgive them, for they do not know what they are doing" — Luke 23:34. "My blood of the covenant, poured out for many for the forgiveness of sins" — Matt.26:28. "Neither do I condemn you. Go now and leave your life of sin" — John 8:11. "Son, your sins are forgiven" — Mark 2:5. Know all these with references.</p>'},
{lb:'Common mistakes',dr:dQ2,ht:'<p>Avoid: Confusing the Prodigal Son (Luke 15 — about God\'s forgiveness of returning sinners) with the Unforgiving Servant (Matt.18 — about our obligation to forgive others). Saying the Lord\'s Prayer condition means Christians earn salvation by forgiving others (we do not earn salvation; but genuinely receiving God\'s forgiveness produces a forgiving heart). Saying "Father, forgive them" (Luke 23:34) means everyone at the crucifixion was automatically saved (it was an intercessory prayer, not an automatic declaration). Forgetting to give the reference when describing the Unforgiving Servant — it is Matthew 18:23-35, not Luke 15. Saying the woman caught in adultery is in the Synoptic Gospels — it is only in John 8:1-11.</p>'},
{lb:'WAEC final tips — forgiveness',dr:dQ1,ht:'<p>WAEC final tips: (1) Define forgiveness — releasing a debt owed; not seeking revenge; restoring relationship. (2) Know the Lord\'s Prayer condition (Matt.6:12-15) — the only petition with a human condition attached. (3) Know 70x7 (Matt.18:22) — forgiveness has no limit, no counting. (4) Know the Unforgiving Servant narrative — the debt contrast (10,000 talents vs 100 denarii) and the conclusion (Matt.18:35). (5) Know the Prodigal Son — God\'s proactive, costly, restorative forgiveness. (6) Know Luke 23:34 — the cross prayer — as the supreme model of costly forgiveness. (7) Know that forgiveness calls for repentance AND does not require it before being offered (cross prayer offered without acknowledgment from the crucifiers). (8) Always give specific references — WAEC rewards chapter and verse.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The Parable of the Unforgiving Servant (Matt 18:23-35) is placed immediately after Jesus\' "70x7" teaching because:',o:['Matthew\'s Gospel groups similar topics together regardless of chronological sequence','The parable explains WHY unlimited forgiveness is required: the debt God forgives us is so astronomically large that no human debt we must forgive could exhaust our capacity to forgive in return','Peter asked Jesus to explain the meaning of 77 times and the parable was Jesus\'s answer','The parable was actually taught on a different occasion and Matthew placed it here by mistake'],a:2,w:'The connection is deliberate: Peter asks about 7 times (18:21); Jesus says 77 times (18:22); then the parable (18:23-35) explains the REASON — God forgave us 10,000 talents (the incalculable); any human debt (100 denarii) is negligible by comparison. The reason unlimited forgiveness is possible and required is the overwhelming magnitude of what God has forgiven us. Understanding God\'s forgiveness is the foundation of giving forgiveness.'},{q:'The cross prayer "Father, forgive them, for they do not know what they are doing" (Luke 23:34) is significant for Christian ethics because:',o:['It proves that people who act in ignorance are never morally responsible for their actions','It teaches that forgiveness should be withheld until the offender acknowledges their wrong','It models forgiveness at its most costly and unconditional — extended at the moment of maximum suffering, to those actively causing the suffering, without requiring acknowledgment first; this became the template for Christian martyrdom (Stephen — Acts 7:60)','It shows that Jesus forgave the sins of all people universally through this one prayer'],a:3,w:'Luke 23:34 became the template for Christian forgiveness under persecution: Stephen prayed "Lord, do not hold this sin against them" while being stoned (Acts 7:60). The cross prayer models: (1) Forgiveness extended first, before acknowledgment. (2) Offered at the moment of maximum pain. (3) The excuse of ignorance offered rather than demanded guilt. This is the most costly forgiveness imaginable — and the standard Jesus set for his followers.'},{q:'The condition "as we have forgiven our debtors" in the Lord\'s Prayer (Matt 6:12) means:',o:['We earn God\'s forgiveness by forgiving others first — forgiving is a work that merits salvation','Forgiving others is optional — it is good to do but not linked to our own experience of God\'s forgiveness','Our experience of God\'s forgiveness and our giving of forgiveness to others are inseparably linked — those who truly grasp the enormity of what God forgave them cannot withhold forgiveness from others; the two flow together','We must forgive 100% of all debts owed to us, financial as well as relational, before God will hear any prayer'],a:3,w:'The Lord\'s Prayer condition is not about earning salvation (which is by grace) but about the inseparable connection between receiving and giving forgiveness. If you genuinely understand and receive the vast forgiveness of God (10,000 talents), you cannot refuse to forgive the smaller debts of others (100 denarii). The Unforgiving Servant shows what the failure to make this connection looks like — and its consequences (Matt.18:34-35).'},{q:'In the story of the Prodigal Son (Luke 15:20-24), what specifically made the father\'s forgiveness "costly"?',o:['The father had to take out a loan to pay for the feast','The father had to forgive a financial debt as well as the relational betrayal','The father bore the pain of watching for his son, running undignifiedly, restoring him without demanding humiliation or probation, and funding the feast — forgiveness always costs the one who forgives something','The cost referred to the price of the fatted calf, which was the most expensive animal the father owned'],a:3,w:'The father\'s costly forgiveness: (1) The original division of the inheritance caused financial loss (the younger son had already taken his share). (2) The father bore the grief of his son\'s absence. (3) He ran — undignified for a patriarch — absorbing social shame. (4) He restored without demanding proof or probation — absorbing the risk of recurrence. (5) He funded the feast — financial generosity. Forgiveness always costs the one who gives it. This is why the cross is required — God\'s forgiveness cost him the death of his Son.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Forgiveness (1)',su:'Integrated revision across all forgiveness topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Forgiveness in the Gospels summary: God\'s forgiveness — Jesus claims divine authority (Mark 2:1-12); Prodigal Son (Luke 15 — proactive, costly, restorative); Woman who anointed Jesus (Luke 7:36-50 — forgiven much, loved much). Conditions — Lord\'s Prayer (Matt.6:12,14-15 — forgive as we have been forgiven; if you do not forgive, God will not forgive you). Unlimited — Matt.18:22 (70x7); Unforgiving Servant (Matt.18:23-35 — 10,000 talents vs 100 denarii). Cross — Luke 23:34 (Father, forgive them). Forgiveness and salvation — Matt.26:28 (blood poured out for forgiveness of sins); Zacchaeus (Luke 19 — salvation transforms); tax collector (Luke 18:9-14 — humble cry receives justification); woman in adultery (John 8 — no condemnation; go and sin no more). Reconciliation — Matt.5:23-24 (leave gift; be reconciled first).</p>'},
{lb:'Key connections',dr:dQ10,ht:'<p>Key thematic connections: Forgiveness ↔ Faith — faith receives forgiveness: "Your faith has saved you" (Luke 7:50 — woman who anointed Jesus). Forgiveness ↔ Kingdom — the Unforgiving Servant shows unforgiveness is incompatible with Kingdom membership. Forgiveness ↔ the Cross — "blood poured out for forgiveness of sins" (Matt.26:28). Forgiveness ↔ Prayer — "forgive us as we forgive" is in the Lord\'s Prayer; reconciliation precedes worship (Matt.5:23-24). Forgiveness ↔ Repentance — Prodigal Son "came to his senses"; tax collector "God, have mercy on me, a sinner." Forgiveness ↔ Love — forgiven much, loved much (Luke 7:47). Forgiveness ↔ Ethics — enemy love as the extension of forgiveness to its furthest reach (Matt.5:44); cross prayer (Luke 23:34) as the supreme ethical model.</p>'},
{lb:'Evaluation practice',dr:dQ1,ht:'<p>Evaluation practice: "Is forgiveness in the Gospels conditional or unconditional?" Both: Unconditional — God\'s forgiveness is proactively offered (Prodigal Son father ran before son had finished confessing); cross prayer offered without acknowledgment from crucifiers; "neither do I condemn you" (John 8:11) given freely. Conditional — "if you do not forgive others, your Father will not forgive you" (Matt.6:15); the son had to return (Luke 15:20 — "he came to his senses... he got up and went back"); the Unforgiving Servant shows unforgiveness has consequences. Resolution: God\'s forgiveness is freely and proactively offered (unconditional in initiative) but must be received through repentance and faith (conditional in reception) and produces forgiveness of others (conditional in its ongoing fruit).</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>WAEC final must-knows for Forgiveness: (1) Matt.6:12,14-15 — Lord\'s Prayer condition. (2) Matt.18:22 — 70x7. (3) Matt.18:23-35 — Unforgiving Servant (10,000 talents vs 100 denarii; Matt.18:35 conclusion). (4) Luke 15:11-32 — Prodigal Son (God\'s proactive, costly forgiveness). (5) Luke 7:36-50 — woman who anointed Jesus (forgiven much = loved much). (6) Luke 23:34 — cross prayer (model of costly forgiveness). (7) Mark 2:1-12 — Jesus claims authority to forgive sins (Son of Man). (8) Matt.26:28 — blood poured out for forgiveness. (9) John 8:1-11 — woman in adultery (no condemnation; go and sin no more — only in John). (10) Matt.5:23-24 — leave gift, be reconciled first. Know all references. Always define forgiveness. Connect forgiveness to love, faith, Kingdom, and the cross.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which of the following CORRECTLY identifies the location (Gospel) of the story of the woman caught in adultery?',o:['Matthew 9 — as part of a series of healing miracles','Mark 7 — during Jesus\' dispute with the Pharisees about cleanliness','Luke 15 — immediately before the Parable of the Prodigal Son','John 8 — where Jesus said "Let any one of you who is without sin be the first to throw a stone at her"'],a:4,w:'The woman caught in adultery (John 8:1-11) is found only in John\'s Gospel. It is absent from Matthew, Mark and Luke. This is a key WAEC fact — examiners may specifically ask which Gospel contains this account. The key verse: "Let any one of you who is without sin be the first to throw a stone at her" (John 8:7) — exposing the accusers\' hypocrisy.'},{q:'The "10,000 talents vs 100 denarii" contrast in the Unforgiving Servant parable was used to show:',o:['Roman taxation rates were unfair compared to Jewish debt law','The incomprehensibility of God\'s forgiveness compared to any human debt we could refuse to forgive — those who grasp what God has forgiven them cannot withhold forgiveness from others','The difference between rich and poor in first-century Palestine and why debt forgiveness was a social justice issue','The correct exchange rate between talents and denarii in the Jerusalem money market'],a:2,w:'10,000 talents (the incalculable — more than the region\'s entire annual tax revenue) vs 100 denarii (about four months\' wages — manageable). The contrast is deliberate and extreme: to make the absurdity of the servant\'s refusal graphically obvious. If you have been forgiven the incalculable, refusing to forgive the manageable is morally monstrous. This is the logic behind Matt.18:35: those who genuinely grasp God\'s forgiveness cannot refuse others\' forgiveness.'},{q:'Luke 7:47 — "her many sins have been forgiven — as her great love has shown" — establishes what relationship between forgiveness and love?',o:['Love earns forgiveness — she was forgiven because she loved much first','Great love is the evidence of great forgiveness already received, not its cause — those aware of receiving much forgiveness respond with much love; those who feel little need of forgiveness show little love','Love and forgiveness are completely unrelated spiritual experiences','This only applies to the specific woman in the story and cannot be generalised'],a:2,w:'The parable of the two debtors (Luke 7:41-43) makes the logic explicit: "which will love more?" — the one forgiven more. The woman\'s extravagant love (tears, hair, kisses, expensive perfume) was not the cause of her forgiveness but its evidence. She already had much forgiveness; her love showed it. Simon the Pharisee showed little love because he felt little need of forgiveness — a spiritually dangerous position.'},{q:'Jesus\'s teaching that "repentance for the forgiveness of sins will be preached in his name to all nations" (Luke 24:47) was given:',o:['Before the Triumphal Entry into Jerusalem as part of his mission briefing','During the Sermon on the Mount as part of Kingdom ethics','After the resurrection — as part of the Great Commission; forgiveness is the content of the Gospel message to all nations','At the Last Supper — immediately after the institution of the Eucharist'],a:3,w:'Luke 24:47 is part of the risen Jesus\' commission to his disciples — "repentance for the forgiveness of sins will be preached in his name to all nations, beginning from Jerusalem." The post-resurrection commission makes forgiveness the content and goal of the church\'s mission: the cross achieved it; the disciples proclaim it; repentance receives it. This connects the whole Gospel narrative from birth to resurrection around the theme of forgiveness.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Forgiveness (2)',su:'Further revision across all forgiveness topics.',steps:[
{lb:'Extended review',dr:dQ2,ht:'<p>Forgiveness in the Gospels — extended review: God\'s forgiveness is: Divine (Mark 2:10 — Jesus claims the authority only God has); Proactive (Luke 15:20 — father ran); Extravagant (robe, ring, sandals, feast — the Prodigal Son); Costly (Luke 23:34 — the cross is the price); Transforming (Luke 7:47 — forgiven much, loved much; Zacchaeus — Luke 19); Universal in scope (all nations — Luke 24:47). Our forgiveness of others must be: Unlimited (Matt.18:22 — 70x7); From the heart (Matt.18:35); Active/reconciling (Matt.5:23-24); Extending to enemies (Matt.5:44); Unconditional in timing (Luke 23:34 — before the crucifiers acknowledged guilt). The two are inseparably linked: "forgive us as we have forgiven" (Matt.6:12).</p>'},
{lb:'Forgiveness in John\'s Gospel',dr:dQ2,ht:'<p>John\'s Gospel treats forgiveness uniquely: (1) <b>Woman in adultery</b> (John 8:1-11) — "neither do I condemn you; go and sin no more." (2) <b>Post-resurrection commission</b> (John 20:22-23): Jesus breathed on the disciples and said "Receive the Holy Spirit. If you forgive anyone\'s sins, their sins are forgiven; if you do not forgive them, they are not forgiven." This gave the disciples authority to declare forgiveness in Jesus\' name. (3) <b>Peter\'s restoration</b> (John 21:15-17): "Feed my sheep" — three commissions after three denials. Jesus restored Peter without condemnation, addressing his specific failure. These Johannine forgiveness texts are distinct from the Synoptics and may be specifically asked about in WAEC.</p>'},
{lb:'Forgiveness and the new covenant',dr:dQ1,ht:'<p>The Last Supper (Matt.26:28) connects forgiveness to the new covenant: "my blood of the covenant, poured out for many for the forgiveness of sins." The background: Jeremiah 31:31-34 promised a new covenant in which God would "forgive their wickedness and remember their sins no more" (Jer.31:34). Jesus at the Last Supper announced that his death fulfilled this promise. Implications: (1) The new covenant is established on forgiveness — not on obedience to law (old covenant) but on the sacrificial gift of forgiveness. (2) The Eucharist/Communion proclaims and participates in this forgiveness every time it is celebrated. (3) The Great Commission (repentance for the forgiveness of sins — Luke 24:47) is the extension of this new covenant to all nations.</p>'},
{lb:'WAEC preparation — model paragraphs',dr:dQ2,ht:'<p>Model essay paragraph on the Prodigal Son: "The Parable of the Prodigal Son (Luke 15:11-32) illustrates God\'s proactive, costly forgiveness. When the younger son returned from wasting his inheritance, \'while he was still a long way off, his father saw him... ran to his son, threw his arms around him and kissed him\' (15:20). The father did not wait to be asked — he ran, embraced, and before the son\'s confession was complete, ordered the robe (sonship), ring (authority) and feast (full family membership). The teaching is that God\'s forgiveness is proactive — he moves toward the returning sinner; extravagant — the robe, ring, feast restore full status; and costly — the father bore the loss, grief and social shame. The lesson for Christians is that God\'s forgiveness is not reluctant or rationed but joyfully, unconditionally extended to all who return to him in repentance."</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Jesus\' post-resurrection commission in John 20:22-23 gave the disciples authority to:',o:['Baptise new believers in the name of the Trinity','Pronounce forgiveness or withholding of forgiveness in Jesus\' name — empowered by the Holy Spirit breathed on them by the risen Jesus','Perform healing miracles using Jesus\' name as a formula','Establish the new covenant by repeating the words of the Last Supper'],a:2,w:'John 20:22-23 — Jesus breathed on the disciples (echoing Gen.2:7 — God breathed life into Adam) and said: "Receive the Holy Spirit. If you forgive anyone\'s sins, their sins are forgiven; if you do not forgive them, they are not forgiven." This gave the disciples — and the church — the Spirit-empowered authority to declare forgiveness (or its absence) in Jesus\' name. This became the basis for the church\'s ministry of reconciliation (2 Cor.5:18-19).'},{q:'Peter\'s restoration in John 21:15-17 ("Do you love me?... Feed my sheep") models forgiveness because:',o:['Jesus demanded an apology from Peter for each of his three denials before restoring him','Jesus required Peter to prove his loyalty through two years of faithful service before accepting him back','Jesus addressed Peter\'s specific failure (three denials) with three commissions — restoring him fully without condemnation, giving him a renewed mission rather than dwelling on his failure','Peter was never actually forgiven — Jesus only reappointed him out of practical necessity because there were so few leaders'],a:3,w:'John 21:15-17 — three "Do you love me?" questions mirrored Peter\'s three denials (John 18:15-27). Jesus addressed the specific failure directly but not to shame or punish — rather to restore: each question led to a commission ("Feed my lambs"; "Take care of my sheep"; "Feed my sheep"). This is restorative forgiveness: confronting the failure honestly, receiving the answer, and commissioning forward — not dwelling in guilt but moving to renewed purpose.'},{q:'Matthew 26:28 — "my blood of the covenant, poured out for many for the forgiveness of sins" — fulfils which Old Testament prophecy?',o:['Isaiah 53:5 — "by his wounds we are healed"','Psalm 22:18 — "they divided my clothes among them and cast lots for my garment"','Jeremiah 31:31-34 — the new covenant in which God promised to forgive wickedness and remember sins no more','Ezekiel 36:26 — "I will give you a new heart and put a new spirit in you"'],a:3,w:'Jeremiah 31:31-34 — the new covenant promise: "I will put my law in their minds and write it on their hearts... I will forgive their wickedness and will remember their sins no more" (31:33-34). Jesus at the Last Supper announced that his death fulfilled this: the blood of the new covenant poured out for the forgiveness of sins. The cross is the historical event that accomplished what Jeremiah promised — the full, final, remembered-no-more forgiveness of sins.'},{q:'Which of the following forgiveness texts is found ONLY in John\'s Gospel and not in the Synoptics?',o:['The parable of the Unforgiving Servant (Matt 18:23-35)','The Lord\'s Prayer condition on forgiveness (Matt 6:12-15)','The woman caught in adultery and Jesus\'s "neither do I condemn you" (John 8:1-11)','The cross prayer "Father, forgive them" (Luke 23:34)'],a:3,w:'The woman caught in adultery (John 8:1-11) is found only in John. It is absent from Matthew, Mark and Luke. The cross prayer (Luke 23:34) is in Luke only. The Unforgiving Servant and Lord\'s Prayer condition are in Matthew. WAEC may ask you to identify which Gospel records a specific account — know that John 8:1-11 (woman in adultery) is uniquely Johannine.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 Gospels',ti:'WAEC Final Prep — Forgiveness',su:'Final WAEC preparation on forgiveness in the Gospels.',steps:[
{lb:'25-mark essay plan — forgiveness',dr:dQ1,ht:'<p>25-mark essay: "Examine Jesus\' teaching on forgiveness as seen in the Gospels." Plan: Intro (define forgiveness; central to Jesus\' ministry; three key dimensions — God\'s forgiveness, our forgiveness of others, and the connection between them). Body points: 1. Jesus claims authority to forgive sins (Mark 2:1-12) — divine authority. 2. God\'s proactive forgiveness — Prodigal Son (Luke 15:11-32). 3. Forgiveness and love — Woman who anointed Jesus (Luke 7:36-50). 4. Lord\'s Prayer condition (Matt.6:12-15) — forgive as we have been forgiven. 5. Unlimited forgiveness — 70x7 and Unforgiving Servant (Matt.18:22-35). 6. Forgiveness at the cross — Luke 23:34. Conclusion: forgiveness is both the gift God gives and the obligation it creates; the cross is both its price and its model.</p>'},
{lb:'Connecting forgiveness across CRS topics',dr:dQ2,ht:'<p>Forgiveness connects to all other CRS Gospel topics: Birth — "you are to give him the name Jesus because he will save his people from their sins" (Matt.1:21) — forgiveness is the purpose of the Incarnation. Baptism — "a baptism of repentance for the forgiveness of sins" (Mark 1:4). Ministry — every healing and tax collector encounter involves forgiveness. Lord\'s Prayer — forgiveness is the only petition with a human condition. Kingdom — unforgiveness is incompatible with Kingdom membership (Matt.18:35). Passion — the cross prayer (Luke 23:34); "blood poured out for the forgiveness of sins" (Matt.26:28). Resurrection — Peter\'s restoration (John 21); commission to preach forgiveness to all nations (Luke 24:47). Forgiveness is not one topic among many — it is the central achievement of Jesus\' mission.</p>'},
{lb:'Key distinctions',dr:dQ1,ht:'<p>Key distinctions for WAEC: Forgiveness vs justification — forgiveness releases the debt; justification declares the person righteous before God (both happen together in the Gospel). Forgiveness vs reconciliation — forgiveness is the decision/release; reconciliation is the restored relationship (requires both parties). Forgiveness vs forgetting — "forgive and forget" is not a Gospel phrase; God "remembers sins no more" (Jer.31:34) is a theological statement about God\'s character, not a psychological technique. Conditional vs unconditional — God\'s forgiveness is proactively offered unconditionally, but received through repentance and faith; our forgiveness of others is required whether the other person apologises or not (cross prayer — crucifiers did not ask). These distinctions show depth of understanding that WAEC higher marks reward.</p>'},
{lb:'WAEC final tips — forgiveness',dr:dQ2,ht:'<p>WAEC absolute must-knows for forgiveness: (1) Jesus claims divine authority to forgive (Mark 2:10 — Son of Man). (2) Lord\'s Prayer condition: Matt.6:12 (text) and Matt.6:14-15 (explanation). (3) 70x7 or seventy-seven times: Matt.18:22. (4) Unforgiving Servant: Matt.18:23-35 — narrative + 10,000 talents vs 100 denarii + Matt.18:35 conclusion. (5) Prodigal Son: Luke 15:20 — father ran; full restoration without conditions. (6) Cross prayer: Luke 23:34 — ultimate model of costly forgiveness. (7) Blood of the new covenant for forgiveness of sins: Matt.26:28. (8) Woman in adultery: John 8:11 — "neither do I condemn you; go and sin no more" (only in John). (9) Woman who anointed Jesus: Luke 7:47 — forgiven much, loved much. (10) Reconciliation precedes worship: Matt.5:23-24.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The correct reference for "If you do not forgive others their sins, your Father will not forgive your sins" is:',o:['Luke 11:4','Matthew 18:35','Mark 11:25','Matthew 6:15'],a:4,w:'Matthew 6:14-15 — "For if you forgive other people when they sin against you, your heavenly Father will also forgive you. But if you do not forgive others their sins, your Father will not forgive your sins." This follows the Lord\'s Prayer (6:12 — "forgive us our debts as we have forgiven our debtors"). Matthew 6:14-15 is the explanation/emphasis of Matt.6:12. Know both references.'},{q:'Which parable teaches about God\'s forgiveness and which teaches about our obligation to forgive others?',o:['Prodigal Son teaches our obligation to forgive; Unforgiving Servant teaches God\'s forgiveness','Unforgiving Servant teaches God\'s forgiveness; Prodigal Son teaches our obligation to forgive','Prodigal Son (Luke 15) illustrates God\'s proactive, extravagant forgiveness of returning sinners; Unforgiving Servant (Matt 18:23-35) teaches our obligation to forgive others because of how much God has forgiven us','Both parables teach exactly the same lesson with no distinction between them'],a:3,w:'The Prodigal Son (Luke 15) — the father represents God; his running, embracing and feasting illustrates God\'s proactive forgiveness. The Unforgiving Servant (Matt.18:23-35) — the king represents God; the servant represents us; the contrast (10,000 talents vs 100 denarii) shows why we must forgive others given how much God has forgiven us. Different emphases in different parables — knowing which is which is essential for WAEC.'},{q:'Jesus said to the paralysed man "Son, your sins are forgiven" (Mark 2:5) BEFORE healing him. The reason for this order was:',o:['Jesus prioritised spiritual healing over physical healing as a general principle for all his miracles','The man had specifically asked for forgiveness, not healing, when he was lowered through the roof','Jesus wanted to make a theological point: his authority to forgive sin (invisible and only God can give) was authenticated by the visible miracle of healing; the order proved the point to the watching scribes','Jesus did not know the man was paralysed until after he had spoken to him'],a:3,w:'Mark 2:9-10 — Jesus asked: "Which is easier: to say \'Your sins are forgiven,\' or to say \'Get up and walk\'? But I want you to know that the Son of Man has authority on earth to forgive sins." The healing proved the forgiveness: the visible miracle (which all could witness) authenticated the invisible claim (which only God could fulfil). Jesus deliberately chose this order to demonstrate his divine authority to forgive sins.'},{q:'The conclusion of the Unforgiving Servant parable (Matt 18:35) is:',o:['"Go and sin no more — the debt is forgiven"','"This is how my heavenly Father will treat each of you unless you forgive your brother or sister from your heart"','"Well done, good and faithful servant — forgiveness is the greatest of Kingdom virtues"','"Love your enemies and pray for those who persecute you"'],a:2,w:'Matthew 18:35 — "This is how my heavenly Father will treat each of you unless you forgive your brother or sister from your heart." The emphasis on "from your heart" is crucial: mechanical verbal forgiveness is not enough; genuine inner release of the debt is what God requires. And the warning about how "your heavenly Father will treat" those who withhold forgiveness is one of the most sobering statements about unforgiveness in the Gospels.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Forgiveness (3)',su:'Further comprehensive revision on forgiveness.',steps:[
{lb:'Summary revision',dr:dQ10,ht:'<p>Complete forgiveness revision: God\'s forgiveness — divine authority (Mark 2:10); proactive (Luke 15:20 — father ran); extravagant (robe, ring, feast); costly (Luke 23:34 — the cross); transforming (Luke 7:47 — forgiven much = loved much); universal (Luke 24:47 — all nations). Our forgiveness — unlimited (Matt.18:22 — 70x7); from the heart (Matt.18:35); towards enemies (Matt.5:44); reconciling (Matt.5:23-24); Spirit-empowered (John 20:22-23). Connection — "forgive us as we have forgiven" (Matt.6:12); if you do not forgive, neither will God (Matt.6:15); Unforgiving Servant (10,000 vs 100 denarii — why we must forgive). Key Gospel locations — Mark (divine authority); Luke (Prodigal Son, woman anointing, Zacchaeus, cross prayer); Matthew (Lord\'s Prayer, 70x7, Unforgiving Servant); John (woman in adultery, Peter restored).</p>'},
{lb:'Forgiveness in Luke specifically',dr:dQ2,ht:'<p>Luke\'s Gospel is particularly rich in forgiveness teaching — he is the "Gospel of grace and forgiveness": (1) Prodigal Son (15:11-32) — God\'s extravagant welcome. (2) Woman who anointed Jesus (7:36-50) — forgiven much, loved much. (3) Zacchaeus (19:1-10) — salvation comes to the house; forgiveness transforms. (4) Tax collector in the temple (18:9-14) — humble cry receives justification. (5) Cross prayer (23:34) — Father, forgive them. (6) The thief on the cross (23:43) — "today you will be with me in paradise" — last-moment forgiveness. (7) Post-resurrection commission (24:47) — repentance for forgiveness preached to all nations. Luke contains more forgiveness narratives than any other Gospel — essential for CRS WAEC students.</p>'},
{lb:'Forgiveness in Matthew specifically',dr:dQ1,ht:'<p>Matthew\'s key forgiveness texts: (1) Lord\'s Prayer (6:12,14-15) — condition attached to forgiveness. (2) 70x7 (18:22) — unlimited forgiveness. (3) Unforgiving Servant (18:23-35) — why unlimited forgiveness is required. (4) "Blood of the covenant... for the forgiveness of sins" (26:28) — cross and forgiveness. (5) Reconciliation before worship (5:23-24). (6) Love your enemies (5:44) — forgiveness extended to enemies. (7) "Son of Man has authority on earth to forgive sins" (9:6 / Mark 2:10) — divine authority. Matthew\'s unique contribution: the structural connection between forgiveness received and forgiveness given — the Lord\'s Prayer and Unforgiving Servant both make this link explicitly. Matthew\'s Jesus is the Teacher of righteousness whose forgiveness ethics are the highest possible standard.</p>'},
{lb:'WAEC final exam practice',dr:dQ2,ht:'<p>Exam practice: "Describe TWO parables Jesus used to teach about forgiveness and state ONE lesson from each." Example answers: (1) "The Parable of the Prodigal Son (Luke 15:11-32) teaches about God\'s forgiveness. A younger son demanded his inheritance, wasted it, returned home, and was met by his running, embracing father who restored him with a robe, ring, sandals and feast. The lesson is that God\'s forgiveness is proactive and extravagant — he does not wait to be asked but watches for the returning sinner and moves toward them with joy." (2) "The Parable of the Unforgiving Servant (Matthew 18:23-35) teaches about our obligation to forgive others. A servant forgiven 10,000 talents refused to forgive a fellow servant 100 denarii and was condemned by the king. The lesson is that those who have received God\'s enormous forgiveness must extend forgiveness to others — unforgiveness contradicts the grace we have received."</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'Which Gospel contains the most forgiveness narratives, including the Prodigal Son, the woman who anointed Jesus, Zacchaeus, the tax collector in the temple, and the cross prayer?',o:['Matthew — because it is the most Jewish Gospel and forgiveness was a central Jewish concern','Mark — because it is the earliest Gospel and contains the original teaching on forgiveness','Luke — often called "the Gospel of grace and forgiveness" because of its unique concentration of forgiveness narratives','John — because it contains the highest Christology and forgiveness is a divine attribute'],a:3,w:'Luke\'s Gospel is particularly rich in forgiveness: Prodigal Son (15:11-32); woman who anointed Jesus (7:36-50); Zacchaeus (19:1-10); tax collector in temple (18:9-14); cross prayer (23:34); thief on the cross (23:43); post-resurrection commission (24:47). Luke\'s Gospel is sometimes called "the Gospel of the poor and outcasts" and equally "the Gospel of grace and forgiveness" — more forgiveness narratives than any other.'},{q:'Jesus said "your Father will not forgive your sins" if you do not forgive others (Matt 6:15). This does NOT mean:',o:['Forgiveness of others and receiving God\'s forgiveness are spiritually connected','Those who genuinely receive God\'s forgiveness will find it possible (though difficult) to forgive others','Forgiving others is a WORK that earns our own forgiveness as a commercial transaction with God — trading our forgiveness for his','Unforgiveness is a serious spiritual condition that blocks the experience of God\'s forgiveness'],a:3,w:'Matthew 6:15 is not about earning forgiveness as a commercial transaction (forgiving others to pay for God forgiving us). It is about the inseparable connection between receiving and giving: those who truly understand the enormity of what God forgave them cannot withhold forgiveness from others (the Unforgiving Servant parable illustrates this). The condition is not commercial but relational — genuine reception of grace produces extension of grace.'},{q:'The thief on the cross (Luke 23:43) received Jesus\'s promise "today you will be with me in paradise." This is significant for the teaching on forgiveness because:',o:['It proves that all people are automatically forgiven after death regardless of their life choices','It shows that forgiveness can be received at the very last moment — even on a cross, even by someone who has spent their life in crime, if they turn to Jesus','It means that paradise is only for those who suffer greatly before dying','This was a unique exception and Jesus specifically said this would not apply to anyone else'],a:2,w:'The thief on the cross (Luke 23:40-43) is a paradigm case: no time for restitution; no good works; no baptism; no formal religious membership — just a turning to Jesus ("remember me when you come into your kingdom") and the promise "today you will be with me in paradise." This is one of the most powerful illustrations of forgiveness as grace: freely given, received through simple turning to Jesus, with immediate and eternal effect.'},{q:'Jesus\' statement "repentance for the forgiveness of sins will be preached in his name to all nations" (Luke 24:47) shows that forgiveness is:',o:['Only for the Jewish people — "all nations" was a mistranslation and should be "all Jewish communities"','The heart of the Gospel message to be proclaimed globally — the post-resurrection commission makes forgiveness the content and goal of the church\'s mission to all peoples','A private matter between an individual and God that should not be publicly proclaimed','Only available until the end of the apostolic age when direct forgiveness through Jesus ended'],a:2,w:'Luke 24:47 — the risen Jesus commissioned the disciples to preach "repentance for the forgiveness of sins... to all nations." Forgiveness is both the content (what the Gospel offers) and the goal (what the proclamation achieves) of the church\'s universal mission. This connects the entire Gospel narrative from birth ("he will save his people from their sins" — Matt.1:21) to resurrection commission (forgiveness preached to all nations).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 Gospels',ti:'Mixed Revision — Forgiveness Final',su:'Final comprehensive revision on forgiveness in the Gospels.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Forgiveness — final complete summary: God\'s forgiveness — Mark 2:1-12 (divine authority; Son of Man); Luke 15:11-32 (Prodigal Son — proactive, extravagant, restorative); Luke 7:36-50 (forgiven much = loved much); Luke 23:34 (cross prayer — costly, unconditional); Matt.26:28 (blood of covenant for forgiveness of sins). Our forgiveness — Matt.6:12,14-15 (Lord\'s Prayer condition); Matt.18:22 (70x7); Matt.18:23-35 (Unforgiving Servant — 10,000 vs 100 denarii; Matt.18:35 conclusion); Matt.5:23-24 (reconcile before worship); Matt.5:44 (love enemies). Forgiveness received — Luke 18:9-14 (tax collector — humble cry); Luke 19:1-10 (Zacchaeus — salvation transforms); John 8:1-11 (woman in adultery — no condemnation + go sin no more); John 20:22-23 (disciples empowered to pronounce); John 21:15-17 (Peter restored).</p>'},
{lb:'Thematic synthesis',dr:dQ10,ht:'<p>Synthesis: Forgiveness is the central achievement of Jesus\' mission and the heart of the Gospel. It flows from God\'s character (proactive, extravagant, unconditional), is made possible by the cross (costly sacrifice — Matt.26:28; Luke 23:34), is received through repentance and faith (tax collector — Luke 18:13; Zacchaeus — Luke 19:8), produces love and transformation (Luke 7:47; Zacchaeus), and creates an obligation to forgive others (Matt.6:12-15; Matt.18:23-35). The name Jesus (Matt.1:21), the ministry, the cross, the resurrection commission, and the post-resurrection appearances all centre on forgiveness. It is not a topic within CRS — it is the topic to which all other Gospel themes point.</p>'},
{lb:'WAEC model comparison paragraph',dr:dQ1,ht:'<p>Model comparison: "Compare the Prodigal Son and the Unforgiving Servant as teaching on forgiveness." Both are parables; both involve financial metaphors (inheritance wasted; debts); both feature a father/king figure. Prodigal Son (Luke 15) — about GOD\'s forgiveness: the father (God) proactively welcomes the returning son (sinner); no conditions before forgiveness; restoration is complete. Unforgiving Servant (Matt.18) — about OUR obligation to forgive: the servant (us) has been forgiven a vast debt by the king (God); yet refuses to forgive a tiny debt; is condemned. Connection: the Prodigal Son shows what we have received; the Unforgiving Servant shows what we must therefore give. These two parables together capture the complete Gospel of forgiveness.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final must-knows — Forgiveness in the Gospels: (1) Mark 2:10 — Son of Man has authority to forgive sins. (2) Matt.6:12 — Lord\'s Prayer petition on forgiveness. (3) Matt.6:14-15 — condition attached (if you do not forgive). (4) Matt.18:22 — 70x7 (unlimited). (5) Matt.18:23-35 — Unforgiving Servant (10,000 talents vs 100 denarii; 18:35 conclusion). (6) Luke 15:20 — father ran (Prodigal Son — proactive). (7) Luke 7:47 — forgiven much = loved much. (8) Luke 23:34 — cross prayer (costly forgiveness model). (9) Matt.26:28 — blood of covenant for forgiveness. (10) John 8:11 — neither do I condemn you (only in John). Always give chapter and verse. Always define forgiveness. Always connect forgiveness to love, faith, Kingdom, and the cross. For 25-mark essays: at least 5 developed points with specific evidence and analysis.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Which set of references CORRECTLY identifies the Lord\'s Prayer forgiveness texts?',o:['Luke 11:4 (text of prayer) and Luke 11:5-8 (explanation) — only in Luke','Matthew 6:12 (the petition) and Matthew 6:14-15 (the explanation/condition) — the condition is unique to Matthew\'s version','Mark 11:25 (the prayer) and Mark 11:26 (the condition) — earliest Gospel account','John 17:11 (the High Priestly Prayer) and John 17:15 (the condition)'],a:2,w:'Matthew 6:12 — "Forgive us our debts, as we also have forgiven our debtors" — the petition in the Lord\'s Prayer. Matthew 6:14-15 — the only petition Jesus specifically elaborated after the prayer: "For if you forgive other people when they sin against you, your heavenly Father will also forgive you. But if you do not forgive others their sins, your Father will not forgive your sins." Both references are essential for WAEC.'},{q:'The Parable of the Unforgiving Servant (Matt 18:23-35) was told in response to:',o:['The Pharisees asking Jesus about the limits of forgiveness under the Law of Moses','Judas Iscariot asking how many times a traitor should be forgiven','Peter asking "Lord, how many times shall I forgive my brother or sister who sins against me? Up to seven times?" — and Jesus answering not seven times but 77 (or 70x7) times, then telling the parable to explain why','The disciples asking Jesus to explain what happens to Christians who refuse to forgive'],a:3,w:'Matthew 18:21-22 — Peter asked about seven times; Jesus said 77 (or seventy times seven). Then (18:23) the parable follows: "Therefore, the Kingdom of heaven is like a king who wanted to settle accounts..." The parable explains the REASON for unlimited forgiveness: God has forgiven us 10,000 talents (the incalculable); no human debt we are asked to forgive (100 denarii) could justify refusal.'},{q:'The phrase "Father, forgive them, for they do not know what they are doing" (Luke 23:34) modelled Christian forgiveness because:',o:['It was spoken after Jesus recovered from his wounds and had time to reflect calmly','Stephen prayed a similar prayer ("Lord, do not hold this sin against them") as he was stoned to death (Acts 7:60) — showing that Jesus\' cross prayer became the template for Christian forgiveness under persecution','Only apostles and martyrs are expected to forgive at this level; ordinary Christians are held to a lower standard','The prayer was never actually spoken but was added by Luke to emphasise forgiveness theologically'],a:2,w:'Luke 23:34 became the template for Christian martyrdom: Stephen (Acts 7:60) — "Lord, do not hold this sin against them" — echoed Jesus\' cross prayer directly while being stoned. The cross prayer models forgiveness extended: (1) at the moment of maximum pain; (2) to those causing the pain; (3) without requiring prior acknowledgment of guilt; (4) offering the excuse of ignorance. This is the standard Jesus set — and Stephen followed immediately.'},{q:'Which of the following CORRECTLY describes what was restored to the Prodigal Son upon his return (Luke 15:22-23)?',o:['His share of the inheritance he had wasted — his father gave him back the exact amount he had spent','A simple meal and a small room at the back of the house — the father was cautious about full restoration','The best robe (sonship/identity), a ring (authority), sandals (not a slave), and a fatted calf feast (full family membership) — complete and extravagant restoration','A written legal document confirming he was the son — the father needed legal proof of the relationship'],a:3,w:'Luke 15:22-23 — the father ordered: "Bring the best robe and put it on him. Put a ring on his finger and sandals on his feet. Bring the fattened calf and kill it." Each item is symbolic: robe = restored identity as son; ring = authority/family seal; sandals = free man (slaves went barefoot); feast = full family membership and celebration. This is not cautious, probationary acceptance but complete, extravagant, immediate restoration — the portrait of God\'s forgiveness.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
