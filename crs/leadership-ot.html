<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'OT Leaders — Overview',ACC,13,'middle',true));
[['Leader','Key Role','Key Verse'],['Joseph','Providential ruler of Egypt','Gen 50:20 — God intended it for good'],['Moses','Lawgiver and deliverer','Deut 34:10 — no prophet like Moses'],['Joshua','Military leader into Canaan','Josh 1:9 — be strong and courageous'],['Deborah','Judge and prophetess','Judg 4:4 — she led Israel'],['Gideon','Deliverer with 300 men','Judg 7:7 — I will save you'],['Samuel','Last judge / kingmaker','1 Sam 3:19 — God let none of his words fail'],['Saul','First king of Israel','1 Sam 9:2 — impressive; a head taller'],['David','Greatest king — man after God\'s heart','Acts 13:22'],['Solomon','Wisest king; built temple','1 Kings 4:29 — wisdom surpassing all']].forEach(function(r,i){if(i<=p){o.push(R(10,22+i*24,460,20,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(60,34+i*24,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(210,34+i*24,r[1],'#444',7,'middle',false));o.push(T(390,34+i*24,r[2],'#666',7,'middle',false));}});

if(p>=2){o.push(R(10,90,460,40,CRM,ACC,1.5));o.push(T(240,108,'In Egypt: servant of Potiphar; falsely accused; imprisoned','#333',10,'middle',false));}

s.innerHTML=o.join('');}

if(p>=2){o.push(R(10,90,460,40,CRM,ACC,1.5));o.push(T(240,108,'Received Ten Commandments at Sinai; mediated God\'s law','#333',10,'middle',false));}
if(p>=3){o.push(R(10,140,460,40,CRM,ACC,1.5));o.push(T(240,158,'Led Israel 40 years in the wilderness; patient intercessor','#333',10,'middle',false));}
if(p>=4){o.push(R(10,190,460,60,LINE,ACC,1));o.push(T(240,210,'Deut 34:10: no prophet like Moses; knew God face to face','#333',9,'middle',false));o.push(T(240,230,'Qualities: humility (Num 12:3), obedience, courage, intercession','#555',9,'middle',false));}
s.innerHTML=o.join('');}

var QS=[
{ey:'Q1 \u2022 CRS \u2022 Old Testament',ti:'Joseph as a Leader',su:'Describe Joseph\'s leadership qualities and how God worked through him.',steps:[
  {lb:'Joseph\'s background',dr:dQ2,ht:'<p>Joseph was the 11th son of Jacob, born to his beloved Rachel (Genesis 30:24). Jacob showed favouritism — giving Joseph a richly ornamented robe ("coat of many colours"). Joseph had dreams of his brothers bowing to him (Gen 37:5-9). His brothers\' jealousy grew until they sold him to Ishmaelite traders for 20 pieces of silver (Gen 37:28). He was taken to Egypt as a slave.</p>'},
  {lb:'Joseph in Egypt',dr:dQ2,ht:'<p>In Egypt, Joseph served Potiphar faithfully — "the Lord was with Joseph and gave him success" (Gen 39:23). Potiphar\'s wife falsely accused him of assault; he was imprisoned. In prison he interpreted dreams for fellow prisoners (the cupbearer and baker). When Pharaoh had troubling dreams two years later, the cupbearer remembered Joseph. Joseph interpreted Pharaoh\'s dreams as 7 years of plenty followed by 7 years of famine.</p>'},
  {lb:'Joseph\'s rise to power',dr:dQ2,ht:'<p>Pharaoh appointed Joseph as Prime Minister of Egypt (Genesis 41:40) — at age 30. Joseph wisely stored grain during the 7 years of plenty. When famine came, people came from all nations to buy grain. His brothers came from Canaan — not recognising him. After testing them (Genesis 42-44), Joseph revealed himself and wept. He sent for his father Jacob and the whole family settled in Goshen.</p>'},
  {lb:'Joseph\'s leadership qualities',dr:dQ2,ht:'<p>Joseph showed: (1) <b>Integrity</b> — resisted Potiphar\'s wife (Gen 39:9 — "How could I do such a wicked thing and sin against God?"). (2) <b>Faith</b> — trusted God through slavery, false accusation and prison. (3) <b>Wisdom</b> — interpreted dreams; planned for the famine. (4) <b>Forgiveness</b> — Gen 50:20 — "You intended harm but God intended good." (5) <b>Humility</b> — gave God credit for interpreting dreams (Gen 41:16).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'How much silver was Joseph sold for by his brothers?',o:['10 pieces','15 pieces','20 pieces','30 pieces'],a:3,w:'Genesis 37:28 — Joseph was sold to the Ishmaelites for 20 pieces of silver.'},{q:'What was Joseph\'s response when Potiphar\'s wife tried to seduce him?',o:['He reported her to Potiphar','He fled and refused (sin against God)','He agreed but later regretted it','He asked for permission'],a:2,w:'Genesis 39:9 — "How could I do such a wicked thing and sin against God?" — he fled.'},{q:'How old was Joseph when Pharaoh made him Prime Minister?',o:['17','25','30','40'],a:3,w:'Genesis 41:46 — "Joseph was thirty years old when he entered the service of Pharaoh."'},{q:'What does Genesis 50:20 teach about Joseph\'s suffering?',o:['God punished his brothers through Joseph','God prevented all his suffering','God intended good from what brothers meant for harm','God was absent during his trials'],a:3,w:'Genesis 50:20 — "You intended to harm me, but God intended it for good" — providence in suffering.'},{q:'What did Joseph\'s brothers do to him before selling him into slavery?',o:['Killed him immediately','Threw him into a pit, then sold him','Sent him to Egypt as a gift','Made him a shepherd'],a:2,w:'Genesis 37:24-28 — the brothers threw Joseph into a pit before selling him to traders.'},{q:'What did Joseph interpret for Pharaoh that led to his promotion?',o:['Pharaoh\'s dreams','The stars','The Nile\'s flooding pattern','Ancient scrolls'],a:1,w:'Genesis 41 — Joseph interpreted Pharaoh\'s dreams about seven years of plenty and famine.'},{q:'How many years of famine did Joseph predict would follow seven years of plenty?',o:['Three','Five','Seven','Ten'],a:3,w:'Genesis 41:30 — seven years of famine were predicted to follow seven years of plenty.'},{q:'What did Joseph do for his family when famine struck Canaan?',o:['Refused to help them','Provided for them and brought them to Egypt','Sent them money only','Ignored their pleas'],a:2,w:'Genesis 45-47 — Joseph provided for his family and settled them in Goshen.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 Old Testament',ti:'Moses as Leader and Lawgiver',su:'Describe the leadership of Moses and his role in giving the Law.',steps:[
  {lb:'The call of Moses',dr:dQ3,ht:'<p>Moses was born a Hebrew but raised as Egyptian royalty (Exodus 2). He fled to Midian after killing an Egyptian. At the burning bush (Exodus 3), God called him: <em>"I have indeed seen the misery of my people in Egypt."</em> God revealed His name: <em>"I AM WHO I AM"</em> (YHWH). Moses objected: "Who am I?" (v11); "I am slow of speech" (4:10). God promised: "I will be with you" and gave Aaron as his spokesman.</p>'},
  {lb:'Moses and the Exodus',dr:dQ3,ht:'<p>Moses confronted Pharaoh: <em>"Let my people go."</em> God sent 10 plagues (water to blood, frogs, gnats, flies, livestock, boils, hail, locusts, darkness, death of firstborn). The Passover was instituted (Ex 12) — lamb\'s blood on doorposts spared the Israelites. Pharaoh released Israel. At the Red Sea, God parted the waters (Ex 14:21) — Israel crossed on dry ground; Pharaoh\'s army drowned.</p>'},
  {lb:'Moses as lawgiver',dr:dQ3,ht:'<p>At Mount Sinai, Moses spent 40 days with God, receiving the Ten Commandments (Ex 20) and the full Law. He was the mediator between God and Israel. Exodus 34:29 — Moses\' face shone after being in God\'s presence. Numbers 12:3 — <em>"Moses was a very humble man, more humble than anyone else on the face of the earth."</em> Deuteronomy 34:10 — <em>"No prophet has risen in Israel like Moses, whom the Lord knew face to face."</em></p>'},
  {lb:'Moses\' leadership qualities',dr:dQ3,ht:'<p>Moses showed: (1) <b>Humility</b> — "Who am I?" (Ex 3:11); Numbers 12:3. (2) <b>Obedience</b> — did everything God commanded. (3) <b>Courage</b> — confronted Pharaoh repeatedly. (4) <b>Intercession</b> — prayed for Israel after the golden calf (Ex 32:11-13); after Miriam\'s leprosy; when rebels murmured. (5) <b>Patience</b> — led a difficult people for 40 years. His failure: struck the rock instead of speaking to it (Num 20) — kept him from entering Canaan.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'What did God reveal His name as at the burning bush?',o:['Jehovah-Jireh','I AM WHO I AM','The Lord of Hosts','El Shaddai'],a:2,w:'Exodus 3:14 — God said to Moses, "I AM WHO I AM" (YHWH).'},{q:'Numbers 12:3 describes Moses as the most humble man — why is this significant?',o:['It explains why he was not chosen as king','It shows true leadership requires humility not pride','It means he never spoke boldly','It shows he had no confidence'],a:2,w:'Numbers 12:3 shows that great leadership is rooted in humility — Moses led millions yet was not proud.'},{q:'What was Moses\' failure that prevented him entering the Promised Land?',o:['He killed the Egyptian','He married a Cushite woman','He struck the rock instead of speaking to it','He doubted at the Red Sea'],a:3,w:'Numbers 20:11-12 — Moses struck the rock in anger instead of speaking to it; God said he did not honour God as holy.'},{q:'Deuteronomy 34:10 says no prophet arose like Moses because:',o:['He performed the most miracles','He wrote the most books','God knew him face to face','He lived the longest'],a:3,w:'Deuteronomy 34:10 — "No prophet has risen in Israel like Moses, whom the Lord knew face to face."'},{q:'Where did Moses receive the Ten Commandments?',o:['Mount Nebo','Mount Sinai','Mount Carmel','Mount Ararat'],a:2,w:'Exodus 20 — the Ten Commandments were given at Mount Sinai.'},{q:'What excuse did Moses give God at the burning bush about leading Israel?',o:['He was too old','He was slow of speech','He had no army','He did not know the way'],a:2,w:'Exodus 4:10 — Moses protested that he was slow of speech and tongue.'},{q:'Who assisted Moses by holding up his hands during the battle with the Amalekites?',o:['Joshua and Caleb','Aaron and Hur','Miriam and Aaron','Eleazar and Ithamar'],a:2,w:'Exodus 17:12 — Aaron and Hur held up Moses\' hands so Israel would prevail.'},{q:'From which mountain did Moses view the Promised Land before he died?',o:['Mount Sinai','Mount Nebo','Mount Carmel','Mount Ararat'],a:2,w:'Deuteronomy 34:1 — Moses viewed the Promised Land from Mount Nebo.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 Old Testament',ti:'Joshua, Deborah and Gideon',su:'Describe the leadership of Joshua, Deborah and Gideon.',steps:[
  {lb:'Joshua — military leader',dr:dQ4,ht:'<p>Joshua succeeded Moses (Joshua 1:1-9). God\'s command: <em>"Be strong and very courageous... do not be afraid or discouraged, for the Lord your God will be with you wherever you go."</em> Joshua led Israel into Canaan: crossed the Jordan River (Josh 3 — waters parted), conquered Jericho (Josh 6 — walls fell after 7 days of marching). Divided the land among the 12 tribes. Joshua 24:15 — <em>"As for me and my household, we will serve the Lord."</em></p>'},
  {lb:'Deborah — judge and prophetess',dr:dQ4,ht:'<p>Judges 4:4 — <em>"Deborah, a prophetess, the wife of Lappidoth, was leading Israel at that time."</em> Israel was oppressed by Sisera (Canaanite general). Deborah summoned Barak and commanded him to fight — <em>"Has not the Lord commanded you?"</em> (Judg 4:6). Barak refused to go without Deborah. She prophesied that a woman would get the glory (Jael killed Sisera). Deborah\'s Song (Judges 5) celebrated God\'s victory. Significance: a woman leader in a patriarchal society.</p>'},
  {lb:'Gideon — unlikely deliverer',dr:dQ4,ht:'<p>Israel oppressed by Midianites. God called Gideon while he hid in a winepress (Judg 6:11) — <em>"The Lord is with you, mighty warrior."</em> Gideon objected: <em>"My clan is the weakest in Manasseh, and I am the least in my family."</em> God\'s answer: <em>"I will be with you."</em> Gideon asked for a sign (fleece). God reduced his army from 32,000 to 300 (so Israel would not boast). The 300 defeated Midian with trumpets and torches — God\'s power, not human strength (Judg 7).</p>'},
  {lb:'Leadership lessons from the three',dr:dQ4,ht:'<p>Joshua teaches: faith and courage; obedience to God\'s commands; speaking out for God (Josh 24:15). Deborah teaches: God can use women in leadership; courage to obey despite others\' reluctance; wisdom and faith. Gideon teaches: God uses the weak and unlikely; victory comes from God not human power; overcoming fear through faith; the danger of later failure (Gideon made an idol — Judg 8:27).</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'What was God\'s command to Joshua in Joshua 1:9?',o:['Build an altar and pray','Be strong and courageous; do not be afraid','March around Jericho','Divide the land immediately'],a:2,w:'Joshua 1:9 — "Be strong and courageous. Do not be afraid; do not be discouraged."'},{q:'Judges 4:4 describes Deborah as a prophetess who was also:',o:['A queen of Israel','Leading (judging) Israel at that time','Moses\' sister','Gideon\'s wife'],a:2,w:'Judges 4:4 — "Deborah, a prophetess, the wife of Lappidoth, was leading Israel at that time."'},{q:'Why did God reduce Gideon\'s army from 32,000 to 300?',o:['The rest were too old','To save resources','So Israel could not boast that their own strength saved them','Gideon asked for fewer men'],a:3,w:'Judges 7:2 — God said the army was too large — "Israel may not boast against me that her own strength has saved her."'},{q:'What famous declaration did Joshua make in Joshua 24:15?',o:['The Lord our God is one','As for me and my household, we will serve the Lord','Be strong and very courageous','No weapon formed against us shall prosper'],a:2,w:'Joshua 24:15 — "But as for me and my household, we will serve the Lord."'},{q:'What did Joshua and the Israelites do before the walls of Jericho fell?',o:['Attacked directly with swords','Marched around the city for seven days','Built siege towers','Waited for a drought'],a:2,w:'Joshua 6 — Israel marched around Jericho for seven days before the walls fell.'},{q:'Who led Israel\'s army into battle at Deborah\'s command against Sisera?',o:['Barak','Ehud','Othniel','Samson'],a:1,w:'Judges 4:6-7 — Deborah summoned Barak to lead the army against Sisera.'},{q:'What sign did Gideon ask God for, using a fleece of wool?',o:['A rainbow','Confirmation through dew on a fleece','A burning bush','A voice from heaven'],a:2,w:'Judges 6:36-40 — Gideon asked for confirmation through dew on a fleece of wool.'},{q:'How did Gideon\'s 300 men defeat the vast Midianite army?',o:['A direct sword charge','With trumpets, torches and jars, causing confusion','By poisoning the water','By negotiating a treaty'],a:2,w:'Judges 7:19-22 — trumpets, torches and jars caused confusion among the Midianites.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 Old Testament',ti:'Samuel, Saul and David',su:'Compare the leadership of Samuel, Saul and David.',steps:[
  {lb:'Samuel — last judge and kingmaker',dr:dQ1,ht:'<p>Samuel was dedicated to God before birth (1 Sam 1). Called by God as a child: <em>"Speak Lord, for your servant is listening"</em> (1 Sam 3:9). 1 Samuel 3:19 — <em>"The Lord was with Samuel as he grew up, and he let none of Samuel\'s words fall to the ground."</em> Samuel judged Israel faithfully, anointed Saul as first king (1 Sam 10) and later anointed David (1 Sam 16:13). He was prophet, priest and judge — the last of the judges.</p>'},
  {lb:'Saul — first king',dr:dQ1,ht:'<p>Saul: "an impressive young man without equal — a head taller than any of the people" (1 Sam 9:2). Initially humble: "But am I not a Benjamite, from the smallest tribe?" (9:21). Anointed by Samuel. Early successes. But Saul disobeyed: (1) Offered the sacrifice himself instead of waiting for Samuel (1 Sam 13). (2) Did not completely destroy the Amalekites as commanded (1 Sam 15). Samuel declared: <em>"To obey is better than sacrifice"</em> (15:22). God rejected Saul as king.</p>'},
  {lb:'David — man after God\'s heart',dr:dQ1,ht:'<p>David: youngest son of Jesse; shepherd boy. God told Samuel: <em>"The Lord does not look at the things people look at... the Lord looks at the heart"</em> (1 Sam 16:7). David killed Goliath with a sling (1 Sam 17) — trust in God not weapons. Acts 13:22 — <em>"a man after my own heart."</em> United Israel; captured Jerusalem; planned the temple. His great sin: adultery with Bathsheba, murder of Uriah (2 Sam 11). His great virtue: genuine repentance (Ps 51).</p>'},
  {lb:'Comparing the three leaders',dr:dQ1,ht:'<p>Samuel — faithfulness to God\'s word; prayer as priority (1 Sam 12:23 — "as for me, far be it from me that I should sin against the Lord by failing to pray"). Saul — impressive but disobedient; God\'s rejection came through disobedience, not ability. David — great gifts and great failures; what distinguished him was genuine repentance and a heart for God. Key lesson: God values obedience and heart attitude over outward ability or appearance.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'What did young Samuel say when God called him in the night?',o:['Here I am, Lord','Who is there?','Speak, for your servant is listening','I am not worthy'],a:3,w:'1 Samuel 3:10 — "Speak, for your servant is listening."'},{q:'What was Saul\'s first act of disobedience that cost him the kingdom?',o:['Marrying many wives','Offering sacrifice himself without waiting for Samuel','Befriending the Philistines','Refusing to fight Goliath'],a:2,w:'1 Samuel 13 — Saul offered the burnt offering himself, without waiting for Samuel.'},{q:'1 Samuel 16:7 says God does not look at outward appearance but at:',o:['Strength and courage','Wealth and power','The heart','Age and experience'],a:3,w:'1 Samuel 16:7 — "The Lord does not look at the things people look at... the Lord looks at the heart."'},{q:'Which Psalm shows David\'s genuine repentance after his sin with Bathsheba?',o:['Psalm 23','Psalm 51','Psalm 91','Psalm 139'],a:2,w:'Psalm 51 — "Create in me a pure heart, O God" — David\'s prayer of repentance after Nathan confronted him.'},{q:'Who was Samuel\'s mentor/priest at the tabernacle in Shiloh when God first called him?',o:['Eli','Aaron','Nathan','Ahijah'],a:1,w:'1 Samuel 3 — Eli was the priest who guided young Samuel at Shiloh.'},{q:'What weapon did David use to defeat Goliath?',o:['A sword','A sling and stone','A spear','His bare hands'],a:2,w:'1 Samuel 17:49-50 — David defeated Goliath with a sling and a stone.'},{q:'Why did God reject Saul as king, according to 1 Samuel 15?',o:['He was too young','He disobeyed by not fully destroying the Amalekites','He refused to fight','He built an idol'],a:2,w:'1 Samuel 15 — Saul disobeyed God\'s command to fully destroy the Amalekites.'},{q:'What did Nathan the prophet use to confront David about his sin?',o:['A direct accusation only','A parable about a poor man\'s lamb','A vision','A written letter'],a:2,w:'2 Samuel 12:1-7 — Nathan told David a parable about a rich man taking a poor man\'s lamb.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 Old Testament',ti:'Solomon and Leadership Lessons',su:'Evaluate Solomon\'s leadership and draw lessons from OT leaders.',steps:[
  {lb:'Solomon\'s wisdom',dr:dQ5,ht:'<p>Solomon became king after David. At Gibeon, God appeared to Solomon and offered him anything he wished. Solomon asked for wisdom to govern God\'s people (1 Kings 3:9). God was pleased: He gave Solomon wisdom <em>and</em> riches and honour. Solomon\'s wisdom was demonstrated: the famous judgment between two women claiming the same baby (1 Kings 3:16-28). 1 Kings 4:29 — God gave Solomon wisdom "as measureless as the sand on the seashore."</p>'},
  {lb:'Solomon\'s achievements',dr:dQ5,ht:'<p>Solomon built the temple in Jerusalem (1 Kings 6-8) — 7 years to build. At its dedication (1 Kings 8), Solomon prayed and God\'s glory filled the temple. He also built his palace (13 years), established trade routes, welcomed foreign dignitaries (the Queen of Sheba — 1 Kings 10), wrote Proverbs and Song of Solomon. Israel reached its greatest prosperity under Solomon.</p>'},
  {lb:'Solomon\'s failure',dr:dQ5,ht:'<p>1 Kings 11 — Solomon married 700 wives and had 300 concubines (from foreign nations). They turned his heart to other gods. Solomon built high places for Chemosh, Molech and others. God was angry: <em>"Since this is your attitude... I will tear the kingdom from you"</em> (1 Kings 11:11). The kingdom was divided after Solomon\'s death — Israel (north) and Judah (south). Great wisdom does not guarantee faithfulness — prosperity can lead to spiritual decline.</p>'},
  {lb:'Lessons from all OT leaders',dr:dQ5,ht:'<p>Key lessons for WAEC essays: (1) True leaders are called and equipped by God. (2) Humility, obedience and faith are essential qualities. (3) Even great leaders fail — what matters is their response (David repented; Saul did not). (4) Disobedience has consequences — Saul lost his throne; Solomon\'s sin divided the kingdom. (5) God can use unlikely people — Gideon, Deborah. (6) Leadership is service to God and people, not self-promotion.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'What did Solomon ask God for at Gibeon?',o:['Long life and riches','Power over enemies','A wise and discerning heart to govern the people','A son to succeed him'],a:3,w:'1 Kings 3:9 — Solomon asked for "a discerning heart to govern your people and to distinguish between right and wrong."'},{q:'How many years did it take Solomon to build the temple?',o:['3 years','5 years','7 years','13 years'],a:3,w:'1 Kings 6:38 — the temple took 7 years to build. (His palace took 13 years — 1 Kings 7:1)'},{q:'What was Solomon\'s greatest sin that led to the kingdom dividing?',o:['He taxed the people too heavily','He married foreign wives who turned his heart to other gods','He refused to fight Israel\'s enemies','He abandoned the temple worship'],a:2,w:'1 Kings 11:3-4 — his many foreign wives turned his heart after other gods — directly against God\'s command.'},{q:'Which quality made David a leader "after God\'s own heart" despite his failures?',o:['His military victories','His musical talent','His genuine repentance and heart for God','His loyalty to Samuel'],a:3,w:'Acts 13:22 — "a man after my own heart." David\'s defining quality was his genuine repentance and love for God (Ps 51).'},{q:'What did Solomon write, reflecting his God-given wisdom?',o:['Psalms only','Proverbs','The Torah','The book of Judges'],a:2,w:'Solomon is credited with writing much of the book of Proverbs, along with Ecclesiastes and Song of Songs.'},{q:'According to 1 Kings 3, what pleased God about Solomon\'s request?',o:['He asked for personal gain','He asked to govern the people well, not for personal gain','He asked for military power','He asked for long life'],a:2,w:'1 Kings 3:9-11 — God was pleased that Solomon asked for wisdom to govern rather than riches.'},{q:'How did Solomon\'s kingdom become divided after his death?',o:['It was conquered by Egypt','It divided under his son Rehoboam because of Solomon\'s sin','It was united further','It was renamed Israel'],a:2,w:'1 Kings 11-12 — the kingdom split under Rehoboam as judgment for Solomon\'s idolatry.'},{q:'What is Solomon especially remembered for in Scripture, besides his reign?',o:['His poverty','His great wisdom and riches','His military conquests','His prophetic writings only'],a:2,w:'1 Kings 3-10 — Solomon is remembered above all for his God-given wisdom and great riches.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 Old Testament',ti:'Qualities of Good Leadership',su:'Identify and explain the qualities of good biblical leadership.',steps:[
  {lb:'Called by God',dr:dQ6,ht:'<p>All great OT leaders were called by God — not self-appointed. Moses at the burning bush (Ex 3). Gideon by the angel (Judg 6). Samuel by God\'s voice in the night (1 Sam 3). David anointed by Samuel (1 Sam 16). A key WAEC principle: biblical leaders receive their authority from God, not from popular vote or force alone. This means they are accountable to God for how they lead.</p>'},
  {lb:'Humility',dr:dQ6,ht:'<p>The greatest OT leaders were humble: Moses — "most humble man on earth" (Num 12:3). Gideon — "my clan is the weakest, I am the least" (Judg 6:15). David — shepherd boy, youngest son (1 Sam 16:11). Samuel — dedicated before birth, raised in service (1 Sam 1-3). Jesus echoed this: <em>"Whoever wants to become great among you must be your servant"</em> (Matt 20:26). Pride brought down Saul and Solomon.</p>'},
  {lb:'Obedience to God\'s word',dr:dQ6,ht:'<p>Every leader\'s success depended on obedience. Joshua 1:8 — <em>"Keep this Book of the Law always on your lips; meditate on it day and night... then you will be prosperous and successful."</em> Saul\'s downfall: partial obedience (1 Sam 15). Samuel\'s verdict: <em>"To obey is better than sacrifice"</em> (1 Sam 15:22). God measures leaders not by achievements but by faithfulness to His word.</p>'},
  {lb:'Care for the people',dr:dQ6,ht:'<p>Good OT leaders cared for those they led. Moses interceded for Israel repeatedly — even when they rebelled (Ex 32:11-13). Samuel declared: "Far be it from me that I should sin against the Lord by failing to pray for you" (1 Sam 12:23). David tended his sheep faithfully before ruling a nation (Ps 78:70-72). Leadership is sacrifice — putting others\' welfare before your own.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryItMC(function(){var qs=[{q:'What quality does Numbers 12:3 say Moses had above all others?',o:['Courage','Wisdom','Humility','Patience'],a:3,w:'Numbers 12:3 — "Moses was a very humble man, more humble than anyone else on the face of the earth."'},{q:'Joshua 1:8 commands Joshua to meditate on the Law day and night. Why?',o:['To memorise it for teaching','So he will be prosperous and successful','To please the priests','To impress the people'],a:2,w:'Joshua 1:8 — "then you will be prosperous and successful" — obedience to God\'s word is the key to effective leadership.'},{q:'1 Samuel 15:22 says "To obey is better than..." what?',o:['To understand','Sacrifice','To pray','To fast'],a:2,w:'1 Samuel 15:22 — "To obey is better than sacrifice, and to heed is better than the fat of rams."'},{q:'Samuel said in 1 Samuel 12:23 that failing to pray for the people would be:',o:['Acceptable if busy','Wise stewardship of time','A sin against the Lord','Not his responsibility'],a:3,w:'1 Samuel 12:23 — "Far be it from me that I should sin against the Lord by failing to pray for you."'},{q:'What leadership quality is emphasised in Joshua 1:7 alongside courage?',o:['Wealth','Careful obedience to God\'s law','Popularity','Military strategy alone'],a:2,w:'Joshua 1:7 — be strong and very courageous, careful to obey all the law.'},{q:'According to Deuteronomy 17:17, what should a king not accumulate in excess?',o:['Wives, horses, silver and gold','Servants only','Land only','Scrolls'],a:1,w:'Deuteronomy 17:17 warns kings against accumulating excessive wives, horses, silver and gold.'},{q:'What leadership trait did both Joseph and Daniel display while serving foreign rulers?',o:['Rebellion','Integrity and faithfulness under pressure','Silence and passivity','Compromise with idolatry'],a:2,w:'Both Joseph and Daniel maintained integrity and faithfulness while serving pagan rulers.'},{q:'Why is prayer for the people a leadership responsibility, according to 1 Samuel 12:23?',o:['It is optional for busy leaders','Failing to pray is a sin against the Lord','Only priests should pray','It has no spiritual value'],a:2,w:'1 Samuel 12:23 — Samuel said failing to pray for the people would be a sin against the Lord.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 Old Testament',ti:'Failures of Leadership',su:'Learn from the failures of OT leaders and their consequences.',steps:[
  {lb:'Saul\'s disobedience',dr:dQ7,ht:'<p>Saul\'s failures: (1) Offering sacrifice without Samuel (1 Sam 13) — showed impatience and disobedience. (2) Sparing King Agag and the best livestock instead of destroying everything (1 Sam 15) — partial obedience is disobedience. Samuel\'s verdict: "You have rejected the word of the Lord, and the Lord has rejected you as king" (1 Sam 15:23). Saul later became troubled, jealous of David, and consulted a medium (1 Sam 28) — spiralling decline.</p>'},
  {lb:'David\'s sin',dr:dQ7,ht:'<p>2 Samuel 11 — David committed two grave sins: adultery with Bathsheba (wife of Uriah) and arranging Uriah\'s death in battle. Nathan the prophet confronted David through a parable (2 Sam 12). David confessed: "I have sinned against the Lord" (12:13). Consequences: the baby died; the sword never departed from David\'s house; his son Absalom rebelled. Yet David genuinely repented (Psalm 51) and God forgave him — he remained king and in the covenant line.</p>'},
  {lb:'Solomon\'s spiritual decline',dr:dQ7,ht:'<p>Solomon began well but ended badly. 1 Kings 11 — his many foreign wives led him into idolatry. He built shrines to Chemosh and Molech on the Mount of Olives. God\'s judgment: the kingdom would be torn from his son. Only Judah would remain (for David\'s sake). Consequences lasted for centuries — the divided kingdom was a direct result of Solomon\'s unfaithfulness. Warning: great blessing and wisdom do not guarantee immunity from temptation.</p>'},
  {lb:'Lessons from failure',dr:dQ7,ht:'<p>Key lessons from leadership failures: (1) Partial obedience is disobedience (Saul). (2) Position and prosperity do not protect from temptation (Solomon). (3) Sin has lasting consequences even when forgiven (David). (4) Repentance is always possible and God always forgives the truly repentant (David vs Saul — Saul did not genuinely repent). (5) Leaders are more, not less, accountable to God for their actions. (6) Guard the heart — Solomon\'s heart was turned; David\'s was restored.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{q:'What was Saul\'s first sin that led to his rejection as king?',o:['Marrying a foreign wife','Consulting the medium at Endor','Offering sacrifice himself without waiting for Samuel','Befriending David'],a:3,w:'1 Samuel 13 — Saul offered the burnt offering himself because Samuel was delayed.'},{q:'Who confronted David about his sin with Bathsheba?',o:['Samuel','Joab','Nathan the prophet','Abigail'],a:3,w:'2 Samuel 12 — Nathan the prophet confronted David through the parable of the stolen lamb.'},{q:'What was the most immediate consequence of David\'s sin?',o:['He was removed as king','The baby Bathsheba bore to David died','He was exiled to the wilderness','His army deserted him'],a:2,w:'2 Samuel 12:18 — the child that Uriah\'s wife bore to David died — the first of several consequences.'},{q:'The key difference between Saul\'s and David\'s failures was:',o:['David\'s sins were less serious','Saul had more enemies','David genuinely repented; Saul did not','David had more support from the people'],a:3,w:'David said "I have sinned" and wrote Psalm 51. Saul made excuses and sought to justify himself (1 Sam 15:20-21).'},{q:'What led Saul to consult the medium at Endor before his final battle?',o:['He wanted entertainment','God had stopped answering him through normal means','Samuel told him to','It was a royal custom'],a:2,w:'1 Samuel 28 — God no longer answered Saul by dreams, Urim, or prophets, so he turned to the medium.'},{q:'What sin did David commit against Uriah after his adultery with Bathsheba?',o:['He exiled Uriah','He arranged for Uriah to be killed in battle','He imprisoned Uriah','He demoted Uriah'],a:2,w:'2 Samuel 11 — David arranged for Uriah to be killed in battle to cover his sin.'},{q:'What was the ultimate result of Solomon\'s idolatry for the kingdom?',o:['The kingdom split into two after his death','The temple was destroyed immediately','Solomon lost the throne while alive','Egypt conquered Israel'],a:1,w:'1 Kings 11-12 — as judgment for Solomon\'s idolatry, the kingdom split after his death.'},{q:'What common failure pattern do Saul and Solomon share?',o:['Both refused the throne','Both turned away from wholehearted obedience despite early promise','Both were killed by enemies','Both refused to marry'],a:2,w:'Both Saul and Solomon began well but turned away from wholehearted obedience to God.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 Old Testament',ti:'Leadership and Modern Application',su:'Apply OT leadership principles to leadership today.',steps:[
  {lb:'Leadership is service',dr:dQ8,ht:'<p>The defining principle of biblical leadership is service — not self-promotion. Moses served for 40 years in the wilderness, patient with a complaining people. David served as a shepherd before serving as king. Jesus (the fulfillment of all OT types of leadership) said: <em>"The Son of Man did not come to be served, but to serve"</em> (Mark 10:45). Application: good leaders in school, community and nation serve others first.</p>'},
  {lb:'Integrity in leadership',dr:dQ8,ht:'<p>Joseph\'s integrity in Potiphar\'s house (resisting temptation when no one was watching) ultimately led to his promotion. Daniel\'s integrity under Babylonian rule led to his vindication (Dan 6). Modern application: leaders must be trustworthy in private before they can be trusted in public. Corruption and dishonesty in leadership (common in Nigeria and Africa) directly contradict biblical leadership principles.</p>'},
  {lb:'Accountability to God',dr:dQ8,ht:'<p>All OT leaders were accountable to God — not just to the people. Samuel judged Israel but was accountable to God (1 Sam 12). Kings were supposed to keep a copy of the law and read it daily (Deut 17:18-20). When leaders forget their accountability to God, they abuse their power. Application: Christian leaders in politics, business and church must remember they will answer to God for their stewardship of power.</p>'},
  {lb:'Lessons for young leaders today',dr:dQ8,ht:'<p>From OT leadership: (1) Character matters more than charisma — God looks at the heart. (2) Obedience to God\'s word is the foundation of effective leadership. (3) Humility — acknowledge your weaknesses and depend on God\'s strength. (4) Prayer and intercession — Samuel\'s example. (5) Courage — Joshua\'s example. (6) Forgiveness — Joseph\'s example. (7) When you fail, repent genuinely and return to God — David\'s example.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{q:'Mark 10:45 says the Son of Man came not to be served but to:',o:['Rule and reign','Serve and give His life as a ransom','Teach and preach','Judge the nations'],a:2,w:'Mark 10:45 — "the Son of Man did not come to be served, but to serve, and to give his life as a ransom for many."'},{q:'Deuteronomy 17:18-20 required kings to:',o:['Build a temple immediately','Tax the people fairly','Keep a copy of the law and read it daily','Consult the priests before every decision'],a:3,w:'Deuteronomy 17:18-19 — kings were to write a copy of the law and read it all the days of their life.'},{q:'Which OT leader best demonstrates integrity under pressure when no one is watching?',o:['Saul','Gideon','Joseph','Solomon'],a:3,w:'Joseph resisted Potiphar\'s wife (Gen 39:9) and maintained integrity even in slavery and prison — no one but God was watching.'},{q:'What application can we draw from Gideon\'s 300-man victory for leadership today?',o:['Larger teams always win','True strength comes from God, not human numbers or resources','Leaders must always test their plans','Prayer is unnecessary if you have the right strategy'],a:2,w:'Judges 7 — God reduced the army so Israel could not boast. True effectiveness in leadership comes from God\'s power, not human resources.'},{q:'What servant-leadership model did Jesus give in John 13, washing His disciples\' feet?',o:['Leaders should be served first','Leaders should serve those they lead','Only servants wash feet','Washing feet was a Roman custom only'],a:2,w:'John 13:1-17 — Jesus modelled servant-leadership by washing His disciples\' feet.'},{q:'What modern leadership lesson comes from Joseph\'s forgiveness of his brothers?',o:['Leaders should seek revenge','True leaders release bitterness and use their position for good','Forgiveness is a sign of weakness','Leaders should avoid family entirely'],a:2,w:'Genesis 45 & 50 — Joseph forgave his brothers and used his position to save many lives.'},{q:'What does Deborah\'s example teach about leadership and gender in the OT?',o:['Only men can lead God\'s people','God can raise up capable leaders regardless of gender','Women could only prophesy, not lead','Deborah was an exception never repeated'],a:2,w:'Judges 4 — Deborah led Israel as judge and prophetess, showing God can raise up capable leaders of either gender.'},{q:'What modern application comes from David\'s repentance in Psalm 51?',o:['Leaders should hide their sins','Leaders should take responsibility and seek forgiveness','Leaders should resign immediately after any sin','Repentance is unnecessary for leaders'],a:2,w:'Psalm 51 shows genuine repentance — leaders should take responsibility rather than make excuses.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 Old Testament',ti:'WAEC Exam Preparation — Leadership',su:'Practise WAEC-style questions on OT leadership.',steps:[
  {lb:'WAEC essay structure for leadership',dr:dQ9,ht:'<p>For WAEC leadership questions: (1) Introduce the leader briefly. (2) Describe their call/appointment. (3) Narrate their key achievements. (4) Mention their failures (if relevant). (5) State leadership qualities shown. (6) Draw lessons for today. Common questions: "Describe the leadership qualities of Moses" / "What lessons can Christians learn from David\'s kingship?" / "Narrate Joseph\'s story and state lessons."</p>'},
  {lb:'Key facts to memorise',dr:dQ1,ht:'<p>WAEC fact bank: Joseph sold for 20 pieces of silver. Moses: "I AM WHO I AM" (Ex 3:14). Humblest man: Moses (Num 12:3). Joshua 1:9 — strong and courageous. Deborah: only female judge (Judg 4:4). Gideon\'s army reduced to 300. Samuel: "Speak Lord, servant listening" (1 Sam 3:9). Saul: "impressive, head taller." David: "man after God\'s heart" (Acts 13:22). Solomon: asked for wisdom; 7 years to build temple; 700 wives.</p>'},
  {lb:'Comparing leaders — exam tips',dr:dQ9,ht:'<p>When WAEC asks you to compare leaders: use a structure: Name → Background → Call → Key act → Failure/strength → Lesson. Never mix up leaders\' stories. Common mistakes: saying Moses parted the Jordan (it was Joshua), saying Gideon had 300 camels (it was 300 men with trumpets and torches), saying David built the temple (it was Solomon). Double-check names, numbers and books.</p>'},
  {lb:'Drawing lessons — key patterns',dr:dQ9,ht:'<p>Standard WAEC lessons from OT leaders: Obedience is essential (Saul\'s failure). Humility opens doors (Joseph, Moses, David all began lowly). God uses unlikely people (Gideon, David, Deborah). Prayer is vital (Samuel, Moses). Repentance restores (David). Prosperity can lead to spiritual decline (Solomon). God\'s presence is the key to leadership success (Josh 1:9 — "the Lord your God will be with you wherever you go").</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{q:'Who was the only female judge mentioned in the book of Judges?',o:['Ruth','Miriam','Deborah','Huldah'],a:3,w:'Judges 4:4 — Deborah, a prophetess and wife of Lappidoth, was leading (judging) Israel.'},{q:'Samuel\'s response when God called him in the night was:',o:['Who are you, Lord?','Here am I — Speak, Lord, your servant is listening','I am not worthy','I will obey'],a:2,w:'1 Samuel 3:9-10 — "Speak, Lord, for your servant is listening."'},{q:'What was the key sign of God\'s rejection of Saul as king?',o:['Samuel stopped visiting him','The Spirit of God left him and an evil spirit troubled him','His army deserted him','God refused to answer his prayers'],a:2,w:'1 Samuel 16:14 — "Now the Spirit of the Lord had departed from Saul, and an evil spirit from the Lord tormented him."'},{q:'What was Solomon\'s wisest act at the beginning of his reign?',o:['Building the temple immediately','Asking God for wisdom to govern the people','Forming alliances with Egypt','Writing the book of Proverbs'],a:2,w:'1 Kings 3:9 — Solomon asked for "a discerning heart to govern your people." God commended this request.'},{q:'For WAEC essay questions on leadership, what should students always include with named leaders?',o:['General opinions only','Specific Bible references','Only the leader\'s name','A list of kings'],a:2,w:'WAEC awards marks for specific, correctly cited Bible references alongside named leaders.'},{q:'What leadership failure caused Moses to be barred from entering the Promised Land?',o:['He worshipped an idol','He struck the rock instead of speaking to it','He refused to lead the people','He doubted God\'s power entirely'],a:2,w:'Numbers 20:10-12 — Moses struck the rock in anger instead of speaking to it as commanded.'},{q:'Which quality is most praised in Joseph\'s leadership under Pharaoh?',o:['His wealth','His integrity and wise administration','His military victories','His age'],a:2,w:'Joseph\'s integrity and wise administration during the famine are especially praised.'},{q:'What is the key contrast WAEC examiners look for between Saul and David\'s failures?',o:['Saul was younger','Genuine repentance versus excuse-making','David had no sin','Saul had more followers'],a:2,w:'The key contrast is David\'s genuine repentance (Psalm 51) versus Saul\'s excuse-making.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 Old Testament',ti:'Mixed Questions — OT Leadership',su:'Integrated revision across all OT leadership topics.',steps:[
  {lb:'Full leader summary',dr:dQ10,ht:'<p>Joseph (Gen 37-50): integrity, forgiveness, providence. Moses (Ex 3 — Deut 34): humility, obedience, lawgiver. Joshua (Josh 1-24): courage, faith, obedience. Deborah (Judg 4-5): wisdom, faith, female judge. Gideon (Judg 6-8): unlikely deliverer, God\'s strength. Samuel (1 Sam 1-16): faithful prophet-judge, intercession. Saul (1 Sam 9-31): disobedience, rejected. David (1 Sam 16 — 2 Sam): heart for God, repentance. Solomon (1 Kings 1-11): wisdom, temple, spiritual decline.</p>'},
  {lb:'Key scripture references',dr:dQ1,ht:'<p>Gen 50:20 (Joseph — providence). Ex 3:14 (Moses — I AM). Num 12:3 (Moses — humble). Josh 1:9 (Joshua — courage). Judg 4:4 (Deborah — judge). Judg 7:7 (Gideon — 300). 1 Sam 3:9 (Samuel — listening). 1 Sam 15:22 (Saul — obey better than sacrifice). 1 Sam 16:7 (God looks at heart). Acts 13:22 (David — after God\'s heart). 1 Kings 3:9 (Solomon — wisdom). 1 Kings 11:3 (Solomon — turned by wives). Ps 51 (David — repentance).</p>'},
  {lb:'Themes across all leaders',dr:dQ10,ht:'<p>Common themes: (1) God calls the unlikely and unqualified. (2) Success depends on obedience to God, not natural ability. (3) Great achievements do not prevent spiritual failure. (4) Genuine repentance restores; pride and excuses do not. (5) Intercession is a key leadership responsibility. (6) God\'s presence is the decisive factor (Josh 1:9; Gen 39:23 — "the Lord was with Joseph"). (7) Leadership is ultimately about serving God\'s purposes, not personal ambition.</p>'},
  {lb:'WAEC final tips',dr:dQ9,ht:'<p>Common WAEC mistakes to avoid: Saying Moses entered the Promised Land (he did not — Deut 34). Saying Gideon had 300 horsemen (trumpets and torches, no horses in that battle). Saying Solomon built the ark (Noah built the ark; Solomon built the temple). Saying Saul repented (he made excuses). Confusing 1 Samuel events with 2 Samuel (David\'s reign). Always cite the Bible book and chapter when you can.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'Which leader said "As for me and my household, we will serve the Lord"?',o:['Moses','David','Samuel','Joshua'],a:4,w:'Joshua 24:15 — Joshua made this declaration at the covenant renewal at Shechem.'},{q:'Which quality distinguished David from Saul after both sinned?',o:['David never sinned as badly','David had more powerful friends','David genuinely repented; Saul made excuses','David was physically stronger'],a:3,w:'David said "I have sinned" (2 Sam 12:13) and wrote Psalm 51. Saul justified himself (1 Sam 15:20-21) rather than truly repenting.'},{q:'Genesis 39:23 says about Joseph in prison: "The Lord was with Joseph and..."',o:['protected him from all harm','gave him favour and success in whatever he did','kept him from being punished','sent an angel to guard him'],a:2,w:'Genesis 39:23 — "The Lord was with him; he showed him kindness and granted him favour in the eyes of the prison warden."'},{q:'What was unique about Deborah\'s leadership among the OT judges?',o:['She was the only judge to win a battle','She was the only judge who was also a priest','She was a woman leading Israel as judge and prophetess','She served for the longest period'],a:3,w:'Deborah was the only female judge in Israel — Judges 4:4 describes her as a prophetess who led Israel.'},{q:'Which leader is described as the humblest man on earth, according to Numbers 12:3?',o:['Moses','Joshua','Samuel','David'],a:1,w:'Numbers 12:3 — Moses was more humble than anyone else on the face of the earth.'},{q:'Which king asked God for wisdom rather than riches or long life?',o:['Saul','David','Solomon','Rehoboam'],a:3,w:'1 Kings 3:9 — Solomon asked God for a wise and discerning heart.'},{q:'Which leader used only 300 men to defeat a vast Midianite army?',o:['Joshua','Gideon','Samson','Barak'],a:2,w:'Judges 7 — Gideon defeated the Midianites with just 300 men.'},{q:'What did God say about Moses\' uniqueness among prophets, in Deuteronomy 34:10?',o:['He performed the fewest miracles','No prophet like him arose, since the Lord knew him face to face','He was the tallest prophet','He wrote the most books'],a:2,w:'Deuteronomy 34:10 — no prophet like Moses arose, whom the Lord knew face to face.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
