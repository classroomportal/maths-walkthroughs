<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1A5276',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
    return;
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Spiritual Gifts',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,56,'Source: Spirit-given (1 Cor 12:1-11)',DARK,10,'middle',false));o.push(T(240,74,'Gift lists: Rom 12, 1 Cor 12, Eph 4','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,44,CRM,ACC,1.5));o.push(T(240,110,'Utterance gifts: prophecy, tongues, interpretation',DARK,10,'middle',false));o.push(T(240,128,'Wisdom, knowledge, faith, healing, miracles','#555',9,'middle',false));}
if(p>=3){o.push(R(10,146,460,44,CRM,ACC,1.5));o.push(T(240,164,'Service gifts: helps, leadership, giving, mercy',DARK,10,'middle',false));o.push(T(240,182,'Purpose: common good, edification (1 Cor 12:7)','#555',9,'middle',false));}
if(p>=4){o.push(R(10,200,460,60,CRM,ACC,1));o.push(T(240,218,'Order: 1 Cor 14 — "fitting and orderly way"',DARK,10,'middle',false));o.push(T(240,236,'Discovering/using gifts in love (1 Cor 12:31)','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Key Gifts and References',ACC,12,'middle',true));
[['1 Cor 12:1-11','Meaning and Spirit-given source'],['Gift lists','Rom 12:6-8; 1 Cor 12:8-10; Eph 4:11'],['Utterance gifts','Prophecy, tongues, interpretation'],['Service gifts','Helps, leadership, giving, mercy'],['1 Cor 14','Order in worship — tongues/prophecy regulated']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(120,46+i*32,r[0],ACC,9,'middle',true));o.push(T(320,46+i*32,r[1],'#444',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Spiritual Gifts — Summary',ACC,13,'middle',true));
[['1 Cor 12:1-11','Meaning and source of gifts'],['Rom 12 / 1 Cor 12 / Eph 4','The three gift lists'],['Utterance gifts','Prophecy, tongues, interpretation'],['Power gifts','Wisdom, knowledge, faith, healing, miracles'],['Service gifts','Helps, leadership, giving, mercy'],['1 Cor 12:7 / Eph 4:12-13','Purpose: common good, edification'],['1 Cor 14 / 1 Peter 4:10-11','Order in worship; faithful stewardship']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(300,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS • Acts & Epistles',ti:'The Meaning and Source of Spiritual Gifts',su:'Define spiritual gifts and explain their divine source in 1 Corinthians 12.',steps:[
{lb:'What are spiritual gifts?',dr:dQ1,ht:'<p><b>Spiritual gifts</b> are supernatural abilities given by the <b>Holy Spirit</b> to believers, not for personal benefit, but for the good of the wider Christian community (1 Corinthians 12:1, 7).</p>'},
{lb:'Only the Spirit enables genuine confession',dr:dQ1,ht:'<p>Paul notes in <b>1 Corinthians 12:3</b> that no one can genuinely say <em>"Jesus is Lord"</em> except by the Holy Spirit &mdash; contrasting Spirit-inspired confession with counterfeit or misleading spiritual claims.</p>'},
{lb:'One Spirit, varied expressions',dr:dQ1,ht:'<p><b>1 Corinthians 12:4-6</b> emphasises that there are different kinds of <b>gifts</b>, different kinds of <b>service</b>, and different kinds of <b>working</b>, but the same Spirit, same Lord, and same God are behind all of them.</p>'},
{lb:'Distributed as the Spirit determines',dr:dQ1,ht:'<p><b>1 Corinthians 12:11</b> states that the Spirit distributes gifts "to each one, just as he determines" &mdash; meaning gifts are given by God\'s <b>sovereign choice</b>, not earned through human merit or simply chosen by the believer.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What are spiritual gifts, according to this lesson?","o":["Supernatural abilities given by the Holy Spirit for the good of the community","Natural talents earned entirely through personal effort","Rewards given only to church leaders","Abilities given for purely personal benefit"],"a":0,"w":"Spiritual gifts are supernatural abilities given by the Holy Spirit for the good of the community."},{"q":"According to 1 Corinthians 12:3, who alone enables genuine confession that \"Jesus is Lord\"?","o":["Any human effort alone","The Holy Spirit","Only ordained church leaders","Only those with the gift of tongues"],"a":1,"w":"Only the Holy Spirit enables genuine confession that Jesus is Lord, according to 1 Corinthians 12:3."},{"q":"What does 1 Corinthians 12:4-6 emphasise about gifts, service and working?","o":["They come from different, competing spiritual sources","They are all identical, with no real diversity","Different kinds, but the same Spirit, Lord and God behind them all","Only one type of gift actually exists"],"a":2,"w":"1 Corinthians 12:4-6 emphasises different kinds of gifts, service and working, but the same Spirit, Lord and God."},{"q":"Who distributes spiritual gifts, according to 1 Corinthians 12:11?","o":["No one — gifts appear randomly with no source","Believers, choosing for themselves","Church leaders, by formal appointment","The Spirit, as he determines"],"a":3,"w":"The Spirit distributes gifts to each believer, just as he determines, according to 1 Corinthians 12:11."},{"q":"Are spiritual gifts earned through human merit, according to this lesson?","o":["No, they are given by God's sovereign choice","Yes, only the most devoted believers ever receive any gift","Yes, gifts are purchased through financial giving","No gifts are actually given to any believer"],"a":0,"w":"Spiritual gifts are given by God's sovereign choice, not earned through human merit."},{"q":"For whose benefit are spiritual gifts primarily given, according to 1 Corinthians 12:7?","o":["Purely personal, private benefit","The good of the wider Christian community","Only the benefit of church leaders","No one's benefit in particular"],"a":1,"w":"Spiritual gifts are given primarily for the good of the wider Christian community, according to 1 Corinthians 12:7."},{"q":"What contrast does Paul draw in 1 Corinthians 12:1-3?","o":["A contrast between Jewish and Gentile believers","A contrast between rich and poor believers","Spirit-inspired confession versus counterfeit or misleading spiritual claims","A contrast between men and women"],"a":2,"w":"Paul draws a contrast between genuine Spirit-inspired confession and counterfeit or misleading spiritual claims."},{"q":"What overall picture does 1 Corinthians 12:1-11 give of spiritual gifts?","o":["Abilities that have nothing to do with the Holy Spirit","A random, disorganised set of abilities with no common source","Abilities available only to a select few super-Christians","A Spirit-given diversity of abilities, unified by their common divine source"],"a":3,"w":"This passage gives a picture of Spirit-given diversity, unified by their common divine source."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS • Acts & Epistles',ti:'The New Testament Gift Lists',su:'Examine the lists of spiritual gifts in Romans 12, 1 Corinthians 12 and Ephesians 4.',steps:[
{lb:'Romans 12:6-8',dr:dQ2,ht:'<p><b>Romans 12:6-8</b> lists gifts including <b>prophecy, serving, teaching, encouraging, giving, leadership</b> and <b>mercy</b> &mdash; each to be exercised according to the grace given and in proportion to one\'s faith.</p>'},
{lb:'1 Corinthians 12:8-10',dr:dQ2,ht:'<p><b>1 Corinthians 12:8-10</b> lists a further set: the <b>message of wisdom</b>, the <b>message of knowledge</b>, faith, gifts of <b>healing</b>, miraculous powers, prophecy, distinguishing between spirits, <b>tongues</b>, and interpretation of tongues.</p>'},
{lb:'Ephesians 4:11',dr:dQ2,ht:'<p><b>Ephesians 4:11</b> lists gifts of leadership and office: <b>apostles, prophets, evangelists, and pastors and teachers</b>, given specifically to equip believers for works of service and build up the body of Christ.</p>'},
{lb:'Illustrative, not exhaustive',dr:dQ2,ht:'<p>These three lists are not identical, and scholars generally agree they are <b>illustrative rather than exhaustive</b> &mdash; representative examples of the Spirit\'s diverse work, not an exclusive, closed catalogue of every possible gift.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"Which of these gifts is listed in Romans 12:6-8?","o":["Encouraging","Distinguishing between spirits","Apostleship","Interpretation of tongues"],"a":0,"w":"Encouraging is listed among the gifts in Romans 12:6-8."},{"q":"Which of these gifts is listed in 1 Corinthians 12:8-10?","o":["Leadership","Tongues","Evangelism","Giving"],"a":1,"w":"Tongues are listed among the gifts in 1 Corinthians 12:8-10."},{"q":"Which of these gifts is listed in Ephesians 4:11?","o":["Healing and miracles","Serving and giving","Apostles and prophets","Wisdom and knowledge"],"a":2,"w":"Apostles and prophets are listed among the gifts in Ephesians 4:11."},{"q":"What is the specific purpose given for the gifts listed in Ephesians 4:11?","o":["To provide entertainment for church gatherings","To give certain believers permanent superiority over others","To replace the need for any other spiritual gift","To equip believers for works of service and build up the body of Christ"],"a":3,"w":"Ephesians 4:11's gifts are given to equip believers for service and build up the body of Christ."},{"q":"Are the three New Testament gift lists identical to one another?","o":["No, they differ, though they overlap in some areas","Yes, they are word-for-word identical","No, only one list is genuinely inspired Scripture","Yes, but only in the original Greek text"],"a":0,"w":"The three lists are not identical to one another, though they overlap in some areas."},{"q":"How do most scholars view these gift lists, according to this lesson?","o":["As a complete, closed catalogue with no other gifts possible","As illustrative rather than exhaustive","As entirely symbolic, with no real spiritual gifts existing","As applicable only to the first-century church, never since"],"a":1,"w":"Most scholars view these lists as illustrative rather than exhaustive."},{"q":"According to Romans 12:6, how should gifts be exercised?","o":["Only in public settings, never privately","Only by church leaders, never by ordinary believers","According to the grace given and in proportion to one's faith","Only once in a person's entire lifetime"],"a":2,"w":"Romans 12:6 says gifts should be exercised according to the grace given and in proportion to faith."},{"q":"What overall conclusion should be drawn from comparing all three gift lists together?","o":["Ephesians 4:11 is the only list relevant to ordinary believers","Only Romans 12's list is theologically valid","The lists contradict each other and cannot be reconciled","The Spirit works in diverse, representative ways not limited to any single list"],"a":3,"w":"Comparing all three lists shows the Spirit works in diverse, representative ways, not limited to any single list."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS • Acts & Epistles',ti:'Gifts of Utterance: Prophecy and Tongues',su:'Explain the gifts of prophecy, tongues and interpretation of tongues.',steps:[
{lb:'The gift of prophecy',dr:dQ1,ht:'<p>The gift of <b>prophecy</b> is Spirit-inspired speech given for <b>"strengthening, encouraging and comfort"</b> (1 Corinthians 14:3) &mdash; Paul explicitly ranks it above tongues in value for the gathered church, since it is immediately understandable.</p>'},
{lb:'The gift of tongues',dr:dQ1,ht:'<p>The gift of <b>tongues</b> involves speaking in a language unknown to the speaker; Paul notes that without <b>interpretation</b>, such speech edifies only the speaker personally, not the wider congregation (1 Corinthians 14:2-4).</p>'},
{lb:'The gift of interpretation',dr:dQ1,ht:'<p>The gift of <b>interpretation of tongues</b> allows a message given in tongues to be translated so the whole gathered church can understand and be built up &mdash; making tongues and interpretation naturally <b>paired</b> gifts.</p>'},
{lb:'Paul\'s preference and regulation',dr:dQ1,ht:'<p>Paul states he would rather speak <b>"five intelligible words"</b> to instruct others than "ten thousand words in a tongue" (1 Corinthians 14:19), and instructs that tongues should not be exercised publicly <b>without interpretation</b> (1 Corinthians 14:27-28).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What purpose does 1 Corinthians 14:3 give for the gift of prophecy?","o":["Strengthening, encouraging and comfort","Confusing the congregation deliberately","Only predicting future world events","Only correcting doctrinal errors"],"a":0,"w":"1 Corinthians 14:3 gives strengthening, encouraging and comfort as the purpose of prophecy."},{"q":"Why does Paul rank prophecy above tongues for the gathered church?","o":["Tongues are always more spiritually powerful","Prophecy is immediately understandable to the whole congregation","Prophecy requires no divine inspiration at all","Tongues are forbidden entirely under the New Covenant"],"a":1,"w":"Paul ranks prophecy higher because it is immediately understandable to the whole congregation."},{"q":"What does the gift of tongues involve, according to this lesson?","o":["Interpreting dreams and visions","Speaking only in one's native language with special eloquence","Speaking in a language unknown to the speaker","Healing physical illnesses"],"a":2,"w":"The gift of tongues involves speaking in a language unknown to the speaker."},{"q":"Without interpretation, who does speaking in tongues edify, according to 1 Corinthians 14:2-4?","o":["Only unbelievers present in the room","The entire congregation equally","No one at all, including the speaker","Only the speaker personally"],"a":3,"w":"Without interpretation, speaking in tongues edifies only the speaker personally, according to this passage."},{"q":"What does the gift of interpretation of tongues allow?","o":["A message in tongues to be translated so the whole church understands","A believer to speak fluently in any human language instantly","A believer to interpret dreams accurately","A believer to predict future events with certainty"],"a":0,"w":"Interpretation of tongues allows a message in tongues to be translated so the whole church can understand."},{"q":"Why are tongues and interpretation described as \"naturally paired\" gifts?","o":["They have no real relationship to one another","Interpretation makes a message in tongues understandable and edifying to the church","Tongues are meaningless without any interpretation ever being possible","Interpretation always occurs automatically alongside tongues"],"a":1,"w":"Tongues and interpretation are naturally paired because interpretation makes tongues understandable and edifying."},{"q":"What does Paul say he would rather do, according to 1 Corinthians 14:19?","o":["Speak only in tongues, with no interpretation ever needed","Never speak in tongues under any circumstances","Speak five intelligible words to instruct others than ten thousand words in a tongue","Avoid prophecy entirely in favour of tongues"],"a":2,"w":"Paul says he would rather speak five intelligible words to instruct others than ten thousand words in a tongue."},{"q":"What does Paul instruct regarding the public use of tongues without interpretation?","o":["It requires no regulation of any kind","It should always be encouraged publicly, regardless of interpretation","It should be completely banned in all circumstances","It should not be exercised publicly without interpretation"],"a":3,"w":"Paul instructs that tongues should not be exercised publicly without interpretation, according to 1 Corinthians 14:27-28."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS • Acts & Epistles',ti:'Gifts of Wisdom, Knowledge, Faith, Healing and Miracles',su:'Explain the meaning of the gifts of wisdom, knowledge, faith, healing and miracles.',steps:[
{lb:'The message of wisdom',dr:dQ2,ht:'<p>The <b>"message of wisdom"</b> (1 Corinthians 12:8) is a Spirit-given insight for applying <b>God\'s truth</b> practically to a specific situation, offering guidance beyond ordinary human reasoning.</p>'},
{lb:'The message of knowledge',dr:dQ2,ht:'<p>The <b>"message of knowledge"</b> refers to Spirit-given understanding of facts or truth that would not otherwise be known through natural means &mdash; distinct from wisdom\'s practical application.</p>'},
{lb:'The gift of faith',dr:dQ2,ht:'<p>The <b>gift of faith</b> (1 Corinthians 12:9) refers to an extraordinary measure of trust for a specific situation, beyond the ordinary saving faith every believer possesses &mdash; often connected in Scripture to bold, confident action.</p>'},
{lb:'Gifts of healing and miracles',dr:dQ2,ht:'<p><b>Gifts of healing</b> and <b>miraculous powers</b> involve supernatural acts demonstrating God\'s power, illustrated throughout Acts &mdash; for example, Peter and John\'s healing of a lame beggar at the temple gate (Acts 3:1-10).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"What is the \"message of wisdom,\" as described in this lesson?","o":["Spirit-given insight for applying God's truth practically to a situation","A natural talent for public speaking","A gift limited only to ordained pastors","The ability to memorise Scripture perfectly"],"a":0,"w":"The \"message of wisdom\" is Spirit-given insight for applying God's truth practically to a situation."},{"q":"How does the \"message of knowledge\" differ from wisdom?","o":["It is identical to wisdom in every respect","It refers to understanding facts or truth beyond natural means, distinct from practical application","It refers only to academic education","It has no relationship to the Holy Spirit at all"],"a":1,"w":"The message of knowledge refers to understanding facts or truth beyond natural means, distinct from wisdom's practical application."},{"q":"What does the \"gift of faith\" refer to, distinct from ordinary saving faith?","o":["A gift only given to church founders","The initial faith required for salvation, and nothing more","An extraordinary measure of trust for a specific situation","A gift that guarantees wealth and prosperity"],"a":2,"w":"The gift of faith refers to an extraordinary measure of trust for a specific situation, beyond ordinary saving faith."},{"q":"What do gifts of healing and miracles involve?","o":["Abilities limited only to Old Testament prophets","Only natural medical treatment with no supernatural element","Illusions with no real spiritual significance","Supernatural acts demonstrating God's power"],"a":3,"w":"Gifts of healing and miracles involve supernatural acts demonstrating God's power."},{"q":"Which Acts passage illustrates a gift of healing?","o":["Peter and John healing a lame beggar at the temple gate (Acts 3)","Paul's shipwreck on Malta (Acts 27)","The Jerusalem Council (Acts 15)","Stephen's martyrdom (Acts 7)"],"a":0,"w":"Acts 3 illustrates a gift of healing through Peter and John healing a lame beggar."},{"q":"Where does 1 Corinthians 12:9 place the gift of faith within its list?","o":["Outside the list of spiritual gifts entirely","Among the gifts of the Spirit given for the common good","Only as a requirement for church membership","Only as a description of general belief, unrelated to specific gifts"],"a":1,"w":"1 Corinthians 12:9 places the gift of faith among the gifts of the Spirit given for the common good."},{"q":"What is a key distinguishing feature of these gifts compared to natural human abilities?","o":["They are identical to natural talents with no spiritual dimension","They require years of professional training to develop","They are supernatural, given by the Spirit beyond ordinary human capability","They can be purchased or earned through good behaviour"],"a":2,"w":"These gifts are supernatural, given by the Spirit beyond ordinary human capability."},{"q":"What connects the gift of faith to bold, confident action, according to this lesson?","o":["Faith is unrelated to any specific situation or context","There is no connection between faith and action at all","Faith always leads to passive waiting with no action","Scripture often connects extraordinary faith to courageous action in specific situations"],"a":3,"w":"Scripture often connects extraordinary faith to courageous action in specific situations."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS • Acts & Epistles',ti:'Gifts of Service: Helps, Administration, Giving and Mercy',su:'Explain the practical service-oriented spiritual gifts.',steps:[
{lb:'Serving and helps',dr:dQ1,ht:'<p>The gift of <b>serving</b> (or "helps") involves practical, often behind-the-scenes assistance to others in the church community &mdash; a gift that, while less visible than prophecy or healing, is equally valued by God.</p>'},
{lb:'Leadership and administration',dr:dQ1,ht:'<p>The gift of <b>leadership</b> (Romans 12:8) or "administration" (1 Corinthians 12:28) involves organising, guiding and overseeing the practical work and ministries of the church community effectively.</p>'},
{lb:'Giving with generosity',dr:dQ1,ht:'<p>The gift of <b>giving</b> (Romans 12:8) involves generously sharing material resources with others in need; Paul specifically instructs this gift be exercised <b>"with liberality"</b> &mdash; generously, not grudgingly.</p>'},
{lb:'Showing mercy cheerfully',dr:dQ1,ht:'<p>The gift of <b>mercy</b> (Romans 12:8) involves compassionate care for those who are suffering, sick or in distress; Paul specifically instructs this be done <b>"cheerfully,"</b> not with reluctance or resentment.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What does the gift of \"serving\" or \"helps\" involve?","o":["Practical, often behind-the-scenes assistance to others in the church","Only public preaching and teaching","Only leading formal worship services","Only managing church finances"],"a":0,"w":"Serving or helps involves practical, often behind-the-scenes assistance to others in the church."},{"q":"How is the gift of serving valued compared to more visible gifts like prophecy?","o":["It is far less important and can be ignored","It is equally valued by God, despite being less visible","It is not actually considered a spiritual gift at all","It is only for those who cannot receive any other gift"],"a":1,"w":"The gift of serving is equally valued by God, despite being less visible than gifts like prophecy."},{"q":"What does the gift of leadership/administration involve?","o":["Only performing healing miracles","Only preaching sermons","Organising, guiding and overseeing the church's practical work","Only speaking in tongues"],"a":2,"w":"Leadership/administration involves organising, guiding and overseeing the church's practical work."},{"q":"How does Romans 12:8 say the gift of giving should be exercised?","o":["Only to church leaders, never to ordinary members","Grudgingly and reluctantly","Only in secret, with no accountability","With liberality (generously)"],"a":3,"w":"Romans 12:8 says the gift of giving should be exercised with liberality, generously."},{"q":"What does the gift of giving involve?","o":["Generously sharing material resources with others in need","Only giving money to church buildings","Only giving verbal encouragement, with no material sharing","Only giving to family members"],"a":0,"w":"The gift of giving involves generously sharing material resources with others in need."},{"q":"How does Romans 12:8 say the gift of mercy should be exercised?","o":["Reluctantly and with visible resentment","Cheerfully","Only when publicly recognised for doing so","Only toward fellow church members, never outsiders"],"a":1,"w":"Romans 12:8 says the gift of mercy should be exercised cheerfully."},{"q":"What does the gift of mercy involve?","o":["Only providing legal advice","Only forgiving financial debts","Compassionate care for those who are suffering, sick or in distress","Only organising church events"],"a":2,"w":"The gift of mercy involves compassionate care for those who are suffering, sick or in distress."},{"q":"What common theme unites the gifts of serving, leadership, giving and mercy?","o":["Verbal proclamation and teaching alone","Public visibility and personal recognition","Supernatural, miraculous displays of power","Practical, tangible service to meet the needs of others"],"a":3,"w":"The common theme is practical, tangible service to meet the needs of others."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS • Acts & Epistles',ti:'The Purpose of Spiritual Gifts',su:'Explain why spiritual gifts are given, according to the New Testament.',steps:[
{lb:'For the common good, not private benefit',dr:dQ2,ht:'<p>1 Corinthians 12:7 states that the Spirit\'s manifestation is given to each believer <b>"for the common good"</b> &mdash; gifts are fundamentally oriented toward the benefit of the wider church community, not private spiritual status.</p>'},
{lb:'To build up the church',dr:dQ2,ht:'<p>1 Corinthians 14:12 instructs believers eager for spiritual gifts to <b>"try to excel in gifts that build up the church"</b> &mdash; establishing edification of the community as the measuring standard for evaluating gifts\' proper use.</p>'},
{lb:'To equip believers for works of service',dr:dQ2,ht:'<p>Ephesians 4:12 states that leadership gifts are given <b>"to equip his people for works of service, so that the body of Christ may be built up"</b> &mdash; gifts empower ordinary believers for ministry, not just designated leaders.</p>'},
{lb:'Toward unity and maturity',dr:dQ2,ht:'<p>Ephesians 4:13 states the ultimate goal: that believers reach <b>"unity in the faith,"</b> becoming mature, attaining "the whole measure of the fullness of Christ" &mdash; gifts serve corporate spiritual growth, not individual status or competition.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"According to 1 Corinthians 12:7, for what purpose is the Spirit's manifestation given to each believer?","o":["\"For the common good\"","For private, personal benefit only","For financial gain","For competition among believers"],"a":0,"w":"1 Corinthians 12:7 says the Spirit's manifestation is given \"for the common good.\""},{"q":"What does 1 Corinthians 14:12 instruct believers eager for gifts to do?","o":["Seek only the most impressive and visible gifts","\"Try to excel in gifts that build up the church\"","Compete with other believers for recognition","Avoid using any gift publicly"],"a":1,"w":"1 Corinthians 14:12 instructs believers to excel in gifts that build up the church."},{"q":"What standard does 1 Corinthians 14:12 establish for evaluating the proper use of gifts?","o":["Public recognition and applause","Personal spiritual satisfaction alone","Edification of the community","Financial gain for the user"],"a":2,"w":"Edification of the community is the standard for evaluating the proper use of gifts."},{"q":"According to Ephesians 4:12, what purpose do leadership gifts serve?","o":["To provide financial income for church leaders","To keep all ministry work confined to designated leaders alone","To create a hierarchy with no role for ordinary believers","To equip believers for works of service so the body of Christ is built up"],"a":3,"w":"Leadership gifts equip believers for works of service, so the body of Christ is built up."},{"q":"Who does Ephesians 4:12 say should be empowered for ministry, not just designated leaders?","o":["Ordinary believers, God's people generally","Only apostles and prophets specifically","Only wealthy members of the congregation","No one — only leaders perform ministry"],"a":0,"w":"Ephesians 4:12 shows that ordinary believers, not just designated leaders, should be empowered for ministry."},{"q":"What ultimate goal does Ephesians 4:13 describe for the use of spiritual gifts?","o":["Individual fame and personal recognition","Unity in the faith and mature attainment of the fullness of Christ","Competition to determine the \"best\" gift","Financial prosperity for the church as an institution"],"a":1,"w":"Ephesians 4:13 describes unity in the faith and maturity as the ultimate goal of spiritual gifts."},{"q":"What do spiritual gifts serve, according to this lesson's overall conclusion?","o":["No real purpose at all","Individual status and competition among believers","Corporate spiritual growth, not individual status or competition","Only the private, personal benefit of the gift-holder"],"a":2,"w":"Spiritual gifts serve corporate spiritual growth, not individual status or competition."},{"q":"Why is \"edification\" (building up) considered central to understanding spiritual gifts?","o":["It is a modern concept absent from the New Testament","It has no relevance to spiritual gifts at all","It applies only to the gift of prophecy, not others","It is the consistent standard the New Testament applies for evaluating gifts' proper use"],"a":3,"w":"Edification is the consistent standard the New Testament applies for evaluating the proper use of spiritual gifts."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS • Acts & Epistles',ti:'Order in the Use of Spiritual Gifts',su:'Explain Paul\'s instructions for the orderly exercise of spiritual gifts in worship.',steps:[
{lb:'Disorder in the Corinthian church',dr:dQ1,ht:'<p>Paul addresses evident <b>disorder</b> in the Corinthian church\'s worship gatherings &mdash; multiple people speaking at once, competing for attention, creating confusion rather than edification (1 Corinthians 14).</p>'},
{lb:'Everything for building up',dr:dQ1,ht:'<p>1 Corinthians 14:26 establishes the guiding principle: <em>"When you come together, everyone has a hymn, or a word of instruction... All of these must be done for the strengthening of the church."</em></p>'},
{lb:'Specific regulations for tongues and prophecy',dr:dQ1,ht:'<p>Paul gives specific instructions: tongues should be spoken by <b>only two or three</b>, one at a time, with interpretation; prophets should also speak <b>in turn</b>, one at a time, while others weigh carefully what is said (1 Corinthians 14:27-33).</p>'},
{lb:'Done in a fitting and orderly way',dr:dQ1,ht:'<p>1 Corinthians 14:40 summarises the whole chapter\'s principle: <em>"everything should be done in a fitting and orderly way"</em> &mdash; balancing genuine openness to the Spirit\'s work with the need for respectful, edifying order.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What problem in the Corinthian church does Paul address in 1 Corinthians 14?","o":["Disorder in worship gatherings, with multiple people speaking at once","A complete absence of any spiritual gifts","A refusal to ever worship together","A dispute over church finances"],"a":0,"w":"Paul addresses disorder in worship, with multiple people speaking at once, causing confusion."},{"q":"What guiding principle does 1 Corinthians 14:26 establish for using spiritual gifts in worship?","o":["Only the most gifted individuals should ever speak","Everything must be done for the strengthening of the church","Gifts should never be used in public gatherings at all","Whoever speaks loudest should be heard first"],"a":1,"w":"1 Corinthians 14:26 establishes that everything must be done for the strengthening of the church."},{"q":"How many people does Paul say should speak in tongues at any one gathering, according to 1 Corinthians 14:27?","o":["Exactly one person only, ever","As many as wish to speak, all at once","Only two or three, one at a time","No one, since tongues are entirely forbidden"],"a":2,"w":"Paul says only two or three should speak in tongues, one at a time, according to 1 Corinthians 14:27."},{"q":"What condition does Paul attach to the public use of tongues?","o":["It must be practised in complete silence","No condition is attached at all","Only church leaders may exercise the gift","Interpretation must be provided"],"a":3,"w":"Paul attaches the condition that interpretation must be provided for the public use of tongues."},{"q":"How does Paul instruct prophets to speak, according to 1 Corinthians 14:29-31?","o":["In turn, one at a time, while others weigh what is said","All at once, competing for the congregation's attention","Only in private, never in public gatherings","Only once in their entire lifetime"],"a":0,"w":"Paul instructs prophets to speak in turn, one at a time, while others weigh what is said."},{"q":"What does 1 Corinthians 14:40 summarise as the guiding principle for the whole chapter?","o":["\"Everything should be done as loudly as possible\"","\"Everything should be done in a fitting and orderly way\"","\"Only apostles may ever speak in church gatherings\"","\"Spiritual gifts should never be exercised publicly\""],"a":1,"w":"1 Corinthians 14:40 summarises that everything should be done in a fitting and orderly way."},{"q":"What balance does Paul aim to strike in his regulation of spiritual gifts?","o":["Total, unregulated freedom with no order at all","Complete suppression of all spiritual gifts","Genuine openness to the Spirit's work with respectful, edifying order","Strict rules with no genuine spiritual openness"],"a":2,"w":"Paul aims to balance genuine openness to the Spirit's work with respectful, edifying order."},{"q":"Why does Paul regulate spiritual gifts rather than simply banning disorderly practices entirely?","o":["He believes gifts should be exercised only by himself personally","He does not actually believe in spiritual gifts at all","He wants to discourage all worship gatherings entirely","He values genuine spiritual gifts but wants them exercised for edification, not confusion"],"a":3,"w":"Paul values genuine spiritual gifts, but wants them exercised for edification rather than confusion."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS • Acts & Epistles',ti:'Discovering and Using One\'s Spiritual Gifts',su:'Explain how believers can discover and faithfully exercise their spiritual gifts.',steps:[
{lb:'Every believer has a gift',dr:dQ2,ht:'<p><b>1 Peter 4:10</b> states, <em>"Each of you should use whatever gift you have received to serve others, as faithful stewards of God\'s grace in its various forms"</em> &mdash; implying every believer, not only certain special individuals, has received at least one gift.</p>'},
{lb:'Discovering one\'s gifts',dr:dQ2,ht:'<p>Discovering spiritual gifts typically involves <b>self-examination</b>, prayerful reflection, actively trying different areas of service, and receiving honest <b>feedback</b> from fellow believers about where one seems particularly effective or fruitful.</p>'},
{lb:'Exercising gifts in love',dr:dQ2,ht:'<p>1 Corinthians 12:31 introduces love as <b>"the most excellent way"</b> to exercise any gift &mdash; showing that gifts must always be used with genuine love for others, never competitively or for personal glorification.</p>'},
{lb:'Faithful stewardship',dr:dQ2,ht:'<p>1 Peter 4:10-11 calls believers to be <b>"faithful stewards"</b> of their gifts, exercising them so that <b>"God may be praised through Jesus Christ"</b> &mdash; framing the use of gifts as ultimately an act of worship and service to God.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{"q":"According to 1 Peter 4:10, who has received a spiritual gift to use in serving others?","o":["Each believer, not only special individuals","Only ordained pastors and apostles","Only the wealthiest members of the church","No believers today — gifts ended with the apostles"],"a":0,"w":"1 Peter 4:10 implies each believer, not only special individuals, has received a gift to use in serving others."},{"q":"What does 1 Peter 4:10 call believers to be, in their use of gifts?","o":["Owners of their gifts, with full personal control","\"Faithful stewards of God's grace\"","Competitors for the most impressive gift","Passive recipients with no responsibility to use their gifts"],"a":1,"w":"1 Peter 4:10 calls believers to be faithful stewards of God's grace in their gifts."},{"q":"What does discovering one's spiritual gifts typically involve, according to this lesson?","o":["Consulting only a fortune teller","Waiting passively with no active effort at all","Self-examination, prayerful reflection, and trying different areas of service","Automatically knowing from birth with no discovery process"],"a":2,"w":"Discovering spiritual gifts typically involves self-examination, prayer, and trying different areas of service."},{"q":"What role can fellow believers play in helping someone discover their spiritual gifts?","o":["Discouraging anyone from ever using their gifts","No role at all — gift discovery is purely private","Only formally testing someone through an official exam","Providing honest feedback about where someone seems effective or fruitful"],"a":3,"w":"Fellow believers can provide honest feedback about where someone seems effective or fruitful in their gift."},{"q":"What does 1 Corinthians 12:31 introduce as \"the most excellent way\" to exercise gifts?","o":["Love","Competition for recognition","Public display for personal glory","Strict rule-following with no personal engagement"],"a":0,"w":"1 Corinthians 12:31 introduces love as the most excellent way to exercise gifts."},{"q":"How should gifts NOT be used, according to this lesson's teaching on love?","o":["In service to others' genuine needs","Competitively or for personal glorification","With genuine humility and care for others","In a manner that builds up the church"],"a":1,"w":"Gifts should not be used competitively or for personal glorification, according to this teaching on love."},{"q":"What ultimate purpose does 1 Peter 4:11 give for the exercise of spiritual gifts?","o":["That the church may compete with other churches","That the gift-holder may gain personal fame","That God may be praised through Jesus Christ","That believers may avoid all forms of service"],"a":2,"w":"1 Peter 4:11 gives the ultimate purpose that God may be praised through Jesus Christ."},{"q":"How does this lesson frame the use of spiritual gifts overall?","o":["As entirely optional, with no real responsibility involved","As a purely private, personal matter with no spiritual significance","As a competition to determine spiritual superiority","As an act of worship and service to God"],"a":3,"w":"The use of spiritual gifts is framed as an act of worship and service to God."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS • Acts & Epistles',ti:'WAEC Exam Preparation — Spiritual Gifts',su:'Practise WAEC-style questions on spiritual gifts.',steps:[
{lb:'WAEC essay structure',dr:dQ1,ht:'<p>For WAEC essays on spiritual gifts: (1) Identify the <b>specific gift or passage</b> asked about. (2) Give the <b>precise Bible reference</b>. (3) Explain the gift\'s <b>meaning and purpose</b> clearly. (4) Draw out a <b>practical application</b> for the church today.</p>'},
{lb:'Common WAEC question patterns',dr:dQ1,ht:'<p>Common patterns include: "List and explain the gifts of the Spirit mentioned in 1 Corinthians 12." / "Discuss the purpose of spiritual gifts in the church." / "Explain Paul\'s instructions for the orderly use of spiritual gifts." / "Why does Paul emphasise love in relation to spiritual gifts?"</p>'},
{lb:'Key references to remember',dr:dQ1,ht:'<p>Key references: <b>1 Corinthians 12:1-11</b> (meaning and source); <b>Romans 12:6-8, 1 Corinthians 12:8-10, Ephesians 4:11</b> (gift lists); <b>1 Corinthians 14</b> (tongues, prophecy, order); <b>1 Corinthians 12:7, Ephesians 4:12-13</b> (purpose); <b>1 Peter 4:10-11</b> (stewardship).</p>'},
{lb:'Balancing gifts and love',dr:dQ1,ht:'<p>WAEC essays should note that spiritual gifts, however impressive, are always to be exercised <b>in love</b> and for the building up of the whole church, not personal status &mdash; a theme running through this entire topic.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{"q":"What is the recommended first step for a WAEC essay on spiritual gifts?","o":["Identify the specific gift or passage asked about","Immediately give a personal opinion with no facts","List unrelated facts with no explanation","Skip straight to a conclusion"],"a":0,"w":"A WAEC essay on spiritual gifts should begin by identifying the specific gift or passage asked about."},{"q":"Which of these is a typical WAEC-style question on this topic?","o":["\"Describe the layout of Lagos.\"","\"Discuss the purpose of spiritual gifts in the church.\"","\"Define photosynthesis.\"","\"List the rivers of Nigeria.\""],"a":1,"w":"\"Discuss the purpose of spiritual gifts in the church\" is a typical WAEC-style question on this topic."},{"q":"Which passage should be cited when discussing the meaning and source of spiritual gifts?","o":["Ephesians 4:22-24","Romans 6","1 Corinthians 12:1-11","1 Corinthians 13"],"a":2,"w":"1 Corinthians 12:1-11 should be cited when discussing the meaning and source of spiritual gifts."},{"q":"Which three passages contain the New Testament gift lists?","o":["Only the Gospels, with no lists in the Epistles","Only Romans 12, with no other lists existing","Only 1 Corinthians 13, with no other lists existing","Romans 12:6-8, 1 Corinthians 12:8-10 and Ephesians 4:11"],"a":3,"w":"Romans 12:6-8, 1 Corinthians 12:8-10 and Ephesians 4:11 contain the New Testament gift lists."},{"q":"Which chapter should be cited when discussing the orderly use of tongues and prophecy?","o":["1 Corinthians 14","Romans 12","Ephesians 4","1 Peter 1"],"a":0,"w":"1 Corinthians 14 should be cited when discussing the orderly use of tongues and prophecy."},{"q":"Which passage should be cited when discussing stewardship of spiritual gifts?","o":["Romans 6:23","1 Peter 4:10-11","Galatians 5:22-23","2 Corinthians 5:17"],"a":1,"w":"1 Peter 4:10-11 should be cited when discussing stewardship of spiritual gifts."},{"q":"What theme should WAEC essays note runs throughout the topic of spiritual gifts?","o":["Only some believers ever receive any spiritual gift","Gifts exist purely for personal recognition and status","Gifts must be exercised in love for building up the whole church, not personal status","Spiritual gifts have no real purpose in the modern church"],"a":2,"w":"Essays should note that gifts must be exercised in love for building up the church, not personal status."},{"q":"What should a WAEC essay draw out after explaining a gift's meaning and purpose?","o":["A criticism of the Bible's reliability","Nothing further — the essay should end abruptly","An unrelated historical fact","A practical application for the church today"],"a":3,"w":"A WAEC essay should draw out a practical application for the church today."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS • Acts & Epistles',ti:'Mixed Questions — Spiritual Gifts',su:'Integrated revision across the meaning, types, purpose and use of spiritual gifts.',steps:[
{lb:'Summary of key themes',dr:dQ2,ht:'<p>Spiritual gifts are Spirit-given abilities (1 Corinthians 12:1-11), variously listed in <b>Romans 12, 1 Corinthians 12 and Ephesians 4</b>, given "for the common good" to build up the church, to be exercised <b>in love</b> and with proper <b>order</b>.</p>'},
{lb:'Key references to remember',dr:dQ2,ht:'<p>Must-know facts: <b>1 Corinthians 12:4-6</b> (varieties, same Spirit); <b>1 Corinthians 12:7</b> (for the common good); <b>1 Corinthians 14:3</b> (prophecy for strengthening/comfort); <b>1 Corinthians 14:40</b> (fitting and orderly way); <b>1 Corinthians 12:31</b> (love, the most excellent way); <b>1 Peter 4:10-11</b> (faithful stewardship).</p>'},
{lb:'Lessons for today',dr:dQ2,ht:'<p>These teachings call believers today to discover and use their own gifts faithfully, valuing every gift (however seemingly small), and always exercising gifts with humility and genuine love for the whole church community.</p>'},
{lb:'Final exam tips',dr:dQ2,ht:'<p>Always give the <b>precise Bible reference</b>, explain each gift\'s <b>meaning and purpose</b> clearly, and conclude by connecting the passage to how gifts should be exercised faithfully and lovingly today.</p>'},
