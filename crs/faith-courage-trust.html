<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6B1F1F',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class=\"mc-opt\" data-tryid=\"'+id+'\" data-idx=\"'+i+'\">'+opt+'</button>';}).join('');
  return '<div class=\"try\" data-tryid=\"'+id+'\"><div class=\"try-t\">&#10004; Your Turn</div><div class=\"try-q\">'+o.question+'</div>'
    +'<div class=\"mc-opts\">'+opts+'</div>'
    +'<div class=\"try-fb\" data-tryid=\"'+id+'\"></div>'
    +'<details class=\"wk\"><summary>Show working</summary><div class=\"wk-b\">'+o.working+'</div></details>'
    +'<div style=\"margin-top:10px;\"><button class=\"ck try-new\" data-tryid=\"'+id+'\" style=\"background:#888;\">New question</button></div></div>';
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.genFn();entry.o=o;var wrap=el.closest('.try');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=entry.mc?buildTryMC(id,o):buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:entry.mc};return;}
  if(el.classList.contains('mc-opt')){if(el.disabled)return;var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;var idx=parseInt(el.getAttribute('data-idx'),10);var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');allBtns.forEach(function(b){b.disabled=true;});if(idx===o.correct){el.classList.add('mc-correct');fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}else{el.classList.add('mc-wrong');allBtns[o.correct].classList.add('mc-correct');fb.className='try-fb er';fb.textContent='Not quite — the correct answer is highlighted above.';}return;}
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Faith and Courage — Key Figures',ACC,12,'middle',true));
var rows=[['Abraham','Obeyed God\'s call without knowing destination (Gen.12; 22)'],['Joseph','Trusted God through slavery, prison and betrayal (Gen.37-50)'],['Moses','Led Israel despite personal fear and Pharaoh\'s power (Ex.3-14)'],['Joshua','Be strong and courageous; do not be afraid (Josh.1:9)'],['Gideon','Led 300 against thousands trusting God\'s promise (Judg.7)'],['Daniel','Refused to stop praying; survived the lions\' den (Dan.6)'],['Esther','For such a time as this; risked death for her people (Est.4)']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,30+i*30,460,24,CRM,LINE,1));o.push(T(80,44+i*30,r[0],ACC,8,'middle',true));o.push(T(310,44+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Key Faith Texts in the OT',ACC,12,'middle',true));
var rows=[['Josh.1:9','Be strong and courageous; the LORD your God is with you'],['Ps.23:4','Though I walk through the darkest valley, I fear no evil'],['Ps.46:1','God is our refuge and strength, an ever-present help in trouble'],['Prov.3:5-6','Trust in the LORD with all your heart; lean not on own understanding'],['Is.40:31','Those who hope in the LORD will renew their strength; soar like eagles'],['Hab.3:17-18','Though fig tree does not bud... yet I will rejoice in the LORD'],['Dan.3:17-18','Our God whom we serve is able to save... but even if he does not...']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,28+i*30,460,24,CRM,LINE,1));o.push(T(90,42+i*30,r[0],ACC,8,'middle',true));o.push(T(310,42+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Faith, Courage and Trust — Summary',ACC,13,'middle',true));
var rows=[['Abraham','Left homeland; offered Isaac; faith credited as righteousness (Rom.4)'],['Three Hebrews','Fiery furnace; "even if he does not..." — faith without guarantee'],['Daniel (Dan.6)','Prayed three times daily despite death threat; survived lions\' den'],['Esther (Est.4)','For such a time as this; risked death to save her people'],['Joshua 1:9','Be strong and courageous; the LORD your God is with you'],['Isaiah 40:31','Those who hope in LORD will renew strength; soar like eagles']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(110,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 CRS \u2022 OT',ti:'Abraham — Father of Faith',su:'Examine Abraham\'s faith and obedience (Genesis 12 and 22).',steps:[
  {lb:'The call of Abraham (Genesis 12:1-4)',dr:dQ1,ht:'<p>God called Abram (later Abraham): <em>"Go from your country, your people and your father\'s household to the land I will show you"</em> (Gen.12:1). No destination was named — Abraham was to set out in faith, trusting God\'s guidance. The promises were: a great nation; God\'s blessing; a great name; blessing to all peoples on earth. Abraham\'s response: <em>"So Abram went"</em> (v.4) — simple, immediate obedience. He was 75 years old. This is the OT\'s foundational example of faith-obedience.</p>'},
  {lb:'The test of Abraham (Genesis 22)',dr:dQ1,ht:'<p>God tested Abraham: <em>"Take your son, your only son, whom you love — Isaac — and go to the region of Moriah. Sacrifice him there as a burnt offering"</em> (22:2). Isaac was the child of promise — if he died, how could the promises be fulfilled? Yet Abraham obeyed. He rose early the next morning and went. When Isaac asked about the lamb, Abraham said: <em>"God himself will provide the lamb"</em> (v.8). At the last moment, God stopped him and provided a ram. God declared: "Now I know that you fear God."</p>'},
  {lb:'Abraham\'s faith defined',dr:dQ2,ht:'<p>The NT reflects on Abraham\'s faith: Romans 4:3 — "Abraham believed God, and it was credited to him as righteousness." Hebrews 11:8-10 — "By faith Abraham, when called to go to a place he would later receive as his inheritance, obeyed and went, even though he did not know where he was going." Abraham\'s faith was: (1) Responsive — he acted on God\'s word. (2) Patient — he waited years for the promised son. (3) Total — he was willing to give back what God had given. (4) Forward-looking — "he was looking forward to the city... whose architect is God" (Heb.11:10).</p>'},
  {lb:'Lessons from Abraham',dr:dQ2,ht:'<p>Abraham teaches: (1) Faith involves action — "Go" must be followed by going. (2) Faith can coexist with uncertainty — Abraham did not know where he was going. (3) Faith is tested by sacrifice — God tests the depth of trust. (4) God provides when we trust — "God will provide" (the ram). (5) Faith leads to blessing for others — Abraham is "father of all who believe" (Rom.4:11). (6) Obedience precedes full understanding — we walk by faith, not sight (2Cor.5:7). Nigeria application: faith is not passive waiting but active obedience to God\'s word.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'When God called Abraham in Genesis 12, the destination of his journey was:',o:['Egypt','Canaan specifically named','Not named — he had to go in faith trusting God to show him','Ur of the Chaldeans'],a:3,w:'Gen.12:1 — "Go to the land I WILL SHOW YOU" — the destination was not named. Abraham had to set out in faith, trusting God\'s guidance as he went.'},{q:'In Genesis 22, when Isaac asked where the sacrifice was, Abraham said:',o:['We will return from the mountain together — God will not let you die','I do not know — we must trust God completely','God himself will provide the lamb','An angel will come and stop us before we reach the place'],a:3,w:'Gen.22:8 — "God himself will provide the lamb for the burnt offering, my son." This was both faith and prophecy — God did provide a ram at the last moment.'},{q:'Romans 4:3 says Abraham\'s faith was credited to him as:',o:['Wisdom','Courage','Righteousness','Holiness'],a:3,w:'Romans 4:3 (quoting Genesis 15:6) — "Abraham believed God, and it was credited to him as righteousness" — faith, not works, was the basis of his right standing with God.'},{q:'How old was Abraham when God first called him to leave his homeland?',o:['25 years old','45 years old','75 years old','99 years old'],a:3,w:'Genesis 12:4 — "Abram was seventy-five years old when he set out from Harran" — his faith was not the impulsive response of youth but the deliberate choice of a mature man.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q2 \u2022 CRS \u2022 OT',ti:'The Three Hebrews — Shadrach, Meshach and Abednego',su:'Examine the faith of the three Hebrews in Daniel 3.',steps:[
  {lb:'The situation (Daniel 3:1-18)',dr:dQ1,ht:'<p>King Nebuchadnezzar set up a golden statue 60 cubits high in Babylon and commanded everyone to bow and worship it at the sound of music. The penalty for refusal: to be thrown immediately into a blazing furnace. Shadrach, Meshach and Abednego — three Jewish exiles — refused. Infuriated, Nebuchadnezzar summoned them. They replied: <em>"King Nebuchadnezzar, we do not need to defend ourselves before you in this matter"</em> (3:16). Their response is one of the most powerful declarations of faith in the OT.</p>'},
  {lb:'"Even if he does not..." — unconditional faith',dr:dQ2,ht:'<p>The three Hebrews declared: <em>"The God we serve is able to deliver us from the blazing furnace, and he will deliver us from Your Majesty\'s hand. But even if he does not, we want you to know, Your Majesty, that we will not serve your gods or worship the image of gold you have set up"</em> (Dan.3:17-18). This is "faith without guarantee" — they trusted God could save them, but pledged obedience even if He chose not to. This goes beyond calculating faith to absolute loyalty. They would rather die than compromise their covenant with God.</p>'},
  {lb:'The outcome (Daniel 3:19-27)',dr:dQ2,ht:'<p>The king ordered the furnace heated seven times hotter. The men who threw them in were killed by the heat. Yet the king looked in and saw not three but four figures walking — <em>"the fourth looks like a son of the gods"</em> (3:25). When they came out, their bodies were unharmed, their hair not singed, their robes not scorched, and there was no smell of fire on them (3:27). Nebuchadnezzar declared: "Praise be to the God of Shadrach, Meshach and Abednego!" and promoted them.</p>'},
  {lb:'Lessons from the three Hebrews',dr:dQ1,ht:'<p>Lessons: (1) Courageous faith refuses to compromise even under the threat of death. (2) "Even if he does not" — true faith trusts God regardless of the outcome. (3) God is present in the fire — the divine figure walked with them. (4) Faithfulness in extremity becomes a witness to unbelievers (Nebuchadnezzar praised God). (5) Peer/societal pressure to conform must be resisted when it contradicts God\'s commands. Application for students: academic, social and professional pressures to compromise values must be faced with the same "even if he does not" courage.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'The three Hebrews refused to bow to Nebuchadnezzar\'s statue because:',o:['They did not hear the music and missed the signal','They were away from Babylon when the order was given','Their covenant with God forbade worshipping idols — the First Commandment','They wanted to show off their power before the king'],a:3,w:'Worshipping the golden statue would have violated the First and Second Commandments — "You shall have no other gods before me" and "Do not make or bow to idols" (Ex.20:1-6).'},{q:'The key phrase in Dan.3:18 that defines their "unconditional faith" is:',o:['Our God can save us from the furnace','We will not serve your gods','But even if he does not, we will not bow','We do not need to defend ourselves'],a:3,w:'Dan.3:18 — "But even if he does not, we want you to know... that we will not serve your gods" — they pledged obedience even without guarantee of rescue. Faith without conditions.'},{q:'When Nebuchadnezzar looked into the furnace he saw:',o:['The three men already dead from the heat','The three men walking, plus a fourth figure like a son of the gods','Only ashes where the three men had been thrown','Three men sleeping peacefully in the flames'],a:2,w:'Dan.3:25 — the king said "Look! I see four men walking around in the fire, unharmed, and the fourth looks like a son of the gods" — the divine presence accompanied them into the fire.'},{q:'The outcome of the three Hebrews\' faithfulness was that:',o:['They died in the furnace but were honoured by Israel','They escaped before being thrown in','They emerged completely unharmed and Nebuchadnezzar praised God and promoted them','God struck Nebuchadnezzar dead as punishment for his idolatry'],a:3,w:'Dan.3:27-30 — the men were completely unharmed (no smell of fire); Nebuchadnezzar praised God; he decreed that no one could speak against their God; and he promoted them in Babylon.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q3 \u2022 CRS \u2022 OT',ti:'Daniel in the Lions\' Den',su:'Examine Daniel\'s faith under persecution (Daniel 6).',steps:[
  {lb:'The plot against Daniel (Daniel 6:1-9)',dr:dQ3,ht:'<p>Daniel was a senior official under King Darius of Persia, so distinguished that the king planned to make him administrator over the whole kingdom. Jealous satraps and officials tried to find grounds against him but could find no corruption or negligence. They concluded: "We will never find any basis for charges against this man Daniel unless it has something to do with the law of his God" (6:5). They tricked Darius into signing a law that anyone who prayed to any god or human except the king for 30 days would be thrown to the lions.</p>'},
  {lb:'Daniel\'s response — prayer as courage',dr:dQ3,ht:'<p>When Daniel learned of the decree, <em>"he went home to his upstairs room where the windows opened toward Jerusalem. Three times a day he got down on his knees and prayed, giving thanks to his God, just as he had done before"</em> (6:10). Three observations: (1) He knew about the law. (2) He deliberately continued his practice — the windows were open. (3) He gave thanks — not a last-gasp crisis prayer but his normal pattern. His courage was not reactive heroism but the natural expression of a consistent prayer life. Character under pressure reveals who we really are.</p>'},
  {lb:'The lions\' den and deliverance',dr:dQ3,ht:'<p>Darius was trapped by his own law and reluctantly threw Daniel in. He spent the night without eating, could not sleep, and at dawn ran to the den and called out: <em>"Daniel, servant of the living God, has your God, whom you serve continually, been able to rescue you?"</em> (6:20). Daniel replied: "My God sent his angel, and he shut the mouths of the lions" (6:22). The king was overjoyed. He threw Daniel\'s accusers into the lions\' den (they were consumed immediately) and issued a decree that people should fear Daniel\'s God throughout his kingdom.</p>'},
  {lb:'Lessons from Daniel 6',dr:dQ3,ht:'<p>Daniel teaches: (1) Consistent, prayerful character cannot be hidden — it will always be noticed, for good and bad. (2) Courage under persecution flows from a disciplined prayer life, not from sudden resolve. (3) God can be trusted when faithful obedience leads to danger. (4) Faithfulness under pressure becomes a witness — Darius\'s decree praised Daniel\'s God. (5) Integrity has enemies — those without it will target those who have it. (6) The outcome is in God\'s hands — Daniel\'s responsibility was faithfulness, not his own survival.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryItMC(function(){var qs=[{q:'Why did Daniel\'s enemies target his prayer life specifically?',o:['Daniel was known to pray too loudly in public','His prayer life was the only area of his life they could find fault with','He prayed to a foreign deity that was illegal in Persia','He refused to pray for the king\'s health'],a:2,w:'Dan.6:5 — "We will never find any basis for charges against this man Daniel unless it has something to do with the law of his God" — his prayer life was his only vulnerability.'},{q:'When Daniel knew the decree had been signed, he:',o:['Stopped praying publicly but prayed secretly','Appealed to the king to reconsider','Continued praying three times daily with his windows open toward Jerusalem — as he had always done','Fled to another part of the Persian Empire'],a:3,w:'Dan.6:10 — Daniel continued his normal three-times-daily prayer practice with his windows open. His courage was not defiance but consistency — he simply did what he always did.'},{q:'How did God deliver Daniel from the lions?',o:['He made the lions sick so they could not eat','He sent his angel to shut the mouths of the lions','He made Daniel invisible to the lions','He caused the lions to fall asleep'],a:2,w:'Dan.6:22 — "My God sent his angel, and he shut the mouths of the lions." The exact mechanism was angelic intervention restraining the lions from harming Daniel.'},{q:'The immediate result of Daniel\'s faithfulness was that King Darius:',o:['Abolished the decree against prayer to Daniel\'s God only in Babylon','Issued a decree that people throughout his kingdom should fear and reverence Daniel\'s God','Converted to Judaism and observed all the Mosaic laws','Gave Daniel the entire Persian Empire to govern alone'],a:2,w:'Dan.6:26-27 — Darius issued a decree: "In every part of my kingdom people must fear and reverence the God of Daniel... he is the living God." Daniel\'s faithfulness witnessed to an empire.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q4 \u2022 CRS \u2022 OT',ti:'Esther — For Such a Time as This',su:'Examine Esther\'s courage in saving her people (Esther 4).',steps:[
  {lb:'Esther\'s situation (Esther 4)',dr:dQ4,ht:'<p>Esther was a Jewish orphan raised by her cousin Mordecai, who had become queen of Persia. Haman, a court official, persuaded King Ahasuerus (Xerxes) to issue a decree to kill all Jews in the Persian Empire. Mordecai sent Esther a copy of the edict and urged her to go before the king to plead for her people. Esther objected: approaching the king uninvited was punishable by death — unless the king extended his golden sceptre. Even the queen could not go in uninvited. Esther was afraid.</p>'},
  {lb:'"For such a time as this" (Esther 4:14)',dr:dQ4,ht:'<p>Mordecai\'s reply to Esther: <em>"Do not think that because you are in the king\'s house you alone of all the Jews will escape. For if you remain silent at this time, relief and deliverance for the Jews will arise from another place, but you and your father\'s family will perish. And who knows but that you have come to your royal position for such a time as this?"</em> (4:13-14). Three powerful arguments: (1) Silence will not save you. (2) God will find another way — but you will miss your purpose. (3) Your position exists for a reason.</p>'},
  {lb:'Esther\'s courageous response',dr:dQ4,ht:'<p>Esther\'s reply became iconic: <em>"Go, gather together all the Jews who are in Susa, and fast for me... When this is done, I will go to the king, even though it is against the law. And if I perish, I perish"</em> (4:16). "If I perish, I perish" — the declaration of someone who has weighed the cost and accepted it. Esther moved from self-protection to self-sacrifice, from fear to courageous obedience. She first called for corporate fasting and prayer — spiritual preparation before the risky action — then acted.</p>'},
  {lb:'Lessons from Esther',dr:dQ4,ht:'<p>Esther teaches: (1) Courage sometimes means putting others ahead of personal safety. (2) Position and privilege come with responsibility — "for such a time as this." (3) Spiritual preparation (fasting and prayer) precedes courageous action. (4) Silence in the face of injustice can be complicity. (5) God works through human courage, not despite it. (6) "If I perish, I perish" is the declaration of faith without guarantee — similar to the three Hebrews\' "even if he does not." Applications: standing against injustice; using one\'s position to help the vulnerable; accepting personal cost for the community\'s good.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryItMC(function(){var qs=[{q:'Why was it so dangerous for Esther to approach the king uninvited?',o:['The king was ill and could not receive visitors','Court protocol required appointments a month in advance','Approaching the king uninvited was punishable by death unless he extended his golden sceptre','The king had previously been angry with Esther over a separate matter'],a:3,w:'Esther 4:11 — "Any man or woman who approaches the king in the inner court without being summoned — the king has but one law: that they be put to death. The only exception is for the king to extend the gold scepter to them."'},{q:'Mordecai\'s famous question to Esther was:',o:['Who are you to be afraid, since God has placed you in the palace?','If God is with us, who can stand against us?','Who knows but that you have come to your royal position for such a time as this?','Are you willing to risk your life for the sake of your people?'],a:3,w:'Esther 4:14 — "Who knows but that you have come to your royal position for such a time as this?" — Mordecai challenged Esther to see her position as God-given for this specific moment.'},{q:'Esther\'s declaration before she went to the king was:',o:['I will pray alone for three days before deciding','I trust in God and know He will protect me completely','If I perish, I perish — gather the Jews to fast for me','God has shown me a vision that the king will spare me'],a:3,w:'Esther 4:16 — "If I perish, I perish" — Esther accepted the risk and moved from self-preservation to courageous obedience, after calling for three days of fasting and prayer.'},{q:'The phrase "for such a time as this" (Esther 4:14) suggests that:',o:['Timing in life is always uncertain and one should wait','God places people in specific positions for specific purposes in His plan','Esther was uniquely qualified by her intelligence and beauty alone','The Persian king was responsible for Israel\'s salvation, not God'],a:2,w:'"For such a time as this" — Mordecai suggested that Esther\'s arrival at the palace was not accidental but divinely arranged. God places people in positions of influence for His purposes.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q5 \u2022 CRS \u2022 OT',ti:'Joshua and David — Courage in Leadership',su:'Examine the courage of Joshua and David.',steps:[
  {lb:'Joshua\'s commission (Joshua 1:1-9)',dr:dQ5,ht:'<p>After Moses died, God commissioned Joshua to lead Israel into Canaan. God\'s repeated command: <em>"Be strong and courageous"</em> (1:6,7,9) — said three times. The basis: (1) God will be with you wherever you go (1:9). (2) He will never leave you nor forsake you (1:5). (3) Meditate on the Law day and night (1:8) — spiritual preparation produces courage. The promise: "I will give you every place where you set your foot, as I promised Moses" (1:3). Joshua\'s courage was rooted not in self-confidence but in God\'s promise and presence.</p>'},
  {lb:'David and Goliath (1 Samuel 17)',dr:dQ5,ht:'<p>The Philistine champion Goliath (over 9 feet tall, fully armoured) challenged Israel to send a champion. For 40 days, Israel was paralysed by fear. David, a young shepherd, came to the camp and heard Goliath\'s challenge. His reaction: anger, not fear — "Who is this uncircumcised Philistine that he should defy the armies of the living God?" (17:26). David volunteered. Saul objected: you are too young. David replied: God who delivered me from lions and bears will deliver me from this Philistine. His confidence was theological, not physical.</p>'},
  {lb:'David\'s declaration of faith (1 Samuel 17:45-47)',dr:dQ5,ht:'<p>David declared to Goliath: <em>"You come against me with sword and spear and javelin, but I come against you in the name of the LORD Almighty, the God of the armies of Israel, whom you have defied... This day the LORD will deliver you into my hands... All those gathered here will know that it is not by sword or spear that the LORD saves; for the battle is the LORD\'s, and he will give all of you into our hands"</em> (17:45-47). Five smooth stones; one shot. Goliath fell. David\'s courage was inseparable from his faith.</p>'},
  {lb:'Lessons from Joshua and David',dr:dQ5,ht:'<p>Joshua and David teach: (1) God\'s presence is the basis of courage — "I will be with you." (2) Courage is commanded, not merely natural temperament — "Be strong and courageous." (3) Spiritual discipline (meditating on God\'s word — Joshua) produces courage. (4) Past experience of God\'s faithfulness builds confidence for new challenges (David — lions, bears, Goliath). (5) True courage is not the absence of fear but faith-action in the face of fear. (6) "The battle is the LORD\'s" — recognising God\'s sovereignty removes the burden of self-reliance.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryItMC(function(){var qs=[{q:'How many times does God tell Joshua to "be strong and courageous" in Joshua 1?',o:['Once','Twice','Three times','Four times'],a:3,w:'Joshua 1:6, 1:7, and 1:9 — "Be strong and courageous" is commanded three times in the commissioning of Joshua, emphasising its importance for the challenges ahead.'},{q:'David\'s confidence in facing Goliath was based on:',o:['His superior military training and equipment','His experience of God delivering him from lions and bears while shepherding','A prophecy from Samuel that he would not die in battle','The fact that Goliath was known to be getting old and slower'],a:2,w:'1Sam.17:34-37 — David cited his past experience: "The LORD who rescued me from the paw of the lion and the paw of the bear will rescue me from the hand of this Philistine."'},{q:'David declared to Goliath: "You come against me with sword and spear... but I come against you in the name of..."',o:['The God of Israel, whose ark I have carried','The LORD Almighty, the God of the armies of Israel','My father Jesse, who sent me to this battle','All the tribes of Israel united behind me'],a:2,w:'1Sam.17:45 — "I come against you in the name of the LORD Almighty, the God of the armies of Israel" — David\'s declaration made the battle explicitly theological.'},{q:'God told Joshua in Joshua 1:8 that success would come from:',o:['Having the largest army in the region','Meditating on the Law day and night and being careful to obey it','Building strong walls around all the cities of Israel','Never engaging in battle during the Sabbath'],a:2,w:'Josh.1:8 — "Keep this Book of the Law always on your lips; meditate on it day and night... then you will be prosperous and successful" — spiritual discipline is the foundation of courageous success.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q6 \u2022 CRS \u2022 OT',ti:'Trust in the Psalms and Proverbs',su:'Examine trust in God through Psalms and Proverbs.',steps:[
  {lb:'Psalm 23 — The Lord is my Shepherd',dr:dQ2,ht:'<p>Psalm 23 (David) is the most beloved expression of trust in the OT. Key verse: <em>"Even though I walk through the darkest valley, I will fear no evil, for you are with me; your rod and your staff, they comfort me"</em> (v.4). The psalm uses the shepherd image to describe God\'s care: green pastures (provision), still waters (rest), right paths (guidance), presence in the valley (courage in danger), anointed head (honour), overflowing cup (abundance). Trust in God does not remove the dark valley — it removes the fear within it.</p>'},
  {lb:'Psalm 46 — God is our refuge',dr:dQ2,ht:'<p>Psalm 46: <em>"God is our refuge and strength, an ever-present help in trouble. Therefore we will not fear, though the earth give way and the mountains fall into the heart of the sea"</em> (vv.1-2). The "therefore" is crucial — because God is refuge and strength, fear is conquered. The famous conclusion: <em>"Be still, and know that I am God; I will be exalted among the nations, I will be exalted in the earth"</em> (v.10). Trust sometimes means ceasing striving and knowing who God is — active stillness, not passive resignation.</p>'},
  {lb:'Proverbs 3:5-6 — Trust with all your heart',dr:dQ1,ht:'<p>Proverbs 3:5-6: <em>"Trust in the LORD with all your heart and lean not on your own understanding; in all your ways submit to him, and he will make your paths straight."</em> Four commands: (1) Trust in the LORD (active reliance). (2) With ALL your heart (not partial). (3) Do not lean on your own understanding (intellectual humility). (4) Submit to him in ALL your ways (comprehensive obedience). The promise: "He will make your paths straight." This is not a formula but an orientation — making God\'s wisdom, not human calculation, the basis of decisions.</p>'},
  {lb:'Isaiah 40:31 — Renewing strength',dr:dQ1,ht:'<p>Isaiah 40:31: <em>"Those who hope in the LORD will renew their strength. They will soar on wings like eagles; they will run and not grow weary, they will walk and not be faint."</em> Context: Israel was in exile, exhausted and despairing. God promised that those who wait on Him would be renewed. Three images of strength: soaring (effortless movement above circumstances), running (sustained energy), walking (daily endurance). The greatest test of faith is not dramatic crises but the long walk of ordinary faithfulness — "walk and not faint."</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Psalm 23:4 says: "Even though I walk through the darkest valley, I will fear no evil, for..."',o:['My strength will not fail me in that hour','God has promised I will never enter such valleys','You are with me; your rod and your staff, they comfort me','The darkness cannot overcome God\'s light around me'],a:3,w:'Psalm 23:4 — "you are with me; your rod and your staff, they comfort me" — trust does not remove the dark valley but removes the fear within it, because of God\'s presence.'},{q:'Psalm 46:10 commands: "Be still, and know that I am God." This means:',o:['Stop all activity and become completely passive','Meditate quietly; cease anxious striving and know who God is','Never speak about God in public','Avoid all conflict by staying silent'],a:2,w:'"Be still" (Hebrew: raphah — let go, cease striving) — active trust that stops anxious human effort and recognises God\'s sovereignty. Not passive; it is a form of courageous trust.'},{q:'Proverbs 3:5 says to trust in the LORD "with all your heart" and NOT lean on:',o:['The advice of other people','Your own understanding','The traditions of your fathers','The wisdom of the Psalms alone'],a:2,w:'Proverbs 3:5 — "lean not on your own understanding" — human reasoning and calculation must be submitted to God\'s wisdom, not made the ultimate guide for decisions.'},{q:'Isaiah 40:31 says those who "hope/wait in the LORD" will:',o:['Be wealthy and never face hardship','Immediately have all their problems solved','Renew their strength — soar like eagles, run without weariness, walk without fainting','Be protected from all enemies in battle'],a:3,w:'Isaiah 40:31 — "They will soar on wings like eagles; they will run and not grow weary, they will walk and not be faint" — three images of supernatural, sustained strength for those who trust God.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q7 \u2022 CRS \u2022 OT',ti:'Joseph — Faith Through Suffering',su:'Examine Joseph\'s faith through adversity (Genesis 37-50).',steps:[
  {lb:'Joseph\'s suffering and trust',dr:dQ1,ht:'<p>Joseph was sold into slavery by his brothers (Gen.37), falsely accused by Potiphar\'s wife and imprisoned (Gen.39), forgotten by the cupbearer after interpreting his dream (Gen.40) — yet at no point is Joseph described as abandoning God. The refrain in Genesis 39 is significant: "The LORD was with Joseph" (vv.2,3,21,23). Even in slavery and prison, God\'s presence and blessing were evident. Joseph\'s faith was not triumphalist but persistent — he kept trusting when circumstances gave no evidence of improvement.</p>'},
  {lb:'The turning point and God\'s plan revealed',dr:dQ1,ht:'<p>After two years in prison, Pharaoh had dreams that no one could interpret. The cupbearer remembered Joseph, who was brought before Pharaoh. Joseph interpreted Pharaoh\'s dream (seven fat cows + seven lean cows = seven years of plenty + seven years of famine) and advised Pharaoh to appoint a wise man to store grain. Pharaoh appointed Joseph himself to save Egypt — and eventually the whole region, including his own family, from famine. What his brothers intended as evil, God used for good (Gen.50:20).</p>'},
  {lb:'Joseph\'s forgiveness (Genesis 50:19-21)',dr:dQ2,ht:'<p>When Joseph\'s father Jacob died, his brothers feared Joseph would now take revenge. Joseph wept at their fear and declared: <em>"Don\'t be afraid. Am I in the place of God? You intended to harm me, but God intended it for good to accomplish what is now being done, the saving of many lives"</em> (Gen.50:19-20). This is one of the OT\'s greatest statements of theological faith: God\'s sovereign plan overrides human evil. Joseph\'s forgiveness was rooted in his conviction that God had been at work through everything.</p>'},
  {lb:'Lessons from Joseph',dr:dQ2,ht:'<p>Joseph teaches: (1) God is present and working even in the darkest circumstances. (2) Faith is sustained not by circumstances but by God\'s character. (3) Integrity must be maintained even when no human sees (Potiphar\'s wife — he fled, not negotiated). (4) Forgiveness is possible when one sees God\'s sovereign purpose. (5) Suffering that seems purposeless may be preparation for a larger calling. (6) "You intended to harm me, but God intended it for good" — the theology of suffering that sustains faith when life makes no sense.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryItMC(function(){var qs=[{q:'The phrase "The LORD was with Joseph" appears how many times in Genesis 39?',o:['Once','Twice','Three times','Four times'],a:4,w:'The phrase "the LORD was with Joseph" or "the LORD was with him" appears four times in Genesis 39 (vv.2,3,21,23) — emphasising God\'s presence through slavery and imprisonment.'},{q:'Joseph\'s famous declaration to his brothers about his suffering was:',o:['God has punished you for what you did to me','You sold me into slavery but God has forgiven you','You intended to harm me, but God intended it for good — the saving of many lives','I forgive you because my father Jacob asked me to'],a:3,w:'Genesis 50:20 — "You intended to harm me, but God intended it for good to accomplish what is now being done, the saving of many lives" — the theology of divine sovereignty over human evil.'},{q:'Joseph was imprisoned because:',o:['He refused to interpret Pharaoh\'s dream','He was falsely accused by Potiphar\'s wife after refusing her advances','He tried to escape from Potiphar\'s house','He was found guilty of stealing from Potiphar'],a:2,w:'Genesis 39:7-20 — Potiphar\'s wife tried to seduce Joseph; he refused and fled; she falsely accused him of attempted assault; Potiphar imprisoned him — an example of Joseph\'s integrity under pressure.'},{q:'Joseph\'s interpretation of Pharaoh\'s dream revealed:',o:['That Pharaoh would die and be replaced by Joseph as king','Seven years of plenty followed by seven years of severe famine across the region','That Israel would soon be freed from slavery in Egypt','That Pharaoh needed to conquer his enemies to secure Egypt\'s food supply'],a:2,w:'Genesis 41:25-32 — seven fat cows and seven full ears of grain = seven years of abundance. Seven lean cows and seven thin ears = seven years of severe famine to follow.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q8 \u2022 CRS \u2022 OT',ti:'Habakkuk — Faith When Life Makes No Sense',su:'Examine Habakkuk\'s faith through unanswered questions.',steps:[
  {lb:'Habakkuk\'s complaint (Habakkuk 1:1-4)',dr:dQ2,ht:'<p>Habakkuk was a prophet who dared to question God directly: <em>"How long, LORD, must I call for help, but you do not listen?... Why do you make me look at injustice? Why do you tolerate wrongdoing? Destruction and violence are before me; there is strife, and conflict abounds"</em> (1:2-3). God\'s answer shocked him: He was raising up the Babylonians — more wicked than Judah — to punish His people. Habakkuk protested: how can a holy God use the wicked to punish the less wicked? The book is an honest dialogue with God in the midst of incomprehensible suffering.</p>'},
  {lb:'The just shall live by faith (Habakkuk 2:4)',dr:dQ2,ht:'<p>God\'s response to Habakkuk\'s protest: <em>"Write the vision... though it linger, wait for it; it will certainly come"</em> (2:3). And the key declaration: <em>"the righteous person will live by his faithfulness"</em> (2:4 — or "by faith" in many translations). This is the verse Paul quoted three times in the NT (Romans 1:17; Galatians 3:11; Hebrews 10:38) — it became the cornerstone of Reformation theology. The just live not by sight, not by circumstances, but by faith in God\'s word even when God seems silent.</p>'},
  {lb:'Habakkuk 3:17-18 — Faith without circumstantial evidence',dr:dQ2,ht:'<p>Habakkuk 3:17-18 is the OT\'s most radical expression of unconditional trust: <em>"Though the fig tree does not bud and there are no grapes on the vines, though the olive crop fails and the fields produce no food, though there are no sheep in the pen and no cattle in the stalls, yet I will rejoice in the LORD, I will be joyful in God my Saviour."</em> Every source of sustenance is removed — total agricultural failure. Yet Habakkuk chooses joy in God. This is faith independent of circumstances — the OT counterpart to the three Hebrews\' "even if he does not."</p>'},
  {lb:'Lessons from Habakkuk',dr:dQ2,ht:'<p>Habakkuk teaches: (1) Honest questioning of God is legitimate — the book is a dialogue, not a rebuke. (2) Faith does not require understanding — "write the vision; wait for it." (3) "The just shall live by faith" — the foundation of NT salvation doctrine. (4) Joy in God can be chosen independently of circumstances. (5) God\'s purposes operate on a timeline we cannot always see. (6) Waiting in faith is itself an act of courage. Application: when life is incomprehensible — illness, loss, injustice — Habakkuk 3:17-18 provides the vocabulary of stubborn, resolute, joyful faith.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Habakkuk\'s complaint to God was primarily about:',o:['His personal health and suffering','Why God allowed injustice and violence in Judah without acting','Why Israel had been defeated by the Assyrians','Why the temple had not yet been rebuilt'],a:2,w:'Habakkuk 1:2-3 — "How long, LORD, must I call for help... Why do you make me look at injustice? Why do you tolerate wrongdoing?" — a prophet wrestling with unanswered injustice.'},{q:'Habakkuk 2:4 — "The righteous person will live by his faithfulness/faith" — was quoted by Paul in:',o:['John\'s Gospel and Acts','Romans 1:17; Galatians 3:11; Hebrews 10:38 — three NT books','Matthew 5 and Luke 6','1 Corinthians 13 and Ephesians 2'],a:2,w:'Paul quoted Hab.2:4 in Romans 1:17, Galatians 3:11, and Hebrews 10:38 — it became the cornerstone of NT faith theology and later the Reformation\'s "justification by faith alone."'},{q:'Habakkuk 3:17-18 describes a scenario where:',o:['God has blessed with abundance: full barns and overflowing vines','Every source of food has failed — yet Habakkuk chooses joy in God','Israel is at war but trusting God for victory','The prophet has a vision of future restoration'],a:2,w:'Hab.3:17-18 — every agricultural resource fails (fig tree, vines, olives, fields, sheep, cattle) — total ruin. Yet "I will rejoice in the LORD" — faith completely independent of circumstances.'},{q:'The phrase "Though it linger, wait for it; it will certainly come" (Hab.2:3) teaches:',o:['God always answers prayer immediately if faith is strong enough','God\'s vision and plan have their own timeline — faith waits without losing hope','If you wait long enough, your prayers will eventually be answered without fail','The longer you wait, the stronger your faith must become'],a:2,w:'Hab.2:3 — "wait for it; it will certainly come and will not delay" — God\'s purposes operate on a timeline beyond human calculation. Faithful waiting is not passive resignation but active trust.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q9 \u2022 CRS \u2022 OT',ti:'WAEC Prep — Faith, Courage and Trust',su:'Practise WAEC-style questions on OT faith and courage.',steps:[
  {lb:'WAEC essay structure',dr:dQ2,ht:'<p>For WAEC questions on faith, courage and trust: (1) Define faith in OT context (trust in God\'s word and character, expressed in obedience). (2) Identify key figures with specific stories and references. (3) Identify key faith texts. (4) State lessons for Christians today. Common questions: "Discuss the faith of Abraham." / "Examine the courage of the three Hebrews in Daniel 3." / "What does the OT teach about trusting God?" / "How did Daniel demonstrate faith under persecution?"</p>'},
  {lb:'Key figures and references',dr:dQ1,ht:'<p>WAEC reference bank: Abraham — Gen.12 (left homeland); Gen.22 (offered Isaac). Three Hebrews — Dan.3 ("even if he does not"). Daniel — Dan.6 (prayed three times despite death threat). Esther — Est.4 ("if I perish, I perish"; "for such a time as this"). Joshua — Josh.1:9 ("be strong and courageous"). David — 1Sam.17 ("the battle is the LORD\'s"). Joseph — Gen.50:20 ("you intended harm; God intended good"). Habakkuk — Hab.2:4 ("live by faith"); 3:17-18 ("though fig tree... yet I will rejoice"). Isaiah 40:31 ("soar like eagles"). Psalm 23:4. Proverbs 3:5-6.</p>'},
  {lb:'Comparing faith figures',dr:dQ1,ht:'<p>WAEC comparison: Abraham — faith as obedience without knowing the destination. Three Hebrews/Daniel/Esther — faith as courage under threat of death. Joseph — faith through sustained suffering and injustice. Joshua/David — faith in warfare and leadership. Habakkuk — faith when life makes no sense; "even if" trust. Psalms/Proverbs — faith expressed in worship, prayer and daily trust. Common thread: all trusted God\'s character and word when circumstances gave no visible reason to do so.</p>'},
  {lb:'Common WAEC mistakes',dr:dQ1,ht:'<p>Avoid: Confusing Shadrach, Meshach and Abednego (fiery furnace — Dan.3) with Daniel in the lions\' den (Dan.6). Saying Abraham was 25 when called (he was 75). Saying Esther said "if I die, I die" rather than "if I perish, I perish." Attributing Proverbs 3:5-6 to Psalms. Confusing Isaiah 40:31 (soar like eagles) with Psalm 23. Not giving book and chapter references. Not stating the lesson or application — WAEC essays should end with lessons for Christian life today.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryItMC(function(){var qs=[{q:'Which OT story is about facing death threats for refusing to worship an idol?',o:['Joseph in prison (Gen.39-40)','Shadrach, Meshach and Abednego in the fiery furnace (Dan.3)','David facing Goliath (1Sam.17)','Esther approaching the king (Est.4)'],a:2,w:'Daniel 3 — Shadrach, Meshach and Abednego refused to bow to Nebuchadnezzar\'s golden statue and were thrown into a blazing furnace. They declared: "even if he does not... we will not bow."'},{q:'Esther 4:14 contains which famous phrase?',o:['If I perish, I perish','The battle is the LORD\'s','For such a time as this','Even if he does not, we will not bow'],a:3,w:'"Who knows but that you have come to your royal position for such a time as this?" (Est.4:14) — Mordecai\'s challenge to Esther to use her position for God\'s purpose.'},{q:'Genesis 50:20 — "You intended to harm me, but God intended it for good" — was said by:',o:['Moses to the Israelites in the wilderness','David to Saul after sparing his life','Joseph to his brothers after their father Jacob died','Abraham to Lot after separating their flocks'],a:3,w:'Joseph said this to his brothers (Gen.50:19-20) after their father Jacob died and they feared revenge — Joseph\'s declaration of God\'s sovereign purpose over human evil.'},{q:'Habakkuk 3:17-18 expresses unconditional trust by saying "though the fig tree does not bud... yet I will":',o:['Cry out to God for the harvest to return','Trust that God will send rain in due season','Rejoice in the LORD; be joyful in God my Saviour','Continue to plant and wait for God\'s provision'],a:3,w:'Hab.3:18 — "yet I will rejoice in the LORD, I will be joyful in God my Saviour" — joy in God chosen deliberately when every circumstantial reason for joy has been removed.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
{ey:'Q10 \u2022 CRS \u2022 OT',ti:'Mixed Questions — Faith, Courage and Trust',su:'Integrated revision across all CRS-OT-08 topics.',steps:[
  {lb:'Full summary',dr:dQ10,ht:'<p>Faith figures: Abraham (Gen.12,22 — obeyed without knowing; offered Isaac). Three Hebrews (Dan.3 — "even if he does not"). Daniel (Dan.6 — prayed three times daily; lions\' den). Esther (Est.4 — "if I perish, I perish"; "for such a time as this"). Joshua (Josh.1:9 — "be strong and courageous"). David (1Sam.17 — "the battle is the LORD\'s"). Joseph (Gen.37-50 — faith through suffering; "you intended harm; God intended good"). Habakkuk (Hab.2:4 — "live by faith"; 3:17-18 — "though fig tree... yet I will rejoice").</p>'},
  {lb:'Key faith texts',dr:dQ10,ht:'<p>WAEC key texts: Joshua 1:9 — "be strong and courageous; the LORD your God is with you." Psalm 23:4 — "even though I walk through the darkest valley, I fear no evil." Psalm 46:1 — "God is our refuge and strength." Proverbs 3:5-6 — "trust in the LORD with all your heart." Isaiah 40:31 — "those who hope in the LORD will renew their strength." Habakkuk 2:4 — "the righteous will live by faith." Habakkuk 3:17-18 — "though fig tree... yet I will rejoice." Daniel 3:17-18 — "even if he does not."</p>'},
  {lb:'The pattern of OT faith',dr:dQ10,ht:'<p>Common pattern across all OT faith figures: (1) Crisis or threat — internal (suffering) or external (persecution/death). (2) Faith in God\'s character despite circumstances. (3) Courageous action or patient endurance. (4) God\'s intervention (or trusting even without it). (5) Testimony to others — Nebuchadnezzar, Darius, Egypt all praised God through faithful Hebrews. The OT portrays faith not as passive belief but as active trust that shapes behaviour and generates courage. "The battle is the LORD\'s" does not mean passivity but engaged, God-dependent action.</p>'},
  {lb:'WAEC final tips',dr:dQ10,ht:'<p>Final revision: Know Abraham (75 years old; Gen.12; Gen.22); three Hebrews (Dan.3; "even if he does not"); Daniel (Dan.6; prayed three times); Esther (Est.4; "for such a time as this"; "if I perish, I perish"); Joshua (Josh.1:9); David (1Sam.17; "battle is the LORD\'s"); Joseph (Gen.50:20); Habakkuk (2:4; 3:17-18). Know all key texts with references. For essays: story → faith declaration → outcome → lessons for today. Never confuse the fiery furnace (Dan.3) with the lions\' den (Dan.6).</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{q:'The three Hebrews in Daniel 3 and Esther in Esther 4 both expressed "faith without guarantee" through similar declarations. Which best matches?',o:['Three Hebrews: "God will surely save us"; Esther: "God has promised me victory"','Three Hebrews: "Even if he does not, we will not bow"; Esther: "If I perish, I perish"','Three Hebrews: "We will fight our way out"; Esther: "I will pray for seven days first"','Three Hebrews: "Death is nothing to fear"; Esther: "For such a time as this"'],a:2,w:'"Even if he does not" (Dan.3:18) and "If I perish, I perish" (Est.4:16) — both express obedience without guarantee of a favourable outcome. Faith that trusts God regardless of the result.'},{q:'Which faith figure\'s story is found in Genesis, not in the books of Daniel or Esther?',o:['The three Hebrews','Daniel in the lions\' den','Joseph — "you intended harm; God intended good"','Esther — "for such a time as this"'],a:3,w:'Joseph\'s story is in Genesis 37-50. The three Hebrews and Daniel are in the book of Daniel; Esther is in the book of Esther.'},{q:'Isaiah 40:31 promises strength to those who "hope/wait in the LORD" using three images. Select all three:',o:['Swim, run, walk','Soar like eagles, run and not grow weary, walk and not faint','March, charge, conquer','Pray, fast, worship'],a:2,w:'Isaiah 40:31 — "soar on wings like eagles; run and not grow weary; walk and not be faint" — effortless movement, sustained energy, daily endurance — three levels of God-supplied strength.'},{q:'Habakkuk 2:4 — "The righteous shall live by faith/faithfulness" — became the cornerstone of which later Christian doctrine?',o:['The Trinity','Justification by faith (grace, not works, as the basis of salvation)','The authority of Scripture','The second coming of Christ'],a:2,w:'Paul quoted Hab.2:4 in Romans 1:17 and Galatians 3:11 to establish that justification is by faith, not works of the law — a text that became central to Luther\'s Reformation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})},
]},
];
