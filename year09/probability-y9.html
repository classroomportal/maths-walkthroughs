<style>
:root{--red:#C0272D;--dark:#7A1418;--cream:#FBF6F1;--ink:#241A17;--line:#E4D6CE;--gold:#C8922A;}

body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}

.ht{font-size:15px;font-weight:700;}

.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}

.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#fdf7f4);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}

.nq-btn{font-size:11px;font-weight:600;padding:3px 9px;border-radius:3px;border:1px solid var(--gold);background:#fff;color:var(--gold);cursor:pointer;font-family:inherit;}
.nq-btn:hover{background:var(--gold);color:#fff;}
.try-q{font-size:15px;line-height:1.55;margin-bottom:8px;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:"›";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;align-items:center;}
.fracbox{display:flex;flex-direction:column;align-items:center;}

.fracbox input:focus{border-color:var(--gold);}
.fracline{width:64px;height:2px;background:var(--ink);margin:4px 0;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}

.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
var ST={};
function tryIt(genOrObj){
  var genFn=typeof genOrObj==='function'?genOrObj:function(){return genOrObj;};
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn(); ST[id]={o:o,fn:genFn};
  return buildTry(id,o);
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  var ansBox=o.frac
    ? '<div class="ar"><div class="fracbox"><input type="number" step="any" placeholder="num" class="try-num" data-tryid="'+id+'"/><div class="fracline"></div><input type="number" step="any" placeholder="den" class="try-den" data-tryid="'+id+'"/></div><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    : '<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>';
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">\u2714 Your Turn <button class="nq-btn" data-tryid="'+id+'">\u21bb New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'
    +'<ul class="hl">'+(h||'')+'</ul>'
    +ansBox
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'</div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('nq-btn')){
    var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;
    var o=en.fn();en.o=o;ST[id]={o:o,fn:en.fn};
    var wrap=document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;
    var o=en.o;
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
    if(!fb)return;
    if(o.frac){
      var ni=document.querySelector('.try-num[data-tryid="'+id+'"]');
      var di=document.querySelector('.try-den[data-tryid="'+id+'"]');
      if(!ni||!di)return;
      var nv=parseFloat(ni.value),dv=parseFloat(di.value);
      if(isNaN(nv)||isNaN(dv)||dv===0){fb.className='try-fb er';fb.textContent='Enter a valid fraction (numerator and denominator).';return;}
      if(Math.abs(nv/dv-o.ansN/o.ansD)<1e-6){fb.className='try-fb ok';fb.innerHTML='\u2713 Correct! \u00a0'+o.working;}
      else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
      return;
    }
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    if(!inp)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    var tol=o.tol!=null?o.tol:0.5;
    if(Math.abs(v-o.ans)<=tol){fb.className='try-fb ok';fb.innerHTML='\u2713 Correct! \u00a0'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#241A17';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="2"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(sw||1.5)+'"/>';}

function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 280');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Mutually exclusive events','#C0272D',13,'middle',true));
  var events=['Red','Blue','Green','Yellow'];var probs=['0\u00b73','0\u00b72','0\u00b74','?'];
  if(p>=1){events.forEach(function(e,i){o.push(R(30+i*108,60,100,70,['#fce8d8','#e8f4ff','#e8f8ee','#fffbe8'][i],['#C0272D','#1a5a8a','#1a7a3a','#C8922A'][i],1.5));o.push(T(80+i*108,88,e,['#C0272D','#1a5a8a','#1a7a3a','#C8922A'][i],12,'middle',true));o.push(T(80+i*108,108,'P = '+probs[i],i<3?'#241A17':'#C8922A',14,'middle',i===3));});}
  if(p>=2){o.push(T(240,156,'Probabilities must sum to 1','#241A17',12,'middle',false));o.push(T(240,178,'P(Yellow) = 1 \u2212 0\u00b73 \u2212 0\u00b72 \u2212 0\u00b74 = 0\u00b71','#1a7a3a',14,'middle',true));}
  s.innerHTML=o.join('');
}
function dQ2(p){
  var s=g();s.setAttribute('viewBox','0 0 480 280');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Tree diagram: two coin flips','#C0272D',13,'middle',true));
  var ox=50,oy=148;
  if(p>=1){
    ['H','T'].forEach(function(c1,i){
      var y1=oy+(i-0.5)*80;
      o.push(L(ox,oy,ox+100,y1,'#C0272D',1.5));
      o.push(T(ox+110,y1,c1,'#C0272D',14,'start',true));
      o.push(T(ox+50,y1-10,'0\u00b75','#888',9,'middle',false));
      ['H','T'].forEach(function(c2,j){
        var y2=y1+(j-0.5)*40;
        o.push(L(ox+120,y1,ox+220,y2,'#1a5a8a',1.5));
        o.push(T(ox+230,y2,c2,'#1a5a8a',12,'start',true));
        o.push(T(ox+170,y2-8,'0\u00b75','#888',9,'middle',false));
        o.push(T(ox+320,y2,c1+c2,'#241A17',11,'start',false));
        o.push(T(ox+370,y2,'0\u00b725','#888',10,'start',false));
      });
    });
  }
  if(p>=2){o.push(T(240,254,'P(at least one H) = 1 \u2212 P(TT) = 1 \u2212 0\u00b725 = 0\u00b775','#1a7a3a',11,'middle',false));}
  s.innerHTML=o.join('');
}
function dQ3(p){
  var s=g();s.setAttribute('viewBox','0 0 480 280');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Independent events: P(A and B) = P(A) \u00d7 P(B)','#C0272D',11,'middle',true));
  if(p>=1){o.push(T(240,72,'Die rolled, coin flipped.','#241A17',13,'middle',false));o.push(T(240,92,'P(6 and Heads)?','#241A17',14,'middle',true));}
  if(p>=2){o.push(T(240,120,'P(6) = 1/6    P(Heads) = 1/2','#1a5a8a',13,'middle',false));o.push(T(240,144,'P(both) = 1/6 \u00d7 1/2 = 1/12','#1a7a3a',15,'middle',true));}
  if(p>=3){o.push(R(14,168,452,40,'#f8f8f8','#888',1));o.push(T(240,192,'Events are independent if one does not affect the other','#888',11,'middle',false));}
  s.innerHTML=o.join('');
}
function dQ4(p){
  var s=g();s.setAttribute('viewBox','0 0 480 280');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Without replacement: dependent events','#C0272D',12,'middle',true));
  if(p>=1){o.push(T(240,72,'Bag: 3 red, 2 blue (5 total)','#241A17',13,'middle',false));o.push(T(240,92,'P(red then red, without replacement)?','#241A17',13,'middle',false));}
  if(p>=2){o.push(T(240,120,'P(1st red) = 3/5','#C0272D',13,'middle',false));o.push(T(240,140,'P(2nd red | 1st red) = 2/4 = 1/2','#1a5a8a',13,'middle',false));}
  if(p>=3){o.push(R(140,158,200,40,'#e8f8ee','#1a7a3a',2));o.push(T(240,182,'P(both red) = 3/5 \u00d7 1/2 = 3/10','#1a7a3a',15,'middle',true));}
  if(p>=4){o.push(T(240,220,'After 1st draw: 4 balls left. Probabilities change.','#888',10,'middle',false));}
  s.innerHTML=o.join('');
}

function dQ5(p){
  var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Combined Sample Space Diagrams','#C0272D',13,'middle',true));
  var gx=130,gy=70,cell=38;
  o.push(T(gx+3*cell,56,'Die B','#888',10,'middle'));
  o.push(T(gx-32,gy+3*cell,'Die A','#888',10,'middle'));
  for(var c=1;c<=6;c++)o.push(T(gx+c*cell-cell/2,gy-8,c,'#C0272D',12,'middle',true));
  for(var r=1;r<=6;r++)o.push(T(gx-14,gy+r*cell-cell/2+4,r,'#C0272D',12,'middle',true));
  for(var i=0;i<=6;i++){o.push(L(gx,gy+i*cell,gx+6*cell,gy+i*cell,'#ddd',1));o.push(L(gx+i*cell,gy,gx+i*cell,gy+6*cell,'#ddd',1));}
  if(p>=1){
    for(var a=1;a<=6;a++)for(var b=1;b<=6;b++){
      var sum=a+b,cx=gx+b*cell-cell/2,cy=gy+a*cell-cell/2,hl=(sum===8);
      if(hl)o.push(R(cx-cell/2+2,cy-cell/2+2,cell-4,cell-4,'#d7f5df','#1a7a3a',1.5));
      o.push(T(cx,cy+4,sum,hl?'#1a7a3a':'#555',11,'middle',hl));
    }
  }
  if(p>=2)o.push(T(240,gy+6*cell+22,'5 cells sum to 8 \u2192 P(sum=8) = 5/36','#1a7a3a',13,'middle',true));
  s.innerHTML=o.join('');
}
function dQ6(p){
  var s=g();s.setAttribute('viewBox','0 0 480 280');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Venn Diagrams and Probability','#C0272D',13,'middle',true));
  o.push(C(175,150,85,'#fce8d8','#C0272D',2));o.push(C(305,150,85,'#e8f4ff','#1a5a8a',2));
  o.push(T(115,150,'A','#C0272D',15,'middle',true));
  o.push(T(365,150,'B','#1a5a8a',15,'middle',true));
  if(p>=1)o.push(T(240,153,'A\u2229B','#241A17',13,'middle',true));
  if(p>=2)o.push(T(240,255,'P(A\u222aB) = P(A) + P(B) \u2212 P(A\u2229B)','#1a7a3a',13,'middle',true));
  s.innerHTML=o.join('');
}
function dQ7(p){
  var s=g();s.setAttribute('viewBox','0 0 480 280');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Conditional Probability (basic)','#C0272D',13,'middle',true));
  if(p>=1)o.push(T(240,80,'P(A | B) means: probability of A, GIVEN B has happened','#241A17',13,'middle'));
  if(p>=2)o.push(T(240,120,'Only consider the outcomes where B is true','#1a5a8a',13,'middle'));
  if(p>=3)o.push(T(240,150,'P(A|B) = P(A\u2229B) \u00f7 P(B)','#1a7a3a',15,'middle',true));
  s.innerHTML=o.join('');
}
function dQ8(p){
  var s=g();s.setAttribute('viewBox','0 0 480 280');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Expected Frequency from Probability','#C0272D',13,'middle',true));
  if(p>=1)o.push(T(240,80,'Expected frequency = probability \u00d7 number of trials','#241A17',13,'middle'));
  if(p>=2)o.push(T(240,120,'e.g. P(6) = 1/6, rolled 300 times','#1a5a8a',14,'middle'));
  if(p>=3)o.push(T(240,150,'Expected = 1/6 \u00d7 300 = 50','#1a7a3a',16,'middle',true));
  s.innerHTML=o.join('');
}
function dQ9(p){
  var s=g();s.setAttribute('viewBox','0 0 480 280');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Tree Diagrams \u2014 "At Least One"','#C0272D',13,'middle',true));
  if(p>=1)o.push(T(240,80,'"At least one" = 1 \u2212 P(none)','#241A17',14,'middle'));
  if(p>=2)o.push(T(240,110,'Find P(none happen), then subtract from 1','#1a5a8a',13,'middle'));
  if(p>=3)o.push(T(240,150,'Often much easier than adding every other case!','#1a7a3a',13,'middle',true));
  s.innerHTML=o.join('');
}
function dQ10(p){
  var s=g();s.setAttribute('viewBox','0 0 480 280');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Mixed Probability Problems','#C0272D',13,'middle',true));
  if(p>=1)o.push(T(240,80,'Step 1: identify if events are independent or dependent','#241A17',13,'middle'));
  if(p>=2)o.push(T(240,110,'Step 2: with/without replacement changes the 2nd probability','#1a5a8a',13,'middle'));
  if(p>=3)o.push(T(240,150,'Step 3: multiply along branches, add across outcomes','#1a7a3a',13,'middle',true));
