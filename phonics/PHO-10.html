<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suffixes: -ing, -ed, -er, -est — Phonics Support — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.7; font-size:1.15rem; }
  .big-word { font-size:1.8rem; font-weight:700; text-align:center; margin:14px 0; color:var(--dark); }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:center; padding:14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; font-size:1.3rem; font-weight:600; }
  .opt-text { flex:1; text-align:center; }
  .opt-speak { background:none; border:none; font-size:1.1rem; cursor:pointer; padding:0 4px; flex-shrink:0; }
  .listen-btn { display:inline-flex; align-items:center; gap:6px; background:var(--dark); color:#fff; border:none;
         padding:8px 16px; border-radius:20px; font-size:0.95rem; cursor:pointer; margin:8px auto; }
  .opt:hover { border-color:var(--red); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Phonics: Suffixes: -ing, -ed, -er, -est</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is a suffix?", "teach": ["A suffix is a group of letters added to the end of a word to change its meaning.", "Example: 'jump' + 'ing' = 'jumping' (an action happening now).", "Suffixes are added onto a base word (also called a root word)."], "yt_prompt": "Which of these is a suffix?"}, {"title": "The suffix '-ing'", "teach": ["'-ing' shows an action is happening right now.", "Example: 'walk' + 'ing' = 'walking' (happening now).", "This is one of the most common suffixes in English."], "yt_prompt": "What does 'jump' become when you add '-ing'?"}, {"title": "The suffix '-ing' with doubling", "teach": ["Sometimes you double the last letter before adding '-ing' \u2014 this happens with short words ending in one vowel + one consonant.", "Example: 'run' + 'ing' = 'running' (the 'n' doubles).", "This rule keeps the vowel sound short instead of accidentally making it long."], "yt_prompt": "What does 'run' become when you add '-ing'?"}, {"title": "The suffix '-ed'", "teach": ["'-ed' shows an action already happened in the past.", "Example: 'walk' + 'ed' = 'walked' (happened before).", "This is one of the most common ways to show past tense in English."], "yt_prompt": "What does 'jump' become when you add '-ed'?"}, {"title": "The suffix '-ed' with doubling", "teach": ["Just like '-ing', sometimes you double the last letter before adding '-ed'.", "Example: 'stop' + 'ed' = 'stopped' (the 'p' doubles).", "The same rule applies: short words ending in one vowel + one consonant usually double."], "yt_prompt": "What does 'stop' become when you add '-ed'?"}, {"title": "The suffix '-ed' sounding like 't'", "teach": ["'-ed' doesn't always sound like 'ed' \u2014 sometimes it sounds like 't', like in 'jumped' (sounds like jump-t).", "The spelling stays the same ('-ed') even though the sound changes depending on the word.", "This is worth knowing so the spelling doesn't feel confusing when it doesn't match the sound exactly."], "yt_prompt": "Which spelling is correct for the past tense of 'walk'?"}, {"title": "The suffix '-er' (comparing two things)", "teach": ["'-er' is added to compare two things, meaning 'more'.", "Example: 'tall' + 'er' = 'taller' (more tall, comparing two things).", "This suffix is used constantly when comparing sizes, speeds, or qualities."], "yt_prompt": "What does 'small' become when you add '-er'?"}, {"title": "The suffix '-est' (comparing three or more things)", "teach": ["'-est' is added to show something is 'the most' when comparing three or more things.", "Example: 'tall' + 'est' = 'tallest' (the most tall, out of a whole group).", "'-er' compares two things; '-est' compares three or more \u2014 remembering this difference helps a lot."], "yt_prompt": "What does 'small' become when you add '-est'?"}, {"title": "Choosing between '-er' and '-est'", "teach": ["Use '-er' when comparing exactly two things, and '-est' when comparing three or more.", "Example: 'She is taller than her brother' (two people) vs 'She is the tallest in her class' (whole group).", "Reading the sentence carefully tells you how many things are being compared."], "yt_prompt": "Which suffix fits: 'Ade is the ___ runner in the whole school' (fast)?"}, {"title": "Mixed practice \u2014 suffixes", "teach": ["You've now covered '-ing', '-ed', '-er', and '-est' \u2014 four common and useful suffixes.", "Suffixes let you change one root word into many different forms, which is really efficient for both reading and spelling.", "This final question checks you can apply the right suffix confidently."], "yt_prompt": "What does 'big' become when comparing it to just one other thing (e.g. 'This one is ___ than that one')?"}];
function ytGen_0() { return {q:'', options:['-ing','jump','run'], answer_index:0}; }
function ytGen_1() { return {q:'jump + ing', options:['jumping','jumped','jumper'], answer_index:0}; }
function ytGen_2() { return {q:'run + ing', options:['running','runing','runeing'], answer_index:0}; }
function ytGen_3() { return {q:'jump + ed', options:['jumped','jumping','jumper'], answer_index:0}; }
function ytGen_4() { return {q:'stop + ed', options:['stopped','stoped','stopeed'], answer_index:0}; }
function ytGen_5() { return {q:'walk (past tense)', options:['walked','walkt','walkd'], answer_index:0}; }
function ytGen_6() { return {q:'small + er', options:['smaler','smaller','smallier'], answer_index:1}; }
function ytGen_7() { return {q:'small + est', options:['smallest','smallier','smalest'], answer_index:0}; }
function ytGen_8() { return {q:'Ade is the fast___ runner in the whole school.', options:['-est','-er','-ing'], answer_index:0}; }
function ytGen_9() { return {q:'big + er (doubling rule applies)', options:['bigger','biger','biggest'], answer_index:0}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let _voicesReady = false;
if ('speechSynthesis' in window) {
  // Prime the voice list — on some browsers (notably iOS Safari) the first
  // speak() call can silently fail if voices haven't loaded yet
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => { _voicesReady = true; };
}

function speak(text, repeat) {
  if (!('speechSynthesis' in window)) {
    alert('Sorry, this device/browser does not support reading text aloud. Try a different browser (e.g. Chrome or Safari) if this keeps happening.');
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const utter1 = new SpeechSynthesisUtterance(text);
    utter1.rate = 0.65;
    utter1.pitch = 1;
    utter1.lang = 'en-GB';
    window.speechSynthesis.speak(utter1);
    if (repeat) {
      const utter2 = new SpeechSynthesisUtterance(text);
      utter2.rate = 0.65;
      utter2.pitch = 1;
      utter2.lang = 'en-GB';
      window.speechSynthesis.speak(utter2);
    }
  } catch (e) {
    console.error('Speech synthesis failed:', e);
  }
}

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let answered = false;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>
      <button class="listen-btn" style="background:#888" onclick="speak(document.querySelector('.teach').textContent, false)">🔊 Read this aloud</button>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;
    let optsHtml = currentYT.options.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">
        <span class="opt-text">${opt}</span>
        <span class="opt-speak" onclick="event.stopPropagation(); speak('${opt.replace(/'/g, "\\'")}', true)">🔊</span>
      </button>`
    ).join('');
    const listenBtn = `<button class="listen-btn" onclick="speak('${q.yt_prompt.replace(/'/g, "\\'").replace(/[<>]/g,'')}', false)">🔊 Listen to the question</button>`;
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="big-word">${currentYT.q}</div>` : ''}
        ${listenBtn}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === currentYT.answer_index) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === currentYT.answer_index) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'PHO-10';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
    if (!topicRow) return;
    const { data: profRow } = await supabase.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
    if (!profRow) return;
    await supabase.from('walkthrough_interactions').insert({
      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
</script>
</body>
