<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single Letter Sounds (a-z) — Phonics Support — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.7; font-size:1.15rem; }
  .big-word { font-size:1.8rem; font-weight:700; text-align:center; margin:14px 0; color:var(--dark); }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:center; padding:14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; font-size:1.3rem; font-weight:600; }
  .opt-text { flex:1; text-align:center; }
  .opt-speak { background:none; border:none; font-size:1.1rem; cursor:pointer; padding:0 4px; flex-shrink:0; }
  .listen-btn { display:inline-flex; align-items:center; gap:6px; background:var(--dark); color:#fff; border:none;
         padding:8px 16px; border-radius:20px; font-size:0.95rem; cursor:pointer; margin:8px auto; }
  .opt:hover { border-color:var(--red); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Phonics: Single Letter Sounds (a-z)</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "The sound 's'", "sound": "sssssss", "audio": "../sounds/s-sound.mp3", "teach": ["The letter 'S' makes a hissing sound, like a snake.", "Words that start with this sound: sun, sit, sock.", "Look at the shape of the letter 's' \u2014 it curves like a snake too, which can help you remember it.", "How to make it: point the tip of your tongue up near the roof of your mouth, just behind your top teeth \u2014 but don't let it touch. Push air gently through that tiny gap to make the hiss."], "yt_prompt": "Which word starts with the 's' sound?"}, {"title": "The sound 'a'", "sound": "a-a-a", "audio": "../sounds/a-sound.mp3", "teach": ["The letter 'a' makes a short sound, like in 'apple' or 'cat'.", "Open your mouth to say it: 'a, a, a'.", "Words with this sound: ant, bag, hat.", "How to make it: drop your jaw open and keep your tongue low and flat. Your lips stay relaxed, not rounded."], "yt_prompt": "Which word has the short 'a' sound?"}, {"title": "The sound 't'", "sound": "tuh", "audio": "../sounds/t-sound.mp3", "teach": ["The letter 't' is a sharp, tapping sound, made with your tongue behind your teeth.", "Words that start with this sound: top, tap, ten.", "Try tapping your finger on the table each time you say 't' \u2014 it helps the sound feel more solid.", "How to make it: press the TIP of your tongue firmly against the ridge just behind your top front teeth, then let go quickly with a little puff of air."], "yt_prompt": "Which word starts with the 't' sound?"}, {"title": "The sound 'p'", "sound": "puh", "audio": "../sounds/p-sound.mp3", "teach": ["The letter 'p' makes a soft popping sound with your lips.", "Words that start with this sound: pig, pen, pot.", "Try holding your hand in front of your mouth \u2014 you should feel a small puff of air when you say 'p'.", "How to make it: press your lips together, then pop them open suddenly \u2014 your tongue doesn't do anything for this sound."], "yt_prompt": "Which word starts with the 'p' sound?"}, {"title": "The sound 'n'", "sound": "nnnnnnn", "audio": "../sounds/n-sound.mp3", "teach": ["The letter 'n' is made with your tongue touching just behind your top teeth.", "Words that start with this sound: net, nut, nap.", "This sound can be held for a long time \u2014 try saying 'nnnnn' slowly.", "How to make it: touch the same spot as 't' and 'd' \u2014 the ridge just behind your top front teeth \u2014 but let the air flow out through your NOSE instead of your mouth."], "yt_prompt": "Which word starts with the 'n' sound?"}, {"title": "The sound 'i'", "sound": "i-i-i", "audio": "../sounds/i-sound.mp3", "teach": ["The letter 'i' makes a short sound, like in 'in' or 'pig'.", "Words with this sound: sit, big, fin.", "This sound is quick and sharp \u2014 say 'i, i, i' with a small smile.", "How to make it: lift your tongue up and forward in your mouth, keep your lips relaxed, and only open your mouth a little bit."], "yt_prompt": "Which word has the short 'i' sound?"}, {"title": "The sound 'm'", "sound": "mmmmmmm", "audio": "../sounds/m-sound.mp3", "teach": ["The letter 'm' is made by closing your lips together and humming.", "Words that start with this sound: mat, map, man.", "Try humming with your mouth closed \u2014 that's the 'm' sound.", "How to make it: press your lips together like 'p', but instead of popping them open, hum through your nose \u2014 you can hold this one for as long as you like."], "yt_prompt": "Which word starts with the 'm' sound?"}, {"title": "The sound 'd'", "sound": "duh", "audio": "../sounds/d-sound.mp3", "teach": ["The letter 'd' is made with your tongue touching the roof of your mouth just behind your teeth.", "Words that start with this sound: dog, dig, dad.", "This sound is a bit like 't' but softer \u2014 try comparing the two sounds.", "How to make it: same tongue spot as 't', pressed against the ridge behind your top teeth \u2014 but let your voice buzz at the same time, which is what makes it sound softer than 't'."], "yt_prompt": "Which word starts with the 'd' sound?"}, {"title": "The sound 'g'", "sound": "guh", "audio": "../sounds/g-sound.mp3", "teach": ["The letter 'g' (hard sound) is made at the back of your throat, like in 'go' or 'dog'.", "Words that start with this sound: go, gap, gum.", "Feel your throat when you say 'g' \u2014 you should feel it vibrate.", "How to make it: lift the BACK of your tongue up to touch the soft part at the back of the roof of your mouth, then let go."], "yt_prompt": "Which word starts with the 'g' sound?"}, {"title": "The sound 'o'", "sound": "o-o-o", "audio": "../sounds/o-sound.mp3", "teach": ["The letter 'o' makes a short sound, like in 'hot' or 'dog'.", "Words with this sound: pot, box, top.", "Make an 'o' shape with your mouth when you say this sound \u2014 like you're surprised.", "How to make it: make a rounded, open shape with your mouth, and pull your tongue back and keep it low."], "yt_prompt": "Which word has the short 'o' sound?"}];

// Each entry: one correct word for this letter's sound, plus a pool of distractor
// words (none of which start with/contain the target sound). A fresh draw picks
// 3 distractors at random and shuffles them in with the correct word, so the
// correct answer is NOT always in the same position and the question varies
// across attempts.
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickN(pool, n) { return shuffle(pool).slice(0, n); }
function makeYT(correctPool, distractorPool) {
  const correct = correctPool[Math.floor(Math.random() * correctPool.length)];
  const distractors = pickN(distractorPool, 3);
  const options = shuffle([correct, ...distractors]);
  return { q: '', options, answer_index: options.indexOf(correct) };
}
const YT_DATA = [
  { correct: ['sun','sit','sock','sad'],  distract: ['moon','bird','cat','dog','red','fish'] },
  { correct: ['ant','bag','hat','cap'],   distract: ['dog','moon','pen','sun','fish','red'] },
  { correct: ['top','tap','ten','tin'],   distract: ['sun','red','pig','moon','cat','bag'] },
  { correct: ['pig','pen','pot','pan'],   distract: ['fish','cup','dog','sun','moon','red'] },
  { correct: ['net','nut','nap','nod'],   distract: ['top','bag','cat','sun','pig','red'] },
  { correct: ['sit','big','fin','pin'],   distract: ['cat','sun','moon','dog','red','top'] },
  { correct: ['mat','map','man','mud'],   distract: ['sun','dog','red','pig','moon','cat'] },
  { correct: ['dog','dig','dad','den'],   distract: ['cat','sun','red','moon','pig','top'] },
  { correct: ['go','gap','gum','gas'],    distract: ['sun','red','moon','cat','dog','pig'] },
  { correct: ['pot','box','top','hop'],   distract: ['pig','cat','red','sun','moon','dog'] }
];
const YT_GENS = YT_DATA.map(d => () => makeYT(d.correct, d.distract));

let _voicesReady = false;
if ('speechSynthesis' in window) {
  // Prime the voice list — on some browsers (notably iOS Safari) the first
  // speak() call can silently fail if voices haven't loaded yet
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => { _voicesReady = true; };
}

function speak(text, repeat) {
  if (!('speechSynthesis' in window)) {
    alert('Sorry, this device/browser does not support reading text aloud. Try a different browser (e.g. Chrome or Safari) if this keeps happening.');
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const utter1 = new SpeechSynthesisUtterance(text);
    utter1.rate = 0.65;
    utter1.pitch = 1;
    utter1.lang = 'en-GB';
    window.speechSynthesis.speak(utter1);
    if (repeat) {
      const utter2 = new SpeechSynthesisUtterance(text);
      utter2.rate = 0.65;
      utter2.pitch = 1;
      utter2.lang = 'en-GB';
      window.speechSynthesis.speak(utter2);
    }
  } catch (e) {
    console.error('Speech synthesis failed:', e);
  }
}

let qIdx = 0;
function q_sound_for_current() { return QUESTIONS[qIdx].sound || QUESTIONS[qIdx].title; }
function playCurrentSound() {
  const q = QUESTIONS[qIdx];
  if (q.audio) {
    // A real recorded voice — always more accurate than synthesised speech,
    // and the only good option for sounds a computer voice can't isolate well.
    const player = new Audio(q.audio);
    player.play().catch(err => {
      console.error('Audio playback failed, falling back to speech synthesis:', err);
      speak(q_sound_for_current(), true);
    });
  } else {
    speak(q_sound_for_current(), true);
  }
}
let stepIdx = 0;
const STEPS_PER_Q = 5;
let currentYT = null;
let answered = false;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 4) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>
      <button class="listen-btn" onclick="playCurrentSound()">🔊 Hear the sound</button>
      <button class="listen-btn" style="background:#888" onclick="speak(document.querySelector('.teach').textContent, false)">🔊 Read this aloud</button>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;
    let optsHtml = currentYT.options.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">
        <span class="opt-text">${opt}</span>
        <span class="opt-speak" onclick="event.stopPropagation(); speak('${opt.replace(/'/g, "\\'")}', true)">🔊</span>
      </button>`
    ).join('');
    const listenBtn = `<button class="listen-btn" onclick="speak('${q.yt_prompt.replace(/'/g, "\\'").replace(/[<>]/g,'')}', false)">🔊 Listen to the question</button>`;
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="big-word">${currentYT.q}</div>` : ''}
        ${listenBtn}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === currentYT.answer_index) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === currentYT.answer_index) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 4) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 4; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'PHO-01';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
    if (!topicRow) return;
    const { data: profRow } = await supabase.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
    if (!profRow) return;
    await supabase.from('walkthrough_interactions').insert({
      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
};

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
</script>
