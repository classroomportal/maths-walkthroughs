<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vowel Digraphs (ai, ee, oa, oo, ou) — Phonics Support — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.7; font-size:1.15rem; }
  .big-word { font-size:1.8rem; font-weight:700; text-align:center; margin:14px 0; color:var(--dark); }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:center; padding:14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; font-size:1.3rem; font-weight:600; }
  .opt-text { flex:1; text-align:center; }
  .opt-speak { background:none; border:none; font-size:1.1rem; cursor:pointer; padding:0 4px; flex-shrink:0; }
  .listen-btn { display:inline-flex; align-items:center; gap:6px; background:var(--dark); color:#fff; border:none;
         padding:8px 16px; border-radius:20px; font-size:0.95rem; cursor:pointer; margin:8px auto; }
  .opt:hover { border-color:var(--red); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  button.act { background:var(--red); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:10px; }
  button.act:disabled { background:#ccc; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Phonics: Vowel Digraphs (ai, ee, oa, oo, ou)</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "The 'ai' sound", "sound": "ai-ai-ai", "audio": "../sounds/ai-sound.mp3", "teach": ["Two letters, 'a' and 'i', together make a long 'a' sound, like in 'rain'.", "Words with this sound: rain, pain, train.", "This digraph usually appears in the middle of a word, not at the very end."], "yt_prompt": "Which word has the 'ai' sound?"}, {"title": "The 'ee' sound", "sound": "ee-ee-ee", "audio": "../sounds/ee-sound.mp3", "teach": ["Two letters, 'e' and 'e', together make a long 'e' sound, like in 'tree'.", "Words with this sound: tree, see, feet.", "This is one of the most common vowel digraphs in English."], "yt_prompt": "Which word has the 'ee' sound?"}, {"title": "The 'oa' sound", "sound": "oa-oa-oa", "audio": "../sounds/oa-sound.mp3", "teach": ["Two letters, 'o' and 'a', together make a long 'o' sound, like in 'boat'.", "Words with this sound: boat, coat, road.", "This digraph usually appears in the middle of a word."], "yt_prompt": "Which word has the 'oa' sound?"}, {"title": "The 'oo' sound (long)", "sound": "oo-oo-oo", "audio": "../sounds/oo-sound.mp3", "teach": ["Two letters, 'o' and 'o', can make a long sound, like in 'moon'.", "Words with this sound: moon, food, boot.", "Round your lips when you say this sound, like you're about to whistle."], "yt_prompt": "Which word has the long 'oo' sound?"}, {"title": "The 'oo' sound (short)", "sound": "oo (short)", "audio": "../sounds/oo-short-sound.mp3", "teach": ["'oo' can also make a shorter sound, like in 'book' or 'look'.", "Words with this sound: book, look, foot.", "Compare 'moon' (long oo) and 'book' (short oo) \u2014 same letters, slightly different sound."], "yt_prompt": "Which word has the short 'oo' sound, like in 'book'?"}, {"title": "The 'ou' sound", "sound": "ou-ou-ou", "audio": "../sounds/ou-sound.mp3", "teach": ["Two letters, 'o' and 'u', together can make a sound like in 'out' or 'loud'.", "Words with this sound: out, loud, cloud.", "This digraph is sometimes tricky because 'ou' can sound differently in different words \u2014 but this is the most common pattern."], "yt_prompt": "Which word has the 'ou' sound as in 'out'?"}, {"title": "Comparing 'ai' and 'ee'", "sound": "ee-ee-ee", "audio": "../sounds/ee-sound.mp3", "teach": ["'ai' and 'ee' are both vowel digraphs but make very different sounds \u2014 'ai' is like 'a', 'ee' is like 'e'.", "Practice saying 'rain' and 'tree' one after another to notice the difference.", "Being able to tell vowel digraphs apart helps a lot with both reading and spelling."], "yt_prompt": "Which word has the 'ee' sound, not 'ai'?"}, {"title": "Spotting vowel digraphs in longer words", "sound": "oa-oa-oa", "audio": "../sounds/oa-sound.mp3", "teach": ["Vowel digraphs can appear inside longer words too, not just short ones.", "Example: 'raining' still has the 'ai' sound in the middle.", "Break the word into smaller parts if it helps you spot the digraph."], "yt_prompt": "Which word has the 'oa' sound inside it?"}, {"title": "Vowel digraphs vs single vowel sounds", "sound": "ai-ai-ai", "audio": "../sounds/ai-sound.mp3", "teach": ["A vowel digraph makes one sound from two letters \u2014 different from a single vowel making its own short sound.", "Example: 'cat' has a single short 'a', while 'rain' has the 'ai' digraph making a different sound.", "Comparing pairs like this helps train your ear to spot the difference quickly."], "yt_prompt": "Which word has a vowel digraph (two letters, one sound)?"}, {"title": "Mixed practice \u2014 vowel digraphs", "sound": "oa-oa-oa", "audio": "../sounds/oa-sound.mp3", "teach": ["You've now covered 'ai', 'ee', 'oa', 'oo' (long and short), and 'ou'.", "These vowel digraphs appear constantly in everyday reading, so recognising them quickly makes a big difference.", "This final question checks you can spot the right digraph confidently."], "yt_prompt": "Which word has the 'oa' sound?"}];

// Randomised per-attempt options: each checkpoint draws one correct word from a
// pool and 3 distractors from a separate pool, then shuffles all 4 into place —
// so the correct answer is not always in the same position, and repeated runs
// through the walkthrough see different word combinations.
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickN(pool, n) { return shuffle(pool).slice(0, n); }
function makeYT(correctPool, distractorPool) {
  const correct = correctPool[Math.floor(Math.random() * correctPool.length)];
  const distractors = pickN(distractorPool, 3);
  const options = shuffle([correct, ...distractors]);
  return { q: '', options, answer_index: options.indexOf(correct) };
}
const YT_DATA = [
  { correct: ['rain','pain','train','snail'],   distract: ['ran','run','sun','dog','cat','moon'] },
  { correct: ['tree','see','feet','green'],      distract: ['ten','tin','sun','dog','cat','moon'] },
  { correct: ['boat','coat','road','soap'],      distract: ['bat','but','sun','dog','cat','moon'] },
  { correct: ['moon','food','boot','room'],      distract: ['mop','man','sun','dog','cat','red'] },
  { correct: ['book','look','foot','wood'],      distract: ['moon','food','sun','dog','cat','red'] },
  { correct: ['loud','cloud','out','shout'],     distract: ['load','led','sun','dog','cat','moon'] },
  { correct: ['tree','see','feet','green'],      distract: ['rain','train','sun','dog','cat','moon'] },
  { correct: ['coating','moaning','soaking','floating'], distract: ['running','jumping','sun','dog','cat'] },
  { correct: ['rain','pain','train','snail'],    distract: ['ran','rat','sun','dog','cat','moon'] },
  { correct: ['road','boat','coat','soap'],      distract: ['red','rid','sun','dog','cat','moon'] }
];
const YT_GENS = YT_DATA.map(d => () => makeYT(d.correct, d.distract));

let _voicesReady = false;
if ('speechSynthesis' in window) {
  // Prime the voice list — on some browsers (notably iOS Safari) the first
  // speak() call can silently fail if voices haven't loaded yet
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => { _voicesReady = true; };
}

function speak(text, repeat) {
  if (!('speechSynthesis' in window)) {
    alert('Sorry, this device/browser does not support reading text aloud. Try a different browser (e.g. Chrome or Safari) if this keeps happening.');
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const utter1 = new SpeechSynthesisUtterance(text);
    utter1.rate = 0.65;
    utter1.pitch = 1;
    utter1.lang = 'en-GB';
    window.speechSynthesis.speak(utter1);
    if (repeat) {
      const utter2 = new SpeechSynthesisUtterance(text);
      utter2.rate = 0.65;
      utter2.pitch = 1;
      utter2.lang = 'en-GB';
      window.speechSynthesis.speak(utter2);
    }
  } catch (e) {
    console.error('Speech synthesis failed:', e);
  }
}

let qIdx = 0;
function q_sound_for_current() { return QUESTIONS[qIdx].sound || QUESTIONS[qIdx].title; }
function playCurrentSound() {
  const q = QUESTIONS[qIdx];
  if (q.audio) {
    // A real recorded voice — always more accurate than synthesised speech,
    // and the only good option for a vowel digraph sound a computer voice can't isolate well.
    const player = new Audio(q.audio);
    player.play().catch(err => {
      console.error('Audio playback failed, falling back to speech synthesis:', err);
      speak(q_sound_for_current(), true);
    });
  } else {
    speak(q_sound_for_current(), true);
  }
}
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let answered = false;

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>
      <button class="listen-btn" onclick="playCurrentSound()">🔊 Hear the sound</button>
      <button class="listen-btn" style="background:#888" onclick="speak(document.querySelector('.teach').textContent, false)">🔊 Read this aloud</button>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;
    let optsHtml = currentYT.options.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">
        <span class="opt-text">${opt}</span>
        <span class="opt-speak" onclick="event.stopPropagation(); speak('${opt.replace(/'/g, "\\'")}', true)">🔊</span>
      </button>`
    ).join('');
    const listenBtn = `<button class="listen-btn" onclick="speak('${q.yt_prompt.replace(/'/g, "\\'").replace(/[<>]/g,'')}', false)">🔊 Listen to the question</button>`;
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="big-word">${currentYT.q}</div>` : ''}
        ${listenBtn}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === currentYT.answer_index) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === currentYT.answer_index) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch((err) => {
      console.error('markComplete failed:', err);
      const msg = (err && err.message) ? err.message : 'Unknown error';
      document.getElementById('completeStatus').innerHTML = `<div style="color:var(--red); font-size:0.9rem;">Could not save automatically: ${msg}</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>`;
    });
  }
}

render();
</script>

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();

    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();

}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
