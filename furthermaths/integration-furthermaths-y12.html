<style>
:root{--red:#C0272D;--dark:#7A1418;--cream:#FBF6F1;--ink:#241A17;--line:#E4D6CE;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#fdf7f4);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}
.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.nq-btn{font-size:11px;font-weight:600;padding:3px 9px;border-radius:3px;border:1px solid var(--gold);background:#fff;color:var(--gold);cursor:pointer;font-family:inherit;}
.try-q{font-size:15px;line-height:1.55;margin-bottom:8px;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:"›";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
.eqs{display:flex;flex-direction:column;gap:3px;margin:4px 0;}
.eqs .rw{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;font-family:'Cambria Math',Georgia,serif;font-size:17px;}
.eqs .rw.sub{border-top:1.5px solid var(--ink);margin-top:3px;padding-top:4px;}
.eqs .rw .l{text-align:right;padding-right:10px;}
.eqs .rw .o{text-align:center;color:var(--red);font-weight:700;}
.eqs .rw .r{text-align:left;padding-left:10px;}
.eqs .rw .r .chk{color:#1a7a3a;font-weight:700;margin-left:4px;}
.terms{font-family:'Cambria Math',Georgia,serif;font-size:16px;line-height:1.9;text-align:center;}
.terms b{color:var(--dark);}
sup,sub{font-size:.7em;}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.05;font-size:.92em;}
.frac .n{display:block;padding:0 4px 1px;border-bottom:1.4px solid currentColor;}
.frac .d{display:block;padding:1px 4px 0;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ST={};
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function round2(x){return Math.round(x*100)/100;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
/* Reads a typed answer: whole numbers, decimals or fractions such as 3/5 or -2/3 */
function parseAns(str){str=String(str||'').replace(/\s+/g,'').replace(/\u2212/g,'-');if(!str)return NaN;var m=str.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);if(m){var d=parseFloat(m[2]);return d===0?NaN:parseFloat(m[1])/d;}return /^-?\d*\.?\d+$/.test(str)?parseFloat(str):NaN;}
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,fn:genFn};return buildTry(id,o);}
function buildTry(id,o){var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');var ph='Answer'+(o.unit?' ('+o.unit+')':'');return '<div class="try" data-tryid="'+id+'"><div class="try-t">✔ Your Turn <button class="nq-btn" data-tryid="'+id+'">↻ New</button></div><div class="try-q">'+o.question+'</div><ul class="hl">'+(h||'')+'</ul>'+(o.fields?'<div class="ar" style="align-items:center;flex-wrap:wrap;font-family:Georgia,serif;font-size:18px;">'+o.template.replace(/\{(\d)\}/g,function(_,i){return '<input type="text" class="try-fld" data-tryid="'+id+'" data-i="'+i+'" placeholder="'+(o.fields[i].ph||'?')+'" style="flex:none;width:'+(o.fields[i].w||70)+'px;font-size:15px;padding:5px 6px;text-align:center;border:1px solid #E4D6CE;border-radius:3px;"/>';})+'<button class="ck try-ck" data-tryid="'+id+'" style="margin-left:10px;">Check</button></div>':'<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>')+'<div class="try-fb" data-tryid="'+id+'"></div><details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details></div>';}
document.addEventListener('click',function(e){var el=e.target;if(el.classList.contains('nq-btn')){var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;var o=en.fn();en.o=o;ST[id]={o:o,fn:en.fn};var wrap=document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);return;}if(el.classList.contains('try-ck')){var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;var o=en.o;if(o.fields){var fbx=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fbx)return;var bad=[],empty=false;o.fields.forEach(function(f,i){var el2=document.querySelector('.try-fld[data-tryid="'+id+'"][data-i="'+i+'"]');var v2=parseAns(el2?el2.value:'');if(isNaN(v2)){empty=true;return;}if(Math.abs(v2-f.ans)>(f.tol!=null?f.tol:0.005))bad.push(f.name);});if(empty){fbx.className='try-fb er';fbx.textContent='Fill in every box. You can type a fraction such as 3/5.';return;}if(!bad.length){fbx.className='try-fb ok';fbx.innerHTML='✓ Correct!  '+o.working;}else{fbx.className='try-fb er';fbx.textContent='Not quite — check the '+bad.join(' and the ')+'.';}return;}var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;var v=parseFloat(inp.value);if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}var tol=o.tol!=null?o.tol:0.01;if(Math.abs(v-o.ans)<=tol){fb.className='try-fb ok';fb.innerHTML='✓ Correct!  '+o.working;}else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}}});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Georgia,serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#C0272D';w=w||2;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function dGeneric(title,lines){return function(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));o.push(T(240,30,title,'#C0272D',13,'middle',true));lines.forEach(function(ln,i){if(p>=i){var last=i===lines.length-1;o.push(R(30,50+i*46,420,38,last?'#e8f8ee':'#f8f8f8',last?'#1a7a3a':'#ccc',last?2:1));o.push(T(240,74+i*46,ln,last?'#1a7a3a':'#241A17',last?14:12,'middle',last));}});s.innerHTML=o.join('');};}
var dQ1=dGeneric('Power rule for integration',['∫xⁿ dx = xⁿ⁺¹/(n+1) + c','Raise the power by 1, then divide by the new power','∫x⁴ dx = x⁵/5 + c']);
var dQ2=dGeneric('Integrate term by term',['Integrate each term separately','∫3x² dx = x³, ∫4x dx = 2x², ∫−5 dx = −5x','Combine and add c']);
var dQ3=dGeneric('Evaluate between limits',['∫ₐᵇ f(x) dx = [F(x)]ₐᵇ = F(b) − F(a)','Find the antiderivative F(x) first, then substitute the limits']);
var dQ4=dGeneric('Definite integral = area',['Area = ∫₀² x² dx','Antiderivative: x³/3','Evaluate at limits']);
var dQ5=dGeneric('Linear composite rule',['∫(ax+b)ⁿ dx = (ax+b)ⁿ⁺¹ / [a(n+1)] + c','Divide by (power+1) AND by the coefficient of x']);
var dQ6=dGeneric('Integrate, then use a condition to find c',['Integrate f’(x) to get f(x) + c','Substitute the known point to solve for c']);
var dQ7=dGeneric('Integrate velocity to get displacement',['s = ∫v dt','Evaluate as a definite integral between the given times']);
var dQ8=dGeneric('Special case: reciprocal function',['∫(1/x) dx = ln|x| + c','Constant multiples carry through: ∫(k/x) dx = k·ln|x| + c']);
var dQ9=dGeneric('Standard trig integrals',['∫cos x dx = sin x + c','∫sin x dx = −cos x + c']);
var dQ10=dGeneric('Integrate the difference of functions',['Area = ∫ₐᵇ [f(x) − g(x)] dx, using the upper curve minus the lower curve']);
var QS=[
  {ey:'Q1 \u00b7 Integration \u00b7 Further Maths',ti:'Integrating a Power of x',
   su:'Find ∫ x⁴ dx',
   steps:[
    {lb:'Power rule',dr:dQ1,ht:'<p>To integrate a power of x, <b>raise the power by 1</b> and <b>divide by the new power</b>. Always add a constant of integration, c.</p><div class="fm">∫ x<sup>n</sup> dx = x<sup>n+1</sup>/(n+1) + c</div>'},
    {lb:'Apply to x⁴',dr:dQ1,ht:'<div class="fm">∫ x<sup>4</sup> dx = x<sup>5</sup>/5 + c</div><p>Check by differentiating: d/dx(x<sup>5</sup>/5) = 5x<sup>4</sup>/5 = x<sup>4</sup>. ✓</p>'},
    {lb:'Answer',dr:dQ1,ht:'<div class="fm">∫ x<sup>4</sup> dx = <b>x<sup>5</sup>/5 + c</b></div>'},
    {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var n=rnd(2,6),k=pick([1,2,3,4,5,n+1,2*(n+1)]);
      var g0=gcd(k,n+1),num=k/g0,den=(n+1)/g0,coef=den===1?String(num):num+'/'+den;
      return {question:'Find <b>\u222b '+(k===1?'':k)+'x<sup>'+n+'</sup> dx</b>. Fill in the boxes to complete the answer.',
        template:'\u222b '+(k===1?'':k)+'x<sup>'+n+'</sup> dx = {0}&thinsp;x<sup style="font-size:12px;">{1}</sup>&nbsp;+ c',
        fields:[{name:'number in front of x',ans:k/(n+1),ph:'number',w:74},{name:'power of x',ans:n+1,tol:0,ph:'power',w:62}],
        hints:['Raise the power by 1: '+n+' + 1 = '+(n+1),'Divide by the new power: '+(k===1?'1':k)+' \u00f7 '+(n+1)+(den===1?' = '+num:' = '+coef),'You can type the number in front as a fraction, e.g. 3/5'],
        working:'\u222b '+(k===1?'':k)+'x<sup>'+n+'</sup> dx = '+(k===1?'':k)+'x<sup>'+(n+1)+'</sup>/'+(n+1)+' + c = <b>'+(coef==='1'?'':coef+' ')+'x<sup>'+(n+1)+'</sup> + c</b>'};})}
   ]},

  {ey:'Q2 \u00b7 Integration \u00b7 Further Maths',ti:'Integrating a Sum of Terms',
   su:'Find ∫ (3x² + 4x − 5) dx',
   steps:[
    {lb:'Term-by-term rule',dr:dQ2,ht:'<p>Integration is linear: integrate each term of a sum or difference separately, then add a single constant c at the end.</p>'},
    {lb:'Integrate each term',dr:dQ2,ht:'<div class="fm">∫3x<sup>2</sup> dx = x<sup>3</sup> &ensp; ∫4x dx = 2x<sup>2</sup> &ensp; ∫−5 dx = −5x</div>'},
    {lb:'Combine',dr:dQ2,ht:'<div class="fm">∫(3x<sup>2</sup>+4x−5) dx = <b>x<sup>3</sup> + 2x<sup>2</sup> − 5x + c</b></div>'},
    {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var a=rnd(2,5),b=rnd(2,5);
      return {question:'Find \u222b('+a+'x\u00b2 + '+b+'x) dx \u2014 give the coefficient of x\u00b3 in your answer.',
        hints:['\u222bax\u00b2 dx = a/3 \u00d7 x\u00b3'],
        ans:round2(a/3),tol:0.01,unit:'',working:'\u222b'+a+'x\u00b2 dx = ('+a+'/3)x\u00b3, coefficient = '+round2(a/3)};})}
   ]},

  {ey:'Q3 \u00b7 Integration \u00b7 Further Maths',ti:'Definite Integrals',
   su:'Evaluate ∫₁³ (2x+1) dx',
   steps:[
    {lb:'Definite integral notation',dr:dQ3,ht:'<p>A definite integral has limits a and b. Find the antiderivative F(x), then compute F(b) − F(a).</p><div class="fm">∫<sub>a</sub><sup>b</sup> f(x) dx = [F(x)]<sub>a</sub><sup>b</sup> = F(b) − F(a)</div>'},
    {lb:'Find antiderivative',dr:dQ3,ht:'<div class="fm">∫(2x+1) dx = x<sup>2</sup>+x</div><p>So [x<sup>2</sup>+x]<sub>1</sub><sup>3</sup></p>'},
    {lb:'Substitute limits',dr:dQ3,ht:'<div class="fm"><div class="eqs"><div class="rw"><span class="l">(9+3)</span><span class="o">−</span><span class="r">(1+1) = 12−2 = <b>10</b></span></div></div></div>'},
    {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var a=rnd(1,3),b=rnd(a+2,a+5),m=rnd(2,4);
      var F=function(x){return m*x;};
      var ans=F(b)-F(a);
      return {question:'Evaluate \u222b from '+a+' to '+b+' of '+m+' dx.',
        hints:['\u222b'+m+' dx = '+m+'x','Evaluate '+m+'x at each limit and subtract'],
        ans:ans,tol:0,unit:'',working:m+'\u00d7'+b+' \u2212 '+m+'\u00d7'+a+' = '+ans};})}
   ]},

  {ey:'Q4 \u00b7 Integration \u00b7 Further Maths',ti:'Area Under a Curve',
   su:'Find the area bounded by y = x², the x-axis, x=0 and x=2',
   steps:[
    {lb:'Area as an integral',dr:dQ4,ht:'<p>The area between a curve y=f(x), the x-axis, and the lines x=a and x=b (where f(x)≥0) is given by the definite integral.</p><div class="fm">Area = ∫<sub>a</sub><sup>b</sup> f(x) dx</div>'},
    {lb:'Set up and integrate',dr:dQ4,ht:'<div class="fm">Area = ∫<sub>0</sub><sup>2</sup> x<sup>2</sup> dx = [x<sup>3</sup>/3]<sub>0</sub><sup>2</sup></div>'},
    {lb:'Evaluate',dr:dQ4,ht:'<div class="fm"><div class="eqs"><div class="rw"><span class="l">Area</span><span class="o">=</span><span class="r">8/3 − 0 = <b>2.67 units²</b></span></div></div></div>'},
    {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var k=rnd(1,3);
      var ans=round2(Math.pow(k,3)/3);
      return {question:'Find the area under y=x\u00b2 from x=0 to x='+k+'.',
        hints:['Area = \u222b\u2080^k x\u00b2 dx = x\u00b3/3'],
        ans:ans,tol:0.02,unit:'units\u00b2',working:'['+k+'\u00b3/3] \u2212 0 = '+ans};})}
   ]},

  {ey:'Q5 \u00b7 Integration \u00b7 Further Maths',ti:'Integrating (ax+b)ⁿ',
   su:'Find ∫ (2x+3)³ dx',
   steps:[
    {lb:'Rule for linear composites',dr:dQ5,ht:'<p>When the inside is linear (ax+b), integrate as usual but also divide by the coefficient a.</p><div class="fm">∫(ax+b)<sup>n</sup> dx = (ax+b)<sup>n+1</sup> / [a(n+1)] + c</div>'},
    {lb:'Apply with a=2, n=3',dr:dQ5,ht:'<div class="fm">∫(2x+3)<sup>3</sup> dx = (2x+3)<sup>4</sup> / (2×4) + c</div>'},
    {lb:'Simplify',dr:dQ5,ht:'<div class="fm">= <b>(2x+3)<sup>4</sup>/8 + c</b></div>'},
    {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var a=rnd(2,4),n=rnd(2,3);
      var denom=a*(n+1);
      return {question:'Integrate ('+a+'x+1)^'+n+' \u2014 what is the denominator of the coefficient?',
        hints:['Denominator = a\u00d7(n+1)'],
        ans:denom,tol:0,unit:'',working:'a(n+1) = '+a+'\u00d7'+(n+1)+' = '+denom};})}
   ]},

  {ey:'Q6 \u00b7 Integration \u00b7 Further Maths',ti:'Finding a Function from its Gradient',
   su:'f’(x) = 6x² − 4 and f(1) = 3. Find f(x).',
   steps:[
    {lb:'Reverse of differentiation',dr:dQ6,ht:'<p>If you know the derivative f’(x), integrate it to recover f(x) — this introduces an unknown constant c which needs an extra condition to pin down.</p>'},
    {lb:'Integrate',dr:dQ6,ht:'<div class="fm">f(x) = ∫(6x<sup>2</sup>−4) dx = 2x<sup>3</sup> − 4x + c</div>'},
    {lb:'Use f(1)=3 to find c',dr:dQ6,ht:'<div class="fm"><div class="eqs"><div class="rw"><span class="l">3</span><span class="o">=</span><span class="r">2(1)−4(1)+c = −2+c</span></div></div></div><p>So c = 5. <b>f(x) = 2x<sup>3</sup> − 4x + 5</b></p>'},
    {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var k=rnd(2,6),x0=rnd(1,2),y0=rnd(1,5);
      var val=k*Math.pow(x0,2); // f(x)=kx^2+c form derivative 2kx, keep simple: use f’(x)=2kx, f(x)=kx^2+c
      var c=y0-val;
      return {question:'f\'(x) = '+(2*k)+'x and f('+x0+') = '+y0+'. Find c in f(x) = '+k+'x\u00b2 + c.',
        hints:['f(x) = '+k+'x\u00b2 + c','Substitute x='+x0+', f(x)='+y0],
        ans:c,tol:0,unit:'',working:y0+' = '+k+'\u00d7'+x0+'\u00b2 + c \u2234 c = '+c};})}
   ]},

  {ey:'Q7 \u00b7 Integration \u00b7 Further Maths',ti:'Kinematics: Displacement from Velocity',
   su:'v(t) = 3t² − 2t. Find displacement s from t=0 to t=2.',
   steps:[
    {lb:'Integration in kinematics',dr:dQ7,ht:'<p>Displacement is the integral of velocity with respect to time: s = ∫v dt. Over an interval, use a definite integral.</p>'},
    {lb:'Set up',dr:dQ7,ht:'<div class="fm">s = ∫<sub>0</sub><sup>2</sup> (3t<sup>2</sup>−2t) dt = [t<sup>3</sup>−t<sup>2</sup>]<sub>0</sub><sup>2</sup></div>'},
    {lb:'Evaluate',dr:dQ7,ht:'<div class="fm"><div class="eqs"><div class="rw"><span class="l">s</span><span class="o">=</span><span class="r">(8−4)−0 = <b>4 m</b></span></div></div></div>'},
    {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var t1=rnd(2,4);
      var s=function(t){return Math.pow(t,3)-Math.pow(t,2);};
      var ans=s(t1)-s(0);
      return {question:'v(t)=3t\u00b2\u22122t. Find displacement from t=0 to t='+t1+'.',
        hints:['s=\u222bv dt = t\u00b3\u2212t\u00b2','Evaluate at t='+t1+' minus at t=0'],
        ans:ans,tol:0,unit:'m',working:'['+t1+'\u00b3\u2212'+t1+'\u00b2] \u2212 0 = '+ans+' m'};})}

  {ey:'Q8 \u00b7 Integration \u00b7 Further Maths',ti:'Integrating 1/x',
   su:'Find ∫ (5/x) dx',
   steps:[
    {lb:'Why the power rule fails here',dr:dQ8,ht:'<p>The power rule ∫x<sup>n</sup>dx = x<sup>n+1</sup>/(n+1) breaks down for n=−1, since we would divide by zero. Integrating 1/x instead gives a natural logarithm.</p><div class="fm">∫(1/x) dx = ln|x| + c</div>'},
    {lb:'Apply with a constant multiple',dr:dQ8,ht:'<div class="fm">∫(5/x) dx = 5∫(1/x) dx</div>'},
    {lb:'Answer',dr:dQ8,ht:'<div class="fm">∫(5/x) dx = <b>5 ln|x| + c</b></div>'},
    {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var k=rnd(2,8);

   ]},

  {ey:'Q9 \u00b7 Integration \u00b7 Further Maths',ti:'Integrating Trigonometric Functions',
   su:'Find ∫ (3 cos x) dx',
   steps:[
    {lb:'Standard results',dr:dQ9,ht:'<p>Two standard trig integrals come directly from reversing differentiation:</p><div class="fm">∫cos x dx = sin x + c &ensp; ∫sin x dx = −cos x + c</div>'},
    {lb:'Apply with a constant multiple',dr:dQ9,ht:'<div class="fm">∫3cos x dx = 3∫cos x dx</div>'},
    {lb:'Answer',dr:dQ9,ht:'<div class="fm">∫3cos x dx = <b>3 sin x + c</b></div>'},

  {ey:'Q10 \u00b7 Integration \u00b7 Further Maths',ti:'Area Between Two Curves',

    {lb:'Setting up',dr:dQ10,ht:'<p>To find the area between two curves, integrate the difference between the upper function and the lower function over the interval where the upper curve is on top.</p><div class="fm">Area = ∫<sub>a</sub><sup>b</sup> [f(x) − g(x)] dx</div>'},
    {lb:'Substitute',dr:dQ10,ht:'<div class="fm">Area = ∫<sub>0</sub><sup>4</sup> (4x − x<sup>2</sup>) dx = [2x<sup>2</sup> − x<sup>3</sup>/3]<sub>0</sub><sup>4</sup></div>'},
    {lb:'Evaluate',dr:dQ10,ht:'<div class="fm"><div class="eqs"><div class="rw"><span class="l">Area</span><span class="o">=</span><span class="r">(32−21.3)−0 = <b>10.67 units²</b></span></div></div></div>'},
    {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var k=rnd(2,4);

      var ans=round2(k*k*k/2 - Math.pow(k,3)/3);

        hints:['Area = \u222b\u2080^'+k+' ('+k+'x\u2212x\u00b2) dx'],
        ans:ans,tol:0.05,unit:'units\u00b2',working:'['+k+'x\u00b2/2 \u2212 x\u00b3/3] from 0 to '+k+' = '+ans};})}
   ]}
];
