<style>
:root{--red:#C0272D;--dark:#7A1418;--cream:#FBF6F1;--ink:#241A17;--line:#E4D6CE;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#fdf7f4);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}
.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.nq-btn{font-size:11px;font-weight:600;padding:3px 9px;border-radius:3px;border:1px solid var(--gold);background:#fff;color:var(--gold);cursor:pointer;font-family:inherit;}
.try-q{font-size:15px;line-height:1.55;margin-bottom:8px;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:"›";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
.eqs{display:flex;flex-direction:column;gap:3px;margin:4px 0;}
.eqs .rw{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;font-family:'Cambria Math',Georgia,serif;font-size:17px;}
.eqs .rw.sub{border-top:1.5px solid var(--ink);margin-top:3px;padding-top:4px;}
.eqs .rw .l{text-align:right;padding-right:10px;}
.eqs .rw .o{text-align:center;color:var(--red);font-weight:700;}
.eqs .rw .r{text-align:left;padding-left:10px;}
.eqs .rw .r .chk{color:#1a7a3a;font-weight:700;margin-left:4px;}
.terms{font-family:'Cambria Math',Georgia,serif;font-size:16px;line-height:1.9;text-align:center;}
.terms b{color:var(--dark);}
sup,sub{font-size:.7em;}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.05;font-size:.92em;}
.frac .n{display:block;padding:0 4px 1px;border-bottom:1.4px solid currentColor;}
.frac .d{display:block;padding:1px 4px 0;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ST={};
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function round2(x){return Math.round(x*100)/100;}
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,fn:genFn};return buildTry(id,o);}
function buildTry(id,o){var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');var ph='Answer'+(o.unit?' ('+o.unit+')':'');return '<div class="try" data-tryid="'+id+'"><div class="try-t">✔ Your Turn <button class="nq-btn" data-tryid="'+id+'">↻ New</button></div><div class="try-q">'+o.question+'</div><ul class="hl">'+(h||'')+'</ul><div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div><div class="try-fb" data-tryid="'+id+'"></div><details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details></div>';}
document.addEventListener('click',function(e){var el=e.target;if(el.classList.contains('nq-btn')){var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;var o=en.fn();en.o=o;ST[id]={o:o,fn:en.fn};var wrap=document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);return;}if(el.classList.contains('try-ck')){var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;var o=en.o;var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;var v=parseFloat(inp.value);if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}var tol=o.tol!=null?o.tol:0.01;if(Math.abs(v-o.ans)<=tol){fb.className='try-fb ok';fb.innerHTML='✓ Correct!  '+o.working;}else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}}});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Georgia,serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#C0272D';w=w||2;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function dGeneric(title,lines){return function(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));o.push(T(240,30,title,'#C0272D',13,'middle',true));lines.forEach(function(ln,i){if(p>=i){var last=i===lines.length-1;o.push(R(30,50+i*46,420,38,last?'#e8f8ee':'#f8f8f8',last?'#1a7a3a':'#ccc',last?2:1));o.push(T(240,74+i*46,ln,last?'#1a7a3a':'#241A17',last?14:12,'middle',last));}});s.innerHTML=o.join('');};}
var dQ1=dGeneric('Resultant by Pythagoras',['R = √(F₁²+F₂²) for perpendicular forces']);
var dQ2=dGeneric('ΣF = 0 in equilibrium',['In equilibrium, all forces sum to zero — the third force balances the resultant of the other two']);
var dQ3=dGeneric('Resolve using cos and sin',['Horizontal = F cosθ, Vertical = F sinθ']);
var dQ4=dGeneric('Moment = force × perpendicular distance',['Moment = F × d (in Nm)']);
var dQ5=dGeneric('Take moments about the pivot',['For equilibrium, clockwise moments = anticlockwise moments']);
var dQ6=dGeneric('F = μR at the point of slipping',['Normal reaction R = mg on a horizontal surface','Maximum friction F = μR']);
var dQ7=dGeneric('Resolve horizontally and vertically',['ΣF(horizontal) = 0 and ΣF(vertical) = 0','Two equations, two unknown tensions']);
var dQ8=dGeneric('Cosine rule for non-perpendicular forces',['R² = F₁² + F₂² + 2F₁F₂cosθ (θ = angle between the forces)']);
var dQ9=dGeneric('Take moments about one end',['Balance point: moments of both masses about the pivot must be equal']);
var dQ10=dGeneric('Use right-angled trigonometry from the geometry',['The ladder, wall and ground form a right triangle — use cos or sin to find the angle']);
var QS=[
  {ey:'Q1 \u00b7 Statics \u00b7 Further Maths',ti:'Forces as Vectors',
   su:'Two forces, 5N and 12N, act at right angles. Find the resultant.',
   steps:[
    {lb:'Forces combine like vectors',dr:dQ1,ht:'<p>A force has magnitude and direction, so forces combine like vectors. When two forces act at right angles, the resultant is found using Pythagoras.</p>'},
    {lb:'Apply',dr:dQ1,ht:'<div class="fm">R = √(5<sup>2</sup>+12<sup>2</sup>) = √(25+144) = √169</div>'},
    {lb:'Answer',dr:dQ1,ht:'<div class="fm">R = <b>13 N</b></div>'},
    {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var pairs=[[3,4],[6,8],[5,12],[8,15],[9,12]];var p=pick(pairs);
      var ans=Math.sqrt(p[0]*p[0]+p[1]*p[1]);
      return {question:'Two perpendicular forces of '+p[0]+'N and '+p[1]+'N act on a particle. Find the resultant force.',
        hints:['R = \u221a(F\u2081\u00b2+F\u2082\u00b2)'],
        ans:ans,tol:0,unit:'N',working:'\u221a('+p[0]+'\u00b2+'+p[1]+'\u00b2) = '+ans+' N'};})}
   ]},

  {ey:'Q2 \u00b7 Statics \u00b7 Further Maths',ti:'Equilibrium of Forces',
   su:'Forces 8N, 6N and F act on a particle in equilibrium, with 8N and 6N perpendicular. Find F.',
   steps:[
    {lb:'Equilibrium condition',dr:dQ2,ht:'<p>A particle is in equilibrium when the vector sum of all forces acting on it is zero: ΣF = 0.</p>'},
    {lb:'Find the resultant of the other two',dr:dQ2,ht:'<div class="fm">Resultant of 8N & 6N (perpendicular) = √(64+36) = √100 = 10N</div>'},
    {lb:'Balancing force',dr:dQ2,ht:'<div class="fm">For equilibrium, F must be equal and opposite: <b>F = 10N</b></div>'},
    {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var pairs=[[3,4],[6,8],[5,12],[9,12]];var p=pick(pairs);
      var ans=Math.sqrt(p[0]*p[0]+p[1]*p[1]);
      return {question:'Two perpendicular forces '+p[0]+'N and '+p[1]+'N, plus a third force F, keep a particle in equilibrium. Find F.',
        hints:['F must balance the resultant of the other two','Resultant = \u221a(F\u2081\u00b2+F\u2082\u00b2)'],
        ans:ans,tol:0,unit:'N',working:'Resultant of '+p[0]+'N,'+p[1]+'N = '+ans+'N, so F='+ans+'N'};})}
   ]},

  {ey:'Q3 \u00b7 Statics \u00b7 Further Maths',ti:'Resolving Forces into Components',
   su:'A force of 20N acts at 30° above the horizontal. Find its horizontal and vertical components.',
   steps:[
    {lb:'Resolving a force',dr:dQ3,ht:'<p>Any force can be split into perpendicular components using trigonometry, based on the angle it makes with a chosen axis.</p><div class="fm">F<sub>x</sub> = F cosθ &ensp; F<sub>y</sub> = F sinθ</div>'},
    {lb:'Apply with F=20N, θ=30°',dr:dQ3,ht:'<div class="fm">F<sub>x</sub> = 20cos30° = 17.3N &ensp; F<sub>y</sub> = 20sin30° = 10N</div>'},
    {lb:'Answer',dr:dQ3,ht:'<div class="fm">Horizontal ≈ <b>17.3N</b>, Vertical = <b>10N</b></div>'},
    {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var F=rnd(10,30),ang=pick([30,45,60]);
      var ans=round2(F*Math.cos(ang*Math.PI/180));
      return {question:'A force of '+F+'N acts at '+ang+'\u00b0 above the horizontal. Find the horizontal component, to 1 d.p.',
        hints:['Horizontal component = F\u00d7cos\u03b8'],
        ans:ans,tol:0.15,unit:'N',working:F+'\u00d7cos('+ang+'\u00b0) = '+ans+'N'};})}
   ]},

  {ey:'Q4 \u00b7 Statics \u00b7 Further Maths',ti:'Moments of a Force',
   su:'A force of 15N acts perpendicular to a lever, 0.4m from the pivot. Find the moment.',
   steps:[
    {lb:'What is a moment?',dr:dQ4,ht:'<p>A moment is the turning effect of a force about a pivot, calculated as force multiplied by the perpendicular distance from the pivot to the line of action.</p><div class="fm">Moment = F × d</div>'},
    {lb:'Apply',dr:dQ4,ht:'<div class="fm">Moment = 15 × 0.4</div>'},
    {lb:'Answer',dr:dQ4,ht:'<div class="fm">Moment = <b>6 Nm</b></div>'},
    {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var F=rnd(5,20),d=round2(rnd(2,8)/10);
      var ans=round2(F*d);
      return {question:'A force of '+F+'N acts perpendicular to a lever, '+d+'m from the pivot. Find the moment.',
        hints:['Moment = F\u00d7d'],
        ans:ans,tol:0.05,unit:'Nm',working:F+'\u00d7'+d+' = '+ans+' Nm'};})}
   ]},

  {ey:'Q5 \u00b7 Statics \u00b7 Further Maths',ti:'Equilibrium of Moments',
   su:'A uniform beam is balanced with a 20N weight 0.3m from the pivot on one side. Where must a 12N weight be placed on the other side to balance it?',
   steps:[
    {lb:'Principle of moments',dr:dQ5,ht:'<p>For a rigid body in rotational equilibrium, the sum of clockwise moments about any point equals the sum of anticlockwise moments about that point.</p>'},
    {lb:'Set up the equation',dr:dQ5,ht:'<div class="fm">20 × 0.3 = 12 × d</div>'},
    {lb:'Solve for d',dr:dQ5,ht:'<div class="fm">d = 6/12 = <b>0.5 m</b></div>'},
    {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var W1=rnd(10,25),d1=round2(rnd(2,6)/10),W2=rnd(5,15);
      var ans=round2((W1*d1)/W2);
      return {question:'A '+W1+'N weight is placed '+d1+'m from the pivot. Where must a '+W2+'N weight go on the other side to balance? (distance in m)',
        hints:['Clockwise moment = anticlockwise moment','W1\u00d7d1 = W2\u00d7d2'],
        ans:ans,tol:0.03,unit:'m',working:'d2 = ('+W1+'\u00d7'+d1+')/'+W2+' = '+ans+' m'};})}
   ]},

  {ey:'Q6 \u00b7 Statics \u00b7 Further Maths',ti:'Friction and Normal Reaction',
   su:'A 5kg block rests on a rough horizontal surface with coefficient of friction μ=0.3. Find the maximum friction force before it slips (g=10).',
   steps:[
    {lb:'Friction and the normal reaction',dr:dQ6,ht:'<p>On a horizontal surface, the normal reaction R balances the weight: R = mg. The maximum (limiting) friction force is F = μR, where μ is the coefficient of friction.</p>'},
    {lb:'Find R',dr:dQ6,ht:'<div class="fm">R = mg = 5×10 = 50N</div>'},
    {lb:'Find max friction',dr:dQ6,ht:'<div class="fm">F = μR = 0.3×50 = <b>15N</b></div>'},
    {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var m=rnd(2,8),mu=pick([0.2,0.25,0.3,0.4,0.5]);
      var R=m*10;var ans=round2(mu*R);
      return {question:'A '+m+'kg block rests on a horizontal surface, \u03bc='+mu+'. Find the maximum friction force before slipping (g=10 m/s\u00b2).',
        hints:['R = mg','F(max) = \u03bcR'],
        ans:ans,tol:0.05,unit:'N',working:'R='+m+'\u00d710='+R+'N, F=\u03bc\u00d7R='+mu+'\u00d7'+R+'='+ans+'N'};})}
   ]},

  {ey:'Q7 \u00b7 Statics \u00b7 Further Maths',ti:'Particle in Equilibrium Under Three Forces',
   su:'A particle hangs in equilibrium under its weight W=20N and two strings at 40° and 60° to the horizontal. Set up the equilibrium equations.',
   steps:[
    {lb:'Three-force equilibrium',dr:dQ7,ht:'<p>For a particle held by three forces (here, weight and two string tensions), resolve horizontally and vertically to get two simultaneous equations.</p>'},
    {lb:'Resolve',dr:dQ7,ht:'<div class="fm">Horizontal: T₁cos40° = T₂cos60°</div><div class="fm">Vertical: T₁sin40° + T₂sin60° = W</div>'},
    {lb:'Method',dr:dQ7,ht:'<p>Solve the two simultaneous equations for T₁ and T₂ — substitution or elimination both work.</p>'},
    {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var W=rnd(15,30);
      var a1=40*Math.PI/180,a2=60*Math.PI/180;
      // T1 cos a1 = T2 cos a2 -> T1 = T2 cos a2/cos a1
      // T1 sin a1 + T2 sin a2 = W
      var k=Math.cos(a2)/Math.cos(a1);
      var T2=W/(k*Math.sin(a1)+Math.sin(a2));
      var ans=round2(T2);
      return {question:'A particle of weight '+W+'N hangs from two strings at 40\u00b0 and 60\u00b0 to the horizontal. Find T2 (the 60\u00b0 string tension), to 1 d.p.',
        hints:['Resolve horizontally: T1cos40=T2cos60','Resolve vertically: T1sin40+T2sin60=W'],
        ans:ans,tol:0.3,unit:'N',working:'Solving simultaneously gives T2 \u2248 '+ans+'N'};})}
   ]},

  {ey:'Q8 \u00b7 Statics \u00b7 Further Maths',ti:'Resultant of Non-Perpendicular Forces',
   su:'Two forces of 10N and 8N act at 60° to each other. Find the resultant using the cosine rule.',
   steps:[
    {lb:'Beyond right angles',dr:dQ8,ht:'<p>When two forces are not perpendicular, use the cosine rule (treating the forces and resultant as a triangle) to find the resultant magnitude.</p><div class="fm">R<sup>2</sup> = F<sub>1</sub><sup>2</sup> + F<sub>2</sub><sup>2</sup> + 2F<sub>1</sub>F<sub>2</sub>cosθ</div>'},
    {lb:'Substitute',dr:dQ8,ht:'<div class="fm">R<sup>2</sup> = 100+64+2(10)(8)cos60° = 164+80</div>'},
    {lb:'Answer',dr:dQ8,ht:'<div class="fm">R = √244 ≈ <b>15.6N</b></div>'},
    {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var F1=rnd(6,14),F2=rnd(6,14),ang=pick([45,60,90,120]);
