.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}

.fi{animation:fi .4s ease;}

var ST={};
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function fact(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
function nCr(n,r){if(r<0||r>n)return 0;return fact(n)/(fact(r)*fact(n-r));}

document.addEventListener('click',function(e){var el=e.target;if(el.classList.contains('nq-btn')){var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;var o=en.fn();en.o=o;ST[id]={o:o,fn:en.fn};var wrap=document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);return;}if(el.classList.contains('try-ck')){var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;var o=en.o;var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;var v=parseFloat(inp.value);if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}var tol=o.tol!=null?o.tol:0;if(Math.abs(v-o.ans)<=tol){fb.className='try-fb ok';fb.innerHTML='\u2713 Correct! \u00a0'+o.working;}else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}}});

    {lb:'What are domain and range?',dr:dQ1,ht:'<p>The <b>domain</b> is the set of all valid x-values you can substitute into a function. The <b>range</b> is the set of all possible resulting y-values (outputs).</p>'},
    {lb:'Domain of a linear function',dr:dQ1,ht:'<p>A linear function like f(x)='+V.a1+'x+'+V.b1+' has no restrictions \u2014 you can substitute any real number, so the domain is all real x.</p>'},
    {lb:'Domain with a restriction',dr:dQ1,ht:'<p>A fraction like g(x)=1/(x\u22122) is undefined when the denominator is zero. Set the denominator equal to zero to find the excluded value.</p>'},
    {lb:'Worked example',dr:dQ1,ht:'<p>Find the domain of <span class="frac"><span class="n">1</span><span class="d">x\u22123</span></span> + <span class="frac"><span class="n">1</span><span class="d">x+2</span></span>.</p><p>Each denominator must not equal zero:</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">x\u22123</span><span class="o">=</span><span class="r">0 \u21d2 x = 3</span></div><div class="rw"><span class="l">x+2</span><span class="o">=</span><span class="r">0 \u21d2 x = \u22122</span></div></div></div><p>Both values must be excluded, so the domain is:</p><div class="fm"><div class="terms">x \u2208 \u211d, x \u2260 3, x \u2260 \u22122</div></div>'},
    {lb:'Your turn',dr:dQ1,ht:tryIt(function(){
      var k=rnd(1,6);
      return {question:'For the function h(x) = 1/(x \u2212 '+k+'), what single value of x must be excluded from the domain?',
        hints:['The function is undefined when the denominator equals zero','Set x \u2212 '+k+' = 0'],
        ans:k,tol:0,unit:'',working:'x \u2212 '+k+' = 0 \u21d2 x = '+k+' must be excluded'};
    })}
   ]},

  {ey:'Q2 \u00b7 Functions \u00b7 Further Maths',ti:'Composite Functions',
   su:'Combining two functions by substitution.',
   steps:[
    {lb:'What is a composite function?',dr:dQ2,ht:'<p>A composite function applies one function to the output of another. fg(x) means f(g(x)) \u2014 apply g first, then apply f to the result.</p>'},
    {lb:'Working out fg(x)',dr:dQ2,ht:'<p>Substitute the entire expression for g(x) into every x in f(x), then simplify.</p>'},
    {lb:'Working out gf(x)',dr:dQ2,ht:'<p>Now substitute f(x) into every x in g(x). Compare with fg(x) \u2014 they are usually different!</p>'},
    {lb:'Worked example',dr:dQ2,ht:'<p>Let f(x) = x<sup>2</sup>+1 and g(x) = 2x\u22123. Find fg(4) and gf(4).</p><p><b>fg(4)</b> \u2014 work out g(4) first, then apply f:</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">g(4)</span><span class="o">=</span><span class="r">2(4)\u22123 = 5</span></div><div class="rw"><span class="l">f(5)</span><span class="o">=</span><span class="r">5<sup>2</sup>+1 = 26</span></div></div></div><p><b>gf(4)</b> \u2014 work out f(4) first, then apply g:</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">f(4)</span><span class="o">=</span><span class="r">4<sup>2</sup>+1 = 17</span></div><div class="rw"><span class="l">g(17)</span><span class="o">=</span><span class="r">2(17)\u22123 = 31</span></div></div></div><p>fg(4) = 26 but gf(4) = 31 \u2014 confirming composite order matters.</p>'},
    {lb:'Your turn',dr:dQ2,ht:tryIt(function(){
      var a=rnd(2,4),b=rnd(1,3),x0=rnd(1,3);
      return {question:'If f(x) = x + '+b+' and g(x) = '+a+'x, find fg('+x0+').',
        hints:['fg(x) means f(g(x)) \u2014 work out g('+x0+') first, then apply f'],
        ans:a*x0+b,tol:0,unit:'',working:'g('+x0+')='+a+'\u00d7'+x0+'='+(a*x0)+', then f('+(a*x0)+')='+(a*x0)+'+'+b+'='+(a*x0+b)};
    })}
   ]},

  {ey:'Q3 \u00b7 Functions \u00b7 Further Maths',ti:'Inverse Functions',
   su:'Finding f\u207b\u00b9(x), the function that reverses f(x).',
   steps:[
    {lb:'Swap x and y',dr:dQ3,ht:'<p>To find an inverse function: write y = f(x), then swap every x and y in the equation.</p>'},
    {lb:'Make y the subject',dr:dQ3,ht:'<p>Rearrange the swapped equation to isolate y on one side \u2014 this gives you f\u207b\u00b9(x).</p>'},
    {lb:'Worked example',dr:dQ3,ht:'<p>Find f\u207b\u00b9(x) for f(x) = 3x\u22127.</p><p>Write y = f(x), then swap x and y:</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">y</span><span class="o">=</span><span class="r">3x\u22127</span></div><div class="rw"><span class="l">x</span><span class="o">=</span><span class="r">3y\u22127</span></div></div></div><p>Rearrange for y:</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">x+7</span><span class="o">=</span><span class="r">3y</span></div><div class="rw"><span class="l">y</span><span class="o">=</span><span class="r"><span class="frac"><span class="n">x+7</span><span class="d">3</span></span></span></div></div></div><p>So f\u207b\u00b9(x) = <span class="frac"><span class="n">x+7</span><span class="d">3</span></span>. Check by substituting back:</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">f(f\u207b\u00b9(x))</span><span class="o">=</span><span class="r">3\u00d7<span class="frac"><span class="n">x+7</span><span class="d">3</span></span> \u2212 7 = x<span class="chk">\u2713</span></span></div></div></div>'},
    {lb:'Write the final answer',dr:dQ3,ht:'<p>Replace y with f\u207b\u00b9(x) notation. You can check your answer by confirming f(f\u207b\u00b9(x)) = x.</p>'},
    {lb:'Your turn',dr:dQ3,ht:tryIt(function(){
      var m=rnd(2,5),c=rnd(1,6);
      return {question:'Find f\u207b\u00b9(1) if f(x) = '+m+'x + '+c+'. (Hint: find f\u207b\u00b9(x) first, then substitute x=1)',
        hints:['f\u207b\u00b9(x) = (x \u2212 '+c+') / '+m],
        ans:Math.round(((1-c)/m)*1000)/1000,tol:0.01,unit:'',working:'f\u207b\u00b9(x)=(x\u2212'+c+')/'+m+', so f\u207b\u00b9(1)=(1\u2212'+c+')/'+m+' = '+((1-c)/m).toFixed(3)};
    })}
   ]},

  {ey:'Q4 \u00b7 Functions \u00b7 Further Maths',ti:'One-to-One and Many-to-One Functions',
   su:'Testing whether a function has an inverse.',
   steps:[
    {lb:'One-to-one vs many-to-one',dr:dQ4,ht:'<p>A <b>one-to-one</b> function gives a different output for every different input. A <b>many-to-one</b> function can give the same output from more than one input.</p>'},
    {lb:'The horizontal line test',dr:dQ4,ht:'<p>Draw a horizontal line across the graph. If it ever crosses the curve more than once, the function is many-to-one.</p>'},
    {lb:'Worked example',dr:dQ4,ht:'<p>Test f(x) = x<sup>2</sup>\u22124 at x=3 and x=\u22123.</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">f(3)</span><span class="o">=</span><span class="r">3<sup>2</sup>\u22124 = 5</span></div><div class="rw"><span class="l">f(\u22123)</span><span class="o">=</span><span class="r">(\u22123)<sup>2</sup>\u22124 = 5</span></div></div></div><p>Two different inputs (3 and \u22123) give the same output (5), so f is many-to-one and has no inverse over all real x.</p><p>Restricting the domain to x \u2265 0 removes the duplicate input, making f one-to-one on that restricted domain \u2014 only then does an inverse exist.</p>'},
    {lb:'Why it matters for inverses',dr:dQ4,ht:'<p>Only one-to-one functions have a true inverse function over their whole domain, since many-to-one functions would give an inverse with multiple outputs for one input (not a valid function).</p>'},
    {lb:'Your turn',dr:dQ4,ht:tryIt(function(){
      var k=rnd(2,5);
      return {question:'For f(x) = x\u00b2, what is f('+k+') and f(\u2212'+k+')? Enter the common value to show they are equal, demonstrating f is many-to-one.',
        hints:['f('+k+') = '+k+'\u00b2', 'f(\u2212'+k+') = (\u2212'+k+')\u00b2'],
        ans:k*k,tol:0,unit:'',working:'f('+k+')='+k+'\u00b2='+(k*k)+' and f(\u2212'+k+')=(\u2212'+k+')\u00b2='+(k*k)+' \u2014 same output, two inputs, so many-to-one'};
    })}
   ]},

  {ey:'Q5 \u00b7 Functions \u00b7 Further Maths',ti:'Odd and Even Functions',
   su:'Testing symmetry using f(\u2212x).',
   steps:[
    {lb:'Definitions',dr:dQ5,ht:'<p>A function is <b>even</b> if f(\u2212x) = f(x) for all x (symmetric about the y-axis). A function is <b>odd</b> if f(\u2212x) = \u2212f(x) (symmetric about the origin).</p>'},
    {lb:'Testing even functions',dr:dQ5,ht:'<p>Substitute \u2212x into the function. If every term keeps its sign (even powers only), the function is even.</p>'},
    {lb:'Testing odd functions',dr:dQ5,ht:'<p>If substituting \u2212x flips the sign of the entire expression (odd powers only), the function is odd. Many functions are neither.</p>'},
    {lb:'Worked example',dr:dQ5,ht:'<p>Test f(x) = x<sup>3</sup>\u2212x for odd symmetry:</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">f(\u2212x)</span><span class="o">=</span><span class="r">(\u2212x)<sup>3</sup>\u2212(\u2212x) = \u2212x<sup>3</sup>+x</span></div></div></div><p>This equals \u2212(x<sup>3</sup>\u2212x) = \u2212f(x), so f is <b>odd</b>.</p><p>Now test g(x) = x<sup>2</sup>+3 for even symmetry:</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">g(\u2212x)</span><span class="o">=</span><span class="r">(\u2212x)<sup>2</sup>+3 = x<sup>2</sup>+3</span></div></div></div><p>This equals g(x) exactly, so g is <b>even</b>.</p>'},
    {lb:'Your turn',dr:dQ5,ht:tryIt(function(){
      var a=rnd(2,5);
      return {question:'For f(x) = '+a+'x\u00b2, find f(\u22122) to confirm the even property f(\u22122) = f(2).',
        hints:['f(\u22122) = '+a+'\u00d7(\u22122)\u00b2'],
        ans:a*4,tol:0,unit:'',working:'f(\u22122) = '+a+'\u00d7(\u22122)\u00b2 = '+a+'\u00d74 = '+(a*4)+' = f(2), confirming f(x)='+a+'x\u00b2 is even'};
    })}
   ]},

  {ey:'Q6 \u00b7 Functions \u00b7 Further Maths',ti:'Function Transformations',
   su:'How adding, multiplying or negating changes a graph.',
   steps:[
    {lb:'Vertical shifts and stretches',dr:dQ6,ht:'<p>f(x) + a shifts the graph up by a. a\u00b7f(x) stretches the graph vertically by factor a (values further from the x-axis).</p>'},
    {lb:'Horizontal shifts and reflections',dr:dQ6,ht:'<p>f(x + a) shifts the graph left by a (note the sign flips compared to intuition). \u2212f(x) reflects the graph in the x-axis; f(\u2212x) reflects it in the y-axis.</p>'},
    {lb:'Combining transformations',dr:dQ6,ht:'<p>Multiple transformations can be applied together, e.g. 2f(x\u22123)+1 stretches vertically \u00d72, shifts right 3, then shifts up 1. Apply them in the order they act on x first, then the outside operations.</p>'},
    {lb:'Worked example',dr:dQ6,ht:'<p>If f(x) = x<sup>2</sup>, evaluate y = 2f(x\u22121)+3 at x=4.</p><p>First apply the shift inside the brackets:</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">f(4\u22121)</span><span class="o">=</span><span class="r">f(3) = 3<sup>2</sup> = 9</span></div></div></div><p>Then apply the stretch and shift outside:</p><div class="fm"><div class="eqs"><div class="rw"><span class="l">y</span><span class="o">=</span><span class="r">2(9)+3 = 21</span></div></div></div><p>So the transformed graph passes through (4, 21): shift right 1, stretch \u00d72 vertically, then shift up 3.</p>'},
    {lb:'Your turn',dr:dQ6,ht:tryIt(function(){
      var a=rnd(2,4),shift=rnd(1,5);
      return {question:'If f(3) = '+a+', what is the value of f(3) + '+shift+' (i.e. the transformed graph f(x) + '+shift+' at x=3)?',
        hints:['f(x) + '+shift+' simply shifts every output up by '+shift],
        ans:a+shift,tol:0,unit:'',working:'f(3) + '+shift+' = '+a+' + '+shift+' = '+(a+shift)};
    })}
   ]}
];
