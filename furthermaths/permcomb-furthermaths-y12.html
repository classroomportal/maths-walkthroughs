<script>
var ST={};
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function fact(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
function nCr(n,r){if(r<0||r>n)return 0;return fact(n)/(fact(r)*fact(n-r));}
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,fn:genFn};return buildTry(id,o);}
function buildTry(id,o){var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');var ph='Answer'+(o.unit?' ('+o.unit+')':'');return '<div class="try" data-tryid="'+id+'"><div class="try-t">\u2714 Your Turn <button class="nq-btn" data-tryid="'+id+'">\u21bb New</button></div><div class="try-q">'+o.question+'</div><ul class="hl">'+(h||'')+'</ul><div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div><div class="try-fb" data-tryid="'+id+'"></div><details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details></div>';}
document.addEventListener('click',function(e){var el=e.target;if(el.classList.contains('nq-btn')){var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;var o=en.fn();en.o=o;ST[id]={o:o,fn:en.fn};var wrap=document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);wrap.parentNode.replaceChild(tmp.firstChild,wrap);return;}if(el.classList.contains('try-ck')){var id=el.getAttribute('data-tryid'),en=ST[id];if(!en)return;var o=en.o;var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;var v=parseFloat(inp.value);if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}var tol=o.tol!=null?o.tol:0;if(Math.abs(v-o.ans)<=tol){fb.className='try-fb ok';fb.innerHTML='\u2713 Correct! \u00a0'+o.working;}else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}}});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Georgia,serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w){c=c||'#C0272D';w=w||2;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"/>';}

// Session values

function nPr(n,r){if(r<0||r>n)return 0;return fact(n)/fact(n-r);}

var V={};
(function(){
  V.n1=rnd(4,6);
  V.n2=rnd(5,7);V.r2=rnd(2,4);
  V.n3=rnd(6,8);V.r3=rnd(2,4);
  V.n4=rnd(5,7);V.r4=rnd(2,4);
  V.n5=rnd(8,10);V.r5=rnd(2,4);
  V.n6=rnd(5,7);V.r6=rnd(2,3);
})();

function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 270');var o=[];
  o.push(R(14,8,452,36));
  o.push(T(240,30,'How many ways to arrange all '+V.n1+' letters of a word?','#C0272D',13,'middle',true));
  if(p>=1){
    o.push(R(30,52,420,50,'#f8f8f8','#ccc',1));
    o.push(T(240,72,'n! (n factorial) = n \u00d7 (n\u22121) \u00d7 (n\u22122) \u00d7 ... \u00d7 2 \u00d7 1','#241A17',12,'middle',true));
    o.push(T(240,92,'Counts the number of ways to arrange n DISTINCT items','#888',9,'middle'));
  }
  if(p>=2){
    o.push(R(14,114,452,60,'#fff5f0','#C0272D',1.5));
    o.push(T(240,134,V.n1+'! = '+V.n1+' \u00d7 '+(V.n1-1)+' \u00d7 ... \u00d7 2 \u00d7 1','#241A17',12,'middle',true));
    o.push(T(240,156,'= '+fact(V.n1),'#C0272D',15,'middle',true));
  }
  if(p>=3){
    o.push(R(14,176,452,64,'#e8f8ee','#1a7a3a',1.5));
    o.push(T(240,196,'Reminder: 0! = 1 by definition','#1a7a3a',11,'middle',true));
    o.push(T(240,216,'If some letters repeat, divide by the factorial of each','#1a7a3a',11,'middle',true));
    o.push(T(240,232,'repeated group\u2019s count to avoid overcounting','#1a7a3a',11,'middle',true));
  }
  s.innerHTML=o.join('');
}

function dQ2(p){
  var s=g();s.setAttribute('viewBox','0 0 480 270');var o=[];
  o.push(R(14,8,452,36));
  o.push(T(240,30,'Arrange '+V.r2+' of '+V.n2+' runners in order (1st, 2nd, ...)','#C0272D',13,'middle',true));
  if(p>=1){
    o.push(R(30,52,420,44,'#f8f8f8','#ccc',1));
    o.push(T(240,78,'This is a PERMUTATION \u2014 order matters (medal positions differ)','#241A17',12,'middle',true));
  }
  if(p>=2){
    o.push(R(14,104,452,60,'#fff5f0','#C0272D',1.5));
    o.push(T(240,124,'nPr = n! / (n\u2212r)!','#241A17',13,'middle',true));
    o.push(T(240,146,V.n2+'P'+V.r2+' = '+V.n2+'! / ('+V.n2+'\u2212'+V.r2+')!','#C0272D',12,'middle',true));
  }
  if(p>=3){
    o.push(R(14,172,452,68,'#e8f8ee','#1a7a3a',1.5));
    o.push(T(240,192,'= '+fact(V.n2)+' / '+fact(V.n2-V.r2),'#1a7a3a',12,'middle',true));
    o.push(T(240,212,'= '+nPr(V.n2,V.r2),'#1a7a3a',16,'middle',true));
    o.push(T(240,232,'Same as multiplying '+V.r2+' descending numbers from '+V.n2,'#888',9,'middle'));
  }
  s.innerHTML=o.join('');
}

function dQ3(p){
  var s=g();s.setAttribute('viewBox','0 0 480 270');var o=[];
  o.push(R(14,8,452,36));
  o.push(T(240,30,'Arrange '+V.n3+' people in a row, but 2 must sit together','#C0272D',13,'middle',true));
  if(p>=1){
    o.push(R(30,52,420,50,'#f8f8f8','#ccc',1));
    o.push(T(240,72,'Trick: glue the pair together as ONE unit first','#241A17',12,'middle',true));
    o.push(T(240,92,'Now you have ('+V.n3+'\u22121) items to arrange, not '+V.n3,'#C0272D',11,'middle',true));
  }
  if(p>=2){
    o.push(R(14,114,452,64,'#fff5f0','#C0272D',1.5));
    o.push(T(240,134,'Arrangements of the '+(V.n3-1)+' units: ('+(V.n3-1)+')!','#241A17',12,'middle',true));
    o.push(T(240,154,'The 2 glued people can swap places WITHIN their unit: \u00d72','#241A17',11,'middle',true));
    o.push(T(240,170,'Total: ('+(V.n3-1)+')! \u00d7 2','#C0272D',12,'middle',true));
  }
  if(p>=3){
    o.push(R(14,184,452,64,'#e8f8ee','#1a7a3a',1.5));
    o.push(T(240,204,'= '+fact(V.n3-1)+' \u00d7 2 = '+(fact(V.n3-1)*2),'#1a7a3a',13,'middle',true));
    o.push(T(240,224,'This \u201cglue the group\u201d method works for any "must be together" restriction','#888',9,'middle'));
  }
  s.innerHTML=o.join('');
}

function dQ4(p){
  var s=g();s.setAttribute('viewBox','0 0 480 270');var o=[];
  o.push(R(14,8,452,36));
  o.push(T(240,30,'Choose '+V.r4+' from '+V.n4+' people for a committee','#C0272D',13,'middle',true));
  if(p>=1){
    o.push(R(30,52,420,44,'#f8f8f8','#ccc',1));
    o.push(T(240,78,'This is a COMBINATION \u2014 order does NOT matter (no roles)','#241A17',12,'middle',true));
  }
  if(p>=2){
    o.push(R(14,104,452,60,'#fff5f0','#C0272D',1.5));
    o.push(T(240,124,'nCr = n! / [r! \u00d7 (n\u2212r)!]','#241A17',13,'middle',true));
    o.push(T(240,146,V.n4+'C'+V.r4+' = '+V.n4+'! / ['+V.r4+'! \u00d7 ('+V.n4+'\u2212'+V.r4+')!]','#C0272D',12,'middle',true));
  }
  if(p>=3){
    o.push(R(14,172,452,68,'#e8f8ee','#1a7a3a',1.5));
    o.push(T(240,192,'= '+nCr(V.n4,V.r4),'#1a7a3a',16,'middle',true));
    o.push(T(240,214,'Compare: '+V.n4+'P'+V.r4+' = '+nPr(V.n4,V.r4)+' (much bigger \u2014 order would matter)','#888',9,'middle'));
    o.push(T(240,232,'nCr = nPr \u00f7 r!  (divide out the duplicate orderings)','#888',9,'middle'));
  }
  s.innerHTML=o.join('');
}

function dQ5(p){
  var s=g();s.setAttribute('viewBox','0 0 480 270');var o=[];
  o.push(R(14,8,452,36));
  o.push(T(240,30,'From '+V.n5+' people, choose '+V.r5+', but 1 specific person must be included','#C0272D',12,'middle',true));
  if(p>=1){
    o.push(R(30,52,420,50,'#f8f8f8','#ccc',1));
    o.push(T(240,72,'Trick: that person is ALREADY chosen, so remove them','#241A17',11,'middle',true));
    o.push(T(240,92,'Now choose the remaining ('+(V.r5-1)+') from the other ('+(V.n5-1)+')','#C0272D',11,'middle',true));
  }
  if(p>=2){
    o.push(R(14,114,452,54,'#fff5f0','#C0272D',1.5));
    o.push(T(240,134,'('+(V.n5-1)+')C('+(V.r5-1)+') = '+(V.n5-1)+'! / [('+(V.r5-1)+')! \u00d7 ('+(V.n5-V.r5)+')!]','#241A17',11,'middle',true));
  }
  if(p>=3){
    o.push(R(14,172,452,64,'#e8f8ee','#1a7a3a',1.5));
    o.push(T(240,192,'= '+nCr(V.n5-1,V.r5-1),'#1a7a3a',16,'middle',true));
    o.push(T(240,214,'This "must include" trick reduces both n and r by 1','#888',9,'middle'));
  }
  s.innerHTML=o.join('');
}

function dQ6(p){
  var s=g();s.setAttribute('viewBox','0 0 480 270');var o=[];
  o.push(R(14,8,452,36));
  o.push(T(240,30,'Probability using combinations','#C0272D',14,'middle',true));
  if(p>=1){
    o.push(R(30,52,420,50,'#f8f8f8','#ccc',1));
    o.push(T(240,72,'Probability = (favourable combinations) / (total combinations)','#241A17',12,'middle',true));
    o.push(T(240,92,'Use nCr to count both the favourable and total outcomes','#888',9,'middle'));
  }
  if(p>=2){
    o.push(R(14,114,452,56,'#fff5f0','#C0272D',1.5));
    o.push(T(240,134,'e.g. choosing '+V.r6+' from '+V.n6+' people, all from one specific group of '+(V.r6+1),'#241A17',10,'middle',true));
    o.push(T(240,154,'Favourable: ('+(V.r6+1)+')C'+V.r6+'  \u00f7  Total: '+V.n6+'C'+V.r6,'#C0272D',11,'middle',true));
  }
  if(p>=3){
    o.push(R(14,178,452,66,'#e8f8ee','#1a7a3a',1.5));
    var fav=nCr(V.r6+1,V.r6),tot=nCr(V.n6,V.r6);
    o.push(T(240,198,'= '+fav+' / '+tot+' = '+(Math.round((fav/tot)*1000)/1000),'#1a7a3a',13,'middle',true));
    o.push(T(240,220,'Always check: is order relevant? If not, use nCr not nPr','#888',9,'middle'));
  }
  s.innerHTML=o.join('');
}

var QS=[
  {ey:'Q1 \u00b7 Permutations &amp; Combinations \u00b7 Further Maths',ti:'Factorial and Basic Counting',
   su:'Counting arrangements of distinct items using n!.',
   steps:[
    {lb:'What is n! (n factorial)?',dr:dQ1,ht:'<p>n! means n \u00d7 (n\u22121) \u00d7 (n\u22122) \u00d7 ... \u00d7 2 \u00d7 1. It counts the number of ways to arrange n distinct items in a row.</p>'},
    {lb:'Calculating a factorial',dr:dQ1,ht:'<p>Multiply down from n to 1. Factorials grow very quickly \u2014 even 10! is over 3.6 million.</p>'},
    {lb:'Special cases and repeats',dr:dQ1,ht:'<p>By definition 0! = 1. If some items in the arrangement are identical (repeated), divide by the factorial of the count of each repeated group to avoid overcounting identical arrangements.</p>'},
    {lb:'Your turn',dr:dQ1,ht:tryIt(function(){
      var n=rnd(3,6);
      return {question:'How many ways can '+n+' different books be arranged in a row on a shelf?',
        hints:['This is '+n+'! (factorial)'],
        ans:fact(n),tol:0,unit:'',working:n+'! = '+fact(n)};
    })}
   ]},

  {ey:'Q2 \u00b7 Permutations &amp; Combinations \u00b7 Further Maths',ti:'Permutations (Order Matters)',
   su:'Using nPr when the arrangement order is important.',
   steps:[
    {lb:'When to use a permutation',dr:dQ2,ht:'<p>Use a permutation whenever ORDER matters \u2014 e.g. 1st/2nd/3rd place medals, or a PIN code, where swapping two items gives a genuinely different outcome.</p>'},
    {lb:'The nPr formula',dr:dQ2,ht:'<p>nPr = n! / (n\u2212r)!  counts the number of ways to choose AND arrange r items from n distinct items.</p>'},
    {lb:'Working it through',dr:dQ2,ht:'<p>Expand the factorials, or equivalently multiply r descending numbers starting from n (e.g. for 5P3: 5\u00d74\u00d73).</p>'},
    {lb:'Your turn',dr:dQ2,ht:tryIt(function(){
      var n=rnd(5,8),r=rnd(2,4);
      return {question:'In how many ways can 1st, 2nd and up to '+r+'th place be awarded among '+n+' competitors? (i.e. find '+n+'P'+r+')',
        hints:[n+'P'+r+' = '+n+'! / ('+n+'\u2212'+r+')!'],
        ans:nPr(n,r),tol:0,unit:'',working:n+'P'+r+' = '+n+'!/('+(n-r)+')! = '+nPr(n,r)};
    })}
   ]},
