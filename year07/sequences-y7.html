body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}

.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}

.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}

.btn.p{background:var(--red);color:#fff;}

.try-q{font-size:15px;margin:8px 0 10px;}

<script>

var ST={};

function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function htmlFrac(num,den,col,lbl){
  col=col||'#C0272D';
  return '<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;">'
    +(lbl?'<span style="font-size:10px;color:#888;font-style:italic;line-height:1.2;">numerator</span>':'')
    +'<span style="font-size:17px;font-weight:700;color:'+col+';border-bottom:2px solid '+col+';padding:0 4px 1px;min-width:18px;text-align:center;">'+num+'</span>'
    +'<span style="font-size:17px;color:'+col+';padding:1px 4px 0;min-width:18px;text-align:center;">'+den+'</span>'
    +(lbl?'<span style="font-size:10px;color:#888;font-style:italic;line-height:1.2;">denominator</span>':'')
    +'</span>';
}

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();
  ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}

function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class=\"hl\">'+h+'</ul>':'')+'<div class=\"wk-b\">'+o.working+'</div>';
  var ex=o.extraHTML||'';
  var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">✔ Your Turn'
    +' <button class="newq-btn" data-tryid="'+id+'">↻ New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'
    +ex
    +(o.options
      ? '<div class="ar" style="flex-wrap:wrap;">'+o.options.map(function(t,i){return '<button class="ck try-opt" style="background:#fff;color:var(--ink);border:1px solid var(--gold);" data-tryid="'+id+'" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+t+'</button>';}).join('')+'</div>'
      : '<div class="ar">'
        +'<input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/>'
        +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>')
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'
    +'<div class="wk-b">'+o.working+'</div></details>'
    +'</div>';
}

function newQ(id){
  var e=ST[id]; if(!e||!e.genFn)return;
  var o=e.genFn(); e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');
  if(!box)return;
  var tmp=document.createElement('div');
  tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);
  ST[id]={o:o,genFn:e.genFn};
}

function ckById(id){
  var e=ST[id]; if(!e)return;
  var o=e.o;
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!inp||!fb)return;
  var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){
    fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
  }else{
    fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
  }
}

document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){
    newQ(btn.getAttribute('data-tryid'));
  } else if(btn.classList.contains('try-ck')){
    ckById(btn.getAttribute('data-tryid'));
  } else if(btn.classList.contains('try-opt')){
    var id=btn.getAttribute('data-tryid'),e2=ST[id];if(!e2)return;
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    if(parseInt(btn.getAttribute('data-i'),10)===e2.o.ans){fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+e2.o.working;}
    else{fb.className='try-fb fb er';fb.textContent='Not quite — try again.';}
  }
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'#fff5f0')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||1.5)+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#888')+'" stroke-width="'+(w||1.5)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}

function termBox(x,y,val,col,highlight){
  var fill=highlight?col+'33':'#fff';
  var stroke=highlight?col:'#ddd';
  var o=R(x,y,52,42,fill,stroke,highlight?2:1);
  o+=T(x+26,y+26,val,highlight?col:'#555',18,'middle',highlight);
  return o;
}

/* Q1 Arithmetic sequence */
function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  var seq=[5,8,11,14,17,20,23];
  seq.forEach(function(v,i){o+=termBox(30+i*60,90,v,'#C0272D',p>=1&&i<5);});
  o+=termBox(30+5*60,90,'?','#1a7a3a',p>=2);
  o+=termBox(30+6*60,90,'?','#1a7a3a',p>=3);
  o+=T(240,22,'The rule: add 3 each time','#C0272D',13,'middle',true);
  o+=R(14,10,452,28,'#fff5f0','#C0272D',1.5);
if(p>=1){
    for(var i=0;i<4;i++){o+=T(64+i*60,80,'+3','#C8922A',11,'middle',false);}
    o+=T(240,50,'Each jump is +3','#C8922A',13,'middle',true);
  }
  if(p>=2){o+=termBox(30+5*60,90,'20','#1a7a3a',true);}
  if(p>=3){o+=termBox(30+6*60,90,'23','#1a7a3a',true);}
  if(p>=3){o+=T(240,200,'Continue: keep adding 3 each time','#888',11,'middle',false);}
  s.innerHTML=o;
}

/* Q2 Term-to-term rules */
function dQ2(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  var seqs=[
    {terms:[3,6,12,24],rule:'\u00d72',col:'#C0272D'},
    {terms:[100,50,25,12.5],rule:'\u00f72',col:'#1a5a8a'},
    {terms:[1,4,9,16],rule:'+3,+5,+7\u2026',col:'#C8922A'}
  ];
  seqs.forEach(function(seq,si){
    var y=30+si*72;
    seq.terms.forEach(function(v,i){o+=termBox(40+i*80,y,v,seq.col,p>=si+1);});
    if(p>=si+1){o+=T(240+seq.terms.length*40,y+22,seq.rule,seq.col,12,'start',true);}
  });
  if(p>=3){o+=T(240,248,'Different rules: multiply, divide, or adding different amounts','#888',11,'middle',false);}
  s.innerHTML=o;
}

/* Q3 Matchstick pattern */
function dQ3(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(R(14,6,452,32,'#fff5f0','#C0272D',1.5));
  o.push(T(240,27,'Matchstick squares: how many sticks for n squares?','#C0272D',13,'middle',true));
  // Bigger squares, drawn progressively (size 32)
  var Z=32;
  var sq=function(x,y,n,col,showFirst){
    for(var i=0;i<n;i++){
      o.push(L(x+i*Z,y,x+i*Z+Z,y,col,3));
      o.push(L(x+i*Z,y+Z,x+i*Z+Z,y+Z,col,3));
      o.push(L(x+i*Z+Z,y,x+i*Z+Z,y+Z,col,3));
    }
    o.push(L(x,y,x,y+Z,showFirst?'#C8922A':col,showFirst?4:3));
  };
  var pats=[{x:30,n:1,s:4,c:'#C0272D'},{x:92,n:2,s:7,c:'#1a5a8a'},{x:186,n:3,s:10,c:'#1a7a3a'},{x:310,n:4,s:13,c:'#7A1418'}];
  var show=p<=0?1:(p===1?3:4);
  pats.slice(0,show).forEach(function(q){
    sq(q.x,50,q.n,q.c,p>=3);
    var mx=q.x+q.n*Z/2;
    o.push(T(mx,100,'n = '+q.n,'#888',12,'middle'));
    o.push(T(mx,116,q.s+' sticks','#241A17',13,'middle',true));
  });
  if(p>=2){
    // Table of values with the +3 jumps
    o.push(R(40,128,70,26,'#f0e8e0','#aaa',1));o.push(T(75,146,'n','#241A17',13,'middle',true));
    o.push(R(40,154,70,26,'#f0e8e0','#aaa',1));o.push(T(75,172,'sticks','#241A17',13,'middle',true));
    pats.forEach(function(q,i){
      o.push(R(110+i*60,128,60,26,'#fff','#ddd',1));o.push(T(140+i*60,146,q.n,'#555',13,'middle',true));
      o.push(R(110+i*60,154,60,26,'#fff5f0','#ddd',1));o.push(T(140+i*60,172,q.s,'#C0272D',13,'middle',true));
      if(i>0)o.push(T(110+i*60,194,'+3','#C8922A',12,'middle',true));
    });
    o.push(T(400,160,'goes up 3','#C8922A',12,'middle',true));
    o.push(T(400,176,'each time','#C8922A',12,'middle',true));
  }
  if(p>=3){
    o.push(T(240,214,'1 gold stick + 3 sticks for each square:  1 + 3 \u00d7 n','#241A17',12,'middle',false));
    o.push(R(150,222,180,32,'#e8f8ee','#1a7a3a',2));
    o.push(T(240,244,'sticks = 3n + 1','#1a7a3a',16,'middle',true));
  }
  s.innerHTML=o.join('');
}

function dQ4(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,28,'Square and Triangle Numbers','#C0272D',13,'middle',true));
  // Square numbers: grid dots
  if(p>=1){
    [[1,1],[2,4],[3,9],[4,16],[5,25]].forEach(function(sq,i){
      var gx=20+i*88,gy=60,n=sq[0];
      for(var r=0;r<n;r++) for(var c=0;c<n;c++)
        o.push('<circle cx="'+(gx+c*10)+'" cy="'+(gy+r*10)+'" r="3.5" fill="#C0272D"/>');
      o.push(T(gx+n*5-5,gy+n*10+12,sq[1],'#C0272D',11,'middle',true));
      o.push(T(gx+n*5-5,gy+n*10+24,n+'²','#888',9,'middle',false));
    });
    o.push(T(240,52,'Square numbers (1, 4, 9, 16, 25…)','#C0272D',10,'middle',false));
  }
  // Triangle numbers: triangular dot patterns
  if(p>=2){
    [[1,1],[2,3],[3,6],[4,10],[5,15]].forEach(function(tr,i){
      var gx=20+i*88,gy=162,n=tr[0];
      for(var r=0;r<n;r++){
        var rowOff=(n-1-r)*5;
        for(var c=0;c<=r;c++)
          o.push('<circle cx="'+(gx+rowOff+c*10)+'" cy="'+(gy+r*10)+'" r="3.5" fill="#1a5a8a"/>');
      }
      o.push(T(gx+n*5-5,gy+n*10+10,tr[1],'#1a5a8a',11,'middle',true));
    });
    o.push(T(240,152,'Triangle numbers (1, 3, 6, 10, 15…)','#1a5a8a',10,'middle',false));
  }
  if(p>=3){
    o.push(R(290,152,176,96,'#e8f8ee','#1a7a3a',1.5));
    o.push(T(378,168,'T(n) = 1+2+3+…+n','#1a7a3a',11,'middle',true));
    o.push(T(378,186,'n(n+1) ÷ 2','#1a7a3a',13,'middle',true));
    o.push(T(378,208,'T(5) = 5×6÷2 = 15','#888',10,'middle',false));
    o.push(T(378,224,'T(6) = 6×7÷2 = 21','#888',10,'middle',false));
    o.push(T(378,240,'T(7) = 7×8÷2 = 28','#888',10,'middle',false));
  }
  s.innerHTML=o.join('');
}

function dQ5(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(R(14,8,452,44,'#fff5f0','#C0272D',1.5));
  o.push(T(240,30,'Find the missing term in: 5,  ?,  17,  23,  29','#C0272D',14,'middle',true));
  var terms=[5,null,17,23,29];
  var cx=[80,180,280,370,450];
  if(p>=0){
    terms.forEach(function(v,i){
      var filled=(v!==null);
      o.push(R(cx[i]-36,60,72,38,filled?'#fff5f0':'#f0f0f0',filled?'#C0272D':'#888',filled?2:1.5));
      o.push(T(cx[i],83,filled?v:'?',filled?'#C0272D':'#888',filled?18:22,'middle',filled));
    });
    // Show only one gap arrow
    o.push(L(cx[1]-36,100,cx[1]+36,100,'#C8922A',1));
    o.push(T(cx[1],116,'find this','#C8922A',10,'middle',false));
  }
  if(p>=0){
    // Show the jump from the numbers next to each other
    o.push(T(240,136,'The jump: 23 − 17 = 6, and 29 − 23 = 6','#1a5a8a',12,'middle',false));
    o.push(T(240,154,'So the numbers go up by 6 each time','#1a5a8a',14,'middle',true));
  }
  if(p>=1){
    o.push(R(cx[1]-42,60,84,38,'#e8f8ee','#1a7a3a',2));
    o.push(T(cx[1],83,'11','#1a7a3a',20,'middle',true));
    o.push(T(240,178,'Missing number = 5 + 6 = 11','#1a7a3a',14,'middle',true));
      }
  if(p>=2){o.push(T(240,198,'Check: 5, 11, 17, 23, 29 ✓ (each jump is +6)','#888',11,'middle',false));}
  s.innerHTML=o.join('');
}

function dQ6(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(R(14,8,452,44,'#fff5f0','#C0272D',1.5));

    {lb:'Substituting into the formula',dr:dQ7,ht:'<p>To find any term, substitute the term number n into the formula. This is much faster than listing every term.</p><p><b>What does T(5) mean?</b> T stands for <b>term</b>. The number in the brackets is the <b>position</b> n. So T(5) means \u201cthe 5th term\u201d, and T(100) means \u201cthe 100th term\u201d. It does <b>not</b> mean T \u00d7 5.</p>'},

    {lb:'The Fibonacci rule',dr:dQ8,ht:'<p>In a <b>Fibonacci-type sequence</b>, each new term is found by adding the two terms before it.</p><div class="fm">1 + 1 = 2, &nbsp;1 + 2 = 3, &nbsp;2 + 3 = 5, &nbsp;3 + 5 = 8</div><p>Remember: T(5) means the 5th term. So T(n) is the nth term, T(n\u22121) is the term <b>just before</b> it, and T(n\u22122) is the term <b>two places before</b> it. The rule in symbols is:</p><div class="fm">T(n) = T(n\u22121) + T(n\u22122)</div><p style="font-size:13px;color:#6b5750;">Example: T(6) = T(5) + T(4) = 5 + 3 = 8</p>'},
    {lb:'Continue the sequence',dr:dQ8,ht:'<div class="fm">1, 1, 2, 3, 5, 8 \u2026</div><div class="fm">Next: 5+8=13, then 8+13=21</div>'},
    {lb:'The 7th and 8th terms',dr:dQ8,ht:'<div class="fm">T(7) = T(6) + T(5) = 8 + 5 = 13</div><div class="fm">T(8) = T(7) + T(6) = 13 + 8 = 21</div>'},
    {lb:'Fibonacci in nature and science',dr:dQ8,ht:'<p>Fibonacci numbers appear in many living things:</p><ul class="hl"><li><b>Flowers:</b> many flowers have 3, 5, 8, 13 or 21 petals (lilies have 3, buttercups have 5).</li><li><b>Sunflowers and pine cones:</b> the seeds grow in spirals. Count the spirals each way and you often get two Fibonacci numbers, such as 34 and 55.</li><li><b>Honeybees:</b> a male bee has 1 parent, 2 grandparents, 3 great-grandparents, then 5, 8, 13 \u2026 ancestors going back.</li><li><b>Rabbits:</b> Fibonacci first used the sequence to model how a family of rabbits grows each month.</li></ul>'},
    {lb:'Your turn',dr:dQ8,ht:tryIt(function(){

  {ey:'Q9 \u00b7 Year 7 \u00b7 Sequences',ti:'Sequences from a Table of Values',su:'Find the rule connecting n and y from the table: n=1,2,3,4,5 and y=3,5,7,9,11.',steps:[
    {lb:'Read the table',dr:dQ9,ht:'<p>A table of values shows input (n) and output (y) pairs. Look for a pattern in how y changes as n increases.</p>'},
    {lb:'Find the difference',dr:dQ9,ht:'<div class="fm">y increases by 2 each time \u2192 the rule involves 2n</div>'},
    {lb:'Adjust for the constant',dr:dQ9,ht:'<div class="fm">2\u00d71=2, but y=3: difference is +1</div><div class="fm">Rule: y = 2n + 1</div>'},
    {lb:'Verify',dr:dQ9,ht:'<p>Check the rule with values from the table, writing each line as you would on paper:</p><div class="fm">When n = 3:<br>y = 2n + 1<br>y = 2 \u00d7 3 + 1<br>y = 6 + 1<br>y = 7 &nbsp;\u2713 (the table says 7)</div><div class="fm">When n = 5:<br>y = 2n + 1<br>y = 2 \u00d7 5 + 1<br>y = 10 + 1<br>y = 11 &nbsp;\u2713 (the table says 11)</div>'},
    {lb:'Your turn',dr:dQ9,ht:tryIt(function(){

  {ey:'Q10 \u00b7 Year 7 \u00b7 Sequences',ti:'Describing and Classifying Sequences',su:'Identify each sequence type: arithmetic, geometric, square numbers, or Fibonacci.',steps:[
    {lb:'Four types',dr:dQ10,ht:'<p><b>Arithmetic</b>: constant difference. <b>Geometric</b>: constant ratio. <b>Square numbers</b>: 1, 4, 9, 16\u2026 <b>Fibonacci</b>: each term = sum of two before.</p>'},
    {lb:'Sequence 1: 2, 5, 8, 11',dr:dQ10,ht:'<div class="fm">Differences: +3, +3, +3  \u2192  Arithmetic (d=3)</div>'},
    {lb:'Sequence 2: 2, 4, 8, 16',dr:dQ10,ht:'<div class="fm">Ratios: \u00d72, \u00d72, \u00d72  \u2192  Geometric (r=2)</div>'},
    {lb:'Sequences 3 and 4',dr:dQ10,ht:'<div class="fm">1, 4, 9, 16  \u2192  Square numbers (n\u00b2)</div><div class="fm">1, 1, 2, 3  \u2192  Fibonacci</div>'},
    {lb:'Your turn',dr:dQ10,ht:tryIt(function(){
  var TYPES = ['Arithmetic', 'Geometric', 'Square numbers', 'Fibonacci-type'];
  var k = rInt(0, 3), t, why, next;
  if(k === 0){
    var a = rInt(1, 12), d = rInt(2, 9);
    t = [a, a+d, a+2*d, a+3*d, a+4*d]; next = a+5*d;
    why = 'The difference is +' + d + ' every time, so it is arithmetic.';
  } else if(k === 1){
    var b = rInt(1, 4), r = pick([2, 3]);
    t = [b, b*r, b*r*r, b*r*r*r, b*r*r*r*r]; next = t[4]*r;
    why = 'Each term is multiplied by ' + r + ', so it is geometric (ratio \u00d7' + r + ').';
  } else if(k === 2){
    var s0 = rInt(1, 4);
    t = [s0*s0, (s0+1)*(s0+1), (s0+2)*(s0+2), (s0+3)*(s0+3), (s0+4)*(s0+4)]; next = (s0+5)*(s0+5);
    why = 'These are ' + s0 + '\u00b2, ' + (s0+1) + '\u00b2, ' + (s0+2) + '\u00b2 \u2026 so they are square numbers. The jumps go up by 2 each time.';
  } else {
    var f1 = rInt(1, 4), f2 = rInt(2, 6);
    t = [f1, f2, f1+f2]; t.push(t[1]+t[2]); t.push(t[2]+t[3]); next = t[3]+t[4];
    why = 'Each term is the sum of the two before it (' + t[0] + '+' + t[1] + '=' + t[2] + '), so it is Fibonacci-type.';
  }
  if(Math.random() < 0.5){
    return {
      question: 'What type of sequence is <b>' + t.join(', ') + ', \u2026</b>?',
      options: TYPES,
      hints: ['Look at the differences and the ratios'],
      ans: k,
      working: why
    };
  }
  // Next-term multiple choice: one correct answer and three distractors
  var dists = [next + 1, next - 1, t[4] + (t[4] - t[3]), t[4] * 2, next + 2];
  var opts = [next];
  dists.forEach(function(v){ if(opts.length < 4 && v > 0 && opts.indexOf(v) < 0) opts.push(v); });
  while(opts.length < 4){ var v2 = next + opts.length + 2; if(opts.indexOf(v2) < 0) opts.push(v2); }
  opts.sort(function(x, y){ return x - y; });
  return {
    question: 'What is the next term of <b>' + t.join(', ') + ', \u2026</b>?',
    options: opts.map(String),
    hints: ['First decide what type of sequence it is'],
    ans: opts.indexOf(next),
    working: why + ' Next term = ' + next + '.'
  };
})}
  ]}
];
