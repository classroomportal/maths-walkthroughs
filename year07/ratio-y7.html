<script>

var ST={};

function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);return b===0?a:gcd(b,a%b);}

function htmlFrac(num,den,col,lbl){
  col=col||'#C0272D';
  return '<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;">'
    +(lbl?'<span style="font-size:10px;color:#888;font-style:italic;line-height:1.2;">numerator</span>':'')
    +'<span style="font-size:17px;font-weight:700;color:'+col+';border-bottom:2px solid '+col+';padding:0 4px 1px;min-width:18px;text-align:center;">'+num+'</span>'
    +'<span style="font-size:17px;color:'+col+';padding:1px 4px 0;min-width:18px;text-align:center;">'+den+'</span>'
    +(lbl?'<span style="font-size:10px;color:#888;font-style:italic;line-height:1.2;">denominator</span>':'')
    +'</span>';
}

function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();
  ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}

function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  var ex=o.extraHTML||'';
  var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  var ansBox=o.frac
    ? '<div class="ar"><div class="fracbox"><input type="number" step="any" placeholder="num" class="try-num" data-tryid="'+id+'"/><div class="fracline"></div><input type="number" step="any" placeholder="den" class="try-den" data-tryid="'+id+'"/></div><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    : '<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>';
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">✔ Your Turn'
    +' <button class="newq-btn" data-tryid="'+id+'">↻ New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'
    +ex
    +ansBox
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'
    +'<div class="wk-b">'+o.working+'</div></details>'
    +'</div>';
}

function newQ(id){
  var e=ST[id]; if(!e||!e.genFn)return;
  var o=e.genFn(); e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');
  if(!box)return;
  var tmp=document.createElement('div');
  tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);
  ST[id]={o:o,genFn:e.genFn};
}

function ckById(id){
  var e=ST[id]; if(!e)return;
  var o=e.o;
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!fb)return;
  if(o.frac){
    var ni=document.querySelector('.try-num[data-tryid="'+id+'"]');
    var di=document.querySelector('.try-den[data-tryid="'+id+'"]');
    if(!ni||!di)return;
    var nv=parseFloat(ni.value),dv=parseFloat(di.value);
    if(isNaN(nv)||isNaN(dv)||dv===0){fb.className='try-fb fb er';fb.textContent='Enter a valid fraction (numerator and denominator).';return;}
    var ok=o.fracExact?(nv===o.ansN&&dv===o.ansD):(Math.abs(nv/dv-o.ansN/o.ansD)<1e-6);
    if(ok){
      fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
    }else if(o.fracExact&&Math.abs(nv/dv-o.ansN/o.ansD)<1e-6){
      fb.className='try-fb fb er';fb.textContent='That’s an equivalent fraction, but not fully simplified — try again.';
    }else{
      fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
    }
    return;
  }
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  if(!inp)return;
  var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(o.range){
    if(v>o.rangeMin && v<o.rangeMax){
      fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
    }else{
      fb.className='try-fb fb er';fb.textContent='Not quite — that’s outside the range. Try again.';
    }
    return;
  }
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){
    fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
  }else{
    fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
  }
}

document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){
    newQ(btn.getAttribute('data-tryid'));
  } else if(btn.classList.contains('try-ck')){
    ckById(btn.getAttribute('data-tryid'));
  }
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'#fff5f0')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#888')+'" stroke-width="'+(w||1.5)+'"/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(sw||2)+'"/>';}
function svgFrac(x,y,num,den,col,sz){col=col||'#C0272D';sz=sz||14;var hw=Math.max(String(num).length,String(den).length)*sz*0.36+6;return '<text x="'+x+'" y="'+(y-2)+'" font-size="'+sz+'" font-family="Arial" fill="'+col+'" text-anchor="middle" font-weight="700">'+num+'</text>'+'<line x1="'+(x-hw)+'" y1="'+y+'" x2="'+(x+hw)+'" y2="'+y+'" stroke="'+col+'" stroke-width="1.5"/>'+'<text x="'+x+'" y="'+(y+sz+2)+'" font-size="'+sz+'" font-family="Arial" fill="'+col+'" text-anchor="middle">'+den+'</text>';}
function pieSlices(cx,cy,r,den,filled){var out='',ang=-90,step=360/den;for(var i=0;i<den;i++){var a0=(ang+i*step)*Math.PI/180,a1=(ang+(i+1)*step)*Math.PI/180;var x0=(cx+r*Math.cos(a0)).toFixed(1),y0=(cy+r*Math.sin(a0)).toFixed(1);var x1=(cx+r*Math.cos(a1)).toFixed(1),y1=(cy+r*Math.sin(a1)).toFixed(1);var large=step>180?1:0;var fill=(i<filled)?'#C0272D':'#fdf1ea';out+='<path d="M '+cx+' '+cy+' L '+x0+' '+y0+' A '+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' Z" fill="'+fill+'" stroke="#fff" stroke-width="2"/>';}return out;}

function dQ1(p){var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];o.push(T(240,28,'Divide \u20a684 in ratio 3:4','#C0272D',18,'middle',true));if(p>=1){var bx=40,by=60,bw=280,bh=36,pw=bw/7;for(var i=0;i<7;i++){var fill=i<3?'#fce8d8':'#e8f4ff';var col=i<3?'#C0272D':'#1a5a8a';o.push(R(bx+i*pw,by,pw-2,bh,fill,col,1.5));o.push(T(bx+i*pw+pw/2,by+bh/2+5,i<3?'3rd':'4th',col,8));}o.push(T(bx+3*pw/2,by-10,'3 parts','#C0272D',10,'middle',false));o.push(T(bx+3*pw+4*pw/2,by-10,'4 parts','#1a5a8a',10,'middle',false));o.push(T(240,108,'3 + 4 = 7 parts in total','#241A17',13,'middle',true));o.push(R(120,116,240,32,'#fff5f0','#C0272D',1.5));o.push(T(240,136,'1 part = \u20a684 \u00f7 7 = \u20a612','#C0272D',15,'middle',true));}if(p>=2){o.push(R(40,176,180,36,'#e8f4ff','#1a5a8a',1.5));o.push(T(130,198,'3\u00d712 = 36','#1a5a8a',15,'middle',true));o.push(R(260,176,180,36,'#e8f8ee','#1a7a3a',1.5));o.push(T(350,198,'4\u00d712 = 48','#1a7a3a',15,'middle',true));}if(p>=3){o.push(T(240,236,'Check: 36+48 = 84 \u2713','#888',12,'middle',false));}s.innerHTML=o.join('');}

function dQ2(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Three-part ratios','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Share \u20a6100 in ratio 2:3:5','#241A17',16,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'2+3+5 = 10 parts. 1 part = \u20a610','#C0272D',13,'middle',true));}if(p>=3){[['2\u00d710','\u20a620'],['3\u00d710','\u20a630'],['5\u00d710','\u20a650']].forEach(function(x,i){o.push(R(40+i*140,120,120,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(100+i*140,142,x[0]+'='+x[1],'#1a7a3a',13,'middle',true));});}s.innerHTML=o.join('');}

function dQ3(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Simplifying ratios','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Simplify the ratio 12:18','#241A17',18,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'HCF(12,18) = 6','#C0272D',15,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'12\u00f76 : 18\u00f76 = 2:3','#1a7a3a',16,'middle',true));}if(p>=4){o.push(T(240,178,'Just like simplifying fractions \u2014 divide both sides by the HCF','#888',11,'middle',false));}s.innerHTML=o.join('');}

function dQ4(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Finding one share when you know the total','#C0272D',12,'middle',true));if(p>=1){o.push(T(240,60,'Share \u20a6120 in ratio 1:5','#241A17',16,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'1+5 = 6 parts. 1 part = \u20a620','#C0272D',13,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'Smaller share = 1\u00d720 = \u20a620','#1a7a3a',15,'middle',true));}s.innerHTML=o.join('');}

  if (!userPickedVoice) return null;
  var voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){return v.lang.indexOf('en')===0;});
  return voices[parseInt(voiceSelEl.value,10)] || null;
}
function hasInteractiveQuestion(st){ return st.ht.indexOf('data-tryid')>-1; }

function stopReading(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  autoPlaying = false;
  readBtnEl.disabled = false; autoBtnEl.disabled = false;
  stopBtnEl.style.display = 'none';
  readerStatusEl.textContent = '';
  window.__activeUtterance = null;
}

function speakStep(st, onDone){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech isn’t supported on this browser.'; if(onDone) onDone(); return; }
  if (!st.speak) { if(onDone) onDone(); return; }
  var u = new SpeechSynthesisUtterance(st.speak);
  var v = currentVoice();
  if (v) u.voice = v;
  u.rate = 0.95;
  u.onend = function(){ window.__activeUtterance = null; if (onDone) onDone(); };
  u.onerror = function(ev){
    window.__activeUtterance = null;
    readerStatusEl.textContent = 'Couldn’t play audio (' + (ev && ev.error ? ev.error : 'unknown error') + '). Check the device isn’t muted and try again.';
    if (onDone) onDone();
  };
  window.__activeUtterance = u;
  speechSynthesis.speak(u);
  setTimeout(function(){
    if (window.__activeUtterance === u && !speechSynthesis.speaking && !speechSynthesis.pending) {
      readerStatusEl.textContent = 'No audio started — try tapping the button again, or check the device isn’t on silent/muted.';
    }
  }, 600);
}

readBtnEl.addEventListener('click', function(){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech not supported on this device.'; return; }
  speechSynthesis.cancel();
  readBtnEl.disabled = true; autoBtnEl.disabled = true; stopBtnEl.style.display = 'inline-block';
  readerStatusEl.textContent = 'Reading…';
  var st = QS[qi].steps[si];
  speakStep(st, function(){
    readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
  });
});

autoBtnEl.addEventListener('click', function(){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech not supported on this device.'; return; }
  speechSynthesis.cancel();
  autoPlaying = true;
  readBtnEl.disabled = true; autoBtnEl.disabled = true; stopBtnEl.style.display = 'inline-block';
  autoStep();
});

stopBtnEl.addEventListener('click', stopReading);

function autoStep(){
  if (!autoPlaying) return;
  var q = QS[qi], st = q.steps[si];
  readerStatusEl.textContent = 'Reading step '+(si+1)+' of '+q.steps.length+'…';
  speakStep(st, function(){
    if (!autoPlaying) return;
    if (hasInteractiveQuestion(st)) {
      autoPlaying = false;
      readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
      readerStatusEl.textContent = 'Your turn — try the question below.';
      return;
    }
    if (si < q.steps.length-1) {
      si++;
      var p=document.getElementById('pn'); var nst=q.steps[si];
      p.innerHTML='<div class="sl">'+nst.lb+'</div>'+nst.ht; nst.dr(si);
      p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');
      bDT();
      autoStep();
    } else {
      autoPlaying = false;
      readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
      readerStatusEl.textContent = 'Question narrated.';
    }
  });
}

(function(){var seen={},done=false,_render=render;render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length||!window.markComplete)return;done=true;Promise.resolve(window.markComplete()).then(function(){var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);}).catch(function(){done=false;});}catch(e){}};})();
render();
