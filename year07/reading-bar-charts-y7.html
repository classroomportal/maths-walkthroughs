<script>

var ST={};

function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();
  ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}

function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  var ex=o.extraHTML||'';
  var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  var ansBox=o.frac
    ? '<div class="ar"><div class="fracbox"><input type="number" step="any" placeholder="num" class="try-num" data-tryid="'+id+'"/><div class="fracline"></div><input type="number" step="any" placeholder="den" class="try-den" data-tryid="'+id+'"/></div><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    : '<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>';
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">✔ Your Turn'
    +' <button class="newq-btn" data-tryid="'+id+'">↻ New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'+ex
    +ansBox
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'</div>';
}

function newQ(id){
  var e=ST[id]; if(!e||!e.genFn)return;
  var o=e.genFn(); e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');
  if(!box)return;
  var tmp=document.createElement('div');
  tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);
  ST[id]={o:o,genFn:e.genFn};
}

function ckById(id){
  var e=ST[id]; if(!e)return;
  var o=e.o;
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!fb)return;
  if(o.frac){
    var ni=document.querySelector('.try-num[data-tryid="'+id+'"]');
    var di=document.querySelector('.try-den[data-tryid="'+id+'"]');
    if(!ni||!di)return;
    var nv=parseFloat(ni.value),dv=parseFloat(di.value);
    if(isNaN(nv)||isNaN(dv)||dv===0){fb.className='try-fb fb er';fb.textContent='Enter a valid fraction (numerator and denominator).';return;}
    var ok=o.fracExact?(nv===o.ansN&&dv===o.ansD):(Math.abs(nv/dv-o.ansN/o.ansD)<1e-6);
    if(ok){
      fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
    }else if(o.fracExact&&Math.abs(nv/dv-o.ansN/o.ansD)<1e-6){
      fb.className='try-fb fb er';fb.textContent='That’s an equivalent fraction, but not fully simplified — try again.';
    }else{
      fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
    }
    return;
  }
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  if(!inp)return;
  var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(o.range){
    if(v>o.rangeMin && v<o.rangeMax){
      fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
    }else{
      fb.className='try-fb fb er';fb.textContent='Not quite — that’s outside the range. Try again.';
    }
    return;
  }
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){
    fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;
  }else{
    fb.className='try-fb fb er';fb.textContent='Not quite — try again.';
  }
}

document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){
    newQ(btn.getAttribute('data-tryid'));
  } else if(btn.classList.contains('try-ck')){
    ckById(btn.getAttribute('data-tryid'));
  }
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial,sans-serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#C0272D')+'" stroke-width="'+(w||2)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fce8d8')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'"/>';}
function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  var data=[['Mon',8,'#C0272D'],['Tue',12,'#1a5a8a'],['Wed',6,'#1a7a3a'],['Thu',15,'#C8922A'],['Fri',10,'#6050a0']];
  var ox=60,oy=230,bw=50,gap=16,sc=10;
  o.push(L(ox,oy,ox,oy-160,'#888',1.5));o.push(L(ox,oy,ox+data.length*(bw+gap)+20,oy,'#888',1.5));
  for(var i=0;i<=15;i+=5){o.push(L(ox-4,oy-i*sc,ox+4,oy-i*sc,'#888',1));o.push(T(ox-10,oy-i*sc+4,i,'#888',10,'end'));}
  data.forEach(function(d,i){
    var bx=ox+i*(bw+gap)+gap;
    o.push(R(bx,oy,bw,0,'#eee','#ddd',1));
    if(p>=1){o.push(R(bx,oy-d[1]*sc,bw,d[1]*sc,d[2]+'44',d[2],1.5));if(p>=2){o.push(T(bx+bw/2,oy-d[1]*sc-6,d[1],d[2],11,'middle',true));}}
    o.push(T(bx+bw/2,oy+14,d[0],'#555',10,'middle',false));
  });
  o.push(T(240,16,'Students absent each day','#241A17',12,'middle',true));
  s.innerHTML=o.join('');
}

function dQ2(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Reading exact values off a bar chart','#C0272D',13,'middle',true));var ox=60,oy=180,bw=60,gap=30,sc=8;var data=[['A',12],['B',18],['C',9]];data.forEach(function(d,i){var bx=ox+i*(bw+gap);o.push(R(bx,oy-d[1]*sc,bw,d[1]*sc,'#C0272D44','#C0272D',1.5));o.push(T(bx+bw/2,oy+16,d[0],'#555',11));if(p>=2)o.push(T(bx+bw/2,oy-d[1]*sc-8,d[1],'#C0272D',13,'middle',true));});o.push(L(ox,oy,ox,oy-160,'#888',1.5));o.push(L(ox,oy,ox+250,oy,'#888',1.5));s.innerHTML=o.join('');}

function dQ3(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Finding the total from a bar chart','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Bars show: 6, 9, 4, 11. Find the total.','#241A17',13,'middle'));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'Add all the bar heights','#C0272D',13,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'6+9+4+11 = 30','#1a7a3a',16,'middle',true));}s.innerHTML=o.join('');}

function dQ4(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Finding the difference between two bars','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Bar A = 15, Bar B = 8. How much bigger is A?','#241A17',14,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'Subtract the smaller from the larger','#C0272D',13,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'15\u22128 = 7','#1a7a3a',18,'middle',true));}s.innerHTML=o.join('');}

function dQ5(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Reading a bar chart with a scale','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Each gridline = 2 units. A bar reaches 3 gridlines up.','#241A17',12,'middle'));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'3 gridlines \u00d7 2 units each','#C0272D',13,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'3\u00d72 = 6','#1a7a3a',18,'middle',true));}if(p>=4){o.push(T(240,178,'Always check the SCALE before reading values off a chart!','#888',11,'middle',false));}s.innerHTML=o.join('');}

function dQ6(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Real life: rainfall chart','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Monthly rainfall (mm): Jan=40, Feb=55, Mar=30. Wettest month?','#241A17',11,'middle'));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'Find the tallest bar','#C0272D',13,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'February (55mm)','#1a7a3a',16,'middle',true));}s.innerHTML=o.join('');}

function dQ7(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Comparing two bars','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Which is bigger: a bar of 14, or a bar of 11?','#241A17',15,'middle',true));}if(p>=2){o.push(R(60,80,150,34,'#fff5f0','#C0272D',1.5));o.push(T(135,102,'Bar 1 = 14','#C0272D',14,'middle',true));o.push(R(270,80,150,34,'#e8f4ff','#1a5a8a',1.5));o.push(T(345,102,'Bar 2 = 11','#1a5a8a',14,'middle',true));}if(p>=3){o.push(R(90,126,300,30,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,146,'Bar 1 is bigger \u2014 14>11','#1a7a3a',13,'middle',true));}s.innerHTML=o.join('');}

// ── Auto-reader ──────────────────────────────────────────────────────────
// "Read this step" speaks just the current step once. "Auto-play question"
// chains through every step of the current question, stopping (rather than
// talking over) any step containing the interactive Your Turn question.
var voiceSelEl = document.getElementById('voiceSel');
var readerStatusEl = document.getElementById('readerStatus');
var readBtnEl = document.getElementById('readBtn');
var autoBtnEl = document.getElementById('autoBtn');
var stopBtnEl = document.getElementById('stopReadBtn');
var autoPlaying = false;
var userPickedVoice = false; // only true once the student manually changes the dropdown

function populateVoices(){
  var voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){return v.lang.indexOf('en')===0;});
  voiceSelEl.innerHTML = '<option value="">Default voice</option>' + voices.map(function(v,i){return '<option value="'+i+'">'+v.name+' ('+v.lang+')</option>';}).join('');
}
if (window.speechSynthesis) {
  populateVoices();
  speechSynthesis.onvoiceschanged = populateVoices;
}
voiceSelEl.addEventListener('change', function(){ userPickedVoice = (voiceSelEl.value !== ''); });
function currentVoice(){
  // iOS Safari silently fails to speak() if given a Voice object fetched before
  // the voice list is fully ready — safest default is no explicit voice at all
  // unless the student has deliberately picked one.
  if (!userPickedVoice) return null;
  var voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){return v.lang.indexOf('en')===0;});
  return voices[parseInt(voiceSelEl.value,10)] || null;
}
function hasInteractiveQuestion(st){ return st.ht.indexOf('data-tryid')>-1; }

function stopReading(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  autoPlaying = false;
  readBtnEl.disabled = false; autoBtnEl.disabled = false;
  stopBtnEl.style.display = 'none';
  readerStatusEl.textContent = '';
  window.__activeUtterance = null;
}

// WebKit (Safari/iOS) can garbage-collect an utterance mid-speech if nothing
// keeps a strong reference to it, silently killing the audio.
function speakStep(st, onDone){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech isn\u2019t supported on this browser.'; if(onDone) onDone(); return; }
  if (!st.speak) { if(onDone) onDone(); return; }
  var u = new SpeechSynthesisUtterance(st.speak);
  var v = currentVoice();
  if (v) u.voice = v;
  u.rate = 0.95;
  u.onend = function(){ window.__activeUtterance = null; if (onDone) onDone(); };
  u.onerror = function(ev){
    window.__activeUtterance = null;
    readerStatusEl.textContent = 'Couldn\u2019t play audio (' + (ev && ev.error ? ev.error : 'unknown error') + '). Check the device isn\u2019t muted and try again.';
    if (onDone) onDone();
  };
  window.__activeUtterance = u;
  speechSynthesis.speak(u);
  setTimeout(function(){
    if (window.__activeUtterance === u && !speechSynthesis.speaking && !speechSynthesis.pending) {
      readerStatusEl.textContent = 'No audio started \u2014 try tapping the button again, or check the device isn\u2019t on silent/muted.';
    }
  }, 600);
}

readBtnEl.addEventListener('click', function(){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech not supported on this device.'; return; }
  speechSynthesis.cancel();
  readBtnEl.disabled = true; autoBtnEl.disabled = true; stopBtnEl.style.display = 'inline-block';
  readerStatusEl.textContent = 'Reading\u2026';
  var st = QS[qi].steps[si];
  speakStep(st, function(){
    readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
  });
});

autoBtnEl.addEventListener('click', function(){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech not supported on this device.'; return; }
  speechSynthesis.cancel();
  autoPlaying = true;
  readBtnEl.disabled = true; autoBtnEl.disabled = true; stopBtnEl.style.display = 'inline-block';
  autoStep();
});

function autoStep(){
  if (!autoPlaying) return;
  var q = QS[qi], st = q.steps[si];
  readerStatusEl.textContent = 'Reading step '+(si+1)+' of '+q.steps.length+'\u2026';
  speakStep(st, function(){
    if (!autoPlaying) return;
    if (hasInteractiveQuestion(st)) {
      autoPlaying = false;
      readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
      readerStatusEl.textContent = 'Your turn \u2014 try the question below.';
      return;
    }
    if (si < q.steps.length-1) {
      si++;
      var p=document.getElementById('pn'); var nst=q.steps[si];
      p.innerHTML='<div class="sl">'+nst.lb+'</div>'+nst.ht; nst.dr(si);
      p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');
      bDT();
      autoStep();
    } else {
      autoPlaying = false;
      readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
      readerStatusEl.textContent = 'Question narrated.';
    }
  });
}

stopBtnEl.addEventListener('click', stopReading);
