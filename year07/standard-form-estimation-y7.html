.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  var ex=o.extraHTML||'';var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">\u2714 Your Turn <button class="newq-btn" data-tryid="'+id+'">\u21bb New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'+ex
    +'<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'</div>';
}
function newQ(id){
  var e=ST[id];if(!e||!e.genFn)return;
  var o=e.genFn();e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');if(!box)return;
  var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);ST[id]={o:o,genFn:e.genFn};
}
function ckById(id){
  var e=ST[id];if(!e)return;var o=e.o;
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!inp||!fb)return;var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){fb.className='try-fb fb ok';fb.innerHTML='\u2713 Correct! '+o.working;}
  else{fb.className='try-fb fb er';fb.textContent='Not quite \u2014 try again.';}
}
document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){newQ(btn.getAttribute('data-tryid'));}
  else if(btn.classList.contains('try-ck')){ckById(btn.getAttribute('data-tryid'));}
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial,sans-serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#C0272D')+'" stroke-width="'+(w||2)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fce8d8')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'"/>';}

function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,26,'Powers of 10','#C0272D',18,'middle',true));
  var rows=[['10\u00b9','10'],['10\u00b2','100'],['10\u00b3','1000'],['10\u2074','10 000']];
  rows.forEach(function(r,i){o.push(R(140,60+i*40,200,32,'#fff5f0','#C0272D',1.5));o.push(T(200,82+i*40,r[0],'#C0272D',15,'middle',true));o.push(T(320,82+i*40,'= '+r[1],'#241A17',15,'middle'));});
  if(p>=1)o.push(T(240,225,'The power tells you how many zeros follow the 1','#1a7a3a',12,'middle'));
  s.innerHTML=o.join('');
}
function dQ2(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,26,'Write 47000 in standard form','#C0272D',16,'middle',true));
  if(p>=1){o.push(R(100,60,280,34,'#fff5f0','#C0272D',1.5));o.push(T(240,82,'First digit: 4.7','#C0272D',15,'middle'));}
  if(p>=2){o.push(T(240,116,'47000 = 4.7 \u00d7 10 000 = 4.7 \u00d7 10\u2074','#241A17',14,'middle'));}
  if(p>=3){o.push(R(120,140,240,34,'#e8f8ee','#1a7a3a',2));o.push(T(240,162,'4.7 \u00d7 10\u2074','#1a7a3a',17,'middle',true));}
  if(p>=4)o.push(T(240,200,'Standard form: A \u00d7 10\u207f where 1 \u2264 A < 10','#888',12,'middle'));
  s.innerHTML=o.join('');
}
function dQ3(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,26,'Convert 3.2 \u00d7 10\u00b3 to an ordinary number','#C0272D',15,'middle',true));
  if(p>=1)o.push(T(240,70,'Power is 3 \u2192 move decimal point 3 places right','#241A17',14,'middle'));
  if(p>=2)o.push(T(240,100,'3.2 \u2192 32 \u2192 320 \u2192 3200','#1a5a8a',15,'middle'));
  if(p>=3){o.push(R(140,130,200,32,'#e8f8ee','#1a7a3a',2));o.push(T(240,152,'= 3200','#1a7a3a',16,'middle',true));}
  s.innerHTML=o.join('');
}
function dQ4(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Round 6482 to 1 significant figure','#C0272D',15,'middle',true));
  if(p>=1)o.push(T(240,64,'First significant figure: 6 (in the thousands)','#241A17',13,'middle'));
  if(p>=2)o.push(T(240,92,'Look at the next digit: 4 \u2192 round down','#1a5a8a',13,'middle'));

  s.innerHTML=o.join('');
}
function dQ5(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,22,'Estimate 58 \u00d7 21','#C0272D',18,'middle',true));
  if(p>=1)o.push(T(240,64,'Round each number to 1 s.f.: 58\u224860, 21\u224820','#241A17',14,'middle'));
  if(p>=2){o.push(R(140,90,200,32,'#e8f8ee','#1a7a3a',2));o.push(T(240,112,'60 \u00d7 20 = 1200','#1a7a3a',16,'middle',true));}
  if(p>=3)o.push(T(240,150,'Actual answer: 1218 \u2014 a good, quick check!','#888',12,'middle'));
  s.innerHTML=o.join('');
}
function dQ6(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,22,'Order 2/3, 3/5, 7/10','#C0272D',17,'middle',true));
  if(p>=1)o.push(T(240,60,'Common denominator: 30','#241A17',14,'middle'));
  if(p>=2){o.push(T(240,90,'2/3 = 20/30','#C0272D',14,'middle'));o.push(T(240,112,'3/5 = 18/30','#1a5a8a',14,'middle'));o.push(T(240,134,'7/10 = 21/30','#1a7a3a',14,'middle'));}

}
function dQ7(p){

var QS=[
  {ey:'Q1 \u00b7 Year 7 \u00b7 Standard Form, Estimation & Proportion',ti:'Powers of 10',su:'Learn what 10\u00b9, 10\u00b2, 10\u00b3, 10\u2074 mean.',steps:[

  {ey:'Q2 \u00b7 Year 7 \u00b7 Standard Form, Estimation & Proportion',ti:'Writing Numbers in Standard Form (basic, positive powers)',su:'Write 47000 in standard form.',steps:[

    {lb:'Place the decimal point',dr:dQ2,ht:'<p>47000 \u2192 4.7 (moving the decimal point so only one non-zero digit is before it).</p>'},

    {lb:'Write the answer',dr:dQ2,ht:'<div class="fm">47000 = 4.7 \u00d7 10\u2074</div>'},
    {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var a=rInt(1,9),places=rInt(2,5),num=a*Math.pow(10,places);return{question:'Write '+num+' in standard form. What power of 10 should you use?',hints:['Count how many places the decimal point moves from '+a+'.0 to '+num],ans:places,tol:0,unit:'',working:num+' = '+a+'.0 \u00d7 10^'+places};})},

  {ey:'Q3 \u00b7 Year 7 \u00b7 Standard Form, Estimation & Proportion',ti:'Converting Standard Form Back to Ordinary Numbers',su:'Convert 3.2 \u00d7 10\u00b3 to an ordinary number.',steps:[

(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
