.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}

.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  var ex=o.extraHTML||'';var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">\u2714 Your Turn <button class="newq-btn" data-tryid="'+id+'">\u21bb New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'+ex
    +'<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'</div>';
}
function newQ(id){
  var e=ST[id];if(!e||!e.genFn)return;
  var o=e.genFn();e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');if(!box)return;
  var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);ST[id]={o:o,genFn:e.genFn};
}
function ckById(id){
  var e=ST[id];if(!e)return;var o=e.o;
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!inp||!fb)return;var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){fb.className='try-fb fb ok';fb.innerHTML='\u2713 Correct! '+o.working;}
  else{fb.className='try-fb fb er';fb.textContent='Not quite \u2014 try again.';}
}
document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){newQ(btn.getAttribute('data-tryid'));}
  else if(btn.classList.contains('try-ck')){ckById(btn.getAttribute('data-tryid'));}
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial,sans-serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#C0272D')+'" stroke-width="'+(w||2)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fce8d8')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'"/>';}

function tri(cx,cy,s,col){return '<polygon points="'+cx+','+(cy-s)+' '+(cx-s)+','+(cy+s*0.6)+' '+(cx+s)+','+(cy+s*0.6)+'" fill="'+col+'" fill-opacity="0.25" stroke="'+col+'" stroke-width="2"/>';}
function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Translate the triangle by vector (4, \u22122)','#C0272D',14,'middle',true));
  o.push(tri(120,90,30,'#C0272D'));o.push(T(120,60,'Original','#C0272D',11,'middle'));
  if(p>=1){o.push('<line x1="120" y1="90" x2="240" y2="150" stroke="#C8922A" stroke-width="2" marker-end="url(#arr)"/>');o.push(T(180,110,'(4,\u22122)','#C8922A',12,'middle',true));}
  if(p>=2){o.push(tri(240,150,30,'#1a7a3a'));o.push(T(240,190,'Image','#1a7a3a',11,'middle'));}
  if(p>=3)o.push(T(240,225,'Move every point 4 right, 2 down \u2014 shape unchanged','#888',12,'middle'));
  s.innerHTML=o.join('')+'<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#C8922A"/></marker></defs>';
}
function dQ2(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Describe the translation','#C0272D',16,'middle',true));
  o.push(tri(100,80,28,'#C0272D'));o.push(T(100,50,'Shape A','#C0272D',11,'middle'));
  o.push(tri(340,190,28,'#1a5a8a'));o.push(T(340,225,'Shape B','#1a5a8a',11,'middle'));
  if(p>=1){o.push(L(100,80,340,80,'#888',1,'3,2'));o.push(T(220,72,'right: 240','#888',10,'middle'));}
  if(p>=2){o.push(L(340,80,340,190,'#888',1,'3,2'));o.push(T(360,135,'down: 110','#888',10,'start'));}
  if(p>=3)o.push(T(240,235,'Vector: right, down (both positive means right/down)','#1a7a3a',12,'middle'));
  s.innerHTML=o.join('');
}
function dQ3(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Rotate 90\u00b0 clockwise about O','#C0272D',15,'middle',true));
  o.push(C(240,150,3,'#888','#888',1));o.push(T(255,150,'O','#888',11,'start'));
  o.push('<polygon points="200,100 200,140 260,140" fill="#C0272D" fill-opacity="0.25" stroke="#C0272D" stroke-width="2"/>');
  if(p>=1){o.push('<path d="M 200 90 A 70 70 0 0 1 290 150" fill="none" stroke="#C8922A" stroke-width="1.5" stroke-dasharray="4,3"/>');o.push(T(300,110,'90\u00b0','#C8922A',12,'middle'));}
  if(p>=2){o.push('<polygon points="290,110 330,110 330,170" fill="#1a7a3a" fill-opacity="0.25" stroke="#1a7a3a" stroke-width="2"/>');}
  if(p>=3)o.push(T(240,230,'Each vertex turns 90\u00b0 clockwise around O, same distance from O','#888',12,'middle'));
  s.innerHTML=o.join('');
}
function dQ4(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Describe the rotation','#C0272D',16,'middle',true));
  o.push(C(240,150,3,'#888','#888',1));o.push(T(255,150,'Centre','#888',10,'start'));
  o.push(tri(160,110,26,'#C0272D'));
  if(p>=1)o.push(tri(320,190,26,'#1a5a8a'));
  if(p>=2)o.push(T(240,225,'Angle turned: 180\u00b0 (half turn)','#1a7a3a',13,'middle',true));
  if(p>=3)o.push(T(240,240,'A 180\u00b0 rotation looks the same clockwise or anticlockwise','#888',11,'middle'));
  s.innerHTML=o.join('');
}
function dQ5(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(L(240,20,240,240,'#888',1.5,'4,3'));o.push(T(240,14,'mirror line','#888',10,'middle'));
  o.push(tri(160,120,28,'#C0272D'));
  if(p>=1)o.push(tri(320,120,28,'#1a5a8a'));
  if(p>=2){o.push(L(120,90,120,90,'#C8922A',0));o.push(L(160,120,320,120,'#C8922A',1,'3,2'));}
  if(p>=3){o.push(T(240,90,'Reflect first','#C0272D',12,'middle'));o.push(tri(200,200,20,'#1a7a3a'));o.push('<line x1="200" y1="200" x2="230" y2="200" stroke="#C8922A" stroke-width="2"/>');o.push(T(240,205,'then translate','#1a7a3a',11,'start'));}
  s.innerHTML=o.join('');
}
function dQ6(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Line Symmetry \u2014 how many lines?','#C0272D',15,'middle',true));
  var cx=240,cy=150,r=80;
  o.push('<polygon points="'+cx+','+(cy-r)+' '+(cx+r*0.95)+','+(cy-r*0.31)+' '+(cx+r*0.59)+','+(cy+r*0.81)+' '+(cx-r*0.59)+','+(cy+r*0.81)+' '+(cx-r*0.95)+','+(cy-r*0.31)+'" fill="#fce8d8" stroke="#C0272D" stroke-width="2"/>');
  if(p>=1){for(var i=0;i<5;i++){var ang=Math.PI/2-i*2*Math.PI/5;o.push(L(cx,cy,cx+r*1.15*Math.cos(ang),cy-r*1.15*Math.sin(ang),'#C8922A',1,'3,2'));}}
  if(p>=2)o.push(T(240,240,'A regular pentagon has 5 lines of symmetry','#1a7a3a',13,'middle',true));
  s.innerHTML=o.join('');
}
function dQ7(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Rotational Symmetry \u2014 Order','#C0272D',16,'middle',true));
  var cx=240,cy=140,r=70;
  o.push('<polygon points="'+cx+','+(cy-r)+' '+(cx+r*0.81)+','+(cy-r*0.59)+' '+(cx+r*0.95)+','+(cy+r*0.31)+' '+cx+','+(cy+r)+' '+(cx-r*0.95)+','+(cy+r*0.31)+' '+(cx-r*0.81)+','+(cy-r*0.59)+'" fill="#e8f4ff" stroke="#1a5a8a" stroke-width="2"/>');
  if(p>=1)o.push(T(cx,cy-r-14,'\u2191 marker vertex','#888',10,'middle'));
  if(p>=2)o.push(T(240,225,'It fits onto itself 6 times in a full turn','#1a7a3a',13,'middle'));
  if(p>=3)o.push(T(240,245,'Order of rotational symmetry = 6','#C0272D',15,'middle',true));
  s.innerHTML=o.join('');
}
function dQ8(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Interior Angle Sum of a Polygon','#C0272D',15,'middle',true));
  o.push('<polygon points="180,60 320,60 380,150 240,220 100,150" fill="#fff5f0" stroke="#C0272D" stroke-width="2"/>');
  if(p>=1){o.push(L(180,60,380,150,'#C8922A',1.5,'4,3'));o.push(L(180,60,240,220,'#C8922A',1.5,'4,3'));o.push(T(240,40,'Split into triangles from one vertex','#888',11,'middle'));}
  if(p>=2)o.push(T(240,240,'5 sides \u2192 3 triangles \u2192 3 \u00d7 180\u00b0','#1a5a8a',13,'middle'));
  if(p>=3)o.push(T(240,255,'= 540\u00b0 total','#1a7a3a',15,'middle',true));
  s.innerHTML=o.join('');
}
function dQ9(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Interior Angle of a Regular Polygon','#C0272D',15,'middle',true));
  o.push('<polygon points="240,50 340,90 340,190 240,230 140,190 140,90" fill="#e8f4ff" stroke="#1a5a8a" stroke-width="2"/>');
  if(p>=1)o.push(T(240,246,'Regular hexagon: 6 equal sides & angles','#888',12,'middle'));
  if(p>=2)o.push(T(240,262,'Sum = (6\u22122)\u00d7180 = 720\u00b0','#1a5a8a',13,'middle'));
  s.innerHTML=o.join('');
}
function dQ10(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Mixed Transformation Problem','#C0272D',16,'middle',true));
  o.push(tri(120,90,26,'#C0272D'));o.push(T(120,60,'Start','#C0272D',11,'middle'));
  if(p>=1){o.push('<line x1="120" y1="90" x2="240" y2="90" stroke="#C8922A" stroke-width="2"/>');o.push(tri(240,90,26,'#1a5a8a'));o.push(T(240,60,'after translation','#1a5a8a',10,'middle'));}
  if(p>=2){o.push(L(240,20,240,240,'#888',1,'4,3'));o.push(tri(360,90,26,'#1a7a3a'));o.push(T(360,60,'after reflection','#1a7a3a',10,'middle'));}
  if(p>=3)o.push(T(240,230,'Transformations can be combined in sequence','#888',12,'middle'));
  s.innerHTML=o.join('');
}


var QS=[
  {ey:'Q1 \u00b7 Year 7 \u00b7 Transformations & Symmetry',ti:'Translating a Shape Using a Vector',su:'Translate a triangle by the vector (4, \u22122).',steps:[
    {lb:'What is a translation?',dr:dQ1,ht:'<p>A <b>translation</b> slides a shape without turning or flipping it \u2014 every point moves the same distance.</p>'},
    {lb:'Read the vector',dr:dQ1,ht:'<p>(4, \u22122) means <b>4 right</b>, <b>2 down</b> (negative y = down).</p>'},
    {lb:'Move every vertex',dr:dQ1,ht:'<p>Apply the same movement to each vertex of the shape.</p>'},
    {lb:'Result',dr:dQ1,ht:'<p>The image is congruent (identical) to the original, just in a new position.</p>'},
