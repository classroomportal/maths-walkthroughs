<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  var ex=o.extraHTML||'';var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">\u2714 Your Turn <button class="newq-btn" data-tryid="'+id+'">\u21bb New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'+ex
    +'<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'</div>';
}
function newQ(id){
  var e=ST[id];if(!e||!e.genFn)return;
  var o=e.genFn();e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');if(!box)return;
  var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);ST[id]={o:o,genFn:e.genFn};
}
function ckById(id){
  var e=ST[id];if(!e)return;var o=e.o;
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!inp||!fb)return;var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){fb.className='try-fb fb ok';fb.innerHTML='\u2713 Correct! '+o.working;}
  else{fb.className='try-fb fb er';fb.textContent='Not quite \u2014 try again.';}
}
document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){newQ(btn.getAttribute('data-tryid'));}
  else if(btn.classList.contains('try-ck')){ckById(btn.getAttribute('data-tryid'));}
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial,sans-serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#C0272D')+'" stroke-width="'+(w||2)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fce8d8')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'"/>';}

function numLine(cx,cy,unit,lo,hi){
  var o=[];o.push(L(cx+lo*unit,cy,cx+hi*unit,cy,'#888',2));
  for(var i=lo;i<=hi;i++){o.push(L(cx+i*unit,cy-5,cx+i*unit,cy+5,'#888',1.5));o.push(T(cx+i*unit,cy+22,i,'#888',12));}
  return o;
}
function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push.apply(o,numLine(240,150,32,-5,5));
  o.push(T(240,30,'x > 2','#C0272D',18,'middle',true));
  if(p>=1){o.push(C(240+2*32,150,7,'#fff','#C0272D',3));o.push(T(240+2*32,190,'open circle at 2 (2 not included)','#C0272D',11,'middle'));}
  if(p>=2){o.push('<polygon points="'+(240+5*32)+',144 '+(240+5*32-14)+',150 '+(240+5*32)+',156" fill="#C0272D"/>');o.push(L(240+2*32,150,240+5*32,150,'#C0272D',4));}
  if(p>=3)o.push(T(240,220,'Arrow points right \u2014 all numbers greater than 2','#1a7a3a',13,'middle'));
  s.innerHTML=o.join('');
}

  if(p>=2)o.push(T(240,190,'Filled circle = value IS included (\u2264 or \u2265)','#C8922A',12,'middle'));
  if(p>=3){o.push(R(140,205,200,30,'#e8f8ee','#1a7a3a',2));o.push(T(240,225,'x \u2264 \u22121','#1a7a3a',16,'middle',true));}

  if(p>=2){o.push(R(140,104,200,34,'#e8f8ee','#1a7a3a',2));o.push(T(240,126,'x > 5','#1a7a3a',17,'middle',true));}

  if(p>=2){o.push(R(120,92,240,30,'#fff5f0','#C0272D',1.5));o.push(T(240,112,'2x \u2264 8','#C0272D',15,'middle'));}
  if(p>=3){o.push(R(140,130,200,32,'#e8f8ee','#1a7a3a',2));o.push(T(240,151,'x \u2264 4','#1a7a3a',16,'middle',true));}

  if(p>=2){o.push(R(80,88,320,34,'#fff3e0','#C8922A',2));o.push(T(240,110,'\u26a0 Flip the inequality sign!','#C8922A',15,'middle',true));}
  if(p>=3){o.push(R(140,130,200,32,'#e8f8ee','#1a7a3a',2));o.push(T(240,151,'x < \u22123','#1a7a3a',17,'middle',true));}

var QS=[
  {ey:'Q1 \u00b7 Year 7 \u00b7 Inequalities',ti:'Representing Inequalities on a Number Line',su:'Show x > 2 on a number line.',steps:[
