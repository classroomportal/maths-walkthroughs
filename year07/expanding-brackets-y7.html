<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function parseLinearExpr(str,vars){
  if(!str)return null;
  str=str.replace(/\s+/g,'').toLowerCase();
  if(str==='')return null;
  var coeffs={};vars.forEach(function(v){coeffs[v]=0;});
  var constant=0;
  var re=/([+-]?\d*)([a-z])|([+-]?\d+)(?![a-z])/g;var m;var matchedAny=false;var idx=0;
  while((m=re.exec(str))){
    if(m.index!==idx)return null;
    idx=re.lastIndex;matchedAny=true;
    if(m[2]){
      var c=m[1],v=m[2];
      if(vars.indexOf(v)===-1)return null;
      if(c===''||c==='+')c='1';else if(c==='-')c='-1';
      coeffs[v]+=parseInt(c,10);
    } else if(m[3]!==undefined){
      constant+=parseInt(m[3],10);
    }
  }
  if(!matchedAny||idx!==str.length)return null;
  coeffs._const=constant;
  return coeffs;
}
function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  var ex=o.extraHTML||'';
  var isExpr=!!o.vars;
  var ph=isExpr?(o.placeholder||'e.g. 5x + 3y'):('Answer'+(o.unit?' ('+o.unit+')':''));
  var inputHtml=isExpr
    ?'<input type="text" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/>'
    :'<input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/>';
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">✔ Your Turn <button class="newq-btn" data-tryid="'+id+'">↻ New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'+ex
    +'<div class="ar">'+inputHtml
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'</div>';
}
function newQ(id){
  var e=ST[id];if(!e||!e.genFn)return;
  var o=e.genFn();e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');if(!box)return;
  var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);ST[id]={o:o,genFn:e.genFn};
}
function ckById(id){
  var e=ST[id];if(!e)return;var o=e.o;
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!inp||!fb)return;
  if(o.vars){
    var parsed=parseLinearExpr(inp.value,o.vars);
    if(!parsed){fb.className='try-fb fb er';fb.textContent='Enter an expression, e.g. '+(o.placeholder||'5x + 3y').replace('e.g. ','');return;}
    var ok=true;
    for(var i=0;i<o.vars.length;i++){var vv=o.vars[i];if(parsed[vv]!==o.coeffs[vv])ok=false;}
    var expectedConst=(o.constant!=null)?o.constant:0;
    if(parsed._const!==expectedConst)ok=false;
    if(ok){fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;}
    else{fb.className='try-fb fb er';fb.textContent='Not quite — try again.';}
    return;
  }
  var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){fb.className='try-fb fb ok';fb.innerHTML='✓ Correct! '+o.working;}
  else{fb.className='try-fb fb er';fb.textContent='Not quite — try again.';}
}
document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){newQ(btn.getAttribute('data-tryid'));}
  else if(btn.classList.contains('try-ck')){ckById(btn.getAttribute('data-tryid'));}
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial,sans-serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#C0272D')+'" stroke-width="'+(w||2)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fce8d8')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'"/>';}

function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(R(14,8,452,36,'#fff5f0','#C0272D',1.5));
  o.push(T(240,28,'Expand  3(x + 4)','#C0272D',16,'middle',true));
  // Rectangle: moved down so it clears the title banner
  var rx=80,ry=52,rw=280,rh=100,sp=rx+180;  // split at x portion
  o.push(R(rx,ry,rw,rh,'#fff8f4','#C0272D',2));
  // height label "3" on left
  o.push(T(rx-18,ry+rh/2,'3','#C0272D',18,'middle',true));
  o.push(L(rx-28,ry,rx-28,ry+rh,'#C0272D',1.5));
  o.push(L(rx-34,ry,rx-22,ry,'#C0272D',1.5));
  o.push(L(rx-34,ry+rh,rx-22,ry+rh,'#C0272D',1.5));
  // top label showing x and 4 sections
  o.push(T(rx+sp/2-rx/2,ry-12,'x','#1a5a8a',15,'middle',true));
  o.push(T(rx+rw-(rw-(sp-rx))/2,ry-12,'4','#1a7a3a',15,'middle',true));
  if(p>=1){
    // vertical divider
    o.push(L(sp,ry,sp,ry+rh,'#888',1.5,'5,3'));
    o.push(R(rx,ry,sp-rx,rh,'#e8f0ff','#1a5a8a',2));
    o.push(R(sp,ry,rw-(sp-rx),rh,'#e8ffe8','#1a7a3a',2));
  }
  if(p>=2){o.push(T((rx+sp)/2,ry+rh/2,'3x','#1a5a8a',22,'middle',true));}
  if(p>=3){
    o.push(T((sp+(rx+rw))/2,ry+rh/2,'3×4=12','#1a7a3a',18,'middle',true));
    o.push(R(100,176,280,40,'#e8f8ee','#1a7a3a',2));
    o.push(T(240,200,'3(x + 4) = 3x + 12','#1a7a3a',17,'middle',true));
  }
  s.innerHTML=o.join('');
}
function dQ2(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Expanding with a negative multiplier','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Expand \u22122(x + 3)','#241A17',18,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'\u22122\u00d7x = \u22122x','#C0272D',14,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'\u22122\u00d73 = \u22126, so \u22122x \u2212 6','#1a7a3a',14,'middle',true));}if(p>=4){o.push(T(240,178,'A negative outside flips the sign of EVERY term inside','#888',11,'middle',false));}s.innerHTML=o.join('');}

function dQ3(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Expand, then simplify','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Expand and simplify 2(x + 3) + 4','#241A17',14,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'2(x+3) = 2x+6','#C0272D',14,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'2x+6+4 = 2x+10','#1a7a3a',14,'middle',true));}if(p>=4){o.push(T(240,178,'Expand FIRST, then collect any remaining like terms','#888',11,'middle',false));}s.innerHTML=o.join('');}

function dQ4(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Expanding with subtraction inside','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Expand 5(x \u2212 2)','#241A17',18,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'5\u00d7x = 5x','#C0272D',14,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'5\u00d7(\u22122) = \u221210, so 5x \u2212 10','#1a7a3a',14,'middle',true));}s.innerHTML=o.join('');}

function dQ5(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Expanding with a coefficient inside','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'Expand 3(2x + 5)','#241A17',18,'middle',true));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'3\u00d72x = 6x','#C0272D',14,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'3\u00d75 = 15, so 6x + 15','#1a7a3a',14,'middle',true));}if(p>=4){o.push(T(240,178,'Multiply the COEFFICIENTS together: 3\u00d72=6','#888',11,'middle',false));}s.innerHTML=o.join('');}

function dQ6(p){var s=g();s.setAttribute('viewBox','0 0 480 220');var o=[];o.push(R(14,8,452,32,'#fff5f0','#C0272D',1.5));o.push(T(240,29,'Real life: area model','#C0272D',13,'middle',true));if(p>=1){o.push(T(240,60,'A rectangle is 4 wide and (x+3) long. Find its area.','#241A17',12,'middle'));}if(p>=2){o.push(R(140,76,200,34,'#fff5f0','#C0272D',1.5));o.push(T(240,98,'Area = 4 \u00d7 (x+3)','#C0272D',14,'middle',true));}if(p>=3){o.push(R(140,120,200,34,'#e8f8ee','#1a7a3a',1.5));o.push(T(240,142,'= 4x + 12','#1a7a3a',18,'middle',true));}s.innerHTML=o.join('');}

function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
function render(){if(typeof stopReading==='function')stopReading();bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').innerHTML=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+st.ht;st.dr(si);bDT();document.getElementById('pb').disabled=(si===0);document.getElementById('nb').textContent=(si===q.steps.length-1)?'Restart':'Next →';}

// ── Auto-reader ──────────────────────────────────────────────────────────
// "Read this step" speaks just the current step once. "Auto-play question"
// chains through every step of the current question, stopping (rather than
// talking over) any step containing the interactive Your Turn question.
var voiceSelEl = document.getElementById('voiceSel');
var readerStatusEl = document.getElementById('readerStatus');
var readBtnEl = document.getElementById('readBtn');
var autoBtnEl = document.getElementById('autoBtn');
var stopBtnEl = document.getElementById('stopReadBtn');
var autoPlaying = false;
var userPickedVoice = false; // only true once the student manually changes the dropdown

function populateVoices(){
  var voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){return v.lang.indexOf('en')===0;});
  voiceSelEl.innerHTML = '<option value="">Default voice</option>' + voices.map(function(v,i){return '<option value="'+i+'">'+v.name+' ('+v.lang+')</option>';}).join('');
}
if (window.speechSynthesis) {
  populateVoices();
  speechSynthesis.onvoiceschanged = populateVoices;
}
voiceSelEl.addEventListener('change', function(){ userPickedVoice = (voiceSelEl.value !== ''); });
function currentVoice(){
  // iOS Safari silently fails to speak() if given a Voice object fetched before
  // the voice list is fully ready — safest default is no explicit voice at all
  // unless the student has deliberately picked one.
  if (!userPickedVoice) return null;
  var voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){return v.lang.indexOf('en')===0;});
  return voices[parseInt(voiceSelEl.value,10)] || null;
}
function hasInteractiveQuestion(st){ return st.ht.indexOf('data-tryid')>-1; }

function stopReading(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  autoPlaying = false;
  readBtnEl.disabled = false; autoBtnEl.disabled = false;
  stopBtnEl.style.display = 'none';
  readerStatusEl.textContent = '';
  window.__activeUtterance = null;
}

// WebKit (Safari/iOS) can garbage-collect an utterance mid-speech if nothing
// keeps a strong reference to it, silently killing the audio.
function speakStep(st, onDone){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech isn\u2019t supported on this browser.'; if(onDone) onDone(); return; }
  if (!st.speak) { if(onDone) onDone(); return; }
  var u = new SpeechSynthesisUtterance(st.speak);
  var v = currentVoice();
  if (v) u.voice = v;
  u.rate = 0.95;
  u.onend = function(){ window.__activeUtterance = null; if (onDone) onDone(); };
  u.onerror = function(ev){
    window.__activeUtterance = null;
    readerStatusEl.textContent = 'Couldn\u2019t play audio (' + (ev && ev.error ? ev.error : 'unknown error') + '). Check the device isn\u2019t muted and try again.';
    if (onDone) onDone();
  };
  window.__activeUtterance = u;
  speechSynthesis.speak(u);
  setTimeout(function(){
    if (window.__activeUtterance === u && !speechSynthesis.speaking && !speechSynthesis.pending) {
      readerStatusEl.textContent = 'No audio started \u2014 try tapping the button again, or check the device isn\u2019t on silent/muted.';
    }
  }, 600);
}

readBtnEl.addEventListener('click', function(){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech not supported on this device.'; return; }
  speechSynthesis.cancel();
  readBtnEl.disabled = true; autoBtnEl.disabled = true; stopBtnEl.style.display = 'inline-block';
  readerStatusEl.textContent = 'Reading\u2026';
  var st = QS[qi].steps[si];
  speakStep(st, function(){
    readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
  });
});

autoBtnEl.addEventListener('click', function(){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech not supported on this device.'; return; }
  speechSynthesis.cancel();
  autoPlaying = true;
  readBtnEl.disabled = true; autoBtnEl.disabled = true; stopBtnEl.style.display = 'inline-block';
  autoStep();
});

function autoStep(){
  if (!autoPlaying) return;
  var q = QS[qi], st = q.steps[si];
  readerStatusEl.textContent = 'Reading step '+(si+1)+' of '+q.steps.length+'\u2026';
  speakStep(st, function(){
    if (!autoPlaying) return;
    if (hasInteractiveQuestion(st)) {
      autoPlaying = false;
      readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
      readerStatusEl.textContent = 'Your turn \u2014 try the question below.';
      return;
    }
    if (si < q.steps.length-1) {
      si++;
      var p=document.getElementById('pn'); var nst=q.steps[si];
      p.innerHTML='<div class="sl">'+nst.lb+'</div>'+nst.ht; nst.dr(si);
      p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');
      bDT();
      autoStep();
    } else {
      autoPlaying = false;
      readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
      readerStatusEl.textContent = 'Question narrated.';
    }
  });
}
