<style>

:root{--red:#C0272D;--dark:#7A1418;--cream:#FBF6F1;--ink:#241A17;--line:#E4D6CE;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#6b5750;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#fdf7f4);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:"\203a";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
.wk-line{padding:6px 0 6px 12px;border-left:3px solid var(--line);margin-bottom:6px;}
.wk-line:last-child{margin-bottom:0;font-weight:700;border-left-color:var(--gold);}
.reader-row{width:100%;max-width:760px;display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.reader-btn{font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:5px;border:1.5px solid var(--gold);background:#fff;color:var(--gold);cursor:pointer;font-family:inherit;}
.reader-btn.active{background:var(--gold);color:#fff;}
.reader-btn:disabled{opacity:.4;cursor:default;}
.reader-status{font-size:11.5px;color:#6b5750;}
.reader-voice{font-size:12px;padding:6px 8px;border:1.5px solid var(--line);border-radius:5px;background:#fff;font-family:inherit;}
.newq-btn{float:right;font-size:11px;font-weight:600;padding:3px 9px;border-radius:3px;border:1px solid var(--gold);background:#fff;color:var(--gold);cursor:pointer;font-family:inherit;}
.newq-btn:hover{background:var(--gold);color:#fff;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;}
.try-q{font-size:15px;margin:8px 0 10px;}
.click-stage{display:flex;justify-content:center;margin:10px 0 4px;}
.click-svg{width:100%;max-width:420px;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:manipulation;}
.hit,.mchit{transition:fill .1s;}
.hit:hover,.mchit:hover{fill:rgba(200,146,42,.18);}
.hit:active,.mchit:active{fill:rgba(192,39,45,.25);}
.click-hint{font-size:13px;color:#6b5750;margin-top:2px;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}
function wkLines(working){
  return working.split('\n').map(function(line){return '<div class="wk-line">'+line+'</div>';}).join('');
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+wkLines(o.working)+'</div>';
  var ex=o.extraHTML||'';var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">\u2714 Your Turn <button class="newq-btn" data-tryid="'+id+'">\u21bb New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'+ex
    +'<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'</div>';
}
function newQ(id){
  var e=ST[id];if(!e||!e.genFn)return;
  var o=e.genFn();e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');if(!box)return;
  var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);ST[id]={o:o,genFn:e.genFn};
}
function ckById(id){
  var e=ST[id];if(!e)return;var o=e.o;
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!inp||!fb)return;var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){fb.className='try-fb fb ok';fb.innerHTML='\u2713 Correct!<div class="wk-b">'+wkLines(o.working)+'</div>';}
  else{fb.className='try-fb fb er';fb.textContent='Not quite \u2014 try again.';}
}
var CST={},MST={};

// ---- Click-to-plot widget ----
function tryItClick(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='c'+Math.random().toString(36).slice(2);
  var o=genFn();CST[id]={o:o,genFn:genFn,picked:null};
  return buildClick(id,o);
}
function clickGridSVG(ox,oy,unit,n,id){
  var o=[];o.push.apply(o,grid(ox,oy,unit,n));
  for(var gx=-n;gx<=n;gx++){for(var gy=-n;gy<=n;gy++){
    var px=ox+gx*unit,py=oy-gy*unit;
    o.push('<circle class="hit" data-clickid="'+id+'" data-gx="'+gx+'" data-gy="'+gy+'" cx="'+px+'" cy="'+py+'" r="12" fill="transparent"/>');
  }}
  return o.join('');
}
function buildClick(id,o){
  var n=o.n||5,unit=o.unit||26,ox=210,oy=160;
  return '<div class="try" data-clickid="'+id+'">'
    +'<div class="try-t">\u2714 Your Turn <button class="newq-btn" data-clickid="'+id+'">\u21bb New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'
    +'<div class="click-stage"><svg class="click-svg" viewBox="0 0 420 320">'+clickGridSVG(ox,oy,unit,n,id)+'</svg></div>'
    +'<div class="click-hint">Tap a grid point to plot it, then press Check.</div>'
    +'<div class="ar" style="justify-content:flex-end;"><button class="ck click-ck" data-clickid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-clickid="'+id+'"></div>'
    +'</div>';
}
function newClickQ(id){
  var e=CST[id];if(!e||!e.genFn)return;
  var o=e.genFn();var box=document.querySelector('.try[data-clickid="'+id+'"]');if(!box)return;
  var tmp=document.createElement('div');tmp.innerHTML=buildClick(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);CST[id]={o:o,genFn:e.genFn,picked:null};
}
function ckClick(id){
  var e=CST[id];if(!e)return;var o=e.o;
  var fb=document.querySelector('.try-fb[data-clickid="'+id+'"]');if(!fb)return;
  if(!e.picked){fb.className='try-fb fb er';fb.textContent='Tap a point on the grid first.';return;}
  if(e.picked.x===o.tx&&e.picked.y===o.ty){fb.className='try-fb fb ok';fb.innerHTML='\u2713 Correct! ('+o.tx+', '+o.ty+') is plotted correctly.';}
  else{fb.className='try-fb fb er';fb.innerHTML='Not quite \u2014 you plotted ('+e.picked.x+', '+e.picked.y+'). The correct point is ('+o.tx+', '+o.ty+'). Try again.';}
}

// ---- Tap-the-point multiple choice widget ----
function tryItTapMC(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='m'+Math.random().toString(36).slice(2);
  var o=genFn();MST[id]={o:o,genFn:genFn};
  return buildTapMC(id,o);
}
function buildTapMC(id,o){
  var n=o.n||5,unit=o.unit||26,ox=210,oy=160;
  var s=[];s.push.apply(s,grid(ox,oy,unit,n));
  o.points.forEach(function(pt){
    var px=ox+pt.x*unit,py=oy-pt.y*unit;
    s.push(C(px,py,6,pt.col,pt.col,1));
    s.push(T(px+12,py-8,pt.lbl,pt.col,13,'start',true));
    s.push('<circle class="mchit" data-mcid="'+id+'" data-lbl="'+pt.lbl+'" cx="'+px+'" cy="'+py+'" r="14" fill="transparent"/>');
  });
  return '<div class="try" data-mcid="'+id+'">'
    +'<div class="try-t">\u2714 Your Turn <button class="newq-btn" data-mcid="'+id+'">\u21bb New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'
    +'<div class="click-stage"><svg class="click-svg" viewBox="0 0 420 320">'+s.join('')+'</svg></div>'
    +'<div class="click-hint">Tap the correct point on the grid.</div>'
    +'<div class="try-fb" data-mcid="'+id+'"></div>'
    +'</div>';
}
function newTapMC(id){
  var e=MST[id];if(!e||!e.genFn)return;
  var o=e.genFn();var box=document.querySelector('.try[data-mcid="'+id+'"]');if(!box)return;
  var tmp=document.createElement('div');tmp.innerHTML=buildTapMC(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);MST[id]={o:o,genFn:e.genFn};
}

document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('hit')){
    var id=btn.getAttribute('data-clickid'),gx=+btn.getAttribute('data-gx'),gy=+btn.getAttribute('data-gy');
    var svg=btn.closest('svg');
    var old=svg.querySelector('.picked-dot');if(old)old.parentNode.removeChild(old);
    var oldl=svg.querySelector('.picked-lbl');if(oldl)oldl.parentNode.removeChild(oldl);
    var dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('class','picked-dot');dot.setAttribute('cx',btn.getAttribute('cx'));dot.setAttribute('cy',btn.getAttribute('cy'));
    dot.setAttribute('r',7);dot.setAttribute('fill','#C0272D');dot.setAttribute('stroke','#7A1418');dot.setAttribute('stroke-width',2);
    svg.appendChild(dot);
    if(CST[id])CST[id].picked={x:gx,y:gy};
    return;
  }
  if(btn.classList.contains('mchit')){
    var mid=btn.getAttribute('data-mcid'),lbl=btn.getAttribute('data-lbl');
    var e2=MST[mid];if(!e2)return;var o2=e2.o;
    var fb2=document.querySelector('.try-fb[data-mcid="'+mid+'"]');if(!fb2)return;
    if(lbl===o2.correctLbl){fb2.className='try-fb fb ok';fb2.innerHTML='\u2713 Correct! Point '+lbl+' is at ('+o2.correctCoord+').';}
    else{fb2.className='try-fb fb er';fb2.innerHTML='Not quite \u2014 that\u2019s point '+lbl+'. Look for the point at ('+o2.correctCoord+').';}
    return;
  }
  if(btn.classList.contains('click-ck')){ckClick(btn.getAttribute('data-clickid'));return;}
  if(btn.classList.contains('newq-btn')){
    if(btn.hasAttribute('data-clickid')){newClickQ(btn.getAttribute('data-clickid'));return;}
    if(btn.hasAttribute('data-mcid')){newTapMC(btn.getAttribute('data-mcid'));return;}
    newQ(btn.getAttribute('data-tryid'));return;
  }
  if(btn.classList.contains('try-ck')){ckById(btn.getAttribute('data-tryid'));return;}
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial,sans-serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#C0272D')+'" stroke-width="'+(w||2)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fce8d8')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'"/>';}

function grid(originX,originY,unit,n){
  var o=[];
  for(var i=-n;i<=n;i++){
    o.push(L(originX-n*unit,originY-i*unit,originX+n*unit,originY-i*unit,'#eee',1));
    o.push(L(originX+i*unit,originY-n*unit,originX+i*unit,originY+n*unit,'#eee',1));
  }
  o.push(L(originX-n*unit,originY,originX+n*unit,originY,'#888',2));
  o.push(L(originX,originY-n*unit,originX,originY+n*unit,'#888',2));
  for(var i=-n;i<=n;i+=2){ if(i!==0){o.push(T(originX+i*unit,originY+16,i,'#888',10));o.push(T(originX-16,originY-i*unit+4,i,'#888',10));} }
  o.push(T(originX+n*unit+14,originY+4,'x','#888',12));
  o.push(T(originX-6,originY-n*unit-8,'y','#888',12));
  return o;
}
function plot(originX,originY,unit,x,y,col,lbl){
  var o=[];var px=originX+x*unit,py=originY-y*unit;
  o.push(C(px,py,5,col,col,1));
  if(lbl)o.push(T(px+10,py-8,lbl,col,12,'start',true));
  return o;
}
function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push.apply(o,grid(240,190,26,6));
  if(p>=1)o.push.apply(o,plot(240,190,26,3,2,'#C0272D','A(3, 2)'));
  if(p>=2)o.push.apply(o,plot(240,190,26,-2,4,'#1a5a8a','B(\u22122, 4)'));
  if(p>=3)o.push.apply(o,plot(240,190,26,-4,-3,'#1a7a3a','C(\u22124, \u22123)'));
  o.push(T(240,20,'(x, y) \u2014 x first, then y','#888',13,'middle'));
  s.innerHTML=o.join('');
}
function dQ2(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push.apply(o,grid(240,190,26,6));

    {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var s=rInt(2,5),x0=rInt(-4,2);return{question:'A square has corners ('+x0+',0), ('+(x0+s)+',0), ('+(x0+s)+','+s+'), ('+x0+','+s+'). What is the side length of the square?',hints:['Compare the x-values of the first two corners'],ans:s,tol:0,unit:'',working:'Side length = '+(x0+s)+' \u2212 '+x0+' = '+s};}),speak:'Now it\u2019s your turn \u2014 have a go at the question below.'},
  ]},
  {ey:'Q10 \u00b7 Year 7 \u00b7 Coordinates & Graphs',ti:'Real-Life Coordinate Problems (maps/grids)',su:'Home is at (1,2), School is at (6,3) on a street grid.',steps:[
    {lb:'Read the grid',dr:dQ10,ht:'<p>Each grid line represents one street block.</p>',speak:'Each grid line represents one street block.'},

    {lb:'Describe the route',dr:dQ10,ht:'<p>Move 5 blocks right, then 1 block up, to get from Home to School.</p>',speak:'So move 5 blocks right, then 1 block up, to get from Home to School.'},

];

var qi=0,si=0;
function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
function render(){if(typeof stopReading==='function')stopReading();bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').innerHTML=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+st.ht;st.dr(si);bDT();document.getElementById('pb').disabled=(si===0);document.getElementById('nb').textContent=(si===q.steps.length-1)?'Restart':'Next \u2192';}
document.getElementById('pb').addEventListener('click',function(){if(si>0){si--;render();}});
document.getElementById('nb').addEventListener('click',function(){var q=QS[qi];si=(si===q.steps.length-1)?0:si+1;render();});

// ── Auto-reader ──────────────────────────────────────────────────────────
// "Read this step" speaks just the current step once. "Auto-play question"
// chains through every step of the current question, stopping (rather than
// talking over) any step containing the interactive Your Turn question.
var voiceSelEl = document.getElementById('voiceSel');
var readerStatusEl = document.getElementById('readerStatus');
var readBtnEl = document.getElementById('readBtn');
var autoBtnEl = document.getElementById('autoBtn');
var stopBtnEl = document.getElementById('stopReadBtn');
var autoPlaying = false;
var userPickedVoice = false; // only true once the student manually changes the dropdown

function populateVoices(){
  var voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){return v.lang.indexOf('en')===0;});
  voiceSelEl.innerHTML = '<option value="">Default voice</option>' + voices.map(function(v,i){return '<option value="'+i+'">'+v.name+' ('+v.lang+')</option>';}).join('');
}
if (window.speechSynthesis) {
  populateVoices();
  speechSynthesis.onvoiceschanged = populateVoices;
}
voiceSelEl.addEventListener('change', function(){ userPickedVoice = (voiceSelEl.value !== ''); });
function currentVoice(){
  // iOS Safari silently fails to speak() if given a Voice object fetched before
  // the voice list is fully ready — safest default is no explicit voice at all
  // unless the student has deliberately picked one.
  if (!userPickedVoice) return null;
  var voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(function(v){return v.lang.indexOf('en')===0;});
  return voices[parseInt(voiceSelEl.value,10)] || null;
}
function hasInteractiveQuestion(st){ return st.ht.indexOf('data-tryid')>-1 || st.ht.indexOf('data-clickid')>-1 || st.ht.indexOf('data-mcid')>-1; }

function stopReading(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  autoPlaying = false;
  readBtnEl.disabled = false; autoBtnEl.disabled = false;
  stopBtnEl.style.display = 'none';
  readerStatusEl.textContent = '';
  window.__activeUtterance = null;
}

// WebKit (Safari/iOS) can garbage-collect an utterance mid-speech if nothing
// keeps a strong reference to it, silently killing the audio.
function speakStep(st, onDone){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech isn\u2019t supported on this browser.'; if(onDone) onDone(); return; }
  if (!st.speak) { if(onDone) onDone(); return; }
  var u = new SpeechSynthesisUtterance(st.speak);
  var v = currentVoice();
  if (v) u.voice = v;
  u.rate = 0.95;
  u.onend = function(){ window.__activeUtterance = null; if (onDone) onDone(); };
  u.onerror = function(ev){
    window.__activeUtterance = null;
    readerStatusEl.textContent = 'Couldn\u2019t play audio (' + (ev && ev.error ? ev.error : 'unknown error') + '). Check the device isn\u2019t muted and try again.';
    if (onDone) onDone();
  };
  window.__activeUtterance = u;
  speechSynthesis.speak(u);
  setTimeout(function(){
    if (window.__activeUtterance === u && !speechSynthesis.speaking && !speechSynthesis.pending) {
      readerStatusEl.textContent = 'No audio started \u2014 try tapping the button again, or check the device isn\u2019t on silent/muted.';
    }
  }, 600);
}

readBtnEl.addEventListener('click', function(){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech not supported on this device.'; return; }
  speechSynthesis.cancel();
  readBtnEl.disabled = true; autoBtnEl.disabled = true; stopBtnEl.style.display = 'inline-block';
  readerStatusEl.textContent = 'Reading\u2026';
  var st = QS[qi].steps[si];
  speakStep(st, function(){
    readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
  });
});

autoBtnEl.addEventListener('click', function(){
  if (!window.speechSynthesis) { readerStatusEl.textContent = 'Speech not supported on this device.'; return; }
  speechSynthesis.cancel();
  autoPlaying = true;
  readBtnEl.disabled = true; autoBtnEl.disabled = true; stopBtnEl.style.display = 'inline-block';
  autoStep();
});

function autoStep(){
  if (!autoPlaying) return;
  var q = QS[qi], st = q.steps[si];
  readerStatusEl.textContent = 'Reading step '+(si+1)+' of '+q.steps.length+'\u2026';
  speakStep(st, function(){
    if (!autoPlaying) return;
    if (hasInteractiveQuestion(st)) {
      autoPlaying = false;
      readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
      readerStatusEl.textContent = 'Your turn \u2014 try the question below.';
      return;
    }
    if (si < q.steps.length-1) {
      si++;
      var p=document.getElementById('pn'); var nst=q.steps[si];
      p.innerHTML='<div class="sl">'+nst.lb+'</div>'+nst.ht; nst.dr(si);
      p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');
      bDT();
      autoStep();
    } else {
      autoPlaying = false;
      readBtnEl.disabled = false; autoBtnEl.disabled = false; stopBtnEl.style.display = 'none';
      readerStatusEl.textContent = 'Question narrated.';
    }
  });
}

stopBtnEl.addEventListener('click', stopReading);

render();

</script>
