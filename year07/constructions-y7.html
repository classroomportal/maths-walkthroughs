.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#6b5750;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#fdf7f4);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:"\203a";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
.newq-btn{float:right;font-size:11px;font-weight:600;padding:3px 9px;border-radius:3px;border:1px solid var(--gold);background:#fff;color:var(--gold);cursor:pointer;font-family:inherit;}
.newq-btn:hover{background:var(--gold);color:#fff;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;}
.try-q{font-size:15px;margin:8px 0 10px;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  var ex=o.extraHTML||'';var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">\u2714 Your Turn <button class="newq-btn" data-tryid="'+id+'">\u21bb New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'+ex
    +'<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'</div>';
}
function newQ(id){
  var e=ST[id];if(!e||!e.genFn)return;
  var o=e.genFn();e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');if(!box)return;
  var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);ST[id]={o:o,genFn:e.genFn};
}
function ckById(id){
  var e=ST[id];if(!e)return;var o=e.o;
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!inp||!fb)return;var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){fb.className='try-fb fb ok';fb.innerHTML='\u2713 Correct! '+o.working;}
  else{fb.className='try-fb fb er';fb.textContent='Not quite \u2014 try again.';}
}
document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){newQ(btn.getAttribute('data-tryid'));}
  else if(btn.classList.contains('try-ck')){ckById(btn.getAttribute('data-tryid'));}
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial,sans-serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#C0272D')+'" stroke-width="'+(w||2)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fce8d8')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'"/>';}

function protractorArc(cx,cy,r){var o=[];o.push('<path d="M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy+'" fill="none" stroke="#888" stroke-width="1.5"/>');for(var a=0;a<=180;a+=30){var rad=Math.PI*(180-a)/180;o.push(L(cx,cy,cx+r*Math.cos(rad),cy-r*Math.sin(rad),'#ddd',1));o.push(T(cx+(r+16)*Math.cos(rad),cy-(r+16)*Math.sin(rad),a,'#888',9));}return o;}
function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Measuring an angle with a protractor','#C0272D',15,'middle',true));
  o.push.apply(o,protractorArc(240,190,120));
  o.push(L(240,190,360,190,'#C0272D',2.5));
  if(p>=1){var ang=55,rad=Math.PI*(180-ang)/180;o.push(L(240,190,240+120*Math.cos(rad),190-120*Math.sin(rad),'#1a5a8a',2.5));o.push(T(300,140,ang+'\u00b0','#1a5a8a',14,'middle',true));}
  if(p>=2)o.push(T(240,235,'Line up the base line, read where the other arm crosses the scale','#888',12,'middle'));
  s.innerHTML=o.join('');
}
function dQ2(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Constructing a 50\u00b0 angle','#C0272D',16,'middle',true));
  o.push(L(140,190,340,190,'#C0272D',2.5));o.push(T(140,210,'A','#C0272D',13,'middle',true));
  if(p>=1){var rad=Math.PI*130/180;o.push(C(140+100*Math.cos(rad),190-100*Math.sin(rad),3,'#C8922A','#C8922A',1));o.push(T(140,150,'mark 50\u00b0 on the protractor scale','#888',11,'middle'));}
  if(p>=2){var rad2=Math.PI*130/180;o.push(L(140,190,140+140*Math.cos(rad2),190-140*Math.sin(rad2),'#1a5a8a',2.5));o.push(T(140+140*Math.cos(rad2)+10,190-140*Math.sin(rad2),'B','#1a5a8a',13,'middle',true));}
  if(p>=3)o.push(T(240,235,'Draw a ray from A through the 50\u00b0 mark to B','#1a7a3a',12,'middle'));
  s.innerHTML=o.join('');
}
function dQ3(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(L(100,150,380,150,'#C0272D',2.5));o.push(T(100,172,'A','#C0272D',13,'middle',true));o.push(T(380,172,'B','#C0272D',13,'middle',true));
  o.push(T(240,24,'Perpendicular Bisector of AB','#C0272D',16,'middle',true));
  if(p>=1){o.push(C(100,150,140,'none','#1a5a8a',1.5));o.push(T(240,60,'Arc from A (radius > half AB)','#1a5a8a',11,'middle'));}
  if(p>=2){o.push(C(380,150,140,'none','#1a7a3a',1.5));o.push(T(240,225,'Arc from B (same radius)','#1a7a3a',11,'middle'));}
  if(p>=3){o.push(L(240,20,240,270,'#C8922A',2.5));o.push(C(240,150,5,'#C8922A','#C8922A',1));o.push(T(255,150,'M (midpoint)','#C8922A',11,'start'));}
  s.innerHTML=o.join('');
}
function dQ4(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Angle Bisector of \u2220BAC','#C0272D',16,'middle',true));
  o.push(L(90,220,240,60,'#C0272D',2.5));o.push(L(390,220,240,60,'#C0272D',2.5));
  o.push(T(240,45,'A','#C0272D',13,'middle',true));
  if(p>=1){o.push(C(240,60,60,'none','#1a5a8a',1.5,'0 30'));o.push(T(240,120,'Arc across both arms','#1a5a8a',11,'middle'));}
  if(p>=2){o.push(C(160,150,50,'none','#1a7a3a',1.2));o.push(C(320,150,50,'none','#1a7a3a',1.2));o.push(T(240,180,'Two arcs from those points cross here','#1a7a3a',11,'middle'));}
  if(p>=3){o.push(L(240,60,240,240,'#C8922A',2.5));o.push(T(240,255,'Bisector \u2014 splits the angle exactly in half','#C8922A',12,'middle',true));}
  s.innerHTML=o.join('');
}
function dQ5(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Construct a triangle: sides 5, 6, 7 cm (SSS)','#C0272D',15,'middle',true));
  o.push(L(140,190,340,190,'#C0272D',2.5));o.push(T(240,208,'Base = 7 cm','#C0272D',12,'middle'));
  if(p>=1){o.push(C(140,190,90,'none','#1a5a8a',1.2));o.push(T(140,90,'Arc, radius 5 cm, from left end','#1a5a8a',11,'middle'));}
  if(p>=2){o.push(C(340,190,100,'none','#1a7a3a',1.2));o.push(T(340,80,'Arc, radius 6 cm, from right end','#1a7a3a',11,'middle'));}
  if(p>=3){o.push(C(235,100,5,'#C8922A','#C8922A',1));o.push(L(140,190,235,100,'#C8922A',2));o.push(L(340,190,235,100,'#C8922A',2));o.push(T(235,85,'Arcs cross here \u2014 third vertex','#C8922A',11,'middle'));}
  s.innerHTML=o.join('');
}
function dQ6(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Construct: 6cm, 40\u00b0, 5cm (SAS)','#C0272D',15,'middle',true));
  o.push(L(120,190,300,190,'#C0272D',2.5));o.push(T(120,210,'A','#C0272D',13,'middle',true));o.push(T(300,210,'B (6cm)','#C0272D',12,'middle'));
  if(p>=1){o.push.apply(o,protractorArc(120,190,70).map(function(x){return x;}));o.push(T(120,90,'Measure 40\u00b0 at A','#888',11,'middle'));}
  if(p>=2){var rad=Math.PI*140/180;o.push(L(120,190,120+130*Math.cos(rad),190-130*Math.sin(rad),'#1a5a8a',2.5));o.push(T(120+130*Math.cos(rad)-14,190-130*Math.sin(rad)-6,'ray at 40\u00b0','#1a5a8a',11));}
  if(p>=3){var rad2=Math.PI*140/180;var cx=120+100*Math.cos(rad2),cy=190-100*Math.sin(rad2);o.push(C(cx,cy,4,'#1a7a3a','#1a7a3a',1));o.push(T(cx+10,cy,'C (5cm along ray)','#1a7a3a',11,'start',true));o.push(L(300,190,cx,cy,'#C8922A',2));}
  s.innerHTML=o.join('');
}
function dQ7(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Three-Figure Bearings','#C0272D',16,'middle',true));
  o.push(L(240,190,240,60,'#888',2,'3,2'));o.push('<polygon points="240,55 234,68 246,68" fill="#888"/>');o.push(T(240,45,'N','#888',13,'middle',true));
  if(p>=1){var ang=70,rad=Math.PI*(90-ang)/180;o.push(L(240,190,240+120*Math.cos(rad),190-120*Math.sin(rad),'#C0272D',2.5));o.push(T(240+120*Math.cos(rad)+16,190-120*Math.sin(rad),'B','#C0272D',13,'start',true));}
  if(p>=2){o.push(T(300,150,'measured CLOCKWISE from North','#1a5a8a',12,'middle'));}
  if(p>=3){o.push(R(150,220,180,30,'#e8f8ee','#1a7a3a',2));o.push(T(240,240,'Bearing = 070\u00b0 (always 3 digits)','#1a7a3a',15,'middle',true));}
  s.innerHTML=o.join('');
}
function dQ8(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Finding a Bearing Between Two Points','#C0272D',15,'middle',true));
  o.push(C(140,190,4,'#C0272D','#C0272D',1));o.push(T(140,210,'Town A','#C0272D',12,'middle'));
  o.push(C(340,90,4,'#1a5a8a','#1a5a8a',1));o.push(T(340,75,'Town B','#1a5a8a',12,'middle'));
  o.push(L(140,190,140,110,'#888',1.5,'3,2'));o.push(T(140,100,'N','#888',12,'middle',true));
  if(p>=1)o.push(L(140,190,340,90,'#C8922A',2));
  if(p>=2){o.push('<path d="M 140 150 A 40 40 0 0 1 172 122" fill="none" stroke="#1a7a3a" stroke-width="2"/>');o.push(T(180,145,'\u03b8','#1a7a3a',13,'middle',true));}
  if(p>=3)o.push(T(240,230,'Measure the clockwise angle from North at A to B','#1a7a3a',13,'middle'));
  s.innerHTML=o.join('');
}
function dQ9(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'Back Bearings','#C0272D',16,'middle',true));
  o.push(C(140,190,4,'#C0272D','#C0272D',1));o.push(T(140,210,'A','#C0272D',12,'middle'));
  o.push(C(340,90,4,'#1a5a8a','#1a5a8a',1));o.push(T(340,75,'B','#1a5a8a',12,'middle'));
  o.push(L(140,190,340,90,'#888',2));
  if(p>=1){o.push(T(240,140,'Bearing of B from A = 070\u00b0','#C0272D',13,'middle'));}
  if(p>=2){o.push(T(240,165,'Back bearing (A from B) = 070\u00b0 + 180\u00b0','#1a5a8a',13,'middle'));}
  if(p>=3){o.push(R(140,185,200,30,'#e8f8ee','#1a7a3a',2));o.push(T(240,205,'= 250\u00b0','#1a7a3a',16,'middle',true));}
  if(p>=4)o.push(T(240,230,'Rule: add 180\u00b0 (or subtract 180\u00b0 if over 180\u00b0)','#888',11,'middle'));
  s.innerHTML=o.join('');
}
function dQ10(p){
