.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}

.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}

@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function tryIt(genFn){
  if(typeof genFn==='object'){var _o=genFn;genFn=function(){return _o;};}
  var id='t'+Math.random().toString(36).slice(2);
  var o=genFn();ST[id]={o:o,genFn:genFn};
  return buildTry(id,o);
}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  var ex=o.extraHTML||'';var ph='Answer'+(o.unit?' ('+o.unit+')':'');
  var ansBox=o.frac
    ? '<div class="ar"><div class="fracbox"><input type="number" step="any" placeholder="num" class="try-num" data-tryid="'+id+'"/><div class="fracline"></div><input type="number" step="any" placeholder="den" class="try-den" data-tryid="'+id+'"/></div><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    : '<div class="ar"><input type="number" step="any" placeholder="'+ph+'" class="try-inp" data-tryid="'+id+'"/><button class="ck try-ck" data-tryid="'+id+'">Check</button></div>';
  return '<div class="try" data-tryid="'+id+'">'
    +'<div class="try-t">\u2714 Your Turn <button class="newq-btn" data-tryid="'+id+'">\u21bb New</button></div>'
    +'<div class="try-q">'+o.question+'</div>'+ex
    +ansBox
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'</div>';
}
function newQ(id){
  var e=ST[id];if(!e||!e.genFn)return;
  var o=e.genFn();e.o=o;
  var box=document.querySelector('.try[data-tryid="'+id+'"]');if(!box)return;
  var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
  box.parentNode.replaceChild(tmp.firstChild,box);ST[id]={o:o,genFn:e.genFn};
}
function ckById(id){
  var e=ST[id];if(!e)return;var o=e.o;
  var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');
  if(!fb)return;
  if(o.frac){
    var ni=document.querySelector('.try-num[data-tryid="'+id+'"]');
    var di=document.querySelector('.try-den[data-tryid="'+id+'"]');
    if(!ni||!di)return;
    var nv=parseFloat(ni.value),dv=parseFloat(di.value);
    if(isNaN(nv)||isNaN(dv)||dv===0){fb.className='try-fb fb er';fb.textContent='Enter a valid fraction (numerator and denominator).';return;}
    if(Math.abs(nv/dv-o.ansN/o.ansD)<1e-6){fb.className='try-fb fb ok';fb.innerHTML='\u2713 Correct! '+o.working;}
    else{fb.className='try-fb fb er';fb.textContent='Not quite \u2014 try again.';}
    return;
  }
  var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
  if(!inp)return;var v=parseFloat(inp.value);
  if(isNaN(v)){fb.className='try-fb fb er';fb.textContent='Enter a number.';return;}
  if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.5)){fb.className='try-fb fb ok';fb.innerHTML='\u2713 Correct! '+o.working;}
  else{fb.className='try-fb fb er';fb.textContent='Not quite \u2014 try again.';}
}
document.addEventListener('click',function(e){
  var btn=e.target;
  if(btn.classList.contains('newq-btn')){newQ(btn.getAttribute('data-tryid'));}
  else if(btn.classList.contains('try-ck')){ckById(btn.getAttribute('data-tryid'));}
});

function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#241A17';sz=sz||13;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial,sans-serif" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#fff5f0';stroke=stroke||'#C0272D';sw=sw||2;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';}
function L(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#C0272D')+'" stroke-width="'+(w||2)+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';}
function C(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fce8d8')+'" stroke="'+(stroke||'#C0272D')+'" stroke-width="'+(sw||2)+'"/>';}

function probScale(cx,cy,w){var o=[];o.push(L(cx-w/2,cy,cx+w/2,cy,'#888',3));
  [0,0.25,0.5,0.75,1].forEach(function(f){var x=cx-w/2+f*w;o.push(L(x,cy-6,x,cy+6,'#888',1.5));});
  o.push(T(cx-w/2,cy+22,'0\nImpossible','#888',10,'middle'));o.push(T(cx,cy+22,'0.5\nEven chance','#888',10,'middle'));o.push(T(cx+w/2,cy+22,'1\nCertain','#888',10,'middle'));
  return o;}
function dQ1(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,24,'The Probability Scale','#C0272D',17,'middle',true));
  o.push.apply(o,probScale(240,110,320));
  if(p>=1){o.push(C(240-160+0.1*320,110,6,'#C0272D','#C0272D',1));o.push(T(240-160+0.1*320,150,'unlikely','#C0272D',11,'middle'));}
  if(p>=2){o.push(C(240,110,6,'#1a5a8a','#1a5a8a',1));o.push(T(240,150,'even chance','#1a5a8a',11,'middle'));}
  if(p>=3){o.push(C(240-160+0.9*320,110,6,'#1a7a3a','#1a7a3a',1));o.push(T(240-160+0.9*320,150,'likely','#1a7a3a',11,'middle'));}
  if(p>=4)o.push(T(240,200,'Probability is always between 0 and 1 (or 0% and 100%)','#888',12,'middle'));
  s.innerHTML=o.join('');
}
function dQ2(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Outcomes of rolling a die and flipping a coin','#C0272D',14,'middle',true));
  var coins=['H','T'],dice=[1,2,3,4,5,6];
  if(p>=0){o.push(T(140,50,'Coin','#1a5a8a',12,'middle',true));o.push(T(340,50,'Die','#C0272D',12,'middle',true));}
  if(p>=1){coins.forEach(function(c,i){o.push(R(100+i*80,64,60,30,'#e8f4ff','#1a5a8a',1.5));o.push(T(130+i*80,84,c,'#1a5a8a',14,'middle'));});}
  if(p>=2){dice.forEach(function(d,i){o.push(R(230+i*36,64,32,30,'#fff5f0','#C0272D',1.5));o.push(T(246+i*36,84,d,'#C0272D',13,'middle'));});}
  if(p>=3)o.push(T(240,140,'Total outcomes = 2 \u00d7 6 = 12 (systematic list)','#1a7a3a',13,'middle',true));
  s.innerHTML=o.join('');
}
function dQ3(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,22,'P(rolling a 5) on a fair die','#C0272D',16,'middle',true));
  for(var i=1;i<=6;i++){o.push(R(60+(i-1)*60,60,50,50,i===5?'#e8f8ee':'#fff5f0',i===5?'#1a7a3a':'#C0272D',2));o.push(T(85+(i-1)*60,90,i,i===5?'#1a7a3a':'#C0272D',18,'middle',true));}
  if(p>=1)o.push(T(240,140,'6 equally likely outcomes, 1 is a 5','#241A17',13,'middle'));
  if(p>=2){o.push(R(160,160,160,32,'#e8f8ee','#1a7a3a',2));o.push(T(240,182,'P(5) = 1/6','#1a7a3a',17,'middle',true));}
  s.innerHTML=o.join('');
}
function dQ4(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Flip a coin 20 times: 12 heads, 8 tails','#C0272D',14,'middle',true));
  o.push(R(100,50,120,120,'#e8f4ff','#1a5a8a',2));o.push(T(160,60,'Heads: 12','#1a5a8a',12,'middle',true));
  for(var i=0;i<12;i++){o.push(C(115+(i%6)*18,80+Math.floor(i/6)*20,7,'#1a5a8a','#1a5a8a',1));}
  o.push(R(260,50,120,120,'#fff5f0','#C0272D',2));o.push(T(320,60,'Tails: 8','#C0272D',12,'middle',true));
  for(var i=0;i<8;i++){o.push(C(275+(i%6)*18,80+Math.floor(i/6)*20,7,'#C0272D','#C0272D',1));}
  if(p>=1){o.push(R(120,190,240,32,'#e8f8ee','#1a7a3a',2));o.push(T(240,212,'Experimental P(Heads) = 12/20 = 0.6','#1a7a3a',14,'middle',true));}
  s.innerHTML=o.join('');
}
function dQ5(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Theoretical vs Experimental','#C0272D',16,'middle',true));
  o.push(R(80,50,150,80,'#e8f4ff','#1a5a8a',2));o.push(T(155,72,'Theoretical','#1a5a8a',13,'middle',true));o.push(T(155,96,'P(H) = 0.5','#1a5a8a',15,'middle'));o.push(T(155,116,'(from equally likely)','#888',10,'middle'));
  o.push(R(250,50,150,80,'#fff5f0','#C0272D',2));o.push(T(325,72,'Experimental','#C0272D',13,'middle',true));o.push(T(325,96,'P(H) = 0.6','#C0272D',15,'middle'));o.push(T(325,116,'(from real results)','#888',10,'middle'));
  if(p>=1)o.push(T(240,160,'More trials \u2192 experimental gets closer to theoretical','#1a7a3a',13,'middle'));
  if(p>=2)o.push(T(240,185,'This is the "Law of Large Numbers"','#888',12,'middle'));
  s.innerHTML=o.join('');
}
function dQ6(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'A spinner is tested 50 times:','#C0272D',14,'middle',true));
  var res=[['Red',18],['Blue',20],['Green',12]];
  res.forEach(function(r,i){o.push(R(80+i*130,50,100,i===1?70:50,i===1?'#e8f4ff':'#fff5f0',i===1?'#1a5a8a':'#C0272D',2));o.push(T(130+i*130,i===1?90:75,r[0]+': '+r[1],i===1?'#1a5a8a':'#C0272D',12,'middle',true));});
  if(p>=1)o.push(T(240,150,'Total spins = 18+20+12 = 50','#241A17',13,'middle'));
  if(p>=2){o.push(R(120,170,240,32,'#e8f8ee','#1a7a3a',2));o.push(T(240,192,'P(Blue) = 20/50 = 0.4','#1a7a3a',15,'middle',true));}
  s.innerHTML=o.join('');
}
function dQ7(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'Two-Way Table: Left/Right-handed, Boy/Girl','#C0272D',13,'middle',true));
  var headers=['','Boy','Girl','Total'];var rows=[['Left',3,5,8],['Right',12,10,22],['Total',15,15,30]];
  headers.forEach(function(h,i){o.push(R(60+i*100,50,100,30,'#fce8d8','#C0272D',1.5));o.push(T(110+i*100,70,h,'#C0272D',12,'middle',true));});
  rows.forEach(function(r,ri){r.forEach(function(c,ci){o.push(R(60+ci*100,80+ri*32,100,32,ri===2||ci===3?'#e8f8ee':'#fff','#1a5a8a',1));o.push(T(110+ci*100,101+ri*32,c,'#241A17',12,'middle'));});});
  if(p>=1)o.push(T(240,200,'P(Left-handed) = 8/30','#1a7a3a',14,'middle',true));
  s.innerHTML=o.join('');
}
function dQ8(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,22,'Mutually Exclusive Events','#C0272D',17,'middle',true));
  o.push(C(160,120,60,'#fce8d8','#C0272D',2));o.push(T(160,120,'A','#C0272D',18,'middle',true));
  o.push(C(320,120,60,'#e8f4ff','#1a5a8a',2));o.push(T(320,120,'not A','#1a5a8a',15,'middle',true));
  if(p>=1)o.push(T(240,40,'A and "not A" never overlap','#888',12,'middle'));
  if(p>=2){o.push(R(120,195,240,32,'#e8f8ee','#1a7a3a',2));o.push(T(240,217,'P(A) + P(not A) = 1','#1a7a3a',16,'middle',true));}
  s.innerHTML=o.join('');
}
function dQ9(p){
  var s=g();s.setAttribute('viewBox','0 0 480 260');var o=[];
  o.push(T(240,20,'A bag has 4 red, 3 blue, 5 green counters.','#C0272D',13,'middle',true));
  var cnt=[['red',4,'#C0272D'],['blue',3,'#1a5a8a'],['green',5,'#1a7a3a']];var x=90;
  cnt.forEach(function(c){for(var i=0;i<c[1];i++){o.push(C(x+(i%4)*22,70+Math.floor(i/4)*22,9,c[2],c[2],1));}x+=110;});
