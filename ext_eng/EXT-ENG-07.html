<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extended Vocabulary — Nuance & Connotation — Extension English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .yt-q { font-weight:600; margin-bottom:14px; line-height:1.5; }
  .opt-list { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; background:#fff; border:2px solid #ddd; padding:12px 14px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .opt-btn:hover { border-color:var(--red); }
  .opt-btn.correct { background:#e8f7ee; border-color:#1b7d3a; color:#1b7d3a; font-weight:600; }
  .opt-btn.wrong { background:#fdecec; border-color:var(--red); color:var(--red); }
  .opt-btn:disabled { cursor:default; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Extension English: Extended Vocabulary — Nuance & Connotation</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is nuance?", "teach": ["Nuance refers to subtle differences in meaning between words that seem similar on the surface.", "Example: 'thin', 'slender', and 'skinny' all describe a similar body type, but each carries a different feeling.", "Recognising nuance helps you choose exactly the right word for the effect you want."]}, {"title": "Connotation vs denotation", "teach": ["Denotation is a word's literal dictionary meaning; connotation is the feeling or association it carries beyond that.", "Example: 'home' and 'house' both denote a place someone lives, but 'home' connotes warmth and belonging.", "Writers choose words carefully based on connotation, not just literal meaning."]}, {"title": "Positive and negative connotations", "teach": ["Many words describing similar ideas carry either positive or negative connotations, shaping how the reader feels about the subject.", "Example: 'assertive' (positive) vs 'aggressive' (negative) can describe similar behaviour, but create very different impressions.", "Consider whether a writer's word choice makes you feel favourably or unfavourably toward the subject."]}, {"title": "Choosing precise vocabulary over vague words", "teach": ["Precise, specific vocabulary creates a clearer, more vivid picture than vague, general words.", "Example: 'she walked' is vague; 'she trudged' or 'she sprinted' each paint a much clearer, more specific picture.", "When editing writing, replace vague verbs and adjectives with more precise, specific alternatives."]}, {"title": "Formal vs informal vocabulary", "teach": ["Formal vocabulary is used in academic, professional, or serious contexts; informal vocabulary is used in casual, everyday speech.", "Example: 'commence' (formal) vs 'start' (informal) — both mean the same thing, but suit different contexts.", "Match your vocabulary level to the purpose and audience of your writing."]}, {"title": "Vocabulary that reveals a writer's attitude", "teach": ["Word choice can reveal a writer's underlying attitude toward their subject, even without stating it directly.", "Example: calling a policy 'controversial' rather than simply 'new' hints that the writer expects disagreement or debate.", "Look for adjectives especially — they often carry the strongest signals of a writer's attitude."]}, {"title": "Using a thesaurus effectively", "teach": ["A thesaurus offers alternative words, but not all synonyms carry exactly the same connotation — always check the word truly fits.", "Example: 'thrifty' and 'stingy' both relate to spending little money, but 'thrifty' is positive while 'stingy' is negative.", "Never just pick the first synonym you find — check it matches the tone and meaning you actually intend."]}, {"title": "Connotation in political and media language", "teach": ["Political and media writing often uses carefully chosen words with strong connotations to shape public opinion.", "Example: calling a group 'protesters' vs 'rioters' creates very different impressions of the same event.", "Being aware of this helps you read news and opinion pieces more critically."]}, {"title": "Building your own vocabulary bank", "teach": ["Actively collecting and using new, precise vocabulary (rather than relying on the same common words) strengthens your own writing.", "Example: keeping a running list of strong verbs and adjectives you encounter while reading helps expand your active vocabulary over time.", "Regularly reviewing and trying to use new words in your own writing helps make them stick."]}, {"title": "Mixed practice — nuance and connotation", "teach": ["You've now covered nuance, connotation vs denotation, positive/negative connotations, precision, formality, and media language.", "This sensitivity to word choice is exactly what separates strong analytical writing from more basic responses.", "This final question brings a couple of these ideas together."]}];

function ytGen_0() {
  return { q: "Which word feels most positive: thin, slender, or skinny?", options: ["thin", "slender", "skinny", "All feel equally positive"], correct: 1 };
}
function ytGen_1() {
  return { q: "Which word has warmer connotations: \"house\" or \"home\"?", options: ["house", "home", "Both are equally warm", "Neither has connotation"], correct: 1 };
}
function ytGen_2() {
  return { q: "Does \"assertive\" have a positive or negative connotation compared to \"aggressive\"?", options: ["Positive", "Negative", "Exactly the same", "No connotation at all"], correct: 0 };
}
function ytGen_3() {
  return { q: "Which is more precise: \"walked\" or \"trudged\"?", options: ["walked", "trudged", "Both are equally precise", "Neither is precise"], correct: 1 };
}
function ytGen_4() {
  return { q: "Which is more formal: \"commence\" or \"start\"?", options: ["commence", "start", "Both are equally formal", "Neither is formal"], correct: 0 };
}
function ytGen_5() {
  return { q: "What does calling a policy \"controversial\" (rather than just \"new\") suggest about the writer's attitude?", options: ["Complete approval", "Expects disagreement or debate", "No particular attitude", "Total indifference"], correct: 1 };
}
function ytGen_6() {
  return { q: "Which word is more positive: \"thrifty\" or \"stingy\"?", options: ["thrifty", "stingy", "Both are equally positive", "Neither has connotation"], correct: 0 };
}
function ytGen_7() {
  return { q: "Does \"rioters\" or \"protesters\" create a more negative impression?", options: ["rioters", "protesters", "Both are equally negative", "Neither is negative"], correct: 0 };
}
function ytGen_8() {
  return { q: "What is one effective way to build your own vocabulary over time?", options: ["Avoiding new or unfamiliar words", "Keeping a vocabulary list from reading", "Only using the same ten words", "Ignoring word meanings"], correct: 1 };
}
function ytGen_9() {
  return { q: "Which word has a more negative connotation: \"curious\" or \"nosy\"?", options: ["curious", "nosy", "Both are equally negative", "Neither has connotation"], correct: 1 };
}
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function shuffle(optionsWithCorrect) {
  const opts = optionsWithCorrect.options.map((text, i) => ({text, isCorrect: i === optionsWithCorrect.correct}));
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return opts;
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    const raw = YT_GENS[qIdx]();
    currentYT = { q: raw.q, opts: shuffle(raw) };
    const optsHtml = currentYT.opts.map((o, i) =>
      `<button class="opt-btn" data-idx="${i}" onclick="checkYT(${i})">${o.text}</button>`
    ).join('');
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div class="yt-q">${currentYT.q}</div>
        <div class="opt-list" id="optList">${optsHtml}</div>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT(idx) {
  const fb = document.getElementById('ytFeedback');
  const buttons = document.querySelectorAll('#optList .opt-btn');
  buttons.forEach(b => b.disabled = true);
  const chosen = currentYT.opts[idx];
  if (chosen.isCorrect) {
    buttons[idx].classList.add('correct');
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    buttons[idx].classList.add('wrong');
    const correctIdx = currentYT.opts.findIndex(o => o.isCorrect);
    buttons[correctIdx].classList.add('correct');
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted.</div>';
    document.getElementById('nextBtn').disabled = false;
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'EXT-ENG-07';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
    if (!topicRow) return;
    const { data: profRow } = await supabase.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
    if (!profRow) return;
    await supabase.from('walkthrough_interactions').insert({
      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
</script>
</body>
</html>
