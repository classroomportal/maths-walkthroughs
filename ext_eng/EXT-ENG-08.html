<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structuring an Extended Response / Essay — Extension English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .yt-q { font-weight:600; margin-bottom:14px; line-height:1.5; }
  .opt-list { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; background:#fff; border:2px solid #ddd; padding:12px 14px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .opt-btn:hover { border-color:var(--red); }
  .opt-btn.correct { background:#e8f7ee; border-color:#1b7d3a; color:#1b7d3a; font-weight:600; }
  .opt-btn.wrong { background:#fdecec; border-color:var(--red); color:var(--red); }
  .opt-btn:disabled { cursor:default; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Extension English: Structuring an Extended Response</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is an extended response?", "teach": ["An extended response is a longer, structured piece of writing — usually an essay — that develops an argument or analysis in depth across several paragraphs.", "Unlike a short answer, it requires a clear introduction, developed body paragraphs, and a conclusion.", "Planning the structure before writing saves time and produces a much stronger final piece."]}, {"title": "Writing a strong introduction", "teach": ["A strong introduction states your overall argument or position clearly, giving the reader a preview of what's to come.", "Example: 'This essay will argue that social media has a predominantly negative effect on teenage mental health, examining three key areas of concern.'", "Avoid vague openings like 'In this essay I will talk about...' — be direct and specific instead."]}, {"title": "Structuring body paragraphs — PEEL", "teach": ["Each body paragraph should make one clear point, support it with evidence, explain the significance, then link back to the main argument.", "This is the same PEEL structure (Point, Evidence, Explain, Link) used in debate — it works equally well in essay writing.", "Keeping one main idea per paragraph makes your essay much easier for the reader to follow."]}, {"title": "Using topic sentences to guide the reader", "teach": ["Each body paragraph should open with a topic sentence that clearly states its main point.", "Example: 'One significant concern is the impact of social media on sleep patterns.' — tells the reader immediately what this paragraph covers.", "A reader should be able to understand your whole essay's structure just by reading the topic sentences alone."]}, {"title": "Using linking words between paragraphs", "teach": ["Linking words and phrases (furthermore, however, in contrast, similarly) help connect ideas smoothly between paragraphs.", "Example: 'Furthermore, research shows...' signals you're adding another supporting point.", "Good linking words make an essay feel connected and logically organised, rather than like a list of separate points."]}, {"title": "Addressing counter-arguments in an essay", "teach": ["Strong essays acknowledge opposing viewpoints before explaining why your own argument remains stronger.", "Example: 'Some may argue that social media connects people globally; however, the evidence suggests the negative effects outweigh this benefit.'", "This makes your essay feel balanced and thoroughly considered, rather than one-sided."]}, {"title": "Using evidence to support each point", "teach": ["Every point in an essay should be backed up with specific evidence — statistics, examples, or expert opinion — not just left as an unsupported claim.", "Example: 'Social media use is linked to poorer sleep (Smith, 2023)' is stronger than simply 'social media affects sleep'.", "Unsupported claims are much easier for an examiner or reader to dismiss."]}, {"title": "Writing a strong conclusion", "teach": ["A strong conclusion summarises the key points made and restates the overall argument, without simply repeating the introduction word-for-word.", "Example: 'In summary, the evidence across sleep, mental health, and social comparison strongly supports the view that social media harms teenage wellbeing.'", "Avoid introducing completely new points in the conclusion — it should summarise what's already been argued."]}, {"title": "Maintaining a consistent argument throughout", "teach": ["A strong essay maintains the same overall position consistently from introduction to conclusion, rather than contradicting itself partway through.", "Example: if your introduction argues social media is harmful, your body paragraphs shouldn't suddenly argue it's mostly beneficial without explanation.", "Read back through your own essay to check every paragraph supports your stated argument."]}, {"title": "Mixed practice — essay structure", "teach": ["You've now covered introductions, PEEL body paragraphs, topic sentences, linking words, counter-arguments, evidence, conclusions, and consistency.", "Planning this structure before writing — even just a quick outline — makes a huge difference to the quality of an extended response.", "This final question brings a couple of these structural ideas together."]}];

function ytGen_0() {
  return { q: "What three main sections does an extended response usually have?", options: ["Title, quote, summary", "Introduction, body, conclusion", "Question, answer, footnote", "Opening joke, story, moral"], correct: 1 };
}
function ytGen_1() {
  return { q: "A) This essay will argue that social media harms teen mental health, examining three key concerns. B) In this essay I will talk about social media. Which is stronger?", options: ["A", "B", "Both are equally strong", "Neither is a valid introduction"], correct: 0 };
}
function ytGen_2() {
  return { q: "What does the \"L\" in PEEL stand for?", options: ["Length", "List", "Link", "Language"], correct: 2 };
}
function ytGen_3() {
  return { q: "What should a reader be able to understand just from reading all the topic sentences in an essay?", options: ["The exact word count", "The overall structure or argument", "The author's age", "Nothing useful at all"], correct: 1 };
}
function ytGen_4() {
  return { q: "Which linking word signals adding another similar point: \"furthermore\" or \"however\"?", options: ["furthermore", "however", "Both signal the same thing", "Neither is a linking word"], correct: 0 };
}
function ytGen_5() {
  return { q: "What should you do with an opposing viewpoint in a strong essay?", options: ["Always ignore it completely", "Acknowledge it and explain why your argument is stronger", "Agree with it instead", "Never mention any other viewpoint"], correct: 1 };
}
function ytGen_6() {
  return { q: "Why should every point in an essay be backed up with evidence?", options: ["It isn't necessary", "To make the argument more convincing", "Only to increase word count", "Evidence is only for science essays"], correct: 1 };
}
function ytGen_7() {
  return { q: "Should a conclusion introduce brand new points, or summarise what's already been argued?", options: ["Introduce brand new points", "Summarise what's already been argued", "Repeat the introduction word for word", "Ask the reader a question and stop"], correct: 1 };
}
function ytGen_8() {
  return { q: "Why is it important to maintain a consistent argument throughout an essay?", options: ["To avoid contradicting yourself", "Consistency doesn't matter in essays", "To make the essay longer", "To confuse the reader on purpose"], correct: 0 };
}
function ytGen_9() {
  return { q: "What should the very first sentence of a body paragraph usually be called?", options: ["A conclusion sentence", "A topic sentence", "A rhetorical question", "A quotation only"], correct: 1 };
}
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function shuffle(optionsWithCorrect) {
  const opts = optionsWithCorrect.options.map((text, i) => ({text, isCorrect: i === optionsWithCorrect.correct}));
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return opts;
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    const raw = YT_GENS[qIdx]();
    currentYT = { q: raw.q, opts: shuffle(raw) };
    const optsHtml = currentYT.opts.map((o, i) =>
      `<button class="opt-btn" data-idx="${i}" onclick="checkYT(${i})">${o.text}</button>`
    ).join('');
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div class="yt-q">${currentYT.q}</div>
        <div class="opt-list" id="optList">${optsHtml}</div>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT(idx) {
  const fb = document.getElementById('ytFeedback');
  const buttons = document.querySelectorAll('#optList .opt-btn');
  buttons.forEach(b => b.disabled = true);
  const chosen = currentYT.opts[idx];
  if (chosen.isCorrect) {
    buttons[idx].classList.add('correct');
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    buttons[idx].classList.add('wrong');
    const correctIdx = currentYT.opts.findIndex(o => o.isCorrect);
    buttons[correctIdx].classList.add('correct');
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted.</div>';
    document.getElementById('nextBtn').disabled = false;
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'EXT-ENG-08';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
    if (!topicRow) return;
    const { data: profRow } = await supabase.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
    if (!profRow) return;
    await supabase.from('walkthrough_interactions').insert({
      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
</script>
</body>
