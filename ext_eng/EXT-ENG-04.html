<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argument & Persuasive Writing Techniques — Extension English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .yt-q { font-weight:600; margin-bottom:14px; line-height:1.5; }
  .opt-list { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; background:#fff; border:2px solid #ddd; padding:12px 14px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .opt-btn:hover { border-color:var(--red); }
  .opt-btn.correct { background:#e8f7ee; border-color:#1b7d3a; color:#1b7d3a; font-weight:600; }
  .opt-btn.wrong { background:#fdecec; border-color:var(--red); color:var(--red); }
  .opt-btn:disabled { cursor:default; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Extension English: Argument & Persuasive Writing Techniques</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is persuasive writing?", "teach": ["Persuasive writing aims to convince the reader to agree with a particular viewpoint or take a specific action.", "Example: an advert, a campaign speech, or an opinion article are all forms of persuasive writing.", "Effective persuasive writing uses specific techniques deliberately, not just strong opinions alone."]}, {"title": "Using rhetorical questions to persuade", "teach": ["Rhetorical questions make the reader think and often imply an obvious answer that supports the writer's argument.", "Example: 'Do we really want to leave this problem for future generations?' implies the obvious answer is no.", "This technique engages the reader more actively than a simple statement would."]}, {"title": "Using the rule of three in persuasion", "teach": ["Listing three points together creates a memorable, rhythmic argument.", "Example: 'We need action, we need change, we need it now' — three short, punchy statements building urgency.", "This technique is common in speeches and campaign writing."]}, {"title": "Using statistics and facts to persuade", "teach": ["Including specific facts or statistics makes an argument feel more credible and evidence-based.", "Example: 'Over 60% of students reported feeling stressed' is more convincing than simply saying 'lots of students are stressed'.", "Specific numbers carry more persuasive weight than vague generalisations."]}, {"title": "Using emotive language", "teach": ["Emotive language deliberately triggers an emotional reaction in the reader, strengthening the persuasive effect.", "Example: 'innocent children are suffering' is more emotionally charged than 'children are affected'.", "Emotive language is powerful, but should be used carefully — overuse can feel manipulative to the reader."]}, {"title": "Anticipating counter-arguments", "teach": ["Strong persuasive writing acknowledges the opposing viewpoint before explaining why it's less convincing.", "Example: 'Some may argue that costs are too high, but the long-term benefits far outweigh this concern.'", "This technique makes an argument feel more balanced and considered, which can increase its persuasive power."]}, {"title": "Using a direct address to the reader", "teach": ["Speaking directly to the reader (using 'you') creates a personal connection and makes the argument feel more immediate.", "Example: 'You have the power to make a difference today' feels more direct and personal than a general statement.", "This technique is common in campaign and charity appeal writing."]}, {"title": "Structuring a persuasive argument", "teach": ["A strong persuasive piece usually opens with a clear position, develops supporting points, and ends with a powerful conclusion or call to action.", "Example: opening line stating the issue, then evidence, then a final call for the reader to act.", "Planning this structure before writing helps keep the argument focused and building toward a clear point."]}, {"title": "Balancing logic and emotion", "teach": ["The strongest persuasive writing balances logical evidence (facts, statistics) with emotional appeal (emotive language, personal stories).", "Example: combining a statistic about poverty with a specific, personal story makes both the head and heart engage with the argument.", "Relying only on one or the other usually makes an argument less convincing overall."]}, {"title": "Mixed practice — persuasive techniques", "teach": ["You've now covered rhetorical questions, the rule of three, statistics, emotive language, counter-arguments, direct address, structure, and balancing logic with emotion.", "Combining several of these techniques deliberately makes persuasive writing far more effective than relying on just one.", "This final question checks you can identify a persuasive technique confidently."]}];

function ytGen_0() {
  return { q: "What is the main goal of persuasive writing?", options: ["To entertain the reader", "To convince the reader", "To simply inform the reader", "To confuse the reader"], correct: 1 };
}
function ytGen_1() {
  return { q: "What effect does a rhetorical question have on the reader?", options: ["It requires no thought at all", "It makes them think and often implies an answer", "It always confuses the reader", "It has no real effect"], correct: 1 };
}
function ytGen_2() {
  return { q: "\"We need action, we need change, we need it now.\" What technique is being used?", options: ["Rule of three", "Simile", "Onomatopoeia", "Flashback"], correct: 0 };
}
function ytGen_3() {
  return { q: "A) Over 60% of students reported feeling stressed. B) Lots of students are stressed. Which is more persuasive?", options: ["A", "B", "Both are equally persuasive", "Neither is persuasive"], correct: 0 };
}
function ytGen_4() {
  return { q: "A) Innocent children are suffering. B) Children are affected. Which is more emotive?", options: ["A", "B", "Both are equally emotive", "Neither is emotive"], correct: 0 };
}
function ytGen_5() {
  return { q: "What is it called when a writer acknowledges an opposing view before countering it?", options: ["A call to action", "A counter-argument", "A rule of three", "A rhetorical question"], correct: 1 };
}
function ytGen_6() {
  return { q: "What effect does directly addressing the reader as \"you\" create?", options: ["Distance from the reader", "A personal connection", "Confusion", "Formality only"], correct: 1 };
}
function ytGen_7() {
  return { q: "What usually comes at the very end of a persuasive piece, encouraging the reader to act?", options: ["A rhetorical question", "A statistic", "A call to action", "A counter-argument"], correct: 2 };
}
function ytGen_8() {
  return { q: "What are the two main elements a strong persuasive argument should balance?", options: ["Length and formality", "Logic and emotion", "Speed and volume", "Humour and sarcasm"], correct: 1 };
}
function ytGen_9() {
  return { q: "\"Isn't it time we finally took action?\" What technique is being used?", options: ["Rhetorical question", "Rule of three", "Onomatopoeia", "Flashback"], correct: 0 };
}
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function shuffle(optionsWithCorrect) {
  const opts = optionsWithCorrect.options.map((text, i) => ({text, isCorrect: i === optionsWithCorrect.correct}));
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return opts;
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    const raw = YT_GENS[qIdx]();
    currentYT = { q: raw.q, opts: shuffle(raw) };
    const optsHtml = currentYT.opts.map((o, i) =>
      `<button class="opt-btn" data-idx="${i}" onclick="checkYT(${i})">${o.text}</button>`
    ).join('');
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div class="yt-q">${currentYT.q}</div>
        <div class="opt-list" id="optList">${optsHtml}</div>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT(idx) {
  const fb = document.getElementById('ytFeedback');
  const buttons = document.querySelectorAll('#optList .opt-btn');
  buttons.forEach(b => b.disabled = true);
  const chosen = currentYT.opts[idx];
  if (chosen.isCorrect) {
    buttons[idx].classList.add('correct');
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    buttons[idx].classList.add('wrong');
    const correctIdx = currentYT.opts.findIndex(o => o.isCorrect);
    buttons[correctIdx].classList.add('correct');
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted.</div>';
    document.getElementById('nextBtn').disabled = false;
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'EXT-ENG-04';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
    if (!topicRow) return;
    const { data: profRow } = await supabase.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
    if (!profRow) return;
    await supabase.from('walkthrough_interactions').insert({
      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
</script>
</body>
</html>
