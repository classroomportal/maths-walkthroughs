<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writer's Use of Language — Identifying Techniques & Effect — Extension English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:10px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.6; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .yt-q { font-weight:600; margin-bottom:14px; line-height:1.5; }
  .opt-list { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; background:#fff; border:2px solid #ddd; padding:12px 14px; border-radius:8px; font-size:1rem; cursor:pointer; }
  .opt-btn:hover { border-color:var(--red); }
  .opt-btn.correct { background:#e8f7ee; border-color:#1b7d3a; color:#1b7d3a; font-weight:600; }
  .opt-btn.wrong { background:#fdecec; border-color:var(--red); color:var(--red); }
  .opt-btn:disabled { cursor:default; }
  .try-fb { margin-top:10px; font-weight:600; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Extension English: Writer's Use of Language</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Simile", "teach": ["A simile compares two things using 'like' or 'as', creating a vivid image for the reader.", "Example: 'The waves crashed like thunder' compares the sound of waves to thunder.", "Always explain what the comparison suggests, not just that a simile is present."]}, {"title": "Metaphor", "teach": ["A metaphor states one thing IS another, without using 'like' or 'as' — a more direct comparison than a simile.", "Example: 'The classroom was a zoo' suggests chaos and noise, without literally meaning it was a zoo.", "Metaphors often feel more intense or direct than similes."]}, {"title": "Personification", "teach": ["Personification gives human qualities or actions to non-human things or ideas.", "Example: 'The wind whispered through the trees' gives the wind a human ability (whispering).", "This technique often creates atmosphere or brings a scene to life."]}, {"title": "Alliteration", "teach": ["Alliteration repeats the same starting sound across several nearby words, creating a rhythmic or emphatic effect.", "Example: 'the silent, slithering snake' repeats the 's' sound.", "This technique draws attention to the words and can create a specific mood, like tension or playfulness."]}, {"title": "Onomatopoeia", "teach": ["Onomatopoeia uses words that imitate the actual sound they describe.", "Example: 'the bacon sizzled' — 'sizzled' sounds like the noise bacon actually makes.", "This technique makes writing feel more vivid and immediate by directly representing sound."]}, {"title": "Hyperbole", "teach": ["Hyperbole is deliberate exaggeration, used for emphasis or humour, not meant to be taken literally.", "Example: 'I've told you a million times' — obviously not literally a million, but emphasises frustration.", "This technique is common in everyday speech as well as creative writing."]}, {"title": "Repetition for emphasis", "teach": ["Repeating a word or phrase deliberately emphasises its importance or creates a rhythmic effect.", "Example: 'Never, never, never give up' emphasises determination through repetition.", "Consider what specific idea or feeling the repeated word or phrase is drawing attention to."]}, {"title": "Rhetorical questions", "teach": ["A rhetorical question is asked for effect, not to get a literal answer — it makes the reader think or agree with a point.", "Example: 'How much longer must we wait?' isn't really asking for a number, but expressing frustration.", "Rhetorical questions are common in persuasive writing and speeches."]}, {"title": "Identifying the effect, not just the technique", "teach": ["In exams, naming a technique alone isn't enough — you must also explain its effect on the reader.", "Example: 'the alliteration of \"silent, slithering snake\" creates an unsettling, sinister atmosphere' — technique PLUS effect.", "Always link the technique back to how it makes the reader feel or think."]}, {"title": "Mixed practice — identifying language techniques", "teach": ["You've now covered simile, metaphor, personification, alliteration, onomatopoeia, hyperbole, repetition, and rhetorical questions.", "Being able to spot these techniques quickly — and explain their effect — is essential for language analysis questions.", "This final question checks you can identify the correct technique confidently."]}];

function ytGen_0() {
  return { q: "\"Her eyes were like diamonds, sharp and bright.\" What technique is used here?", options: ["Simile", "Metaphor", "Onomatopoeia", "Hyperbole"], correct: 0 };
}
function ytGen_1() {
  return { q: "\"The classroom was a zoo.\" What technique is used here?", options: ["Simile", "Metaphor", "Alliteration", "Rhetorical question"], correct: 1 };
}
function ytGen_2() {
  return { q: "\"The wind whispered through the trees.\" What technique is used here?", options: ["Onomatopoeia", "Hyperbole", "Personification", "Repetition"], correct: 2 };
}
function ytGen_3() {
  return { q: "\"the silent, slithering snake\" \u2014 what technique is used here?", options: ["Alliteration", "Simile", "Metaphor", "Rhetorical question"], correct: 0 };
}
function ytGen_4() {
  return { q: "\"the bacon sizzled in the pan\" \u2014 what technique is used here?", options: ["Personification", "Onomatopoeia", "Hyperbole", "Alliteration"], correct: 1 };
}
function ytGen_5() {
  return { q: "\"I've told you a million times to tidy your room.\" What technique is used here?", options: ["Hyperbole", "Simile", "Onomatopoeia", "Personification"], correct: 0 };
}
function ytGen_6() {
  return { q: "\"Never, never, never give up.\" What technique is used here?", options: ["Metaphor", "Repetition", "Onomatopoeia", "Simile"], correct: 1 };
}
function ytGen_7() {
  return { q: "\"How much longer must we wait for change?\" What technique is used here?", options: ["Rhetorical question", "Alliteration", "Hyperbole", "Personification"], correct: 0 };
}
function ytGen_8() {
  return { q: "\"the silent, slithering snake\" \u2014 what effect does this alliteration create?", options: ["A cheerful, upbeat mood", "An unsettling or sinister atmosphere", "A sense of calm and safety", "No particular effect"], correct: 1 };
}
function ytGen_9() {
  return { q: "\"The city never sleeps.\" What technique is used here?", options: ["Simile", "Onomatopoeia", "Personification", "Rule of three"], correct: 2 };
}
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;

function shuffle(optionsWithCorrect) {
  const opts = optionsWithCorrect.options.map((text, i) => ({text, isCorrect: i === optionsWithCorrect.correct}));
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return opts;
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    const raw = YT_GENS[qIdx]();
    currentYT = { q: raw.q, opts: shuffle(raw) };
    const optsHtml = currentYT.opts.map((o, i) =>
      `<button class="opt-btn" data-idx="${i}" onclick="checkYT(${i})">${o.text}</button>`
    ).join('');
    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div class="yt-q">${currentYT.q}</div>
        <div class="opt-list" id="optList">${optsHtml}</div>
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function checkYT(idx) {
  const fb = document.getElementById('ytFeedback');
  const buttons = document.querySelectorAll('#optList .opt-btn');
  buttons.forEach(b => b.disabled = true);
  const chosen = currentYT.opts[idx];
  if (chosen.isCorrect) {
    buttons[idx].classList.add('correct');
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
    document.getElementById('nextBtn').disabled = false;
  } else {
    buttons[idx].classList.add('wrong');
    const correctIdx = currentYT.opts.findIndex(o => o.isCorrect);
    buttons[correctIdx].classList.add('correct');
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted.</div>';
    document.getElementById('nextBtn').disabled = false;
  }
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

render();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'EXT-ENG-02';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();
    if (!topicRow) return;
    const { data: profRow } = await supabase.from('profiles').select('school_id').eq('id', session.user.id).maybeSingle();
    if (!profRow) return;
    await supabase.from('walkthrough_interactions').insert({
      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
</script>
</body>
</html>
