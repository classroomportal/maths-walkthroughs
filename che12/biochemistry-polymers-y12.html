<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}

.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Major Biomolecules',[['Biomolecule','Building block','Example'],['Carbohydrates','Simple sugars','Starch, glucose'],['Proteins','Amino acids','Enzymes, muscle'],['Fats/lipids','Fatty acids + glycerol','Vegetable oil, butter']]);}
function dQ2(p){drawTable(p,'Testing for Biomolecules',[['Test','Positive result'],['Iodine test (starch)','Blue-black colour'],['Benedict\u2019s test (reducing sugar)','Blue \u2192 brick-red precipitate'],['Biuret test (protein)','Blue \u2192 purple/lilac']]);}
function dQ3(p){drawTable(p,'Addition vs Condensation Polymerisation',[['Type','Monomers','By-product'],['Addition','Alkenes (C=C)','None, 100% atom economy'],['Condensation','Two different monomers','Small molecule (often water)']]);}
function dQ4(p){drawTable(p,'Common Synthetic Polymers',[['Polymer','Monomer','Use'],['Poly(ethene)','Ethene','Plastic bags'],['PVC','Chloroethene','Pipes, cables'],['Polystyrene','Styrene','Packaging, insulation']]);}
function dQ5(p){drawTable(p,'Natural vs Synthetic Polymers',[['Type','Examples'],['Natural','Proteins, starch, cellulose, DNA'],['Synthetic','Poly(ethene), nylon, PVC']]);}
function dQ6(p){drawTable(p,'WAEC Biochemistry/Polymers Summary',[['Concept','Key point'],['Carbohydrates','Energy source, made of sugar units'],['Polymers','Long chains of repeating monomer units'],['Addition polymer','From alkenes, no by-product']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Carbohydrates, Proteins and Fats',su:'Examine the structure and role of the major classes of biomolecules.',steps:[
{lb:'Carbohydrates',dr:dQ1,ht:'<p><b>Carbohydrates</b> are made of carbon, hydrogen and oxygen, built from simple sugar units. Simple sugars (monosaccharides, e.g. glucose) can join together to form more complex carbohydrates: starch (a plant energy store, many glucose units joined) and cellulose (structural component of plant cell walls). Carbohydrates are the body\'s primary, quick-access ENERGY SOURCE.</p>'},
{lb:'Proteins',dr:dQ1,ht:'<p><b>Proteins</b> are built from AMINO ACID units joined together in long chains (via peptide bonds). Proteins have diverse roles: structural (e.g. muscle, hair, collagen), functional (e.g. ENZYMES, which catalyse biochemical reactions in the body; hormones; antibodies). The specific SEQUENCE of amino acids determines a protein\'s unique shape and function.</p>'},
{lb:'Fats and lipids',dr:dQ1,ht:'<p><b>Fats (lipids)</b> are formed from GLYCEROL combined with three FATTY ACID chains (via condensation reactions, releasing water). Fats serve as a concentrated ENERGY STORE (providing more energy per gram than carbohydrates), provide insulation, and form essential components of cell membranes.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Proteins are built from which basic building block units?',o:['Simple sugars','Amino acids, joined together in long chains','Fatty acids','Glycerol molecules'],a:2,w:'Proteins are polymers made of amino acid monomers, linked together via peptide bonds into long chains. The specific sequence of different amino acids determines the protein\'s unique structure and function.'},{q:'Which biomolecule serves as the body\'s primary, quick-access energy source?',o:['Proteins','Carbohydrates \u2014 made of sugar units, providing readily accessible energy','Fats, exclusively','DNA'],a:2,w:'Carbohydrates (particularly simple sugars like glucose) are the body\'s primary and most readily accessible energy source, broken down quickly during respiration to release usable energy.'},{q:'A fat molecule is formed by combining glycerol with:',o:['Amino acids','Simple sugars','Three fatty acid chains, via condensation reactions that release water','Only water molecules'],a:2,w:'Fats (lipids) form when glycerol combines with three fatty acid molecules through condensation reactions (each forming an ester bond and releasing a water molecule), producing a triglyceride \u2014 the typical structure of dietary fats.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Testing for Biomolecules',su:'Use standard chemical tests to identify starch, reducing sugars and proteins.',steps:[
{lb:'Testing for starch',dr:dQ2,ht:'<p>The IODINE TEST identifies starch: adding iodine solution (orange/brown) to a sample containing starch produces a BLUE-BLACK colour. If no starch is present, the iodine solution simply remains its original orange/brown colour (no colour change).</p>'},
{lb:'Testing for reducing sugars',dr:dQ2,ht:'<p>BENEDICT\'S TEST identifies reducing sugars (e.g. glucose): adding Benedict\'s solution (blue) to a sample and HEATING it. If a reducing sugar is present, a colour change progression occurs (blue \u2192 green \u2192 yellow \u2192 orange \u2192 brick-red PRECIPITATE, depending on the concentration of sugar present \u2014 more sugar gives a more advanced colour change). If no reducing sugar is present, the solution stays blue.</p>'},
{lb:'Testing for proteins',dr:dQ2,ht:'<p>The BIURET TEST identifies proteins: adding biuret reagent (or sodium hydroxide followed by dilute copper sulfate) to a sample. If protein is present, the solution changes from BLUE to PURPLE/LILAC (due to the reaction between the reagent and the peptide bonds present in proteins). If no protein is present, the solution remains blue.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Adding iodine solution to a food sample produces a blue-black colour. This confirms the presence of:',o:['Protein','Reducing sugar','Starch \u2014 the characteristic positive result of the iodine test','Fat'],a:2,w:'The iodine test is specific for starch: a blue-black colour change (from the original orange/brown iodine solution) is the standard positive result confirming starch is present in the sample.'},{q:'The Biuret test is used to identify the presence of:',o:['Starch','Reducing sugars','Protein \u2014 confirmed by a colour change from blue to purple/lilac','Fats/lipids'],a:2,w:'The Biuret test specifically detects the peptide bonds found in proteins. A positive result is shown by the solution changing colour from blue to purple/lilac when protein is present.'},{q:'Benedict\'s test for reducing sugars requires which additional step compared to the iodine test?',o:['No additional steps are needed','The sample must be HEATED with Benedict\'s solution for the colour change (blue toward brick-red precipitate) to develop','The sample must be cooled to near freezing','The sample must be dissolved in acid first'],a:2,w:'Unlike the iodine test (which works at room temperature), Benedict\'s test requires HEATING the sample with Benedict\'s solution. If a reducing sugar is present, this heating causes the characteristic colour change progression toward a brick-red precipitate.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Addition Polymerisation',su:'Examine how addition polymers form from alkene monomers.',steps:[
{lb:'What is a polymer',dr:dQ3,ht:'<p>A <b>polymer</b> is a very long chain molecule made up of many repeating smaller units called MONOMERS, joined together. <b>Addition polymerisation</b> occurs when MANY ALKENE monomers (each containing a C=C double bond) join together, with the double bonds "opening up" to form new single bonds linking the monomers into a long chain \u2014 NO other product/by-product is formed (the polymer is the ONLY product).</p>'},
{lb:'Example \u2014 poly(ethene)',dr:dQ3,ht:'<p>Ethene (CH2=CH2) monomers undergo addition polymerisation to form POLY(ETHENE) [commonly "polyethylene" or "polythene"]: many ethene molecules join, with each C=C double bond becoming a single bond linking to the next monomer, producing a long repeating chain: -CH2-CH2-CH2-CH2-... This is the plastic used in shopping bags and plastic containers.</p>'},
{lb:'Recognising monomer from polymer (and vice versa)',dr:dQ3,ht:'<p>To find the monomer from a polymer\'s repeating unit: identify the repeating -CH2-CHX- (or similar) segment, then reintroduce the C=C double bond to reveal the original alkene monomer. To find the polymer from a given monomer: remove the C=C double bond (make it single), and repeat the resulting unit many times, joining each to the next.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Addition polymerisation specifically requires monomers that contain:',o:['An -OH functional group','A C=C double bond (as found in alkenes), which opens up to form new bonds linking monomers together','A -COOH functional group','Two different functional groups'],a:2,w:'Addition polymerisation is specific to alkenes (or alkene-like monomers) containing a C=C double bond. This double bond "opens" during polymerisation, allowing each monomer to bond to the next, building up a long polymer chain.'},{q:'Why is addition polymerisation described as having 100% atom economy?',o:['Because it produces multiple different products','Because ALL the atoms present in the monomers end up in the final polymer product, with no by-products formed','Because it requires very little energy','Because the reaction never actually completes'],a:2,w:'In addition polymerisation, monomers simply join together (the double bond opening to form new single bonds) with NO atoms lost as a separate by-product \u2014 every atom from the starting monomers ends up in the final polymer chain, giving 100% atom economy.'},{q:'The repeating unit of a polymer is -CH2-CHCl-. What was the original alkene monomer used to make this polymer?',o:['Ethene (CH2=CH2)','Chloroethene (CH2=CHCl), also known as vinyl chloride \u2014 reintroducing the double bond reveals the monomer','Propene (CH3-CH=CH2)','Ethanol'],a:2,w:'To find the monomer, reintroduce the C=C double bond into the repeating unit -CH2-CHCl-, giving CH2=CHCl (chloroethene/vinyl chloride) \u2014 this is the monomer used to make PVC (polyvinyl chloride).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Condensation Polymerisation',su:'Examine how condensation polymers form, releasing a small by-product molecule.',steps:[
{lb:'What is condensation polymerisation',dr:dQ3,ht:'<p><b>Condensation polymerisation</b> occurs when monomers with TWO DIFFERENT reactive functional groups (often two different types of monomer) join together, RELEASING a small molecule (commonly WATER) as a by-product with EACH new bond formed. Unlike addition polymerisation, this always produces a by-product alongside the polymer.</p>'},
{lb:'Natural condensation polymers',dr:dQ3,ht:'<p>Many important natural polymers are formed by condensation: PROTEINS form from amino acid monomers joining via peptide bonds (releasing water at each linkage). CARBOHYDRATES like starch/cellulose form from simple sugar monomers joining via glycosidic bonds (also releasing water). DNA forms from nucleotide monomers joining together.</p>'},
{lb:'Synthetic condensation polymers',dr:dQ3,ht:'<p>Synthetic examples include NYLON (formed from two different monomers, a diamine and a dicarboxylic acid, joining via amide bonds, releasing water) and POLYESTER/TERYLENE (formed from a diol and a dicarboxylic acid, joining via ester bonds, releasing water). These are widely used in textiles and fabrics.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Condensation polymerisation differs from addition polymerisation mainly because condensation polymerisation:',o:['Only uses alkene monomers','Releases a small molecule (commonly water) as a by-product with each new bond formed between monomers','Never forms a long chain polymer','Cannot occur naturally in living organisms'],a:2,w:'The key distinguishing feature of condensation polymerisation is the release of a small by-product molecule (typically water) as each new bond forms between monomer units, unlike addition polymerisation where no by-product is produced.'},{q:'Proteins are formed by condensation polymerisation of which monomer units?',o:['Simple sugars','Amino acids, which join via peptide bonds, releasing water at each linkage','Fatty acids','Nucleotides'],a:2,w:'Proteins are polymers of amino acid monomers, which join together through condensation reactions forming peptide bonds \u2014 with a water molecule released at each new bond formed along the growing protein chain.'},{q:'Nylon is a synthetic condensation polymer formed from:',o:['A single type of alkene monomer','Two different monomers (a diamine and a dicarboxylic acid) joining via amide bonds, releasing water as a by-product','Only water molecules joining together','Simple sugar units'],a:2,w:'Nylon forms through condensation polymerisation between two different monomer types \u2014 a diamine and a dicarboxylic acid \u2014 which join together via amide bonds, releasing water as a by-product at each linkage formed along the polymer chain.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Uses and Environmental Impact of Plastics',su:'Evaluate the benefits and environmental concerns associated with synthetic polymers.',steps:[
{lb:'Common uses of synthetic polymers',dr:dQ4,ht:'<p>Synthetic polymers have transformed modern life due to their versatility: poly(ethene) \u2014 plastic bags, bottles, packaging (lightweight, cheap, waterproof). PVC \u2014 pipes, window frames, cables (durable, resistant to weathering). Polystyrene \u2014 packaging, insulation (lightweight, good thermal insulator). Nylon \u2014 clothing, ropes, parachutes (strong, flexible fibres).</p>'},
{lb:'Environmental concerns',dr:dQ4,ht:'<p>Most synthetic polymers are NON-BIODEGRADABLE (do not naturally decompose, since microorganisms cannot break down their strong, unnatural covalent bonds), persisting in landfill and the environment for hundreds of years. Plastic waste in oceans harms marine life (entanglement, ingestion). Burning plastics can release toxic fumes (e.g. HCl gas from burning PVC) if not properly managed.</p>'},
{lb:'Addressing plastic waste',dr:dQ4,ht:'<p>Strategies to reduce plastic\'s environmental impact: RECYCLING (melting and reforming plastic waste into new products, reducing the need for new raw materials). Developing BIODEGRADABLE plastics (designed to break down more readily via natural processes). REDUCING single-use plastic consumption (encouraging reusable alternatives). Proper WASTE MANAGEMENT (controlled incineration with pollution filters, rather than open burning or uncontrolled dumping).</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Most synthetic polymers persist in the environment for a very long time because they are:',o:['Highly reactive and easily broken down','Non-biodegradable \u2014 microorganisms cannot easily break down their strong, artificial covalent bonds','Made entirely of natural materials','Always recycled immediately after use'],a:2,w:'Synthetic polymers typically have strong, stable covalent bonds that natural decomposer microorganisms are not adapted to break down, meaning these plastics can persist in landfill and the environment for hundreds of years without significant decomposition.'},{q:'Which of these is a genuine strategy to help reduce the environmental impact of plastic waste?',o:['Increasing single-use plastic production', 'Recycling plastic waste into new products, reducing demand for new raw materials and reducing waste sent to landfill', 'Burning all plastic waste in open, uncontrolled fires', 'Banning all uses of plastic immediately with no alternative'],a:2,w:'Recycling allows existing plastic material to be reprocessed into new products, reducing both the amount of waste sent to landfill/the environment AND the demand for extracting new raw materials to make fresh plastic \u2014 a genuinely effective environmental strategy.'},{q:'Burning PVC (polyvinyl chloride) plastic in an uncontrolled way is particularly hazardous because it can release:',o:['Only harmless water vapour','Toxic hydrogen chloride (HCl) gas, due to the chlorine content of PVC', 'Oxygen gas exclusively', 'No gases at all'],a:2,w:'PVC contains chlorine in its structure. When burned (especially in uncontrolled conditions without proper filtering), it can release toxic hydrogen chloride gas, which is harmful to health and the environment \u2014 this is why controlled, filtered incineration (rather than open burning) is important for PVC waste disposal.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Basic Biochemistry and Synthetic Polymers',su:'Integrated revision of biomolecules, polymer types and environmental impact of plastics.',steps:[
{lb:'Biomolecules summary',dr:dQ1,ht:'<p>Carbohydrates: sugar units, quick energy source (iodine test for starch, Benedict\'s for reducing sugars). Proteins: amino acid units, structural/functional roles including enzymes (Biuret test). Fats: glycerol + fatty acids, concentrated energy store/insulation.</p>'},
{lb:'Polymer types summary',dr:dQ5,ht:'<p>Addition polymerisation: alkene monomers (C=C), no by-product, 100% atom economy (e.g. poly(ethene), PVC, polystyrene). Condensation polymerisation: two different monomer types, releases small molecule (usually water) as by-product (e.g. proteins, nylon, polyester, starch/cellulose).</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: confusing addition polymers (single monomer type, no by-product) with condensation polymers (releases water, often two monomer types). Forgetting the specific test results (colours) for starch/sugar/protein tests. Overlooking that most synthetic plastics are non-biodegradable, unlike many natural polymers (which ARE broken down by decomposers in nature).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'A food sample is heated with Benedict\'s solution and turns from blue to brick-red. This indicates the food contains:',o:['Starch','Protein','A reducing sugar \u2014 the characteristic positive result of Benedict\'s test on heating', 'Fat'],a:2,w:'The colour progression from blue toward brick-red (via green/yellow/orange, depending on concentration) upon heating with Benedict\'s solution is the standard positive test result confirming the presence of a reducing sugar.'},{q:'Poly(propene) is formed by which type of polymerisation from propene monomers (CH3-CH=CH2)?',o:['Condensation polymerisation, releasing water','Addition polymerisation \u2014 propene\'s C=C double bond opens to link monomers, with no by-product formed', 'Neither type of polymerisation applies', 'Fermentation'],a:2,w:'Propene is an alkene (contains a C=C double bond), so it undergoes ADDITION polymerisation \u2014 the double bonds open to link monomers into a long chain, with no by-product released, just like ethene forming poly(ethene).'},{q:'Why are natural polymers like starch and proteins generally biodegradable, while many synthetic polymers are not?',o:['Natural polymers contain no carbon atoms','Natural polymers have bond types (e.g. peptide, glycosidic) that decomposer microorganisms have evolved specific enzymes to break down; many synthetic polymers have unfamiliar bond structures that microorganisms cannot easily break down','Synthetic polymers are always stronger than natural ones','There is no real difference in biodegradability'],a:2,w:'Decomposer microorganisms have evolved enzymes specifically suited to breaking down the natural bond types found in biological polymers (like peptide bonds in proteins, glycosidic bonds in starch). Many synthetic polymers have different, unfamiliar bond structures that these natural enzymes cannot efficiently break down, making them persist in the environment much longer.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
