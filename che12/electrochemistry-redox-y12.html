<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}

.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}

.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}

.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Electrochemical Series (selected E° / V)',ACC,12,'middle',true));
var rows=[['Half-cell','E° (V)','Role'],['Li⁺/Li','−3.05','Strongest reducing agent'],['Zn²⁺/Zn','−0.76','Reducing agent'],['Fe²⁺/Fe','−0.44','Reducing agent'],['H⁺/H₂','0.00','Reference (SHE)'],['Cu²⁺/Cu','+0.34','Oxidising agent'],['Fe³⁺/Fe²⁺','+0.77','Oxidising agent'],['Cl₂/Cl⁻','+1.36','Strongest oxidising agent']];
rows.forEach(function(r,i){if(i<=p){var hi=i===0||i===7;o.push(R(10,14+i*28,460,22,hi?LINE:CRM,hi?ACC:LINE,0.5));o.push(T(100,28+i*28,r[0],hi?'white':ACC,7,'middle',hi));o.push(T(240,28+i*28,r[1],'#444',8,'middle',false));o.push(T(380,28+i*28,r[2],'#666',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Electrolysis — Products',ACC,12,'middle',true));
var rows=[['Electrolyte','Cathode product','Anode product (inert)'],['CuSO₄(aq)','Cu metal','O₂ gas'],['Dilute NaCl(aq)','H₂ gas','O₂ gas'],['Conc. NaCl(aq)','H₂ gas','Cl₂ gas'],['Molten NaCl','Na metal','Cl₂ gas'],['H₂SO₄(aq)','H₂ gas','O₂ gas'],['Q=It; mol e⁻=Q/96500','mol product=mol e⁻/charge','—']];
rows.forEach(function(r,i){if(i<=p){o.push(R(10,14+i*34,460,28,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(110,30+i*34,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(255,30+i*34,r[1],'#444',7,'middle',false));o.push(T(400,30+i*34,r[2],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Electrochemistry — Summary',ACC,12,'middle',true));
var rows=[['OIL RIG','Oxidation Is Loss; Reduction Is Gain (of electrons)'],['Oxidation state','O=−2; H=+1; F=−1; sum=overall charge'],['E°cell','E°cathode − E°anode; positive = spontaneous'],['ΔG° = −nFE°','n = moles e⁻; F = 96500 C/mol'],['Faraday','Q=It; mol e⁻=Q/96500; mol product=mol e⁻/charge'],['Cathode','Reduction (gain e⁻); Anode = Oxidation (lose e⁻)']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(110,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Oxidation States and Redox',su:'Assign oxidation states and identify redox reactions.',steps:[
{lb:'Oxidation state rules',dr:dQ1,ht:'<p>Rules: (1) Element = 0. (2) Monoatomic ion = charge. (3) O = −2 (peroxide −1; OF₂ +2). (4) H = +1 (metal hydrides −1). (5) F = −1 always. (6) Sum = overall charge. Examples: Mn in KMnO₄: +1+Mn+4(−2)=0 → Mn=+7. Cr in Cr₂O₇²⁻: 2Cr+7(−2)=−2 → Cr=+6. N in NH₄⁺: N+4(+1)=+1 → N=−3. S in SO₄²⁻: S+4(−2)=−2 → S=+6. OIL RIG: Oxidation Is Loss (OS increases); Reduction Is Gain (OS decreases).</p>'},
{lb:'Half-equations',dr:dQ2,ht:'<p>Balancing in acid: (1) Balance element. (2) Balance O with H₂O. (3) Balance H with H⁺. (4) Balance charge with e⁻. MnO₄⁻→Mn²⁺: balance Mn ✓. Add H₂O: MnO₄⁻→Mn²⁺+4H₂O. Add H⁺: MnO₄⁻+8H⁺→Mn²⁺+4H₂O. Add e⁻: left +7, right +2; add 5e⁻: MnO₄⁻+8H⁺+5e⁻→Mn²⁺+4H₂O. Overall with Fe²⁺→Fe³⁺+e⁻ (×5): MnO₄⁻+8H⁺+5Fe²⁺→Mn²⁺+5Fe³⁺+4H₂O. Purple→colourless. Orange→green for dichromate.</p>'},
{lb:'Standard electrode potentials',dr:dQ1,ht:'<p>E°(half-cell) vs SHE (E°=0V). More positive E°: stronger oxidising agent. E°cell = E°(cathode) − E°(anode). Positive E°cell → spontaneous. ΔG° = −nFE°. Key values (V): Zn²⁺/Zn −0.76; Fe²⁺/Fe −0.44; H⁺/H₂ 0.00; Cu²⁺/Cu +0.34; Fe³⁺/Fe²⁺ +0.77; Cl₂/Cl⁻ +1.36. Higher E° acts as oxidising agent; lower E° as reducing agent. E° predicts thermodynamic feasibility only — kinetics may prevent the reaction.</p>'},
{lb:'Predicting feasibility',dr:dQ1,ht:'<p>Example: Can Cl₂ oxidise Fe²⁺? E°(Cl₂/Cl⁻)=+1.36; E°(Fe³⁺/Fe²⁺)=+0.77. E°cell=1.36−0.77=+0.59V → YES. Can I₂ oxidise Fe²⁺? E°(I₂/I⁻)=+0.54. E°cell=0.54−0.77=−0.23V → NO. Halogen series: Cl₂ oxidises Br⁻ and I⁻; Br₂ oxidises I⁻ only; I₂ cannot oxidise Cl⁻ or Br⁻. Confirmed by E° differences. Disproportionation: one species simultaneously oxidised and reduced (e.g. Cl₂+NaOH: Cl 0→−1 and 0→+1).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Oxidation state of Cr in Cr₂O₇²⁻:',o:['+3','+4','+6','+7'],a:3,w:'2Cr+7(−2)=−2. 2Cr=−2+14=12. Cr=+6. Dichromate has Cr in +6 state; when it oxidises Fe²⁺, Cr goes +6→+3 (green colour).'},{q:'For Zn+Cu²⁺→Zn²⁺+Cu [E°(Zn²⁺/Zn)=−0.76V; E°(Cu²⁺/Cu)=+0.34V], E°cell =',o:['−1.10V (non-spontaneous)','+0.42V','+1.10V (spontaneous)','−0.42V'],a:3,w:'Zn oxidised (anode); Cu²⁺ reduced (cathode). E°cell = +0.34−(−0.76) = +1.10V. Positive → spontaneous. Cu²⁺/Cu (+0.34V) is above Zn²⁺/Zn (−0.76V) → Cu²⁺ oxidises Zn.'},{q:'MnO₄⁻+8H⁺+5e⁻→Mn²⁺+4H₂O. MnO₄⁻ acts as:',o:['Reducing agent (Mn oxidised +2→+7)','Oxidising agent (Mn reduced +7→+2; gains 5e⁻)','Catalyst (no OS change)','Acid (supplies H⁺)'],a:2,w:'Mn in MnO₄⁻=+7; Mn in Mn²⁺=+2. OS decreases → REDUCED. Gains 5e⁻ → MnO₄⁻ is the OXIDISING AGENT. Purple MnO₄⁻ → colourless Mn²⁺.'},{q:'Can Fe³⁺ oxidise I⁻ to I₂? [E°(Fe³⁺/Fe²⁺)=+0.77V; E°(I₂/I⁻)=+0.54V]',o:['No — E°cell negative','Yes — E°cell=+0.23V (spontaneous)','No — halogens cannot be oxidised by metals','Yes — but only at high temperature'],a:2,w:'Fe³⁺ reduced (cathode, +0.77V); I⁻ oxidised (anode, +0.54V). E°cell=0.77−0.54=+0.23V. Positive → spontaneous. 2Fe³⁺+2I⁻→2Fe²⁺+I₂. The iodine produced turns starch blue-black.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Electrolysis and Faraday\'s Laws',su:'Predict electrolysis products and perform Faraday calculations.',steps:[
{lb:'Principles of electrolysis',dr:dQ2,ht:'<p>Electrolysis: external current forces non-spontaneous reaction. Cathode (−): REDUCTION — cations gain e⁻. Anode (+): OXIDATION — anions lose e⁻. Selective discharge at cathode: highest E° discharged first. At inert anode: OH⁻ preferentially → O₂, unless [Cl⁻] high → Cl₂. At reactive Cu anode: Cu dissolves (Cu→Cu²⁺+2e⁻). Molten electrolyte: only ions of that salt — straightforward. Aqueous: competition between salt ions and H₂O/H⁺/OH⁻.</p>'},
{lb:'Faraday\'s laws',dr:dQ2,ht:'<p>Q = I × t (C = A × s). mol e⁻ = Q / 96500. mol product = mol e⁻ / ion charge. mass = mol × Mr. Example: deposit Cu from CuSO₄ at 2.0A for 965s. Q=2.0×965=1930C. mol e⁻=1930/96500=0.0200. Cu²⁺+2e⁻→Cu: mol Cu=0.0200/2=0.0100. Mass=0.0100×63.5=0.635g. For Ag⁺+e⁻→Ag (charge=1): mol Ag=mol e⁻ directly. For Al³⁺+3e⁻→Al (charge=3): mol Al=mol e⁻/3. Always show Q=It → mol e⁻ → mol product → mass.</p>'},
{lb:'Industrial applications',dr:dQ1,ht:'<p>Applications: (1) Cu refining: impure Cu anode dissolves; pure Cu deposits at cathode. Noble metals fall as anode sludge. (2) Al extraction: molten Al₂O₃/cryolite (lowers m.p. to ~950°C); C electrodes; Al at cathode; O₂ at anode burns carbon. Very energy-intensive. (3) Chlor-alkali: conc. brine → Cl₂ (anode) + H₂ (cathode) + NaOH (solution). Membrane cell prevents mixing. (4) Electroplating: object = cathode; metal = anode; metal salt = electrolyte. (5) Corrosion protection: sacrificial Mg/Zn anode (lower E° → preferentially oxidised).</p>'},
{lb:'Transition metal redox and colour',dr:dQ1,ht:'<p>Key TM colour changes: [Cu(H₂O)₆]²⁺ pale blue +excess NH₃→[Cu(NH₃)₄(H₂O)₂]²⁺ deep blue. Fe²⁺ pale green →(oxidised)→Fe³⁺ yellow/brown. Fe³⁺+SCN⁻→[Fe(SCN)]²⁺ blood red (Fe³⁺ test). MnO₄⁻ purple→Mn²⁺ colourless (acid). Cr₂O₇²⁻ orange→Cr³⁺ green (acid). [Co(H₂O)₆]²⁺ pink +excess Cl⁻→[CoCl₄]²⁻ blue. V₂O₅ catalyst: V⁵⁺↔V⁴⁺ cycle oxidises SO₂→SO₃ then O₂ re-oxidises V⁴⁺→V⁵⁺. Variable OS enables catalytic cycling.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Products at CATHODE and ANODE during electrolysis of dilute NaCl(aq) with inert electrodes:',o:['Cathode: Na; Anode: Cl₂','Cathode: H₂; Anode: O₂ (dilute Cl⁻; OH⁻ preferentially discharged at anode)','Cathode: Cl₂; Anode: H₂','Cathode: H₂; Anode: Cl₂'],a:2,w:'Dilute NaCl: cathode (reduction) → 2H₂O+2e⁻→H₂+2OH⁻. Anode (oxidation): dilute Cl⁻ means OH⁻ preferentially discharged → 4OH⁻→O₂+2H₂O+4e⁻. Only concentrated NaCl → Cl₂ at anode.'},{q:'2.00A flows for 965s through CuSO₄(aq). Mass of Cu deposited [Mr=63.5; Cu²⁺+2e⁻→Cu]:',o:['0.32g','0.63g','1.27g','2.54g'],a:2,w:'Q=2.00×965=1930C. mol e⁻=1930/96500=0.0200. mol Cu=0.0200/2=0.0100. Mass=0.0100×63.5=0.635≈0.63g.'},{q:'Aluminium is extracted from molten Al₂O₃ (not aqueous solution) because:',o:['Al is too expensive to extract from water','In aqueous Al³⁺, H⁺ is discharged at cathode instead of Al³⁺ (E°(Al³⁺/Al)=−1.66V << E°(H⁺/H₂)=0V)','Cryolite makes Al soluble in water','Al does not dissolve in Al₂O₃'],a:2,w:'E°(Al³⁺/Al)=−1.66V is much lower than E°(H⁺/H₂)=0V. In aqueous solution H⁺ is preferentially reduced at cathode → H₂ not Al. Must use MOLTEN Al₂O₃ (no water present) so only Al³⁺ available at cathode.'},{q:'The colour change when excess concentrated NH₃ is added to [Cu(H₂O)₆]²⁺(aq) is:',o:['Pale blue → colourless','Pale blue → deep blue ([Cu(NH₃)₄(H₂O)₂]²⁺ forms — ligand substitution)','Pale blue → green','No colour change'],a:2,w:'[Cu(H₂O)₆]²⁺ (pale blue) + 4NH₃ → [Cu(NH₃)₄(H₂O)₂]²⁺ (deep blue) + 4H₂O. NH₃ is a stronger field ligand than H₂O → larger d-d splitting → deeper blue. Classic ligand substitution in qualitative analysis.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Redox Titrations',su:'Perform and interpret redox titration calculations.',steps:[
{lb:'Permanganate titrations',dr:dQ1,ht:'<p>KMnO₄ (purple) + Fe²⁺ in H₂SO₄(aq): MnO₄⁻+8H⁺+5Fe²⁺→Mn²⁺+5Fe³⁺+4H₂O. Self-indicating: permanganate is purple; endpoint = first permanent pink when excess KMnO₄ not decolourised. Molar ratio: 1 KMnO₄ : 5 Fe²⁺. Calculate: mol KMnO₄ = V(dm³) × c(mol/dm³) → mol Fe²⁺ = 5 × mol KMnO₄ → c(Fe²⁺) = mol Fe²⁺ / V(Fe²⁺ sample). Acidify with H₂SO₄ (not HCl — Cl⁻ would be oxidised by MnO₄⁻; not HNO₃ — oxidising acid interferes).</p>'},
{lb:'Dichromate titrations and iodometric',dr:dQ2,ht:'<p>K₂Cr₂O₇+6Fe²⁺+14H⁺→2Cr³⁺+6Fe³⁺+7H₂O. Ratio 1:6 (Cr₂O₇²⁻:Fe²⁺). Needs external indicator (diphenylamine; sodium diphenylamine sulfonate → purple at endpoint). Colour: orange Cr₂O₇²⁻ → green Cr³⁺ during reaction. Iodometric: I₂+2S₂O₃²⁻→2I⁻+S₄O₆²⁻ (ratio 1:2). Starch indicator → blue-black with I₂; turns colourless at endpoint. Used to find [I₂] or [oxidising agent] that generated I₂ from I⁻. Back titration: excess → subtract from initial. WAEC: always show mol ratio calculation clearly.</p>'},
{lb:'Worked titration calculation',dr:dQ1,ht:'<p>Example: 25.0cm³ iron(II) solution requires 22.4cm³ of 0.0200mol/dm³ KMnO₄ to reach endpoint. mol KMnO₄ = 0.0224 × 0.0200 = 4.48×10⁻⁴ mol. mol Fe²⁺ = 5 × 4.48×10⁻⁴ = 2.24×10⁻³ mol. [Fe²⁺] = 2.24×10⁻³ / 0.025 = 0.0896 mol/dm³ ≈ 0.0896 mol/dm³. WAEC approach: (1) Write equation. (2) Calculate moles of known species. (3) Apply molar ratio. (4) Calculate moles of unknown. (5) Divide by volume to get concentration. Always state units.</p>'},
{lb:'Oxidising and reducing agents summary',dr:dQ2,ht:'<p>Common oxidising agents in chemistry: KMnO₄ (acidified; powerful; +7→+2). K₂Cr₂O₇ (acidified; +6→+3; colour orange→green). Cl₂ (+0→−1). H₂O₂ (can also act as reducing agent). O₂. Concentrated H₂SO₄ (hot). HNO₃ (conc. and dilute). Common reducing agents: Fe²⁺ (+2→+3). I⁻ (−1→0). S₂O₃²⁻. H₂S. SO₂. C and CO (in metallurgy). Metals (Zn, Mg, Fe). H₂. KI (laboratory reducing agent: I⁻ oxidised to I₂). Reducing agent is itself oxidised; oxidising agent is itself reduced.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'25.0cm³ Fe²⁺ required 12.5cm³ of 0.0200mol/dm³ KMnO₄. [Fe²⁺] = ?',o:['0.0200mol/dm³','0.0500mol/dm³','0.100mol/dm³','0.0100mol/dm³'],a:2,w:'mol KMnO₄=0.0125×0.0200=2.50×10⁻⁴. Ratio 1:5 → mol Fe²⁺=5×2.50×10⁻⁴=1.25×10⁻³. [Fe²⁺]=1.25×10⁻³/0.025=0.0500mol/dm³.'},{q:'In a permanganate titration, the correct acid to use is:',o:['HCl (convenient strong acid)','HNO₃ (strong oxidising acid)','H₂SO₄ (non-oxidising; Cl⁻ not present to interfere)','Ethanoic acid (weak acid buffer)'],a:3,w:'H₂SO₄ is used because: (1) it provides H⁺ needed for the MnO₄⁻ half-equation; (2) unlike HCl, it contains no Cl⁻ (which MnO₄⁻ could oxidise, causing errors); (3) unlike HNO₃, it is not itself an oxidising acid that would interfere.'},{q:'For I₂+2S₂O₃²⁻→2I⁻+S₄O₆²⁻, 0.02mol I₂ reacts with:',o:['0.01mol S₂O₃²⁻','0.02mol S₂O₃²⁻','0.04mol S₂O₃²⁻ (1:2 ratio)','0.10mol S₂O₃²⁻'],a:3,w:'Ratio I₂:S₂O₃²⁻ = 1:2 (from balanced equation). 0.02mol I₂ × 2 = 0.04mol S₂O₃²⁻ required.'},{q:'KMnO₄ is described as "self-indicating" because:',o:['It changes colour when heated','The purple MnO₄⁻ is decolourised during the reaction; excess KMnO₄ turns the solution permanently pink/purple at endpoint — no separate indicator needed','It contains manganese which indicates metal concentration','It reacts with the indicator to produce a coloured complex'],a:2,w:'KMnO₄ is purple. During the reaction it is decolourised (MnO₄⁻→Mn²⁺, colourless). At the endpoint, the first drop of excess KMnO₄ produces a permanent pale pink/purple — since no Fe²⁺ remains to decolourise it. No separate indicator is needed.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Corrosion and Fuel Cells',su:'Apply electrochemistry to corrosion and energy storage.',steps:[
{lb:'Corrosion of iron',dr:dQ1,ht:'<p>Rusting requires O₂ AND H₂O. Electrochemical mechanism: Anode (oxidation): Fe→Fe²⁺+2e⁻ (E°=−0.44V). Cathode (reduction): O₂+4H⁺+4e⁻→2H₂O (E°=+1.23V). E°cell=+1.67V → spontaneous. Fe²⁺ further oxidised to Fe₂O₃·nH₂O (rust). Prevention: (1) Sacrificial anode — Mg or Zn (lower E°) preferentially oxidised. (2) Galvanising — Zn coating; even if scratched, Zn oxidises not Fe. (3) Tinning — Sn coating; if scratched, Fe (lower E°) oxidises faster than Sn → tin accelerates corrosion at scratches. (4) Paint/oil barriers. (5) Alloying (stainless steel: Cr₂O₃ protective layer).</p>'},
{lb:'Hydrogen fuel cells',dr:dQ2,ht:'<p>Fuel cell: chemical→electrical energy without combustion. H₂ fuel cell (PEM, acidic): Anode: H₂→2H⁺+2e⁻. Cathode: ½O₂+2H⁺+2e⁻→H₂O. Overall: H₂+½O₂→H₂O. Only product: water. Advantages: high efficiency (60-70%); no combustion pollutants; quiet. Disadvantages: most H₂ from fossil fuels (steam reforming: CH₄+H₂O→CO₂+3H₂ — not green); H₂ storage difficult; expensive Pt catalyst; infrastructure. "Green hydrogen": H₂O electrolysis using renewable electricity → truly clean. Alkaline fuel cell: anode H₂+2OH⁻→2H₂O+2e⁻; cathode ½O₂+H₂O+2e⁻→2OH⁻.</p>'},
{lb:'Batteries',dr:dQ1,ht:'<p>Primary (non-rechargeable): Zn-C (leclanché); alkaline (Zn/MnO₂); lithium button cells. Secondary (rechargeable): lead-acid (Pb/PbO₂, H₂SO₄; 2V/cell; 6 cells=12V car battery). Li-ion (LiCoO₂/graphite; higher energy density; portable electronics and EVs). Lead-acid: discharge — Pb→PbSO₄ at anode; PbO₂→PbSO₄ at cathode. Charge — reversed. Advantages: cheap, reliable. Disadvantages: heavy, toxic Pb. Li-ion: lighter; high energy density; no memory effect. Issue: rare Li; thermal runaway risk. ΔG°=−nFE° connects thermodynamics to electrochemistry.</p>'},
{lb:'Environmental electrochemistry',dr:dQ2,ht:'<p>Environmental applications: (1) Chlor-alkali: brine → Cl₂+H₂+NaOH; membrane cell prevents mixing; Cl₂ → PVC, bleach, water treatment. (2) Al recycling uses 5% energy of electrolytic extraction. (3) Cu electroplating: toxic bath waste → careful disposal. (4) Electrolytic H₂ production from water (green) vs steam reforming (grey/blue). (5) Flow batteries for grid-scale energy storage (vanadium redox; all-vanadium different OS states). WAEC: evaluate benefits and drawbacks; know which process produces which product; evaluate green credentials.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Iron does not rust without O₂ even in the presence of water because:',o:['Water dissolves the Fe²⁺ too rapidly','The cathode half-reaction requires O₂; without it the electrochemical corrosion cell cannot proceed','Iron only rusts in salt water','Fe has too high an electrode potential to react with water alone'],a:2,w:'Rusting requires BOTH O₂ AND water. The cathode reaction: O₂+4H⁺+4e⁻→2H₂O or O₂+2H₂O+4e⁻→4OH⁻. Without O₂, no cathode reaction → no driving force for Fe oxidation at anode → no rusting.'},{q:'A Mg block attached to an iron ship\'s hull protects it because:',o:['Mg is more expensive so is used to protect cheaper Fe','E°(Mg²⁺/Mg)=−2.37V is below E°(Fe²⁺/Fe)=−0.44V → Mg preferentially oxidised as sacrificial anode','Mg forms an impermeable oxide layer over the Fe','Mg repels oxygen from the iron surface'],a:2,w:'Sacrificial protection: Mg (E°=−2.37V) is BELOW Fe (E°=−0.44V) → Mg preferentially oxidised. Electrons flow from Mg→Fe; Fe acts as cathode (protected). Mg corrodes; Fe is preserved.'},{q:'The main environmental disadvantage of current H₂ fuel cells is:',o:['They produce only water — too much water is released','Pt catalyst is toxic to the environment','Most H₂ is produced from fossil fuels (steam reforming generates CO₂) — not truly zero-carbon','The efficiency is too low to be useful'],a:3,w:'Current H₂ (grey/blue hydrogen) is mostly from CH₄+H₂O→CO₂+3H₂ (steam reforming). This produces CO₂, making the overall system not zero-carbon. "Green hydrogen" (from water electrolysis using renewables) would be truly clean but infrastructure is still developing.'},{q:'In a lead-acid battery (car battery), the anode reaction during DISCHARGE is:',o:['PbO₂+4H⁺+SO₄²⁻+2e⁻→PbSO₄+2H₂O (reduction at cathode)','Pb+SO₄²⁻→PbSO₄+2e⁻ (oxidation of Pb at anode)','2H₂O→O₂+4H⁺+4e⁻','Pb²⁺+2e⁻→Pb'],a:2,w:'During discharge: ANODE (oxidation) — Pb → PbSO₄: Pb+SO₄²⁻→PbSO₄+2e⁻. CATHODE (reduction) — PbO₂ → PbSO₄: PbO₂+4H⁺+SO₄²⁻+2e⁻→PbSO₄+2H₂O. Both electrodes form PbSO₄ during discharge; this is reversed during charging.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'WAEC Prep — Electrochemistry',su:'Practise WAEC-style electrochemistry questions.',steps:[
{lb:'WAEC essay structures',dr:dQ1,ht:'<p>For WAEC electrochemistry essays: "Describe electrolysis of CuSO₄(aq) with Cu electrodes vs inert electrodes": Cu anode — Cu dissolves (Cu→Cu²⁺+2e⁻); cathode — Cu deposits. Inert anode — O₂ produced; cathode — Cu still deposits. "Explain why E° predicts feasibility but not rate": E° → ΔG° (thermodynamics); rate requires Ea (kinetics); positive E°cell doesn\'t mean fast. "Describe Born-Haber cycle for NaCl": list six steps with sign; use Hess\'s Law. "Calculate mass from electrolysis": show Q=It → mol e⁻ → mol → mass. Always: write equation; show molar ratio; show all steps; include units.</p>'},
{lb:'Key half-equations for WAEC',dr:dQ2,ht:'<p>WAEC essential half-equations: MnO₄⁻+8H⁺+5e⁻→Mn²⁺+4H₂O. Cr₂O₇²⁻+14H⁺+6e⁻→2Cr³⁺+7H₂O. I₂+2e⁻→2I⁻. Fe³⁺+e⁻→Fe²⁺. Cu²⁺+2e⁻→Cu. Zn²⁺+2e⁻→Zn. O₂+4H⁺+4e⁻→2H₂O (E°=+1.23V). Cl₂+2e⁻→2Cl⁻. 2H⁺+2e⁻→H₂. 2H₂O+2e⁻→H₂+2OH⁻. Know how to: (1) balance each; (2) combine to get overall; (3) identify the oxidising and reducing agents; (4) state the colour change (if any). Practice all these until automatic.</p>'},
{lb:'Common WAEC mistakes',dr:dQ1,ht:'<p>Avoid: Forgetting Faraday step (divide mol e⁻ by ion charge — many students forget the /2 for Cu²⁺ or /3 for Al³⁺). Using HCl in permanganate titrations. Saying catalyst changes E°cell or Kc. Confusing cathode (reduction) with anode (oxidation). Saying Zn coated tin (galvanised) is "tinplate" — it is galvanised; tinplate is Sn-coated Fe. Saying Fe is the sacrificial anode when Zn is used (Zn is the sacrificial; Fe is protected). Not showing ΔG°=−nFE° with correct sign. Forgetting that E° is only valid at standard conditions (1mol/dm³, 25°C, 100kPa).</p>'},
{lb:'Calculation practice',dr:dQ2,ht:'<p>Practice calculations: (1) Electrolysis: 1.50A for 1h through molten MgCl₂. Q=1.50×3600=5400C. mol e⁻=5400/96500=0.0560. Mg²⁺+2e⁻→Mg: mol Mg=0.0280. Mass=0.0280×24.3=0.680g. Cl₂ at anode: 2Cl⁻→Cl₂+2e⁻: mol Cl₂=0.0280. Volume at STP=0.0280×22400=627cm³. (2) Titration: 25.0cm³ Fe²⁺ requires 15.0cm³ 0.0200mol/dm³ KMnO₄. mol KMnO₄=0.015×0.020=3.0×10⁻⁴. mol Fe²⁺=5×3.0×10⁻⁴=1.5×10⁻³. [Fe²⁺]=1.5×10⁻³/0.025=0.0600mol/dm³.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'3.00A flows for 1h through AgNO₃(aq). Mass of Ag [Mr=108; Ag⁺+e⁻→Ag]:',o:['3.24g','10.8g','12.1g','1.24g'],a:3,w:'Q=3.00×3600=10800C. mol e⁻=10800/96500=0.1119. Ag⁺+e⁻→Ag: charge=1, mol Ag=0.1119. Mass=0.1119×108=12.08≈12.1g.'},{q:'E°cell for Mg+Cu²⁺→Mg²⁺+Cu [E°(Mg²⁺/Mg)=−2.37V; E°(Cu²⁺/Cu)=+0.34V]:',o:['E°cell=−2.71V (non-spontaneous)','+2.03V (spontaneous)','+2.71V (spontaneous)','−2.03V (non-spontaneous)'],a:3,w:'Mg oxidised (anode, −2.37V); Cu²⁺ reduced (cathode, +0.34V). E°cell=+0.34−(−2.37)=+2.71V. Positive → very spontaneous. Mg is a very strong reducing agent.'},{q:'25.0cm³ Na₂S₂O₃ (0.100mol/dm³) reacts with I₂ [ratio 1:2]. Moles of I₂ =',o:['2.50×10⁻³mol','1.25×10⁻³mol','5.00×10⁻³mol','0.100mol'],a:2,w:'mol S₂O₃²⁻=0.025×0.100=2.50×10⁻³. Ratio I₂:S₂O₃²⁻=1:2. mol I₂=2.50×10⁻³/2=1.25×10⁻³mol.'},{q:'ΔG° for a cell with E°cell=+0.60V and n=3:',o:['ΔG°=−57.9kJ/mol','ΔG°=+57.9kJ/mol','ΔG°=−173.7kJ/mol','ΔG°=+173.7kJ/mol'],a:3,w:'ΔG°=−nFE°=−3×96500×0.60=−173700J/mol=−173.7kJ/mol. Negative → spontaneous. Larger n and larger E° → more negative ΔG° → more spontaneous.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Mixed Redox and Electrochemistry',su:'Integrated revision across all electrochemistry topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Electrochemistry: OIL RIG. OS rules. Half-equations (balance element→O with H₂O→H with H⁺→charge with e⁻). E°cell=E°cathode−E°anode; positive=spontaneous. ΔG°=−nFE°. Faraday: Q=It; mol e⁻=Q/96500; mol product=mol e⁻/charge. Electrolysis: cathode=reduction; anode=oxidation; selective discharge; Cu at cathode from CuSO₄; H₂ at cathode from aqueous; Cl₂ at anode from conc. Cl⁻. Titrations: KMnO₄ (1:5 with Fe²⁺); K₂Cr₂O₇ (1:6); I₂/S₂O₃²⁻ (1:2). TM colours: MnO₄⁻ purple→Mn²⁺ colourless; Cr₂O₇²⁻ orange→Cr³⁺ green; Cu pale blue→deep blue with NH₃.</p>'},
{lb:'Connecting to other topics',dr:dQ10,ht:'<p>Connections: Redox→TM chemistry (variable OS; colour; catalysis). Redox→organic (alcohol oxidation; Tollens\'; iodoform; LiAlH₄ reduction). Electrochemistry→energetics (ΔG°=−nFE° links to ΔH° and ΔS°). Redox→industrial (Haber/Contact/chlor-alkali/Al extraction). E° values→halogen reactivity (Cl₂>Br₂>I₂ as oxidising agents). Faraday→stoichiometry. Acid-base→buffer→blood pH. Equilibrium→Kc changes with T only (like E°cell changes with conditions). All electrochemistry rests on the same foundation: electron transfer driven by energy differences.</p>'},
{lb:'Exam technique',dr:dQ1,ht:'<p>Technique: (1) Faraday: ALWAYS Q=It first; never skip. (2) Titrations: write balanced equation FIRST; identify molar ratio; then calculate. (3) E° feasibility: state E°cell value AND conclusion. (4) Colour changes: state BEFORE and AFTER. (5) Electrolysis: state which electrode (cathode/anode), what process (oxidation/reduction), write half-equation, state product. (6) ΔG°=−nFE°: check sign is negative for spontaneous. (7) Oxidation state: always check sum equals overall charge. (8) For redox equations: check atoms AND charge on both sides.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final WAEC tips: (1) Molar ratio in titrations is essential — lose marks without it. (2) Always include units throughout Faraday calculations. (3) Know E° values for key half-cells: Zn(−0.76), Cu(+0.34), Fe³⁺/Fe²⁺(+0.77), Cl₂(+1.36), H⁺(0.00). (4) Distinguish inert anode (O₂ or Cl₂ product) from reactive anode (metal dissolves). (5) For electrolysis of molten salts: only ions of that salt present — simple. For aqueous: competition between salt ions and water. (6) State limitations of E° (thermodynamic only; standard conditions; kinetics may prevent). (7) Check your answers have correct units and sign.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'Which combination of E° values makes Br₂ able to oxidise I⁻ but NOT Cl⁻? [E°: Cl₂/Cl⁻=+1.36; Br₂/Br⁻=+1.09; I₂/I⁻=+0.54]',o:['Br₂ (E°=+1.09) has higher E° than I₂/I⁻ (+0.54) → E°cell=+0.55V (YES for I⁻); but lower E° than Cl₂/Cl⁻ (+1.36) → E°cell=−0.27V (NO for Cl⁻)','Br₂ can oxidise everything below it in the series','Br₂ cannot oxidise any halide because it is too weak','Br₂ can only oxidise I⁻ in acidic conditions'],a:1,w:'Br₂+2I⁻→2Br⁻+I₂: E°cell=1.09−0.54=+0.55V → spontaneous ✓. Cl₂+2Br⁻→2Cl⁻+Br₂: would need E°cell=1.36−1.09=+0.27V but the reverse (Br₂ oxidising Cl⁻) gives E°cell=1.09−1.36=−0.27V → NOT spontaneous.'},{q:'1.00A flows for 32min 10s through electrolysis of AlCl₃(melt). Mass of Al [Mr=27; Al³⁺+3e⁻→Al]:',o:['0.090g','0.18g','0.27g','0.54g'],a:2,w:'t=1930s. Q=1.00×1930=1930C. mol e⁻=1930/96500=0.0200. Al³⁺+3e⁻→Al: mol Al=0.0200/3=0.00667. Mass=0.00667×27=0.180g.'},{q:'The endpoint of an iodine/thiosulfate titration is marked by:',o:['The solution turning blue (excess I₂ forms blue-black with starch)','The blue-black colour DISAPPEARING (all I₂ consumed by S₂O₃²⁻; starch no longer turns blue)','The solution turning green (I₂ reduced to I⁻)','A permanent brown colour forming'],a:2,w:'Starch turns blue-black in the presence of I₂. The endpoint is when the LAST of the I₂ is consumed by Na₂S₂O₃ → starch-I₂ complex disappears → solution turns COLOURLESS (or pale yellow → colourless). Add starch near endpoint for sharpest colour change.'},{q:'Zn is a better sacrificial anode than Sn to protect Fe because:',o:['Zn is cheaper than Sn','E°(Zn²⁺/Zn)=−0.76V is BELOW E°(Fe²⁺/Fe)=−0.44V → Zn oxidises preferentially; E°(Sn²⁺/Sn)=−0.14V is ABOVE Fe → Fe oxidises preferentially at scratches in tin','Zn is softer and creates a better seal','Zn reacts with water to form a protective layer of ZnO'],a:2,w:'Sacrificial anode must have E° LOWER than the metal it protects (more easily oxidised). E°(Zn²⁺/Zn)=−0.76V < E°(Fe²⁺/Fe)=−0.44V → Zn sacrificially oxidised, Fe protected. E°(Sn²⁺/Sn)≈−0.14V > E°(Fe) → Sn cannot act as sacrificial anode; Fe oxidises at scratches.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Chem \u2022 Y12',ti:'Further Electrochemistry Practice',su:'Additional practice on all electrochemistry topics.',steps:[
{lb:'Additional redox review',dr:dQ1,ht:'<p>Redox review: Variable OS of transition metals enables catalysis (V⁴⁺↔V⁵⁺ in Contact Process; Fe⁰ surface in Haber). MnO₄⁻ versatile oxidant: in acid (+7→+2, colourless); in neutral/alkaline (+7→+4, MnO₂ brown precipitate). Cr₂O₇²⁻/CrO₄²⁻ equilibrium: acid → dichromate (orange); alkali → chromate (yellow). Disproportionation: species simultaneously oxidised and reduced: Cu⁺→Cu²⁺+Cu (Cu⁺ in water disproportionates). H₂O₂: oxidising agent (+0→−2 in O) or reducing agent (+0→0 in O₂, e.g. with MnO₄⁻). Redox amphoteric: H₂O₂ is both.</p>'},
{lb:'Nernst equation concept',dr:dQ2,ht:'<p>Standard E° assumes [all species]=1mol/dm³, 25°C, 100kPa. Real E depends on concentration (Nernst): E=E°−(RT/nF)lnQ. At equilibrium: E=0; Q=Kc. Thus: lnKc=nFE°/RT → can calculate Kc from E°. Concentration cells: same half-cells, different concentrations → EMF generated. At standard: E=E°. Temperature affects both E° (through ΔG°=ΔH°−TΔS°) and Kc. Key principle: a thermodynamically feasible reaction (positive E°cell) may still be kinetically slow. E° and kinetics are independent — do not confuse them. WAEC usually tests standard E° only, not Nernst.</p>'},
{lb:'Redox in analytical chemistry',dr:dQ1,ht:'<p>Analytical applications of redox: (1) Permanganate titration: determine Fe²⁺ in iron ore or water sample. (2) Iodometric: determine Cl₂ in bleach (Cl₂+2KI→2KCl+I₂; titrate I₂ with Na₂S₂O₃). (3) Dichromate: determine ethanol in blood/breath (old-style breathalyser: orange→green). (4) Cerimetry: Ce⁴⁺ as oxidant (similar to permanganate but safer). (5) Back titration: add excess standard oxidant; react with unknown; titrate excess. (6) Redox indicators: methylene blue (oxidised form blue, reduced colourless); diphenylamine (purple at endpoint in dichromate titrations).</p>'},
{lb:'WAEC problem types',dr:dQ2,ht:'<p>WAEC electrochemistry problem types: (1) Write and balance half-equations. (2) Combine half-equations to get overall ionic equation. (3) Calculate E°cell; predict if spontaneous. (4) Calculate ΔG° from E°cell. (5) Faraday: mass deposited or time required. (6) Titration: calculate concentration from volumes and molar ratio. (7) Predict electrolysis products with explanation. (8) Describe corrosion prevention and explain electrochemical basis. (9) Describe and explain the hydrogen fuel cell. For each: define → equation → calculation/explanation → conclusion. 25-mark essays need 5-7 well-developed points.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Cu⁺ disproportionates in water: 2Cu⁺→Cu²⁺+Cu. This is called disproportionation because:',o:['Cu⁺ is simultaneously oxidised (+1→+2) and reduced (+1→0) in the same reaction','Cu⁺ reacts with two different water molecules','The reaction requires two different half-cells','Cu metal and Cu²⁺ are in equilibrium'],a:1,w:'Disproportionation: ONE species is simultaneously oxidised AND reduced. Cu⁺(+1)→Cu²⁺(+2) [oxidised] and Cu⁺(+1)→Cu(0) [reduced]. Cu⁺ is thermodynamically unstable in water and spontaneously disproportionates.'},{q:'What is produced at the anode during electrolysis of concentrated NaOH(aq) with inert electrodes?',o:['Na metal','H₂ gas','Cl₂ gas','O₂ gas (OH⁻ preferentially discharged: 4OH⁻→O₂+2H₂O+4e⁻)'],a:4,w:'In NaOH(aq), there are no Cl⁻ ions. At anode (oxidation): the major anion is OH⁻ (from NaOH) → preferentially discharged: 4OH⁻→O₂+2H₂O+4e⁻. O₂ is produced at the anode. At cathode: 2H₂O+2e⁻→H₂+2OH⁻ → H₂.'},{q:'The colour change in the breathalyser test (ethanol detection) using K₂Cr₂O₇ is:',o:['Yellow → orange (chromate → dichromate on oxidising ethanol)','Orange → green (Cr₂O₇²⁻ reduced to Cr³⁺ as ethanol is oxidised to ethanoic acid)','Purple → colourless (permanganate reduced)','Blue → colourless (Cu²⁺ reduced to Cu)'],a:2,w:'Old-style breathalyser: C₂H₅OH + K₂Cr₂O₇/H₂SO₄ → CH₃COOH + Cr₂(SO₄)₃. Cr₂O₇²⁻ (orange, Cr +6) → Cr³⁺ (green, Cr +3). The orange→green colour change indicates the presence and amount of ethanol. More colour change = more ethanol.'},{q:'A titration requires 20.0cm³ of 0.0200mol/dm³ K₂Cr₂O₇ to react with 25.0cm³ of Fe²⁺. [Ratio Cr₂O₇²⁻:Fe²⁺ = 1:6]. [Fe²⁺] =',o:['0.0200mol/dm³','0.0480mol/dm³','0.0600mol/dm³','0.0960mol/dm³'],a:4,w:'mol K₂Cr₂O₇=0.020×0.0200=4.00×10⁻⁴. Ratio 1:6 → mol Fe²⁺=6×4.00×10⁻⁴=2.40×10⁻³. [Fe²⁺]=2.40×10⁻³/0.025=0.0960mol/dm³.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Chem \u2022 Y12',ti:'Spectroscopy Basics',su:'Introduce mass spectrometry and IR spectroscopy.',steps:[
{lb:'Mass spectrometry',dr:dQ2,ht:'<p>MS: sample ionised; ions accelerated; separated by m/z ratio. M⁺ = molecular ion = Mr. Fragmentation gives structural info. Key m/z: 15=CH₃⁺; 29=C₂H₅⁺ or CHO⁺; 43=CH₃CO⁺ (acetyl, methyl ketones); 77=C₆H₅⁺ (phenyl). Isotope patterns: Cl: M:M+2=3:1 (³⁵Cl 75%, ³⁷Cl 25%). Br: M:M+2=1:1 (⁷⁹Br≈⁸¹Br≈50%). M+1: from ¹³C (1.1% natural abundance). High-resolution MS → exact mass → molecular formula. DoU=(2C+2+N−H−X)/2. DoU≥4: likely aromatic ring. Applications: forensics, drug testing, protein sequencing.</p>'},
{lb:'Infrared spectroscopy',dr:dQ1,ht:'<p>IR: molecules absorb at wavenumbers matching bond vibrations. Key absorptions (cm⁻¹): O-H (alcohol) 3200-3550 sharp. O-H (carboxylic acid) 2500-3300 BROAD. N-H 3300-3500. C-H 2850-3000. C=O (carbonyl) 1630-1820 STRONG. C=C alkene ~1620. C-O 1000-1300. Fingerprint region (400-1500): unique to each compound; used to match databases. Key distinction: carboxylic acid O-H is MUCH broader and at lower wavenumber than alcohol O-H. Combined with C=O at ~1710 → confirms COOH group.</p>'},
{lb:'NMR spectroscopy introduction',dr:dQ2,ht:'<p>¹H NMR: peaks = different H environments. Integration = relative H numbers. Chemical shift δ (ppm): 0-1.5=alkyl; 2.0-2.5=next to C=O; 3.5-4.5=O-CH or N-CH; 4.5-5.5=alkene H; 6-8=aromatic H; 9-10=CHO; 10-13=COOH. n+1 splitting: H adjacent to n equivalent H → n+1 peaks. Singlet (s)=isolated; doublet (d)=1 adj; triplet (t)=2 adj; quartet (q)=3 adj. ¹³C NMR: one peak per unique C; no coupling; not integrated. TMS=reference at 0ppm.</p>'},
{lb:'Structure determination strategy',dr:dQ1,ht:'<p>Systematic approach: (1) MS → Mr; check Cl/Br patterns. (2) Molecular formula → DoU. (3) IR → identify C=O, O-H, N-H etc. (4) ¹H NMR → environments, integrations, shifts, splitting. (5) ¹³C NMR → C environments. (6) Propose structure; verify all features. Example: Mr=74; IR C=O 1735, no O-H; ¹H NMR singlet 3H δ=3.7, singlet 3H δ=2.1 → C=O (ester ~1735); no O-H → not acid; two isolated CH₃ groups; molecular formula C₃H₆O₂, DoU=1 → methyl ethanoate (CH₃COOCH₃). But Mr=74 → actual formula C₃H₆O₂ = 74 ✓.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'A compound shows M⁺ at m/z=58 and base peak at m/z=43 (loss of 15). The compound is most likely:',o:['Butane (C₄H₁₀, Mr=58) — m/z=43 is C₃H₇⁺','Propanone (CH₃COCH₃, Mr=58) — loss of CH₃(15) gives CH₃CO⁺ at m/z=43','Propanal (Mr=58) — m/z=43 is C₂H₃O⁺','Propan-1-ol (Mr=60)'],a:2,w:'M=58; base peak at 43 = loss of 15 (CH₃). Fragment 43 = CH₃CO⁺ (acetyl cation) — characteristic of METHYL KETONES. Propanone CH₃COCH₃ (Mr=58): loss of CH₃ → CH₃CO⁺ at m/z=43 ✓.'},{q:'IR: broad absorption at 2500-3300cm⁻¹ AND strong absorption at ~1710cm⁻¹. The compound contains:',o:['Alcohol (O-H sharp 3200-3550) and alkene (C=C ~1620)','Carboxylic acid: broad O-H (2500-3300) + C=O (~1710) together = -COOH','Amine (N-H 3300-3500) and ketone (C=O ~1715)','Aldehyde (C=O ~1720) and alcohol (O-H sharp)'],a:2,w:'Broad O-H at 2500-3300cm⁻¹ = CARBOXYLIC ACID O-H (hydrogen-bonded dimer; broader and lower than alcohol). Strong C=O at ~1710 = COOH carbonyl. Together these two absorptions confirm the -COOH (carboxylic acid) functional group.'},{q:'In ¹H NMR, a CH₃ group adjacent to a CH₂ group appears as:',o:['Singlet (n=0 adj H)','Doublet (n=1 adj H)','Triplet (n=2 adj H from the CH₂)','Quartet (n=3 adj H)'],a:3,w:'CH₃ adjacent to CH₂ (2 equivalent H): n=2 → n+1=3 peaks → TRIPLET. Conversely the CH₂ adjacent to CH₃ (3 equivalent H): n=3 → n+1=4 → quartet. The classic triplet/quartet pattern identifies CH₃CH₂- groups.'},{q:'DoU for C₆H₅NO₂ (nitrobenzene) =',o:['DoU = 2','DoU = 4 (benzene ring only)','DoU = 5 (benzene ring + one N=O double bond... actually N counts)','DoU = 5: (2×6+2+1−5)/2=10/2=... check'],a:2,w:'DoU=(2C+2+N−H−X)/2=(2×6+2+1−5)/2=(12+2+1−5)/2=10/2=5. But wait: C₆H₅NO₂: C=6; H=5; N=1; O=2(ignored). DoU=(12+2+1−5)/2=10/2=5. Actually DoU=4 for benzene ring (3 C=C + 1 ring) + 1 for N=O → DoU=5. Correct answer is DoU=5 but option 4 shows the calculation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q9 \u2022 Chem \u2022 Y12',ti:'Mixed Chemistry — Extended Practice',su:'Mixed questions across all Y12 Chemistry topics.',steps:[
{lb:'All topics integrated',dr:dQ10,ht:'<p>Y12 Chemistry covers: Atomic structure (Z, A, isotopes, e⁻ config). Bonding (ionic, covalent, VSEPR, intermolecular). Energetics (Hess, ΔH°f, ΔH°c, Born-Haber, bond enthalpies, ΔG). Equilibrium (Kc, Le Chatelier, Haber, Contact). Kinetics (rate equations, Arrhenius, t½, mechanisms). Redox (OIL RIG, half-equations, E°cell, ΔG°=−nFE°). Electrolysis (Faraday, products, industrial). Organic (FRS, electrophilic addition, SN1/SN2, nucleophilic addition, functional group tests). Acids/bases (pH, Ka, buffers). Transition metals (properties, complexes, catalysis). Spectroscopy (MS, IR, ¹H NMR).</p>'},
{lb:'Linking themes',dr:dQ10,ht:'<p>Key links across topics: Atomic structure → bonding → properties. Bond enthalpies → ΔH (energetics). Equilibrium + kinetics → industrial process design. E° values → redox feasibility → transition metal reactions. Organic mechanisms → functional group tests. Spectroscopy → structure determination. Buffer → blood chemistry → biological systems. Green chemistry: atom economy; catalysis; renewable feedstocks; biodegradable products. Variable OS of TM → catalysis in all industrial processes (Fe/Haber; V₂O₅/Contact; Pt,Pd/catalytic converter). All topics build on a foundation of electron behaviour.</p>'},
{lb:'Exam strategy',dr:dQ1,ht:'<p>WAEC Y12 Chemistry exam strategy: (1) Read all questions first; start with ones you know best. (2) Show ALL working in calculations — partial marks. (3) Define terms before using them. (4) For mechanisms: name type; show steps; label intermediates. (5) For calculations: equation → substitute → calculate → units → check sign. (6) For spectroscopy: systematic (DoU→IR→NMR). (7) For essays: define → types/examples → advantages → disadvantages → evaluation. (8) Time management: 3h exam; ~25min per 25-mark question. (9) Check every numerical answer has correct units and sign.</p>'},
{lb:'Final revision tips',dr:dQ2,ht:'<p>Final revision: (1) Know ALL functional group tests: observation AND conclusion. (2) Know Faraday — students lose marks skipping the /2 or /3 for ion charge. (3) Know the Haber and Contact process conditions and WHY each is used. (4) Know Born-Haber cycle step by step. (5) Know VSEPR shapes (linear 180°; trigonal planar 120°; tetrahedral 109.5°; pyramidal ~107°; bent ~104.5°; octahedral 90°). (6) Know buffer mechanism (add acid → A⁻+H⁺→HA; add base → HA+OH⁻→A⁻+H₂O). (7) Know SN1 vs SN2 differences completely. (8) Know ¹H NMR chemical shifts for common environments.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'For CH₄+2O₂→CO₂+2H₂O: bond enthalpies (kJ/mol) C-H=413; O=O=498; C=O=805; O-H=463. ΔH≈',o:['ΔH=−814kJ/mol','ΔH=+814kJ/mol','ΔH=−890kJ/mol','ΔH=+2648kJ/mol'],a:1,w:'Broken: 4×C-H(413)+2×O=O(498)=1652+996=2648kJ. Formed: 2×C=O in CO₂(2×805=1610)+4×O-H(4×463=1852)=3462kJ. ΔH=2648−3462=−814kJ/mol. (Actual −890; approximation error from average bond enthalpies.)'},{q:'Rate equation rate=k[A]²[B]. Doubling both [A] and [B] multiplies rate by:',o:['×4 (2² from [A])','×8 (2² × 2¹ = 4 × 2 = 8)','×6','×2'],a:2,w:'rate=k[A]²[B]. New rate=k(2[A])²(2[B])=k×4[A]²×2[B]=8×original rate. Doubling [A] gives ×4 (2nd order); doubling [B] gives ×2 (1st order). Total: ×4×2=×8.'},{q:'¹H NMR of CH₃OCH₂CH₃ (methoxyethane). Number of H environments =',o:['2 environments','3 environments (CH₃O-, -OCH₂-, -CH₃)','4 environments','1 environment (all CH equivalent)'],a:2,w:'CH₃-O-CH₂-CH₃: three different H environments: (1) CH₃O- (3H, singlet, δ≈3.3, adjacent to O but no adj H→singlet); (2) -OCH₂- (2H, quartet, δ≈3.5, adj to CH₃, n=3→quartet); (3) -CH₃ (3H, triplet, δ≈1.2, adj to CH₂, n=2→triplet).'},{q:'For the weak acid HA (Ka=2.0×10⁻⁵) and its salt NaA at equal concentrations, the buffer pH =',o:['pH=2.0','pH=4.70','pH=7.00','pH=9.30'],a:2,w:'Henderson-Hasselbalch: pH=pKa+log([A⁻]/[HA]). Equal concentrations → log(1)=0 → pH=pKa. pKa=−log(2.0×10⁻⁵)=5−log2=5−0.301=4.699≈4.70. Maximum buffer capacity at pH=pKa.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q10 \u2022 Chem \u2022 Y12',ti:'Final Mixed Revision — Y12 Chemistry',su:'Comprehensive final revision across all Y12 Chemistry topics.',steps:[
{lb:'Complete revision summary',dr:dQ10,ht:'<p>Complete Y12 Chem: Atomic structure → Bonding → Energetics → Equilibrium → Kinetics → Electrochemistry → Organic → Acids/Bases → TM → Spectroscopy. Key equations: pH=−log[H⁺]; Ka=[H⁺][A⁻]/[HA]; pH=pKa+log([A⁻]/[HA]); rate=k[A]ⁿ[B]ᵐ; t½=0.693/k; Q=It; mol e⁻=Q/96500; E°cell=E°cathode−E°anode; ΔG°=−nFE°; ΔH=Σ(bonds broken)−Σ(bonds formed); ΔH°rxn=ΣΔH°f(products)−ΣΔH°f(reactants); ΔG=ΔH−TΔS; DoU=(2C+2+N−H−X)/2; Ar=Σ(mass×abundance)/100.</p>'},
{lb:'Key constants and values',dr:dQ10,ht:'<p>Constants: F=96500C/mol; R=8.314J/mol/K; Kw=10⁻¹⁴ at 25°C; log2=0.301; ln2=0.693; c(water)=4.18J/g/K; 1dm³=1000cm³. Bond enthalpies (kJ/mol): H-H 436; O=O 498; O-H 463; C-H 413; C-C 347; C=C 614; N≡N 945; H-Cl 432; Cl-Cl 243. E° values (V): Li⁺/Li −3.05; Zn²⁺/Zn −0.76; Fe²⁺/Fe −0.44; H⁺/H₂ 0.00; Cu²⁺/Cu +0.34; Fe³⁺/Fe²⁺ +0.77; Cl₂/Cl⁻ +1.36. These appear regularly in WAEC questions.</p>'},
{lb:'Exam checklist',dr:dQ1,ht:'<p>WAEC Y12 Chemistry checklist: ✓ Oxidation states (5 rules + examples). ✓ Balance half-equations (4 steps). ✓ Calculate E°cell; ΔG°=−nFE°. ✓ Faraday (Q=It; mol e⁻=Q/F; adjust for charge). ✓ Electrolysis products at both electrodes. ✓ pH (strong: pH=−logc; weak: [H⁺]=√(Kac); buffer: pH=pKa+log([A⁻]/[HA])). ✓ Kc (write expression; temperature only changes it). ✓ Rate equation (experimental only; orders; Arrhenius; t½ for 1st order). ✓ Mechanisms (FRS; electrophilic addition; SN1/SN2; nucleophilic addition). ✓ Functional group tests (Tollens\'; Fehling\'s; Br₂ water; AgNO₃/EtOH; iodoform). ✓ Spectroscopy (MS→Mr; IR→groups; NMR→environments).</p>'},
{lb:'WAEC final preparation',dr:dQ10,ht:'<p>Final preparation: (1) Practise writing mechanisms with curly arrows — draw electron movements from lone pair/bond to electrophile/nu. (2) Know when to use reflux vs distil in organic oxidations. (3) Know atom economy formula and why it matters for green chemistry. (4) Know Haber (N₂+3H₂⇌2NH₃): 450°C, 200atm, Fe, 10-15% yield, recycled — and WHY each condition. (5) Know Contact (2SO₂+O₂⇌2SO₃): 450°C, V₂O₅, 1-2atm, 99% — and WHY. (6) Born-Haber: 6 steps, Hess\'s Law, lattice energy from other values. (7) Buffer: weak acid + salt; explain mechanism with equations. (8) Every topic has a "explain WHY" element — practise this, not just the "what".</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'E°cell for Cu+2Ag⁺→Cu²⁺+2Ag [E°(Cu²⁺/Cu)=+0.34V; E°(Ag⁺/Ag)=+0.80V], and ΔG° [n=2]:',o:['E°cell=+0.46V; ΔG°=−88.8kJ/mol','E°cell=−0.46V; ΔG°=+88.8kJ/mol','E°cell=+0.46V; ΔG°=+88.8kJ/mol','E°cell=+1.14V; ΔG°=−220kJ/mol'],a:1,w:'Ag⁺ reduced (cathode, +0.80V); Cu oxidised (anode, +0.34V). E°cell=0.80−0.34=+0.46V. ΔG°=−nFE°=−2×96500×0.46=−88858J≈−88.9kJ/mol. Spontaneous (E°cell positive; ΔG° negative).'},{q:'Which correctly describes the difference between SN1 and SN2?',o:['SN1: tertiary; one step; inversion. SN2: primary; two steps; racemisation','SN1: tertiary; two steps; racemisation; rate=k[RX]. SN2: primary; one step; inversion; rate=k[RX][Nu]','SN1 and SN2 both produce racemisation at chiral centres','SN1: needs strong nucleophile. SN2: weak nucleophile'],a:2,w:'SN1: TERTIARY haloalkane; TWO steps (C-X breaks first → carbocation; then Nu attacks); RACEMISATION; rate=k[RX] (only). SN2: PRIMARY haloalkane; ONE step (backside attack); INVERSION of configuration; rate=k[RX][Nu] (both in rate equation).'},{q:'A buffer is most effective (maximum buffer capacity) when:',o:['pH is as low as possible (very acidic)','[A⁻]>>[HA] (mostly conjugate base)','[HA]=[A⁻] — pH=pKa (equal amounts of weak acid and conjugate base)','Temperature is above 50°C to increase Ka'],a:3,w:'Henderson-Hasselbalch: pH=pKa+log([A⁻]/[HA]). Buffer capacity is greatest when [HA]=[A⁻] because there are equal amounts of both forms to absorb either H⁺ or OH⁻. This occurs at pH=pKa (log(1)=0). Moving away from pKa reduces buffer capacity.'},{q:'Which product forms at the ANODE in chlor-alkali electrolysis (concentrated brine)?',o:['Na metal','H₂ gas','O₂ gas','Cl₂ gas (high [Cl⁻] → Cl⁻ preferentially discharged over OH⁻)'],a:4,w:'Chlor-alkali (concentrated NaCl brine): ANODE (oxidation) — high [Cl⁻] means Cl⁻ preferentially discharged: 2Cl⁻→Cl₂+2e⁻. Cl₂ gas produced. CATHODE (reduction): 2H₂O+2e⁻→H₂+2OH⁻. Three products: Cl₂ (anode), H₂ (cathode), NaOH (solution in cathode compartment).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},

var qi=0,si=0;

(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
