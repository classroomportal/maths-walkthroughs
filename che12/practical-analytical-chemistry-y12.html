<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Flame Test Colours for Common Cations',[['Cation','Flame colour'],['Li+','Crimson red'],['Na+','Yellow/orange'],['K+','Lilac'],['Ca2+','Brick red'],['Ba2+','Apple/pale green'],['Cu2+','Blue-green']]);}
function dQ2(p){drawTable(p,'Cation Tests with NaOH and NH3',[['Cation','+ NaOH (dropwise then excess)','+ NH3 (dropwise then excess)'],['Al3+','White ppt, dissolves in excess','White ppt, insoluble in excess'],['Ca2+','White ppt, insoluble in excess','No ppt (or faint)'],['Cu2+','Blue ppt, insoluble in excess','Blue ppt \u2192 deep blue solution in excess'],['Fe2+','Green ppt, insoluble in excess','Green ppt, insoluble in excess'],['Fe3+','Orange-brown ppt, insoluble in excess','Orange-brown ppt, insoluble in excess'],['Zn2+','White ppt, dissolves in excess','White ppt, dissolves in excess']]);}
function dQ3(p){drawTable(p,'Anion Tests',[['Anion','Test','Observation'],['CO3 2-','+ dilute acid','Effervescence, CO2 turns limewater milky'],['SO4 2-','+ BaCl2/HCl','White precipitate (BaSO4)'],['Cl-','+ AgNO3/HNO3','White precipitate, dissolves in dilute NH3'],['Br-','+ AgNO3/HNO3','Cream precipitate, dissolves in concentrated NH3'],['I-','+ AgNO3/HNO3','Yellow precipitate, insoluble in NH3'],['NO3-','+ Al foil/NaOH, warm','Ammonia gas released, turns litmus blue']]);}
function dQ4(p){drawTable(p,'Gravimetric Analysis \u2014 Key Steps',[['Step','Purpose'],['Precipitate the analyte','Form an insoluble compound of known formula'],['Filter','Separate precipitate from solution'],['Wash','Remove soluble impurities'],['Dry to constant mass','Ensure all water/solvent removed'],['Weigh','Calculate original analyte mass from precipitate mass']]);}
function dQ5(p){drawTable(p,'Chromatography \u2014 Rf Value',[['Term','Formula'],['Rf','distance moved by spot / distance moved by solvent front'],['Range','Always between 0 and 1'],['Use','Compare to known Rf values to identify a substance']]);}
function dQ6(p){drawTable(p,'Sources of Error in Titration',[['Error source','Effect'],['Parallax error reading meniscus','Random error in volume reading'],['Air bubble in burette tip','Volume reading too high (false extra titrant)'],['Indicator overshoot','Titre reading too high'],['Not rinsing conical flask with distilled water only','No effect (residual water does not change moles)']]);}
function dQ7(p){drawTable(p,'Percentage Error Calculation',[['Term','Formula'],['Absolute error','instrument uncertainty (e.g. \u00b10.05 cm3 for burette)'],['% error','(absolute error / measured value) x 100'],['Total % error (titration)','sum of % errors from each apparatus used']]);}
function dQ8(p){drawTable(p,'WAEC Practical Chemistry Summary',[['Skill','Key point'],['Qualitative analysis','Systematic cation/anion tests with clear observations'],['Gravimetric analysis','Precipitate, filter, wash, dry, weigh'],['Chromatography','Rf = distance spot / distance solvent'],['Error analysis','Smaller volumes measured = larger % error']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Systematic Cation Analysis',su:'Use flame tests and precipitation reactions to identify unknown cations.',steps:[
{lb:'Flame tests',dr:dQ1,ht:'<p>A <b>flame test</b> identifies certain metal cations by the characteristic colour they impart to a flame (electrons are excited to higher energy levels by the heat, then emit light of a specific wavelength/colour as they fall back down). Key colours: Li+ crimson red, Na+ yellow/orange, K+ lilac, Ca2+ brick red, Ba2+ apple/pale green, Cu2+ blue-green. Dip a clean nichrome/platinum wire in concentrated HCl, then into the solid sample, and hold in a blue Bunsen flame.</p>'},
{lb:'Testing with NaOH',dr:dQ2,ht:'<p>Adding NaOH(aq) dropwise, then in excess, to a cation solution: Al3+, Zn3+ give a WHITE precipitate that DISSOLVES in excess NaOH (amphoteric hydroxide, forms soluble aluminate/zincate ion). Ca2+ gives a white precipitate INSOLUBLE in excess. Cu2+ gives a BLUE precipitate, insoluble in excess. Fe2+ gives a GREEN precipitate (turns brown/orange on standing in air due to oxidation to Fe3+). Fe3+ gives an ORANGE-BROWN precipitate, insoluble in excess.</p>'},
{lb:'Testing with NH3 to distinguish similar results',dr:dQ2,ht:'<p>Adding NH3(aq) dropwise then in excess helps distinguish ions that behave similarly with NaOH. Al3+ gives a white precipitate INSOLUBLE in excess NH3 (unlike with NaOH, where it dissolves) \u2014 this distinguishes Al3+ from Zn2+, which DOES dissolve in excess NH3 (forming a soluble complex ion). Cu2+ gives a pale blue precipitate that dissolves in EXCESS NH3 to form a characteristic DEEP BLUE solution ([Cu(NH3)4(H2O)2]2+) \u2014 a distinctive confirmatory test for copper.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'A flame test produces a lilac colour. Which cation is most likely present?',o:['Na+','K+ \u2014 potassium gives a characteristic lilac flame colour','Ca2+','Cu2+'],a:2,w:'Potassium ions (K+) produce a distinctive lilac (pale purple) flame colour, one of the classic diagnostic flame test results used in qualitative analysis.'},{q:'Adding excess NaOH to a solution containing Al3+ produces:',o:['A precipitate that remains insoluble','A white precipitate that DISSOLVES in excess NaOH, forming a soluble aluminate ion (amphoteric behaviour)','A blue precipitate','No visible reaction at all'],a:2,w:'Al(OH)3 is amphoteric \u2014 it initially forms as a white precipitate with NaOH, but dissolves in EXCESS NaOH as it reacts further to form the soluble aluminate ion [Al(OH)4]-, a key distinguishing feature from ions like Ca2+ whose hydroxide remains insoluble in excess.'},{q:'Cu2+ ions with excess NH3(aq) give which characteristic observation?',o:['A white precipitate that does not dissolve','A pale blue precipitate that dissolves in excess NH3 to give a DEEP BLUE solution','No reaction occurs','A yellow precipitate'],a:2,w:'Cu2+ first forms a pale blue Cu(OH)2-type precipitate with NH3, but in EXCESS ammonia this dissolves to form the deep blue complex ion [Cu(NH3)4(H2O)2]2+ \u2014 a very distinctive, reliable confirmatory test for copper(II) ions.'},{q:'How can Al3+ and Zn2+ be distinguished, since both give a white precipitate with NaOH that dissolves in excess?',o:['They cannot be distinguished by any chemical test','By testing with excess NH3(aq): Al3+ precipitate remains INSOLUBLE in excess NH3, while Zn2+ precipitate DISSOLVES in excess NH3','By flame test colour, which is identical for both','By boiling point of the solution'],a:2,w:'While NaOH gives the same result for both (dissolving in excess), NH3 distinguishes them: the Al(OH)3 precipitate stays insoluble even in excess ammonia, whereas Zn(OH)2 dissolves in excess ammonia to form a soluble zinc-ammine complex ion.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Systematic Anion Analysis',su:'Use precipitation and gas tests to identify common anions.',steps:[
{lb:'Testing for carbonate and sulfate',dr:dQ3,ht:'<p>CARBONATE (CO3 2-): add dilute acid \u2014 EFFERVESCENCE (bubbles) of CO2 gas is seen; the gas turns limewater MILKY (forms insoluble CaCO3 precipitate). SULFATE (SO4 2-): add barium chloride solution acidified with dilute HCl (to remove interference from carbonate/sulfite, which would also give false precipitates) \u2014 a WHITE precipitate of BaSO4 forms, insoluble in excess acid (unlike BaCO3 which would dissolve).</p>'},
{lb:'Testing for halides',dr:dQ3,ht:'<p>Halide tests: add silver nitrate solution, acidified with dilute nitric acid (to remove interference from carbonate/hydroxide ions). Cl- gives a WHITE precipitate that dissolves in DILUTE ammonia. Br- gives a CREAM precipitate that dissolves only in CONCENTRATED ammonia. I- gives a YELLOW precipitate that is INSOLUBLE even in concentrated ammonia. This solubility-in-ammonia pattern is the key way to distinguish the three halide precipitates, which can look similar by colour alone.</p>'},
{lb:'Testing for nitrate',dr:dQ3,ht:'<p>NITRATE (NO3-) test (the "brown ring test" is one method; the aluminium/Devarda\'s alloy method is common in WAEC): add aluminium foil (or Devarda\'s alloy) and NaOH solution, then WARM gently. NO3- is reduced to AMMONIA GAS (NH3), detected by its pungent smell and by turning damp red litmus paper BLUE. (Note: this test only works if NO2- and NH4+ are first shown to be absent, since they interfere with confirming NO3- specifically.)</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Adding dilute acid to a solid produces effervescence, and the gas turns limewater milky. This confirms the presence of:',o:['Sulfate ions','Carbonate ions \u2014 CO2 gas is released and reacts with limewater to form insoluble CaCO3','Chloride ions','Nitrate ions'],a:2,w:'Carbonates react with dilute acid to release CO2 gas (effervescence). This gas turning limewater milky is the classic confirmatory test, forming a white precipitate of insoluble calcium carbonate: Ca(OH)2 + CO2 \u2192 CaCO3 + H2O.'},{q:'Why is barium chloride solution acidified with dilute HCl before testing for sulfate ions?',o:['To make the test faster','To remove interference from carbonate or sulfite ions, which would also form a white precipitate with barium ions but would dissolve in the acid, unlike BaSO4','Acidification has no effect on the test','To change the colour of the precipitate'],a:2,w:'Carbonate and sulfite ions would also form white barium precipitates (BaCO3, BaSO3), giving a false positive. Adding dilute HCl dissolves these interfering precipitates (they react with acid, releasing gas), while BaSO4 remains insoluble even in acid, confirming a true sulfate result.'},{q:'A silver nitrate test on a halide solution gives a cream precipitate that dissolves only in CONCENTRATED ammonia. This indicates:',o:['Cl- is present','Br- is present \u2014 cream precipitate, soluble only in concentrated ammonia (not dilute)','I- is present','No halide is present'],a:2,w:'The three silver halide precipitates are distinguished by colour AND solubility in ammonia: AgCl (white, dissolves in dilute NH3), AgBr (cream, dissolves only in CONCENTRATED NH3), AgI (yellow, insoluble even in concentrated NH3). A cream precipitate dissolving only in concentrated ammonia confirms bromide.'},{q:'In the aluminium/NaOH test for nitrate ions, a positive result is confirmed by:',o:['Formation of a white precipitate','Release of ammonia gas (detected by smell and turning damp red litmus paper blue) after warming with aluminium and NaOH','Effervescence of CO2','A colour change to yellow'],a:2,w:'Aluminium (or Devarda\'s alloy) reduces nitrate ions to ammonia gas in the presence of NaOH upon warming. The ammonia produced has a characteristic pungent smell and turns damp red litmus paper blue, confirming the presence of nitrate.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Gravimetric Analysis',su:'Determine the mass or purity of a substance by precipitation, filtration and weighing.',steps:[
{lb:'Principle of gravimetric analysis',dr:dQ4,ht:'<p><b>Gravimetric analysis</b> determines the quantity of a substance by converting it into an insoluble compound of KNOWN, fixed composition, then carefully isolating and weighing that precipitate. Since the formula (and hence Mr) of the precipitate is known, the mass of the original analyte can be calculated using mole ratios, just as in any stoichiometric calculation.</p>'},
{lb:'The method, step by step',dr:dQ4,ht:'<p>Steps: (1) Dissolve the sample and add excess precipitating reagent to ensure complete precipitation (e.g. excess BaCl2 to precipitate all sulfate as BaSO4). (2) FILTER the precipitate using pre-weighed filter paper. (3) WASH the precipitate with a small amount of appropriate solvent to remove soluble impurities without dissolving the precipitate itself. (4) DRY to CONSTANT MASS (repeatedly weighing until the mass no longer changes, confirming all moisture/solvent has evaporated). (5) WEIGH the dry precipitate accurately.</p>'},
{lb:'Calculating the result',dr:dQ4,ht:'<p>Example: a sample containing sulfate is treated with excess BaCl2, producing 0.466 g of dry BaSO4 (Mr=233). Moles BaSO4 = 0.466/233 = 0.00200 mol. Since 1 mole BaSO4 contains 1 mole SO4 2- (1:1 ratio), moles SO4 2- in original sample = 0.00200 mol. This can then be converted to mass of sulfate, or used to find the % sulfate content of the original sample if its total mass is known.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'In gravimetric analysis, why must the precipitate be dried to CONSTANT MASS before the final weighing?',o:['To make the precipitate a different colour','To ensure all moisture/solvent has fully evaporated, so the weighed mass accurately reflects only the pure precipitate','Constant mass drying is not actually necessary','To dissolve any remaining impurities'],a:2,w:'If the precipitate still contains trapped moisture or solvent, its measured mass would be inaccurately high. Drying to constant mass (repeated weighing until no further mass change) confirms that all volatile material has evaporated, leaving only the pure, dry precipitate for an accurate final weighing.'},{q:'Why is the precipitating reagent added in EXCESS during gravimetric analysis?',o:['To ensure the analyte is completely precipitated, leaving none unreacted in solution (which would understate the result)','To dissolve the precipitate faster','Excess reagent has no purpose and should be avoided','To change the colour of the precipitate'],a:2,w:'Using excess precipitating reagent drives the precipitation reaction as close to completion as possible, ensuring virtually all of the analyte is converted into the precipitate. If insufficient reagent were used, some analyte would remain in solution, giving a falsely low final mass/result.'},{q:'A sample produces 0.699 g of dry BaSO4 (Mr=233) via gravimetric analysis. How many moles of sulfate were in the original sample?',o:['0.00100 mol','0.00300 mol (0.699/233)','0.00600 mol','0.0300 mol'],a:2,w:'Moles BaSO4 = mass/Mr = 0.699/233 = 0.00300 mol. Since the ratio of BaSO4 to sulfate ion is 1:1, moles of sulfate in the original sample = 0.00300 mol.'},{q:'The precipitate in gravimetric analysis must be washed with an appropriate solvent primarily to:',o:['Increase the mass of the precipitate','Remove soluble impurities from the precipitate surface, without dissolving the precipitate itself','Change the chemical formula of the precipitate','Dry the precipitate completely'],a:2,w:'Washing removes any soluble impurities (e.g. leftover reagent solution) adhering to the precipitate\'s surface. The wash solvent must be chosen carefully so that it does NOT dissolve any of the actual precipitate itself, which would cause loss and give an inaccurately low final mass.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Chromatography and Rf Values',su:'Use paper/thin-layer chromatography and Rf values to identify substances.',steps:[
{lb:'The principle of chromatography',dr:dQ5,ht:'<p><b>Chromatography</b> separates a mixture based on the different affinities of its components for a STATIONARY phase (e.g. chromatography paper, or a thin silica/alumina layer for TLC) versus a MOBILE phase (the solvent moving through/along it). Components that are more strongly attracted to the mobile phase (more soluble in the solvent) travel FURTHER; components more strongly attracted to the stationary phase travel LESS far, resulting in separated spots.</p>'},
{lb:'Calculating and using Rf values',dr:dQ5,ht:'<p><b>Rf value</b> = (distance travelled by the spot) / (distance travelled by the solvent front), measured from the same original baseline. Rf is always between 0 and 1 (a spot cannot travel further than the solvent itself). Rf values are CHARACTERISTIC for a given substance under fixed conditions (same solvent, same stationary phase, same temperature), so an unknown spot can be identified by comparing its Rf to Rf values of known reference substances run under the same conditions.</p>'},
{lb:'Practical technique considerations',dr:dQ5,ht:'<p>Important technique points: the original sample spot must be drawn in PENCIL (not ink, which would itself separate/dissolve into coloured components) and kept ABOVE the level of the solvent in the chromatography tank (if the spot is submerged, the sample dissolves directly into the solvent reservoir rather than being carried up the paper). The solvent front must be marked immediately upon removal from the tank, since it continues to evaporate/spread afterwards, changing the true measured distance.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'In paper chromatography, a substance with a HIGH Rf value:',o:['Stays close to the baseline, barely moving','Travels a large fraction of the distance the solvent travelled, indicating strong affinity for the mobile phase (solvent)','Cannot be measured accurately','Has a value greater than 1'],a:2,w:'A high Rf value (close to 1) means the spot travelled almost as far as the solvent front, indicating the substance is more soluble in / has greater affinity for the mobile phase (solvent) than for the stationary phase.'},{q:'A spot travels 6.0 cm while the solvent front travels 8.0 cm. What is the Rf value?',o:['0.60','0.75 (6.0/8.0)','1.33','8.0'],a:2,w:'Rf = distance travelled by spot / distance travelled by solvent front = 6.0/8.0 = 0.75.'},{q:'Why must the original spot in chromatography be drawn using pencil, not ink?',o:['Pencil is cheaper than ink','Ink itself is often a mixture of coloured components that would separate during the chromatography run, contaminating the results, whereas pencil (graphite) does not dissolve or separate','Pencil marks are easier to see','It makes no difference which is used'],a:2,w:'Many inks are mixtures of dyes that would themselves separate into multiple spots as the solvent moves up the paper, confusing the results. Pencil (graphite) is insoluble in the solvent and does not interfere with the separation of the actual sample.'},{q:'Why must the original sample spot be positioned ABOVE the level of the solvent in the chromatography tank?',o:['It does not matter where the spot is placed','If the spot is submerged in the solvent reservoir, the sample would dissolve directly into the bulk solvent rather than being carried up the paper by capillary action, ruining the separation','The spot must be submerged for the technique to work at all','This only matters for TLC, not paper chromatography'],a:2,w:'If the original spot is below the solvent level, it simply dissolves into the solvent reservoir instead of being carried up the stationary phase by capillary action, meaning no proper chromatographic separation can occur \u2014 the spot must start above the solvent line.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Sources of Error in Volumetric Technique',su:'Identify and evaluate sources of error in titration and volumetric apparatus.',steps:[
{lb:'Random vs systematic errors',dr:dQ6,ht:'<p><b>Random errors</b> cause results to scatter both above and below the true value unpredictably (e.g. slight variation in judging the endpoint colour each time, small parallax errors reading the meniscus). <b>Systematic errors</b> consistently shift results in ONE direction every time (e.g. a consistently mis-calibrated burette, or an air bubble that is present for every reading). Repeating a titration and averaging CONCORDANT results (within 0.10 cm3 of each other) reduces the impact of random error, but does NOT correct for systematic error.</p>'},
{lb:'Common titration errors',dr:dQ6,ht:'<p>Air bubble trapped in the burette tip before starting: if it dislodges DURING the titration, the volume reading will show MORE titrant used than actually reacted (false high reading). Reading the meniscus at eye level correctly (bottom of the meniscus for colourless solutions) avoids parallax error. Indicator "overshoot" (adding titrant too quickly near the endpoint) causes the recorded volume to be slightly too HIGH, since a small excess beyond the true equivalence point is added before the colour change is noticed.</p>'},
{lb:'What does NOT introduce error',dr:dQ6,ht:'<p>Rinsing the conical flask (receiving the analyte) with distilled water before the titration does NOT introduce error, because it does not change the total MOLES of analyte present (only dilutes it, but moles are conserved and indicator response depends on moles reacted, not concentration in the flask). However, NOT rinsing burettes/pipettes with the solution they are about to measure (rinsing only with water) WOULD dilute that reagent and introduce a genuine error.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'An air bubble present in the burette tip at the start of a titration, which dislodges partway through, will cause the recorded titre volume to be:',o:['Too low','Too high, since the bubble\'s volume is falsely counted as titrant dispensed once it dislodges','Unaffected','Exactly double the true value'],a:2,w:'If an air bubble occupies space in the burette tip initially and then dislodges during the titration, the volume scale reading will suggest MORE liquid has left the burette than actually reacted with the sample, giving a falsely HIGH titre reading.'},{q:'Rinsing the conical flask (receiving the sample) with distilled water before a titration is:',o:['A serious error that changes the moles of analyte present','Not a source of error, since it only dilutes the solution but does not change the total MOLES of analyte, which is what determines the titration endpoint','Always required to avoid contamination','Only acceptable for weak acids'],a:2,w:'Diluting the analyte solution in the conical flask with distilled water does not remove or add any analyte \u2014 the total number of MOLES present is unchanged, and it is moles (not concentration in the flask) that determines how much titrant is needed to reach the endpoint.'},{q:'"Overshooting" the endpoint by adding titrant too quickly near the equivalence point causes the recorded titre to be:',o:['Too low','Too high, since excess titrant beyond the true equivalence point is added before the colour change is noticed','Exactly correct','Impossible to determine'],a:2,w:'If titrant is added too quickly close to the endpoint, a small excess beyond the true equivalence point may be added before the colour change becomes visible and the tap is closed, resulting in a titre reading that is slightly HIGHER than the true value.'},{q:'The difference between a random error and a systematic error in titration is that:',o:['Random errors always make results too high; systematic errors always make results too low','Random errors cause results to scatter unpredictably above and below the true value, while systematic errors consistently shift results in the SAME direction every time','They are the same thing with different names','Random errors can be fixed by averaging; systematic errors cannot be identified at all'],a:2,w:'Random errors (like small variations in judging colour change) cause scatter in both directions and can be reduced by repeating and averaging concordant results. Systematic errors (like a consistently mis-calibrated instrument) shift EVERY result in the same direction and are NOT reduced by repeating the experiment \u2014 they require correcting or recalibrating the apparatus/method itself.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Percentage Error and Apparatus Precision',su:'Calculate percentage error from apparatus uncertainty and evaluate measurement precision.',steps:[
{lb:'Absolute uncertainty of common apparatus',dr:dQ7,ht:'<p>Every measuring instrument has a fixed ABSOLUTE uncertainty based on its precision. Typical values: burette \u00b10.05 cm3 (per reading; since two readings \u2014 initial and final \u2014 are taken, the total uncertainty for a titre is often doubled to \u00b10.10 cm3). Pipette (e.g. 25 cm3 volumetric pipette) \u00b10.06 cm3. Volumetric flask (e.g. 250 cm3) \u00b10.3 cm3. Analytical balance \u00b10.001 g (typical 2 or 4 decimal place balance).</p>'},
{lb:'Calculating percentage error',dr:dQ7,ht:'<p>% error = (absolute uncertainty / measured value) x 100. Example: a burette reading of 25.00 cm3 with uncertainty \u00b10.10 cm3 (combining both readings) gives % error = (0.10/25.00) x 100 = 0.40%. IMPORTANT: the SAME absolute uncertainty gives a LARGER percentage error when the measured volume is SMALLER \u2014 this is why titrations should be designed (e.g. diluting standard solutions appropriately) to use a reasonably large titre volume, minimising % error.</p>'},
{lb:'Combining errors across a whole experiment',dr:dQ7,ht:'<p>For a multi-step calculation (e.g. a full titration using a pipette AND a burette), the TOTAL percentage error is the SUM of the percentage errors from each piece of apparatus used. Example: pipette % error (0.06/25.00 x100=0.24%) + burette % error (0.10/23.50x100=0.43%) = total 0.67% error in the overall calculated concentration. This is a common WAEC calculation testing understanding of measurement uncertainty.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'A burette has an absolute uncertainty of \u00b10.10 cm3 (combining two readings). For a titre of 10.00 cm3, the percentage error is:',o:['0.10%','0.50%','1.00% (0.10/10.00 x100)','10.0%'],a:3,w:'% error = (0.10/10.00) x 100 = 1.00%. Notice this is TWICE the % error you would get for a 20.00 cm3 titre with the same absolute uncertainty, illustrating why smaller titre volumes give larger % errors.'},{q:'Why do titrations generally aim for a reasonably LARGE titre volume rather than a very small one?',o:['Large volumes always use more chemicals unnecessarily','For a fixed absolute apparatus uncertainty, a larger measured volume gives a SMALLER percentage error, improving overall precision','Small titre volumes are always more accurate','Titre volume has no relationship to percentage error'],a:2,w:'Since % error = absolute uncertainty/measured value x100, a larger measured volume for the SAME fixed absolute uncertainty results in a smaller percentage error. This is why experiments are often designed (e.g. using appropriate concentrations) to give reasonably large titre readings.'},{q:'A pipette contributes 0.24% error and a burette contributes 0.43% error to a titration calculation. What is the total percentage error?',o:['0.19%','0.24%','0.43%','0.67% (0.24+0.43)'],a:4,w:'When multiple pieces of apparatus each contribute their own percentage error to an overall calculation, the TOTAL percentage error is the SUM of the individual percentage errors: 0.24+0.43=0.67%.'},{q:'An analytical balance has an absolute uncertainty of \u00b10.001 g. For a smaller weighed mass, the percentage error will be:',o:['Smaller, since less mass is being weighed','Larger, because the same fixed absolute uncertainty represents a bigger fraction of a smaller measured mass','Unaffected by the size of the mass weighed','Always exactly 0.001%'],a:2,w:'Since % error = absolute uncertainty/measured mass x100, keeping the absolute uncertainty fixed while decreasing the measured mass INCREASES the resulting percentage error \u2014 this is why primary standards with a reasonably high molar mass (requiring a larger sample mass) are preferred, minimising weighing error.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Chem \u2022 Y12',ti:'Spectroscopic Identification \u2014 Colorimetry and UV-Vis',su:'Examine how colorimetry and UV-Vis spectroscopy can be used to identify or quantify substances.',steps:[
{lb:'How colorimetry works',dr:dQ8,ht:'<p><b>Colorimetry</b> measures the amount of light ABSORBED by a coloured solution at a specific wavelength, using a colorimeter or UV-Vis spectrophotometer. A solution absorbs light of the colour COMPLEMENTARY to its observed colour (e.g. a blue Cu2+ solution absorbs mainly ORANGE/red light). Absorbance increases as the concentration of the coloured species increases (following the Beer-Lambert Law: A = \u03b5cl, where \u03b5 is the molar absorptivity, c is concentration, l is path length).</p>'},
{lb:'Using a calibration curve',dr:dQ8,ht:'<p>To find the UNKNOWN concentration of a coloured solution: (1) prepare a series of STANDARD solutions of KNOWN concentration. (2) Measure the absorbance of each using the colorimeter at a fixed wavelength. (3) Plot a CALIBRATION CURVE of absorbance (y-axis) against concentration (x-axis) \u2014 should give a straight line through the origin (Beer-Lambert Law). (4) Measure the absorbance of the unknown sample and read its corresponding concentration from the calibration curve (or its equation).</p>'},
{lb:'Linking to organic spectroscopy',dr:dQ8,ht:'<p>Colorimetry/UV-Vis complements the other spectroscopic techniques covered in Organic Chemistry and Spectroscopy (IR for functional groups, NMR for hydrogen environments, MS for molecular mass/fragmentation). While IR/NMR/MS identify STRUCTURE, colorimetry is primarily used for QUANTITATIVE analysis (finding concentration) of solutions that are already coloured or can be made to react to form a coloured product (e.g. testing water quality for metal ion concentration, or monitoring reaction rates by colour change over time).</p>'},
{lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'A blue copper sulfate solution appears blue because it absorbs mainly which colour of visible light?',o:['Blue light','Orange/red light (the complementary colour to blue, which is transmitted/reflected)','Green light only','No light is absorbed'],a:2,w:'A solution appears the colour of the light it TRANSMITS (does not absorb). A blue solution absorbs mainly the complementary colour, orange/red light, while transmitting blue light, which is what reaches the observer\'s eye.'},{q:'The Beer-Lambert Law (A=\u03b5cl) shows that absorbance is directly proportional to:',o:['The colour of the light source only','The concentration of the absorbing species (at fixed path length and wavelength)','The temperature of the solution only','The volume of the sample container'],a:2,w:'The Beer-Lambert Law states A=\u03b5cl, where absorbance (A) is directly proportional to concentration (c), for a fixed molar absorptivity (\u03b5, specific to the substance and wavelength) and fixed path length (l). This proportionality is the basis for using absorbance to determine unknown concentrations.'},{q:'To find the concentration of an unknown coloured solution using colorimetry, you should:',o:['Measure its absorbance and compare directly with a known Ka value','Prepare a calibration curve from standard solutions of known concentration, then read the unknown\'s concentration from this curve using its measured absorbance','Simply look at its colour to estimate concentration by eye','This cannot be done using colorimetry'],a:2,w:'A calibration curve (absorbance vs known concentration, from prepared standards) allows the concentration of an unknown sample to be determined accurately, by measuring its absorbance and reading the corresponding concentration from the linear graph or its equation.'},{q:'How does colorimetry differ in purpose from IR, NMR and mass spectrometry (covered in organic spectroscopy)?',o:['They serve exactly the same purpose with no difference','Colorimetry is mainly used for QUANTITATIVE analysis (finding concentration) of coloured solutions, whereas IR/NMR/MS are mainly used for QUALITATIVE structure determination (identifying functional groups, molecular structure, and mass)','Colorimetry can only be used on solids','IR, NMR and MS cannot be used quantitatively at all'],a:2,w:'While IR, NMR and MS are primarily structural elucidation tools (determining what a molecule looks like), colorimetry (and UV-Vis more broadly) is most commonly applied to determine the CONCENTRATION of a known coloured species in solution, complementing the structural techniques.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Practical and Analytical Chemistry',su:'Integrated revision across qualitative analysis, gravimetric methods, chromatography and error analysis.',steps:[
{lb:'Qualitative analysis summary',dr:dQ8,ht:'<p>Systematic identification: flame tests for certain cations (Li+, Na+, K+, Ca2+, Ba2+, Cu2+). NaOH/NH3 precipitation tests distinguish cations by precipitate colour and solubility in excess reagent. Anion tests use characteristic precipitation (sulfate with BaCl2, halides with AgNO3) or gas tests (carbonate with acid, nitrate with Al/NaOH). Always report BOTH the observation AND the conclusion for full WAEC marks.</p>'},
{lb:'Quantitative technique summary',dr:dQ8,ht:'<p>Gravimetric analysis: precipitate, filter, wash, dry to constant mass, weigh \u2014 calculate original analyte from precipitate mass using mole ratios. Chromatography: Rf = distance travelled by spot/distance travelled by solvent, characteristic for a substance under fixed conditions. Colorimetry: uses a calibration curve of absorbance vs concentration to find unknown concentrations of coloured species.</p>'},
{lb:'Error analysis and common WAEC mistakes',dr:dQ8,ht:'<p>Avoid: forgetting that rinsing the CONICAL FLASK with water does not introduce error (moles unchanged), while NOT rinsing the burette/pipette with the correct solution WOULD dilute it and cause real error. Confusing random error (reduced by averaging concordant repeats) with systematic error (not fixed by repeating; needs recalibration). Forgetting that smaller measured volumes/masses give LARGER percentage errors for the same absolute apparatus uncertainty.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'When reporting a qualitative test result for WAEC, full marks typically require:',o:['Only stating the observation (e.g. "white precipitate")','Only stating the conclusion (e.g. "chloride is present") without any observation','Both the OBSERVATION (what you saw) and the CONCLUSION (what it means), linked together clearly','Neither is required, just the test name'],a:3,w:'WAEC practical/qualitative analysis marking schemes typically require both a clear observation (e.g. "white precipitate forms, insoluble in excess NaOH") AND the correct conclusion drawn from it (e.g. "confirms the presence of Ca2+"), linked together in a full explanatory sentence.'},{q:'A gravimetric analysis calculation ultimately relies on which key relationship?',o:['Rf value comparison','Mole ratio between the known-formula precipitate and the original analyte, calculated from the precipitate\'s measured mass and Mr','Flame colour comparison','Absorbance vs concentration calibration'],a:2,w:'Gravimetric analysis converts a measured precipitate mass into moles (mass/Mr), then uses the mole RATIO between the precipitate and the original analyte (from the precipitation reaction\'s stoichiometry) to calculate the amount of analyte originally present.'},{q:'Repeating a titration multiple times and averaging only the CONCORDANT results (within 0.10 cm3 of each other) primarily reduces:',o:['Systematic error only','Random error, since averaging multiple independent trials reduces the impact of unpredictable variation, though it does not correct systematic bias','Both random and systematic error equally','Neither type of error'],a:2,w:'Averaging concordant repeat titrations reduces the effect of RANDOM errors (small unpredictable variations each time), because these tend to cancel out over multiple trials. However, if there is a SYSTEMATIC error (e.g. a consistently misread scale), repeating the experiment will not fix it \u2014 every reading is biased in the same direction.'},{q:'For the same fixed absolute uncertainty in an instrument, which measurement will have the SMALLEST percentage error?',o:['A very small measured value','A moderately large measured value, since % error decreases as the measured quantity increases for a fixed absolute uncertainty','Percentage error is unrelated to the size of the measured value','It is impossible to say without more information about the substance'],a:2,w:'% error = absolute uncertainty/measured value x100. For a fixed absolute uncertainty, a LARGER measured value results in a SMALLER percentage error \u2014 this is why experiments are often designed to use as large a volume/mass as practical, minimising percentage error.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
