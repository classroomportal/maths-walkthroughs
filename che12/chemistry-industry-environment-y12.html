<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'The Haber Process',[['Reactant/Product','Detail'],['N2 + 3H2 \u21cc 2NH3','Reversible, exothermic'],['Conditions','450\u00b0C, 200atm, Fe catalyst'],['Use of NH3','Fertiliser manufacture']]);}
function dQ2(p){drawTable(p,'NPK Fertilisers',[['Nutrient','Role in plants'],['Nitrogen (N)','Leaf/stem growth, chlorophyll'],['Phosphorus (P)','Root growth'],['Potassium (K)','Flowering, disease resistance']]);}
function dQ3(p){drawTable(p,'Extraction Methods by Reactivity',[['Reactivity','Extraction method'],['Very reactive (K,Na,Ca,Mg,Al)','Electrolysis'],['Moderately reactive (Zn,Fe)','Reduction with carbon/CO'],['Unreactive (Au,Ag)','Found native, no extraction needed']]);}
function dQ4(p){drawTable(p,'Extraction of Iron \u2014 Blast Furnace',[['Zone/Reaction','Equation'],['Coke burns','C + O2 \u2192 CO2'],['CO2 reduced','CO2 + C \u2192 2CO'],['Iron oxide reduced','Fe2O3 + 3CO \u2192 2Fe + 3CO2']]);}
function dQ5(p){drawTable(p,'Environmental Impact of Industry',[['Industry issue','Effect'],['Gas flaring','Releases CO2, wastes energy resource'],['Fertiliser runoff','Eutrophication of waterways'],['Mining/extraction','Land degradation, waste rock']]);}
function dQ6(p){drawTable(p,'WAEC Industry and Environment Summary',[['Process','Key point'],['Haber process','N2+3H2\u21cc2NH3, makes fertiliser'],['Metal extraction','Method depends on reactivity'],['Industrial impact','Balance economic benefit vs environmental cost']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'The Haber Process and Fertiliser Production',su:'Examine the industrial synthesis of ammonia and its use in fertiliser manufacture.',steps:[
{lb:'The Haber process reaction',dr:dQ1,ht:'<p>The <b>Haber process</b> synthesises ammonia from its elements: N2(g) + 3H2(g) \u21cc 2NH3(g), an EXOTHERMIC, REVERSIBLE reaction. Nitrogen is obtained from the air (fractional distillation of liquid air); hydrogen is typically obtained from natural gas (methane) reacting with steam.</p>'},
{lb:'Industrial conditions',dr:dQ1,ht:'<p>Conditions used: 450\u00b0C (a COMPROMISE \u2014 lower temperature would give higher yield since the reaction is exothermic, but the rate would be too slow; higher temperature gives faster rate but lower yield). 200 atmospheres pressure (high pressure favours the SIDE with FEWER gas molecules, which is the product side: 4 moles gas \u2192 2 moles gas, so high pressure increases yield, though very high pressure is costly and requires strong equipment). An IRON catalyst speeds up the rate (allowing equilibrium to be reached faster) WITHOUT affecting the yield/equilibrium position.</p>'},
{lb:'Ammonia and fertiliser production',dr:dQ2,ht:'<p>Ammonia produced by the Haber process is used to manufacture NITROGEN-BASED FERTILISERS (e.g. ammonium nitrate, NH4NO3, made by reacting ammonia with nitric acid). Fertilisers supply essential NUTRIENTS (nitrogen, phosphorus, potassium \u2014 "NPK") that plants need for healthy growth, replacing nutrients removed from soil by repeated crop harvesting.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'The Haber process uses a temperature of 450\u00b0C as a compromise because:',o:['Lower temperature gives a higher equilibrium yield (exothermic reaction) but reacts too slowly; higher temperature gives faster rate but lower yield','450\u00b0C gives 100% yield with no compromise needed','Temperature has no effect on this reaction','450\u00b0C is simply the boiling point of ammonia'],a:2,w:'Since the forward reaction is exothermic, lower temperatures favour a higher equilibrium yield of ammonia, but the reaction would proceed too slowly to be economical. 450\u00b0C balances a reasonably fast rate against an acceptable (though not maximum) yield.'},{q:'High pressure (200 atm) is used in the Haber process because:',o:['High pressure has no effect on the position of equilibrium','It favours the side with fewer gas molecules (the product side, NH3), increasing the yield of ammonia, though very high pressures are costly to maintain','It only increases the rate of reaction, not the yield','Pressure only matters for liquids, not gases'],a:2,w:'The reaction N2+3H2\u21cc2NH3 has 4 moles of gas on the reactant side and only 2 moles on the product side. Increasing pressure shifts equilibrium towards the side with FEWER gas molecules (the products), increasing ammonia yield \u2014 though very high pressures require expensive, robust equipment.'},{q:'The iron catalyst used in the Haber process:',o:['Increases the equilibrium yield of ammonia','Speeds up the RATE at which equilibrium is reached, without changing the equilibrium position (yield) itself','Decreases the rate of reaction','Is consumed and must be continually replaced'],a:2,w:'A catalyst speeds up both the forward and reverse reactions equally, allowing equilibrium to be reached more quickly, but it does NOT shift the equilibrium position \u2014 the proportion of ammonia at equilibrium remains the same with or without the catalyst, only the TIME to reach it changes.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'NPK Fertilisers and Plant Nutrients',su:'Examine the roles of nitrogen, phosphorus and potassium in plant growth.',steps:[
{lb:'Why plants need fertilisers',dr:dQ2,ht:'<p>Plants absorb essential nutrients from soil to grow, but repeated CROP HARVESTING removes these nutrients faster than they can be naturally replenished. FERTILISERS replace these nutrients artificially, allowing continuous, intensive agriculture and boosting crop yields to feed growing populations.</p>'},
{lb:'The role of NPK nutrients',dr:dQ2,ht:'<p>NITROGEN (N) promotes healthy LEAF and STEM growth and is essential for making CHLOROPHYLL (used in photosynthesis) and proteins. PHOSPHORUS (P) promotes strong ROOT development and is important for energy transfer within the plant. POTASSIUM (K) improves FLOWERING/FRUITING and increases resistance to disease and adverse weather conditions.</p>'},
{lb:'Common fertiliser compounds',dr:dQ2,ht:'<p>Common nitrogen-based fertilisers: ammonium nitrate (NH4NO3, high in nitrogen from BOTH the ammonium and nitrate parts of the formula), ammonium sulfate ((NH4)2SO4), urea (CO(NH2)2). Phosphate fertilisers often come from mined phosphate rock, chemically treated to make the phosphorus more soluble/available to plant roots.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Nitrogen (N) in fertilisers primarily supports which aspect of plant growth?',o:['Root development only','Leaf and stem growth, and production of chlorophyll and proteins','Flowering and fruiting only','Disease resistance only'],a:2,w:'Nitrogen is a key component of chlorophyll (needed for photosynthesis) and proteins (needed for growth), so adequate nitrogen supports strong leaf and stem development in plants.'},{q:'A farmer notices poor root development in their crop. Which fertiliser nutrient would most directly help address this?',o:['Nitrogen (N)','Phosphorus (P) \u2014 essential for promoting strong root growth and energy transfer within the plant','Potassium (K)','None of these nutrients affect root growth'],a:2,w:'Phosphorus is specifically important for root development and energy transfer processes within plants, so supplying phosphorus-based fertiliser would be the most direct way to address poor root growth.'},{q:'Why do farmers need to apply fertilisers regularly, rather than relying on the soil\u2019s natural nutrient content alone?',o:['Soil nutrients never deplete naturally','Repeated harvesting of crops removes nutrients from the soil faster than natural processes can replenish them, so fertilisers are needed to maintain soil fertility for continued high-yield farming','Fertilisers are only used for decorative plants, not crops','Fertilisers have no actual benefit to plant growth'],a:2,w:'Continuous crop harvesting removes nutrients (N, P, K, etc.) from the soil at a rate faster than they are naturally replenished by soil processes. Fertilisers artificially replace these lost nutrients, allowing intensive, repeated farming without soil nutrient depletion reducing crop yields over time.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Extraction of Metals \u2014 Method by Reactivity',su:'Match metal extraction methods to the position of the metal in the reactivity series.',steps:[
{lb:'Extraction method depends on reactivity',dr:dQ3,ht:'<p>The METHOD used to extract a metal from its ore depends on the metal\'s position in the REACTIVITY SERIES: VERY REACTIVE metals (K, Na, Ca, Mg, Al) require ELECTROLYSIS (a powerful method using electrical energy, since chemical reducing agents like carbon are not strong enough to remove oxygen from their very stable compounds). MODERATELY REACTIVE metals (Zn, Fe) can be extracted by REDUCTION with CARBON or CARBON MONOXIDE (cheaper than electrolysis, since carbon is a strong enough reducing agent for these metals). UNREACTIVE metals (Au, Ag, Pt) are found NATIVE (as the free element) in the Earth\'s crust, requiring no chemical extraction at all.</p>'},
{lb:'Why more reactive metals need electrolysis',dr:dQ3,ht:'<p>Very reactive metals form extremely STABLE compounds (strong ionic bonds, high lattice energies), meaning a large amount of energy is needed to separate the metal from its oxide/compound. Carbon (a moderate reducing agent) cannot supply enough "reducing power" to displace these very reactive metals from their oxides \u2014 so a much stronger method, electrolysis (passing electricity through the MOLTEN compound), is needed instead.</p>'},
{lb:'Economic and practical considerations',dr:dQ3,ht:'<p>Electrolysis is much more EXPENSIVE than carbon reduction (requires large amounts of electrical energy, and the compound must first be melted, which itself requires significant energy for high-melting-point ionic compounds). This is why cheaper carbon reduction is used WHENEVER POSSIBLE (for moderately reactive metals), reserving the costly electrolysis method only for metals that genuinely require it (too reactive for carbon to work).</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Aluminium, a very reactive metal, is extracted by which method?',o:['Reduction with carbon, since this is always cheapest','Electrolysis, since aluminium is too reactive for carbon to reduce its oxide effectively','It is found native, requiring no extraction','Heating alone, without any chemical process'],a:2,w:'Aluminium is high in the reactivity series, forming very stable Al2O3. Carbon is not a strong enough reducing agent to extract aluminium from its oxide, so the more powerful (but expensive) method of electrolysis of molten Al2O3 (mixed with cryolite to lower its melting point) is required instead.'},{q:'Why is carbon reduction used for extracting iron, but NOT for extracting sodium?',o:['Carbon can reduce any metal oxide equally well','Iron is moderately reactive, and carbon is a strong enough reducing agent to displace it from its oxide; sodium is much more reactive, and carbon cannot provide enough reducing power to extract it, requiring electrolysis instead','Sodium does not form any oxide compounds','Iron oxide does not actually exist'],a:2,w:'Iron\'s position in the reactivity series (moderately reactive) means carbon (a moderate reducing agent) is sufficiently powerful to reduce iron oxide to iron metal. Sodium is far more reactive, forming a much more stable oxide that carbon simply cannot reduce \u2014 electrolysis (a stronger method) is required for such highly reactive metals.'},{q:'Gold is found as the native (uncombined) element in the Earth\u2019s crust because:',o:['Gold reacts very readily with other elements','Gold is extremely UNREACTIVE, so it does not readily form compounds with other elements in the environment, remaining as the free metal','Gold is a very reactive metal','Gold does not actually exist in the Earth\u2019s crust'],a:2,w:'Gold\u2019s very low reactivity means it does not readily react with oxygen, water, or other substances in the environment to form compounds \u2014 it therefore persists as the pure, uncombined (native) metal, requiring no chemical extraction process (only physical separation, e.g. panning).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Extraction of Iron \u2014 the Blast Furnace',su:'Examine the reactions and stages involved in extracting iron in a blast furnace.',steps:[
{lb:'Raw materials for the blast furnace',dr:dQ4,ht:'<p>The blast furnace uses three raw materials: IRON ORE (haematite, mainly Fe2O3), COKE (a form of carbon, made from coal), and LIMESTONE (calcium carbonate, CaCO3, which removes acidic impurities). Hot air is blasted into the bottom of the furnace to burn the coke, generating heat and reducing gases.</p>'},
{lb:'Reactions occurring in the furnace',dr:dQ4,ht:'<p>Key reactions (in order): (1) Coke burns in the hot air blast: C + O2 \u2192 CO2 (releasing heat). (2) CO2 reacts with more coke to form carbon monoxide: CO2 + C \u2192 2CO. (3) Carbon monoxide REDUCES the iron ore: Fe2O3 + 3CO \u2192 2Fe + 3CO2. Molten iron collects at the bottom of the furnace and is drawn off.</p>'},
{lb:'The role of limestone',dr:dQ4,ht:'<p>Limestone decomposes in the heat of the furnace: CaCO3 \u2192 CaO + CO2. The calcium oxide formed then reacts with SILICA (SiO2, an acidic impurity present in the iron ore) to form CALCIUM SILICATE (SLAG): CaO + SiO2 \u2192 CaSiO3. This molten slag floats on top of the denser molten iron and can be drawn off separately, removing impurities from the final iron product.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'In the blast furnace, iron oxide (Fe2O3) is reduced to iron by reacting with:',o:['Oxygen gas','Carbon monoxide (CO), formed from the reaction of coke with carbon dioxide','Limestone directly','Silica (SiO2)'],a:2,w:'Carbon monoxide (CO), generated when coke reacts with carbon dioxide inside the furnace (CO2+C\u21922CO), is the actual reducing agent that removes oxygen from iron oxide: Fe2O3+3CO\u21922Fe+3CO2.'},{q:'What is the main purpose of adding limestone to the blast furnace?',o:['To act as the primary fuel source','To decompose into calcium oxide, which reacts with acidic silica impurities to form slag, removing them from the molten iron','To directly reduce the iron ore','To cool down the furnace'],a:2,w:'Limestone decomposes (CaCO3\u2192CaO+CO2) and the calcium oxide produced reacts with silica impurities (an acidic oxide present in the ore) to form calcium silicate (slag): CaO+SiO2\u2192CaSiO3. This slag floats on the molten iron and can be removed separately, purifying the final iron product.'},{q:'Why does slag float on top of the molten iron in a blast furnace, allowing it to be removed separately?',o:['Slag has the same density as iron','Slag (calcium silicate) is LESS DENSE than the molten iron, so it naturally floats above it, allowing the two liquids to be tapped off separately','Slag is a gas, not a liquid','Iron floats on top of the slag instead'],a:2,w:'Molten slag (calcium silicate) has a lower density than molten iron, so it naturally separates and floats on top. This physical separation allows the slag (impurities) to be drawn off from the top of the furnace, while the purer molten iron is tapped from the bottom.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Environmental Impact of Industrial Chemistry',su:'Evaluate the environmental costs and benefits of industrial chemical processes.',steps:[
{lb:'Balancing benefits and costs',dr:dQ5,ht:'<p>Industrial chemical processes provide significant BENEFITS (fertilisers boost food production; metal extraction provides materials for construction, transport, technology) but also carry ENVIRONMENTAL COSTS (energy use and associated CO2 emissions, waste products, land disruption from mining, water/air pollution). WAEC often asks you to EVALUATE both sides for a given process.</p>'},
{lb:'Fertiliser runoff and eutrophication',dr:dQ5,ht:'<p>Excess fertiliser applied to farmland can be washed by rain into rivers/lakes (RUNOFF), introducing excess nitrates/phosphates into water bodies. This triggers EUTROPHICATION \u2014 explosive algal growth, followed by oxygen depletion as the algae die and decompose, harming aquatic life. Careful, measured fertiliser application (rather than excessive use) helps minimise this environmental damage.</p>'},
{lb:'Gas flaring and industrial waste',dr:dQ5,ht:'<p>In petroleum extraction, associated natural gas is sometimes "FLARED" (burned off) rather than captured for use, wasting a valuable energy resource and releasing greenhouse gases (CO2) with no economic benefit. Metal extraction/mining also generates significant WASTE ROCK and can cause land degradation, requiring careful environmental management and restoration after mining ends.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Excess nitrogen fertiliser washed into a river by rainfall can lead to which environmental problem?',o:['Ozone depletion','Eutrophication \u2014 excess nutrients trigger algal bloom, followed by oxygen depletion as the algae decompose, harming aquatic life','Acid rain','Global cooling'],a:2,w:'Fertiliser runoff introduces excess nitrates (and often phosphates) into water bodies, causing explosive algal growth (eutrophication). When the algae eventually die and decompose, the decomposition process consumes large amounts of dissolved oxygen, harming fish and other aquatic organisms.'},{q:'Gas flaring during petroleum extraction is considered environmentally problematic mainly because it:',o:['Produces useful electricity for nearby communities','Burns off a potentially valuable energy resource with no economic benefit while releasing greenhouse gases, rather than capturing the gas for productive use','Removes all pollutants from the extraction process','Has no chemical products at all'],a:2,w:'Flaring wastes the associated natural gas (a valuable fuel resource) by burning it off without capturing any useful energy, while still releasing CO2 and other pollutants into the atmosphere \u2014 an inefficient and environmentally damaging practice compared to capturing the gas for energy production.'},{q:'When evaluating an industrial chemical process for WAEC, you should typically consider:',o:['Only the economic benefits, ignoring environmental impact entirely','Both the BENEFITS (economic, social, practical) AND the environmental COSTS (pollution, energy use, waste), providing a balanced evaluation','Only the environmental costs, ignoring any benefits','Neither benefits nor costs, only the chemical equations involved'],a:2,w:'A proper WAEC-style evaluation requires considering BOTH sides: the practical/economic benefits a process provides (e.g. fertilisers boosting food production) AND the environmental costs involved (e.g. pollution, energy consumption, habitat disruption) to reach a balanced, well-reasoned judgement.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Chemistry, Industry and the Environment',su:'Integrated revision of the Haber process, metal extraction, and industrial environmental impact.',steps:[
{lb:'Haber process summary',dr:dQ1,ht:'<p>N2+3H2\u21cc2NH3 (exothermic, reversible). Conditions: 450\u00b0C (rate/yield compromise), 200atm (favours fewer gas moles, increases yield), Fe catalyst (speeds rate, no effect on yield). Product used for nitrogen-based fertilisers, essential for modern agriculture.</p>'},
{lb:'Metal extraction summary',dr:dQ3,ht:'<p>Very reactive metals (K,Na,Ca,Mg,Al): electrolysis. Moderately reactive metals (Zn,Fe): carbon/CO reduction (blast furnace for iron). Unreactive metals (Au,Ag): found native, no extraction needed. Method choice always depends on reactivity series position.</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: forgetting the Haber process conditions are COMPROMISES (not simply "the best" values for yield alone). Confusing which metals need electrolysis versus carbon reduction \u2014 always refer to reactivity series position. Forgetting limestone\u2019s role is to remove ACIDIC silica impurities (forming slag), not to reduce the iron ore itself (that is carbon monoxide\u2019s role).</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'In the blast furnace, which substance directly reduces iron oxide to iron metal?',o:['Limestone (CaCO3)','Carbon monoxide (CO)','Silica (SiO2)','Slag (CaSiO3)'],a:2,w:'Carbon monoxide is the actual reducing agent in the blast furnace: Fe2O3+3CO\u21922Fe+3CO2. Limestone\u2019s role is separate \u2014 it removes acidic silica impurities as slag, rather than reducing the iron oxide directly.'},{q:'Why is high pressure used in the Haber process, even though it is expensive to maintain?',o:['High pressure has no chemical benefit and is only used for tradition','It shifts equilibrium towards the product side (fewer gas moles), increasing ammonia yield, which justifies the cost for large-scale industrial production','High pressure only affects the rate, not the yield','Pressure prevents the reaction from occurring at all'],a:2,w:'Despite the cost of maintaining high pressure equipment, the increased ammonia yield (since fewer gas moles are favoured on the product side) makes the investment worthwhile for large-scale industrial ammonia production, balancing economic cost against increased output.'},{q:'A metal is extracted by heating its oxide with carbon, and the process works economically at industrial scale. This metal is most likely:',o:['Very reactive (e.g. sodium or potassium)','Moderately reactive (e.g. iron or zinc), since carbon is a sufficiently strong reducing agent for such metals, avoiding the higher cost of electrolysis','Extremely unreactive (e.g. gold)','Impossible to determine from this information'],a:2,w:'Carbon reduction is only effective (and used industrially) for moderately reactive metals, where carbon provides sufficient reducing power. Very reactive metals require electrolysis instead, while extremely unreactive metals like gold require no extraction at all (found native).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
