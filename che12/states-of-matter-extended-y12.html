<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'States of Matter and Particle Arrangement',[['State','Arrangement','Movement'],['Solid','Fixed, close together','Vibrate only'],['Liquid','Close, random','Slide past each other'],['Gas','Far apart, random','Move freely, fast']]);}
function dQ2(p){drawTable(p,'Changes of State',[['Change','Name','Energy'],['Solid\u2192Liquid','Melting','Absorbed'],['Liquid\u2192Gas','Boiling/Evaporation','Absorbed'],['Gas\u2192Liquid','Condensation','Released'],['Liquid\u2192Solid','Freezing','Released']]);}
function dQ3(p){drawTable(p,'Boyle\u2019s Law \u2014 Constant Temperature',[['Volume (dm3)','Pressure (kPa)','PxV'],['1.0','200','200'],['2.0','100','200'],['4.0','50','200']]);}
function dQ4(p){drawTable(p,'Charles\u2019s Law \u2014 Constant Pressure',[['Temperature (K)','Volume (dm3)','V/T'],['200','1.0','0.005'],['400','2.0','0.005'],['600','3.0','0.005']]);}
function dQ5(p){drawTable(p,'Diffusion and Kinetic Theory',[['Observation','Explanation'],['Gases diffuse fastest','Particles move fastest, most spread out'],['Liquids diffuse slower','Particles closer, more collisions'],['Solids barely diffuse','Particles fixed in place, only vibrate']]);}
function dQ6(p){drawTable(p,'WAEC States of Matter Summary',[['Law','Relationship'],['Boyle\u2019s Law','P x V = constant (fixed T)'],['Charles\u2019s Law','V / T = constant (fixed P)'],['Kinetic theory','Explains states via particle energy/spacing']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Kinetic Theory and States of Matter',su:'Explain the properties of solids, liquids and gases using kinetic theory.',steps:[
{lb:'Particle arrangement in each state',dr:dQ1,ht:'<p><b>Kinetic theory</b> explains states of matter by particle arrangement and energy. SOLIDS: particles are fixed in position, closely packed, and only VIBRATE (no translational movement) \u2014 giving solids a fixed shape and volume. LIQUIDS: particles are close together but can move/slide past each other randomly \u2014 giving liquids a fixed volume but no fixed shape (takes the shape of its container). GASES: particles are far apart and move rapidly and randomly in all directions \u2014 giving gases no fixed shape or volume (expand to fill any container).</p>'},
{lb:'Energy and changes of state',dr:dQ1,ht:'<p>Changes of state involve energy transfer WITHOUT a change in temperature during the actual change (energy goes into breaking/forming intermolecular forces, not increasing kinetic energy, so temperature stays constant at the melting/boiling point until the change is complete). Melting and boiling ABSORB energy (particles gain enough energy to overcome the forces holding them in a more ordered state). Freezing and condensation RELEASE energy (particles lose energy, forces pull them into a more ordered state).</p>'},
{lb:'Explaining physical properties',dr:dQ1,ht:'<p>Kinetic theory explains: why gases can be compressed easily (particles are far apart, large empty space between them) but liquids/solids cannot (particles already closely packed). Why gases diffuse fastest (particles move fastest with most space to travel through) and solids essentially do not diffuse (particles fixed in place, no translational movement).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'In a solid, particles:',o:['Move freely throughout the container','Are fixed in position and can only vibrate, giving the solid a fixed shape and volume','Are far apart with no forces between them','Change position rapidly and randomly'],a:2,w:'In a solid, strong forces hold particles in fixed positions in a regular arrangement. They can only vibrate about these fixed points, which is why solids maintain a definite shape and volume.'},{q:'Why can gases be compressed much more easily than liquids or solids?',o:['Gas particles are heavier','Gas particles are far apart with large empty spaces between them, which can be reduced by applying pressure','Gas particles have no mass','Liquids and solids have no particles at all'],a:2,w:'In a gas, particles are spread far apart with a lot of empty space between them. Applying pressure can push these particles closer together (reducing volume), unlike in liquids or solids where particles are already closely packed with little room to compress further.'},{q:'During melting, the temperature of a substance stays constant even though energy is being absorbed. Why?',o:['No energy is actually being absorbed','The absorbed energy is used to overcome the forces holding particles in the solid\'s fixed arrangement, rather than increasing the particles\' kinetic energy (which would raise temperature)','Melting does not require any energy','Temperature always increases during melting'],a:2,w:'During a change of state, energy input goes into breaking (or forming) the intermolecular forces between particles, changing their arrangement/energy state, rather than increasing their kinetic energy. Since temperature is a measure of average kinetic energy, it remains constant throughout the change until the process is complete.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Boyle\u2019s Law',su:'Apply Boyle\u2019s Law to relate pressure and volume of a fixed mass of gas at constant temperature.',steps:[
{lb:'Statement of Boyle\u2019s Law',dr:dQ3,ht:'<p><b>Boyle\u2019s Law</b>: for a FIXED MASS of gas at CONSTANT TEMPERATURE, pressure is INVERSELY proportional to volume: P1V1 = P2V2. As volume decreases, pressure increases (and vice versa) \u2014 explained by kinetic theory: compressing the gas into a smaller volume means particles collide with the container walls more frequently, increasing pressure.</p>'},
{lb:'Using the formula',dr:dQ3,ht:'<p>Worked example: a gas occupies 4.0 dm3 at 100 kPa. What is its new volume if the pressure increases to 200 kPa (constant temperature)? P1V1=P2V2: 100x4.0 = 200xV2. V2 = 400/200 = 2.0 dm3. Notice volume HALVED when pressure DOUBLED \u2014 the inverse relationship.</p>'},
{lb:'Kinetic theory explanation',dr:dQ3,ht:'<p>Why does decreasing volume increase pressure? At constant temperature, gas particles have the same average kinetic energy (same average speed). Squeezing the same number of particles into a smaller volume means they hit the container walls MORE OFTEN (more frequent collisions per second), which increases the measured pressure \u2014 without any change in particle speed or temperature.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'A gas has a volume of 6.0 dm3 at a pressure of 100 kPa. What is its volume if the pressure is increased to 300 kPa (constant temperature)?',o:['2.0 dm3 (P1V1=P2V2: 100x6.0=300xV2; V2=600/300)','6.0 dm3','18 dm3','3.0 dm3'],a:1,w:'Using Boyle\u2019s Law: P1V1=P2V2. 100x6.0=300xV2. V2=600/300=2.0 dm3. As expected, tripling the pressure reduces the volume to one third.'},{q:'Boyle\u2019s Law applies specifically under which condition?',o:['Constant volume','Constant temperature, with a fixed mass of gas','Constant pressure','No conditions are required'],a:2,w:'Boyle\u2019s Law (P1V1=P2V2) specifically describes the relationship between pressure and volume ONLY when temperature is held constant and the mass (amount) of gas does not change.'},{q:'Compressing a gas into a smaller volume (at constant temperature) increases pressure because:',o:['The particles move faster','The same number of particles collide with the container walls more frequently in the smaller space, without any change in their average speed','The particles become heavier','Temperature automatically increases during compression'],a:2,w:'At constant temperature, particle speed (kinetic energy) does not change. However, confining the same number of particles to a smaller volume means they strike the container walls more often per second, which is measured as an increase in pressure.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Charles\u2019s Law',su:'Apply Charles\u2019s Law to relate volume and temperature of a fixed mass of gas at constant pressure.',steps:[
{lb:'Statement of Charles\u2019s Law',dr:dQ4,ht:'<p><b>Charles\u2019s Law</b>: for a FIXED MASS of gas at CONSTANT PRESSURE, volume is DIRECTLY proportional to absolute temperature (in Kelvin): V1/T1 = V2/T2. As temperature increases, volume increases proportionally (at constant pressure).</p>'},
{lb:'Using the formula (with Kelvin conversion)',dr:dQ4,ht:'<p>IMPORTANT: temperature MUST be in KELVIN (K = \u00b0C + 273) for this formula to work correctly. Worked example: a gas occupies 2.0 dm3 at 27\u00b0C (300 K). What is its volume at 127\u00b0C (400 K), constant pressure? V1/T1=V2/T2: 2.0/300 = V2/400. V2 = (2.0x400)/300 = 2.67 dm3.</p>'},
{lb:'Kinetic theory explanation',dr:dQ4,ht:'<p>Why does increasing temperature increase volume (at constant pressure)? Higher temperature gives particles more kinetic energy (they move faster). For pressure to stay CONSTANT despite faster-moving particles (which would otherwise hit the walls harder/more often, increasing pressure), the gas must EXPAND (increase volume) so that particles have further to travel between wall collisions, keeping the collision frequency/force per unit area (pressure) unchanged.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'A gas has a volume of 3.0 dm3 at 200 K. What is its volume at 400 K (constant pressure)?',o:['1.5 dm3','3.0 dm3','6.0 dm3 (V1/T1=V2/T2: 3.0/200=V2/400; V2=1200/200)','12 dm3'],a:3,w:'V1/T1=V2/T2: 3.0/200=V2/400. V2 = (3.0x400)/200 = 1200/200 = 6.0 dm3. Doubling the absolute temperature doubles the volume (at constant pressure), confirming the direct proportionality.'},{q:'Why must temperature be converted to KELVIN before using Charles\u2019s Law?',o:['Celsius is always more accurate','The relationship V/T=constant only holds true for ABSOLUTE temperature (Kelvin), since Celsius has an arbitrary zero point that would give incorrect (or even negative) results','Kelvin and Celsius give identical numerical results','Charles\u2019s Law does not involve temperature at all'],a:2,w:'Charles\u2019s Law is based on the direct proportionality between volume and ABSOLUTE temperature. Since Celsius has an arbitrary zero (not true zero energy), using Celsius directly in the formula would give physically incorrect results (e.g. implying volume could be negative or zero at 0\u00b0C, which is not true).'},{q:'A gas at constant pressure is heated. Its volume increases because:',o:['The number of gas particles increases','Particles gain more kinetic energy (move faster); for pressure to remain constant, the gas expands so collision frequency/force per unit area on the walls stays the same','Pressure decreases automatically','The particles become smaller'],a:2,w:'Heating increases particle speed, which would otherwise increase the frequency and force of wall collisions (raising pressure). For pressure to stay constant, the gas must expand (increase volume), spreading the same energetic particles over a larger space so the pressure effect balances out.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Diffusion and Evidence for Particle Theory',su:'Examine diffusion as evidence for the kinetic theory of matter.',steps:[
{lb:'What is diffusion',dr:dQ5,ht:'<p><b>Diffusion</b> is the net movement of particles from an area of HIGH concentration to an area of LOW concentration, due to their random motion, until evenly spread throughout the available space. It occurs in gases and liquids (where particles can move freely) but is negligible in solids (where particles are fixed in position, only vibrating).</p>'},
{lb:'Rate of diffusion',dr:dQ5,ht:'<p>Diffusion is FASTEST in gases (particles move fastest, with the most space to travel through, and lowest density of obstruction). It is SLOWER in liquids (particles closer together, more frequent collisions slow overall progress). Rate of diffusion is also affected by the MASS of the particles \u2014 lighter particles diffuse faster than heavier ones at the same temperature (they move faster on average for the same amount of kinetic energy).</p>'},
{lb:'Diffusion as evidence for particle theory',dr:dQ5,ht:'<p>The observable phenomenon of diffusion (e.g. a strong smell spreading across a room, or purple potassium manganate(VII) crystals gradually colouring an entire beaker of water without stirring) provides direct experimental EVIDENCE that particles are in constant, random motion \u2014 supporting the kinetic theory model of matter, since a static (non-moving) particle model could not explain this observed spreading.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Diffusion occurs fastest in which state of matter?',o:['Solids','Liquids','Gases \u2014 particles move fastest and have the most space to travel through with fewest collisions','Diffusion occurs at the same rate in all states'],a:2,w:'Gas particles move much faster than liquid particles and have far more space between them (fewer collisions to slow their progress), so diffusion (net spreading from high to low concentration) occurs fastest in gases.'},{q:'Why do LIGHTER gas particles typically diffuse faster than heavier ones at the same temperature?',o:['Lighter particles have less kinetic energy','At the same temperature, all particles have the same average kinetic energy, but since KE=\u00bdmv2, lighter particles (smaller m) must have a higher average speed (v) to have the same KE, so they diffuse faster','Lighter particles are more concentrated','Heavier particles have no kinetic energy at all'],a:2,w:'At a given temperature, all gas particles share the same average kinetic energy. Since kinetic energy = \u00bdmv\u00b2, a particle with a smaller mass (m) must have a correspondingly higher velocity (v) to have the same kinetic energy as a heavier particle \u2014 explaining why lighter gases diffuse faster.'},{q:'Purple potassium manganate(VII) crystals gradually colour an entire beaker of still water without stirring. This observation provides evidence that:',o:['Water molecules are stationary','Particles are in constant, random motion, spreading (diffusing) from an area of high concentration to low concentration even without any external mixing/stirring','Potassium manganate does not dissolve in water','Colour changes have nothing to do with particle movement'],a:2,w:'Since no stirring was applied, the gradual, even spreading of the purple colour throughout the water can only be explained by the random, constant movement of dissolved particles (diffusion) \u2014 direct experimental evidence supporting the kinetic theory of matter.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Combining Boyle\u2019s and Charles\u2019s Laws',su:'Solve gas problems where both pressure and temperature change simultaneously.',steps:[
{lb:'The combined gas law',dr:dQ2,ht:'<p>When BOTH pressure and temperature change for a fixed mass of gas, Boyle\u2019s and Charles\u2019s Laws combine into: P1V1/T1 = P2V2/T2. This allows any TWO of the three variables (P, V, T) between two states of the same gas sample to be related, as long as the amount of gas (moles) stays fixed.</p>'},
{lb:'Worked example',dr:dQ2,ht:'<p>A gas occupies 2.0 dm3 at 100 kPa and 300 K. Find its volume at 200 kPa and 400 K. P1V1/T1=P2V2/T2: (100x2.0)/300 = (200xV2)/400. 200/300 = 200V2/400. Cross-multiply: 200x400 = 300x200xV2. 80000=60000V2. V2 = 80000/60000 = 1.33 dm3.</p>'},
{lb:'Checking the answer makes physical sense',dr:dQ2,ht:'<p>Always sanity-check: pressure DOUBLED (100\u2192200 kPa), which alone would HALVE the volume (Boyle\u2019s Law). Temperature increased (300\u2192400 K, a factor of 4/3), which alone would INCREASE volume by that same factor (Charles\u2019s Law). Combined effect: 2.0 x (1/2) x (4/3) = 2.0 x 2/3 = 1.33 dm3 \u2014 matches the calculation, confirming it is reasonable.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'A gas occupies 4.0 dm3 at 100 kPa and 200 K. What is its volume at 200 kPa and 400 K?',o:['2.0 dm3','4.0 dm3 (pressure doubling halves volume; temperature doubling doubles volume \u2014 the two effects cancel out)','8.0 dm3','1.0 dm3'],a:2,w:'Using P1V1/T1=P2V2/T2: (100x4.0)/200 = (200xV2)/400. 2.0 = V2/2. V2=4.0 dm3. Since both pressure and temperature doubled, their opposing effects on volume (halving vs doubling) exactly cancel, leaving volume unchanged.'},{q:'The combined gas law (P1V1/T1=P2V2/T2) is used specifically when:',o:['Only pressure changes, temperature is constant','Only temperature changes, pressure is constant','BOTH pressure and temperature change simultaneously for a fixed mass of gas','The amount of gas (moles) is also changing'],a:2,w:'When only ONE variable (P or T) changes, Boyle\u2019s or Charles\u2019s Law alone suffices. The COMBINED gas law is needed specifically when both pressure and temperature change at the same time for a fixed amount of gas.'},{q:'When applying the combined gas law, which quantity must remain FIXED for the equation to be valid?',o:['Pressure','Temperature','The mass (amount, in moles) of gas being considered','Volume'],a:2,w:'The combined gas law relates P, V and T for a SPECIFIC, unchanging AMOUNT of gas. If gas is added or removed from the system, this relationship no longer holds without further adjustment (this is where the full ideal gas equation PV=nRT becomes necessary).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 States of Matter (Extended)',su:'Integrated revision of kinetic theory, gas laws, and diffusion.',steps:[
{lb:'Kinetic theory summary',dr:dQ1,ht:'<p>Solids: fixed particles, vibrate only, fixed shape/volume. Liquids: close particles, can move/slide, fixed volume, no fixed shape. Gases: far apart, move freely and fast, no fixed shape/volume. Changes of state absorb energy (melting, boiling) or release energy (freezing, condensation) without a temperature change during the process itself.</p>'},
{lb:'Gas laws summary',dr:dQ6,ht:'<p>Boyle\u2019s Law: PV=constant (fixed T) \u2014 pressure and volume are inversely proportional. Charles\u2019s Law: V/T=constant (fixed P) \u2014 volume and absolute temperature are directly proportional (ALWAYS use Kelvin). Combined gas law: P1V1/T1=P2V2/T2, used when both P and T change for a fixed mass of gas.</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: using Celsius instead of Kelvin in Charles\u2019s Law or the combined gas law calculations. Forgetting Boyle\u2019s Law requires CONSTANT temperature, and Charles\u2019s Law requires CONSTANT pressure. Confusing diffusion rate trends (gases fastest, liquids slower, solids negligible) or forgetting that lighter particles diffuse faster than heavier ones at the same temperature.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'A fixed mass of gas at constant temperature has its volume reduced from 8.0 dm3 to 2.0 dm3. If the original pressure was 50 kPa, the new pressure is:',o:['12.5 kPa','50 kPa','200 kPa (P1V1=P2V2: 50x8.0=P2x2.0; P2=400/2.0)','800 kPa'],a:3,w:'P1V1=P2V2: 50x8.0=P2x2.0. 400=2.0xP2. P2=400/2.0=200 kPa. Volume was quartered, so pressure quadruples (inversely proportional), consistent with Boyle\u2019s Law.'},{q:'Why does a fixed mass of gas at constant pressure expand when heated?',o:['The number of particles increases','Particles gain kinetic energy and move faster; the gas must expand to keep the collision frequency/force per unit area (pressure) constant','Pressure automatically decreases with heating','Gas particles shrink in size when heated'],a:2,w:'At constant pressure, as temperature rises particles move faster. To prevent this from increasing pressure (more frequent/forceful wall collisions), the gas expands, spreading the same energetic particles over a larger volume so that the pressure remains unchanged \u2014 this is Charles\u2019s Law in action.'},{q:'Which correctly ranks the typical rate of diffusion from FASTEST to SLOWEST?',o:['Solids > Liquids > Gases','Liquids > Gases > Solids','Gases > Liquids > Solids (solids essentially do not diffuse, as particles are fixed in place)','All three states diffuse at identical rates'],a:2,w:'Gas particles move fastest with the most space between them, giving the fastest diffusion. Liquid particles are more closely packed with more frequent collisions, diffusing more slowly. Solid particles are fixed in position (only vibrating), so diffusion is essentially negligible.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
