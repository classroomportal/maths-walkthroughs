<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Oxidation and Reduction (OIL RIG)',[['Process','Electron change','Oxidation number'],['Oxidation','Loss of electrons','Increases'],['Reduction','Gain of electrons','Decreases']]);}
function dQ2(p){drawTable(p,'The Reactivity Series (selected)',[['Metal','Reactivity'],['Potassium','Most reactive'],['Zinc','Moderate'],['Copper','Less reactive'],['Gold','Least reactive']]);}
function dQ3(p){drawTable(p,'Displacement Reaction Example',[['Reactants','Products','Explanation'],['Zn + CuSO4','ZnSO4 + Cu','Zn more reactive, displaces Cu']]);}
function dQ4(p){drawTable(p,'Oxidation Number Rules (basic)',[['Rule','Value'],['Uncombined element','0'],['Simple ion','Equals charge'],['Oxygen (usual)','-2'],['Hydrogen (usual)','+1']]);}
function dQ5(p){drawTable(p,'Oxidising and Reducing Agents',[['Term','Role'],['Oxidising agent','Causes oxidation, itself reduced'],['Reducing agent','Causes reduction, itself oxidised']]);}
function dQ6(p){drawTable(p,'WAEC Redox Summary',[['Concept','Key point'],['OIL RIG','Oxidation Is Loss, Reduction Is Gain'],['Reactivity series','More reactive metal displaces less reactive'],['Oxidation number','Tracks electron loss/gain']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Oxidation and Reduction (OIL RIG)',su:'Define oxidation and reduction in terms of electron transfer.',steps:[
{lb:'Defining oxidation and reduction',dr:dQ1,ht:'<p><b>OIL RIG</b>: Oxidation Is Loss (of electrons); Reduction Is Gain (of electrons). A substance that LOSES electrons is OXIDISED. A substance that GAINS electrons is REDUCED. These two processes always occur TOGETHER in a single reaction \u2014 this is why such reactions are called REDOX (reduction+oxidation) reactions.</p>'},
{lb:'Example \u2014 displacement reaction',dr:dQ1,ht:'<p>Zn + CuSO4 \u2192 ZnSO4 + Cu. Zinc atoms LOSE electrons to form Zn2+ ions (Zn \u2192 Zn2+ + 2e-) \u2014 zinc is OXIDISED. Copper ions GAIN electrons to form copper atoms (Cu2+ + 2e- \u2192 Cu) \u2014 copper ions are REDUCED. Both half-reactions occur simultaneously, and the electrons lost by zinc are exactly the electrons gained by copper.</p>'},
{lb:'Identifying oxidation and reduction from oxidation number',dr:dQ1,ht:'<p>Oxidation can also be identified by an INCREASE in oxidation number (loss of electrons makes a species more positive). Reduction is identified by a DECREASE in oxidation number (gain of electrons makes a species more negative/less positive). Example: Zn (0) \u2192 Zn2+ (+2) is an increase \u2014 oxidation. Cu2+ (+2) \u2192 Cu (0) is a decrease \u2014 reduction.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'According to OIL RIG, oxidation is defined as:',o:['Gain of electrons','Loss of electrons','Gain of protons','Loss of neutrons'],a:2,w:'OIL RIG: Oxidation Is Loss (of electrons). A species that loses electrons during a reaction is said to be oxidised.'},{q:'In the reaction Zn + CuSO4 \u2192 ZnSO4 + Cu, which species is REDUCED?',o:['Zinc metal (Zn)','Copper ions (Cu2+), which gain electrons to become copper atoms (Cu)','Sulfate ions (SO4 2-)','Neither species is reduced'],a:2,w:'Cu2+ + 2e- \u2192 Cu: copper ions GAIN electrons to form copper metal, which is a decrease in oxidation number (from +2 to 0) \u2014 this is reduction, following the "Reduction Is Gain" part of OIL RIG.'},{q:'Why must oxidation and reduction always occur TOGETHER in the same reaction?',o:['They do not need to occur together','Electrons lost by the species being oxidised must be gained by another species (which is thereby reduced) \u2014 electrons cannot simply disappear or appear from nowhere','Oxidation always happens before reduction, with a time delay','Reduction can occur completely independently of oxidation'],a:2,w:'Since electrons cannot be created or destroyed, any electrons lost by one species (oxidation) must be gained by another species (reduction) in the same reaction \u2014 this is why oxidation and reduction always occur simultaneously, together forming a "redox" reaction.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'The Reactivity Series',su:'Use the reactivity series to predict displacement reactions and metal reactivity.',steps:[
{lb:'The reactivity series',dr:dQ2,ht:'<p>The <b>reactivity series</b> ranks metals in order of how readily they lose electrons to form positive ions (their reactivity). Common order (most to least reactive): potassium, sodium, calcium, magnesium, zinc, iron, (hydrogen), copper, silver, gold. More reactive metals lose electrons more easily and react more vigorously with water, acids, and other metal compounds.</p>'},
{lb:'Displacement reactions',dr:dQ2,ht:'<p>A MORE reactive metal can DISPLACE a LESS reactive metal from a compound (usually a solution of its salt). Example: Zn (more reactive) + CuSO4 (contains less reactive Cu) \u2192 ZnSO4 + Cu (Cu is displaced/pushed out as the metal, while Zn takes its place as the ion). This only works in ONE direction \u2014 copper CANNOT displace zinc from zinc sulfate, since copper is LESS reactive.</p>'},
{lb:'Using reactivity to predict reactions',dr:dQ2,ht:'<p>To predict whether a displacement reaction will occur: compare the positions of the two metals in the reactivity series. If the FREE metal is MORE reactive than the metal in the compound, displacement WILL occur. If the free metal is LESS reactive, NO reaction occurs. This principle is used practically to extract metals, in metal cleaning/plating, and in explaining corrosion protection (sacrificial metals).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Will iron displace copper from copper sulfate solution?',o:['No, since copper is more reactive than iron','Yes \u2014 iron is more reactive than copper, so it will displace copper from solution, forming iron sulfate and copper metal','Iron and copper have identical reactivity','This cannot be predicted from the reactivity series'],a:2,w:'Iron is positioned ABOVE copper in the reactivity series (more reactive). A more reactive metal can displace a less reactive metal from its compound, so iron will displace copper: Fe+CuSO4\u2192FeSO4+Cu.'},{q:'Why can copper NOT displace zinc from zinc sulfate solution?',o:['Copper and zinc have identical reactivity','Copper is LESS reactive than zinc, and only a MORE reactive metal can displace a less reactive one from its compound \u2014 the reverse does not occur','Zinc sulfate does not exist as a real compound','Displacement reactions never occur with zinc'],a:2,w:'Displacement only proceeds in the direction where a MORE reactive metal displaces a LESS reactive one. Since copper is below zinc in the reactivity series (less reactive), it cannot displace the more reactive zinc from its compound.'},{q:'The reactivity series ranks metals according to:',o:['Their atomic mass only','How readily they lose electrons to form positive ions (their general chemical reactivity)','Their melting point','Their colour'],a:2,w:'The reactivity series is fundamentally based on how easily each metal loses electrons to form cations \u2014 more reactive metals lose electrons more readily, which determines their behaviour in reactions with water, acids, and displacement reactions with other metal compounds.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Oxidation Numbers (Introductory)',su:'Assign oxidation numbers to atoms and ions using basic rules.',steps:[
{lb:'Basic oxidation number rules',dr:dQ4,ht:'<p>Rules for assigning OXIDATION NUMBER: an UNCOMBINED element (in its natural form, e.g. Zn, O2, Cl2) has oxidation number 0. A SIMPLE (monoatomic) ION has an oxidation number EQUAL to its charge (e.g. Na+ = +1, Cl- = -1, Mg2+ = +2). Oxygen is USUALLY -2 in compounds (exception: peroxides, -1). Hydrogen is USUALLY +1 in compounds (exception: metal hydrides, -1).</p>'},
{lb:'Using oxidation numbers to track redox',dr:dQ4,ht:'<p>Oxidation number changes track electron transfer: an INCREASE in oxidation number = OXIDATION (loss of electrons, becomes more positive). A DECREASE in oxidation number = REDUCTION (gain of electrons, becomes less positive/more negative). This method works even for reactions between covalent compounds, where a full electron transfer language is less intuitive.</p>'},
{lb:'Worked example',dr:dQ4,ht:'<p>In the reaction Zn + CuSO4 \u2192 ZnSO4 + Cu: Zn goes from 0 (element) to +2 (in ZnSO4) \u2014 INCREASE, so Zn is OXIDISED. Cu goes from +2 (in CuSO4) to 0 (element) \u2014 DECREASE, so Cu2+ is REDUCED. This confirms the electron-transfer description given earlier, using oxidation numbers as an alternative tracking method.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'What is the oxidation number of an uncombined element, such as pure iron metal (Fe)?',o:['+2','+3','0 \u2014 uncombined elements always have an oxidation number of zero','-1'],a:2,w:'Any element in its natural, uncombined form (not part of a compound or ion) has an oxidation number of 0, since it has neither gained nor lost electrons relative to its neutral atomic state.'},{q:'What is the oxidation number of Na+ in NaCl?',o:['0','+1 \u2014 for a simple (monoatomic) ion, oxidation number equals its charge','-1','+2'],a:2,w:'For simple (monoatomic) ions, the oxidation number is simply equal to the charge on the ion. Since Na+ has a charge of +1, its oxidation number is also +1.'},{q:'In the reaction Mg + CuCl2 \u2192 MgCl2 + Cu, magnesium goes from oxidation number 0 to +2. This change represents:',o:['Reduction, since the number increased','Oxidation \u2014 an INCREASE in oxidation number indicates loss of electrons (oxidation)','No chemical change at all','A change that cannot be classified'],a:2,w:'An increase in oxidation number (here, 0 to +2) indicates that magnesium has LOST electrons (2 electrons, to form Mg2+), which is the definition of oxidation \u2014 consistent with magnesium being more reactive and displacing copper.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Oxidising and Reducing Agents',su:'Identify oxidising and reducing agents in a redox reaction.',steps:[
{lb:'Defining oxidising and reducing agents',dr:dQ5,ht:'<p>An <b>oxidising agent</b> CAUSES another substance to be oxidised (by accepting electrons from it) \u2014 in doing so, the oxidising agent itself is REDUCED (gains electrons). A <b>reducing agent</b> CAUSES another substance to be reduced (by donating electrons to it) \u2014 in doing so, the reducing agent itself is OXIDISED (loses electrons).</p>'},
{lb:'Identifying agents in a reaction',dr:dQ5,ht:'<p>Example: Zn + CuSO4 \u2192 ZnSO4 + Cu. Zinc DONATES electrons to Cu2+ (causing Cu2+ to be reduced) \u2014 so zinc is the REDUCING AGENT (and is itself oxidised). Cu2+ ACCEPTS electrons from zinc (causing Zn to be oxidised) \u2014 so Cu2+ is the OXIDISING AGENT (and is itself reduced).</p>'},
{lb:'Common oxidising and reducing agents',dr:dQ5,ht:'<p>Common OXIDISING agents (accept electrons, get reduced): oxygen, chlorine, potassium manganate(VII) (acidified). Common REDUCING agents (donate electrons, get oxidised): reactive metals (Zn, Mg, Fe), carbon, hydrogen, carbon monoxide. In industrial extraction of metals, carbon/carbon monoxide often acts as the reducing agent to reduce metal oxides to the pure metal.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'In the reaction Zn + CuSO4 \u2192 ZnSO4 + Cu, which species is the OXIDISING AGENT?',o:['Zinc (Zn)','Copper ions (Cu2+), since they accept electrons from zinc, causing zinc to be oxidised, while Cu2+ itself is reduced','Sulfate ions','Zinc sulfate'],a:2,w:'The oxidising agent is the species that CAUSES oxidation of another substance by accepting electrons from it. Here, Cu2+ accepts electrons from Zn (causing Zn to be oxidised), while Cu2+ itself is reduced to Cu \u2014 making Cu2+ the oxidising agent.'},{q:'A reducing agent is best described as a substance that:',o:['Accepts electrons and is itself reduced','Donates electrons to another substance (causing that substance to be reduced), while the reducing agent itself is oxidised','Never participates in electron transfer','Always contains oxygen'],a:2,w:'A reducing agent GIVES electrons to another substance, causing that substance to be REDUCED. In doing so, the reducing agent loses electrons and is itself OXIDISED \u2014 this is the defining behaviour of a reducing agent.'},{q:'In the extraction of iron from iron oxide using carbon (Fe2O3 + 3CO \u2192 2Fe + 3CO2), carbon monoxide (CO) acts as the:',o:['Oxidising agent','Reducing agent \u2014 it donates electrons (via oxygen removal) to reduce iron oxide to iron metal, while CO itself is oxidised to CO2','Catalyst','Neither an oxidising nor reducing agent'],a:2,w:'Carbon monoxide removes oxygen from iron oxide (reducing Fe2O3 to Fe), while CO itself is oxidised to CO2 in the process. Since CO causes the reduction of iron oxide while being oxidised itself, it is acting as the REDUCING AGENT in this extraction reaction.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Redox in Everyday Contexts',su:'Examine redox reactions in rusting, combustion and industrial extraction.',steps:[
{lb:'Rusting as a redox process',dr:dQ1,ht:'<p><b>Rusting</b> of iron is a redox reaction: iron is OXIDISED (Fe \u2192 Fe2+ + 2e-, loses electrons) while oxygen (from air, dissolved in water) is REDUCED (O2 + 2H2O + 4e- \u2192 4OH-, gains electrons). The Fe2+ formed is further oxidised and combines with water to form hydrated iron(III) oxide (rust, Fe2O3.xH2O). Both water AND oxygen must be present for rusting to occur.</p>'},
{lb:'Combustion as a redox process',dr:dQ1,ht:'<p><b>Combustion</b> (burning) is also a redox reaction \u2014 the fuel is OXIDISED (loses electrons, often forming CO2 and H2O), while oxygen is REDUCED (gains electrons, forming oxide ions in the products). Example: burning methane, CH4 + 2O2 \u2192 CO2 + 2H2O, is a redox process even though it is not usually described using electron-transfer language explicitly at this level.</p>'},
{lb:'Industrial metal extraction as redox',dr:dQ2,ht:'<p>Extracting metals from their ores often involves REDUCTION of the metal ion/oxide to the pure metal. Example: iron extraction, Fe2O3 + 3CO \u2192 2Fe + 3CO2 (iron is reduced from +3 to 0 oxidation state, using carbon monoxide as the reducing agent). More reactive metals (above carbon in reactivity) require a DIFFERENT reduction method (electrolysis), since carbon cannot reduce them.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Rusting of iron is classified as a redox reaction because:',o:['No electron transfer is involved','Iron is oxidised (loses electrons to form Fe2+/Fe3+) while oxygen is reduced (gains electrons), both occurring simultaneously','Only oxidation occurs, with no reduction taking place','Rusting does not actually involve iron at all'],a:2,w:'Rusting involves iron losing electrons (being oxidised to Fe2+, then further to Fe3+ in rust) while oxygen (from air/water) gains electrons (being reduced) \u2014 both processes occurring together, making rusting a genuine redox reaction.'},{q:'Which two conditions are BOTH required for iron to rust?',o:['Only oxygen is needed','Only water is needed','BOTH oxygen AND water must be present together for rusting to occur','Neither oxygen nor water is needed'],a:2,w:'Rusting requires the redox reaction between iron and oxygen, which specifically needs water present as well to enable the full reaction pathway (forming hydroxide ions and eventually hydrated iron oxide/rust) \u2014 iron in dry air, or in water with no oxygen, does not rust significantly.'},{q:'In the extraction Fe2O3 + 3CO \u2192 2Fe + 3CO2, why can carbon monoxide NOT be used to extract very reactive metals like aluminium or potassium?',o:['Carbon monoxide can reduce any metal oxide equally well','Very reactive metals bind their oxygen far more strongly than iron does, so carbon monoxide (a relatively weak reducing agent) cannot remove their oxygen; a stronger method like electrolysis is needed instead','Aluminium and potassium do not form oxides','Carbon monoxide is too expensive to use industrially'],a:2,w:'More reactive metals hold onto oxygen much more strongly in their oxides. Carbon monoxide is not a strong enough reducing agent to remove oxygen from very reactive metal oxides (like Al2O3 or K2O), so a more powerful method \u2014 electrolysis \u2014 is required to extract these metals instead.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Redox Reactions (Extended)',su:'Integrated revision of oxidation, reduction, reactivity series and oxidising/reducing agents.',steps:[
{lb:'Core redox concepts summary',dr:dQ6,ht:'<p>OIL RIG: oxidation=loss of electrons (increase in oxidation number); reduction=gain of electrons (decrease in oxidation number). Both always occur together in a redox reaction. Reactivity series predicts displacement reactions (more reactive metal displaces less reactive one from its compound).</p>'},
{lb:'Agents summary',dr:dQ6,ht:'<p>Oxidising agent: accepts electrons, causes oxidation of another substance, is itself reduced. Reducing agent: donates electrons, causes reduction of another substance, is itself oxidised. Common examples: O2/Cl2 as oxidising agents; reactive metals/carbon/CO/H2 as reducing agents.</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: confusing which species is "oxidised" versus which is the "oxidising agent" (the oxidising agent is the species that CAUSES oxidation while itself being reduced \u2014 it is easy to mix these up). Getting the direction of displacement reactions backwards (only a MORE reactive metal can displace a LESS reactive one, never the reverse). Forgetting rusting needs BOTH oxygen and water.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'In the reaction Mg + 2HCl \u2192 MgCl2 + H2, which species is REDUCED?',o:['Magnesium (Mg), since it loses electrons','Hydrogen ions (H+), which gain electrons to form H2 gas \u2014 a decrease in oxidation number from +1 to 0','Chloride ions (Cl-)','No reduction occurs in this reaction'],a:2,w:'H+ ions (oxidation number +1) gain electrons to form H2 gas (oxidation number 0) \u2014 a decrease in oxidation number, confirming reduction. Meanwhile, Mg is oxidised (0 to +2), losing the electrons that reduce the H+ ions.'},{q:'Which of these is a common OXIDISING agent?',o:['Reactive metals like zinc','Carbon monoxide','Chlorine (Cl2), which readily accepts electrons and is reduced to Cl-','Hydrogen gas'],a:2,w:'Chlorine is a strong oxidising agent \u2014 it readily accepts electrons from other substances (being reduced itself to Cl-), causing those other substances to be oxidised. Reactive metals, carbon monoxide, and hydrogen are typically reducing agents instead.'},{q:'Would you expect silver to displace copper from copper sulfate solution?',o:['Yes, since silver is more reactive than copper','No \u2014 silver is LESS reactive than copper in the reactivity series, so it cannot displace the more reactive copper from its compound','Silver and copper are equally reactive, so a partial reaction occurs','This cannot be determined without further information'],a:2,w:'In the reactivity series, silver is positioned BELOW copper (less reactive). Since only a MORE reactive metal can displace a less reactive one, silver cannot displace copper \u2014 no reaction would be expected.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
