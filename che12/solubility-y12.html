<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Solubility Terms',[['Term','Meaning'],['Solute','Substance being dissolved'],['Solvent','Liquid doing the dissolving'],['Solution','Solute + solvent mixed'],['Saturated','No more solute can dissolve at that temp']]);}
function dQ2(p){drawTable(p,'Solubility Curve Data \u2014 KNO3',[['Temperature (\u00b0C)','Solubility (g/100g water)'],['0','13'],['20','32'],['40','64'],['60','110'],['80','169']]);}
function dQ3(p){drawTable(p,'Factors Affecting Solubility',[['Factor','Effect (most solids)'],['Increasing temperature','Solubility increases'],['Particle size','Does not affect solubility, only rate'],['Stirring','Does not affect solubility, only rate']]);}
function dQ4(p){drawTable(p,'Solubility of Gases in Water',[['Factor','Effect on gas solubility'],['Increasing temperature','Solubility DECREASES (opposite to most solids)'],['Increasing pressure','Solubility INCREASES']]);}
function dQ5(p){drawTable(p,'Calculating Mass from a Solubility Curve',[['Step','Action'],['1','Read solubility value at given temperature'],['2','Scale by mass of water used (not 100g)'],['3','Compare to actual solute mass to find if saturated']]);}
function dQ6(p){drawTable(p,'WAEC Solubility Summary',[['Concept','Key point'],['Solubility curve','Shows max solute per 100g water at each temp'],['Most solids','More soluble hot than cold'],['Gases','More soluble cold, at high pressure']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Solubility and Saturated Solutions',su:'Understand key solubility terms and what it means for a solution to be saturated.',steps:[
{lb:'Key definitions',dr:dQ1,ht:'<p>A <b>solute</b> is the substance being dissolved (e.g. salt). A <b>solvent</b> is the liquid doing the dissolving (e.g. water). A <b>solution</b> is the resulting mixture of solute dissolved in solvent. A <b>saturated solution</b> is one that contains the MAXIMUM amount of solute that can dissolve at a given temperature \u2014 no more solute will dissolve unless the temperature is changed.</p>'},
{lb:'Solubility as a numerical value',dr:dQ1,ht:'<p><b>Solubility</b> is usually expressed as the mass (in grams) of solute that will dissolve in 100 g of solvent (usually water) at a specific temperature, to form a SATURATED solution. Solubility values change with temperature, which is why solubility is always reported alongside a specific temperature.</p>'},
{lb:'Recognising saturation practically',dr:dQ1,ht:'<p>A solution is saturated when adding MORE solute results in undissolved solid remaining at the bottom of the container (excess solid visible), even after stirring/waiting. If a hot saturated solution is cooled, some of the dissolved solute will CRYSTALLISE OUT (since solubility typically decreases at lower temperature for solids), as the solution can no longer hold that much dissolved solute.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'A saturated solution is one in which:',o:['No solute has been added yet','The maximum amount of solute that can dissolve at that temperature is already dissolved; no more will dissolve without a temperature change','All the solvent has evaporated','The solute has completely reacted with the solvent'],a:2,w:'"Saturated" specifically means the solution holds the maximum possible amount of dissolved solute at the CURRENT temperature \u2014 any additional solute added will simply remain undissolved (visible as excess solid) unless conditions change.'},{q:'If a hot, saturated solution of a solid solute is slowly cooled, what is likely to happen?',o:['Nothing changes at all','More solute dissolves as it cools','Some dissolved solute crystallises out of solution, since solubility typically decreases as temperature falls for most solids','The solvent boils away'],a:2,w:'Since most solids are LESS soluble at lower temperatures, cooling a saturated solution means it can no longer hold as much dissolved solute as before \u2014 the excess comes out of solution as solid crystals (this is the basis of the crystallisation technique).'},{q:'Solubility is typically expressed as:',o:['The volume of solute added','The mass (g) of solute that dissolves in 100 g of solvent at a specific temperature, to form a saturated solution','A fixed value that never changes with temperature','The colour of the resulting solution'],a:2,w:'Solubility values are standardly reported as "grams of solute per 100 g of solvent" at a STATED temperature, since the amount that can dissolve changes significantly with temperature for most substances.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Reading and Using Solubility Curves',su:'Interpret solubility curves and use them to calculate masses of solute.',steps:[
{lb:'What a solubility curve shows',dr:dQ2,ht:'<p>A <b>solubility curve</b> plots solubility (g per 100g water, y-axis) against temperature (\u00b0C, x-axis) for a particular substance. Most solids show an UPWARD curve (solubility increases with temperature). The curve tells you the MAXIMUM mass of that solute that can dissolve in 100 g of water at any given temperature shown.</p>'},
{lb:'Reading values from the curve',dr:dQ2,ht:'<p>To find the solubility at a specific temperature: locate that temperature on the x-axis, trace UP to the curve, then read ACROSS to the y-axis to find the corresponding solubility value. Example (KNO3 data): at 40\u00b0C, solubility is 64 g per 100 g water \u2014 meaning a maximum of 64 g of KNO3 can dissolve in 100 g of water at that temperature.</p>'},
{lb:'Scaling for different water masses',dr:dQ2,ht:'<p>Solubility curves are usually given per 100 g of water \u2014 if you have a DIFFERENT mass of water, you must SCALE the value proportionally. Example: if solubility is 64 g/100g water at 40\u00b0C, then in 250 g of water at 40\u00b0C, the maximum solute that can dissolve = 64 x (250/100) = 160 g.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Using the KNO3 solubility curve data (32 g/100g water at 20\u00b0C), how much KNO3 can dissolve in 200 g of water at 20\u00b0C?',o:['32 g','64 g (32 x 200/100)','16 g','320 g'],a:2,w:'Since solubility is given per 100 g of water, scale proportionally for 200 g: 32 x (200/100) = 64 g of KNO3 can dissolve at 20\u00b0C in 200 g of water.'},{q:'A solubility curve shows solubility of 110 g/100g water at 60\u00b0C for a solid. What does this tell you?',o:['110 g of the solid is always present regardless of water amount','A MAXIMUM of 110 g of that solid can dissolve in 100 g of water specifically at 60\u00b0C, forming a saturated solution','The solid never dissolves at 60\u00b0C','The solvent boils at 60\u00b0C'],a:2,w:'This solubility value indicates the maximum mass (110 g) of the solid that can be dissolved in exactly 100 g of water at the specific temperature of 60\u00b0C to produce a saturated solution \u2014 adding more would leave undissolved solid.'},{q:'If a solubility curve shows 40 g/100g water at 30\u00b0C, how much of that solute could dissolve in 50 g of water at 30\u00b0C?',o:['40 g','80 g','20 g (40 x 50/100)','10 g'],a:3,w:'Scaling for 50 g of water (half of the standard 100 g): 40 x (50/100) = 20 g of solute could dissolve in 50 g of water at 30\u00b0C.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Factors Affecting Solubility of Solids',su:'Examine how temperature and other factors affect the solubility of solid solutes.',steps:[
{lb:'Temperature effect on solids',dr:dQ3,ht:'<p>For MOST solid solutes, solubility INCREASES as temperature increases \u2014 the solvent particles have more kinetic energy, breaking apart the solute\'s lattice/structure more effectively and allowing more solute particles to become surrounded and dissolved. This is why hot water dissolves sugar/salt faster and in greater quantity than cold water.</p>'},
{lb:'Factors that do NOT affect solubility',dr:dQ3,ht:'<p>PARTICLE SIZE (e.g. powder vs large crystals) does NOT affect the total amount that CAN dissolve (solubility) \u2014 it only affects the RATE of dissolving (smaller particles have more surface area, dissolving faster, but the same TOTAL mass will eventually dissolve). Similarly, STIRRING speeds up the RATE of dissolving but does not change the maximum solubility value itself.</p>'},
{lb:'Exceptions to the general trend',dr:dQ3,ht:'<p>A few solid substances (uncommon at this level) show DECREASING solubility with increasing temperature (e.g. some calcium salts). It is important to always check the ACTUAL solubility curve/data given in a question, rather than assuming ALL solids follow the typical "increases with temperature" pattern.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Crushing a solid solute into a fine powder before adding it to water will:',o:['Increase the total amount that can eventually dissolve (solubility)','Increase the RATE at which it dissolves (more surface area exposed), but NOT change the total solubility (maximum amount dissolvable)','Decrease the total amount that can dissolve','Have no effect whatsoever on the dissolving process'],a:2,w:'Smaller particle size increases surface area, allowing water molecules to interact with and dissolve the solute FASTER. However, the total (maximum) amount that CAN eventually dissolve \u2014 the solubility \u2014 remains unchanged, since this depends on temperature, not particle size.'},{q:'For most solid solutes, increasing the temperature of the solvent will:',o:['Decrease solubility','Increase solubility, since solvent particles gain more energy, more effectively breaking apart and surrounding solute particles','Have no effect on solubility','Only affect the colour of the solution'],a:2,w:'For the majority of solid solutes, higher temperature gives the solvent particles more kinetic energy, allowing them to disrupt the solute\'s structure more effectively and dissolve a greater total mass of solute \u2014 increasing solubility.'},{q:'Which of these factors affects the RATE of dissolving but NOT the total solubility (maximum amount dissolvable)?',o:['Temperature of the solvent','Stirring the mixture','Both stirring and particle size affect only the rate, not the maximum solubility itself','Pressure on a solid solute'],a:2,w:'Stirring and reducing particle size both speed up how QUICKLY a solute dissolves (by increasing contact/mixing), but neither changes the ultimate MAXIMUM amount of solute that can dissolve at a given temperature \u2014 that is determined by solubility, which depends on temperature (for solids).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Solubility of Gases',su:'Examine how temperature and pressure affect the solubility of gases in liquids.',steps:[
{lb:'Temperature effect on gas solubility',dr:dQ4,ht:'<p>For GASES dissolved in a liquid, solubility DECREASES as temperature INCREASES \u2014 the OPPOSITE trend to most solids. This is because gas particles gain more kinetic energy at higher temperatures, making it easier for them to escape from the liquid back into the gas phase (overcoming the weak attractive forces holding them in solution).</p>'},
{lb:'Pressure effect on gas solubility',dr:dQ4,ht:'<p>Increasing PRESSURE increases the solubility of a gas in a liquid \u2014 higher pressure forces more gas particles into the liquid (there are more collisions between gas particles and the liquid surface per second, pushing more gas into solution). This is why carbonated drinks are bottled under high pressure (to dissolve extra CO2), and why they fizz when opened (pressure drops, releasing dissolved CO2 as bubbles).</p>'},
{lb:'Practical implications',dr:dQ4,ht:'<p>These trends explain: why warm fizzy drinks go "flat" faster than cold ones (higher temperature reduces CO2 solubility, so it escapes faster). Why fish struggle in warm water during heatwaves (warmer water holds LESS dissolved oxygen, reducing oxygen available for aquatic life). Why deep-sea divers must decompress slowly (high pressure at depth dissolves more nitrogen gas into the blood; surfacing too fast causes it to come out of solution as dangerous bubbles \u2014 "the bends").</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'As the temperature of water increases, the solubility of a dissolved gas (like oxygen) typically:',o:['Increases, following the same trend as solids','Decreases \u2014 gas particles gain more kinetic energy and escape from solution more easily at higher temperatures','Stays exactly constant','Cannot be predicted for gases'],a:2,w:'Unlike most solids, gases become LESS soluble as temperature increases. Warmer water gives dissolved gas particles more energy, making it easier for them to escape the liquid and return to the gas phase, reducing the amount that remains dissolved.'},{q:'Why does a carbonated drink go "flat" (lose its fizz) faster when left open and warm compared to cold and sealed?',o:['Warm temperature increases CO2 solubility, keeping the fizz longer','Opening the bottle reduces pressure (allowing dissolved CO2 to escape) and warmth further decreases CO2 solubility, both causing the gas to leave solution faster','Cold temperature always removes fizz faster','CO2 solubility is completely unaffected by temperature or pressure'],a:2,w:'Both effects work together: reducing pressure (opening the bottle) lowers gas solubility, and increasing temperature further lowers gas solubility. Both push more dissolved CO2 out of solution, causing the drink to lose its fizz faster when warm and open compared to cold and sealed.'},{q:'Deep-sea divers must decompress (surface) slowly to avoid "the bends" because:',o:['Pressure has no effect on the solubility of gases in blood','At depth, high pressure dissolves more nitrogen gas into the blood; surfacing too quickly (rapid pressure drop) causes this dissolved nitrogen to come out of solution suddenly, forming dangerous bubbles in the bloodstream','Cold water at depth removes all dissolved gases automatically','Nitrogen gas is not present in the air divers breathe'],a:2,w:'Higher pressure at depth increases the solubility of nitrogen gas in the diver\'s blood. If the diver surfaces (depressurises) too quickly, this dissolved nitrogen cannot stay in solution and rapidly forms bubbles in the blood and tissues \u2014 a dangerous condition. Slow decompression allows the nitrogen to leave the body gradually and safely through normal breathing.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Calculations Using Solubility Data',su:'Solve problems involving solubility curves, saturation, and crystallisation.',steps:[
{lb:'Determining if a solution is saturated',dr:dQ5,ht:'<p>To determine if a given mass of solute in a given mass of water forms a saturated solution at a specific temperature: (1) read the solubility value (per 100g water) at that temperature from the curve/data. (2) Scale this value to match the actual mass of water used. (3) Compare to the actual mass of solute present \u2014 if it EXCEEDS the maximum solubility, the solution is saturated with excess undissolved solid; if it is LESS, the solution is unsaturated (more could still dissolve).</p>'},
{lb:'Calculating mass crystallised on cooling',dr:dQ5,ht:'<p>To find how much solid crystallises out when a saturated solution is cooled: (1) find the solubility at the ORIGINAL (higher) temperature \u2014 this is the mass originally dissolved. (2) find the solubility at the NEW (lower) temperature. (3) Subtract: mass crystallised = (solubility at original temp) \u2212 (solubility at new temp), scaled appropriately for the actual mass of water used.</p>'},
{lb:'Worked example',dr:dQ5,ht:'<p>100 g of water is saturated with KNO3 at 60\u00b0C (solubility 110 g/100g water). The solution is cooled to 20\u00b0C (solubility 32 g/100g water). Mass crystallised = 110\u221232 = 78 g of KNO3 crystallises out of solution as the temperature drops, since the water can no longer hold that much dissolved solute at the lower temperature.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Using KNO3 solubility data (80\u00b0C: 169 g/100g water; 20\u00b0C: 32 g/100g water), how much KNO3 crystallises when 100 g of water saturated at 80\u00b0C is cooled to 20\u00b0C?',o:['32 g','137 g (169\u221232)','169 g','201 g'],a:2,w:'Mass crystallised = solubility at higher temp \u2212 solubility at lower temp = 169\u221232 = 137 g of KNO3 will crystallise out as the solution cools from 80\u00b0C to 20\u00b0C.'},{q:'50 g of a solute is added to 100 g of water at a temperature where the solubility is 40 g/100g water. What will be observed?',o:['All 50 g dissolves completely, forming an unsaturated solution','The solution becomes saturated with 40 g dissolved, and 10 g of solute remains undissolved as excess solid (50\u221240=10 g)','None of the solute dissolves','The water evaporates completely'],a:2,w:'Since the maximum that can dissolve at this temperature is 40 g (the solubility value) but 50 g was added, only 40 g will dissolve (forming a saturated solution) and the remaining 10 g (50\u221240) will stay as undissolved solid.'},{q:'When calculating mass crystallised on cooling, why is it essential to first check whether the ORIGINAL solution was actually saturated?',o:['It does not matter whether the original solution was saturated','If the original solution was NOT saturated (less solute than the maximum solubility at that temperature), then cooling may not cause any crystallisation until the new, lower solubility value is actually exceeded by the dissolved amount','Crystallisation always occurs regardless of saturation','Saturation is irrelevant to solubility calculations'],a:2,w:'The formula (mass crystallised = solubility at higher T minus solubility at lower T) assumes the ORIGINAL solution was exactly saturated. If less solute than the maximum was originally dissolved, cooling might not cause any solid to crystallise out until the actual dissolved amount exceeds the new (lower) solubility limit.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Solubility of Substances',su:'Integrated revision of solubility curves, saturation and factors affecting solubility.',steps:[
{lb:'Solubility concepts summary',dr:dQ6,ht:'<p>Solubility = max mass of solute per 100 g solvent at a given temperature, forming a saturated solution. Most solids: solubility increases with temperature. Gases: solubility decreases with temperature, increases with pressure. Particle size/stirring affect RATE only, not the total solubility value.</p>'},
{lb:'Calculation strategy summary',dr:dQ6,ht:'<p>Reading a curve: locate temperature, trace to curve, read solubility value. Scaling: multiply/divide proportionally for different water masses (not 100 g). Crystallisation on cooling: mass crystallised = solubility at higher T \u2212 solubility at lower T (scaled to the mass of water used).</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: forgetting to SCALE solubility values when the water mass is not exactly 100 g. Assuming ALL solids become MORE soluble with heat (a few exceptions exist \u2014 always check given data). Confusing gas solubility trends (decrease with heat, increase with pressure) with solid solubility trends (usually increase with heat, pressure irrelevant for solids). Forgetting particle size/stirring change RATE only, not solubility itself.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Using the KNO3 data (0\u00b0C: 13 g/100g water; 40\u00b0C: 64 g/100g water), how much KNO3 could dissolve in 50 g of water at 40\u00b0C?',o:['64 g','32 g (64 x 50/100)','13 g','128 g'],a:2,w:'Scaling for 50 g of water (half the standard 100 g): 64 x (50/100) = 32 g of KNO3 could dissolve in 50 g of water at 40\u00b0C.'},{q:'Why does a fizzy drink lose its bubbles faster when left in a warm room compared to a fridge?',o:['Warm temperature increases CO2 solubility','Warm temperature DECREASES the solubility of the dissolved CO2 gas, causing it to escape from solution faster','Temperature has no effect on gas solubility','Fizzy drinks only lose bubbles when refrigerated'],a:2,w:'Gases become less soluble as temperature increases (opposite trend to most solids). A warm fizzy drink cannot hold as much dissolved CO2, so the gas escapes (bubbles out) faster than in a cold drink, causing it to go flat more quickly.'},{q:'Crushing rock salt into fine crystals before adding it to water will:',o:['Allow MORE total salt to eventually dissolve than if left as large chunks','Make the salt dissolve FASTER (more surface area) but will NOT change the total maximum amount that can dissolve at that temperature','Prevent the salt from dissolving at all','Change the solubility curve of the salt permanently'],a:2,w:'Reducing particle size increases surface area, speeding up the RATE of dissolving, but the TOTAL solubility (maximum amount dissolvable) is a fixed property depending on temperature, not particle size \u2014 so ultimately the same total mass will dissolve, just faster.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
