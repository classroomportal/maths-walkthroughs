<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}

.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}

.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}

.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Standard Enthalpy Changes',ACC,12,'middle',true));
var rows=[['ΔH°f','Formation — 1 mol compound from elements in standard states'],['ΔH°c','Combustion — 1 mol substance burned in excess O₂'],['ΔH°neut','Neutralisation — acid + base → 1 mol H₂O (~−57 kJ/mol)'],['ΔH°atm','Atomisation — 1 mol gaseous atoms from element'],['ΔH°LE','Lattice energy — ionic solid from gaseous ions (exothermic)'],['Hess\'s Law','ΔH independent of route; only on initial and final states']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(100,52+i*32,r[0],ACC,9,'middle',true));o.push(T(310,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Born-Haber Cycle — NaCl (kJ/mol)',ACC,12,'middle',true));
var steps=[['Na(s)→Na(g) atomisation','+109'],['Na(g)→Na⁺(g)+e⁻ IE₁','+496'],['½Cl₂(g)→Cl(g) atomisation','+122'],['Cl(g)+e⁻→Cl⁻(g) EA₁','−349'],['Na⁺(g)+Cl⁻(g)→NaCl(s) ΔH°LE','−789'],['TOTAL = ΔH°f NaCl(s)','−411']];
steps.forEach(function(r,i){if(i<p){o.push(R(10,36+i*32,460,26,i===5?LINE:CRM,i===5?ACC:LINE,1));o.push(T(210,52+i*32,r[0],i===5?'white':ACC,8,'middle',i===5));o.push(T(410,52+i*32,r[1],i===5?'white':'#555',9,'middle',i===5));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Energetics Summary',ACC,12,'middle',true));
var rows=[['Hess\'s Law','ΔH°rxn = ΣΔH°f(products) − ΣΔH°f(reactants)'],['Bond enthalpy ΔH','ΔH = Σ(bonds broken) − Σ(bonds formed); approximate'],['Calorimetry','q = mcΔT; ΔH = −q/n (per mole)'],['Born-Haber','Links ΔH°f to atomisation, IE, EA, lattice energy'],['Entropy ΔS','Disorder; ΔS > 0 when gas evolved or dissolving'],['Gibbs ΔG','ΔG = ΔH − TΔS; spontaneous if ΔG < 0']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(120,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Standard Enthalpy Changes',su:'Define and distinguish different standard enthalpy changes.',steps:[
{lb:'Definitions',dr:dQ1,ht:'<p><b>Standard conditions</b>: 25°C (298K), 100kPa, standard states. <b>ΔH°f</b>: enthalpy when 1 mol compound forms from its elements in standard states. ΔH°f = 0 for all elements. <b>ΔH°c</b>: enthalpy when 1 mol substance burns completely in excess O₂. Always negative (combustion is exothermic). <b>ΔH°neut</b>: strong acid + strong base → −57.3 kJ/mol (weak acid/base: less negative — energy used to dissociate). Exothermic: ΔH negative; endothermic: ΔH positive.</p>'},
{lb:'Hess\'s Law application',dr:dQ1,ht:'<p><b>Hess\'s Law</b>: ΔH°rxn = ΣΔH°f(products) − ΣΔH°f(reactants). Example: CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l). ΔH°rxn = [ΔH°f(CO₂) + 2ΔH°f(H₂O)] − [ΔH°f(CH₄) + 2ΔH°f(O₂)] = [−393 + 2(−286)] − [−74 + 0] = −965 − (−74) = −891 kJ/mol. For ΔH°c route: ΔH°rxn = ΣΔH°c(reactants) − ΣΔH°c(products) — note REVERSED compared to formation.</p>'},
{lb:'Born-Haber cycle',dr:dQ2,ht:'<p>Born-Haber cycle (NaCl): na(s)→Na(g): +109. Na(g)→Na⁺(g): +496 (IE₁). ½Cl₂→Cl(g): +122 (atomisation). Cl(g)+e⁻→Cl⁻(g): −349 (EA₁). Na⁺(g)+Cl⁻(g)→NaCl(s): −789 (ΔH°LE). Sum = −411 kJ/mol = ΔH°f(NaCl). More exothermic ΔH°LE → stronger lattice → higher m.p. Higher ionic charge and smaller ionic radius → larger ΔH°LE: MgO (−3850) >> NaCl (−789).</p>'},
{lb:'Calorimetry and entropy',dr:dQ1,ht:'<p>Calorimetry: q = mcΔT. m = mass of solution (g); c = 4.18 J/g/K (water); ΔT = T change. ΔH = −q/n (per mole; negative if exothermic). Entropy (S): disorder. ΔS positive when: gas produced; liquid/gas formed from solid; number of moles gas increases; dissolving. Gibbs: ΔG = ΔH − TΔS. Spontaneous if ΔG < 0. Exothermic + ΔS positive = always spontaneous. Endothermic + ΔS negative = never spontaneous.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'ΔH°f for CO₂ is defined as the enthalpy change for:',o:['Burning 1 mol of carbon in air','C(graphite, s) + O₂(g) → CO₂(g) at 25°C and 100kPa','2C(s) + 2O₂(g) → 2CO₂(g)','CO(g) + ½O₂(g) → CO₂(g)'],a:2,w:'ΔH°f = enthalpy change when 1 MOL of the compound forms from its elements in their standard states. For CO₂: C(graphite,s) + O₂(g) → CO₂(g). Standard state: graphite (not diamond) for C; O₂(g) for O.'},{q:'Using ΔH°f: CO₂ = −393, H₂O = −286, CH₄ = −74 kJ/mol. ΔH°c(CH₄) = ?',o:['−965 kJ/mol','−891 kJ/mol','−74 kJ/mol','+891 kJ/mol'],a:2,w:'ΔH°rxn = ΣΔH°f(products) − ΣΔH°f(reactants). CH₄ + 2O₂ → CO₂ + 2H₂O. = [−393 + 2(−286)] − [−74 + 0] = [−965] − [−74] = −891 kJ/mol.'},{q:'ΔG = ΔH − TΔS. For ΔH = −100 kJ/mol and ΔS = +200 J/mol/K at 298K:',o:['ΔG = −40.4 kJ/mol (spontaneous)','ΔG = −159.6 kJ/mol (spontaneous)','ΔG = +159.6 kJ/mol (non-spontaneous)','ΔG = +40.4 kJ/mol'],a:2,w:'ΔG = ΔH − TΔS = −100,000 − (298 × 200) = −100,000 − 59,600 = −159,600 J/mol = −159.6 kJ/mol. Spontaneous (ΔG < 0). Note: convert ΔS to J (not kJ) and ΔH to J before subtracting.'},{q:'In a Born-Haber cycle for MgO, the lattice energy is much larger in magnitude than for NaCl because:',o:['Mg and O are heavier elements with larger electron clouds','Mg²⁺ and O²⁻ have higher charges (+2 and −2 vs +1 and −1) AND Mg²⁺ is small, resulting in much stronger electrostatic attraction','MgO has a higher melting point which requires more energy','Magnesium is a more reactive metal than sodium'],a:2,w:'Lattice energy depends on CHARGE and IONIC RADIUS. Mg²⁺(2+) and O²⁻(2−) have higher charges than Na⁺(1+) and Cl⁻(1−). Mg²⁺ is also smaller than Na⁺. Higher charge + smaller radius = much stronger lattice. ΔH°LE(MgO) ≈ −3850 vs −789 kJ/mol for NaCl.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Bond Enthalpies and Calculations',su:'Use average bond enthalpies to calculate ΔH of reactions.',steps:[
{lb:'Bond enthalpy definition',dr:dQ1,ht:'<p><b>Mean bond enthalpy</b>: average energy to break 1 mol of a bond type in gaseous molecules. Always endothermic (+). ΔH°rxn ≈ Σ(bonds broken) − Σ(bonds formed). Bonds broken: endothermic (+). Bonds formed: exothermic (−). Results are approximate (average values used). Key bond enthalpies (kJ/mol): H-H: 436; O=O: 498; O-H: 463; C-H: 413; C-C: 347; C=C: 614; C≡C: 839; N≡N: 945; N-H: 391; C=O: 805; H-Cl: 432; Cl-Cl: 243; C-O: 360.</p>'},
{lb:'Calculation example',dr:dQ2,ht:'<p>N₂(g) + 3H₂(g) → 2NH₃(g). Bonds broken: N≡N (945) + 3×H-H (3×436=1308) = 2253 kJ. Bonds formed: 6×N-H (6×391=2346) kJ. ΔH = 2253 − 2346 = −93 kJ/mol. Actual = −92 kJ/mol (close because limited approximation error). Combustion of CH₄: CH₄ + 2O₂ → CO₂ + 2H₂O. Broken: 4×C-H (4×413=1652) + 2×O=O (2×498=996) = 2648. Formed: 2×C=O in CO₂ (2×805=1610) + 4×O-H (4×463=1852) = 3462. ΔH = 2648−3462 = −814 kJ/mol (cf. actual −890: approximation error from average bonds).</p>'},
{lb:'Comparing bond enthalpies',dr:dQ1,ht:'<p>Bond strength trends: (1) Triple > double > single bond (for same element pair). C-C: 347 < C=C: 614 < C≡C: 839 kJ/mol. Bond length decreases: C-C > C=C > C≡C. (2) More electronegative atom → stronger bond: H-F (568) > H-Cl (432) > H-Br (366) > H-I (297). (3) Ring strain affects bond enthalpies (cyclopropane weaker C-C). (4) Higher bond enthalpies → more thermodynamically stable compound → lower reactivity. N₂ has very high bond enthalpy (945) → very unreactive at room temperature.</p>'},
{lb:'Entropy and Gibbs energy revisited',dr:dQ2,ht:'<p>Gibbs free energy summary: ΔG = ΔH − TΔS. Spontaneous if ΔG < 0. Four cases: ΔH<0, ΔS>0: always spontaneous (ΔG always negative). ΔH>0, ΔS<0: never spontaneous. ΔH<0, ΔS<0: spontaneous at low T (ΔH dominates). ΔH>0, ΔS>0: spontaneous at high T (TΔS dominates). Crossover temperature (T where ΔG=0): T = ΔH/ΔS. For T > ΔH/ΔS: endothermic reactions with ΔS>0 become spontaneous. Example: CaCO₃(s) → CaO(s) + CO₂(g). ΔH = +178 kJ/mol; ΔS positive (gas produced). Spontaneous above ~845°C.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'For H₂(g) + Cl₂(g) → 2HCl(g): E(H-H)=436, E(Cl-Cl)=243, E(H-Cl)=432 kJ/mol. ΔH = ?',o:['ΔH = −185 kJ/mol','ΔH = +185 kJ/mol','ΔH = −432 kJ/mol','ΔH = −864 kJ/mol'],a:1,w:'Bonds broken: H-H (436) + Cl-Cl (243) = 679 kJ. Bonds formed: 2×H-Cl (2×432=864) kJ. ΔH = 679 − 864 = −185 kJ/mol. Exothermic — more energy released forming H-Cl than absorbed breaking H-H and Cl-Cl.'},{q:'Why are bond enthalpy calculations approximate?',o:['Bond enthalpies change significantly with temperature','Average bond enthalpies are used; actual bond strength depends on the molecular environment','The method ignores kinetic energy of molecules','Bond formation is always endothermic, making calculations one-directional'],a:2,w:'Average bond enthalpies are averages across many different molecules. The actual C-H bond enthalpy in CH₄ differs from C-H in CH₃Cl or C₂H₆. Using averages introduces systematic error — hence approximation.'},{q:'Bond order increases from single to triple. Which of these is CORRECT?',o:['Bond length increases and bond enthalpy decreases as bond order increases','Bond length decreases and bond enthalpy increases as bond order increases','Bond length and bond enthalpy both increase with bond order','Bond order has no effect on bond length or enthalpy'],a:2,w:'Higher bond order → shorter bond (more electrons pulling nuclei together) AND stronger bond (higher enthalpy to break). C-C: 154pm, 347 kJ/mol. C=C: 134pm, 614 kJ/mol. C≡C: 120pm, 839 kJ/mol.'},{q:'For endothermic decomposition CaCO₃(s) → CaO(s) + CO₂(g), ΔH = +178 kJ/mol. The reaction becomes spontaneous (ΔG < 0) at:',o:['All temperatures (always spontaneous)','Low temperatures only','High temperatures — because CO₂ gas production means ΔS > 0 so TΔS eventually exceeds ΔH','Never — endothermic reactions cannot be spontaneous'],a:3,w:'ΔH > 0 (endothermic) but ΔS > 0 (CO₂ gas produced = entropy increase). ΔG = ΔH − TΔS. At high enough T: TΔS > ΔH → ΔG < 0 → spontaneous. This is why limestone decomposes in a kiln (~850°C+).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Equilibrium Constant Calculations',su:'Calculate Kc and use it to predict reaction direction.',steps:[
{lb:'Writing Kc expressions',dr:dQ10,ht:'<p>For aA + bB ⇌ cC + dD: Kc = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ. Concentrations in mol/dm³; exponents = stoichiometric coefficients. Only gases and solutes are included (pure solids/liquids have constant concentration — excluded). Examples: H₂(g)+I₂(g)⇌2HI(g): Kc = [HI]²/([H₂][I₂]). N₂(g)+3H₂(g)⇌2NH₃(g): Kc = [NH₃]²/([N₂][H₂]³). CH₃COOH(aq)⇌H⁺(aq)+CH₃COO⁻(aq): Ka = [H⁺][CH₃COO⁻]/[CH₃COOH] (this is a Kc for weak acid dissociation).</p>'},
{lb:'Calculating Kc from data',dr:dQ10,ht:'<p>ICE table (Initial, Change, Equilibrium): Example: 1.0 mol A and 1.0 mol B in 2dm³ → at equilibrium 0.60 mol A and 0.60 mol B remain. A(g) + B(g) ⇌ C(g) + D(g). Change: each = −0.40 mol. At equilibrium: A=B=0.60, C=D=0.40 mol. [A]=[B]=0.30 mol/dm³; [C]=[D]=0.20 mol/dm³. Kc = (0.20×0.20)/(0.30×0.30) = 0.04/0.09 = 0.44. Kc = 0.44 means significant reactants and products present at equilibrium.</p>'},
{lb:'Reaction quotient Q and predicting direction',dr:dQ10,ht:'<p><b>Reaction quotient Q</b>: same expression as Kc but using current (non-equilibrium) concentrations. If Q < Kc: reaction proceeds forward (more products form) until Q = Kc. If Q > Kc: reaction proceeds backward (more reactants form). If Q = Kc: system is at equilibrium. This allows prediction of which direction a reaction proceeds from any set of concentrations. WAEC: know how to write Kc, calculate it from equilibrium concentrations, and predict direction using Q vs Kc comparison.</p>'},
{lb:'Le Chatelier and Kc',dr:dQ10,ht:'<p>Effects on Kc: Only TEMPERATURE changes Kc. Exothermic reaction: increase T → Kc decreases. Endothermic: increase T → Kc increases. Concentration change: shifts position but NOT Kc. Pressure change (gases): shifts position but NOT Kc. Catalyst: no effect on position or Kc — equilibrium reached faster only. For Haber: N₂+3H₂⇌2NH₃ (ΔH=−92): increase T → Kc decreases (less NH₃). Decrease T → higher Kc but slower rate. 450°C compromise. 200 atm: shifts right (fewer gas moles) → more NH₃ without changing Kc.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'For H₂(g) + I₂(g) ⇌ 2HI(g), at equilibrium: [H₂] = 0.10, [I₂] = 0.10, [HI] = 0.60 mol/dm³. Kc = ?',o:['Kc = 6.0','Kc = 36','Kc = 0.028','Kc = 0.60'],a:2,w:'Kc = [HI]²/([H₂][I₂]) = (0.60)²/(0.10×0.10) = 0.36/0.010 = 36. Large Kc (36) means equilibrium strongly favours HI (product side).'},{q:'If Q < Kc for a reaction, the system will:',o:['Shift backward, forming more reactants','Stay at equilibrium — Q is always equal to Kc','Shift forward, forming more products until Q = Kc','Cannot be determined without knowing temperature'],a:3,w:'Q < Kc: current ratio of products to reactants is LESS than the equilibrium ratio. More products must form to reach equilibrium → reaction shifts FORWARD until Q increases to equal Kc.'},{q:'Which change will alter the value of Kc for an exothermic reaction?',o:['Adding more reactant','Increasing pressure','Increasing temperature','Adding a catalyst'],a:3,w:'ONLY temperature changes Kc. For an exothermic forward reaction: increasing T shifts equilibrium left (endothermic direction), so Kc DECREASES. Concentration, pressure and catalyst changes shift position but never change Kc.'},{q:'For the equilibrium CH₃COOH(aq) ⇌ H⁺(aq) + CH₃COO⁻(aq), adding NaOH (which reacts with H⁺) will:',o:['Shift equilibrium LEFT to produce more reactants','Shift equilibrium RIGHT to replace the H⁺ consumed by NaOH — Ka unchanged','Have no effect because Ka is constant at constant T','Change the value of Ka (equilibrium constant decreases)'],a:2,w:'Adding NaOH removes H⁺ (NaOH + H⁺ → H₂O + Na⁺). This decreases Q below Ka → equilibrium shifts RIGHT to produce more H⁺ and CH₃COO⁻. Ka is unchanged (T is unchanged).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Electrochemistry in Detail',su:'Examine electrochemical cells, electrode potentials and electrolysis calculations.',steps:[
{lb:'Electrochemical cells',dr:dQ1,ht:'<p>An <b>electrochemical cell</b> converts chemical energy to electrical energy (galvanic cell) or vice versa (electrolytic cell). <b>Standard electrode potential E°</b> = potential vs standard hydrogen electrode (SHE, E° = 0V). More positive E° = stronger oxidising agent (more easily reduced). Cell notation: anode | electrolyte || electrolyte | cathode. E°cell = E°(cathode) − E°(anode). E°cell > 0: spontaneous. ΔG° = −nFE°cell (F = 96500 C/mol; n = moles of electrons). Key E° values: Zn²⁺/Zn = −0.76V; Cu²⁺/Cu = +0.34V; Fe³⁺/Fe²⁺ = +0.77V; Cl₂/Cl⁻ = +1.36V.</p>'},
{lb:'Standard electrode potential applications',dr:dQ2,ht:'<p>Predicting feasibility: E°cell = E°(more +ve half-cell) − E°(less +ve half-cell). If E°cell > 0: thermodynamically feasible (ΔG° < 0). Example: Zn + Cu²⁺ → Zn²⁺ + Cu. E°cell = +0.34 − (−0.76) = +1.10V → spontaneous. Cu + Zn²⁺ → Cu²⁺ + Zn: E°cell = −0.76 − (+0.34) = −1.10V → non-spontaneous. Important: E° predicts FEASIBILITY not rate. A thermodynamically feasible reaction may be kinetically slow (high Ea) — e.g. H₂ + O₂ at room T. Note: E° values assume standard conditions; actual conditions alter the EMF (Nernst equation at A2 level).</p>'},
{lb:'Electrolysis — principles and products',dr:dQ1,ht:'<p>Electrolysis: external current forces non-spontaneous reaction. Cathode (−): reduction (cations gain e⁻). Anode (+): oxidation (anions lose e⁻). At cathode: most easily reduced ion discharged first (highest E°). At anode with inert electrode: OH⁻/H₂O oxidised (O₂) unless [Cl⁻] high (Cl₂ discharged). Molten salt: only ions of that salt present — straightforward. Aqueous: competition between salt ions and H₂O/H⁺/OH⁻. Copper refining: impure Cu anode dissolves; pure Cu cathode deposits; more active metals stay in solution; noble metals fall as anode sludge.</p>'},
{lb:'Faraday\'s laws and quantitative electrolysis',dr:dQ2,ht:'<p><b>Faraday\'s laws</b>: mass of product ∝ quantity of electricity (Q = It coulombs). Q = I × t (amps × seconds). Moles of electrons = Q/F (F = 96500 C/mol). Moles of product = moles of e⁻ / charge on ion. Example: deposit Cu from CuSO₄ at 2.0A for 30 min (1800s). Q = 2.0×1800 = 3600C. Mol e⁻ = 3600/96500 = 0.0373. Cu²⁺ + 2e⁻ → Cu: mol Cu = 0.0373/2 = 0.0187. Mass Cu = 0.0187×63.5 = 1.18g. WAEC: show all steps; include units throughout.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Calculate E°cell for Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s). E°(Zn²⁺/Zn) = −0.76V; E°(Cu²⁺/Cu) = +0.34V.',o:['E°cell = −1.10V (non-spontaneous)','E°cell = +0.42V','E°cell = +1.10V (spontaneous)','E°cell = +0.76V'],a:3,w:'E°cell = E°cathode − E°anode. Zn is oxidised (anode): loses electrons. Cu²⁺ is reduced (cathode): gains electrons. E°cell = E°(Cu²⁺/Cu) − E°(Zn²⁺/Zn) = +0.34 − (−0.76) = +1.10V. Positive → spontaneous.'},{q:'In the electrolysis of aqueous NaCl, the gas produced at the ANODE is:',o:['Hydrogen (H₂) from reduction of H⁺','Oxygen (O₂) from oxidation of OH⁻ if [Cl⁻] is low; chlorine (Cl₂) if [Cl⁻] is high','Sodium metal (Na) from reduction of Na⁺','Carbon dioxide from dissolved CO₂'],a:2,w:'At ANODE (oxidation): concentrated Cl⁻ → Cl₂ gas. Dilute Cl⁻ → O₂ from OH⁻ oxidation (4OH⁻ → O₂ + 2H₂O + 4e⁻). Chlorine production requires high [Cl⁻] to compete with OH⁻ preferential discharge.'},{q:'How many moles of Cu are deposited when 0.5A flows for 1 hour through CuSO₄(aq)?',o:['0.0047 mol','0.0093 mol','0.0187 mol','0.0373 mol'],a:2,w:'Q = 0.5 × 3600 = 1800C. Mol e⁻ = 1800/96500 = 0.01865. Cu²⁺ + 2e⁻ → Cu: mol Cu = 0.01865/2 = 0.00933 ≈ 0.0093 mol.'},{q:'A standard electrode potential E° = +0.77V for the Fe³⁺/Fe²⁺ half-cell means:',o:['Fe²⁺ is a strong reducing agent relative to the standard hydrogen electrode','Fe³⁺ is a moderate oxidising agent; it will oxidise I⁻ (E° = +0.54V for I₂/I⁻)','Fe can spontaneously reduce all metal ions below it in the electrochemical series','Iron metal dissolves spontaneously in water'],a:2,w:'E°(Fe³⁺/Fe²⁺) = +0.77V. For Fe³⁺ + I⁻: E°cell = 0.77 − 0.54 = +0.23V > 0 → spontaneous. Fe³⁺ oxidises I⁻ to I₂. The IODINE/IODIDE couple (E° = +0.54V) is below iron\'s Fe³⁺/Fe²⁺ (0.77V), so Fe³⁺ can oxidise I⁻.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Organic Reactions and Mechanisms',su:'Examine organic reaction mechanisms and functional group tests.',steps:[
{lb:'Reaction types and reagents',dr:dQ10,ht:'<p>Organic mechanism types: (1) Free radical substitution (alkanes + halogen/UV): initiation, propagation, termination. (2) Electrophilic addition (alkenes): HBr, Br₂, H₂SO₄. (3) Nucleophilic substitution (haloalkanes): SN1, SN2. (4) Nucleophilic addition (carbonyls): HCN. (5) Electrophilic aromatic substitution (benzene): nitration (HNO₃/H₂SO₄). (6) Condensation (esters, amides, polymerisation). Key reagents: acidified KMnO₄ or K₂Cr₂O₇ = oxidising agents. LiAlH₄ = powerful reducing agent. Fehling\'s/Tollens\' = aldehyde test. Bromine water = test for C=C (alkene) or phenol.</p>'},
{lb:'Haloalkane reactions — SN1 and SN2',dr:dQ10,ht:'<p>Haloalkanes undergo <b>nucleophilic substitution</b>. <b>SN2</b> (bimolecular): single-step; nucleophile attacks from back of C-X; inversion of configuration; rate = k[RX][Nu]; primary haloalkanes. <b>SN1</b> (unimolecular): two-step; C-X breaks first → carbocation; nucleophile attacks; racemisation; rate = k[RX]; tertiary haloalkanes. Reactivity: C-I > C-Br > C-Cl > C-F (bond enthalpy increases: weaker bonds react faster, not electronegativity). Test: AgNO₃/EtOH — Ag⁺ + X⁻ → AgX precipitate. White=Cl; cream=Br; yellow=I. Soluble in dilute NH₃=Cl; conc NH₃=Br; insoluble=I.</p>'},
{lb:'Carboxylic acid derivatives',dr:dQ10,ht:'<p>Carboxylic acids (RCOOH) react with: (1) Alcohols + acid catalyst → ester + H₂O (esterification; reversible). (2) LiAlH₄ (dry ether) → 1° alcohol (reduction). (3) PCl₅ → acyl chloride + HCl + POCl₃. (4) Na₂CO₃ → salt + CO₂ (distinguishes from weaker acids). Acyl chlorides (RCOCl): very reactive; attack by nucleophiles. With H₂O → carboxylic acid + HCl. With alcohol → ester + HCl (faster than esterification, no catalyst needed). With NH₃ → amide + HCl. Esters by hydrolysis: with NaOH (saponification) → carboxylate salt + alcohol (irreversible). With H₂O/acid catalyst (reversible → acid + alcohol).</p>'},
{lb:'Amino acids and proteins',dr:dQ10,ht:'<p><b>Amino acids</b>: contain -NH₂ and -COOH groups. Amphoteric — act as acid or base. Zwitterion form: -NH₃⁺ and -COO⁻ at isoelectric point. Peptide bond: -CO-NH- formed by condensation (−H₂O). Dipeptide: two amino acids joined. Polypeptide/protein: many amino acids. Hydrolysis of peptide bond: H₂O + acid or H₂O + NaOH → amino acids. Primary structure: amino acid sequence. Secondary: α-helix or β-sheet (hydrogen bonds). Tertiary: 3D folding (disulfide bridges, H-bonds, ionic interactions, van der Waals). Quaternary: multiple polypeptide chains. Denaturation: disrupts secondary/tertiary structure; heat, pH change, heavy metals.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'The AgNO₃/ethanol test gives a cream precipitate that is soluble in concentrated NH₃. The halogen present is:',o:['Chlorine (Cl) — white precipitate, soluble in dilute NH₃','Bromine (Br) — cream precipitate, soluble in concentrated NH₃','Iodine (I) — yellow precipitate, insoluble in concentrated NH₃','Fluorine (F) — no precipitate forms with AgNO₃'],a:2,w:'AgBr is a cream precipitate, soluble in concentrated NH₃ (but not dilute). AgCl = white, soluble in dilute NH₃. AgI = yellow, insoluble in concentrated NH₃. F⁻ does not precipitate with Ag⁺ under these conditions.'},{q:'An SN2 reaction is favoured by:',o:['Tertiary haloalkanes — more stable carbocation','Primary haloalkanes — less steric hindrance allows backside attack','Polar protic solvents like water and ethanol','Weak nucleophiles'],a:2,w:'SN2 is favoured by PRIMARY haloalkanes — one substituent on the carbon means less steric hindrance for the backside attack of the nucleophile. Tertiary haloalkanes prefer SN1 (carbocation is stabilised by three alkyl groups).'},{q:'The peptide bond (-CO-NH-) in proteins is formed by:',o:['Addition of H₂O across a C=N double bond','Condensation (elimination of H₂O) between the -COOH of one amino acid and -NH₂ of another','Oxidation of an SH group to form a disulfide bridge','Reduction of a C=O group using LiAlH₄'],a:2,w:'Peptide bond formation = condensation reaction: -COOH + H₂N- → -CO-NH- + H₂O. One water molecule is eliminated for each peptide bond formed. The reverse (hydrolysis) uses water to break peptide bonds.'},{q:'When an ester is hydrolysed with NaOH (saponification), the products are:',o:['The original carboxylic acid and alcohol — easily separated','A carboxylate salt (RCOO⁻Na⁺) and an alcohol — reaction is irreversible','The acyl chloride and sodium hydroxide','Two alcohol molecules from each ester'],a:2,w:'Saponification (NaOH hydrolysis of ester): RCOOR\' + NaOH → RCOONa + R\'OH. Products are the SALT of the carboxylic acid (not the free acid) and the alcohol. Irreversible because the carboxylate ion cannot reform the ester in basic conditions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Kinetics — Rate Equations and Mechanisms',su:'Examine rate equations, reaction orders and mechanisms.',steps:[
{lb:'Rate equations and orders',dr:dQ1,ht:'<p>For A + B → products: rate = k[A]ⁿ[B]ᵐ. Orders n and m are found experimentally only — not from stoichiometry. Methods: (1) Initial rate method: compare rates at different concentrations. Doubling [A] and rate doubles → 1st order in A. Doubling [A] and rate quadruples → 2nd order. Rate unchanged → 0th order. (2) Half-life method: constant t½ → 1st order. Increasing t½ → 2nd order. (3) Graph method: [A] vs t: straight line = 0th order. ln[A] vs t: straight line = 1st order. 1/[A] vs t: straight line = 2nd order.</p>'},
{lb:'Units of k and half-life',dr:dQ1,ht:'<p>Units of rate constant k: rate = mol dm⁻³ s⁻¹. 0th order: k = mol dm⁻³ s⁻¹. 1st order: k = s⁻¹. 2nd order: k = mol⁻¹ dm³ s⁻¹. Half-life t½: for 1st order reactions ONLY: t½ = 0.693/k (constant, independent of initial concentration). Radioactive decay is always 1st order. For 2nd order: t½ doubles as [A] halves. Rate-determining step: slowest step; determines the rate equation. If rate = k[A][B²]: RDS involves 1A and 2B (or a species that breaks down from them). Species in the rate equation but not overall equation → intermediate present before RDS.</p>'},
{lb:'Arrhenius equation and temperature',dr:dQ2,ht:'<p>Arrhenius equation: k = Ae^(−Ea/RT). ln k = ln A − Ea/RT. Plot ln k vs 1/T: gradient = −Ea/R → Ea = −gradient × R. A = pre-exponential factor (collision frequency × steric factor). Higher Ea → steeper negative gradient → rate increases more steeply with T. Maxwell-Boltzmann: at higher T, more molecules have KE ≥ Ea (area under curve right of Ea increases sharply). Even a small T increase can double rate. Catalyst: lowers Ea → larger proportion of molecules can react at same T → k increases → faster rate without changing equilibrium or ΔH.</p>'},
{lb:'Reaction mechanism and rate-determining step',dr:dQ2,ht:'<p>Multi-step mechanism: each step has its own Ea and rate. Overall rate is determined by the slowest step (RDS). Example: 2NO(g) + O₂(g) → 2NO₂(g). If rate = k[NO]²[O₂]: mechanism. Step 1 (fast): 2NO ⇌ N₂O₂. Step 2 (slow, RDS): N₂O₂ + O₂ → 2NO₂. Rate from RDS: rate = k₂[N₂O₂][O₂]. Substituting [N₂O₂] = K[NO]² (from fast step equilibrium): overall rate = k[NO]²[O₂] — consistent with experimental rate equation. Intermediates (N₂O₂) appear in mechanism but not overall equation. WAEC: explain how mechanism matches rate equation.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'The rate equation for a reaction is rate = k[A]²[B]. The units of k are:',o:['s⁻¹','mol dm⁻³ s⁻¹','mol⁻² dm⁶ s⁻¹','mol⁻¹ dm³ s⁻¹'],a:3,w:'rate = k[A]²[B]. Units: k = rate/([A]²[B]) = (mol dm⁻³ s⁻¹)/(mol dm⁻³)³ = mol⁻² dm⁶ s⁻¹. Overall order = 2+1 = 3; units of k for 3rd order = mol⁻² dm⁶ s⁻¹.'},{q:'For a first-order reaction with t½ = 30 seconds, after 90 seconds the fraction remaining is:',o:['1/2','1/3','1/4','1/8'],a:4,w:'90s = 3 half-lives (3×30s). Each half-life: concentration halves. After 3 half-lives: (½)³ = 1/8 remaining. For 1st order reactions, t½ is CONSTANT so this calculation is straightforward.'},{q:'The Arrhenius equation ln k = ln A − Ea/RT predicts that a plot of ln k versus 1/T will give:',o:['A straight line with positive gradient = +Ea/R','A straight line with negative gradient = −Ea/R (since higher T → lower 1/T → higher k → higher ln k)','A curve because the relationship is exponential','A straight line through the origin with gradient = ln A'],a:2,w:'ln k = ln A − (Ea/R)(1/T). Plot ln k (y-axis) vs 1/T (x-axis): STRAIGHT LINE with gradient = −Ea/R and y-intercept = ln A. As T increases, 1/T decreases and ln k increases (inverse relationship).'},{q:'In an experiment: doubling [A] quadruples the rate; doubling [B] doubles the rate. The rate equation is:',o:['rate = k[A][B]','rate = k[A]²','rate = k[A]²[B]','rate = k[A][B]²'],a:3,w:'Doubling [A] → rate ×4 = ×2² → 2nd order in A. Doubling [B] → rate ×2 = ×2¹ → 1st order in B. Overall: rate = k[A]²[B] (3rd order overall).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Chem \u2022 Y12',ti:'Acids, Bases and Buffers',su:'Examine acid-base theory, pH calculations and buffer solutions.',steps:[
{lb:'Acid-base theories',dr:dQ1,ht:'<p><b>Brønsted-Lowry</b>: acid = proton (H⁺) donor; base = proton acceptor. Conjugate pairs differ by H⁺: HA/A⁻; BH⁺/B. Strong acid: fully dissociates (HCl, HNO₃, H₂SO₄). Weak acid: partially dissociates (CH₃COOH, HF). Ka = [H⁺][A⁻]/[HA]. pKa = −logKa. Smaller pKa → stronger acid. Kw = [H⁺][OH⁻] = 10⁻¹⁴ at 25°C. pH + pOH = 14. <b>Lewis</b>: acid = e⁻-pair acceptor; base = e⁻-pair donor (broader than Brønsted-Lowry). BF₃ is a Lewis acid (empty orbital). NH₃ is a Lewis base (lone pair). Dative bond = Lewis acid-base interaction.</p>'},
{lb:'pH calculations',dr:dQ2,ht:'<p>pH calculations: Strong acid (fully dissociates): pH = −log[H⁺] = −log[acid]. Strong base: [OH⁻] = [base]; pOH = −log[OH⁻]; pH = 14 − pOH. Weak acid (approximation if Ka << c): [H⁺] = √(Ka × c). pH = ½(pKa − log c). Example: 0.10 mol/dm³ CH₃COOH (Ka = 1.7×10⁻⁵): [H⁺] = √(1.7×10⁻⁵ × 0.10) = √(1.7×10⁻⁶) = 1.30×10⁻³. pH = −log(1.30×10⁻³) = 2.89. Note: weak acid pH > strong acid at same concentration. Buffer: pH = pKa + log([A⁻]/[HA]) (Henderson-Hasselbalch).</p>'},
{lb:'Titration curves',dr:dQ1,ht:'<p>pH titration curves: <b>Strong acid + strong base</b>: pH at equivalence point = 7. Sharp change around pH 7. Indicators: any (methyl orange or phenolphthalein work). <b>Weak acid + strong base</b>: equivalence point pH > 7 (basic salt). Buffer region before equivalence point. Use phenolphthalein (range 8.3-10). <b>Strong acid + weak base</b>: equivalence point pH < 7. Use methyl orange (range 3.1-4.4). <b>Weak acid + weak base</b>: no sharp endpoint — no suitable indicator; use conductimetry or pH meter. At half-equivalence point: pH = pKa (half the acid neutralised).</p>'},
{lb:'Buffers',dr:dQ2,ht:'<p>Buffer solution resists pH change when small amounts of acid or alkali added. Acidic buffer: weak acid + its salt. CH₃COOH / CH₃COONa system: add H⁺: H⁺ + CH₃COO⁻ → CH₃COOH (H⁺ consumed). Add OH⁻: OH⁻ + CH₃COOH → CH₃COO⁻ + H₂O (OH⁻ consumed). pH = pKa + log([A⁻]/[HA]). Maximum buffer capacity when [HA] = [A⁻]: pH = pKa. Blood buffer: HCO₃⁻/CO₂ maintains pH 7.35-7.45. pH < 7.35 → acidosis; pH > 7.45 → alkalosis (both life-threatening). Secondary blood buffer: H₂PO₄⁻/HPO₄²⁻ (pKa = 7.2).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Calculate the pH of 0.050 mol/dm³ NaOH(aq) at 25°C:',o:['pH = 1.30','pH = 12.70','pH = 13.00','pH = 2.30'],a:2,w:'NaOH is a strong base: [OH⁻] = 0.050 mol/dm³. pOH = −log(0.050) = −log(5×10⁻²) = 1.30. pH = 14 − 1.30 = 12.70.'},{q:'For a buffer made of 0.10 mol/dm³ CH₃COOH and 0.30 mol/dm³ CH₃COONa (pKa = 4.76):',o:['pH = 4.76','pH = 5.24','pH = 4.28','pH = 3.76'],a:2,w:'pH = pKa + log([A⁻]/[HA]) = 4.76 + log(0.30/0.10) = 4.76 + log(3) = 4.76 + 0.477 = 5.24 (rounded). [A⁻] > [HA] so pH > pKa.'},{q:'On a titration curve for weak acid + strong base, the pH at the HALF-EQUIVALENCE POINT equals:',o:['pH = 7 (neutral)','pH = pKa of the weak acid','pH = pKb of the conjugate base','pH = 14 (basic)'],a:2,w:'At the half-equivalence point, exactly half the acid has been neutralised: [HA] = [A⁻]. Henderson-Hasselbalch: pH = pKa + log(1) = pKa + 0 = pKa. This allows pKa determination directly from the titration curve.'},{q:'Why does a buffer solution resist pH change when a small amount of strong acid is added?',o:['The buffer reacts violently with the acid, neutralising it completely','The conjugate base (A⁻) reacts with the added H⁺: A⁻ + H⁺ → HA, consuming the acid and maintaining pH','The buffer absorbs the acid into solution without any chemical reaction','The weak acid releases OH⁻ to neutralise the added H⁺'],a:2,w:'The CONJUGATE BASE component (A⁻) of the buffer reacts with added H⁺: A⁻ + H⁺ → HA. This consumes the H⁺ before it can significantly lower the pH. The ratio [A⁻]/[HA] changes only slightly → pH change is minimal.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Chem \u2022 Y12',ti:'Transition Metal Chemistry',su:'Examine transition metal properties, complexes and catalysis.',steps:[
{lb:'Electronic configuration and properties',dr:dQ2,ht:'<p>Transition metals (Sc-Zn, 3d series): (1) Variable oxidation states — d electrons easily gained/lost. (2) Coloured compounds — d-d transitions absorb visible light. (3) Catalytic activity — variable oxidation state allows electron transfer. (4) Complex ion formation — empty d-orbitals accept lone pairs from ligands. Electronic configs: Cr (Ar)3d⁵4s¹ (half-filled 3d — extra stability); Cu (Ar)3d¹⁰4s¹ (full 3d). Not transition metals in ion form: Zn²⁺ (3d¹⁰ — full d; colourless, no variable OS). Sc³⁺ (3d⁰ — empty d; colourless, only one OS). Properties of Zn²⁺ and Sc³⁺ are exceptions.</p>'},
{lb:'Complex ions — structure and colour',dr:dQ1,ht:'<p>Complex ion: metal ion + surrounding ligands. Ligand: molecule/ion with lone pair donated to metal (coordinate/dative bond). Coordination number: bonds to metal. Common: 6 (octahedral: [Fe(H₂O)₆]³⁺); 4 (tetrahedral: [CoCl₄]²⁻; square planar: [Pt(NH₃)₂Cl₂]). Colour: ligands split 3d sub-shell into two levels. Electron absorbs specific visible wavelength (d-d transition) to jump to higher level. Observed colour = complementary. [Cu(H₂O)₆]²⁺: pale blue (absorbs red). [Cu(NH₃)₄(H₂O)₂]²⁺: deep blue (NH₃ is a stronger field ligand → larger split → different λ absorbed). [Fe(H₂O)₆]³⁺: pale purple-yellow. [Fe(SCN)x]³⁻x: blood red (iron thiocyanate test).</p>'},
{lb:'Ligand substitution reactions',dr:dQ2,ht:'<p>Ligand substitution: one ligand replaced by another. Example: [Cu(H₂O)₆]²⁺ + 4NH₃ → [Cu(NH₃)₄(H₂O)₂]²⁺ + 4H₂O. (Pale blue → deep blue; add excess NH₃ to aqueous Cu²⁺). Colour change confirms substitution. Haemoglobin: Fe²⁺ complex; normally binds O₂ (oxyhaemoglobin — bright red). CO is a stronger ligand than O₂ — irreversibly replaces O₂ → carboxyhaemoglobin (bright red but cannot carry O₂ → CO poisoning). Chelation: polydentate ligands (e.g. EDTA — hexadentate) form very stable complexes (chelate effect — entropy increase when monodentate replaced).</p>'},
{lb:'Transition metal catalysis',dr:dQ2,ht:'<p>Catalysis examples: Fe (Haber Process) — heterogeneous; N₂ and H₂ adsorb on surface; bonds weakened → lower Ea. V₂O₅ (Contact Process, SO₂ → SO₃) — heterogeneous; alternate between V⁴⁺ and V⁵⁺. Pt/Pd (car catalytic converters) — heterogeneous; converts CO, NO, unburned HC → CO₂, N₂, H₂O. MnO₂ (KClO₃ decomposition) — heterogeneous. MnO₄⁻ oxidation of C₂O₄²⁻ — autocatalysis (Mn²⁺ product catalyses further reaction — faster as reaction proceeds). Transition metal enzymes: Fe in haemoglobin, cytochrome; Cu in cytochrome oxidase; Zn in carbonic anhydrase.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Which of the following is NOT a transition metal in its most common ionic form?',o:['Fe²⁺ (iron, 3d⁶)','Cu²⁺ (copper, 3d⁹)','Zn²⁺ (zinc, 3d¹⁰ — full d sub-shell; colourless; no variable OS)','Cr³⁺ (chromium, 3d³)'],a:3,w:'Zn²⁺ has a full 3d¹⁰ sub-shell — no d-d transitions possible (colourless compounds), no variable oxidation state (+2 only), cannot act as a typical transition metal. Zn is technically a post-transition metal in its +2 state.'},{q:'CO is more toxic than CN⁻ because it binds irreversibly to:',o:['The iron(III) in cytochrome, blocking electron transport','The iron(II) in haemoglobin, preventing O₂ transport (carboxyhaemoglobin)','The copper in ceruloplasmin','The zinc in carbonic anhydrase'],a:2,w:'CO is a very strong ligand that binds irreversibly to the Fe²⁺ in haemoglobin: CO + HbO₂ → CO-Hb + O₂. CO-Hb (carboxyhaemoglobin) is red but cannot carry O₂ → tissue hypoxia → CO poisoning.'},{q:'When excess concentrated ammonia is added to [Cu(H₂O)₆]²⁺, the colour change observed is:',o:['Pale blue → colourless (copper precipitates as Cu metal)','Blue → deep blue (NH₃ replaces 4 water ligands as stronger field ligand)','Pale blue → green (chloride complex forms)','No colour change — ammonia does not react with copper complexes'],a:2,w:'[Cu(H₂O)₆]²⁺ (pale blue) + 4NH₃ → [Cu(NH₃)₄(H₂O)₂]²⁺ (deep blue) + 4H₂O. NH₃ is a stronger field ligand than H₂O — larger d-d splitting → different wavelength absorbed → deeper, more intense blue colour.'},{q:'The catalytic convertor in a car uses Pt and Pd to convert:',o:['CO₂ and N₂ into less harmful CO and NO','CO, unburned hydrocarbons and NO into CO₂, H₂O and N₂','SO₂ into SO₃ for sulfuric acid production','Petrol into diesel to improve efficiency'],a:2,w:'Catalytic converters use Pt and Pd (heterogeneous catalysts) to oxidise CO → CO₂ and hydrocarbons → CO₂ + H₂O; and reduce NO → N₂. Three-way catalysts handle all three pollutants simultaneously.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q9 \u2022 Chem \u2022 Y12',ti:'Spectroscopy and Analytical Chemistry',su:'Examine spectroscopic methods for identifying organic compounds.',steps:[
{lb:'Mass spectrometry',dr:dQ10,ht:'<p>Mass spectrometry identifies compounds by Mr and fragmentation. Molecular ion peak M⁺ = Mr of compound. Fragmentation: bonds break to give characteristic fragments. Common fragments (m/z): 15 = CH₃⁺; 29 = CHO⁺ or C₂H₅⁺; 43 = CH₃CO⁺ (acetyl); 45 = OC₂H₅⁺; 77 = C₆H₅⁺ (phenyl). Base peak = most abundant fragment. M+1 peak from ¹³C (1.1% natural abundance). High-resolution MS → exact Mr → molecular formula. Br shows M and M+2 in 1:1 ratio (⁷⁹Br:⁸¹Br); Cl shows M:M+2 in 3:1 (³⁵Cl:³⁷Cl isotopes). Applications: drugs testing; forensics; environmental pollutants; protein sequencing.</p>'},
{lb:'Infrared spectroscopy',dr:dQ10,ht:'<p>IR spectroscopy: molecules absorb IR at frequencies matching bond vibrations. Key absorptions (cm⁻¹): O-H stretch (carboxylic acid): 2500-3300 (broad). O-H stretch (alcohol): 3200-3550 (sharp). N-H stretch: 3300-3500. C=O (carbonyl): 1630-1820 (strong). C-H: 2850-3000. C-O: 1000-1300. C=C alkene: ~1620. Fingerprint region (400-1500 cm⁻¹): complex, unique to each compound — used for identification by matching to databases. Comparison: if two spectra identical in fingerprint region → same compound. IR alone rarely gives complete structure; combined with MS and NMR.</p>'},
{lb:'NMR spectroscopy',dr:dQ10,ht:'<p>¹H NMR: proton magnetic resonance. Number of peaks = number of H environments. Peak area (integration) = relative number of H. Chemical shift δ (ppm): 0 = TMS reference. 0.9-1.5 = alkyl C-H. 1.5-2.5 = next to C=O or ring. 2.5-5.0 = next to electronegative groups. 4.5-5.5 = alkene H. 5-8 = aromatic H. 9-10 = CHO aldehyde H. 10-13 = COOH. Spin-spin splitting (n+1 rule): H with n equivalent adjacent H → n+1 peaks (doublet, triplet, quartet, etc.). Equivalent H (same environment) do not split each other. ¹³C NMR: one peak per C environment; no splitting; integration not meaningful.</p>'},
{lb:'Combined spectroscopic analysis',dr:dQ10,ht:'<p>Identifying an unknown compound — systematic approach: (1) MS → Mr (molecular ion peak). (2) Molecular formula from high-res MS or combustion analysis. (3) Degrees of unsaturation = (2C + 2 + N − H − X)/2. (4) IR → functional groups present. (5) ¹H NMR → number of H environments, integrations, chemical shifts, splitting. (6) ¹³C NMR → number of C environments. (7) Combine all to deduce structure. WAEC: practice interpreting data tables for MS, IR peaks, and NMR chemical shifts and integrations. Drawing the correct structure from the combined data is a high-mark skill.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'A compound shows M⁺ at m/z = 58 and a peak at m/z = 43 (loss of 15). The compound is likely:',o:['Propanone (CH₃COCH₃) — M=58; loss of CH₃ (15) gives CH₃CO⁺ (43)','Butane (C₄H₁₀) — M=58; loss of CH₃ (15) gives C₃H₇⁺','Ethanol (C₂H₅OH) — M=46','Propan-1-ol (C₃H₇OH) — M=60'],a:1,w:'M⁺ = 58: consistent with propanone (C₃H₆O, Mr = 58) or butane (C₄H₁₀, Mr = 58). Loss of 15 (CH₃) → m/z = 43. Propanone loss of CH₃ gives CH₃CO⁺ (m/z = 43, the acetyl cation) — a characteristic fragment of methyl ketones.'},{q:'An IR spectrum shows a broad absorption at 2500-3300 cm⁻¹ AND a strong peak at ~1710 cm⁻¹. The compound contains:',o:['An alcohol (-OH) and a ketone (C=O)','A carboxylic acid (-COOH) — broad O-H (2500-3300 is characteristic) and C=O stretch','An aldehyde (-CHO) and an alcohol','A primary amine (-NH₂) and a carboxylic acid'],a:2,w:'Broad O-H stretch at 2500-3300 cm⁻¹ is characteristic of CARBOXYLIC ACID O-H (broader and at lower wavenumber than alcohol O-H due to H-bonding dimer formation). Strong C=O at ~1710 cm⁻¹ confirms the COOH group.'},{q:'In ¹H NMR, a CH₃ group adjacent to a CH₂ group (n=2 adjacent H) will appear as:',o:['A singlet (1 peak)','A doublet (2 peaks)','A triplet (3 peaks)','A quartet (4 peaks)'],a:3,w:'n+1 rule: CH₃ group with n=2 adjacent H (CH₂ group) splits into n+1 = 2+1 = 3 peaks → TRIPLET. Conversely, the CH₂ adjacent to CH₃ (n=3) shows n+1 = 4 peaks → QUARTET.'},{q:'Degrees of unsaturation (DoU) for C₅H₈ = ?',o:['DoU = 1 (one ring or one double bond)','DoU = 2 (e.g. two double bonds, or one ring + one double bond, or one triple bond)','DoU = 3','DoU = 0 (fully saturated)'],a:2,w:'DoU = (2C + 2 − H)/2 = (2×5 + 2 − 8)/2 = (10 + 2 − 8)/2 = 4/2 = 2. DoU = 2 means: two double bonds OR one ring + one double bond OR one triple bond. C₅H₈ could be cyclopentene, penta-1,3-diene, or pent-1-yne etc.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q10 \u2022 Chem \u2022 Y12',ti:'Mixed Revision — Y12 Chemistry',su:'Integrated revision across all Y12 Chemistry topics.',steps:[
{lb:'Full summary',dr:dQ10,ht:'<p>Y12 Chemistry key topics: Atomic structure (Z, A, isotopes, electron config, mass spectrometry). Bonding (ionic, covalent, metallic, VSEPR, intermolecular forces). Energetics (ΔH°f, ΔH°c, Hess, Born-Haber, bond enthalpies, ΔG). Equilibrium (Kc, Kp, Le Chatelier, Haber, Contact). Kinetics (rate = k[A]ⁿ, Arrhenius, t½, mechanisms). Redox (OIL RIG, oxidation states, half-equations, E°cell, electrolysis, Faraday). Organic (free radical substitution, electrophilic addition, nucleophilic substitution/addition, functional group tests). Acids/bases (Brønsted-Lowry, pH, Ka, buffers). Transition metals (variable OS, colour, complexes, catalysis). Spectroscopy (MS, IR, NMR).</p>'},
{lb:'Key equations',dr:dQ10,ht:'<p>Must-know equations: pH = −log[H⁺]. Kw = [H⁺][OH⁻] = 10⁻¹⁴ at 25°C. Ka = [H⁺][A⁻]/[HA]. Rate = k[A]ⁿ[B]ᵐ. t½ = 0.693/k (1st order). E°cell = E°cathode − E°anode. ΔG = −nFE°. Q = It. mol e⁻ = Q/96500. ΔH = Σ(bonds broken) − Σ(bonds formed). Kc = Π[products]ˢᵗ/Π[reactants]ˢᵗ. pH = pKa + log([A⁻]/[HA]). ΔG = ΔH − TΔS. ΔH°rxn = ΣΔH°f(products) − ΣΔH°f(reactants). DoU = (2C + 2 + N − H − X)/2. Ar = Σ(mass × abundance)/100. [H⁺] = √(Ka × c) for weak acid.</p>'},
{lb:'Practical tests',dr:dQ1,ht:'<p>Key identification tests: Alkene: decolourise Br₂(aq). Aldehyde: silver mirror (Tollens\'); brick-red ppt (Fehling\'s); oxidised by acidified Cr₂O₇²⁻ (orange → green). Ketone: none of the above. Carboxylic acid: fizzes with Na₂CO₃ (CO₂ gas); pH < 4. Alcohol: phosphorus pentachloride → steamy fumes of HCl. Primary/secondary/tertiary alcohol: oxidation tests (primary → aldehyde → carboxylic acid; secondary → ketone; tertiary → no oxidation). Haloalkane identification: AgNO₃/EtOH → AgCl (white), AgBr (cream), AgI (yellow). Gas tests: CO₂/limewater; NH₃/damp red litmus; Cl₂/moist litmus; H₂/squeaky pop; O₂/glowing splint.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final WAEC tips: (1) Always show working — partial marks available. (2) Use correct units and significant figures. (3) Draw mechanisms with curly arrows when asked. (4) Show Hess\'s cycles clearly with labelled arrows. (5) For titration calculations: always calculate moles → ratio → unknowns. (6) For electrolysis: Q = It → moles e⁻ → moles product → mass. (7) For pH: identify strong/weak acid or base first. (8) For equilibrium: write Kc expression first, then substitute values. (9) For organic: name the reaction type; give reagents and conditions; give product structure. (10) For spectroscopy: systematic approach — MS (Mr) → IR (functional groups) → NMR (H environments) → structure.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'2.0A flows for 965s through electrolysis of CuSO₄. Mass of Cu deposited (Mr=63.5; Cu²⁺+2e⁻→Cu):',o:['0.32g','0.63g','1.27g','2.54g'],a:2,w:'Q = 2.0 × 965 = 1930C. mol e⁻ = 1930/96500 = 0.0200. mol Cu = 0.0200/2 = 0.0100. Mass = 0.0100 × 63.5 = 0.635 ≈ 0.63g.'},{q:'A buffer contains 0.20 mol CH₃COOH and 0.20 mol CH₃COONa per dm³ (pKa = 4.76). Adding 0.01 mol HCl will:',o:['Increase pH by 1.00 (significant change)','Barely change pH — the added H⁺ reacts with CH₃COO⁻ → CH₃COOH; large amounts of both buffer components absorb the small amount of acid','Decrease pH by 1.00 (significant change)','Have no effect because HCl is a strong acid and buffers cannot neutralise strong acids'],a:2,w:'The buffer contains 0.20 mol CH₃COO⁻ (base component) and 0.20 mol CH₃COOH (acid component) in 1dm³. Adding 0.01 mol H⁺: CH₃COO⁻ + H⁺ → CH₃COOH. New ratio: 0.19/0.21. pH = 4.76 + log(0.19/0.21) = 4.76 − 0.044 = 4.72. Only tiny pH change.'},{q:'For the reaction 2NO₂(g) → N₂O₄(g) [ΔH = −57 kJ/mol], increasing temperature will:',o:['Increase Kc — higher T always increases Kc','Decrease Kc — for an exothermic forward reaction, increasing T shifts equilibrium left (endothermic direction), lowering Kc','Have no effect on Kc — only concentration changes affect it','Increase Kc slightly but not significantly for gas-phase reactions'],a:2,w:'The forward reaction is exothermic (ΔH = −57 kJ/mol). Increasing T shifts equilibrium in the ENDOTHERMIC direction (reverse = N₂O₄ → 2NO₂). Less N₂O₄ and more NO₂ at equilibrium → Kc decreases.'},{q:'The ¹H NMR spectrum of CH₃CH₂OH shows three different peak environments. The CH₂ group appears as:',o:['A singlet — no adjacent H atoms','A doublet — n+1 = 1+1 = 2 (adjacent to CH₃ with 3H and OH)','A quartet — n+1 = 3+1 = 4 (adjacent to CH₃ with 3H; OH H usually broad/not coupled)','A triplet — n+1 = 2+1 = 3 (adjacent to 2 equivalent H in CH₃... no wait that\'s wrong)'],a:3,w:'CH₂ is between CH₃ (3H) and OH (1H, but O-H coupling usually not observed in CDCl₃ due to exchange). Adjacent to 3 equivalent H (CH₃): n+1 = 3+1 = 4 peaks → QUARTET. The CH₃ adjacent to CH₂ (2H) → triplet.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
