<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

  <div class="sb" id="sb"><div class="sb-lbl">Questions</div></div>

      <div class="cvs"><svg id="dg" viewBox="0 0 480 260"></svg></div>

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Qualitative Analysis \u2014 Cation Tests',[['Cation','Test with NaOH','Observation'],['Ca2+','Add NaOH dropwise','White precipitate, insoluble in excess'],['Cu2+','Add NaOH dropwise','Blue precipitate, insoluble in excess'],['Fe2+/Fe3+','Add NaOH dropwise','Green (Fe2+) or brown (Fe3+) precipitate']]);}
function dQ2(p){drawTable(p,'Qualitative Analysis \u2014 Anion Tests',[['Anion','Test','Observation'],['Carbonate (CO3 2-)','Add dilute acid','Effervescence, CO2 turns limewater milky'],['Sulfate (SO4 2-)','Add BaCl2/dil HCl','White precipitate (BaSO4)'],['Chloride (Cl-)','Add AgNO3/dil HNO3','White precipitate (AgCl)']]);}
function dQ3(p){drawTable(p,'Volumetric Analysis \u2014 Titration Steps',[['Step','Action'],['1','Rinse and fill burette with standard solution'],['2','Pipette known volume of other solution into flask'],['3','Add indicator, titrate to end point'],['4','Repeat until concordant results (within 0.10cm3)']]);}
function dQ4(p){drawTable(p,'Common Practical Apparatus',[['Apparatus','Correct use'],['Burette','Delivers variable, precise volumes (titrant)'],['Pipette','Delivers one FIXED, precise volume'],['Measuring cylinder','Delivers approximate volumes only']]);}
function dQ5(p){drawTable(p,'Observation vs Inference',[['Type','Example'],['Observation (what you see/measure)','White precipitate forms'],['Inference (conclusion drawn)','The ion present is likely to be Ca2+, Ba2+ or Pb2+']]);}
function dQ6(p){drawTable(p,'WAEC Practical Exam Summary',[['Skill','Key point'],['Qualitative analysis','Systematic tests to identify ions present'],['Volumetric analysis','Precise titration technique, concordant results'],['Exam technique','Record observations exactly, then infer']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Qualitative Analysis \u2014 Testing for Cations',su:'Use systematic tests with sodium hydroxide to identify common metal cations.',steps:[
{lb:'Testing cations with sodium hydroxide',dr:dQ1,ht:'<p>Adding SODIUM HYDROXIDE solution dropwise (then in excess) to a solution containing a metal ion is a key qualitative test: many metal ions form a coloured/white PRECIPITATE (insoluble metal hydroxide). The COLOUR of the precipitate, and whether it DISSOLVES in EXCESS NaOH, helps identify which cation is present.</p>'},
{lb:'Distinguishing cations by precipitate colour',dr:dQ1,ht:'<p>Ca2+ gives a WHITE precipitate (insoluble in excess NaOH). Cu2+ gives a distinctive BLUE precipitate (insoluble in excess). Fe2+ gives a GREEN precipitate (insoluble in excess, may darken on standing in air due to oxidation to Fe3+). Fe3+ gives a RED-BROWN precipitate (insoluble in excess). Al3+ and Zn2+ give WHITE precipitates that DISSOLVE in excess NaOH (forming a colourless solution) \u2014 this solubility in excess is the key distinguishing feature from Ca2+.</p>'},
{lb:'Systematic approach in the exam',dr:dQ1,ht:'<p>WASSCE practical technique: ALWAYS add the reagent DROPWISE FIRST (recording the initial precipitate colour), THEN add EXCESS (recording whether the precipitate dissolves or remains). Record BOTH observations precisely, then use the pattern (colour + solubility in excess) to identify the cation present, rather than jumping to a conclusion from partial information.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Adding sodium hydroxide dropwise to a solution produces a distinctive BLUE precipitate that does not dissolve in excess NaOH. This suggests the cation present is:',o:['Ca2+','Cu2+ \u2014 copper(II) ions give a characteristic blue precipitate with NaOH, insoluble in excess','Fe3+','Al3+'],a:2,w:'The distinctive BLUE colour of the precipitate is characteristic of copper(II) hydroxide, formed when Cu2+ ions react with hydroxide ions. Since it does not dissolve in excess NaOH, this confirms Cu2+ (rather than Al3+ or Zn2+, whose white precipitates DO dissolve in excess).'},{q:'A white precipitate forms when NaOH is added dropwise, but the precipitate DISSOLVES when excess NaOH is added. This behaviour suggests the cation could be:',o:['Cu2+, since its precipitate is always insoluble','Ca2+, since calcium hydroxide always dissolves in excess','Al3+ or Zn2+ \u2014 both form white precipitates that dissolve in excess NaOH, distinguishing them from Ca2+ (whose white precipitate stays insoluble)','Fe3+, since iron(III) hydroxide is soluble in excess'],a:2,w:'Both aluminium and zinc hydroxides are AMPHOTERIC \u2014 they dissolve in excess NaOH to form soluble complex ions. This solubility in excess is the key test that distinguishes Al3+/Zn2+ from Ca2+, whose white precipitate remains insoluble even in excess NaOH.'},{q:'Why is it important to add NaOH BOTH dropwise (recording the initial result) AND then in excess, rather than just adding excess immediately?',o:['It does not matter which order the reagent is added','Some ions give the SAME initial precipitate colour but behave differently in excess (e.g. Ca2+ vs Al3+ both give white precipitates, but only Al3+ dissolves in excess) \u2014 both observations are needed to correctly identify the ion','Adding dropwise first wastes time and provides no useful information','Excess NaOH always gives the same result regardless of the ion present'],a:2,w:'Certain ions produce visually similar precipitates initially (e.g. both Ca2+ and Al3+ can give white precipitates), but they behave differently when excess reagent is added (Al3+ dissolves, Ca2+ does not). Recording BOTH stages of the test is essential for correctly and unambiguously identifying the cation present.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Qualitative Analysis \u2014 Testing for Anions',su:'Use systematic tests to identify common anions such as carbonate, sulfate and chloride.',steps:[
{lb:'Testing for carbonate ions',dr:dQ2,ht:'<p>Adding a DILUTE ACID (e.g. dilute HCl) to a suspected carbonate produces EFFERVESCENCE (bubbling) as CARBON DIOXIDE gas is released: CO3 2- + 2H+ \u2192 H2O + CO2. The gas is CONFIRMED as CO2 by passing it through LIMEWATER, which turns MILKY/CLOUDY.</p>'},
{lb:'Testing for sulfate ions',dr:dQ2,ht:'<p>Adding BARIUM CHLORIDE solution (acidified with dilute hydrochloric acid, to prevent other precipitates from interfering) to a suspected sulfate produces a WHITE PRECIPITATE of barium sulfate (insoluble even in acid): Ba2+ + SO4 2- \u2192 BaSO4. The acidification step is essential to avoid false positives from other anions (like carbonate) that would also give a white precipitate with barium ions but WOULD dissolve in acid (unlike BaSO4).</p>'},
{lb:'Testing for chloride ions',dr:dQ2,ht:'<p>Adding SILVER NITRATE solution (acidified with dilute nitric acid, again to avoid interference) to a suspected chloride produces a WHITE PRECIPITATE of silver chloride: Ag+ + Cl- \u2192 AgCl. This white precipitate additionally turns PURPLE/GREY on exposure to light, providing further confirmation. (Bromide gives a cream precipitate; iodide gives a yellow precipitate \u2014 useful for distinguishing halides.)</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Adding dilute hydrochloric acid to a solid produces bubbling, and the gas released turns limewater milky. This confirms the solid contains:',o:['Sulfate ions','Chloride ions','A carbonate \u2014 the effervescence and limewater test together confirm CO2 gas is being released','No anion at all'],a:2,w:'Effervescence upon adding dilute acid, combined with the gas turning limewater milky (confirming CO2), is the standard test sequence confirming the presence of a carbonate ion in the original solid/solution.'},{q:'Why is barium chloride solution ACIDIFIED (with dilute HCl) before testing for sulfate ions?',o:['Acidification has no purpose in this test','Acidification prevents false positives from other anions (like carbonate) that would also form a white precipitate with barium ions but would DISSOLVE in acid, unlike the genuinely insoluble barium sulfate','Acidification changes sulfate into a different ion','Acid is needed to make barium chloride dissolve'],a:2,w:'Some other anions (e.g. carbonate) also form white precipitates with barium ions, but these precipitates DISSOLVE when acid is added (releasing CO2). Barium sulfate, however, remains insoluble even in acid. Pre-acidifying the test solution ensures any such interfering precipitates are already dissolved, so a persisting white precipitate can be confidently attributed to sulfate.'},{q:'Adding silver nitrate solution (acidified with dilute nitric acid) to a solution produces a white precipitate that darkens to purple/grey on exposure to light. This confirms the presence of:',o:['Sulfate ions','Chloride ions \u2014 confirmed by the formation of white silver chloride, which characteristically darkens on exposure to light','Carbonate ions','Nitrate ions'],a:2,w:'The formation of a white precipitate (silver chloride) that subsequently darkens upon exposure to light is the characteristic confirmatory test for chloride ions, distinguishing it from bromide (cream precipitate) and iodide (yellow precipitate).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Volumetric Analysis \u2014 Titration Technique',su:'Plan and execute an accurate acid-base titration, following correct WASSCE practical procedure.',steps:[
{lb:'Setting up a titration',dr:dQ3,ht:'<p>Standard titration setup: RINSE the burette with the solution it will contain (not water alone, to avoid dilution), then FILL it and record the initial reading (to 2 decimal places, e.g. 0.00 cm3). Use a PIPETTE (with a pipette filler, never by mouth) to measure an EXACT, fixed volume of the other solution into a conical flask, and add a few drops of the chosen INDICATOR.</p>'},
{lb:'Performing the titration',dr:dQ3,ht:'<p>Add the solution from the burette to the flask SLOWLY while SWIRLING continuously, watching closely for the colour change (END POINT). Near the expected end point, add DROPWISE (even half-drops using a wash bottle to rinse the tip) to avoid overshooting. Record the FINAL burette reading, and calculate the TITRE (volume used = final \u2212 initial reading).</p>'},
{lb:'Repeating for concordant results',dr:dQ3,ht:'<p>The titration is REPEATED at least 2-3 times until CONCORDANT results are obtained (titre values agreeing within 0.10 cm3 of each other). The AVERAGE of the concordant titres (excluding any rough/outlier values) is used for further calculations, since a single titration is not considered reliable enough on its own \u2014 repetition improves accuracy and identifies any experimental errors.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Why should a burette be RINSED with the solution it will contain, rather than just rinsed with water and used while still wet?',o:['Rinsing with the solution has no real purpose','Any residual water left in the burette would DILUTE the solution added, giving an inaccurate (too concentrated appearing, or effectively wrong volume delivered) titration result','Water always evaporates immediately so it does not matter','Rinsing with the solution wastes too much of it'],a:2,w:'If water remains in the burette, it would dilute the solution as it is added, meaning the concentration delivered would not match the true, intended concentration of the solution \u2014 introducing a systematic error into the titration results. Rinsing with the actual solution first prevents this.'},{q:'Why is a titration typically repeated multiple times until "concordant" results are obtained?',o:['Repetition has no scientific purpose','A single titration result could be affected by random experimental error; repeating until results agree closely (concordant, usually within 0.10 cm3) improves reliability and allows an accurate average titre to be calculated','Concordant results mean the experiment failed','Only one titration is ever needed for accurate results'],a:2,w:'Any single titration measurement can be affected by small random errors (e.g. slight overshooting of the end point). Repeating the titration and checking for CONCORDANT results (closely agreeing values) ensures a reliable average titre is used for calculations, rather than relying on a single, potentially inaccurate measurement.'},{q:'Near the expected end point of a titration, the standard technique is to:',o:['Add the solution from the burette quickly, without any special care','Add the solution dropwise (or even half-drops, rinsed in with a wash bottle), swirling continuously, to avoid overshooting the exact end point','Stop swirling the flask to save time','Add a large excess immediately to save time'],a:2,w:'Adding titrant slowly, dropwise (or in smaller half-drop increments near the end point) while continuously swirling the flask allows the colour change to be observed precisely as it happens, preventing the common error of overshooting past the true end point and obtaining an inaccurate titre.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Correct Use of Practical Apparatus',su:'Distinguish the correct uses and precision of different volumetric apparatus.',steps:[
{lb:'Burette vs pipette vs measuring cylinder',dr:dQ4,ht:'<p><b>Burette</b>: delivers a VARIABLE, precisely measurable volume (used as the "titrant" delivery device in titrations, readable to 0.05 or 0.10 cm3). <b>Pipette</b>: delivers a single, FIXED, highly precise volume (e.g. exactly 25.00 cm3) \u2014 used to measure the OTHER solution accurately into the conical flask. <b>Measuring cylinder</b>: gives only an APPROXIMATE volume (much less precise) \u2014 suitable for rough measurements, but NEVER used where high precision is required (like in titrations).</p>'},
{lb:'Why precision matters in volumetric analysis',dr:dQ4,ht:'<p>Volumetric analysis calculations rely on ACCURATE volume measurements to calculate concentrations correctly. Using an imprecise measuring cylinder instead of a pipette or burette would introduce significant errors into the final calculated concentration, since even small volume errors are amplified through the calculation. This is why WASSCE practical exams specifically test correct apparatus choice and reading technique.</p>'},
{lb:'Reading volumes correctly (meniscus)',dr:dQ4,ht:'<p>When reading any volumetric apparatus (burette, pipette, measuring cylinder), the eye must be LEVEL with the MENISCUS (the curved surface of the liquid), reading from the BOTTOM of the meniscus for most liquids (except very dark liquids like potassium manganate, where the TOP of the meniscus is used, since the bottom is not clearly visible). Reading at an angle (parallax error) gives an inaccurate volume reading.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Which piece of apparatus should be used to deliver a single, precise, FIXED volume (e.g. exactly 25.00 cm3) of a solution into a conical flask for titration?',o:['A measuring cylinder','A pipette \u2014 designed specifically to deliver one fixed, highly accurate volume','A test tube','A beaker'],a:2,w:'A pipette is specifically designed and calibrated to deliver one exact, fixed volume with high precision (e.g. 25.00 cm3), making it the correct choice for accurately measuring the solution placed into the conical flask before titration.'},{q:'Why should a measuring cylinder NEVER be used in place of a burette or pipette for a titration?',o:['Measuring cylinders are too expensive to use','Measuring cylinders only give an APPROXIMATE volume, introducing significant errors into the precise volume measurements required for accurate titration calculations','Measuring cylinders cannot hold liquid at all','There is no difference in precision between these apparatus'],a:2,w:'Measuring cylinders are designed for rough, approximate volume measurements and lack the precision (fine graduations, calibrated accuracy) of a burette or pipette. Using one in a titration would introduce unacceptable errors into the final calculated concentration.'},{q:'When reading the volume on a burette containing a colourless solution, you should read the volume:',o:['From the top of the meniscus, looking down from above','From the bottom of the meniscus, with your eye level with the liquid surface, to avoid parallax error','From any angle, since it does not matter','Only after the liquid has completely evaporated'],a:2,w:'For most (non-dark) liquids, the correct technique is to read from the BOTTOM of the curved meniscus, with your eye positioned exactly level with the liquid surface. Reading from an angle (above or below eye level) introduces parallax error, giving an inaccurate volume reading.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Observation vs Inference \u2014 WASSCE Exam Technique',su:'Distinguish observations from inferences, a critical skill for WASSCE practical papers.',steps:[
{lb:'What counts as an observation',dr:dQ5,ht:'<p>An <b>observation</b> is something you DIRECTLY SEE, SMELL, HEAR, FEEL, or MEASURE during an experiment \u2014 stated as a plain FACT, without interpretation. Examples: "a white precipitate formed", "the temperature rose from 20\u00b0C to 35\u00b0C", "effervescence was observed", "a colourless gas with a pungent smell was produced".</p>'},
{lb:'What counts as an inference',dr:dQ5,ht:'<p>An <b>inference</b> is a CONCLUSION drawn FROM the observation, using chemical knowledge to interpret what the observation MEANS. Examples: "the white precipitate suggests the presence of Ca2+, Ba2+, or Pb2+ ions" (inference, drawn from the observed precipitate). A common WASSCE mistake is writing an inference when an OBSERVATION was actually asked for (or vice versa) \u2014 always check exactly which is being requested.</p>'},
{lb:'Why this distinction matters for exam marks',dr:dQ5,ht:'<p>WASSCE practical papers specifically award SEPARATE marks for observations and inferences \u2014 writing an inference (a conclusion) when only an OBSERVATION (a factual description) was asked for typically scores ZERO for that part, even if the underlying chemistry understanding is correct. Students must practise clearly separating "what I saw happen" from "what I think this means chemically".</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'A student adds dilute HCl to a solid and writes: "The gas produced is carbon dioxide." Is this an observation or an inference?',o:['An observation, since gas was seen', 'An inference \u2014 the STUDENT has interpreted/concluded that the gas is specifically CO2, rather than simply describing what was directly observed (e.g. bubbling, a colourless gas)','Neither an observation nor an inference','Both an observation and an inference simultaneously with no distinction'],a:2,w:'Stating "the gas is carbon dioxide" is a CONCLUSION (inference) based on chemical knowledge and further testing (e.g. limewater), not a direct sensory observation. The correct OBSERVATION would be something like "effervescence occurred, producing a colourless gas" or "the gas turned limewater milky" (if that specific test was performed and its result observed).'},{q:'Which of the following is a correctly written OBSERVATION (not an inference)?',o:['"The precipitate is copper hydroxide"','"A blue precipitate formed when sodium hydroxide was added" \u2014 this describes exactly what was seen, without interpreting which ion is present','"The cation present must be Cu2+"','"This proves the solution contained copper sulfate"'],a:2,w:'A correct observation describes exactly what was directly seen (a blue precipitate forming), without jumping to interpret WHICH specific ion or compound is responsible \u2014 that interpretation step is the INFERENCE, which should be kept separate.'},{q:'Why do WASSCE examiners specifically separate marks for "observation" and "inference" sections in practical questions?',o:['To make the exam paper longer for no real reason','To ensure candidates can both accurately describe what they directly observe AND correctly apply chemical reasoning to interpret those observations \u2014 two distinct, important scientific skills','Because observations and inferences are actually the same thing','Inferences are never actually assessed'],a:2,w:'Separating these marks assesses two distinct scientific skills: the ability to make and record ACCURATE, objective observations (a foundational experimental skill), and the ability to apply chemical KNOWLEDGE to correctly interpret what those observations mean \u2014 both are essential, complementary skills in practical chemistry.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC/WASSCE Prep \u2014 Practical Exam Technique',su:'Integrated revision of qualitative analysis, volumetric analysis and general practical skills.',steps:[
{lb:'Qualitative analysis summary',dr:dQ6,ht:'<p>Cation tests (NaOH dropwise then excess): distinguish by precipitate colour and solubility in excess. Anion tests: carbonate (acid \u2192 effervescence, CO2 turns limewater milky), sulfate (acidified BaCl2 \u2192 white precipitate), chloride (acidified AgNO3 \u2192 white precipitate, darkens in light).</p>'},
{lb:'Volumetric analysis summary',dr:dQ6,ht:'<p>Rinse burette with the actual solution (not water). Use a pipette for fixed, precise volumes. Titrate slowly near the end point, swirling continuously. Repeat until concordant results (within 0.10 cm3), then average the concordant titres for calculations.</p>'},
{lb:'Common WAEC/WASSCE mistakes',dr:dQ6,ht:'<p>Avoid: writing an inference when an observation is asked for (or vice versa) \u2014 always check the exact wording of the question. Using a measuring cylinder where precision (pipette/burette) is required. Forgetting to acidify BaCl2/AgNO3 before testing for sulfate/chloride (risking false positives from other anions). Reading volumes with parallax error instead of eye level with the meniscus.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'A solution gives a white precipitate with acidified silver nitrate. Which anion is most likely present?',o:['Carbonate','Sulfate','Chloride \u2014 acidified AgNO3 gives a white precipitate of AgCl with chloride ions','Nitrate'],a:2,w:'Acidified silver nitrate reacting to form a white precipitate is the standard confirmatory test for chloride ions, forming insoluble silver chloride (AgCl), which further darkens on exposure to light.'},{q:'Why must the burette be read with your eye exactly LEVEL with the meniscus, rather than looking down from above?',o:['Eye position has no effect on the reading','Looking from an angle (above or below eye level) causes parallax error, resulting in an inaccurate volume reading being recorded','It is faster to read from above','The liquid level changes depending on eye position'],a:2,w:'Viewing the meniscus from an angle other than directly level causes an optical distortion known as parallax error, leading to an incorrectly read volume. Ensuring your eye is exactly level with the liquid surface (meniscus) is essential for obtaining an accurate reading.'},{q:'A student records: "Adding NaOH to the solution caused a white precipitate to form. This suggests the cation is Zn2+ or Al3+." Which part of this statement is the INFERENCE?',o:['The whole statement is purely observation','"This suggests the cation is Zn2+ or Al3+" \u2014 this is the interpretive conclusion drawn from the observed precipitate, distinct from the factual description of what was seen','"A white precipitate formed" is the inference','There is no inference present in this statement'],a:2,w:'The factual description ("a white precipitate formed") is the OBSERVATION \u2014 exactly what was seen. The interpretive conclusion about which specific cations might be responsible ("this suggests Zn2+ or Al3+") is the INFERENCE, drawn using chemical knowledge to interpret the observation\u2019s meaning.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
