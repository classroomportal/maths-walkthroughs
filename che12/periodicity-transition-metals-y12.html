<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}

body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}

.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Period 3 — Atomic Radius and Ionisation Energy',[['Element','Atomic radius (pm)','1st IE (kJ/mol)'],['Na','186','496'],['Mg','160','738'],['Al','143','578'],['Si','117','786'],['P','110','1012'],['S','104','1000'],['Cl','99','1251'],['Ar','71','1521']]);}
function dQ2(p){drawTable(p,'Successive Ionisation Energies of Magnesium (kJ/mol)',[['IE1','IE2','IE3','IE4'],['738','1451','7733','10540']]);}
function dQ3(p){drawTable(p,'Electronegativity Trend — Period 3 (Pauling scale)',[['Element','Na','Mg','Al','Si','P','S','Cl'],['EN','0.9','1.2','1.5','1.8','2.1','2.5','3.0']]);}
function dQ4(p){drawTable(p,'Period 3 Oxides — Structure and Acid-Base Character',[['Oxide','Structure','Acid/Base'],['Na2O','Giant ionic','Basic'],['MgO','Giant ionic','Basic'],['Al2O3','Giant ionic/covalent','Amphoteric'],['SiO2','Giant covalent','Weakly acidic'],['P4O10','Simple molecular','Acidic'],['SO3','Simple molecular','Strongly acidic']]);}
function dQ5(p){drawTable(p,'General Properties of Transition Metals',[['Property','Example'],['Variable oxidation states','Fe2+/Fe3+, Cu+/Cu2+'],['Coloured compounds','Cu2+ blue, Fe3+ yellow'],['Catalytic activity','Fe in Haber, V2O5 in Contact'],['Form complex ions','[Cu(H2O)6]2+']]);}
function dQ6(p){drawTable(p,'Common Complex Ion Shapes',[['Coordination number','Shape','Example'],['2','Linear','[Ag(NH3)2]+'],['4','Tetrahedral','[CuCl4]2-'],['4','Square planar','[Ni(CN)4]2-'],['6','Octahedral','[Cu(H2O)6]2+']]);}
function dQ7(p){drawTable(p,'Ligand Substitution Colour Changes',[['Start','Ligand added','Product colour'],['[Cu(H2O)6]2+ pale blue','xs NH3','[Cu(NH3)4(H2O)2]2+ deep blue'],['[Co(H2O)6]2+ pink','xs Cl-','[CoCl4]2- blue'],['[Cu(H2O)6]2+ pale blue','xs Cl-','[CuCl4]2- yellow-green']]);}
function dQ8(p){drawTable(p,'WAEC Inorganic Chemistry Summary',[['Topic','Key idea'],['Periodicity','Trends repeat across periods'],['Ionisation energy','Increases across period, decreases down group'],['Transition metals','d-block, variable OS, coloured, catalytic'],['Complex ions','Central metal ion + ligands, dative bonds']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Periodic Trends — Atomic Radius and Ionisation Energy',su:'Examine how atomic radius and ionisation energy change across Period 3.',steps:[
{lb:'Atomic radius across a period',dr:dQ1,ht:'<p><b>Atomic radius</b> decreases across Period 3 (Na to Ar). Reason: nuclear charge increases (more protons) while electrons are added to the SAME outer shell — increased nuclear attraction pulls the electron cloud in, with no extra shielding from the new electrons. Down a group, atomic radius INCREASES because extra electron shells are added, and increased shielding outweighs the increased nuclear charge.</p>'},
{lb:'Ionisation energy — definition',dr:dQ1,ht:'<p><b>First ionisation energy (IE1)</b> = energy required to remove one mole of electrons from one mole of gaseous atoms: X(g) → X⁺(g) + e⁻. Always endothermic (positive). Factors affecting IE: (1) nuclear charge (more protons = higher IE), (2) atomic radius (closer electron = higher IE), (3) shielding (more inner shells = lower IE), (4) sub-shell being removed from (full/half-full sub-shells are extra stable).</p>'},
{lb:'IE trend across Period 3',dr:dQ1,ht:'<p>IE1 generally INCREASES across Period 3 (Na→Ar) — increasing nuclear charge, same shielding, decreasing radius. Two anomalies: Al < Mg (Al\'s outer electron is in 3p, higher energy and more shielded than Mg\'s 3s² full sub-shell). S < P (P has a stable half-full 3p³; removing an electron from S\'s 3p⁴ is easier because of extra electron-electron repulsion in the paired orbital).</p>'},
{lb:'Down a group',dr:dQ1,ht:'<p>IE1 DECREASES down a group (e.g. Group 1: Li→Na→K). Extra electron shells increase atomic radius and shielding, both outweighing the increased nuclear charge, so the outer electron is easier to remove. This explains why reactivity of Group 1 metals increases down the group (easier to lose the outer electron and form +1 ions).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Across Period 3 (Na to Ar), atomic radius:',o:['Increases steadily','Decreases — increasing nuclear charge pulls the same-shell electrons in more strongly','Stays constant','Increases then decreases'],a:2,w:'Atomic radius decreases across a period because nuclear charge increases while electrons are added to the same outer shell (no extra shielding), so the nucleus pulls the electron cloud in more tightly.'},{q:'Why is the first ionisation energy of aluminium LOWER than that of magnesium, despite Al having a higher nuclear charge?',o:['Al has a larger atomic radius than Mg','Al\'s outer electron is in the 3p sub-shell, which is higher energy and more shielded than Mg\'s full 3s2 sub-shell','Al is a metal and Mg is not','Mg has more protons than Al'],a:2,w:'Mg has a full, extra-stable 3s2 sub-shell. Al\'s single 3p electron is at higher energy and is shielded by the 3s2 electrons, making it easier to remove despite Al having one more proton.'},{q:'Ionisation energy decreases down a group because:',o:['Nuclear charge decreases down the group','Extra electron shells increase radius and shielding, which outweigh the increased nuclear charge','Atoms become smaller down the group','There are fewer electrons to remove'],a:2,w:'Down a group, extra shells are added. Both increased distance (radius) and increased shielding reduce the effective nuclear attraction on the outer electron more than the increased nuclear charge strengthens it — so IE falls.'},{q:'The anomalous dip in IE1 from P to S is because:',o:['S has a lower nuclear charge than P','P has a stable half-filled 3p3 sub-shell; removing an electron from S\'s 3p4 is easier due to extra electron-electron repulsion in the paired orbital','S has a larger radius than P','Sulfur is not in Period 3'],a:2,w:'Phosphorus has a half-filled 3p3 configuration, which is extra stable (each orbital singly occupied, minimal repulsion). Sulfur\'s 3p4 has one paired orbital, and the repulsion between the paired electrons makes one easier to remove, lowering IE1 below phosphorus.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Successive Ionisation Energies',su:'Use successive IE data to deduce electronic structure and group position.',steps:[
{lb:'What successive IEs show',dr:dQ2,ht:'<p><b>Successive ionisation energies</b> (IE1, IE2, IE3...) remove electrons one at a time from an already-positive ion, so each successive IE is LARGER than the last (removing an electron from a more positive ion, which also has fewer electrons repelling each other). A large JUMP between successive IEs indicates a new, lower (more stable, closer to nucleus) shell is being broken into.</p>'},
{lb:'Reading the magnesium data',dr:dQ2,ht:'<p>For Mg: IE1=738, IE2=1451, IE3=7733, IE4=10540 kJ/mol. The huge jump between IE2 (1451) and IE3 (7733) — more than 5×increase — shows that after removing 2 electrons (from the outer 3s² shell), the 3rd electron must come from a full, much closer inner shell (2s²2p⁶). This confirms Mg has 2 outer-shell electrons → Group 2.</p>'},
{lb:'Using the pattern to identify group number',dr:dQ2,ht:'<p>General rule: the position of the FIRST big jump in successive IEs tells you the number of outer-shell (valence) electrons = the position of the jump. If the big jump is after removing 1 electron → Group 1. After 2 → Group 2. After 3 → Group 13 (old Group 3). WAEC often gives a table of successive IEs and asks you to deduce the group of the unknown element X.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'An element X has successive IEs (kJ/mol): 590, 1145, 4912, 6474, 8144. In which group is X?',o:['Group 1','Group 2 — big jump occurs after removing the 2nd electron, so 2 electrons are in the outer shell','Group 3','Group 7'],a:2,w:'The big jump is between IE2 (1145) and IE3 (4912) — roughly a 4x increase. This means the 3rd electron comes from a much closer, more stable inner shell, so X has 2 outer-shell electrons: Group 2.'},{q:'Successive ionisation energies always increase because:',o:['The atom gets smaller as electrons are removed','Each electron is removed from an increasingly positive ion with fewer remaining electrons repelling each other, so each is held more tightly','The nuclear charge increases as electrons are removed','Electrons are removed from progressively lower energy levels only'],a:2,w:'As electrons are removed, the ion becomes more positively charged. With fewer electrons remaining and the same number of protons, each remaining electron is pulled in more strongly and experiences less repulsion, requiring more energy to remove the next one.'},{q:'A very large jump between IE4 and IE5 for an element indicates:',o:['The atom has exactly 4 electrons total','The 5th electron removed comes from a full inner shell that is much closer to the nucleus, i.e. the element has 4 outer-shell (valence) electrons','The element is a transition metal','IE5 must be a measurement error'],a:2,w:'A large jump signals a change of electron shell — the electron being removed after the jump comes from an inner, more tightly bound shell. A jump after IE4 means 4 electrons were in the outer shell, so the element has 4 valence electrons (Group 14/IV).'},{q:'Successive IE data is most directly useful for:',o:['Determining the melting point of an element','Deducing the number of outer-shell electrons and hence the group of the periodic table','Calculating the atomic radius directly','Determining whether a compound is ionic or covalent'],a:2,w:'The position of the large jump in successive ionisation energies directly reveals how many electrons are in the outer (valence) shell, which corresponds to the group number of the element.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Electronegativity and Metallic Character',su:'Examine electronegativity trends and the change from metallic to non-metallic character.',steps:[
{lb:'Electronegativity defined',dr:dQ3,ht:'<p><b>Electronegativity</b> = the relative ability of an atom to attract the shared pair of electrons in a covalent bond, measured on the Pauling scale (F = 4.0, the most electronegative element). It depends on nuclear charge, atomic radius and shielding — the same factors as ionisation energy, so the trends are similar.</p>'},
{lb:'Trend across a period and down a group',dr:dQ3,ht:'<p>Electronegativity INCREASES across a period (Na=0.9 to Cl=3.0) — increasing nuclear charge with no extra shielding pulls the bonding pair in more strongly. Electronegativity DECREASES down a group — increasing atomic radius and shielding weaken the attraction for the bonding pair despite the higher nuclear charge. Noble gases are usually excluded (they rarely form bonds).</p>'},
{lb:'Metallic to non-metallic character',dr:dQ3,ht:'<p>Across Period 3, elements change from METALLIC (Na, Mg, Al — lose electrons easily, form basic oxides) through METALLOID-like (Si) to NON-METALLIC (P, S, Cl — gain electrons or share electrons, form acidic oxides). This mirrors the increase in electronegativity and ionisation energy across the period. Down a group, metallic character INCREASES (e.g. Group 14: C is non-metal, Si is metalloid, Sn/Pb are metals).</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Electronegativity increases across Period 3 because:',o:['Atomic radius increases','Nuclear charge increases while shielding stays the same, so the bonding electron pair is pulled in more strongly','Elements become more metallic','The number of electron shells increases'],a:2,w:'Across a period, nuclear charge increases while electrons are added to the same shell (no extra shielding). This pulls the shared bonding pair closer to the more positive nucleus, increasing electronegativity.'},{q:'Which correctly describes the trend in metallic character down a group?',o:['Metallic character decreases down a group','Metallic character increases down a group as ionisation energy falls, making electron loss easier','Metallic character is unaffected by group position','Metallic character depends only on atomic mass'],a:2,w:'Down a group, ionisation energy decreases (electrons are further away, more shielded), so atoms lose electrons more readily — this is characteristic of metallic behaviour, so metallic character increases down a group.'},{q:'Fluorine has the highest electronegativity of all elements because it has:',o:['The largest atomic radius','A small atomic radius combined with a high effective nuclear charge and minimal shielding','The most electron shells','A negative oxidation state only'],a:2,w:'Fluorine\'s small size means its nucleus is very close to the bonding electron pair, and with high nuclear charge and only one inner shell of shielding, it attracts shared electrons more strongly than any other element.'},{q:'Which oxide would you expect to be the MOST acidic in Period 3?',o:['Na2O','MgO','Al2O3','SO3 — sulfur has the highest electronegativity of the listed elements and forms a strongly acidic, covalent oxide'],a:4,w:'Acidity of Period 3 oxides increases across the period as bonding changes from ionic (Na2O, MgO — basic) through amphoteric (Al2O3) to covalent/molecular (SO3 — strongly acidic, reacts with water to form H2SO4).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Period 3 Oxides — Structure and Acid-Base Character',su:'Relate bonding type in Period 3 oxides to their acid-base behaviour.',steps:[
{lb:'Structure across the period',dr:dQ4,ht:'<p>Na2O and MgO are GIANT IONIC lattices (metal + oxide ions, high melting points). Al2O3 is also giant ionic/covalent (intermediate character — amphoteric). SiO2 is GIANT COVALENT (macromolecular, like diamond — very high melting point but not ionic). P4O10 and SO3 are SIMPLE MOLECULAR (low melting points, held by weak van der Waals forces between covalent molecules).</p>'},
{lb:'Reactions with water',dr:dQ4,ht:'<p>Na2O + H2O → 2NaOH (strongly basic solution, pH ~14). MgO + H2O → Mg(OH)2 (weakly basic, mostly insoluble). Al2O3 does NOT react with water (insoluble, amphoteric — reacts with both acids AND bases). SiO2 does not react with water. P4O10 + 6H2O → 4H3PO4 (acidic). SO3 + H2O → H2SO4 (strongly acidic, pH ~1).</p>'},
{lb:'Amphoteric behaviour of Al2O3',dr:dQ4,ht:'<p>Al2O3 is AMPHOTERIC — it reacts with both acids and bases: Al2O3 + 6HCl → 2AlCl3 + 3H2O (acts as a base). Al2O3 + 2NaOH + 3H2O → 2NaAl(OH)4 (acts as an acid, forming sodium aluminate). This dual behaviour marks the transition point in Period 3 from metallic/basic oxides to non-metallic/acidic oxides.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Which Period 3 oxide is described as amphoteric?',o:['Na2O','MgO','Al2O3 — reacts with both acids and bases','SO3'],a:3,w:'Al2O3 reacts with acids (Al2O3+6HCl→2AlCl3+3H2O) and with bases (Al2O3+2NaOH+3H2O→2NaAl(OH)4), making it amphoteric — the transition point in Period 3 oxide behaviour.'},{q:'SiO2 has a very high melting point despite being a covalent compound because:',o:['It is actually ionic','It has a giant covalent (macromolecular) structure with strong covalent bonds throughout the lattice, like diamond','It has strong hydrogen bonds','It is a simple molecular substance with strong van der Waals forces'],a:2,w:'SiO2 forms a giant covalent lattice where every Si is bonded to 4 O atoms in a continuous 3D network of strong covalent bonds — melting requires breaking many covalent bonds, giving a very high melting point despite being covalent (not ionic).'},{q:'SO3 dissolved in water forms a solution with pH:',o:['pH 7 (neutral)','pH 10-11 (basic)','pH close to 1 (strongly acidic) — SO3 + H2O → H2SO4','pH cannot be determined'],a:3,w:'SO3 reacts with water to form sulfuric acid: SO3 + H2O → H2SO4, a strong acid that fully dissociates, giving a very low (strongly acidic) pH close to 1.'},{q:'The trend from basic to acidic oxides across Period 3 is best explained by:',o:['Increasing atomic mass','A change from ionic bonding (metal oxides) to covalent/molecular bonding (non-metal oxides) as electronegativity increases across the period','Decreasing nuclear charge','Random variation with no clear cause'],a:2,w:'As you cross Period 3, elements become less metallic and more electronegative. Oxide bonding shifts from ionic (basic, e.g. Na2O) to covalent/molecular (acidic, e.g. SO3), with Al2O3 as the amphoteric transition point.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Transition Metals — General Properties',su:'Examine the defining characteristics of d-block transition metals.',steps:[
{lb:'Definition and electron configuration',dr:dQ5,ht:'<p>A <b>transition metal</b> is an element that forms at least one stable ion with a partially filled d sub-shell. The d-block spans Sc to Zn in Period 4. Electron configuration fills 4s before 3d (Aufbau), but electrons are removed from 4s FIRST when forming ions (e.g. Fe: [Ar]3d6 4s2 → Fe2+: [Ar]3d6). Sc (forms only Sc3+, empty d) and Zn (forms only Zn2+, full d10) are NOT considered true transition metals by this strict definition.</p>'},
{lb:'Variable oxidation states',dr:dQ5,ht:'<p>Transition metals show VARIABLE OXIDATION STATES because the 3d and 4s electrons are similar in energy, so different numbers can be removed. Iron: Fe2+ and Fe3+ are both common. Copper: Cu+ and Cu2+. Manganese: +2 to +7 (in MnO4-). This variability underlies redox chemistry and enables transition metals to act as catalysts by cycling between oxidation states.</p>'},
{lb:'Coloured compounds',dr:dQ5,ht:'<p>Transition metal ions are typically COLOURED because the partially filled d orbitals split into two energy levels when ligands bond to the metal ion (crystal field splitting). Electrons absorb visible light to jump between these split d orbitals; the colour seen is the complementary colour to the light absorbed. Sc3+ (empty d) and Zn2+ (full d10) are colourless — no d-d electron transitions are possible.</p>'},
{lb:'Catalytic activity',dr:dQ5,ht:'<p>Transition metals and their compounds are effective CATALYSTS because: (1) variable oxidation states allow them to donate/accept electrons in intermediate steps (homogeneous catalysis, e.g. V2O5 in the Contact process cycling V5+↔V4+). (2) Large surface area with available d orbitals allows reactant molecules to adsorb and weaken bonds (heterogeneous catalysis, e.g. Fe in the Haber process, Ni in hydrogenation of alkenes).</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Why is Zn NOT classified as a true transition metal?',o:['Zinc does not conduct electricity','Zn2+ has a completely full 3d10 sub-shell in all its compounds — no partially filled d sub-shell','Zinc is not found in the d-block','Zinc has no oxidation states'],a:2,w:'The definition of a transition metal requires at least one ion with a PARTIALLY FILLED d sub-shell. Zn only ever forms Zn2+ ([Ar]3d10), which is completely full, so zinc does not meet the strict definition (similarly Sc3+ has an empty 3d0).'},{q:'When forming ions, transition metals lose electrons from which sub-shell first?',o:['3d','4s — despite filling after 3d, the 4s electrons are removed first when forming cations','4p','3p'],a:2,w:'Although 4s fills before 3d (Aufbau principle) because it is initially lower in energy for the neutral atom, once electrons are present in 3d, the 4s electrons become higher in energy in the ion and are removed FIRST. E.g. Fe: [Ar]3d6 4s2 → Fe2+ = [Ar]3d6 (4s electrons lost, not 3d).'},{q:'Transition metal ions are typically coloured because:',o:['They absorb all visible light equally','Ligands cause the d orbitals to split into two energy levels; electrons absorb visible light moving between them, and the unabsorbed (complementary) light is seen','They contain unpaired protons','Colour is unrelated to electron structure'],a:2,w:'Ligand bonding splits the d orbitals into two energy levels (crystal field splitting). Electrons can absorb specific visible wavelengths to jump between these levels; the colour observed is the complementary colour of the light absorbed.'},{q:'V2O5 acts as a catalyst in the Contact process by:',o:['Providing a fixed oxidation state throughout the reaction','Cycling between V5+ and V4+ oxidation states, using its variable oxidation states to help oxidise SO2 to SO3','Physically absorbing SO2 without reacting','Lowering the temperature of the reaction'],a:2,w:'V2O5 reduces to V2O4 (V5+ → V4+) while oxidising SO2 to SO3, then is re-oxidised back to V2O5 by O2 (V4+→V5+), completing a catalytic cycle. This is possible because vanadium has multiple accessible oxidation states.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Complex Ions and Ligands',su:'Examine ligands, coordination number, and the shapes of transition metal complexes.',steps:[
{lb:'Ligands and dative bonds',dr:dQ6,ht:'<p>A <b>ligand</b> is a molecule or ion that donates a lone pair of electrons to a central metal ion, forming a DATIVE (coordinate) covalent bond. Monodentate ligands donate ONE pair (H2O, NH3, Cl-, CN-, OH-). Bidentate ligands donate TWO pairs from two different atoms (e.g. NH2CH2CH2NH2, "en"). EDTA is hexadentate (6 donor atoms), forming very stable chelate complexes.</p>'},
{lb:'Coordination number',dr:dQ6,ht:'<p><b>Coordination number</b> = the number of dative bonds (coordinate bonds) from ligands to the central metal ion. Common coordination numbers: 6 (octahedral, most common for small ligands like H2O, NH3), 4 (tetrahedral, common for larger ligands like Cl-, or square planar for some d8 metals like Ni2+, Pt2+), 2 (linear, e.g. [Ag(NH3)2]+).</p>'},
{lb:'Shapes of complex ions',dr:dQ6,ht:'<p>Shape depends on coordination number: 6-coordinate → OCTAHEDRAL (90° bond angles), e.g. [Cu(H2O)6]2+. 4-coordinate with small ligands → TETRAHEDRAL (109.5°), e.g. [CuCl4]2-. 4-coordinate with some d8 metals → SQUARE PLANAR (90°), e.g. [Ni(CN)4]2-, cisplatin [Pt(NH3)2Cl2]. 2-coordinate → LINEAR (180°), e.g. [Ag(NH3)2]+.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'A ligand bonds to a central transition metal ion by:',o:['Sharing one electron with the metal (covalent bond)','Donating a lone pair of electrons to form a dative (coordinate) covalent bond','Transferring an electron completely (ionic bond)','Forming a hydrogen bond'],a:2,w:'Ligands are Lewis bases (electron-pair donors). They donate a lone pair of electrons into an empty orbital on the metal ion, forming a dative (coordinate) covalent bond — both electrons in the bond come from the ligand.'},{q:'EDTA is described as hexadentate because:',o:['It contains 6 carbon atoms','It has 6 donor atoms that can each form a dative bond to the same metal ion, forming a very stable chelate complex','It reacts with 6 different metal ions at once','It has a coordination number of 2'],a:2,w:'Hexadentate means EDTA has 6 lone-pair-donating atoms (4 O and 2 N) that all bond to a single metal ion simultaneously, wrapping around it and forming an extremely stable ring structure called a chelate complex.'},{q:'[CuCl4]2- typically has which shape?',o:['Octahedral','Tetrahedral — Cl- ligands are large, so only 4 fit around the Cu2+ ion','Linear','Square planar'],a:2,w:'Chloride ions are relatively large, so only 4 can fit around the central copper ion without excessive repulsion, giving a coordination number of 4 and a tetrahedral shape (bond angle 109.5°), unlike the smaller H2O/NH3 ligands which allow 6-coordination (octahedral).'},{q:'Which of these complex ions is LINEAR in shape?',o:['[Cu(H2O)6]2+','[CuCl4]2-','[Ag(NH3)2]+ — coordination number 2','[Ni(CN)4]2-'],a:3,w:'[Ag(NH3)2]+ has a coordination number of 2 (only two NH3 ligands bond to Ag+), giving a linear shape with a 180° bond angle. This is a classic example seen in the silver mirror test chemistry (Tollens\' reagent).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Chem \u2022 Y12',ti:'Ligand Substitution Reactions',su:'Examine colour changes during ligand substitution in transition metal complexes.',steps:[
{lb:'What is ligand substitution',dr:dQ7,ht:'<p><b>Ligand substitution</b>: one ligand in a complex ion is replaced by another. Because different ligands cause different amounts of d-orbital splitting, substitution is usually accompanied by a COLOUR CHANGE. Substitution can be partial (not all ligands replaced) or complete, depending on the ligand concentration and its ability to bond more strongly (e.g. Cl- can displace H2O if in large excess, despite H2O usually binding more strongly).</p>'},
{lb:'Copper complex substitutions',dr:dQ7,ht:'<p>[Cu(H2O)6]2+ (pale blue) + excess NH3(aq) → [Cu(NH3)4(H2O)2]2+ (deep blue solution) — only 4 of 6 water ligands are replaced (NH3 cannot fully displace all 6 due to steric/electronic factors). [Cu(H2O)6]2+ + excess concentrated HCl → [CuCl4]2- (yellow-green) — coordination number changes from 6 to 4 because Cl- ligands are larger.</p>'},
{lb:'Cobalt complex substitutions',dr:dQ7,ht:'<p>[Co(H2O)6]2+ (pink) + excess concentrated HCl → [CoCl4]2- (blue) — again, coordination number changes 6→4 due to larger Cl- ligands. This reaction is reversible: adding water back (diluting) shifts the equilibrium back to the pink octahedral [Co(H2O)6]2+. This is used as a qualitative test for water content/humidity (cobalt chloride paper).</p>'},
{lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Why does ligand substitution usually cause a colour change?',o:['The metal ion changes charge','Different ligands cause different amounts of d-orbital splitting, changing the energy (and hence wavelength/colour) of light absorbed','The complex becomes radioactive','Colour change never actually occurs in ligand substitution'],a:2,w:'Different ligands split the d orbitals by different amounts (different ligand field strengths). This changes the energy gap between split d orbitals, which changes the wavelength of visible light absorbed for d-d electron transitions, hence changing the observed colour.'},{q:'[Cu(H2O)6]2+ reacting with excess concentrated HCl produces:',o:['[Cu(NH3)4(H2O)2]2+, deep blue','[CuCl4]2-, yellow-green — coordination number changes from 6 to 4 because Cl- is a larger ligand','No reaction occurs','[Cu(OH)2], a blue precipitate'],a:2,w:'Excess concentrated Cl- (large ligand) displaces the smaller water ligands, but only 4 can fit around Cu2+ due to their larger size, changing coordination number from 6 (octahedral) to 4 (tetrahedral) and giving a yellow-green colour.'},{q:'The reaction [Co(H2O)6]2+ (pink) + 4Cl- ⇌ [CoCl4]2- (blue) + 6H2O demonstrates:',o:['An irreversible colour change','A reversible ligand substitution equilibrium — diluting with water shifts it back to pink [Co(H2O)6]2+ (Le Chatelier)','A change in oxidation state of cobalt','A precipitation reaction'],a:2,w:'This substitution is an equilibrium. Adding excess Cl- (e.g. concentrated HCl) shifts it right (blue); adding water shifts it left (pink) by Le Chatelier\'s Principle. This reversible colour change is used in cobalt chloride paper as a test for water.'},{q:'[Cu(H2O)6]2+ + excess NH3(aq) forms [Cu(NH3)4(H2O)2]2+ rather than [Cu(NH3)6]2+ because:',o:['NH3 cannot bond to copper at all','Only 4 of the 6 water ligands are typically substituted by NH3 under normal conditions — a partial substitution','Ammonia is too small to fit around copper','This reaction does not actually occur'],a:2,w:'With aqueous ammonia, typically only 4 of the 6 H2O ligands around Cu2+ are replaced by NH3, giving the characteristic deep blue [Cu(NH3)4(H2O)2]2+ complex — a well-known partial (not complete) ligand substitution.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Chem \u2022 Y12',ti:'WAEC Prep — Inorganic Chemistry (Periodicity and Transition Metals)',su:'Integrated revision across periodicity and transition metal chemistry.',steps:[
{lb:'Periodicity summary',dr:dQ8,ht:'<p>Across a period: atomic radius decreases, ionisation energy increases, electronegativity increases, metallic character decreases, oxides change from basic → amphoteric → acidic. Down a group: atomic radius increases, ionisation energy decreases, electronegativity decreases, metallic character increases. Always explain trends in terms of nuclear charge, shielding and atomic radius — never just state the trend without reasoning for WAEC full marks.</p>'},
{lb:'Transition metals summary',dr:dQ8,ht:'<p>Transition metals: d-block elements forming at least one ion with a partially filled d sub-shell. Key properties: variable oxidation states, coloured compounds (from d-orbital splitting by ligands), catalytic activity (heterogeneous and homogeneous), and formation of complex ions with ligands via dative bonding. Common shapes: octahedral (6-coordinate), tetrahedral (4-coordinate, larger ligands), square planar (4-coordinate, some d8 metals), linear (2-coordinate).</p>'},
{lb:'Common WAEC exam pitfalls',dr:dQ8,ht:'<p>Avoid: describing IE trend without mentioning shielding/nuclear charge/radius. Forgetting the Al and S anomalies in Period 3 IE trend. Confusing amphoteric (reacts with both acid AND base, e.g. Al2O3) with neutral. Saying transition metals are coloured "because they are metals" (the real reason is d-orbital splitting by ligands, and it requires a PARTIALLY filled d sub-shell). Mixing up coordination number (number of dative bonds) with the number of ligands when a ligand is bidentate/hexadentate.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Which best explains why atomic radius decreases across Period 3?',o:['Fewer electron shells are used','Nuclear charge increases while electrons enter the same shell, with no extra shielding, pulling the electron cloud inward','Electrons repel each other more','The atoms lose electrons across the period'],a:2,w:'Across a period, protons are added to the nucleus (increasing nuclear charge) while electrons are added to the SAME outer shell. Since shielding does not increase, the greater nuclear attraction pulls the electron cloud closer, decreasing atomic radius.'},{q:'A defining feature of a true transition metal is that it must form:',o:['A stable ion with a full d sub-shell','At least one stable ion with a PARTIALLY filled d sub-shell','Only one oxidation state','Coloured oxides only'],a:2,w:'The strict definition requires at least one ion with a partially filled d sub-shell — this is what enables variable oxidation states and coloured compounds via d-d electron transitions. Sc (empty d in Sc3+) and Zn (full d in Zn2+) are excluded.'},{q:'Which best explains the amphoteric nature of Al2O3?',o:['Al2O3 has no acid-base behaviour at all','Al2O3 sits at the transition point in Period 3 bonding character and can react as both a base (with acids) and an acid (with bases)','Al2O3 is a simple molecular oxide like SO3','Al2O3 only reacts with water'],a:2,w:'Al2O3 marks the transition from the ionic, basic metal oxides (Na2O, MgO) to the covalent, acidic non-metal oxides (P4O10, SO3). It can react with acids (acting as a base) and with alkalis (acting as an acid), making it amphoteric.'},{q:'A colour change during ligand substitution (e.g. pink to blue for cobalt with Cl-) occurs because:',o:['The cobalt changes oxidation state','The new ligand causes a different amount of d-orbital splitting, changing which wavelength of visible light is absorbed','The complex becomes non-polar','Colour changes are unrelated to ligand identity'],a:2,w:'Ligand substitution changes which ligand is bonded to the metal, and different ligands split the d orbitals by different amounts (different crystal field strength). This changes the energy (and wavelength) of light absorbed in d-d transitions, producing a different observed colour.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
