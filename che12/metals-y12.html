<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'The Reactivity Series',[['Metal','Reaction with water','Reaction with acid'],['Potassium/Sodium','Vigorous, even cold','Very violent'],['Zinc/Iron','Slow/none cold, reacts steam','Steady fizzing'],['Copper/Silver/Gold','No reaction','No reaction']]);}
function dQ2(p){drawTable(p,'Metal Extraction Methods',[['Reactivity','Method'],['K, Na, Ca, Mg, Al','Electrolysis'],['Zn, Fe, Sn, Pb','Reduction with carbon'],['Cu, Ag, Au','Found native or easily reduced']]);}
function dQ3(p){drawTable(p,'Common Metal Compounds and Uses',[['Compound','Use'],['CaCO3 (limestone)','Building, cement, glass'],['NaCl','Food preservation, chlor-alkali industry'],['CaO (quicklime)','Neutralising acidic soil, cement']]);}
function dQ4(p){drawTable(p,'Rusting of Iron',[['Requirement','Role'],['Oxygen','Reacts with iron (oxidation)'],['Water','Enables the electrochemical process'],['Prevention','Painting, galvanising, oiling, alloying']]);}
function dQ5(p){drawTable(p,'Alloys and Their Properties',[['Alloy','Composition','Property gained'],['Steel','Iron + carbon','Harder, stronger than pure iron'],['Brass','Copper + zinc','Harder, more corrosion resistant'],['Stainless steel','Iron + chromium + nickel','Resists rusting']]);}
function dQ6(p){drawTable(p,'WAEC Metals Summary',[['Concept','Key point'],['Reactivity series','Predicts displacement/extraction method'],['Rusting','Needs BOTH oxygen and water'],['Alloys','Mixed metals with improved properties']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'The Reactivity Series of Metals',su:'Use the reactivity series to predict reactions of metals with water and acids.',steps:[
{lb:'Reactions with cold water',dr:dQ1,ht:'<p>The MOST REACTIVE metals (potassium, sodium, calcium) react VIGOROUSLY with cold water, producing hydrogen gas and a metal hydroxide: 2Na + 2H2O \u2192 2NaOH + H2. LESS reactive metals (magnesium, zinc, iron) react very slowly (or only with steam, not cold water). The LEAST reactive metals (copper, silver, gold) do NOT react with water at all, even steam.</p>'},
{lb:'Reactions with dilute acids',dr:dQ1,ht:'<p>Metals ABOVE hydrogen in the reactivity series react with dilute acids to produce a salt and hydrogen gas: metal + acid \u2192 salt + H2. The rate of this reaction depends on reactivity \u2014 more reactive metals (e.g. magnesium) react vigorously, less reactive metals (e.g. iron) react more slowly, and metals BELOW hydrogen (copper, silver, gold) do NOT react with dilute acids at all.</p>'},
{lb:'Using the reactivity series to predict behaviour',dr:dQ1,ht:'<p>The reactivity series allows PREDICTIONS about: which metals will displace others from solution (more reactive displaces less reactive), which metals need electrolysis vs carbon reduction for extraction, and the relative vigour of reactions with water/acid. This is one of the most useful practical tools in WAEC chemistry for predicting outcomes without needing to memorise every individual reaction.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Which of these metals would react vigorously with COLD water?',o:['Copper','Gold','Sodium \u2014 a highly reactive metal that reacts vigorously even with cold water','Silver'],a:2,w:'Sodium is a highly reactive Group 1 metal that reacts vigorously with cold water (2Na+2H2O\u21922NaOH+H2), unlike copper, silver and gold, which are unreactive metals that do not react with water at all.'},{q:'Would you expect copper to react with dilute hydrochloric acid?',o:['Yes, vigorously','Yes, but only slowly','No \u2014 copper is below hydrogen in the reactivity series and does not react with dilute acids','Only if heated to a very high temperature'],a:2,w:'Copper is positioned BELOW hydrogen in the reactivity series, meaning it does not have sufficient reactivity to displace hydrogen from dilute acids \u2014 no reaction occurs between copper and dilute HCl or H2SO4.'},{q:'Magnesium reacts with steam but only very slowly (if at all) with cold water. Iron reacts with steam but not with cold water either. What does this tell us about their relative reactivity compared to sodium?',o:['Magnesium and iron are more reactive than sodium','Both magnesium and iron are LESS reactive than sodium, which reacts vigorously even with cold water \u2014 requiring the higher energy of steam to react at all shows their lower reactivity','Magnesium and iron do not react with anything','Sodium does not react with water at all'],a:2,w:'The fact that magnesium and iron require the higher energy input of steam (rather than cold water) to react confirms they are LESS reactive than sodium, which reacts vigorously even at room temperature with cold water \u2014 reactivity generally correlates with how readily a metal reacts with water under increasingly mild conditions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Extraction Methods Recap',su:'Match extraction methods to metal reactivity, recapping the link between the two.',steps:[
{lb:'Extraction depends on reactivity',dr:dQ2,ht:'<p>The METHOD used to extract a metal from its ore is directly determined by its position in the REACTIVITY SERIES: very reactive metals (K, Na, Ca, Mg, Al) require ELECTROLYSIS (since no chemical reducing agent is strong enough); moderately reactive metals (Zn, Fe, Sn, Pb) can be extracted by REDUCTION WITH CARBON (cheaper, since carbon is a sufficiently strong reducing agent); unreactive metals (Cu, Ag, Au) are often found NATIVE or require only mild processing.</p>'},
{lb:'Economic considerations in extraction',dr:dQ2,ht:'<p>Electrolysis is far more expensive than carbon reduction due to the large amounts of ELECTRICAL ENERGY required, plus the need to melt the ionic compound first (itself requiring significant energy). This is why industries always use the CHEAPEST viable method \u2014 carbon reduction is used whenever the metal is not too reactive for carbon to work.</p>'},
{lb:'Recycling as an alternative to extraction',dr:dQ2,ht:'<p>RECYCLING metals (melting down and reforming scrap metal) is often far cheaper and more energy-efficient than extracting new metal from ore, since it avoids the energy-intensive extraction process entirely. Recycling also conserves finite ore resources and reduces the environmental impact (mining, waste rock, energy use/emissions) associated with new extraction.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Why is recycling metals often considered more environmentally friendly than extracting new metal from ore?',o:['Recycling has no environmental benefit at all','Recycling avoids the energy-intensive extraction process (mining, reduction/electrolysis), reducing energy use, emissions, and the need for new mining activity','Recycling requires MORE energy than fresh extraction','Recycled metals are always lower quality'],a:2,w:'Recycling scrap metal (melting and reforming it) bypasses the energy-intensive steps of mining ore and chemically extracting the metal (via carbon reduction or electrolysis), significantly reducing energy consumption, associated emissions, and the environmental disruption caused by new mining.'},{q:'Zinc is extracted from its ore using carbon reduction rather than electrolysis mainly because:',o:['Zinc cannot be extracted at all','Zinc is moderately reactive, and carbon provides sufficient reducing power at a much lower cost than electrolysis would require','Electrolysis does not work on any metal ores','Zinc has no oxide compounds'],a:2,w:'Zinc\'s position in the reactivity series (moderately reactive) means the relatively cheap method of carbon reduction is strong enough to extract it from its oxide, avoiding the higher cost of electrolysis that would be needed for more reactive metals.'},{q:'The high cost of electrolysis for extracting very reactive metals (like aluminium) is mainly due to:',o:['The low cost of the raw ore','The large amount of ELECTRICAL ENERGY required to drive the electrolysis process, plus the energy needed to melt the very stable ionic compound first','Electrolysis actually being a free process','Aluminium ore being extremely rare'],a:2,w:'Electrolysis requires substantial electrical energy to drive the separation of ions, and the ionic compound must first be melted (itself energy-intensive for high-melting-point compounds like Al2O3) \u2014 both factors make electrolysis considerably more expensive than carbon reduction.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Common Metal Compounds and Their Uses',su:'Examine the properties and industrial uses of important metal compounds.',steps:[
{lb:'Calcium carbonate (limestone)',dr:dQ3,ht:'<p>Calcium carbonate (CaCO3, found as limestone/marble/chalk) is widely used in CONSTRUCTION (building stone, cement manufacture), and as a raw material for making LIME (calcium oxide, by thermal decomposition: CaCO3 \u2192 CaO + CO2) and GLASS. It is also used to neutralise excess acidity in soil (agricultural liming).</p>'},
{lb:'Sodium chloride and other salts',dr:dQ3,ht:'<p>Sodium chloride (NaCl, common salt) is essential for FOOD preservation and flavouring, and is the raw material for the CHLOR-ALKALI INDUSTRY (electrolysis of concentrated NaCl solution produces chlorine gas, hydrogen gas, and sodium hydroxide \u2014 all important industrial chemicals).</p>'},
{lb:'Calcium oxide and calcium hydroxide',dr:dQ3,ht:'<p>Calcium oxide (CaO, "quicklime") is used to NEUTRALISE acidic soil and in cement/mortar manufacture. Calcium hydroxide (Ca(OH)2, "slaked lime", formed by CaO + H2O \u2192 Ca(OH)2) is used similarly, and its solution (limewater) is the standard laboratory TEST for carbon dioxide gas (turns milky in its presence).</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Calcium carbonate (limestone) is thermally decomposed to produce calcium oxide (CaO) and which other product?',o:['Oxygen gas','Carbon dioxide gas (CaCO3\u2192CaO+CO2)','Hydrogen gas','Water only'],a:2,w:'Thermal decomposition of calcium carbonate follows: CaCO3\u2192CaO+CO2. This reaction requires significant heat energy and is a key industrial process for producing quicklime (CaO) for construction and other uses.'},{q:'The chlor-alkali industry uses electrolysis of concentrated sodium chloride solution to produce which THREE important products?',o:['Only sodium metal','Chlorine gas, hydrogen gas, and sodium hydroxide \u2014 all valuable industrial chemicals from a single electrolysis process','Only water and salt','Calcium carbonate and calcium oxide'],a:2,w:'Electrolysis of concentrated brine (sodium chloride solution) simultaneously produces chlorine gas (at the anode), hydrogen gas (at the cathode), and sodium hydroxide solution (remaining in solution) \u2014 three commercially valuable products from one industrial process.'},{q:'Limewater (calcium hydroxide solution) turning milky is the standard laboratory test for which gas?',o:['Oxygen','Hydrogen','Carbon dioxide \u2014 it reacts with the dissolved Ca(OH)2 to form insoluble CaCO3, causing the cloudy/milky appearance','Nitrogen'],a:2,w:'Carbon dioxide reacts with the calcium hydroxide dissolved in limewater to form insoluble calcium carbonate: Ca(OH)2+CO2\u2192CaCO3+H2O. The formation of this insoluble solid causes the characteristic milky/cloudy appearance that confirms CO2 is present.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Rusting of Iron and Its Prevention',su:'Examine the conditions required for rusting and methods to prevent it.',steps:[
{lb:'Conditions required for rusting',dr:dQ4,ht:'<p>Rusting requires BOTH oxygen AND water to occur together \u2014 iron in dry air does not rust significantly, and iron in water with no dissolved oxygen also does not rust significantly. Rusting is a redox reaction where iron is oxidised (loses electrons) and oxygen is reduced (gains electrons), ultimately forming hydrated iron(III) oxide (Fe2O3.xH2O).</p>'},
{lb:'Factors that speed up rusting',dr:dQ4,ht:'<p>Rusting is ACCELERATED by the presence of SALT (electrolytes increase the conductivity of the water film on the metal surface, speeding up the electrochemical process) \u2014 this is why cars in coastal areas or where roads are salted in winter rust faster. Acidic conditions can also accelerate rusting.</p>'},
{lb:'Methods of rust prevention',dr:dQ4,ht:'<p>Common rust prevention methods: PAINTING/OILING/GREASING (creates a barrier preventing oxygen and water from reaching the iron surface). GALVANISING (coating iron with a layer of zinc \u2014 zinc is more reactive than iron, so it corrodes preferentially, "sacrificing" itself to protect the iron underneath, even if the zinc coating is scratched). ALLOYING (e.g. making stainless steel by adding chromium/nickel, which forms a protective oxide layer resistant to further corrosion).</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Iron nails placed in dry air (no water present) generally do NOT rust significantly. This shows that rusting requires:',o:['Only oxygen is needed for rusting','BOTH oxygen and water together \u2014 the absence of water in this scenario prevents significant rusting, even with oxygen present','Neither oxygen nor water is needed','Only water is needed for rusting, not oxygen'],a:2,w:'This scenario demonstrates that oxygen ALONE (in dry air) is not sufficient to cause significant rusting \u2014 water must ALSO be present, confirming that BOTH oxygen and water are required together for the rusting process to proceed.'},{q:'Galvanising iron (coating it with zinc) protects it from rusting even if the zinc coating is scratched, because:',o:['Zinc has no effect on iron corrosion','Zinc is MORE reactive than iron, so it corrodes preferentially ("sacrificially"), continuing to protect the iron underneath even where the coating is damaged','Zinc makes iron completely unreactive permanently','Galvanising removes all oxygen from the surrounding air'],a:2,w:'Zinc is more reactive than iron, meaning it will oxidise (corrode) in preference to the iron underneath, even at points where the zinc coating has been scratched or damaged \u2014 this "sacrificial protection" continues to shield the iron from rusting until the zinc itself is used up.'},{q:'Why does rusting occur faster on iron structures near the coast, or on roads that are salted in winter?',o:['Salt has no effect on the rate of rusting','Salt increases the conductivity of the water film on the metal surface, speeding up the electrochemical (redox) reactions involved in rusting','Salt prevents oxygen from reaching the iron','Salt only affects rusting in very hot climates'],a:2,w:'Dissolved salt acts as an electrolyte, increasing the conductivity of any water film present on the iron surface. Since rusting is fundamentally an electrochemical (redox) process, this increased conductivity speeds up the reaction significantly, explaining faster rusting in salty/coastal environments.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Alloys and Their Properties',su:'Examine common alloys and why they have improved properties compared to pure metals.',steps:[
{lb:'What is an alloy',dr:dQ5,ht:'<p>An <b>alloy</b> is a mixture of a metal with one or more other elements (often another metal, or a non-metal like carbon), designed to have IMPROVED PROPERTIES compared to the pure metal alone \u2014 typically greater HARDNESS, STRENGTH, or corrosion resistance.</p>'},
{lb:'Why alloys are harder than pure metals',dr:dQ5,ht:'<p>In a PURE metal, atoms are arranged in uniform layers that can slide over each other relatively easily (making pure metals often too SOFT for practical use). In an ALLOY, atoms of DIFFERENT SIZES are mixed together, DISRUPTING the regular layered structure \u2014 this makes it much HARDER for layers to slide past each other, significantly increasing the hardness and strength of the alloy compared to the pure metal.</p>'},
{lb:'Common alloys and their uses',dr:dQ5,ht:'<p>STEEL (iron + carbon, sometimes + chromium/nickel for stainless steel): much harder and stronger than pure iron, widely used in construction, tools, vehicles. BRASS (copper + zinc): harder than pure copper, more resistant to corrosion, used for fittings, musical instruments. STAINLESS STEEL (iron + chromium + nickel): forms a thin, self-repairing protective chromium oxide layer, making it highly resistant to rusting/corrosion, used for cutlery, medical instruments, kitchen equipment.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Alloys are generally HARDER than the pure metals they are made from because:',o:['Alloys have fewer atoms than pure metals','Mixing atoms of DIFFERENT sizes disrupts the regular layered structure of the pure metal, making it harder for layers of atoms to slide past each other','Alloys always contain more electrons','Pure metals are always harder than alloys'],a:2,w:'In a pure metal, uniformly-sized atoms form regular layers that slide relatively easily over one another. Introducing atoms of a DIFFERENT size (as in an alloy) disrupts this regular arrangement, making it much more difficult for the layers to slide, thereby increasing hardness and strength.'},{q:'Stainless steel (iron + chromium + nickel) is prized for its resistance to rusting mainly because:',o:['It contains no iron at all','The chromium content forms a thin, self-repairing protective oxide layer on the surface, preventing further corrosion of the iron underneath','Stainless steel cannot conduct electricity','It is always kept away from oxygen and water'],a:2,w:'The chromium in stainless steel reacts with oxygen to form a very thin, tough, and self-repairing chromium oxide layer on the surface. This layer effectively seals the iron underneath from further contact with oxygen and water, providing excellent long-term resistance to rusting/corrosion.'},{q:'Brass (an alloy of copper and zinc) is often preferred over pure copper for certain fittings because brass is:',o:['Softer and more easily bent than pure copper','Harder and more resistant to corrosion than pure copper, due to the disrupted atomic structure caused by mixing copper and zinc atoms','Identical in properties to pure copper','Not actually a real alloy'],a:2,w:'Mixing zinc atoms into copper (forming brass) disrupts the regular atomic layers of pure copper, making brass considerably harder and more resistant to corrosion \u2014 desirable properties for fittings, valves, and musical instruments compared to using pure, softer copper.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Metals and Their Compounds',su:'Integrated revision of the reactivity series, extraction, rusting and alloys.',steps:[
{lb:'Reactivity series summary',dr:dQ1,ht:'<p>Reactivity determines: reaction vigour with water/acid, extraction method (electrolysis for very reactive, carbon reduction for moderate, native/simple processing for unreactive), and displacement reactions (more reactive metal displaces less reactive one from its compound).</p>'},
{lb:'Rusting and alloys summary',dr:dQ4,ht:'<p>Rusting requires BOTH oxygen and water; prevented by painting/oiling/galvanising/alloying. Alloys (mixed atom sizes) are harder than pure metals since the regular atomic layers are disrupted, making sliding more difficult. Common alloys: steel, brass, stainless steel, each chosen for specific improved properties.</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: forgetting rusting requires BOTH oxygen and water (not either alone). Confusing which extraction method suits which reactivity level. Forgetting WHY alloys are harder (disrupted atomic layer structure, not simply "more atoms"). Not naming the correct alloy composition when asked (e.g. brass = copper + zinc, not just "copper alloy").</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Which method would be used to extract sodium from its ore?',o:['Reduction with carbon','Electrolysis \u2014 sodium is too reactive for carbon to reduce its compounds effectively','Found native, requiring no extraction','Simple heating alone'],a:2,w:'Sodium is a very reactive metal, forming extremely stable compounds. Carbon cannot provide enough reducing power to extract such reactive metals, so electrolysis (a much stronger, though more expensive, method) is required instead.'},{q:'An iron gate is painted to prevent rusting. This works by:',o:['Removing all iron from the gate','Creating a physical barrier that prevents oxygen and water from reaching the iron surface, which are both needed for rusting to occur','Making the iron more reactive','Adding zinc to the iron'],a:2,w:'Paint forms a protective barrier coating that physically blocks oxygen and water from contacting the iron surface underneath. Since rusting requires BOTH these substances to be present together, blocking their access effectively prevents the rusting process.'},{q:'Steel (an alloy of iron and carbon) is harder than pure iron because:',o:['Steel contains no iron atoms','The carbon atoms (different in size from iron atoms) disrupt the regular layered structure of the iron, making it harder for the layers to slide past each other','Steel is actually a different pure element','Carbon has no effect on the properties of iron'],a:2,w:'Introducing carbon atoms (which are a different size from iron atoms) into the iron lattice disrupts the regular, uniform layers found in pure iron. This disruption makes it significantly harder for the metallic layers to slide past one another, resulting in the increased hardness and strength that makes steel so much more useful than pure iron for construction and manufacturing.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
