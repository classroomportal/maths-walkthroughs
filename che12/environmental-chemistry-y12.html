<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Major Atmospheric Greenhouse Gases',[['Gas','Main source','Relative warming effect'],['CO2','Combustion of fossil fuels, deforestation','Baseline (long-lived, high volume)'],['CH4','Cattle, rice paddies, gas leaks, landfill','~25x CO2 per molecule'],['N2O','Fertilisers, combustion','~300x CO2 per molecule'],['H2O vapour','Natural evaporation','Largest overall but short-lived']]);}
function dQ2(p){drawTable(p,'The Carbon Cycle \u2014 Key Processes',[['Process','Effect on atmospheric CO2'],['Photosynthesis','Removes CO2 (fixes carbon into plants)'],['Respiration','Releases CO2'],['Combustion','Releases CO2 (fast, fossil sources)'],['Ocean absorption','Removes CO2 (slow, forms carbonic acid)']]);}
function dQ3(p){drawTable(p,'Acid Rain Formation',[['Pollutant','Source','Reaction with water/O2'],['SO2','Burning sulfur-containing fossil fuels','SO2+H2O\u2192H2SO3; further oxidised to H2SO4'],['NOx','High-temperature combustion (car engines)','2NO+O2\u21922NO2; NO2+H2O\u2192HNO3+HNO2']]);}
function dQ4(p){drawTable(p,'Ozone Depletion \u2014 CFC Catalytic Cycle',[['Step','Reaction'],['UV breaks CFC','CFCl3 \u2192 CFCl2\u2022 + Cl\u2022'],['Cl radical destroys ozone','Cl\u2022 + O3 \u2192 ClO\u2022 + O2'],['Regeneration','ClO\u2022 + O \u2192 Cl\u2022 + O2 (Cl\u2022 regenerated, catalytic)']]);}
function dQ5(p){drawTable(p,'Water Pollution Indicators',[['Term','Meaning'],['BOD','Biochemical Oxygen Demand \u2014 O2 used by microbes to break down organic waste'],['Eutrophication','Excess nutrients (N,P) cause algal bloom, then O2 depletion'],['Heavy metals','Pb, Hg, Cd \u2014 toxic, bioaccumulate in food chain']]);}
function dQ6(p){drawTable(p,'Catalytic Converter Reactions',[['Reactant','Product','Catalyst'],['CO + NO','CO2 + N2 (reduction)','Pt/Rh'],['Unburnt hydrocarbons + O2','CO2 + H2O (oxidation)','Pt/Pd'],['NOx','N2 + O2 (reduction)','Rh']]);}
function dQ7(p){drawTable(p,'Green Chemistry Principles (selected)',[['Principle','Application'],['Prevent waste','Design processes with high atom economy'],['Use renewable feedstocks','Bio-based over petroleum-based'],['Reduce energy use','Lower reaction temperature/pressure where possible'],['Design safer chemicals','Avoid persistent, toxic, bioaccumulative substances']]);}
function dQ8(p){drawTable(p,'WAEC Environmental Chemistry Summary',[['Issue','Main cause'],['Global warming','CO2, CH4, N2O trap infrared radiation'],['Acid rain','SO2 and NOx form acids in atmosphere'],['Ozone depletion','CFCs release Cl radicals (catalytic)'],['Eutrophication','Excess fertiliser runoff (N, P) into water']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'The Greenhouse Effect and Global Warming',su:'Examine how greenhouse gases trap infrared radiation and contribute to climate change.',steps:[
{lb:'The greenhouse effect mechanism',dr:dQ1,ht:'<p>The Sun emits mostly short-wavelength (visible/UV) radiation, which passes through the atmosphere and warms the Earth\'s surface. The warmed Earth re-emits LONG-wavelength INFRARED radiation. Greenhouse gases (CO2, CH4, N2O, H2O vapour) ABSORB this infrared radiation (their molecular bonds vibrate at matching frequencies) and re-radiate it in all directions, including back towards Earth \u2014 trapping heat that would otherwise escape to space. This natural effect keeps Earth habitable; the ENHANCED greenhouse effect (from human activity) causes additional warming.</p>'},
{lb:'Sources of the main greenhouse gases',dr:dQ1,ht:'<p>CO2: combustion of fossil fuels (coal, oil, gas), deforestation (less photosynthesis to remove it), cement production. CH4: cattle digestion (enteric fermentation), rice paddy cultivation, natural gas leaks, decomposing waste in landfills. N2O: nitrogen-based fertiliser use, combustion processes. Although CO2 is emitted in far greater quantity, CH4 and N2O trap MUCH more heat per molecule.</p>'},
{lb:'Relative warming potential',dr:dQ1,ht:'<p>Global Warming Potential (GWP) compares a gas\'s heat-trapping ability to CO2 (GWP=1) over a set time period (usually 100 years). Methane has a GWP of roughly 25 (traps ~25x more heat per molecule than CO2, though it breaks down faster in the atmosphere). N2O has a GWP of roughly 300. This is why reducing methane emissions (e.g. capturing landfill gas, reducing gas flaring) can have a large short-term climate benefit despite lower emitted volumes.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Greenhouse gases contribute to global warming by:',o:['Reflecting all sunlight back to space','Absorbing infrared radiation re-emitted by the Earth\'s surface and re-radiating some of it back towards Earth, trapping heat','Blocking all radiation from the Sun entirely','Cooling the upper atmosphere only'],a:2,w:'Greenhouse gas molecules absorb outgoing long-wavelength infrared radiation from the Earth\'s surface. Some of this absorbed energy is re-emitted back towards the surface, adding to the warming effect rather than allowing the heat to escape to space.'},{q:'Why is methane (CH4) considered a more potent greenhouse gas per molecule than CO2, despite being emitted in smaller quantities?',o:['Methane reflects sunlight more strongly','Methane has a much higher Global Warming Potential (traps roughly 25x more heat per molecule than CO2 over 100 years)','Methane is more abundant than CO2','Methane does not absorb infrared radiation at all'],a:2,w:'Methane\'s molecular structure allows it to absorb infrared radiation more effectively per molecule than CO2, giving it a Global Warming Potential around 25x that of CO2 over a 100-year timeframe, even though total emitted mass is much lower.'},{q:'A major source of atmospheric N2O is:',o:['Ocean evaporation','Nitrogen-based fertiliser use in agriculture and high-temperature combustion','Photosynthesis in plants','Volcanic activity only'],a:2,w:'N2O is released from soil microbial processes acting on nitrogen-based fertilisers, as well as from certain combustion processes. It is a particularly potent greenhouse gas, with a GWP roughly 300x that of CO2.'},{q:'Why does the natural greenhouse effect need to be distinguished from the "enhanced" greenhouse effect?',o:['They are exactly the same phenomenon with no difference','The natural greenhouse effect keeps Earth habitably warm; the enhanced effect refers to ADDITIONAL warming caused by human-increased concentrations of greenhouse gases beyond natural levels','The natural greenhouse effect cools the Earth','The enhanced greenhouse effect only occurs at the poles'],a:2,w:'The natural greenhouse effect (from naturally occurring CO2, water vapour etc.) is essential and keeps Earth\'s average temperature suitable for life. The "enhanced" greenhouse effect refers specifically to the ADDITIONAL warming caused by human activities increasing greenhouse gas concentrations beyond natural background levels.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'The Carbon Cycle',su:'Examine how carbon moves between the atmosphere, biosphere, oceans and geosphere.',steps:[
{lb:'Natural carbon cycle processes',dr:dQ2,ht:'<p>Carbon moves continuously between reservoirs: PHOTOSYNTHESIS removes CO2 from the atmosphere, fixing carbon into plant biomass (6CO2+6H2O\u2192C6H12O6+6O2). RESPIRATION (in plants, animals, decomposers) releases CO2 back to the atmosphere as organic matter is broken down for energy. These two processes are roughly balanced over long timescales in a stable, undisturbed system.</p>'},
{lb:'Human disturbance of the cycle',dr:dQ2,ht:'<p>COMBUSTION of fossil fuels releases CARBON THAT HAS BEEN LOCKED AWAY for millions of years, adding "new" CO2 to the atmosphere much faster than natural processes can remove it. DEFORESTATION reduces the amount of photosynthesis occurring, removing a natural CO2 sink and often releasing stored carbon (through burning or decomposition of cleared vegetation) at the same time \u2014 a "double" contribution to rising atmospheric CO2.</p>'},
{lb:'Ocean carbon absorption',dr:dQ2,ht:'<p>Oceans absorb roughly a quarter of human CO2 emissions, dissolving CO2 to form carbonic acid: CO2 + H2O \u21cc H2CO3. This is slowly lowering ocean pH ("ocean acidification"), which threatens marine organisms that build calcium carbonate shells/skeletons (corals, shellfish) as the equilibrium shifts to dissolve existing carbonate structures.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Photosynthesis affects the carbon cycle by:',o:['Releasing CO2 into the atmosphere','Removing CO2 from the atmosphere and fixing the carbon into plant biomass','Having no effect on atmospheric CO2 levels','Only occurring in the ocean'],a:2,w:'Photosynthesis (6CO2+6H2O\u2192C6H12O6+6O2) removes carbon dioxide from the atmosphere and converts it into organic carbon compounds stored in plant tissue, acting as a natural CO2 sink.'},{q:'Deforestation contributes to rising atmospheric CO2 in TWO ways because it:',o:['Only increases CO2 through burning cleared vegetation','Reduces the amount of photosynthesis removing CO2 AND often releases stored carbon when cleared vegetation is burned or decomposes','Increases photosynthesis capacity','Has no measurable effect on the carbon cycle'],a:2,w:'Deforestation removes trees that would otherwise photosynthesise and absorb CO2 (removing a sink), while the act of clearing land (often by burning) releases the carbon that was stored in that vegetation \u2014 a double negative impact on atmospheric CO2.'},{q:'Ocean absorption of CO2 forms which compound, lowering ocean pH?',o:['Sulfuric acid','Carbonic acid (H2CO3), from CO2 + H2O \u21cc H2CO3','Nitric acid','Hydrochloric acid'],a:2,w:'Dissolved CO2 reacts with water to form carbonic acid (H2CO3), a weak acid that partially dissociates, lowering ocean pH over time \u2014 a process known as ocean acidification, which threatens organisms with calcium carbonate shells or skeletons.'},{q:'Why is CO2 from fossil fuel combustion considered problematic for the carbon cycle balance?',o:['It releases carbon that has been locked away for millions of years, adding it to the atmosphere far faster than natural sinks (photosynthesis, ocean absorption) can remove it','Fossil fuel CO2 is chemically different from natural CO2','Fossil fuels do not actually release CO2','It only affects the ocean, not the atmosphere'],a:1,w:'Fossil fuels represent carbon that was removed from the active carbon cycle over millions of years (buried as coal, oil, gas). Burning them rapidly returns this carbon to the atmosphere on a timescale far shorter than the natural processes that originally sequestered it, disrupting the previously balanced cycle.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Acid Rain \u2014 Formation, Effects and Prevention',su:'Examine the chemistry of acid rain formation and industrial prevention methods.',steps:[
{lb:'How acid rain forms',dr:dQ3,ht:'<p>SO2 is released mainly from burning sulfur-containing fossil fuels (especially coal). In the atmosphere: SO2 + H2O \u2192 H2SO3 (sulfurous acid), which is further oxidised (often catalysed by dust particles or ozone) to H2SO4 (sulfuric acid). NOx (NO and NO2) forms from high-temperature combustion (e.g. in car engines, where atmospheric N2 and O2 react): N2+O2\u21922NO, then 2NO+O2\u21922NO2. NO2 reacts with water to form a mixture of nitric acid (HNO3) and nitrous acid (HNO2).</p>'},
{lb:'Effects of acid rain',dr:dQ3,ht:'<p>Acid rain (pH often 4-5, sometimes lower) causes: (1) damage to plant leaves and disruption of soil chemistry, leaching essential nutrients (Ca2+, Mg2+) and releasing toxic Al3+ into soil water. (2) Acidification of lakes and rivers, harming aquatic life (many fish species cannot survive below pH 5). (3) Corrosion of limestone/marble buildings and statues (CaCO3 + H2SO4 \u2192 CaSO4 + H2O + CO2). (4) Corrosion of metal structures and infrastructure.</p>'},
{lb:'Prevention methods',dr:dQ3,ht:'<p>Prevention: (1) FLUE GAS DESULFURISATION (FGD) \u2014 exhaust gases from power stations are passed through a slurry of calcium carbonate or calcium hydroxide, which reacts with SO2: SO2 + CaCO3 + \u00bdO2 \u2192 CaSO4 + CO2 (or similar with Ca(OH)2), removing it before release. (2) Using LOW-SULFUR fuels. (3) CATALYTIC CONVERTERS in vehicle exhausts reduce NOx emissions (converting NOx to harmless N2 and O2). (4) Switching to renewable energy sources reduces both SO2 and NOx at source.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'The main source of atmospheric SO2 that leads to acid rain is:',o:['Photosynthesis','Burning sulfur-containing fossil fuels, especially coal, in power stations','Ocean evaporation','Nitrogen fixation by bacteria'],a:2,w:'SO2 is released when sulfur impurities present in fossil fuels (particularly coal) are oxidised during combustion. This SO2 later reacts with atmospheric water and oxygen to form sulfuric acid, a main component of acid rain.'},{q:'Flue gas desulfurisation (FGD) works by:',o:['Cooling exhaust gases to remove SO2 physically','Passing exhaust gases through calcium carbonate or calcium hydroxide slurry, which reacts chemically with SO2 to form calcium sulfate, removing it before release','Adding more SO2 to neutralise other pollutants','Filtering out CO2 only'],a:2,w:'FGD systems react SO2 chemically with a calcium-based slurry (CaCO3 or Ca(OH)2): SO2+CaCO3+\u00bdO2\u2192CaSO4+CO2, converting the harmful SO2 into a solid calcium sulfate product that can be safely disposed of or used industrially (e.g. in plasterboard manufacture), removing it from the exhaust stream.'},{q:'NOx gases form during combustion mainly because:',o:['Fuel always contains large amounts of nitrogen','High temperatures in engines cause atmospheric N2 and O2 (both normally unreactive) to react together, forming NO which is further oxidised to NO2','NOx is added deliberately to fuel','Combustion never produces NOx'],a:2,w:'At the high temperatures reached inside engines, normally inert atmospheric N2 gains enough energy to react with O2 (N2+O2\u21922NO), and this NO is further oxidised in air to NO2, both contributing to acid rain formation when they later react with atmospheric water.'},{q:'Acid rain damages limestone buildings and statues through the reaction:',o:['CaCO3 does not react with acid rain','CaCO3 + H2SO4 \u2192 CaSO4 + H2O + CO2, dissolving and weakening the stone over time','CaCO3 absorbs acid rain without reacting','Acid rain only affects metal structures, not stone'],a:2,w:'Calcium carbonate (the main component of limestone and marble) reacts with the sulfuric acid in acid rain, converting solid CaCO3 into soluble products and releasing CO2 gas, gradually eroding and weakening stone structures over time.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Ozone Depletion and CFCs',su:'Examine the catalytic mechanism by which CFCs destroy stratospheric ozone.',steps:[
{lb:'The ozone layer\'s role',dr:dQ4,ht:'<p>Stratospheric OZONE (O3) absorbs harmful UV radiation from the Sun, protecting living organisms on Earth\'s surface from UV-induced damage (e.g. skin cancer, DNA damage, harm to plant growth and marine ecosystems). Natural ozone formation/destruction is normally balanced: O2 + UV \u2192 2O; O + O2 \u2192 O3 (formation); O3 + UV \u2192 O2 + O (natural breakdown).</p>'},
{lb:'CFCs and the catalytic destruction cycle',dr:dQ4,ht:'<p>CFCs (chlorofluorocarbons, e.g. CFCl3) were once widely used as refrigerants and aerosol propellants. They are very STABLE in the lower atmosphere but drift up to the stratosphere, where intense UV radiation breaks the C-Cl bond (homolytic fission): CFCl3 \u2192 CFCl2\u2022 + Cl\u2022. The chlorine RADICAL then destroys ozone catalytically: Cl\u2022 + O3 \u2192 ClO\u2022 + O2, then ClO\u2022 + O \u2192 Cl\u2022 + O2 \u2014 regenerating the Cl\u2022 radical, which can go on to destroy MANY more ozone molecules (a chain reaction).</p>'},
{lb:'Why the catalytic cycle is so damaging',dr:dQ4,ht:'<p>Because the chlorine radical is REGENERATED at the end of the cycle (not consumed), a SINGLE Cl atom can destroy tens of thousands of ozone molecules before it is eventually removed from the stratosphere by other reactions. This catalytic nature explains why even small amounts of CFCs could cause disproportionately large ozone depletion, leading to the "ozone hole" observed over Antarctica. International action (the Montreal Protocol) phased out CFC production and use.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'CFCs cause ozone depletion because, in the stratosphere, UV radiation:',o:['Converts CFCs directly into ozone','Breaks the C-Cl bond in CFCs to release chlorine radicals, which then react with and destroy ozone molecules','Has no effect on CFC molecules','Destroys CFCs completely before they can react with ozone'],a:2,w:'Intense UV radiation in the stratosphere provides enough energy to break the relatively weak C-Cl bond in CFC molecules (homolytic fission), releasing highly reactive chlorine radicals that go on to destroy ozone.'},{q:'The chlorine radical destroys ozone in a CATALYTIC cycle because:',o:['It is consumed completely after reacting with just one ozone molecule','It is regenerated at the end of the reaction sequence (ClO\u2022 + O \u2192 Cl\u2022 + O2), allowing it to destroy many more ozone molecules repeatedly','Chlorine radicals do not actually react with ozone','The cycle only happens once per CFC molecule'],a:2,w:'After Cl\u2022 reacts with O3 to form ClO\u2022, the ClO\u2022 reacts further with atomic oxygen to regenerate Cl\u2022. Since the chlorine radical is not permanently consumed, it can repeat this destructive cycle many thousands of times, making even small quantities of CFCs disproportionately damaging.'},{q:'Why does even a small amount of CFC release cause significant ozone layer damage?',o:['CFCs react with ozone in a 1:1 stoichiometric ratio only','Because the chlorine radical acts catalytically, being regenerated to destroy many thousands of ozone molecules per single chlorine atom released','CFCs are extremely abundant in the atmosphere','Ozone reacts with all atmospheric gases equally'],a:2,w:'The catalytic nature of the Cl\u2022 destruction cycle means the chlorine is not used up \u2014 it is regenerated and can go on to destroy vast numbers of additional ozone molecules, meaning small CFC quantities can cause a disproportionately large depletion effect.'},{q:'What is the main function of stratospheric ozone that makes its depletion a serious concern?',o:['It has no important function','It absorbs harmful UV radiation, protecting living organisms on Earth\'s surface from UV damage','It traps infrared radiation like a greenhouse gas','It produces oxygen for breathing'],a:2,w:'Stratospheric ozone absorbs a significant portion of the Sun\'s harmful UV radiation before it reaches Earth\'s surface. Depletion of this ozone layer allows more UV radiation through, increasing risks such as skin cancer, cataracts, and damage to ecosystems.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Water Pollution and Eutrophication',su:'Examine BOD, eutrophication and heavy metal contamination in water systems.',steps:[
{lb:'Biochemical Oxygen Demand (BOD)',dr:dQ5,ht:'<p><b>BOD</b> = the amount of dissolved oxygen consumed by microorganisms as they break down organic matter in a water sample over a fixed time (usually 5 days at 20\u00b0C). HIGH BOD indicates HIGH levels of organic pollution (e.g. sewage, agricultural runoff, food processing waste) \u2014 microorganisms use up available oxygen decomposing this waste, leaving LESS oxygen for fish and other aquatic organisms, potentially causing them to suffocate.</p>'},
{lb:'Eutrophication process',dr:dQ5,ht:'<p><b>Eutrophication</b>: excess nutrients (especially nitrates and phosphates from fertiliser runoff or sewage) enter a water body, causing explosive ALGAL BLOOM growth. The algae eventually die and are decomposed by bacteria, which consume large amounts of dissolved oxygen (raising BOD) \u2014 this can deplete oxygen levels so severely that fish and other aquatic life die ("dead zones"). The algal bloom also blocks sunlight, killing underwater plants that would otherwise produce oxygen.</p>'},
{lb:'Heavy metal contamination',dr:dQ5,ht:'<p>Heavy metals (lead, mercury, cadmium) are toxic pollutants from industrial discharge, mining, and some pesticides. Unlike organic pollutants, they do NOT break down biologically \u2014 they persist and BIOACCUMULATE, becoming increasingly concentrated up the food chain (biomagnification). Even low environmental concentrations can reach dangerous levels in top predators (including humans consuming contaminated fish). Effects include neurological damage (Pb, Hg) and kidney damage (Cd).</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'A water sample with a HIGH BOD value indicates:',o:['Very clean, unpolluted water','High levels of organic pollution, since microorganisms are consuming large amounts of oxygen to decompose the waste present','No microorganisms are present','The water contains no dissolved oxygen at all naturally'],a:2,w:'BOD measures how much oxygen microorganisms use decomposing organic matter in the water. A high BOD means there is a lot of organic waste to decompose, which uses up large amounts of dissolved oxygen \u2014 an indicator of significant organic pollution.'},{q:'Eutrophication typically begins with:',o:['A decrease in nutrients entering the water','Excess nutrients (nitrates/phosphates) from fertiliser runoff or sewage causing rapid algal bloom growth','A sudden drop in water temperature','The introduction of heavy metals'],a:2,w:'Eutrophication is triggered by an excess supply of nutrients (mainly nitrates and phosphates) entering a water body, which causes algae to grow explosively (algal bloom), setting off the subsequent chain of oxygen depletion.'},{q:'Why does eutrophication ultimately kill fish and other aquatic organisms?',o:['Algae directly poison the fish','Decomposing dead algae consume large amounts of dissolved oxygen (raising BOD), depleting oxygen levels that fish and other organisms need to survive','The water becomes too acidic','Fish cannot see through the algae'],a:2,w:'After the algal bloom dies, bacteria decomposing the dead algae consume large quantities of dissolved oxygen from the water. This can lower oxygen levels so much that fish and other aerobic aquatic organisms suffocate and die.'},{q:'Heavy metal pollutants like mercury are particularly dangerous because they:',o:['Break down quickly and harmlessly in water','Do not break down biologically and bioaccumulate, becoming more concentrated up the food chain (biomagnification)','Only affect plants, not animals','Evaporate completely from water within hours'],a:2,w:'Heavy metals are not broken down by biological processes. They persist in the environment and accumulate in organisms\' tissues over time. As predators eat contaminated prey, the metal concentration increases at each step of the food chain (biomagnification), reaching dangerous levels in top predators including humans.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Industrial Pollution Control \u2014 Catalytic Converters',su:'Examine how catalytic converters reduce harmful vehicle emissions.',steps:[
{lb:'Why catalytic converters are needed',dr:dQ6,ht:'<p>Internal combustion engines produce several harmful pollutants: carbon monoxide (CO, toxic, incomplete combustion), unburnt hydrocarbons (contribute to smog, are toxic/carcinogenic), and nitrogen oxides (NOx, contribute to acid rain and smog). A CATALYTIC CONVERTER, fitted in the exhaust system, uses precious metal catalysts (platinum, palladium, rhodium) coated onto a ceramic honeycomb (large surface area) to convert these pollutants into less harmful gases before they exit the exhaust.</p>'},
{lb:'The reactions occurring',dr:dQ6,ht:'<p>Oxidation reactions (Pt/Pd catalyst): 2CO + O2 \u2192 2CO2. Unburnt hydrocarbons + O2 \u2192 CO2 + H2O. Reduction reactions (Rh catalyst): 2NOx \u2192 N2 + xO2 (simplified; e.g. 2CO + 2NO \u2192 2CO2 + N2, which conveniently uses up CO while reducing NOx simultaneously). The overall effect converts three harmful pollutants (CO, unburnt hydrocarbons, NOx) into much less harmful CO2, H2O and N2.</p>'},
{lb:'Limitations of catalytic converters',dr:dQ6,ht:'<p>Limitations: catalytic converters do NOT reduce CO2 emissions (in fact CO output is converted TO CO2, a greenhouse gas) \u2014 they only address toxic/smog-forming pollutants, not global warming. They need to reach a minimum operating temperature to work effectively (less effective on short, cold journeys). They can be "poisoned" (deactivated) by leaded fuel, which is why unleaded fuel is required in vehicles fitted with catalytic converters.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'A catalytic converter converts carbon monoxide into:',o:['Carbon (soot)','Carbon dioxide, via oxidation with oxygen (2CO+O2\u21922CO2)','Methane','Nothing, CO passes through unchanged'],a:2,w:'The oxidation catalyst (Pt/Pd) in a catalytic converter facilitates the reaction 2CO+O2\u21922CO2, converting toxic carbon monoxide into carbon dioxide, which although a greenhouse gas is far less immediately toxic.'},{q:'Which statement about catalytic converters is TRUE?',o:['They eliminate all vehicle CO2 emissions','They reduce toxic/smog-forming pollutants (CO, unburnt hydrocarbons, NOx) but do NOT reduce CO2 emissions \u2014 in fact they convert CO into CO2','They only work on diesel engines','They remove sulfur dioxide from exhaust gases'],a:2,w:'Catalytic converters specifically target CO, unburnt hydrocarbons and NOx, converting them into CO2, H2O and N2. They do not address CO2 (a greenhouse gas) at all, and in fact convert some CO into additional CO2 as part of the oxidation process.'},{q:'Catalytic converters can be "poisoned" (deactivated) by:',o:['Unleaded petrol','Leaded fuel, since lead compounds coat and block the catalyst surface, which is why unleaded fuel is required','Water vapour in the exhaust','Nitrogen gas'],a:2,w:'Lead compounds from leaded fuel physically coat the catalyst surface, blocking the active sites and permanently reducing its effectiveness ("poisoning" the catalyst). This is why vehicles with catalytic converters must use unleaded fuel.'},{q:'The reduction reaction 2CO+2NO\u21922CO2+N2 in a catalytic converter is useful because it:',o:['Only removes CO, not NOx','Simultaneously reduces harmful NOx to harmless N2 while also oxidising toxic CO to CO2, addressing two pollutants in one reaction','Produces additional NOx','Has no chemical benefit'],a:2,w:'This reaction is particularly efficient because it deals with two pollutants at once: CO is oxidised to CO2 while NO is simultaneously reduced to harmless N2 gas, using the reducing power of CO to help remove the NOx pollutant.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Chem \u2022 Y12',ti:'Green Chemistry and Sustainable Industry',su:'Examine principles of green chemistry and their application to industrial and Nigerian energy contexts.',steps:[
{lb:'What is green chemistry',dr:dQ7,ht:'<p><b>Green chemistry</b> is the design of chemical products and processes that reduce or eliminate hazardous substances and waste. Key principles include: preventing waste rather than treating/cleaning it up afterwards; maximising atom economy; using safer, less toxic solvents and reagents; designing energy-efficient processes (lower temperature/pressure where possible); and using renewable feedstocks over non-renewable ones where feasible.</p>'},
{lb:'Applying green chemistry industrially',dr:dQ7,ht:'<p>Examples: choosing catalysed processes that operate at lower temperature/pressure (saving energy and reducing CO2 emissions, e.g. improved catalysts for the Haber process). Designing reactions with HIGH atom economy (e.g. addition reactions, 100% atom economy, over substitution reactions that generate waste by-products). Recycling and reusing solvents/catalysts rather than discarding them after single use.</p>'},
{lb:'Nigerian context: gas flaring and sustainability',dr:dQ7,ht:'<p>In the Niger Delta, associated natural gas released during crude oil extraction has historically been "flared" (burned off) rather than captured, releasing CO2 and other pollutants (including unburnt methane and particulates) with no economic benefit and significant health/environmental impact on local communities. Green chemistry approaches encourage CAPTURING this gas for useful purposes (e.g. electricity generation, LPG production, petrochemical feedstock) instead of flaring, reducing both waste and greenhouse gas emissions while creating economic value.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'A core principle of green chemistry is to:',o:['Maximise waste production for economic growth','Prevent waste at its source, rather than treating or cleaning it up after it is generated','Use only the most toxic reagents available','Ignore energy efficiency in industrial design'],a:2,w:'One of the foundational principles of green chemistry is that it is far better (and usually cheaper in the long run) to design processes that prevent waste from being generated in the first place, rather than dealing with waste after the fact.'},{q:'Choosing a catalysed industrial process that operates at LOWER temperature and pressure is a green chemistry benefit because it:',o:['Increases energy consumption','Reduces energy consumption (and associated CO2 emissions from generating that energy), while still achieving an acceptable reaction rate via the catalyst','Has no relationship to sustainability','Always decreases product yield'],a:2,w:'Lower operating temperatures and pressures reduce the energy required to run the industrial process. Since much of this energy typically comes from burning fossil fuels, reducing energy demand also reduces associated CO2 emissions \u2014 a genuine green chemistry improvement, made possible without sacrificing rate by using an effective catalyst.'},{q:'Gas flaring in the Niger Delta is considered environmentally problematic mainly because it:',o:['Produces useful electricity for local communities','Releases CO2, unburnt methane and particulates into the atmosphere with no economic benefit, while gas capture could instead provide useful energy/feedstock','Removes all pollutants from crude oil extraction','Has no chemical products at all'],a:2,w:'Flaring burns off associated natural gas without capturing any useful energy value, simply releasing greenhouse gases and pollutants into the atmosphere. Green chemistry / sustainability approaches favour capturing this gas for productive use (e.g. power generation, LPG) instead.'},{q:'Which of these industrial reaction types has the HIGHEST atom economy, an important green chemistry consideration?',o:['Substitution reactions producing several by-products','Addition reactions (e.g. polymerisation), since all reactant atoms typically end up in the single product with no by-products','Reactions producing large quantities of waste salts','Reactions requiring toxic solvents'],a:2,w:'Addition reactions (such as alkene polymerisation) combine reactants into a single product without generating by-products, giving 100% atom economy \u2014 the most resource-efficient outcome from a green chemistry perspective, as no reactant mass is wasted.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Environmental Chemistry',su:'Integrated revision across global warming, acid rain, ozone depletion and pollution.',steps:[
{lb:'Environmental issues summary',dr:dQ8,ht:'<p>Global warming: CO2, CH4, N2O absorb and re-radiate infrared radiation (enhanced greenhouse effect). Acid rain: SO2 and NOx react with atmospheric water/oxygen to form H2SO4/HNO3, lowering rainfall pH, damaging ecosystems and structures. Ozone depletion: CFCs release Cl radicals that catalytically destroy stratospheric O3, reducing UV protection. Water pollution: high BOD and eutrophication deplete dissolved oxygen; heavy metals bioaccumulate up the food chain.</p>'},
{lb:'Prevention and mitigation strategies',dr:dQ8,ht:'<p>Prevention strategies: flue gas desulfurisation (removes SO2 before release), catalytic converters (reduce CO, unburnt hydrocarbons, NOx from vehicles), CFC replacement with safer alternatives (following the Montreal Protocol), reducing fertiliser runoff and treating sewage properly (prevents eutrophication), and green chemistry principles (waste prevention, atom economy, renewable feedstocks, energy efficiency) applied industrially.</p>'},
{lb:'Common WAEC mistakes',dr:dQ8,ht:'<p>Avoid: confusing acid rain (SO2/NOx forming acids) with the greenhouse effect (CO2/CH4/N2O trapping infrared radiation) \u2014 these are different mechanisms with different gases. Confusing ozone depletion (stratospheric, caused by CFCs via Cl radicals) with the greenhouse effect (tropospheric warming). Forgetting that catalytic converters do NOT reduce CO2/greenhouse gas emissions. Not explaining WHY a mechanism works (e.g. state the catalytic regeneration of Cl radicals, not just "CFCs are bad").</p>'},
{lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Which pair correctly matches an environmental issue with its main chemical cause?',o:['Ozone depletion \u2014 caused mainly by CO2 emissions','Global warming \u2014 caused mainly by CFCs releasing chlorine radicals','Acid rain \u2014 caused mainly by SO2 and NOx forming acids in the atmosphere','Eutrophication \u2014 caused mainly by CFC release'],a:3,w:'Acid rain results from SO2 (forming H2SO4) and NOx (forming HNO3/HNO2) reacting with atmospheric water and oxygen. Ozone depletion is caused by CFCs (via Cl radicals). Global warming is caused by greenhouse gases (CO2, CH4, N2O). Eutrophication is caused by excess nutrient runoff.'},{q:'The Montreal Protocol was an international agreement aimed at:',o:['Reducing CO2 emissions to limit global warming','Phasing out the production and use of CFCs to protect the stratospheric ozone layer','Banning the use of fertilisers to prevent eutrophication','Regulating catalytic converter design'],a:2,w:'The Montreal Protocol (1987) specifically targeted ozone-depleting substances, primarily CFCs, requiring their phase-out to allow the stratospheric ozone layer to recover over time \u2014 it is considered one of the most successful international environmental agreements.'},{q:'A key difference between the mechanisms of the greenhouse effect and ozone depletion is that:',o:['They are caused by exactly the same gases','The greenhouse effect involves gases absorbing and re-radiating infrared radiation in the lower atmosphere, while ozone depletion involves a catalytic radical chain reaction destroying O3 in the stratosphere','Ozone depletion causes global cooling only','The greenhouse effect only occurs at the poles'],a:2,w:'These are chemically distinct processes: the greenhouse effect involves IR absorption/re-emission by gases like CO2/CH4 throughout the atmosphere, while ozone depletion is a specific catalytic radical chain reaction (involving Cl\u2022 from CFCs) that destroys ozone specifically in the stratosphere.'},{q:'Why is it important for WAEC answers to explain the MECHANISM behind an environmental issue, not just name the cause?',o:['Mechanism explanations are not required for full marks','Explaining the mechanism (e.g. how Cl radicals catalytically destroy ozone, or how greenhouse gases absorb/re-emit IR) demonstrates true understanding and is required for full marks, rather than just naming the pollutant','WAEC only wants pollutant names listed','Mechanisms are optional extra content'],a:2,w:'WAEC marking schemes typically award marks for explaining HOW a process occurs (e.g. the catalytic radical cycle destroying ozone, or the mechanism of infrared absorption/re-emission by greenhouse gases), not simply for identifying which pollutant is involved.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
