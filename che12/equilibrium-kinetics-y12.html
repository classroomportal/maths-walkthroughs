<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Equilibrium and Kc — Key Facts',ACC,12,'middle',true));
var rows=[['Dynamic equilibrium','Forward rate = reverse rate; concentrations constant'],['Kc expression','Kc = [products]^n / [reactants]^m — products over reactants'],['Kc >> 1','Equilibrium lies right — products strongly favoured'],['Kc << 1','Equilibrium lies left — reactants strongly favoured'],['Temperature','ONLY thing that changes Kc value'],['Catalyst','Speeds both directions equally — no effect on Kc or position'],['Le Chatelier','System opposes any change applied to it at equilibrium']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,28+i*30,460,24,CRM,LINE,1));o.push(T(130,42+i*30,r[0],ACC,8,'middle',true));o.push(T(330,42+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Rate Equations — Key Relationships',ACC,12,'middle',true));
var rows=[['Rate equation','rate = k[A]^n[B]^m — must be determined by experiment'],['0th order in A','Doubling [A] → rate unchanged; graph [A] vs t is straight line'],['1st order in A','Doubling [A] → rate doubles; ln[A] vs t is straight line'],['2nd order in A','Doubling [A] → rate ×4; 1/[A] vs t is straight line'],['Units of k (1st)','s⁻¹'],['Units of k (2nd)','mol⁻¹ dm³ s⁻¹'],['Half-life (1st order)','t½ = 0.693/k — constant, independent of concentration']];
rows.forEach(function(r,i){if(i<p){o.push(R(10,28+i*30,460,24,CRM,LINE,1));o.push(T(120,42+i*30,r[0],ACC,8,'middle',true));o.push(T(320,42+i*30,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Equilibrium & Kinetics — Summary',ACC,12,'middle',true));
var rows=[['Kc','[products]^stoich / [reactants]^stoich — only T changes it'],['Le Chatelier','↑[reactant] → shift right; ↑T exothermic → shift left'],['Haber 450°C','Compromise: better rate than low T; better yield than high T'],['Rate = k[A]^n','Orders from experiment; k from rate at known concentrations'],['Arrhenius','k = Ae^(−Ea/RT); ln k vs 1/T gives gradient = −Ea/R'],['t½ = 0.693/k','First order only; constant half-life; e.g. radioactive decay']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*32,460,26,CRM,LINE,1));o.push(T(120,52+i*32,r[0],ACC,9,'middle',true));o.push(T(320,52+i*32,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Writing and Interpreting Kc',su:'Write Kc expressions and interpret their values.',steps:[
{lb:'Kc expression',dr:dQ1,ht:'<p>For aA + bB ⇌ cC + dD: <b>Kc = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ</b> (concentrations in mol dm⁻³; exponents = stoichiometric coefficients). Pure solids and liquids are excluded. Kc only changes with temperature: <b>Increase T → exothermic reaction has LOWER Kc; endothermic has HIGHER Kc.</b> Concentration, pressure, catalyst changes shift equilibrium position but do NOT change Kc.</p>'},
{lb:'Interpreting Kc values',dr:dQ1,ht:'<p>Kc values: Kc >> 1 (e.g. 10⁶): reaction goes almost to completion; products strongly favoured. Kc = 1: equal concentrations of products and reactants at equilibrium. Kc << 1 (e.g. 10⁻⁶): very little product; reactants strongly favoured. The Haber Process N₂+3H₂⇌2NH₃: Kc is moderate at 450°C (~10²) — significant but not complete conversion to NH₃. Le Chatelier\'s Principle predicts shifts without changing Kc.</p>'},
{lb:'Calculating Kc',dr:dQ2,ht:'<p>ICE method: Initial, Change, Equilibrium. For H₂(g) + I₂(g) ⇌ 2HI(g) in 1dm³: Initial 0.50mol H₂, 0.50mol I₂, 0mol HI. At equilibrium: 0.11mol H₂, 0.11mol I₂, 0.78mol HI. [H₂]=[I₂]=0.11; [HI]=0.78. Kc = (0.78)²/(0.11×0.11) = 0.608/0.0121 = 50. Large Kc → HI strongly favoured at this temperature.</p>'},
{lb:'Le Chatelier and industrial equilibria',dr:dQ1,ht:'<p>Le Chatelier\'s Principle: system shifts to oppose any change. Applications: Haber (N₂+3H₂⇌2NH₃, ΔH=−92): high P shifts right (4 moles→2 moles gas); low T gives higher Kc but too slow; 450°C/200atm/Fe catalyst compromise. Contact (2SO₂+O₂⇌2SO₃, ΔH=−196): 450°C/V₂O₅/1atm gives 99% yield (high yield already at atmospheric P). In each: conditions are economic compromises between yield, rate and equipment cost.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'For N₂(g)+3H₂(g)⇌2NH₃(g), the Kc expression is:',o:['Kc=[N₂][H₂]³/[NH₃]²','Kc=[NH₃]²/([N₂][H₂]³)','Kc=[NH₃]/([N₂][H₂])','Kc=[N₂][H₂]/[NH₃]²'],a:2,w:'Products over reactants with stoichiometric exponents: Kc = [NH₃]² / ([N₂]¹ × [H₂]³). Products (NH₃, coefficient 2) in numerator; reactants (N₂ coefficient 1; H₂ coefficient 3) in denominator.'},{q:'For an exothermic reaction at equilibrium, increasing temperature:',o:['Increases Kc (more products)','Decreases Kc (shifts left, less product)','Has no effect on Kc','Increases Kc only if a catalyst is also added'],a:2,w:'Exothermic forward: increasing T shifts equilibrium LEFT (endothermic direction). [Products] decreases, [Reactants] increases → Kc = [products]/[reactants] DECREASES. Temperature is the ONLY variable that changes Kc.'},{q:'H₂(g)+I₂(g)⇌2HI(g). At equilibrium: [H₂]=0.10, [I₂]=0.10, [HI]=0.60 mol/dm³. Kc =',o:['6.0','36','0.28','0.60'],a:2,w:'Kc = [HI]²/([H₂][I₂]) = (0.60)²/(0.10×0.10) = 0.36/0.010 = 36. Large Kc means HI is strongly favoured at equilibrium.'},{q:'A catalyst added to a system at equilibrium:',o:['Shifts equilibrium right (more products)','Has no effect on position or Kc — equilibrium reached faster only','Changes Kc by lowering activation energy','Shifts equilibrium left (more reactants)'],a:2,w:'Catalyst: speeds up BOTH forward and reverse reactions equally. Does NOT shift equilibrium position. Does NOT change Kc. Allows equilibrium to be reached FASTER — important industrially when rate is limiting.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Rate Equations and Orders',su:'Determine and use rate equations experimentally.',steps:[
{lb:'Finding orders by initial rates',dr:dQ2,ht:'<p>Rate equation: rate = k[A]ⁿ[B]ᵐ. Orders found EXPERIMENTALLY only — not from stoichiometry. Method: keep [B] constant; vary [A]. If doubling [A] → rate ×2: 1st order (n=1). If rate ×4: 2nd order (n=2). If rate unchanged: 0th order (n=0). Example: [A] doubles from 0.10→0.20 mol/dm³; rate increases from 2.0×10⁻³ to 8.0×10⁻³ mol/dm³/s (×4). Order in A = 2 (second order). Then find k: k = rate/([A]²[B]ᵐ) using any equilibrium data row.</p>'},
{lb:'Half-life and 1st order reactions',dr:dQ2,ht:'<p><b>Half-life (t½)</b>: time for concentration to fall to half its value. First-order ONLY: t½ = 0.693/k — constant (same at every stage). This is characteristic of 1st order. Radioactive decay is always 1st order. Second order: t½ doubles each half-life. Identification from graph: [A] vs t with constant t½ → 1st order. Or plot ln[A] vs t → straight line for 1st order. The rate constant k can be found from the gradient of ln[A] vs t: k = −gradient.</p>'},
{lb:'Arrhenius equation',dr:dQ1,ht:'<p>k = Ae^(−Ea/RT). ln k = ln A − Ea/(RT). A = pre-exponential factor; Ea = activation energy; R = 8.314 J/mol/K; T = temperature (K). Plot ln k (y) vs 1/T (x) → straight line; gradient = −Ea/R → Ea = −gradient × R. Higher T → lower 1/T → higher ln k → larger k → faster rate. Catalyst lowers Ea → larger k at same T → faster rate. Maxwell-Boltzmann: higher T → more molecules with KE ≥ Ea (area under curve right of Ea increases exponentially).</p>'},
{lb:'Mechanisms and the rate-determining step',dr:dQ2,ht:'<p>Multi-step reactions: slowest step = rate-determining step (RDS). The rate equation reflects only steps up to and including the RDS. Example: Step 1 (fast): A + B → C. Step 2 (slow, RDS): C + D → products. Rate = k[C][D]. Substituting [C] from Step 1: rate = k\'[A][B][D] — overall 3rd order. If step 1 is the RDS: rate = k[A][B]. Species in rate equation but NOT in overall equation: intermediates formed before the RDS. WAEC: explain how a proposed mechanism is consistent with the observed rate equation.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Doubling [A] quadruples the rate; [B] has no effect. The rate equation is:',o:['rate = k[A][B]','rate = k[A]²','rate = k[B]²','rate = k[A]²[B]'],a:2,w:'Doubling [A] → rate ×4 = 2² → 2nd order in A. [B] has no effect → 0th order in B. Rate equation: rate = k[A]². Overall order = 2.'},{q:'For a first-order reaction with k = 0.0231 s⁻¹, the half-life is:',o:['t½ = 30.0 s','t½ = 43.3 s','t½ = 21.6 s','t½ = 0.023 s'],a:1,w:'t½ = 0.693/k = 0.693/0.0231 = 30.0 s. First-order half-life: t½ = ln2/k = 0.693/k. This is CONSTANT for first-order reactions — same at any concentration.'},{q:'The gradient of a plot of ln k vs 1/T (Arrhenius plot) equals:',o:['−Ea/R → Ea = −gradient × R','−Ea → Ea = −gradient','Ea/R → Ea = gradient × R','ln A — the pre-exponential factor'],a:1,w:'ln k = ln A − (Ea/R)(1/T). Gradient = −Ea/R. Therefore Ea = −gradient × R = −gradient × 8.314 J/mol/K. The y-intercept = ln A (pre-exponential factor).'},{q:'The rate equation for a reaction is rate = k[NO]²[O₂]. The likely rate-determining step involves:',o:['One NO molecule and one O₂ molecule','Two NO molecules and one O₂ molecule (matching the rate equation)','Three O₂ molecules','Two O₂ molecules and no NO'],a:2,w:'The rate equation rate = k[NO]²[O₂] means the RDS involves 2 molecules of NO and 1 molecule of O₂ (or species derived from them in earlier fast equilibrium steps). The molecularity of the RDS matches the orders in the rate equation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Acids, Bases and Buffers',su:'Apply acid-base theory and buffer calculations.',steps:[
{lb:'Acid-base definitions',dr:dQ1,ht:'<p>Brønsted-Lowry: acid = H⁺ donor; base = H⁺ acceptor. Strong acid: fully dissociates (HCl, H₂SO₄, HNO₃). Weak acid: partially dissociates; Ka = [H⁺][A⁻]/[HA]. pKa = −logKa. Smaller pKa = stronger acid. Kw = [H⁺][OH⁻] = 10⁻¹⁴ at 25°C; pH + pOH = 14. Strong acid pH: pH = −log[acid]. Weak acid pH: [H⁺] = √(Ka×c); pH = ½(pKa − logc). Strong base: pOH = −log[base]; pH = 14 − pOH. Lewis acid = e⁻ pair acceptor; Lewis base = e⁻ pair donor.</p>'},
{lb:'pH calculations',dr:dQ2,ht:'<p>Examples: 0.10 mol/dm³ HCl: pH = −log(0.10) = 1.00. 0.10 mol/dm³ NaOH: pOH = 1.00; pH = 13.00. 0.10 mol/dm³ CH₃COOH (Ka = 1.7×10⁻⁵): [H⁺] = √(1.7×10⁻⁵×0.10) = √(1.7×10⁻⁶) = 1.30×10⁻³ mol/dm³; pH = −log(1.30×10⁻³) = 2.89. Titration: at half-equivalence point, pH = pKa. At equivalence point with weak acid + strong base: pH > 7 (basic salt). At equivalence point with strong acid + strong base: pH = 7.</p>'},
{lb:'Buffer solutions',dr:dQ1,ht:'<p>Buffer: resists pH change when small amounts of H⁺ or OH⁻ added. Acidic buffer: weak acid + its salt (e.g. CH₃COOH/CH₃COONa). Add H⁺: reacts with A⁻ → HA. Add OH⁻: reacts with HA → A⁻ + H₂O. pH = pKa + log([A⁻]/[HA]) (Henderson-Hasselbalch). Maximum buffer capacity when [HA] = [A⁻]: pH = pKa. Blood buffers: HCO₃⁻/CO₂ (pH 7.4); H₂PO₄⁻/HPO₄²⁻. pH deviation of ±0.4 from 7.4 is life-threatening — body regulates CO₂ levels via breathing rate.</p>'},
{lb:'Indicators and titration curves',dr:dQ2,ht:'<p>Indicator = weak acid where HIn and In⁻ have different colours; changes at pKa of indicator. Choose indicator whose range covers the sharp change at equivalence point. Strong acid + strong base: sharp change at pH 7; use methyl orange OR phenolphthalein. Weak acid + strong base: equivalence point pH > 7; use phenolphthalein (range 8.3-10). Strong acid + weak base: equivalence point pH < 7; use methyl orange (range 3.1-4.4). Weak acid + weak base: no sharp change; no suitable indicator; use conductimetric titration or pH meter.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Calculate the pH of 0.050 mol/dm³ HCl(aq):',o:['pH = 1.00','pH = 1.30','pH = 2.00','pH = 0.69'],a:2,w:'HCl is a strong acid: fully dissociates. [H⁺] = 0.050 mol/dm³. pH = −log(0.050) = −log(5.0×10⁻²) = 2 − log5 = 2 − 0.70 = 1.30.'},{q:'A buffer contains 0.20 mol/dm³ CH₃COOH and 0.40 mol/dm³ CH₃COONa (pKa = 4.76). pH =',o:['pH = 4.76','pH = 4.46','pH = 5.06','pH = 3.76'],a:3,w:'pH = pKa + log([A⁻]/[HA]) = 4.76 + log(0.40/0.20) = 4.76 + log(2) = 4.76 + 0.30 = 5.06.'},{q:'In a titration of weak acid (CH₃COOH) with strong base (NaOH), the equivalence point pH is:',o:['pH = 7.00 (neutral)','pH > 7 (basic — salt CH₃COONa is a weak base, hydrolyses water)','pH < 7 (acidic — excess acid remains)','pH = pKa of CH₃COOH'],a:2,w:'At equivalence: all CH₃COOH converted to CH₃COO⁻Na⁺. CH₃COO⁻ is a weak base (conjugate of weak acid): CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻. Solution is BASIC (pH > 7).'},{q:'The most appropriate indicator for a strong acid / weak base titration is:',o:['Phenolphthalein (range 8.3-10) — endpoint is basic','Methyl orange (range 3.1-4.4) — equivalence point is acidic','Litmus (range 6-8) — equivalence point is near neutral','Universal indicator — gives a gradual colour change'],a:2,w:'Strong acid + weak base: equivalence point pH < 7 (acidic salt). Need indicator with range covering the acidic equivalence point. Methyl orange (range 3.1-4.4) is appropriate. Phenolphthalein range (8.3-10) would not work.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Electrochemistry',su:'Apply electrode potentials, calculate E°cell and solve Faraday\'s law problems.',steps:[
{lb:'Standard electrode potentials',dr:dQ2,ht:'<p>E°(half-cell) measured vs SHE (E°=0V). More positive E°: stronger oxidising agent (easier to reduce). E°cell = E°(cathode) − E°(anode). Positive E°cell → spontaneous. ΔG° = −nFE°cell. Key values (V): Li⁺/Li −3.05; Al³⁺/Al −1.66; Zn²⁺/Zn −0.76; Fe²⁺/Fe −0.44; H⁺/H₂ 0.00; Cu²⁺/Cu +0.34; Fe³⁺/Fe²⁺ +0.77; Ag⁺/Ag +0.80; Cl₂/Cl⁻ +1.36; F₂/F⁻ +2.87. Species with higher E° is the oxidising agent in any pair.</p>'},
{lb:'Predicting feasibility',dr:dQ1,ht:'<p>To determine if a redox reaction is spontaneous: write two half-equations; assign E° values; calculate E°cell = E°(reduction) − E°(oxidation). If E°cell > 0: thermodynamically feasible. Example: can Cl₂ oxidise Fe²⁺? Fe²⁺→Fe³⁺+e⁻ (reverse of E°=+0.77) and Cl₂+2e⁻→2Cl⁻ (E°=+1.36). E°cell = 1.36 − 0.77 = +0.59V → YES, feasible. Can I₂ oxidise Fe²⁺? I₂+2e⁻→2I⁻ (E°=+0.54). E°cell = 0.54 − 0.77 = −0.23V → NOT feasible. Important: E° predicts thermodynamic feasibility, not rate.</p>'},
{lb:'Faraday\'s law calculations',dr:dQ2,ht:'<p>Q = I × t (coulombs = amps × seconds). mol e⁻ = Q / F (F = 96500 C/mol). mol product = mol e⁻ / charge on ion. Mass = mol × Mr. Example: deposit silver (Ag⁺+e⁻→Ag) at 0.50A for 30 min. Q = 0.50×1800 = 900C. mol e⁻ = 900/96500 = 9.33×10⁻³. mol Ag = 9.33×10⁻³ (1:1 ratio). Mass Ag = 9.33×10⁻³ × 107.9 = 1.006g ≈ 1.01g. For Cu (Cu²⁺+2e⁻→Cu): mol Cu = mol e⁻/2.</p>'},
{lb:'Electrolysis — products and applications',dr:dQ1,ht:'<p>At cathode (reduction, −ve): most easily reduced species first. High E° → discharged preferentially. At anode (oxidation, +ve): if inert — OH⁻ oxidised (O₂) unless high [Cl⁻] (Cl₂). If reactive anode (e.g. Cu) — anode dissolves. Applications: Copper refining (impure Cu anode dissolves; pure Cu plates onto cathode; impurities collect as anode sludge). Electroplating: thin layer of metal deposited for corrosion protection or decoration. Chlor-alkali: electrolysis of brine → Cl₂ (anode) + NaOH + H₂ (cathode). Aluminium extraction from molten Al₂O₃/cryolite (must be molten — solid is non-conductor).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'E°(Cu²⁺/Cu)=+0.34V; E°(Zn²⁺/Zn)=−0.76V. For Zn+Cu²⁺→Zn²⁺+Cu: E°cell =',o:['E°cell = −1.10V (non-spontaneous)','E°cell = +0.42V','E°cell = +1.10V (spontaneous)','E°cell = −0.42V'],a:3,w:'Zn is oxidised (anode); Cu²⁺ is reduced (cathode). E°cell = E°(cathode) − E°(anode) = +0.34 − (−0.76) = +1.10V. Positive → spontaneous. Cu²⁺ is a stronger oxidising agent than Zn²⁺, so Cu²⁺ oxidises Zn.'},{q:'In the electrolysis of dilute H₂SO₄, the gas at the ANODE is:',o:['H₂ — from reduction of H⁺','O₂ — from oxidation of OH⁻/H₂O','SO₃ — from oxidation of SO₄²⁻','CO₂ — from organic impurities'],a:2,w:'At anode (oxidation): 2H₂O → O₂ + 4H⁺ + 4e⁻ or 4OH⁻ → O₂ + 2H₂O + 4e⁻. Oxygen is produced at the anode in dilute aqueous electrolytes with inert electrodes. H₂ is produced at the cathode.'},{q:'2.00A flows for 965s through CuSO₄(aq). Mass of Cu deposited (Mr=63.5):',o:['0.32g','0.63g','1.27g','2.54g'],a:2,w:'Q = 2.00×965 = 1930C. mol e⁻ = 1930/96500 = 0.0200. Cu²⁺+2e⁻→Cu: mol Cu = 0.0200/2 = 0.0100. Mass = 0.0100×63.5 = 0.635 ≈ 0.63g.'},{q:'Which statement about standard electrode potentials is CORRECT?',o:['A more positive E° means the species is a stronger reducing agent','A more positive E° means the species is more easily reduced (stronger oxidising agent)','E° changes with concentration of the electrolyte','E° is always positive for spontaneous reactions'],a:2,w:'More positive E°: species is more easily REDUCED → stronger OXIDISING agent. E.g. F₂ (E°=+2.87V) is the strongest oxidising agent; Li⁺ (E°=−3.05V) is the weakest. E° is the reduction potential — higher means easier to reduce.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Organic Chemistry — Mechanisms',su:'Apply organic reaction mechanisms and functional group tests.',steps:[
{lb:'Reaction mechanism types',dr:dQ1,ht:'<p>Mechanism types: (1) <b>Free radical substitution</b> — alkanes + halogen/UV; initiation (Cl₂→2Cl•)/propagation/termination. (2) <b>Electrophilic addition</b> — alkenes + HBr/Br₂; C=C acts as nucleophile; carbocation intermediate; Markovnikov\'s rule. (3) <b>Nucleophilic substitution</b> — haloalkanes; SN1 (tertiary) or SN2 (primary). (4) <b>Nucleophilic addition</b> — carbonyl (C=O) + HCN → hydroxynitrile. (5) <b>Electrophilic aromatic substitution</b> — benzene + HNO₃/H₂SO₄ → nitrobenzene (NO₂⁺ electrophile). Reagent classification: nucleophile = e⁻-pair donor; electrophile = e⁻-pair acceptor; radical = unpaired electron.</p>'},
{lb:'Haloalkane reactions',dr:dQ2,ht:'<p>Haloalkanes (R-X): hydrolysis with NaOH(aq)/heat → alcohol + NaX. Rate: C-I > C-Br > C-Cl (bond enthalpy: weaker = faster). SN2: primary haloalkane; one step; Nu attacks from back → inversion; rate = k[RX][Nu]. SN1: tertiary; two steps; C-X breaks first → carbocation; Nu attacks; racemisation; rate = k[RX]. Identification: AgNO₃/EtOH → precipitate. AgCl (white, soluble in dilute NH₃); AgBr (cream, soluble in conc NH₃); AgI (yellow, insoluble in NH₃). Heat sample with NaOH(aq) first to hydrolyse; then acidify and add AgNO₃.</p>'},
{lb:'Carbonyl chemistry',dr:dQ1,ht:'<p>Aldehydes (RCHO) vs ketones (RCOR\'): both have C=O; react with nucleophiles. HCN addition: CN⁻ attacks C of C=O (electrophilic C) → hydroxynitrile (cyanohydrin). Distinguishing: Tollens\' reagent → silver mirror with aldehyde only. Fehling\'s solution → brick-red Cu₂O with aldehyde only. Acidified K₂Cr₂O₇ → aldehyde oxidised (orange→green); ketone NOT oxidised. Primary alcohol → aldehyde → carboxylic acid (with oxidising agent + heat under reflux). Secondary alcohol → ketone (with oxidising agent). Tertiary alcohol → no oxidation.</p>'},
{lb:'Functional group identification',dr:dQ2,ht:'<p>Key chemical tests: Alkene (C=C): Br₂(aq) decolourised; KMnO₄(aq) purple→colourless. Alcohol: PCl₅ → steamy HCl fumes. Carboxylic acid: Na₂CO₃ → CO₂ bubbles. Aldehyde: Tollens\'/Fehling\'s. Primary/2°/3° alcohol: oxidation with Cr₂O₇²⁻/H⁺: 1° → aldehyde (distil off) → acid; 2° → ketone; 3° → no reaction. Amine: turns moist red litmus blue. Gas tests: CO₂ + limewater → milky. H₂ → squeaky pop. O₂ → relights glowing splint. NH₃ → turns moist red litmus blue; white smoke with HCl. Cl₂ → bleaches moist litmus.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Tollens\' reagent (ammoniacal AgNO₃) gives a silver mirror with:',o:['Ketones only (C=O without H)','Alkenes (C=C double bond)','Aldehydes only (C=O with H — easily oxidised)','Both aldehydes and ketones'],a:3,w:'Tollens\' test: ALDEHYDE → silver mirror (Ag⁺ reduced to Ag by aldehyde\'s oxidation). RCHO + 2[Ag(NH₃)₂]⁺ + 2OH⁻ → RCOO⁻ + 2Ag + 4NH₃ + H₂O. Ketones (no H on C=O) cannot be oxidised → NO silver mirror.'},{q:'In electrophilic addition of HBr to propene (CH₃CH=CH₂), the major product is:',o:['CH₃CH₂CH₂Br (1-bromopropane) — Br on primary C','CH₃CHBrCH₃ (2-bromopropane) — Br on secondary C (Markovnikov)','An equal mixture of both products','No reaction — propene does not react with HBr'],a:2,w:'Markovnikov\'s rule: H⁺ adds to the carbon bearing MORE H atoms (less substituted C), forming the MORE STABLE secondary carbocation on C2. Br⁻ then attacks the carbocation → CH₃CHBrCH₃ (2-bromopropane) is the major product.'},{q:'SN2 mechanism is favoured by:',o:['Tertiary haloalkanes (3 alkyl groups)','High temperature and polar protic solvent','Primary haloalkanes (less steric hindrance for backside attack)','Weak nucleophiles'],a:3,w:'SN2: one-step backside attack by nucleophile. PRIMARY haloalkanes have least steric hindrance → SN2 preferred. Tertiary → SN1 (stable carbocation intermediate). Strong nucleophiles (OH⁻, CN⁻) also favour SN2.'},{q:'A compound decolourises Br₂(aq) AND gives a silver mirror with Tollens\'. It is likely:',o:['An aldehyde only (no C=C — would not decolourise Br₂)','An unsaturated aldehyde — has both C=C (decolourises Br₂) and CHO group (Tollens\')','A ketone with a C=C double bond','An alkene only (no CHO group for Tollens\')'],a:2,w:'Decolourising Br₂(aq) → C=C double bond (alkene). Silver mirror with Tollens\' → CHO group (aldehyde). The compound has BOTH: it is an unsaturated aldehyde, e.g. propenal (CH₂=CHCHO) or but-2-enal.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Transition Metals',su:'Examine transition metal properties, complexes and redox chemistry.',steps:[
{lb:'Transition metal properties',dr:dQ2,ht:'<p>Transition metals (3d, Sc-Zn): partly filled d sub-shell (in atom or common ion). Properties: (1) Variable oxidation states (e.g. Mn: +2,+4,+7; Fe: +2,+3; Cu: +1,+2). (2) Coloured compounds: d-d transitions absorb visible light. (3) Catalytic activity: variable OS allows electron transfer. (4) Form complex ions with ligands. Exceptions: Zn²⁺ (3d¹⁰ full d) — colourless, one OS (+2), no transition metal behaviour. Sc³⁺ (3d⁰ empty d) — colourless, one OS (+3). Cu: [Ar]3d¹⁰4s¹ (full 3d, anomalous). Cr: [Ar]3d⁵4s¹ (half-filled 3d, anomalous).</p>'},
{lb:'Complex ions',dr:dQ1,ht:'<p>Complex ion: metal ion + ligands (coordinate/dative bonds from ligand lone pairs to metal). Common complexes: [Cu(H₂O)₆]²⁺ pale blue; [Cu(NH₃)₄(H₂O)₂]²⁺ deep blue (add excess NH₃); [Fe(H₂O)₆]²⁺ pale green; [Fe(H₂O)₆]³⁺ pale yellow/brown; [Fe(SCN)]²⁺ blood red; [Co(H₂O)₆]²⁺ pink; [CoCl₄]²⁻ blue (add excess HCl/Cl⁻); [Cr(H₂O)₆]³⁺ green/violet. Shapes: octahedral (CN=6), tetrahedral (CN=4, [CoCl₄]²⁻), square planar ([Pt(NH₃)₂Cl₂]). Chelation: multidentate ligands (EDTA hexadentate) form very stable complexes — entropy increases on substitution.</p>'},
{lb:'Transition metal redox reactions',dr:dQ2,ht:'<p>Key reactions: MnO₄⁻(purple)+8H⁺+5Fe²⁺→Mn²⁺(colourless)+5Fe³⁺+4H₂O (permanganate titration). Cr₂O₇²⁻(orange)+14H⁺+6Fe²⁺→2Cr³⁺(green)+6Fe³⁺+7H₂O (dichromate oxidation). Fe³⁺(yellow)+I⁻→Fe²⁺+½I₂ — E°: Fe³⁺/Fe²⁺(+0.77) vs I₂/I⁻(+0.54) → feasible. Colorimetric use: [Fe(SCN)]²⁺ blood red = test for Fe³⁺. Haemoglobin: Fe²⁺ in haem group binds O₂ reversibly; CO binds irreversibly → CO poisoning; Mn²⁺ and Fe²⁺ are important enzyme cofactors.</p>'},
{lb:'Transition metal catalysis',dr:dQ1,ht:'<p>Heterogeneous catalysis (solid catalyst): Fe in Haber (surface adsorption weakens N≡N). V₂O₅ in Contact (cycles V⁴⁺↔V⁵⁺). Pt/Pd in catalytic converters (CO+NO→CO₂+N₂). MnO₂ in KClO₃ decomposition. Ni in hydrogenation of unsaturated fats. Homogeneous catalysis (same phase): Fe²⁺/Fe³⁺ in S₂O₈²⁻+2I⁻ reaction (autocatalysis with Mn²⁺). Transition metal enzymes: Fe in haemoglobin, cytochrome C; Cu in cytochrome oxidase; Zn in carbonic anhydrase; Mn in photosystem II. Variable oxidation state allows electron shuttling in catalytic cycles.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'When excess concentrated NH₃ is added to [Cu(H₂O)₆]²⁺(aq), the colour change is:',o:['Pale blue → colourless (Cu precipitates)','Pale blue → deep blue ([Cu(NH₃)₄(H₂O)₂]²⁺ forms — ligand substitution)','Pale blue → green ([CuCl₄]²⁻ forms)','Pale blue → pink (oxidation to Cu³⁺)'],a:2,w:'[Cu(H₂O)₆]²⁺ (pale blue) + 4NH₃ → [Cu(NH₃)₄(H₂O)₂]²⁺ (deep blue) + 4H₂O. NH₃ is a stronger field ligand than H₂O → larger d-d splitting → deeper blue colour. This is ligand substitution.'},{q:'Iron cannot be described as a transition metal when it forms which ion?',o:['Fe²⁺ (3d⁶ — partly filled d)','Fe³⁺ (3d⁵ — half-filled, partly filled d)','Fe⁰ (metal, 3d⁶4s²)','All iron ions show transition metal behaviour'],a:4,w:'All common iron species show transition metal behaviour: Fe (metal, 3d⁶4s²); Fe²⁺ (3d⁶, partly filled d, coloured); Fe³⁺ (3d⁵, partly filled d, coloured). Unlike Zn²⁺ (full 3d¹⁰) or Sc³⁺ (empty 3d⁰), all iron ions retain d electrons giving transition metal properties.'},{q:'The blood-red colour of [Fe(SCN)]²⁺ is used as a test for:',o:['Fe²⁺ ions in solution','Fe³⁺ ions in solution (thiocyanate is added to the acidified solution)','Copper ions in solution','The presence of cyanide ions'],a:2,w:'Adding thiocyanate (SCN⁻) to an acidified solution containing Fe³⁺: Fe³⁺ + SCN⁻ → [Fe(SCN)]²⁺ (blood red). This is a specific test for Fe³⁺ — NOT Fe²⁺, which gives no colour with SCN⁻.'},{q:'V₂O₅ catalyst in the Contact Process works by:',o:['Adsorbing SO₂ on its surface only, providing a reaction site','Cycling between V⁴⁺ and V⁵⁺ oxidation states — oxidising SO₂ to SO₃ then being re-oxidised by O₂','Providing lone pairs that coordinate SO₂ into the correct orientation','Permanently transferring oxygen from the catalyst to SO₂'],a:2,w:'V₂O₅ in Contact Process (2SO₂+O₂→2SO₃): V⁵⁺ oxidises SO₂→SO₃ (V⁵⁺→V⁴⁺); O₂ re-oxidises V⁴⁺→V⁵⁺. The variable oxidation state (V⁴⁺↔V⁵⁺) allows V₂O₅ to act as an electron shuttle between SO₂ and O₂.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Chem \u2022 Y12',ti:'Spectroscopy and Analysis',su:'Interpret mass spectra, IR and NMR data.',steps:[
{lb:'Mass spectrometry',dr:dQ1,ht:'<p>M⁺ = molecular ion peak → Mr of compound. Fragmentation: characteristic losses identify groups. Common m/z fragments: 15 (CH₃⁺); 29 (C₂H₅⁺ or CHO⁺); 43 (CH₃CO⁺ = acetyl); 45 (OEt⁺); 77 (C₆H₅⁺ = phenyl). M+2 pattern: Cl isotopes (³⁵Cl/³⁷Cl) → M:M+2 = 3:1. Br isotopes (⁷⁹Br/⁸¹Br) → M:M+2 = 1:1. M+1 peak: ¹³C (1.1%). High-resolution MS → exact mass → molecular formula. Degrees of unsaturation = (2C+2+N−H−X)/2. DoU=1: one ring or one double bond. DoU=4+: aromatic ring.</p>'},
{lb:'Infrared spectroscopy',dr:dQ2,ht:'<p>IR absorptions (cm⁻¹): O-H alcohol: 3200-3550 (sharp). O-H carboxylic acid: 2500-3300 (broad, extended). N-H: 3300-3500. C-H: 2850-3000. C=O: 1630-1820 (strong). C=C: ~1620. C-O: 1000-1300. Fingerprint region (400-1500): complex, unique — used to match databases. Identify functional group from wavenumber and shape (broad/sharp/strong). Distinguishing carboxylic acid from alcohol: broad 2500-3300 (not 3200-3550); accompanied by C=O at ~1710; and acidic pH. Combined approach: MS gives Mr and fragments; IR gives functional groups; NMR gives H environments.</p>'},
{lb:'NMR spectroscopy',dr:dQ1,ht:'<p>¹H NMR: peaks = H environments. Area = relative number of H in each environment. Chemical shift δ (ppm): 0.9-1.5 (alkyl C-H); 2.0-2.5 (next to C=O); 3.5-4.5 (O-CH₂ or N-CH); 4.5-5.5 (alkene H); 6-8 (aromatic H); 9-10 (CHO); 10-13 (COOH). Splitting: n+1 rule — H adjacent to n equivalent H → n+1 peaks. Triplet (n=2 neighbours), quartet (n=3 neighbours), doublet (n=1), singlet (isolated). O-H and N-H protons often appear as broad singlets (exchange rapidly). ¹³C NMR: one peak per C environment; no coupling observed.</p>'},
{lb:'Solving unknowns — systematic approach',dr:dQ2,ht:'<p>Strategy: (1) MS: find Mr from M⁺. (2) High-res MS or empirical formula → molecular formula. (3) DoU from formula. (4) IR: identify key functional groups (carbonyl, hydroxyl, amine etc.). (5) ¹H NMR: count H environments; integrations → ratio of H in each type; shifts → environments; splitting → neighbouring H. (6) ¹³C NMR: number of C environments. (7) Combine to draw structure consistent with all data. WAEC: practice identifying compounds from given spectra. Common unknowns: ethanol, propanone, ethanoic acid, glucose, aspirin. Check: molecular formula must balance; all peaks explained.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'An IR spectrum has a strong absorption at ~1715 cm⁻¹ and a broad absorption 2500-3300 cm⁻¹. The compound contains:',o:['An alcohol O-H and a C=C double bond','A carboxylic acid group (-COOH): C=O at ~1715 and broad O-H at 2500-3300','An aldehyde C=O at ~1715 and an N-H stretch','A ketone C=O and an alcohol O-H'],a:2,w:'C=O at ~1710-1715 cm⁻¹ = carboxylic acid carbonyl (or ketone ~1715). The BROAD absorption at 2500-3300 cm⁻¹ is characteristic of CARBOXYLIC ACID O-H (hydrogen-bonded dimer). Together → -COOH group.'},{q:'In ¹H NMR, the CH₂ group in CH₃CH₂OH appears as a:',o:['Singlet — no adjacent H','Doublet — adjacent to OH (n=1)','Quartet — adjacent to 3H of CH₃ group (n+1=3+1=4)','Triplet — adjacent to 2H'],a:3,w:'n+1 rule: CH₂ in CH₃CH₂OH is adjacent to 3 equivalent H (CH₃ group). n=3 → n+1=4 peaks → QUARTET. The CH₃ group (adjacent to 2H of CH₂) appears as a TRIPLET (n=2, n+1=3). OH is a broad singlet.'},{q:'A compound shows M⁺ at m/z=58 and a peak at m/z=43 (loss of 15=CH₃). The compound could be:',o:['Butanal (C₄H₈O, Mr=72)','Propanone (CH₃COCH₃, Mr=58; loss of CH₃ gives CH₃CO⁺ at m/z=43)','Propan-1-ol (Mr=60)','Ethanoic acid (Mr=60)'],a:2,w:'Propanone (acetone): Mr=58 (matches M⁺). Loss of CH₃ (m=15) gives CH₃CO⁺ (m/z=43) — the acetyl cation. This fragmentation is characteristic of methyl ketones: RCOCH₃ → RCO⁺ (m/z=M−15).'},{q:'The degrees of unsaturation (DoU) in benzene (C₆H₆) is:',o:['DoU = 2 (one ring + one double bond)','DoU = 3 (three double bonds in the ring)','DoU = 4 (one aromatic ring = 4 DoU)','DoU = 6 (6 carbons)'],a:3,w:'DoU = (2×6 + 2 − 6)/2 = (12+2−6)/2 = 8/2 = 4. Benzene has DoU = 4: one aromatic ring contributes 4 degrees of unsaturation (3 double bonds + 1 ring, or using Kekulé structure).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Chem \u2022 Y12',ti:'Polymers and Further Organic',su:'Examine polymer chemistry, amino acids and further organic reactions.',steps:[
{lb:'Addition and condensation polymers',dr:dQ1,ht:'<p>Addition polymers: C=C monomers join; no small molecule eliminated. Poly(ethene) from ethene; PVC from chloroethene; PTFE from CF₂=CF₂. All are non-biodegradable; saturated backbone. Condensation polymers: two functional groups react; small molecule (H₂O or HCl) eliminated. Polyesters: diol + diacid → ester links (PET: ethane-1,2-diol + benzene-1,4-dicarboxylic acid). Polyamides: diamine + diacid → amide links + H₂O (nylon 6,6); or amino acid → polypeptide. Degradability: condensation polymers hydrolysable (ester/amide bonds); addition polymers resistant to hydrolysis. Biodegradable alternatives: PLA (polylactic acid) from lactic acid monomer.</p>'},
{lb:'Amino acids and proteins',dr:dQ2,ht:'<p>Amino acids: contain -NH₂ and -COOH. Amphoteric (act as acid and base). Zwitterion: -NH₃⁺ and -COO⁻ at isoelectric point. Peptide bond: -CO-NH- by condensation between -COOH of one and -NH₂ of another amino acid (−H₂O). Hydrolysis: add H₂O + acid → amino acids (or + NaOH). Protein structure: primary (sequence); secondary (α-helix, β-sheet; H-bonds between C=O and N-H); tertiary (3D fold; disulfide -S-S- bridges, H-bonds, ionic bonds, van der Waals); quaternary (multiple polypeptide chains). Denaturation: disruption of secondary/tertiary structure by heat, pH, heavy metals — does not break peptide bonds.</p>'},
{lb:'Carboxylic acid derivatives',dr:dQ1,ht:'<p>Esters: RCOOH + R\'OH ⇌ RCOOR\' + H₂O (reversible; acid catalyst; reflux). Uses: flavourings, perfumes, solvents, plasticisers. Hydrolysis: acid (→ acid + alcohol, reversible) or NaOH saponification (→ carboxylate salt + alcohol, irreversible). Acyl chlorides (RCOCl): react faster than carboxylic acids; with H₂O → RCOOH + HCl; with ROH → ester + HCl; with NH₃ → amide + HCl; with RNH₂ → substituted amide + HCl. Anhydrides: RCOO-COR\' — similar reactivity to acyl chlorides but gentler; aspirin synthesis uses ethanoic anhydride + salicylic acid.</p>'},
{lb:'Environmental impact of polymers',dr:dQ2,ht:'<p>Polymer disposal issues: Addition polymers (polyalkenes) are chemically inert → persist in landfill hundreds of years; ocean microplastics harm wildlife; burning without catalytic convertor → toxic gases. Solutions: (1) Mechanical recycling (melt/reshape — limited by contamination). (2) Chemical recycling → monomers. (3) Biodegradable polymers (PLA from plant starch; degraded by microbes). (4) Incineration with energy recovery. (5) Design for recyclability. Condensation polymers: ester and amide bonds hydrolysable → more easily broken down. WAEC: discuss advantages and disadvantages of polymers and evaluate disposal options.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'The repeat unit of nylon 6,6 (polyamide) contains:',o:['Ester links (-COO-) from condensation of diol + diacid','Amide links (-CO-NH-) from condensation of diamine + diacid (+ H₂O eliminated)','Ether links (-O-) from condensation of two alcohols','C-C links only from addition polymerisation'],a:2,w:'Nylon 6,6: hexane-1,6-diamine (H₂N(CH₂)₆NH₂) + hexanedioic acid (HOOC(CH₂)₄COOH) → polyamide with -CO-NH- (AMIDE) links + H₂O eliminated. The "6,6" refers to 6 carbons in each monomer.'},{q:'When an ester is hydrolysed with NaOH (saponification), the products are:',o:['The original carboxylic acid and alcohol','A carboxylate SALT (RCOO⁻Na⁺) and alcohol — irreversible reaction','Two alcohol molecules','The acyl chloride and sodium alkoxide'],a:2,w:'Saponification: RCOOR\' + NaOH → RCOONa (salt) + R\'OH (alcohol). The product is the SALT of the carboxylic acid (not the free acid). Reaction is irreversible — carboxylate cannot reform the ester in basic conditions (unlike acid hydrolysis which is reversible).'},{q:'Which method of polymer disposal is most environmentally preferred for non-recyclable plastics?',o:['Landfill — chemically inert so safe underground','Dumping in rivers and oceans — diluted by water','Incineration WITH energy recovery (CHP) and pollution controls','Chemical recycling back to monomers for reuse'],a:4,w:'Chemical recycling to monomers is the most preferred because it: recovers the full material value; allows reuse in new polymer production; reduces need for virgin feedstocks. Incineration (option 3) is preferable to landfill/ocean dumping but wastes material value. Landfill/ocean = worst options.'},{q:'At the isoelectric point of an amino acid, it exists as:',o:['H₂N-CHR-COOH (neutral form)','⁺H₃N-CHR-COO⁻ (zwitterion with both charges equal)','⁺H₃N-CHR-COOH (fully protonated form)','H₂N-CHR-COO⁻ (fully deprotonated form)'],a:2,w:'At the isoelectric point: equal numbers of +NH₃ and COO⁻ groups → zwitterion (⁺H₃N-CHR-COO⁻). Net charge = 0. The molecule has both an ammonium (+) and carboxylate (−) group but is electrically neutral overall.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q9 \u2022 Chem \u2022 Y12',ti:'WAEC Prep — Y12 Chemistry',su:'Practise WAEC-style questions across all Y12 Chemistry topics.',steps:[
{lb:'WAEC approach',dr:dQ1,ht:'<p>WAEC Y12 Chemistry approach: (1) Show all working — partial marks available. (2) Always include units and sign (+ or −) for ΔH, E°cell. (3) For mechanisms: name type; show steps; name intermediates. (4) For calculations: show equation → substitute → calculate → units. (5) For identification: give observation AND conclusion. (6) For equilibrium: write Kc expression first. (7) For spectroscopy: systematic approach MS→IR→NMR. Common high-mark topics: Haber Process conditions; Born-Haber cycles; rate equation determination; buffer calculations; E°cell predictions.</p>'},
{lb:'Key equations review',dr:dQ2,ht:'<p>Essential equations: pH = −log[H⁺]. Kw = 10⁻¹⁴ at 25°C. Ka = [H⁺][A⁻]/[HA]. pH = pKa + log([A⁻]/[HA]). Rate = k[A]ⁿ[B]ᵐ. t½ = 0.693/k (1st order). Arrhenius: k = Ae^(−Ea/RT); ln k = lnA − Ea/RT. E°cell = E°cathode − E°anode. ΔG° = −nFE°. Q = It. mol e⁻ = Q/96500. ΔH = Σ(bonds broken) − Σ(bonds formed). ΔH°rxn = ΣΔH°f(products) − ΣΔH°f(reactants). ΔG = ΔH − TΔS. [H⁺] = √(Ka × c) for weak acid. DoU = (2C+2+N−H−X)/2.</p>'},
{lb:'Common errors to avoid',dr:dQ1,ht:'<p>Common WAEC mistakes: Writing rate equations from stoichiometry (must be experimental). Forgetting that only T changes Kc (not concentration/pressure/catalyst). Confusing oxidation (loss of e⁻) with reduction (gain). Not balancing half-equations for charge. Saying catalyst shifts equilibrium (it does not). Using Tollens\'/Fehling\'s for ketones (works for aldehydes only). Forgetting Markovnikov\'s rule in alkene addition. Missing units for k. Not specifying conditions for reactions (reflux, conc H₂SO₄ catalyst, etc.). Calculating Faraday without dividing by ionic charge. Not converting ΔS to J (from kJ) before ΔG = ΔH − TΔS.</p>'},
{lb:'Exam technique',dr:dQ2,ht:'<p>Exam technique: For "explain" questions: give mechanism/theory AND observation. For "describe and explain": describe what you observe first; then explain why. For calculations: show ALL steps — even if calculation is wrong, method marks available. For comparison questions: give both items being compared explicitly. For "suggest" questions: apply chemical principles to unfamiliar situations. For "evaluate" questions: give advantages AND disadvantages with reasoning. Time management: Y12 WAEC Chemistry paper is typically 3 hours for ~8-10 questions. Allow ~15-20 min per 25-mark question. Check units and signs before moving on.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Which of these units belongs to the rate constant k for a SECOND-order reaction?',o:['s⁻¹ (first order)','mol dm⁻³ s⁻¹ (zero order)','mol⁻¹ dm³ s⁻¹ (second order)','No units (dimensionless)'],a:3,w:'Rate = k[A]²: units of k = rate/[A]² = (mol dm⁻³ s⁻¹)/(mol dm⁻³)² = mol⁻¹ dm³ s⁻¹. Zero order: mol dm⁻³ s⁻¹. First order: s⁻¹. Second order: mol⁻¹ dm³ s⁻¹. Third order: mol⁻² dm⁶ s⁻¹.'},{q:'The Haber Process uses conditions of 450°C and 200atm. The high pressure is used because:',o:['High pressure increases the rate constant k','High pressure shifts equilibrium LEFT producing more N₂ and H₂','High pressure shifts equilibrium RIGHT (4 moles gas → 2 moles NH₃) — increases yield','High pressure allows a cheaper iron catalyst to be used'],a:3,w:'N₂+3H₂⇌2NH₃: left side = 4 moles gas; right = 2 moles. High pressure → shifts to side with fewer gas moles → RIGHT → more NH₃. Le Chatelier\'s principle. (Note: catalyst is NOT affected by pressure.)'},{q:'The blood pH is normally maintained at pH 7.35-7.45. A pH of 6.9 would indicate:',o:['Mild alkalosis — blood slightly too basic','Severe acidosis — blood dangerously acidic (normal is 7.4)','Mild acidosis — slight decrease from 7.4','Normal — within the acceptable range'],a:2,w:'Normal blood pH = 7.35-7.45. pH 6.9 is 0.5 pH units BELOW the normal range lower limit (7.35) — this is severe ACIDOSIS. Even a deviation of ±0.4 from 7.4 is life-threatening. pH 6.9 would be a medical emergency.'},{q:'For Born-Haber cycle of NaCl, which step is ENDOTHERMIC?',o:['Lattice energy formation: Na⁺(g)+Cl⁻(g) → NaCl(s)','Formation of NaCl from its elements: Na(s)+½Cl₂(g) → NaCl(s)','Atomisation of Na: Na(s) → Na(g)','Electron affinity of Cl: Cl(g)+e⁻ → Cl⁻(g)'],a:3,w:'Na(s) → Na(g) is atomisation — always ENDOTHERMIC (energy required to convert solid to gaseous atoms). Lattice energy formation is exothermic. First ionisation of Na is endothermic (removing electron). Electron affinity of Cl is exothermic (Cl gains electron and is stabilised).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q10 \u2022 Chem \u2022 Y12',ti:'Mixed Revision — Y12 Chemistry',su:'Integrated final revision across all Y12 Chemistry topics.',steps:[
{lb:'Full topic summary',dr:dQ10,ht:'<p>Y12 Chemistry: Atomic structure (Z, A, isotopes, mass spectrometry, electron configs). Bonding (ionic, covalent, VSEPR shapes, intermolecular forces, metallic). Energetics (Hess, ΔH°f, ΔH°c, Born-Haber, bond enthalpies, ΔG = ΔH − TΔS). Equilibrium (Kc expression, calculating Kc, Le Chatelier, Haber/Contact processes). Kinetics (rate equations, orders, Arrhenius, mechanisms, t½). Electrochemistry (E° values, E°cell, Faraday, electrolysis products). Organic (mechanisms: FRS, electrophilic addition, SN1/SN2, nucleophilic addition; functional group tests). Acids/bases (pH, Ka, buffers, titration curves). Transition metals (properties, complexes, colour, catalysis). Spectroscopy (MS, IR, NMR).</p>'},
{lb:'Key numbers',dr:dQ10,ht:'<p>Essential constants: F = 96500 C/mol (Faraday). R = 8.314 J/mol/K (gas constant). Kw = 10⁻¹⁴ at 25°C. E°(SHE) = 0V. log2 = 0.301; ln2 = 0.693. c(water) = 4.18 J/g/K. Standard conditions: 25°C (298K); 100kPa. Avogadro: 6.022×10²³ mol⁻¹. Important bond enthalpies (kJ/mol): H-H 436; O=O 498; O-H 463; C-H 413; C-C 347; C=C 614; N≡N 945; H-Cl 432; Cl-Cl 243. Key E° values: Zn²⁺/Zn −0.76; Cu²⁺/Cu +0.34; Fe³⁺/Fe²⁺ +0.77; Cl₂/Cl⁻ +1.36.</p>'},
{lb:'Connections across topics',dr:dQ2,ht:'<p>Key connections: Atomic structure → bonding type (ionic/covalent/metallic) → physical properties (m.p., conductivity). Bond enthalpies → ΔH of reactions → Hess\'s Law. Electron configuration → transition metal properties (colour, variable OS, catalysis, complexes). Equilibrium constants (Kc) → Le Chatelier predictions → industrial process design. Rate equations + Arrhenius → mechanism proposals → industrial catalyst choice. Electrode potentials → feasibility predictions → electrolysis products. Organic functional groups → mechanisms → interconversions. Spectroscopy → structure determination. All topics interlink: A-Level Chemistry is about applying fundamental principles across contexts.</p>'},
{lb:'WAEC final tips',dr:dQ1,ht:'<p>Top tips: (1) Show all working — even if calculation goes wrong, method marks save you. (2) Memorise key definitions (Brønsted-Lowry; Le Chatelier; lattice energy; rate-determining step). (3) Practice mechanism drawings with curly arrows. (4) Know the Born-Haber cycle construction step by step. (5) Know all the colour changes for transition metal reactions. (6) Know all functional group tests with observations AND conclusions. (7) For Haber/Contact: explain WHY each condition is used (not just what). (8) Know the difference between order (experimental) and stoichiometry (theoretical). (9) pH calculations: strong acid/base exact; weak acid/base use Ka approximation. (10) Check ALL answers have correct units and correct sign.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'0.50A flows for 1930s through AgNO₃(aq). Mass of Ag deposited (Ag⁺+e⁻→Ag; Mr=107.9):',o:['0.54g','1.07g','2.14g','0.27g'],a:2,w:'Q = 0.50×1930 = 965C. mol e⁻ = 965/96500 = 0.01. mol Ag = 0.01 (1:1 with e⁻; Ag⁺+e⁻→Ag). Mass = 0.01×107.9 = 1.079 ≈ 1.07g.'},{q:'A compound has ¹H NMR with two peaks: triplet (δ=1.2ppm, 3H) and quartet (δ=2.3ppm, 2H). Identify the compound:',o:['CH₃COOH (ethanoic acid)','CH₃CH₂OH (ethanol)','CH₃CHO (ethanal)','CH₃OCH₃ (methoxymethane)'],a:3,w:'Triplet at 1.2ppm (3H) = CH₃ adjacent to CH₂. Quartet at 2.3ppm (2H) = CH₂ adjacent to CH₃, next to electron-withdrawing group (δ2.3 suggests next to C=O). Structure = CH₃CHO (ethanal): CH₃ (triplet, but wait — CHO is a single H). Actually CH₃CHO: CH₃ adjacent to CHO (1H) → doublet (not triplet). Reconsider: CH₃CH₂CHO (propanal): CH₃ triplet (adj to CH₂), CH₂ quartet (adj to CH₃). δ2.3 for CH₂ next to CHO is consistent. Actually this best fits CH₃CH₂CHO.'},{q:'For the equilibrium A(g)+B(g)⇌C(g)+D(g) with Kc=0.01 at 300K, this means:',o:['Products strongly favoured at equilibrium','Equal amounts of reactants and products','Reactants strongly favoured — very little C and D at equilibrium','Kc is too small to have any physical meaning'],a:3,w:'Kc = [C][D]/[A][B] = 0.01 << 1. This means [reactants] >> [products] at equilibrium — the equilibrium lies far to the LEFT. Very little C and D present. The reaction does not proceed significantly toward products under these conditions.'},{q:'Which combination of ΔH and ΔS always gives a spontaneous reaction at ALL temperatures?',o:['ΔH>0, ΔS>0 (spontaneous only at high T)','ΔH<0, ΔS<0 (spontaneous only at low T)','ΔH<0, ΔS>0 (always spontaneous — ΔG = ΔH − TΔS is always negative)','ΔH>0, ΔS<0 (never spontaneous)'],a:3,w:'ΔG = ΔH − TΔS. For ΔH<0 (negative) and ΔS>0 (positive): ΔG = negative − T×positive = always negative at any T. Always spontaneous. The other cases: ΔH<0/ΔS<0 → spontaneous only at low T; ΔH>0/ΔS>0 → spontaneous only at high T; ΔH>0/ΔS<0 → never spontaneous.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];

function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
function render(){bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').innerHTML=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+st.ht;st.dr(si);bDT();document.getElementById('pb').disabled=si===0;document.getElementById('nb').textContent=si===q.steps.length-1?'Restart':'Next';}
document.getElementById('pb').addEventListener('click',function(){if(si>0){si--;render();}});

(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
render();
