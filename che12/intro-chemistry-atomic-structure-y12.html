<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Classifying Matter',[['Term','Definition','Example'],['Element','Pure substance, one type of atom','Oxygen, Iron'],['Compound','Two+ elements chemically combined','Water, CO2'],['Mixture','Substances physically combined, not bonded','Air, salt water']]);}
function dQ2(p){drawTable(p,'Sub-atomic Particles',[['Particle','Charge','Location'],['Proton','+1','Nucleus'],['Neutron','0','Nucleus'],['Electron','-1','Shells']]);}
function dQ3(p){drawTable(p,'Writing Chemical Formulae',[['Compound','Formula','Ratio'],['Water','H2O','2H:1O'],['Carbon dioxide','CO2','1C:2O'],['Sodium chloride','NaCl','1Na:1Cl'],['Calcium hydroxide','Ca(OH)2','1Ca:2OH']]);}
function dQ4(p){drawTable(p,'Common Separation Techniques',[['Method','Used for'],['Filtration','Insoluble solid from liquid'],['Evaporation','Dissolved solid from solution'],['Distillation','Liquid from solution (by boiling point)'],['Chromatography','Separating dissolved substances']]);}
function dQ5(p){drawTable(p,'Physical vs Chemical Change',[['Type','Feature','Example'],['Physical','No new substance, reversible','Melting ice'],['Chemical','New substance formed, often irreversible','Burning wood']]);}
function dQ6(p){drawTable(p,'WAEC Foundations Summary',[['Topic','Key idea'],['Atomic structure','Z=protons, A=protons+neutrons'],['Classification','Element, compound, mixture'],['Separation','Choose method by property difference']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Elements, Compounds and Mixtures',su:'Classify matter and understand the difference between elements, compounds and mixtures.',steps:[
{lb:'Classifying matter',dr:dQ1,ht:'<p>An <b>element</b> contains only one type of atom (cannot be broken down further by chemical means). A <b>compound</b> forms when two or more elements chemically combine in a fixed ratio, creating a new substance with different properties from its elements. A <b>mixture</b> contains two or more substances physically combined (not chemically bonded) in no fixed ratio \u2014 each substance keeps its own properties.</p>'},
{lb:'Separating mixtures vs compounds',dr:dQ1,ht:'<p>Mixtures can be separated by PHYSICAL methods (filtration, evaporation, distillation) because no chemical bonds need breaking. Compounds can only be separated back into their elements by CHEMICAL methods (e.g. electrolysis of water into H2 and O2) since the atoms are chemically bonded together.</p>'},
{lb:'Properties differ from components',dr:dQ1,ht:'<p>A compound has properties DIFFERENT from the elements that formed it. Example: sodium (a reactive soft metal) + chlorine (a toxic green gas) combine to form sodium chloride (table salt) \u2014 a stable, edible, colourless solid. This is a key distinguishing feature of a compound versus a mixture (where each component keeps its original properties).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Air is best classified as a:',o:['Compound, since it contains several gases chemically bonded','Mixture \u2014 the gases (N2, O2, CO2 etc.) are physically combined, not chemically bonded, and can be separated by physical methods','Single element','A type of chemical reaction'],a:2,w:'Air contains N2, O2, CO2, argon and other gases simply mixed together with no chemical bonds between them. Each gas keeps its own properties, and they can be separated by physical methods (e.g. fractional distillation of liquid air).'},{q:'Which best describes a chemical compound?',o:['A physical blend of substances in any ratio','Two or more elements chemically combined in a fixed ratio, forming a new substance with different properties','A single type of atom only','A mixture that can be separated by filtration'],a:2,w:'A compound is formed when elements react chemically and combine in a fixed, definite ratio, producing a new substance whose properties are different from those of its constituent elements.'},{q:'Water (H2O) can only be broken down into hydrogen and oxygen by:',o:['Filtration','Evaporation','A chemical process such as electrolysis, since H2O is a compound with chemically bonded atoms','Simple physical separation with a magnet'],a:3,w:'Because water is a COMPOUND (chemically bonded), it cannot be separated back into its elements by physical methods alone \u2014 a chemical process like electrolysis is required to break the O-H bonds and release H2 and O2 gas.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Basic Atomic Structure',su:'Identify sub-atomic particles and use atomic number and mass number.',steps:[
{lb:'Sub-atomic particles',dr:dQ2,ht:'<p>Atoms are made of three particles: PROTONS (charge +1, in the nucleus), NEUTRONS (charge 0, in the nucleus) and ELECTRONS (charge -1, in shells around the nucleus). The nucleus (protons+neutrons) contains almost all the mass of the atom; electrons contribute negligible mass but determine chemical behaviour.</p>'},
{lb:'Atomic number and mass number',dr:dQ2,ht:'<p><b>Atomic number (Z)</b> = number of protons (defines which element it is). <b>Mass number (A)</b> = protons + neutrons. Number of neutrons = A \u2212 Z. In a neutral atom, number of electrons = number of protons. Example: Carbon has Z=6, and the common isotope has A=12, so it has 6 protons, 6 neutrons and 6 electrons.</p>'},
{lb:'Electron arrangement',dr:dQ2,ht:'<p>Electrons occupy SHELLS around the nucleus, filling from the innermost shell outward: shell 1 holds up to 2 electrons, shell 2 up to 8, shell 3 up to 8 (for the elements covered at this level). Example: sodium (Z=11) has electron arrangement 2,8,1 \u2014 the single outer electron explains its high reactivity as it is easily lost to form Na+.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'An atom of chlorine has 17 protons and 18 neutrons. Its mass number is:',o:['17','18','35 (17+18)','1'],a:3,w:'Mass number (A) = protons + neutrons = 17 + 18 = 35.'},{q:'The atomic number of an element tells you directly the number of:',o:['Neutrons only','Protons (and, in a neutral atom, electrons too)','Protons plus neutrons','Electron shells only'],a:2,w:'Atomic number (Z) is defined as the number of protons in the nucleus, which uniquely identifies the element. In a neutral atom, this also equals the number of electrons.'},{q:'Sodium has electron arrangement 2,8,1. This tells us sodium:',o:['Has 2 protons only','Has one electron in its outer shell, making it likely to lose that electron and form a +1 ion','Cannot react with other elements','Has 8 electrons in its outer shell'],a:2,w:'The final number (1) represents the outer shell electrons. Having just one outer electron means sodium readily loses it to achieve a stable full-shell configuration, forming Na+ \u2014 explaining its high reactivity as an alkali metal.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Chemical Formulae and Symbols',su:'Write correct chemical formulae using valency and combining ratios.',steps:[
{lb:'Symbols and formulae',dr:dQ3,ht:'<p>Every element has a chemical SYMBOL (e.g. Na for sodium, O for oxygen). A chemical FORMULA shows the exact ratio of atoms in a compound using subscripts (e.g. H2O means 2 hydrogen atoms to 1 oxygen atom). Formulae are determined by the VALENCY (combining power) of each element.</p>'},
{lb:'Using valency to write formulae',dr:dQ3,ht:'<p>Method: write the valency of each element/ion, then CROSS-MULTIPLY the valencies to get the subscript ratio (simplify if possible). Example: Ca has valency 2, OH has valency 1 \u2192 formula is Ca(OH)2 (2 hydroxide ions needed to balance the 2+ charge of calcium). Example: Al (valency 3) with O (valency 2) \u2192 Al2O3 (cross-multiplied, cannot simplify).</p>'},
{lb:'Formulae of common compounds',dr:dQ3,ht:'<p>Practice: Na+ (valency 1) with Cl- (valency 1) \u2192 NaCl. Mg2+ (valency 2) with Cl- (valency 1) \u2192 MgCl2. Fe3+ (valency 3) with O2- (valency 2) \u2192 Fe2O3. Always check the final formula represents a NEUTRAL compound (total positive charge = total negative charge).</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Aluminium (valency 3) combines with oxygen (valency 2). The correct formula is:',o:['AlO','Al2O3 (cross-multiplied valencies)','Al3O2','AlO3'],a:2,w:'Cross-multiplying valencies: Al has valency 3, O has valency 2. Swap them as subscripts: Al2O3. This gives a neutral compound (2x3+ = 6+, 3x2- = 6-, balanced).'},{q:'The formula for magnesium chloride (Mg2+ and Cl-) is:',o:['MgCl','MgCl2 \u2014 two Cl- ions are needed to balance the 2+ charge on Mg','Mg2Cl','MgCl3'],a:2,w:'Mg2+ has a 2+ charge; Cl- has a 1- charge. To balance charges, two Cl- ions are needed for every Mg2+ ion, giving the formula MgCl2.'},{q:'Why must a chemical formula represent an overall neutral compound?',o:['It does not need to be neutral','Compounds are made of charged ions/atoms whose charges must balance to zero for a stable, neutral substance to exist','Only elements need to be neutral','Neutral compounds cannot exist'],a:2,w:'Stable ionic compounds form when the total positive charge exactly balances the total negative charge, giving an overall neutral formula unit \u2014 this is why valencies must be cross-multiplied correctly when determining formulae.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Separation Techniques',su:'Choose and describe appropriate methods for separating mixtures.',steps:[
{lb:'Filtration and evaporation',dr:dQ4,ht:'<p><b>Filtration</b> separates an INSOLUBLE solid from a liquid \u2014 the mixture is poured through filter paper; the solid (residue) stays on the paper while the liquid (filtrate) passes through. <b>Evaporation</b> separates a DISSOLVED (soluble) solid from its solution by heating the solution until the solvent evaporates, leaving the solid behind. Evaporation destroys the solvent (not suitable if you want to recover it).</p>'},
{lb:'Distillation and crystallisation',dr:dQ4,ht:'<p><b>Simple distillation</b> separates a solvent (liquid) from a dissolved solid, or separates liquids with very different boiling points \u2014 the mixture is heated, the liquid with the lower boiling point evaporates first, then is condensed and collected, recovering BOTH the solvent and the solute. <b>Crystallisation</b> is used when a solid product would decompose on strong heating (evaporation) \u2014 the solution is only partly evaporated then left to cool slowly, allowing pure crystals to form.</p>'},
{lb:'Chromatography',dr:dQ4,ht:'<p><b>Chromatography</b> separates a mixture of dissolved substances (e.g. dyes) based on their different solubilities/attraction to the stationary phase (paper) versus the mobile phase (solvent). Substances travel at different rates, producing separated spots. This technique is especially useful for identifying components in a mixture by comparing Rf values or spot patterns.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Which method would you use to separate sand from water?',o:['Distillation','Filtration \u2014 sand is insoluble and is retained on filter paper while water passes through','Chromatography','Crystallisation'],a:2,w:'Sand is insoluble in water, so a simple filtration will separate the solid sand (residue, trapped by the filter paper) from the liquid water (filtrate, which passes through).'},{q:'To recover BOTH pure water and dissolved salt from salt solution, you should use:',o:['Filtration only','Simple distillation \u2014 water evaporates, is condensed and collected separately, leaving the salt behind','Chromatography','No method can recover both'],a:2,w:'Simple distillation heats the solution; water (the solvent, lower boiling point in this context relative to the fixed dissolved solid) evaporates and is then condensed and collected as pure water, while the dissolved salt remains behind as a solid \u2014 recovering both components.'},{q:'Crystallisation is preferred over full evaporation when:',o:['You want to destroy the solid product','The solid product would decompose if heated too strongly to full dryness, so partial evaporation followed by slow cooling is used instead','There is no dissolved solid present','The solvent needs to be destroyed completely'],a:2,w:'Some solids decompose or char if heated to complete dryness. Crystallisation involves evaporating only PART of the solvent, then allowing the solution to cool slowly so that pure crystals form gradually without overheating and decomposing the product.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Physical and Chemical Changes',su:'Distinguish between physical and chemical changes with evidence and examples.',steps:[
{lb:'Physical changes',dr:dQ5,ht:'<p>A <b>physical change</b> does NOT produce a new substance \u2014 only the physical state, shape, or size changes, and it is usually easily REVERSIBLE. Examples: melting ice (solid \u2192 liquid water, same substance H2O), dissolving sugar in water (sugar is still present, can be recovered by evaporation), cutting paper (still paper, just different shape).</p>'},
{lb:'Chemical changes',dr:dQ5,ht:'<p>A <b>chemical change</b> produces one or more NEW substances with different properties, and is often DIFFICULT or IMPOSSIBLE to reverse easily. Evidence of a chemical change: colour change, gas produced (bubbles), temperature change (exothermic/endothermic), precipitate formed, or a permanent change that cannot be undone by simple physical means. Example: burning wood produces ash, CO2 and water vapour \u2014 completely different substances from the original wood.</p>'},
{lb:'Distinguishing the two in practice',dr:dQ5,ht:'<p>Key test: can the original substance be recovered by a simple PHYSICAL method (like evaporation, filtration, cooling)? If YES \u2014 physical change. If the substance has been permanently transformed into something new that CANNOT be recovered this way \u2014 chemical change. Example: rusting of iron (Fe \u2192 Fe2O3.xH2O) is a chemical change; the rust cannot simply be converted back to pure iron by physical means.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Which of these is a physical change?',o:['Burning paper to ash','Rusting of an iron nail','Melting of ice into liquid water \u2014 still H2O, easily reversed by freezing again','Baking a cake from raw batter'],a:3,w:'Melting ice only changes the physical STATE (solid to liquid) of the same substance (H2O) \u2014 no new substance is formed, and the process is easily reversed by freezing, making it a clear physical change.'},{q:'Which observation is the strongest evidence of a CHEMICAL change occurring?',o:['A solid changing shape when cut','A liquid evaporating into vapour','Bubbles of gas being produced along with a permanent colour change, indicating a new substance has formed','Ice melting at room temperature'],a:3,w:'Gas production combined with a permanent colour change strongly suggests a new substance has formed through a chemical reaction, rather than simply a change of state or shape (which would be a physical change).'},{q:'Rusting of iron is classified as a chemical change because:',o:['The iron simply changes shape','A new substance (iron oxide/rust) forms with different properties from the original iron, and it cannot easily be converted back to pure iron by physical means','It is easily reversed by heating','No new substance is actually formed'],a:2,w:'Rusting converts iron (Fe) into iron oxide (Fe2O3.xH2O), a substance with entirely different physical and chemical properties. This transformation cannot be undone by simple physical processes, confirming it as a chemical change.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Introduction to Chemistry and Atomic Structure',su:'Integrated revision of foundational chemistry concepts.',steps:[
{lb:'Foundations summary',dr:dQ6,ht:'<p>Elements, compounds and mixtures are distinguished by bonding and separability. Atomic structure: Z=protons, A=protons+neutrons, electron shells fill 2,8,8. Formulae are built from valency by cross-multiplication. Separation techniques (filtration, evaporation, distillation, crystallisation, chromatography) are chosen based on the physical properties that differ between the substances present.</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: confusing mixtures with compounds (mixtures are physically combined and separable by physical means; compounds are chemically bonded and need chemical methods to separate). Forgetting mass number includes BOTH protons and neutrons, not protons alone. Writing formula subscripts without cross-multiplying valencies correctly. Choosing the wrong separation method (e.g. using filtration for a dissolved solid, which requires evaporation/distillation instead).</p>'},
{lb:'Problem-solving strategy',dr:dQ6,ht:'<p>WAEC strategy: (1) Identify whether the question involves elements, compounds, or mixtures. (2) For atomic structure questions, write out Z and A clearly before calculating neutrons. (3) For formula questions, write valencies first, then cross-multiply. (4) For separation questions, identify the KEY PROPERTY DIFFERENCE (solubility, boiling point, particle size) that justifies the chosen method.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'An atom has 12 protons and a mass number of 24. How many neutrons does it have?',o:['12 (24\u221212)','24','36','0'],a:1,w:'Neutrons = mass number \u2212 atomic number (protons) = 24 \u2212 12 = 12 neutrons.'},{q:'Calcium (valency 2) combines with chlorine (valency 1). The correct formula is:',o:['CaCl','CaCl2 \u2014 two chlorine atoms balance the 2+ charge of calcium','Ca2Cl','CaCl3'],a:2,w:'Cross-multiplying valencies (Ca=2, Cl=1): the formula becomes CaCl2, since two chloride ions (1- each) are needed to balance the 2+ charge of one calcium ion.'},{q:'To separate a mixture of sand and salt dissolved together in water, the correct sequence would be:',o:['Chromatography only','Filtration (to remove sand) followed by evaporation or distillation of the filtrate (to recover the dissolved salt)','Distillation only, with no filtration needed','Crystallisation of the sand'],a:2,w:'First, filtration removes the insoluble sand (residue) from the salt solution (filtrate). Then, evaporating or distilling the filtrate recovers the dissolved salt, correctly separating all three components of the original mixture.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
