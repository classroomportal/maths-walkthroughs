<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Organisation of the Periodic Table',[['Feature','Description'],['Period','Horizontal row; same number of shells'],['Group','Vertical column; same outer electrons'],['Metals','Left side of table'],['Non-metals','Right side of table']]);}
function dQ2(p){drawTable(p,'Group 1 \u2014 Alkali Metals',[['Element','Reactivity with water'],['Li','Steady fizzing'],['Na','Vigorous, may ignite'],['K','Violent, ignites, lilac flame']]);}
function dQ3(p){drawTable(p,'Group 7 \u2014 Halogens',[['Element','State at RT','Colour'],['F2','Gas','Pale yellow'],['Cl2','Gas','Green'],['Br2','Liquid','Red-brown'],['I2','Solid','Grey-black']]);}
function dQ4(p){drawTable(p,'Group 0 \u2014 Noble Gases',[['Property','Reason'],['Unreactive','Full outer electron shell'],['Colourless gases','Weak intermolecular forces'],['Used in lighting/balloons','Inert, safe, low density (He)']]);}
function dQ5(p){drawTable(p,'Advanced Separation \u2014 Fractional Distillation',[['Application','Basis of separation'],['Crude oil refining','Different boiling points of hydrocarbons'],['Liquid air separation','Different boiling points of N2, O2, Ar'],['Ethanol/water','Different boiling points, azeotrope limits']]);}
function dQ6(p){drawTable(p,'WAEC Periodic Table Summary',[['Group','Name','Key property'],['Group 1','Alkali metals','1 outer electron, very reactive'],['Group 7','Halogens','7 outer electrons, reactive non-metals'],['Group 0','Noble gases','Full outer shell, unreactive']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Structure of the Periodic Table',su:'Understand how elements are arranged by period and group.',steps:[
{lb:'Periods and groups',dr:dQ1,ht:'<p>The periodic table arranges elements by increasing ATOMIC NUMBER. A <b>period</b> is a horizontal row \u2014 elements in the same period have the same number of electron SHELLS. A <b>group</b> is a vertical column \u2014 elements in the same group have the same number of OUTER (valence) electrons, giving them similar chemical properties.</p>'},
{lb:'Metals and non-metals',dr:dQ1,ht:'<p>METALS occupy the left and centre of the table (majority of elements) \u2014 they tend to LOSE electrons to form positive ions, are good conductors, malleable and ductile. NON-METALS occupy the top right \u2014 they tend to GAIN or SHARE electrons, are generally poor conductors (except graphite), and are brittle in solid form.</p>'},
{lb:'Why group members behave similarly',dr:dQ1,ht:'<p>Elements in the same group have the SAME number of outer electrons, so they undergo similar types of reactions (e.g. all Group 1 metals lose 1 electron to form +1 ions; all Group 7 elements gain 1 electron to form -1 ions). This is the basis for predicting chemical behaviour from position in the periodic table.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Elements in the same GROUP of the periodic table have the same:',o:['Number of electron shells','Number of outer (valence) electrons, giving similar chemical properties','Atomic mass','Melting point always'],a:2,w:'A group is a vertical column where all elements share the same number of outer-shell electrons, which is why they show similar chemical behaviour (e.g. similar reactions and typical ion charges).'},{q:'Elements in the same PERIOD have the same:',o:['Number of electron shells (rows correspond to shells)','Number of outer electrons','Identical reactivity','Identical melting points'],a:1,w:'A period is a horizontal row. All elements across a period have the same number of electron SHELLS, though the number of outer electrons increases steadily from left to right.'},{q:'Most elements in the periodic table are classified as:',o:['Non-metals','Metals \u2014 they occupy the majority of the table on the left and centre','Metalloids only','Noble gases'],a:2,w:'The majority of known elements are metals, occupying the left and central regions of the periodic table, while non-metals are concentrated in the upper right region.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Group 1 \u2014 The Alkali Metals',su:'Examine the reactivity trend and properties of Group 1 elements.',steps:[
{lb:'General properties of Group 1',dr:dQ2,ht:'<p>Group 1 elements (Li, Na, K, Rb, Cs) are soft, shiny metals with LOW density (Li, Na, K float on water) and LOW melting points compared to most metals. They have ONE outer electron, which is easily lost to form a +1 ion with a stable full outer shell.</p>'},
{lb:'Reactivity with water',dr:dQ2,ht:'<p>Group 1 metals react vigorously with water: 2Na + 2H2O \u2192 2NaOH + H2. REACTIVITY INCREASES down the group (Li < Na < K) because the outer electron is progressively further from the nucleus and more shielded, making it easier to lose. Potassium reacts violently, often igniting the hydrogen produced (lilac flame).</p>'},
{lb:'Trend explanation',dr:dQ2,ht:'<p>The increasing reactivity down Group 1 is explained by ATOMIC RADIUS increasing (extra electron shells) and SHIELDING increasing, both of which reduce the attraction between the nucleus and the single outer electron, making it easier to remove despite the increased nuclear charge.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Reactivity of Group 1 metals with water INCREASES down the group because:',o:['Atomic radius decreases down the group','Atomic radius and shielding increase down the group, making the single outer electron easier to lose despite higher nuclear charge','Nuclear charge decreases down the group','Group 1 metals become non-metallic down the group'],a:2,w:'Down Group 1, extra electron shells increase both atomic radius and shielding. These effects outweigh the increased nuclear charge, so the outer electron becomes progressively easier to remove, increasing reactivity.'},{q:'Sodium reacting with water produces which gas?',o:['Oxygen','Hydrogen (2Na+2H2O\u21922NaOH+H2)','Chlorine','Carbon dioxide'],a:2,w:'The reaction 2Na+2H2O\u21922NaOH+H2 releases hydrogen gas, which can sometimes ignite (especially with more reactive metals like potassium further down the group).'},{q:'Why do Group 1 metals form +1 ions so readily?',o:['They have 8 outer electrons to lose','They have just ONE outer electron, which is easily lost to achieve a stable, full outer shell configuration','They gain electrons instead of losing them','They do not form ions at all'],a:2,w:'Group 1 elements have a single outer-shell electron. Losing this one electron gives the atom a full, stable outer shell (like the nearest noble gas), which is energetically favourable and explains their high reactivity.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Group 7 \u2014 The Halogens',su:'Examine the properties, states and reactivity trend of the halogens.',steps:[
{lb:'General properties of Group 7',dr:dQ3,ht:'<p>Halogens (F2, Cl2, Br2, I2) exist as DIATOMIC molecules. They show a clear trend in physical state at room temperature: F2 and Cl2 are gases, Br2 is a liquid, I2 is a solid \u2014 melting/boiling points INCREASE down the group as molecules become larger with stronger London (van der Waals) forces between them.</p>'},
{lb:'Reactivity trend',dr:dQ3,ht:'<p>Reactivity DECREASES down Group 7 (opposite trend to Group 1) because halogens need to GAIN one electron to complete their outer shell, and as atomic radius/shielding increase down the group, the nucleus attracts an incoming electron less strongly, making it harder to gain \u2014 so reactivity as an oxidising agent decreases.</p>'},
{lb:'Displacement reactions',dr:dQ3,ht:'<p>A more reactive halogen can DISPLACE a less reactive halide from its solution. Example: Cl2 + 2KBr \u2192 2KCl + Br2 (chlorine displaces bromide, since Cl2 is more reactive/a stronger oxidising agent than Br2). This is used as a chemical test to determine the relative reactivity/identity of halogens and halides.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'The reactivity of halogens (Group 7) as they go DOWN the group:',o:['Increases, following the same trend as Group 1','Decreases \u2014 atomic radius and shielding increase, making it harder to attract an extra electron to complete the outer shell','Stays exactly the same','Cannot be predicted from group position'],a:2,w:'Unlike Group 1 (which loses electrons), halogens GAIN an electron to react. As atomic radius and shielding increase down the group, the nucleus attracts an incoming electron less effectively, so reactivity DECREASES down Group 7.'},{q:'Chlorine reacting with potassium bromide solution (Cl2+2KBr\u21922KCl+Br2) is an example of:',o:['A precipitation reaction','A displacement reaction \u2014 the more reactive chlorine displaces the less reactive bromide from solution','An acid-base neutralisation','A redox reaction that does not actually occur'],a:2,w:'Chlorine, being more reactive (a stronger oxidising agent) than bromine, displaces bromide ions from solution, forming chloride ions and releasing bromine \u2014 a classic halogen displacement reaction confirming the reactivity order Cl2>Br2>I2.'},{q:'Why does bromine exist as a liquid at room temperature while chlorine is a gas?',o:['Bromine has weaker intermolecular forces than chlorine','Bromine molecules are larger, giving stronger London (van der Waals) forces between molecules, raising its boiling point above room temperature','Bromine molecules are charged','Chlorine has a higher molecular mass than bromine'],a:2,w:'Down Group 7, molecules become larger and have more electrons, increasing the strength of the London (van der Waals) forces between molecules. This raises melting and boiling points down the group, explaining why bromine (larger, stronger forces) is a liquid while chlorine (smaller) is a gas at room temperature.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Group 0 \u2014 The Noble Gases',su:'Examine why noble gases are unreactive and their practical uses.',steps:[
{lb:'Why noble gases are unreactive',dr:dQ4,ht:'<p>Group 0 elements (He, Ne, Ar, Kr, Xe) have a COMPLETE (full) outer electron shell, meaning they have no tendency to gain, lose, or share electrons under normal conditions \u2014 they exist as single, stable atoms (monatomic) with very weak intermolecular forces, giving them low boiling points and existence as gases at room temperature.</p>'},
{lb:'Trends within the group',dr:dQ4,ht:'<p>Boiling point INCREASES down the group (He lowest, Xe highest) as atomic size and number of electrons increase, strengthening the weak London (van der Waals) forces between atoms. Density also increases down the group as atomic mass increases.</p>'},
{lb:'Practical uses',dr:dQ4,ht:'<p>Uses exploit their inertness and physical properties: Helium \u2014 low density, non-flammable, used in balloons/airships (safer than flammable hydrogen). Neon \u2014 glows distinctively when electricity passed through it, used in advertising signs. Argon \u2014 unreactive, used to provide an inert atmosphere in light bulbs (prevents filament oxidation) and in welding (shields the weld from reacting with air).</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Noble gases are unreactive mainly because they have:',o:['No electrons at all','A complete (full) outer electron shell, giving no tendency to gain, lose, or share electrons','Only one outer electron','Very high nuclear charge'],a:2,w:'Having a full outer electron shell means noble gas atoms are already in their most stable electron configuration, with no drive to react by gaining, losing, or sharing electrons \u2014 this is the fundamental reason for their inertness.'},{q:'Helium is used in balloons/airships instead of hydrogen mainly because:',o:['Helium is heavier than hydrogen','Helium is non-flammable (chemically inert) while hydrogen is flammable and poses a fire/explosion risk','Helium is more expensive so it is preferred','Hydrogen cannot be used in balloons at all'],a:2,w:'Although hydrogen is less dense (more buoyant), it is highly flammable and poses serious safety risks. Helium, being inert (unreactive), provides a much safer alternative despite being slightly denser.'},{q:'Argon is used to fill light bulbs mainly to:',o:['Increase the brightness of the light','Provide an unreactive (inert) atmosphere that prevents the hot metal filament from reacting with oxygen and oxidising/burning out quickly','Make the bulb glow a different colour','Cool the filament down'],a:2,w:'Argon\'s inertness means it does not react with the hot tungsten filament, preventing oxidation that would otherwise cause the filament to burn out much faster if oxygen from air were present inside the bulb.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Advanced Separation \u2014 Fractional Distillation',su:'Examine fractional distillation and its industrial applications.',steps:[
{lb:'Principle of fractional distillation',dr:dQ5,ht:'<p><b>Fractional distillation</b> separates a mixture of MISCIBLE liquids with DIFFERENT (but relatively close) boiling points, using a fractionating column packed with a large surface area (beads/plates) that allows repeated evaporation-condensation cycles, achieving a much sharper separation than simple distillation.</p>'},
{lb:'Fractional distillation of crude oil',dr:dQ5,ht:'<p>Crude oil is a mixture of hydrocarbons with a range of chain lengths (and boiling points). It is heated and fed into a fractionating column that is HOTTER at the bottom and COOLER at the top. Hydrocarbons with LOW boiling points (short chains, e.g. petrol/gasoline) rise further up the column before condensing; hydrocarbons with HIGH boiling points (long chains, e.g. bitumen) condense near the bottom.</p>'},
{lb:'Fractional distillation of liquid air',dr:dQ5,ht:'<p>Air is cooled until it liquefies, then fractionally distilled based on the different boiling points of its components: nitrogen (b.p. -196\u00b0C) boils off first (lowest boiling point), followed by argon (-186\u00b0C), then oxygen (-183\u00b0C, highest boiling point of the major components) remains longest. This process supplies industrial nitrogen, oxygen and argon gas.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'In fractional distillation of crude oil, fractions with the LOWEST boiling points are collected:',o:['At the very bottom of the column','Near the top of the column, since they remain gaseous longest and rise furthest before condensing','Outside the column entirely','At exactly the same point as the highest boiling point fractions'],a:2,w:'The column is hotter at the bottom and cooler at the top. Fractions with low boiling points remain as vapour longer, rising further up the cooler column before finally condensing, so they are collected near the top.'},{q:'In fractional distillation of liquid air, which gas boils off FIRST (has the lowest boiling point)?',o:['Oxygen','Argon','Nitrogen \u2014 it has the lowest boiling point of the major components (-196\u00b0C)','Carbon dioxide'],a:3,w:'Nitrogen has the lowest boiling point (-196\u00b0C) among the major components of air, so as liquid air is gradually warmed, nitrogen gas boils off first, followed by argon, then oxygen (which has the highest boiling point of the three, -183\u00b0C).'},{q:'Fractional distillation differs from simple distillation mainly because it:',o:['Uses a fractionating column with repeated evaporation-condensation cycles, allowing separation of liquids with boiling points that are close together','Only works for a single pure liquid','Cannot separate any mixtures at all','Is identical to simple distillation with no differences'],a:1,w:'The fractionating column provides a large surface area for repeated evaporation and condensation as vapour rises, progressively enriching the vapour in the more volatile (lower boiling point) component \u2014 enabling separation of liquids whose boiling points are too close for simple distillation to separate cleanly.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Periodic Chemistry and Separation',su:'Integrated revision of periodic table groups and separation techniques.',steps:[
{lb:'Group trends summary',dr:dQ6,ht:'<p>Group 1 (alkali metals): 1 outer electron, reactivity INCREASES down group (easier to lose electron). Group 7 (halogens): 7 outer electrons, reactivity DECREASES down group (harder to gain electron). Group 0 (noble gases): full outer shell, unreactive, boiling point increases down group.</p>'},
{lb:'Separation technique summary',dr:dQ6,ht:'<p>Filtration: insoluble solid from liquid. Evaporation: dissolved solid from solution (destroys solvent). Simple distillation: recovers both solvent and dissolved solid, or separates liquids with very different boiling points. Fractional distillation: separates liquids with close boiling points (crude oil, liquid air). Crystallisation: recovers solids that would decompose on full evaporation. Chromatography: separates dissolved substances by differential movement.</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: confusing the reactivity trends of Group 1 (increases down) and Group 7 (decreases down) \u2014 they are OPPOSITE trends for opposite reasons (losing vs gaining electrons). Forgetting that fractional distillation requires a fractionating column, unlike simple distillation. Not explaining WHY a separation method works (state the property difference exploited, e.g. boiling point, solubility, particle size).</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Why do Group 1 and Group 7 show OPPOSITE reactivity trends down their respective groups?',o:['They are actually the same trend','Group 1 elements LOSE an electron to react (easier down the group as radius/shielding increase); Group 7 elements GAIN an electron to react (harder down the group for the same reason)','Group 7 elements do not react at all','Reactivity trends are random and have no explanation'],a:2,w:'Group 1 reactivity depends on how easily the single outer electron can be LOST \u2014 this gets easier down the group. Group 7 reactivity depends on how easily an extra electron can be GAINED \u2014 this gets harder down the group, since the increasingly shielded, distant nucleus attracts an incoming electron less strongly.'},{q:'Which separation technique would best separate the different hydrocarbons in crude oil?',o:['Simple filtration','Fractional distillation \u2014 the hydrocarbons have a range of close but different boiling points','Chromatography','Crystallisation'],a:1,w:'Crude oil consists of many hydrocarbons with different but relatively close boiling points. Fractional distillation, with its fractionating column enabling repeated evaporation-condensation, is specifically suited to separating such closely-boiling mixtures into useful fractions.'},{q:'Argon gas is obtained industrially by which process?',o:['Filtration of air','Fractional distillation of liquefied air, based on the different boiling points of nitrogen, argon and oxygen','Chemical reaction with nitrogen','Evaporation of seawater'],a:1,w:'Air is first liquefied by cooling, then fractionally distilled. As the liquid air warms up, nitrogen boils off first, followed by argon, then oxygen \u2014 allowing each gas to be collected separately based on their distinct boiling points.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
