<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Properties of Acids and Bases',[['Property','Acid','Base'],['Taste (never test!)','Sour','Bitter'],['Litmus','Turns red','Turns blue'],['pH range','Below 7','Above 7'],['Reacts with metals','Yes, gives H2','Generally no']]);}
function dQ2(p){drawTable(p,'Neutralisation Reaction Types',[['Reactants','Products'],['Acid + Metal','Salt + Hydrogen'],['Acid + Base (alkali)','Salt + Water'],['Acid + Metal carbonate','Salt + Water + CO2'],['Acid + Metal oxide','Salt + Water']]);}
function dQ3(p){drawTable(p,'Common Salt Preparation Methods',[['Method','Used for'],['Metal + acid','Reactive metal, insoluble salt not formed'],['Insoluble base + acid (titration not needed)','Making soluble salts of insoluble bases'],['Titration (acid + alkali)','Soluble salt from soluble base'],['Precipitation','Insoluble salt']]);}
function dQ4(p){drawTable(p,'Indicator Colours',[['Indicator','Acid colour','Alkali colour'],['Litmus','Red','Blue'],['Methyl orange','Red','Yellow'],['Phenolphthalein','Colourless','Pink']]);}
function dQ5(p){drawTable(p,'Naming Salts from Acids',[['Acid','Salt name ending'],['Hydrochloric acid','...chloride'],['Sulfuric acid','...sulfate'],['Nitric acid','...nitrate'],['Carbonic acid','...carbonate']]);}
function dQ6(p){drawTable(p,'WAEC Acids and Bases Summary',[['Concept','Key point'],['Acid','Produces H+ in water, pH<7'],['Base/Alkali','Produces OH-, pH>7'],['Salt','Formed from acid + base/metal/carbonate']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Properties of Acids and Bases',su:'Identify the characteristic properties and reactions of acids and bases.',steps:[
{lb:'General properties',dr:dQ1,ht:'<p>ACIDS: taste sour (never taste in the lab!), turn blue litmus RED, have pH BELOW 7, produce hydrogen ions (H+) when dissolved in water, react with reactive metals to produce hydrogen gas. BASES (alkalis are soluble bases): taste bitter, feel soapy, turn red litmus BLUE, have pH ABOVE 7, produce hydroxide ions (OH-) when dissolved in water.</p>'},
{lb:'Common acids and bases',dr:dQ1,ht:'<p>Common LABORATORY acids: hydrochloric acid (HCl), sulfuric acid (H2SO4), nitric acid (HNO3) \u2014 all STRONG acids (fully dissociate). Common bases: sodium hydroxide (NaOH), potassium hydroxide (KOH) \u2014 strong alkalis; ammonia (NH3) \u2014 a weak alkali. Metal oxides and metal hydroxides are generally bases (many are insoluble, so are not technically "alkalis" unless soluble).</p>'},
{lb:'Reactions with metals',dr:dQ1,ht:'<p>Acids react with REACTIVE metals (above hydrogen in the reactivity series) to produce a salt and HYDROGEN gas: metal + acid \u2192 salt + H2. Example: Zn + 2HCl \u2192 ZnCl2 + H2. This reaction is tested for by holding a lit splint near the gas produced \u2014 a "squeaky pop" confirms hydrogen.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'An acid dissolved in water produces which ion in solution?',o:['Hydroxide ions (OH-)','Hydrogen ions (H+), which is why acids have a pH below 7','Chloride ions only','Sodium ions'],a:2,w:'By definition, acids release hydrogen ions (H+) when dissolved in water, which is what gives acidic solutions their characteristic properties (pH below 7, reacting with reactive metals, turning litmus red).'},{q:'A metal reacting with dilute hydrochloric acid produces bubbles of gas that give a "squeaky pop" with a lit splint. This gas is:',o:['Oxygen','Carbon dioxide','Hydrogen \u2014 confirmed by the characteristic squeaky pop test','Chlorine'],a:2,w:'The squeaky pop test is the standard confirmatory test for hydrogen gas, which is produced when a reactive metal reacts with an acid (metal+acid\u2192salt+hydrogen).'},{q:'Which of these is classified as a strong acid?',o:['Ammonia solution','Sodium hydroxide','Hydrochloric acid \u2014 fully dissociates in water to release H+ ions','Calcium hydroxide'],a:2,w:'Hydrochloric acid (HCl) is a strong acid because it fully dissociates in water, releasing all its H+ ions. Sodium hydroxide and calcium hydroxide are bases (not acids), and ammonia is a weak base, not an acid.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Neutralisation Reactions',su:'Write and balance equations for the different types of neutralisation reaction.',steps:[
{lb:'Acid + alkali (base) neutralisation',dr:dQ2,ht:'<p><b>Neutralisation</b>: acid + alkali \u2192 salt + water. Example: HCl + NaOH \u2192 NaCl + H2O. The essential reaction happening is: H+ (from acid) + OH- (from alkali) \u2192 H2O. This is the underlying ionic equation for ALL acid-alkali neutralisations, regardless of which specific acid or alkali is used.</p>'},
{lb:'Acid + metal carbonate',dr:dQ2,ht:'<p>Acid + metal carbonate \u2192 salt + water + carbon dioxide. Example: 2HCl + CaCO3 \u2192 CaCl2 + H2O + CO2. This reaction is easily identified by EFFERVESCENCE (bubbling as CO2 gas is released), which turns limewater milky \u2014 a useful confirmatory test.</p>'},
{lb:'Acid + metal oxide',dr:dQ2,ht:'<p>Acid + metal oxide \u2192 salt + water. Example: 2HCl + CuO \u2192 CuCl2 + H2O. Metal oxides are BASIC oxides (they react with acids like a base would), even though they are typically insoluble in water (so not technically "alkalis"). This reaction usually requires gentle warming, since metal oxides often react more slowly than soluble alkalis.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'The general equation for the reaction between an acid and a metal carbonate is:',o:['Acid + carbonate \u2192 salt + water only','Acid + carbonate \u2192 salt + water + carbon dioxide, with effervescence observed','Acid + carbonate \u2192 salt + hydrogen','No reaction occurs between acids and carbonates'],a:2,w:'Acids react with metal carbonates to produce a salt, water, AND carbon dioxide gas (identified by effervescence/bubbling, and confirmed by turning limewater milky) \u2014 e.g. 2HCl+CaCO3\u2192CaCl2+H2O+CO2.'},{q:'The essential ionic reaction underlying ALL acid + alkali neutralisations is:',o:['Metal + acid \u2192 salt + hydrogen','H+ + OH- \u2192 H2O, regardless of which specific acid and alkali are used','Cl- + Na+ \u2192 NaCl only','CO3 2- + 2H+ \u2192 H2O + CO2'],a:2,w:'No matter which specific acid and alkali are involved, the core neutralisation reaction is always H+ (from the acid) combining with OH- (from the alkali) to form water \u2014 this is why all acid-alkali neutralisations follow the same underlying pattern.'},{q:'Copper(II) oxide (a metal oxide) reacting with dilute sulfuric acid produces:',o:['Copper metal and oxygen gas','Copper(II) sulfate and water \u2014 a typical metal oxide + acid neutralisation','Copper carbonate and CO2','No reaction, since metal oxides do not react with acids'],a:2,w:'Metal oxides act as basic oxides and react with acids in a neutralisation reaction to produce a salt and water: CuO + H2SO4 \u2192 CuSO4 + H2O, often requiring gentle warming since the reaction proceeds more slowly than with soluble alkalis.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Preparing Salts',su:'Choose and describe the correct method for preparing a specific salt.',steps:[
{lb:'Preparing a soluble salt from an insoluble base/metal',dr:dQ3,ht:'<p>For a soluble salt made from an INSOLUBLE reactant (e.g. copper oxide, or an unreactive-enough metal): add EXCESS insoluble base/metal to the acid (ensures ALL the acid reacts, since excess solid is easy to remove afterwards). Filter off the unreacted excess solid. Evaporate/crystallise the filtrate to obtain pure salt crystals. No indicator is needed since the excess solid method itself confirms complete reaction.</p>'},
{lb:'Preparing a soluble salt by titration',dr:dQ3,ht:'<p>For a soluble salt made from TWO SOLUBLE reactants (e.g. NaOH + HCl, both soluble, no easy way to add "excess" and filter it off): use TITRATION with an indicator to find the exact volumes that react completely (neutralise each other). Then repeat WITHOUT the indicator (using the exact volumes found), since the indicator itself would contaminate the pure salt product.</p>'},
{lb:'Preparing an insoluble salt by precipitation',dr:dQ3,ht:'<p>For an INSOLUBLE salt (e.g. lead sulfate, barium sulfate): mix two soluble solutions whose ions combine to form the insoluble salt directly (PRECIPITATION reaction). Example: Pb(NO3)2 + Na2SO4 \u2192 PbSO4 (precipitate) + 2NaNO3. Filter to collect the precipitate, wash to remove soluble impurities, then dry.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'To prepare copper(II) sulfate (a soluble salt) from insoluble copper oxide and dilute sulfuric acid, the correct method is to:',o:['Use titration with an indicator','Add EXCESS copper oxide to the acid, filter off the unreacted excess, then evaporate/crystallise the filtrate','Mix two soluble solutions to form a precipitate','Simply heat the copper oxide alone'],a:2,w:'Since copper oxide is insoluble, excess can be added to ensure all the acid reacts completely; the leftover solid is easily filtered off, leaving a pure solution of the salt, which is then evaporated/crystallised to obtain solid crystals.'},{q:'Why is titration (with an indicator, then repeated without) used to prepare sodium chloride from sodium hydroxide and hydrochloric acid?',o:['Because sodium chloride is insoluble','Because BOTH reactants are soluble, so there is no easy way to add "excess" solid and filter it off \u2014 exact reacting volumes must be found by titration instead','Titration is never used for salt preparation','Because sodium hydroxide reacts too violently'],a:2,w:'Since both NaOH and HCl are soluble solutions, there is no insoluble excess to filter off as in the copper oxide method. Instead, titration determines the EXACT volumes needed for complete neutralisation, and the reaction is then repeated without an indicator to avoid contaminating the final pure salt.'},{q:'Lead sulfate (an insoluble salt) is prepared by:',o:['Titration with an indicator','Adding excess lead metal to sulfuric acid','Precipitation \u2014 mixing two soluble solutions (e.g. lead nitrate and sodium sulfate) whose ions combine to form the insoluble salt directly','Simple evaporation of lead nitrate solution'],a:2,w:'Since the target product (lead sulfate) is itself insoluble, it is prepared by precipitation: mixing two soluble solutions containing the required ions (Pb2+ and SO4 2-), which combine to form the insoluble salt directly as a precipitate, then filtering, washing, and drying it.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Indicators and Naming Salts',su:'Use indicators to test pH, and correctly name salts formed from different acids.',steps:[
{lb:'Common indicators',dr:dQ4,ht:'<p>LITMUS: red in acid, blue in alkali (also comes as litmus paper, useful for a simple pH test). METHYL ORANGE: red in acid, yellow in alkali (useful in titrations, especially with weaker bases). PHENOLPHTHALEIN: colourless in acid, pink in alkali (useful in titrations, especially with weaker acids). Universal indicator gives a range of colours corresponding to different pH values across the whole scale (0-14).</p>'},
{lb:'Naming salts from the parent acid',dr:dQ5,ht:'<p>The name of a salt depends on the acid used: hydrochloric acid produces "...CHLORIDE" salts (e.g. sodium chloride). Sulfuric acid produces "...SULFATE" salts (e.g. copper sulfate). Nitric acid produces "...NITRATE" salts (e.g. potassium nitrate). Carbonic acid (from CO2 dissolved in water) produces "...CARBONATE" salts.</p>'},
{lb:'The metal/base determines the first part of the name',dr:dQ5,ht:'<p>The FIRST part of the salt name comes from the metal (or ammonium ion) in the base/metal that reacted. Example: potassium hydroxide + sulfuric acid \u2192 potassium sulfate. Magnesium oxide + hydrochloric acid \u2192 magnesium chloride. Combine metal name (from the base) + acid-derived ending (from the acid) to correctly name any salt.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'What salt forms when potassium hydroxide reacts with nitric acid?',o:['Potassium chloride','Potassium sulfate','Potassium nitrate \u2014 the metal name (potassium) combines with the acid-derived ending (nitrate, from nitric acid)','Potassium carbonate'],a:2,w:'The metal in the base (potassium, from KOH) combines with the ending derived from the acid used (nitric acid gives "nitrate"), so the product is potassium nitrate: KOH+HNO3\u2192KNO3+H2O.'},{q:'A solution turns methyl orange RED. This tells you the solution is:',o:['Alkaline (basic)','Acidic \u2014 methyl orange is red in acid, yellow in alkali','Neutral','Contains no acid or base at all'],a:2,w:'Methyl orange indicator is RED in acidic solutions and turns YELLOW in alkaline solutions, so observing a red colour confirms the solution is acidic (pH below its transition range).'},{q:'Which acid produces "sulfate" salts when it reacts with a metal or base?',o:['Hydrochloric acid','Nitric acid','Sulfuric acid \u2014 e.g. reacting with sodium hydroxide gives sodium sulfate','Carbonic acid'],a:2,w:'Sulfuric acid (H2SO4) always produces salts with the "sulfate" ending, since the sulfate ion (SO4 2-) originates from this acid \u2014 e.g. NaOH+H2SO4 gives sodium sulfate (Na2SO4) and water.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Strong and Weak Acids/Bases (Introductory)',su:'Distinguish strong and weak acids/bases by their degree of dissociation.',steps:[
{lb:'Strong vs weak acids',dr:dQ1,ht:'<p>A STRONG acid FULLY dissociates (ionises completely) in water \u2014 e.g. HCl \u2192 H+ + Cl- (100% dissociation). A WEAK acid only PARTIALLY dissociates \u2014 most of the acid remains as undissociated molecules, with only a small proportion forming H+ ions. Example: ethanoic acid (vinegar) is a weak acid \u2014 CH3COOH \u21cc H+ + CH3COO- (equilibrium, mostly undissociated).</p>'},
{lb:'Comparing strong and weak acids of equal concentration',dr:dQ1,ht:'<p>For the SAME concentration, a strong acid will have a LOWER pH (more H+ ions present, since it dissociates fully) than a weak acid of the same concentration (fewer H+ ions present at any moment, since dissociation is only partial). Strong acids also react FASTER with metals/carbonates (more free H+ available to react immediately), and conduct electricity better (more ions present to carry charge).</p>'},
{lb:'Strong vs weak bases',dr:dQ1,ht:'<p>Similarly, a STRONG base (e.g. NaOH) fully dissociates to release OH- ions; a WEAK base (e.g. ammonia, NH3) only partially reacts with water to form a small proportion of OH- ions (NH3 + H2O \u21cc NH4+ + OH-, mostly remaining as NH3 molecules). "Strong/weak" refers to the DEGREE OF DISSOCIATION, NOT to be confused with "concentrated/dilute" (which refers to the AMOUNT of acid/base dissolved per volume).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'A strong acid is defined as one that:',o:['Has a very high concentration','Fully dissociates (ionises completely) in water, releasing all its H+ ions','Is always more dangerous than a weak acid','Has a pH above 7'],a:2,w:'The term "strong" specifically refers to the DEGREE OF DISSOCIATION \u2014 a strong acid ionises completely in water, releasing 100% of its potential H+ ions, unlike a weak acid which only partially dissociates.'},{q:'For two acids of the SAME concentration, a strong acid will have a pH that is:',o:['Higher than a weak acid of the same concentration','Lower than a weak acid of the same concentration, since it releases more H+ ions through complete dissociation','Exactly the same as a weak acid','Impossible to compare without more information'],a:2,w:'A strong acid dissociates fully, releasing the maximum possible number of H+ ions for a given concentration. A weak acid of the SAME concentration only partially dissociates, so fewer H+ ions are present, giving it a higher (less acidic) pH than the strong acid.'},{q:'The terms "strong/weak" and "concentrated/dilute" are:',o:['Exactly the same thing','Different concepts \u2014 strong/weak refers to the DEGREE OF DISSOCIATION, while concentrated/dilute refers to the AMOUNT of acid/base dissolved per unit volume','Only used interchangeably for bases, not acids','Not relevant to acids or bases at all'],a:2,w:'These describe different properties: "strong/weak" is about how COMPLETELY the acid/base ionises in water (a fixed chemical property), while "concentrated/dilute" is about how MUCH acid/base is dissolved in a given volume of solution (can be varied by adding more water) \u2014 a dilute strong acid can still fully dissociate, just with fewer total H+ ions present.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Acids, Bases and Salts (Extended)',su:'Integrated revision of acid-base reactions, salt preparation and naming.',steps:[
{lb:'Reaction types summary',dr:dQ2,ht:'<p>Acid+metal\u2192salt+hydrogen. Acid+alkali\u2192salt+water. Acid+metal carbonate\u2192salt+water+CO2. Acid+metal oxide\u2192salt+water. All these are variations of neutralisation, ultimately based on H+ (or the acid) reacting with a base/carbonate/metal to form a salt.</p>'},
{lb:'Salt preparation method summary',dr:dQ3,ht:'<p>Soluble salt from insoluble reactant: excess solid + acid, filter, evaporate/crystallise. Soluble salt from two soluble reactants: titration (indicator first, then repeat without indicator using exact volumes). Insoluble salt: precipitation (mix two soluble solutions), filter, wash, dry.</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: forgetting to use EXCESS solid (not exact amounts) when preparing a soluble salt from an insoluble reactant. Forgetting titration must be repeated WITHOUT the indicator for a pure product (the indicator itself is an impurity). Mixing up salt naming endings (chloride from HCl, sulfate from H2SO4, nitrate from HNO3, carbonate from H2CO3). Confusing "strong/weak" (dissociation) with "concentrated/dilute" (amount dissolved).</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'What salt is formed when magnesium reacts with dilute sulfuric acid?',o:['Magnesium chloride','Magnesium sulfate \u2014 the metal (magnesium) combines with the sulfate ending from sulfuric acid, and hydrogen gas is also released','Magnesium nitrate','Magnesium carbonate'],a:2,w:'Mg + H2SO4 \u2192 MgSO4 + H2. The metal name (magnesium) combines with the acid-derived ending (sulfate, from sulfuric acid), and since this is a metal+acid reaction, hydrogen gas is also produced.'},{q:'Why must a titration used to prepare a pure salt be repeated WITHOUT an indicator?',o:['Indicators make the reaction go faster','The indicator itself is a chemical impurity that would contaminate the final pure salt crystals if left in the mixture','Titrations cannot be repeated','Indicators change the salt formed'],a:2,w:'While the indicator is essential for FINDING the correct volumes needed for neutralisation, it is itself a foreign substance. To obtain a PURE salt product, the reaction is repeated using the exact known volumes (found from the indicator titration) but WITHOUT adding the indicator this time.'},{q:'A metal carbonate reacting with an acid can be identified by which observation?',o:['A colour change only','Effervescence (bubbling), as CO2 gas is released, which turns limewater milky when tested','No visible change at all','A sudden drop in temperature only'],a:2,w:'The reaction acid+carbonate\u2192salt+water+CO2 produces visible bubbling (effervescence) as carbon dioxide gas escapes. This gas can be confirmed as CO2 by passing it through limewater, which turns milky (cloudy) in its presence.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
