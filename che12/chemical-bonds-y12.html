<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Types of Chemical Bond',[['Bond type','Formed between','Example'],['Ionic','Metal + non-metal','NaCl'],['Covalent','Non-metal + non-metal','H2O, CO2'],['Metallic','Metal atoms','Cu, Fe']]);}
function dQ2(p){drawTable(p,'Ionic Bonding \u2014 NaCl Formation',[['Step','Change'],['Na loses 1 electron','Na \u2192 Na+ + e-'],['Cl gains 1 electron','Cl + e- \u2192 Cl-'],['Ions attract','Na+ + Cl- \u2192 NaCl lattice']]);}
function dQ3(p){drawTable(p,'Covalent Bonding \u2014 Simple Molecules',[['Molecule','Bonds shared','Shape'],['H2','1 pair','Linear'],['H2O','2 pairs (+2 lone pairs on O)','Bent'],['CO2','2 double bonds','Linear'],['NH3','3 pairs (+1 lone pair)','Pyramidal']]);}
function dQ4(p){drawTable(p,'Properties from Bonding Type',[['Bonding','Melting point','Conductivity'],['Ionic','High','Conducts molten/aqueous only'],['Covalent (simple)','Low','Does not conduct'],['Covalent (giant)','Very high','Usually does not conduct (except graphite)'],['Metallic','High','Conducts as solid and liquid']]);}
function dQ5(p){drawTable(p,'Giant Covalent Structures',[['Substance','Structure','Property'],['Diamond','Each C bonded to 4 others','Very hard, high m.p.'],['Graphite','Layers of C, 3 bonds each','Soft, conducts electricity'],['Silicon dioxide','Each Si bonded to 4 O','Very high m.p., hard']]);}
function dQ6(p){drawTable(p,'WAEC Bonding Summary',[['Type','Key feature'],['Ionic','Electron transfer, lattice, high m.p.'],['Covalent','Electron sharing, molecular or giant'],['Metallic','Delocalised electrons, conducts, malleable']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Types of Chemical Bonding',su:'Identify ionic, covalent and metallic bonding from the elements involved.',steps:[
{lb:'Overview of bond types',dr:dQ1,ht:'<p>Chemical bonds hold atoms together in compounds. <b>Ionic bonding</b> occurs between a METAL and a NON-METAL (electron transfer). <b>Covalent bonding</b> occurs between two NON-METALS (electron sharing). <b>Metallic bonding</b> occurs between METAL atoms (delocalised electrons). Predicting bond type from the elements involved is a key WAEC skill.</p>'},
{lb:'Why atoms bond',dr:dQ1,ht:'<p>Atoms bond to achieve a more STABLE electron arrangement, usually a full outer shell (like the nearest noble gas). Metals achieve this by LOSING electrons (forming positive ions); non-metals achieve this by GAINING electrons (forming negative ions) or by SHARING electrons with another non-metal.</p>'},
{lb:'Identifying bond type from a formula',dr:dQ1,ht:'<p>Practice: NaCl (metal Na + non-metal Cl) \u2192 ionic. CO2 (non-metal C + non-metal O) \u2192 covalent. MgO (metal Mg + non-metal O) \u2192 ionic. Cu (metal only) \u2192 metallic. H2O (non-metal + non-metal) \u2192 covalent. Always check the position of each element (metal vs non-metal) in the periodic table first.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'What type of bonding would you expect in magnesium oxide (MgO)?',o:['Covalent, since both are non-metals','Ionic \u2014 Mg is a metal and O is a non-metal, so electrons transfer from Mg to O','Metallic, since Mg is present','No bonding occurs'],a:2,w:'Mg is a metal and O is a non-metal. When a metal reacts with a non-metal, electrons transfer from the metal to the non-metal, forming oppositely charged ions that attract electrostatically \u2014 ionic bonding.'},{q:'Carbon dioxide (CO2) is held together by which type of bonding?',o:['Ionic, since carbon is a metal','Covalent \u2014 both carbon and oxygen are non-metals, so electrons are shared','Metallic','No chemical bonding is present'],a:2,w:'Both carbon and oxygen are non-metals. When two non-metals combine, they share electrons to achieve stable outer shells, forming covalent bonds (in this case, double bonds: O=C=O).'},{q:'Why do metal atoms typically form POSITIVE ions rather than negative ions?',o:['Metals gain electrons more easily than non-metals','Metals have relatively few outer electrons, which are more easily LOST to achieve a stable, full outer shell configuration','Metals never form ions','Metals have full outer shells already'],a:2,w:'Metals typically have 1-3 outer electrons. Losing these few electrons achieves a stable, full outer shell (matching the nearest noble gas) more easily than gaining several electrons would, so metals form positive ions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Ionic Bonding in Detail',su:'Examine electron transfer and the structure/properties of ionic compounds.',steps:[
{lb:'Electron transfer in NaCl',dr:dQ2,ht:'<p>Sodium (2,8,1) loses its single outer electron to form Na+ (2,8, a stable full-shell configuration). Chlorine (2,8,7) gains one electron to form Cl- (2,8,8, also stable). The Na+ and Cl- ions, being oppositely charged, attract each other strongly (electrostatic attraction) to form the ionic compound sodium chloride.</p>'},
{lb:'Giant ionic lattice structure',dr:dQ2,ht:'<p>Ionic compounds form a GIANT LATTICE structure \u2014 each ion is surrounded by oppositely charged ions in a regular, repeating 3D pattern, held together by strong electrostatic forces in ALL directions (not just single bonds between pairs). This is why ionic compounds have HIGH melting and boiling points \u2014 a large amount of energy is needed to break apart the extensive lattice of attractions.</p>'},
{lb:'Properties of ionic compounds',dr:dQ2,ht:'<p>Properties: HIGH melting/boiling points (strong lattice attractions). BRITTLE (when force is applied, like-charged ions are forced next to each other and repel, shattering the lattice). CONDUCT ELECTRICITY only when MOLTEN or DISSOLVED in water (ions become free to move and carry charge) \u2014 solid ionic compounds do NOT conduct, since ions are fixed in place in the lattice.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Solid sodium chloride does NOT conduct electricity because:',o:['NaCl has no ions at all','The ions are fixed in place in the rigid lattice and cannot move to carry charge','Sodium chloride is a covalent compound','Solid NaCl has no charge'],a:2,w:'Although NaCl is made of charged ions, in the SOLID state these ions are held rigidly in fixed positions within the lattice and cannot move freely, so no charge can flow \u2014 hence no electrical conductivity in the solid state.'},{q:'Ionic compounds are typically brittle because:',o:['They have no bonds at all','When a force is applied, layers of ions shift so that like-charged ions align next to each other, causing repulsion and the lattice to shatter','Ionic bonds are extremely weak','They are always liquids'],a:2,w:'Applying force can shift the ionic layers so that ions of the SAME charge become adjacent. Since like charges repel, this causes the lattice to fracture/shatter rather than bend, explaining the characteristic brittleness of ionic solids.'},{q:'Why does molten (liquid) NaCl conduct electricity, unlike solid NaCl?',o:['Molten NaCl has no ions','In the molten state, the ions are free to move and carry electric charge through the liquid, unlike in the rigid solid lattice','Melting removes all the ions','Molten NaCl is a covalent compound'],a:2,w:'When NaCl melts, the rigid lattice structure breaks down and the Na+ and Cl- ions become free to move throughout the liquid, allowing them to carry electric charge \u2014 hence molten ionic compounds conduct electricity, while their solid form does not.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Covalent Bonding in Detail',su:'Examine electron sharing and the shapes of simple covalent molecules.',steps:[
{lb:'What is a covalent bond',dr:dQ3,ht:'<p>A <b>covalent bond</b> forms when two non-metal atoms SHARE a pair of electrons (one from each atom), so both atoms effectively achieve a full outer shell. Single bonds share one pair (e.g. H-H), double bonds share two pairs (e.g. O=O), triple bonds share three pairs (e.g. N\u2261N).</p>'},
{lb:'Simple molecular substances',dr:dQ3,ht:'<p>Simple covalent molecules (H2O, CO2, CH4, NH3) have STRONG covalent bonds WITHIN each molecule, but only WEAK intermolecular forces BETWEEN separate molecules. This means simple covalent substances have relatively LOW melting/boiling points (only the weak forces between molecules need to be overcome, not the strong covalent bonds themselves) and generally do NOT conduct electricity (no free ions or electrons).</p>'},
{lb:'Dot-and-cross diagrams',dr:dQ3,ht:'<p>Dot-and-cross diagrams show covalent bonding by drawing shared electron pairs between two atoms, using dots for one atom\'s electrons and crosses for the other\'s, so you can see clearly which electrons came from which atom. Example: in H2O, oxygen shares one electron pair with each hydrogen atom, while keeping 2 lone (unshared) pairs of its own.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'A single covalent bond consists of:',o:['A transfer of one electron from one atom to another','One shared pair of electrons, with one electron contributed by each bonding atom','Three shared pairs of electrons','No electrons at all'],a:2,w:'A single covalent bond is formed by one shared pair of electrons \u2014 each of the two bonding atoms contributes one electron to this shared pair, allowing both atoms to count the pair towards a full outer shell.'},{q:'Simple covalent substances like water typically have LOW melting points because:',o:['The covalent bonds within each molecule are very weak','Only the WEAK intermolecular forces between separate molecules need to be overcome to melt/boil the substance, not the strong covalent bonds themselves','They contain no bonds at all','They are always gases at all temperatures'],a:2,w:'While the covalent bonds WITHIN a molecule (e.g. O-H bonds in water) are strong, the forces BETWEEN separate molecules (intermolecular forces) are relatively weak. Melting or boiling only requires overcoming these weaker intermolecular forces, not breaking the strong covalent bonds, resulting in comparatively low melting/boiling points.'},{q:'Why do simple covalent compounds generally NOT conduct electricity?',o:['They have no atoms present','They have no free-moving charged particles (ions or delocalised electrons) available to carry an electric current','They are always solids','They always contain metals'],a:2,w:'Electrical conductivity requires free-moving charged particles. Simple covalent molecules have no ions and their electrons are localised in shared bonding pairs (not free to move throughout the substance), so they generally cannot conduct electricity.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Giant Covalent Structures and Metallic Bonding',su:'Examine giant covalent lattices (diamond, graphite) and metallic bonding.',steps:[
{lb:'Giant covalent structures',dr:dQ5,ht:'<p>Some covalent substances form GIANT (macromolecular) structures rather than small, separate molecules \u2014 e.g. diamond (each carbon bonded to 4 others in a rigid 3D network) and silicon dioxide (each Si bonded to 4 O). These have VERY HIGH melting points, since melting requires breaking many strong covalent bonds throughout the entire structure, not just weak intermolecular forces.</p>'},
{lb:'Graphite \u2014 a special case',dr:dQ5,ht:'<p>Graphite is also giant covalent, but each carbon atom bonds to only 3 others, forming flat LAYERS with one electron per carbon left DELOCALISED (free to move within the layer). This gives graphite two unusual properties for a covalent substance: it CONDUCTS electricity (delocalised electrons move along the layers) and is SOFT/SLIPPERY (the layers can slide over each other, since forces BETWEEN layers are weak van der Waals forces, unlike the strong bonds within each layer).</p>'},
{lb:'Metallic bonding',dr:dQ5,ht:'<p><b>Metallic bonding</b>: metal atoms arrange in a lattice of positive ions surrounded by a "sea" of DELOCALISED electrons (from the outer shells, free to move throughout the whole structure). This explains metal properties: CONDUCTS electricity (mobile electrons carry charge) and heat; MALLEABLE/DUCTILE (layers of ions can slide past each other without breaking the overall metallic bonding, since the electron sea is not disrupted); generally HIGH melting points (strong electrostatic attraction between ions and delocalised electrons).</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Diamond has an extremely high melting point because:',o:['It has weak intermolecular forces only','It is a giant covalent structure where every carbon atom is bonded to 4 others by strong covalent bonds throughout the entire lattice, requiring immense energy to break','Diamond is an ionic compound','Diamond has delocalised electrons like a metal'],a:2,w:'Diamond\'s giant covalent lattice means that melting requires breaking a huge number of strong covalent C-C bonds throughout the whole structure, not just overcoming weak intermolecular forces \u2014 this demands an enormous amount of energy, giving diamond an extremely high melting point.'},{q:'Graphite conducts electricity, unlike diamond, because graphite has:',o:['Ionic bonds present','One delocalised electron per carbon atom (since each C only bonds to 3 others), free to move along the layers and carry charge','No carbon atoms at all','Metallic bonding throughout'],a:2,w:'In graphite, each carbon atom bonds to only 3 neighbours (unlike diamond\'s 4), leaving one electron per atom delocalised within each flat layer. These free electrons can move along the layers, allowing graphite to conduct electricity \u2014 an unusual property for a covalent substance.'},{q:'Metals are malleable (can be hammered into shape without breaking) because:',o:['Metallic bonds are very weak and easily broken','Layers of positive metal ions can slide over one another while remaining held together by the mobile "sea" of delocalised electrons, which is non-directional','Metals have no bonding at all','Metal atoms repel each other constantly'],a:2,w:'Metallic bonding is non-directional \u2014 the delocalised electron sea holds the whole structure together regardless of exact ion positions. This allows layers of metal ions to slide past one another under force without breaking the overall bonding, giving metals their characteristic malleability and ductility.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Predicting Properties from Bonding Type',su:'Use bonding type to predict melting point, conductivity and other physical properties.',steps:[
{lb:'Properties summary table approach',dr:dQ4,ht:'<p>WAEC frequently asks you to predict a property GIVEN the bonding type, or identify the bonding type GIVEN a set of properties. Key properties to know for each: ionic (high m.p., conducts when molten/aqueous only, often soluble in water, brittle). Simple covalent (low m.p., does not conduct, often insoluble in water, soluble in organic solvents). Giant covalent (very high m.p., usually does not conduct except graphite). Metallic (high m.p., conducts as solid, malleable/ductile).</p>'},
{lb:'Worked identification example',dr:dQ4,ht:'<p>Example: substance X has a high melting point, conducts electricity only when dissolved in water, and is brittle as a solid. This matches IONIC bonding (lattice structure, ions become mobile only when dissolved or molten, brittle due to layer-shifting causing like-charge repulsion). Recognising this pattern of clues is a key WAEC exam skill.</p>'},
{lb:'Distinguishing similar-looking cases',dr:dQ4,ht:'<p>Care needed: BOTH ionic and giant covalent substances can have high melting points, but only ionic compounds conduct when molten/dissolved (giant covalent substances like diamond/SiO2 do not, since there are no free ions or delocalised electrons \u2014 except graphite, which is the one giant covalent exception that DOES conduct, due to its delocalised electrons).</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'A substance has a low melting point and does not conduct electricity in any state. It is most likely:',o:['An ionic compound','A simple covalent (molecular) substance \u2014 weak intermolecular forces explain the low melting point, and no ions/delocalised electrons explain the lack of conductivity','A metal','A giant ionic lattice'],a:2,w:'Low melting point points to weak intermolecular forces between discrete molecules (simple covalent), and the complete lack of conductivity in any state (solid, liquid) confirms there are no mobile charged particles \u2014 both consistent with a simple covalent molecular substance.'},{q:'A substance has a very high melting point and does NOT conduct electricity in any state (solid or molten). It is most likely:',o:['An ionic compound','Metallic','A giant covalent structure such as diamond or silicon dioxide (NOT graphite, which is the exception that does conduct)','A simple covalent gas'],a:2,w:'A very high melting point suggests a giant structure (many strong bonds to break). Since it does NOT conduct even when molten (unlike ionic compounds), and giant covalent structures generally lack free ions/delocalised electrons, this points to a giant covalent structure like diamond or SiO2 (graphite being the notable exception due to its delocalised electrons).'},{q:'Which property would help distinguish an ionic compound from a giant covalent substance, both of which have high melting points?',o:['Colour of the solid','Whether the substance conducts electricity when MOLTEN \u2014 ionic compounds do (mobile ions), most giant covalent substances do not (except graphite)','Whether the substance is a solid at room temperature','Density of the solid'],a:2,w:'Both types can have high melting points, but they differ in conductivity when molten: ionic compounds conduct (ions become mobile), while giant covalent substances (except graphite, which has delocalised electrons) generally do not conduct, since there are no ions and the covalent bonding electrons remain localised.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Chemical Bonds',su:'Integrated revision of ionic, covalent and metallic bonding.',steps:[
{lb:'Bonding types summary',dr:dQ6,ht:'<p>Ionic: metal+non-metal, electron transfer, giant lattice, high m.p., conducts molten/aqueous only, brittle. Covalent: non-metal+non-metal, electron sharing, simple molecular (low m.p., does not conduct) or giant (very high m.p., usually does not conduct except graphite). Metallic: metal atoms, delocalised electrons, conducts as solid/liquid, malleable/ductile, generally high m.p.</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: forgetting that solid ionic compounds do NOT conduct (only molten/aqueous). Confusing simple covalent (low m.p.) with giant covalent (very high m.p.) \u2014 always check whether the substance forms discrete small molecules or an extended lattice. Forgetting graphite is the ONE giant covalent exception that conducts electricity. Not explaining bonding in terms of electron transfer/sharing/delocalisation when asked to "explain" a property.</p>'},
{lb:'Problem-solving strategy',dr:dQ6,ht:'<p>WAEC strategy for bonding questions: (1) Identify whether the elements involved are metals or non-metals. (2) Predict the bond type (ionic/covalent/metallic) from this. (3) Use the bond type to predict properties (melting point, conductivity, solubility). (4) For "explain" questions, always describe the underlying electron behaviour (transfer, sharing, or delocalisation), not just state the property.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'A compound formed between potassium (a metal) and bromine (a non-metal) would have which type of bonding?',o:['Covalent','Ionic \u2014 electrons transfer from the metal (K) to the non-metal (Br)','Metallic','No bonding at all'],a:2,w:'Since potassium is a metal and bromine is a non-metal, electrons transfer from potassium to bromine, forming K+ and Br- ions that attract electrostatically \u2014 ionic bonding, giving the compound potassium bromide (KBr).'},{q:'A substance conducts electricity as both a solid AND a liquid, and is malleable. This bonding type is:',o:['Ionic','Simple covalent','Metallic \u2014 delocalised electrons allow conductivity in both states, and non-directional bonding allows malleability','Giant covalent (non-graphite)'],a:2,w:'Conductivity in BOTH solid and liquid states, combined with malleability, is characteristic of metallic bonding \u2014 the delocalised "sea" of electrons carries charge in both states, and the non-directional bonding allows layers of ions to slide without breaking the metallic bonds.'},{q:'Which of these substances would you expect to have the LOWEST melting point?',o:['Sodium chloride (ionic)','Diamond (giant covalent)','A simple covalent molecule like carbon dioxide, CO2, held together only by weak intermolecular forces between molecules','Iron (metallic)'],a:2,w:'Simple covalent (molecular) substances like CO2 have only weak intermolecular forces between separate molecules, requiring far less energy to overcome than the extensive lattice structures of ionic, giant covalent, or metallic substances \u2014 giving them the lowest melting points of the options listed.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
