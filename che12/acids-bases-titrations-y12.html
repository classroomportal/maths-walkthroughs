<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}

body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawCurve(p,'Strong Acid + Strong Base Titration Curve',[[0,1],[5,1.5],[9,2.5],[9.8,4],[10,7],[10.2,10],[11,11.5],[15,12],[20,12.3]],'Sharp vertical jump at pH 7 (equivalence)');}
function dQ2(p){drawCurve(p,'Weak Acid + Strong Base Titration Curve',[[0,3],[5,4.5],[9,5.2],[10,8.8],[10.2,10.5],[11,11.5],[15,12],[20,12.2]],'Equivalence point above pH 7 (basic salt)');}
function dQ3(p){drawTable(p,'Choosing an Indicator from the Curve',[['Titration type','Equivalence pH','Best indicator'],['Strong-Strong','7','Methyl orange OR phenolphthalein'],['Weak acid-Strong base','>7','Phenolphthalein'],['Strong acid-Weak base','<7','Methyl orange'],['Weak-Weak','no sharp jump','No suitable indicator']]);}
function dQ4(p){drawTable(p,'Stepwise Dissociation of Phosphoric Acid H3PO4',[['Step','Equilibrium','Relative Ka'],['1st','H3PO4 \u21cc H+ + H2PO4-','Largest (Ka1)'],['2nd','H2PO4- \u21cc H+ + HPO4 2-','Smaller (Ka2)'],['3rd','HPO4 2- \u21cc H+ + PO4 3-','Smallest (Ka3)']]);}
function dQ5(p){drawTable(p,'Back Titration \u2014 Key Steps',[['Step','Action'],['1','Add known excess of standard reagent'],['2','React fully with the sample'],['3','Titrate remaining excess with 2nd standard solution'],['4','Subtract to find amount reacted with sample']]);}
function dQ6(p){drawTable(p,'Common Primary Standards',[['Substance','Property'],['Anhydrous Na2CO3','Stable, high purity, known Mr'],['KHP (potassium hydrogen phthalate)','Stable solid acid standard'],['NaCl (some uses)','Stable, unreactive with air']]);}
function dQ7(p){drawTable(p,'Titration Calculation \u2014 Worked Data',[['Quantity','Value'],['Vol. NaOH used','23.50 cm3'],['Conc. NaOH','0.100 mol/dm3'],['Vol. acid sample','25.00 cm3'],['Moles NaOH','0.00235 mol']]);}
function dQ8(p){drawTable(p,'WAEC Acid-Base Summary',[['Concept','Key idea'],['pH','-log[H+]'],['Ka','Acid dissociation constant'],['Equivalence point','moles acid = moles base (adjusted)'],['Buffer region','pH changes slowly, half-equivalence pH=pKa']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Titration Curve Shapes',su:'Examine the four types of acid-base titration curve and their characteristic shapes.',steps:[
{lb:'Strong acid + strong base',dr:dQ1,ht:'<p>Adding strong base to strong acid: pH starts LOW (~1), rises slowly, then shows a very SHARP, near-vertical jump through pH 7 at the equivalence point (typically pH 3 to pH 11 over less than 1 cm3 added), then levels off at high pH. The equivalence point is exactly pH 7 because the salt formed (e.g. NaCl) is neutral \u2014 neither ion hydrolyses water.</p>'},
{lb:'Weak acid + strong base',dr:dQ2,ht:'<p>Starting pH is higher than for a strong acid of the same concentration (weak acid only partially dissociates). The curve has a "buffer region" (gentle slope) before equivalence, where added base is resisted by the weak acid/conjugate base mixture. The jump at equivalence is smaller and less sharp, and occurs ABOVE pH 7 (typically pH 8-10) because the salt formed is the conjugate base of a weak acid, which hydrolyses water to make the solution basic.</p>'},
{lb:'Strong acid + weak base, and weak + weak',dr:dQ1,ht:'<p>Strong acid + weak base: equivalence point is BELOW pH 7 (typically pH 4-6) because the salt formed is an acidic ammonium-type salt (weak conjugate acid hydrolyses water). Weak acid + weak base: NO sharp vertical jump at all \u2014 the curve rises very gradually throughout, making it very difficult to detect the endpoint with an indicator; a pH meter or conductivity method is needed instead.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'A strong acid titrated with a strong base has its equivalence point at:',o:['pH 4','pH 7 \u2014 the salt formed is neutral and does not hydrolyse water','pH 10','pH depends only on the volume of base added, never fixed'],a:2,w:'Strong acid + strong base neutralisation produces a neutral salt (e.g. NaCl from HCl+NaOH) whose ions do not react with water, so the solution remains neutral at pH 7 at the equivalence point.'},{q:'Why does a weak acid + strong base titration have its equivalence point ABOVE pH 7?',o:['The base is in excess at equivalence','The salt formed contains the conjugate base of a weak acid, which reacts with water (hydrolyses) to produce OH-, making the solution basic','Weak acids never reach equivalence','The indicator changes the pH artificially'],a:2,w:'At equivalence, the solution contains the salt of a weak acid and a strong base (e.g. sodium ethanoate). The conjugate base (ethanoate ion) is a weak base and reacts with water: CH3COO- + H2O \u21cc CH3COOH + OH-, producing excess OH- and raising the pH above 7.'},{q:'Which titration type shows NO sharp jump in the pH curve, making indicators unreliable?',o:['Strong acid + strong base','Weak acid + strong base','Strong acid + weak base','Weak acid + weak base'],a:4,w:'Weak acid + weak base titrations produce a very gradual pH change throughout with no sharp vertical jump at any point, so no indicator can reliably detect the equivalence point \u2014 a pH meter or conductivity measurement is needed instead.'},{q:'The "buffer region" seen before the equivalence point in a weak acid + strong base titration is where:',o:['The pH changes very rapidly','The pH changes only gradually, because the weak acid and its conjugate base (both present together) resist pH change','No reaction is occurring','The indicator has already changed colour'],a:2,w:'Before equivalence, the solution contains a mixture of the remaining weak acid (HA) and the conjugate base formed (A-) from partial neutralisation \u2014 this is exactly a buffer system, which resists pH change as more base is added, producing the gentle slope seen on the curve.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Reading Titration Curves',su:'Identify equivalence point, half-equivalence point and buffer region from a curve.',steps:[
{lb:'The equivalence point',dr:dQ2,ht:'<p>The <b>equivalence point</b> is where the moles of acid EXACTLY equal the moles of base (adjusted for stoichiometry) \u2014 it is found at the MIDPOINT of the steepest, most vertical part of the curve (the point of inflection). This is NOT necessarily pH 7 (only true for strong-strong titrations).</p>'},
{lb:'The half-equivalence point',dr:dQ2,ht:'<p>The <b>half-equivalence point</b> occurs when exactly HALF the acid (or base) has been neutralised \u2014 at this point, [HA] = [A-] (equal concentrations of weak acid and its conjugate base), so from the Henderson-Hasselbalch equation: pH = pKa + log(1) = pKa. Reading the pH at the half-equivalence volume on a weak acid curve gives you the pKa of the acid directly.</p>'},
{lb:'Practical use: finding Ka from a curve',dr:dQ2,ht:'<p>To find the Ka of an unknown weak acid experimentally: (1) titrate with standard NaOH, recording pH continuously. (2) Find the equivalence point volume (Veq) from the curve. (3) Find the pH at Veq/2 (half-equivalence volume) \u2014 this pH equals pKa. (4) Calculate Ka = 10^(-pKa). This is a common WAEC/practical exam technique linking titration curves to equilibrium constants.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'The equivalence point on a titration curve is located at:',o:['The very start of the curve','The point of steepest gradient (point of inflection) on the curve','Always exactly pH 7','The point where the indicator is added'],a:2,w:'The equivalence point is where moles of acid = moles of base (stoichiometrically). Graphically, this corresponds to the steepest part of the curve (point of inflection), regardless of the actual pH value there.'},{q:'At the half-equivalence point of a weak acid titration, the relationship [HA]=[A-] means:',o:['pH = 0','pH = 7 always','pH = pKa of the weak acid (from Henderson-Hasselbalch: pH=pKa+log([A-]/[HA]), and log(1)=0)','pH cannot be determined'],a:3,w:'At half-equivalence, exactly half the weak acid has been converted to its conjugate base, so [HA]=[A-]. Henderson-Hasselbalch: pH=pKa+log([A-]/[HA])=pKa+log(1)=pKa+0=pKa.'},{q:'To experimentally determine the Ka of an unknown weak acid using a titration curve, you should read the pH at:',o:['The very start of the titration (before any base added)','The equivalence point','Half the volume needed to reach equivalence (half-equivalence point)','The point of maximum buffering capacity, which is unrelated to Ka'],a:3,w:'The pH at the half-equivalence volume equals the pKa of the acid (since [HA]=[A-] there). From this, Ka = 10^(-pKa) can be calculated directly \u2014 this is the standard practical method for finding Ka graphically.'},{q:'A titration curve shows equivalence at 22.0 cm3 of base added. At what volume would you read off the pKa of the acid?',o:['44.0 cm3','22.0 cm3','11.0 cm3 (half of 22.0 cm3)','0 cm3'],a:3,w:'The half-equivalence point is exactly HALF the volume needed to reach equivalence: 22.0/2 = 11.0 cm3. The pH recorded at this volume on the curve equals the pKa of the weak acid.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Choosing the Correct Indicator',su:'Select the appropriate indicator for a titration based on the shape of its pH curve.',steps:[
{lb:'How indicators work',dr:dQ3,ht:'<p>An indicator is itself a weak acid (HIn) with the acid form (HIn) and base form (In-) having DIFFERENT colours. It changes colour over a narrow pH RANGE close to its own pKa. For an indicator to work correctly in a titration, its colour-change range must fall ENTIRELY within the sharp vertical part of the titration curve \u2014 otherwise the colour change will not correspond to the true equivalence point.</p>'},
{lb:'Matching indicator to titration type',dr:dQ3,ht:'<p>Strong acid + strong base: sharp jump spans roughly pH 3-11, so EITHER methyl orange (3.1-4.4) OR phenolphthalein (8.3-10.0) works. Weak acid + strong base: jump occurs only in the pH 7-11 region, so ONLY phenolphthalein works (methyl orange would change colour far too early, before equivalence). Strong acid + weak base: jump occurs only in the pH 3-7 region, so ONLY methyl orange works.</p>'},
{lb:'When no indicator works',dr:dQ3,ht:'<p>Weak acid + weak base titrations have NO sharp pH jump at all \u2014 the curve changes so gradually that no indicator can give a distinct, reliable colour change at the true equivalence point. In practice, these titrations are followed using a pH meter (potentiometric titration) or conductivity measurements instead of a coloured indicator.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'For a weak acid titrated with a strong base, the correct indicator to use is:',o:['Methyl orange only','Phenolphthalein only \u2014 its range (8.3-10.0) falls within the sharp jump above pH 7','Either indicator works equally well','No indicator is needed since the colour change is obvious without one'],a:2,w:'The sharp pH jump for weak acid + strong base occurs entirely above pH 7 (roughly pH 7-11). Methyl orange changes colour at pH 3.1-4.4, far too early (well before the true equivalence point), so only phenolphthalein (range 8.3-10.0) gives an accurate endpoint here.'},{q:'Using methyl orange (range 3.1-4.4) to titrate a weak acid with a strong base would result in:',o:['A perfectly accurate endpoint','The indicator changing colour far too early, well before the true equivalence point, giving an inaccurate (too low) titre reading','No colour change occurring at all','An identical result to using phenolphthalein'],a:2,w:'Since the sharp jump for weak acid + strong base occurs above pH 7, and methyl orange changes colour around pH 3.1-4.4 (well before this jump), the indicator would signal an endpoint far too early, giving an inaccurate, artificially low volume reading.'},{q:'Why can EITHER methyl orange or phenolphthalein be used for a strong acid + strong base titration?',o:['Because both indicators have identical colour-change ranges','Because the very sharp pH jump (roughly pH 3 to 11) comfortably includes BOTH indicators\' colour-change ranges','Because strong acid-strong base titrations do not need indicators','Because the reaction is not sensitive to pH changes'],a:2,w:'The vertical jump for strong-strong titrations is very large, spanning roughly pH 3 to pH 11. Both methyl orange (3.1-4.4) and phenolphthalein (8.3-10.0) fall within this range, so either will give an accurate result.'},{q:'For weak acid + weak base titrations, the recommended method to find the endpoint is:',o:['Any standard indicator works well','A pH meter (potentiometric titration) or conductivity measurement, since no sharp colour change occurs with an indicator','Universal indicator only','Methyl orange, specifically'],a:2,w:'Weak acid + weak base titrations lack a sharp pH jump, so no indicator gives a clean, reliable colour change at the true equivalence point. A pH meter tracking the gradual curve (or conductivity changes) is needed to locate the equivalence point accurately.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Polyprotic Acids',su:'Examine the stepwise dissociation of acids with more than one ionisable proton.',steps:[
{lb:'What is a polyprotic acid',dr:dQ4,ht:'<p>A <b>polyprotic acid</b> can donate MORE THAN ONE proton (H+) per molecule. Diprotic: H2SO4, H2CO3 (2 protons). Triprotic: H3PO4 (3 protons). Each proton is lost in a SEPARATE equilibrium step, each with its own Ka value: Ka1 (first, largest) > Ka2 (second, smaller) > Ka3 (third, smallest, if present).</p>'},
{lb:'Why successive Ka values decrease',dr:dQ4,ht:'<p>Each successive proton is HARDER to remove because it is being pulled away from an increasingly NEGATIVELY charged species (it becomes progressively more difficult to remove a positive H+ from a species that already carries more negative charge, due to increasing electrostatic attraction). This is why Ka1 >> Ka2 >> Ka3 for phosphoric acid, similar to the pattern seen in successive ionisation energies of atoms.</p>'},
{lb:'Titrating a polyprotic acid',dr:dQ4,ht:'<p>Titrating H3PO4 with NaOH produces a curve with MULTIPLE equivalence points/steps \u2014 one for each proton removed (though the 3rd step is often too weak to give a distinct jump). Each step requires the same volume of base (since each step removes exactly one mole of H+ per mole of acid), so the volumes between successive equivalence points are equal.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Phosphoric acid H3PO4 is described as triprotic because it:',o:['Has 3 oxygen atoms','Can donate 3 protons (H+ ions), one at a time in three separate equilibrium steps','Reacts with 3 different bases','Has a molecular mass of 3'],a:2,w:'Triprotic means the acid molecule contains 3 ionisable hydrogen atoms that can each be donated (as H+) in three separate, sequential dissociation equilibria, each with its own Ka value.'},{q:'For a polyprotic acid, why does Ka2 (second dissociation) have a smaller value than Ka1 (first dissociation)?',o:['The second proton is chemically identical and Ka should be the same','Removing the second proton requires pulling H+ away from a species that is already negatively charged, so it is held more strongly (harder to remove)','Ka values always decrease randomly with no chemical reason','The second dissociation does not actually occur'],a:2,w:'After the first proton is lost, the resulting ion carries a negative charge. Removing a second (positive) proton from this now negatively-charged species requires overcoming greater electrostatic attraction, making it a less favourable (weaker) equilibrium, hence a smaller Ka2.'},{q:'Titrating H2SO3 (diprotic) with NaOH would be expected to show:',o:['Only one equivalence point, since it only reacts once','Up to two equivalence points, one for each proton removed in sequence','No equivalence points at all','Three equivalence points'],a:2,w:'A diprotic acid has 2 ionisable protons, each removed in a separate step during titration with base, potentially giving 2 distinguishable equivalence points on the titration curve (though how distinct they are depends on the relative sizes of Ka1 and Ka2).'},{q:'The volume of base needed between the 1st and 2nd equivalence points of a diprotic acid titration compared to the volume needed to reach the 1st equivalence point is:',o:['Always double','Always half','The same, since each step removes exactly one mole of H+ per mole of original acid','Unrelated and unpredictable'],a:3,w:'Each dissociation step removes exactly one H+ per original acid molecule, so the same number of moles of NaOH (and hence the same volume, at constant concentration) is needed for each successive step \u2014 the volume between equivalence points is therefore equal.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Back Titration Technique',su:'Understand and apply the back titration method for insoluble or impure samples.',steps:[
{lb:'Why use back titration',dr:dQ5,ht:'<p><b>Back titration</b> is used when a direct titration is not possible \u2014 for example, when the analyte is INSOLUBLE (e.g. calcium carbonate in an antacid tablet), reacts too slowly with the titrant, or when there is no suitable indicator for a direct approach. It is common for analysing solid samples like limestone (CaCO3) purity or antacid tablets.</p>'},
{lb:'The back titration method',dr:dQ5,ht:'<p>Steps: (1) Add a KNOWN EXCESS of a standard reagent (e.g. excess standard HCl) to fully react with the sample. (2) Allow the reaction to go to completion. (3) Titrate the REMAINING (unreacted) excess reagent with a second standard solution (e.g. standard NaOH). (4) Calculate: moles of reagent that reacted with the SAMPLE = (total moles reagent added) \u2212 (moles reagent left over, found from the second titration).</p>'},
{lb:'Worked example \u2014 CaCO3 purity',dr:dQ5,ht:'<p>Example: 1.00 g impure CaCO3 + 50.0 cm3 of 0.500 mol/dm3 HCl (excess, 0.0250 mol total). Unreacted HCl titrated with NaOH requires 12.0 cm3 of 0.400 mol/dm3 NaOH = 0.0048 mol HCl remaining. HCl reacted with CaCO3 = 0.0250\u22120.0048 = 0.0202 mol. Moles CaCO3 (ratio 1:2 with HCl) = 0.0101 mol. Mass CaCO3 = 0.0101x100 = 1.01 g (checked against sample purity).</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Back titration is typically used instead of direct titration when:',o:['The analyte is a strong acid','The analyte is insoluble, reacts too slowly, or there is no suitable indicator for a direct method','Only when the sample is a gas','Whenever the concentration is very high'],a:2,w:'Back titration is the method of choice for insoluble solids (like antacid tablets or limestone), slow-reacting analytes, or situations where a direct titration cannot give a clear, reliable endpoint.'},{q:'In back titration, the moles of reagent that reacted with the sample are calculated as:',o:['Moles of reagent added only','Moles of second titrant used only','(Total moles of excess reagent added) minus (moles of reagent left unreacted, found from the second titration)','The sum of both titration volumes'],a:3,w:'Back titration works by adding a KNOWN excess, then measuring how much of that excess is LEFT OVER (via the second titration). Subtracting the leftover amount from the total added gives the amount that actually reacted with the original sample.'},{q:'0.0300 mol of excess standard acid is added to a sample. Titrating the leftover acid requires 0.0080 mol of base. How many moles of acid reacted with the sample?',o:['0.0080 mol','0.0220 mol (0.0300 \u2212 0.0080)','0.0300 mol','0.0380 mol'],a:2,w:'Moles reacted with sample = total moles added \u2212 moles left unreacted = 0.0300 \u2212 0.0080 = 0.0220 mol.'},{q:'Why is back titration suitable for finding the CaCO3 content of an antacid tablet?',o:['CaCO3 dissolves instantly and reacts completely with an indicator present','CaCO3 is insoluble in water and reacts too unpredictably for a direct titration, so excess acid is added to dissolve/react it fully, then the excess is titrated back','CaCO3 has no acid-base chemistry','Antacid tablets contain no CaCO3'],a:2,w:'CaCO3 is largely insoluble and would not dissolve cleanly for a direct titration. By adding a KNOWN excess of acid to react with (and dissolve) all the CaCO3, then titrating the leftover acid, the amount that reacted with the CaCO3 can be found indirectly and accurately.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Standardisation and Primary Standards',su:'Understand why some solutions must be standardised, and how primary standards are used.',steps:[
{lb:'Why standardisation is needed',dr:dQ6,ht:'<p>Some solutions (e.g. NaOH, HCl) cannot be prepared as an accurate standard directly by weighing, because: NaOH is HYGROSCOPIC (absorbs water from air, so its true mass of pure NaOH is uncertain) and also reacts slowly with atmospheric CO2. Concentrated HCl is VOLATILE (its exact concentration changes as HCl gas escapes). These solutions must be STANDARDISED \u2014 their exact concentration determined by titrating against a PRIMARY STANDARD.</p>'},
{lb:'Properties of a good primary standard',dr:dQ6,ht:'<p>A primary standard must be: (1) very PURE and of known composition. (2) STABLE \u2014 does not react with air, water vapour or CO2 during storage/weighing. (3) Have a reasonably HIGH molar mass (minimises the % error from weighing on a balance with fixed absolute uncertainty). (4) SOLUBLE in the solvent used. Common examples: anhydrous sodium carbonate (Na2CO3) for standardising acids; potassium hydrogen phthalate (KHP) for standardising bases.</p>'},
{lb:'The standardisation process',dr:dQ6,ht:'<p>Process: (1) Accurately weigh a sample of the primary standard. (2) Dissolve to make a standard solution of KNOWN, accurate concentration. (3) Titrate this against the solution to be standardised (e.g. NaOH) using a suitable indicator. (4) Use the titration data and the known concentration of the primary standard to calculate the EXACT concentration of the NaOH solution.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'NaOH solution cannot be used directly as a primary standard because:',o:['It is too cheap','It is hygroscopic (absorbs water from air) and reacts slowly with atmospheric CO2, so its true purity/mass when weighed is uncertain','It does not dissolve in water','It has no molar mass'],a:2,w:'Solid NaOH absorbs moisture from the air (hygroscopic) and also reacts with CO2 to form Na2CO3, meaning a weighed sample is never purely NaOH \u2014 its exact concentration when dissolved cannot be trusted without independent standardisation.'},{q:'A good primary standard should have a relatively HIGH molar mass because:',o:['High molar mass substances are always more pure','A higher molar mass means a larger mass must be weighed for a given number of moles, reducing the PERCENTAGE error from the fixed absolute uncertainty of the balance','High molar mass substances dissolve faster','It has no actual benefit, this is a myth'],a:2,w:'A balance has a small, fixed absolute uncertainty (e.g. \u00b10.001 g). If the required mass is larger (because the molar mass is higher), this fixed absolute error becomes a smaller PERCENTAGE of the total mass weighed, improving overall accuracy.'},{q:'Which of these is commonly used as a primary standard to standardise an acid solution?',o:['Concentrated HCl','Anhydrous sodium carbonate (Na2CO3) \u2014 stable, pure, known composition','NaOH pellets straight from the bottle','Tap water'],a:2,w:'Anhydrous Na2CO3 is stable in air, available in high purity, and has a well-defined composition, making it an excellent primary standard for standardising acids by titration.'},{q:'The purpose of standardising a solution is to:',o:['Make the solution more concentrated','Determine its EXACT concentration accurately, since it could not be prepared as a reliable standard by weighing alone','Remove impurities from the solution','Change its colour for titration purposes'],a:2,w:'Standardisation determines the precise concentration of a solution (like NaOH) that cannot be trusted to have an exact known concentration simply from weighing the solid, by titrating it against a reliable primary standard of known concentration.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Chem \u2022 Y12',ti:'Advanced Titration Calculations',su:'Solve multi-step titration problems including double titrations and mixture analysis.',steps:[
{lb:'Basic titration calculation recap',dr:dQ7,ht:'<p>Standard method: (1) moles of known solution = concentration x volume(dm3). (2) Use the mole ratio from the balanced equation to find moles of unknown. (3) Concentration of unknown = moles/volume(dm3) of unknown solution used. Example: 23.50 cm3 of 0.100 mol/dm3 NaOH neutralises 25.00 cm3 of HCl. Moles NaOH = 0.02350 x 0.100 = 0.00235 mol = moles HCl (1:1 ratio). Conc HCl = 0.00235/0.02500 = 0.0940 mol/dm3.</p>'},
{lb:'Analysing a mixture (e.g. Na2CO3 + NaOH)',dr:dQ7,ht:'<p>A "double indicator titration" can analyse a mixture of Na2CO3 and NaOH: titrate with HCl using PHENOLPHTHALEIN first (changes when Na2CO3 \u2192 NaHCO3 AND all NaOH is neutralised, at V1). Then add METHYL ORANGE and continue titrating the same solution (changes when NaHCO3 \u2192 H2CO3/CO2+H2O, at V2). From V1 and V2, the separate amounts of Na2CO3 and NaOH can be calculated.</p>'},
{lb:'Interpreting V1 and V2',dr:dQ7,ht:'<p>For the mixture: V2 (methyl orange stage) corresponds ONLY to the second stage of carbonate neutralisation, so moles Na2CO3 = moles HCl used in V2 (equal to V2, since NaHCO3\u2192H2CO3 needs 1 mol HCl per mol NaHCO3, which itself needed 1 mol per mol Na2CO3 in stage 1). Moles NaOH = moles HCl in (V1\u2212V2) \u2014 the acid used in stage 1 beyond what reacted with carbonate.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'25.00 cm3 of HCl is exactly neutralised by 20.00 cm3 of 0.150 mol/dm3 NaOH (1:1 ratio). What is the concentration of the HCl?',o:['0.0800 mol/dm3','0.120 mol/dm3 (moles NaOH=0.02000x0.150=0.00300 mol; conc HCl=0.00300/0.02500)','0.150 mol/dm3','0.188 mol/dm3'],a:2,w:'Moles NaOH = 0.02000 dm3 x 0.150 mol/dm3 = 0.00300 mol. Ratio 1:1, so moles HCl = 0.00300 mol. Concentration HCl = 0.00300/0.02500 = 0.120 mol/dm3.'},{q:'In a double-indicator titration of a Na2CO3/NaOH mixture, phenolphthalein changes colour at volume V1 and methyl orange at a further volume V2 (added after). The moles of Na2CO3 in the sample are found from:',o:['V1 alone','V2 alone \u2014 this corresponds specifically to the second-stage neutralisation of carbonate (NaHCO3 \u2192 H2CO3)','V1 + V2','V1 \u2212 V2'],a:2,w:'The second stage (methyl orange colour change) corresponds exactly to the conversion of NaHCO3 to H2CO3/CO2+H2O, which uses exactly 1 mole HCl per mole of original Na2CO3 \u2014 so V2 alone gives the moles of Na2CO3 present.'},{q:'In the same double-indicator titration, the moles of NaOH present are found from:',o:['V1 alone','V2 alone','(V1 \u2212 V2), representing the HCl used to neutralise NaOH beyond what reacted with the carbonate','(V1 + V2)'],a:3,w:'V1 (phenolphthalein) covers all NaOH neutralisation PLUS the first stage of carbonate conversion (Na2CO3\u2192NaHCO3). Since V2 accounts for the second carbonate stage (and by symmetry, exactly matches the first stage volume), subtracting V2 from V1 isolates the acid used solely for the NaOH.'},{q:'A back titration and a double-indicator titration are similar in that both:',o:['Always use the same indicator','Involve using volume/concentration relationships across TWO titration measurements to solve for an unknown that cannot be found from one direct titration alone','Are only used for gases','Require no calculations'],a:2,w:'Both techniques rely on combining data from two separate titration steps (or two indicator endpoints within one titration) to mathematically deduce quantities that a single, direct titration could not determine on its own.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Acids, Bases and Titrations',su:'Integrated revision of titration curves, indicators and advanced calculations.',steps:[
{lb:'Titration curve summary',dr:dQ8,ht:'<p>Strong-strong: equivalence pH 7, either indicator. Weak acid-strong base: equivalence >7, phenolphthalein only, has a buffer region. Strong acid-weak base: equivalence <7, methyl orange only. Weak-weak: no sharp jump, no indicator suitable. Half-equivalence point of a weak acid curve: pH = pKa.</p>'},
{lb:'Calculation strategy summary',dr:dQ8,ht:'<p>All titration calculations follow: moles known = C x V(dm3) \u2192 use mole ratio \u2192 moles unknown \u2192 concentration or mass of unknown. Back titrations and double-indicator titrations both require TWO measurements combined (by addition or subtraction) to isolate the unknown quantity that cannot be found by one direct titration.</p>'},
{lb:'Common WAEC mistakes',dr:dQ8,ht:'<p>Avoid: forgetting to convert cm3 to dm3 before calculating concentration. Choosing the wrong indicator for a weak acid/base titration (always check which side of pH 7 the equivalence point lies). Forgetting that back titration requires subtracting the leftover amount, not just using the total added. Confusing the equivalence point (moles acid=moles base) with the half-equivalence point (pH=pKa) \u2014 these are different points on the curve.</p>'},
{lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Which titration type has its equivalence point BELOW pH 7?',o:['Strong acid + strong base','Weak acid + strong base','Strong acid + weak base \u2014 forms a mildly acidic salt','Weak acid + weak base'],a:3,w:'Strong acid + weak base forms a salt whose cation (conjugate acid of the weak base, e.g. NH4+) hydrolyses water to release H+, making the solution slightly acidic at equivalence, so pH < 7 there.'},{q:'25.0 cm3 of a monoprotic acid requires 15.0 cm3 of 0.200 mol/dm3 NaOH to reach equivalence (1:1 ratio). What is the acid concentration?',o:['0.060 mol/dm3','0.120 mol/dm3 (moles NaOH=0.0150x0.200=0.00300; conc=0.00300/0.0250)','0.200 mol/dm3','0.333 mol/dm3'],a:2,w:'Moles NaOH = 0.0150 x 0.200 = 0.00300 mol. Ratio 1:1 means moles acid = 0.00300 mol. Concentration = 0.00300/0.0250 = 0.120 mol/dm3.'},{q:'The half-equivalence point of a titration curve is useful because it allows direct determination of:',o:['The concentration of the base only','The pKa of a weak acid (pH at half-equivalence = pKa)','The total volume of the flask','The colour of the indicator used'],a:2,w:'At half-equivalence, [HA]=[A-], so by the Henderson-Hasselbalch equation pH=pKa+log(1)=pKa. Reading the pH at this specific volume directly gives the pKa of the weak acid being titrated.'},{q:'In a back titration to find the purity of a CaCO3 sample, if you forget to subtract the leftover acid and instead use the TOTAL acid added, your calculated CaCO3 content would be:',o:['Correct regardless','Too LOW, since not all the added acid reacted with the sample','Too HIGH, since you would incorrectly assume all the added acid reacted with the CaCO3, overestimating the amount that reacted','Unaffected by this error'],a:3,w:'If you use the TOTAL acid added (ignoring the leftover, unreacted portion measured in the second titration), you would incorrectly attribute ALL of that acid to reacting with the sample, overestimating the moles of CaCO3 present and giving a falsely HIGH result.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];

// Keep each question's real number in the sidebar when only some are shown
if(window.abcQuestionNumbers){var _renderAll=render;render=function(){_renderAll.apply(this,arguments);var n=window.abcQuestionNumbers;document.querySelectorAll('#sb .qn').forEach(function(el,i){if(n[i])el.textContent='Q'+n[i];});};}
