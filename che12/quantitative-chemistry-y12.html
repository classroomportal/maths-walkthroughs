<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Molar Volume of Gases at RTP and STP',[['Condition','Temp/Pressure','Molar volume'],['RTP','25\u00b0C, 1 atm (100kPa)','24 dm3/mol'],['STP','0\u00b0C, 1 atm (101.3kPa)','22.4 dm3/mol']]);}
function dQ2(p){drawTable(p,'Ideal Gas Equation PV = nRT',[['Symbol','Quantity','Unit'],['P','Pressure','Pa'],['V','Volume','m3'],['n','Moles','mol'],['R','Gas constant','8.314 J/mol/K'],['T','Temperature','K']]);}
function dQ3(p){drawTable(p,'Combustion Data \u2192 Empirical Formula (Example)',[['Element','Mass (g)','Moles','Ratio'],['C','2.40','0.200','2'],['H','0.60','0.600','6'],['O','3.20','0.200','2']]);}
function dQ4(p){drawTable(p,'Dilution and Standard Solution Steps',[['Step','Action'],['1','Weigh solid accurately'],['2','Dissolve in small volume'],['3','Transfer to volumetric flask'],['4','Make up to graduation mark'],['5','Invert to mix thoroughly']]);}
function dQ5(p){drawTable(p,'Percentage Yield and Atom Economy',[['Term','Formula'],['% Yield','(actual mass / theoretical mass) x 100'],['Atom economy','(Mr of desired product / sum Mr of all products) x 100']]);}
function dQ6(p){drawTable(p,'Limiting Reagent Method',[['Step','Action'],['1','Calculate moles of each reactant'],['2','Divide by stoichiometric coefficient'],['3','Smallest value = limiting reagent'],['4','Use limiting reagent moles for product calc']]);}
function dQ7(p){drawTable(p,'Gas Stoichiometry \u2014 Reacting Volumes',[['Reaction','Volume ratio'],['N2 + 3H2 \u2192 2NH3','1 : 3 : 2'],['2H2 + O2 \u2192 2H2O(g)','2 : 1 : 2'],['CH4 + 2O2 \u2192 CO2 + 2H2O(g)','1 : 2 : 1 : 2']]);}
function dQ8(p){drawTable(p,'WAEC Quantitative Chemistry Summary',[['Concept','Key formula'],['Moles','mass/Mr or volume/molar volume'],['Concentration','moles/volume(dm3)'],['Gas volume','n x 24 (RTP) or n x 22.4 (STP)'],['Ideal gas','PV = nRT']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Molar Volume and Gas Calculations',su:'Use molar volume to convert between moles, mass and gas volume.',steps:[
{lb:'Avogadro\'s Law and molar volume',dr:dQ1,ht:'<p><b>Avogadro\'s Law</b>: equal volumes of all gases, at the same temperature and pressure, contain equal numbers of moles (molecules). This means ANY gas occupies the same molar volume under given conditions, regardless of identity. At RTP (25\u00b0C, 1 atm): 1 mole of any gas occupies 24 dm3 (24000 cm3). At STP (0\u00b0C, 1 atm): 1 mole occupies 22.4 dm3.</p>'},
{lb:'Converting moles to gas volume',dr:dQ1,ht:'<p>Volume of gas (dm3) = moles x molar volume. Example: moles of CO2 = mass/Mr = 8.8/44 = 0.20 mol. Volume at RTP = 0.20 x 24 = 4.8 dm3. Conversely: moles = volume(dm3) / molar volume. Example: 6.0 dm3 of O2 at RTP = 6.0/24 = 0.25 mol; mass = 0.25 x 32 = 8.0 g.</p>'},
{lb:'Gas volume in reacting equations',dr:dQ1,ht:'<p>Example: CaCO3 + 2HCl \u2192 CaCl2 + H2O + CO2. What volume of CO2 (at RTP) is produced from 5.0 g CaCO3 (Mr=100)? Moles CaCO3 = 5.0/100 = 0.050 mol. Mole ratio CaCO3:CO2 = 1:1, so moles CO2 = 0.050 mol. Volume CO2 = 0.050 x 24 = 1.2 dm3.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'What volume (dm3) does 0.50 mol of nitrogen gas occupy at RTP (24 dm3/mol)?',o:['6.0 dm3','12 dm3 (0.50 x 24)','24 dm3','48 dm3'],a:2,w:'Volume = moles x molar volume = 0.50 x 24 = 12 dm3. Molar volume applies to ANY gas at the same conditions (Avogadro\'s Law), so identity of the gas does not matter.'},{q:'How many moles are in 4.8 dm3 of oxygen gas at RTP?',o:['0.10 mol','0.20 mol (4.8/24)','0.50 mol','1.2 mol'],a:2,w:'Moles = volume/molar volume = 4.8/24 = 0.20 mol. This applies regardless of which gas it is, as long as conditions are RTP (24 dm3/mol).'},{q:'CaCO3 + 2HCl \u2192 CaCl2 + H2O + CO2. What volume of CO2 (RTP) forms from 2.5 g CaCO3 (Mr=100)?',o:['0.60 dm3 (0.025 mol x 24)','1.2 dm3','2.4 dm3','6.0 dm3'],a:1,w:'Moles CaCO3 = 2.5/100 = 0.025 mol. Ratio CaCO3:CO2 = 1:1, so moles CO2 = 0.025 mol. Volume = 0.025 x 24 = 0.60 dm3.'},{q:'Avogadro\'s Law states that equal volumes of gases at the same temperature and pressure contain:',o:['Equal masses','Equal numbers of moles (molecules), regardless of the gas identity','Equal densities','Equal numbers of atoms only for elements'],a:2,w:'Avogadro\'s Law: at the same T and P, equal volumes of ANY gas contain the same number of moles. This is why a single molar volume value (24 dm3/mol at RTP) applies to all gases.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'The Ideal Gas Equation',su:'Apply PV = nRT to calculate pressure, volume, moles or temperature of a gas.',steps:[
{lb:'The ideal gas equation',dr:dQ2,ht:'<p><b>PV = nRT</b>, where P = pressure (Pa), V = volume (m3), n = moles, R = 8.314 J/mol/K (gas constant), T = temperature (KELVIN, not Celsius \u2014 always add 273 to Celsius). This equation applies at ANY temperature and pressure (unlike the fixed molar volume, which only applies at RTP/STP), making it more versatile for non-standard conditions.</p>'},
{lb:'Unit conversions before using PV=nRT',dr:dQ2,ht:'<p>Critical unit conversions: Volume must be in m3 (1 dm3 = 1x10-3 m3; 1 cm3 = 1x10-6 m3). Pressure must be in Pa (1 atm = 101325 Pa; 1 kPa = 1000 Pa). Temperature must be in Kelvin (K = \u00b0C + 273). Forgetting these conversions is the single most common error in ideal gas calculations \u2014 always convert BEFORE substituting into the equation.</p>'},
{lb:'Worked example',dr:dQ2,ht:'<p>Find the volume of 0.100 mol of gas at 127\u00b0C and 200 kPa. T = 127+273 = 400 K. P = 200,000 Pa. Rearrange: V = nRT/P = (0.100 x 8.314 x 400)/200000 = 332.6/200000 = 1.66x10-3 m3 = 1.66 dm3. Always check your final units make sense (dm3 is a sensible gas volume at these conditions).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'In the ideal gas equation PV=nRT, temperature T must be measured in:',o:['Degrees Celsius','Kelvin (K = \u00b0C + 273)','Degrees Fahrenheit','Any temperature scale, it does not matter'],a:2,w:'The ideal gas equation requires ABSOLUTE temperature in Kelvin. Using Celsius directly gives incorrect (often negative or wildly wrong) results because Celsius has an arbitrary zero point, not absolute zero.'},{q:'Find the moles of gas in a 2.0 dm3 (2.0x10-3 m3) container at 300 K and 150 kPa (R=8.314).',o:['0.060 mol','0.12 mol (n=PV/RT = 150000x0.002/(8.314x300))','0.50 mol','1.2 mol'],a:2,w:'n = PV/RT = (150000 x 0.0020)/(8.314 x 300) = 300/2494.2 = 0.120 mol. Remember pressure in Pa, volume in m3, temperature in K.'},{q:'A student forgets to convert dm3 to m3 before using PV=nRT. This will make their calculated value of n:',o:['Correct anyway, since units cancel','1000 times too large, since 1 dm3 = 1x10-3 m3','1000 times too small','Unaffected, volume units do not matter'],a:2,w:'1 dm3 = 1x10-3 m3. If a student uses the dm3 value directly without converting, their volume is 1000x too large, so their calculated moles (n=PV/RT) would also be 1000x too large.'},{q:'The value of the gas constant R used in PV=nRT (SI units) is:',o:['8.314 J/mol/K','96500 C/mol','6.02x10^23 /mol','22.4 dm3/mol'],a:1,w:'R = 8.314 J K-1 mol-1 is the universal gas constant used in SI units for the ideal gas equation. (96500 is the Faraday constant; 6.02x10^23 is Avogadro\'s constant; 22.4 dm3/mol is the molar volume at STP, a consequence of the gas equation at specific conditions, not R itself.)'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Empirical and Molecular Formula from Combustion Data',su:'Determine empirical and molecular formulae from experimental combustion analysis.',steps:[
{lb:'Combustion analysis principle',dr:dQ3,ht:'<p>Combustion analysis burns an organic compound completely in excess oxygen; all carbon becomes CO2 and all hydrogen becomes H2O. Mass of C = mass of CO2 x (12/44). Mass of H = mass of H2O x (2/18). Mass of O (if present) = total sample mass \u2212 mass C \u2212 mass H (found by difference, since O does not form a separate simple product).</p>'},
{lb:'Finding the empirical formula',dr:dQ3,ht:'<p>Steps: (1) Find mass of each element. (2) Convert to moles (mass/Ar). (3) Divide all mole values by the smallest one to get simplest whole-number ratio. Example: 2.40 g C, 0.60 g H, 3.20 g O \u2192 moles: C=0.200, H=0.600, O=0.200. Divide by smallest (0.200): C=1, H=3, O=1 \u2192 empirical formula CH3O.</p>'},
{lb:'From empirical to molecular formula',dr:dQ3,ht:'<p>Molecular formula = (empirical formula)n, where n = Mr(molecular)/Mr(empirical). Example: empirical formula CH3O has Mr = 12+3+16 = 31. If the molecular mass (from mass spectrometry) is 62, then n = 62/31 = 2, so molecular formula = C2H6O2 (which is ethane-1,2-diol / ethylene glycol).</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'A hydrocarbon contains 0.30 mol C and 0.60 mol H per sample. What is its empirical formula?',o:['C2H','CH2 (ratio 0.30:0.60 = 1:2)','C3H6','CH4'],a:2,w:'Divide both by the smaller value (0.30): C = 0.30/0.30 = 1, H = 0.60/0.30 = 2. Empirical formula = CH2 (whole-number ratio 1:2).'},{q:'In combustion analysis, mass of carbon in the original sample is calculated from the mass of CO2 produced using the ratio:',o:['12/44 (Ar of C / Mr of CO2)','44/12','18/2','2/18'],a:1,w:'CO2 has Mr = 44, of which the carbon atom contributes Ar = 12. So mass of C in the sample = mass of CO2 produced x (12/44), since every mole of CO2 came from exactly one mole of carbon in the original compound.'},{q:'A compound has empirical formula CH2O (Mr=30) and a molecular mass of 180. Its molecular formula is:',o:['CH2O','C2H4O2','C6H12O6 (n=180/30=6)','C3H6O3'],a:3,w:'n = molecular Mr / empirical Mr = 180/30 = 6. Molecular formula = (CH2O)6 = C6H12O6, which is the formula for glucose.'},{q:'Why is the mass of oxygen in a combustion sample usually found "by difference" rather than measured directly?',o:['Oxygen cannot be weighed','Oxygen does not form a separate simple combustion product that can be isolated and measured, unlike C (as CO2) and H (as H2O)','Oxygen is never present in organic compounds','Difference method is just easier, not necessary'],a:2,w:'Unlike carbon and hydrogen, which convert cleanly into CO2 and H2O that can be captured and weighed, any oxygen originally in the compound simply becomes part of the CO2/H2O produced and cannot be isolated separately \u2014 so its mass is found by subtracting (mass C + mass H) from the total sample mass.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Volumetric Analysis \u2014 Standard Solutions and Dilutions',su:'Prepare standard solutions and perform dilution calculations accurately.',steps:[
{lb:'Preparing a standard solution',dr:dQ4,ht:'<p>A <b>standard solution</b> has an accurately known concentration. Preparation: (1) accurately weigh the solid on a balance. (2) Dissolve in a small volume of solvent in a beaker (stirring). (3) Transfer QUANTITATIVELY (rinsing the beaker) into a volumetric flask. (4) Make up to the graduation mark with solvent, using a dropper for the final few drops (read from the bottom of the meniscus). (5) Stopper and invert several times to ensure thorough mixing.</p>'},
{lb:'Dilution calculations',dr:dQ4,ht:'<p>Dilution formula: C1V1 = C2V2 (moles before = moles after, since diluting does not change the total moles of solute, only the volume). Example: dilute 25.0 cm3 of 2.00 mol/dm3 HCl to make a new concentration in a 250 cm3 flask. C2 = C1V1/V2 = (2.00 x 25.0)/250 = 0.200 mol/dm3.</p>'},
{lb:'Concentration units and conversions',dr:dQ4,ht:'<p>Concentration (mol/dm3) = moles/volume(dm3). Remember: 1 dm3 = 1000 cm3, so volume in cm3 must be divided by 1000 to convert to dm3 before use. Concentration can also be expressed in g/dm3: concentration(g/dm3) = concentration(mol/dm3) x Mr. Always double-check which unit a question requires before giving a final answer.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'25.0 cm3 of 1.00 mol/dm3 NaOH is diluted to 500 cm3. What is the new concentration?',o:['0.0125 mol/dm3','0.050 mol/dm3 (C2=1.00x25.0/500)','0.500 mol/dm3','5.00 mol/dm3'],a:2,w:'C1V1=C2V2: C2 = (1.00 x 25.0)/500 = 25.0/500 = 0.050 mol/dm3. Moles of NaOH stay the same; only the volume (and hence concentration) changes.'},{q:'When preparing a standard solution, after dissolving the solid in a beaker, the solution must be:',o:['Poured directly down the sink','Quantitatively transferred (with rinsings) into a volumetric flask and made up to the mark','Left in the beaker permanently','Heated to evaporate excess water'],a:2,w:'To ensure NO solute is lost (which would make the concentration inaccurate), the solution and all rinsings from the beaker must be transferred into the volumetric flask, which is then made up accurately to the graduation mark.'},{q:'A solution contains 4.00 g of NaOH (Mr=40) dissolved in 250 cm3 of solution. Its concentration in mol/dm3 is:',o:['0.10 mol/dm3','0.40 mol/dm3 (moles=4.00/40=0.10; conc=0.10/0.25=0.40)','1.0 mol/dm3','4.0 mol/dm3'],a:2,w:'Moles NaOH = mass/Mr = 4.00/40 = 0.10 mol. Volume = 250 cm3 = 0.250 dm3. Concentration = moles/volume = 0.10/0.250 = 0.40 mol/dm3.'},{q:'The dilution equation C1V1=C2V2 works because dilution:',o:['Increases the total number of moles of solute','Does not change the total number of moles of solute, only the volume (and hence concentration)','Decreases the total number of moles of solute','Changes the identity of the solute'],a:2,w:'Diluting a solution only adds solvent (usually water) \u2014 the amount (moles) of solute stays exactly the same. Since concentration = moles/volume, and moles is constant, C1V1 (moles before) must equal C2V2 (moles after).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Percentage Yield and Atom Economy',su:'Calculate percentage yield and atom economy, and evaluate industrial efficiency.',steps:[
{lb:'Percentage yield',dr:dQ5,ht:'<p><b>Theoretical yield</b> = the maximum mass of product predicted by stoichiometry (assuming the reaction goes to completion with no losses). <b>Actual yield</b> = the mass actually obtained in practice (always less, due to incomplete reactions, side reactions, and losses during transfer/purification). <b>% yield</b> = (actual yield / theoretical yield) x 100.</p>'},
{lb:'Reasons for yield less than 100%',dr:dQ5,ht:'<p>Common reasons: (1) the reaction may be reversible/does not go to completion. (2) Side reactions produce unwanted by-products. (3) Loss of product during filtration, transfer, or purification (recrystallisation). (4) Impure starting materials. (5) Practical/human error (spillage, incomplete separation). WAEC often asks you to suggest reasons for low yield in a practical context.</p>'},
{lb:'Atom economy',dr:dQ5,ht:'<p><b>Atom economy</b> = (Mr of desired product / sum of Mr of ALL products) x 100 \u2014 measures how much of the reactant mass ends up in the useful product versus wasted as by-products. High atom economy = more sustainable, less waste, generally cheaper and more environmentally friendly. Addition reactions (e.g. polymerisation) have 100% atom economy (no by-products); many other reactions have lower atom economy.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'A reaction has a theoretical yield of 12.0 g but the actual yield obtained is 9.0 g. The percentage yield is:',o:['33%','75% (9.0/12.0 x 100)','90%','133%'],a:2,w:'% yield = (actual/theoretical) x 100 = (9.0/12.0) x 100 = 75%.'},{q:'Which of these is NOT a typical reason for percentage yield being less than 100%?',o:['The reaction being reversible and not going to completion','Loss of product during filtration or purification','Side reactions producing by-products','The product having a higher Mr than the reactant'],a:4,w:'The Mr of the product is irrelevant to yield loss \u2014 percentage yield compares ACTUAL mass obtained to the THEORETICAL mass predicted by the equation, both of which already account for Mr in the calculation. The other three options are genuine causes of yield loss.'},{q:'Atom economy is important industrially because:',o:['It measures the cost of raw materials only','A high atom economy means less of the reactant mass is wasted as by-products, which is more sustainable and often cheaper','It has no practical significance','It only applies to organic reactions'],a:2,w:'High atom economy means most of the reactant atoms end up in the desired product rather than being wasted in by-products, reducing raw material costs, waste disposal costs, and environmental impact \u2014 an important green chemistry principle.'},{q:'An addition polymerisation reaction (e.g. ethene \u2192 poly(ethene)) has an atom economy of:',o:['0%, no useful product forms','50%, half the atoms are wasted','100%, since ALL the reactant atoms end up in the single polymer product with no by-products','Cannot be determined without further data'],a:3,w:'Addition reactions (like polymerisation) produce only ONE product with no by-products \u2014 all atoms in the monomer end up in the polymer, giving 100% atom economy, which is one reason addition polymerisation is considered relatively resource-efficient.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Limiting Reagent Calculations (Advanced)',su:'Identify the limiting reagent and calculate the mass of product formed.',steps:[
{lb:'Why limiting reagents matter',dr:dQ6,ht:'<p>In most real reactions, reactants are NOT mixed in exact stoichiometric ratio. The <b>limiting reagent</b> is used up first and determines the maximum amount of product that CAN form; the other reactant is in EXCESS and some remains unreacted. Product calculations must always be based on the limiting reagent, not the excess reagent.</p>'},
{lb:'Method to find the limiting reagent',dr:dQ6,ht:'<p>Steps: (1) Calculate moles of EACH reactant available. (2) Divide each by its own stoichiometric coefficient in the balanced equation. (3) The reactant giving the SMALLEST value is the limiting reagent. Example: N2 + 3H2 \u2192 2NH3. Given 2.0 mol N2 and 3.0 mol H2: N2: 2.0/1=2.0. H2: 3.0/3=1.0. Smaller value (1.0) \u2192 H2 is limiting.</p>'},
{lb:'Worked example',dr:dQ6,ht:'<p>Continuing: H2 is limiting (3.0 mol available). Ratio H2:NH3 = 3:2, so moles NH3 = 3.0 x (2/3) = 2.0 mol. Mass NH3 = 2.0 x 17 = 34 g. Note that N2 is in excess: only (1.0/3 x 3=1.0 mol N2 used, since H2:N2=3:1) so 2.0\u22121.0=1.0 mol N2 remains unreacted.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'For 2Mg + O2 \u2192 2MgO, given 4.0 mol Mg and 1.5 mol O2, which is the limiting reagent?',o:['Mg (4.0/2=2.0 vs O2 1.5/1=1.5, so O2 has the smaller value and is limiting)','O2, since there is less of it in absolute terms is not the deciding factor here \u2014 recompute','Neither, they are both used up exactly','Cannot be determined without masses'],a:1,w:'Divide by coefficients: Mg: 4.0/2=2.0. O2: 1.5/1=1.5. The SMALLER value (1.5, for O2) identifies O2 as the limiting reagent \u2014 it will run out first even though there is more Mg present.'},{q:'In the limiting reagent method, after calculating moles of each reactant, you should:',o:['Simply compare the raw mole values without adjustment','Divide each mole value by its own stoichiometric coefficient before comparing','Multiply each mole value by its Mr','Add the mole values together'],a:2,w:'Raw mole values alone can be misleading if the stoichiometric ratio is not 1:1. Dividing by the coefficient normalises each reactant\'s "available portions" of the reaction, allowing a fair comparison to find which one is limiting.'},{q:'For N2+3H2\u21922NH3, with 1.0 mol N2 and 4.0 mol H2, what is the maximum moles of NH3 that can form?',o:['1.0 mol','2.0 mol (N2 limiting: 1.0/1=1.0 < H2 4.0/3=1.33; ratio N2:NH3=1:2)','2.67 mol','4.0 mol'],a:2,w:'N2: 1.0/1=1.0. H2: 4.0/3=1.33. Smaller value \u2192 N2 is limiting. Ratio N2:NH3 = 1:2, so moles NH3 = 1.0 x 2 = 2.0 mol.'},{q:'Once the limiting reagent is identified, calculations for the mass/moles of product should be based on:',o:['The reagent in excess','The limiting reagent only, since it determines the maximum possible amount of product','The average of both reagents','Whichever reagent has the larger Mr'],a:2,w:'The limiting reagent runs out first and therefore caps the maximum amount of product that can form \u2014 all product yield calculations must be based on the moles of the LIMITING reagent, using the correct mole ratio from the balanced equation.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Chem \u2022 Y12',ti:'Gas Stoichiometry \u2014 Reacting Volumes',su:'Use Avogadro\'s Law to relate reacting gas volumes directly, without converting to moles.',steps:[
{lb:'Gay-Lussac\'s Law of combining volumes',dr:dQ7,ht:'<p>Because equal volumes of gas (at the same T and P) contain equal moles (Avogadro\'s Law), the RATIO of reacting gas VOLUMES is the same as the ratio of moles in the balanced equation \u2014 you can substitute volume directly for moles when ALL substances are gases at the same conditions, skipping the mole conversion step entirely.</p>'},
{lb:'Worked example \u2014 Haber process',dr:dQ7,ht:'<p>N2(g) + 3H2(g) \u2192 2NH3(g). If 40 cm3 of N2 reacts completely, what volume of H2 is needed and what volume of NH3 forms (same T, P)? Ratio N2:H2:NH3 = 1:3:2. H2 needed = 40 x 3 = 120 cm3. NH3 formed = 40 x 2 = 80 cm3. No mole or mass calculation needed \u2014 volumes are used directly.</p>'},
{lb:'When this shortcut does NOT apply',dr:dQ7,ht:'<p>This volume-ratio shortcut ONLY works when comparing GAS volumes to GAS volumes at the SAME temperature and pressure. It does NOT apply to solids, liquids, or aqueous solutions in the same equation \u2014 those still require the standard moles = mass/Mr (or moles = concentration x volume) approach.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'For CH4(g)+2O2(g)\u2192CO2(g)+2H2O(g), what volume of O2 is needed to completely react with 50 cm3 of CH4 (same T,P)?',o:['25 cm3','50 cm3','100 cm3 (50 x 2)','200 cm3'],a:3,w:'Volume ratio CH4:O2 = 1:2 (from the balanced equation coefficients). Volume O2 = 50 x 2 = 100 cm3, applying Avogadro\'s Law directly to gas volumes at the same T and P.'},{q:'The gas volume-ratio shortcut (using coefficients directly as volume ratios) is valid because:',o:['All gases have the same density','Equal volumes of gas at the same T and P contain equal numbers of moles (Avogadro\'s Law), so volume ratios equal mole ratios','Gases always react in a 1:1 ratio','This shortcut works for all states of matter, not just gases'],a:2,w:'Avogadro\'s Law states equal volumes of gas at the same T and P contain equal moles. Since the mole ratio in a balanced equation equals the coefficient ratio, the same ratio applies directly to gas VOLUMES, avoiding the need to convert to moles first.'},{q:'2H2(g)+O2(g)\u21922H2O(g). If 30 cm3 of H2 reacts, what volume of H2O(g) forms (same conditions)?',o:['15 cm3','30 cm3 (ratio H2:H2O = 2:2 = 1:1)','45 cm3','60 cm3'],a:2,w:'Ratio H2:H2O = 2:2, which simplifies to 1:1. So volume H2O formed = volume H2 reacted = 30 cm3.'},{q:'The gas volume-ratio shortcut CANNOT be used directly when:',o:['Comparing two gas volumes at the same temperature and pressure','One of the substances in the equation is a solid, liquid, or aqueous solution','The reaction only involves gases','The coefficients in the equation are all equal to 1'],a:2,w:'The shortcut relies on Avogadro\'s Law, which applies only to GASES under the same conditions. If a solid, liquid, or dissolved substance is involved, its "volume" is not proportional to moles in the same way, so standard mole calculations (mass/Mr, or concentration x volume) must be used instead.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Quantitative Chemistry',su:'Integrated revision of moles, gas laws, and quantitative calculations.',steps:[
{lb:'Core formulae summary',dr:dQ8,ht:'<p>Moles = mass/Mr = volume(dm3)/molar volume (gas) = concentration x volume(dm3) (solution). Molar volume: 24 dm3/mol at RTP, 22.4 dm3/mol at STP. Ideal gas: PV=nRT (P in Pa, V in m3, T in K, R=8.314). % yield = (actual/theoretical) x 100. Atom economy = (Mr desired product/sum Mr all products) x 100. Dilution: C1V1=C2V2.</p>'},
{lb:'Problem-solving strategy',dr:dQ8,ht:'<p>WAEC quantitative questions strategy: (1) Write the balanced equation FIRST. (2) Convert all given data to MOLES. (3) Use the mole ratio from the equation to find moles of the unknown. (4) Convert moles to the requested unit (mass, volume, concentration). (5) Always check units and give the answer to an appropriate number of significant figures matching the data given.</p>'},
{lb:'Common WAEC mistakes',dr:dQ8,ht:'<p>Avoid: forgetting to convert temperature to Kelvin in PV=nRT. Forgetting to convert cm3 to dm3 (divide by 1000) before using concentration = moles/volume. Using the wrong molar volume (22.4 vs 24 dm3/mol \u2014 check whether STP or RTP is specified). Not identifying the limiting reagent before calculating product mass. Confusing % yield (practical vs theoretical) with atom economy (product Mr vs total product Mr).</p>'},
{lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'A student calculates moles of gas using volume in cm3 directly with the RTP molar volume (24 dm3/mol) without converting units. Their answer will be:',o:['Correct as it stands','1000 times too large, since they should have divided the cm3 value by 1000 to get dm3 first','1000 times too small','Unaffected by the unit error'],a:2,w:'24 dm3/mol requires volume in dm3. If cm3 is used directly (without dividing by 1000), the "volume" value used is 1000x too large, making the calculated moles 1000x too large.'},{q:'Which formula correctly relates percentage yield to atom economy?',o:['They are the same thing and always give identical values','% yield compares ACTUAL to THEORETICAL mass of ONE product; atom economy compares the desired product\'s Mr to the total Mr of ALL products predicted by the equation \u2014 they measure different things','Atom economy is always higher than % yield','% yield only applies to gases'],a:2,w:'% yield measures how much of the theoretically possible product was actually obtained in practice (practical efficiency). Atom economy measures, from the equation alone, what fraction of reactant atoms end up in the useful product versus by-products (theoretical efficiency/sustainability) \u2014 these are distinct concepts.'},{q:'For a limiting reagent problem, the first essential step is to:',o:['Guess which reagent is limiting from the larger mass given','Write and balance the chemical equation, then convert all given masses/volumes to moles','Calculate percentage yield immediately','Skip straight to calculating the mass of product'],a:2,w:'You cannot correctly identify the limiting reagent or calculate products without first having a BALANCED equation and moles of each reactant \u2014 skipping this step is the most common source of error in limiting reagent problems.'},{q:'A gas sample occupies 500 cm3 at 27\u00b0C and 100 kPa. Using PV=nRT, before substituting values you must convert:',o:['Nothing, the values can be used as given','500 cm3 to 5.0x10-4 m3 and 27\u00b0C to 300 K','Only the temperature, volume units do not matter','Only the volume, temperature units do not matter'],a:2,w:'PV=nRT requires SI units throughout: volume in m3 (500 cm3 = 500x10-6 m3 = 5.0x10-4 m3) and temperature in Kelvin (27+273=300 K). Pressure in kPa should also be converted to Pa (100 kPa = 100000 Pa).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
