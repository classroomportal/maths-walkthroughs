body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}

.qb:hover{border-color:var(--red);color:var(--red);}

.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}

.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 280');
o.push(T(240,18,'Atomic Structure — Sub-atomic Particles',ACC,12,'middle',true));
var rows=[['Particle','Relative mass','Relative charge','Location'],['Proton','1','+ 1','Nucleus'],['Neutron','1','0','Nucleus'],['Electron','1/1836 ≈ 0','−1','Shells/orbitals']];
rows.forEach(function(r,i){if(i<=p){o.push(R(10,22+i*40,460,34,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(70,42+i*40,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(185,42+i*40,r[1],'#444',8,'middle',false));o.push(T(295,42+i*40,r[2],'#444',8,'middle',false));o.push(T(400,42+i*40,r[3],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,18,'Electron Configuration — Aufbau Filling Order',ACC,11,'middle',true));
var orbs=['1s','2s','2p','3s','3p','3d','4s','4p','4d','4f'];
var maxe=[2,2,6,2,6,10,2,6,10,14];
var cum=0; var shown=0;
orbs.forEach(function(ob,i){if(i<p+1){
  var col=i%5; var row=Math.floor(i/5);
  var x=48+col*90; var y=50+row*90;
  o.push(R(x-38,y-28,76,56,CRM,LINE,1.5));
  o.push(T(x,y-10,ob,ACC,11,'middle',true));
  o.push(T(x,y+12,'max: '+maxe[i],'#555',9,'middle',false));
}});
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,18,'Types of Chemical Bonding',ACC,12,'middle',true));
var rows=[['Bond type','Between','Example'],['Ionic','Metal + non-metal (electron transfer)','NaCl, MgO, CaCl₂'],['Covalent','Non-metal + non-metal (electron sharing)','H₂O, CO₂, CH₄'],['Metallic','Metal atoms (delocalised electrons)','Fe, Cu, Na'],['Dative/coordinate','One atom donates both electrons','NH₄⁺, H₃O⁺'],['Hydrogen','X−H···Y (X,Y = N,O,F)','Water, DNA base pairs'],['van der Waals','Temporary dipoles between molecules','Noble gases, CH₄']];
rows.forEach(function(r,i){if(i<=p){o.push(R(10,18+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(75,36+i*36,r[0],i===0?'white':ACC,8,'middle',i===0));o.push(T(245,36+i*36,r[1],'#444',7,'middle',false));o.push(T(415,36+i*36,r[2],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ4(p){dQ1(p);}
function dQ5(p){dQ3(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ3(p);}
function dQ8(p){dQ1(p);}
function dQ9(p){dQ3(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,18,'Atomic Structure & Bonding — Summary',ACC,12,'middle',true));
var rows=[['Atomic number Z','Number of protons; defines the element'],['Mass number A','Protons + neutrons; A = Z + N'],['Isotopes','Same Z, different A; same element, different neutron count'],['Ionic bond','Electron transfer; oppositely charged ions; giant lattice'],['Covalent bond','Shared electron pair; can be single, double or triple'],['Electronegativity','Measure of electron-attracting power; increases across period'],['Hydrogen bond','Strong dipole-dipole; explains H₂O anomalous properties']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*28,460,22,CRM,LINE,1));o.push(T(120,50+i*28,r[0],ACC,8,'middle',true));o.push(T(320,50+i*28,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Sub-atomic Particles and Atomic Number',su:'Define atomic number, mass number and isotopes.',steps:[
{lb:'Sub-atomic particles',dr:dQ1,ht:'<p>Atoms consist of three sub-atomic particles: <b>Protons</b> (relative mass 1, charge +1, in nucleus), <b>Neutrons</b> (relative mass 1, charge 0, in nucleus) and <b>Electrons</b> (relative mass ≈0, charge −1, in orbitals around nucleus). The <b>atomic number Z</b> = number of protons (defines the element). The <b>mass number A</b> = protons + neutrons. Number of neutrons N = A − Z. In a neutral atom, number of electrons = number of protons = Z.</p>'},
{lb:'Isotopes',dr:dQ1,ht:'<p><b>Isotopes</b> are atoms of the same element (same Z) with different mass numbers (different number of neutrons). Examples: Carbon-12 (⁶¹²C: 6p, 6n) and Carbon-14 (⁶¹⁴C: 6p, 8n). Chlorine exists as ³⁵Cl (75%) and ³⁷Cl (25%); relative atomic mass Ar = (75×35 + 25×37)/100 = 35.5. Isotopes have identical chemical properties (same electronic structure) but different physical properties (density, rate of diffusion). Radioactive isotopes are used in medicine (¹³¹I for thyroid), carbon dating (¹⁴C) and nuclear power (²³⁵U).</p>'},
{lb:'Relative atomic mass and mass spectrometry',dr:dQ4,ht:'<p><b>Relative atomic mass (Ar)</b> = weighted average mass of an atom relative to 1/12 the mass of ¹²C. Calculated from isotope masses and abundances: Ar = Σ(isotope mass × abundance %) / 100. <b>Mass spectrometry</b> determines isotopic masses and abundances: (1) Vaporisation. (2) Ionisation (electron bombardment). (3) Acceleration through electric field. (4) Deflection by magnetic field (lighter ions deflect more). (5) Detection — m/z ratio plotted as mass spectrum. The mass spectrum of an element shows peaks at each isotope mass with height proportional to abundance.</p>'},
{lb:'Electron configuration',dr:dQ2,ht:'<p>Electrons occupy energy levels (shells) and sub-shells (orbitals). Aufbau principle: fill lowest energy first. Sub-shell energy order: 1s < 2s < 2p < 3s < 3p < 4s < 3d < 4p. Orbital notation: s(max 2e), p(max 6e), d(max 10e), f(max 14e). Hund\'s rule: electrons occupy each orbital singly before pairing. Pauli exclusion: no two electrons have the same four quantum numbers. Examples: Na (Z=11): 1s²2s²2p⁶3s¹. Fe (Z=26): 1s²2s²2p⁶3s²3p⁶3d⁶4s². WAEC: write full electron configurations AND explain anomalies (Cr: 3d⁵4s¹ not 3d⁴4s² — half-filled stability).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'An atom of ⁵⁶Fe (iron-56) has how many neutrons?',o:['26','30','56','82'],a:2,w:'Neutrons = mass number − atomic number = 56 − 26 = 30. Iron (Fe) has Z=26 (26 protons). Mass number A = protons + neutrons, so neutrons = 56 − 26 = 30.'},{q:'Isotopes of the same element have the same:',o:['Mass number (A)','Number of neutrons','Number of protons (atomic number Z)','Density'],a:3,w:'Isotopes have the SAME number of protons (same Z, same element) but DIFFERENT numbers of neutrons (different A). Same Z means same chemical properties but different physical properties.'},{q:'The electron configuration of Ca (Z=20) is:',o:['1s²2s²2p⁶3s²3p⁶4s²','1s²2s²2p⁶3s²3p⁶3d²','1s²2s²2p⁶3s²3p⁸','1s²2s²2p⁶3s²3d²4s²'],a:1,w:'Ca (Z=20): 1s²2s²2p⁶3s²3p⁶4s² — 2+2+6+2+6+2 = 20 electrons. Note 4s fills before 3d for Ca. The 3d sub-shell is not needed for Ca.'},{q:'The relative atomic mass of chlorine (Cl) with isotopes ³⁵Cl (75%) and ³⁷Cl (25%) is:',o:['35.0','35.5','36.0','36.5'],a:2,w:'Ar = (35 × 75 + 37 × 25) / 100 = (2625 + 925) / 100 = 3550/100 = 35.5. The weighted average reflects the higher abundance of ³⁵Cl.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Ionic and Covalent Bonding',su:'Compare ionic and covalent bond formation with examples.',steps:[
{lb:'Ionic bond formation',dr:dQ3,ht:'<p><b>Ionic bonds</b> form when electrons are transferred from a metal to a non-metal, creating oppositely charged ions that attract electrostatically. Na (2,8,1) loses 1 electron → Na⁺ (2,8). Cl (2,8,7) gains 1 electron → Cl⁻ (2,8,8). NaCl forms a <b>giant ionic lattice</b>: each Na⁺ surrounded by 6 Cl⁻ (and vice versa). Properties: high melting point; brittle; conducts electricity when molten or dissolved (ions free to move); insoluble in organic solvents; soluble in water. Lattice energy: energy released when 1 mole of ionic compound forms from its ions in the gas phase — the stronger the charges and smaller the ions, the greater the lattice energy.</p>'},
{lb:'Covalent bond formation',dr:dQ3,ht:'<p><b>Covalent bonds</b> form when two atoms share a pair of electrons. Each atom contributes one electron (or both from one atom in a dative/coordinate bond). Bond order: single (one shared pair, e.g. H-H), double (two shared pairs, e.g. O=O), triple (three shared pairs, e.g. N≡N). Bond length decreases and bond energy increases with bond order: C-C (154pm, 347kJ/mol) < C=C (134pm, 614kJ/mol) < C≡C (120pm, 839kJ/mol). <b>Electronegativity</b> difference determines bond polarity: non-polar (ΔEN<0.4), polar covalent (0.4-1.7), ionic (>1.7).</p>'},
{lb:'Shapes of molecules — VSEPR',dr:dQ5,ht:'<p><b>VSEPR theory</b> (Valence Shell Electron Pair Repulsion): electron pairs repel each other; molecules adopt shapes that minimise repulsion. Lone pairs repel more than bonding pairs. Shapes: 2 bp = linear (180°, CO₂). 3 bp = trigonal planar (120°, BF₃). 4 bp = tetrahedral (109.5°, CH₄). 3 bp + 1 lp = pyramidal (~107°, NH₃). 2 bp + 2 lp = bent/angular (~104.5°, H₂O). 5 bp = trigonal bipyramidal (PCl₅). 6 bp = octahedral (90°, SF₆). Lone pairs reduce bond angle: CH₄ (109.5°) > NH₃ (107°) > H₂O (104.5°).</p>'},
{lb:'Metallic bonding and intermolecular forces',dr:dQ3,ht:'<p><b>Metallic bond</b>: lattice of positive metal ions in a sea of delocalised electrons. Properties: conduct electricity (mobile electrons); malleable/ductile (ions can slide); high melting points (strong electrostatic attraction). Intermolecular forces (between molecules): (1) <b>London dispersion forces</b> (van der Waals) — temporary induced dipoles; in all molecules; increase with molecular size. (2) <b>Permanent dipole-dipole</b> — between polar molecules. (3) <b>Hydrogen bonds</b> — between N-H, O-H or F-H groups; strongest intermolecular force; explains high b.p. of water (100°C vs expected −80°C).</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Which of the following has a TRIGONAL PLANAR shape with bond angles of 120°?',o:['NH₃ (ammonia)','H₂O (water)','BF₃ (boron trifluoride)','CH₄ (methane)'],a:3,w:'BF₃ has 3 bonding pairs and 0 lone pairs around boron → trigonal planar (120°). NH₃ has 1 lone pair (pyramidal, 107°). H₂O has 2 lone pairs (bent, 104.5°). CH₄ has 4 bp (tetrahedral, 109.5°).'},{q:'The H-O-H bond angle in water (104.5°) is less than the H-C-H angle in methane (109.5°) because:',o:['Oxygen is larger than carbon, pushing bonds closer together','Water has 2 lone pairs on oxygen that repel bonding pairs more strongly than bonding pairs repel each other','The hydrogen atoms in water are heavier than those in methane','Water is a liquid while methane is a gas, changing bond angles'],a:2,w:'Lone pair − lone pair repulsion > lone pair − bonding pair repulsion > bonding pair − bonding pair repulsion. Water has 2 lone pairs on O, which compress the H-O-H bond angle to 104.5° from the 109.5° of a pure tetrahedral (methane).'},{q:'Which substance has the highest melting point due to the strength of its bonding?',o:['Methane (CH₄) — molecular with van der Waals forces','Sodium chloride (NaCl) — giant ionic lattice','Diamond (C) — giant covalent lattice','Sodium (Na) — metallic bonding'],a:3,w:'Diamond has the highest melting point (~3550°C) of these. Each C atom is covalently bonded to 4 others in a giant 3D lattice — every bond must be broken to melt it. NaCl (~800°C) and Na (~98°C) are much lower.'},{q:'Hydrogen bonding in water is responsible for:',o:['Water\'s ability to dissolve ionic compounds','Water\'s unusually high boiling point compared with other molecules of similar molecular mass','Water\'s liquid state at room temperature AND its high specific heat capacity — both','Both the high boiling point AND the anomalous density of ice (less dense than liquid water)'],a:4,w:'Hydrogen bonding explains several anomalous properties of water: high boiling point (100°C vs −80°C predicted), high specific heat capacity, the fact that ice is less dense than water (hydrogen bonds form an open hexagonal lattice in ice).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Energetics and Thermochemistry',su:'Examine enthalpy changes, Hess\'s Law and bond energies.',steps:[
{lb:'Enthalpy and standard conditions',dr:dQ5,ht:'<p><b>Enthalpy change (ΔH)</b> = heat energy change at constant pressure. <b>Standard conditions</b>: 25°C (298K), 100kPa, all substances in standard states. <b>Exothermic reactions</b> (ΔH negative): heat released to surroundings; products have lower energy than reactants; temperature of surroundings rises. <b>Endothermic reactions</b> (ΔH positive): heat absorbed from surroundings; products have higher energy; temperature of surroundings falls. Standard enthalpy changes: ΔH°f (formation); ΔH°c (combustion); ΔH°neut (neutralisation); ΔH°atm (atomisation); ΔH°LE (lattice energy).</p>'},
{lb:'Hess\'s Law',dr:dQ7,ht:'<p><b>Hess\'s Law</b>: the total enthalpy change for a reaction is independent of the route taken, provided initial and final conditions are the same. This follows from conservation of energy. Applications: calculate ΔH°f when it cannot be measured directly. Using ΔH°c: ΔH°rxn = Σ ΔH°c(reactants) − Σ ΔH°c(products). Using ΔH°f: ΔH°rxn = Σ ΔH°f(products) − Σ ΔH°f(reactants). Example: C(s) + 2H₂(g) → CH₄(g). Use combustion data and subtract routes to find ΔH°f(CH₄) = −74 kJ/mol. WAEC: always draw the Hess cycle clearly with arrows showing the direction of each step.</p>'},
{lb:'Bond enthalpies',dr:dQ9,ht:'<p><b>Bond enthalpy</b> (bond energy) = energy needed to break 1 mole of a bond in gaseous molecules (endothermic). Using bond enthalpies: ΔH°rxn = Σ (bonds broken) − Σ (bonds formed). Bonds broken: endothermic (positive). Bonds formed: exothermic (negative). Example: H₂(g) + Cl₂(g) → 2HCl(g). Bonds broken: H-H (436) + Cl-Cl (243) = 679 kJ/mol. Bonds formed: 2 × H-Cl (432) = 864 kJ/mol. ΔH = 679 − 864 = −185 kJ/mol. Note: bond enthalpy values are average values (not exact) because bond strength varies with molecular environment — results are approximations.</p>'},
{lb:'Born-Haber cycles and lattice energy',dr:dQ4,ht:'<p>The <b>Born-Haber cycle</b> applies Hess\'s Law to ionic compounds. It links: standard enthalpy of formation (ΔH°f), atomisation enthalpies, ionisation energies, electron affinities and lattice energy. Cycle for NaCl: Na(s) + ½Cl₂(g) → NaCl(s) [ΔH°f = −411 kJ/mol]. Steps: atomise Na (+109); 1st IE of Na (+496); atomise Cl (+122); electron affinity of Cl (−349); lattice energy ΔH°LE. By Hess: ΔH°f = ΔH°atm(Na) + IE₁(Na) + ½ΔH°atm(Cl₂) + EA(Cl) + ΔH°LE. ΔH°LE = −411 − (109 + 496 + 122 − 349) = −411 − 378 = −789 kJ/mol. Larger magnitude = stronger lattice = higher m.p.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Hess\'s Law states that:',o:['The fastest route gives the smallest enthalpy change','The total enthalpy change is independent of the route taken between the same initial and final states','Enthalpy changes are always negative (exothermic)','Bond breaking is always more energetically favourable than bond forming'],a:2,w:'Hess\'s Law: the total enthalpy change for a reaction depends only on the initial and final states, not the route taken. This follows from conservation of energy (first law of thermodynamics).'},{q:'Using bond enthalpies, ΔH for H₂ + Cl₂ → 2HCl. If E(H-H)=436, E(Cl-Cl)=243, E(H-Cl)=432 kJ/mol:',o:['ΔH = +185 kJ/mol (endothermic)','ΔH = −185 kJ/mol (exothermic)','ΔH = +864 kJ/mol','ΔH = −679 kJ/mol'],a:2,w:'Bonds broken: H-H (436) + Cl-Cl (243) = 679 kJ/mol (endothermic). Bonds formed: 2 × H-Cl (2 × 432 = 864) kJ/mol (exothermic). ΔH = 679 − 864 = −185 kJ/mol. Exothermic because more energy released than absorbed.'},{q:'In a Born-Haber cycle for NaCl, the lattice energy is defined as the enthalpy change when:',o:['NaCl(s) dissolves in water to form Na⁺(aq) and Cl⁻(aq)','One mole of NaCl(s) forms from its gaseous ions Na⁺(g) and Cl⁻(g) — always exothermic','One mole of NaCl(s) is decomposed into its elements in standard states','Na(g) loses one electron to form Na⁺(g)'],a:2,w:'Lattice energy = enthalpy change when 1 mole of ionic solid forms from its constituent gaseous ions. For NaCl: Na⁺(g) + Cl⁻(g) → NaCl(s) ΔH°LE = −789 kJ/mol. Always exothermic (ions attract strongly).'},{q:'An endothermic reaction has ΔH = +200 kJ/mol. This means:',o:['The reaction proceeds very quickly because energy is released','The products have LOWER energy than the reactants','The reaction absorbs 200 kJ/mol from the surroundings; products have HIGHER energy','The reaction is impossible because it requires energy input'],a:3,w:'Endothermic (ΔH positive): the system ABSORBS energy from surroundings. Products have HIGHER enthalpy than reactants. The surroundings cool down. Examples: dissolving ammonium nitrate; photosynthesis; thermal decomposition of CaCO₃.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Chemical Equilibrium and Kc',su:'Examine reversible reactions, Le Chatelier\'s Principle and the equilibrium constant.',steps:[
{lb:'Reversible reactions and equilibrium',dr:dQ6,ht:'<p>A <b>reversible reaction</b> can proceed in both forward and reverse directions. At <b>dynamic equilibrium</b>: the rate of the forward reaction = rate of the reverse reaction; concentrations of reactants and products remain constant (though not necessarily equal). Written with ⇌ symbol. Example: N₂(g) + 3H₂(g) ⇌ 2NH₃(g) [Haber Process]. Equilibrium is: (1) Dynamic — both reactions continue at equal rates. (2) A closed system property — requires no loss of substances. (3) Concentration-dependent, not time-dependent. The equilibrium position can be moved by changing conditions.</p>'},
{lb:'Le Chatelier\'s Principle',dr:dQ7,ht:'<p><b>Le Chatelier\'s Principle</b>: when a system at equilibrium is subjected to a change, the system responds to oppose that change. Effects: (1) <b>Concentration</b>: increase [reactant] → equilibrium shifts right (more products). (2) <b>Pressure</b> (gas reactions): increase pressure → shifts to side with fewer moles of gas. For N₂ + 3H₂ ⇌ 2NH₃: 4 moles → 2 moles; high pressure favours product NH₃. (3) <b>Temperature</b>: increase T → shifts in endothermic direction (absorbs heat). Haber: forward reaction is exothermic; high T shifts left (less NH₃). (4) <b>Catalyst</b>: no effect on equilibrium position; speeds up both forward and reverse equally; equilibrium reached faster.</p>'},
{lb:'The equilibrium constant Kc',dr:dQ8,ht:'<p>For aA + bB ⇌ cC + dD, the <b>equilibrium constant Kc</b> = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ (all concentrations in mol/dm³). Kc only changes with temperature. Large Kc (>10⁴): equilibrium lies far to the right (products favoured). Small Kc (<10⁻⁴): equilibrium lies far to the left (reactants favoured). Kc ≈ 1: significant amounts of both reactants and products. The Haber Process: N₂ + 3H₂ ⇌ 2NH₃; Kc = [NH₃]² / ([N₂][H₂]³). If Kc is large at a certain temperature, yields are high. Temperature increase lowers Kc for exothermic reactions (shifts equilibrium left).</p>'},
{lb:'Industrial applications — Haber and Contact processes',dr:dQ6,ht:'<p>The <b>Haber Process</b> (NH₃ synthesis): N₂ + 3H₂ ⇌ 2NH₃ ΔH = −92 kJ/mol. Conditions: 450°C (compromise — too low T is slow; too high T shifts left). 200 atm (high pressure favours NH₃, but expensive equipment). Iron catalyst (speeds up rate; no effect on yield). 10-15% yield (recycled). The <b>Contact Process</b> (H₂SO₄): 2SO₂ + O₂ ⇌ 2SO₃ ΔH = −196 kJ/mol. 450°C, V₂O₅ catalyst, 1-2 atm. SO₃ + H₂SO₄ → H₂S₂O₇ (oleum) → H₂SO₄ + H₂O. In both: conditions are compromises between yield and rate. WAEC: explain why each condition is used.</p>'},
{lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'For the reaction N₂(g) + 3H₂(g) ⇌ 2NH₃(g), increasing pressure will:',o:['Shift equilibrium to the left (more N₂ and H₂)','Have no effect because a catalyst is present','Shift equilibrium to the right (more NH₃) because there are fewer moles of gas on the right','Change the value of Kc'],a:3,w:'Increasing pressure shifts equilibrium to the side with fewer moles of gas. Left = 1+3=4 moles gas. Right = 2 moles NH₃. Fewer moles on right, so equilibrium shifts right → more NH₃. Kc is unchanged.'},{q:'Le Chatelier\'s Principle states that when a system at equilibrium is disturbed:',o:['The reaction stops until the disturbance is removed','The system responds to oppose the change, partly restoring the original conditions','The equilibrium constant Kc changes to accommodate the new conditions','The reaction becomes irreversible to prevent further changes'],a:2,w:'Le Chatelier\'s Principle: equilibrium shifts in the direction that partially opposes the change applied. It minimises the effect of the disturbance but cannot fully reverse it.'},{q:'For an exothermic reaction at equilibrium, increasing temperature will:',o:['Increase the yield of products (shifts right)','Have no effect on equilibrium position, only on rate','Shift equilibrium LEFT (towards reactants), decreasing product yield, and DECREASE Kc','Shift equilibrium right and increase Kc'],a:3,w:'For an exothermic forward reaction: increasing temperature shifts equilibrium in the endothermic direction (reverse = left), decreasing product yield. Temperature increase DECREASES Kc for an exothermic reaction.'},{q:'A catalyst in a reversible reaction:',o:['Shifts equilibrium to the right, increasing product yield','Has no effect on equilibrium position or Kc — it increases the rate of both forward and reverse reactions equally','Shifts equilibrium to the left','Changes the value of Kc but not the equilibrium position'],a:2,w:'A catalyst increases the rate of BOTH forward and reverse reactions equally. It allows equilibrium to be reached faster but does NOT change the equilibrium position or Kc.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Electrochemistry and Redox Reactions',su:'Examine oxidation states, redox reactions and electrochemical cells.',steps:[
{lb:'Oxidation states and redox',dr:dQ8,ht:'<p><b>Oxidation</b>: loss of electrons; increase in oxidation state. <b>Reduction</b>: gain of electrons; decrease in oxidation state. OIL RIG (Oxidation Is Loss, Reduction Is Gain). <b>Oxidation state rules</b>: element = 0. Monoatomic ion = charge. O = −2 (usually). H = +1 (usually, −1 in metal hydrides). F = −1 always. Sum of oxidation states = overall charge. Examples: Mn in KMnO₄ — K(+1) + Mn + 4O(−8) = 0 → Mn = +7. Cr in Cr₂O₇²⁻ — 2Cr + 7(−2) = −2 → Cr = +6. S in SO₄²⁻ — S + 4(−2) = −2 → S = +6.</p>'},
{lb:'Half-equations and cell notation',dr:dQ9,ht:'<p>Redox reactions can be split into <b>half-equations</b>: oxidation half + reduction half. Balance: (1) Balance atoms other than O and H. (2) Balance O by adding H₂O. (3) Balance H by adding H⁺. (4) Balance charge by adding electrons. Example: MnO₄⁻ → Mn²⁺ (acidic): MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O. For an overall equation, multiply half-equations to cancel electrons. <b>Electrochemical cell notation</b>: anode (oxidation) | electrolyte || electrolyte | cathode (reduction). Standard electrode potential E° measured vs standard hydrogen electrode (SHE, E° = 0V). Positive E°cell = spontaneous reaction.</p>'},
{lb:'Standard electrode potentials',dr:dQ8,ht:'<p><b>Standard electrode potential E°</b> = potential difference between a half-cell and the standard hydrogen electrode under standard conditions. The more positive E°, the stronger oxidising agent. Electrochemical series (selected E° values): F₂/F⁻ (+2.87V); Cl₂/Cl⁻ (+1.36V); O₂/H₂O (+1.23V); Fe³⁺/Fe²⁺ (+0.77V); Cu²⁺/Cu (+0.34V); H⁺/H₂ (0.00V); Zn²⁺/Zn (−0.76V); Al³⁺/Al (−1.66V); Li⁺/Li (−3.05V). E°cell = E°cathode − E°anode. If E°cell > 0: reaction is spontaneous. The species with higher E° acts as oxidising agent.</p>'},
{lb:'Electrolysis',dr:dQ9,ht:'<p><b>Electrolysis</b>: decomposition by electrical current. Cathode (connected to −ve terminal): reduction occurs (cations gain electrons). Anode (connected to +ve terminal): oxidation occurs (anions lose electrons). Selective discharge: at cathode, more easily reduced ion discharged first (higher E°). At anode, if inert electrode — OH⁻/H₂O preferentially discharged (O₂ produced) unless high [Cl⁻] (Cl₂ produced). Faraday\'s laws: (1) Mass of product ∝ quantity of electricity (coulombs). (2) Same charge → masses in ratio of molar masses/charges. Q = I × t. Moles of electrons = Q/96500 (Faraday constant = 96500 C/mol).</p>'},
{lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'The oxidation state of Mn in KMnO₄ is:',o:['+2','+4','+6','+7'],a:4,w:'K = +1, 4×O = −8. Sum = 0 (neutral). So +1 + Mn + (−8) = 0 → Mn = +7. Permanganate ion MnO₄⁻ has Mn = +7, the highest common oxidation state of manganese.'},{q:'In the half-equation MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O, the manganese is:',o:['Oxidised from +7 to +2','Reduced from +7 to +2','Oxidised from +2 to +7','Neither oxidised nor reduced — Mn is a spectator ion'],a:2,w:'Mn goes from +7 (in MnO₄⁻) to +2 (Mn²⁺). Decrease in oxidation state = reduction. Manganese gains 5 electrons, hence the 5e⁻ in the half-equation. This is the basis of permanganate titrations.'},{q:'For an electrochemical cell with E°cell = +0.45V, the cell reaction is:',o:['Non-spontaneous — energy must be supplied','Spontaneous — the positive E°cell indicates the reaction proceeds naturally','At equilibrium — neither spontaneous nor non-spontaneous','Impossible to determine from E°cell alone'],a:2,w:'Positive E°cell indicates a SPONTANEOUS reaction (ΔG = −nFE, negative ΔG = spontaneous). A positive E°cell means the cell can generate electrical energy naturally. Negative E°cell = non-spontaneous.'},{q:'In electrolysis using inert electrodes, what forms at the CATHODE?',o:['Oxygen gas (O₂) from oxidation of water','The metal (or H₂ if no suitable metal) — from reduction of cations','Chlorine gas from oxidation of chloride ions','The anode material dissolves into the electrolyte'],a:2,w:'CATHODE = reduction (gain of electrons). Cations from solution are reduced at the cathode: metal ions become metal atoms (e.g. Cu²⁺ + 2e⁻ → Cu). If metal ions are absent or at very low concentration, H⁺ is reduced to H₂.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Organic Chemistry — Mechanisms and Reactions',su:'Examine organic reaction mechanisms and functional group chemistry.',steps:[
{lb:'Types of organic reactions',dr:dQ10,ht:'<p>Organic reaction types: (1) <b>Substitution</b>: an atom/group replaced by another. (2) <b>Addition</b>: atoms/groups add across a multiple bond (C=C or C=O). (3) <b>Elimination</b>: atoms removed to form a double bond. (4) <b>Oxidation/Reduction</b>: gain/loss of oxygen/hydrogen. Reagent types: <b>Nucleophile</b> — electron-pair donor; attacks electron-deficient centres (OH⁻, CN⁻, NH₃, H₂O). <b>Electrophile</b> — electron-pair acceptor; attacks electron-rich centres (Br₂, H⁺, NO₂⁺, RCO⁺). <b>Free radical</b> — unpaired electron; initiates chain reactions (Cl•, Br•). Bond fission: <b>homolytic</b> (each atom gets one electron → radicals). <b>Heterolytic</b> (one atom gets both electrons → ions).</p>'},
{lb:'Alkane reactions — free radical substitution',dr:dQ10,ht:'<p>Alkanes + Cl₂/Br₂ in UV light: <b>free radical substitution</b>. Three stages: (1) <b>Initiation</b>: Cl₂ → 2Cl• (UV energy; homolytic fission). (2) <b>Propagation</b> (two steps, repeated): Cl• + CH₄ → •CH₃ + HCl; then •CH₃ + Cl₂ → CH₃Cl + Cl• (chain reaction). (3) <b>Termination</b>: two radicals combine (e.g. Cl• + Cl• → Cl₂; •CH₃ + Cl• → CH₃Cl). Products are a mixture of mono-, di- and poly-substituted halides — poor selectivity is a limitation. The chain is maintained in propagation; termination ends the chain.</p>'},
{lb:'Alkene reactions — electrophilic addition',dr:dQ9,ht:'<p>Alkenes react by <b>electrophilic addition</b> across the C=C double bond. Mechanism with HBr: (1) Br end of HBr is attracted to electron-rich C=C (polarised: Hδ⁺-Brδ⁻). (2) π electrons of C=C attack H (electrophile) → carbocation intermediate + Br⁻. (3) Br⁻ attacks carbocation → product. Markovnikov\'s rule: H adds to the carbon with more H atoms already (more stable carbocation forms). With Br₂: Br-Br polarised by C=C; bromine bridge intermediate; anti-addition (trans product). Halogen water test: Br₂(aq) decolourised by alkene — test for C=C double bond.</p>'},
{lb:'Carbonyl compounds',dr:dQ10,ht:'<p>Aldehydes (RCHO) and ketones (RCOR\'): C=O group. Nucleophilic addition: (1) CN⁻ attacks C of C=O (electrophilic C). (2) Proton from HCN adds to O. Product: hydroxynitrile (cyanohydrin). Distinguishing aldehyde from ketone: Tollens\' reagent (silver mirror) — aldehydes only. Fehling\'s solution (brick-red precipitate) — aldehydes only. Acidified dichromate (K₂Cr₂O₇/H⁺) — aldehydes oxidised to carboxylic acids (orange → green); ketones NOT oxidised. Aldehydes are more easily oxidised because the H on the C=O group can be removed.</p>'},
{lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'The three stages of free radical substitution (alkane + Cl₂ in UV) are:',o:['Initiation, Propagation, Termination','Electrophilic attack, Carbocation, Product','Nucleophilic addition, Elimination, Substitution','Reduction, Oxidation, Substitution'],a:1,w:'Free radical substitution: INITIATION (Cl₂ → 2Cl• by UV), PROPAGATION (two chain-carrying steps producing HCl and the substituted product), TERMINATION (two radicals combine to end the chain).'},{q:'In electrophilic addition of HBr to propene (CH₃CH=CH₂), Markovnikov\'s rule predicts:',o:['CH₃CHBrCH₃ (Br on middle C) because the more stable secondary carbocation forms','CH₃CH₂CH₂Br (Br on end C) because the primary carbocation is more stable','An equal mixture of both products','No reaction because alkenes do not react with HBr'],a:1,w:'Markovnikov\'s rule: H adds to the less substituted carbon (more H). This forms the more stable SECONDARY carbocation (on middle C) rather than the less stable primary (on end C). Br⁻ then attacks the secondary carbocation → CH₃CHBrCH₃.'},{q:'Tollens\' reagent gives a silver mirror ONLY with:',o:['Ketones (no H on carbonyl carbon)','Alkenes (C=C double bond)','Aldehydes (H on carbonyl carbon — more easily oxidised)','Alcohols (OH group)'],a:3,w:'Tollens\' reagent (ammoniacal silver nitrate) is reduced to silver metal by aldehydes: RCHO + [Ag(NH₃)₂]⁺ → RCOOH + Ag (silver mirror). Ketones cannot be oxidised by Tollens\' (no H on the carbonyl C).'},{q:'The reaction of CN⁻ with a ketone (RCOR\') is an example of:',o:['Electrophilic substitution','Free radical addition','Nucleophilic addition — CN⁻ is an electron-pair donor attacking the electrophilic C of C=O','Elimination to form an alkene'],a:3,w:'Carbonyl carbon (C=O) is electrophilic (Cδ⁺). CN⁻ is a nucleophile (electron-pair donor). CN⁻ attacks C of C=O → tetrahedral intermediate → hydroxynitrile product. NUCLEOPHILIC ADDITION.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Chem \u2022 Y12',ti:'Reaction Kinetics and Rates',su:'Examine rates of reaction, rate equations and mechanisms.',steps:[
{lb:'Factors affecting rate',dr:dQ5,ht:'<p>Rate of reaction = change in concentration per unit time. Factors: (1) <b>Concentration</b>: more particles per unit volume → more frequent collisions → faster rate. (2) <b>Temperature</b>: higher T → more kinetic energy → more particles with energy ≥ Ea → rate increases exponentially (roughly doubles per 10°C rise). (3) <b>Surface area</b>: smaller particles → greater surface area → more frequent collisions at surface → faster rate. (4) <b>Catalyst</b>: lowers activation energy → more particles have sufficient energy → faster rate (same total energy). (5) <b>Pressure</b> (gases): higher pressure → higher concentration → faster rate.</p>'},
{lb:'The Arrhenius equation and activation energy',dr:dQ6,ht:'<p>The <b>Arrhenius equation</b>: k = Ae^(−Ea/RT), where k = rate constant, A = pre-exponential factor (collision frequency and geometry), Ea = activation energy, R = 8.314 J/mol·K, T = temperature in kelvin. Graphical form: ln k = ln A − (Ea/RT). Plot ln k vs 1/T: gradient = −Ea/R. Higher Ea → slower reaction (steeper negative gradient). Catalyst lowers Ea → increases k → faster rate. The <b>Maxwell-Boltzmann distribution</b> shows that as T increases, more molecules have energy ≥ Ea: the area under the curve to the right of Ea increases significantly.</p>'},
{lb:'Rate equations and rate-determining step',dr:dQ7,ht:'<p>The <b>rate equation</b> is determined experimentally: rate = k[A]ⁿ[B]ᵐ. Order with respect to [A] = n (not from stoichiometry). Overall order = n + m. Finding orders by initial rates: if doubling [A] doubles rate → 1st order in A. If doubling [A] quadruples rate → 2nd order in A. If doubling [A] has no effect → 0th order in A. Units of k: 0th order: mol dm⁻³ s⁻¹. 1st order: s⁻¹. 2nd order: mol⁻¹ dm³ s⁻¹. The <b>rate-determining step</b> is the slowest step in a multi-step mechanism — it determines the rate equation.</p>'},
{lb:'Half-life and reaction mechanisms',dr:dQ8,ht:'<p><b>Half-life (t½)</b>: time for concentration to halve. For first-order reactions: t½ is constant (independent of initial concentration). t½ = 0.693/k. Radioactive decay is always first-order. For second-order: t½ doubles as [A] halves. Reaction mechanisms: a series of elementary steps. The overall rate equation reflects only those steps up to and including the rate-determining step. Example: if rate = k[A][B], the rate-determining step involves one A and one B molecule. Intermediate species appear and are consumed during the mechanism but not in the overall equation.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'For the reaction with rate = k[A]²[B], doubling [A] while keeping [B] constant will:',o:['Double the rate (first order in A)','Triple the rate','Quadruple the rate (second order in A — rate × 2² = × 4)','Have no effect on the rate'],a:3,w:'The reaction is second order in A. Rate = k[A]²[B]. If [A] doubles: new rate = k(2[A])²[B] = k × 4[A]²[B] = 4 × original rate. Quadruple the rate.'},{q:'A catalyst increases the rate of a reaction by:',o:['Increasing the temperature of the reaction mixture','Increasing the concentration of reactants','Providing an alternative pathway with a lower activation energy (Ea)','Adding energy to reactant molecules to increase their speed'],a:3,w:'A catalyst provides an alternative reaction pathway with a LOWER activation energy. More molecules now have sufficient energy to react (area under Maxwell-Boltzmann curve > Ea increases), so rate increases.'},{q:'For a first-order reaction with t½ = 20 minutes, after 60 minutes:',o:['All the reactant has been consumed','Half the reactant remains','One-quarter of the reactant remains','One-eighth of the reactant remains'],a:4,w:'60 min = 3 half-lives (3 × 20 min). After each half-life, concentration halves: × ½ × ½ × ½ = × (½)³ = × 1/8. After 3 half-lives, 1/8 of the original reactant remains.'},{q:'The rate equation for a reaction can be determined:',o:['From the balanced chemical equation alone','Theoretically from the activation energy values','Only by experiment (e.g. measuring initial rates at different concentrations)','From the enthalpy change of the reaction'],a:3,w:'Rate equations CANNOT be deduced from balanced equations or theory alone — they must be determined EXPERIMENTALLY. The orders of reaction reflect the mechanism (especially the rate-determining step), not just the stoichiometry.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Chem \u2022 Y12',ti:'Acids, Bases and pH',su:'Examine acid-base theory, pH calculations and buffer solutions.',steps:[
{lb:'Brønsted-Lowry acid-base theory',dr:dQ3,ht:'<p><b>Brønsted-Lowry</b> theory: acid = proton donor; base = proton acceptor. Conjugate acid-base pairs: HA + B ⇌ A⁻ + BH⁺ — HA/A⁻ and BH⁺/B are conjugate pairs. <b>Strong acid</b>: completely dissociates in water (HCl, H₂SO₄, HNO₃). <b>Weak acid</b>: partially dissociates; equilibrium to the left (CH₃COOH, HF, H₂CO₃). For weak acid HA ⇌ H⁺ + A⁻: Ka = [H⁺][A⁻]/[HA]. pKa = −log(Ka). Smaller pKa (larger Ka) = stronger acid. <b>Lewis acid</b> = electron-pair acceptor (generalisation of Brønsted-Lowry). <b>Lewis base</b> = electron-pair donor.</p>'},
{lb:'pH and pOH calculations',dr:dQ4,ht:'<p><b>pH</b> = −log[H⁺]. At 25°C: Kw = [H⁺][OH⁻] = 1×10⁻¹⁴. pKw = pH + pOH = 14 at 25°C. Strong acid: [H⁺] = c (concentration of acid). pH = −log(c). Strong base: [OH⁻] = c. pOH = −log(c). pH = 14 − pOH. Weak acid: [H⁺] = √(Ka × c) (if Ka << c). pH = ½(pKa − log c). pH scale: 0-14 at 25°C. pH < 7: acidic. pH = 7: neutral. pH > 7: basic/alkaline. Calculations: HCl 0.10 mol/dm³: pH = −log(0.10) = 1.00. NaOH 0.10 mol/dm³: pOH = 1.00, pH = 13.00.</p>'},
{lb:'Titrations and indicators',dr:dQ5,ht:'<p>Acid-base <b>titrations</b> determine concentration from volume + concentration of the other reagent. At equivalence point: moles acid = moles base (adjusted for stoichiometry). pH at equivalence point: strong acid + strong base = 7. Weak acid + strong base > 7 (salt is basic). Strong acid + weak base < 7 (salt is acidic). <b>Indicators</b> are weak acids where HIn and In⁻ have different colours; change colour at specific pH. Phenolphthalein: colourless below 8.3, pink above 10 (use for weak acid + strong base). Methyl orange: red below 3.1, yellow above 4.4 (use for strong acid + weak base). Universal indicator: gives pH range colour changes.</p>'},
{lb:'Buffer solutions',dr:dQ6,ht:'<p>A <b>buffer solution</b> resists changes in pH when small amounts of acid or alkali are added. Acidic buffer: weak acid + its salt (e.g. CH₃COOH + CH₃COONa). When H⁺ added: CH₃COO⁻ + H⁺ → CH₃COOH (consumed). When OH⁻ added: CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O (consumed). pH of buffer = pKa + log([A⁻]/[HA]) (Henderson-Hasselbalch). Buffer capacity: greatest when [HA] ≈ [A⁻] (pH ≈ pKa). Biological importance: blood pH maintained 7.35-7.45 by HCO₃⁻/CO₂ buffer and H₂PO₄⁻/HPO₄²⁻ buffer. Deviation of blood pH by ±0.4 units is life-threatening.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Calculate the pH of 0.010 mol/dm³ HCl(aq):',o:['pH = 1','pH = 2','pH = 3','pH = 12'],a:2,w:'HCl is a strong acid — fully dissociates. [H⁺] = 0.010 mol/dm³. pH = −log(0.010) = −log(10⁻²) = 2.'},{q:'An acidic buffer is made from:',o:['A strong acid and a strong base in equal quantities','A weak acid and its conjugate base (the salt of the weak acid with a strong base)','A strong acid and its conjugate base','Two weak acids of similar strength mixed together'],a:2,w:'Acidic buffer = WEAK ACID + its SALT (conjugate base). E.g. CH₃COOH/CH₃COONa. The weak acid provides H⁺ when base is added; the conjugate base consumes H⁺ when acid is added.'},{q:'For a weak acid with Ka = 1.0×10⁻⁵, the pKa is:',o:['pKa = 4','pKa = 5','pKa = 6','pKa = −5'],a:2,w:'pKa = −log(Ka) = −log(1.0×10⁻⁵) = 5. The larger the pKa, the weaker the acid. Ka = 10⁻⁵ is quite small, indicating a weak acid.'},{q:'In the Brønsted-Lowry definition, a BASE is:',o:['A substance that produces OH⁻ ions in water (Arrhenius definition only)','A proton acceptor — it accepts H⁺ from an acid','An electron-pair acceptor (Lewis definition only)','A substance with pH greater than 7 at all concentrations'],a:2,w:'Brønsted-Lowry BASE = proton acceptor (H⁺ acceptor). This is broader than the Arrhenius definition (OH⁻ producer) — it includes NH₃, H₂O, CO₃²⁻ etc. as bases even without producing OH⁻ directly.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q9 \u2022 Chem \u2022 Y12',ti:'WAEC Prep — Y12 Chemistry',su:'Practise WAEC-style questions across all Y12 Chemistry topics.',steps:[
{lb:'WAEC essay structure',dr:dQ10,ht:'<p>For WAEC Y12 Chemistry essays: (1) Define key concepts clearly. (2) Use chemical equations/formulae where relevant. (3) Explain mechanisms step by step. (4) Relate lab observations to theory. (5) Use diagrams/structures where asked. Common high-mark questions: "Explain why water has a higher boiling point than expected." "Describe and explain the conditions used in the Haber Process." "Write the mechanism for electrophilic addition of Br₂ to ethene." "Explain what is meant by a buffer solution and how it works." "Describe how you would distinguish between an aldehyde and a ketone."</p>'},
{lb:'Key equations and formulae',dr:dQ10,ht:'<p>Essential equations: pH = −log[H⁺]. Kw = [H⁺][OH⁻] = 10⁻¹⁴ at 25°C. Ka = [H⁺][A⁻]/[HA]. Rate = k[A]ⁿ[B]ᵐ. t½ = 0.693/k (1st order). E°cell = E°cathode − E°anode. Q = It. Moles e⁻ = Q/96500. ΔH = Σ(bonds broken) − Σ(bonds formed). Kc = [products]ᵖ/[reactants]ʳ. Henderson-Hasselbalch: pH = pKa + log([A⁻]/[HA]). Arrhenius: k = Ae^(−Ea/RT). Moles = mass/Mr. Concentration = moles/volume. Yield% = (actual/theoretical) × 100. Know all of these fluently for WAEC.</p>'},
{lb:'Common WAEC mistakes',dr:dQ9,ht:'<p>Avoid: Writing rate equations from balanced equations (must be experimental). Saying Kc changes with concentration (it only changes with T). Forgetting Markovnikov\'s rule in addition reactions. Confusing oxidation (loss of electrons) with reduction (gain — OIL RIG). Forgetting to balance charge and atoms in half-equations. Saying catalyst shifts equilibrium (it does not — only rate changes). Mixing up aldehyde and ketone with Tollens\'/Fehling\'s tests. Not specifying standard conditions (25°C, 100kPa) when quoting ΔH° or E°. Forgetting that bond energy calculations give approximations only. Not showing correct units for the rate constant k.</p>'},
{lb:'Practical chemistry skills',dr:dQ5,ht:'<p>Practical skills for WAEC: (1) Titration: fill burette; record initial and final readings; calculate titre accurately. (2) Enthalpy measurement: calorimetry — measure temperature change; q = mcΔT; convert to per mole. (3) Rate experiments: initial rate method; measure time for fixed amount of change (e.g. precipitate to form). (4) Identifying unknowns: use reagent tests (Tollens\', Fehling\'s, bromine water, acidified dichromate, Lucas test). (5) Gas identification: CO₂ turns limewater milky; H₂ produces pop with lighted splint; O₂ relights glowing splint; Cl₂ bleaches moist litmus; NH₃ turns moist red litmus blue, gives white smoke with HCl.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'Which of these is a correct unit for a second-order rate constant k?',o:['s⁻¹','mol dm⁻³ s⁻¹','mol⁻¹ dm³ s⁻¹','No units — k is dimensionless'],a:3,w:'For second-order reaction: rate = k[A]². Units: [k] = rate/[A]² = (mol dm⁻³ s⁻¹)/(mol dm⁻³)² = mol⁻¹ dm³ s⁻¹. For 1st order: s⁻¹. For 0th order: mol dm⁻³ s⁻¹.'},{q:'A gas X turns moist red litmus paper blue and produces white smoke when a glass rod dipped in HCl is held nearby. Gas X is:',o:['Chlorine (Cl₂)','Hydrogen (H₂)','Ammonia (NH₃)','Carbon dioxide (CO₂)'],a:3,w:'Ammonia (NH₃): turns moist red litmus BLUE (alkaline gas). Produces white smoke of ammonium chloride with HCl: NH₃ + HCl → NH₄Cl (white solid smoke). Both tests together confirm NH₃.'},{q:'Tollens\' reagent (ammoniacal AgNO₃) can be used to distinguish:',o:['Alkenes from alkanes','Aldehydes from ketones (aldehyde → silver mirror; ketone → no reaction)','Primary from secondary alcohols','Strong acids from weak acids'],a:2,w:'Tollens\' test: ALDEHYDE → silver mirror (Ag⁺ reduced to Ag by the easily oxidised aldehyde H). KETONE → no reaction (no H on carbonyl C, cannot be oxidised by Tollens\'). Classic aldehyde identification test.'},{q:'In the Haber process (N₂ + 3H₂ ⇌ 2NH₃), the conditions 450°C and 200 atm are used because:',o:['These are the conditions that give 100% yield of NH₃','450°C gives maximum yield; 200 atm is standard pressure for industrial plants','450°C is a compromise (faster rate than low T; better yield than very high T); 200 atm increases yield but is a cost compromise for equipment and safety','Temperature has no effect on the equilibrium yield; 200 atm is used only for safety'],a:3,w:'450°C is a COMPROMISE: low T gives high yield (exothermic: ΔH=−92 kJ/mol) but too slowly; high T gives fast rate but poor yield (shifts left). 200 atm gives better yield (fewer moles → right) but high-pressure equipment is expensive and hazardous.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q10 \u2022 Chem \u2022 Y12',ti:'Mixed Questions — Y12 Chemistry',su:'Integrated revision across all Y12 Chemistry topics.',steps:[
{lb:'Full topic summary',dr:dQ10,ht:'<p>Atomic structure: Z = protons; A = p + n; isotopes (same Z, different A); electron config (Aufbau, Hund, Pauli). Bonding: ionic (e⁻ transfer, lattice); covalent (shared pairs, VSEPR shapes); metallic (delocalised e⁻); H-bonds; van der Waals. Energetics: ΔH, Hess\'s Law, bond enthalpies, Born-Haber. Equilibrium: Kc, Le Chatelier, Haber/Contact. Kinetics: rate = k[A]ⁿ, Arrhenius, t½. Redox: OIL RIG, half-equations, E°cell, electrolysis, Faraday. Organic: substitution/addition/elimination; free radical (alkanes); electrophilic addition (alkenes); nucleophilic addition (carbonyls). Acids/bases: Brønsted-Lowry, pH, Ka, buffers.</p>'},
{lb:'Connecting themes',dr:dQ10,ht:'<p>Key connections: Atomic structure → bonding type → physical properties. Bond strength → enthalpy changes (bond energies). Equilibrium + kinetics → industrial process design (Haber, Contact). Redox → electrochemistry → electrolysis → Faraday\'s laws. Organic mechanisms all follow: electrophile attacks electron-rich site (alkenes); nucleophile attacks electron-poor site (carbonyls, haloalkanes); radicals react randomly (alkanes). Acid-base theory: Ka → pH → buffer → biological systems. All Y12 topics build on Y10/Y11 foundation; WAEC A-Level chemistry integrates all of these.</p>'},
{lb:'Application and problem-solving',dr:dQ9,ht:'<p>Problem-solving strategies: (1) Identify the topic area (bonding? equilibrium? organic?). (2) Write any relevant equations or formulae. (3) Check units and significant figures. (4) Show all working — even partial credit matters in WAEC. (5) Draw structures/mechanisms when asked. (6) Always explain observations in terms of theory (e.g. "the silver mirror forms because the aldehyde is oxidised by Ag⁺ to form Ag"). (7) For multi-step calculations: write each step clearly. (8) For electrochemistry: always state which electrode is cathode/anode and why. (9) For mechanisms: show electron pair movement with curly arrows.</p>'},
{lb:'WAEC final tips',dr:dQ10,ht:'<p>Final tips: (1) Know all practical tests and their observations. (2) Know conditions and reasons for major industrial processes (Haber, Contact, Ostwald). (3) Know VSEPR shapes with bond angles. (4) Know how to write and balance half-equations. (5) Know how to calculate pH, Ka, Kc from data. (6) Know Born-Haber cycle construction. (7) Know rate equation and half-life calculations. (8) Know Arrhenius equation and what a plot of ln k vs 1/T shows. (9) Know the difference between bond enthalpy calculations (approximate) and Hess\'s Law with formation/combustion enthalpies (more accurate). (10) Check all answers have correct units and sign (+ or −).</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'The bond angle in NH₃ (107°) is less than in CH₄ (109.5°) because:',o:['Nitrogen is more electronegative than carbon, pulling bonds closer','NH₃ has one lone pair on N that repels bonding pairs more strongly than bonding pairs repel each other, compressing bond angles','NH₃ molecules form hydrogen bonds that compress bond angles','The N-H bond is longer than the C-H bond, requiring a smaller angle'],a:2,w:'NH₃: 3 bonding pairs + 1 lone pair. Lone pair-bonding pair repulsion > bonding pair-bonding pair repulsion. The lone pair compresses the H-N-H angle from 109.5° (perfect tetrahedral) to 107°.'},{q:'In a Born-Haber cycle for MgO, which step is endothermic?',o:['Mg²⁺(g) + O²⁻(g) → MgO(s) — lattice energy formation','Mg(s) → Mg(g) — atomisation of magnesium','O²⁻(g) → O(g) + 2e⁻ — reverse electron affinity','MgO(s) → Mg²⁺(g) + O²⁻(g) — endothermic lattice dissociation'],a:2,w:'Mg(s) → Mg(g) is the atomisation of magnesium — energy must be supplied to convert solid metal to gas. All atomisation steps are endothermic. Lattice energy FORMATION is exothermic; lattice DISSOCIATION is endothermic.'},{q:'E°cell = +0.80V for the reaction: Cu(s) + 2Ag⁺(aq) → Cu²⁺(aq) + 2Ag(s). This means:',o:['The reaction is non-spontaneous; energy must be supplied','The reaction is spontaneous — Cu is oxidised; Ag⁺ is reduced (Ag⁺ has higher E° than Cu²⁺)','The cell produces 0.80 amps of current','Copper is the cathode in this cell'],a:2,w:'Positive E°cell = spontaneous reaction. Cu is OXIDISED (Cu → Cu²⁺ + 2e⁻; ANODE) and Ag⁺ is REDUCED (Ag⁺ + e⁻ → Ag; CATHODE). E°(Ag⁺/Ag) = +0.80V is higher than E°(Cu²⁺/Cu) = +0.34V, so Ag⁺ acts as oxidising agent.'},{q:'A buffer solution of ethanoic acid (Ka = 1.8×10⁻⁵) and sodium ethanoate has equal concentrations of both. Its pH is approximately:',o:['pH = 4.74 (= pKa, since log(1) = 0)','pH = 7.00 (neutral because acid and base are equal)','pH = 5.00','pH = 3.74'],a:1,w:'Henderson-Hasselbalch: pH = pKa + log([A⁻]/[HA]). When [A⁻] = [HA]: log(1) = 0, so pH = pKa. pKa = −log(1.8×10⁻⁵) = 4.74. pH ≈ 4.74 when the buffer has equal concentrations of acid and conjugate base.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
