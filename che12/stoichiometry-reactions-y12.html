<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}

.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}

.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Balancing Chemical Equations',[['Step','Action'],['1','Write correct formulae'],['2','Count atoms each side'],['3','Add coefficients to balance'],['4','Check both sides equal']]);}
function dQ2(p){drawTable(p,'Relative Formula Mass Examples',[['Compound','Formula','Mr'],['Water','H2O','18'],['Carbon dioxide','CO2','44'],['Calcium carbonate','CaCO3','100']]);}
function dQ3(p){drawTable(p,'The Mole Concept',[['Quantity','Formula'],['Moles','mass / Mr'],['Number of particles','moles x 6.02x10^23'],['Avogadro constant','6.02x10^23 per mol']]);}
function dQ4(p){drawTable(p,'Reacting Mass Calculations',[['Step','Action'],['1','Write balanced equation'],['2','Find moles of known substance'],['3','Use mole ratio for unknown'],['4','Convert moles to mass (x Mr)']]);}
function dQ5(p){drawTable(p,'Concentration of Solutions',[['Term','Formula'],['Concentration (mol/dm3)','moles/volume(dm3)'],['Concentration (g/dm3)','mass/volume(dm3)']]);}
function dQ6(p){drawTable(p,'WAEC Stoichiometry Summary',[['Concept','Key formula'],['Moles','mass/Mr'],['Balancing','Same atoms both sides'],['Reacting masses','Use mole ratio from equation']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Balancing Chemical Equations',su:'Write and balance chemical equations correctly, applying conservation of mass.',steps:[
{lb:'Conservation of mass',dr:dQ1,ht:'<p>The <b>Law of Conservation of Mass</b> states that matter cannot be created or destroyed in a chemical reaction \u2014 atoms are simply rearranged. This means a balanced equation must have the SAME NUMBER of each type of atom on both the reactant side and the product side.</p>'},
{lb:'Method for balancing',dr:dQ1,ht:'<p>Steps: (1) Write the correct FORMULAE of all reactants and products (never change a formula to balance \u2014 only add coefficients in front). (2) Count the atoms of each element on both sides. (3) Add whole-number COEFFICIENTS in front of formulae to balance atom counts, usually starting with the most complex molecule or the element appearing in the fewest formulae. (4) Check ALL elements are balanced, then simplify to the smallest whole-number ratio if needed.</p>'},
{lb:'Worked example',dr:dQ1,ht:'<p>Balance: Mg + O2 \u2192 MgO. Count atoms: left has 1 Mg, 2 O; right has 1 Mg, 1 O. Oxygen is unbalanced. Add a coefficient of 2 in front of MgO: Mg + O2 \u2192 2MgO. Now O is balanced (2 each side) but Mg is not (1 left, 2 right). Add coefficient 2 in front of Mg: 2Mg + O2 \u2192 2MgO. Now both Mg (2=2) and O (2=2) are balanced.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Balance: __N2 + __H2 \u2192 __NH3. What are the correct coefficients?',o:['1, 1, 1','1, 3, 2 \u2014 N2 + 3H2 \u2192 2NH3 balances both N (2=2) and H (6=6)','2, 3, 1','1, 2, 3'],a:2,w:'N2+3H2\u21922NH3: left has 2N, 6H; right has 2N (from 2NH3), 6H (from 2NH3, 2x3=6). Both elements balance correctly with coefficients 1, 3, 2.'},{q:'Why can you NEVER change a chemical formula (e.g. writing H2O2 instead of H2O) to balance an equation?',o:['Formulae can always be changed freely','Changing a formula changes the actual chemical identity of the substance, which would misrepresent what is actually reacting/forming \u2014 only coefficients (multiples of whole formulae) may be added','It makes the equation look neater','It has no effect on the chemistry'],a:2,w:'A chemical formula represents the fixed composition of an actual substance. Changing it (e.g. H2O to H2O2) would describe an entirely different compound (water to hydrogen peroxide), misrepresenting the real chemical species involved \u2014 only coefficients (whole-number multiples of the correct formula) can be adjusted to balance an equation.'},{q:'The Law of Conservation of Mass states that in a chemical reaction:',o:['Mass is created but never destroyed','Atoms are neither created nor destroyed, so the total number of each type of atom is the same in reactants and products','Mass always increases','Mass is destroyed but never created'],a:2,w:'This fundamental law explains why chemical equations must be balanced: since atoms cannot appear or disappear during a reaction, the same number of each element\'s atoms must be present in both the reactants and products \u2014 they are simply rearranged into new substances.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Relative Formula Mass and the Mole',su:'Calculate relative formula mass and understand the mole as a counting unit.',steps:[
{lb:'Relative formula mass (Mr)',dr:dQ2,ht:'<p><b>Relative formula mass (Mr)</b> = sum of the relative atomic masses (Ar) of all atoms in a formula. Example: CaCO3 has Mr = Ar(Ca) + Ar(C) + 3xAr(O) = 40 + 12 + 3(16) = 40+12+48 = 100. Always multiply the Ar of each element by how many times it appears in the formula (including inside brackets, e.g. Ca(OH)2 has 2 O and 2 H from the bracket).</p>'},
{lb:'What is a mole',dr:dQ2,ht:'<p>A <b>mole</b> is a counting unit for atoms/molecules/ions, just like a "dozen" means 12. One mole of ANY substance contains 6.02x10^23 particles \u2014 this number is called the AVOGADRO CONSTANT. This huge number is needed because atoms and molecules are extremely small, so we need a very large counting unit to relate lab-scale masses to numbers of particles.</p>'},
{lb:'Moles from mass',dr:dQ2,ht:'<p>Moles = mass (g) / Mr. Example: how many moles are in 20 g of CaCO3 (Mr=100)? Moles = 20/100 = 0.20 mol. Conversely, mass = moles x Mr: find the mass of 0.50 mol of CO2 (Mr=44): mass = 0.50 x 44 = 22 g.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'What is the relative formula mass (Mr) of Ca(OH)2? (Ar: Ca=40, O=16, H=1)',o:['57','74 (40 + 2x16 + 2x1 = 40+32+2)','58','40'],a:2,w:'Ca(OH)2 contains 1 Ca, 2 O and 2 H (the bracket subscript 2 applies to both O and H inside). Mr = 40 + 2(16) + 2(1) = 40+32+2 = 74.'},{q:'How many moles are in 8.0 g of oxygen gas, O2 (Mr=32)?',o:['0.10 mol','0.25 mol (8.0/32)','0.50 mol','4.0 mol'],a:2,w:'Moles = mass/Mr = 8.0/32 = 0.25 mol.'},{q:'The Avogadro constant (6.02x10^23) represents:',o:['The mass of one mole of any substance','The number of particles (atoms, molecules, or ions) present in exactly one mole of a substance','The number of grams in one mole','The relative atomic mass of carbon'],a:2,w:'The Avogadro constant is a fixed, enormous number that defines how many individual particles (whatever they are \u2014 atoms, molecules, ions) make up exactly one mole of any substance, allowing chemists to relate measurable masses to countable particle numbers.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Reacting Mass Calculations',su:'Use balanced equations and mole ratios to calculate masses of reactants and products.',steps:[
{lb:'Why we need mole ratios',dr:dQ4,ht:'<p>A balanced chemical equation tells you the exact MOLE RATIO in which substances react and form. This ratio (NOT the mass ratio directly) is used to calculate how much of one substance is needed or produced, given a known amount of another substance in the same reaction.</p>'},
{lb:'The reacting mass method',dr:dQ4,ht:'<p>Steps: (1) Write the balanced equation. (2) Convert the given mass to MOLES (moles=mass/Mr). (3) Use the mole ratio from the equation to find moles of the substance you want. (4) Convert those moles back to MASS (mass=moles x Mr) or another required quantity.</p>'},
{lb:'Worked example',dr:dQ4,ht:'<p>What mass of CaO forms when 25 g of CaCO3 decomposes? CaCO3 \u2192 CaO + CO2 (Mr: CaCO3=100, CaO=56). Moles CaCO3 = 25/100 = 0.25 mol. Ratio CaCO3:CaO = 1:1, so moles CaO = 0.25 mol. Mass CaO = 0.25 x 56 = 14 g.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'For the reaction 2Mg + O2 \u2192 2MgO, what mass of MgO (Mr=40) forms from 4.8 g of Mg (Mr=24)?',o:['4.8 g','8.0 g (moles Mg=4.8/24=0.20; ratio Mg:MgO=1:1; mass MgO=0.20x40)','16 g','24 g'],a:2,w:'Moles Mg = 4.8/24 = 0.20 mol. Ratio Mg:MgO in the equation is 2:2, which simplifies to 1:1, so moles MgO = 0.20 mol. Mass MgO = 0.20 x 40 = 8.0 g.'},{q:'The essential FIRST step in any reacting mass calculation is to:',o:['Convert masses directly to volumes','Write and balance the chemical equation correctly, since the mole ratio depends on the correct coefficients','Skip straight to multiplying masses together','Assume a 1:1 ratio always applies'],a:2,w:'The mole ratio used throughout the calculation comes directly from the coefficients of the BALANCED equation. Without this first, correct step, any subsequent mole ratio calculations would be based on incorrect assumptions.'},{q:'For CaCO3 \u2192 CaO + CO2, starting with 50 g of CaCO3 (Mr=100), how many moles of CaO (1:1 ratio) will form?',o:['0.25 mol','0.50 mol (moles CaCO3=50/100=0.50; ratio 1:1)','1.0 mol','5.0 mol'],a:2,w:'Moles CaCO3 = 50/100 = 0.50 mol. Since the ratio CaCO3:CaO is 1:1 from the balanced equation, moles CaO formed = 0.50 mol.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Concentration of Solutions',su:'Calculate the concentration of solutions in mol/dm3 and g/dm3.',steps:[
{lb:'Defining concentration',dr:dQ5,ht:'<p><b>Concentration</b> describes how much solute is dissolved in a given volume of solution. Concentration (mol/dm3) = moles of solute / volume of solution (in dm3). Remember: 1 dm3 = 1000 cm3, so a volume given in cm3 must be DIVIDED by 1000 before use in this formula.</p>'},
{lb:'Concentration in g/dm3',dr:dQ5,ht:'<p>Concentration can also be expressed in g/dm3 (mass per unit volume): concentration (g/dm3) = mass of solute (g) / volume of solution (dm3). To convert between the two units: concentration(g/dm3) = concentration(mol/dm3) x Mr, since mass = moles x Mr.</p>'},
{lb:'Worked example',dr:dQ5,ht:'<p>Find the concentration (mol/dm3) of a solution made by dissolving 4.0 g of NaOH (Mr=40) in enough water to make 500 cm3 (0.500 dm3) of solution. Moles NaOH = 4.0/40 = 0.10 mol. Concentration = 0.10/0.500 = 0.20 mol/dm3.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'0.20 mol of a solute is dissolved to make 250 cm3 (0.250 dm3) of solution. What is the concentration?',o:['0.050 mol/dm3','0.80 mol/dm3 (0.20/0.250)','2.0 mol/dm3','8.0 mol/dm3'],a:2,w:'Concentration = moles/volume(dm3) = 0.20/0.250 = 0.80 mol/dm3. Remember to convert cm3 to dm3 by dividing by 1000 before using this formula.'},{q:'A solution has concentration 2.0 mol/dm3 of NaCl (Mr=58.5). What is its concentration in g/dm3?',o:['29.25 g/dm3','58.5 g/dm3','117 g/dm3 (2.0x58.5)','2.0 g/dm3'],a:3,w:'Concentration(g/dm3) = concentration(mol/dm3) x Mr = 2.0 x 58.5 = 117 g/dm3.'},{q:'Before calculating concentration in mol/dm3, a volume given in cm3 must be:',o:['Multiplied by 1000','Divided by 1000 to convert to dm3, since 1 dm3=1000 cm3','Left unchanged, no conversion is needed','Divided by 100'],a:2,w:'Since 1 dm3 = 1000 cm3, a volume measured in cm3 must be divided by 1000 to convert it into dm3 before substituting into the concentration formula (moles/volume in dm3) \u2014 forgetting this conversion is a very common calculation error.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Percentage Composition and Empirical Formula',su:'Calculate percentage composition and determine empirical formula from mass data.',steps:[
{lb:'Percentage composition by mass',dr:dQ2,ht:'<p>Percentage composition of an element in a compound = (mass of that element in the formula / Mr of the compound) x 100. Example: % of Ca in CaCO3 (Mr=100, Ar Ca=40): (40/100)x100 = 40%. This shows what fraction of the total mass comes from a particular element.</p>'},
{lb:'Finding empirical formula from percentages',dr:dQ2,ht:'<p>Method: (1) assume 100 g of the compound, so percentages become masses directly. (2) Convert each mass to moles (divide by Ar). (3) Divide all mole values by the SMALLEST value to find the simplest whole-number ratio \u2014 this ratio gives the empirical formula.</p>'},
{lb:'Worked example',dr:dQ2,ht:'<p>A compound is 40% C, 6.7% H, 53.3% O by mass. Assume 100 g: 40 g C, 6.7 g H, 53.3 g O. Moles: C=40/12=3.33, H=6.7/1=6.7, O=53.3/16=3.33. Divide by smallest (3.33): C=1, H=2.01\u22482, O=1. Empirical formula = CH2O.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'What is the percentage of oxygen by mass in CaCO3 (Mr=100, 3 oxygen atoms, Ar O=16)?',o:['16%','32%','48% (3x16/100 x100)','100%'],a:3,w:'Mass of O in formula = 3 x 16 = 48. % O = (48/100) x 100 = 48%.'},{q:'A compound contains 2.0 g of element A (Ar=40) and 1.0 g of element B (Ar=20) per sample. What is the simplest mole ratio of A:B?',o:['2:1','1:1 (moles A=2.0/40=0.05; moles B=1.0/20=0.05; ratio 0.05:0.05=1:1)','4:1','1:2'],a:2,w:'Moles A = 2.0/40 = 0.05 mol. Moles B = 1.0/20 = 0.05 mol. Dividing both by the smaller value (0.05) gives a ratio of 1:1.'},{q:'To find an empirical formula from percentage composition, the standard first step is to:',o:['Assume the sample is exactly 1 g','Assume the sample is exactly 100 g, so the percentage values can be used directly as masses in grams','Skip straight to dividing by Mr','Multiply all percentages by 100 first'],a:2,w:'Assuming exactly 100 g of the compound conveniently turns each percentage value directly into a mass in grams (e.g. 40% becomes 40 g), simplifying the subsequent mole calculations for each element.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Stoichiometry and Chemical Reactions',su:'Integrated revision of balancing equations, moles, and reacting mass calculations.',steps:[
{lb:'Core stoichiometry summary',dr:dQ6,ht:'<p>Balancing: same number of each atom on both sides, only coefficients may change (never formulae). Moles = mass/Mr. Reacting mass calculations: convert to moles, apply mole ratio from the balanced equation, convert back to the required quantity. Concentration = moles/volume(dm3). Empirical formula: convert percentages/masses to moles, divide by smallest for simplest ratio.</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: changing a chemical FORMULA to balance an equation (only coefficients may be added). Forgetting to convert cm3 to dm3 before using concentration formulae. Using the WRONG mole ratio (always read the coefficients from the balanced equation carefully, do not assume 1:1). Forgetting to include ALL atoms (including those in brackets, e.g. Ca(OH)2) when calculating Mr.</p>'},
{lb:'Problem-solving strategy',dr:dQ6,ht:'<p>WAEC strategy for all stoichiometry problems: (1) write/balance the equation FIRST. (2) Convert all given data to MOLES. (3) Use the mole RATIO from the equation. (4) Convert final moles to whatever is asked (mass, volume, concentration). (5) Always check units and give appropriate significant figures matching the given data.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'For the equation CaCO3 \u2192 CaO + CO2, what mass of CO2 (Mr=44) forms from 200 g of CaCO3 (Mr=100)?',o:['44 g','88 g (moles CaCO3=200/100=2.0; ratio 1:1; mass CO2=2.0x44)','100 g','200 g'],a:2,w:'Moles CaCO3 = 200/100 = 2.0 mol. Ratio CaCO3:CO2 = 1:1, so moles CO2 = 2.0 mol. Mass CO2 = 2.0 x 44 = 88 g.'},{q:'When balancing 2H2 + O2 \u2192 2H2O, the coefficient 2 in front of H2O is necessary because:',o:['It makes the equation look nicer','Without it, oxygen atoms would not balance (2 O on the left require 2 H2O molecules to provide 2 O atoms on the right)','H2O never needs a coefficient','It changes the chemical formula of water'],a:2,w:'O2 provides 2 oxygen atoms on the left. To balance this, 2 molecules of H2O are needed on the right (providing 2 O atoms total), which also then requires 2H2 on the left to balance the 4 hydrogen atoms now present on the right.'},{q:'What is the concentration (mol/dm3) of a solution containing 0.40 mol of solute in 2.0 dm3 of solution?',o:['0.20 mol/dm3 (0.40/2.0)','0.80 mol/dm3','2.0 mol/dm3','5.0 mol/dm3'],a:1,w:'Concentration = moles/volume(dm3) = 0.40/2.0 = 0.20 mol/dm3.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
