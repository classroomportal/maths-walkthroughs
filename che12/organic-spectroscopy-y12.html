<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Organic Reaction Types',ACC,12,'middle',true));
var rows=[['Mechanism','Reagent type','Example'],['Free radical substitution','Radicals (X•)','Alkane + X₂/UV → haloalkane'],['Electrophilic addition','Electrophile (E⁺)','Alkene + HBr → haloalkane'],['SN2 (primary RX)','Nucleophile (Nu⁻)','RX + OH⁻ → ROH (one step; inversion)'],['SN1 (tertiary RX)','Nucleophile (Nu⁻)','RX → carbocation → ROH (racemisation)'],['Nucleophilic addition','Nucleophile (Nu⁻)','Carbonyl + HCN → hydroxynitrile'],['Electrophilic aromatic','Electrophile (NO₂⁺)','Benzene + HNO₃/H₂SO₄ → nitrobenzene'],['Elimination','KOH/ethanol/heat','Haloalkane → alkene + HX']];
rows.forEach(function(r,i){if(i<=p){o.push(R(10,14+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(80,30+i*32,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(235,30+i*32,r[1],'#444',7,'middle',false));o.push(T(390,30+i*32,r[2],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Spectroscopy — Key Data',ACC,12,'middle',true));
var rows=[['Technique','Information','Key feature'],['MS (m/z)','Mr from M⁺; fragmentation','43=CH₃CO⁺; 77=Ph; Br→M:M+2=1:1'],['IR (cm⁻¹)','Functional groups','C=O~1700; O-H acid 2500-3300 broad'],['¹H NMR (δ ppm)','H environments; splitting','CHO δ=9-10; COOH δ=10-13; n+1 rule'],['¹³C NMR','C environments','One peak per unique C; no coupling'],['DoU','Unsaturation degree','(2C+2+N−H−X)/2; aromatic ring=4']];
rows.forEach(function(r,i){if(i<=p){o.push(R(10,16+i*36,460,30,i===0?LINE:CRM,i===0?ACC:LINE,0.5));o.push(T(80,34+i*36,r[0],i===0?'white':ACC,7,'middle',i===0));o.push(T(215,34+i*36,r[1],'#444',7,'middle',false));o.push(T(380,34+i*36,r[2],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Organic & Spectroscopy — Summary',ACC,12,'middle',true));
var rows=[['FRS','Initiation: X₂→2X•; Propagation: 2 steps; Termination: 2 radicals combine'],['Electrophilic add.','H adds to less-substituted C (Markovnikov); carbocation intermediate'],['SN1/SN2','SN1: tertiary; carbocation; racemisation. SN2: primary; backside; inversion'],['Carbonyl tests','Tollens\' → silver mirror (aldehyde only). Fehling\'s → Cu₂O (aldehyde only)'],['Spectroscopy','MS=Mr+frags; IR=groups (C=O, O-H); NMR=environments+splits']];
rows.forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*36,460,30,CRM,LINE,1));o.push(T(100,54+i*36,r[0],ACC,9,'middle',true));o.push(T(310,54+i*36,r[1],'#555',7,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Organic Reaction Mechanisms',su:'Examine free radical, electrophilic and nucleophilic mechanisms.',steps:[
{lb:'Free radical substitution (FRS)',dr:dQ1,ht:'<p>FRS of alkanes + halogens in UV: (1) <b>Initiation</b>: Cl₂ → 2Cl• (UV; homolytic fission). (2) <b>Propagation</b> (two steps): Cl•+CH₄→•CH₃+HCl; •CH₃+Cl₂→CH₃Cl+Cl•. (3) <b>Termination</b>: any two radicals combine (Cl•+Cl•; •CH₃+Cl•; •CH₃+•CH₃). Products: mixture of CH₃Cl, CH₂Cl₂, CHCl₃, CCl₄ — poor selectivity. Homolytic fission: X:Y→X•+Y• (each atom gets one e⁻). Heterolytic: X:Y→X⁺+Y⁻.</p>'},
{lb:'Electrophilic addition to alkenes',dr:dQ1,ht:'<p>Alkenes + HBr: electrophilic addition. (1) HBr polarised (Hδ⁺-Brδ⁻). (2) H⁺ attacks C=C → carbocation intermediate + Br⁻. (3) Br⁻ attacks carbocation → haloalkane. Markovnikov\'s rule: H adds to LESS substituted C (more Hs) → MORE STABLE (more substituted) carbocation forms → Br to that C. Example: propene + HBr → 2-bromopropane (major). Bromine water test: Br₂(aq) decolourised by alkene. Addition of Br₂: bromonium ion intermediate; anti-addition.</p>'},
{lb:'Nucleophilic substitution SN1 and SN2',dr:dQ3,ht:'<p>Haloalkanes + NaOH(aq): nucleophilic substitution. <b>SN2</b> (primary): one concerted step; Nu attacks from back; C-X breaks simultaneously; INVERSION of configuration; rate=k[RX][Nu]. <b>SN1</b> (tertiary): two steps; C-X breaks first → carbocation (stabilised by 3 alkyl groups); Nu then attacks from either side; RACEMISATION; rate=k[RX]. Reactivity: C-I > C-Br > C-Cl (bond enthalpy). Test: AgNO₃/EtOH after hydrolysis → AgCl (white), AgBr (cream), AgI (yellow).</p>'},
{lb:'Nucleophilic addition to carbonyls',dr:dQ4,ht:'<p>Aldehydes/ketones (C=O): C is electrophilic (Cδ⁺). HCN addition: (1) CN⁻ (nucleophile) attacks Cδ⁺. (2) Alkoxide O⁻ formed. (3) H⁺ (from HCN) protonates O. Product: hydroxynitrile (cyanohydrin). Useful: extends chain by 1C; can hydrolyse to 2-hydroxy acid or reduce to amino alcohol. Distinguishing aldehyde from ketone: Tollens\' (silver mirror) → aldehyde only. Fehling\'s (brick-red Cu₂O) → aldehyde only. Acidified Cr₂O₇²⁻: aldehyde oxidised (orange→green); ketone not oxidised.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Three stages of free radical substitution in order:',o:['Propagation, Initiation, Termination','Initiation, Propagation, Termination','Termination, Propagation, Initiation','Initiation, Termination, Propagation'],a:2,w:'FRS: (1) INITIATION — UV splits X₂→2X•. (2) PROPAGATION — two chain-carrying steps (repeated many times). (3) TERMINATION — two radicals combine, ending the chain. Always in this order.'},{q:'In electrophilic addition of HBr to but-1-ene (CH₃CH₂CH=CH₂), Markovnikov predicts:',o:['1-bromobutane — Br on C1 (primary carbocation)','2-bromobutane — Br on C2 (secondary carbocation — more stable — MAJOR)','Equal mixture of both','3-bromobutane'],a:2,w:'H adds to C1 (has 2H) → secondary carbocation on C2 (more stable than primary C1). Br⁻ attacks C2 → 2-bromobutane (major product). Markovnikov: H to less substituted C; Br to more substituted C.'},{q:'SN2 is favoured by primary haloalkanes because:',o:['Primary carbocations are most stable','Weakest C-X bond in primary haloalkanes','Least steric hindrance for backside attack by nucleophile','Primary haloalkanes dissolve better'],a:3,w:'SN2 requires backside attack by Nu simultaneously with C-X breaking. Primary RX has only one alkyl group → minimal steric hindrance → Nu can approach easily. Tertiary RX has 3 bulky groups → SN2 very slow → SN1 preferred.'},{q:'CN⁻ attacking the carbonyl C of propanone is:',o:['Electrophilic addition — CN⁻ is an electrophile','Nucleophilic substitution — CN⁻ replaces O','Nucleophilic addition — CN⁻ (e⁻-pair donor) attacks electrophilic Cδ⁺ of C=O','Free radical addition'],a:3,w:'C=O: C is Cδ⁺ (electrophilic). CN⁻ has lone pair → nucleophile. CN⁻ attacks Cδ⁺ → C-C bond formed; O⁻ protonated → hydroxynitrile. NUCLEOPHILIC ADDITION (no leaving group; double bond opened).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Functional Group Tests',su:'Apply chemical tests to identify organic compounds.',steps:[
{lb:'Aldehyde vs ketone',dr:dQ2,ht:'<p>Tollens\' reagent (ammoniacal AgNO₃): ALDEHYDE → silver mirror (Ag deposited). KETONE → no reaction. Fehling\'s (blue Cu²⁺ complex): ALDEHYDE → brick-red Cu₂O precipitate. KETONE → no reaction. Acidified K₂Cr₂O₇: ALDEHYDE → orange→green (oxidised to carboxylic acid). KETONE → stays orange (not oxidised). Reason: aldehydes have H on C=O (RCHO) → easily oxidised. Ketones (RCOR\') have no such H → resistant to mild oxidants.</p>'},
{lb:'Other functional group tests',dr:dQ1,ht:'<p>Tests: Alkene: Br₂(aq) decolourised (orange→colourless). Alcohol: Na metal → H₂ bubbles; PCl₅ → steamy HCl fumes. Carboxylic acid: Na₂CO₃ → CO₂ bubbles; pH < 4. Phenol: FeCl₃(aq) → purple colour. Amine: moist red litmus → blue (alkaline). Haloalkane: AgNO₃/EtOH (after hydrolysis with NaOH) → AgCl white, AgBr cream, AgI yellow. Iodoform test: I₂/NaOH → yellow CHI₃ precipitate for CH₃CO- (methyl ketones) or CH₃CHOH- (secondary methyl alcohols/ethanol).</p>'},
{lb:'Gas tests',dr:dQ2,ht:'<p>Gas tests: CO₂: limewater turns milky (CaCO₃ precipitates). H₂: burning splint → squeaky pop. O₂: glowing splint relights. NH₃: moist red litmus→blue; white smoke with HCl (NH₄Cl). Cl₂: bleaches moist litmus paper. SO₂: acidified KMnO₄ decolourised. H₂S: rotten egg smell; blackens lead acetate paper. HCl: white fumes with NH₃; moist litmus→red. WAEC: always give observation AND conclusion for each test. "The solution turns orange to colourless, indicating an alkene is present — C=C double bond reacts with bromine water."</p>'},
{lb:'Alcohol oxidation states',dr:dQ1,ht:'<p>Alcohol oxidation with acidified K₂Cr₂O₇ or KMnO₄: Primary alcohol (RCH₂OH): (1) gentle + distil → aldehyde (RCHO). (2) reflux → carboxylic acid (RCOOH). Secondary alcohol (R₂CHOH): reflux → ketone (R₂C=O). Tertiary alcohol (R₃COH): no oxidation (no H on C bearing OH). Observation: orange Cr₂O₇²⁻ → green Cr³⁺ if oxidation occurs; stays orange for tertiary alcohol. Lucas test (ZnCl₂/conc. HCl): 3° → immediate cloudiness; 2° → cloudy after ~5min; 1° → no cloudiness.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Tollens\' gives silver mirror; Fehling\'s gives brick-red precipitate. The compound is:',o:['A ketone (both tests positive for ketones)','An aldehyde (both tests positive for aldehydes only)','A carboxylic acid','An alkene'],a:2,w:'Both Tollens\' (silver mirror) AND Fehling\'s (brick-red Cu₂O) are POSITIVE for ALDEHYDES only. Ketones give NEGATIVE results with both. The H on the carbonyl C of RCHO makes aldehydes easily oxidised.'},{q:'A gas turns moist red litmus BLUE and gives white smoke with HCl. The gas is:',o:['Chlorine (Cl₂) — bleaches litmus','Hydrogen (H₂) — squeaky pop','Ammonia (NH₃) — alkaline; NH₃+HCl→NH₄Cl white smoke','Carbon dioxide (CO₂) — milky limewater'],a:3,w:'NH₃ is alkaline → turns moist red litmus BLUE. NH₃+HCl→NH₄Cl (white solid) → white smoke. Both observations together confirm ammonia.'},{q:'Limewater turns milky when gas bubbled through it. The gas is:',o:['SO₂ (turns acidified KMnO₄ colourless)','CO₂ (Ca(OH)₂+CO₂→CaCO₃↓+H₂O — white precipitate)','H₂S (blackens lead acetate paper)','HCl (moist litmus turns red)'],a:2,w:'CO₂+Ca(OH)₂→CaCO₃ (white precipitate)+H₂O. The white precipitate makes limewater milky. Standard test for CO₂. Excess CO₂ dissolves the precipitate (CaCO₃+CO₂+H₂O→Ca(HCO₃)₂, soluble).'},{q:'The iodoform test is positive for propanone (CH₃COCH₃) but NOT pentan-3-one (CH₃CH₂COCH₂CH₃). Why?',o:['Propanone is a smaller molecule','Propanone has the CH₃CO- (methyl ketone) group; pentan-3-one does not (only CH₃CH₂CO-)','Pentan-3-one cannot be oxidised','Propanone dissolves better in NaOH'],a:2,w:'Iodoform test requires CH₃CO- group (methyl ketone). Propanone: CH₃COCH₃ — has TWO CH₃CO- groups → POSITIVE. Pentan-3-one: CH₃CH₂COCH₂CH₃ — NO CH₃CO- group → NEGATIVE. The CH₃ must be directly on the C=O.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Mass Spectrometry',su:'Interpret mass spectra to identify organic compounds.',steps:[
{lb:'Mass spectrum interpretation',dr:dQ2,ht:'<p>MS: M⁺ = Mr. Fragmentation = structural info. Key fragments (m/z): 15=CH₃⁺; 29=C₂H₅⁺ or CHO⁺; 43=CH₃CO⁺ (methyl ketones: M−15=43); 57=C₃H₅O⁺; 77=C₆H₅⁺ (phenyl). M−15: loss of CH₃. M−17: loss of OH. M−18: loss of H₂O. Isotope patterns: Cl: M:M+2=3:1. Br: M:M+2=1:1. High-res MS → exact mass → molecular formula (all elements have slightly different exact masses). DoU=(2C+2+N−H−X)/2. DoU=1: one ring or double bond. DoU=4: likely aromatic.</p>'},
{lb:'Using MS data',dr:dQ1,ht:'<p>Example 1: M⁺=58; base peak 43; loss of 15=CH₃; fragment 43=CH₃CO⁺ → methyl ketone → propanone (CH₃COCH₃, Mr=58). Example 2: M⁺=78; DoU=(12+2−6)/2=4; m/z=77 (M−1, loss of H) → aromatic → benzene (C₆H₆, Mr=78). Example 3: M⁺=94; M+2 at same height (1:1 ratio) → one Br; Mr−79=15=CH₃; structure CH₃Br (but Mr=94... actually bromomethane Mr=94? No: CH₃Br=12+3+79=94 ✓). M+2 for bromine at 1:1 confirms one Br atom. Practice: always list (1) Mr; (2) DoU; (3) fragments and losses; (4) propose structure.</p>'},
{lb:'High-resolution MS and DoU',dr:dQ2,ht:'<p>DoU practice: C₄H₈ = (8+2−8)/2=1. C₄H₆ = (8+2−6)/2=2. C₆H₆ = (12+2−6)/2=4 (benzene). C₃H₇NO = (6+2+1−7)/2=1. Include N (adds 1), halogen (−1 each). Oxygen: ignored in DoU formula. High-resolution MS: exact atomic masses: ¹H=1.00794; ¹²C=12.0000; ¹⁴N=14.0031; ¹⁶O=15.9949; ³²S=31.9721; ³⁵Cl=34.9689; ⁷⁹Br=78.9183. Molecules with same nominal mass but different formula have different exact masses → high-res MS distinguishes them. Used in forensics, drug analysis, proteomics.</p>'},
{lb:'Combined MS and structure',dr:dQ1,ht:'<p>Structure determination using MS: (1) M⁺ → Mr. (2) Molecular formula from combustion or exact mass → DoU. (3) Identify major fragment losses (M−15, M−17, M−18, M−29, M−43...). (4) Identify fragments present (m/z=43→CH₃CO⁺; m/z=77→C₆H₅⁺). (5) Cross-check with IR and NMR. Example: Mr=60; DoU=0; M−15=45 (loss of CH₃); M−17=43 (loss of OH); M−18=42 (loss of H₂O); no C=O in IR → not acid/ketone; IR shows O-H → alcohol. Formula C₃H₈O; DoU=0; primary alcohol losing H₂O → propan-1-ol or propan-2-ol → NMR distinguishes.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'A compound has M⁺ at m/z=72 and base peak at m/z=43. The compound is most likely:',o:['Pentane (C₅H₁₂, Mr=72; m/z=43=C₃H₇⁺)','Butanone (CH₃CH₂COCH₃, Mr=72; loss of C₂H₅(29) gives CH₃CO⁺ at m/z=43)','Butanal (CH₃CH₂CH₂CHO, Mr=72; m/z=43=C₂H₃O⁺... actually CHO⁺+CH₂=29)','Butanol (Mr=74)'],a:2,w:'M=72; m/z=43=CH₃CO⁺ (acetyl cation, loss of 29=C₂H₅ from 72→43). Characteristic of METHYL KETONES. Butanone: CH₃CH₂COCH₃ (Mr=72); loss of ethyl (C₂H₅, m=29) gives CH₃CO⁺ at m/z=43 ✓.'},{q:'A mass spectrum shows M⁺ at m/z=94 and M+2 at roughly the same height (1:1 ratio). This indicates:',o:['One chlorine atom (³⁵Cl:³⁷Cl = 3:1)','One bromine atom (⁷⁹Br:⁸¹Br ≈ 1:1)','Two chlorine atoms','Sulfur present'],a:2,w:'Bromine: ⁷⁹Br (~50%) and ⁸¹Br (~50%) → M:M+2≈1:1. Chlorine: ³⁵Cl (75%):³⁷Cl (25%) → M:M+2=3:1. The 1:1 ratio confirms ONE bromine atom.'},{q:'DoU for C₅H₈ =',o:['DoU=0 (fully saturated)','DoU=1 (one ring or one C=C)','DoU=2 (e.g. two C=C, or one ring + one C=C, or one C≡C)','DoU=4 (aromatic ring)'],a:2,w:'DoU=(2×5+2−8)/2=(10+2−8)/2=4/2=2. Two degrees of unsaturation: could be two C=C bonds (penta-1,3-diene), one ring + one C=C (cyclopentene), or one C≡C triple bond (pent-1-yne).'},{q:'Fragment at m/z=77 in a mass spectrum suggests:',o:['CH₃CO⁺ (acetyl group from methyl ketone)','C₆H₅⁺ (phenyl cation — presence of benzene ring)','C₂H₅⁺ (ethyl group)','CHO⁺ (formyl cation from aldehyde)'],a:2,w:'m/z=77 = C₆H₅⁺ (phenyl cation, Mr=6×12+5×1=77). This strongly suggests a benzene ring in the compound. Often seen in aromatic compounds alongside M⁺ peaks that are 77+something.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'IR and NMR Spectroscopy',su:'Interpret IR and NMR spectra to determine structures.',steps:[
{lb:'Infrared spectroscopy',dr:dQ2,ht:'<p>Key IR absorptions (cm⁻¹): O-H alcohol: 3200-3550 sharp. O-H carboxylic acid: 2500-3300 BROAD (extended hydrogen bonding dimer). N-H: 3300-3500. C-H: 2850-3000. C=O: 1630-1820 STRONG (most diagnostic). C=C alkene: ~1620 weak. C-O: 1000-1300. Fingerprint region (400-1500): unique; match databases. Carboxylic acid: BROAD O-H 2500-3300 + C=O ~1710. Alcohol: SHARP O-H 3200-3550, no C=O. Ketone: C=O ~1715, no O-H. Aldehyde: C=O ~1720 + C-H ~2720 (weak). Ester: C=O ~1735 (higher wavenumber than ketone/acid).</p>'},
{lb:'Chemical shifts and integration',dr:dQ1,ht:'<p>¹H NMR chemical shifts (δ ppm): 0-1.5: alkyl C-H (CH₃, CH₂, CH). 2.0-2.5: next to C=O. 3.0-4.5: O-CH or N-CH (next to electronegative). 4.5-5.5: alkene =CH. 6.0-8.0: aromatic ArH. 9.0-10.0: CHO (aldehyde). 10.0-13.0: COOH. O-H and N-H: variable, often broad singlet (fast exchange). Integration (peak area): relative number of H in each environment. TMS: reference at δ=0. ¹³C NMR: one peak per unique C environment; no coupling observed; integration not meaningful.</p>'},
{lb:'Spin-spin splitting',dr:dQ2,ht:'<p>n+1 rule: H adjacent to n equivalent H atoms → splits into n+1 peaks. Singlet (s): n=0 (no adjacent H, or O-H/N-H fast exchange). Doublet (d): n=1. Triplet (t): n=2. Quartet (q): n=3. Quintet: n=4. Equivalent H in same environment do NOT split each other. Example: ethanol CH₃CH₂OH: CH₃ (3H, adj to CH₂, n=2→triplet, δ≈1.2). CH₂ (2H, adj to CH₃, n=3→quartet, δ≈3.7). OH (1H, broad singlet, δ≈2-5). Coupling constant J (Hz) = distance between peaks in multiplet; same for both coupled groups.</p>'},
{lb:'Combined spectroscopic analysis',dr:dQ1,ht:'<p>Strategy: (1) MS → Mr + DoU. (2) IR → functional groups. (3) ¹H NMR → environments, integrations, shifts, splitting. (4) Propose structure; check all peaks. Example: Mr=60; IR: broad O-H 2500-3300 + C=O 1710 → COOH. ¹H NMR: quartet 2H δ=2.4; triplet 3H δ=1.1; singlet 1H δ=11. Total H=6; formula C₃H₆O₂ (Mr=74)... wait Mr=60→C₂H₄O₂? Ethanoic acid Mr=60: CH₃COOH. NMR: CH₃ singlet 3H δ=2.1; COOH singlet 1H δ=11. That gives 4H. Hmm — ethanoic acid has only 4H. Propanoic acid Mr=74. Example corrected: ethanoic acid (Mr=60): singlet 3H (CH₃) + singlet 1H (COOH).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'IR shows strong C=O at ~1735 cm⁻¹ and C-O at 1000-1300 cm⁻¹ but NO O-H. The functional group is:',o:['Carboxylic acid (-COOH) — always has broad O-H','Ester (-COO-): C=O at higher wavenumber ~1735; no O-H because O is bonded to two C atoms','Ketone (-CO-): C=O ~1715; no O-H','Alcohol (-OH): sharp O-H + no C=O'],a:2,w:'Ester C=O is at HIGHER wavenumber (~1735) than ketone (~1715) or acid (~1710) because the O-C adjacent to C=O withdraws electrons. Ester has no O-H (O is bonded to R\' group not H). C-O stretch at 1000-1300 cm⁻¹ also present. No O-H confirms not acid.'},{q:'¹H NMR: quartet (2H, δ=2.4) and triplet (3H, δ=1.1). This pattern comes from:',o:['Two isolated CH₂ groups (singlets expected)','CH₃ (adj to CH₂, n=2→triplet) and CH₂ (adj to CH₃, n=3→quartet): CH₃CH₂- ethyl group next to electron-withdrawing group','An aromatic ring (singlets at δ=6-8)','Three identical CH groups'],a:2,w:'Classic TRIPLET+QUARTET pattern: CH₃ (3H, triplet, adj to 2H of CH₂) and CH₂ (2H, quartet, adj to 3H of CH₃). This identifies a CH₃CH₂- (ethyl) group. δ=2.4 (CH₂) next to C=O; δ=1.1 (CH₃). Consistent with CH₃CH₂CO- fragment.'},{q:'A compound with molecular formula C₄H₈O₂ (Mr=88, DoU=1) shows IR C=O at 1715 cm⁻¹ and O-H broad 2500-3300 cm⁻¹. The compound is:',o:['An ester (ester C=O ~1735; no O-H)','A ketone with an OH group','Butanoic acid (CH₃CH₂CH₂COOH, Mr=88; C=O ~1710; broad O-H → COOH)','2-methylpropan-2-ol (tertiary alcohol; no C=O)'],a:3,w:'C=O ~1715 + broad O-H 2500-3300 → CARBOXYLIC ACID (-COOH). C₄H₈O₂ with DoU=1 (one C=O): butanoic acid (CH₃CH₂CH₂COOH, Mr=4×12+8×1+2×16=88 ✓). The broad O-H absorption is characteristic of carboxylic acid hydrogen-bonded dimers.'},{q:'The fingerprint region of IR (400-1500 cm⁻¹) is useful for:',o:['Identifying individual functional groups from characteristic peaks','Confirming compound identity by matching unique pattern against a database','Calculating molecular mass','Counting hydrogen atoms'],a:2,w:'The fingerprint region has many overlapping C-C, C-O, C-H bending vibrations — complex and unique to each molecule. It is used to CONFIRM identity by matching against reference spectra in a database. Structural isomers may have same functional group peaks but different fingerprints.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Polymers and Amino Acids',su:'Examine polymer chemistry, amino acids and proteins.',steps:[
{lb:'Addition and condensation polymers',dr:dQ1,ht:'<p>Addition polymers: C=C monomers; no byproduct; non-biodegradable. Poly(ethene), PVC, PTFE, poly(propene). Condensation polymers: two functional groups; small molecule eliminated. Polyesters (-COO-): diol + diacid + H₂O (PET: ethane-1,2-diol + benzene-1,4-dicarboxylic acid). Polyamides (-CO-NH-): diamine + diacid + H₂O (nylon 6,6: hexane-1,6-diamine + hexanedioic acid). Or amino acid → polypeptide (peptide bond = amide bond in proteins). Kevlar: aromatic polyamide; very strong H-bonds between chains; bullet-proof vests. PLA: biodegradable polyester from lactic acid.</p>'},
{lb:'Amino acids and proteins',dr:dQ2,ht:'<p>Amino acids: H₂N-CHR-COOH. Amphoteric. Zwitterion at isoelectric point: ⁺H₃N-CHR-COO⁻. Peptide bond: -CO-NH- by condensation (−H₂O) between COOH of one AA and NH₂ of another. Hydrolysis: H₂O/H⁺ → protonated AAs; H₂O/NaOH → carboxylate salts + amines. Protein structure: 1° = amino acid sequence. 2° = α-helix/β-sheet (H-bonds, -CO···H-N). 3° = 3D fold (S-S bridges, H-bonds, ionic, van der Waals). 4° = multiple polypeptide chains. Denaturation: breaks 2°/3° structure (not peptide bonds) by heat, pH change, heavy metals.</p>'},
{lb:'Benzene and aromatic chemistry',dr:dQ1,ht:'<p>Benzene (C₆H₆): planar hexagon; all C-C bonds equal (139pm); delocalised π system (6 e⁻). Unusually stable (resonance energy ~150 kJ/mol). Reactions: electrophilic aromatic substitution (EAS) preserves aromaticity. Nitration: HNO₃/H₂SO₄ → NO₂⁺ electrophile → nitrobenzene (+H₂O). Halogenation: X₂/AlX₃ → halobenzene (+HX). Alkylation: RCl/AlCl₃ → alkylbenzene. Benzene does NOT undergo addition (would destroy aromaticity and lose ~150 kJ/mol stability). WAEC: explain why substitution not addition occurs.</p>'},
{lb:'Environmental impact of polymers',dr:dQ2,ht:'<p>Polymer problems: Addition polymers non-biodegradable → persist 100s years; microplastics harm marine life. Solutions: (1) Reduce/reuse (best). (2) Mechanical recycling — melt/reshape (quality degrades). (3) Chemical recycling — depolymerise to monomers (better quality; expensive). (4) Biodegradable polymers (PLA, PHA — from renewable feedstocks). (5) Incineration + energy recovery (not ideal; CO₂ produced). Condensation polymers (ester/amide bonds) hydrolysable → more easily recycled. Atom economy: addition polymerisation = 100% (no byproduct); condensation = <100% (H₂O eliminated).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Nylon 6,6 (polyamide) is made from hexane-1,6-diamine and hexanedioic acid. The link in the polymer is:',o:['Ester link (-COO-) — condensation of COOH + OH','Amide link (-CO-NH-) — condensation of COOH + NH₂ (+H₂O eliminated)','Ether link (-O-) — condensation of two alcohols','C-C link — addition of monomer with C=C'],a:2,w:'Nylon 6,6: diamine (NH₂ groups) + diacid (COOH groups) → AMIDE (-CO-NH-) links + H₂O eliminated. Each amide bond = one peptide bond. The amide linkage distinguishes polyamides (nylon, Kevlar) from polyesters (PET).'},{q:'At the isoelectric point of an amino acid:',o:['H₂N-CHR-COOH (neutral, fully protonated amine, undissociated acid)','⁺H₃N-CHR-COO⁻ (zwitterion — both +NH₃ and COO⁻; net charge = 0)','H₂N-CHR-COO⁻ (deprotonated)','⁺H₃N-CHR-COOH (fully protonated)'],a:2,w:'At the isoelectric point: pH where net charge = 0. The ZWITTERION predominates: ⁺H₃N-CHR-COO⁻. Both amine (protonated, +) and carboxylate (deprotonated, −) groups present — charges cancel. No migration in electrophoresis.'},{q:'Benzene undergoes electrophilic aromatic substitution (NOT addition) because:',o:['Benzene is unreactive due to the aromatic ring\'s stability','Addition is impossible — the benzene ring is rigid','Substitution preserves the delocalised π system (aromaticity); addition would destroy it, losing ~150 kJ/mol resonance stabilisation','Benzene rings can only react with electrophiles, not nucleophiles or radicals'],a:3,w:'The benzene π system gives ~150 kJ/mol extra stability (resonance energy). EAS uses π electrons to attack the electrophile then REGENERATES the aromatic ring in the final step. Addition would permanently break the delocalised system — losing this stability. Substitution conserves aromaticity.'},{q:'Saponification (NaOH hydrolysis of a fat) produces:',o:['The free fatty acids and glycerol','Sodium carboxylate salts (soap, RCOO⁻Na⁺) and glycerol — the reaction is irreversible','The original triglyceride is regenerated','Methanol and sodium ethanoate'],a:2,w:'Triglyceride + 3NaOH → 3 RCOO⁻Na⁺ (soap) + HOCH₂CH(OH)CH₂OH (glycerol). Products are the SODIUM SALTS of the fatty acids (not the free acids). Irreversible (unlike acid hydrolysis). The carboxylate ion cannot reform the ester in basic conditions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Organic Synthesis',su:'Plan and evaluate multi-step organic syntheses.',steps:[
{lb:'Functional group interconversions',dr:dQ1,ht:'<p>Key routes: Alkene→haloalkane: HX (addition; Markovnikov). Haloalkane→alcohol: NaOH(aq)/heat (SN). Haloalkane→nitrile (+1C): KCN/ethanol/heat (SN). Haloalkane→amine: NH₃/ethanol/pressure (SN). 1°alcohol→aldehyde: K₂Cr₂O₇/H⁺/distil. 1°alcohol→carboxylic acid: K₂Cr₂O₇/H⁺/reflux. 2°alcohol→ketone: K₂Cr₂O₇/H⁺/reflux. Nitrile→carboxylic acid: H₂O/H⁺/reflux. Nitrile→amine: LiAlH₄/dry ether. Carboxylic acid→ester: ROH/H₂SO₄/reflux. Carboxylic acid→1°alcohol: LiAlH₄/dry ether.</p>'},
{lb:'Multi-step synthesis',dr:dQ2,ht:'<p>Example — propanenitrile from bromoethane (chain extension by 1C): CH₃CH₂Br+KCN→CH₃CH₂CN+KBr (SN; KCN/ethanol/heat). Then: CH₃CH₂CN+H₂O/H⁺/reflux→CH₃CH₂COOH (propanoic acid). Overall: 2-step; extends chain by 1C via CN⁻. Overall yield = product of step yields. Green chemistry: atom economy = Mr(product)/ΣMr(all products)×100. Addition (no byproduct) = 100% atom economy. Substitution (byproduct HX) = lower. Fewer steps = better yield; less waste.</p>'},
{lb:'Carboxylic acids and derivatives',dr:dQ1,ht:'<p>Carboxylic acids: weakly acidic; Na₂CO₃→CO₂ (confirmatory test). Esterification: RCOOH+ROH⇌RCOOR\'+H₂O (reversible; H₂SO₄ cat.; reflux). Improve yield: excess alcohol or remove water. Acyl chloride (RCOCl): more reactive; no catalyst needed; produces HCl. With H₂O→RCOOH+HCl. With ROH→RCOOR\'+HCl (ester, fast). With NH₃→RCONH₂+HCl (amide). Ester hydrolysis: acid/H₂O (reversible→acid+alcohol); NaOH/H₂O saponification (irreversible→carboxylate salt+alcohol). Amide hydrolysis: H₂O/H⁺ or H₂O/NaOH → acid/salt + amine/ammonium.</p>'},
{lb:'Green chemistry',dr:dQ2,ht:'<p>Green chemistry principles: (1) Atom economy: (Mr desired / ΣMr all products) × 100. Higher = less waste. (2) Catalytic vs stoichiometric reagents: catalysts preferred (regenerated; less waste). (3) Renewable feedstocks: plant-based vs petroleum. (4) Safer solvents: water preferred; avoid chlorinated solvents. (5) Energy efficiency: ambient temperature preferred. (6) Biodegradable products. Example comparison: CH₃COCl+ROH→ester+HCl (high yield, no catalyst, fast; but HCl byproduct → atom economy <100%); acid esterification (lower yield, catalyst, reversible; but H₂O byproduct less problematic; higher atom economy for desired ester). WAEC: evaluate using these criteria.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'To make propan-1-ol from 1-bromopropane in one step:',o:['Add KCN/ethanol/heat → nitrile (adds C — wrong product)','Add NaOH(aq)/heat → propan-1-ol by SN2 (OH⁻ replaces Br⁻)','Add NH₃/ethanol/pressure → propylamine','Add KOH/ethanol/heat → propene (elimination)'],a:2,w:'CH₃CH₂CH₂Br+NaOH(aq)/heat → CH₃CH₂CH₂OH+NaBr. OH⁻ acts as nucleophile in SN2; replaces Br⁻. Primary haloalkane → SN2 preferred. KOH/ethanol/heat would give elimination (propene) instead.'},{q:'Atom economy for CH₃COOH+C₂H₅OH→CH₃COOC₂H₅+H₂O [Mr: ester=88, H₂O=18]:',o:['100% (no byproduct)','83% (88/(88+18)×100)','50%','44%'],a:2,w:'Atom economy=(Mr desired product/ΣMr all products)×100=(88/(88+18))×100=88/106×100=83%. Water is eliminated as byproduct; its mass is wasted. Higher atom economy = less wasted mass per mole of desired product.'},{q:'KCN/ethanol/heat converts a haloalkane to a nitrile. This reaction is useful in synthesis because:',o:['It reduces the chain length by one carbon','It extends the carbon chain by one carbon (C from CN⁻)','It converts the C-X bond directly to a C-OH bond','It reduces the haloalkane to an alkane'],a:2,w:'CN⁻ (nucleophile) replaces X⁻ in SN reaction: RX+KCN→RCN+KX. The CN group adds ONE carbon to the chain. The nitrile can be hydrolysed to a carboxylic acid (RCOOH, +1C) or reduced to an amine (RCH₂NH₂, +1C). Key chain extension strategy.'},{q:'When propan-2-ol reacts with acidified K₂Cr₂O₇ under reflux, the product is:',o:['Propan-1-ol (structural isomer formed)','Propanal (primary alcohol → aldehyde)','Propanone (secondary alcohol → ketone)','Propanoic acid (secondary alcohol not oxidised to acid)'],a:3,w:'Propan-2-ol is a SECONDARY alcohol (OH on C2). Secondary alcohols → KETONE under oxidising conditions. Propan-2-ol + K₂Cr₂O₇/H⁺/reflux → propanone (CH₃COCH₃). Orange→green colour change. Ketone cannot be further oxidised by Cr₂O₇²⁻.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q7 \u2022 Chem \u2022 Y12',ti:'WAEC Prep — Organic Chemistry',su:'Practise WAEC-style organic chemistry questions.',steps:[
{lb:'WAEC organic essay structures',dr:dQ1,ht:'<p>WAEC organic essay structure: "Describe and explain the mechanism for electrophilic addition of HBr to ethene": (1) Name mechanism (electrophilic addition). (2) Show HBr polarised (Hδ⁺-Brδ⁻). (3) H⁺ (electrophile) attacks C=C π electrons → carbocation + Br⁻. (4) Br⁻ attacks carbocation → CH₃CH₂Br. "Distinguish SN1 from SN2": (1) Define each. (2) Primary=SN2; tertiary=SN1. (3) Rate equations. (4) Stereochemistry (inversion vs racemisation). "Describe tests to distinguish aldehyde from ketone": give reagent + observation + conclusion for each test (Tollens\', Fehling\'s, Cr₂O₇²⁻).</p>'},
{lb:'WAEC spectroscopy questions',dr:dQ2,ht:'<p>Spectroscopy WAEC types: (1) "Identify compound from data: Mr=X; IR at Y cm⁻¹; ¹H NMR shows..." → systematic analysis; propose structure; justify each piece. (2) "What IR absorptions would compound Z show?" → list wavenumbers with functional group. (3) "Predict the ¹H NMR spectrum of propanoic acid (CH₃CH₂COOH)" → 3 environments; shifts; integrations; splitting (CH₃: triplet, 3H; CH₂: quartet, 2H; COOH: singlet broad, 1H). (4) "Explain the fragment at m/z=43" → CH₃CO⁺ (acetyl cation; characteristic of methyl ketones). (5) "Why is the fingerprint region used to confirm identity?" → unique to each compound; match databases.</p>'},
{lb:'Common organic WAEC mistakes',dr:dQ1,ht:'<p>Common mistakes: Not naming mechanism type before drawing curly arrows. Drawing curly arrows from atoms instead of bonds/lone pairs. Saying Tollens\'/Fehling\'s positive for ketones (only aldehydes). Saying SN1 rate depends on [Nu] (SN1 rate=k[RX] only). Confusing addition (both atoms add across C=C) with substitution (one atom replaces another). Saying ester hydrolysis with NaOH gives free acid (it gives SALT). Not specifying conditions for each synthesis step. Iodoform: saying all ketones positive (only methyl ketones CH₃CO-). Not giving observation AND conclusion for chemical tests. Markovnikov: H goes to MORE substituted C (this is wrong — H goes to LESS substituted C to form MORE stable carbocation).</p>'},
{lb:'Practical organic skills',dr:dQ2,ht:'<p>Practical skills for WAEC: (1) Reflux vs distil: reflux keeps all material in flask (used for oxidation to acid or ester hydrolysis); distil removes volatile product as it forms (used for oxidation to aldehyde — prevents further oxidation). (2) Testing for alkene: use Br₂(aq) not Br₂/organic (bromine water is the standard reagent). (3) Identifying haloalkane: always hydrolyse first with NaOH(aq)/heat, then acidify, then add AgNO₃/EtOH. (4) Recrystallisation: purify solid product from hot solvent; filter hot to remove insoluble impurities; cool to crystallise; filter cold to collect crystals. (5) Always dry organic product over anhydrous Na₂SO₄ before distillation.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Compound X: Mr=60; IR broad O-H 2500-3300 cm⁻¹ and C=O 1710 cm⁻¹. ¹H NMR: singlet (3H, δ=2.1); singlet (1H, δ=11). X is:',o:['Propanal (CHO at δ=9-10; no broad O-H at 2500-3300)','Ethanoic acid (CH₃COOH, Mr=60; COOH→broad O-H+C=O; CH₃ singlet 3H δ=2.1; COOH singlet 1H δ=11)','Propan-1-ol (no C=O; O-H at 3200-3550 sharp)','Methyl methanoate (Mr=60; ester C=O ~1735, no O-H)'],a:2,w:'Broad O-H 2500-3300 + C=O ~1710 → CARBOXYLIC ACID (-COOH). Mr=60 + molecular formula → ethanoic acid (CH₃COOH, Mr=60). ¹H NMR: CH₃ singlet (3H, δ=2.1, isolated from other H); COOH singlet (1H, δ=11, characteristic). All data consistent.'},{q:'In free radical substitution, the propagation step:',o:['Requires UV light to proceed','Is the initiation — it generates the first radical','Consists of two chain-carrying steps that regenerate radicals; continues many times without UV','Is the termination — it ends the chain reaction'],a:3,w:'Propagation: two chain-carrying steps: (1) X•+RH→R•+HX; (2) R•+X₂→RX+X•. Radicals are consumed and regenerated in each cycle → chain reaction continues many times. UV is only needed for INITIATION. The chain propagates until two radicals meet (termination).'},{q:'Which reagent converts ethanol to ethanoic acid in one step?',o:['NaOH(aq)/heat (SN reaction)','K₂Cr₂O₇/H₂SO₄/reflux (oxidation; reflux keeps aldehyde in contact with oxidant → acid)','K₂Cr₂O₇/H₂SO₄/distil (stops at aldehyde — does not give acid)','LiAlH₄/dry ether (reduction, not oxidation)'],a:2,w:'Ethanol (primary alcohol) → ethanoic acid requires REFLUX (not distillation). Reflux keeps the aldehyde (ethanal) in contact with the oxidant K₂Cr₂O₇/H₂SO₄, allowing further oxidation to ethanoic acid. Distillation would remove ethanal before it can be oxidised further.'},{q:'For SN2 of 1-bromopropane + OH⁻ → propan-1-ol, the rate equation is:',o:['rate = k[OH⁻] only (concentration of haloalkane doesn\'t matter)','rate = k[CH₃CH₂CH₂Br][OH⁻] (bimolecular; both in transition state)','rate = k[CH₃CH₂CH₂Br] only (unimolecular)','rate = k[OH⁻]² (second order in OH⁻)'],a:2,w:'SN2 is bimolecular: one concerted step where BOTH the haloalkane AND the nucleophile are in the transition state. Rate = k[RX][Nu]. The concentration of BOTH species affects rate. This distinguishes SN2 from SN1 (rate = k[RX] only; concentration of Nu has no effect).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q8 \u2022 Chem \u2022 Y12',ti:'Structure Determination Practice',su:'Determine structures from combined spectroscopic data.',steps:[
{lb:'Systematic approach',dr:dQ2,ht:'<p>Structure determination: (1) MS: Mr from M⁺; check Cl/Br isotope patterns; major fragments. (2) Molecular formula (from exact MS or combustion analysis). DoU=(2C+2+N−H−X)/2. (3) IR: C=O? O-H? N-H? (4) ¹H NMR: number of peaks (H environments); integration (relative H); shifts (type of H); splitting (adjacent H by n+1). (5) ¹³C NMR: number of C environments; shifts. (6) Propose structure; verify all spectroscopic data against it; check molecular formula balances. WAEC: always show reasoning step by step.</p>'},
{lb:'Worked example — propanone',dr:dQ1,ht:'<p>Unknown B: Mr=58; base peak m/z=43 (M−15); IR: C=O 1715, no O-H. ¹H NMR: singlet (6H, δ=2.1). Analysis: M=58; m/z=43=CH₃CO⁺ (loss of CH₃, m=15) → methyl ketone. C=O at 1715 (ketone); no O-H → not alcohol or acid. 6H singlet at δ=2.1 (next to C=O): two equivalent CH₃ groups, no adjacent H (isolated) → singlet. Formula: Mr=58, DoU=1 (C=O), C₃H₆O (3×12+6+16=58 ✓). Structure: CH₃COCH₃ (propanone). All data consistent: 2 equivalent CH₃ groups (6H singlet); ketone C=O (1715); no O-H; M=58; base peak=43 ✓.</p>'},
{lb:'Worked example — ethanol',dr:dQ2,ht:'<p>Unknown C: Mr=46; IR: sharp O-H 3300 (no C=O). ¹H NMR: triplet (3H, δ=1.2); quartet (2H, δ=3.7); broad singlet (1H, δ=2.5). Analysis: Mr=46; sharp O-H but no C=O → alcohol. Total H: 3+2+1=6. Formula C₂H₆O (2×12+6+16=46 ✓), DoU=0 (fully saturated). Triplet 3H: CH₃ adj to CH₂ (n=2→t). Quartet 2H: CH₂ adj to CH₃ (n=3→q); δ=3.7 (adj to O). Broad singlet 1H: O-H (fast exchange). Structure: CH₃CH₂OH (ethanol). All data consistent ✓.</p>'},
{lb:'Worked example — ethanoic acid',dr:dQ1,ht:'<p>Unknown D: Mr=60; IR: broad O-H 2500-3300 + strong C=O ~1710. ¹H NMR: singlet (3H, δ=2.1); singlet (1H, δ=11.5). Analysis: broad O-H 2500-3300 + C=O ~1710 → COOH (carboxylic acid). Mr=60; formula C₂H₄O₂ (2×12+4+32=60 ✓), DoU=1. 3H singlet δ=2.1 = CH₃ adjacent to COOH (no adj H → singlet). 1H singlet δ=11.5 = COOH proton. Total H=4 (C₂H₄O₂ has 4H ✓). Structure: CH₃COOH (ethanoic acid). All data consistent ✓.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Unknown: Mr=74; IR: broad O-H 2500-3300 + C=O ~1710. ¹H NMR: triplet (3H,δ=1.1); quartet (2H,δ=2.4); singlet (1H,δ=11.5). The compound is:',o:['Butanone (Mr=72; no O-H)','Propanoic acid (CH₃CH₂COOH, Mr=74; COOH broad O-H+C=O; CH₃ triplet; CH₂ quartet; COOH singlet)','Propan-1-ol (Mr=60; O-H but no C=O)','Methyl propanoate (Mr=88; ester C=O ~1735, no O-H)'],a:2,w:'Broad O-H+C=O → carboxylic acid. Mr=74 → C₃H₆O₂ (propanoic acid, Mr=3×12+6+32=74 ✓). ¹H NMR: CH₃ (3H, triplet adj to CH₂); CH₂ (2H, quartet adj to CH₃, δ=2.4 next to COOH); COOH (1H, singlet δ=11.5). All consistent with CH₃CH₂COOH.'},{q:'Unknown: Mr=44; IR: C=O ~1720 (strong); ¹H NMR: quartet (1H, δ=9.8). No O-H in IR. The compound is:',o:['Propanone (Mr=58; singlet 6H, no δ=9.8 quartet)','Ethanal (CH₃CHO, Mr=44; C=O ~1720; CHO at δ=9-10 appears as quartet... actually doublet from CH₃)','Propanal (Mr=58)','Ethanol (Mr=46; has O-H; no C=O)'],a:2,w:'Mr=44; C=O ~1720 (aldehyde higher than ketone); no O-H → aldehyde. Formula C₂H₄O (Mr=44 ✓; DoU=1). CHO proton at δ=9.8 (quartet: adj to CH₃, n=3→quartet). CH₃ at δ=2.2 (doublet adj to CHO, n=1→doublet). = CH₃CHO (ethanal).'},{q:'How many ¹H NMR peaks (environments) does propanoic acid (CH₃CH₂COOH) show?',o:['1 peak (all H equivalent)','2 peaks (CH₃+CH₂ similar; COOH separate)','3 peaks (CH₃, CH₂, COOH — three different environments)','4 peaks'],a:3,w:'CH₃CH₂COOH: three distinct H environments. (1) CH₃: 3H, triplet, δ≈1.1 (adj to CH₂, n=2→t). (2) CH₂: 2H, quartet, δ≈2.4 (adj to CH₃, n=3→q; near COOH). (3) COOH: 1H, broad singlet, δ≈11 (O-H exchanges rapidly). Three peaks in the spectrum.'},{q:'DoU for ethanoic acid (CH₃COOH, C₂H₄O₂) =',o:['DoU=0 (fully saturated)','DoU=1 (one C=O double bond in COOH)','DoU=2 (COOH has one C=O and one O-H)','DoU=4 (aromatic)'],a:2,w:'DoU=(2C+2−H)/2=(2×2+2−4)/2=(4+2−4)/2=2/2=1. One degree of unsaturation = the C=O double bond in the -COOH group. The O-H is not a double bond — it does not contribute to DoU. DoU counts rings and π bonds only.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q9 \u2022 Chem \u2022 Y12',ti:'Mixed Organic and Spectroscopy',su:'Mixed questions covering all organic chemistry and spectroscopy topics.',steps:[
{lb:'Mixed organic summary',dr:dQ10,ht:'<p>Organic summary: Mechanisms: FRS (alkanes/UV); electrophilic addition (alkenes+Markovnikov); SN1 (tertiary; racemise); SN2 (primary; inversion); nucleophilic addition (C=O+HCN→hydroxynitrile); EAS (benzene+NO₂⁺→nitrobenzene). Tests: Tollens\'/Fehling\'s (aldehyde); Br₂(aq) (alkene); AgNO₃ (halide); Na₂CO₃ (COOH); iodoform (CH₃CO-). Synthesis: chain extension via KCN; reflux vs distil for oxidation. Spectroscopy: MS (Mr+frags); IR (C=O~1700, O-H broad/sharp); ¹H NMR (environments, shifts, n+1 splitting). Polymers: addition vs condensation; biodegradability. Amino acids: zwitterion; peptide bond; protein structure.</p>'},
{lb:'Connecting organic to other topics',dr:dQ10,ht:'<p>Connections: Organic mechanisms → rate equations (SN1: k[RX]; SN2: k[RX][Nu]). Organic oxidation → redox (OS change; OIL RIG). Organic spectroscopy → structure determination. Organic → thermodynamics (ΔH bond enthalpies; ΔG=ΔH−TΔS for spontaneity). Polymer chemistry → atom economy (green chemistry). Amino acids → pH/buffer (isoelectric point; zwitterion). Carbonyl reactions → equilibrium (esterification is reversible; Ka for acid dissociation). NMR splitting → counting adjacent H atoms → structural determination. Mechanism type → rate equation. All organic builds on understanding electron movement.</p>'},
{lb:'Exam technique for organic',dr:dQ1,ht:'<p>Exam technique: (1) Mechanism drawings: curly arrow from electron-rich TO electron-poor. Show ALL steps. Label intermediates. (2) Functional group tests: reagent → observation → conclusion. Never skip the conclusion. (3) Synthesis: give reagents AND conditions for EACH step. (4) Spectroscopy: DoU first; then IR for functional groups; then NMR for environments. (5) For "suggest structure": check molecular formula; check DoU; draw structure; verify ALL spectroscopic features. (6) For "explain": define; give mechanism; explain observation; conclude. (7) For synthesis evaluation: consider yield, atom economy, safety, environmental impact. (8) Learn conditions for ALL key reactions.</p>'},
{lb:'Reaction conditions summary',dr:dQ2,ht:'<p>Key conditions: FRS: UV light (initiates). Electrophilic addition: HX or X₂ (room temp; anhydrous). SN2: NaOH(aq) or KCN or NH₃; primary RX; reflux or pressure. SN1: tertiary RX; NaOH(aq); reflux. Elimination: KOH/ethanol (not aqueous); heat. Oxidation 1°→aldehyde: K₂Cr₂O₇/H₂SO₄; DISTIL off product. Oxidation 1°→acid: K₂Cr₂O₇/H₂SO₄; REFLUX. Oxidation 2°→ketone: K₂Cr₂O₇/H₂SO₄; reflux. Esterification: ROH+RCOOH; H₂SO₄ catalyst; reflux; equilibrium. Acyl chloride: RCOCl+Nu; room temp; fast; no catalyst. Saponification: NaOH(aq); reflux; irreversible. Hydrolysis of nitrile: H₂O/H⁺ or H₂O/OH⁻; reflux.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'The major product of propan-2-ol + acidified K₂Cr₂O₇/reflux is:',o:['Propan-1-ol (structural isomer)','Propanal (primary alcohol → aldehyde)','Propanone (secondary alcohol → ketone)','Propanoic acid (secondary → acid — this is wrong)'],a:3,w:'Propan-2-ol is a SECONDARY alcohol → oxidation gives a KETONE (propanone, CH₃COCH₃). Reflux keeps all material in flask. Orange Cr₂O₇²⁻ → green Cr³⁺ confirms oxidation. Ketones cannot be further oxidised by Cr₂O₇²⁻.'},{q:'SN2 proceeds with INVERSION of configuration because:',o:['The nucleophile attacks from the same side as the leaving group (retention)','The nucleophile attacks from the BACK (180° to leaving group) in one step — the three other groups invert like an umbrella','The carbocation intermediate allows attack from either side (racemisation)','The molecule rearranges to the most stable configuration'],a:2,w:'SN2: ONE concerted step. Nucleophile attacks from BACK (anti to C-X). As C-X breaks and C-Nu forms, the three remaining groups invert (Walden inversion — like umbrella in wind). Result: INVERSION of configuration at the chiral centre.'},{q:'A compound with molecular formula C₃H₆O (Mr=58, DoU=1) shows IR: C=O ~1720 (no O-H); ¹H NMR: doublet (3H,δ=1.1); sextet (1H,δ=2.5); doublet (3H,δ=1.0)... no wait — actually triplet(3H,δ=0.9), quartet(2H,δ=2.4), triplet(1H,δ=9.7). It is:',o:['Propanone — singlet 6H','Propanal — triplet(CH₃), quartet(CH₂), doublet/singlet(CHO)','Methyloxirane (ring, no C=O IR signal)','Prop-2-en-1-ol (has O-H; different NMR)'],a:2,w:'DoU=1; C=O ~1720 (no O-H) → ALDEHYDE (higher wavenumber than ketone; not acid — no broad O-H). ¹H NMR: CHO at δ=9.7 (1H); CH₂ quartet at δ=2.4 (2H); CH₃ triplet at δ=0.9 (3H). = CH₃CH₂CHO (propanal, Mr=58 ✓).'},{q:'The repeat unit of PET (poly(ethylene terephthalate)) contains:',o:['Amide links (-CO-NH-) — polyamide','Ester links (-COO-) — from diol + diacid condensation','C-C links only — addition polymer','Ether links (-O-) — from two alcohols'],a:2,w:'PET = polyESTER. Made from ethane-1,2-diol (HO-CH₂CH₂-OH, diol) + benzene-1,4-dicarboxylic acid (diacid) by condensation → ESTER links (-COO-) + H₂O. Used in plastic bottles and polyester fibres. The ester bonds can be hydrolysed — useful for chemical recycling.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q10 \u2022 Chem \u2022 Y12',ti:'Final Revision — Organic and Spectroscopy',su:'Comprehensive final revision across all organic and spectroscopy topics.',steps:[
{lb:'Complete summary',dr:dQ10,ht:'<p>Organic & Spectroscopy complete summary: Mechanisms: FRS; electrophilic addition (Markovnikov); SN1/SN2; nucleophilic addition (HCN→hydroxynitrile); EAS (benzene). Tests: Tollens\'/Fehling\'s (aldehyde); Br₂(aq) (alkene); AgNO₃/EtOH (halide); Na₂CO₃ (COOH); iodoform (CH₃CO-); phenol (FeCl₃ purple). Spectroscopy: MS=Mr+fragments; IR=C=O(~1700-1735); O-H acid(broad 2500-3300) vs alcohol(sharp 3200-3550); ¹H NMR = environments+shifts+n+1 splitting. Polymers: addition (non-biodegradable) vs condensation (polyester/polyamide). Amino acids: zwitterion; peptide bond formation and hydrolysis; protein structure levels.</p>'},
{lb:'All spectroscopy rules',dr:dQ10,ht:'<p>Spectroscopy rules to memorise: MS: M⁺=Mr; m/z=43→CH₃CO⁺; m/z=77→C₆H₅⁺; Cl→3:1; Br→1:1. IR: C=O: ester 1735 > ketone 1715 > acid 1710 > amide 1690. O-H acid: 2500-3300 broad. O-H alcohol: 3200-3550 sharp. N-H: 3300-3500. NMR shifts (δ): COOH 10-13; CHO 9-10; ArH 6-8; alkene 4.5-5.5; O-CH 3.5-4.5; next to C=O 2-2.5; alkyl 0-1.5. n+1 rule: singlet (0 adj); doublet (1); triplet (2); quartet (3). Equivalent H do not split each other. DoU=(2C+2+N−H−X)/2.</p>'},
{lb:'Exam checklist',dr:dQ1,ht:'<p>Organic exam checklist: ✓ Know all 7 mechanism types (name; reagent; substrate; product). ✓ Know all chemical tests (reagent + observation + conclusion). ✓ Know all reaction conditions (reflux vs distil; catalyst; temperature; solvent). ✓ Know SN1 vs SN2 (substrate; steps; rate; stereochemistry). ✓ Know functional group interconversions (1° alcohol → aldehyde → carboxylic acid; 2° → ketone; tertiary → no oxidation). ✓ Know spectroscopy rules (MS, IR, NMR — as listed above). ✓ Know polymer types (addition vs condensation; monomers; links; biodegradability). ✓ Know amino acid chemistry (zwitterion; peptide bond; protein structure). ✓ Know green chemistry (atom economy formula; catalysis; renewable feedstocks).</p>'},
{lb:'WAEC final tips — organic',dr:dQ10,ht:'<p>WAEC final tips: (1) For mechanisms: ALWAYS draw curly arrows from lone pair/bond toward electrophilic/positive centre. (2) For "suggest reagents and conditions": name BOTH reagent (what chemical) AND conditions (temperature, catalyst, solvent). (3) Reflux vs distil: if product is more volatile than reactant and would be over-oxidised if left → distil. (4) For spectroscopy identification: never jump to answer — show step-by-step reasoning. (5) For polymer questions: identify the functional groups in each monomer; predict the type of link formed; give the name (polyester/polyamide/polyalkene). (6) For amino acid questions: draw the zwitterion at isoelectric point; show the peptide bond formation with loss of H₂O. (7) Always check your proposed structure gives the correct molecular formula and Mr.</p>'},
{lb:'Your turn',dr:dQ10,ht:tryIt(function(){var qs=[{q:'Which sequence correctly oxidises ethanol all the way to ethanoic acid?',o:['KMnO₄/H⁺/distil → stops at ethanal','K₂Cr₂O₇/H₂SO₄/REFLUX → ethanoic acid (primary alcohol under reflux goes to carboxylic acid)','LiAlH₄/dry ether (reduces, not oxidises)','Na₂CO₃(aq) (neutralises acid but doesn\'t oxidise alcohol)'],a:2,w:'K₂Cr₂O₇/H₂SO₄/REFLUX: reflux keeps ethanal in contact with oxidant → further oxidised to ethanoic acid. If distillation used, ethanal removed before further oxidation → stops at aldehyde. For full oxidation to acid: always REFLUX.'},{q:'In ¹H NMR of ethanal (CH₃CHO): the CHO proton appears as a:',o:['Singlet (no adjacent H)','Doublet (adjacent to CH₃ — n=3 adj H? Wait: CH₃ adj to CHO means n for CHO = 3 H of CH₃)','Quartet (adj to 3H of CH₃ — CORRECT n=3→quartet)','Triplet'],a:3,w:'CHO proton in CH₃CHO: adjacent to CH₃ (3 equivalent H, n=3). n+1=4 → QUARTET at δ≈9.8. The CH₃ group (adj to CHO, n=1) → doublet at δ≈2.2. This quartet/doublet pattern distinguishes an acetaldehyde (CH₃CHO) from other aldehydes.'},{q:'For the reaction of propene + HBr, Markovnikov\'s rule predicts the MAJOR product is:',o:['1-bromopropane (Br on C1 — secondary carbocation on C2)','2-bromopropane (Br on C2 — more stable secondary carbocation on C2 after H adds to C1)','An equal mixture of 1-bromopropane and 2-bromopropane','3-bromopropane'],a:2,w:'Markovnikov: H⁺ adds to C1 (has 2H → less substituted), forming the MORE STABLE secondary carbocation on C2. Br⁻ then attacks C2 → 2-bromopropane (major). 1-bromopropane (minor) comes from H adding to C2, forming less stable primary C1 carbocation.'},{q:'Atom economy for the Diels-Alder reaction (one-step; cycloaddition; no byproduct):',o:['0% (completely inefficient)','50% (half the atoms wasted)','83% (similar to esterification)','100% (all atoms from reactants appear in the single product)'],a:4,w:'Diels-Alder is a cycloaddition: diene + dienophile → cyclohexene. No byproduct — ALL atoms from both reactants are incorporated in the product. Atom economy = Mr(product)/ΣMr(reactants)×100 = 100%. This is why cycloadditions are highly valued in green chemistry.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
