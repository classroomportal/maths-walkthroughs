<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Preparation and Properties of Hydrogen',[['Property','Detail'],['Preparation','Zn + dilute HCl \u2192 ZnCl2 + H2'],['Test','Lit splint gives squeaky pop'],['Uses','Margarine manufacture, rocket fuel']]);}
function dQ2(p){drawTable(p,'Preparation and Properties of Oxygen',[['Property','Detail'],['Preparation','Decomposition of H2O2 with MnO2 catalyst'],['Test','Relights a glowing splint'],['Uses','Respiration, welding, medical use']]);}
function dQ3(p){drawTable(p,'Properties of Water',[['Property','Detail'],['Formula','H2O'],['Test for water','Turns anhydrous CuSO4 blue, cobalt chloride paper pink'],['Importance','Universal solvent, essential for life']]);}
function dQ4(p){drawTable(p,'Carbon and Its Compounds',[['Form/Compound','Property'],['Diamond','Hardest natural substance'],['Graphite','Soft, conducts electricity'],['CO2','Turns limewater milky'],['CO','Toxic, incomplete combustion product']]);}
function dQ5(p){drawTable(p,'Nitrogen and Ammonia',[['Property','Detail'],['N2','Inert, 78% of air'],['NH3 preparation','Haber process, N2+3H2\u21cc2NH3'],['NH3 test','Turns damp red litmus blue']]);}
function dQ6(p){drawTable(p,'Sulfur and Sulfuric Acid',[['Property','Detail'],['Sulfur','Yellow solid, forms SO2 on burning'],['H2SO4','Dense, oily liquid, strong dehydrating agent'],['Uses','Fertilisers, batteries, detergents']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Hydrogen \u2014 Preparation, Properties and Uses',su:'Examine the laboratory preparation, properties and industrial uses of hydrogen.',steps:[
{lb:'Laboratory preparation of hydrogen',dr:dQ1,ht:'<p>Hydrogen gas is prepared in the laboratory by reacting a REACTIVE metal (e.g. zinc) with a dilute ACID: Zn + 2HCl \u2192 ZnCl2 + H2. The gas is collected by DOWNWARD DISPLACEMENT OF WATER (since hydrogen is not very soluble in water) or upward delivery (since hydrogen is less dense than air).</p>'},
{lb:'Testing for hydrogen',dr:dQ1,ht:'<p>Hydrogen gas is confirmed using the SQUEAKY POP TEST: a lighted splint is held at the mouth of the test tube containing the gas; hydrogen burns rapidly with a characteristic "squeaky pop" sound as it reacts explosively with oxygen in the air (2H2 + O2 \u2192 2H2O).</p>'},
{lb:'Properties and uses of hydrogen',dr:dQ1,ht:'<p>Hydrogen is a colourless, odourless gas, less dense than air, and highly FLAMMABLE. Industrial uses: manufacture of margarine (hydrogenation of vegetable oils, converting C=C double bonds to single bonds using a nickel catalyst), production of ammonia (Haber process), and as a clean-burning rocket fuel (produces only water as a by-product).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Hydrogen gas produced in the laboratory is confirmed using which test?',o:['A glowing splint relighting','A lit splint producing a squeaky pop sound as the gas burns','Limewater turning milky','Damp litmus paper turning blue'],a:2,w:'The squeaky pop test is the standard confirmatory test for hydrogen gas: a lit splint held near the gas causes it to burn rapidly with a characteristic popping sound, as hydrogen reacts explosively with oxygen.'},{q:'Hydrogen gas is used industrially to convert vegetable oils into margarine through a process called:',o:['Fermentation','Hydrogenation \u2014 hydrogen adds across the C=C double bonds present in the oil, using a nickel catalyst','Neutralisation','Distillation'],a:2,w:'Hydrogenation is an addition reaction where hydrogen gas (with a nickel catalyst) adds across the C=C double bonds in unsaturated vegetable oils, converting them into saturated fats (margarine) with a higher melting point.'},{q:'Zinc reacting with dilute hydrochloric acid (Zn+2HCl\u2192ZnCl2+H2) is a standard laboratory method for preparing:',o:['Oxygen gas','Hydrogen gas \u2014 a reactive metal reacting with a dilute acid','Carbon dioxide gas','Chlorine gas'],a:2,w:'This is the classic metal+acid\u2192salt+hydrogen reaction, used as a standard laboratory preparation method for hydrogen gas, collected by downward displacement of water or upward delivery.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Oxygen \u2014 Preparation, Properties and Uses',su:'Examine the laboratory preparation, properties and industrial uses of oxygen.',steps:[
{lb:'Laboratory preparation of oxygen',dr:dQ2,ht:'<p>Oxygen gas is prepared in the laboratory by the CATALYTIC DECOMPOSITION of hydrogen peroxide, using manganese(IV) oxide (MnO2) as a catalyst: 2H2O2 \u2192 2H2O + O2. The MnO2 speeds up the decomposition without being used up itself, and the gas is collected by downward displacement of water.</p>'},
{lb:'Testing for oxygen',dr:dQ2,ht:'<p>Oxygen gas is confirmed using the GLOWING SPLINT TEST: a glowing (not flaming) wooden splint is inserted into the test tube containing the gas; if oxygen is present, the splint RELIGHTS (bursts back into flame), since oxygen supports combustion vigorously.</p>'},
{lb:'Properties and uses of oxygen',dr:dQ2,ht:'<p>Oxygen is a colourless, odourless gas that SUPPORTS combustion (though it does not burn itself) and is essential for RESPIRATION in living organisms. Industrial uses: medical oxygen supply (for patients with breathing difficulties), oxy-acetylene welding/cutting (produces very high temperature flames), and as an oxidiser in rocket fuel.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'A glowing splint bursts back into flame when inserted into a test tube of gas. This confirms the gas is:',o:['Hydrogen','Oxygen \u2014 the standard positive test for oxygen, since it supports combustion vigorously','Carbon dioxide','Nitrogen'],a:2,w:'The relighting of a glowing splint is the standard confirmatory test for oxygen gas, since oxygen supports combustion strongly enough to reignite a splint that is only glowing (not actively flaming).'},{q:'In the laboratory preparation of oxygen from hydrogen peroxide (2H2O2\u21922H2O+O2), manganese(IV) oxide acts as a:',o:['Reactant that is used up','Catalyst \u2014 it speeds up the decomposition of hydrogen peroxide without being consumed itself','Product of the reaction','Solvent'],a:2,w:'Manganese(IV) oxide catalyses the decomposition of hydrogen peroxide, speeding up the reaction significantly without itself being chemically changed or consumed \u2014 it can be recovered unchanged after the reaction.'},{q:'Oxygen gas is essential for which key biological process?',o:['Photosynthesis only','Respiration \u2014 living organisms use oxygen to release energy from food','Fermentation','Nitrogen fixation'],a:2,w:'Oxygen is essential for (aerobic) respiration, the process by which living organisms break down food molecules (like glucose) to release energy for cellular activities, producing carbon dioxide and water as by-products.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Water \u2014 Properties, Tests and Importance',su:'Examine the properties and chemical tests for water.',steps:[
{lb:'Testing for the presence of water',dr:dQ3,ht:'<p>Two standard chemical tests confirm the presence of WATER: (1) ANHYDROUS COPPER(II) SULFATE (white powder) turns BLUE when water is added (forms hydrated copper sulfate, CuSO4.5H2O). (2) ANHYDROUS COBALT(II) CHLORIDE PAPER (blue) turns PINK when water is added. These tests confirm water is present but do NOT confirm the water is PURE (pure water additionally has a specific boiling point of exactly 100\u00b0C at standard pressure).</p>'},
{lb:'Testing for PURE water',dr:dQ3,ht:'<p>To confirm water is PURE (not just present), its BOILING POINT must be measured: pure water boils at EXACTLY 100\u00b0C at standard atmospheric pressure. Dissolved impurities RAISE the boiling point slightly (boiling point elevation) and LOWER the freezing point (freezing point depression) \u2014 so a boiling point noticeably different from 100\u00b0C indicates impurities are present.</p>'},
{lb:'Importance of water',dr:dQ3,ht:'<p>Water is often called the "universal solvent" since it dissolves a very wide range of substances (ionic compounds, polar covalent molecules), due to its POLAR nature. Water is essential for all known life, acts as a medium for chemical reactions in cells, and is important industrially as a solvent, coolant, and reactant (e.g. in hydration reactions).</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Anhydrous copper(II) sulfate is used to test for the presence of water. A positive result is:',o:['The powder stays white','The white powder turns BLUE, as water molecules combine with it to form hydrated copper sulfate','The powder dissolves completely with no colour change','The powder turns black'],a:2,w:'Anhydrous copper(II) sulfate is white; when water is added, it absorbs the water molecules to form blue hydrated copper sulfate (CuSO4.5H2O) \u2014 this distinctive colour change is the standard positive test for the presence of water.'},{q:'Testing with anhydrous copper sulfate shows a sample contains water, but does NOT confirm the water is pure. To confirm PURITY, you should additionally check:',o:['The colour of the sample','The boiling point of the sample \u2014 pure water boils at exactly 100\u00b0C at standard pressure; dissolved impurities raise this value','The smell of the sample','Whether the sample is a liquid'],a:2,w:'While copper sulfate/cobalt chloride tests confirm water is PRESENT, they cannot confirm purity, since even a small amount of water would give a positive result. Purity is confirmed by measuring the boiling point precisely \u2014 pure water boils at exactly 100\u00b0C at standard atmospheric pressure, while dissolved impurities raise this boiling point.'},{q:'Water is often described as a "universal solvent" because:',o:['It never dissolves anything','Its polar nature allows it to dissolve a very wide range of ionic and polar covalent substances','It is always found in a pure state','It has no chemical properties at all'],a:2,w:'Water molecules are polar (having a slightly positive and slightly negative end), which allows water to effectively surround and dissolve many ionic compounds and other polar substances, earning it the description "universal solvent" due to the sheer range of substances it can dissolve.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Carbon and Its Oxides',su:'Examine the allotropes of carbon and the properties of carbon dioxide and carbon monoxide.',steps:[
{lb:'Allotropes of carbon',dr:dQ4,ht:'<p>Carbon exists in different structural forms called ALLOTROPES, with very different properties despite being the same element: DIAMOND (each C bonded to 4 others, giant covalent, extremely hard, does not conduct electricity, used in cutting tools/jewellery) and GRAPHITE (each C bonded to 3 others in layers, soft/slippery, conducts electricity, used in pencils/electrodes/lubricants).</p>'},
{lb:'Carbon dioxide (CO2)',dr:dQ4,ht:'<p>Carbon dioxide is produced by COMPLETE combustion of carbon-containing fuels (in excess oxygen), by respiration, and by thermal decomposition of carbonates. It is tested for using LIMEWATER (calcium hydroxide solution), which turns MILKY/CLOUDY in the presence of CO2 (forms insoluble calcium carbonate precipitate: Ca(OH)2 + CO2 \u2192 CaCO3 + H2O).</p>'},
{lb:'Carbon monoxide (CO)',dr:dQ4,ht:'<p>Carbon monoxide forms from INCOMPLETE combustion (insufficient oxygen supply) of carbon-containing fuels. It is a colourless, ODOURLESS, highly TOXIC gas \u2014 it binds to haemoglobin in the blood far more strongly than oxygen does, preventing the blood from carrying oxygen effectively, which can be fatal. This is why good ventilation is essential when burning fuels indoors.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Diamond and graphite are both forms of pure carbon but have very different properties because:',o:['They are actually different elements','They have different structural arrangements of carbon atoms (allotropes) \u2014 diamond has each C bonded to 4 others, graphite has each C bonded to only 3, in layers','Diamond contains oxygen atoms while graphite does not','Graphite is not actually made of carbon'],a:2,w:'Diamond and graphite are allotropes of carbon \u2014 the same element arranged in different structures. Diamond\'s rigid 3D network (4 bonds per carbon) makes it extremely hard, while graphite\'s layered structure (3 bonds per carbon, with delocalised electrons) makes it soft and able to conduct electricity.'},{q:'Which gas is produced by the INCOMPLETE combustion of a carbon-containing fuel (insufficient oxygen)?',o:['Carbon dioxide only','Carbon monoxide \u2014 a toxic, colourless, odourless gas formed when oxygen supply is insufficient for complete combustion','Oxygen gas','Hydrogen gas'],a:2,w:'When there is not enough oxygen for complete combustion, carbon monoxide (CO) forms instead of (or alongside) carbon dioxide. CO is particularly dangerous because it is colourless and odourless, yet highly toxic.'},{q:'Why is carbon monoxide particularly dangerous to human health?',o:['It has a strong, easily detectable smell that warns people of its presence','It binds to haemoglobin in the blood more strongly than oxygen does, preventing the blood from carrying oxygen effectively around the body','It is not actually toxic at all','It only affects plants, not humans'],a:2,w:'Carbon monoxide binds to haemoglobin (the oxygen-carrying molecule in red blood cells) much more strongly than oxygen does, effectively blocking the blood\'s ability to transport oxygen. Combined with being colourless and odourless (undetectable without special equipment), this makes CO a serious, often unnoticed health hazard.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Nitrogen and Ammonia',su:'Examine the properties of nitrogen gas and the preparation/properties of ammonia.',steps:[
{lb:'Nitrogen gas',dr:dQ5,ht:'<p>Nitrogen (N2) makes up about 78% of the AIR by volume. It is a colourless, odourless, largely UNREACTIVE (inert) gas at normal temperatures, due to the very strong triple bond (N\u2261N) between its two nitrogen atoms, which requires a large amount of energy to break. This inertness is why nitrogen is used to provide a non-reactive atmosphere in food packaging (preventing oxidation/spoilage) and in some fire extinguishers.</p>'},
{lb:'Preparation of ammonia (Haber process)',dr:dQ5,ht:'<p>Ammonia (NH3) is manufactured industrially by the HABER PROCESS: N2(g) + 3H2(g) \u21cc 2NH3(g), using an iron catalyst at 450\u00b0C and 200 atmospheres pressure. This exothermic, reversible reaction converts unreactive nitrogen gas into a much more useful, reactive compound for fertiliser manufacture.</p>'},
{lb:'Properties and testing for ammonia',dr:dQ5,ht:'<p>Ammonia is a colourless gas with a characteristic PUNGENT (sharp, unpleasant) smell, and is very SOLUBLE in water, forming an ALKALINE solution (ammonium hydroxide). It is tested for using DAMP RED LITMUS PAPER, which turns BLUE in the presence of ammonia gas (confirming its alkaline nature).</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Nitrogen gas (N2) is largely unreactive at normal temperatures mainly because:',o:['It has no atoms at all','The triple bond (N\u2261N) between the two nitrogen atoms is very strong, requiring a large amount of energy to break before nitrogen can react','Nitrogen is a metal','Nitrogen has no electrons'],a:2,w:'The N\u2261N triple bond in nitrogen gas is exceptionally strong, requiring a significant amount of energy to break. This high bond strength is the main reason nitrogen gas is so unreactive under normal conditions, despite nitrogen being an essential element for life.'},{q:'Damp red litmus paper turns blue when exposed to a gas. This gas is most likely:',o:['Carbon dioxide','Hydrogen','Ammonia \u2014 its alkaline nature turns damp red litmus paper blue','Oxygen'],a:2,w:'Ammonia gas dissolves in the moisture on damp red litmus paper to form an alkaline solution, turning the litmus from red to blue \u2014 this colour change is the standard test used to confirm the presence of ammonia gas.'},{q:'The Haber process (N2+3H2\u21cc2NH3) is significant because it:',o:['Converts unreactive nitrogen gas into ammonia, a much more chemically useful compound essential for fertiliser production','Produces oxygen gas from nitrogen','Has no industrial importance','Only works using nitrogen from living organisms'],a:2,w:'The Haber process allows industrial conversion of abundant but chemically inert nitrogen gas (from the air) into ammonia, a reactive compound that can be further processed into nitrogen-based fertilisers essential for modern agriculture and global food production.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'Sulfur and Sulfuric Acid',su:'Examine the properties of sulfur and the manufacture/uses of sulfuric acid.',steps:[
{lb:'Properties of sulfur',dr:dQ6,ht:'<p>Sulfur is a bright YELLOW, brittle SOLID, insoluble in water. When burned in air/oxygen, sulfur produces SULFUR DIOXIDE (SO2), a colourless gas with a sharp, choking smell that is a major contributor to ACID RAIN when released into the atmosphere from burning fossil fuels containing sulfur impurities.</p>'},
{lb:'Manufacture of sulfuric acid (Contact Process)',dr:dQ6,ht:'<p>Sulfuric acid is manufactured industrially by the CONTACT PROCESS: (1) sulfur is burned to form SO2. (2) SO2 is catalytically oxidised to SO3 (using a vanadium(V) oxide catalyst): 2SO2 + O2 \u2192 2SO3. (3) SO3 is dissolved in concentrated sulfuric acid (not water directly, to avoid a dangerous acid mist) to form oleum, which is then carefully diluted with water to produce concentrated sulfuric acid.</p>'},
{lb:'Properties and uses of sulfuric acid',dr:dQ6,ht:'<p>Concentrated sulfuric acid is a dense, oily, colourless liquid and a powerful DEHYDRATING AGENT (removes water, even chemically combined water, from other substances \u2014 e.g. it can char sugar by removing the hydrogen and oxygen as water, leaving behind carbon). Major industrial uses: manufacture of fertilisers (e.g. ammonium sulfate), car batteries (dilute sulfuric acid as the electrolyte), and detergents.</p>'},
{lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Burning sulfur in air produces which gas, a major contributor to acid rain?',o:['Carbon dioxide','Sulfur dioxide (SO2) \u2014 a sharp-smelling gas released when sulfur or sulfur-containing fuels are burned','Nitrogen gas','Hydrogen gas'],a:2,w:'Burning sulfur (or fuels containing sulfur impurities, like some coal) produces sulfur dioxide gas, which dissolves in atmospheric moisture to form sulfurous/sulfuric acid \u2014 a major contributor to acid rain and its associated environmental damage.'},{q:'In the Contact Process for manufacturing sulfuric acid, sulfur trioxide (SO3) is dissolved in CONCENTRATED SULFURIC ACID rather than directly in water, mainly because:',o:['SO3 does not dissolve in water at all','Dissolving SO3 directly in water would produce a dangerous, hard-to-control acid mist; dissolving it in concentrated sulfuric acid first (forming oleum) is safer and more controllable','Water is too expensive to use industrially','This step has no real purpose'],a:2,w:'SO3 reacts very vigorously and exothermically with water, producing a hazardous corrosive mist that is difficult to control safely. Instead, SO3 is first dissolved in concentrated sulfuric acid to form oleum, which can then be safely and controllably diluted with water to produce the required concentration of sulfuric acid.'},{q:'Concentrated sulfuric acid can char sugar, turning it black, because sulfuric acid acts as a:',o:['Reducing agent','Powerful dehydrating agent \u2014 it removes water (including chemically combined hydrogen and oxygen) from the sugar, leaving behind carbon','Weak acid with no significant chemical effect','Catalyst only'],a:2,w:'Concentrated sulfuric acid is such a powerful dehydrating agent that it can remove hydrogen and oxygen (in the ratio found in water) from sugar molecules themselves, leaving behind a blackened mass of carbon \u2014 a dramatic demonstration of its dehydrating power.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
