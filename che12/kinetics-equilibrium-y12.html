:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Factors Affecting Rate of Reaction',[['Factor','Effect on rate'],['Increase temperature','Rate increases'],['Increase concentration','Rate increases'],['Increase surface area','Rate increases'],['Add catalyst','Rate increases']]);}
function dQ2(p){drawTable(p,'Collision Theory Requirements',[['Requirement','Explanation'],['Particles must collide','No reaction without contact'],['Correct orientation','Particles must collide the right way round'],['Sufficient energy','Must meet or exceed activation energy']]);}
function dQ3(p){drawTable(p,'Measuring Rate of Reaction',[['Method','What is measured'],['Gas volume produced','Volume vs time (gas syringe)'],['Mass loss','Mass vs time (if gas escapes)'],['Precipitate/turbidity','Time for cross to disappear (X marks spot method)']]);}
function dQ4(p){drawTable(p,'Reversible Reactions and Equilibrium',[['Feature','Meaning'],['Reversible','Can go forward and backward'],['Dynamic equilibrium','Forward rate = backward rate'],['Closed system','No substances escape or enter']]);}
function dQ5(p){drawTable(p,'Le Chatelier\u2019s Principle \u2014 Basic',[['Change','Effect on equilibrium'],['Add more reactant','Shifts towards products'],['Remove product','Shifts towards products'],['Increase temperature','Shifts in endothermic direction']]);}
function dQ6(p){drawTable(p,'WAEC Kinetics and Equilibrium Summary',[['Concept','Key point'],['Rate','How fast reactants are used up/products formed'],['Collision theory','Need collision + energy + orientation'],['Equilibrium','Forward rate = reverse rate, concentrations constant']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Factors Affecting Rate of Reaction',su:'Examine how temperature, concentration, surface area and catalysts affect reaction rate.',steps:[
{lb:'What is rate of reaction',dr:dQ1,ht:'<p><b>Rate of reaction</b> = how quickly reactants are used up or products are formed, usually measured as a change in quantity (mass, volume, concentration) per unit TIME. A FASTER reaction uses up reactants / forms products more quickly (steeper graph, shorter time).</p>'},
{lb:'Temperature and concentration',dr:dQ1,ht:'<p>INCREASING TEMPERATURE increases rate \u2014 particles move faster, colliding MORE OFTEN and with MORE ENERGY (more collisions exceed the activation energy). INCREASING CONCENTRATION (of a dissolved reactant) increases rate \u2014 more particles are packed into the same volume, leading to more frequent collisions between reacting particles.</p>'},
{lb:'Surface area and catalysts',dr:dQ1,ht:'<p>INCREASING SURFACE AREA (smaller pieces of a solid reactant) increases rate \u2014 more particles are exposed at the surface, available to collide with other reactants. Adding a CATALYST increases rate WITHOUT being used up itself \u2014 it provides an alternative reaction pathway with LOWER activation energy, so more collisions have sufficient energy to react successfully.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Crushing a solid reactant into smaller pieces before a reaction will:',o:['Decrease the rate of reaction','Increase the rate of reaction, since more particles are exposed at the surface, available to collide with other reactants','Have no effect on rate at all','Only affect gas reactions'],a:2,w:'Smaller pieces have a greater total SURFACE AREA relative to their volume, exposing more particles at the surface where collisions with other reactants can occur, increasing the rate of reaction.'},{q:'A catalyst increases the rate of reaction by:',o:['Being permanently used up in the reaction','Providing an alternative reaction pathway with a LOWER activation energy, allowing more collisions to have sufficient energy to react successfully','Increasing the temperature of the reaction mixture','Increasing the concentration of reactants'],a:2,w:'A catalyst works by providing a different route for the reaction with a lower activation energy barrier. This means a greater proportion of collisions now have enough energy to react successfully, increasing the rate, without the catalyst itself being consumed.'},{q:'Increasing the concentration of a dissolved reactant increases the rate of reaction because:',o:['The particles become larger','More reactant particles are packed into the same volume, increasing the frequency of collisions between reacting particles','Concentration has no effect on rate','The temperature automatically rises'],a:2,w:'A higher concentration means there are more reactant particles present in a given volume of solution. This increases how often reactant particles collide with each other, which increases the overall rate of successful reactions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Collision Theory',su:'Use collision theory to explain why reactions occur and why rate factors have their effects.',steps:[
{lb:'The three requirements for a successful collision',dr:dQ2,ht:'<p><b>Collision theory</b> states that for a reaction to occur, particles must: (1) COLLIDE with each other (no reaction without contact). (2) Collide with SUFFICIENT ENERGY \u2014 at least the ACTIVATION ENERGY (Ea), the minimum energy needed to break existing bonds and start forming new ones. (3) Collide with the correct ORIENTATION (particles must be aligned in a way that allows the reactive parts to actually meet and interact).</p>'},
{lb:'Explaining rate factors using collision theory',dr:dQ2,ht:'<p>Collision theory explains WHY each rate factor works: higher temperature \u2192 particles move faster \u2192 MORE FREQUENT collisions AND a greater proportion have energy \u2265 Ea. Higher concentration/surface area \u2192 MORE FREQUENT collisions (more particles available to collide). Catalyst \u2192 LOWERS Ea, so a greater proportion of existing collisions now have sufficient energy to react (frequency of collisions is unchanged, but more of them are successful).</p>'},
{lb:'Not all collisions lead to reaction',dr:dQ2,ht:'<p>It is important to understand that MOST collisions between particles do NOT result in a reaction \u2014 only those with sufficient energy (\u2265Ea) AND correct orientation are successful. This is why increasing the FREQUENCY of collisions (concentration, surface area) increases rate, but increasing temperature has an even BIGGER effect \u2014 it increases both the frequency of collisions AND the proportion of collisions that have enough energy to succeed.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'According to collision theory, for a reaction to occur, particles must collide with:',o:['Any amount of energy, regardless of orientation','Sufficient energy (at least the activation energy) AND the correct orientation','Only the correct orientation, energy is irrelevant','No requirements at all, any collision succeeds'],a:2,w:'Collision theory states that a successful, reaction-producing collision requires BOTH sufficient energy (meeting or exceeding the activation energy) AND the correct orientation of the colliding particles \u2014 collisions lacking either condition do not result in a reaction.'},{q:'Why does increasing temperature have a particularly large effect on reaction rate, according to collision theory?',o:['Temperature only affects collision frequency, not energy','Temperature increases BOTH the frequency of collisions AND the proportion of those collisions that have sufficient energy (\u2265Ea) to react successfully','Temperature has no real effect on particle behaviour','Temperature only affects orientation of particles'],a:2,w:'Increasing temperature makes particles move faster, which increases how OFTEN they collide, AND increases the proportion of those collisions that have enough energy to overcome the activation energy \u2014 this dual effect is why temperature has such a strong influence on reaction rate.'},{q:'Why do most particle collisions NOT result in a chemical reaction?',o:['All collisions always result in reaction','Most collisions either lack sufficient energy (below Ea) or have incorrect orientation, so they do not lead to successful bond rearrangement','Particles never actually collide in a reaction mixture','Reactions only occur without any collisions'],a:2,w:'Collision theory explains that only a small fraction of collisions meet BOTH requirements (sufficient energy AND correct orientation) needed for a successful reaction. The vast majority of collisions either lack enough energy or occur at the wrong angle/alignment, and simply result in particles bouncing apart unreacted.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Measuring Rate of Reaction Practically',su:'Describe practical methods for measuring the rate of a chemical reaction.',steps:[
{lb:'Gas volume method',dr:dQ3,ht:'<p>When a reaction produces a GAS (e.g. acid + carbonate producing CO2), the volume of gas collected can be measured over time using a gas syringe. Plotting VOLUME (y-axis) against TIME (x-axis) gives a curve that starts steep (rate is fastest at the beginning, when reactant concentration is highest) and levels off (rate slows as reactants are used up, reaching a plateau when the reaction is complete).</p>'},
{lb:'Mass loss method',dr:dQ3,ht:'<p>If a reaction produces a gas that is allowed to ESCAPE from an open container, the total MASS of the reaction mixture will DECREASE over time (as gas mass leaves the system). Recording mass on a balance at regular time intervals and plotting mass loss against time gives a similar curve shape to the gas volume method (steep initially, levelling off as the reaction completes).</p>'},
{lb:'The disappearing cross (turbidity) method',dr:dQ3,ht:'<p>For reactions that produce a PRECIPITATE (e.g. sodium thiosulfate + hydrochloric acid, producing a cloudy sulfur precipitate), a cross drawn on paper is placed UNDER the reaction flask, and the TIME taken for the cross to become no longer visible (obscured by the increasing cloudiness/turbidity) is recorded. A SHORTER time indicates a FASTER rate of reaction.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'A gas volume vs time graph for a reaction typically starts STEEP and gradually LEVELS OFF. This shape indicates:',o:['The reaction rate is constant throughout','The reaction is fastest at the start (when reactant concentration is highest) and slows down as reactants are used up, eventually stopping when one reactant is fully consumed','The reaction speeds up over time','No gas is actually being produced'],a:2,w:'The steep initial slope reflects the fastest rate (highest reactant concentration, most frequent collisions). As reactants are consumed, their concentration falls, collisions become less frequent, and the rate slows \u2014 shown by the graph levelling off (plateauing) once the reaction is complete.'},{q:'In the "disappearing cross" method for measuring rate, a SHORTER time for the cross to disappear indicates:',o:['A slower reaction rate','A faster reaction rate, since the solution becomes cloudy (obscuring the cross) more quickly','No reaction is occurring','The reaction has stopped completely'],a:2,w:'The cross disappears once enough precipitate has formed to make the solution too cloudy to see through. A SHORTER time to reach this point means the precipitate formed more quickly \u2014 indicating a FASTER reaction rate.'},{q:'The mass loss method for measuring reaction rate is suitable specifically when:',o:['No gas is produced by the reaction','The reaction produces a gas that is allowed to escape into the open air, causing a measurable decrease in the total mass of the reaction system over time','A precipitate forms, obscuring visibility','The reaction is instantaneous'],a:2,w:'This method relies on gas escaping from an open reaction vessel, which causes the overall mass of the remaining reaction mixture (as measured on a balance) to decrease over time \u2014 the rate of mass loss reflects the rate of the gas-producing reaction.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Reversible Reactions and Dynamic Equilibrium',su:'Understand reversible reactions and the concept of dynamic equilibrium.',steps:[
{lb:'What is a reversible reaction',dr:dQ4,ht:'<p>A <b>reversible reaction</b> can proceed in BOTH the forward AND reverse directions, shown using the symbol \u21cc. Example: N2(g) + 3H2(g) \u21cc 2NH3(g). Unlike an irreversible reaction (which goes to completion in one direction), a reversible reaction can reach a state where BOTH the forward and reverse reactions are occurring simultaneously.</p>'},
{lb:'Dynamic equilibrium',dr:dQ4,ht:'<p>At <b>equilibrium</b>, the rate of the FORWARD reaction EQUALS the rate of the REVERSE reaction. This is called DYNAMIC equilibrium because both reactions are still actively occurring (not "stopped") \u2014 but since they occur at exactly the same rate, the OVERALL (macroscopic) concentrations of reactants and products remain CONSTANT (though not necessarily equal to each other).</p>'},
{lb:'Requirements for equilibrium',dr:dQ4,ht:'<p>Equilibrium can only be reached in a CLOSED system \u2014 no substances (reactants or products) may escape or enter the reaction vessel. In an OPEN system (e.g. a gas escaping into open air), the reverse reaction cannot properly balance the forward reaction, so true equilibrium is never established \u2014 the reaction simply proceeds in one direction until reactants run out.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'At dynamic equilibrium in a reversible reaction:',o:['The forward and reverse reactions have both completely stopped','The forward reaction rate equals the reverse reaction rate, so concentrations of reactants and products remain constant, even though both reactions are still occurring','Only the forward reaction is occurring','Only the reverse reaction is occurring'],a:2,w:'"Dynamic" equilibrium means both the forward and reverse reactions continue to happen, but at exactly the same rate as each other. This balance means the overall concentrations of all substances present stay constant over time, even though reactions are still actively taking place at the molecular level.'},{q:'Why can equilibrium only be established in a CLOSED system?',o:['Closed systems prevent any reaction from occurring','In a closed system, no reactants or products can escape or enter, allowing the forward and reverse reaction rates to properly balance; in an open system, escaping substances prevent this balance from forming','Closed systems only allow the forward reaction to occur','Equilibrium can happen equally well in open or closed systems'],a:2,w:'For equilibrium to be established, the forward and reverse reactions must reach a balanced state without interference. If substances can escape (open system), the reverse reaction cannot properly counterbalance the forward reaction, so a stable equilibrium position cannot be reached.'},{q:'At equilibrium, the CONCENTRATIONS of reactants and products are:',o:['Always exactly equal to each other','Constant over time (though not necessarily equal to each other), since forward and reverse rates are balanced','Always increasing over time','Always decreasing over time'],a:2,w:'While the forward and reverse RATES are equal at equilibrium, this does not mean the CONCENTRATIONS of reactants and products are equal to each other \u2014 they simply remain constant (whatever their relative values happen to be) because production and consumption of each substance are perfectly balanced.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Le Chatelier\u2019s Principle (Introductory)',su:'Predict how changes in conditions shift the position of equilibrium.',steps:[
{lb:'Statement of Le Chatelier\u2019s Principle',dr:dQ5,ht:'<p><b>Le Chatelier\u2019s Principle</b>: if a system at equilibrium is subjected to a change (in concentration, temperature, or pressure for gases), the equilibrium POSITION shifts in the direction that tends to OPPOSE (counteract) that change, partially restoring balance.</p>'},
{lb:'Effect of changing concentration',dr:dQ5,ht:'<p>ADDING more of a REACTANT shifts equilibrium towards the PRODUCTS (using up the extra reactant, partially opposing the increase). REMOVING a PRODUCT (e.g. continuously extracting it) shifts equilibrium towards the PRODUCTS as well (the system tries to replace what was removed).</p>'},
{lb:'Effect of changing temperature',dr:dQ5,ht:'<p>INCREASING temperature shifts equilibrium in the ENDOTHERMIC direction (the system "uses up" the extra heat energy supplied, opposing the temperature increase). DECREASING temperature shifts equilibrium in the EXOTHERMIC direction (the system releases more heat, opposing the temperature decrease).</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'According to Le Chatelier\u2019s Principle, if a reactant is added to a system at equilibrium, the equilibrium will shift:',o:['Towards the reactants','Towards the products, using up some of the extra reactant added and partially opposing the change','It will not shift at all','In an unpredictable direction'],a:2,w:'Adding more reactant increases its concentration, disturbing the equilibrium. According to Le Chatelier\u2019s Principle, the system responds by shifting towards the products (consuming some of the extra reactant), partially counteracting the disturbance.'},{q:'For an exothermic forward reaction at equilibrium, increasing the temperature will shift equilibrium:',o:['Towards the products (forward direction)','Towards the reactants (reverse, endothermic direction), since the system tries to absorb some of the extra heat supplied','It will not shift at all','Equilibrium is destroyed by any temperature change'],a:2,w:'Since the forward reaction is exothermic, the REVERSE reaction must be endothermic. Increasing temperature disturbs the equilibrium; the system shifts in the ENDOTHERMIC direction (here, the reverse direction) to absorb some of the added heat energy, partially opposing the temperature increase.'},{q:'Le Chatelier\u2019s Principle states that a system at equilibrium responds to a disturbance by:',o:['Shifting in a direction that OPPOSES (partially counteracts) the disturbance','Shifting in the same direction as the disturbance, making the change worse','Not responding at all','Stopping the reaction completely'],a:1,w:'The core idea of Le Chatelier\u2019s Principle is that the equilibrium position shifts specifically in the direction that tends to minimise or oppose the effect of the imposed change, partially restoring balance rather than amplifying the disturbance.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Chemical Kinetics and Equilibrium',su:'Integrated revision of rate factors, collision theory and equilibrium concepts.',steps:[
{lb:'Rate factors summary',dr:dQ1,ht:'<p>Temperature, concentration, surface area, and catalysts all increase rate of reaction \u2014 each explained by collision theory (more frequent collisions and/or more collisions exceeding activation energy). Rate can be measured by gas volume, mass loss, or the disappearing cross method.</p>'},
{lb:'Equilibrium summary',dr:dQ4,ht:'<p>Reversible reactions can proceed both ways. Dynamic equilibrium: forward rate = reverse rate, concentrations constant (in a CLOSED system only). Le Chatelier\u2019s Principle: equilibrium shifts to oppose an imposed change (concentration, temperature).</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: forgetting collision theory requires BOTH sufficient energy AND correct orientation, not just a collision. Confusing catalysts (lower activation energy, not used up) with simply "speeding up" reactions without an explanation. Forgetting equilibrium requires a CLOSED system. Getting Le Chatelier direction confused \u2014 always think about which direction OPPOSES the change made.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Which of these correctly explains why increasing surface area increases reaction rate?',o:['Surface area has no relationship to collision theory','More particles of the solid reactant are exposed at the surface, increasing the frequency of collisions with other reacting particles','Surface area only affects gases, not solids','Increasing surface area decreases the number of collisions'],a:2,w:'A larger surface area (e.g. from crushing a solid into smaller pieces) exposes more particles where they are accessible for collisions with other reactants, directly increasing the frequency of successful collisions and hence the reaction rate.'},{q:'A reversible reaction reaches equilibrium in a closed system. If more product is continuously removed from the system, equilibrium will shift:',o:['Towards the reactants','Towards the products, as the system tries to replace the product that keeps being removed','It will not shift, since equilibrium cannot be disturbed','The reaction will stop completely'],a:2,w:'Removing product continuously disturbs the equilibrium by decreasing product concentration. According to Le Chatelier\u2019s Principle, the system shifts towards the products to partially replace what has been removed, opposing the disturbance.'},{q:'A catalyst added to a reaction at equilibrium will:',o:['Shift the equilibrium position towards the products','Have no effect on the equilibrium position, but will help the system reach equilibrium FASTER (by speeding up both forward and reverse reactions equally)','Shift the equilibrium position towards the reactants','Change the value of the equilibrium constant'],a:2,w:'A catalyst speeds up BOTH the forward and reverse reactions by the SAME factor (since it lowers activation energy for both directions equally), so equilibrium is reached more quickly, but the actual EQUILIBRIUM POSITION (relative amounts of reactants/products) remains unchanged.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
