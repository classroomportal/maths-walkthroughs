<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}

.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}

.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}

.ar{display:flex;gap:8px;margin-top:6px;}

.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Exothermic vs Endothermic',[['Type','Energy change','Temperature effect'],['Exothermic','Released to surroundings','Surroundings warm up'],['Endothermic','Absorbed from surroundings','Surroundings cool down']]);}
function dQ2(p){drawTable(p,'Common Exothermic Reactions',[['Reaction','Example'],['Combustion','Burning fuels'],['Neutralisation','Acid + base'],['Respiration','Glucose + oxygen \u2192 CO2 + water'],['Displacement','Zn + CuSO4 \u2192 ZnSO4 + Cu']]);}
function dQ3(p){drawTable(p,'Common Endothermic Reactions',[['Reaction','Example'],['Thermal decomposition','CaCO3 \u2192 CaO + CO2'],['Photosynthesis','CO2+H2O\u2192glucose+O2'],['Dissolving certain salts','NH4NO3 in water']]);}
function dQ4(p){drawTable(p,'Calorimetry Calculation',[['Symbol','Meaning'],['q','Heat energy (J)'],['m','Mass of solution (g)'],['c','Specific heat capacity (4.18 J/g/K)'],['\u0394T','Temperature change (K)']]);}
function dQ5(p){drawTable(p,'Energy Level Diagram Features',[['Feature','Exothermic','Endothermic'],['Products vs reactants','Lower energy','Higher energy'],['\u0394H sign','Negative','Positive'],['Activation energy','Always positive (both types)','Always positive (both types)']]);}
function dQ6(p){drawTable(p,'WAEC Energetics Summary',[['Concept','Key point'],['Exothermic','Releases heat, \u0394H negative'],['Endothermic','Absorbs heat, \u0394H positive'],['q=mc\u0394T','Used to calculate heat released/absorbed']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Exothermic and Endothermic Reactions',su:'Distinguish exothermic and endothermic reactions using temperature change evidence.',steps:[
{lb:'Defining exothermic and endothermic',dr:dQ1,ht:'<p>An <b>exothermic</b> reaction RELEASES heat energy to the surroundings \u2014 the surroundings get WARMER (temperature rises). An <b>endothermic</b> reaction ABSORBS heat energy from the surroundings \u2014 the surroundings get COLDER (temperature falls). This temperature change is the key experimental evidence used to classify a reaction.</p>'},
{lb:'Everyday examples',dr:dQ1,ht:'<p>Exothermic examples: combustion (burning fuels releases heat and light), neutralisation (acid+base reactions feel warm), respiration (releases energy from food in our bodies), many displacement reactions. Endothermic examples: thermal decomposition (e.g. heating limestone requires continuous heat input), photosynthesis (absorbs light energy), dissolving certain salts like ammonium nitrate (the solution feels cold).</p>'},
{lb:'Identifying from temperature data',dr:dQ1,ht:'<p>In practical experiments: measure the temperature of the surroundings (usually water/solution) before and after mixing reactants. If temperature INCREASES \u2192 exothermic (heat was released into the water). If temperature DECREASES \u2192 endothermic (heat was absorbed from the water). Always record the temperature change (\u0394T) as evidence for your conclusion.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'When solid ammonium nitrate is added to water, the temperature of the water drops noticeably. This reaction is:',o:['Exothermic, since heat is released','Endothermic \u2014 the dissolving process absorbs heat from the water, cooling it down','Neither exothermic nor endothermic','Impossible to classify from this evidence'],a:2,w:'A drop in the surrounding water\u2019s temperature indicates heat energy has been ABSORBED from the water by the dissolving process, which is the defining feature of an endothermic change.'},{q:'Combustion reactions (like burning methane) are classified as exothermic because:',o:['They absorb heat from the surroundings','They release heat energy to the surroundings, causing a rise in surrounding temperature','No temperature change occurs at all','They only occur at very low temperatures'],a:2,w:'Combustion releases significant heat energy to the surroundings (which is why we use fuels for heating), causing the surrounding temperature to rise \u2014 the defining characteristic of an exothermic reaction.'},{q:'In a school experiment, a student mixes an acid and an alkali and observes the temperature of the mixture rise from 20\u00b0C to 27\u00b0C. This evidence shows the reaction is:',o:['Endothermic, since a chemical reaction occurred','Exothermic \u2014 the observed temperature RISE shows heat was released into the surroundings (the reaction mixture itself)','Neither type, since acid-base reactions are never classified this way','Impossible to determine without more data'],a:2,w:'The rise in temperature of the reaction mixture (from 20\u00b0C to 27\u00b0C) is direct evidence that heat energy was released by the reaction into the surroundings, confirming that this neutralisation is exothermic \u2014 as neutralisation reactions typically are.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Energy Level Diagrams',su:'Draw and interpret energy level diagrams for exothermic and endothermic reactions.',steps:[
{lb:'Drawing an exothermic energy diagram',dr:dQ5,ht:'<p>In an exothermic reaction energy diagram: REACTANTS are drawn at a HIGHER energy level than PRODUCTS (since energy is released, products end up with less energy than reactants). The vertical drop from reactants to products represents \u0394H, which is NEGATIVE for exothermic reactions.</p>'},
{lb:'Drawing an endothermic energy diagram',dr:dQ5,ht:'<p>In an endothermic reaction energy diagram: REACTANTS are drawn at a LOWER energy level than PRODUCTS (since energy is absorbed, products end up with MORE energy than reactants). The vertical rise from reactants to products represents \u0394H, which is POSITIVE for endothermic reactions.</p>'},
{lb:'Activation energy on the diagram',dr:dQ5,ht:'<p><b>Activation energy (Ea)</b> is the minimum energy needed for a reaction to begin \u2014 shown as a "hump" that reactants must climb over before reaching products, REGARDLESS of whether the overall reaction is exothermic or endothermic. Ea is ALWAYS positive (energy must always be supplied initially to start breaking bonds, even in an overall energy-releasing reaction).</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'On an energy level diagram for an EXOTHERMIC reaction, the products are drawn at:',o:['A higher energy level than the reactants','A lower energy level than the reactants, since energy has been released','Exactly the same energy level as the reactants','It cannot be shown on such a diagram'],a:2,w:'In an exothermic reaction, energy is released to the surroundings, meaning the products end up with LESS energy than the reactants \u2014 shown as a downward step from reactants to products on the diagram.'},{q:'The activation energy (Ea) of a reaction is:',o:['Always negative for exothermic reactions','Always positive, representing the minimum energy needed to start the reaction, regardless of whether the overall reaction is exothermic or endothermic','Only relevant for endothermic reactions','Equal to \u0394H in all cases'],a:2,w:'Activation energy is always a positive value \u2014 it represents the energy barrier that must be overcome before ANY reaction (exothermic or endothermic) can proceed, since some initial bonds must be broken before new bonds can form, regardless of the overall energy change.'},{q:'On an ENDOTHERMIC reaction\u2019s energy diagram, the overall \u0394H (difference between reactants and products) is shown as:',o:['A downward step, since products are lower in energy','An upward step, since products end up at a HIGHER energy level than reactants (energy was absorbed)','No change in energy level at all','The same as the activation energy always'],a:2,w:'Since an endothermic reaction absorbs energy from the surroundings, the products end up with MORE energy than the reactants \u2014 shown as an upward step on the diagram, with a positive \u0394H value.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Calorimetry \u2014 Measuring Energy Changes',su:'Use the equation q=mc\u0394T to calculate heat energy released or absorbed.',steps:[
{lb:'The calorimetry equation',dr:dQ4,ht:'<p><b>q = mc\u0394T</b>, where q = heat energy transferred (Joules), m = mass of the liquid being heated/cooled (usually water/solution, in grams), c = specific heat capacity (4.18 J/g/\u00b0C for water), \u0394T = temperature change (\u00b0C or K, the same numerically).</p>'},
{lb:'Worked example',dr:dQ4,ht:'<p>50 g of water increases in temperature from 20\u00b0C to 35\u00b0C when a reaction occurs. Calculate the heat released. \u0394T = 35\u221220 = 15\u00b0C. q = mc\u0394T = 50 x 4.18 x 15 = 3135 J (3.135 kJ). This is the heat energy released BY the reaction INTO the water.</p>'},
{lb:'Converting to energy per mole',dr:dQ4,ht:'<p>To find the enthalpy change PER MOLE of reactant: first calculate q (in kJ), then divide by the number of MOLES of the limiting reactant used in the experiment. \u0394H = \u2212q/n (negative sign for exothermic, since energy is released FROM the system). Example: if 3.135 kJ was released using 0.020 mol of reactant, \u0394H = \u22123.135/0.020 = \u2212157 kJ/mol.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'100 g of water rises in temperature by 8.0\u00b0C during a reaction. How much heat energy (q) was released? (c=4.18 J/g/\u00b0C)',o:['418 J','836 J','3344 J (100x4.18x8.0)','41.8 J'],a:3,w:'q=mc\u0394T = 100 x 4.18 x 8.0 = 3344 J.'},{q:'In the calorimetry equation q=mc\u0394T, the symbol \u0394T represents:',o:['The final temperature only','The initial temperature only','The CHANGE in temperature (final minus initial)','The specific heat capacity'],a:2,w:'\u0394T (delta T) specifically means the CHANGE in temperature, calculated as final temperature minus initial temperature \u2014 not either temperature value alone.'},{q:'A reaction releases 5220 J of heat energy using 0.030 mol of reactant. What is the enthalpy change per mole (\u0394H)?',o:['+174 kJ/mol','\u2212174 kJ/mol (5.220 kJ/0.030 mol, negative since exothermic)','\u221252.2 kJ/mol','+52.2 kJ/mol'],a:1,w:'First convert to kJ: 5220 J = 5.220 kJ. \u0394H = \u2212q/n = \u22125.220/0.030 = \u2212174 kJ/mol. The negative sign confirms this is exothermic (energy released from the system per mole reacted).'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Energy Changes in Bond Breaking and Forming',su:'Relate exothermic/endothermic behaviour to bond breaking and bond forming.',steps:[
{lb:'Bond breaking requires energy',dr:dQ2,ht:'<p>Breaking a chemical bond ALWAYS requires energy input (it is an ENDOTHERMIC process) \u2014 energy must be supplied to overcome the attractive forces holding atoms together in a bond. This is true regardless of whether the OVERALL reaction is exothermic or endothermic.</p>'},
{lb:'Bond forming releases energy',dr:dQ3,ht:'<p>Forming a new chemical bond ALWAYS releases energy (it is an EXOTHERMIC process) \u2014 energy is given out as atoms settle into the more stable, lower-energy arrangement of a new bond. Again, this is true regardless of the overall reaction classification.</p>'},
{lb:'Determining overall reaction type',dr:dQ2,ht:'<p>Whether an OVERALL reaction is exothermic or endothermic depends on the BALANCE between these two opposing energy changes: if MORE energy is released forming new bonds than was absorbed breaking old bonds \u2192 overall EXOTHERMIC (net energy released). If MORE energy is absorbed breaking old bonds than is released forming new bonds \u2192 overall ENDOTHERMIC (net energy absorbed).</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Breaking a chemical bond is always:',o:['An exothermic process, releasing energy','An endothermic process, requiring energy input to overcome the attractive forces holding the bond together','Energy-neutral, with no energy change involved','Only possible in endothermic reactions'],a:2,w:'Breaking any chemical bond requires an input of energy to overcome the attraction between the bonded atoms \u2014 this is always an endothermic step, regardless of whether the overall reaction is classified as exothermic or endothermic.'},{q:'If MORE energy is released forming new bonds than was absorbed breaking old bonds, the OVERALL reaction is:',o:['Endothermic','Exothermic \u2014 the net energy change is a release of energy','Impossible, since energy cannot be released this way','Always at equilibrium'],a:2,w:'The overall energy change of a reaction depends on the balance between energy absorbed (bond breaking) and energy released (bond forming). If bond FORMING releases more energy than bond BREAKING absorbs, there is a net RELEASE of energy \u2014 an exothermic reaction overall.'},{q:'Bond FORMING is always:',o:['Endothermic, requiring energy input','Exothermic, releasing energy as atoms settle into a more stable, lower-energy bonded arrangement','Energy-neutral','Only possible at very high temperatures'],a:2,w:'Forming a new bond always releases energy, as the atoms move into a more stable (lower energy) configuration than when they were unbonded \u2014 this is always an exothermic process, regardless of the overall reaction type.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Everyday Applications of Energy Changes',su:'Examine practical uses of exothermic and endothermic reactions.',steps:[
{lb:'Exothermic applications',dr:dQ2,ht:'<p>Practical uses of exothermic reactions: self-heating cans (food/drink) use an exothermic reaction (e.g. calcium oxide + water) to warm the contents without external heat. Hand warmers use exothermic oxidation of iron powder (rusting) to provide portable heat. Combustion of fuels (petrol, gas, wood) provides heat for cooking, heating homes, and powering engines.</p>'},
{lb:'Endothermic applications',dr:dQ3,ht:'<p>Practical uses of endothermic reactions: instant cold packs (used for sports injuries) use an endothermic dissolving reaction (e.g. ammonium nitrate in water) to absorb heat and produce a cooling effect on demand, without needing refrigeration. This is useful in situations (like sports fields) where ice/refrigeration is not readily available.</p>'},
{lb:'Choosing the right reaction for a purpose',dr:dQ1,ht:'<p>When designing a product (like a hand warmer or cold pack), engineers choose a reaction based on the DESIRED temperature effect: exothermic reactions for warming applications, endothermic reactions for cooling applications. Other factors considered include reaction SPEED (should activate quickly when needed), SAFETY (non-toxic, non-corrosive products), and REVERSIBILITY (single-use vs reusable products).</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Instant cold packs used for sports injuries typically rely on which type of reaction?',o:['Exothermic \u2014 releasing heat to warm the injury','Endothermic \u2014 an endothermic dissolving process (e.g. ammonium nitrate in water) absorbs heat, producing a cooling effect','Combustion reactions','Neutralisation reactions only'],a:2,w:'Cold packs typically use an endothermic process (commonly dissolving ammonium nitrate in water) that absorbs heat from its surroundings, producing a cooling effect useful for treating injuries without needing refrigeration.'},{q:'Hand warmers that use iron powder rely on which type of reaction to generate heat?',o:['Endothermic dissolving','Exothermic oxidation (rusting) of iron, which releases heat over an extended period','Photosynthesis','Thermal decomposition'],a:2,w:'Hand warmers commonly use the exothermic oxidation (rusting) of finely divided iron powder with oxygen from the air, which releases a steady, gentle amount of heat over several hours \u2014 ideal for warming hands in cold conditions.'},{q:'Why might a product designer choose an exothermic reaction rather than an endothermic one for a specific application?',o:['Exothermic reactions never release any heat','If the desired effect is WARMING (e.g. hand warmers, self-heating food), an exothermic reaction (which releases heat) is needed, rather than an endothermic one (which would absorb heat and cool things down)','Endothermic reactions are always more dangerous','There is no difference between the two for this purpose'],a:2,w:'The choice depends entirely on the desired temperature effect: a warming application (hand warmers, self-heating cans) requires an exothermic reaction that releases heat, whereas a cooling application (cold packs) requires an endothermic reaction that absorbs heat instead.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Energy and Energy Changes',su:'Integrated revision of exothermic/endothermic reactions and calorimetry.',steps:[
{lb:'Core concepts summary',dr:dQ1,ht:'<p>Exothermic: releases heat, surroundings warm, products lower energy than reactants, \u0394H negative. Endothermic: absorbs heat, surroundings cool, products higher energy than reactants, \u0394H positive. Bond breaking always absorbs energy; bond forming always releases energy \u2014 the overall reaction type depends on which effect dominates.</p>'},
{lb:'Calculation summary',dr:dQ6,ht:'<p>q = mc\u0394T (calorimetry, calculating heat transferred). \u0394H (per mole) = \u00b1q/n, where n = moles of limiting reactant. Always convert q from J to kJ if needed for the final \u0394H value, and remember the sign convention (negative for exothermic, positive for endothermic).</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: confusing which direction temperature changes for exothermic vs endothermic reactions. Forgetting activation energy is ALWAYS positive, regardless of overall reaction type. Mixing up bond breaking (always endothermic) with bond forming (always exothermic) when explaining overall reaction energetics. Forgetting to convert J to kJ, or forgetting the correct sign, when calculating \u0394H per mole.</p>'},
{lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'A reaction causes the temperature of 200 g of water to fall from 25\u00b0C to 18\u00b0C. How much heat energy (q) was absorbed? (c=4.18 J/g/\u00b0C)',o:['836 J','2926 J','5852 J (200x4.18x7.0)','1463 J'],a:2,w:'\u0394T = 25\u221218 = 7.0\u00b0C. q=mc\u0394T = 200x4.18x7.0 = 5852 J.'},{q:'This fall in temperature (from the previous question) confirms the reaction is:',o:['Exothermic, since heat was released','Endothermic \u2014 the surroundings (water) lost heat energy to the reaction, cooling down','Neither type of reaction','Impossible to classify'],a:2,w:'Since the water\u2019s temperature FELL, the reaction must have ABSORBED heat energy from the water (the surroundings), which is the defining characteristic of an endothermic process.'},{q:'Which statement correctly describes activation energy?',o:['It is negative for exothermic reactions','It represents the minimum energy needed to start ANY reaction, and is always a positive value regardless of whether the reaction is exothermic or endothermic','It is only relevant to endothermic reactions','It equals \u0394H for exothermic reactions'],a:2,w:'Activation energy is the energy barrier that must always be overcome to begin breaking bonds and start a reaction. This value is always positive (energy must be supplied), whether the overall reaction turns out to be exothermic or endothermic.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];
