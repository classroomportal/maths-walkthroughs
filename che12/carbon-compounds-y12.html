<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#6A1B9A',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function drawTable(p,ttl,rows){var s=g(),o=[];var rh=32;s.setAttribute('viewBox','0 0 480 '+(36+rows.length*rh));
o.push(T(240,18,ttl,ACC,12,'middle',true));
var cw=460/rows[0].length;
rows.forEach(function(r,i){if(i<=p){o.push(R(10,24+i*rh,460,rh-4,i===0?LINE:CRM,i===0?ACC:LINE,0.5));
r.forEach(function(cell,j){o.push(T(10+cw*j+cw/2,24+i*rh+rh/2+4,cell,i===0?'white':'#333',9,'middle',i===0));});
}});
s.innerHTML=o.join('');}
function drawCurve(p,ttl,pts,note){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,16,ttl,ACC,11,'middle',true));
o.push(L(50,220,460,220,'#888',1));o.push(L(50,220,50,30,'#888',1));
var n=Math.min(p+2,pts.length);
var path='';
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;path+=(i===0?'M':'L')+x+' '+y+' ';}
if(n>1)o.push('<path d="'+path+'" fill="none" stroke="'+ACC+'" stroke-width="2.5"/>');
for(var i=0;i<n;i++){var x=50+pts[i][0]*4;var y=220-pts[i][1]*17;o.push(circ(x,y,3,ACC,ACC));}
if(note&&p>=pts.length-1)o.push(T(240,245,note,'#555',9,'middle',false));
s.innerHTML=o.join('');}
function dQ1(p){drawTable(p,'Alkanes \u2014 Homologous Series',[['Name','Formula','No. of C'],['Methane','CH4','1'],['Ethane','C2H6','2'],['Propane','C3H8','3'],['Butane','C4H10','4']]);}
function dQ2(p){drawTable(p,'Alkanes vs Alkenes',[['Feature','Alkanes','Alkenes'],['Bonding','Single bonds only','Contains C=C'],['General formula','CnH2n+2','CnH2n'],['Reaction with Br2(aq)','No reaction (stays orange)','Decolourises (orange to colourless)']]);}
function dQ3(p){drawTable(p,'Functional Groups',[['Family','Functional group','Example'],['Alcohols','-OH','Ethanol'],['Carboxylic acids','-COOH','Ethanoic acid'],['Alkenes','C=C','Ethene']]);}
function dQ4(p){drawTable(p,'Fermentation vs Combustion of Ethanol',[['Process','Equation'],['Fermentation','C6H12O6 \u2192 2C2H5OH + 2CO2'],['Combustion','C2H5OH + 3O2 \u2192 2CO2 + 3H2O']]);}
function dQ5(p){drawTable(p,'Testing for Functional Groups',[['Test','Positive result'],['Bromine water + alkene','Orange \u2192 colourless'],['Sodium + alcohol','Fizzing, H2 gas'],['Sodium carbonate + carboxylic acid','Fizzing, CO2 gas']]);}
function dQ6(p){drawTable(p,'WAEC Carbon Compounds Summary',[['Family','Key reaction'],['Alkanes','Combustion, substitution with halogens'],['Alkenes','Addition reactions (decolourise Br2)'],['Alcohols','Combustion, oxidation to acids']]);}

var QS=[
{ey:'Q1 \u2022 Chem \u2022 Y12',ti:'Alkanes \u2014 the Saturated Hydrocarbons',su:'Examine the homologous series of alkanes and their general properties.',steps:[
{lb:'What is a hydrocarbon',dr:dQ1,ht:'<p>A <b>hydrocarbon</b> is a compound containing ONLY carbon and hydrogen atoms. <b>Alkanes</b> are SATURATED hydrocarbons (contain only single C-C bonds), following the general formula CnH2n+2. They form a HOMOLOGOUS SERIES \u2014 a family of compounds with the same general formula and similar chemical properties, differing by a -CH2- unit between consecutive members.</p>'},
{lb:'Naming and properties of alkanes',dr:dQ1,ht:'<p>The first four alkanes: methane (CH4), ethane (C2H6), propane (C3H8), butane (C4H10) \u2014 named using Greek-derived prefixes (meth-, eth-, prop-, but-) with the "-ane" ending. As the number of carbon atoms increases: boiling point INCREASES (more electrons, stronger London/van der Waals forces between molecules), and the substances become progressively less volatile (methane is a gas, larger alkanes become liquids then solids).</p>'},
{lb:'Alkane reactions',dr:dQ1,ht:'<p>Alkanes undergo COMBUSTION (burning in oxygen, releasing energy \u2014 the main reason they are used as fuels): CH4 + 2O2 \u2192 CO2 + 2H2O (complete combustion, excess oxygen). Alkanes are relatively UNREACTIVE otherwise (all bonds are strong, single C-C and C-H bonds), though they can undergo SUBSTITUTION with halogens (e.g. Cl2) in the presence of UV light, replacing a hydrogen atom with a halogen atom.</p>'},
{lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Alkanes are described as "saturated" hydrocarbons because they:',o:['Contain a C=C double bond','Contain only single bonds between carbon atoms (no double or triple bonds)','Are always liquids','Contain no hydrogen atoms'],a:2,w:'"Saturated" means the carbon atoms are bonded to the maximum possible number of other atoms via single bonds only \u2014 alkanes contain no C=C double bonds, unlike alkenes.'},{q:'What is the general formula for alkanes?',o:['CnH2n','CnH2n+2, e.g. methane CH4 (n=1: 1x2+2=4 hydrogens)','CnHn','CnH2n-2'],a:2,w:'The alkane homologous series follows the general formula CnH2n+2. For methane (n=1): 2(1)+2=4 hydrogens, giving CH4, which matches.'},{q:'Why does the boiling point of alkanes generally INCREASE as the number of carbon atoms increases?',o:['Larger alkane molecules have stronger covalent bonds','Larger molecules have more electrons, resulting in stronger London (van der Waals) forces between molecules, requiring more energy to separate them into the gas phase','Larger alkanes contain ionic bonds','Boiling point is unrelated to molecular size for alkanes'],a:2,w:'As alkane molecules get larger (more carbon atoms), they have more electrons and a greater surface area for interaction, leading to stronger intermolecular London (van der Waals) forces. Overcoming these stronger forces to boil the substance requires more energy, resulting in higher boiling points for larger alkanes.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q2 \u2022 Chem \u2022 Y12',ti:'Alkenes \u2014 the Unsaturated Hydrocarbons',su:'Examine alkenes, their C=C double bond, and their characteristic addition reactions.',steps:[
{lb:'What is an alkene',dr:dQ2,ht:'<p><b>Alkenes</b> are UNSATURATED hydrocarbons containing at least one C=C DOUBLE bond, following the general formula CnH2n. Common examples: ethene (C2H4), propene (C3H6). The presence of the double bond makes alkenes considerably MORE REACTIVE than alkanes, since the double bond is a region of high electron density that readily reacts with other substances.</p>'},
{lb:'The bromine water test',dr:dQ2,ht:'<p>Alkenes DECOLOURISE bromine water (orange-brown \u2192 colourless), since the C=C double bond reacts with Br2 in an ADDITION reaction (bromine adds across the double bond, forming a dibromo compound). Alkanes do NOT react with bromine water in this way (bromine water stays orange, since alkanes lack the reactive double bond) \u2014 this is the standard test to DISTINGUISH alkanes from alkenes.</p>'},
{lb:'Addition reactions of alkenes',dr:dQ2,ht:'<p>Alkenes undergo ADDITION reactions, where atoms are added ACROSS the C=C double bond (which becomes a single bond in the product): with hydrogen (H2, nickel catalyst) \u2192 alkane (used in hydrogenating vegetable oils into margarine). With steam (H2O, catalyst, high pressure/temperature) \u2192 alcohol (industrial ethanol production). With bromine (Br2) \u2192 dibromoalkane.</p>'},
{lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Bromine water is used to test for the presence of an alkene. A POSITIVE result is observed as:',o:['The bromine water stays orange','The bromine water is decolourised, turning from orange-brown to colourless, as the C=C double bond reacts with the bromine','The bromine water turns blue','No visible change occurs with alkenes'],a:2,w:'Alkenes react with bromine water in an addition reaction across the C=C double bond, using up the orange-brown bromine and producing a colourless dibromo product \u2014 this decolourisation is the standard positive test for unsaturation (C=C).'},{q:'What is the general formula for alkenes?',o:['CnH2n+2','CnH2n \u2014 e.g. ethene C2H4 (n=2: 2x2=4 hydrogens)','CnHn','CnH2n+1'],a:2,w:'Alkenes follow the general formula CnH2n. For ethene (n=2): 2(2)=4 hydrogens, giving C2H4, matching the known formula for ethene.'},{q:'Why are alkenes generally MORE reactive than alkanes?',o:['Alkenes contain more carbon atoms','The C=C double bond is a region of high electron density that is attractive to reagents, making it a reactive site for addition reactions, unlike the strong, unreactive single bonds in alkanes','Alkenes have lower boiling points','Alkenes contain ionic bonds'],a:2,w:'The C=C double bond in alkenes has a region of concentrated electron density, making it attractive to electron-seeking reagents. This allows alkenes to readily undergo addition reactions, unlike alkanes, whose strong, non-polar single C-C and C-H bonds make them relatively unreactive under normal conditions.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q3 \u2022 Chem \u2022 Y12',ti:'Alcohols and Their Reactions',su:'Examine the properties, production and reactions of alcohols.',steps:[
{lb:'Alcohol functional group',dr:dQ3,ht:'<p>Alcohols contain the -OH (hydroxyl) FUNCTIONAL GROUP. Common examples: methanol (CH3OH), ethanol (C2H5OH, the alcohol in alcoholic drinks). Alcohols can be produced by FERMENTATION (glucose broken down by yeast enzymes in the absence of oxygen: C6H12O6 \u2192 2C2H5OH + 2CO2) or by the HYDRATION of ethene (industrial method: C2H4 + H2O \u2192 C2H5OH, using a catalyst, high temperature/pressure).</p>'},
{lb:'Combustion of alcohols',dr:dQ4,ht:'<p>Alcohols undergo COMBUSTION like hydrocarbons, releasing energy: C2H5OH + 3O2 \u2192 2CO2 + 3H2O. This makes ethanol useful as a biofuel (often blended with petrol) since it is renewable (produced from fermenting plant sugars) unlike fossil-fuel-derived petrol.</p>'},
{lb:'Oxidation of alcohols',dr:dQ4,ht:'<p>Ethanol can be OXIDISED (e.g. by microbial action, or chemically with an oxidising agent like acidified potassium dichromate) to form ETHANOIC ACID (vinegar): C2H5OH + O2 \u2192 CH3COOH + H2O. This is the chemistry behind wine turning to vinegar if left exposed to air (bacteria oxidise the ethanol).</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Fermentation of glucose by yeast produces ethanol and which other product?',o:['Oxygen gas','Carbon dioxide gas (C6H12O6\u21922C2H5OH+2CO2)','Hydrogen gas','Water only, no gas'],a:2,w:'Fermentation of glucose by yeast enzymes (in the absence of oxygen) produces ethanol AND carbon dioxide gas as a by-product: C6H12O6\u21922C2H5OH+2CO2.'},{q:'The industrial production of ethanol from ethene (C2H4+H2O\u2192C2H5OH) is an example of which type of reaction?',o:['Combustion','An addition reaction (hydration), since water adds across the C=C double bond of ethene','A substitution reaction','A neutralisation reaction'],a:2,w:'Ethene (an alkene, with a C=C double bond) reacts with steam in an addition reaction (specifically hydration, since water is added), forming ethanol \u2014 the double bond becomes a single bond as the water molecule adds across it.'},{q:'Ethanol left exposed to air can slowly turn into vinegar (ethanoic acid) because:',o:['Ethanol spontaneously evaporates into acid','Bacteria/oxidising conditions oxidise the ethanol to ethanoic acid (C2H5OH+O2\u2192CH3COOH+H2O)','Ethanol reacts with nitrogen in the air','This chemical change is impossible'],a:2,w:'Exposure to air allows oxidation (often aided by acetic acid bacteria) to convert ethanol into ethanoic acid (acetic acid, the main component of vinegar) \u2014 explaining why opened wine or beer can develop a sour, vinegar-like taste over time.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q4 \u2022 Chem \u2022 Y12',ti:'Carboxylic Acids',su:'Examine the properties and reactions of carboxylic acids.',steps:[
{lb:'Carboxylic acid functional group',dr:dQ3,ht:'<p>Carboxylic acids contain the -COOH FUNCTIONAL GROUP. Common example: ethanoic acid (CH3COOH), the main component of vinegar. Carboxylic acids are WEAK acids (only partially dissociate in water: CH3COOH \u21cc H+ + CH3COO-), unlike strong mineral acids like HCl.</p>'},
{lb:'Reactions of carboxylic acids',dr:dQ5,ht:'<p>Carboxylic acids show typical ACID reactions: react with metal carbonates to produce a salt, water, and CO2 (effervescence, confirmed by limewater test): 2CH3COOH + Na2CO3 \u2192 2CH3COONa + H2O + CO2. They also react with alcohols (in the presence of an acid catalyst, e.g. concentrated H2SO4) to form ESTERS, in a condensation reaction releasing water.</p>'},
{lb:'Esters from carboxylic acids and alcohols',dr:dQ3,ht:'<p>Ester formation: carboxylic acid + alcohol \u21cc ester + water (a reversible, condensation reaction, using an acid catalyst). Example: CH3COOH + C2H5OH \u21cc CH3COOC2H5 (ethyl ethanoate) + H2O. Esters are known for their characteristic pleasant, often fruity smells, and are widely used in flavourings and perfumes.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Carboxylic acids are classified as WEAK acids because they:',o:['Do not react with metals at all','Only PARTIALLY dissociate in water, unlike strong acids which fully dissociate','Have a pH above 7','Contain no acidic hydrogen atoms'],a:2,w:'Weak acids like carboxylic acids only partially ionise in water (an equilibrium exists between the undissociated acid and its ions), unlike strong acids (e.g. HCl) which fully dissociate \u2014 this is what makes them "weak" rather than "strong".'},{q:'Reacting ethanoic acid with sodium carbonate produces which observable evidence of reaction?',o:['A colour change to blue','Effervescence (bubbling) as carbon dioxide gas is released, which turns limewater milky','No visible change occurs','A strong smell of ammonia'],a:2,w:'Like other acids, carboxylic acids react with carbonates to release CO2 gas, seen as bubbling/effervescence, and confirmed by passing the gas through limewater (which turns milky) \u2014 a standard confirmatory test for carbonate reactions.'},{q:'The reaction between ethanoic acid and ethanol (with an acid catalyst) produces:',o:['An alkene','An ester (ethyl ethanoate) and water, via a condensation reaction','Carbon dioxide only','A carboxylic acid salt only'],a:2,w:'Carboxylic acids react with alcohols in a condensation (esterification) reaction, catalysed by an acid, to form an ester and water: CH3COOH+C2H5OH\u21ccCH3COOC2H5+H2O \u2014 producing the pleasant-smelling ester ethyl ethanoate.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q5 \u2022 Chem \u2022 Y12',ti:'Distinguishing Organic Compounds by Simple Tests',su:'Use simple chemical tests to identify alkanes, alkenes, alcohols and carboxylic acids.',steps:[
{lb:'Distinguishing alkanes from alkenes',dr:dQ5,ht:'<p>Add BROMINE WATER to the unknown hydrocarbon. If it DECOLOURISES (orange \u2192 colourless) \u2192 ALKENE (contains C=C, undergoes addition). If it STAYS orange (no reaction) \u2192 ALKANE (no C=C double bond present, unreactive with bromine water under these conditions).</p>'},
{lb:'Testing for an alcohol',dr:dQ5,ht:'<p>Add a small piece of SODIUM METAL to the liquid. If FIZZING occurs (hydrogen gas released, confirmed by the squeaky pop test) \u2192 an ALCOHOL (or another substance containing an -OH group) is present, since sodium reacts with the -OH group: 2C2H5OH + 2Na \u2192 2C2H5ONa + H2.</p>'},
{lb:'Testing for a carboxylic acid',dr:dQ5,ht:'<p>Add SODIUM CARBONATE solution to the unknown liquid. If EFFERVESCENCE occurs (CO2 gas released, confirmed by turning limewater milky) \u2192 a CARBOXYLIC ACID is present, since carboxylic acids react with carbonates like any other acid, releasing CO2 gas.</p>'},
{lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'An unknown hydrocarbon is added to bromine water, and no colour change is observed (it stays orange). This suggests the hydrocarbon is:',o:['An alkene, since alkenes always decolourise bromine water','An alkane, since it lacks the reactive C=C double bond needed to decolourise bromine water','A carboxylic acid','An alcohol'],a:2,w:'Since bromine water STAYED orange (no reaction/decolourisation occurred), this indicates the hydrocarbon does NOT contain a reactive C=C double bond \u2014 consistent with it being an alkane (saturated hydrocarbon), rather than an alkene.'},{q:'Adding a small piece of sodium metal to an unknown liquid produces fizzing (gas bubbles). This is consistent with the liquid being:',o:['A hydrocarbon (alkane or alkene) with no reactive functional group','An alcohol, since sodium reacts with the -OH functional group to produce hydrogen gas','Water only, unrelated to organic chemistry','Impossible to interpret without further tests'],a:2,w:'Sodium metal reacts characteristically with the -OH group (found in alcohols, and also water) to release hydrogen gas, seen as fizzing. This positive test suggests the presence of an -OH group, consistent with the liquid being an alcohol.'},{q:'Which test would distinguish a carboxylic acid from an alcohol?',o:['Bromine water test','Adding sodium carbonate solution \u2014 carboxylic acids produce effervescence (CO2 gas), while alcohols show no reaction with carbonate','Both substances react identically with all tests','There is no way to distinguish these two types of compound'],a:2,w:'Carboxylic acids, being acidic, react with sodium carbonate to release CO2 gas (effervescence). Alcohols are NOT acidic in the same way and do NOT react with carbonates in this manner, providing a clear distinguishing test between the two functional groups.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
{ey:'Q6 \u2022 Chem \u2022 Y12',ti:'WAEC Prep \u2014 Chemistry of Carbon Compounds',su:'Integrated revision of alkanes, alkenes, alcohols and carboxylic acids.',steps:[
{lb:'Homologous series summary',dr:dQ1,ht:'<p>Alkanes (CnH2n+2): saturated, unreactive except combustion/substitution. Alkenes (CnH2n): unsaturated (C=C), reactive, undergo addition (decolourise bromine water). Alcohols (-OH): produced by fermentation or ethene hydration, undergo combustion and oxidation to acids. Carboxylic acids (-COOH): weak acids, react with carbonates/metals, form esters with alcohols.</p>'},
{lb:'Reaction type summary',dr:dQ2,ht:'<p>Combustion: alkanes, alkenes, alcohols all burn in oxygen to form CO2+H2O (releasing energy). Addition: alkenes react with H2, H2O, Br2 across the double bond. Oxidation: alcohols oxidised to carboxylic acids. Condensation (esterification): carboxylic acid+alcohol\u2192ester+water.</p>'},
{lb:'Common WAEC mistakes',dr:dQ6,ht:'<p>Avoid: confusing alkanes (unreactive with bromine water) with alkenes (decolourise bromine water) \u2014 always check for the C=C double bond. Forgetting fermentation requires ANAEROBIC conditions (no oxygen) and yeast enzymes. Mixing up addition reactions (alkenes) with substitution reactions (alkanes with halogens, needs UV light). Forgetting esters form via CONDENSATION (water is released), not addition.</p>'},
{lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Which functional group defines an alcohol?',o:['-COOH','-OH (hydroxyl group)','C=C double bond','No specific functional group'],a:2,w:'Alcohols are defined by the presence of the -OH (hydroxyl) functional group attached to a carbon chain, e.g. ethanol C2H5OH.'},{q:'What type of reaction occurs when ethene reacts with hydrogen gas (with a nickel catalyst) to form ethane?',o:['Substitution','Addition \u2014 hydrogen atoms add across the C=C double bond, converting the alkene to an alkane','Condensation','Neutralisation'],a:2,w:'This is a classic addition reaction: hydrogen adds across the C=C double bond of the alkene (ethene), converting it into the corresponding saturated alkane (ethane) \u2014 the double bond becomes a single bond as new C-H bonds form.'},{q:'Ethanoic acid reacting with ethanol (with an acid catalyst) to form ethyl ethanoate is an example of:',o:['An addition reaction','A condensation (esterification) reaction, releasing water as a by-product','A combustion reaction','A displacement reaction'],a:2,w:'This ester-forming reaction between a carboxylic acid and an alcohol is a condensation reaction \u2014 water is released as a by-product while the acid and alcohol combine to form the ester, ethyl ethanoate.'}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q+'<br><small>1: '+q.o[0]+' &nbsp; 2: '+q.o[1]+' &nbsp; 3: '+q.o[2]+' &nbsp; 4: '+q.o[3]+'</small>',hints:['Think carefully'],ans:q.a,tol:0,unit:'(enter 1, 2, 3 or 4)',working:q.w};})},
]},
];

(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
render();
