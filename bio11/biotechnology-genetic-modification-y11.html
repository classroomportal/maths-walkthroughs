<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Genetic engineering process','#2E7D32',13,'middle',true));
if(p>=1){o.push(R(10,44,460,38,'#F1F8F1','#2E7D32',1.5));o.push(T(240,58,'1. Identify gene of interest (e.g. human insulin gene)','#333',10,'middle',false));o.push(T(240,74,'Use mRNA / restriction enzymes to isolate','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,38,'#e8f5e9','#2E7D32',1.5));o.push(T(240,106,'2. Cut gene using RESTRICTION ENZYMES (make sticky ends)','#333',10,'middle',false));}
if(p>=3){o.push(R(10,140,460,38,'#e8f5e9','#2E7D32',1.5));o.push(T(240,154,'3. Insert into VECTOR (plasmid) using DNA LIGASE','#333',10,'middle',false));}
if(p>=4){o.push(R(10,188,460,38,'#F1F8F1','#2E7D32',1.5));o.push(T(240,202,'4. Introduce into HOST (e.g. bacteria)','#333',10,'middle',false));o.push(T(240,218,'Host expresses gene \u2192 produces desired protein','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Applications of genetic engineering','#2E7D32',13,'middle',true));
[['GM insulin','Human insulin gene in bacteria; used by diabetics'],['GM crops','Herbicide-resistant, pest-resistant, drought-tolerant crops'],['Golden Rice','Beta-carotene gene added; addresses vitamin A deficiency'],['Gene therapy','Correcting faulty genes in cells to treat genetic diseases'],['Diagnostic probes','DNA probes to detect genetic mutations or diseases'],['Bioremediation','GM bacteria to break down oil spills or toxic waste']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(120,55+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(340,55+i*33,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Monoclonal antibodies','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,44,460,52,'#F1F8F1','#2E7D32',1.5));o.push(T(240,64,'1. Inject antigen into mouse \u2192 B lymphocytes produce specific antibodies','#333',10,'middle',false));o.push(T(240,82,'2. Fuse B lymphocyte with tumour cell \u2192 hybridoma cell','#555',9,'middle',false));}
if(p>=2){o.push(R(10,106,460,38,'#e8f5e9','#2E7D32',1.5));o.push(T(240,130,'3. Hybridoma grows and divides (immortal), producing one specific antibody','#333',10,'middle',false));}
if(p>=3){o.push(R(10,154,460,52,'#e8f5e9','#2E7D32',1.5));o.push(T(240,174,'Uses: pregnancy tests, cancer treatment (magic bullets),','#2E7D32',10,'middle',false));o.push(T(240,192,'disease diagnosis, COVID-19 tests','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ5(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Biotechnology summary','#2E7D32',13,'middle',true));
[['Restriction enzymes','cut DNA at specific sequences (sticky ends)'],['DNA ligase','joins DNA fragments together (seals)'],['Vector (plasmid)','carries gene into host organism'],['GM insulin','bacteria produce human insulin for diabetics'],['Golden Rice','beta-carotene gene; addresses vitamin A deficiency'],['Monoclonal antibodies','hybridoma cells; uses: pregnancy tests, cancer treatment']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(130,55+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(350,55+i*33,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Biology \u2022 Biotechnology',ti:'Genetic Engineering Process',su:'Describe the four steps of genetic engineering.',steps:[
  {lb:'Four steps',dr:dQ1,ht:'<p>1. <b>Identify and isolate</b> the gene of interest. 2. <b>Cut</b> out the gene using restriction enzymes (leave sticky ends). 3. <b>Insert</b> into a vector (plasmid) using DNA ligase (joins sticky ends). 4. <b>Introduce</b> vector into host organism (bacteria, plant, etc.) which then expresses the gene and produces the desired protein.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Restriction enzymes are used in genetic engineering to: 1=join DNA fragments, 2=cut DNA at specific sequences.',a:2,w:'Restriction enzymes cut DNA at specific recognition sequences. Answer: 2.'},{q:'DNA ligase is used in genetic engineering to: 1=cut DNA, 2=join DNA fragments (sticky ends) together.',a:2,w:'DNA ligase = molecular glue; seals nicks in DNA. Answer: 2.'},{q:'A plasmid acts as a vector in genetic engineering. This means it: 1=cuts the gene, 2=carries the gene into the host organism.',a:2,w:'Vector = delivery vehicle for the gene into host. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Restriction enzymes: cut. Ligase: join. Plasmid: vector (carry gene).'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Biology \u2022 Biotechnology',ti:'Applications of Genetic Engineering',su:'Describe applications and evaluate benefits and risks.',steps:[
  {lb:'Key applications',dr:dQ2,ht:'<p>GM insulin: human insulin gene in bacteria \u2192 safe, abundant insulin for diabetics. GM crops: herbicide-resistant (Roundup Ready), pest-resistant (Bt crops), drought-tolerant. Golden Rice: beta-carotene gene (prevents vitamin A deficiency). Gene therapy: correct faulty gene in patient\u2019s cells.</p>'},
  {lb:'Benefits and risks',dr:dQ2,ht:'<p>Benefits: treat disease, increase crop yield, reduce pesticide use, address nutritional deficiencies. Risks: unknown long-term effects, gene spread to wild plants, reduced biodiversity, ethical concerns ("playing God").</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Golden Rice has been genetically modified to: 1=grow faster, 2=produce beta-carotene (converted to vitamin A).',a:2,w:'Golden Rice: beta-carotene gene addresses vitamin A deficiency. Answer: 2.'},{q:'GM bacteria produce human insulin because: 1=they have the same genes naturally, 2=the human insulin gene has been inserted into them.',a:2,w:'Genetic engineering: human gene inserted into bacteria \u2192 bacteria make human insulin. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Golden Rice: vitamin A. GM insulin: human gene in bacteria.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y11 Biology \u2022 Biotechnology',ti:'Fermentation and Biotechnology',su:'Describe how fermentation is used in biotechnology.',steps:[
  {lb:'Fermentation',dr:dQ3,ht:'<p>Fermentation: microorganisms break down substrates anaerobically (or sometimes aerobically). Uses: producing antibiotics (e.g. penicillin from Penicillium fungus), enzymes (e.g. lactase in lactose-free milk), alcohol (beer, wine, bread), mycoprotein (Quorn from Fusarium), biogas (methane from bacteria).</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Penicillin is produced by: 1=bacteria, 2=the fungus Penicillium.',a:2,w:'Penicillin: produced by the mould Penicillium notatum. Answer: 2.'},{q:'Mycoprotein (Quorn) is produced by: 1=yeast, 2=the fungus Fusarium.',a:2,w:'Quorn: Fusarium fungus grown in fermenters \u2192 mycoprotein. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Penicillin: Penicillium fungus. Quorn: Fusarium fungus.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y11 Biology \u2022 Biotechnology',ti:'Monoclonal Antibodies',su:'Describe how monoclonal antibodies are produced and used.',steps:[
  {lb:'Making monoclonal antibodies',dr:dQ4,ht:'<p>1. Inject antigen into mouse \u2192 B lymphocytes make specific antibody. 2. Fuse B lymphocyte with tumour cell (myeloma) \u2192 hybridoma cell. 3. Hybridoma divides indefinitely, producing one type of specific antibody (monoclonal).</p>'},
  {lb:'Uses of monoclonal antibodies',dr:dQ4,ht:'<p>Pregnancy tests (hCG hormone detection). Cancer treatment: "magic bullet" \u2014 antibody carries drug to tumour. Diagnosis: detect specific antigens (e.g. COVID-19 lateral flow tests). Research: identify proteins. ELISA tests.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'A hybridoma cell is: 1=a normal B lymphocyte, 2=a fusion of a B lymphocyte and a tumour cell.',a:2,w:'Hybridoma: B lymphocyte (makes antibody) fused with tumour cell (immortal). Answer: 2.'},{q:'Monoclonal antibodies in cancer treatment work as "magic bullets" by: 1=killing all cells, 2=carrying drugs specifically to cancer cells.',a:2,w:'Antibodies bind specifically to cancer antigen \u2192 deliver drug to tumour only. Answer: 2.'},{q:'A pregnancy test uses monoclonal antibodies to detect: 1=glucose, 2=hCG hormone.',a:2,w:'Pregnancy tests detect hCG (human chorionic gonadotropin). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Hybridoma: B cell + tumour. Magic bullet: drug targeted to cancer cells.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y11 Biology \u2022 Biotechnology',ti:'DNA Technology',su:'Describe gel electrophoresis and DNA fingerprinting.',steps:[
  {lb:'Gel electrophoresis',dr:dQ5,ht:'<p>Gel electrophoresis: separates DNA fragments by size. Cut DNA with restriction enzymes \u2192 fragments placed in gel \u2192 electric current applied \u2192 smaller fragments travel further. Used to compare DNA samples (DNA fingerprinting/profiling).</p>'},
  {lb:'DNA fingerprinting',dr:dQ5,ht:'<p>Each person\u2019s DNA has unique repeating sequences (STRs). Cut with restriction enzymes \u2192 gel electrophoresis \u2192 unique banding pattern (DNA fingerprint). Uses: forensics (crime scenes), paternity testing, identifying inherited diseases.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'In gel electrophoresis, smaller DNA fragments: 1=travel further from the well, 2=travel less far from the well.',a:1,w:'Smaller fragments: less resistance \u2192 travel further. Answer: 1.'},{q:'DNA fingerprinting is used in forensics to: 1=find the DNA sequence of a person, 2=match DNA from a crime scene to a suspect.',a:2,w:'DNA profiling: compare banding patterns to identify individuals. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Smaller DNA: travels further in gel. DNA fingerprint: unique banding pattern.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y11 Biology \u2022 Biotechnology',ti:'PCR (Polymerase Chain Reaction)',su:'Describe how PCR amplifies DNA.',steps:[
  {lb:'PCR',dr:dQ6,ht:'<p>PCR amplifies small amounts of DNA. Steps: 1. <b>Denaturation</b> (95\u00b0C): DNA double helix separates into single strands. 2. <b>Annealing</b> (55\u00b0C): primers bind to specific target sequence. 3. <b>Extension</b> (72\u00b0C): DNA polymerase extends from primers, copying the DNA. Cycle repeats \u2212\u2013 billions of copies in hours.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'After 1 cycle of PCR, one DNA molecule becomes: 1=2 copies, 2=4 copies.',a:1,w:'Each cycle doubles the DNA: 1\u21922\u21924\u21928... Answer: 1.'},{q:'DNA is denatured in PCR by: 1=adding restriction enzymes, 2=heating to ~95\u00b0C to separate the strands.',a:2,w:'High temperature breaks hydrogen bonds between base pairs. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['PCR: denature(95\u00b0C)\u2192anneal(55\u00b0C)\u2192extend(72\u00b0C). Each cycle doubles DNA.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y11 Biology \u2022 Biotechnology',ti:'Ethics of Genetic Modification',su:'Evaluate ethical arguments for and against genetic modification.',steps:[
  {lb:'Ethical arguments',dr:dQ7,ht:'<p>FOR: treat/prevent genetic disease, increase food production, reduce suffering, produce medicines (insulin), address nutritional deficiencies (Golden Rice), reduce pesticide use. AGAINST: unknown long-term effects, biodiversity loss, "playing God", designer babies, GM gene spread to wild species, corporate control of food supply, religious objections.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'An argument AGAINST GM crops is: 1=they always produce less food, 2=modified genes might spread to wild plant populations.',a:2,w:'Gene flow to wild plants: could create superweeds or affect ecosystems. Answer: 2.'},{q:'An argument FOR genetic engineering is: 1=it always increases biodiversity, 2=it can produce medicines like insulin cheaply and safely.',a:2,w:'GM bacteria produce human insulin: safe, affordable, abundant. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['For: medicines, more food, disease cure. Against: gene spread, unknown effects.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y11 Biology \u2022 Biotechnology',ti:'Gene Therapy',su:'Describe gene therapy and distinguish somatic from germline therapy.',steps:[
  {lb:'Gene therapy',dr:dQ8,ht:'<p>Gene therapy: introducing a working copy of a gene into cells to treat a genetic disease. <b>Somatic gene therapy:</b> modifies body cells (e.g. lung cells for cystic fibrosis). Changes not inherited. <b>Germline gene therapy:</b> modifies egg/sperm/early embryo. Changes ARE inherited by future generations. Currently banned in most countries.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Somatic gene therapy: 1=changes are passed to the patient\'s children, 2=changes affect only the patient\'s body cells (not inherited).',a:2,w:'Somatic = body cells only; not inherited by offspring. Answer: 2.'},{q:'Germline gene therapy is controversial because: 1=it is too expensive, 2=genetic changes would be passed to all future generations.',a:2,w:'Germline changes are inherited \u2192 ethical concerns about consent and "designer" humans. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Somatic: body cells, not inherited. Germline: inherited by future generations.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y11 Biology \u2022 Biotechnology',ti:'Stem Cell Technology',su:'Describe sources and uses of stem cells in medicine.',steps:[
  {lb:'Stem cells in medicine',dr:dQ9,ht:'<p>Embryonic stem cells (pluripotent): can become any cell type. Adult stem cells (multipotent): more limited. Induced pluripotent stem cells (iPSCs): adult cells reprogrammed to be pluripotent. Uses: replacing damaged cells (e.g. in Parkinson\u2019s, diabetes, spinal injury), drug testing, disease modelling. Ethical issue: destroying embryos.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'Embryonic stem cells are pluripotent, meaning: 1=they can only become muscle cells, 2=they can differentiate into almost any cell type.',a:2,w:'Pluripotent = can become most cell types in the body. Answer: 2.'},{q:'The main ethical concern about embryonic stem cell research is: 1=the cells divide too fast, 2=it requires destroying a human embryo.',a:2,w:'Embryo must be destroyed to extract stem cells \u2192 ethical debate. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Pluripotent: many cell types. Ethical: embryo destruction.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y11 Biology \u2022 Biotechnology',ti:'Mixed Biotechnology Questions',su:'Genetic engineering, monoclonal antibodies, PCR, gene therapy and ethics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Restriction enzymes: cut. Ligase: join. Plasmid: vector. GM insulin: bacteria. Monoclonal: hybridoma. PCR: amplify. Gene therapy: correct faulty gene. Somatic: not inherited.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['enzyme','antibody','pcr']);if(type==='enzyme'){var qs=[{q:'DNA ligase: 1=cuts DNA, 2=joins DNA fragments.',a:2,w:'DNA ligase = molecular glue, joins fragments. Answer: 2.'},{q:'Restriction enzymes: 1=join DNA, 2=cut DNA at specific sequences.',a:2,w:'Restriction enzymes cut at specific recognition sequences. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Restriction: cut. Ligase: join.'],ans:qq.a,tol:0,unit:'',working:qq.w};}if(type==='antibody'){var qs2=[{q:'A hybridoma cell is used to produce: 1=restriction enzymes, 2=monoclonal antibodies.',a:2,w:'Hybridoma: B cell + tumour cell \u2192 produces monoclonal antibodies. Answer: 2.'},{q:'Pregnancy tests use monoclonal antibodies to detect: 1=progesterone, 2=hCG hormone.',a:2,w:'hCG is produced in pregnancy; detected by monoclonal antibody. Answer: 2.'}];var qq2=pick(qs2);return{question:qq2.q,hints:['Hybridoma: monoclonal antibodies. Pregnancy test: detects hCG.'],ans:qq2.a,tol:0,unit:'',working:qq2.w};}return{question:'In PCR, DNA strands are separated by: 1=adding ligase, 2=heating to ~95\u00b0C.',hints:['Denaturation: heat breaks hydrogen bonds'],ans:2,tol:0,unit:'',working:'PCR denaturation step: 95\u00b0C separates DNA strands. Answer: 2.'};})},
]},
];
