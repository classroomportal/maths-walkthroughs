<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}

function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Structure of a flower','#2E7D32',13,'middle',true));
var parts=[['Stamen (anther+filament)','male part; produces pollen (male gametes)'],['Carpel (stigma+style+ovary)','female part; contains ovules (female gametes)'],['Sepals','protect flower in bud'],['Petals','attract pollinators (insects); often brightly coloured'],['Nectary','produces nectar to attract insects']];
parts.forEach(function(r,i){if(i<p+1){o.push(R(10,42+i*38,460,30,'#F1F8F1','#C8E6C9',1));o.push(T(170,60+i*38,r[0],'#2E7D32',10,'middle',true));o.push(T(390,60+i*38,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}

o.push(T(240,22,'Insect vs wind pollination','#2E7D32',12,'middle',true));

o.push(R(248,40,222,198,'#e8f5e9','#2E7D32',2));o.push(T(359,60,'WIND','#2E7D32',11,'middle',true));
var ins=['Large, colourful petals','Scented','Sweet nectar','Sticky/spiky pollen','Stigma inside flower'];
var win=['Small/no petals','No scent','No nectar','Light, smooth pollen (masses)','Feathery stigma outside flower'];
ins.forEach(function(v,i){if(i<p+1)o.push(T(121,82+i*28,v,'#333',8,'middle',false));});
win.forEach(function(v,i){if(i<p+1)o.push(T(359,82+i*28,v,'#333',8,'middle',false));});
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Fertilisation in plants','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,44,460,52,'#F1F8F1','#2E7D32',1.5));o.push(T(240,64,'1. Pollen grain lands on stigma (pollination)','#333',10,'middle',false));o.push(T(240,82,'2. Pollen tube grows down style to ovary','#333',9,'middle',false));}
if(p>=2){o.push(R(10,110,460,52,'#F1F8F1','#2E7D32',1.5));o.push(T(240,130,'3. Male nucleus travels down pollen tube','#333',10,'middle',false));o.push(T(240,148,'4. Male nucleus fuses with ovule nucleus (fertilisation)','#333',9,'middle',false));}
if(p>=3){o.push(R(10,176,460,52,'#e8f5e9','#2E7D32',1.5));o.push(T(240,196,'5. Fertilised ovule \u2192 seed','#2E7D32',11,'middle',true));o.push(T(240,214,'6. Ovary wall \u2192 fruit (surrounds seed)','#2E7D32',10,'middle',false));}
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Seed dispersal methods','#2E7D32',12,'middle',true));
[['Wind','light seeds with wings/parachutes: dandelion, sycamore'],['Animal (external)','hooks/spines catch on fur: burdock'],['Animal (eaten)','fleshy fruit eaten; seeds pass through: berries, apples'],['Water','waterproof seeds float: coconut'],['Explosion','seed pod bursts and flings seeds: peas, gorse']].forEach(function(r,i){if(i<p+1){o.push(R(10,42+i*38,460,30,'#F1F8F1','#C8E6C9',1));o.push(T(90,60+i*38,r[0],'#2E7D32',11,'middle',true));o.push(T(320,60+i*38,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}

function dQ6(p){dQ2(p);}
function dQ7(p){dQ3(p);}
function dQ8(p){dQ4(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Plant reproduction summary','#2E7D32',13,'middle',true));
[['Stamen','male: anther (pollen) + filament'],['Carpel','female: stigma + style + ovary (ovules)'],['Pollination','pollen transferred to stigma'],['Fertilisation','pollen tube grows; nuclei fuse; seed formed'],['Insect pollinated','large petals, scented, sticky pollen'],['Wind pollinated','small petals, light pollen, feathery stigma'],['Seed dispersal','wind, animal, water, explosion']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F1F8F1','#C8E6C9',1));o.push(T(110,52+i*30,r[0],'#2E7D32',10,'middle',true));o.push(T(330,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Biology \u2022 Plant Repro',ti:'Flower Structure',su:'Name the parts of a flower and give their functions.',steps:[
  {lb:'Parts of a flower',dr:dQ1,ht:'<p><b>Stamen</b> (male): anther (produces pollen) + filament (support). <b>Carpel</b> (female): stigma (receives pollen) + style + ovary (contains ovules). <b>Petals</b>: attract pollinators. <b>Sepals</b>: protect bud.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Which part of the flower produces pollen? 1=stigma, 2=anther, 3=ovary.',a:2,w:'Anther (part of stamen) produces pollen. Answer: 2.'},{q:'The stigma is: 1=the male part, 2=the sticky tip of the carpel that receives pollen.',a:2,w:'Stigma: top of carpel; receives pollen grains. Answer: 2.'},{q:'Ovules are found in the: 1=anther, 2=ovary.',a:2,w:'Ovules are inside the ovary (female gametes). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Stamen=male (anther). Carpel=female (stigma, ovary).'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Biology \u2022 Plant Repro',ti:'Pollination',su:'Distinguish insect and wind pollination. Describe cross and self-pollination.',steps:[
  {lb:'Insect vs wind',dr:dQ2,ht:'<p><b>Insect pollinated:</b> large colourful petals, scent, nectar, sticky/spiky pollen, stigma inside. <b>Wind pollinated:</b> small/no petals, no scent, light smooth pollen in huge quantities, feathery stigma hanging outside flower.</p>'},
  {lb:'Cross vs self-pollination',dr:dQ2,ht:'<p><b>Self-pollination:</b> pollen transferred to stigma of same flower/plant. Produces less variation. <b>Cross-pollination:</b> pollen from one plant to another plant. Produces more genetic variation (preferred in natural selection).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'A flower with large, colourful petals and sweet nectar is most likely: 1=wind pollinated, 2=insect pollinated.',a:2,w:'Large petals and nectar = adaptations to attract insects. Answer: 2.'},{q:'Wind pollinated flowers have: 1=sticky pollen and bright petals, 2=light pollen and feathery stigmas.',a:2,w:'Wind: light pollen, feathery stigma to catch it. Answer: 2.'},{q:'Cross-pollination produces: 1=identical offspring, 2=greater genetic variation.',a:2,w:'Cross-pollination: different plants \u2192 more variation. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Insect: big petals, nectar, sticky pollen. Wind: light pollen, feathery stigma.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},

  {lb:'From pollination to seed',dr:dQ3,ht:'<p>1. Pollen grain lands on stigma. 2. Pollen tube grows down style into ovary. 3. Male nucleus travels down pollen tube. 4. Male nucleus fuses with female nucleus in ovule (fertilisation). 5. Fertilised ovule \u2192 seed. 6. Ovary wall \u2192 fruit.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'After fertilisation, the ovule develops into: 1=a fruit, 2=a seed.',a:2,w:'Ovule \u2192 seed. Ovary \u2192 fruit. Answer: 2.'},{q:'The pollen tube grows from the: 1=stigma down to the ovule, 2=ovule up to the stigma.',a:1,w:'Pollen tube grows from stigma \u2192 style \u2192 ovary \u2192 ovule. Answer: 1.'},{q:'After fertilisation, the ovary wall develops into: 1=a seed, 2=a fruit.',a:2,w:'Ovary wall \u2192 fruit (surrounds seed). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Ovule \u2192 seed. Ovary \u2192 fruit. Pollen tube grows to ovule.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y11 Biology \u2022 Plant Repro',ti:'Seed Dispersal',su:'Describe methods of seed dispersal and their adaptations.',steps:[
  {lb:'Five methods',dr:dQ4,ht:'<p>Wind: light seeds with wings (sycamore) or parachutes (dandelion). Animal external: hooks/spines (burdock). Animal eaten: fleshy fruits (berries), seeds pass through gut. Water: waterproof floating seeds (coconut). Explosion: seed pod bursts (peas, gorse).</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'A dandelion seed has a feathery parachute. It is dispersed by: 1=animals, 2=wind.',a:2,w:'Feathery parachute = wind dispersal adaptation. Answer: 2.'},{q:'A coconut can float in seawater. It is dispersed by: 1=water, 2=explosion.',a:1,w:'Coconut: waterproof and buoyant = water dispersal. Answer: 1.'},{q:'Burdock seeds have hooks that catch on animal fur. This is: 1=external animal dispersal, 2=wind dispersal.',a:1,w:'Hooks on fur = external animal dispersal. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Match seed adaptation to dispersal method'],ans:qq.a,tol:0,unit:'',working:qq.w};})},

  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Vegetative propagation produces offspring that are: 1=genetically varied, 2=genetically identical (clones).',a:2,w:'Vegetative propagation is asexual \u2192 clones. Answer: 2.'},{q:'A potato tuber is an example of: 1=sexual reproduction, 2=vegetative (asexual) propagation.',a:2,w:'Tubers are a form of asexual vegetative propagation. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Vegetative propagation = asexual = clones'],ans:qq.a,tol:0,unit:'',working:qq.w};})},

{ey:'Q7 \u2022 Y11 Biology \u2022 Plant Repro',ti:'Comparing Plant and Animal Reproduction',su:'Compare reproduction strategies in plants and animals.',steps:[
  {lb:'Comparison',dr:dQ7,ht:'<p>Both use sexual reproduction with gametes and fertilisation. Plants can also reproduce asexually (vegetative propagation). Animal gametes: sperm + egg. Plant gametes: pollen + ovule. Fertilisation in animals: internal (mammals) or external (fish). In plants: pollen tube ensures internal-like fertilisation even in terrestrial environments.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'In plants, the male gamete is: 1=an egg cell, 2=pollen (contains male nucleus).',a:2,w:'Pollen contains the male nucleus (male gamete). Answer: 2.'},{q:'One advantage plants have over most animals in reproduction: 1=they can reproduce both sexually and asexually, 2=their gametes are larger.',a:1,w:'Plants: both sexual and asexual reproduction. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Plant male gamete: pollen. Plants: sexual AND asexual.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y11 Biology \u2022 Plant Repro',ti:'Investigating Germination',su:'Design and interpret germination experiments.',steps:[
  {lb:'Germination experiments',dr:dQ8,ht:'<p>To test which factors affect germination: set up controlled experiments varying one factor at a time (water, temperature, oxygen). Count % seeds germinated after set time. Control: all seeds same species, same quantity of factor being tested.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var pct=rnd(60,95),n=rnd(20,50),germinated=Math.round(n*pct/100);return{question:'<b>'+n+'</b> seeds planted. <b>'+germinated+'</b> germinated. Find germination rate (%).',hints:['% = (germinated/total) \u00d7 100'],ans:pct,tol:2,unit:'%',working:germinated+'/'+n+'\u00d7100 = '+pct+'%'};})},
]},
{ey:'Q9 \u2022 Y11 Biology \u2022 Plant Repro',ti:'Tissue Culture (Micropropagation)',su:'Describe tissue culture and its applications.',steps:[
  {lb:'Tissue culture',dr:dQ9,ht:'<p>Tissue culture: small pieces of plant tissue (explants) grown on sterile nutrient agar with growth hormones (auxins, cytokinins) \u2192 callus forms \u2192 shoots and roots develop \u2192 plantlets transferred to soil. Produces thousands of identical plants quickly. Used for rare/endangered plants, disease-free crops, orchids.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'Tissue culture produces plants that are: 1=genetically varied, 2=genetically identical to the parent.',a:2,w:'Tissue culture = asexual \u2192 all clones of parent. Answer: 2.'},{q:'Tissue culture is carried out in: 1=sterile conditions, 2=normal garden soil.',a:1,w:'Must be sterile to prevent contamination by bacteria/fungi. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Tissue culture: sterile, clones, rapid propagation'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y11 Biology \u2022 Plant Repro',ti:'Mixed Plant Reproduction',su:'Flower structure, pollination, fertilisation, dispersal and germination.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Anther: pollen. Stigma: receives pollen. Ovule\u2192seed. Ovary\u2192fruit. Insect: sticky pollen, petals. Wind: light pollen, feathery stigma. Germination: water+warmth+O\u2082.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['structure','pollination','dispersal']);if(type==='structure'){var qs=[{q:'Pollen is produced in the: 1=stigma, 2=anther.',a:2,w:'Anther produces pollen. Answer: 2.'},{q:'After fertilisation, the ovule becomes: 1=a fruit, 2=a seed.',a:2,w:'Ovule \u2192 seed. Ovary \u2192 fruit. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Anther: pollen. Ovule: seed. Ovary: fruit.'],ans:qq.a,tol:0,unit:'',working:qq.w};}if(type==='pollination'){var qs2=[{q:'Insect-pollinated flowers have: 1=light pollen and no petals, 2=large petals and sticky pollen.',a:2,w:'Insect: large petals, sticky pollen. Answer: 2.'},{q:'Wind-pollinated flowers have: 1=feathery stigmas outside flower, 2=sticky stigmas inside flower.',a:1,w:'Wind: feathery stigma outside to catch airborne pollen. Answer: 1.'}];var qq2=pick(qs2);return{question:qq2.q,hints:['Insect: big petals, sticky. Wind: feathery stigma, light pollen.'],ans:qq2.a,tol:0,unit:'',working:qq2.w};}return{question:'Seeds need which THREE things to germinate? 1=water+light+warmth, 2=water+warmth+oxygen.',hints:['Light not needed for germination'],ans:2,tol:0,unit:'',working:'Water, warmth and oxygen needed. Light not required. Answer: 2.'};})},
]},
];
