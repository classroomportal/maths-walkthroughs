<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Asexual vs sexual reproduction','#2E7D32',13,'middle',true));
o.push(R(10,40,222,198,'#F1F8F1','#2E7D32',2));o.push(T(121,60,'ASEXUAL','#2E7D32',12,'middle',true));
o.push(R(248,40,222,198,'#e8f5e9','#2E7D32',2));o.push(T(359,60,'SEXUAL','#2E7D32',12,'middle',true));
var a=['One parent only','No gametes','Offspring identical (clones)','Fast, no mate needed','No genetic variation','E.g. binary fission, budding, runners'];
var s2=['Two parents','Gametes (sex cells)','Offspring genetically varied','Slower, need mate','Genetic variation','E.g. humans, flowering plants'];
a.forEach(function(v,i){if(i<p+1)o.push(T(121,84+i*26,v,'#333',8,'middle',false));});
s2.forEach(function(v,i){if(i<p+1)o.push(T(359,84+i*26,v,'#333',8,'middle',false));});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Mitosis vs meiosis','#2E7D32',13,'middle',true));
[['Feature','Mitosis','Meiosis'],['Purpose','Growth/repair/asexual repro','Sexual reproduction (gametes)'],['Divisions','1','2'],['Daughter cells','2','4'],['Chromosome number','Diploid (2n)','Haploid (n)'],['Genetic variation','None (identical)','Yes (crossing over)']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(90,55+i*33,r[0],'#2E7D32',9,'middle',i===0));o.push(T(260,55+i*33,r[1],'#333',8,'middle',false));o.push(T(410,55+i*33,r[2],'#333',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Advantages of sexual vs asexual reproduction','#2E7D32',11,'middle',true));
if(p>=1){o.push(R(10,44,460,80,'#F1F8F1','#2E7D32',1.5));o.push(T(240,64,'ASEXUAL advantages','#2E7D32',11,'middle',true));o.push(T(240,82,'Fast; no mate needed; all offspring reproduce; stable environment','#555',9,'middle',false));}
if(p>=2){o.push(R(10,140,460,80,'#e8f5e9','#2E7D32',1.5));o.push(T(240,160,'SEXUAL advantages','#2E7D32',11,'middle',true));o.push(T(240,178,'Genetic variation; adaptability; disease resistance; evolution','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ5(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Reproduction summary','#2E7D32',13,'middle',true));
[['Asexual','1 parent; clones; no gametes; fast'],['Sexual','2 parents; variation; gametes; slower'],['Mitosis','2 diploid cells; growth/repair'],['Meiosis','4 haploid cells; gametes; variation'],['Gametes','sperm + egg (animals); pollen + ovule (plants)'],['Fertilisation','fusion of gametes; restores diploid number']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(120,55+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(340,55+i*33,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Biology \u2022 Reproduction',ti:'Asexual vs Sexual Reproduction',su:'Compare asexual and sexual reproduction.',steps:[
  {lb:'Two types',dr:dQ1,ht:'<p><b>Asexual:</b> one parent, no gametes, offspring are clones (genetically identical). Fast, no mate needed. No genetic variation. Examples: binary fission (bacteria), budding (yeast), runners (strawberry).<br><b>Sexual:</b> two parents, gametes fuse, offspring are genetically varied. Slower but produces variation for natural selection.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Which type of reproduction produces genetically identical offspring? 1=asexual, 2=sexual.',a:1,w:'Asexual: offspring are clones. Answer: 1.'},{q:'Which type of reproduction requires gametes? 1=asexual, 2=sexual.',a:2,w:'Sexual reproduction requires gametes (sex cells). Answer: 2.'},{q:'Binary fission in bacteria is an example of: 1=asexual, 2=sexual reproduction.',a:1,w:'Binary fission: one cell splits into two identical cells = asexual. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Asexual: 1 parent, clones. Sexual: 2 parents, variation.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Biology \u2022 Reproduction',ti:'Mitosis and Meiosis',su:'Compare mitosis and meiosis in terms of purpose, divisions and daughter cells.',steps:[
  {lb:'Mitosis',dr:dQ2,ht:'<p><b>Mitosis:</b> one division, produces 2 genetically identical diploid (2n) daughter cells. Used for: growth, repair, asexual reproduction.</p>'},
  {lb:'Meiosis',dr:dQ2,ht:'<p><b>Meiosis:</b> two divisions, produces 4 haploid (n) daughter cells. Genetic variation occurs via crossing over. Used for: production of gametes (sex cells) in sexual reproduction.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Meiosis produces how many daughter cells? 1=2, 2=4.',a:2,w:'Meiosis: 2 divisions \u2192 4 haploid cells. Answer: 2.'},{q:'Which process produces genetically identical cells? 1=mitosis, 2=meiosis.',a:1,w:'Mitosis: identical diploid cells. Answer: 1.'},{q:'Gametes are produced by: 1=mitosis, 2=meiosis.',a:2,w:'Meiosis produces haploid gametes. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Mitosis: 2 diploid, identical. Meiosis: 4 haploid, varied.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y11 Biology \u2022 Reproduction',ti:'Gametes and Fertilisation',su:'Describe gametes and the process of fertilisation.',steps:[
  {lb:'Gametes',dr:dQ3,ht:'<p>Gametes are haploid (n) sex cells. In animals: sperm (male) and egg/ovum (female). In plants: pollen (male) and ovule (female). Gametes are produced by meiosis. They contain half the normal chromosome number.</p>'},
  {lb:'Fertilisation',dr:dQ3,ht:'<p>Fertilisation: fusion of male and female gametes. Produces a diploid (2n) zygote, which divides by mitosis to form an embryo. Internal fertilisation (inside body, e.g. mammals) vs external (outside, e.g. fish, frogs).</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'After fertilisation, the zygote is: 1=haploid (n), 2=diploid (2n).',a:2,w:'Fertilisation: haploid gametes fuse \u2192 diploid zygote. Answer: 2.'},{q:'Gametes are produced by: 1=mitosis, 2=meiosis.',a:2,w:'Meiosis produces haploid gametes. Answer: 2.'},{q:'In humans, the male gamete is: 1=an egg, 2=a sperm cell.',a:2,w:'Sperm = male gamete in humans. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Gametes: haploid (n). Zygote after fertilisation: diploid (2n).'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y11 Biology \u2022 Reproduction',ti:'Advantages of Each Reproduction Type',su:'Evaluate the advantages and disadvantages of asexual and sexual reproduction.',steps:[
  {lb:'Asexual advantages',dr:dQ4,ht:'<p>Asexual: all offspring can reproduce; fast colonisation; no energy wasted finding a mate; useful in stable environments when parent is well-adapted.<br>Disadvantage: no variation \u2014 disease can wipe out all clones.</p>'},
  {lb:'Sexual advantages',dr:dQ4,ht:'<p>Sexual: produces genetic variation; variation allows natural selection; populations can adapt to changing environments; disease resistance is varied.<br>Disadvantage: requires finding a mate; slower; only females reproduce.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Why is sexual reproduction advantageous in a changing environment? 1=offspring are identical, 2=genetic variation allows adaptation.',a:2,w:'Variation allows some offspring to survive new conditions. Answer: 2.'},{q:'Why can a disease wipe out an entire population that reproduces asexually? 1=all offspring are genetically identical, 2=they have no immune system.',a:1,w:'All clones have same susceptibility \u2192 disease kills all. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Asexual: fast, no variation. Sexual: slower, variation for adaptation.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y11 Biology \u2022 Reproduction',ti:'Cloning',su:'Describe natural and artificial cloning methods.',steps:[
  {lb:'Natural and artificial cloning',dr:dQ5,ht:'<p><b>Natural clones:</b> identical twins, vegetative propagation (runners, bulbs, tubers).<br><b>Artificial cloning in plants:</b> cuttings, tissue culture (micropropagation).<br><b>Artificial cloning in animals:</b> embryo splitting, somatic cell nuclear transfer (SCNT \u2014 Dolly the sheep). Uses: medicine, conservation, agriculture.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Dolly the sheep was produced by: 1=embryo splitting, 2=somatic cell nuclear transfer (SCNT).',a:2,w:'Dolly: nucleus from adult cell transferred to enucleated egg = SCNT. Answer: 2.'},{q:'Identical twins are: 1=artificial clones, 2=natural clones.',a:2,w:'Identical twins arise from one fertilised egg splitting = natural clones. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['SCNT: nucleus from body cell into egg. Identical twins: natural clones.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y11 Biology \u2022 Reproduction',ti:'The Cell Cycle',su:'Describe the stages of the cell cycle.',steps:[
  {lb:'Cell cycle',dr:dQ6,ht:'<p>The cell cycle: <b>Interphase</b> (G1: cell growth; S: DNA replication; G2: preparation for division) \u2192 <b>Mitosis</b> (PMAT: Prophase, Metaphase, Anaphase, Telophase) \u2192 <b>Cytokinesis</b> (cytoplasm divides). Most time is spent in interphase.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'When does DNA replication occur in the cell cycle? 1=during mitosis, 2=during S phase of interphase.',a:2,w:'DNA replication occurs in S phase (Synthesis) of interphase. Answer: 2.'},{q:'Which phase of mitosis do chromosomes line up at the equator? 1=Prophase, 2=Metaphase, 3=Anaphase.',a:2,w:'Metaphase: chromosomes align at cell equator. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Interphase: G1, S (DNA replication), G2. Mitosis: PMAT.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y11 Biology \u2022 Reproduction',ti:'In Vitro Fertilisation (IVF)',su:'Describe IVF and its medical and ethical implications.',steps:[
  {lb:'IVF',dr:dQ7,ht:'<p>IVF (in vitro fertilisation): eggs collected from woman (after hormone stimulation), fertilised with sperm in a lab, embryos cultured, one or two implanted into uterus. Used to treat infertility. Multiple embryos created \u2014 raises ethical issues about unused embryos.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'In IVF, fertilisation occurs: 1=inside the uterus, 2=in a laboratory.',a:2,w:'In vitro = in glass = outside the body, in a lab. Answer: 2.'},{q:'IVF is used to treat: 1=genetic disorders, 2=infertility.',a:2,w:'IVF helps infertile couples have children. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['In vitro: in lab. IVF: treatment for infertility.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y11 Biology \u2022 Reproduction',ti:'Stem Cells and Reproduction',su:'Explain how stem cells relate to reproduction and development.',steps:[
  {lb:'Stem cells in development',dr:dQ8,ht:'<p>After fertilisation, the zygote divides by mitosis to form a ball of cells (morula \u2192 blastocyst). At the blastocyst stage, embryonic stem cells are <b>totipotent/pluripotent</b> \u2014 can develop into any cell type. Differentiation then occurs as cells specialise.</p>'},

]},

]},
