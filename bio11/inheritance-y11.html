<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Key genetics terms','#2E7D32',13,'middle',true));
[['Gene','a section of DNA that codes for a protein/characteristic'],['Allele','alternative forms of a gene (e.g. T or t)'],['Genotype','genetic makeup (e.g. TT, Tt, tt)'],['Phenotype','observable characteristic (e.g. tall or short)'],['Dominant','allele expressed even in heterozygous state (capital)'],['Recessive','only expressed when homozygous (lower case)'],['Homozygous','two identical alleles (TT or tt)'],['Heterozygous','two different alleles (Tt)']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*27,460,20,'#F1F8F1','#C8E6C9',1));o.push(T(100,50+i*27,r[0],'#2E7D32',9,'middle',true));o.push(T(310,50+i*27,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Punnett square (monohybrid cross)','#2E7D32',12,'middle',true));
o.push(T(160,60,'T','#2E7D32',14,'middle',true));o.push(T(280,60,'t','#2E7D32',14,'middle',true));
o.push(T(80,110,'T','#2E7D32',14,'middle',true));o.push(T(80,180,'t','#2E7D32',14,'middle',true));
o.push(R(110,76,370,44,'#e8f5e9','#2E7D32',1));o.push(R(110,120,370,44,'#e8f5e9','#2E7D32',1));
o.push(R(110,164,370,44,'#e8f5e9','#2E7D32',1));
if(p>=1){o.push(T(160,104,'TT','#2E7D32',13,'middle',true));o.push(T(280,104,'Tt','#2E7D32',13,'middle',true));}
if(p>=2){o.push(T(160,148,'Tt','#2E7D32',13,'middle',true));o.push(T(280,148,'tt','#C0272D',13,'middle',true));}
if(p>=3){o.push(T(240,226,'3 tall (TT+2Tt) : 1 short (tt) \u2014 ratio 3:1','#555',10,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Co-dominance: ABO blood groups','#2E7D32',12,'middle',true));
o.push(R(10,40,460,188,'#F1F8F1','#2E7D32',1.5));
[['Blood Group','Genotype(s)','Antigen on RBC'],['A','I\u1d2aI\u1d2a or I\u1d2ai','A antigen'],['B','I\u1d2cI\u1d2c or I\u1d2ci','B antigen'],['AB','I\u1d2aI\u1d2c','Both A and B (co-dominant)'],['O','ii','No antigen']].forEach(function(r,i){o.push(R(10,40+i*36,460,34,'#F1F8F1','#C8E6C9',1));if(i<p+1){o.push(T(90,62+i*36,r[0],'#2E7D32',10,'middle',i===0));o.push(T(250,62+i*36,r[1],'#333',9,'middle',false));o.push(T(390,62+i*36,r[2],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ5(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Inheritance summary','#2E7D32',13,'middle',true));
[['Dominant allele','expressed in hetero and homozygous (capital letter)'],['Recessive allele','only expressed when homozygous (lower case)'],['Monohybrid cross','Punnett square; Tt\u00d7Tt \u2192 3:1 ratio'],['Co-dominance','both alleles expressed (e.g. blood group AB)'],['Sex determination','XX=female, XY=male; 50:50 ratio'],['X-linked','gene on X chromosome; males more affected (e.g. colour blindness)']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(130,55+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(350,55+i*33,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Biology \u2022 Inheritance',ti:'Key Genetics Terms',su:'Define gene, allele, genotype, phenotype, dominant, recessive, homozygous, heterozygous.',steps:[
  {lb:'Key terms',dr:dQ1,ht:'<p><b>Gene:</b> section of DNA coding for a characteristic. <b>Allele:</b> alternative form of a gene (T or t). <b>Genotype:</b> genetic makeup (TT, Tt, tt). <b>Phenotype:</b> observable trait. <b>Dominant:</b> expressed when one or two copies present. <b>Recessive:</b> only expressed when homozygous. <b>Homozygous:</b> two identical alleles. <b>Heterozygous:</b> two different alleles.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'A plant with genotype Tt (one dominant T, one recessive t) is: 1=homozygous, 2=heterozygous.',a:2,w:'Two different alleles = heterozygous. Answer: 2.'},{q:'If T (tall) is dominant over t (short), what is the phenotype of Tt? 1=short, 2=tall.',a:2,w:'Dominant allele T expressed \u2192 phenotype is tall. Answer: 2.'},{q:'The genotype tt means: 1=heterozygous, 2=homozygous recessive.',a:2,w:'Two identical recessive alleles = homozygous recessive. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Dominant: capital. Recessive: lower. Hetero: different. Homo: same.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Biology \u2022 Inheritance',ti:'Monohybrid Cross (Punnett Square)',su:'Use Punnett squares to predict offspring genotype ratios.',steps:[
  {lb:'Punnett square',dr:dQ2,ht:'<p>Cross Tt \u00d7 Tt (tall heterozygous parents). Draw 2\u00d72 grid; parents\u2019 alleles on top and side. Fill in all combinations: TT, Tt, Tt, tt. Ratio: 3 tall : 1 short (3:1).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var crosses=[{p1:'TT',p2:'tt',desc:'TT\u00d7tt',tt:0,Tt:4,tt2:0,pheno:'all tall',ratio:'all tall (Tt)'},
{p1:'Tt',p2:'tt',desc:'Tt\u00d7tt (testcross)',tt:0,Tt:2,tt2:2,pheno:'1 tall:1 short',ratio:'1:1'},
{p1:'Tt',p2:'Tt',desc:'Tt\u00d7Tt',tt:1,Tt:2,tt2:1,pheno:'3 tall:1 short',ratio:'3:1'}];
var cr=pick(crosses);var type=pick(['tall_count','short_count']);
if(cr.ratio==='all tall (Tt)'){return{question:cr.desc+' cross. How many out of 4 offspring are tall?',hints:['TT\u00d7tt: all Tt = all tall'],ans:4,tol:0,unit:'',working:'All offspring Tt = all tall. Answer: 4'};}
if(cr.ratio==='1:1'){return{question:cr.desc+'. Out of 4 offspring, how many are TALL?',hints:['Tt\u00d7tt: Tt,Tt,tt,tt \u2192 2 tall'],ans:2,tol:0,unit:'',working:'Tt\u00d7tt gives Tt,Tt,tt,tt: 2 tall. Answer: 2'};}
return{question:'Tt\u00d7Tt. Out of 4 offspring, how many are SHORT (tt)?',hints:['Punnett: TT,Tt,Tt,tt \u2192 1 short'],ans:1,tol:0,unit:'',working:'Tt\u00d7Tt: TT,Tt,Tt,tt. Only tt is short. Answer: 1'};})}
]},
{ey:'Q3 \u2022 Y11 Biology \u2022 Inheritance',ti:'Sex Determination',su:'Explain how sex is determined in humans. Use sex chromosome notation.',steps:[
  {lb:'XX and XY',dr:dQ3,ht:'<p>Humans have 23 pairs of chromosomes. Pair 23 = sex chromosomes. <b>Female: XX</b> (two X chromosomes). <b>Male: XY</b> (one X, one Y). During meiosis: females produce all X eggs; males produce X or Y sperm. 50:50 chance of male or female offspring at each pregnancy.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'A person with genotype XY is: 1=female, 2=male.',a:2,w:'XY = male. Answer: 2.'},{q:'Out of 4 children, how many would be expected to be female (XX)?',hints:['50:50 ratio: XX or XY equally likely'],ans:2,tol:0,unit:'children',working:'Expected 50% female = 2 out of 4.'},{q:'All eggs produced by a human female contain: 1=X chromosome, 2=Y chromosome.',a:1,w:'Females are XX; all eggs carry X. Answer: 1.'}];var qq=pick(qs);if(qq.ans===2&&qq.q.includes('female'))return{question:qq.q,hints:qq.hints,ans:qq.ans,tol:qq.tol,unit:qq.unit,working:qq.working};return{question:qq.q,hints:['XX=female, XY=male. Females produce only X eggs.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y11 Biology \u2022 Inheritance',ti:'Co-dominance and Blood Groups',su:'Explain co-dominance using ABO blood groups.',steps:[
  {lb:'ABO blood groups',dr:dQ4,ht:'<p>Three alleles: I\u1d2a (blood group A), I\u1d2c (blood group B), i (blood group O). I\u1d2a and I\u1d2c are both dominant over i. I\u1d2a and I\u1d2c are <b>co-dominant</b> with each other: I\u1d2aI\u1d2c \u2192 blood group AB (both antigens expressed).</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Genotype I\u1d2aI\u1d2c gives blood group: 1=A, 2=B, 3=AB.',a:3,w:'Co-dominant: both I\u1d2a and I\u1d2c expressed \u2192 blood group AB. Answer: 3.'},{q:'Blood group O has genotype: 1=I\u1d2aI\u1d2a, 2=ii, 3=I\u1d2aI\u1d2c.',a:2,w:'Blood group O = ii (no A or B antigen). Answer: 2.'},{q:'I\u1d2a and I\u1d2c are co-dominant because: 1=one masks the other, 2=both are expressed in the heterozygote.',a:2,w:'Co-dominance: both alleles expressed in heterozygous individual. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['I\u1d2aI\u1d2c = AB (co-dominant). ii = O.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y11 Biology \u2022 Inheritance',ti:'X-linked Inheritance',su:'Explain X-linked traits. Solve colour blindness problems.',steps:[
  {lb:'X-linked traits',dr:dQ5,ht:'<p>X-linked genes are on the X chromosome. Males (XY) have only one X \u2192 a single recessive allele causes disease. Females (XX) need two copies to show the trait \u2014 may be carriers (X\u1d2cX, one normal and one affected allele).<br>Colour blindness: X\u1d2c = colour blind allele. X\u1d2c Y males are colour blind.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'A colour blind male has genotype: 1=X\u1d2cY, 2=X\u1d2cX\u1d2c.',a:1,w:'Males have one X: X\u1d2cY = colour blind. Answer: 1.'},{q:'A female carrier for colour blindness has genotype: 1=XX\u1d2c (one normal, one affected X), 2=X\u1d2cX\u1d2c.',a:1,w:'Carrier female: X\u1d2cX = one normal X, one colour blind X. Answer: 1.'},{q:'Why are males more likely to be colour blind than females? 1=males only need one recessive allele on their single X, 2=males have more Y chromosomes.',a:1,w:'Males have only one X \u2192 single recessive allele causes trait. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Males: one X only. Single recessive allele = affected. Females need two.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y11 Biology \u2022 Inheritance',ti:'Genetic Crosses with Ratios',su:'Calculate expected ratios from genetic crosses.',steps:[
  {lb:'Using ratios',dr:dQ6,ht:'<p>Tt \u00d7 Tt \u2192 1TT : 2Tt : 1tt (genotype ratio 1:2:1) or 3 dominant : 1 recessive (phenotype ratio 3:1). TT \u00d7 tt \u2192 all Tt (all show dominant phenotype). Tt \u00d7 tt \u2192 1Tt : 1tt (1:1 phenotype ratio).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var crosses=[{cross:'Tt\u00d7Tt',dominant:3,recessive:1,total:4},{cross:'Tt\u00d7tt',dominant:2,recessive:2,total:4},{cross:'TT\u00d7tt',dominant:4,recessive:0,total:4}];var cr=pick(crosses);if(cr.recessive===0)return{question:cr.cross+': out of 4 offspring, how many show the DOMINANT phenotype?',hints:['TT\u00d7tt: all Tt = all dominant'],ans:4,tol:0,unit:'',working:'All offspring Tt \u2192 all dominant. Answer: 4'};return{question:cr.cross+': out of 4 offspring, how many show the RECESSIVE phenotype?',hints:['Count tt offspring from Punnett square'],ans:cr.recessive,tol:0,unit:'',working:'Recessive (tt) offspring: '+cr.recessive+' out of 4. Answer: '+cr.recessive};})},
]},
{ey:'Q7 \u2022 Y11 Biology \u2022 Inheritance',ti:'Inherited Diseases',su:'Describe cystic fibrosis and sickle cell anaemia as examples of inherited diseases.',steps:[
  {lb:'Inherited diseases',dr:dQ7,ht:'<p><b>Cystic fibrosis:</b> autosomal recessive (ff). Affects lungs (thick mucus), digestive system. Carriers (Ff) appear normal.<br><b>Sickle cell anaemia:</b> co-dominant in some models. H\u1d2aH\u1d2c = sickle cell trait (some protection against malaria). H\u1d2cH\u1d2c = full sickle cell disease.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Two carrier parents (Ff) for cystic fibrosis. Probability of affected child (ff)? 1=1 in 4, 2=3 in 4.',a:1,w:'Ff\u00d7Ff: FF, Ff, Ff, ff \u2192 1 in 4 chance of ff (affected). Answer: 1.'},{q:'Cystic fibrosis is caused by: 1=a dominant allele, 2=a recessive allele (must have two copies).',a:2,w:'CF is autosomal recessive (ff). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['CF: recessive (ff). Ff\u00d7Ff \u2192 1 in 4 affected.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y11 Biology \u2022 Inheritance',ti:'Family Trees (Pedigree Diagrams)',su:'Interpret pedigree diagrams to determine patterns of inheritance.',steps:[
  {lb:'Reading pedigrees',dr:dQ8,ht:'<p>Circles = females, squares = males. Shaded = affected. Lines connect parents; vertical lines to offspring. To determine if dominant or recessive: if two unaffected parents have affected child \u2192 must be recessive. If every generation affected \u2192 likely dominant.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Two unaffected parents have an affected child. The condition is: 1=dominant, 2=recessive.',a:2,w:'Unaffected parents with affected child \u2192 both parents are carriers (Aa) \u2192 recessive. Answer: 2.'},{q:'In a pedigree, circles represent: 1=males, 2=females.',a:2,w:'Circles = females; squares = males. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Circles=females. Unaffected parents+affected child=recessive.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y11 Biology \u2022 Inheritance',ti:'Genetic Screening and Ethical Issues',su:'Describe genetic screening and discuss ethical implications.',steps:[
  {lb:'Genetic screening',dr:dQ9,ht:'<p>Genetic screening: testing individuals or embryos for genetic conditions. Methods: amniocentesis (sampling amniotic fluid), chorionic villus sampling (CVS), preimplantation genetic diagnosis (PGD) in IVF. Benefits: allows informed choices. Ethical issues: selective termination, discrimination, designer babies, privacy.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'PGD (preimplantation genetic diagnosis) is used to: 1=select embryos free from genetic disease before IVF implantation, 2=treat genetic disease after birth.',a:1,w:'PGD screens embryos before implantation in IVF. Answer: 1.'},{q:'An ethical concern about genetic screening is: 1=it is too cheap, 2=it may lead to discrimination against carriers of genetic conditions.',a:2,w:'Discrimination against carriers/affected individuals is a key ethical concern. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['PGD: select healthy embryos in IVF. Ethical: discrimination, choice.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y11 Biology \u2022 Inheritance',ti:'Mixed Inheritance Questions',su:'Punnett squares, ratios, sex linkage, co-dominance and blood groups.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Dominant: capital letter; expressed in Tt and TT. Recessive: lower case; only in tt. Tt\u00d7Tt \u2192 3:1 ratio. XX=female, XY=male. Co-dominant: both expressed (e.g. AB blood group). X-linked: males more affected.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['punnett','blood','sex']);if(type==='punnett'){var qs=[{q:'Tt\u00d7Tt. How many out of 4 are recessive (tt)?',ans:1,w:'TT, Tt, Tt, tt \u2192 1 recessive. Answer: 1.'},{q:'Tt\u00d7tt. How many out of 4 are tall (Tt)?',ans:2,w:'Tt, Tt, tt, tt \u2192 2 tall. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Draw Punnett square to count'],ans:qq.ans,tol:0,unit:'',working:qq.w};}if(type==='blood'){var qs2=[{q:'Blood group AB has genotype: 1=I\u1d2aI\u1d2a, 2=I\u1d2aI\u1d2c, 3=ii.',a:2,w:'AB = I\u1d2aI\u1d2c (co-dominant). Answer: 2.'},{q:'Blood group O has genotype: 1=I\u1d2aI\u1d2a, 2=I\u1d2ci, 3=ii.',a:3,w:'O = ii. Answer: 3.'}];var qq2=pick(qs2);return{question:qq2.q,hints:['AB=I\u1d2aI\u1d2c. O=ii.'],ans:qq2.a,tol:0,unit:'',working:qq2.w};}return{question:'A male is XY. His sex chromosomes came from: 1=X from father, Y from mother, 2=X from mother, Y from father.',hints:['Father gives X or Y; mother always gives X'],ans:2,tol:0,unit:'',working:'Mother gives X; father gives Y (XY male). Answer: 2.'};})},
]},
];
