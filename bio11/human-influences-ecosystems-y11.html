<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Human impacts on ecosystems','#2E7D32',13,'middle',true));
[['Deforestation','loss of habitat, biodiversity, carbon store; soil erosion; flooding'],['Overexploitation','overfishing, hunting; reduces population below sustainable level'],['Pollution','air (CO\u2082, SO\u2082, NOx), water (nitrates, sewage), land (pesticides, plastics)'],['Climate change','rising temperatures; habitat loss; species extinction; ocean acidification'],['Invasive species','outcompete native species; reduce biodiversity'],['Agriculture','monocultures reduce biodiversity; pesticides and fertilisers pollute water']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#fde8e8','#C0272D',1));o.push(T(120,55+i*33,r[0],'#C0272D',10,'middle',true));o.push(T(340,55+i*33,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Greenhouse effect and climate change','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,44,460,52,'#F1F8F1','#2E7D32',1.5));o.push(T(240,64,'Natural greenhouse effect: CO\u2082, CH\u2084, H\u2082O trap heat \u2014 essential for life','#333',10,'middle',false));o.push(T(240,82,'Enhanced greenhouse effect: extra CO\u2082 from burning fossil fuels','#555',9,'middle',false));}
if(p>=2){o.push(R(10,110,460,52,'#fde8e8','#C0272D',1.5));o.push(T(240,130,'Effects of climate change:','#C0272D',11,'middle',true));o.push(T(240,148,'Rising temperatures \u2022 melting ice \u2022 rising sea levels \u2022 extreme weather','#555',9,'middle',false));}
if(p>=3){o.push(R(10,176,460,52,'#e8f5e9','#2E7D32',1.5));o.push(T(240,196,'Reducing impact: renewable energy, energy efficiency,','#2E7D32',10,'middle',false));o.push(T(240,214,'reforestation, international agreements (Paris, Kyoto)','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Eutrophication','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,44,460,30,'#e8f5e9','#2E7D32',1.5));o.push(T(240,63,'1. Nitrate/phosphate fertilisers washed into water (leaching/runoff)','#333',10,'middle',false));}
if(p>=2){o.push(R(10,84,460,30,'#e8f5e9','#2E7D32',1.5));o.push(T(240,103,'2. Algae bloom (rapid algae growth) blocks light below','#333',10,'middle',false));}
if(p>=3){o.push(R(10,124,460,30,'#F1F8F1','#aaa',1));o.push(T(240,143,'3. Plants below die (no light for photosynthesis)','#333',10,'middle',false));}
if(p>=4){o.push(R(10,164,460,30,'#fde8e8','#C0272D',1.5));o.push(T(240,183,'4. Decomposers break down dead plants; use up O\u2082 (deoxygenation)','#C0272D',10,'middle',false));}
if(p>=5){o.push(R(10,204,460,30,'#fde8e8','#C0272D',1.5));o.push(T(240,223,'5. Fish and other aquatic animals suffocate and die','#C0272D',10,'middle',false));}
s.innerHTML=o.join('');}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ5(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Human impact summary','#2E7D32',13,'middle',true));
[['Deforestation','biodiversity loss, carbon release, soil erosion'],['Eutrophication','fertiliser\u2192algae bloom\u2192plant death\u2192O\u2082 depletion\u2192fish die'],['Greenhouse gases','CO\u2082, CH\u2084, H\u2082O vapour; enhanced by fossil fuels'],['Acid rain','SO\u2082 + NOx + H\u2082O \u2192 H\u2082SO\u2084 + HNO\u2083; damages trees, lakes'],['Bioaccumulation','persistent toxins build up at higher trophic levels'],['Conservation','reserves, seed banks, legislation, international agreements']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(120,55+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(340,55+i*33,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Biology \u2022 Human Impact',ti:'Human Impacts on Ecosystems',su:'Describe and evaluate the main human impacts on ecosystems.',steps:[
  {lb:'Key impacts',dr:dQ1,ht:'<p><b>Deforestation:</b> habitat loss, reduced biodiversity, carbon released, soil erosion.<br><b>Overexploitation:</b> overfishing, hunting reduce populations below sustainable levels.<br><b>Pollution:</b> air, water, land contamination affects ecosystems.<br><b>Climate change:</b> habitat loss, extinction, ocean acidification.<br><b>Invasive species:</b> outcompete native species.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Deforestation contributes to climate change because: 1=trees reflect sunlight, 2=it releases stored carbon and removes trees that absorb CO\u2082.',a:2,w:'Trees store carbon; burning/rotting releases it; fewer trees absorb less CO\u2082. Answer: 2.'},{q:'Overfishing is harmful because: 1=it makes the sea cleaner, 2=it reduces fish populations below a level where they can recover.',a:2,w:'Overfishing: population crashes, may not recover. Answer: 2.'},{q:'Invasive species reduce biodiversity by: 1=increasing food availability, 2=outcompeting native species for resources.',a:2,w:'Invasive species: no natural predators, outcompete native species. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Deforestation: releases carbon. Overfishing: population collapse. Invasive: competition.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Biology \u2022 Human Impact',ti:'Climate Change',su:'Explain the enhanced greenhouse effect and its consequences.',steps:[
  {lb:'Greenhouse effect',dr:dQ2,ht:'<p>Natural greenhouse effect: CO\u2082, CH\u2084 (methane), H\u2082O vapour absorb and re-radiate heat \u2014 keeps Earth warm enough for life. Enhanced greenhouse effect: burning fossil fuels increases CO\u2082 \u2192 more heat trapped \u2192 global warming.</p>'},
  {lb:'Consequences',dr:dQ2,ht:'<p>Rising temperatures: melting polar ice \u2192 sea level rise \u2192 flooding. Habitat loss, species extinction. Extreme weather events. Ocean acidification (CO\u2082 dissolves in seawater). Shifting of species ranges (migration northwards).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'The main greenhouse gas increased by human activity is: 1=oxygen, 2=CO\u2082.',a:2,w:'Burning fossil fuels releases large amounts of CO\u2082. Answer: 2.'},{q:'Climate change threatens biodiversity because: 1=warmer temperatures directly benefit all species, 2=habitats change faster than species can adapt or migrate.',a:2,w:'Rapid change: many species cannot adapt fast enough \u2192 extinction. Answer: 2.'},{q:'Methane (CH\u2084) is a greenhouse gas produced by: 1=burning wood only, 2=cattle digestion, rice paddies, and landfill sites.',a:2,w:'CH\u2084: agriculture (cattle, rice), landfill, fossil fuels. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['CO\u2082 from fossil fuels. Climate change: habitat shifts, extinction risk.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y11 Biology \u2022 Human Impact',ti:'Deforestation',su:'Describe causes and consequences of deforestation.',steps:[
  {lb:'Deforestation',dr:dQ3,ht:'<p>Deforestation = large-scale removal of forests. Causes: agriculture (cattle ranching, palm oil, soya), logging, urbanisation, mining.<br>Consequences: loss of habitat and biodiversity, release of CO\u2082 (trees burned/rot), reduced water cycling, soil erosion, increased flooding, disruption of local climate.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'How does deforestation increase flooding? 1=trees add water to rivers, 2=without trees, rainwater runs off surface rapidly instead of being absorbed.',a:2,w:'Trees absorb water; without them, surface runoff increases \u2192 flooding. Answer: 2.'},{q:'Deforestation in tropical rainforests reduces biodiversity because: 1=rainforests have very few species, 2=rainforests contain a huge proportion of all species on Earth.',a:2,w:'Tropical rainforests = highest biodiversity on Earth. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Deforestation: floods (runoff), CO\u2082 release, biodiversity loss.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y11 Biology \u2022 Human Impact',ti:'Eutrophication',su:'Explain eutrophication step by step.',steps:[
  {lb:'Eutrophication sequence',dr:dQ4,ht:'<p>1. Fertilisers (nitrates/phosphates) washed from fields into water by rain (leaching). 2. Algae grow rapidly (algal bloom) \u2014 blocks light. 3. Plants below surface die (can\'t photosynthesise). 4. Decomposing bacteria multiply, decomposing dead plants, using up dissolved oxygen. 5. Fish and other aquatic animals suffocate and die (deoxygenation).</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'In eutrophication, fish die because: 1=they eat too many algae, 2=decomposing bacteria use up all the dissolved oxygen.',a:2,w:'Decomposers respiring \u2192 O\u2082 depleted \u2192 fish suffocate. Answer: 2.'},{q:'An algal bloom blocks light, causing: 1=plants to grow faster, 2=plants below to die (no photosynthesis).',a:2,w:'No light \u2192 aquatic plants cannot photosynthesise \u2192 die. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Eutrophication: fertiliser\u2192algae bloom\u2192plants die\u2192bacteria decompose\u2192O\u2082 gone\u2192fish die'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y11 Biology \u2022 Human Impact',ti:'Pollution',su:'Describe air, water and land pollution and their effects.',steps:[
  {lb:'Types of pollution',dr:dQ5,ht:'<p><b>Air:</b> CO\u2082 (greenhouse), SO\u2082 + NOx \u2192 acid rain (damages trees, acidifies lakes), particulates (respiratory disease), CFCs (ozone depletion).<br><b>Water:</b> nitrates (eutrophication), sewage (disease, O\u2082 depletion), heavy metals, plastics.<br><b>Land:</b> pesticides (bioaccumulation), herbicides, landfill, radioactive waste.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Acid rain is caused by: 1=CO\u2082 dissolving in rain, 2=SO\u2082 and NOx dissolving in rain to form sulfuric and nitric acid.',a:2,w:'SO\u2082 + H\u2082O \u2192 H\u2082SO\u2084; NOx + H\u2082O \u2192 HNO\u2083. Answer: 2.'},{q:'Bioaccumulation means: 1=toxins decrease at higher trophic levels, 2=persistent toxins build up in organisms and increase in concentration at higher trophic levels.',a:2,w:'Toxins: not excreted, pass up food chain \u2192 concentrate at higher levels. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Acid rain: SO\u2082+NOx. Bioaccumulation: toxins increase up food chain.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y11 Biology \u2022 Human Impact',ti:'Conservation Strategies',su:'Evaluate methods used to conserve biodiversity.',steps:[
  {lb:'Conservation methods',dr:dQ6,ht:'<p><b>In situ:</b> nature reserves, national parks, marine protected areas (protecting species in their habitat). <b>Ex situ:</b> zoos, seed banks, captive breeding programmes (outside natural habitat). <b>Legislation:</b> CITES (trade in endangered species), national laws. <b>International:</b> Paris Agreement (climate), Convention on Biological Diversity.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'A nature reserve is an example of: 1=ex situ conservation, 2=in situ conservation.',a:2,w:'In situ: protecting species in their natural habitat. Answer: 2.'},{q:'Seed banks conserve biodiversity by: 1=growing plants to sell, 2=storing seeds of many species to preserve genetic diversity.',a:2,w:'Seed banks: long-term storage of seeds = genetic insurance. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['In situ: in habitat (reserves). Ex situ: outside habitat (zoos, seed banks).'],ans:qq.a,tol:0,unit:'',working:qq.w};})},

{ey:'Q7 \u2022 Y11 Biology \u2022 Human Impact',ti:'Sustainable Development',su:'Define sustainable development and give examples.',steps:[
  {lb:'Sustainable development',dr:dQ7,ht:'<p>Sustainable development: meeting the needs of the present without compromising the ability of future generations to meet their own needs. Examples: sustainable fishing (quotas, mesh size), sustainable forestry (replanting), renewable energy, organic farming, reducing waste and recycling.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Sustainable fishing involves: 1=catching as many fish as possible, 2=setting catch limits and using larger mesh nets to allow young fish to escape.',a:2,w:'Quotas and mesh size allow fish populations to recover. Answer: 2.'},{q:'Renewable energy supports sustainability because: 1=it produces more CO\u2082 than fossil fuels, 2=it does not deplete finite resources and produces less greenhouse gas.',a:2,w:'Renewable: sun, wind, water \u2014 inexhaustible, low CO\u2082. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Sustainable: quotas, replanting, renewable energy, reduce waste.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},

{ey:'Q8 \u2022 Y11 Biology \u2022 Human Impact',ti:'Indicator Species',su:'Describe how indicator species are used to monitor pollution.',steps:[
  {lb:'Indicator species',dr:dQ8,ht:'<p>Indicator species: organisms whose presence or absence indicates environmental conditions. <b>Pollution indicators:</b> Rat-tailed maggots and blood worms = high organic pollution (low O\u2082). Stonefly larvae and mayfly larvae = clean, well-oxygenated water. Lichens: sensitive to SO\u2082 (air pollution indicator); absent in polluted cities.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Stonefly larvae in a river indicate: 1=high pollution (low O\u2082), 2=clean, well-oxygenated water.',a:2,w:'Stonefly: only survive in clean, well-oxygenated water. Answer: 2.'},{q:'Lichens are absent from polluted cities because they are sensitive to: 1=temperature, 2=sulfur dioxide (SO\u2082) air pollution.',a:2,w:'Lichens: bio-indicators of air pollution/SO\u2082. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Stonefly: clean water. Lichens: absent where SO\u2082 pollution high.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y11 Biology \u2022 Human Impact',ti:'Ozone Depletion',su:'Describe ozone depletion and its causes and effects.',steps:[
  {lb:'Ozone layer',dr:dQ9,ht:'<p>Ozone (O\u2083) layer in stratosphere absorbs UV radiation. Depletion caused by CFCs (chlorofluorocarbons \u2014 from old aerosols and refrigerants). Ozone hole mainly over Antarctica. Effects: increased UV reaches Earth \u2192 more skin cancer, cataracts, reduced photosynthesis in plants and phytoplankton. Montreal Protocol (1987) phased out CFCs; ozone layer slowly recovering.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'Ozone depletion is mainly caused by: 1=CO\u2082, 2=CFCs (chlorofluorocarbons).',a:2,w:'CFCs react with ozone, breaking it down. Answer: 2.'},{q:'Ozone layer depletion leads to: 1=more UV radiation reaching Earth, causing skin cancer, 2=less UV radiation reaching Earth.',a:1,w:'Less ozone \u2192 more UV reaches surface \u2192 skin cancer risk increases. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['CFCs: deplete ozone. More UV \u2192 skin cancer, ecosystem damage.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y11 Biology \u2022 Human Impact',ti:'Mixed Human Impact Questions',su:'Climate change, eutrophication, pollution, conservation and sustainability.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Greenhouse: CO\u2082+CH\u2084 trap heat. Eutrophication: fertiliser\u2192algae\u2192O\u2082 lost\u2192fish die. Acid rain: SO\u2082+NOx. Bioaccumulation: toxins increase up chain. In situ: reserves. Ex situ: zoos/seed banks.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['climate','eutro','conservation']);if(type==='climate'){var qs=[{q:'Enhanced greenhouse effect is caused by: 1=natural volcanic eruptions only, 2=increased CO\u2082 from burning fossil fuels.',a:2,w:'Human CO\u2082 emissions enhance natural greenhouse effect. Answer: 2.'},{q:'Rising sea levels are caused by: 1=more rainfall, 2=melting ice and thermal expansion of ocean water.',a:2,w:'Melting glaciers + thermal expansion \u2192 sea level rise. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Enhanced greenhouse: human CO\u2082. Sea level: melting ice.'],ans:qq.a,tol:0,unit:'',working:qq.w};}if(type==='eutro'){var qs2=[{q:'In eutrophication, O\u2082 is depleted because: 1=algae use all the oxygen, 2=bacteria decomposing dead plants use up dissolved O\u2082.',a:2,w:'Decomposer bacteria respiring use up O\u2082. Answer: 2.'},{q:'Eutrophication starts with: 1=fish dying, 2=excess nitrates/phosphates entering water.',a:2,w:'Fertiliser leaching into water is the first step. Answer: 2.'}];var qq2=pick(qs2);return{question:qq2.q,hints:['Eutrophication starts with fertiliser\u2192algae\u2192O\u2082 depletion.'],ans:qq2.a,tol:0,unit:'',working:qq2.w};}return{question:'A nature reserve is an example of: 1=ex situ conservation, 2=in situ conservation.',hints:['In situ: in natural habitat. Ex situ: outside.'],ans:2,tol:0,unit:'',working:'Nature reserve: protecting species in their habitat = in situ. Answer: 2.'};})},
