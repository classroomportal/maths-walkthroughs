<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Types of variation','#2E7D32',13,'middle',true));
o.push(R(10,40,222,198,'#F1F8F1','#2E7D32',2));o.push(T(121,60,'CONTINUOUS','#2E7D32',11,'middle',true));
o.push(R(248,40,222,198,'#e8f5e9','#2E7D32',2));o.push(T(359,60,'DISCONTINUOUS','#2E7D32',11,'middle',true));
var c=['Range of values','No distinct categories','Normal distribution (bell curve)','Controlled by many genes + environment','Height, mass, foot size, IQ'];
var d=['Distinct categories','No intermediate values','Bar chart (not continuous)','Controlled by one or few genes','Blood group, sex, tongue rolling'];
c.forEach(function(v,i){if(i<p+1)o.push(T(121,82+i*28,v,'#333',8,'middle',false));});
d.forEach(function(v,i){if(i<p+1)o.push(T(359,82+i*28,v,'#333',8,'middle',false));});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Natural selection — four steps','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,44,460,38,'#F1F8F1','#2E7D32',1.5));o.push(T(240,58,'1. VARIATION — individuals vary (due to mutation/sexual repro)','#333',10,'middle',false));o.push(T(240,72,'Different individuals have different phenotypes','#555',8,'middle',false));}
if(p>=2){o.push(R(10,92,460,38,'#F1F8F1','#2E7D32',1.5));o.push(T(240,106,'2. SELECTION PRESSURE — competition, predation, disease','#333',10,'middle',false));o.push(T(240,120,'Not all individuals survive to reproduce','#555',8,'middle',false));}
if(p>=3){o.push(R(10,140,460,38,'#e8f5e9','#2E7D32',1.5));o.push(T(240,154,'3. SURVIVAL OF THE FITTEST — best adapted survive','#333',10,'middle',false));o.push(T(240,168,'Survive long enough to reproduce','#555',8,'middle',false));}
if(p>=4){o.push(R(10,188,460,38,'#e8f5e9','#2E7D32',1.5));o.push(T(240,202,'4. INHERITANCE — advantageous alleles passed to offspring','#333',10,'middle',false));o.push(T(240,216,'Over generations, favourable traits become more common','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Mutation','#2E7D32',12,'middle',true));
if(p>=1){o.push(R(10,44,460,56,'#F1F8F1','#2E7D32',1.5));o.push(T(240,66,'A mutation is a random change in DNA base sequence','#333',10,'middle',false));o.push(T(240,84,'Can change the protein coded for \u2014 may affect phenotype','#555',9,'middle',false));}
if(p>=2){o.push(R(10,114,460,56,'#F1F8F1','#2E7D32',1.5));o.push(T(240,134,'Mutagens increase mutation rate:','#2E7D32',10,'middle',true));o.push(T(240,152,'UV radiation, X-rays, gamma rays, some chemicals (carcinogens)','#555',9,'middle',false));}
if(p>=3){o.push(R(10,184,460,56,'#e8f5e9','#2E7D32',1.5));o.push(T(240,204,'Most mutations are harmful or neutral','#333',10,'middle',false));o.push(T(240,222,'Rarely: beneficial mutation \u2192 natural selection can increase its frequency','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ5(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Variation & selection summary','#2E7D32',13,'middle',true));
[['Continuous variation','range of values; many genes+environment; e.g. height'],['Discontinuous variation','distinct categories; few genes; e.g. blood group'],['Mutation','random DNA change; source of new alleles'],['Natural selection','variation\u2192selection pressure\u2192survival\u2192inheritance'],['Antibiotic resistance','mutation\u2192resistant bacteria survive\u2192reproduce\u2192spread'],['Selective breeding','humans choose parents with desired traits over generations']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(130,55+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(350,55+i*33,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Biology \u2022 Variation',ti:'Types of Variation',su:'Distinguish continuous from discontinuous variation with examples.',steps:[
  {lb:'Two types',dr:dQ1,ht:'<p><b>Continuous variation:</b> range of values between two extremes, no distinct categories, normal distribution. Controlled by many genes AND environment. Examples: height, mass, intelligence, foot size.<br><b>Discontinuous variation:</b> distinct categories, no intermediates. Controlled by one or few genes. Examples: blood group, sex, ability to roll tongue, having a widow\u2019s peak.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Blood group (A, B, AB, O) is an example of: 1=continuous variation, 2=discontinuous variation.',a:2,w:'Blood groups: distinct categories, no intermediates = discontinuous. Answer: 2.'},{q:'Human height is an example of: 1=continuous variation, 2=discontinuous variation.',a:1,w:'Height: range of values, normal distribution = continuous. Answer: 1.'},{q:'Continuous variation is influenced by: 1=one gene only, 2=many genes AND the environment.',a:2,w:'Continuous: polygenic (many genes) + environment. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Continuous: range, normal distribution. Discontinuous: distinct categories.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Biology \u2022 Variation',ti:'Natural Selection',su:'Describe the four steps of natural selection.',steps:[
  {lb:'Four steps',dr:dQ2,ht:'<p>1. <b>Variation</b> in population (from mutations and sexual reproduction). 2. <b>Selection pressure</b> (predators, disease, competition, climate). 3. <b>Survival of the fittest</b> — best-adapted individuals survive and reproduce. 4. <b>Inheritance</b> — advantageous alleles passed to offspring; frequency increases over generations.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'The source of new genetic variation in a population is: 1=natural selection, 2=mutation and sexual reproduction.',a:2,w:'Mutation creates new alleles; sexual reproduction produces new combinations. Answer: 2.'},{q:'"Survival of the fittest" means: 1=the strongest animal survives, 2=the best-adapted to the environment survives and reproduces.',a:2,w:'Fittest = best adapted to environment, not necessarily the strongest. Answer: 2.'},{q:'Over many generations, natural selection: 1=increases the frequency of advantageous alleles, 2=decreases genetic variation by removing all mutations.',a:1,w:'Advantageous alleles become more common; variation remains. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Variation\u2192selection pressure\u2192survival\u2192inheritance of advantageous alleles'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y11 Biology \u2022 Variation',ti:'Antibiotic Resistance',su:'Explain how antibiotic resistance develops by natural selection.',steps:[
  {lb:'Antibiotic resistance',dr:dQ3,ht:'<p>1. Random mutations produce some bacteria resistant to antibiotics. 2. Antibiotics applied (selection pressure). 3. Non-resistant bacteria die; resistant bacteria survive and reproduce. 4. Resistant alleles passed to offspring \u2014 resistance spreads. 5. MRSA = methicillin-resistant Staphylococcus aureus. Prevention: complete courses, don\u2019t overuse antibiotics.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Antibiotic resistance in bacteria arises because of: 1=bacteria deliberately mutating to survive, 2=random mutations that happen to give resistance.',a:2,w:'Mutations are random; selection then favours resistant individuals. Answer: 2.'},{q:'Why is it important to complete a full course of antibiotics? 1=to kill all bacteria including any partially resistant ones, 2=to increase the number of resistant bacteria.',a:1,w:'Incomplete course leaves partially resistant bacteria alive to reproduce. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Mutation is random. Complete course kills all (including resistant).'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y11 Biology \u2022 Variation',ti:'Selective Breeding',su:'Describe selective breeding and evaluate its advantages and disadvantages.',steps:[
  {lb:'Selective breeding',dr:dQ4,ht:'<p>Humans select and breed organisms with desired traits over many generations. Examples: high-yield crops (wheat, maize), disease-resistant plants, fast-growing chickens, high-milk cows, dogs bred for specific traits. Reduces genetic diversity (inbreeding) \u2014 risk of genetic diseases and susceptibility to new diseases.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'A key disadvantage of selective breeding is: 1=it takes too long, 2=it reduces genetic diversity, increasing disease risk.',a:2,w:'Selective breeding = inbreeding = reduced gene pool = more disease risk. Answer: 2.'},{q:'Selective breeding is carried out by: 1=natural selection, 2=humans choosing parents with desirable traits.',a:2,w:'Selective (artificial) breeding: humans decide which individuals breed. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Selective breeding: humans choose. Reduces genetic diversity.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y11 Biology \u2022 Variation',ti:'Mutation',su:'Describe mutations and their effects. Identify mutagens.',steps:[
  {lb:'Mutations',dr:dQ5,ht:'<p>A mutation is a random change in the DNA base sequence. Can alter the protein produced, potentially changing the phenotype. Most mutations are harmful or neutral; rarely beneficial. <b>Mutagens</b> increase mutation rate: UV radiation, ionising radiation (X-rays, gamma), chemical carcinogens (cigarette smoke, benzene).</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'UV radiation causes mutations by: 1=changing the DNA base sequence, 2=directly killing cells.',a:1,w:'UV radiation damages DNA \u2192 changes base sequence \u2192 mutation. Answer: 1.'},{q:'Most mutations are: 1=beneficial and increase survival, 2=harmful or neutral.',a:2,w:'Most mutations are harmful or have no effect. Beneficial mutations are rare. Answer: 2.'},{q:'A mutagen is: 1=a type of mutation, 2=an agent that increases the rate of mutation.',a:2,w:'Mutagen = factor that increases mutation rate (e.g. UV, X-rays). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Mutagen: increases mutation rate. Most mutations: harmful or neutral.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y11 Biology \u2022 Variation',ti:'Genetic Engineering',su:'Describe genetic engineering and its applications.',steps:[
  {lb:'Genetic engineering',dr:dQ6,ht:'<p>Genetic engineering: inserting a gene from one organism into another. Process: (1) identify and cut desired gene using restriction enzymes; (2) insert into vector (plasmid); (3) introduce into host organism. Examples: insulin gene into bacteria (GM insulin for diabetics), herbicide-resistant crops, Golden Rice (vitamin A gene).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Restriction enzymes are used in genetic engineering to: 1=join DNA together, 2=cut DNA at specific sequences.',a:2,w:'Restriction enzymes cut DNA at specific recognition sequences. Answer: 2.'},{q:'Genetically modified (GM) insulin is produced by: 1=extracting it from pig pancreases, 2=bacteria that have had the human insulin gene inserted.',a:2,w:'GM bacteria produce human insulin. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Restriction enzymes: cut. Vector (plasmid): carry gene into host.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y11 Biology \u2022 Variation',ti:'Evolution and Speciation',su:'Describe how evolution leads to new species (speciation).',steps:[
  {lb:'Speciation',dr:dQ7,ht:'<p>Evolution: change in allele frequency in a population over time (natural selection). <b>Speciation:</b> formation of new species. Geographic isolation (allopatric speciation): populations separated \u2192 different mutations \u2192 different selective pressures \u2192 eventually cannot interbreed \u2192 new species.</p>'},
