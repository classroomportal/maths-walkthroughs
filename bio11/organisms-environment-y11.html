<style>
:root{--red:#2E7D32;--dark:#1b5e20;--cream:#F1F8F1;--ink:#0d1b2a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F1F8F1);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F1F8F1';stroke=stroke||'#2E7D32';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#2E7D32')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#2E7D32')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F1F8F1')+'" stroke="'+(stroke||'#2E7D32')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Ecological organisation','#2E7D32',13,'middle',true));
[['Organism','single individual'],['Population','all individuals of one species in an area'],['Community','all populations of different species in an area'],['Ecosystem','community + its non-living (abiotic) environment'],['Biosphere','all ecosystems on Earth']].forEach(function(r,i){if(i<p+1){var w=180+i*10;o.push(R(240-w/2,42+i*38,w,28,'#F1F8F1','#2E7D32',2));o.push(T(240,60+i*38,r[0],'#2E7D32',11,'middle',true));o.push(T(240,72+i*38,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Food webs and energy flow','#2E7D32',12,'middle',true));
o.push(T(80,220,'Grass','#2E7D32',10,'middle',true));
o.push(T(240,220,'Seeds','#2E7D32',10,'middle',true));
o.push(T(80,160,'Rabbit','#555',10,'middle',true));
o.push(T(240,160,'Mouse','#555',10,'middle',true));
o.push(T(160,100,'Fox','#C0272D',10,'middle',true));
o.push(T(320,100,'Owl','#C0272D',10,'middle',true));
if(p>=1){o.push(arw(80,210,80,175,'#2E7D32',1.5));o.push(arw(240,210,240,175,'#2E7D32',1.5));o.push(arw(240,210,80,175,'#2E7D32',1.5));}
if(p>=2){o.push(arw(80,150,140,115,'#C0272D',1.5));o.push(arw(240,150,180,115,'#C0272D',1.5));o.push(arw(240,150,300,115,'#C0272D',1.5));}
if(p>=3){o.push(T(240,58,'Energy lost at each level: heat, movement, excretion','#555',9,'middle',false));o.push(T(240,40,'Only ~10% energy passed to next trophic level','#2E7D32',10,'middle',true));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Abiotic and biotic factors','#2E7D32',12,'middle',true));
o.push(R(10,40,222,198,'#F1F8F1','#2E7D32',2));o.push(T(121,60,'ABIOTIC (non-living)','#2E7D32',10,'middle',true));
o.push(R(248,40,222,198,'#e8f5e9','#2E7D32',2));o.push(T(359,60,'BIOTIC (living)','#2E7D32',10,'middle',true));
var a=['Temperature','Light intensity','Water availability','Soil pH / minerals','Wind speed','Oxygen levels'];
var b=['Competition (food, space)','Predation','Disease / parasitism','Mutualism','Food availability','Human activity'];
a.forEach(function(v,i){if(i<p+1)o.push(T(121,84+i*24,v,'#333',8,'middle',false));});
b.forEach(function(v,i){if(i<p+1)o.push(T(359,84+i*24,v,'#333',8,'middle',false));});
s.innerHTML=o.join('');}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ5(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Ecology summary','#2E7D32',13,'middle',true));
[['Levels','organism\u2192population\u2192community\u2192ecosystem\u2192biosphere'],['Abiotic','temperature, light, water, pH, wind'],['Biotic','competition, predation, disease, mutualism'],['Food chain','producer\u2192primary consumer\u2192secondary\u2192tertiary'],['Energy','only ~10% passed to next trophic level; rest = heat'],['Pyramid of numbers','shows number of organisms at each trophic level']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F1F8F1','#C8E6C9',1));o.push(T(100,55+i*33,r[0],'#2E7D32',10,'middle',true));o.push(T(330,55+i*33,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Biology \u2022 Ecology',ti:'Ecological Organisation',su:'Define organism, population, community, ecosystem and biosphere.',steps:[
  {lb:'Five levels',dr:dQ1,ht:'<p><b>Organism:</b> individual living thing. <b>Population:</b> all individuals of one species in an area. <b>Community:</b> all populations of different species in the same area. <b>Ecosystem:</b> community plus its non-living (abiotic) environment. <b>Biosphere:</b> all ecosystems on Earth.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'All the rabbits in a field form: 1=a community, 2=a population.',a:2,w:'All individuals of ONE species = population. Answer: 2.'},{q:'An ecosystem includes: 1=only living organisms, 2=living organisms AND their non-living environment.',a:2,w:'Ecosystem = community + abiotic environment. Answer: 2.'},{q:'All species of plants, animals and microorganisms in a woodland form: 1=a population, 2=a community.',a:2,w:'Multiple species together = community. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Population: one species. Community: many species. Ecosystem: community+abiotic.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Biology \u2022 Ecology',ti:'Food Chains and Food Webs',su:'Construct and interpret food chains and food webs.',steps:[
  {lb:'Food chains',dr:dQ2,ht:'<p>Food chains show feeding relationships. Arrows show direction of energy flow. <b>Producer</b> (plant) \u2192 primary consumer \u2192 secondary consumer \u2192 tertiary consumer. Food webs show multiple interconnected food chains in a community.</p>'},
  {lb:'Energy flow',dr:dQ2,ht:'<p>Only ~10% of energy is passed to the next trophic level. Energy is lost as heat (respiration), movement, and undigested material (faeces). This limits the number of trophic levels (usually 4\u20135 maximum).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'In a food chain, arrows represent: 1=feeding direction, 2=direction of energy transfer.',a:2,w:'Arrows show energy flow from prey to predator. Answer: 2.'},{q:'Why are food chains rarely more than 5 links long? 1=animals run out of space, 2=only ~10% of energy passes to each new level so little remains.',a:2,w:'Energy loss at each level means too little remains for more levels. Answer: 2.'},{q:'The organism at the START of a food chain is usually: 1=a carnivore, 2=a producer (plant).',a:2,w:'Food chains start with a producer (makes energy by photosynthesis). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Arrows: energy flow. ~10% transferred. Starts with producer.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y11 Biology \u2022 Ecology',ti:'Abiotic and Biotic Factors',su:'Give examples of abiotic and biotic factors that affect populations.',steps:[
  {lb:'Two types of factors',dr:dQ3,ht:'<p><b>Abiotic</b> (non-living): temperature, light intensity, water availability, soil pH and mineral content, wind speed, oxygen levels.<br><b>Biotic</b> (living): competition for food/space/mates, predation, disease/parasitism, mutualism, food availability.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Predation is an example of: 1=an abiotic factor, 2=a biotic factor.',a:2,w:'Predation involves living organisms = biotic factor. Answer: 2.'},{q:'Soil pH is an example of: 1=an abiotic factor, 2=a biotic factor.',a:1,w:'Soil pH = non-living chemical property = abiotic. Answer: 1.'},{q:'Competition between deer for food is: 1=abiotic, 2=biotic.',a:2,w:'Competition involves living organisms = biotic. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Abiotic: non-living (temperature, light, pH). Biotic: living (predation, competition).'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y11 Biology \u2022 Ecology',ti:'Pyramids of Numbers and Biomass',su:'Construct and interpret pyramids of numbers and biomass.',steps:[
  {lb:'Pyramids',dr:dQ4,ht:'<p><b>Pyramid of numbers:</b> shows the number of organisms at each trophic level. Not always pyramid-shaped (e.g. one oak tree supports many caterpillars). <b>Pyramid of biomass:</b> shows dry mass of organisms at each level. Usually pyramid-shaped. <b>Pyramid of energy:</b> always pyramid-shaped; shows energy at each level.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'A pyramid of biomass is usually: 1=inverted (wider at top), 2=wider at the base (more biomass in producers).',a:2,w:'More biomass in producers; decreases at each higher level. Answer: 2.'},{q:'A pyramid of numbers may be inverted when: 1=there are many top predators, 2=a single large producer (e.g. one oak tree) supports many consumers.',a:2,w:'One oak tree (large) supports hundreds of caterpillars \u2192 inverted numbers. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Biomass: always pyramid-shaped. Numbers: can be inverted (e.g. one tree).'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y11 Biology \u2022 Ecology',ti:'Population Size and Sampling',su:'Describe methods of estimating population size.',steps:[
  {lb:'Sampling methods',dr:dQ5,ht:'<p><b>Quadrat:</b> count organisms in a defined area; repeat and calculate mean. Used for plants and slow-moving organisms. <b>Transect:</b> line through a habitat; record organisms at intervals. Used to show how species change across a gradient (e.g. sea shore). <b>Mark-release-recapture:</b> capture, mark, release; recapture later. Estimate: N = (n1 \u00d7 n2) / m.</p>'},
  {lb:'Mark-release-recapture',dr:dQ5,ht:'<div class="fm">N = (n\u2081 \u00d7 n\u2082) / m</div><p>N = population estimate. n\u2081 = number first captured and marked. n\u2082 = number in second sample. m = number marked in second sample. Assumes: marks don\u2019t affect survival; animals mix randomly; population stable.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var n1=rnd(20,80),m=rnd(5,15),n2=rnd(30,100),N=Math.round(n1*n2/m);return{question:'First catch: <b>'+n1+'</b> marked. Second catch: <b>'+n2+'</b> total, <b>'+m+'</b> marked. Estimate population.',hints:['N = (n\u2081 \u00d7 n\u2082) / m'],ans:N,tol:Math.max(2,Math.round(N*0.05)),unit:'',working:'N = ('+n1+'\u00d7'+n2+')/'+m+' = '+N};})},
]},
{ey:'Q6 \u2022 Y11 Biology \u2022 Ecology',ti:'Carbon Cycle',su:'Describe the carbon cycle and explain its importance.',steps:[
  {lb:'Carbon cycle',dr:dQ6,ht:'<p>Carbon enters atmosphere as CO\u2082. Plants absorb CO\u2082 by <b>photosynthesis</b> (makes glucose). Animals eat plants \u2192 carbon passes through food chains. Carbon released back by: <b>respiration</b> (all organisms), <b>decomposition</b> (bacteria/fungi), <b>combustion</b> (burning fossil fuels), <b>feeding</b>. Fossil fuels: ancient organisms; burning releases stored carbon.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Which process removes CO\u2082 from the atmosphere? 1=respiration, 2=photosynthesis.',a:2,w:'Photosynthesis: plants absorb CO\u2082 to make glucose. Answer: 2.'},{q:'Decomposers (bacteria and fungi) return carbon to the atmosphere by: 1=photosynthesis, 2=respiration.',a:2,w:'Decomposers respire as they break down dead material \u2192 release CO\u2082. Answer: 2.'},{q:'Burning fossil fuels: 1=removes CO\u2082 from atmosphere, 2=releases stored carbon as CO\u2082.',a:2,w:'Combustion of fossil fuels releases ancient stored carbon as CO\u2082. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Photosynthesis: removes CO\u2082. Respiration/decomposition/combustion: releases CO\u2082.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y11 Biology \u2022 Ecology',ti:'Nitrogen Cycle',su:'Describe the nitrogen cycle including the roles of bacteria.',steps:[
  {lb:'Nitrogen cycle',dr:dQ7,ht:'<p>Nitrogen gas (N\u2082) in atmosphere. <b>Nitrogen fixation:</b> nitrogen-fixing bacteria (in soil, and in legume root nodules) convert N\u2082 \u2192 ammonia \u2192 nitrates (usable by plants). Plants use nitrates to make proteins. Animals eat plants. <b>Decomposers</b> break down dead organisms \u2192 ammonium. <b>Nitrifying bacteria:</b> ammonium \u2192 nitrates. <b>Denitrifying bacteria:</b> nitrates \u2192 N\u2082 gas.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Nitrogen-fixing bacteria convert: 1=nitrates to nitrogen gas, 2=atmospheric nitrogen to ammonia/nitrates.',a:2,w:'Nitrogen fixation: N\u2082 \u2192 ammonia \u2192 nitrates (usable by plants). Answer: 2.'},{q:'Denitrifying bacteria: 1=convert ammonia to nitrates, 2=convert nitrates back to nitrogen gas.',a:2,w:'Denitrifying bacteria: nitrates \u2192 N\u2082 (remove nitrogen from soil). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Fixing: N\u2082\u2192ammonia. Nitrifying: ammonia\u2192nitrates. Denitrifying: nitrates\u2192N\u2082.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y11 Biology \u2022 Ecology',ti:'Predator-Prey Relationships',su:'Interpret predator-prey graphs and explain population cycles.',steps:[
  {lb:'Predator-prey cycles',dr:dQ8,ht:'<p>Predator and prey populations cycle together. More prey \u2192 more food for predators \u2192 predators increase \u2192 more prey eaten \u2192 prey decrease \u2192 predators decrease (less food) \u2192 prey recover \u2192 cycle repeats. Predator numbers lag behind prey numbers.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'When prey population increases, predator population: 1=decreases, 2=increases (more food available).',a:2,w:'More prey \u2192 more food \u2192 predator numbers rise. Answer: 2.'},{q:'In a predator-prey graph, predator numbers: 1=exactly match prey numbers, 2=lag behind prey (rise after prey increases).',a:2,w:'Predators respond after prey numbers change \u2192 time lag. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['More prey \u2192 more predators (with a lag). Fewer prey \u2192 fewer predators.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y11 Biology \u2022 Ecology',ti:'Biodiversity and Conservation',su:'Define biodiversity. Describe threats and conservation strategies.',steps:[
  {lb:'Biodiversity',dr:dQ9,ht:'<p>Biodiversity = variety of living organisms in an area (number of species AND genetic variation within species). Threats: habitat destruction, deforestation, pollution, climate change, overexploitation. Conservation: nature reserves, seed banks, captive breeding, international agreements (CITES), habitat restoration.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'Biodiversity refers to: 1=the total number of plants in an area, 2=the variety of different species AND genetic variation within species.',a:2,w:'Biodiversity: species diversity AND genetic diversity. Answer: 2.'},{q:'Seed banks are used to: 1=grow food crops faster, 2=preserve genetic diversity of plant species.',a:2,w:'Seed banks store seeds of many species to preserve genetic diversity. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Biodiversity: species + genetic variety. Seed banks: genetic preservation.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y11 Biology \u2022 Ecology',ti:'Mixed Ecology Questions',su:'Organisation, food webs, factors, cycles and population estimation.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Population: one species. Community: many species. Ecosystem: community+abiotic. Food chain: energy flows from producer. ~10% energy per level. Mark-release-recapture: N=n\u2081n\u2082/m.</p>'},
