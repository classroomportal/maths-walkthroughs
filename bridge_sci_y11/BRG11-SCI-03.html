<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cells, Respiration & Photosynthesis — Bridge Maths — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge Science (Y11): Cells, Respiration & Photosynthesis</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Plant vs animal cells", "teach": ["Plant cells have a cell wall, chloroplasts, and a large permanent vacuole \u2014 animal cells don't have any of these.", "Both plant and animal cells have a nucleus, cytoplasm, cell membrane, and mitochondria.", "The cell wall gives plant cells extra structural support, which animal cells don't need in the same way."], "yt_prompt": "Which structure is found in plant cells but NOT animal cells?"}, {"title": "Function of key organelles", "teach": ["The nucleus controls the cell's activities and contains genetic material (DNA).", "Mitochondria are the site of respiration, releasing energy for the cell to use.", "The chloroplast is the site of photosynthesis, found only in plant cells."], "yt_prompt": "Which organelle is the site of respiration?"}, {"title": "Aerobic respiration", "teach": ["Aerobic respiration uses oxygen to release energy from glucose: glucose + oxygen \u2192 carbon dioxide + water (+ energy).", "This is the main way cells release usable energy for processes like movement and growth.", "Aerobic respiration happens continuously in almost all living cells."], "yt_prompt": "What are the products of aerobic respiration?"}, {"title": "Anaerobic respiration", "teach": ["Anaerobic respiration happens WITHOUT oxygen, releasing much less energy than aerobic respiration.", "In animals (like during intense exercise), anaerobic respiration produces lactic acid.", "In plants and yeast, anaerobic respiration (fermentation) produces ethanol and carbon dioxide."], "yt_prompt": "What does anaerobic respiration produce in muscle cells?"}, {"title": "Photosynthesis equation", "teach": ["Photosynthesis is the process plants use to make glucose using light energy: carbon dioxide + water \u2192 glucose + oxygen (using light energy).", "This is essentially the REVERSE of aerobic respiration.", "Photosynthesis only happens in cells containing chloroplasts, and only when light is available."], "yt_prompt": "What are the raw materials needed for photosynthesis?"}, {"title": "Factors affecting photosynthesis rate", "teach": ["The rate of photosynthesis is affected by light intensity, carbon dioxide concentration, and temperature \u2014 these are called limiting factors.", "If any one of these is in short supply, it 'limits' the rate, even if the others are plentiful.", "Increasing a limiting factor (e.g. more light) increases the rate \u2014 until another factor becomes limiting instead."], "yt_prompt": "Which of these is a limiting factor for photosynthesis?"}, {"title": "Diffusion", "teach": ["Diffusion is the movement of particles from an area of HIGH concentration to an area of LOW concentration.", "Example: oxygen diffuses from the air (high concentration) into the blood (lower concentration) in the lungs.", "Diffusion happens naturally without needing any extra energy from the cell."], "yt_prompt": "In which direction do particles move during diffusion?"}, {"title": "Osmosis", "teach": ["Osmosis is the movement of WATER specifically, through a partially permeable membrane, from high to low water concentration.", "Example: water moves into a plant root hair cell from the soil, because the soil has a higher water concentration than the cell.", "Osmosis is a special case of diffusion that only applies to water molecules."], "yt_prompt": "Osmosis specifically involves the movement of which substance?"}, {"title": "Cell specialisation", "teach": ["Cells become specialised (differentiated) to carry out specific functions \u2014 their structure matches their job.", "Example: red blood cells have no nucleus and a biconcave shape, maximising space for oxygen-carrying haemoglobin.", "Root hair cells have a large surface area to maximise water and mineral absorption."], "yt_prompt": "Which cell adaptation helps maximise oxygen-carrying capacity?"}, {"title": "Mixed practice", "teach": ["You've now covered cell structure, respiration (aerobic and anaerobic), photosynthesis, diffusion, and osmosis.", "These are foundational Biology topics that connect to almost every other area of the subject.", "Understanding cell processes at this level makes topics like human biology and ecology much easier to follow."], "yt_prompt": "Which structure is found in plant cells but NOT animal cells?"}];
function ytGen_0() { return {q:'Cell wall, chloroplast, or nucleus?', options:['Cell wall','Nucleus','Cytoplasm'], answer:'Cell wall'}; }
function ytGen_1() { return {q:'Nucleus, mitochondria, or chloroplast?', options:['Nucleus','Mitochondria','Chloroplast'], answer:'Mitochondria'}; }
function ytGen_2() { return {q:'Aerobic respiration products', options:['Carbon dioxide + water','Lactic acid','Ethanol + carbon dioxide'], answer:'Carbon dioxide + water'}; }
function ytGen_3() { return {q:'Anaerobic respiration in muscles produces...', options:['Lactic acid','Ethanol','Oxygen'], answer:'Lactic acid'}; }
function ytGen_4() { return {q:'Raw materials for photosynthesis', options:['Carbon dioxide + water','Glucose + oxygen','Oxygen + water'], answer:'Carbon dioxide + water'}; }
function ytGen_5() { return {q:'Which is a limiting factor?', options:['Light intensity','Cell wall thickness','Number of chloroplasts'], answer:'Light intensity'}; }
function ytGen_6() { return {q:'Direction of particle movement in diffusion', options:['High to low concentration','Low to high concentration','No net movement'], answer:'High to low concentration'}; }
function ytGen_7() { return {q:'Osmosis specifically moves...', options:['Water','Glucose','Oxygen'], answer:'Water'}; }
function ytGen_8() { return {q:'Which adaptation maximises oxygen-carrying capacity?', options:['Biconcave shape, no nucleus (red blood cell)','Long root hairs','Chloroplasts'], answer:'Biconcave shape, no nucleus (red blood cell)'}; }
function ytGen_9() { return {q:'Cell wall, chloroplast, or nucleus?', options:['Cell wall','Nucleus','Cytoplasm'], answer:'Cell wall'}; }

const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      const validSign = num >= 0 ? Number(c) >= 0 : Number(c) < 0;
      if (c !== ans && !candidates.includes(c) && validSign) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^-?\d+\.\d+$/.test(ans)) {
    const num = parseFloat(ans);
    const decimals = (ans.split('.')[1]||'').length;
    const deltas = [0.1,-0.1,0.01,-0.01,1,-1,0.5,-0.5].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = (num + d).toFixed(decimals);
      if (c !== ans && !candidates.includes(c)) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+%$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [5,-5,10,-10,2,-2,1,-1].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d) + '%';
      if (c !== ans && !candidates.includes(c) && (num+d) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  }

  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>

<script type="module">

const SUPABASE_URL = 'https://lnwinoghbefmjpvmixzo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lub2doYmVmbWpwdm1peHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODIxNzQsImV4cCI6MjA5Nzk1ODE3NH0.ubKHVLrxlxQd-w3n5pS3O6YMAI7I--ndEkI2xWM9qCo';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _abcTopicCode = 'BRG11-SCI-03';

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return; }
})();

window.logWalkthroughInteraction = async function(questionIndex) {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: topicRow } = await supabase.from('topics').select('id').eq('topic_code', _abcTopicCode).maybeSingle();

      student_id: session.user.id,
      topic_id: topicRow.id,
      school_id: profRow.school_id,
      question_index: questionIndex
    });
  } catch(e) { console.error('interaction log failed:', e); }
}

window.markComplete = async function() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error('Not logged in');

  const { data, error } = await supabase.rpc('mark_walkthrough_complete', { p_topic_code: _abcTopicCode });
  if (error) throw error;
};
