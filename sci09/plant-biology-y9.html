<style>
:root{--acc:#2E7D32;--dark:#1B5E20;--cream:#F1F8F1;--ink:#1a2e1a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--acc);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--acc);color:var(--acc);}
.qb.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--acc);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--acc);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--acc);background:#fff;color:var(--acc);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--acc);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--acc);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.hl{font-size:14px;color:var(--ink);margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.nq{margin-top:12px;font-size:13px;font-weight:600;padding:6px 14px;border-radius:3px;border:1px solid #aaa;background:#f5f5f5;color:#444;cursor:pointer;}
.nq:hover{background:#e0e0e0;}
.wk-ans{margin-top:8px;font-size:14px;line-height:1.6;}
.wk summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.mc-opt{padding:9px 14px;border:1.5px solid var(--line);border-radius:4px;cursor:pointer;font-size:14px;background:#fff;text-align:left;transition:.15s;font-family:inherit;}
.mc-opt:hover{border-color:var(--acc);background:var(--cream);}
.mc-opt.correct{border-color:#2e7d32;background:#e8f8ee;color:#1a7a3a;font-weight:600;}
.mc-opt.wrong{border-color:#C0272D;background:#fde8e8;color:#a01820;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(a){return a[Math.floor(Math.random()*a.length)];}
function tryIt(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTry(id,fn());
}
function genTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="ar"><input type="number" step="any" placeholder="Your answer" id="'+id+'_i"/>'+
    '<button class="ck" onclick="ck(\''+id+'\')">&#10003; Check</button></div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show working</summary><div class="wk-b">'+
    (h?'<ul class="hl">'+h+'</ul>':'')+
    '<div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'">New question</button></div>';
}
function ck(id){
  var fn=ST[id];var o=typeof fn==='function'?fn():fn;
  var v=parseFloat(document.getElementById(id+'_i').value);
  var f=document.getElementById(id+'_f');
  if(isNaN(v)){f.className='fb er';f.textContent='Please enter a number.';return;}
  var tol=o.tol!==undefined?o.tol:0.5;
  if(Math.abs(v-o.ans)<=tol){
    f.className='fb ok';f.textContent='\u2713 Correct! Answer: '+o.ans+(o.unit?' '+o.unit:'');
  }else{f.className='fb er';f.textContent='Not quite \u2014 check your working and try again.';}
}
function tryItMC(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTryMC(id,fn());
}
function genTryMC(id,o){
  var order=o.options.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=order[i];order[i]=order[j];order[j]=tmp;
  }
  var newCorrect=order.indexOf(o.correct);
  var opts=order.map(function(origIdx,shownIdx){
    return '<button class="mc-opt" onclick="ckMC(\''+id+'\','+shownIdx+','+newCorrect+')">'+o.options[origIdx]+'</button>';
  }).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="mc-opts" id="'+id+'_opts">'+opts+'</div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show answer</summary><div class="wk-b"><div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'_mc">New question</button></div>';
}
function ckMC(id,chosen,correct){
  var opts=document.getElementById(id+'_opts').querySelectorAll('.mc-opt');
  opts.forEach(function(b,i){
    if(i===correct)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
    b.disabled=true;
  });
  var f=document.getElementById(id+'_f');
  if(chosen===correct){f.className='fb ok';f.textContent='\u2713 Correct!';}
  else{f.className='fb er';f.textContent='Not quite \u2014 the correct answer is highlighted in green.';}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.nq');if(!b)return;
  var rawId=b.getAttribute('data-tryid');
  var id=rawId.replace('_mc','');
  var fn=ST[id];if(typeof fn!=='function')return;
  var wrap=b.closest('.try');if(!wrap)return;
  var isMC=(rawId.indexOf('_mc')>=0);
  var fresh=isMC?genTryMC(id,fn()):genTry(id,fn());
  var tmp=document.createElement('div');tmp.innerHTML=fresh;
  wrap.parentNode.replaceChild(tmp.firstChild,wrap);
});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#333';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function R(x,y,w,h,fill,stroke,sw,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'" rx="'+(rx||0)+'"/>';}
function circ(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function ellipse(cx,cy,rx,ry,fill,stroke,sw){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function arr(x1,y1,x2,y2,c,w){
  c=c||'#555';w=w||1.5;
  var ang=Math.atan2(y2-y1,x2-x1);
  var hs=8;
  var p1x=x2-hs*Math.cos(ang-0.4),p1y=y2-hs*Math.sin(ang-0.4);
  var p2x=x2-hs*Math.cos(ang+0.4),p2y=y2-hs*Math.sin(ang+0.4);
  return L(x1,y1,x2,y2,c,w)+'<polygon points="'+x2+','+y2+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1)+'" fill="'+c+'"/>';
}


var QS=[
{ey:'Y9 Biology \u2022 Q1',ti:'Photosynthesis in Depth',su:'Light reactions and limiting factors',steps:[

{sl:'Limiting factors',p:'Rate of photosynthesis is controlled by the factor in <b>shortest supply</b>:<br><br>\u2022 <b>Light intensity</b>: rate \u2191 with more light, then levels off<br>\u2022 <b>CO\u2082 concentration</b>: rate \u2191 with more CO\u2082, then levels off<br>\u2022 <b>Temperature</b>: rate \u2191 up to ~40\u00b0C, then drops sharply (enzymes denature)',

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What are the products of the light-dependent reactions in photosynthesis?',options:['ATP and oxygen','Glucose and oxygen','Carbon dioxide and water','Only ATP'],correct:0,working:'The light-dependent reactions use light energy to split water (releasing O\u2082) and produce <b>ATP</b>, which is then used in the Calvin cycle to fix CO\u2082 into glucose.'},{question:'A plant is given extra CO\u2082 but the same light intensity. Initially the rate increases, then levels off. What has become the new limiting factor?',options:['Light intensity','Temperature','Water','CO\u2082 concentration'],correct:0,working:'Once CO\u2082 is no longer limiting, the rate is now limited by <b>light intensity</b>. To increase the rate further, you would need to provide more light.'},{question:'Which layer of a leaf contains the most chloroplasts for photosynthesis?',options:['Palisade mesophyll','Spongy mesophyll','Upper epidermis','Lower epidermis'],correct:0,working:'The <b>palisade mesophyll</b> is packed with chloroplasts and positioned at the top of the leaf to receive maximum light.'},{question:'Where in the chloroplast does the Calvin cycle (light-independent reactions) take place?',options:['The stroma','The thylakoid membrane','The cell wall','The vacuole'],correct:0,working:'The Calvin cycle occurs in the <b>stroma</b>, the fluid-filled space surrounding the thylakoids, where CO₂ is fixed into glucose using ATP from the light-dependent reactions.'},{question:'What is the main role of chlorophyll in photosynthesis?',options:['Absorbing light energy (mainly red and blue light)','Storing glucose','Releasing carbon dioxide','Controlling stomatal opening'],correct:0,working:'<b>Chlorophyll</b> absorbs light energy, mostly in the red and blue regions of the spectrum, while reflecting green light — which is why leaves appear green.'},{question:'What is the main function of stomata?',options:['Gas exchange — allowing CO₂ in and O₂/water vapour out','Absorbing light for photosynthesis','Transporting sugars to the roots','Anchoring the plant in soil'],correct:0,working:'<b>Stomata</b> are pores, controlled by guard cells, that allow gas exchange: CO₂ diffuses in for photosynthesis, while O₂ and water vapour diffuse out.'},{question:'On a cloudy morning, light intensity is low but CO₂ and temperature are not limiting. What is the limiting factor?',options:['Light intensity','Temperature','CO₂ concentration','Water availability'],correct:0,working:'Since CO₂ and temperature are adequate, the factor in shortest supply — <b>light intensity</b> — is limiting the rate of photosynthesis.'},{question:'Oxygen released during photosynthesis comes from which molecule?',options:['Water (splitting during the light-dependent reactions)','Carbon dioxide','Glucose','Chlorophyll'],correct:0,working:'During the light-dependent reactions, <b>water</b> molecules are split (photolysis), releasing oxygen as a by-product and providing electrons and protons for ATP production.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What drives water up the xylem?',options:['Transpiration pull \u2014 water evaporating from leaves creates tension','Root pressure alone','Osmosis from cell to cell','The pumping action of xylem cells'],correct:0,working:'<b>Transpiration pull</b> is the main mechanism. Water evaporates from mesophyll cells and out through stomata, creating a water potential gradient that pulls water up through xylem vessels.'},{question:'What is translocation?',options:['Movement of sugars (sucrose) through phloem','Movement of water through xylem','Gas exchange through stomata','Active transport of minerals into roots'],correct:0,working:'<b>Translocation</b> is the transport of dissolved sucrose through phloem from where it is made (source) to where it is used or stored (sink).'},{question:'A plant is placed in very humid conditions with no wind. How does transpiration rate change?',options:['It decreases \u2014 the concentration gradient of water vapour is smaller','It increases \u2014 the plant gets more water','It stays the same','It stops completely'],correct:0,working:'High humidity reduces the water vapour concentration gradient from leaf to air. Less water vapour diffuses out \u2014 <b>transpiration rate decreases</b>.'},{question:'Which tissue transports water and mineral ions from roots to leaves?',options:['Xylem','Phloem','Palisade mesophyll','Guard cells'],correct:0,working:'<b>Xylem</b> vessels are dead, hollow tubes that transport water and dissolved mineral ions upward from the roots to the rest of the plant.'},{question:'Sugars produced in the leaves are transported to storage organs by which process, in which direction can it flow?',options:['Translocation, in both directions (source to sink)','Transpiration, upward only','Osmosis, downward only','Diffusion, in one fixed direction'],correct:0,working:'<b>Translocation</b> in phloem can move sucrose in any direction — from a photosynthesising leaf (source) to wherever it is needed, such as roots or fruits (sink).'},{question:'Increasing wind speed around a plant has what effect on transpiration rate?',options:['It increases — wind removes water vapour from the leaf surface, steepening the concentration gradient','It decreases — wind blows stomata closed','It has no effect','It stops transpiration completely'],correct:0,working:'Wind removes water vapour from around the leaf surface, maintaining a steep concentration gradient between the leaf\'s air spaces and the surrounding air, which <b>increases</b> the rate of diffusion (transpiration).'},{question:'What structural feature of xylem vessels helps them transport water efficiently?',options:['They are hollow, dead cells forming a continuous tube','They contain cytoplasm to pump water','They have chloroplasts','They are surrounded by guard cells'],correct:0,working:'Xylem vessel cells lose their cytoplasm and end walls at maturity, becoming <b>hollow dead tubes</b> that form a continuous, unobstructed pathway for water movement.'},{question:'Root hair cells increase water uptake mainly by which adaptation?',options:['Increasing surface area in contact with soil water','Producing chlorophyll for photosynthesis','Storing large amounts of starch','Producing auxin'],correct:0,working:'Root hair cells have long, thin projections that greatly <b>increase the surface area</b> in contact with soil water, maximising water and mineral ion absorption by osmosis and active transport.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
o.push(T(240,30,'Xylem vs Phloem','#2E7D32',12,'middle',true));
var rows=[['','Xylem','Phloem'],['Transports','Water + minerals','Sugars (sucrose)'],['Cells','Dead, lignified walls','Living sieve cells'],['Direction','Upward only','Both directions'],['Process','Transpiration pull','Translocation']];var cols=['#555','#1565C0','#2E7D32'];
rows.forEach(function(r,i){o.push(R(20,50+i*44,440,32,i===0?'#e0e0e0':'#f5f5f5','#555',0.5,2));o.push(T(90,71+i*44,r[0],'#555',8,'start',i===0));o.push(T(245,71+i*44,r[1],cols[1],8,'middle',false));o.push(T(385,71+i*44,r[2],cols[2],8,'middle',false));});
s.innerHTML=o.join('');}}
]},
{ey:'Y9 Biology \u2022 Q3',ti:'Plant Hormones',su:'Auxins and tropisms',steps:[
{sl:'Plant hormones: auxins',p:'<b>Auxins</b> are plant hormones that promote cell elongation. They are produced at shoot tips and move away from light.<br><br>In <b>phototropism</b>: auxins accumulate on the shaded side of the shoot \u2192 cells there elongate more \u2192 shoot bends toward the light.',
draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
o.push(arr(400,150,450,150,'#C8922A',3));o.push(T(460,143,'Light','#C8922A',10,'start',true));
o.push('<path d="M230,20 C210,40 195,80 200,130 C202,160 210,190 220,220 C225,235 230,250 230,260" fill="none" stroke="#2E7D32" stroke-width="3"/>');
o.push(T(220,290,'Shoot bends\ntoward light','#2E7D32',8,'middle',false));
o.push(T(320,100,'High auxin','#1565C0',9,'start',false));o.push(T(320,112,'(shaded side)','#555',7,'start',false));
o.push(T(140,100,'Low auxin','#C0272D',9,'end',false));o.push(T(140,112,'(lit side)','#555',7,'end',false));
s.innerHTML=o.join('');}},
{sl:'Tropisms',p:'A <b>tropism</b> is a directional growth response to a stimulus:<br><br>\u2022 <b>Phototropism</b>: response to light. Shoots are positively phototropic (grow toward light).<br>\u2022 <b>Gravitropism</b>: response to gravity. Roots are positively gravitropic (grow down); shoots are negatively gravitropic (grow up).',
draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
o.push(T(120,22,'Shoot: negative gravitropism','#2E7D32',9,'middle',true));

o.push(T(360,22,'Root: positive gravitropism','#C8922A',9,'middle',true));
o.push(L(360,80,360,260,'#C8922A',3));o.push(arr(360,180,360,250,'#C8922A',2));o.push(T(390,220,'grows down','#C8922A',8,'start',false));
o.push(arr(240,280,240,290,'#555',1.5));o.push(T(240,295,'gravity \u2193','#555',9,'middle',false));
s.innerHTML=o.join('');}},
{sl:'Uses of plant hormones',p:'Synthetic plant hormones (auxins) are used commercially:<br><br>\u2022 <b>Rooting powder</b>: stimulates root growth in cuttings<br>\u2022 <b>Selective weedkillers</b>: high auxin concentration kills broad-leaved weeds without harming grass<br>\u2022 <b>Seedless fruit</b>: auxins promote fruit development without fertilisation',
draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
var uses=[['Rooting powder','Stimulates root growth in cuttings','#2E7D32'],['Selective weedkillers','Kills broad-leaved weeds, spares grass','#C0272D'],['Seedless fruit production','Promotes fruit growth without seeds','#C8922A']];
uses.forEach(function(u,i){o.push(R(30,40+i*70,420,55,u[2]+'22',u[2],2,4));o.push(T(100,68+i*70,u[0],u[2],12,'start',true));o.push(T(300,68+i*70,u[1],'#555',9,'middle',false));});
s.innerHTML=o.join('');}},
{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'A shoot tip is covered with a light-proof cap. The plant is lit from one side. What happens?',options:['Shoot grows straight up (no auxin response without tip)','Shoot bends toward the light','Shoot bends away from light','Shoot stops growing'],correct:0,working:'Without the shoot tip, no auxin is produced, so there is no differential growth on shaded vs lit sides. The shoot grows <b>straight upward</b>.'},{question:'How do roots respond to gravity?',options:['Positively \u2014 they grow toward (downward) it','Negatively \u2014 they grow away from it','They show no response to gravity','They only respond to light, not gravity'],correct:0,working:'Roots are <b>positively gravitropic</b> \u2014 they grow in the direction of gravity (downward), helping anchor the plant and access water/nutrients deep in soil.'},{question:'How do selective weedkillers work?',options:['High concentration of synthetic auxin disrupts growth in broad-leaved plants but not grasses','They physically remove weeds','They block photosynthesis in all plants','They kill insects that eat weeds'],correct:0,working:'Selective weedkillers contain synthetic <b>auxins</b> at concentrations that cause uncontrolled, disruptive growth in broad-leaved weeds, while narrow-leaved grasses are largely unaffected due to differences in leaf structure and hormone sensitivity.'},{question:'What is phototropism?',options:['Growth of a plant in response to the direction of light','Growth of a plant in response to gravity','Growth of a plant in response to touch','Growth of a plant in response to water'],correct:0,working:'<b>Phototropism</b> is the growth response of a plant to the direction of light, allowing shoots to grow towards light for photosynthesis.'},{question:'Auxin causes cells to elongate more on the shaded side of a shoot. What is the effect?',options:['The shoot bends toward the light','The shoot bends away from the light','The shoot stops growing','The shoot grows straight'],correct:0,working:'Auxin accumulates on the shaded side, causing those cells to <b>elongate more</b> than cells on the lit side. This differential growth bends the shoot <b>toward the light</b>.'},{question:'Why are roots negatively phototropic?',options:['Growing away from light helps roots grow down into soil to find water and anchor the plant','Roots need light to photosynthesise','Light damages root cells directly','Roots have no response to light at all'],correct:0,working:'Roots grow <b>away from light</b> (negative phototropism), which usually means growing downward into the soil, helping them access water, minerals, and anchor the plant.'},{question:'In the classic Charles Darwin coleoptile experiment, removing the very tip of a shoot prevented bending toward light. What did this suggest?',options:['The tip is where the growth-stimulating substance (auxin) is produced or detected','The tip absorbs all the plant\'s water','The tip is the only photosynthetic part','The tip controls root growth only'],correct:0,working:'Removing the tip stopped the bending response, suggesting the <b>tip produces or detects</b> the signal (later identified as auxin) responsible for directional growth.'},{question:'Why might a farmer use synthetic auxins as a rooting powder for cuttings?',options:['Auxins stimulate root growth, helping cuttings establish roots faster','Auxins kill fungal infections','Auxins speed up photosynthesis','Auxins prevent seed germination'],correct:0,working:'Synthetic auxins in rooting powders <b>stimulate root formation</b> at the cut end of a stem, helping cuttings establish a root system more quickly.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
o.push(T(240,30,'Plant hormones summary','#2E7D32',12,'middle',true));
var rows=[['Auxin','Promotes cell elongation, made at tips'],['Phototropism','Growth response to light (shoots: positive)'],['Gravitropism','Growth response to gravity (roots: positive)'],['Commercial uses','Rooting powder, weedkillers, seedless fruit']];var cols=['#2E7D32','#C8922A','#1565C0','#C0272D'];
rows.forEach(function(r,i){o.push(R(20,65+i*52,440,38,cols[i]+'18',cols[i],1.5,4));o.push(T(120,89+i*52,r[0],cols[i],10,'start',true));o.push(T(310,89+i*52,r[1],'#555',8,'middle',false));});
s.innerHTML=o.join('');}}
]},
{ey:'Y9 Biology \u2022 Q4',ti:'Plant Adaptations',su:'Surviving different environments',steps:[
{sl:'Xerophytes (dry environments)',p:'Plants adapted to dry conditions (<b>xerophytes</b>) reduce water loss:<br><br>\u2022 <b>Thick waxy cuticle</b>: reduces evaporation<br>\u2022 <b>Small/needle-shaped leaves</b>: less surface area for water loss (cacti spines)<br>\u2022 <b>Sunken stomata</b>: traps humid air, reduces transpiration<br>\u2022 <b>Deep/widespread roots</b>: maximise water absorption<br>\u2022 <b>Water storage tissue</b>: succulent stems store water',
draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Other adaptations',p:'\u2022 <b>Carnivorous plants</b> (e.g. Venus flytrap): trap insects to obtain nitrogen in nutrient-poor soils<br>\u2022 <b>Epiphytes</b> (e.g. orchids): grow on other plants to reach light in dense forests, absorb water/nutrients from air<br>\u2022 <b>Halophytes</b>: tolerate high salt concentrations (mangroves, salt marsh plants)',

s.innerHTML=o.join('');}},
{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'Why do cacti have spines instead of broad leaves?',options:['Reduced surface area minimises water loss in dry environments','Spines look attractive','Spines help photosynthesis','Spines absorb more water'],correct:0,working:'Cactus spines are modified leaves with a much <b>smaller surface area</b> than broad leaves, drastically reducing water loss through transpiration in arid environments.'},{question:'Why do water lilies have stomata on the upper surface of their leaves?',options:['The upper surface is exposed to air; the lower surface is in water','Stomata work better in sunlight','It helps the leaf float','Stomata need to be near the roots'],correct:0,working:'Since water lily leaves float with the <b>lower surface in water</b> (where gas exchange with air is impossible), stomata are positioned on the <b>upper surface</b>, which is in contact with air.'},{question:'Why do carnivorous plants trap insects?',options:['To obtain nitrogen, which is scarce in the nutrient-poor soils where they grow','For energy instead of photosynthesis','To defend against predators','To attract pollinators'],correct:0,working:'Carnivorous plants typically grow in <b>nitrogen-poor soils</b> (e.g. bogs). They still photosynthesise for energy, but trap insects to obtain essential <b>nitrogen</b> for making proteins and DNA.'},{question:'What is a thick waxy cuticle on a xerophyte\'s leaves an adaptation for?',options:['Reducing water loss by evaporation through the leaf surface','Increasing photosynthesis rate','Attracting pollinators','Absorbing more sunlight'],correct:0,working:'A thick waxy cuticle is largely waterproof, <b>reducing water loss</b> through the leaf\'s outer surface — an important adaptation for plants in dry habitats.'},{question:'Why do many xerophytes have sunken stomata (in pits) rather than stomata on a flat surface?',options:['The pits trap humid air, reducing the water vapour concentration gradient and slowing transpiration','Sunken stomata let in more light','Sunken stomata increase gas exchange rate','Sunken stomata attract insects'],correct:0,working:'Sunken stomata sit in pits that trap a layer of humid air. This <b>reduces the concentration gradient</b> between the leaf and the air, slowing the rate of water loss.'},{question:'Hydrophytes such as water lilies often have large air spaces (aerenchyma) in their tissue. What is this mainly for?',options:['Providing buoyancy and helping the leaf float, plus aiding gas diffusion','Storing extra water','Increasing rigidity of the stem','Producing extra chlorophyll'],correct:0,working:'Large air spaces give hydrophytes <b>buoyancy</b>, helping leaves float on the water surface, and also help gases diffuse through the plant, since gas exchange with waterlogged soil is difficult.'},{question:'Why do xerophytes often have small, rolled, or reduced leaves?',options:['To reduce surface area, minimising water loss through transpiration','To increase the rate of photosynthesis','To make the plant more visible to pollinators','To store more water in the leaf'],correct:0,working:'Small, rolled, or needle-like (reduced) leaves have a much smaller surface area, which <b>reduces water loss</b> by transpiration — vital for survival in dry conditions.'},{question:'Some xerophytes, like succulents, store water in thick, fleshy stems or leaves. What is this adaptation called?',options:['Water storage tissue','Transpiration enhancement','Negative phototropism','Translocation'],correct:0,working:'Succulents have specialised <b>water storage tissue</b> in swollen stems or leaves, allowing them to survive long periods without rainfall by drawing on these internal reserves.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
o.push(T(240,30,'Plant adaptations summary','#2E7D32',12,'middle',true));
var rows=[['Xerophytes','Dry habitats: waxy cuticle, small leaves, deep roots'],['Hydrophytes','Aquatic habitats: air spaces, upper stomata'],['Carnivorous plants','Trap insects for nitrogen in poor soils'],['Halophytes','Tolerate high salt concentrations']];var cols=['#C8922A','#1565C0','#C0272D','#2E7D32'];
rows.forEach(function(r,i){o.push(R(20,65+i*52,440,38,cols[i]+'18',cols[i],1.5,4));o.push(T(130,89+i*52,r[0],cols[i],10,'start',true));o.push(T(330,89+i*52,r[1],'#555',8,'middle',false));});
s.innerHTML=o.join('');}}
]},
{ey:'Y9 Biology \u2022 Q5',ti:'Plant Reproduction',su:'Flowers, pollination and seed dispersal',steps:[
{sl:'Flower structure',p:'Flowers contain reproductive organs:<br><br>\u2022 <b>Stamen</b> (male): anther (produces pollen) + filament<br>\u2022 <b>Carpel</b> (female): stigma (receives pollen), style, ovary (contains ovules)<br>\u2022 <b>Petals</b>: often colourful to attract pollinators<br>\u2022 <b>Sepals</b>: protect the developing flower bud',

{sl:'Seed dispersal',p:'Plants disperse seeds away from the parent to reduce competition. Methods:<br><br>\u2022 <b>Wind</b>: light seeds with wings/parachutes (sycamore, dandelion)<br>\u2022 <b>Animal</b>: hooked seeds attach to fur, or eaten and excreted elsewhere<br>\u2022 <b>Water</b>: buoyant, waterproof seeds (coconut)<br>\u2022 <b>Explosive</b>: pods burst, flinging seeds out',

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What features indicate a flower is insect-pollinated?',options:['Bright colours, scent, nectar, sticky pollen','Small dull petals, no scent','Light feathery pollen produced in large quantities','Feathery stigma'],correct:0,working:'Insect-pollinated flowers have <b>bright colours and scent</b> to attract pollinators, <b>nectar</b> as a reward, and <b>sticky pollen</b> that clings to insects\' bodies.'},{question:'Why do plants disperse their seeds away from the parent plant?',options:['To reduce competition for light, water, and nutrients','To make seeds taste better','To increase pollination rates','To protect seeds from predators'],correct:0,working:'Dispersing seeds away from the parent <b>reduces competition</b> between parent and offspring (and between siblings) for resources like light, water, nutrients, and space.'},{question:'Coconuts are dispersed by water. What adaptation helps this?',options:['A buoyant, waterproof fibrous husk','Hooks that attach to animals','Wings for gliding in wind','Bright colours'],correct:0,working:'Coconuts have a <b>buoyant, waterproof husk</b> that allows them to float on ocean currents for long distances before washing ashore and germinating.'},{question:'What features indicate a flower is wind-pollinated?',options:['Small, dull petals, no scent, and large amounts of light, feathery pollen','Bright petals and strong scent','Sticky, heavy pollen grains','Large amounts of nectar'],correct:0,working:'Wind-pollinated flowers do not need to attract insects, so they typically have <b>small, dull, scentless petals</b> and produce large quantities of light pollen that can be carried by wind, along with feathery stigmas to catch it.'},{question:'What is the function of the stigma in a flower?',options:['To receive pollen grains during pollination','To produce pollen','To attract insects with nectar','To photosynthesise'],correct:0,working:'The <b>stigma</b> is the sticky tip of the {sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'Which mineral ion is needed for making chlorophyll, and what deficiency symptom results from its lack?',options:['Magnesium — yellowing of leaves (chlorosis)','Nitrate — stunted growth','Potassium — poor flowering','Calcium — weak cell walls'],correct:0,working:'<b>Magnesium</b> is a key component of the chlorophyll molecule. A deficiency causes <b>chlorosis</b> — yellowing of leaves, especially between the veins — because less chlorophyll can be made.'},{question:'Which mineral ion is needed for making amino acids and proteins, and what happens if a plant lacks it?',options:['Nitrate — stunted growth and yellowing of older leaves','Magnesium — poor root growth','Potassium — wilting','Calcium — chlorosis'],correct:0,working:'<b>Nitrate</b> ions are absorbed and used to build amino acids, which are needed to make proteins for growth. A deficiency causes <b>stunted growth</b> and yellowing of older leaves.'},{question:'A plant has purple-tinged leaves and poor root development. Which mineral deficiency is most likely?',options:['Phosphate deficiency','Nitrate deficiency','Magnesium deficiency','Potassium deficiency'],correct:0,working:'<b>Phosphate</b> is needed for healthy root growth and respiration. A deficiency often causes stunted roots and purple discolouration of leaves.'},{question:'Why do plants need potassium ions?',options:['To help enzymes function in photosynthesis and respiration, and for flower/fruit formation','To build chlorophyll directly','To form cell walls','To make DNA'],correct:0,working:'<b>Potassium</b> ions help activate enzymes involved in photosynthesis and respiration, and are important for healthy flowers and fruit. A deficiency can cause poor flowering and yellow leaves with dead spots.'},{question:'How do plant roots absorb mineral ions from the soil when the soil has a lower concentration than the root cells?',options:['Active transport, using energy from respiration','Osmosis, moving down a water potential gradient','Simple diffusion, moving down a concentration gradient','Transpiration pull through the xylem'],correct:0,working:'Since mineral ions are often more concentrated inside root hair cells than in the soil, they must be absorbed against the concentration gradient using <b>active transport</b>, which requires energy from respiration.'},{question:'What is the main function of calcium ions in plants?',options:['Strengthening cell walls and cell membranes','Producing chlorophyll','Activating photosynthesis enzymes','Forming amino acids'],correct:0,working:'<b>Calcium</b> ions are important for strengthening <b>cell walls</b> and membranes. A deficiency can lead to stunted growth and death of growing tips.'},{question:'A crop grown in nitrate-deficient soil shows which symptoms?',options:['Stunted growth with yellowing of older leaves first','Purple leaves with healthy growth','No visible symptoms','Excessive dark green growth'],correct:0,working:'Without enough nitrate, the plant cannot make sufficient protein for growth, resulting in <b>stunted growth</b>, with older leaves yellowing first as nitrogen is redirected to newer growth.'},{question:'Why might farmers add NPK fertiliser to their soil?',options:['To replace mineral ions (nitrate, phosphate, potassium) removed by previous harvests','To increase soil water content only','To kill pests in the soil','To lower soil pH permanently'],correct:0,working:'NPK fertiliser replaces <b>nitrate, phosphate, and potassium</b> ions that are removed from the soil when crops are harvested, ensuring future crops have enough minerals for healthy growth.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

]},

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What is osmosis?',options:['The movement of water molecules from a region of higher water potential to lower water potential through a partially permeable membrane','The movement of any solute from high to low concentration','The active pumping of water using energy','The movement of gases through stomata'],correct:0,working:'<b>Osmosis</b> is the passive movement of water molecules through a partially permeable membrane, from a region of higher water potential (more water, dilute solution) to lower water potential (less water, concentrated solution).'},{question:'A plant cell is placed in a concentrated sugar solution (lower water potential than the cell). What happens?',options:['Water leaves the cell by osmosis and the cell becomes flaccid or plasmolysed','Water enters the cell and it becomes turgid','No net water movement occurs','The cell wall bursts'],correct:0,working:'Since the surrounding solution has a lower water potential, water moves <b>out</b> of the cell by osmosis, causing the cell to become flaccid or, in extreme cases, plasmolysed (membrane pulls away from the wall).'},{question:'Why do plant cells not burst when placed in pure water, unlike animal cells?',options:['The rigid cell wall prevents the cell from over-expanding, so it becomes turgid instead','Plant cells have no membrane','Plant cells cannot absorb water','Plant cells actively pump water back out'],correct:0,working:'The strong, rigid <b>cell wall</b> resists the pressure of water entering the cell, so the cell becomes firm (turgid) rather than bursting, unlike an animal cell which has no cell wall.'},{question:'What term describes a plant cell that has absorbed the maximum amount of water and is firm?',options:['Turgid','Plasmolysed','Flaccid','Dehydrated'],correct:0,working:'A cell that has taken in water by osmosis until it is firm and pressed against its cell wall is described as <b>turgid</b>. Turgor pressure helps support non-woody plant parts.'},{question:'Why is turgor pressure important for a plant such as a young seedling?',options:['It provides support, helping the plant stay upright without woody tissue','It helps the plant photosynthesise faster','It increases the rate of transpiration only','It prevents mineral uptake'],correct:0,working:'<b>Turgor pressure</b> (from turgid cells) provides support for soft plant tissues, such as seedlings and leaves, helping them stay upright and rigid without needing woody tissue.'},{question:'A wilted plant is watered and its leaves become firm again. What process explains this?',options:['Water moves into the cells by osmosis, restoring turgor pressure','Active transport of water into cells','Water evaporates from the leaves faster','Minerals are absorbed to strengthen cell walls'],correct:0,working:'Watering increases the water potential in the soil and root cells, so water moves back into the plant cells by <b>osmosis</b>, restoring turgor pressure and making the leaves firm again.'},{question:'What happens during plasmolysis?',options:['The cell membrane pulls away from the cell wall as water leaves the cell','The cell wall breaks down','The cell absorbs excess water and bursts','The nucleus divides'],correct:0,working:'<b>Plasmolysis</b> occurs when a plant cell loses so much water by osmosis (in a very concentrated external solution) that the cell membrane and cytoplasm shrink away from the cell wall.'},{question:'Which structure in a plant cell acts as the partially permeable membrane controlling osmosis?',options:['Cell membrane (plasma membrane)','Cell wall','Chloroplast membrane only','Nucleus membrane'],correct:0,working:'The <b>cell membrane (plasma membrane)</b> is partially permeable, allowing water molecules through while controlling the movement of larger solute molecules — this is what makes osmosis possible.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

rows.forEach(function(r,i){o.push(R(20,58+i*44,440,32,cols[i]+'18',cols[i],1.5,3));o.push(T(135,79+i*44,r[0],cols[i],9,'start',true));o.push(T(330,79+i*44,r[1],'#555',8,'middle',false));});
s.innerHTML=o.join('');}}
]},

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What is the function of the anther in a flower?',options:['Produces pollen grains containing the male gametes','Receives pollen during pollination','Produces the egg cell','Protects the flower bud'],correct:0,working:'The <b>anther</b>, at the top of the stamen (male part), produces <b>pollen grains</b> which contain the male gametes.'},{question:'What is the function of the ovary in a flower?',options:['Contains ovules and, after fertilisation, develops into the fruit','Produces pollen','Attracts pollinators with scent','Transfers pollen to the stigma'],correct:0,working:'The <b>ovary</b> is part of the carpel (female part) and contains one or more ovules. After fertilisation, the ovary develops into the <b>fruit</b>, while the ovules become seeds.'},{question:'What are sepals and what is their main function?',options:['Green, leaf-like structures that protect the flower bud before it opens','Colourful structures that attract pollinators','Structures that produce pollen','Structures that receive pollen'],correct:0,working:'<b>Sepals</b> are usually green, leaf-like structures that enclose and protect the flower bud before it opens, collectively called the calyx.'},{question:'After fertilisation, what does the ovule develop into?',options:['A seed','A fruit','A petal','A pollen grain'],correct:0,working:'Once fertilised, the <b>ovule</b> develops into a <b>seed</b>, containing the embryo (new plant) and a food store, while the surrounding ovary becomes the fruit.'},{question:'What is the pathway of a pollen grain from landing on the stigma to fertilisation?',options:['A pollen tube grows down the style to the ovule, delivering the male nucleus to fertilise the egg cell','The pollen grain directly enters the ovary without growing a tube','The pollen dissolves in nectar and diffuses to the ovule','The stigma absorbs the whole pollen grain into the egg cell'],correct:0,working:'After landing on the stigma, the pollen grain germinates and grows a <b>pollen tube</b> down through the style to the ovule. The male nucleus travels down this tube to fertilise the egg cell.'},{question:'What is the function of the filament in a flower?',options:['Supports the anther in a position where pollen can be dispersed','Produces the egg cell','Receives pollen from pollinators','Becomes the fruit after fertilisation'],correct:0,working:'The <b>filament</b> is the stalk that holds the anther up, positioning it so pollen can be released or picked up by pollinators.'},{question:'What is fertilisation in flowering plants?',options:['The fusion of a male gamete nucleus (from pollen) with the female gamete nucleus (egg cell)','The transfer of pollen from anther to stigma','The growth of a seed into a new plant','The opening of the flower bud'],correct:0,working:'<b>Fertilisation</b> is the fusion of the male gamete\'s nucleus (delivered via the pollen tube) with the female gamete (egg cell) nucleus in the ovule, forming a zygote.'},{question:'Why do petals of insect-pollinated flowers tend to be brightly coloured and arranged around the reproductive parts?',options:['To attract pollinators and guide them toward nectar, ensuring contact with anthers and stigma','To photosynthesise more efficiently','To protect the flower from frost','To absorb water for the plant'],correct:0,working:'Bright <b>petals</b> attract pollinators (like insects) and often guide them toward nectar, increasing the chance that the pollinator brushes against the anthers (picking up pollen) and stigma (depositing pollen).'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

var qi=0,si=0;
function buildSidebar(){
  var sb=document.getElementById('sb');
  sb.innerHTML='<div class="sb-lbl">Topics</div>';
  QS.forEach(function(q,i){
    var b=document.createElement('button');
    b.className='qb'+(i===qi?' on':'');
    b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;
    b.onclick=function(){qi=i;si=0;render();};
    sb.appendChild(b);
  });
}
function render(){
  var q=QS[qi],st=q.steps[si];
  document.getElementById('ey').textContent=q.ey;
  document.getElementById('ti').textContent=q.ti;
  document.getElementById('su').textContent=q.su;
  document.getElementById('pn').className='pnl fi';
  document.getElementById('pn').innerHTML='<div class="sl">'+st.sl+'</div><div>'+st.p+'</div>';
  st.draw();
  var dt=document.getElementById('dt');
  dt.innerHTML=q.steps.map(function(_,i){return '<div class="dot'+(i===si?' on':i<si?' dn':'')+'"></div>';}).join('');
  document.getElementById('pb').disabled=(qi===0&&si===0);
  var last=(qi===QS.length-1&&si===q.steps.length-1);
  document.getElementById('nb').textContent=last?'Finished \u2713':'Next \u2192';
  document.getElementById('nb').disabled=false;
  document.querySelectorAll('.qb').forEach(function(b,i){b.classList.toggle('on',i===qi);});
}
document.getElementById('nb').onclick=function(){
  var q=QS[qi];
  if(si<q.steps.length-1){si++;}
  else if(qi<QS.length-1){qi++;si=0;}
  render();
};
document.getElementById('pb').onclick=function(){
  if(si>0){si--;}
  else if(qi>0){qi--;si=QS[qi].steps.length-1;}
  render();
};
buildSidebar();render();
