<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(a){return a[Math.floor(Math.random()*a.length)];}
function tryIt(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTry(id,fn());
}
function genTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="ar"><input type="number" step="any" placeholder="Your answer" id="'+id+'_i"/>'+
    '<button class="ck" onclick="ck(\''+id+'\')">&#10003; Check</button></div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show working</summary><div class="wk-b">'+
    (h?'<ul class="hl">'+h+'</ul>':'')+
    '<div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'">New question</button></div>';
}
function ck(id){
  var fn=ST[id];var o=typeof fn==='function'?fn():fn;
  var v=parseFloat(document.getElementById(id+'_i').value);
  var f=document.getElementById(id+'_f');
  if(isNaN(v)){f.className='fb er';f.textContent='Please enter a number.';return;}
  var tol=o.tol!==undefined?o.tol:0.5;
  if(Math.abs(v-o.ans)<=tol){
    f.className='fb ok';f.textContent='\u2713 Correct! Answer: '+o.ans+(o.unit?' '+o.unit:'');
  }else{f.className='fb er';f.textContent='Not quite \u2014 check your working and try again.';}
}
function tryItMC(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTryMC(id,fn());
}
function genTryMC(id,o){
  var order=o.options.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=order[i];order[i]=order[j];order[j]=tmp;
  }
  var newCorrect=order.indexOf(o.correct);
  var opts=order.map(function(origIdx,shownIdx){
    return '<button class="mc-opt" onclick="ckMC(\''+id+'\','+shownIdx+','+newCorrect+')">'+o.options[origIdx]+'</button>';
  }).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="mc-opts" id="'+id+'_opts">'+opts+'</div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show answer</summary><div class="wk-b"><div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'_mc">New question</button></div>';
}
function ckMC(id,chosen,correct){
  var opts=document.getElementById(id+'_opts').querySelectorAll('.mc-opt');
  opts.forEach(function(b,i){
    if(i===correct)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
    b.disabled=true;
  });
  var f=document.getElementById(id+'_f');
  if(chosen===correct){f.className='fb ok';f.textContent='\u2713 Correct!';}
  else{f.className='fb er';f.textContent='Not quite \u2014 the correct answer is highlighted in green.';}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.nq');if(!b)return;
  var rawId=b.getAttribute('data-tryid');
  var id=rawId.replace('_mc','');
  var fn=ST[id];if(typeof fn!=='function')return;
  var wrap=b.closest('.try');if(!wrap)return;
  var isMC=(rawId.indexOf('_mc')>=0);
  var fresh=isMC?genTryMC(id,fn()):genTry(id,fn());
  var tmp=document.createElement('div');tmp.innerHTML=fresh;
  wrap.parentNode.replaceChild(tmp.firstChild,wrap);
});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#333';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function R(x,y,w,h,fill,stroke,sw,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'" rx="'+(rx||0)+'"/>';}
function circ(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function ellipse(cx,cy,rx,ry,fill,stroke,sw){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function arr(x1,y1,x2,y2,c,w){
  c=c||'#555';w=w||1.5;
  var ang=Math.atan2(y2-y1,x2-x1);
  var hs=8;
  var p1x=x2-hs*Math.cos(ang-0.4),p1y=y2-hs*Math.sin(ang-0.4);
  var p2x=x2-hs*Math.cos(ang+0.4),p2y=y2-hs*Math.sin(ang+0.4);
  return L(x1,y1,x2,y2,c,w)+'<polygon points="'+x2+','+y2+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1)+'" fill="'+c+'"/>';
}

r with the non-living, physical environment (abiotic) they interact with, such as soil, water, and climate.'},{question:'What is meant by a \'niche\'?',options:['The specific role an organism plays within its habitat, including what it eats and how it interacts with others','The physical location where an organism lives','The total number of a species in an area','The climate of a habitat'],correct:0,working:'A <b>niche</b> describes the role an organism plays in its ecosystem — its food source, its predators, how and where it lives — not just its physical location.'},{question:'Why can two species rarely occupy exactly the same niche in the same habitat long-term?',options:['They would compete directly for the same limited resources, and one usually outcompetes the other','They would automatically share all resources equally','Species in the same niche never interact','Sharing a niche always benefits both species equally'],correct:0,working:'If two species need exactly the same resources (food, space), they compete directly. Over time, one is usually better adapted and <b>outcompetes</b> the other, a principle known as competitive exclusion.'},{question:'What is the difference between abiotic and biotic factors in an ecosystem?',options:['Abiotic factors are non-living (e.g. temperature, light); biotic factors are living (e.g. predators, competitors)','Abiotic factors are living; biotic factors are non-living','Both terms mean the same thing','Abiotic factors only apply to water ecosystems'],correct:0,working:'<b>Abiotic</b> factors are non-living parts of the environment (temperature, light intensity, pH, water availability). <b>Biotic</b> factors involve living organisms (predation, competition, disease).'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'A polar bear\'s white fur is an example of what type of adaptation?',options:['Structural adaptation','Behavioural adaptation','Functional adaptation','None of these'],correct:0,working:'White fur is a <b>structural adaptation</b> \u2014 a physical feature that provides camouflage in snowy environments, helping the bear hunt and avoid detection.'},{question:'Migration of birds to warmer climates in winter is what type of adaptation?',options:['Behavioural adaptation','Structural adaptation','Functional adaptation','Genetic adaptation'],correct:0,working:'Migration is a <b>behavioural adaptation</b> \u2014 an action/response that increases survival chances by avoiding harsh winter conditions.'},{question:'Why is camouflage useful to BOTH predators and prey?',options:['Predators use it to ambush prey; prey use it to hide from predators','Only predators benefit from camouflage','Camouflage only works for prey species','Camouflage has no survival benefit'],correct:0,working:'Camouflage benefits both: predators use it to approach prey undetected (ambush hunting), while prey use it to avoid being seen by predators in the first place.'},{question:'What is a behavioural adaptation? Give an example.',options:['A pattern of behaviour that increases survival chances, e.g. hibernation in winter','A physical body feature, e.g. thick fur','A chemical produced by the body, e.g. venom','A change in habitat location only'],correct:0,working:'A <b>behavioural adaptation</b> is a pattern of behaviour (not a physical feature) that improves survival or reproduction, such as hibernation to conserve energy during cold winters.'},{question:'What is a functional (physiological) adaptation? Give an example.',options:['An internal body process that improves survival, e.g. producing antifreeze proteins in fish blood','A physical body feature, e.g. sharp claws','A behaviour such as migration','A change in population size'],correct:0,working:'A <b>functional adaptation</b> is an internal process within an organism\'s body, such as fish producing antifreeze proteins to survive in icy water, or camels producing very concentrated urine to conserve water.'},{question:'Cacti storing water in thick, fleshy stems is what type of adaptation?',options:['Structural adaptation','Behavioural adaptation','Only a functional adaptation','Not an adaptation at all'],correct:0,working:'Thick, fleshy water-storing stems are a physical body feature — a <b>structural adaptation</b> — helping cacti survive in dry (arid) environments.'},{question:'Why do desert animals such as the fennec fox have unusually large ears?',options:['Large ears increase surface area for heat loss, helping regulate body temperature in hot climates','Large ears help the fox swim','Large ears store water','Large ears are unrelated to survival'],correct:0,working:'Large ears provide a greater <b>surface area</b> for losing excess body heat through radiation, an important structural adaptation for surviving in hot desert climates.'},{question:'Why do some deep-sea organisms produce their own light (bioluminescence)?',options:['To attract prey, communicate, or avoid predators in the dark ocean depths','To keep warm in cold water','To photosynthesise in darkness','To increase buoyancy'],correct:0,working:'In the dark depths of the ocean, <b>bioluminescence</b> (a functional adaptation) can help organisms attract prey, find mates, or startle/confuse predators.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'Why do predator and prey populations oscillate in cycles?',options:['Increases in prey lead to increases in predators, which then reduce prey numbers, creating a feedback cycle','Populations are random and unpredictable','Predators always outnumber prey','Prey populations never change'],correct:0,working:'As prey increases, predators have more food and increase too. More predators means more prey eaten, so prey decreases. Fewer prey means less food for predators, so predators decrease. This <b>feedback cycle</b> repeats.'},{question:'What does the presence of mayfly larvae in a river indicate?',options:['The water is clean and has high oxygen levels','The water is heavily polluted','The water temperature is very high','The river has no fish'],correct:0,working:'Mayfly larvae are <b>indicator species</b> that require clean, well-oxygenated water to survive. Their presence indicates good water quality.'},{question:'Why are lichens used as indicators of air pollution?',options:['Lichens are very sensitive to sulfur dioxide (SO\u2082) in the air','Lichens grow faster in polluted air','Lichens only grow in cities','Lichens absorb carbon dioxide'],correct:0,working:'Lichens are extremely sensitive to <b>sulfur dioxide</b> pollution. Areas with poor air quality have few or no lichen species, while clean air supports diverse lichen communities.'},{question:'What is an indicator species?',options:['A species whose presence or absence reveals information about environmental conditions, such as pollution levels','A species that only lives in extreme environments','The most common species in any ecosystem','A species used only for food'],correct:0,working:'An <b>indicator species</b> is sensitive to specific environmental conditions, so its presence, absence, or abundance can reveal information (e.g. about water or air quality) without needing complex chemical tests.'},{question:'What environmental factors most commonly limit population size?',options:['Food/water availability, predation, disease, and competition','Only the amount of sunlight','Only the presence of decomposers','Only the size of the habitat\'s area'],correct:0,working:'Population size is commonly limited by <b>food and water availability</b>, <b>predation</b>, <b>disease</b>, and <b>competition</b> for resources — these are called limiting factors.'},{question:'In a predator-prey cycle, what usually happens shortly after a prey population increases?',options:['The predator population increases (more food available), which then reduces the prey population again','The predator population immediately crashes to zero','Both populations increase forever with no limit','The prey population becomes extinct immediately'],correct:0,working:'More prey means more food for predators, so the <b>predator population increases</b> shortly after. This increased predation then reduces the prey population, and the cycle continues, slightly out of phase.'},{question:'Why are quadrats used in ecological sampling?',options:['To estimate population size or percentage cover of a species over a larger area, without counting every individual','To capture and remove all organisms from a habitat','To measure only abiotic factors like temperature','To identify predator-prey relationships directly'],correct:0,working:'A <b>quadrat</b> is a square frame placed randomly in a habitat to sample organisms in a small area. Counting within several quadrats allows scientists to estimate population size or percentage cover across a larger area without a full count.'},{question:'Why might scientists use a transect line across a habitat?',options:['To study how species distribution changes gradually across an environmental gradient, e.g. from a shore inland','To count every single organism in a habitat exactly','To measure only water temperature','To identify only nocturnal species'],correct:0,working:'A <b>transect</b> is a line across a habitat, along which sampling (often with quadrats) is done at intervals. It shows how species distribution changes across an <b>environmental gradient</b>, such as moisture or light.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
o.push(T(240,30,'Population dynamics summary','#2E7D32',12,'middle',true));
var rows=[['Limiting factors','Food, predation, disease, competition'],['Predator-prey cycles','Populations oscillate in feedback loop'],['Indicator species','Presence/absence shows pollution level'],['Clean water indicators','Mayfly, stonefly larvae'],['Pollution indicators','Sludge worms, rat-tailed maggots']];var cols=['#2E7D32','#C0272D','#1565C0','#2E7D32','#6A1B9A'];
rows.forEach(function(r,i){o.push(R(20,58+i*44,440,32,cols[i]+'18',cols[i],1.5,3));o.push(T(140,79+i*44,r[0],cols[i],9,'start',true));o.push(T(330,79+i*44,r[1],'#555',8,'middle',false));});
s.innerHTML=o.join('');}}
]},

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'Why is high biodiversity important for ecosystem stability?',options:['It makes ecosystems more resilient to disease, environmental change, and disturbance','High biodiversity has no real benefits','It makes ecosystems easier to manage','It reduces competition between species'],correct:0,working:'High biodiversity creates <b>resilience</b> \u2014 if one species is wiped out by disease or environmental change, other species can fill similar ecological roles, preventing total ecosystem collapse.'},{question:'What is a seed bank used for?',options:['Preserving plant genetic diversity for the future','Growing crops faster','Storing money for conservation projects','Breeding endangered animals'],correct:0,working:'<b>Seed banks</b> (like the Svalbard Global Seed Vault) store seeds from diverse plant varieties, preserving genetic diversity in case of crop failures, disease, or extinction in the wild.'},{question:'Which of these is an example of habitat destruction threatening biodiversity?',options:['Deforestation for agriculture','Captive breeding programmes','Seed bank storage','Marine protected areas'],correct:0,working:'<b>Deforestation</b> destroys habitats, displacing or killing the species that depend on them \u2014 a major direct threat to biodiversity. The other options are conservation measures, not threats.'},{question:'What is biodiversity?',options:['The variety of different species (and genetic variation within species) in an ecosystem or on Earth','The total number of individual organisms in one habitat','The number of abiotic factors in an ecosystem','The size of a single population'],correct:0,working:'<b>Biodiversity</b> refers to the variety of life — the number of different species, and genetic variation within species, in an ecosystem or across the planet.'},{question:'How does deforestation threaten biodiversity?',options:['It destroys habitats, removing the resources and shelter many species depend on, causing population decline or extinction','It always increases the number of species in an area','It has no effect on animal populations','It only affects plant species, not animals'],correct:0,working:'<b>Deforestation</b> destroys habitats and the resources (food, shelter) within them. Species dependent on that habitat may decline sharply or become locally extinct.'},{question:'How does pollution threaten biodiversity?',options:['It can poison organisms directly, or damage habitats (e.g. eutrophication in water, acid rain on land)','Pollution always increases species diversity','Pollution only affects human health, not wildlife','Pollution has no measurable effect on ecosystems'],correct:0,working:'<b>Pollution</b> (chemical, plastic, or nutrient pollution like fertiliser runoff causing eutrophication) can poison organisms directly or degrade habitats, reducing the range of species that can survive there.'},{question:'What is the purpose of a conservation programme such as a captive breeding programme?',options:['To increase the population of an endangered species and eventually reintroduce individuals into the wild','To remove a species from the wild permanently','To reduce genetic diversity in a species','To create new habitats only, not to protect species'],correct:0,working:'<b>Captive breeding programmes</b> aim to increase numbers of an endangered species in a controlled environment, with the goal of eventually <b>reintroducing</b> individuals to boost wild populations.'},{question:'Why are protected areas (nature reserves/national parks) important for conservation?',options:['They limit human activity that could damage habitats, protecting species and ecosystems within their boundaries','They allow unlimited hunting and building','They are only useful for tourism, not conservation','They increase pollution levels deliberately'],correct:0,working:'<b>Protected areas</b> restrict damaging human activities (like logging, hunting, and development), helping to conserve habitats and the species that depend on them.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What does nitrogen fixation do?',options:['Converts nitrogen gas (N\u2082) into nitrates that plants can use','Converts nitrates back into nitrogen gas','Helps plants photosynthesise','Removes nitrogen from soil'],correct:0,working:'<b>Nitrogen fixation</b> (carried out by bacteria, or by lightning) converts unreactive nitrogen gas (N\u2082) into nitrates, which plants can absorb and use to build proteins.'},{question:'What is a keystone species?',options:['A species that has a disproportionately large effect on its ecosystem relative to its abundance','The most abundant species in an ecosystem','A species at the top of the food chain only','An endangered species'],correct:0,working:'A <b>keystone species</b> has an outsized influence on its ecosystem \u2014 removing it can cause dramatic, cascading changes, even if it isn\'t the most numerous species (e.g. sea otters controlling sea urchin populations that would otherwise destroy kelp forests).'},{question:'What role do decomposers play in nutrient cycles?',options:['They break down dead organisms and waste, releasing nutrients back into the soil','They convert CO\u2082 into oxygen','They produce nitrates directly from air','They consume living plants and animals only'],correct:0,working:'<b>Decomposers</b> (bacteria, fungi) break down dead organic matter and waste, releasing nutrients like nitrogen and carbon back into the soil/atmosphere, completing the nutrient cycles.'},{question:'What is the role of producers (e.g. plants) at the start of a food chain?',options:['They convert light energy into chemical energy (glucose) via photosynthesis, which other organisms then depend on','They consume other organisms for energy','They decompose dead organic matter','They fix nitrogen from the air directly into protein'],correct:0,working:'<b>Producers</b> (usually plants or algae) use photosynthesis to convert light energy into chemical energy stored in glucose, forming the base of almost all food chains.'},{question:'What happens to energy as it passes along a food chain from one trophic level to the next?',options:['Most energy is lost (as heat, in waste, or used for movement), so less energy is available at each higher level','All the energy is transferred with no loss','Energy increases at each higher trophic level','Energy is only lost at the very top of the food chain'],correct:0,working:'At each trophic level, most energy (typically around 90%) is lost as heat, through movement, or in waste materials — only about 10% is passed on to the next level, which is why food chains rarely have more than 4-5 levels.'},{question:'What is the role of decomposers in the carbon cycle?',options:['They break down dead organisms and waste, releasing carbon dioxide back into the atmosphere through respiration','They absorb carbon dioxide directly from the atmosphere like plants','They only recycle nitrogen, not carbon','They increase the amount of carbon locked in fossil fuels'],correct:0,working:'<b>Decomposers</b> (bacteria and fungi) break down dead organic matter, releasing carbon dioxide back into the atmosphere through their own respiration, completing the <b>carbon cycle</b>.'},{question:'Why do nitrogen-fixing bacteria matter for plant growth?',options:['They convert nitrogen gas from the air into nitrogen compounds (like nitrates) that plants can absorb and use to make proteins','They remove nitrogen from soil, making it less fertile','They only affect animals, not plants','They convert carbon dioxide into nitrogen'],correct:0,working:'Plants cannot use nitrogen gas (N₂) directly from the air. <b>Nitrogen-fixing bacteria</b> (in root nodules of legumes, or free-living in soil) convert it into nitrates that plant roots can absorb.'},{question:'What would happen to a food web if a keystone species (e.g. a top predator) were removed?',options:['The ecosystem could be significantly disrupted, as species the predator controlled may overpopulate, causing knock-on effects throughout the web','Nothing would change in the ecosystem','All other species would immediately go extinct','Biodiversity would automatically increase'],correct:0,working:'A <b>keystone species</b> has a disproportionately large effect on its ecosystem. Removing it (e.g. a top predator) can cause prey species to overpopulate, disrupting the balance of the whole food web.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What percentage of energy is typically transferred from one trophic level to the next?',options:['About 10%','About 50%','About 90%','100%'],correct:0,working:'On average, only about <b>10%</b> of energy is transferred to the next trophic level — the rest is lost as heat (respiration), in waste, or used for movement/life processes.'},{question:'Why do pyramids of biomass usually get smaller at each higher trophic level?',options:['Energy losses at each level mean less biomass can be supported higher up the chain','Predators are always physically smaller than prey','Producers weigh less than consumers','Biomass increases at higher trophic levels'],correct:0,working:'Since only about 10% of energy passes to the next level, there is <b>less energy available to build biomass</b> at each higher trophic level, so pyramids of biomass typically narrow toward the top.'},{question:'Why are there rarely more than 4-5 trophic levels in a food chain?',options:['So much energy is lost at each level that there is eventually too little energy to support another level','Food chains are limited to exactly 5 levels by law','Predators cannot digest more than 4 different foods','Producers can only support one consumer level'],correct:0,working:'Because roughly 90% of energy is lost at each transfer, after 4-5 levels there is too <b>little energy remaining</b> to support a viable population at a further trophic level.'},{question:'In what forms is energy \'lost\' between trophic levels?',options:['Heat from respiration, energy used in movement, and energy in undigested waste/faeces','Energy is never lost, only transferred perfectly','Energy is lost only as light','Energy converts entirely into new biomass'],correct:0,working:'Energy is lost as <b>heat</b> (from respiration), used for <b>movement</b> and other life processes, and lost in <b>waste</b> (faeces, urine) that isn\'t digested or used.'},{question:'What does a pyramid of numbers show, and why might it sometimes look unusual (e.g. wider at the top)?',options:['The number of organisms at each trophic level; it can look unusual if one producer (like a large tree) supports many small consumers','The mass of organisms at each level; it is always a perfect pyramid shape','The energy at each level only','The number of species, not individuals'],correct:0,working:'A <b>pyramid of numbers</b> shows the count of individual organisms at each level. It can be an unusual shape (e.g. one tree supporting thousands of insects) because it doesn\'t account for the size of each organism, unlike a pyramid of biomass.'},{question:'Why is it more energy-efficient for humans to eat plants directly rather than eating animals that ate the plants?',options:['Eating plants directly avoids the energy losses that occur when energy passes through an extra trophic level','Plants contain no usable energy for humans','Animals contain more energy than plants at the same trophic level','There is no efficiency difference'],correct:0,working:'Every extra trophic level means further energy loss (about 90% at each transfer). Eating <b>producers directly</b> is more efficient than eating animals that have already \'used up\' much of the plant energy.'},{question:'Which trophic level always occupies the base of an energy pyramid?',options:['Producers','Primary consumers','Secondary consumers','Decomposers'],correct:0,working:'<b>Producers</b> (e.g. plants, algae) form the base of every energy pyramid, since they capture the initial energy from sunlight that flows through the rest of the food chain.'},{question:'How does energy ultimately enter almost all ecosystems?',options:['As light energy, captured by producers during photosynthesis','As chemical energy stored in rocks','As heat energy from the atmosphere only','Energy is created within animals, not from an external source'],correct:0,working:'Almost all ecosystems are powered by <b>light energy</b> from the sun, captured by producers via photosynthesis and converted into chemical energy (glucose) that flows through the food chain.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'Why must quadrats be placed randomly when sampling a habitat?',options:['To avoid bias, so the sample fairly represents the whole area','To make counting easier for the surveyor','Random placement is not actually necessary','To ensure only common species are recorded'],correct:0,working:'<b>Random placement</b> avoids bias — if a surveyor chose quadrat locations themselves, they might unconsciously pick \'interesting\' spots that don\'t represent the habitat as a whole.'},{question:'How can you estimate the total population size of a plant species in a large field using quadrats?',options:['Count individuals in several quadrats, find the mean per quadrat, then scale up by the total area divided by quadrat area','Count every single plant in the field individually','Use only one quadrat, since one sample is always enough','Estimate the population without any sampling at all'],correct:0,working:'Find the <b>mean number per quadrat</b> from several samples, then multiply by (total area ÷ quadrat area) to estimate the total population across the whole field.'},{question:'What is the mark-release-recapture method used for?',options:['Estimating the population size of mobile animals, such as insects or fish','Measuring plant percentage cover','Testing water pH','Measuring light intensity in a habitat'],correct:0,working:'<b>Mark-release-recapture</b> involves capturing, marking, and releasing a sample of animals, then later recapturing a sample and using the ratio of marked to unmarked individuals to estimate total population size.'},{question:'In mark-release-recapture, if 20 animals are marked and released, and later 25 are recaptured with 5 marked, what does the Lincoln index estimate for population size?',options:['100 (20 × 25 ÷ 5)','20','25','5'],correct:0,working:'The Lincoln index formula: (number marked × total recaptured) ÷ number of marked recaptured = (20×25)÷5 = <b>100</b>.'},{question:'Why is it important that marking an animal does not harm it or make it more visible to predators?',options:['This could bias results by affecting survival rates or recapture rates, making the population estimate inaccurate','Marking always improves survival rates','Marking has no effect on results either way','Only the colour of the mark matters, not its visibility'],correct:0,working:'If marking harms an animal or makes it more visible to predators, it changes its survival/recapture chances, introducing <b>bias</b> and making the population estimate less reliable.'},{question:'What does a belt transect show that a simple line transect does not?',options:['The percentage cover or abundance of species within a band (not just along a single line)','The exact location of a habitat\'s boundary only','The pH of soil along the transect','Nothing extra — they are identical'],correct:0,working:'A <b>belt transect</b> uses a band of a set width (often with quadrats placed along it) rather than a single line, allowing measurement of species abundance/percentage cover, not just presence/absence.'},{question:'Why might scientists repeat sampling at different times of year?',options:['Species abundance and distribution can change with season, so repeated sampling gives a fuller picture','One sample is always sufficient for any ecosystem','Repeating samples introduces unnecessary bias','Seasonal changes never affect species distribution'],correct:0,working:'Populations and distributions can vary by <b>season</b> (e.g. migration, flowering times), so sampling at different times gives more complete and accurate data about an ecosystem.'},{question:'What is percentage cover, as measured using a quadrat?',options:['The proportion of the quadrat\'s area covered by a particular species','The exact number of individual plants','The total mass of organisms in a quadrat','The number of different species present'],correct:0,working:'<b>Percentage cover</b> estimates how much of the quadrat\'s area is covere {sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What is ecological succession?',options:['The gradual, predictable change in the species living in a habitat over time','A sudden, random change in species with no pattern','The immediate appearance of a climax community with no change over time','Only the extinction of species, with no new colonisation'],correct:0,working:'<b>Succession</b> is the gradual, predictable process by which the community of species in a habitat changes over time, usually starting from bare ground and ending in a stable climax community.'},{question:'What are \'pioneer species\' in primary succession?',options:['The first species to colonise a bare, new area, such as lichens on bare rock','The final, most complex species in a climax community','Species that only live in water','Species introduced by humans'],correct:0,working:'<b>Pioneer species</b> (e.g. lichens, mosses) are the first organisms to colonise bare substrate like rock, tolerating harsh conditions and beginning to break down rock into soil.'},{question:'How do pioneer species help later species colonise an area?',options:['They break down rock and add organic matter, gradually forming soil that supports plants with deeper roots','They prevent any other species from ever colonising the area','They have no effect on later succession','They remove all nutrients, making the area less habitable'],correct:0,working:'As pioneer species die and decompose, they add <b>organic matter</b> to the bare surface, gradually forming a thin soil that can support small plants, then eventually larger plants and animals.'},{question:'What is a \'climax community\'?',options:['The final, relatively stable community that persists in an area unless disturbed, such as a mature forest in the UK','The very first community to appear on bare land','A community with no producers','A community that changes completely every year'],correct:0,working:'A <b>climax community</b> is the stable, mature end-point of succession for a given area and climate — for example, deciduous woodland in much of the UK — which persists until a disturbance restarts the process.'},{question:'How does biodiversity typically change as succession progresses toward a climax community?',options:['Biodiversity generally increases as more complex habitats develop, supporting more species','Biodiversity always decreases as succession proceeds','Biodiversity stays exactly the same throughout succession','Biodiversity only changes in secondary succession, not primary'],correct:0,working:'As succession proceeds, increasingly complex vegetation structures (soil, shrubs, trees) provide more niches, so <b>biodiversity generally increases</b> toward the climax community.'},{question:'What is secondary succession, and how does it differ from primary succession?',options:['Secondary succession occurs on land that already has soil (e.g. after a fire or clearing), so it starts further along and proceeds faster than primary succession','Secondary succession only happens on bare rock','Secondary succession is identical to primary succession in every way','Secondary succession cannot produce a climax community'],correct:0,working:'<b>Secondary succession</b> occurs where soil already exists (e.g. after fire, flood, or forest clearing) so pioneer stages are skipped, and succession proceeds <b>faster</b> than primary succession on bare rock.'},{question:'Why might succession be \'restarted\' in an area that has already reached a climax community?',options:['A disturbance such as fire, flooding, or human clearance can destroy the existing community, allowing succession to begin again','Succession can never be restarted once complete','Climax communities are permanently immune to any disturbance','Only human activity can restart succession, never natural events'],correct:0,working:'Disturbances — natural (fire, flood, storm) or human-caused (clearing land) — can destroy an existing climax community, exposing s {sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What does \'sustainable\' mean in the context of resource management?',options:['Using resources in a way that meets current needs without compromising the ability of future generations to meet theirs','Using as many resources as quickly as possible','Only applies to renewable energy, not farming or fishing','Stopping all use of natural resources completely'],correct:0,working:'<b>Sustainability</b> means managing resources so they can continue to be used long-term, meeting present needs without damaging the ability of <b>future generations</b> to meet their own needs.'},{question:'What is sustainable fishing, and how might it be achieved?',options:['Setting fishing quotas and size limits so fish populations can reproduce and replenish','Removing all size and catch limits to maximise short-term profit','Fishing only endangered species to reduce their numbers further','Banning all fishing permanently worldwide'],correct:0,working:'<b>Sustainable fishing</b> uses quotas (limits on how much can be caught) and size limits (allowing young fish to reproduce first) so fish stocks can replenish naturally rather than collapsing.'},{question:'What is sustainable forestry, and what is one method used to achieve it?',options:['Managing forests so they continue to provide timber long-term, e.g. by replanting trees after felling','Cutting down all trees in a forest with no replanting','Using only artificial trees instead of natural forests','Preventing any use of forest resources at all'],correct:0,working:'<b>Sustainable forestry</b> involves practices like <b>replanting</b> trees after felling and selective logging (not clear-cutting), ensuring forests continue producing timber for future generations.'},{question:'How can crop rotation help maintain sustainable agriculture?',options:['Rotating different crops (including nitrogen-fixing legumes) helps maintain soil fertility and reduces pest/disease build-up','Crop rotation
