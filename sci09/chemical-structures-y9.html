<style>
:root{--acc:#6A1B9A;--dark:#4A148C;--cream:#F3E5F5;--ink:#2a1a2e;--line:#CE93D8;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--acc);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--acc);color:var(--acc);}
.qb.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--acc);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--acc);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--acc);background:#fff;color:var(--acc);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--acc);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--acc);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.hl{font-size:14px;color:var(--ink);margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.nq{margin-top:12px;font-size:13px;font-weight:600;padding:6px 14px;border-radius:3px;border:1px solid #aaa;background:#f5f5f5;color:#444;cursor:pointer;}
.nq:hover{background:#e0e0e0;}
.wk-ans{margin-top:8px;font-size:14px;line-height:1.6;}
.wk summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.mc-opt{padding:9px 14px;border:1.5px solid var(--line);border-radius:4px;cursor:pointer;font-size:14px;background:#fff;text-align:left;transition:.15s;font-family:inherit;}
.mc-opt:hover{border-color:var(--acc);background:var(--cream);}
.mc-opt.correct{border-color:#2e7d32;background:#e8f8ee;color:#1a7a3a;font-weight:600;}
.mc-opt.wrong{border-color:#C0272D;background:#fde8e8;color:#a01820;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(a){return a[Math.floor(Math.random()*a.length)];}
function tryIt(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTry(id,fn());
}
function genTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="ar"><input type="number" step="any" placeholder="Your answer" id="'+id+'_i"/>'+
    '<button class="ck" onclick="ck(\''+id+'\')">&#10003; Check</button></div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show working</summary><div class="wk-b">'+
    (h?'<ul class="hl">'+h+'</ul>':'')+
    '<div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'">New question</button></div>';
}
function ck(id){
  var fn=ST[id];var o=typeof fn==='function'?fn():fn;
  var v=parseFloat(document.getElementById(id+'_i').value);
  var f=document.getElementById(id+'_f');
  if(isNaN(v)){f.className='fb er';f.textContent='Please enter a number.';return;}
  var tol=o.tol!==undefined?o.tol:0.5;
  if(Math.abs(v-o.ans)<=tol){
    f.className='fb ok';f.textContent='\u2713 Correct! Answer: '+o.ans+(o.unit?' '+o.unit:'');
  }else{f.className='fb er';f.textContent='Not quite \u2014 check your working and try again.';}
}
function tryItMC(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTryMC(id,fn());
}
function genTryMC(id,o){
  var order=o.options.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=order[i];order[i]=order[j];order[j]=tmp;
  }
  var newCorrect=order.indexOf(o.correct);
  var opts=order.map(function(origIdx,shownIdx){
    return '<button class="mc-opt" onclick="ckMC(\''+id+'\','+shownIdx+','+newCorrect+')">'+o.options[origIdx]+'</button>';
  }).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="mc-opts" id="'+id+'_opts">'+opts+'</div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show answer</summary><div class="wk-b"><div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'_mc">New question</button></div>';
}
function ckMC(id,chosen,correct){
  var opts=document.getElementById(id+'_opts').querySelectorAll('.mc-opt');
  opts.forEach(function(b,i){
    if(i===correct)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
    b.disabled=true;
  });
  var f=document.getElementById(id+'_f');
  if(chosen===correct){f.className='fb ok';f.textContent='\u2713 Correct!';}
  else{f.className='fb er';f.textContent='Not quite \u2014 the correct answer is highlighted in green.';}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.nq');if(!b)return;
  var rawId=b.getAttribute('data-tryid');
  var id=rawId.replace('_mc','');
  var fn=ST[id];if(typeof fn!=='function')return;
  var wrap=b.closest('.try');if(!wrap)return;
  var isMC=(rawId.indexOf('_mc')>=0);
  var fresh=isMC?genTryMC(id,fn()):genTry(id,fn());
  var tmp=document.createElement('div');tmp.innerHTML=fresh;
  wrap.parentNode.replaceChild(tmp.firstChild,wrap);
});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#333';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function R(x,y,w,h,fill,stroke,sw,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'" rx="'+(rx||0)+'"/>';}
function circ(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function ellipse(cx,cy,rx,ry,fill,stroke,sw){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function arr(x1,y1,x2,y2,c,w){
  c=c||'#555';w=w||1.5;
  var ang=Math.atan2(y2-y1,x2-x1);
  var hs=8;
  var p1x=x2-hs*Math.cos(ang-0.4),p1y=y2-hs*Math.sin(ang-0.4);
  var p2x=x2-hs*Math.cos(ang+0.4),p2y=y2-hs*Math.sin(ang+0.4);
  return L(x1,y1,x2,y2,c,w)+'<polygon points="'+x2+','+y2+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1)+'" fill="'+c+'"/>';
}

{ey:'Y9 Chemistry \u2022 Q1',ti:'States of Matter and Particle Model',su:'Linking structure to state',steps:[

draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

s.innerHTML=o.join('');}},
{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'A substance has a very high melting point and conducts electricity only when molten. What structure does it most likely have?',options:['Ionic','Simple molecular','Metallic','Giant covalent (diamond-type)'],correct:0,working:'High m.p. plus conducts <b>only when molten</b> (not as a solid) is the classic signature of an <b>ionic</b> compound \u2014 ions are fixed in the solid lattice but free to move when molten.'},{question:'A substance has a very low melting point and does not conduct electricity in any state. What structure does it have?',options:['Simple molecular','Ionic','Metallic','Giant covalent'],correct:0,working:'Low melting point and never conducting indicates <b>simple molecular</b> structure \u2014 weak forces between molecules (low m.p.) and no free ions or delocalised electrons (no conduction).'},{question:'A substance conducts electricity as a solid and is malleable. What type of structure is this?',options:['Metallic','Ionic','Simple molecular','Giant covalent'],correct:0,working:'Conducting <b>as a solid</b> plus malleability is characteristic of <b>metallic</b> bonding \u2014 delocalised electrons allow conduction without melting, and layers of ions can slide without breaking bonds.'},{question:'A substance has a low melting point and does not conduct electricity in any state. What is it likely to be?',options:['A simple molecular substance','An ionic compound','A metal','A giant covalent structure'],correct:0,working:'Low melting point plus no conduction in any state is characteristic of a <b>simple molecular</b> substance, since it only has weak forces between molecules and no free charged particles.'},{question:'A substance conducts electricity as a solid. What structure type does it most likely have?',options:['Metallic','Simple molecular','Ionic (as a solid)','None of these'],correct:0,working:'Conducting electricity <b>as a solid</b> is a strong clue for <b>metallic</b> bonding, since {sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What happens to particles when a solid melts into a liquid?',options:['Particles gain energy and move around more freely, though they stay close together','Particles lose energy and stop moving completely','Particles disappear entirely','Particles change into a completely different substance'],correct:0,working:'When a solid <b>melts</b>, particles gain enough energy to break free from their fixed positions and move around each other, while still staying close together — becoming a liquid.'},{question:'What happens to particles when a liquid boils into a gas?',options:['Particles gain enough energy to break free from each other and spread far apart','Particles move closer together','Particles stop moving','Particles turn into a solid'],correct:0,working:'When a liquid <b>boils</b>, particles gain enough energy to overcome the forces holding them together and spread far apart, moving freely and quickly as a gas.'},{question:'What is the term for a gas turning directly back into a liquid?',options:['Condensing','Melting','Subliming','Freezing'],correct:0,working:'<b>Condensing</b> is when a gas cools and turns back into a liquid, as particles lose energy and move closer together.'},{question:'What is the term for a liquid turning into a solid?',options:['Freezing','Melting','Evaporating','Condensing'],correct:0,working:'<b>Freezing</b> is when a liquid cools enough that particles lose energy and lock into fixed positions, forming a solid.'},{question:'What is sublimation?',options:['A solid turning directly into a gas, without becoming a liquid first','A liquid turning into a gas','A gas turning into a solid without becoming liquid','A solid melting into a liquid'],correct:0,working:'<b>Sublimation</b> is the direct change from solid to gas (or gas to solid) without passing through the liquid state — solid carbon dioxide (dry ice) is a common example.'},{question:'What is the difference between evaporation and boiling?',options:['Evaporation happens slowly from the surface of a liquid at any temperature; boiling happens throughout the liquid at a specific temperature','Evaporation only happens at the boiling point; boiling happens at any temperature','There is no difference between them','Boiling only happens on the surface of a liquid'],correct:0,working:'<b>Evaporation</b> occurs at the surface of a liquid at any temperature, while <b>boiling</b> occurs throughout the whole liquid, but only at its specific boiling point.'},{question:'Why does a puddle of water disappear on a warm, sunny day, even though the temperature isn\'t 100°C?',options:['The water is evaporating from the surface, which can happen at temperatures below the boiling point','The water is boiling at 100°C','The water is freezing','The water is subliming into ice'],correct:0,working:'Water can <b>evaporate</b> from its surface at temperatures well below 100°C, especially in warm, sunny, or windy conditions, gradually turning into water vapour.'},{question:'During a change of state (e.g. melting), does the temperature of the substance change while it is changing state?',options:['No — temperature stays the same during the change of state, even though energy is still being transferred','Yes — temperature always changes continuously through a change of state','Temperature only changes for gases, not solids or liquids','Changes of state never involve any energy transfer'],correct:0,working:'During a change of state, the temperature stays <b>constant</b> even though energy continues to be transferred — the energy is used to overcome forces between particles, not to raise temperature.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

 not break down easily in the environment, building up as long-lasting waste and pollution','Plastic always breaks down within a few days','Plastic packaging cannot be recycled at all','Plastic has no environmental impact whatsoever'],correct:0,working:'Many plastics are <b>not biodegradable</b> and can persist in the environment for decades or longer, contributing to pollution on land and in oceans if not properly disposed of or recycled.'},{question:'Why might a company choose to use recycled materials instead of new (virgin) materials?',options:['It reduces the need to extract new raw materials and can lower environmental impact and cost','Recycled materials are always weaker and more expensive','Recycling always uses more energy than making new materials','There is no benefit to using recycled materials'],correct:0,working:'Using <b>recycled materials</b> reduces demand for newly extracted raw materials, which can lower environmental impact and often reduces production costs too.'},{question:'Why are metal cans commonly used for canned food, rather than glass or plastic?',options:['Metal is strong, doesn\'t shatter like glass, and can be sealed to preserve food for a long time','Metal is transparent, letting you see the food inside','Metal is lighter than plastic','Metal reacts easily with the food inside, adding flavour'],correct:0,working:'<b>Metal cans</b> are strong (won\'t shatter like glass), can form an airtight seal to preserve food for a long time, and are relatively lightweight and stackable for transport and storage.'},{question:'When choosing a material for a specific job, what are some key properties to consider?',options:['Strength, weight, cost, how it reacts with its surroundings, and its environmental impact','Only the colour of the material matters','Only the price matters, regardless of performance','Materials never need to be matched to a specific job'],correct:0,working:'Choosing the right material means balancing several factors: <b>strength</b>, <b>weight</b>, <b>cost</b>, how it reacts with its environment (e.g. rusting, melting), and its <b>environmental impact</b>.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

ing added to water eventually spread throughout the whole glass, even without stirring?',options:['The colouring particles diffuse through the water, moving from where they are concentrated to where they are less concentrated','The water pushes all the colouring to one side','Food colouring particles stop moving once added to water','Diffusion only occurs in gases, not liquids'],correct:0,working:'Food colouring particles gradually <b>diffuse</b> through the water, spreading from the concentrated drop outwards until they are evenly distributed — even without stirring.'},{question:'If you release a gas at one end of a room, would you expect it to reach the other end of the room eventually?',options:['Yes — diffusion will cause it to spread out until it fills the available space','No — gases never move once released','Only if the room is heated to a very high temperature','Only if someone physically carries the gas across the room'],correct:0,working:'Due to <b>diffusion</b>, gas particles will randomly spread out over time until they are evenly distributed throughout the available space, even without any air currents.'},{question:'Why does diffusion happen, in terms of particle movement?',options:['Particles are in constant random motion, and this movement naturally spreads them from crowded areas to less crowded areas','Particles are pushed by an external force during diffusion','Particles only move if heated to boiling point','Diffusion requires particles to be perfectly still'],correct:0,working:'Diffusion occurs because particles are always in <b>constant, random motion</b>. Over time, this random movement naturally spreads particles out from areas of high concentration to areas of low concentration.'},{question:'Why might diffusion be slower in a cold room compared to a warm room?',options:['Particles have less energy in the cold, so they move more slowly and diffuse more slowly','Cold particles move faster than warm particles','Temperature has no effect on particle movement','Diffusion cannot happen at all in cold conditions'],correct:0,working:'In a colder room, particles have <b>less energy</b> and move more slowly, so diffusion — which depends on particle movement — happens more slowly than in a warmer room.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

var qi=0,si=0;
function buildSidebar(){
  var sb=document.getElementById('sb');
  sb.innerHTML='<div class="sb-lbl">Topics</div>';
  QS.forEach(function(q,i){
    var b=document.createElement('button');
    b.className='qb'+(i===qi?' on':'');
    b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;
    b.onclick=function(){qi=i;si=0;render();};
    sb.appendChild(b);
  });
}
function render(){
  var q=QS[qi],st=q.steps[si];
  document.getElementById('ey').textContent=q.ey;
  document.getElementById('ti').textContent=q.ti;
  document.getElementById('su').textContent=q.su;
  document.getElementById('pn').className='pnl fi';
  document.getElementById('pn').innerHTML='<div class="sl">'+st.sl+'</div><div>'+st.p+'</div>';
  st.draw();
  var dt=document.getElementById('dt');
  dt.innerHTML=q.steps.map(function(_,i){return '<div class="dot'+(i===si?' on':i<si?' dn':'')+'"></div>';}).join('');
  document.getElementById('pb').disabled=(qi===0&&si===0);
  var last=(qi===QS.length-1&&si===q.steps.length-1);
  document.getElementById('nb').textContent=last?'Finished \u2713':'Next \u2192';
  document.getElementById('nb').disabled=false;
  document.querySelectorAll('.qb').forEach(function(b,i){b.classList.toggle('on',i===qi);});
}
document.getElementById('nb').onclick=function(){
  var q=QS[qi];
  if(si<q.steps.length-1){si++;}
  else if(qi<QS.length-1){qi++;si=0;}
  render();
};
document.getElementById('pb').onclick=function(){
  if(si>0){si--;}
  else if(qi>0){qi--;si=QS[qi].steps.length-1;}
  render();
};
buildSidebar();render();
