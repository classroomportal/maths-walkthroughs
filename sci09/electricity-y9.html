<style>
:root{--acc:#1565C0;--dark:#0D47A1;--cream:#E3F2FD;--ink:#0d1a2e;--line:#90CAF9;--gold:#C8922A;}

.btn.p{background:var(--acc);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}

.fi{animation:fi .4s ease;}

.ar{display:flex;gap:8px;margin-top:6px;}

.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}

.nq:hover{background:#e0e0e0;}
.wk-ans{margin-top:8px;font-size:14px;line-height:1.6;}
.wk summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin-top:10px;}

.mc-opt.wrong{border-color:#C0272D;background:#fde8e8;color:#a01820;}

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(a){return a[Math.floor(Math.random()*a.length)];}
function tryIt(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTry(id,fn());
}
function genTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="ar"><input type="number" step="any" placeholder="Your answer" id="'+id+'_i"/>'+
    '<button class="ck" onclick="ck(\''+id+'\')">&#10003; Check</button></div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show working</summary><div class="wk-b">'+
    (h?'<ul class="hl">'+h+'</ul>':'')+
    '<div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'">New question</button></div>';
}
function ck(id){
  var fn=ST[id];var o=typeof fn==='function'?fn():fn;
  var v=parseFloat(document.getElementById(id+'_i').value);
  var f=document.getElementById(id+'_f');
  if(isNaN(v)){f.className='fb er';f.textContent='Please enter a number.';return;}
  var tol=o.tol!==undefined?o.tol:0.5;
  if(Math.abs(v-o.ans)<=tol){
    f.className='fb ok';f.textContent='\u2713 Correct! Answer: '+o.ans+(o.unit?' '+o.unit:'');
  }else{f.className='fb er';f.textContent='Not quite \u2014 check your working and try again.';}
}
function tryItMC(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTryMC(id,fn());
}
function genTryMC(id,o){
  var order=o.options.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=order[i];order[i]=order[j];order[j]=tmp;
  }
  var newCorrect=order.indexOf(o.correct);
  var opts=order.map(function(origIdx,shownIdx){
    return '<button class="mc-opt" onclick="ckMC(\''+id+'\','+shownIdx+','+newCorrect+')">'+o.options[origIdx]+'</button>';
  }).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="mc-opts" id="'+id+'_opts">'+opts+'</div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show answer</summary><div class="wk-b"><div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'_mc">New question</button></div>';
}
function ckMC(id,chosen,correct){
  var opts=document.getElementById(id+'_opts').querySelectorAll('.mc-opt');
  opts.forEach(function(b,i){
    if(i===correct)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
    b.disabled=true;
  });
  var f=document.getElementById(id+'_f');
  if(chosen===correct){f.className='fb ok';f.textContent='\u2713 Correct!';}
  else{f.className='fb er';f.textContent='Not quite \u2014 the correct answer is highlighted in green.';}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.nq');if(!b)return;
  var rawId=b.getAttribute('data-tryid');
  var id=rawId.replace('_mc','');
  var fn=ST[id];if(typeof fn!=='function')return;
  var wrap=b.closest('.try');if(!wrap)return;
  var isMC=(rawId.indexOf('_mc')>=0);
  var fresh=isMC?genTryMC(id,fn()):genTry(id,fn());
  var tmp=document.createElement('div');tmp.innerHTML=fresh;
  wrap.parentNode.replaceChild(tmp.firstChild,wrap);
});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#333';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function R(x,y,w,h,fill,stroke,sw,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'" rx="'+(rx||0)+'"/>';}
function circ(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function ellipse(cx,cy,rx,ry,fill,stroke,sw){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function arr(x1,y1,x2,y2,c,w){
  c=c||'#555';w=w||1.5;
  var ang=Math.atan2(y2-y1,x2-x1);
  var hs=8;
  var p1x=x2-hs*Math.cos(ang-0.4),p1y=y2-hs*Math.sin(ang-0.4);
  var p2x=x2-hs*Math.cos(ang+0.4),p2y=y2-hs*Math.sin(ang+0.4);
  return L(x1,y1,x2,y2,c,w)+'<polygon points="'+x2+','+y2+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1)+'" fill="'+c+'"/>';
}

 lights in series?',options:['If one bulb fails, all the other lights on that circuit go out too','Series circuits use significantly more electricity','Series circuits are more expensive to wire','There are no disadvantages to series wiring for household lights'],correct:0,working:'A major disadvantage of <b>series</b> wiring is that a single broken or removed bulb stops current flowing anywhere in that circuit, turning off all the lights.'},{question:'If you add more bulbs to a series circuit (same battery), what typically happens to each bulb\'s brightness?',options:['Each bulb becomes dimmer, since the shared voltage is now split more ways','Each bulb becomes brighter','Brightness stays exactly the same no matter how many bulbs are added','Only the last bulb changes brightness'],correct:0,working:'Since the battery\'s fixed voltage must be <b>shared</b> between more components, adding more bulbs in series usually makes each bulb <b>dimmer</b>.'},{question:'How many paths for current to flow are there in a series circuit?',options:['Only one path (a single loop)','Multiple separate paths','No paths at all','It depends on the number of batteries used'],correct:0,working:'A <b>series</b> circuit has just <b>one single loop</b>, so there is only one path available for current to flow through all the components.'},{question:'A student wants to build a circuit where a switch can turn off just one bulb without affecting a second bulb. Should they use series or parallel wiring?',options:['Parallel — the bulbs are on separate branches, so one switch/bulb doesn\'t affect the other','Series — both bulbs would be affected either way','It\'s impossible to control just one bulb independently','Only ammeters can achieve this, not switches'],correct:0,working:'In a <b>parallel</b> circuit, each bulb is on its own branch, so a switch on one branch can turn that bulb off without affecting the other bulb on a separate branch.'}];return rPick(qs);}),draw:function(){var s=g();s.setAt nce (light, socket, etc.) be controlled <b>independently</b>, and if one device fails, the rest of the house still has power.'},{question:'Why might bulbs on separate parallel branches appear equally bright, even though other branches exist?',options:['Since the voltage across each branch is the same as the battery\'s voltage, each bulb gets the full voltage regardless of other branches','All bulbs on all branches must share the total voltage equally','Only the first branch gets any voltage at all','Brightness is unrelated to voltage'],correct:0,working:'Because each parallel branch has the <b>same voltage</b> as the battery, identical bulbs on different branches will typically shine with the same brightness, regardless of how many other branches exist.'},{question:'What is a key advantage of parallel circuits over series circuits in a household?',options:['Appliances can be used independently, so one switching off or failing doesn\'t stop the others working','Parallel circuits are always cheaper to install','Parallel circuits never need a fuse or switch','Parallel circuits only work with one appliance at a time'],correct:0,working:'The key advantage of <b>parallel</b> wiring is that each appliance operates <b>independently</b> — you can turn off one light without turning off every other light or appliance in the house.'},{question:'How many separate paths does current have to choose from in a parallel circuit with three branches?',options:['Three separate paths','Only one path','No paths at all','Exactly two paths, regardless of the number of branches'],correct:0,working:'A parallel circuit with <b>three branches</b> gives current <b>three separate paths</b> to flow along between the same two points.'},{question:'A student wants two lamps to work completely independently, so either one can be on while the other is off. Which circuit type should they use?',options:['Parallel','Series','Neither type allows independent control','Only series circuits allow switches'],c lators','Only gold is a conductor among metals','Metals only conduct electricity when cold'],correct:0,working:'<b>Metals</b>, as a group, are generally good conductors of electricity, due to having free electrons that can move and carry charge.'},{question:'Why are rubber gloves sometimes worn by electricians when working with electrical equipment?',options:['Rubber is an insulator, reducing the risk of electric shock','Rubber is a very good conductor, protecting the electrician','Rubber gloves have no protective purpose','Rubber makes tools work faster'],correct:0,working:'<b>Rubber</b> is a good insulator, so wearing rubber gloves helps protect an electrician from receiving an <b>electric shock</b> while working on electrical equipment.'},{question:'Is wood generally a conductor or an insulator?',options:['An insulator (in its normal, dry state)','A very good conductor','Neither a conductor nor an insulator','Only a conductor when painted'],correct:0,working:'Dry <b>wood</b> is generally a poor conductor and behaves as an <b>insulator</b>, which is one reason wooden-handled tools are considered safer to use around electricity.'},{question:'Why do plugs have a plastic casing rather than a metal one?',options:['Plastic is an insulator, protecting the user from touching live electrical parts','Plastic conducts electricity better than metal','Metal casings would make plugs work faster','There is no safety reason for this design choice'],correct:0,working:'A <b>plastic</b> casing insulates the user from the live electrical connections inside the plug, preventing accidental electric shocks.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

var qi=0,si=0;
function buildSidebar(){
  var sb=document.getElementById('sb');
  sb.innerHTML='<div class="sb-lbl">Topics</div>';
  QS.forEach(function(q,i){
    var b=document.createElement('button');
    b.className='qb'+(i===qi?' on':'');
    b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;
    b.onclick=function(){qi=i;si=0;render();};
    sb.appendChild(b);
  });
}
function render(){
  var q=QS[qi],st=q.steps[si];
  document.getElementById('ey').textContent=q.ey;
  document.getElementById('ti').textContent=q.ti;
  document.getElementById('su').textContent=q.su;
  document.getElementById('pn').className='pnl fi';
  document.getElementById('pn').innerHTML='<div class="sl">'+st.sl+'</div><div>'+st.p+'</div>';
  st.draw();
  var dt=document.getElementById('dt');
  dt.innerHTML=q.steps.map(function(_,i){return '<div class="dot'+(i===si?' on':i<si?' dn':'')+'"></div>';}).join('');
  document.getElementById('pb').disabled=(qi===0&&si===0);
  var last=(qi===QS.length-1&&si===q.steps.length-1);
  document.getElementById('nb').textContent=last?'Finished \u2713':'Next \u2192';
  document.getElementById('nb').disabled=false;
  document.querySelectorAll('.qb').forEach(function(b,i){b.classList.toggle('on',i===qi);});
}
document.getElementById('nb').onclick=function(){
  var q=QS[qi];
  if(si<q.steps.length-1){si++;}
  else if(qi<QS.length-1){qi++;si=0;}
  render();
};
document.getElementById('pb').onclick=function(){
  if(si>0){si--;}
  else if(qi>0){qi--;si=QS[qi].steps.length-1;}
  render();
};
buildSidebar();render();
