<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(a){return a[Math.floor(Math.random()*a.length)];}
function tryIt(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTry(id,fn());
}
function genTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="ar"><input type="number" step="any" placeholder="Your answer" id="'+id+'_i"/>'+
    '<button class="ck" onclick="ck(\''+id+'\')">&#10003; Check</button></div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show working</summary><div class="wk-b">'+
    (h?'<ul class="hl">'+h+'</ul>':'')+
    '<div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'">New question</button></div>';
}
function ck(id){
  var fn=ST[id];var o=typeof fn==='function'?fn():fn;
  var v=parseFloat(document.getElementById(id+'_i').value);
  var f=document.getElementById(id+'_f');
  if(isNaN(v)){f.className='fb er';f.textContent='Please enter a number.';return;}
  var tol=o.tol!==undefined?o.tol:0.5;
  if(Math.abs(v-o.ans)<=tol){
    f.className='fb ok';f.textContent='\u2713 Correct! Answer: '+o.ans+(o.unit?' '+o.unit:'');
  }else{f.className='fb er';f.textContent='Not quite \u2014 check your working and try again.';}
}
function tryItMC(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTryMC(id,fn());
}
function genTryMC(id,o){
  var order=o.options.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=order[i];order[i]=order[j];order[j]=tmp;
  }
  var newCorrect=order.indexOf(o.correct);
  var opts=order.map(function(origIdx,shownIdx){
    return '<button class="mc-opt" onclick="ckMC(\''+id+'\','+shownIdx+','+newCorrect+')">'+o.options[origIdx]+'</button>';
  }).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="mc-opts" id="'+id+'_opts">'+opts+'</div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show answer</summary><div class="wk-b"><div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'_mc">New question</button></div>';
}
function ckMC(id,chosen,correct){
  var opts=document.getElementById(id+'_opts').querySelectorAll('.mc-opt');
  opts.forEach(function(b,i){
    if(i===correct)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
    b.disabled=true;
  });
  var f=document.getElementById(id+'_f');
  if(chosen===correct){f.className='fb ok';f.textContent='\u2713 Correct!';}
  else{f.className='fb er';f.textContent='Not quite \u2014 the correct answer is highlighted in green.';}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.nq');if(!b)return;
  var rawId=b.getAttribute('data-tryid');
  var id=rawId.replace('_mc','');
  var fn=ST[id];if(typeof fn!=='function')return;
  var wrap=b.closest('.try');if(!wrap)return;
  var isMC=(rawId.indexOf('_mc')>=0);
  var fresh=isMC?genTryMC(id,fn()):genTry(id,fn());
  var tmp=document.createElement('div');tmp.innerHTML=fresh;
  wrap.parentNode.replaceChild(tmp.firstChild,wrap);
});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#333';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function R(x,y,w,h,fill,stroke,sw,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'" rx="'+(rx||0)+'"/>';}
function circ(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function ellipse(cx,cy,rx,ry,fill,stroke,sw){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function arr(x1,y1,x2,y2,c,w){
  c=c||'#555';w=w||1.5;
  var ang=Math.atan2(y2-y1,x2-x1);
  var hs=8;
  var p1x=x2-hs*Math.cos(ang-0.4),p1y=y2-hs*Math.sin(ang-0.4);
  var p2x=x2-hs*Math.cos(ang+0.4),p2y=y2-hs*Math.sin(ang+0.4);
  return L(x1,y1,x2,y2,c,w)+'<polygon points="'+x2+','+y2+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1)+'" fill="'+c+'"/>';
}

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What is the function of the eardrum?',options:['It vibrates when sound waves hit it, passing the vibration deeper into the ear','It produces sound waves for the ear to detect','It stores sound energy for later use','It filters out unwanted colours from sound'],correct:0,working:'The <b>eardrum</b> is a thin membrane that vibrates when sound waves reach it, passing these vibrations on to the tiny bones of the middle ear.'},{question:'What is the general pathway sound takes through the ear?',options:['Outer ear → eardrum → middle ear bones → cochlea (inner ear) → brain (via nerve signals)','Brain → cochlea → eardrum → outer ear','Cochlea → eardrum → brain → outer ear','Sound skips the eardrum and goes straight to the brain'],correct:0,working:'Sound travels: <b>outer ear</b> (collects sound) → <b>eardrum</b> (vibrates) → tiny <b>middle ear bones</b> (amplify vibration) → <b>cochlea</b> (converts vibration to nerve signals) → <b>brain</b> (interprets sound).'},{question:'What is the function of the cochlea?',options:['It converts sound vibrations into electrical nerve signals that the brain can interpret','It amplifies sound before it reaches the eardrum','It produces sound waves for the ear to detect','It has no real function in hearing'],correct:0,working:'The <b>cochlea</b>, in the inner ear, converts sound vibrations into <b>electrical signals</b> that travel along the auditory nerve to the brain, where they are interpreted as sound.'},{question:'Why can loud sounds potentially damage hearing over time?',options:['Very loud vibrations can damage the delicate structures in the cochlea or eardrum','Loud sounds only affect the outer ear, never causing lasting damage','Loud sounds always improve hearing sensitivity over time','Hearing damage is unrelated to sound exposure'],correct:0,working:'Exposure to very loud sounds can physically damage the sensitive structures of the <b>cochlea</b> or overstretch the <b>eardrum</b>, potentially causing permanent hearing loss.'},{question:'What is the general function of the outer ear (the visible part, sometimes called the pinna)?',options:['It collects and funnels sound waves toward the eardrum','It converts sound into electrical signals directly','It produces sound waves','It has no function related to hearing'],correct:0,working:'The <b>outer ear</b> (pinna) collects sound waves from the surrounding air and funnels them toward the eardrum, helping direct sound into the ear.'},{question:'Why might someone experience temporary hearing difficulty after attending a very loud concert?',options:['Temporary changes in the ear (like the eardrum or cochlea being overstimulated) can reduce hearing sensitivity for a while afterward','Loud concerts always cause permanent hearing loss instantly','Loud sounds have no effect on hearing sensitivity','This is unrelated to how the ear works'],correct:0,working:'Prolonged exposure to very loud sound can <b>temporarily affect</b> the ear\'s sensitive structures, causing a short-term reduction in hearing sensitivity, which sometimes recovers with rest, but repeated exposure risks permanent damage.'},{question:'Why do doctors sometimes check hearing using different frequencies rather than just one loud sound?',options:['Hearing sensitivity can vary across different frequencies, so testing multiple frequencies gives a fuller picture of someone\'s hearing ability','All frequencies are heard identically, making multiple tests pointless','Hearing tests only need to check volume, not frequency','Frequency has nothing to do with hearing ability'],correct:0,working:'Since hearing sensitivity can vary at different <b>frequencies</b> (some people lose high-frequency hearing before low, for example), testing across a range of frequencies gives a more complete picture of hearing health.'},{question:'Why might covering your ears with your hands reduce the loudness of a sound you hear?',options:['Your hands block some sound waves from reaching the ear canal and eardrum, reducing the sound energy that gets through','Covering your ears increases the amplitude of sound reaching your eardrum','Your hands amplify all sound frequencies equally','Covering your ears has no real effect on what you hear'],correct:0,working:'Covering your ears creates a partial physical barrier, <b>blocking some sound energy</b> from reaching the ear canal and eardrum, which reduces the perceived loudness.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What is ultrasound?',options:['Sound with a frequency too high for humans to hear','Sound that is extremely loud','Sound that travels only through a vacuum','A type of visible light wave'],correct:0,working:'<b>Ultrasound</b> is sound with a frequency <b>above</b> the range of human hearing (above about 20,000 Hz).'},{question:'How is ultrasound used in medicine, such as during pregnancy scans?',options:['Ultrasound waves reflect off internal structures, and these reflections are used to build up an image','Ultrasound directly photographs the inside of the body using light','Ultrasound is only used to measure body temperature','Ultrasound cannot be used safely on humans'],correct:0,working:'In medical <b>ultrasound scans</b>, high-frequency sound waves are sent into the body; they reflect off internal structures (like a baby in the womb), and these reflections are used to build up an image.'},{question:'How do bats use sound to navigate and hunt in the dark (echolocation)?',options:['They emit high-frequency sound and listen for the echoes bouncing back off objects and prey','Bats use only their eyesight, not sound, at night','Bats use radio waves instead of sound','Bats cannot navigate in the dark at all'],correct:0,working:'Bats use <b>echolocation</b> — emitting high-frequency sound and listening to the returning echoes to work out the location, distance and size of objects and prey around them, even in complete darkness.'},{question:'How is sonar used by ships to detect objects underwater?',options:['Sound pulses are sent into the water, and the time taken for echoes to return helps calculate the depth or distance to underwater objects','Sonar uses light to see through water','Sonar can only detect objects on the surface of the water','Sonar has no practical use for ships'],correct:0,working:'<b>Sonar</b> sends sound pulses through water; measuring the time for <b>echoes</b> to bounce back off the seabed or objects (like fish or submarines) helps calculate distance or depth.'},{question:'Why is ultrasound sometimes preferred over X-rays for imaging during pregnancy?',options:['Ultrasound does not use ionising radiation, making it considered safer for repeated use during pregnancy','Ultrasound produces clearer images than any other method in every situation','X-rays are always safer than ultrasound for pregnant patients','Ultrasound cannot be used to look at soft tissue at all'],correct:0,working:'Unlike X-rays, <b>ultrasound</b> does not use ionising radiation, making it a safer choice for imaging during pregnancy, where repeated scans may be needed.'},{question:'How might ultrasound be used industrially to check for cracks inside metal objects?',options:['Ultrasound waves reflect differently off a crack than off solid metal, revealing internal flaws without needing to cut the object open','Ultrasound can only be used on living tissue, not metal','Ultrasound cannot detect anything inside solid materials','Cracks in metal have no effect on ultrasound waves'],correct:0,working:'When ultrasound waves meet an internal <b>crack or flaw</b> in metal, they reflect differently than from solid material, letting engineers detect hidden defects without needing to cut the object open.'},{question:'Why can\'t dogs use ultrasound the way bats do for echolocation, even though dogs can hear higher frequencies than humans?',options:['Dogs\' hearing range, while wider than humans\', still doesn\'t extend as high as the frequencies bats use for echolocation, and dogs haven\'t evolved this specific ability','Dogs can already echolocate exactly like bats','Ultrasound cannot exist in nature at all','Echolocation has nothing to do with frequency range'],correct:0,working:'While dogs can hear <b>higher frequencies than humans</b>, they haven\'t evolved the specialised echolocation systems that bats use, which rely on emitting and precisely interpreting very high-frequency ultrasound.'},{question:'Why might vets sometimes use ultrasound scans on pregnant animals, similar to human pregnancy scans?',options:['Ultrasound safely images internal structures like a developing foetus without needing invasive surgery','Ultrasound can only be used on humans, never on animals','Ultrasound scans always require surgery first','Ultrasound has no medical application for animals'],correct:0,working:'Just as with humans, <b>ultrasound</b> can safely image internal structures such as a developing foetus in animals, without needing invasive procedures, making it a useful veterinary tool.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

var qi=0,si=0;
function buildSidebar(){
  var sb=document.getElementById('sb');
  sb.innerHTML='<div class="sb-lbl">Topics</div>';
  QS.forEach(function(q,i){
    var b=document.createElement('button');
    b.className='qb'+(i===qi?' on':'');
    b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;
    b.onclick=function(){qi=i;si=0;render();};
    sb.appendChild(b);
  });
}
function render(){
  var q=QS[qi],st=q.steps[si];
  document.getElementById('ey').textContent=q.ey;
  document.getElementById('ti').textContent=q.ti;
  document.getElementById('su').textContent=q.su;
  document.getElementById('pn').className='pnl fi';
  document.getElementById('pn').innerHTML='<div class="sl">'+st.sl+'</div><div>'+st.p+'</div>';
  st.draw();
  var dt=document.getElementById('dt');
  dt.innerHTML=q.steps.map(function(_,i){return '<div class="dot'+(i===si?' on':i<si?' dn':'')+'"></div>';}).join('');
  document.getElementById('pb').disabled=(qi===0&&si===0);
  var last=(qi===QS.length-1&&si===q.steps.length-1);
  document.getElementById('nb').textContent=last?'Finished \u2713':'Next \u2192';
  document.getElementById('nb').disabled=false;
  document.querySelectorAll('.qb').forEach(function(b,i){b.classList.toggle('on',i===qi);});
}
document.getElementById('nb').onclick=function(){
  var q=QS[qi];
  if(si<q.steps.length-1){si++;}
  else if(qi<QS.length-1){qi++;si=0;}
  render();
};
document.getElementById('pb').onclick=function(){
  if(si>0){si--;}
  else if(qi>0){qi--;si=QS[qi].steps.length-1;}
  render();
};
buildSidebar();render();
