<style>
:root{--acc:#6A1B9A;--dark:#4A148C;--cream:#F3E5F5;--ink:#2a1a2e;--line:#CE93D8;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--acc);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}

.qb:hover{border-color:var(--acc);color:var(--acc);}
.qb.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--acc);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}

.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}

.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--acc);background:#fff;color:var(--acc);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--acc);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--acc);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.hl{font-size:14px;color:var(--ink);margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.nq{margin-top:12px;font-size:13px;font-weight:600;padding:6px 14px;border-radius:3px;border:1px solid #aaa;background:#f5f5f5;color:#444;cursor:pointer;}
.nq:hover{background:#e0e0e0;}
.wk-ans{margin-top:8px;font-size:14px;line-height:1.6;}
.wk summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.mc-opt{padding:9px 14px;border:1.5px solid var(--line);border-radius:4px;cursor:pointer;font-size:14px;background:#fff;text-align:left;transition:.15s;font-family:inherit;}
.mc-opt:hover{border-color:var(--acc);background:var(--cream);}
.mc-opt.correct{border-color:#2e7d32;background:#e8f8ee;color:#1a7a3a;font-weight:600;}
.mc-opt.wrong{border-color:#C0272D;background:#fde8e8;color:#a01820;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(a){return a[Math.floor(Math.random()*a.length)];}
function tryIt(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTry(id,fn());
}
function genTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="ar"><input type="number" step="any" placeholder="Your answer" id="'+id+'_i"/>'+
    '<button class="ck" onclick="ck(\''+id+'\')">&#10003; Check</button></div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show working</summary><div class="wk-b">'+
    (h?'<ul class="hl">'+h+'</ul>':'')+
    '<div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'">New question</button></div>';
}
function ck(id){
  var fn=ST[id];var o=typeof fn==='function'?fn():fn;
  var v=parseFloat(document.getElementById(id+'_i').value);
  var f=document.getElementById(id+'_f');
  if(isNaN(v)){f.className='fb er';f.textContent='Please enter a number.';return;}
  var tol=o.tol!==undefined?o.tol:0.5;
  if(Math.abs(v-o.ans)<=tol){
    f.className='fb ok';f.textContent='\u2713 Correct! Answer: '+o.ans+(o.unit?' '+o.unit:'');
  }else{f.className='fb er';f.textContent='Not quite \u2014 check your working and try again.';}
}
function tryItMC(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTryMC(id,fn());
}
function genTryMC(id,o){
  var order=o.options.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=order[i];order[i]=order[j];order[j]=tmp;
  }
  var newCorrect=order.indexOf(o.correct);
  var opts=order.map(function(origIdx,shownIdx){
    return '<button class="mc-opt" onclick="ckMC(\''+id+'\','+shownIdx+','+newCorrect+')">'+o.options[origIdx]+'</button>';
  }).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="mc-opts" id="'+id+'_opts">'+opts+'</div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show answer</summary><div class="wk-b"><div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'_mc">New question</button></div>';
}
function ckMC(id,chosen,correct){
  var opts=document.getElementById(id+'_opts').querySelectorAll('.mc-opt');
  opts.forEach(function(b,i){
    if(i===correct)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
    b.disabled=true;
  });
  var f=document.getElementById(id+'_f');
  if(chosen===correct){f.className='fb ok';f.textContent='\u2713 Correct!';}
  else{f.className='fb er';f.textContent='Not quite \u2014 the correct answer is highlighted in green.';}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.nq');if(!b)return;
  var rawId=b.getAttribute('data-tryid');
  var id=rawId.replace('_mc','');
  var fn=ST[id];if(typeof fn!=='function')return;
  var wrap=b.closest('.try');if(!wrap)return;
  var isMC=(rawId.indexOf('_mc')>=0);
  var fresh=isMC?genTryMC(id,fn()):genTry(id,fn());
  var tmp=document.createElement('div');tmp.innerHTML=fresh;
  wrap.parentNode.replaceChild(tmp.firstChild,wrap);
});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#333';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function R(x,y,w,h,fill,stroke,sw,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'" rx="'+(rx||0)+'"/>';}
function circ(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function ellipse(cx,cy,rx,ry,fill,stroke,sw){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function arr(x1,y1,x2,y2,c,w){
  c=c||'#555';w=w||1.5;
  var ang=Math.atan2(y2-y1,x2-x1);
  var hs=8;
  var p1x=x2-hs*Math.cos(ang-0.4),p1y=y2-hs*Math.sin(ang-0.4);
  var p2x=x2-hs*Math.cos(ang+0.4),p2y=y2-hs*Math.sin(ang+0.4);
  return L(x1,y1,x2,y2,c,w)+'<polygon points="'+x2+','+y2+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1)+'" fill="'+c+'"/>';
}

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'Balance: __Na + __Cl\u2082 \u2192 __NaCl',options:['2Na + Cl\u2082 \u2192 2NaCl','Na + Cl\u2082 \u2192 NaCl','2Na + 2Cl\u2082 \u2192 2NaCl','Na + 2Cl\u2082 \u2192 2NaCl'],correct:0,working:'<b>2Na + Cl\u2082 \u2192 2NaCl</b>. Cl\u2082 provides 2 chlorine atoms, so you need 2 sodium atoms to react with them, producing 2 NaCl units.'},{question:'When 10g of magnesium burns completely in oxygen, the magnesium oxide produced weighs MORE than 10g. Why does this NOT violate conservation of mass?',options:['Oxygen from the air has been added to the reaction and is now part of the product','Mass has been created in the reaction','The scales are inaccurate','Magnesium gains mass when heated'],correct:0,working:'Conservation of mass applies to the <b>total</b> mass of all reactants and products. The oxygen that combined with magnesium <b>came from the air</b> \u2014 it was a reactant, so the total mass (Mg + O\u2082) does equal the mass of MgO produced.'},{question:'In the unbalanced equation H\u2082 + O\u2082 \u2192 H\u2082O, how many H\u2082 molecules are needed to balance with one O\u2082 molecule?',options:['2H\u2082 (giving 2H\u2082O)','1H\u2082','3H\u2082','4H\u2082'],correct:0,working:'<b>2H\u2082 + O\u2082 \u2192 2H\u2082O</b>. One O\u2082 molecule provides 2 oxygen atoms, requiring 2 water molecules to be formed, which need 4 hydrogen atoms = 2 H\u2082 molecules.'},{question:'Why must a chemical equation be balanced?',options:['To satisfy the law of conservation of mass — the same number of each type of atom must appear on both sides','Balancing is just a stylistic convention with no scientific meaning','Only some equations need to be balanced, depending on the reaction','Balancing changes the products formed in the reaction'],correct:0,working:'Atoms are neither created nor destroyed in a chemical reaction (<b>conservation of mass</b>), so a balanced equation must have the same number of each type of atom on both sides.'},{question:'Balance: __Mg + __O₂ → __MgO',options:['2Mg + O₂ → 2MgO','Mg + O₂ → MgO','Mg + 2O₂ → MgO','2Mg + 2O₂ → 2MgO'],correct:0,working:'To balance oxygen atoms (2 on the left from O₂), you need <b>2MgO</b> on the right, which then requires <b>2Mg</b> on the left — giving 2Mg + O₂ → 2MgO.'},{question:'Balance: __H₂ + __N₂ → __NH₃',options:['3H₂ + N₂ → 2NH₃','H₂ + N₂ → NH₃','2H₂ + N₂ → 2NH₃','3H₂ + N₂ → NH₃'],correct:0,working:'Balancing N (2 needed) requires 2NH₃, which needs 6 H atoms — provided by <b>3H₂</b>. This gives 3H₂ + N₂ → 2NH₃, the Haber process equation.'},{question:'What does a state symbol like (aq) mean in a chemical equation?',options:['The substance is dissolved in water (aqueous)','The substance is a solid','The substance is a gas','The substance is a pure liquid'],correct:0,working:'The state symbol <b>(aq)</b> means \'aqueous\' — the substance is dissolved in water. Other symbols are (s) solid, (l) liquid, and (g) gas.'},{question:'In the equation CaCO₃ → CaO + CO₂, what type of reaction is this?',options:['Thermal decomposition — a single compound breaks down into two or more products on heating','Combustion — a substance reacts with oxygen','Neutralisation — an acid reacts with a base','Displacement — one element replaces another'],correct:0,working:'This is <b>thermal decomposition</b>: calcium carbonate breaks down into calcium oxide and carbon dioxide when heated, characteristic of carbonates.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Proving mass is conserved with a sealed container',p:'To show that mass really is conserved (even when a gas is produced), the reaction must happen in a <b>sealed container</b> so nothing can escape or enter — then the total mass before and after will be equal.',

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'In the reaction Mg + O2 -> MgO, if 24g of magnesium reacts completely with 16g of oxygen, what is the mass of magnesium oxide produced?',options:['40g','24g','16g','8g'],correct:0,working:'By <b>conservation of mass</b>, the total mass of products equals the total mass of reactants: 24g + 16g = <b>40g</b> of magnesium oxide.'},{question:'If 10g of a reactant A combines completely with 15g of reactant B, what is the total mass of the products formed?',options:['25g','10g','15g','5g'],correct:0,working:'Mass is conserved: the total mass of products always equals the total mass of reactants, so 10g + 15g = <b>25g</b>.'},{question:'A reaction produces 50g of product from two reactants. If one reactant weighed 30g, how much did the other reactant weigh?',options:['20g','30g','50g','80g'],correct:0,working:'Since mass is conserved, the two reactant masses must add up to the product mass: 50g − 30g = <b>20g</b>.'},{question:'Why does the reading on a scale appear to increase when a piece of magnesium burns in an open dish in air?',options:['The magnesium combines with oxygen from the air, and that extra oxygen mass is now part of the solid product','Mass is not actually conserved in this reaction','The magnesium loses mass during burning','Burning removes mass from the surroundings'],correct:0,working:'When magnesium burns, it combines with <b>oxygen from the air</b>. That oxygen becomes part of the solid magnesium oxide product, so the total solid mass appears to increase — mass is still conserved overall, including the gas.'},{question:'Why does the mass appear to decrease when marble chips (calcium carbonate) react with acid in an open flask?',options:['Carbon dioxide gas is produced and escapes into the air, taking mass with it out of the flask','Mass is genuinely destroyed in this reaction','The acid disappears completely','Calcium carbonate has no mass to begin with'],correct:0,working:'The reaction produces <b>carbon dioxide gas</b>, which escapes from the open flask into the air. The mass isn\'t destroyed — it has simply left the container, so the measured mass of what remains decreases.'},{question:'If you wanted to prove mass is conserved when a gas is produced, what would you need to do differently?',options:['Carry out the reaction in a sealed (closed) container so no gas can escape','Carry out the reaction in an open container so gas can escape easily','Only use solid reactants with no gases involved','Measure the mass before the reaction only, not after'],correct:0,working:'To show mass is truly conserved when gas is produced, the reaction must be done in a <b>sealed container</b> so the gas cannot escape and its mass is still included in the final measurement.'},{question:'In the equation 2Mg + O2 -> 2MgO, if 48g of magnesium reacts with 32g of oxygen, what mass of magnesium oxide is formed?',options:['80g','48g','32g','16g'],correct:0,working:'Total reactant mass = 48g + 32g = <b>80g</b>, which equals the mass of magnesium oxide produced, since mass is conserved.'},{question:'Why is the law of conservation of mass important when writing and balancing chemical equations?',options:['It ensures the same number of each type of atom appears on both sides, since atoms are neither created nor destroyed','It only matters for reactions involving gases','It means equations never need balancing','It only applies to reactions that release energy'],correct:0,working:'Since atoms are neither created nor destroyed in a reaction, a correctly balanced equation must show the <b>same number of each type of atom</b> on both sides — this reflects conservation of mass.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
o.push(T(240,30,'Conservation of mass summary','#1565C0',12,'middle',true));
var rows=[["Law", "Mass of reactants = mass of products"], ["Gas taken in", "Mass appears to increase"], ["Gas escapes", "Mass appears to decrease"], ["Sealed container", "Proves true conservation"]];var cols=["#1565C0", "#2E7D32", "#C0272D", "#6A1B9A"];
rows.forEach(function(r,i){o.push(R(20,58+i*44,440,32,cols[i]+'18',cols[i],1.5,3));o.push(T(135,79+i*44,r[0],cols[i],9,'start',true));o.push(T(330,79+i*44,r[1],'#555',8,'middle',false));});
s.innerHTML=o.join('');}}
]},

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What is a reversible reaction?',options:['A reaction that can go forwards (reactants to products) and backwards (products back to reactants)','A reaction that can only ever happen once','A reaction that always produces a gas','A reaction between two acids'],correct:0,working:'A <b>reversible reaction</b> can proceed in both directions — the products can react again to reform the original reactants, often shown with the symbol ⇌.'},{question:'Blue hydrated copper sulfate crystals turn white anhydrous copper sulfate powder when heated, driving off water. What happens when water is added back to the white powder?',options:['It turns blue again, showing the reaction is reversible','It stays white permanently','It turns black','It explodes'],correct:0,working:'Adding water to white anhydrous copper sulfate turns it back to <b>blue hydrated copper sulfate</b> — demonstrating that this reaction can go in both directions depending on conditions.'},{question:'What condition typically drives the forward direction of the copper sulfate reaction (blue to white)?',options:['Heating, which removes water from the hydrated crystals','Cooling, which removes water','Adding more water','Exposure to light only'],correct:0,working:'<b>Heating</b> the blue hydrated copper sulfate drives off water, turning it into the white anhydrous form. The reverse happens when water is added back.'},{question:'Ammonium chloride solid, when heated, decomposes into ammonia and hydrogen chloride gases. What happens when these gases cool again?',options:['They recombine to reform solid ammonium chloride','They remain as separate gases permanently','They turn into a completely different substance','Nothing happens on cooling'],correct:0,working:'On cooling, ammonia and hydrogen chloride gases <b>recombine</b> to reform solid ammonium chloride — another example of a reversible reaction driven by temperature.'},{question:'Why is the copper sulfate colour change a useful test for the presence of water?',options:['The reliable colour change (white to blue) shows that water is present, since anhydrous copper sulfate specifically reacts with water to turn blue','The colour change works for any liquid, not just water','White copper sulfate turning blue indicates the absence of water','The test only works with seawater'],correct:0,working:'Because white anhydrous copper sulfate reliably turns <b>blue</b> specifically in the presence of water, this colour change is used as a simple chemical test to <b>detect water</b>.'},{question:'What symbol is used in an equation to show that a reaction is reversible?',options:['⇌','→','=','+'],correct:0,working:'The symbol <b>⇌</b> (two half-arrows pointing in opposite directions) shows that a reaction can proceed both forwards and backwards.'},{question:'If heating drives a reversible reaction in one direction, what usually drives it back in the other direction?',options:['Cooling','Heating further','Adding a catalyst','Nothing can reverse it'],correct:0,working:'For many simple reversible reactions (like copper sulfate or ammonium chloride), <b>cooling</b> (or removing heat) allows the reverse reaction to occur, reforming the original substance.'},{question:'Is a reversible reaction the same as a reaction that just stops before finishing?',options:['No — a reversible reaction can be driven all the way in either direction depending on conditions, unlike a reaction that simply stops incomplete','Yes, they are exactly the same thing','Reversible reactions can never go to completion in either direction','Reversible reactions only occur with gases'],correct:0,working:'A <b>reversible reaction</b> is fundamentally different from an incomplete reaction — it can be driven fully in either direction by changing conditions (like heating or cooling), not just partially completed.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'In electrolysis, what happens at the cathode (negative electrode)?',options:['Positive ions gain electrons (reduction)','Negative ions gain electrons','Positive ions lose electrons','No reaction occurs'],correct:0,working:'At the <b>cathode</b> (negative), positively charged ions (cations) are attracted and <b>gain electrons</b> \u2014 this is <b>reduction</b>. The metal usually forms here.'},{question:'What must happen to an ionic compound before it can be electrolysed?',options:['It must be melted or dissolved so the ions are free to move','It must be cooled to a solid','It must be mixed with a metal','It must be heated without melting'],correct:0,working:'For <b>electrolysis</b> to work, the ionic compound must be <b>molten or dissolved</b> so its ions are free to move to the electrodes and carry the current.'},{question:'What is electroplating used for?',options:['Coating an object with a thin, even layer of metal','Extracting metals from ore','Purifying water','Splitting water into hydrogen and oxygen'],correct:0,working:'<b>Electroplating</b> deposits a thin, even layer of metal (e.g. silver, chromium, gold) onto an object\'s surface using electrolysis \u2014 often for appearance, corrosion resistance, or improved properties.'},{question:'What is electrolysis?',options:['The use of electricity to break down an ionic compound (electrolyte) into its elements','A reaction between an acid and a base','A reaction where a substance burns in oxygen','A method of separating mixtures using filtration'],correct:0,working:'<b>Electrolysis</b> uses an electric current to decompose an ionic compound (in molten or dissolved form) into its constituent elements at the electrodes.'},{question:'Why must an electrolyte be molten or dissolved for electrolysis to work?',options:['The ions need to be free to move to the electrodes to carry charge and be discharged','Solid ionic compounds conduct electricity just as well','Electrolysis only works with covalent compounds','Molten/dissolved states prevent any reaction from occurring'],correct:0,working:'In the solid state, ions are fixed in a lattice and cannot move. Melting or dissolving the electrolyte frees the <b>ions</b> to move to the electrodes, where they can be discharged (gain or lose electrons).'},{question:'What happens at the anode (positive electrode) during electrolysis?',options:['Negative ions lose electrons (oxidation)','Positive ions gain electrons (reduction)','No reaction occurs at the anode','Water is always produced at the anode'],correct:0,working:'At the <b>anode</b> (positive electrode), negative ions are attracted and lose electrons — this is <b>oxidation</b>. At the cathode, positive ions gain electrons (reduction).'},{question:'What are the products of the electrolysis of molten lead bromide (PbBr₂)?',options:['Lead at the cathode and bromine at the anode','Lead bromide remains unchanged','Oxygen and hydrogen at both electrodes','Only bromine is produced, with no lead'],correct:0,working:'In molten lead bromide, Pb²⁺ ions move to the cathode and gain electrons to form <b>lead metal</b>; Br⁻ ions move to the anode and lose electrons to form <b>bromine</b>.'},{question:'What are the two electrodes in electrolysis called?',options:['Cathode (negative) and anode (positive)','North pole and south pole','Positive plate and neutral plate','Anode and cathode are the same thing'],correct:0,working:'The two electrodes used in electrolysis are the <b>cathode</b> (negative electrode) and the <b>anode</b> (positive electrode).'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What happens during combustion?',options:['A fuel reacts with oxygen, releasing energy as heat and light','A compound breaks down into simpler substances on heating','An acid reacts with a base to form a salt and water','Two solutions react to form an insoluble solid'],correct:0,working:'<b>Combustion</b> is the reaction of a fuel with oxygen, releasing energy as heat and light — e.g. methane burning in air to form CO₂ and water.'},{question:'What is oxidation, in terms of oxygen?',options:['The gain of oxygen by a substance during a reaction','The loss of oxygen by a substance during a reaction','The gain of electrons only, with no change in oxygen','A reaction that only occurs in the absence of oxygen'],correct:0,working:'<b>Oxidation</b> (in the oxygen-based definition) is the gain of oxygen by a substance — e.g. iron rusting, where iron gains oxygen to form iron oxide.'},{question:'What happens during thermal decomposition?',options:['A single compound breaks down into two or more simpler substances when heated','Two elements combine to form a compound','A substance reacts with oxygen to release energy','An acid neutralises a base'],correct:0,working:'<b>Thermal decomposition</b> occurs when a single compound is heated and breaks down into two or more simpler products, e.g. calcium carbonate → calcium oxide + carbon dioxide.'},{question:'What happens during a precipitation reaction?',options:['Two soluble solutions react to form an insoluble solid (precipitate)','A solid dissolves completely in a solvent','A gas is produced and released from a solution','A metal displaces another metal from a solution'],correct:0,working:'In a <b>precipitation reaction</b>, two soluble solutions are mixed and react to form an insoluble solid, called a <b>precipitate</b>, which can be filtered out.'},{question:'What happens in a displacement reaction, such as adding zinc to copper sulfate solution?',options:['A more reactive ely), what could you do?',options:['Lower the temperature, use a lower concentration, or use larger pieces of solid reactant','Raise the temperature and use powdered reactants','Increase the concentration and pressure','There is no way to slow down a reaction'],correct:0,working:'To <b>slow down</b> a reaction, you can lower the temperature, use a more dilute (less concentrated) solution, or use larger lumps rather than powder — the opposite of what speeds a reaction up.'},{question:'Why do food manufacturers keep perishable food refrigerated?',options:['Lower temperature slows down the reactions (including those caused by bacteria) that make food spoil','Cold temperatures speed up spoilage reactions','Refrigeration has no effect on chemical reactions','Cold air removes all bacteria instantly'],correct:0,working:'Keeping food cold <b>slows down</b> the chemical reactions (including those from bacteria) responsible for food spoiling, helping it stay fresh for longer.'},{question:'A student adds the same mass of marble chips to acid, once as one large chip and once as several small chips. Which produces gas faster?',options:['The several small chips, because they have a greater total surface area exposed to the acid','The one large chip, because it has more surface area','Both produce gas at exactly the same rate','Neither reacts with acid at all'],correct:0,working:'Several <b>small chips</b> have a much greater total surface area than one large chip of the same mass, allowing the acid to react with more of the chalk at once — producing gas <b>faster</b>.'},{question:'How could you measure how fast a reaction that produces a gas is happening?',options:['Measure the volume of gas collected (e.g. with a gas syringe) at regular time intervals','Only measure the colour of the solution before the reaction','Measure the mass of the container before starting, and never again','Reaction speed cannot be measured in any way'],correct:0,working:'One common method is to measure {sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What is a catalyst?',options:['A substance that speeds up a reaction without being used up itself','A substance that slows a reaction down','A substance that is always used up in a reaction','A type of acid'],correct:0,working:'A <b>catalyst</b> makes a reaction go faster, but it is not changed or used up — the same amount is left over at the end.'},{question:'Why is it useful that a catalyst is not used up during a reaction?',options:['A small amount of catalyst can be used again and again for many reactions','Catalysts must be replaced after every single use','Catalysts disappear completely after use','Catalysts turn into new products each time'],correct:0,working:'Because a catalyst isn\'t consumed by the reaction, the <b>same catalyst</b> can be reused repeatedly, making catalysts very cost-effective in industry.'},{question:'What is an enzyme?',options:['A biological catalyst that speeds up reactions in living things, such as digestion','A type of metal used only in industry','A poison that stops all reactions','An acid found only in fruit'],correct:0,working:'An <b>enzyme</b> is a catalyst made by living things (usually a protein) that speeds up biological reactions, such as breaking down food during digestion.'},{question:'Why might a factory use a catalyst when manufacturing a chemical?',options:['It allows the reaction to happen fast enough without needing extremely high (expensive) temperatures','Catalysts always make reactions slower, which is safer','Catalysts remove the need for any reactants','Catalysts change what products are made'],correct:0,working:'Using a catalyst lets a reaction proceed quickly at a <b>lower temperature</b> than it would otherwise need, which saves energy and money in industrial processes.'},{question:'Is a catalyst included as a reactant or product in a balanced chemical equation?',options:['No — since it isn\'t changed or used up by the reaction, it\'s written above the arrow instead','Yes, it is always written as a reactant','Yes, it is always written as a product','Catalysts are never mentioned anywhere'],correct:0,working:'Since a catalyst isn\'t chemically changed by the reaction, it isn\'t a true reactant or product — it\'s often shown written above or below the reaction arrow instead.'},{question:'Do all reactions need a catalyst to happen?',options:['No — many reactions happen without any catalyst, though a catalyst can make them faster','Yes, every single reaction requires a catalyst','Catalysts are required only for very slow reactions','Catalysts are required only for reactions with gases'],correct:0,working:'Many reactions happen perfectly well without a catalyst. A catalyst is simply used when we want to <b>speed up</b> a reaction that would otherwise be too slow to be useful or practical.'},{question:'Why might a school science lab use manganese dioxide as a catalyst when testing hydrogen peroxide?',options:['It speeds up the breakdown of hydrogen peroxide into water and oxygen, without being used up itself','It reacts completely with hydrogen peroxide and disappears','It slows down the reaction to make it safer','It changes hydrogen peroxide into a completely different chemical'],correct:0,working:'<b>Manganese dioxide</b> speeds up the decomposition of hydrogen peroxide into water and oxygen gas, and can be filtered out afterwards completely unchanged — a classic catalyst demonstration.'},{question:'If a catalyst is left over after a reaction, in what state would you typically find it?',options:['Chemically unchanged, in the same form as before the reaction started','Completely dissolved and gone','Turned into a brand new substance','Always turned into a gas'],correct:0,working:'A catalyst comes out of a reaction <b>chemically unchanged</b> — same substance, same mass (though it may look slightly different physically, like being broken into smaller pieces).'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribu var qi=0,si=0;
function buildSidebar(){
  var sb=document.getElementById('sb');
  sb.innerHTML='<div class="sb-lbl">Topics</div>';
  QS.forEach(function(q,i){
    var b=document.createElement('button');
    b.className='qb'+(i===qi?' on':'');
    b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;
    b.onclick=function(){qi=i;si=0;render();};
    sb.appendChild(b);
  });
}
function render(){
  var q=QS[qi],st=q.steps[si];
  document.getElementById('ey').textContent=q.ey;
  document.getElementById('ti').textContent=q.ti;
  document.getElementById('su').textContent=q.su;
  document.getElementById('pn').className='pnl fi';
  document.getElementById('pn').innerHTML='<div class="sl">'+st.sl+'</div><div>'+st.p+'</div>';
  st.draw();
  var dt=document.getElementById('dt');
  dt.innerHTML=q.steps.map(function(_,i){return '<div class="dot'+(i===si?' on':i<si?' dn':'')+'"></div>';}).join('');
  document.getElementById('pb').disabled=(qi===0&&si===0);
  var last=(qi===QS.length-1&&si===q.steps.length-1);
  document.getElementById('nb').textContent=last?'Finished \u2713':'Next \u2192';
  document.getElementById('nb').disabled=false;
  document.querySelectorAll('.qb').forEach(function(b,i){b.classList.toggle('on',i===qi);});
}
document.getElementById('nb').onclick=function(){
  var q=QS[qi];
  if(si<q.steps.length-1){si++;}
  else if(qi<QS.length-1){qi++;si=0;}
  render();
};
document.getElementById('pb').onclick=function(){
  if(si>0){si--;}
  else if(qi>0){qi--;si=QS[qi].steps.length-1;}
  render();
};
buildSidebar();render();
