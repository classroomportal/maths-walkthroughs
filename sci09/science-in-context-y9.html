<style>
:root{--acc:#E65100;--dark:#BF360C;--cream:#FBE9E7;--ink:#2e1a0a;--line:#FFAB91;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--acc);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--acc);color:var(--acc);}
.qb.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--acc);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--acc);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--acc);background:#fff;color:var(--acc);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--acc);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--acc);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.hl{font-size:14px;color:var(--ink);margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.nq{margin-top:12px;font-size:13px;font-weight:600;padding:6px 14px;border-radius:3px;border:1px solid #aaa;background:#f5f5f5;color:#444;cursor:pointer;}
.nq:hover{background:#e0e0e0;}
.wk-ans{margin-top:8px;font-size:14px;line-height:1.6;}
.wk summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.mc-opt{padding:9px 14px;border:1.5px solid var(--line);border-radius:4px;cursor:pointer;font-size:14px;background:#fff;text-align:left;transition:.15s;font-family:inherit;}
.mc-opt:hover{border-color:var(--acc);background:var(--cream);}
.mc-opt.correct{border-color:#2e7d32;background:#e8f8ee;color:#1a7a3a;font-weight:600;}
.mc-opt.wrong{border-color:#C0272D;background:#fde8e8;color:#a01820;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(a){return a[Math.floor(Math.random()*a.length)];}
function tryIt(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTry(id,fn());
}
function genTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="ar"><input type="number" step="any" placeholder="Your answer" id="'+id+'_i"/>'+
    '<button class="ck" onclick="ck(\''+id+'\')">&#10003; Check</button></div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show working</summary><div class="wk-b">'+
    (h?'<ul class="hl">'+h+'</ul>':'')+
    '<div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'">New question</button></div>';
}
function ck(id){
  var fn=ST[id];var o=typeof fn==='function'?fn():fn;
  var v=parseFloat(document.getElementById(id+'_i').value);
  var f=document.getElementById(id+'_f');
  if(isNaN(v)){f.className='fb er';f.textContent='Please enter a number.';return;}
  var tol=o.tol!==undefined?o.tol:0.5;
  if(Math.abs(v-o.ans)<=tol){
    f.className='fb ok';f.textContent='\u2713 Correct! Answer: '+o.ans+(o.unit?' '+o.unit:'');
  }else{f.className='fb er';f.textContent='Not quite \u2014 check your working and try again.';}
}
function tryItMC(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTryMC(id,fn());
}
function genTryMC(id,o){
  var order=o.options.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=order[i];order[i]=order[j];order[j]=tmp;
  }
  var newCorrect=order.indexOf(o.correct);
  var opts=order.map(function(origIdx,shownIdx){
    return '<button class="mc-opt" onclick="ckMC(\''+id+'\','+shownIdx+','+newCorrect+')">'+o.options[origIdx]+'</button>';
  }).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="mc-opts" id="'+id+'_opts">'+opts+'</div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show answer</summary><div class="wk-b"><div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'_mc">New question</button></div>';
}
function ckMC(id,chosen,correct){
  var opts=document.getElementById(id+'_opts').querySelectorAll('.mc-opt');
  opts.forEach(function(b,i){
    if(i===correct)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
    b.disabled=true;
  });
  var f=document.getElementById(id+'_f');
  if(chosen===correct){f.className='fb ok';f.textContent='\u2713 Correct!';}
  else{f.className='fb er';f.textContent='Not quite \u2014 the correct answer is highlighted in green.';}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.nq');if(!b)return;
  var rawId=b.getAttribute('data-tryid');
  var id=rawId.replace('_mc','');
  var fn=ST[id];if(typeof fn!=='function')return;
  var wrap=b.closest('.try');if(!wrap)return;
  var isMC=(rawId.indexOf('_mc')>=0);
  var fresh=isMC?genTryMC(id,fn()):genTry(id,fn());
  var tmp=document.createElement('div');tmp.innerHTML=fresh;
  wrap.parentNode.replaceChild(tmp.firstChild,wrap);
});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#333';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function R(x,y,w,h,fill,stroke,sw,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'" rx="'+(rx||0)+'"/>';}
function circ(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function ellipse(cx,cy,rx,ry,fill,stroke,sw){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function arr(x1,y1,x2,y2,c,w){
  c=c||'#555';w=w||1.5;
  var ang=Math.atan2(y2-y1,x2-x1);
  var hs=8;
  var p1x=x2-hs*Math.cos(ang-0.4),p1y=y2-hs*Math.sin(ang-0.4);
  var p2x=x2-hs*Math.cos(ang+0.4),p2y=y2-hs*Math.sin(ang+0.4);
  return L(x1,y1,x2,y2,c,w)+'<polygon points="'+x2+','+y2+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1)+'" fill="'+c+'"/>';
}

s.innerHTML=o.join('');}},
{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What is the key difference between a scientific theory and an everyday guess?',options:['A scientific theory is a well-tested explanation supported by extensive evidence from many experiments','A theory is just someone\'s personal opinion','A theory cannot ever be changed once proposed','A theory has never been tested'],correct:0,working:'A scientific <b>theory</b> is very different from a casual guess \u2014 it is a robust explanation built up from <b>repeated experiments and independent evidence</b>, and remains open to revision if new evidence emerges.'},{question:'Why do scientists use simplified models rather than trying to represent every detail of a system?',options:['Models highlight key features, making complex systems easier to understand, explain and predict','Models are always 100% accurate copies of reality','Simplified models are easier to draw','Real systems have no complexity to represent'],correct:0,working:'A <b>model</b> deliberately leaves out unnecessary detail so scientists (and students) can focus on the <b>key relationships and features</b> that explain and predict how a system behaves.'},{question:'Why has the model of the atom changed several times throughout history?',options:['New experimental evidence showed the older models could not explain all observations','Scientists kept changing their minds for no reason','The atom itself keeps physically changing shape','Older models were proven to be completely wrong with nothing useful in them'],correct:0,working:'Each revision to the atomic model \u2014 solid sphere, plum pudding, nuclear, electron-shell \u2014 was driven by <b>new experimental evidence</b> that the previous model could not explain, showing science self-corrects over time.'},{question:'What is a scientific model used for?',options:['To simplify a complex system so it\'s easier to understand, test, and make predictions with','To make science more confusing and difficult to understand','To replace the need for any real experiments','To only describe things that cannot be tested'],correct:0,working:'A <b>scientific model</b> simplifies a complex system, making it easier to understand, test, and use to make <b>predictions</b>.'},{question:'Why might a scientific model be updated or replaced over time?',options:['New evidence may reveal the old model doesn\'t fully explain observations, requiring a better model','Models are never updated once created','Only completely wrong models are ever changed','Updating models makes science less accurate over time'],correct:0,working:'When <b>new evidence</b> emerges that a model cannot explain, scientists refine or replace the model with one that better fits the evidence — this is how scientific understanding progresses.'},{question:'Why is it important for a scientific theory to be testable?',options:['Testability allows the theory to be checked against evidence, and potentially shown to be wrong if it doesn\'t fit','Testability makes a theory automatically true','Untestable ideas are considered stronger in science','Scientific theories don\'t need any supporting evidence'],correct:0,working:'A good scientific <b>theory</b> must be <b>testable</b>, meaning it can be checked against evidence and potentially proven wrong — this is what separates science from untestable belief.'},{question:'What is the difference between an observation and a conclusion in scientific investigation?',options:['An observation is what you directly notice or measure; a conclusion is an interpretation based on that evidence','Observations and conclusions mean exactly the same thing','Conclusions always come before observations in an investigation','Observations require no evidence at all'],correct:0,working:'An <b>observation</b> is something directly noticed or measured, while a <b>conclusion</b> is an interpretation or explanation based on that evidence — they are different steps in scientific reasoning.'},{question:'Why do scientists often repeat experiments multiple times before drawing firm conclusions?',options:['To check that results are consistent and not just due to chance or a one-off error','Repeating experiments is unnecessary and wastes time','The first result obtained is always the most reliable','Repeating experiments always produces worse results'],correct:0,working:'<b>Repeating</b> an experiment helps confirm that results are <b>consistent</b> and reliable, rather than a one-off fluke or measurement error.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

]},

 do in a fair test experiment?',options:['It is kept the same throughout the experiment so it doesn\'t affect the results','It is the variable that is deliberately changed','It is the variable being measured as the outcome','It has no role in a fair experiment'],correct:0,working:'A <b>control variable</b> is kept constant throughout an experiment, ensuring that any change in results is due to the variable being tested, not something else.'},{question:'What is the independent variable in an experiment?',options:['The variable that the experimenter deliberately changes','The variable that is measured as the result','A variable that is always kept constant','A variable with no effect on the experiment'],correct:0,working:'The <b>independent variable</b> is the one deliberately changed by the experimenter, to see what effect it has on the dependent variable.'},{question:'What is the dependent variable in an experiment?',options:['The variable that is measured, which may change as a result of the independent variable','The variable deliberately changed by the experimenter','A variable kept constant throughout the test','A variable unrelated to the experiment'],correct:0,working:'The <b>dependent variable</b> is what is measured in an experiment — it may change depending on the independent variable being tested.'},{question:'Why is a large sample size generally more reliable than a very small one in a scientific study?',options:['A larger sample reduces the chance that results are skewed by unusual individual cases or random chance','Smaller samples always give more accurate results than larger ones','Sample size has no effect on the reliability of results','A sample of just one person is always sufficient for reliable conclusions'],correct:0,working:'A <b>larger sample size</b> reduces the influence of unusual individual cases or random chance, making the overall results more <b>reliable</b> and representative.'},{question:'Why is it important to consider whether a study\'s results can be replicated by other scientists?',options:['If independent scientists get similar results, this increases confidence that the finding is genuine and reliable','Replication is unnecessary once one scientist has published a result','Results that can\'t be replicated are automatically considered more trustworthy','Only the original researcher\'s results ever matter in science'],correct:0,working:'If other scientists can <b>independently replicate</b> a result, this significantly increases confidence that the finding is genuine, reliable, and not due to error or chance.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

ny different careers','Only the ability to memorise chemical formulas','Skills that are useful only within a science laboratory','No practical skills are gained from studying science'],correct:0,working:'Studying science develops <b>transferable skills</b> like critical thinking, problem-solving, and data analysis, which are valuable across many different careers, not just scientific ones.'},{question:'Why might employers value candidates with a science education, even for non-science jobs?',options:['Science education develops analytical thinking, evidence-based reasoning, and problem-solving skills valued in many fields','Science education has no relevance outside of scientific careers','Employers never consider a candidate\'s educational background','Science education only teaches memorisation, with no other useful skills'],correct:0,working:'A <b>science education</b> develops <b>analytical thinking</b>, evidence-based reasoning, and problem-solving abilities that employers value across a wide range of careers, not just scientific roles.'},{question:'What is one example of a career that draws directly on a science education, beyond becoming a professional scientist?',options:['Medicine, engineering, or environmental consultancy, among many others','Only becoming a school science teacher is possible with a science education','Science education has no connection to any career path','Only laboratory research careers use scientific knowledge'],correct:0,working:'A science education can lead to careers in <b>medicine</b>, <b>engineering</b>, environmental consultancy, forensic science, and many other fields beyond laboratory research.'},{question:'Why might studying science help someone become a more informed citizen, even if they don\'t pursue a science career?',options:['It helps people critically evaluate scientific claims in the news, health advice, and public policy debates','Science education has no relevance to everyday decision-making','Only professional scie var qi=0,si=0;
function buildSidebar(){
  var sb=document.getElementById('sb');
  sb.innerHTML='<div class="sb-lbl">Topics</div>';
  QS.forEach(function(q,i){
    var b=document.createElement('button');
    b.className='qb'+(i===qi?' on':'');
    b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;
    b.onclick=function(){qi=i;si=0;render();};
    sb.appendChild(b);
  });
}
function render(){
  var q=QS[qi],st=q.steps[si];
  document.getElementById('ey').textContent=q.ey;
  document.getElementById('ti').textContent=q.ti;
  document.getElementById('su').textContent=q.su;
  document.getElementById('pn').className='pnl fi';
  document.getElementById('pn').innerHTML='<div class="sl">'+st.sl+'</div><div>'+st.p+'</div>';
  st.draw();
  var dt=document.getElementById('dt');
  dt.innerHTML=q.steps.map(function(_,i){return '<div class="dot'+(i===si?' on':i<si?' dn':'')+'"></div>';}).join('');
  document.getElementById('pb').disabled=(qi===0&&si===0);
  var last=(qi===QS.length-1&&si===q.steps.length-1);
  document.getElementById('nb').textContent=last?'Finished \u2713':'Next \u2192';
  document.getElementById('nb').disabled=false;
  document.querySelectorAll('.qb').forEach(function(b,i){b.classList.toggle('on',i===qi);});
}
document.getElementById('nb').onclick=function(){
  var q=QS[qi];
  if(si<q.steps.length-1){si++;}
  else if(qi<QS.length-1){qi++;si=0;}
  render();
};
document.getElementById('pb').onclick=function(){
  if(si>0){si--;}
  else if(qi>0){qi--;si=QS[qi].steps.length-1;}
  render();
};

buildSidebar();
render();
</script>
