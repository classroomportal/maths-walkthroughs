<style>
:root{--acc:#2E7D32;--dark:#1B5E20;--cream:#F1F8F1;--ink:#1a2e1a;--line:#C8E6C9;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--acc);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--acc);color:var(--acc);}
.qb.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--acc);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--acc);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--acc);background:#fff;color:var(--acc);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--acc);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--acc);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.hl{font-size:14px;color:var(--ink);margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.nq{margin-top:12px;font-size:13px;font-weight:600;padding:6px 14px;border-radius:3px;border:1px solid #aaa;background:#f5f5f5;color:#444;cursor:pointer;}
.nq:hover{background:#e0e0e0;}
.wk-ans{margin-top:8px;font-size:14px;line-height:1.6;}
.wk summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.mc-opt{padding:9px 14px;border:1.5px solid var(--line);border-radius:4px;cursor:pointer;font-size:14px;background:#fff;text-align:left;transition:.15s;font-family:inherit;}
.mc-opt:hover{border-color:var(--acc);background:var(--cream);}
.mc-opt.correct{border-color:#2e7d32;background:#e8f8ee;color:#1a7a3a;font-weight:600;}
.mc-opt.wrong{border-color:#C0272D;background:#fde8e8;color:#a01820;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(a){return a[Math.floor(Math.random()*a.length)];}
function tryIt(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTry(id,fn());
}
function genTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="ar"><input type="number" step="any" placeholder="Your answer" id="'+id+'_i"/>'+
    '<button class="ck" onclick="ck(\''+id+'\')">&#10003; Check</button></div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show working</summary><div class="wk-b">'+
    (h?'<ul class="hl">'+h+'</ul>':'')+
    '<div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'">New question</button></div>';
}
function ck(id){
  var fn=ST[id];var o=typeof fn==='function'?fn():fn;
  var v=parseFloat(document.getElementById(id+'_i').value);
  var f=document.getElementById(id+'_f');
  if(isNaN(v)){f.className='fb er';f.textContent='Please enter a number.';return;}
  var tol=o.tol!==undefined?o.tol:0.5;
  if(Math.abs(v-o.ans)<=tol){
    f.className='fb ok';f.textContent='\u2713 Correct! Answer: '+o.ans+(o.unit?' '+o.unit:'');
  }else{f.className='fb er';f.textContent='Not quite \u2014 check your working and try again.';}
}
function tryItMC(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTryMC(id,fn());
}
function genTryMC(id,o){
  var order=o.options.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=order[i];order[i]=order[j];order[j]=tmp;
  }
  var newCorrect=order.indexOf(o.correct);
  var opts=order.map(function(origIdx,shownIdx){
    return '<button class="mc-opt" onclick="ckMC(\''+id+'\','+shownIdx+','+newCorrect+')">'+o.options[origIdx]+'</button>';
  }).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="mc-opts" id="'+id+'_opts">'+opts+'</div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show answer</summary><div class="wk-b"><div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'_mc">New question</button></div>';
}
function ckMC(id,chosen,correct){
  var opts=document.getElementById(id+'_opts').querySelectorAll('.mc-opt');
  opts.forEach(function(b,i){
    if(i===correct)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
    b.disabled=true;
  });
  var f=document.getElementById(id+'_f');
  if(chosen===correct){f.className='fb ok';f.textContent='\u2713 Correct!';}
  else{f.className='fb er';f.textContent='Not quite \u2014 the correct answer is highlighted in green.';}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.nq');if(!b)return;
  var rawId=b.getAttribute('data-tryid');
  var id=rawId.replace('_mc','');
  var fn=ST[id];if(typeof fn!=='function')return;
  var wrap=b.closest('.try');if(!wrap)return;
  var isMC=(rawId.indexOf('_mc')>=0);
  var fresh=isMC?genTryMC(id,fn()):genTry(id,fn());
  var tmp=document.createElement('div');tmp.innerHTML=fresh;
  wrap.parentNode.replaceChild(tmp.firstChild,wrap);
});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#333';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function R(x,y,w,h,fill,stroke,sw,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'" rx="'+(rx||0)+'"/>';}
function circ(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function ellipse(cx,cy,rx,ry,fill,stroke,sw){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function arr(x1,y1,x2,y2,c,w){
  c=c||'#555';w=w||1.5;
  var ang=Math.atan2(y2-y1,x2-x1);
  var hs=8;
  var p1x=x2-hs*Math.cos(ang-0.4),p1y=y2-hs*Math.sin(ang-0.4);
  var p2x=x2-hs*Math.cos(ang+0.4),p2y=y2-hs*Math.sin(ang+0.4);
  return L(x1,y1,x2,y2,c,w)+'<polygon points="'+x2+','+y2+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1)+'" fill="'+c+'"/>';
}

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'Why do arteries have thicker walls than veins?',options:['Blood in arteries is at higher pressure (pumped directly from the heart)','Arteries carry more blood','Arteries are older','Blood in arteries is oxygenated'],correct:0,working:'Arteries carry blood directly from the heart under <b>high pressure</b>. Thick, elastic walls withstand and smooth out the pulses from each heartbeat.'},{question:'Why do veins have valves but arteries do not?',options:['Blood in veins flows at low pressure; valves prevent backflow','Veins are longer','Veins carry deoxygenated blood','Valves help veins pump blood'],correct:0,working:'Blood in veins flows at <b>low pressure</b>. Without valves, gravity would cause backflow, especially in the legs.'},{question:'What is the role of platelets?',options:['Blood clotting at wounds to prevent excessive blood loss','Carrying oxygen','Producing antibodies','Transporting carbon dioxide'],correct:0,working:'<b>Platelets</b> are cell fragments that trigger blood clotting at wounds, forming a fibrin mesh that traps red blood cells.'},{question:'What is the function of red blood cells?',options:['Carry oxygen, bound to haemoglobin, around the body','Fight infection','Clot blood at wound sites','Transport hormones'],correct:0,working:'<b>Red blood cells</b> contain haemoglobin, which binds oxygen in the lungs and releases it to respiring tissues around the body.'},{question:'Why do red blood cells have no nucleus?',options:['To maximise space for haemoglobin, carrying more oxygen','So they can divide more easily','To allow them to produce antibodies','To help them fight infection'],correct:0,working:'Having no nucleus frees up space inside the cell for more <b>haemoglobin</b>, allowing red blood cells to carry more oxygen.'},{question:'What is the function of white blood cells?',options:['Defend the body against pathogens (infection)','Carry oxygen around the body','Clot blood at a wound','Carry  does the body respond when core temperature drops below 37°C?',options:['Shivering (muscle contractions generate heat) and vasoconstriction (less blood flow to skin)','Sweating and vasodilation','Increased urine production','Decreased heart rate only'],correct:0,working:'When core temperature falls, the body responds with <b>shivering</b> (rapid muscle contractions release heat) and <b>vasoconstriction</b> of skin blood vessels, reducing heat loss.'},{question:'What is homeostasis?',options:['Maintaining a constant internal environment despite external changes','The process of digestion','The production of antibodies','The transport of oxygen in blood'],correct:0,working:'<b>Homeostasis</b> is the regulation of internal conditions (such as temperature, water content, and glucose levels) to maintain a stable environment for cells to function properly.'},{question:'Why does sweating cool the body down?',options:['Sweat evaporates from the skin, using heat energy from the body, cooling it','Sweat directly lowers blood temperature by mixing with blood','Sweating increases metabolic rate','Sweating reduces blood flow to the skin'],correct:0,working:'As sweat <b>evaporates</b> from the skin surface, it takes heat energy from the body, which has a cooling effect — this is an example of negative feedback in temperature control.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

uscles or glands)','Carries impulses from receptors to the CNS','Detects light in the eye','Produces antibodies'],correct:0,working:'<b>Motor neurones</b> carry impulses from the central nervous system out to effectors, such as muscles (causing contraction) or glands (causing secretion).'},{question:'Why are reflex actions important?',options:['They are fast, automatic responses that protect the body from harm without needing conscious thought','They allow for complex decision-making','They only occur during sleep','They require input from the brain first'],correct:0,working:'<b>Reflex actions</b> are rapid and automatic, bypassing conscious processing in the brain via a shorter reflex arc, allowing the body to respond quickly to protect itself from danger (e.g. touching something hot).'},{question:'What is a synapse?',options:['The junction between two neurones, where signals are transmitted by diffusion of neurotransmitters','The cell body of a neurone','A type of muscle fibre','The myelin sheath around a neurone'],correct:0,working:'A <b>synapse</b> is the small gap between two neurones. An electrical impulse triggers release of a chemical <b>neurotransmitter</b>, which diffuses across the gap and triggers a new impulse in the next neurone.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

tore it as glycogen.'},{question:'What triggers the release of adrenaline, and what effect does it have?',options:['Stress or danger — it increases heart rate and prepares the body for \'fight or flight\'','Low blood glucose — it increases insulin secretion','High body temperature — it triggers sweating','Ovulation — it prepares the uterus lining'],correct:0,working:'<b>Adrenaline</b> is released from the adrenal glands in response to stress or danger, increasing heart rate, blood flow to muscles, and blood glucose — preparing the body for \'fight or flight\'.'},{question:'What is the role of progesterone in the menstrual cycle?',options:['Maintains the uterus lining after ovulation, ready for a possible pregnancy','Triggers the release of an egg from the ovary','Stimulates follicle development in the ovary','Breaks down the uterus lining'],correct:0,working:'<b>Progesterone</b>, produced by the corpus luteum after ovulation, maintains the thickened uterus lining, ready to support a pregnancy if fertilisation occurs.'},{question:'How does the intrauterine device (IUD) act as a form of contraception?',options:['Prevents implantation of a fertilised egg in the uterus (some also release hormones)','Prevents ovulation completely in all cases','Kills sperm using antibiotics','Blocks the fallopian tubes permanently'],correct:0,working:'An <b>IUD</b> is a small device placed in the uterus. It mainly prevents <b>implantation</b> of a fertilised egg, and hormonal versions also thicken cervical mucus and can suppress ovulation.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'Why does antibiotic resistance evolve?',options:['Bacteria with random mutations that resist the antibiotic survive and reproduce','Bacteria deliberately change to avoid antibiotics','Patients do not take enough medicine','Antibiotics become weaker over time'],correct:0,working:'Some bacteria have random mutations giving resistance. When antibiotics are used, non-resistant bacteria die but resistant ones <b>survive and reproduce</b>, passing on resistance \u2014 natural selection.'},{question:'Why is it important to finish a full course of antibiotics?',options:['Stopping early may leave partially resistant bacteria alive, which can reproduce and spread resistance','Antibiotics taste better when finished','It saves money','Partial courses work just as well'],correct:0,working:'Stopping early can leave <b>partially resistant survivors</b> alive, which can multiply and pass on resistance, contributing to the spread of antibiotic-resistant strains like MRSA.'},{question:'What is herd immunity?',options:['When enough people are vaccinated/immune that disease spread is significantly slowed, protecting unvaccinated individuals too','Only animals can have herd immunity','Vaccinating only sick people','A type of antibody'],correct:0,working:'<b>Herd immunity</b> occurs when a sufficiently high proportion of a population is immune, breaking chains of transmission and indirectly protecting those who cannot be vaccinated.'},{question:'What is a pathogen?',options:['A microorganism that causes disease','A type of white blood cell','An antibody produced by the immune system','A chemical messenger in the blood'],correct:0,working:'A <b>pathogen</b> is any microorganism (such as bacteria, viruses, or fungi) capable of causing disease in a host.'},{question:'How do phagocytes defend the body against pathogens?',options:['They engulf and digest pathogens (phagocytosis)','They produce antibodies specific to one pathogen','They increase heart rate to fight infection','They release hormones to kill pathogens'],correct:0,working:'<b>Phagocytes</b> are white blood cells that engulf and digest pathogens directly — a non-specific defence that works against many types of pathogen.'},{question:'How do lymphocytes defend the body against pathogens?',options:['They produce antibodies that are specific to a particular pathogen\'s antigens','They engulf pathogens non-specifically','They physically block pathogens from entering cells','They increase body temperature'],correct:0,working:'<b>Lymphocytes</b> produce <b>antibodies</b> that bind specifically to antigens on a particular pathogen, marking it for destruction or neutralising it — this is specific immunity.'},{question:'How does a vaccine provide immunity to a disease?',options:['It introduces a dead/inactive form of a pathogen (or its antigens), causing the body to produce antibodies and memory cells without causing the disease','It kills all pathogens directly using antibiotics','It boosts non-specific immunity only, with no memory response','It removes the need for white blood cells'],correct:0,working:'A <b>vaccine</b> contains a harmless version of a pathogen\'s antigens. This triggers the immune system to produce <b>antibodies</b> and memory cells, so the body can respond rapidly if it meets the real pathogen later.'},{question:'Why are antibiotics not effective against viral infections?',options:['Antibiotics target processes specific to bacterial cells, which viruses do not have','Antibiotics only work on plant cells','Viruses are immune to all chemicals','Antibiotics destroy white blood cells'],correct:0,working:'Antibiotics work by disrupting processes specific to <b>bacterial</b> cells (like cell wall synthesis). Viruses have a completely different structure and rely on host cells to replicate, so antibiotics have no effect on them.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

ing exercise?',options:['To supply more oxygen and remove more carbon dioxide, meeting increased respiration demands','To reduce heart rate','To decrease oxygen supply to muscles','To increase lactic acid removal only, not oxygen'],correct:0,working:'During exercise, muscles respire faster, needing more <b>oxygen</b> and producing more <b>carbon dioxide</b>. Breathing rate and depth increase to supply oxygen and remove CO2 more quickly.'},{question:'What is the role of the diaphragm in breathing?',options:['Contracts and flattens to increase chest cavity volume during inhalation','Produces mucus to trap particles','Filters oxygen from the air','Pumps blood to the lungs'],correct:0,working:'The <b>diaphragm</b> is a muscle that contracts and flattens during inhalation, increasing the volume of the chest cavity and decreasing pressure, drawing air into the lungs.'},{question:'Why do smokers often experience shortness of breath and reduced fitness?',options:['Tar damages the alveoli, reducing surface area for gas exchange, and cilia damage allows mucus/pathogens to build up','Smoking increases alveoli surface area','Smoking has no effect on the lungs','Tobacco increases oxygen absorption'],correct:0,working:'Tar in cigarette smoke can damage and destroy alveoli walls, <b>reducing the surface area</b> available for gas exchange, and paralyses/destroys cilia, allowing mucus and pathogens to accumulate.'},{question:'What is the function of the trachea and bronchi?',options:['Carry air from the mouth/nose down into the lungs','Absorb oxygen into the blood','Produce carbon dioxide','Store air between breaths'],correct:0,working:'The <b>trachea</b> (windpipe) branches into <b>bronchi</b>, which carry air down into the lungs, further dividing into smaller bronchioles leading to the alveoli.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

lage</b> covers the ends of bones in a joint, providing a smooth, cushioned surface that reduces friction and absorbs shock during movement.'},{question:'What is the role of synovial fluid in a joint?',options:['Lubricates the joint, reducing friction between bones','Attaches bone to bone','Produces new bone cells','Supplies oxygen to muscle'],correct:0,working:'<b>Synovial fluid</b>, found in the synovial capsule of a joint, lubricates the joint and reduces friction between the moving surfaces of bone and cartilage.'},{question:'Why do bones need a good blood supply?',options:['To deliver oxygen and nutrients, and to allow bone marrow to produce blood cells','Bones do not need a blood supply','To remove muscle waste products only','To supply hormones to muscles'],correct:0,working:'Bones are living tissue and need a blood supply to deliver <b>oxygen and nutrients</b> to bone cells, and to support <b>bone marrow</b>, which produces red and white blood cells.'},{question:'What type of joint is the elbow, and how does it move?',options:['A hinge joint, allowing movement in one plane (bending and straightening)','A ball-and-socket joint, allowing rotation in all directions','A fixed joint, allowing no movement','A pivot joint, allowing only rotation'],correct:0,working:'The elbow is a <b>hinge joint</b>, which allows movement in one plane only — like a door hinge — enabling the arm to bend and straighten.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

y need a higher energy intake than sedentary people?',options:['They have a higher metabolic/activity rate and use more energy through exercise','Athletes need less protein than average','Exercise reduces the need for carbohydrates','Athletes need no extra energy at all'],correct:0,working:'Athletes use more energy through increased muscle activity and higher metabolic rate, so they need a higher <b>energy intake</b> (mainly from carbohydrates and fats) to fuel this activity and support recovery.'},{question:'What is the effect of consistently consuming more energy (calories) than the body uses?',options:['The excess energy is stored as fat, potentially leading to obesity','The excess energy is immediately excreted','The body burns it off automatically with no effect','It causes malnutrition'],correct:0,working:'Energy intake exceeding energy use is stored as <b>fat</b>. Consistently doing this over time can lead to <b>obesity</b>, increasing risk of conditions like type 2 diabetes and heart disease.'},{question:'Why is dietary fibre important, even though it is not digested?',options:['It adds bulk to food, helping muscles in the gut wall move food through and preventing constipation','It provides most of the body\'s energy','It is absorbed directly into the blood','It replaces the need for water in the diet'],correct:0,working:'<b>Fibre</b> (e.g. from wholegrains, vegetables) is not digested but adds bulk to food, stimulating peristalsis and helping food move through the gut, preventing constipation.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

var qi=0,si=0;
function buildSidebar(){
  var sb=document.getElementById('sb');
  sb.innerHTML='<div class="sb-lbl">Topics</div>';
  QS.forEach(function(q,i){
    var b=document.createElement('button');
    b.className='qb'+(i===qi?' on':'');
    b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;
    b.onclick=function(){qi=i;si=0;render();};
    sb.appendChild(b);
  });
}
function render(){
  var q=QS[qi],st=q.steps[si];
  document.getElementById('ey').textContent=q.ey;
  document.getElementById('ti').textContent=q.ti;
  document.getElementById('su').textContent=q.su;
  document.getElementById('pn').className='pnl fi';
  document.getElementById('pn').innerHTML='<div class="sl">'+st.sl+'</div><div>'+st.p+'</div>';
  st.draw();
  var dt=document.getElementById('dt');
  dt.innerHTML=q.steps.map(function(_,i){return '<div class="dot'+(i===si?' on':i<si?' dn':'')+'"></div>';}).join('');
  document.getElementById('pb').disabled=(qi===0&&si===0);
  var last=(qi===QS.length-1&&si===q.steps.length-1);
  document.getElementById('nb').textContent=last?'Finished \u2713':'Next \u2192';
  document.getElementById('nb').disabled=false;
  document.querySelectorAll('.qb').forEach(function(b,i){b.classList.toggle('on',i===qi);});
}
document.getElementById('nb').onclick=function(){
  var q=QS[qi];
  if(si<q.steps.length-1){si++;}
  else if(qi<QS.length-1){qi++;si=0;}
  render();
};
document.getElementById('pb').onclick=function(){
  if(si>0){si--;}
  else if(qi>0){qi--;si=QS[qi].steps.length-1;}
  render();
};
buildSidebar();render();
