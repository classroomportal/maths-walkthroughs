<style>
:root{--acc:#6A1B9A;--dark:#4A148C;--cream:#F3E5F5;--ink:#2a1a2e;--line:#CE93D8;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--acc);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--acc);color:var(--acc);}
.qb.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--acc);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}

.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}

.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--acc);background:#fff;color:var(--acc);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--acc);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--acc);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.hl{font-size:14px;color:var(--ink);margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.fb.ok{background:#e8f8ee;color:#1a7a3a;border:1px solid #a8dbb8;display:block;}
.fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.nq{margin-top:12px;font-size:13px;font-weight:600;padding:6px 14px;border-radius:3px;border:1px solid #aaa;background:#f5f5f5;color:#444;cursor:pointer;}
.nq:hover{background:#e0e0e0;}
.wk-ans{margin-top:8px;font-size:14px;line-height:1.6;}
.wk summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.mc-opt{padding:9px 14px;border:1.5px solid var(--line);border-radius:4px;cursor:pointer;font-size:14px;background:#fff;text-align:left;transition:.15s;font-family:inherit;}
.mc-opt:hover{border-color:var(--acc);background:var(--cream);}
.mc-opt.correct{border-color:#2e7d32;background:#e8f8ee;color:#1a7a3a;font-weight:600;}
.mc-opt.wrong{border-color:#C0272D;background:#fde8e8;color:#a01820;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>

var ST={};
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rPick(a){return a[Math.floor(Math.random()*a.length)];}
function tryIt(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTry(id,fn());
}
function genTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="ar"><input type="number" step="any" placeholder="Your answer" id="'+id+'_i"/>'+
    '<button class="ck" onclick="ck(\''+id+'\')">&#10003; Check</button></div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show working</summary><div class="wk-b">'+
    (h?'<ul class="hl">'+h+'</ul>':'')+
    '<div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'">New question</button></div>';
}
function ck(id){
  var fn=ST[id];var o=typeof fn==='function'?fn():fn;
  var v=parseFloat(document.getElementById(id+'_i').value);
  var f=document.getElementById(id+'_f');
  if(isNaN(v)){f.className='fb er';f.textContent='Please enter a number.';return;}
  var tol=o.tol!==undefined?o.tol:0.5;
  if(Math.abs(v-o.ans)<=tol){
    f.className='fb ok';f.textContent='\u2713 Correct! Answer: '+o.ans+(o.unit?' '+o.unit:'');
  }else{f.className='fb er';f.textContent='Not quite \u2014 check your working and try again.';}
}
function tryItMC(fn){
  var id='t'+Math.random().toString(36).slice(2);
  ST[id]=fn;return genTryMC(id,fn());
}
function genTryMC(id,o){
  var order=o.options.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=order[i];order[i]=order[j];order[j]=tmp;
  }
  var newCorrect=order.indexOf(o.correct);
  var opts=order.map(function(origIdx,shownIdx){
    return '<button class="mc-opt" onclick="ckMC(\''+id+'\','+shownIdx+','+newCorrect+')">'+o.options[origIdx]+'</button>';
  }).join('');
  return '<div class="try" data-tryid="'+id+'">'+
    '<div class="try-t">&#10004; Your Turn</div><p>'+o.question+'</p>'+
    '<div class="mc-opts" id="'+id+'_opts">'+opts+'</div>'+
    '<div class="fb" id="'+id+'_f"></div>'+
    '<details class="wk"><summary>Show answer</summary><div class="wk-b"><div class="wk-ans">'+o.working+'</div></div></details>'+
    '<button class="nq" data-tryid="'+id+'_mc">New question</button></div>';
}
function ckMC(id,chosen,correct){
  var opts=document.getElementById(id+'_opts').querySelectorAll('.mc-opt');
  opts.forEach(function(b,i){
    if(i===correct)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
    b.disabled=true;
  });
  var f=document.getElementById(id+'_f');
  if(chosen===correct){f.className='fb ok';f.textContent='\u2713 Correct!';}
  else{f.className='fb er';f.textContent='Not quite \u2014 the correct answer is highlighted in green.';}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.nq');if(!b)return;
  var rawId=b.getAttribute('data-tryid');
  var id=rawId.replace('_mc','');
  var fn=ST[id];if(typeof fn!=='function')return;
  var wrap=b.closest('.try');if(!wrap)return;
  var isMC=(rawId.indexOf('_mc')>=0);
  var fresh=isMC?genTryMC(id,fn()):genTry(id,fn());
  var tmp=document.createElement('div');tmp.innerHTML=fresh;
  wrap.parentNode.replaceChild(tmp.firstChild,wrap);
});
function g(){return document.getElementById('dg');}
function T(x,y,t,c,sz,a,b){c=c||'#333';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(b?700:400)+'">'+t+'</text>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function R(x,y,w,h,fill,stroke,sw,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'" rx="'+(rx||0)+'"/>';}
function circ(cx,cy,r,fill,stroke,sw){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function ellipse(cx,cy,rx,ry,fill,stroke,sw){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'#333')+'" stroke-width="'+(sw||2)+'"/>';}
function arr(x1,y1,x2,y2,c,w){
  c=c||'#555';w=w||1.5;
  var ang=Math.atan2(y2-y1,x2-x1);
  var hs=8;
  var p1x=x2-hs*Math.cos(ang-0.4),p1y=y2-hs*Math.sin(ang-0.4);
  var p2x=x2-hs*Math.cos(ang+0.4),p2y=y2-hs*Math.sin(ang+0.4);
  return L(x1,y1,x2,y2,c,w)+'<polygon points="'+x2+','+y2+' '+p1x.toFixed(1)+','+p1y.toFixed(1)+' '+p2x.toFixed(1)+','+p2y.toFixed(1)+'" fill="'+c+'"/>';
}


var QS=[
{ey:'Y9 Chemistry \u2022 Q1',ti:'Ionic Bonding Revisited',su:'Electron transfer and dot-cross diagrams',steps:[
{sl:'Dot-and-cross diagrams',p:'<b>Dot-and-cross diagrams</b> show electron transfer in ionic bonding. Electrons from one atom are shown as dots, the other as crosses, so you can track where each electron came from.<br><br>Only the <b>outer shell</b> electrons are shown.',

{sl:'Ionic compound formulae',p:'The formula of an ionic compound balances the charges so the overall charge is zero:<br><br>Na\u207a + Cl\u207b \u2192 NaCl (1:1 ratio)<br>Mg\u00b2\u207a + 2Cl\u207b \u2192 MgCl\u2082 (1:2 ratio, since Mg loses 2 electrons but Cl only takes 1)<br>Ca\u00b2\u207a + O\u00b2\u207b \u2192 CaO (1:1, charges already balance)',
draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
var examples=[['Na\u207a + Cl\u207b','NaCl','#1565C0'],['Mg\u00b2\u207a + 2Cl\u207b','MgCl\u2082','#C0272D'],['Ca\u00b2\u207a + O\u00b2\u207b','CaO','#2E7D32'],['Al\u00b3\u207a + 3Cl\u207b','AlCl\u2083','#6A1B9A']];
examples.forEach(function(e,i){o.push(R(20,30+i*60,440,45,e[2]+'18',e[2],1.5,4));o.push(T(120,58+i*60,e[0],e[2],11,'start',true));o.push(arr(250,52+i*60,290,52+i*60,'#555',1.5));o.push(T(370,58+i*60,e[1],e[2],14,'middle',true));});
s.innerHTML=o.join('');}},
{sl:'Properties from structure',p:'Ionic compounds have a <b>giant ionic lattice</b> structure:<br><br>\u2022 <b>High melting/boiling points</b>: strong electrostatic forces between ions in all directions<br>\u2022 <b>Conduct electricity</b> when molten/dissolved (ions free to move)<br>\u2022 <b>Brittle</b>: layers shift under force, like-charges align and repel, shattering the lattice',
draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
o.push(T(140,22,'Undisturbed lattice','#2E7D32',10,'middle',true));
for(var r=0;r<4;r++)for(var c=0;c<4;c++){var isPos=(r+c)%2===0;o.push(circ(40+c*35,50+r*30,12,isPos?'#fde8e8':'#e8f5e9',isPos?'#C0272D':'#2E7D32',1));}
o.push(T(360,22,'Force applied: layer shifts','#C0272D',10,'middle',true));
for(var r2=0;r2<4;r2++)for(var c2=0;c2<4;c2++){var isPos2=(r2+c2)%2===0;var shift=(r2>=2)?20:0;o.push(circ(260+c2*35+shift,50+r2*30,12,isPos2?'#fde8e8':'#e8f5e9',isPos2?'#C0272D':'#2E7D32',1));}
o.push(arr(310,180,310,210,'#C0272D',2));o.push(T(310,225,'force','#C0272D',9,'middle',false));
o.push(T(360,260,'Like charges align \u2192 repel \u2192 shatters','#C0272D',9,'middle',false));
s.innerHTML=o.join('');}},
{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What is the formula for the ionic compound formed between Mg\u00b2\u207a and Cl\u207b?',options:['MgCl\u2082','MgCl','Mg\u2082Cl','MgCl\u2083'],correct:0,working:'Magnesium loses 2 electrons (Mg\u00b2\u207a) but each chloride ion only gains 1 (Cl\u207b). To balance the charge, you need <b>2 chloride ions</b> for every magnesium ion: <b>MgCl\u2082</b>.'},{question:'Why are ionic compounds brittle?',options:['When force is applied, layers shift so like-charged ions align and repel, shattering the lattice','Ionic bonds are inherently weak','The ions are too heavy','Ionic compounds have no internal structure'],correct:0,working:'Applying force shifts layers of ions. This can bring <b>same-charged ions next to each other</b>, causing strong repulsion that shatters the lattice along that plane \u2014 making ionic solids brittle.'},{question:'In a dot-and-cross diagram, what do the dots and crosses represent?',options:['Electrons from each different atom, tracked to show their origin','Protons and neutrons','Different elements','The charge of each ion'],correct:0,working:'Dots and crosses both represent <b>electrons</b>, but using different symbols allows you to track which atom each electron originally came from during the bonding process.'},{question:'How does an ionic bond form between a metal and a non-metal?',options:['The metal atom loses electrons to form a positive ion, and the non-metal gains them to form a negative ion; opposite charges attract','Both atoms share electrons equally','Both atoms lose electrons','Neither atom\'s electron arrangement changes'],correct:0,working:'In <b>ionic bonding</b>, metal atoms lose outer electrons to become positive ions (cations), and non-metal atoms gain those electrons to become negative ions (anions). The oppositely charged ions attract strongly.'},{question:'Why do ionic compounds have high melting and boiling points?',options:['Strong electrostatic forces of attraction between oppositely charged ions require a lot of energy to overcome','Ionic compounds have weak forces between molecules','Ionic bonds are easily broken with little energy','Ionic compounds contain no charged particles'],correct:0,working:'Ionic compounds form a <b>giant ionic lattice</b> held together by strong electrostatic attraction between oppositely charged ions in all directions, requiring a lot of energy to break — hence high melting/boiling points.'},{question:'Why do ionic compounds conduct electricity when molten or dissolved, but not when solid?',options:['Ions are free to move and carry charge when molten/dissolved, but are fixed in place in the solid lattice','Ionic compounds never conduct electricity in any state','Solid ionic compounds always conduct electricity','Ions disappear when the compound is solid'],correct:0,working:'In the solid state, ions are held in fixed positions in the <b>lattice</b> and cannot move to carry charge. When molten or dissolved in water, the ions become free to move, allowing the compound to <b>conduct electricity</b>.'},{question:'What is the formula for the ionic compound formed between Na⁺ and O²⁻?',options:['Na₂O','NaO','Na₂O₂','NaO₂'],correct:0,working:'To balance charges: two Na⁺ ions (+2 total) balance one O²⁻ ion (−2), giving the formula <b>Na₂O</b>.'},{question:'What is the formula for the ionic compound formed between Al³⁺ and O²⁻?',options:['Al₂O₃','AlO','Al₃O₂','AlO₃'],correct:0,working:'To balance charges, the lowest common multiple of 3 and 2 is 6: two Al³⁺ ions (+6) balance three O²⁻ ions (−6), giving <b>Al₂O₃</b>.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

]},
{ey:'Y9 Chemistry \u2022 Q2',ti:'Covalent Bonding Revisited',su:'Sharing electrons, dot-cross diagrams',steps:[

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'How many electron pairs are shared in a triple covalent bond?',options:['3','1','2','4'],correct:0,working:'A <b>triple bond</b> involves 3 shared pairs of electrons (6 electrons total) \u2014 found in molecules like N\u2261N (nitrogen gas), which is why nitrogen gas is so unreactive.'},{question:'Why does diamond have an extremely high melting point?',options:['It is a giant covalent structure with strong covalent bonds throughout, requiring huge energy to break','Diamond is the heaviest substance','Diamond molecules are very large but weakly bonded','Diamond has metallic bonding'],correct:0,working:'Diamond is a <b>giant covalent structure</b> where every carbon atom is covalently bonded to 4 others in a continuous 3D network. Breaking it requires breaking many strong covalent bonds, requiring enormous energy.'},{question:'Why can graphite conduct electricity while diamond cannot?',options:['Graphite has delocalised electrons that can move between layers; diamond has all electrons in fixed covalent bonds','Graphite is a metal','Diamond has more carbon atoms','Graphite has ionic bonds'],correct:0,working:'In graphite, each carbon only bonds to 3 others, leaving one <b>delocalised electron per atom</b> that can move freely between layers, allowing electrical conduction. In diamond, all 4 electrons are used in fixed covalent bonds.'},{question:'What is a covalent bond?',options:['A shared pair of electrons between two non-metal atoms','The complete transfer of electrons from one atom to another','A bond only found between metal atoms','An attraction between a positive and negative ion'],correct:0,working:'A <b>covalent bond</b> forms when two non-metal atoms share a pair of electrons, with both atoms attracted to the shared pair, holding the atoms together.'},{question:'How many electrons are shared in a single covalent bond?',options:['2 (one pair)','4 (two pairs)','6 (three pairs)','1'],correct:0,working:'A <b>single covalent bond</b> consists of one shared pair of electrons — 2 electrons in total, one contributed by each atom.'},{question:'Why do simple covalent (molecular) substances, like water, have low melting and boiling points?',options:['The weak intermolecular forces between molecules require little energy to overcome, even though the covalent bonds within molecules are strong','The covalent bonds within the molecule are very weak','There are no forces at all between molecules','Simple molecular substances are always giant structures'],correct:0,working:'In simple molecular substances, the covalent bonds within each molecule are strong, but the <b>forces between separate molecules</b> are much weaker, requiring little energy to overcome — giving low melting/boiling points.'},{question:'Why is diamond used in cutting tools despite being a form of carbon?',options:['Its rigid giant covalent structure with strong bonds in all directions makes it extremely hard','Diamond has weak bonds that make it flexible','Diamond conducts electricity, making it useful for cutting','Diamond has a layered structure like graphite'],correct:0,working:'Diamond\'s giant covalent lattice has strong covalent bonds in <b>all directions</b> (unlike graphite\'s layers), making it extremely hard — ideal for cutting tools and drill tips.'},{question:'What do diamond and graphite have in common, despite their very different properties?',options:['Both are giant covalent structures made entirely of carbon atoms','Both conduct electricity equally well','Both are soft and slippery','Both have low melting points'],correct:0,working:'Diamond and graphite are both <b>allotropes of carbon</b> — different structural forms of the same element — but their different bonding arrangements give them very different properties.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

{ey:'Y9 Chemistry \u2022 Q3',ti:'Metallic Bonding',su:'Sea of delocalised electrons',steps:[
{sl:'The metallic bonding model',p:'<b>Metallic bonding</b> consists of a <b>lattice of positive metal ions</b> surrounded by a "sea" of <b>delocalised electrons</b> that are free to move throughout the structure.<br><br>The strong electrostatic attraction between positive ions and the negative electron sea holds the metal together.',

{sl:'Properties of metals explained',p:'Metallic bonding explains metal properties:<br><br>\u2022 <b>Conduct electricity</b>: delocalised electrons carry charge<br>\u2022 <b>Conduct heat</b>: free electrons transfer kinetic energy quickly<br>\u2022 <b>Malleable/ductile</b>: layers of ions can slide without breaking bonds (electron sea adjusts)<br>\u2022 <b>High melting points</b> (usually): strong metallic bonds throughout',

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What is the structure of a metal according to the metallic bonding model?',options:['A lattice of positive ions surrounded by a sea of delocalised electrons','A lattice of neutral atoms','A lattice of negative ions with positive electrons','Individual molecules held by weak forces'],correct:0,working:'Metallic bonding consists of a <b>regular lattice of positive metal ions</b> with delocalised (free-moving) electrons spread throughout, like a "sea" surrounding the ions.'},{question:'Why do metals conduct electricity?',options:['The delocalised electrons are free to move and carry electrical charge through the structure','Metal ions carry the current','Metals have no electrons','Electricity passes through gaps in the lattice'],correct:0,working:'The <b>delocalised electrons</b> in the "sea" are not bound to any particular ion, so they can move freely throughout the metal, carrying electrical current when a voltage is applied.'},{question:'Why are metals malleable (can be hammered into shape) but ionic compounds are brittle?',options:['In metals, layers of ions slide without breaking bonds (electron sea adjusts); in ionic compounds, shifting causes like-charges to repel and shatter','Metals are softer materials overall','Ionic compounds have stronger bonds','Metals have fewer electrons'],correct:0,working:'In metals, the non-directional electron sea means ion layers can <b>slide past each other</b> without breaking the metallic bond. In ionic lattices, shifting layers brings <b>like-charged ions together</b>, causing repulsion and fracturing.'},{question:'Why do metals have high melting and boiling points?',options:['Strong electrostatic attraction between positive metal ions and the sea of delocalised electrons requires a lot of energy to overcome','Metallic bonds are very weak','Metals have no bonding between atoms','Delocalised electrons repel the metal ions, weakening the structure'],correct:0,working:'<b>Metallic bonding</b> involves strong electrostatic attraction between positive metal ions and delocalised electrons, requiring significant energy to break — giving metals generally high melting/boiling points.'},{question:'Why are metals good conductors of heat?',options:['Delocalised electrons can move freely, transferring thermal energy quickly through the structure','Metal ions vibrate but cannot transfer energy','Metals have no free-moving particles','Heat cannot pass through metallic structures'],correct:0,working:'The <b>delocalised electrons</b> in a metal can move freely and transfer kinetic (thermal) energy quickly throughout the structure, making metals good conductors of heat.'},{question:'Why is pure iron softer than the alloy steel?',options:['Pure iron\'s atoms are all the same size, arranged in regular layers that slide easily; carbon atoms in steel disrupt this','Pure iron has stronger covalent bonds than steel','Steel has no delocalised electrons','Pure iron has no metallic bonding at all'],correct:0,working:'Pure iron has atoms of a uniform size arranged in <b>regular layers</b> that can slide over each other relatively easily. Adding carbon (making steel) disrupts this regularity, making the layers harder to slide, so steel is harder.'},{question:'What gives metals their shiny (lustrous) appearance?',options:['Delocalised electrons at the surface reflect light','Metals absorb all light, appearing shiny','Metallic ions are transparent','Metals have no interaction with light'],correct:0,working:'The sea of <b>delocalised electrons</b> at a metal\'s surface reflects light effectively, giving metals their characteristic shiny, lustrous appearance.'},{question:'What is the structure of a metal, in terms of ions and electrons?',options:['A lattice of positive metal ions surrounded by a sea of delocalised (free) electrons','A lattice of neutral atoms with no charged particles','Individual molecules held by weak forces','Alternating positive and negative ions'],correct:0,working:'Metals consist of a regular lattice of <b>positive metal ions</b>, with their outer electrons delocalised — free to move throughout the whole structure rather than belonging to one atom.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];
o.push(T(240,30,'Metallic bonding summary','#6A1B9A',12,'middle',true));
var rows=[['Structure','Positive ion lattice + delocalised electrons','#1565C0'],['Conducts electricity/heat','Free electrons carry charge/energy','#C0272D'],['Malleable/ductile','Layers slide, bonds unaffected','#2E7D32'],['Strength','Strong electrostatic attraction throughout','#C8922A']];
rows.forEach(function(r,i){o.push(R(20,65+i*52,440,38,r[2]+'18',r[2],1.5,4));o.push(T(140,89+i*52,r[0],r[2],10,'start',true));o.push(T(330,89+i*52,r[1],'#555',8,'middle',false));});
s.innerHTML=o.join('');}}
]},

{sl:'Try it',p:''+tryItMC(function(){var qs=[{question:'What type of bonding occurs in copper sulfate (CuSO\u2084), a compound of a metal and non-metals?',options:['Ionic bonding (between the metal ion and the sulfate ion)','Covalent bonding throughout','Metallic bonding','No bonding occurs'],correct:0,working:'Copper sulfate contains <b>Cu\u00b2\u207a ions</b> ionically bonded to <b>SO\u2084\u00b2\u207b ions</b> (though within the sulfate ion itself, sulfur and oxygen are covalently bonded \u2014 it\'s a polyatomic ion).'},{question:'Which property is characteristic of metallic bonding but NOT ionic or simple covalent bonding?',options:['Conducts electricity in the solid state','High melting point','Conducts when molten','Forms a regular lattice'],correct:0,working:'Metals uniquely conduct electricity <b>in the solid state</b> because delocalised electrons can move freely even without melting. Ionic compounds only conduct when molten/dissolved; simple covalent substances don\'t conduct at all.'},{question:'Magnesium oxide (Mg + O) would have which type of bonding?',options:['Ionic (metal + non-metal)','Covalent (non-metal + non-metal)','Metallic (metal + metal)','None of these'],correct:0,working:'Magnesium is a <b>metal</b> and oxygen is a <b>non-metal</b>, so they form an <b>ionic</b> compound (MgO) through electron transfer.'},{question:'A compound made of two non-metals is most likely to have which type of bonding?',options:['Covalent','Ionic','Metallic','No bonding at all'],correct:0,working:'Bonding between two <b>non-metals</b> is generally <b>covalent</b>, involving shared electron pairs, since neither atom will readily lose electrons.'},{question:'Which bonding type is found in pure elements such as iron or copper?',options:['Metallic bonding','Ionic bonding','Simple covalent bonding','No bonding, since these are pure elements'],correct:0,working:'Pure metallic elements like iron and copper have <b>metallic bonding</b> — a lattice of metal ions with delocalised electrons — even without being combined with another element.'},{question:'Which type of substance generally conducts electricity only when molten or dissolved, not as a solid?',options:['Ionic compounds','Simple molecular (covalent) compounds','Metals','Noble gases'],correct:0,working:'<b>Ionic compounds</b> conduct only when molten or dissolved (ions become free to move); as solids, ions are fixed and cannot carry charge.'},{question:'Which type of substance conducts electricity as a solid due to delocalised electrons?',options:['Metals (and graphite/graphene)','Simple molecular compounds','Ionic solids','Giant ionic lattices'],correct:0,working:'<b>Metals</b> (and special forms of carbon like graphite/graphene) conduct electricity as solids because they contain <b>delocalised electrons</b> free to move through the structure.'},{question:'To predict the bonding in a compound, what is the first thing to check?',options:['Whether the elements involved are metals or non-metals','The compound\'s colour','The compound\'s state at room temperature','The compound\'s smell'],correct:0,working:'Checking whether the elements are <b>metals or non-metals</b> (using the Periodic Table) is the quickest way to predict bonding: metal+non-metal=ionic, non-metal+non-metal=covalent, metal only=metallic.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

hroughout the lattice'],correct:0,working:'Unlike a single bond between two atoms, an ionic lattice is held together by <b>electrostatic attraction extending in all directions</b> between many neighbouring oppositely charged ions, which is why the whole structure is so strong.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

 have stronger intermolecular forces','It decreases with increasing molecule size','Boiling point is unrelated to molecule size','It stays exactly the same regardless of size'],correct:0,working:'Larger molecules generally have <b>stronger intermolecular forces</b> (more contact area for these forces to act over), so substances made of larger molecules tend to have <b>higher</b> boiling points.'},{question:'Why does ice float on water, despite water being a simple molecular substance?',options:['The specific arrangement of hydrogen bonds in ice creates a slightly less dense, more open structure than liquid water','Ice is a giant covalent structure, unlike water','Ice has stronger covalent bonds than liquid water','Ice contains free ions that make it float'],correct:0,working:'In ice, water molecules are held in a fairly open hydrogen-bonded lattice, which is slightly less dense than liquid water, so <b>ice floats</b> — an unusual property among molecular substances.'},{question:'Why is bromine a liquid at room temperature while chlorine is a gas, despite both being simple molecular halogens?',options:['Bromine molecules are larger, with stronger intermolecular forces, giving a higher boiling point than chlorine','Bromine has stronger covalent bonds within its molecules','Chlorine molecules are heavier than bromine','Bromine is an ionic compound, unlike chlorine'],correct:0,working:'<b>Bromine</b> has larger molecules than chlorine, giving stronger intermolecular forces and a higher boiling point — so it remains liquid at room temperature, while chlorine (weaker forces) is a gas.'},{question:'If substance X is a simple molecular compound, would you expect it to be soluble in water?',options:['It depends on the polarity of the molecule; polar molecules tend to dissolve in water, non-polar ones typically do not','All simple molecular compounds always dissolve in water','No simple molecular compound can ever dissolve in water','Solubility is unrelated to molecular structure'],correct:0,working:'Solubility depends on the molecule\'s polarity: <b>polar</b> molecules (like ethanol) tend to be soluble in water, while <b>non-polar</b> molecules (like oils) typically are not.'},{question:'Why do simple molecular substances tend to be gases or liquids at room temperature, rather than solids?',options:['Weak intermolecular forces mean relatively little thermal energy is needed to separate the molecules into a liquid or gas state','Their covalent bonds are too weak to hold a solid shape','They contain no particles capable of forming a solid','All simple molecular substances are solids at room temperature'],correct:0,working:'Because only <b>weak intermolecular forces</b> need to be overcome, many simple molecular substances have low melting/boiling points, so they exist as gases or liquids at typical room temperature.'}];return rPick(qs);}),draw:function(){var s=g();s.setAttribute('viewBox','0 0 480 300');var o=[];

 further corrosion','Copper reacts instantly and destroys the whole structure','Copper does not react with air at all, ever','The green colour is just paint, not a chemical reaction'],correct:0,working:'Copper reacts slowly with oxygen, water and carbon dioxide in the air to form a green <b>patina</b> (copper carbonate), which then protects the metal underneath from further corrosion.'},{question:'Why is platinum, a very unreactive metal, used in jewellery and some chemical equipment?',options:['It resists corrosion and tarnishing, keeping its appearance and usefulness over a long time','It is highly reactive, forming useful compounds','It conducts electricity poorly, making it safe','Platinum dissolves easily in water'],correct:0,working:'<b>Platinum</b> is very unreactive (low in the reactivity series), so it resists tarnishing and corrosion, making it valuable for long-lasting jewellery and durable lab equipment.'},{question:'Why do old iron railings need regular painting, while stainless steel railings do not?',options:['Iron reacts with oxygen and water to rust unless protected; stainless steel already resists rusting due to its chromium content','Painting has no effect on rusting','Stainless steel rusts faster than iron','Iron does not react with oxygen at all'],correct:0,working:'Plain <b>iron</b> reacts with oxygen and water to rust, so it needs a protective layer like paint. <b>Stainless steel</b> already resists rusting thanks to chromium forming a protective oxide layer, so it needs no extra protection.'},{question:'Why might a very reactive metal not be suitable for making coins or jewellery, even if it looks attractive when freshly cut?',options:['It would quickly react with air and moisture, tarnishing or corroding and losing its appearance','Reactive metals are always too expensive to use','Reactive metals cannot be shaped into coins','Reactive metals conduct electricity too well for jewellery'],correct:0,working:'A very reactive metal would react wit   QS.forEach(function(q,i){

  var q=QS[qi],st=q.steps[si];
  document.getElementById('ey').textContent=q.ey;

  document.getElementById('pn').innerHTML='<div class="sl">'+st.sl+'</div><div>'+st.p+'</div>';

  document.getElementById('pb').disabled=(qi===0&&si===0);
  var last=(qi===QS.length-1&&si===q.steps.length-1);
  document.getElementById('nb').textContent=last?'Finished \u2713':'Next \u2192';
  document.getElementById('nb').disabled=false;
  document.querySelectorAll('.qb').forEach(function(b,i){b.classList.toggle('on',i===qi);});
}
document.getElementById('nb').onclick=function(){
  var q=QS[qi];
  if(si<q.steps.length-1){si++;}

};
document.getElementById('pb').onclick=function(){

  else if(qi>0){qi--;si=QS[qi].steps.length-1;}
  render();
};
