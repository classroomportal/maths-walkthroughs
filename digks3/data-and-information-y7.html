<style>
:root{--red:#37474F;--dark:#263238;--cream:#ECEFF1;--ink:#0d1b2a;--line:#CFD8DC;--gold:#00ACC1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,var(--cream));padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.mc-opt{text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s;}
.mc-opt:hover:not(:disabled){border-color:var(--gold);background:#f0fbfc;}
.mc-opt:disabled{cursor:default;opacity:.9;}
.mc-opt.mc-correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;font-weight:600;}
.mc-opt.mc-wrong{border-color:#c62828;background:#fde8e8;color:#a01820;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e0f7fa;color:#00838f;border:1px solid #80deea;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#00838f;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#37474F',DARK='#263238',CRM='#ECEFF1',LINE='#CFD8DC';
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}

var ST={};
function tryItMC(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn,mc:true};return buildTryMC(id,o);}
function buildTryMC(id,o){
  var opts=(o.options||[]).map(function(opt,i){return '<button class="mc-opt" data-tryid="'+id+'" data-idx="'+i+'">'+opt+'</button>';}).join('');
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="mc-opts">'+opts+'</div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary><div class="wk-b">'+o.working+'</div></details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');
    tmp.innerHTML=buildTryMC(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn,mc:true};return;
  }
  if(el.classList.contains('mc-opt')){
    if(el.disabled)return;
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var idx=parseInt(el.getAttribute('data-idx'),10);
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!fb)return;
    var allBtns=document.querySelectorAll('.mc-opt[data-tryid="'+id+'"]');
    allBtns.forEach(function(b){b.disabled=true;});
    if(idx===o.correct){
      el.classList.add('mc-correct');
      fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;
    }else{
      el.classList.add('mc-wrong');
      allBtns[o.correct].classList.add('mc-correct');
      fb.className='try-fb er';fb.textContent='Not quite \u2014 the correct answer is highlighted above.';
    }
  }
});

function makeDiagram(title, points){
  return function(p){
    var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
    o.push(T(240,20,title,ACC,12,'middle',true));
    points.forEach(function(txt,i){
      if(p>=i){
        var y=36+i*44;
        o.push(R(10,y,460,38,i===p?LINE:CRM,ACC,i===p?2:1));
        o.push(T(240,y+23,txt,DARK,10,'middle',false));
      }
    });
    s.innerHTML=o.join('');
  };
}

  {lb:'Key details',dr:dQ7,ht:'<p>Bar charts compare categories; line graphs show trends over time.</p>'},
  {lb:'How it works',dr:dQ7,ht:'<p>Pie charts show proportions of a whole.</p>'},

  {lb:'Your turn',dr:dQ7,ht:tryItMC(function(){var qs=[{"q": "Why do we use charts and graphs?", "o": ["To help humans understand large datasets quickly", "To make data harder to understand", "To replace the need for data collection", "To slow down computer processing"], "a": 0, "w": "Charts and graphs help humans understand large datasets quickly, at a glance."}, {"q": "Which chart type is best for comparing different categories?", "o": ["Line graph", "Bar chart", "A single number", "A random list"], "a": 1, "w": "Bar charts are best for comparing categories, such as different products or groups."}, {"q": "Which chart type shows proportions of a whole?", "o": ["Bar chart", "Line graph", "Pie chart", "A spreadsheet formula"], "a": 2, "w": "Pie charts show proportions of a whole, like percentages that add up to 100%."}, {"q": "What should good data visualisation avoid?", "o": ["Using any colour at all", "Using bar charts", "Showing more than one data point", "Misleading scales or confusing colours"], "a": 3, "w": "Good visualisation avoids misleading scales or confusing colours, which can distort how the data is understood."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})}
]},
{ey:'Q8 \u2022 Digital Technologies \u2022 Data & Safety',ti:'Data Privacy Basics',su:'Learn about Data Privacy Basics and test your understanding.',steps:[
  {lb:'The basics',dr:dQ8,ht:'<p>Personal data includes your name, address, photos, and online activity.</p>'},
  {lb:'Key details',dr:dQ8,ht:'<p>Companies collect data about users, often to personalise services or ads.</p>'},
  {lb:'How it works',dr:dQ8,ht:'<p>Data protection laws (like Nigeria\'s NDPA) regulate how personal data is used.</p>'},

  {lb:'Your turn',dr:dQ8,ht:tryItMC(function(){var qs=[{"q": "Which of these counts as personal data?", "o": ["Your name, address and photos", "The current time in London", "The number of days in a year", "A generic weather forecast"], "a": 0, "w": "Personal data includes your name, address, photos, and online activity \u2014 anything that identifies you."}, {"q": "Why do companies often collect data about users?", "o": ["Because it is legally required to do nothing with it", "To personalise services or advertising", "To slow down their own websites", "Purely for decoration"], "a": 1, "w": "Companies collect data about users, often to personalise services or advertising to them."}, {"q": "What is the purpose of data protection laws like Nigeria's NDPA?", "o": ["To speed up broadband connections", "To ban the internet in Nigeria", "To regulate how personal data is used", "To design new gaming consoles"], "a": 2, "w": "The Nigeria Data Protection Act (NDPA) regulates how organisations collect and use personal data."}, {"q": "What should you do before sharing personal data online?", "o": ["Share it immediately without thinking", "Assume it is never stored anywhere", "Only share it with strangers", "Think carefully about who will see it and why"], "a": 3, "w": "You should think carefully before sharing personal data online, since it can be seen and stored by others."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})}
]},
{ey:'Q9 \u2022 Digital Technologies \u2022 Data & Safety',ti:'Keeping Data Safe',su:'Learn about Keeping Data Safe and test your understanding.',steps:[
  {lb:'The basics',dr:dQ9,ht:'<p>Passwords, encryption and backups all help protect data.</p>'},
  {lb:'Key details',dr:dQ9,ht:'<p>Never share your password with friends, even ones you trust.</p>'},
  {lb:'How it works',dr:dQ9,ht:'<p>Two-factor authentication (2FA) adds an extra layer of security.</p>'},
  {lb:'Why it matters',dr:dQ9,ht:'<p>Losing data can be prevented by regular, automatic backups.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryItMC(function(){var qs=[{"q": "Which of these helps protect your data?", "o": ["Using a strong password, encryption and backups", "Sharing your password with close friends", "Writing your password on a sticky note", "Turning off all security features"], "a": 0, "w": "Passwords, encryption and backups all help protect data from being lost or accessed by others."}, {"q": "Should you ever share your password with a trusted friend?", "o": ["Yes, it's fine if you trust them completely", "No, never \u2014 even with people you trust", "Only on weekends", "Only if they ask nicely"], "a": 1, "w": "You should never share your password with friends, even ones you trust, to keep your account secure."}, {"q": "What does two-factor authentication (2FA) add to account security?", "o": ["A bigger storage limit", "A faster internet connection", "A second layer of proof of identity beyond just a password", "Nothing useful"], "a": 2, "w": "2FA requires a second form of verification, like a code sent to your phone, adding protection beyond a password."}, {"q": "How can you prevent losing important data?", "o": ["By never saving any files", "By sharing files publicly online", "By deleting old files regularly", "With regular, automatic backups"], "a": 3, "w": "Losing data can be prevented by regular, automatic backups, which create safe copies of your files."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})}
]},
{ey:'Q10 \u2022 Digital Technologies \u2022 Data & Safety',ti:'Data in Everyday Life',su:'Learn about Data in Everyday Life and test your understanding.',steps:[
  {lb:'The basics',dr:dQ10,ht:'<p>Data drives recommendations on YouTube, Netflix, and social media.</p>'},
  {lb:'Key details',dr:dQ10,ht:'<p>Banks use data to detect fraud and unusual spending patterns.</p>'},
  {lb:'How it works',dr:dQ10,ht:'<p>Hospitals use patient data to improve treatment and track outcomes.</p>'},
  {lb:'Why it matters',dr:dQ10,ht:'<p>Understanding how data is used helps you be a more informed digital citizen.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryItMC(function(){var qs=[{"q": "What drives recommendations on platforms like YouTube and Netflix?", "o": ["Data about what you've watched or listened to", "A random selection process", "The time of day only", "The device you are using only"], "a": 0, "w": "Data drives recommendations on YouTube, Netflix, and social media, based on your past activity."}, {"q": "What might a bank use unusual spending pattern data for?", "o": ["Sending you more adverts", "Detecting potential fraud", "Choosing your phone wallpaper", "Increasing screen brightness"], "a": 1, "w": "Banks analyse spending pattern data to detect fraud, flagging unusual transactions for review."}, {"q": "How do hospitals commonly use patient data?", "o": ["To set staff working hours only", "To design hospital buildings", "To improve treatment and track outcomes", "To sell to advertisers"], "a": 2, "w": "Hospitals use patient data to improve treatment and track outcomes for patients."}, {"q": "Why does this lesson say it's important to understand how data is used?", "o": ["It has no real importance", "It only matters for adults, not students", "It is only relevant to computer scientists", "It helps you be a more informed digital citizen"], "a": 3, "w": "Understanding how data is used helps you be a more informed digital citizen in an increasingly data-driven world."}];var q=qs[Math.floor(Math.random()*qs.length)];return{question:q.q,options:q.o,correct:q.a,working:q.w};})}
]}
