<style>
:root{--red:#6A1B9A;--dark:#4a148c;--cream:#F3E5F5;--ink:#0d1b2a;--line:#E1BEE7;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F3E5F5);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#f3e5f5;color:#4a148c;border:1px solid #ce93d8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F3E5F5';stroke=stroke||'#6A1B9A';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#6A1B9A')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#6A1B9A')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F3E5F5')+'" stroke="'+(stroke||'#6A1B9A')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Reactivity series','#6A1B9A',13,'middle',true));
var metals=['K','Na','Ca','Mg','Al','(C)','Zn','Fe','(H)','Cu','Ag','Au'];
var labels=['potassium','sodium','calcium','magnesium','aluminium','carbon','zinc','iron','hydrogen','copper','silver','gold'];
metals.forEach(function(m,i){if(i<p+2){var y=36+i*18;o.push(R(10,y-1,460,16,(i<5?'#F3E5F5':i<8?'#f3f3f3':'#fff'),'#E1BEE7',0.5));o.push(T(60,y+11,m,'#6A1B9A',10,'middle',true));o.push(T(200,y+11,labels[i],'#333',9,'middle',false));}});
if(p>=5)o.push(T(360,130,'Most reactive','#C0272D',9,'start',false));
if(p>=8)o.push(T(360,220,'Least reactive','#2E7D32',9,'start',false));
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Metal extraction methods','#6A1B9A',12,'middle',true));
[['Method','When used','Examples'],['Electrolysis','metals above carbon in reactivity series','Al, Na, Ca, Mg, K'],['Reduction with carbon','metals below carbon, above hydrogen','Fe, Zn (in blast furnace)'],['Heating alone / found free','metals below hydrogen','Cu (some), Ag, Au, Pt']].forEach(function(r,i){if(i<p+1){o.push(R(10,42+i*56,460,48,'#F3E5F5','#E1BEE7',1));r.forEach(function(v,j){o.push(T(80+j*160,62+i*56,v,'#6A1B9A',i===0?9:8,'middle',i===0));o.push(T(80+j*160,78+i*56,i>0?'':'' ,'#555',7,'middle',false));});}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Rusting of iron','#6A1B9A',12,'middle',true));
if(p>=1){o.push(R(10,44,460,52,'#fde8e8','#C0272D',1.5));o.push(T(240,64,'Iron + oxygen + water \u2192 hydrated iron(III) oxide (rust)','#C0272D',10,'middle',true));o.push(T(240,82,'BOTH oxygen AND water required','#555',9,'middle',false));}
if(p>=2){o.push(R(10,110,460,52,'#F3E5F5','#6A1B9A',1.5));o.push(T(240,130,'Prevention methods:','#6A1B9A',10,'middle',true));o.push(T(240,148,'Painting \u2022 oiling/greasing \u2022 galvanising (zinc coating) \u2022 tin plating \u2022 stainless steel','#555',9,'middle',false));}
if(p>=3){o.push(R(10,176,460,52,'#e8f5e9','#2E7D32',1.5));o.push(T(240,196,'Sacrificial protection: attach more reactive metal (Mg/Zn)','#2E7D32',10,'middle',false));o.push(T(240,214,'More reactive metal corrodes instead of iron','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ5(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Metals summary','#6A1B9A',13,'middle',true));
[['Reactivity series','K>Na>Ca>Mg>Al>C>Zn>Fe>H>Cu>Ag>Au'],['Displacement','more reactive metal displaces less reactive from solution'],['Extraction','above C: electrolysis. Below C: carbon reduction.'],['Rusting','Fe + O\u2082 + H\u2082O \u2192 rust; both oxygen AND water needed'],['Prevention','paint, galvanise (Zn), tin plate, sacrificial protection'],['Alloys','mixtures of metals; stronger/more useful than pure metals']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*33,460,26,'#F3E5F5','#E1BEE7',1));o.push(T(110,55+i*33,r[0],'#6A1B9A',10,'middle',true));o.push(T(340,55+i*33,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Chemistry \u2022 Metals',ti:'The Reactivity Series',su:'Order metals by reactivity. Predict displacement reactions.',steps:[
  {lb:'Reactivity series',dr:dQ1,ht:'<p>Most to least reactive: K, Na, Ca, Mg, Al, (C), Zn, Fe, (H), Cu, Ag, Au. A more reactive metal <b>displaces</b> a less reactive metal from its salt solution. A more reactive metal reacts more vigorously with acids and water.</p>'},
  {lb:'Displacement',dr:dQ1,ht:'<div class="fm">Fe + CuSO\u2084 \u2192 FeSO\u2084 + Cu</div><p>Iron displaces copper because Fe is more reactive. Copper would NOT displace iron from iron sulfate solution.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var pairs=[{a:'Mg',b:'Zn',amore:true},{a:'Cu',b:'Fe',amore:false},{a:'Zn',b:'Cu',amore:true},{a:'Fe',b:'Mg',amore:false},{a:'Al',b:'Fe',amore:true},{a:'Cu',b:'Ag',amore:true}];var p2=pick(pairs);return{question:p2.a+' is added to a solution of a '+p2.b+' salt. Does displacement occur? 1=yes, 2=no.',hints:['More reactive metal displaces less reactive'],ans:p2.amore?1:2,tol:0,unit:'',working:(p2.amore?'Yes: '+p2.a+' is more reactive than '+p2.b+' \u2192 displaces it.':'No: '+p2.a+' is LESS reactive than '+p2.b+'.')};})},
]},
{ey:'Q2 \u2022 Y11 Chemistry \u2022 Metals',ti:'Metal Extraction',su:'Explain how position in reactivity series determines extraction method.',steps:[
  {lb:'Extraction methods',dr:dQ2,ht:'<p>Above carbon (K, Na, Ca, Mg, Al): too reactive to extract with carbon \u2192 use <b>electrolysis</b> of molten compound. Between carbon and hydrogen (Zn, Fe): extract by <b>reduction with carbon/CO</b> in blast furnace. Below hydrogen (Cu, Ag, Au): found native or easily extracted by <b>heating</b>.</p>'},
  {lb:'Blast furnace (iron)',dr:dQ2,ht:'<p>Iron ore (Fe\u2082O\u2083) reduced by carbon monoxide in blast furnace:</p><div class="fm">Fe\u2082O\u2083 + 3CO \u2192 2Fe + 3CO\u2082</div><p>Limestone added to remove acidic impurities (SiO\u2082) as slag.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Aluminium is extracted by electrolysis (not carbon reduction) because: 1=Al is cheaper to electrolyse, 2=Al is more reactive than carbon and cannot be reduced by it.',a:2,w:'Al above C in reactivity \u2192 C cannot reduce Al\u2082O\u2083. Answer: 2.'},{q:'In the blast furnace, iron ore is reduced by: 1=pure carbon only, 2=carbon monoxide (CO).',a:2,w:'CO is the reducing agent in blast furnace. Answer: 2.'},{q:'Gold is found as a native metal (uncombined) because: 1=it is very cheap, 2=it is very unreactive and does not form compounds easily.',a:2,w:'Unreactive metals exist free in nature. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Above C: electrolysis. Below C: carbon reduction. Unreactive: found free.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y11 Chemistry \u2022 Metals',ti:'Rusting and Corrosion',su:'Explain the conditions for rusting. Describe prevention methods.',steps:[
  {lb:'Rusting',dr:dQ3,ht:'<p>Rusting is the corrosion of iron. Requires BOTH oxygen AND water. Salt water speeds up rusting (electrolyte). The product is hydrated iron(III) oxide (rust, Fe\u2082O\u2083\u00b7nH\u2082O). Rust is brittle and flakes off, exposing more iron.</p>'},
  {lb:'Prevention',dr:dQ3,ht:'<p>Physical barrier: paint, oil, grease, plastic coating, tin plate, chromium plating. Galvanising: coat with zinc (also sacrificial protection). Sacrificial protection: attach zinc or magnesium blocks \u2014 they corrode preferentially. Stainless steel: alloy of Fe + Cr + Ni.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Rusting requires: 1=only water, 2=both oxygen AND water.',a:2,w:'Both O\u2082 and H\u2082O required for rusting. Answer: 2.'},{q:'Sacrificial protection works because: 1=the protective metal is more reactive and corrodes instead of iron, 2=the protective metal is less reactive.',a:1,w:'Mg or Zn are more reactive \u2192 corrode preferentially, protecting iron. Answer: 1.'},{q:'Galvanising is: 1=coating iron with tin, 2=coating iron with zinc.',a:2,w:'Galvanising: zinc coating. Tin plating uses tin. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Rust: O\u2082 + H\u2082O. Sacrificial: more reactive metal corrodes. Galvanise: zinc.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y11 Chemistry \u2022 Metals',ti:'Alloys',su:'Describe why alloys are useful. Give examples.',steps:[
  {lb:'Alloys',dr:dQ4,ht:'<p>An alloy is a mixture of a metal with other elements (metals or non-metals). Atoms of different sizes disrupt the regular lattice \u2192 layers cannot slide easily \u2192 harder and stronger than pure metal.</p><p>Examples: steel (Fe+C), stainless steel (Fe+Cr+Ni), brass (Cu+Zn), bronze (Cu+Sn), solder (Sn+Pb), amalgam (Hg+Ag/Sn).</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Alloys are harder than pure metals because: 1=alloy atoms are larger, 2=different-sized atoms disrupt the regular lattice, preventing layers from sliding.',a:2,w:'Different atomic sizes = distorted lattice = cannot slide easily = harder. Answer: 2.'},{q:'Steel is an alloy of: 1=iron and zinc, 2=iron and carbon.',a:2,w:'Steel: Fe + C (small amount of carbon strengthens iron). Answer: 2.'},{q:'Brass is an alloy of: 1=copper and tin, 2=copper and zinc.',a:2,w:'Brass: Cu + Zn. Bronze: Cu + Sn. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Alloy: different atom sizes \u2192 harder. Steel: Fe+C. Brass: Cu+Zn.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y11 Chemistry \u2022 Metals',ti:'Electrolysis of Aluminium',su:'Describe the extraction of aluminium by electrolysis.',steps:[
  {lb:'Electrolysis of Al\u2082O\u2083',dr:dQ5,ht:'<p>Aluminium extracted from bauxite (Al\u2082O\u2083). Dissolved in molten cryolite (reduces melting point from 2050\u00b0C to ~1000\u00b0C, saving energy). Electrolysed in molten state. Carbon electrodes (anodes replaced frequently as they oxidise).</p><div class="fm">Cathode: Al\u00b3\u207a + 3e\u207b \u2192 Al (reduction)</div><div class="fm">Anode: 2O\u00b2\u207b \u2192 O\u2082 + 4e\u207b (oxidation)</div>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Cryolite is used in aluminium extraction to: 1=increase the melting point of Al\u2082O\u2083, 2=lower the melting point and save energy.',a:2,w:'Cryolite dissolves Al\u2082O\u2083 and lowers melting point \u2192 saves energy. Answer: 2.'},{q:'At the cathode during Al electrolysis: 1=Al\u00b3\u207a ions are reduced to Al, 2=O\u00b2\u207b ions are oxidised.',a:1,w:'Cathode = reduction. Al\u00b3\u207a + 3e\u207b \u2192 Al. Answer: 1.'},{q:'Why are carbon anodes replaced frequently? 1=they conduct too well, 2=they react with oxygen and burn away.',a:2,w:'Anode O\u2082 reacts with C: C + O\u2082 \u2192 CO\u2082, burning the anode. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Cryolite: lowers melting point. Cathode: Al deposited. Anode: burns away.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y11 Chemistry \u2022 Metals',ti:'Reactions of Metals with Acids',su:'Write equations for metal + acid reactions.',steps:[
  {lb:'Metal + acid',dr:dQ6,ht:'<p>Metal + acid \u2192 salt + hydrogen gas. Only metals above hydrogen in the reactivity series react with dilute acids. Very reactive metals (K, Na) react explosively. Copper, silver, gold do NOT react with dilute acids.</p><div class="fm">Mg + H\u2082SO\u2084 \u2192 MgSO\u2084 + H\u2082</div><div class="fm">Zn + 2HCl \u2192 ZnCl\u2082 + H\u2082</div>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var reactions=[{metal:'Mg',acid:'H\u2082SO\u2084',salt:'MgSO\u2084',reacts:true},{metal:'Cu',acid:'HCl',salt:'CuCl\u2082',reacts:false},{metal:'Fe',acid:'HCl',salt:'FeCl\u2082',reacts:true},{metal:'Ag',acid:'H\u2082SO\u2084',salt:'Ag\u2082SO\u2084',reacts:false},{metal:'Zn',acid:'HCl',salt:'ZnCl\u2082',reacts:true}];var r=pick(reactions);return{question:r.metal+' added to '+r.acid+'. Does it react to give H\u2082? 1=yes, 2=no.',hints:['Only metals above H in reactivity series react with acids'],ans:r.reacts?1:2,tol:0,unit:'',working:(r.reacts?'Yes: '+r.metal+' above H in reactivity series \u2192 reacts.':'No: '+r.metal+' below H in reactivity series \u2192 no reaction.')};})},
]},
{ey:'Q7 \u2022 Y11 Chemistry \u2022 Metals',ti:'Recycling Metals',su:'Evaluate the benefits of recycling metals.',steps:[
  {lb:'Why recycle?',dr:dQ7,ht:'<p>Benefits of recycling metals: saves energy (electrolysis of Al uses huge energy; recycling uses 5% of that). Conserves finite ore reserves. Reduces mining damage to environment. Reduces CO\u2082 emissions. Economic benefits (valuable materials). Landfill reduction. Disadvantages: collection and sorting costs, energy for processing.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Recycling aluminium saves energy because: 1=it is easier to melt than make from ore, 2=recycling uses only ~5% of the energy needed to extract from bauxite.',a:2,w:'Electrolysis of Al\u2082O\u2083 is very energy-intensive; recycling avoids this. Answer: 2.'},{q:'Recycling metals conserves: 1=finite ore reserves and reduces environmental damage from mining, 2=water supplies.',a:1,w:'Recycling: conserves ore reserves, reduces mining damage. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Recycling Al: saves ~95% energy. Conserves ore reserves. Less mining damage.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y11 Chemistry \u2022 Metals',ti:'Phytomining and Bioleaching',su:'Describe alternative methods of metal extraction.',steps:[
  {lb:'New extraction methods',dr:dQ8,ht:'<p><b>Phytomining:</b> plants absorb metal ions from low-grade ores. Harvest and burn plants. Leach ash with acid \u2192 salt solution \u2192 electrolysis or displacement to extract metal. <b>Bioleaching:</b> bacteria oxidise sulfide ores, producing acidic solution containing metal ions. Used for copper: Cu\u00b2\u207a solution + scrap iron \u2192 Cu displaced. Low energy, but slow.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Bioleaching uses: 1=high temperatures to smelt ore, 2=bacteria to extract metal ions from low-grade ores.',a:2,w:'Bacteria oxidise sulfide ores \u2192 produce Cu\u00b2\u207a solution \u2192 Cu extracted. Answer: 2.'},{q:'An advantage of phytomining and bioleaching over traditional smelting is: 1=they are much faster, 2=they use less energy and can use low-grade ores.',a:2,w:'Both work with low-grade ores; lower energy; less CO\u2082. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Bioleaching: bacteria. Phytomining: plants. Both: low energy, low-grade ores.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y11 Chemistry \u2022 Metals',ti:'Displacement Calculations',su:'Calculate masses in displacement reactions.',steps:[
  {lb:'Displacement calculations',dr:dQ9,ht:'<div class="fm">Fe + CuSO\u2084 \u2192 FeSO\u2084 + Cu</div><p>Use mole ratio: 1 mol Fe : 1 mol Cu. Calculate: moles of Fe \u2192 same moles of Cu \u2192 mass of Cu = moles \u00d7 M\u1d63(Cu).</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var reactions=[{eq:'Fe + CuSO\u2084 \u2192 FeSO\u2084 + Cu',Mr_in:56,Mr_out:64,name_in:'Fe',name_out:'Cu'},{eq:'Zn + CuSO\u2084 \u2192 ZnSO\u2084 + Cu',Mr_in:65,Mr_out:64,name_in:'Zn',name_out:'Cu'},{eq:'Mg + FeSO\u2084 \u2192 MgSO\u2084 + Fe',Mr_in:24,Mr_out:56,name_in:'Mg',name_out:'Fe'}];var rxn=pick(reactions);var mass_in=rnd(1,5)*rxn.Mr_in/10;var moles=parseFloat((mass_in/rxn.Mr_in).toFixed(4));var mass_out=parseFloat((moles*rxn.Mr_out).toFixed(2));return{question:rxn.eq+'<br>Mass of '+rxn.name_in+' = <b>'+mass_in.toFixed(1)+' g</b>. Find mass of '+rxn.name_out+' produced.',hints:['moles = mass/M\u1d63; then mass = moles \u00d7 M\u1d63(product)','1:1 mole ratio'],ans:mass_out,tol:mass_out*0.02,unit:'g',working:'moles '+rxn.name_in+' = '+mass_in.toFixed(1)+'/'+rxn.Mr_in+' = '+moles.toFixed(3)+'. mass '+rxn.name_out+' = '+moles.toFixed(3)+'\u00d7'+rxn.Mr_out+' = '+mass_out+' g'};})},
]},
{ey:'Q10 \u2022 Y11 Chemistry \u2022 Metals',ti:'Mixed Metals Questions',su:'Reactivity series, extraction, rusting, alloys and calculations.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>K>Na>Ca>Mg>Al>C>Zn>Fe>H>Cu>Ag>Au. Above C: electrolysis. Below C: C reduction. Rust: O\u2082+H\u2082O. Alloy: harder. Recycling: saves energy.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['reactivity','extraction','rusting']);if(type==='reactivity'){var pairs=[{a:'Mg',b:'Cu',amore:true},{a:'Cu',b:'Fe',amore:false},{a:'Zn',b:'Fe',amore:true}];var p2=pick(pairs);return{question:'Does '+p2.a+' displace '+p2.b+' from solution? 1=yes, 2=no.',hints:['More reactive displaces less reactive'],ans:p2.amore?1:2,tol:0,unit:'',working:(p2.amore?'Yes: '+p2.a+' more reactive':'No: '+p2.a+' less reactive than '+p2.b)};}if(type==='extraction'){var qs=[{q:'Al extracted by: 1=carbon reduction, 2=electrolysis.',a:2,w:'Al above C in reactivity \u2192 electrolysis. Answer: 2.'},{q:'Fe extracted by: 1=electrolysis, 2=carbon reduction.',a:2,w:'Fe below C in reactivity \u2192 blast furnace (carbon reduction). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Above C: electrolysis. Below C: carbon reduction.'],ans:qq.a,tol:0,unit:'',working:qq.w};}return{question:'Rusting requires: 1=oxygen only, 2=both oxygen and water.',hints:['Both O\u2082 AND H\u2082O needed'],ans:2,tol:0,unit:'',working:'Both oxygen and water required for rusting. Answer: 2.'};})},
]},
];

var qi=0,si=0;
function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
function render(){bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').innerHTML=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+st.ht;st.dr(si);bDT();document.getElementById('pb').disabled=si===0;document.getElementById('nb').textContent=si===q.steps.length-1?'Restart':'Next';}
document.getElementById('pb').addEventListener('click',function(){if(si>0){si--;render();}});
document.getElementById('nb').addEventListener('click',function(){var q=QS[qi];si=si===q.steps.length-1?0:si+1;render();});
// Completion: once the last step of every question has been reached, ask the server to verify and save it (as the Mark as Complete button does)
(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
render();
</script>
