<style>
:root{--red:#6A1B9A;--dark:#4a148c;--cream:#F3E5F5;--ink:#0d1b2a;--line:#E1BEE7;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F3E5F5);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#f3e5f5;color:#4a148c;border:1px solid #ce93d8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F3E5F5';stroke=stroke||'#6A1B9A';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#6A1B9A')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#6A1B9A')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F3E5F5')+'" stroke="'+(stroke||'#6A1B9A')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Separation techniques','#6A1B9A',13,'middle',true));
[['Filtration','separates insoluble solid from liquid'],['Evaporation','removes solvent to leave dissolved solid'],['Crystallisation','cool saturated solution; crystals form'],['Distillation','separates liquids with different boiling points'],['Chromatography','separates dissolved substances by solubility/attraction'],['Centrifugation','separates fine suspended particles by spinning']].forEach(function(r,i){if(i<p+1){o.push(R(10,40+i*33,460,26,'#F3E5F5','#E1BEE7',1));o.push(T(130,57+i*33,r[0],'#6A1B9A',10,'middle',true));o.push(T(340,57+i*33,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Identification tests','#6A1B9A',12,'middle',true));
[['Test','Reagent','Positive result'],['Cl\u207b (chloride)','AgNO\u2083 + HNO\u2083','white precipitate (AgCl)'],['SO\u2084\u00b2\u207b (sulfate)','BaCl\u2082 + HCl','white precipitate (BaSO\u2084)'],['CO\u2083\u00b2\u207b (carbonate)','HCl + limewater','CO\u2082 turns limewater milky'],['NH\u2084\u207a (ammonium)','NaOH + warm','ammonia gas (red\u2192blue litmus)'],['Fe\u00b2\u207a','NaOH solution','green precipitate'],['Fe\u00b3\u207a','NaOH solution','orange-brown ppt'],['Cu\u00b2\u207a','NaOH solution','blue precipitate']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*27,460,22,'#F3E5F5','#E1BEE7',0.5));r.forEach(function(v,j){o.push(T(70+j*130,53+i*27,v,'#6A1B9A',i===0?8:7,'middle',i===0));});}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Titration technique','#6A1B9A',12,'middle',true));
if(p>=1){o.push(R(10,44,460,52,'#F3E5F5','#6A1B9A',1.5));o.push(T(240,60,'1. Pipette known volume of alkali into conical flask','#333',10,'middle',false));o.push(T(240,78,'2. Add a few drops of indicator (e.g. phenolphthalein)','#555',9,'middle',false));}
if(p>=2){o.push(R(10,108,460,52,'#F3E5F5','#6A1B9A',1.5));o.push(T(240,124,'3. Fill burette with acid; record initial volume','#333',10,'middle',false));o.push(T(240,142,'4. Add acid slowly; swirl; stop at endpoint (colour change)','#555',9,'middle',false));}
if(p>=3){o.push(R(10,172,460,52,'#e8f5e9','#6A1B9A',1.5));o.push(T(240,188,'5. Record final burette reading; titre = final \u2212 initial','#333',10,'middle',false));o.push(T(240,206,'6. Repeat for concordant results (within 0.1 cm\u00b3)','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ5(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Experimental techniques summary','#6A1B9A',13,'middle',true));
[['Filtration','insoluble solid + liquid separation'],['Crystallisation','cool saturated solution; pure crystals form'],['Distillation','separate liquids by boiling point'],['Chromatography','R\u1d0d = spot/front; identify substances'],['Flame test','Li=crimson, Na=yellow, K=lilac, Ca=brick red'],['Ion test','Cl\u207b: AgNO\u2083 white ppt. SO\u2084\u00b2\u207b: BaCl\u2082 white ppt'],['Titration','moles = conc \u00d7 vol(L); concordant results']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F3E5F5','#E1BEE7',1));o.push(T(120,52+i*30,r[0],'#6A1B9A',10,'middle',true));o.push(T(340,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Chemistry \u2022 Analysis',ti:'Separation Techniques',su:'Choose and describe appropriate separation techniques.',steps:[
  {lb:'Six methods',dr:dQ1,ht:'<p><b>Filtration:</b> insoluble solid from liquid. <b>Evaporation:</b> remove solvent (if salt is stable). <b>Crystallisation:</b> for pure crystals. <b>Distillation:</b> liquid mixtures with different boiling points. <b>Chromatography:</b> dissolved substances. <b>Centrifugation:</b> fine suspended particles.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'To separate salt crystals from seawater, you would first use: 1=distillation, 2=filtration then evaporation/crystallisation.',a:2,w:'Filter particles, then evaporate/crystallise to get salt crystals. Answer: 2.'},{q:'To separate ethanol from water, you would use: 1=chromatography, 2=distillation (different boiling points).',a:2,w:'Ethanol (bp 78\u00b0C) and water (bp 100\u00b0C) separated by distillation. Answer: 2.'},{q:'To separate ink into its components, you would use: 1=distillation, 2=chromatography.',a:2,w:'Chromatography separates dissolved dyes by different solubility. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Filtration: insoluble solid. Distillation: liquids. Chromatography: dissolved dyes.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Chemistry \u2022 Analysis',ti:'Tests for Ions',su:'Describe and apply chemical tests for anions and cations.',steps:[
  {lb:'Ion tests',dr:dQ2,ht:'<p>Anions: Cl\u207b (AgNO\u2083 + HNO\u2083 \u2192 white ppt AgCl). SO\u2084\u00b2\u207b (BaCl\u2082 + HCl \u2192 white ppt BaSO\u2084). CO\u2083\u00b2\u207b (HCl \u2192 CO\u2082, limewater turns cloudy). Cations: NH\u2084\u207a (NaOH+warm \u2192 ammonia). Fe\u00b2\u207a (NaOH \u2192 green ppt). Fe\u00b3\u207a (NaOH \u2192 orange-brown ppt). Cu\u00b2\u207a (NaOH \u2192 blue ppt).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var tests=[{ion:'Cl\u207b',reagent:'AgNO\u2083 + HNO\u2083',result:'white precipitate (AgCl)',ans:1},{ion:'SO\u2084\u00b2\u207b',reagent:'BaCl\u2082 + HCl',result:'white precipitate (BaSO\u2084)',ans:2},{ion:'CO\u2083\u00b2\u207b',reagent:'HCl then limewater',result:'CO\u2082 turns limewater milky',ans:3},{ion:'Fe\u00b2\u207a',reagent:'NaOH solution',result:'green precipitate',ans:4},{ion:'Cu\u00b2\u207a',reagent:'NaOH solution',result:'blue precipitate',ans:5}];var t=pick(tests);return{question:'<b>'+t.reagent+'</b> gives <b>'+t.result+'</b>. Which ion? 1=Cl\u207b, 2=SO\u2084\u00b2\u207b, 3=CO\u2083\u00b2\u207b, 4=Fe\u00b2\u207a, 5=Cu\u00b2\u207a.',hints:['Match reagent + result to ion'],ans:t.ans,tol:0,unit:'',working:t.result+' with '+t.reagent+' identifies '+t.ion+'. Answer: '+t.ans+'.'};})},
]},
{ey:'Q3 \u2022 Y11 Chemistry \u2022 Analysis',ti:'Flame Tests',su:'Identify metal ions using flame tests.',steps:[
  {lb:'Flame test colours',dr:dQ3,ht:'<p>Clean wire loop in HCl acid, dip in sample, hold in blue Bunsen flame. Li\u207a: crimson. Na\u207a: yellow (persistent, can mask others). K\u207a: lilac (pale purple). Ca\u00b2\u207a: brick red (orange-red). Ba\u00b2\u207a: green. Cu\u00b2\u207a: blue-green.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var tests=[{ion:'Na\u207a',colour:'yellow',ans:2},{ion:'K\u207a',colour:'lilac',ans:3},{ion:'Li\u207a',colour:'crimson',ans:1},{ion:'Ca\u00b2\u207a',colour:'brick red',ans:4},{ion:'Ba\u00b2\u207a',colour:'green',ans:5}];var t=pick(tests);return{question:'Flame test: <b>'+t.colour+'</b> colour. Ion? 1=Li\u207a, 2=Na\u207a, 3=K\u207a, 4=Ca\u00b2\u207a, 5=Ba\u00b2\u207a.',hints:['Li=crimson, Na=yellow, K=lilac, Ca=brick red, Ba=green'],ans:t.ans,tol:0,unit:'',working:t.colour+' flame = '+t.ion+'. Answer: '+t.ans+'.'};})},
]},
{ey:'Q4 \u2022 Y11 Chemistry \u2022 Analysis',ti:'Titration Calculations',su:'Calculate concentration and moles from titration data.',steps:[
  {lb:'Titration calculations',dr:dQ4,ht:'<div class="fm">moles = concentration (mol/L) \u00d7 volume (L)</div><div class="fm">concentration = moles / volume (L)</div><p>Use mole ratio from balanced equation. Average concordant titres (results within 0.1 cm\u00b3).</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var conc_acid=rnd(1,5)*0.1,vol_acid=rnd(10,30),vol_base=25;var mol_acid=parseFloat((conc_acid*vol_acid/1000).toFixed(5));var mol_base=mol_acid;var conc_base=parseFloat((mol_base/(vol_base/1000)).toFixed(3));var type=pick(['mol_acid','conc_base']);if(type==='mol_acid')return{question:'HCl conc = <b>'+conc_acid+' mol/L</b>, vol = <b>'+vol_acid+' mL</b>. Find moles of HCl.',hints:['moles = conc \u00d7 vol(L)','Convert mL to L: \u00f71000'],ans:mol_acid,tol:mol_acid*0.02,unit:'mol',working:'moles = '+conc_acid+'\u00d7'+vol_acid+'/1000 = '+mol_acid+' mol'};return{question:'Moles of NaOH = <b>'+mol_base.toFixed(5)+'</b>, vol NaOH = <b>'+vol_base+' mL</b>. Find conc NaOH.',hints:['conc = moles / vol(L)'],ans:conc_base,tol:conc_base*0.02,unit:'mol/L',working:'conc = '+mol_base.toFixed(5)+'/'+(vol_base/1000)+' = '+conc_base+' mol/L'};})}
]},
{ey:'Q5 \u2022 Y11 Chemistry \u2022 Analysis',ti:'Rf Values and Chromatography',su:'Calculate and use Rf values to identify substances.',steps:[
  {lb:'Rf calculation',dr:dQ5,ht:'<div class="fm">R\u1d0d = distance moved by substance / distance moved by solvent front</div><p>R\u1d0d is between 0 and 1 (dimensionless). Each substance has a characteristic R\u1d0d in a given solvent. Compare with R\u1d0d of known standards to identify unknowns. Pure substance = one spot. Mixture = multiple spots.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var spot=rnd(20,85),front=100,Rf=parseFloat((spot/front).toFixed(2));var type=pick(['rf','spot','front_dist']);if(type==='rf')return{question:'Spot travels <b>'+spot+' mm</b>, solvent front <b>'+front+' mm</b>. Find R\u1d0d.',hints:['R\u1d0d = spot/front'],ans:Rf,tol:0.01,unit:'',working:'R\u1d0d = '+spot+'/'+front+' = '+Rf};if(type==='spot'){var Rf2=rnd(3,9)*0.1,front2=80,spot2=Math.round(Rf2*front2);return{question:'R\u1d0d = <b>'+Rf2+'</b>, solvent front = <b>'+front2+' mm</b>. Find spot distance.',hints:['spot = R\u1d0d \u00d7 front'],ans:spot2,tol:1,unit:'mm',working:'spot = '+Rf2+'\u00d7'+front2+' = '+spot2+' mm'};}var Rf3=parseFloat((spot/front).toFixed(2));return{question:'Spot = <b>'+spot+' mm</b>, R\u1d0d = <b>'+Rf3+'</b>. Solvent front?',hints:['front = spot / R\u1d0d'],ans:front,tol:1,unit:'mm',working:'front = '+spot+'/'+Rf3+' = '+front+' mm'};})}
]},
{ey:'Q6 \u2022 Y11 Chemistry \u2022 Analysis',ti:'Percentage Yield and Atom Economy',su:'Calculate percentage yield and atom economy.',steps:[
  {lb:'Percentage yield and atom economy',dr:dQ6,ht:'<div class="fm">% yield = (actual yield / theoretical yield) \u00d7 100</div><div class="fm">% atom economy = (M\u1d63 of desired product / \u03a3M\u1d63 of all products) \u00d7 100</div><p>High atom economy = less waste. Green chemistry aims for high atom economy. % yield always \u2264 100%.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var theoretical=rnd(10,50)*2,pct=rnd(50,95),actual=parseFloat((theoretical*pct/100).toFixed(1));var type=pick(['pct','actual','atom_econ']);if(type==='pct')return{question:'Theoretical yield = <b>'+theoretical+' g</b>, actual = <b>'+actual+' g</b>. Find % yield.',hints:['% yield = (actual/theoretical)\u00d7100'],ans:pct,tol:1,unit:'%',working:'% = '+actual+'/'+theoretical+'\u00d7100 = '+pct+'%'};if(type==='actual'){var pct2=rnd(50,95),actual2=parseFloat((theoretical*pct2/100).toFixed(1));return{question:'Theoretical = <b>'+theoretical+' g</b>, % yield = <b>'+pct2+'%</b>. Find actual yield.',hints:['actual = (% yield/100) \u00d7 theoretical'],ans:actual2,tol:actual2*0.01,unit:'g',working:'actual = '+pct2+'/100\u00d7'+theoretical+' = '+actual2+' g'};}var Mr_desired=rnd(40,200),Mr_waste=rnd(10,50),atom_econ=parseFloat((Mr_desired/(Mr_desired+Mr_waste)*100).toFixed(1));return{question:'M\u1d63 desired product = <b>'+Mr_desired+'</b>, M\u1d63 waste = <b>'+Mr_waste+'</b>. Find % atom economy.',hints:['% atom econ = M\u1d63 desired / \u03a3M\u1d63 all products \u00d7 100'],ans:atom_econ,tol:0.5,unit:'%',working:'% = '+Mr_desired+'/('+Mr_desired+'+'+Mr_waste+')\u00d7100 = '+atom_econ+'%'};})}
]},
{ey:'Q7 \u2022 Y11 Chemistry \u2022 Analysis',ti:'Gas Tests',su:'Describe tests for hydrogen, oxygen, carbon dioxide and chlorine.',steps:[
  {lb:'Gas tests',dr:dQ7,ht:'<p><b>Hydrogen:</b> lit splint \u2192 squeaky pop. <b>Oxygen:</b> glowing splint relights. <b>CO\u2082:</b> bubbles through limewater \u2192 turns milky. <b>Chlorine:</b> bleaches damp litmus paper (goes white). <b>Ammonia:</b> turns damp red litmus paper blue; pungent smell.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var tests=[{gas:'H\u2082',test:'hold lit splint near gas',result:'squeaky pop',ans:1},{gas:'O\u2082',test:'glowing splint',result:'relights',ans:2},{gas:'CO\u2082',test:'bubble through limewater',result:'turns milky/white',ans:3},{gas:'Cl\u2082',test:'damp litmus paper',result:'bleaches (turns white)',ans:4},{gas:'NH\u2083',test:'damp red litmus',result:'turns blue; pungent smell',ans:5}];var t=pick(tests);return{question:t.test+': result is <b>'+t.result+'</b>. Gas? 1=H\u2082, 2=O\u2082, 3=CO\u2082, 4=Cl\u2082, 5=NH\u2083.',hints:['H\u2082: squeaky pop. O\u2082: relights glowing splint. CO\u2082: limewater. Cl\u2082: bleaches.'],ans:t.ans,tol:0,unit:'',working:t.result+' = '+t.gas+'. Answer: '+t.ans+'.'};})},
]},
{ey:'Q8 \u2022 Y11 Chemistry \u2022 Analysis',ti:'Measuring and Recording Data',su:'Describe good experimental practice in chemistry.',steps:[
  {lb:'Good practice',dr:dQ8,ht:'<p>Accuracy: how close to true value. Precision: how close repeated readings are. Reliability: repeat experiments to spot anomalies. Valid: measuring what you intend. Control variables: change one variable, keep rest constant. Safety: COSHH assessment, PPE, fume cupboard for toxic gases.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'A measurement is precise if: 1=it is close to the true value, 2=repeated measurements are close to each other.',a:2,w:'Precision: repeated readings close together (may not be accurate). Answer: 2.'},{q:'To improve reliability of an experiment, you should: 1=change as many variables as possible, 2=repeat the experiment several times and take a mean.',a:2,w:'Repeat to identify anomalies and calculate mean. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Accurate: close to true value. Precise: close together. Reliable: repeated.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y11 Chemistry \u2022 Analysis',ti:'Moles and Concentration',su:'Calculate moles, mass, concentration and volume.',steps:[
  {lb:'Key equations',dr:dQ9,ht:'<div class="fm">moles = mass / M\u1d63</div><div class="fm">moles = concentration (mol/L) \u00d7 volume (L)</div><div class="fm">concentration = moles / volume &nbsp;&nbsp; mass = moles \u00d7 M\u1d63</div>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var compounds=[{name:'NaCl',Mr:58.5},{name:'CuSO\u2084',Mr:160},{name:'NaOH',Mr:40},{name:'HCl',Mr:36.5},{name:'H\u2082SO\u2084',Mr:98}];var c=pick(compounds);var type=pick(['moles_from_mass','mass_from_moles','conc']);if(type==='moles_from_mass'){var mass=rnd(1,10)*c.Mr/5;var moles=parseFloat((mass/c.Mr).toFixed(4));return{question:'Mass of '+c.name+' = <b>'+mass.toFixed(1)+' g</b>. M\u1d63='+c.Mr+'. Find moles.',hints:['moles = mass / M\u1d63'],ans:moles,tol:moles*0.02,unit:'mol',working:'moles = '+mass.toFixed(1)+'/'+c.Mr+' = '+moles+' mol'};}if(type==='mass_from_moles'){var moles2=rnd(1,10)*0.1;var mass2=parseFloat((moles2*c.Mr).toFixed(1));return{question:'Moles of '+c.name+' = <b>'+moles2+'</b>. M\u1d63='+c.Mr+'. Find mass.',hints:['mass = moles \u00d7 M\u1d63'],ans:mass2,tol:mass2*0.01,unit:'g',working:'mass = '+moles2+'\u00d7'+c.Mr+' = '+mass2+' g'};}var conc=rnd(1,5)*0.1,vol=rnd(10,50);var moles3=parseFloat((conc*vol/1000).toFixed(5));return{question:'Conc of '+c.name+' = <b>'+conc+' mol/L</b>, vol = <b>'+vol+' mL</b>. Find moles.',hints:['moles = conc \u00d7 vol(L)'],ans:moles3,tol:moles3*0.02,unit:'mol',working:'moles = '+conc+'\u00d7'+vol+'/1000 = '+moles3+' mol'};})}
]},

]},
