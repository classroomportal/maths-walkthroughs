<style>
:root{--red:#6A1B9A;--dark:#4a148c;--cream:#F3E5F5;--ink:#0d1b2a;--line:#E1BEE7;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F3E5F5);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#f3e5f5;color:#4a148c;border:1px solid #ce93d8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F3E5F5';stroke=stroke||'#6A1B9A';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#6A1B9A')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#6A1B9A')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F3E5F5')+'" stroke="'+(stroke||'#6A1B9A')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Periodic Table structure','#6A1B9A',13,'middle',true));
o.push(R(10,40,460,50,'#F3E5F5','#6A1B9A',2));o.push(T(240,70,'Arranged in order of ATOMIC NUMBER (proton number)','#6A1B9A',11,'middle',true));
if(p>=1){o.push(R(10,100,220,50,'#F3E5F5','#6A1B9A',1.5));o.push(T(120,120,'PERIODS (rows)','#6A1B9A',11,'middle',true));o.push(T(120,138,'same number of electron shells','#555',9,'middle',false));}
if(p>=2){o.push(R(250,100,220,50,'#F3E5F5','#6A1B9A',1.5));o.push(T(360,120,'GROUPS (columns)','#6A1B9A',11,'middle',true));o.push(T(360,138,'same number of outer electrons','#555',9,'middle',false));}
if(p>=3){[['Group 1','Alkali metals','very reactive'],['Group 7','Halogens','reactive non-metals'],['Group 0','Noble gases','unreactive'],['Transition metals','Middle block','good conductors']].forEach(function(r,i){o.push(R(10,164+i*22,460,18,'#F3E5F5','#E1BEE7',1));o.push(T(90,178+i*22,r[0],'#6A1B9A',9,'middle',true));o.push(T(240,178+i*22,r[1],'#333',9,'middle',false));o.push(T(390,178+i*22,r[2],'#555',8,'middle',false));});}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Group 1 — Alkali metals','#6A1B9A',12,'middle',true));
[['Li','Lithium',3,'Soft, low density'],['Na','Sodium',11,'Reacts vigorously with water'],['K','Potassium',19,'Reacts very vigorously, lilac flame'],['Rb','Rubidium',37,'More reactive still'],['Cs','Caesium',55,'Extremely reactive']].forEach(function(r,i){if(i<p+1){o.push(R(10,38+i*38,460,30,'#F3E5F5','#E1BEE7',1));o.push(T(50,58+i*38,r[0],'#6A1B9A',14,'middle',true));o.push(T(130,58+i*38,r[1],'#333',10,'middle',false));o.push(T(340,58+i*38,r[3],'#555',8,'middle',false));}});
if(p>=3)o.push(T(240,238,'Reactivity INCREASES down Group 1','#6A1B9A',10,'middle',true));
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Group 7 — Halogens','#6A1B9A',12,'middle',true));
[['F\u2082','Fluorine','pale yellow gas','most reactive'],['Cl\u2082','Chlorine','green-yellow gas','very reactive'],['Br\u2082','Bromine','red-brown liquid','moderately reactive'],['I\u2082','Iodine','grey-black solid','least reactive of four']].forEach(function(r,i){if(i<p+1){o.push(R(10,42+i*46,460,38,'#F3E5F5','#E1BEE7',1));o.push(T(50,66+i*46,r[0],'#6A1B9A',13,'middle',true));o.push(T(150,58+i*46,r[1],'#333',10,'middle',false));o.push(T(280,58+i*46,r[2],'#555',9,'middle',false));o.push(T(420,58+i*46,r[3],'#555',8,'middle',false));}});
if(p>=2)o.push(T(240,235,'Reactivity DECREASES down Group 7','#6A1B9A',10,'middle',true));
s.innerHTML=o.join('');}
function dQ4(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Group 0 — Noble gases','#6A1B9A',12,'middle',true));
o.push(R(10,40,460,160,'#F3E5F5','#6A1B9A',1.5));
if(p>=1){['He (2)','Ne (8)','Ar (8)','Kr (8)','Xe (8)'].forEach(function(v,i){o.push(T(80+i*80,80,v,'#6A1B9A',9,'middle',false));});}
if(p>=2){o.push(T(240,120,'Full outer electron shells \u2192 very stable','#333',10,'middle',false));o.push(T(240,142,'Do NOT form ions or compounds (normally)','#333',10,'middle',false));o.push(T(240,164,'Used in: light bulbs, welding, balloons (He), lasers','#555',9,'middle',false));}
if(p>=3){o.push(T(240,200,'Density and boiling point INCREASE down the group','#6A1B9A',10,'middle',true));}
s.innerHTML=o.join('');}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ3(p);}
function dQ8(p){dQ4(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Periodic Table summary','#6A1B9A',13,'middle',true));
[['Arranged by','atomic number (proton number)'],['Period','row; same number of electron shells'],['Group','column; same number of outer electrons'],['Group 1','alkali metals; reactivity increases down'],['Group 7','halogens; reactivity decreases down'],['Group 0','noble gases; full shells; unreactive'],['Transition metals','middle block; variable oxidation states']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F3E5F5','#E1BEE7',1));o.push(T(120,52+i*30,r[0],'#6A1B9A',10,'middle',true));o.push(T(340,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Chemistry \u2022 Periodic Table',ti:'Structure of the Periodic Table',su:'Describe how the Periodic Table is organised by atomic number, periods and groups.',steps:[
  {lb:'Organisation',dr:dQ1,ht:'<p>Elements arranged in order of increasing <b>atomic number</b> (proton number). <b>Periods</b> = horizontal rows; elements in the same period have the same number of electron shells. <b>Groups</b> = vertical columns; elements in the same group have the same number of outer (valence) electrons \u2192 similar chemical properties.</p>'},
  {lb:'Key groups',dr:dQ1,ht:'<p>Group 1: alkali metals (very reactive). Group 7: halogens (reactive non-metals). Group 0: noble gases (unreactive, full outer shells). Transition metals: middle block, good conductors, variable oxidation states, coloured compounds.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'Elements in the same GROUP have: 1=the same number of electron shells, 2=the same number of outer electrons.',a:2,w:'Same group = same outer electrons \u2192 similar properties. Answer: 2.'},{q:'Elements in the same PERIOD have: 1=the same number of electron shells, 2=the same number of outer electrons.',a:1,w:'Same period = same number of electron shells. Answer: 1.'},{q:'The Periodic Table is arranged in order of: 1=relative atomic mass, 2=atomic number.',a:2,w:'Modern Periodic Table: ordered by atomic number. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Group: same outer electrons. Period: same shells.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Chemistry \u2022 Periodic Table',ti:'Group 1 — Alkali Metals',su:'Describe the properties and reactions of Group 1 metals.',steps:[
  {lb:'Properties and trend',dr:dQ2,ht:'<p>Group 1: Li, Na, K, Rb, Cs, Fr. All have 1 outer electron \u2192 readily lose it to form 1+ ions. <b>Reactivity increases down the group</b> (outer electron further from nucleus, less attraction, lost more easily). Properties: soft, low melting point, low density (Li, Na, K float on water).</p>'},
  {lb:'Reactions with water',dr:dQ2,ht:'<p>All react with water to form metal hydroxide + hydrogen gas.</p><div class="fm">2Na + 2H\u2082O \u2192 2NaOH + H\u2082</div><p>Li: fizzes gently. Na: fizzes vigorously, melts into ball. K: ignites hydrogen (lilac flame). Rb, Cs: explosive.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'Reactivity of Group 1 metals increases DOWN the group because: 1=outer electron is further from nucleus and more easily lost, 2=they have more protons.',a:1,w:'Outer electron further from nucleus \u2192 less attraction \u2192 more easily lost. Answer: 1.'},{q:'What gas is produced when sodium reacts with water? 1=oxygen, 2=hydrogen.',a:2,w:'2Na + 2H\u2082O \u2192 2NaOH + H\u2082. Hydrogen gas produced. Answer: 2.'},{q:'Which Group 1 metal is MOST reactive? 1=lithium, 2=caesium.',a:2,w:'Reactivity increases down Group 1. Caesium is most reactive. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Group 1: reactivity increases down. Water \u2192 hydroxide + H\u2082.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y11 Chemistry \u2022 Periodic Table',ti:'Group 7 — Halogens',su:'Describe the properties, trends and displacement reactions of halogens.',steps:[
  {lb:'Properties and trend',dr:dQ3,ht:'<p>Group 7: F, Cl, Br, I, At. All have 7 outer electrons \u2192 gain 1 electron to form 1\u2212 ions. <b>Reactivity DECREASES down Group 7</b> (outer shell further from nucleus, harder to attract extra electron). States at room temperature: F\u2082 gas, Cl\u2082 gas, Br\u2082 liquid, I\u2082 solid.</p>'},
  {lb:'Displacement reactions',dr:dQ3,ht:'<p>A more reactive halogen displaces a less reactive one from its salt solution.</p><div class="fm">Cl\u2082 + 2KBr \u2192 2KCl + Br\u2082</div><p>Cl\u2082 displaces Br\u2212 (Cl is more reactive than Br). Br\u2082 displaces I\u2212. Cl\u2082 displaces I\u2212. Test: add cyclohexane \u2014 Cl\u2082=colourless, Br\u2082=orange, I\u2082=purple layer.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Chlorine is added to potassium iodide solution. What happens? 1=no reaction, 2=chlorine displaces iodine (Cl is more reactive).',a:2,w:'Cl\u2082 + 2KI \u2192 2KCl + I\u2082. More reactive halogen displaces less reactive. Answer: 2.'},{q:'Reactivity of halogens DECREASES down the group because: 1=outer shell is further from nucleus, harder to attract an electron, 2=they have fewer protons.',a:1,w:'Outer shell further away \u2192 weaker nuclear attraction \u2192 less reactive. Answer: 1.'},{q:'Which is the most reactive halogen? 1=iodine, 2=fluorine.',a:2,w:'Reactivity decreases down Group 7. Fluorine is most reactive. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Group 7: reactivity decreases down. More reactive displaces less reactive.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y11 Chemistry \u2022 Periodic Table',ti:'Group 0 — Noble Gases',su:'Explain why noble gases are unreactive and describe their uses.',steps:[
  {lb:'Noble gases',dr:dQ4,ht:'<p>Group 0 (18): He, Ne, Ar, Kr, Xe, Rn. All have full outer electron shells \u2192 very stable \u2192 do not normally react. Exist as single atoms (monatomic). <b>Density and boiling point increase down the group.</b></p>'},
  {lb:'Uses',dr:dQ4,ht:'<p>Helium: balloons, airships (lighter than air, non-flammable). Neon: advertising signs (glows red-orange). Argon: light bulbs, welding shield gas. Krypton/Xenon: specialist lights, lasers.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'Noble gases are unreactive because: 1=they have full outer electron shells, 2=they have no electrons.',a:1,w:'Full outer shells = maximum stability \u2192 no need to gain or lose electrons. Answer: 1.'},{q:'Helium is used in balloons rather than hydrogen because: 1=helium is cheaper, 2=helium is non-flammable (hydrogen is highly flammable).',a:2,w:'Helium: non-flammable and lighter than air = safe for balloons. Answer: 2.'},{q:'Argon is used in light bulbs to: 1=make the bulb glow, 2=prevent the filament from oxidising (burning).',a:2,w:'Argon is unreactive \u2192 stops tungsten filament oxidising. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Noble gases: full outer shells = unreactive. He: non-flammable. Ar: inert atmosphere.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y11 Chemistry \u2022 Periodic Table',ti:'Transition Metals',su:'Describe the properties of transition metals and compare with Group 1.',steps:[
  {lb:'Transition metals',dr:dQ5,ht:'<p>Transition metals (middle block): Fe, Cu, Ni, Cr, Mn, Co, Zn, Ti, etc. Properties: high density, high melting points, hard, strong, good conductors, form coloured compounds, variable oxidation states (e.g. Fe\u00b2\u207a and Fe\u00b3\u207a), act as catalysts (Fe in Haber process, Ni in hydrogenation, MnO\u2082 for H\u2082O\u2082 decomposition).</p>'},
  {lb:'Comparison with Group 1',dr:dQ5,ht:'<p>Group 1: soft, low density, very reactive, form white/colourless compounds, only +1 oxidation state. Transition metals: hard, dense, much less reactive, coloured compounds, variable oxidation states, useful catalysts.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'Transition metals differ from Group 1 metals because they: 1=are very soft and reactive, 2=are hard, dense and have variable oxidation states.',a:2,w:'Transition metals: hard, dense, coloured compounds, variable oxidation states. Answer: 2.'},{q:'Iron is used as a catalyst in the Haber process to make: 1=sulfuric acid, 2=ammonia.',a:2,w:'Haber process: N\u2082 + 3H\u2082 \u21cc 2NH\u2083 (Fe catalyst). Answer: 2.'},{q:'Transition metals form coloured compounds because: 1=they are shiny, 2=they have variable oxidation states which interact with light.',a:2,w:'Variable oxidation states \u2192 coloured ions (e.g. Cu\u00b2\u207a blue, Fe\u00b3\u207a orange-brown). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Transition: hard, dense, coloured, variable oxidation states, catalysts.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y11 Chemistry \u2022 Periodic Table',ti:'Electron Configuration and the Periodic Table',su:'Link electron configuration to position in the Periodic Table.',steps:[
  {lb:'Electron configuration',dr:dQ6,ht:'<p>Period number = number of electron shells. Group number (for Groups 1\u20137) = number of outer electrons. Examples: Na (2,8,1) \u2192 Period 3, Group 1. Cl (2,8,7) \u2192 Period 3, Group 7. Ca (2,8,8,2) \u2192 Period 4, Group 2.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var atoms=[{sym:'Na',cfg:[2,8,1],period:3,group:1},{sym:'Cl',cfg:[2,8,7],period:3,group:7},{sym:'Mg',cfg:[2,8,2],period:3,group:2},{sym:'K',cfg:[2,8,8,1],period:4,group:1},{sym:'Ca',cfg:[2,8,8,2],period:4,group:2},{sym:'Al',cfg:[2,8,3],period:3,group:3}];var a=pick(atoms);var type=pick(['period','group','outer']);if(type==='period')return{question:'Element '+a.sym+' has configuration '+a.cfg.join(',')+'. Which period?',hints:['Period = number of electron shells'],ans:a.period,tol:0,unit:'',working:a.cfg.length+' shells = Period '+a.period};if(type==='group')return{question:'Element '+a.sym+' has configuration '+a.cfg.join(',')+'. Which group (1-7)?',hints:['Group = number of outer electrons'],ans:a.group,tol:0,unit:'',working:'Outer electrons = '+a.cfg[a.cfg.length-1]+' = Group '+a.group};var outer=a.cfg[a.cfg.length-1];return{question:'Element '+a.sym+' (config '+a.cfg.join(',')+'). How many outer electrons?',hints:['Last number in configuration = outer electrons'],ans:outer,tol:0,unit:'',working:'Last shell: '+outer+' electrons'};})},
]},
{ey:'Q7 \u2022 Y11 Chemistry \u2022 Periodic Table',ti:'Reactivity Trends',su:'Explain reactivity trends across Groups 1 and 7.',steps:[
  {lb:'Why reactivity changes',dr:dQ7,ht:'<p>Group 1 (metals): reactivity INCREASES down group. Outer electron further from nucleus \u2192 weaker nuclear attraction \u2192 lost more easily \u2192 more reactive.<br>Group 7 (non-metals): reactivity DECREASES down group. Gaining an electron becomes harder as outer shell is further from nucleus \u2192 weaker attraction for incoming electron.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'Potassium is more reactive than sodium because: 1=it has more protons, 2=its outer electron is further from the nucleus and more easily lost.',a:2,w:'K outer electron: further from nucleus \u2192 lost more easily \u2192 more reactive. Answer: 2.'},{q:'Bromine is less reactive than chlorine because: 1=bromine has fewer protons, 2=bromine\'s outer shell is further from nucleus and attracts electrons less strongly.',a:2,w:'Br: outer shell further away \u2192 weaker attraction for extra electron \u2192 less reactive. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Group 1: distance from nucleus \u2192 easier to lose e\u207b. Group 7: distance \u2192 harder to gain e\u207b.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y11 Chemistry \u2022 Periodic Table',ti:'Displacement Reactions of Halogens',su:'Predict and explain halogen displacement reactions.',steps:[
  {lb:'Displacement reactions',dr:dQ8,ht:'<p>More reactive halogen displaces less reactive halogen from aqueous solution of its salt. Reactivity order: F > Cl > Br > I. Add aqueous halogen to halide salt solution; observe colour change. Add cyclohexane and shake: forms coloured organic layer (Cl=colourless, Br=orange, I=purple).</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var pairs=[{add:'Cl\u2082',to:'KBr',product:'Br\u2082',colour:'orange',works:true,eq:'Cl\u2082 + 2KBr \u2192 2KCl + Br\u2082'},{add:'Cl\u2082',to:'KI',product:'I\u2082',colour:'purple',works:true,eq:'Cl\u2082 + 2KI \u2192 2KCl + I\u2082'},{add:'Br\u2082',to:'KI',product:'I\u2082',colour:'purple',works:true,eq:'Br\u2082 + 2KI \u2192 2KBr + I\u2082'},{add:'Br\u2082',to:'KCl',product:'none',colour:'no change',works:false,eq:'No reaction: Br\u2082 less reactive than Cl\u2082'},{add:'I\u2082',to:'KBr',product:'none',colour:'no change',works:false,eq:'No reaction: I\u2082 less reactive than Br\u2082'}];var p=pick(pairs);return{question:p.add+' added to '+p.to+' solution. Does displacement occur? 1=yes, 2=no.',hints:['More reactive halogen displaces less reactive'],ans:p.works?1:2,tol:0,unit:'',working:(p.works?'Yes: '+p.eq:'No: '+p.eq)};})},
]},
{ey:'Q9 \u2022 Y11 Chemistry \u2022 Periodic Table',ti:'Flame Tests and Ionic Colours',su:'Describe flame tests for metal ions and colours of transition metal ions.',steps:[
  {lb:'Flame tests',dr:dQ9,ht:'<p>Flame tests identify metal ions by colour produced in a Bunsen flame. Li\u207a: crimson. Na\u207a: yellow (persistent). K\u207a: lilac. Ca\u00b2\u207a: brick red. Ba\u00b2\u207a: green. Cu\u00b2\u207a: blue-green. Method: clean wire loop in HCl, dip in sample, hold in flame.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var tests=[{ion:'Na\u207a',colour:'yellow',ans:2},{ion:'K\u207a',colour:'lilac',ans:3},{ion:'Li\u207a',colour:'crimson',ans:1},{ion:'Ca\u00b2\u207a',colour:'brick red',ans:4},{ion:'Cu\u00b2\u207a',colour:'blue-green',ans:5}];var t=pick(tests);var cols=['crimson','yellow','lilac','brick red','blue-green'];return{question:'Flame test gives a <b>'+t.colour+'</b> colour. Which ion? 1=Li\u207a, 2=Na\u207a, 3=K\u207a, 4=Ca\u00b2\u207a, 5=Cu\u00b2\u207a.',hints:['Li=crimson, Na=yellow, K=lilac, Ca=brick red, Cu=blue-green'],ans:t.ans,tol:0,unit:'',working:t.colour+' flame = '+t.ion+'. Answer: '+t.ans+'.'};})}
]},
{ey:'Q10 \u2022 Y11 Chemistry \u2022 Periodic Table',ti:'Mixed Periodic Table Questions',su:'Groups 1, 7, 0, transition metals, electron configuration and trends.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Group 1: reactivity\u2191 down (lose e\u207b easier). Group 7: reactivity\u2193 down (gain e\u207b harder). Group 0: full shells, unreactive. Transition: hard, dense, coloured, variable oxidation states. Flame: Li=crimson, Na=yellow, K=lilac.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['group1','group7','electron']);if(type==='group1'){var qs=[{q:'Group 1 reactivity: 1=increases down, 2=decreases down.',a:1,w:'Outer electron further from nucleus \u2192 more easily lost \u2192 more reactive. Answer: 1.'},{q:'Na reacts with water to produce: 1=NaOH + O\u2082, 2=NaOH + H\u2082.',a:2,w:'2Na + 2H\u2082O \u2192 2NaOH + H\u2082. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Group 1: reactivity increases down. Water reaction: NaOH + H\u2082.'],ans:qq.a,tol:0,unit:'',working:qq.w};}if(type==='group7'){var qs2=[{q:'Group 7 reactivity: 1=increases down, 2=decreases down.',a:2,w:'Harder to gain electron as outer shell is further away. Answer: 2.'},{q:'Cl\u2082 added to KBr solution: 1=no reaction, 2=bromine is displaced.',a:2,w:'Cl\u2082 more reactive \u2192 displaces Br\u207b. Answer: 2.'}];var qq2=pick(qs2);return{question:qq2.q,hints:['Group 7: reactivity decreases down. More reactive displaces less.'],ans:qq2.a,tol:0,unit:'',working:qq2.w};}var atoms=[{sym:'Na',cfg:[2,8,1],period:3,group:1},{sym:'Cl',cfg:[2,8,7],period:3,group:7},{sym:'K',cfg:[2,8,8,1],period:4,group:1}];var a=pick(atoms);return{question:'Config '+a.cfg.join(',')+'. How many outer electrons?',hints:['Last number = outer electrons'],ans:a.cfg[a.cfg.length-1],tol:0,unit:'',working:'Last shell: '+a.cfg[a.cfg.length-1]+' electrons'};})},
]},
];
