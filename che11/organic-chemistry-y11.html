<style>
:root{--red:#6A1B9A;--dark:#4a148c;--cream:#F3E5F5;--ink:#0d1b2a;--line:#E1BEE7;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F3E5F5);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#f3e5f5;color:#4a148c;border:1px solid #ce93d8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F3E5F5';stroke=stroke||'#6A1B9A';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#6A1B9A')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#6A1B9A')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F3E5F5')+'" stroke="'+(stroke||'#6A1B9A')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Alkanes and alkenes','#6A1B9A',13,'middle',true));
o.push(R(10,40,222,198,'#F3E5F5','#6A1B9A',2));o.push(T(121,60,'ALKANES','#6A1B9A',11,'middle',true));
o.push(R(248,40,222,198,'#F3E5F5','#6A1B9A',2));o.push(T(359,60,'ALKENES','#6A1B9A',11,'middle',true));
var al=['General: C\u2099H\u2082\u2099\u208a\u2082','Saturated (single C-C bonds)','No reaction with Br\u2082 water','Combust: CO\u2082 + H\u2082O','Substitution reactions','CH\u2084 methane, C\u2082H\u2086 ethane'];
var ale=['General: C\u2099H\u2082\u2099','Unsaturated (C=C double bond)','Decolourise Br\u2082 water','Combust (sooty flame)','Addition reactions','C\u2082H\u2084 ethene, C\u2083H\u2086 propene'];
al.forEach(function(v,i){if(i<p+1)o.push(T(121,80+i*24,v,'#333',8,'middle',false));});
ale.forEach(function(v,i){if(i<p+1)o.push(T(359,80+i*24,v,'#333',8,'middle',false));});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Crude oil and fractional distillation','#6A1B9A',12,'middle',true));
var fractions=[['Refinery gas','< 25\u00b0C','fuel (LPG), chemicals'],['Petrol (gasoline)','25\u201360\u00b0C','car fuel'],['Naphtha','60\u2013100\u00b0C','chemicals feedstock'],['Kerosene','100\u2013150\u00b0C','jet fuel'],['Diesel','150\u2013250\u00b0C','diesel engines'],['Fuel oil','250\u2013350\u00b0C','ships, power stations'],['Bitumen','>350\u00b0C','roads, roofing']];
fractions.forEach(function(r,i){if(i<p+2){o.push(R(10,36+i*30,460,24,i<3?'#F3E5F5':i<5?'#f3f3f3':'#e8f5e9','#E1BEE7',0.5));o.push(T(120,52+i*30,r[0],'#6A1B9A',9,'middle',true));o.push(T(250,52+i*30,r[1],'#555',8,'middle',false));o.push(T(390,52+i*30,r[2],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Addition and condensation polymers','#6A1B9A',12,'middle',true));
o.push(R(10,40,460,90,'#F3E5F5','#6A1B9A',1.5));o.push(T(240,58,'ADDITION POLYMERS','#6A1B9A',11,'middle',true));o.push(T(240,76,'Alkene monomers join; no other product formed','#333',9,'middle',false));o.push(T(240,92,'n(CH\u2082=CH\u2082) \u2192 (-CH\u2082-CH\u2082-)n (polyethene)','#555',9,'middle',false));o.push(T(240,108,'Polypropene, PVC, polystyrene, PTFE','#555',9,'middle',false));
if(p>=1){o.push(R(10,140,460,100,'#F3E5F5','#6A1B9A',1.5));o.push(T(240,158,'CONDENSATION POLYMERS','#6A1B9A',11,'middle',true));o.push(T(240,176,'Two different monomers; small molecule (H\u2082O or HCl) eliminated','#333',9,'middle',false));o.push(T(240,192,'Nylon (polyamide), polyester (Terylene), proteins, DNA, starch','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ5(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Organic chemistry summary','#6A1B9A',13,'middle',true));
[['Alkanes','C\u2099H\u2082\u2099\u208a\u2082; saturated; no reaction with Br\u2082; substitution'],['Alkenes','C\u2099H\u2082\u2099; unsaturated (C=C); decolourise Br\u2082; addition'],['Crude oil','fractional distillation; shorter chains = more volatile'],['Cracking','long chain alkanes \u2192 short alkenes + alkanes (catalyst/heat)'],['Addition polymers','alkene monomers; no by-product; poly(ethene) etc.'],['Condensation polymers','two monomers; H\u2082O released; nylon, polyester'],['Alcohols','ethanol (C\u2082H\u2085OH); fermentation; fuel, solvent, drink']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F3E5F5','#E1BEE7',1));o.push(T(110,52+i*30,r[0],'#6A1B9A',10,'middle',true));o.push(T(330,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Chemistry \u2022 Organic',ti:'Alkanes and Alkenes',su:'Compare alkanes and alkenes. Use bromine water test.',steps:[
  {lb:'Alkanes vs alkenes',dr:dQ1,ht:'<p><b>Alkanes:</b> C\u2099H\u2082\u2099\u208a\u2082; saturated (only C\u2212C single bonds); do NOT decolourise bromine water. Undergo combustion and substitution reactions. <b>Alkenes:</b> C\u2099H\u2082\u2099; unsaturated (contain C=C double bond); rapidly decolourise bromine water (addition reaction). More reactive than alkanes.</p>'},
  {lb:'Bromine water test',dr:dQ1,ht:'<p>Shake compound with bromine water (orange/brown). Alkane: stays orange (no reaction). Alkene: turns colourless (addition reaction across C=C).</p><div class="fm">CH\u2082=CH\u2082 + Br\u2082 \u2192 CH\u2082Br\u2013CH\u2082Br</div>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'A compound decolourises bromine water. It is most likely: 1=an alkane, 2=an alkene.',a:2,w:'Alkenes decolourise Br\u2082 water (addition across C=C). Answer: 2.'},{q:'The general formula for alkenes is: 1=C\u2099H\u2082\u2099\u208a\u2082, 2=C\u2099H\u2082\u2099.',a:2,w:'Alkenes: C\u2099H\u2082\u2099. Alkanes: C\u2099H\u2082\u2099\u208a\u2082. Answer: 2.'},{q:'Alkanes undergo: 1=addition reactions, 2=substitution reactions with halogens.',a:2,w:'Alkanes: substitution (e.g. CH\u2084 + Cl\u2082 \u2192 CH\u2083Cl + HCl). Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Alkene: C=C, decolourises Br\u2082. Alkane: no C=C, no reaction with Br\u2082.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Chemistry \u2022 Organic',ti:'Crude Oil and Fractional Distillation',su:'Describe fractional distillation of crude oil.',steps:[
  {lb:'Fractional distillation',dr:dQ2,ht:'<p>Crude oil = mixture of hydrocarbons. Heated \u2192 vapours rise up fractionating column (cooler at top). Different fractions condense at different temperatures depending on chain length. Shorter chains: lower boiling point, more volatile, more flammable, less viscous, lighter colour.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'In fractional distillation, shorter chain hydrocarbons: 1=condense at the bottom, 2=rise higher up the column and condense near the top.',a:2,w:'Shorter chains: lower boiling point \u2192 stay as vapour longer \u2192 rise higher. Answer: 2.'},{q:'Bitumen is collected: 1=at the top of the fractionating column, 2=at the bottom (highest boiling point).',a:2,w:'Bitumen: very long chains, highest boiling point \u2192 bottom of column. Answer: 2.'},{q:'Kerosene is used as: 1=car fuel, 2=jet fuel.',a:2,w:'Kerosene: jet fuel (aviation fuel). Petrol: cars. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Shorter chains: higher up, lower boiling point. Longer chains: lower, higher bp.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y11 Chemistry \u2022 Organic',ti:'Cracking',su:'Describe thermal and catalytic cracking.',steps:[
  {lb:'Cracking',dr:dQ3,ht:'<p>Cracking: breaking long-chain alkanes into shorter, more useful alkanes and alkenes. <b>Thermal cracking:</b> high temperature (400\u2013900\u00b0C), high pressure. Mainly produces alkenes for polymers. <b>Catalytic cracking:</b> lower temperature (~500\u00b0C), aluminium oxide/zeolite catalyst. Produces petrol-range hydrocarbons.</p><div class="fm">C\u2081\u2080H\u2082\u2082 \u2192 C\u2088H\u2081\u2086 + C\u2082H\u2084 + C\u2082H\u2086</div>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var qs=[{q:'Cracking is needed because: 1=crude oil has too many short-chain fractions, 2=there is more demand for short-chain products than is naturally present in crude oil.',a:2,w:'Demand for petrol/plastics > supply from distillation; long chains cracked. Answer: 2.'},{q:'Cracking always produces: 1=only alkanes, 2=at least one alkene.',a:2,w:'Cracking: long alkane \u2192 shorter alkane + alkene. Alkene always produced. Answer: 2.'},{q:'Catalytic cracking uses: 1=very high pressure only, 2=a catalyst at moderate temperature.',a:2,w:'Catalytic cracking: Al\u2082O\u2083 or zeolite catalyst at ~500\u00b0C. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Cracking: long alkane \u2192 short alkane + alkene. Catalyst or high temp.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q4 \u2022 Y11 Chemistry \u2022 Organic',ti:'Addition Polymers',su:'Describe addition polymerisation. Draw repeat units.',steps:[
  {lb:'Addition polymerisation',dr:dQ4,ht:'<p>Addition polymerisation: alkene monomers join across the C=C double bond. No other product formed.</p><div class="fm">n CH\u2082=CH\u2082 \u2192 (-CH\u2082-CH\u2082-)n &nbsp; poly(ethene)</div><p>Examples: poly(ethene) = polythene (bags, bottles). Poly(propene) = polypropylene (ropes, containers). PVC (-CHCl-CH\u2082-), polystyrene, PTFE (Teflon).</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var qs=[{q:'In addition polymerisation, the monomer must contain: 1=a C\u2212C single bond, 2=a C=C double bond.',a:2,w:'Addition polymerisation: C=C double bond in monomer opens up to join. Answer: 2.'},{q:'Poly(ethene) is made from: 1=ethane, 2=ethene.',a:2,w:'Monomer: ethene (CH\u2082=CH\u2082). Polymer: poly(ethene). Answer: 2.'},{q:'In addition polymerisation: 1=water is released as a by-product, 2=no by-product is formed.',a:2,w:'Addition: no by-product. Condensation: H\u2082O released. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Addition: C=C monomer, no by-product. Condensation: H\u2082O released.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q5 \u2022 Y11 Chemistry \u2022 Organic',ti:'Condensation Polymers',su:'Describe condensation polymerisation. Compare with addition.',steps:[
  {lb:'Condensation polymers',dr:dQ5,ht:'<p>Condensation polymerisation: two different monomers join with elimination of a small molecule (usually water or HCl). Examples: nylon (polyamide \u2014 diamine + dicarboxylic acid \u2192 -CONH- links), polyester (Terylene \u2014 diol + dicarboxylic acid \u2192 -COO- links). Natural condensation polymers: proteins (amino acids), starch (glucose), DNA.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var qs=[{q:'In condensation polymerisation, a small molecule is eliminated. Usually: 1=CO\u2082, 2=water (H\u2082O).',a:2,w:'Condensation: H\u2082O (or HCl) eliminated. Answer: 2.'},{q:'Nylon is an example of: 1=an addition polymer, 2=a condensation polymer (polyamide).',a:2,w:'Nylon: diamine + dicarboxylic acid, -CONH- links = polyamide = condensation. Answer: 2.'},{q:'Proteins are natural condensation polymers made from: 1=amino acids, 2=alkenes.',a:1,w:'Proteins: amino acids joined by peptide bonds (condensation). Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Condensation: H\u2082O released. Nylon: polyamide. Polyester: diol+diacid.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q6 \u2022 Y11 Chemistry \u2022 Organic',ti:'Alcohols',su:'Describe properties and reactions of alcohols.',steps:[
  {lb:'Alcohols',dr:dQ6,ht:'<p>Alcohols contain -OH group. Ethanol (C\u2082H\u2085OH): made by fermentation (glucose + yeast \u2192 ethanol + CO\u2082) or hydration of ethene (C\u2082H\u2084 + H\u2082O \u2192 C\u2082H\u2085OH, phosphoric acid catalyst). Uses: fuel, solvent, alcoholic drinks, antiseptic. Combustion: C\u2082H\u2085OH + 3O\u2082 \u2192 2CO\u2082 + 3H\u2082O.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Ethanol can be made by: 1=cracking of crude oil only, 2=fermentation of glucose OR hydration of ethene.',a:2,w:'Two methods: fermentation (C\u2086H\u2081\u2082O\u2086 \u2192 2C\u2082H\u2085OH + 2CO\u2082) or ethene + steam. Answer: 2.'},{q:'The functional group in alcohols is: 1=-COOH, 2=-OH.',a:2,w:'Alcohols contain -OH (hydroxyl group). Answer: 2.'},{q:'Ethanol burns in oxygen to produce: 1=CO\u2082 + H\u2082O, 2=CO\u2082 + H\u2082.',a:1,w:'Complete combustion: C\u2082H\u2085OH + 3O\u2082 \u2192 2CO\u2082 + 3H\u2082O. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Alcohol: -OH group. Ethanol: fermentation or hydration. Burns to CO\u2082+H\u2082O.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y11 Chemistry \u2022 Organic',ti:'Carboxylic Acids',su:'Describe properties and reactions of carboxylic acids.',steps:[
  {lb:'Carboxylic acids',dr:dQ7,ht:'<p>Contain -COOH group. Weak acids (partially ionise). Ethanoic acid (CH\u2083COOH): found in vinegar. React with: carbonates (\u2192 salt + H\u2082O + CO\u2082), alkalis (\u2192 salt + H\u2082O), alcohols (\u2192 ester + water, esterification). Longer chain: stronger smell. Stearic acid, oleic acid (fatty acids in fats/oils).</p>'},
  {lb:'Esterification',dr:dQ7,ht:'<div class="fm">alcohol + carboxylic acid \u21cc ester + water</div><p>Acid catalyst (H\u2082SO\u2084). Reversible reaction. Esters: fruity smells, used in perfumes and flavourings. Ethyl ethanoate from ethanol + ethanoic acid.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var qs=[{q:'The functional group in carboxylic acids is: 1=-OH, 2=-COOH.',a:2,w:'Carboxylic acids: -COOH group. Alcohols: -OH. Answer: 2.'},{q:'Esterification produces: 1=an ester + water, 2=an alcohol + acid.',a:1,w:'Alcohol + acid \u2192 ester + water (with acid catalyst). Answer: 1.'},{q:'Ethanoic acid reacting with Na\u2082CO\u2083 produces: 1=an ester, 2=a salt + water + CO\u2082.',a:2,w:'Acid + carbonate \u2192 salt + H\u2082O + CO\u2082. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['-COOH: carboxylic acid. Esterification: acid+alcohol\u2192ester+H\u2082O.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q8 \u2022 Y11 Chemistry \u2022 Organic',ti:'Homologous Series',su:'Define homologous series. Name and draw organic compounds.',steps:[
  {lb:'Homologous series',dr:dQ8,ht:'<p>A homologous series: group of compounds with the same general formula, differing by CH\u2082. Same functional group \u2192 similar chemical properties. Gradually changing physical properties (boiling point, viscosity). Alkanes: methane, ethane, propane, butane, pentane\u2026 (C\u2099H\u2082\u2099\u208a\u2082).</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var alkanes=[{n:'methane',C:1,H:4},{n:'ethane',C:2,H:6},{n:'propane',C:3,H:8},{n:'butane',C:4,H:10},{n:'pentane',C:5,H:12}];var a=pick(alkanes);var type=pick(['H_count','C_count','formula']);if(type==='H_count')return{question:'Alkane with <b>'+a.C+'</b> carbon atoms ('+a.n+'). How many H atoms?',hints:['Alkanes: C\u2099H\u2082\u2099\u208a\u2082'],ans:a.H,tol:0,unit:'',working:'C\u2099H\u2082\u2099\u208a\u2082: '+a.C+' carbons \u2192 '+(2*a.C+2)+' H atoms'};if(type==='C_count'){var alkene=pick([{n:'ethene',C:2,H:4},{n:'propene',C:3,H:6},{n:'butene',C:4,H:8}]);return{question:'Alkene '+alkene.n+': formula C\u2099H\u2082\u2099. How many C atoms if there are '+alkene.H+' H atoms?',hints:['C\u2099H\u2082\u2099: C = H/2'],ans:alkene.C,tol:0,unit:'',working:'C\u2099H\u2082\u2099: '+alkene.H+' H \u2192 '+alkene.H+'/2 = '+alkene.C+' C atoms'};}return{question:a.n+' ('+a.C+' C atoms). Molecular formula?',hints:['Alkanes: C\u2099H\u2082\u2099\u208a\u2082'],ans:a.H,tol:0,unit:'(check H count)',working:'C'+a.C+'H'+(2*a.C+2)+'. H atoms = '+(2*a.C+2)};})},
]},
{ey:'Q9 \u2022 Y11 Chemistry \u2022 Organic',ti:'Combustion of Hydrocarbons',su:'Write combustion equations. Evaluate impact of burning fossil fuels.',steps:[
  {lb:'Combustion',dr:dQ9,ht:'<p>Complete combustion: hydrocarbon + O\u2082 \u2192 CO\u2082 + H\u2082O (blue flame). Incomplete combustion: limited O\u2082 \u2192 CO (toxic) + C (soot) + H\u2082O (yellow/orange flame). Burning fossil fuels: CO\u2082 (greenhouse), SO\u2082 (acid rain), NOx (acid rain, smog), particulates (respiratory disease).</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var hydrocarbons=[{name:'methane',formula:'CH\u2084',CO2:1,H2O:2,O2:2},{name:'ethane',formula:'C\u2082H\u2086',CO2:2,H2O:3,O2:3.5},{name:'propane',formula:'C\u2083H\u2088',CO2:3,H2O:4,O2:5},{name:'butane',formula:'C\u2084H\u2081\u2080',CO2:4,H2O:5,O2:6.5}];var h=pick(hydrocarbons);var type=pick(['CO2','H2O']);if(type==='CO2')return{question:'Complete combustion of <b>'+h.name+'</b> ('+h.formula+'). How many moles of CO\u2082 produced per mole of fuel?',hints:['CO\u2082 moles = number of C atoms'],ans:h.CO2,tol:0,unit:'mol',working:h.name+' has '+h.CO2+' carbon atoms \u2192 '+h.CO2+' mol CO\u2082'};return{question:'Complete combustion of <b>'+h.name+'</b> ('+h.formula+'). How many moles of H\u2082O produced?',hints:['H\u2082O moles = H atoms / 2'],ans:h.H2O,tol:0,unit:'mol',working:h.name+': H\u2082O moles = '+h.H2O};})},
]},
{ey:'Q10 \u2022 Y11 Chemistry \u2022 Organic',ti:'Mixed Organic Chemistry',su:'Alkanes, alkenes, crude oil, polymers, alcohols and esters.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Alkane: C\u2099H\u2082\u2099\u208a\u2082, saturated, no Br\u2082 reaction. Alkene: C\u2099H\u2082\u2099, C=C, decolourises Br\u2082. Addition polymer: no by-product. Condensation: H\u2082O released. Alcohol: -OH. Carboxylic acid: -COOH. Ester: acid + alcohol.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['bromine','polymer','functional']);if(type==='bromine'){var qs=[{q:'Which decolourises bromine water? 1=ethane, 2=ethene.',a:2,w:'Ethene (alkene) has C=C \u2192 addition with Br\u2082 \u2192 decolourises. Answer: 2.'},{q:'Alkanes: 1=decolourise Br\u2082 water, 2=do not react with Br\u2082 water.',a:2,w:'Alkanes: no C=C \u2192 no reaction with Br\u2082 water. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Alkene: C=C decolourises Br\u2082. Alkane: no reaction.'],ans:qq.a,tol:0,unit:'',working:qq.w};}if(type==='polymer'){var qs2=[{q:'Nylon is: 1=an addition polymer, 2=a condensation polymer.',a:2,w:'Nylon: diamine + diacid, -CONH- links = condensation. Answer: 2.'},{q:'Poly(ethene) is: 1=an addition polymer, 2=a condensation polymer.',a:1,w:'Poly(ethene): ethene monomers, addition polymerisation. Answer: 1.'}];var qq2=pick(qs2);return{question:qq2.q,hints:['Addition: C=C monomers, no by-product. Condensation: H\u2082O released.'],ans:qq2.a,tol:0,unit:'',working:qq2.w};}return{question:'The functional group in carboxylic acids is: 1=-OH, 2=-COOH.',hints:['-COOH: carboxylic acid. -OH: alcohol.'],ans:2,tol:0,unit:'',working:'-COOH = carboxylic acid. Answer: 2.'};})},
]},
];

var qi=0,si=0;
function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
function render(){bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').innerHTML=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+st.ht;st.dr(si);bDT();document.getElementById('pb').disabled=si===0;document.getElementById('nb').textContent=si===q.steps.length-1?'Restart':'Next';}
document.getElementById('pb').addEventListener('click',function(){if(si>0){si--;render();}});
document.getElementById('nb').addEventListener('click',function(){var q=QS[qi];si=si===q.steps.length-1?0:si+1;render();});
// Completion: once the last step of every question has been reached, ask the server to verify and save it (as the Mark as Complete button does)
(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
render();
</script>
