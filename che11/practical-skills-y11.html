<style>
:root{--red:#6A1B9A;--dark:#4a148c;--cream:#F3E5F5;--ink:#0d1b2a;--line:#E1BEE7;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#F3E5F5);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:160px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:16px;line-height:1.55;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:17px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#3a2a24;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#f3e5f5;color:#4a148c;border:1px solid #ce93d8;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#3a2a24;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest?el.closest('.try'):document.querySelector('.try[data-tryid="'+id+'"]');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite — check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||'#F3E5F5';stroke=stroke||'#6A1B9A';sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||'#6A1B9A')+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#6A1B9A')+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#F3E5F5')+'" stroke="'+(stroke||'#6A1B9A')+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Key practical skills','#6A1B9A',13,'middle',true));
[['Measuring volume','burette, pipette, measuring cylinder (read meniscus at bottom)'],['Measuring mass','balance to 2+ decimal places; zero before use'],['Heating safely','tripod, gauze, Bunsen burner; never point opening at person'],['Filtration','fold filter paper; pour carefully down glass rod'],['Crystallisation','heat saturated solution; cool slowly; filter, dry crystals'],['Titration','rinse burette with solution; concordant results \u00b10.1 cm\u00b3']].forEach(function(r,i){if(i<p+1){o.push(R(10,40+i*33,460,26,'#F3E5F5','#E1BEE7',1));o.push(T(120,57+i*33,r[0],'#6A1B9A',10,'middle',true));o.push(T(340,57+i*33,r[1],'#555',8,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Calculating from experiments','#6A1B9A',12,'middle',true));
o.push(R(10,40,460,52,'#F3E5F5','#6A1B9A',2));o.push(T(240,60,'moles = mass / M\u1d63 &nbsp;&nbsp; moles = conc \u00d7 vol(L)','#4a148c',13,'middle',true));o.push(T(240,78,'% yield = (actual/theoretical)\u00d7100','#4a148c',11,'middle',false));
if(p>=1){o.push(R(10,104,460,40,'#F3E5F5','#6A1B9A',1.5));o.push(T(240,128,'% atom economy = M\u1d63(desired) / \u03a3M\u1d63(products) \u00d7 100','#4a148c',11,'middle',true));}
if(p>=2){o.push(R(10,156,460,40,'#F3E5F5','#6A1B9A',1.5));o.push(T(240,180,'R\u1d0d = distance spot / distance solvent front','#4a148c',11,'middle',true));}
if(p>=3){o.push(R(10,208,460,38,'#e8f5e9','#2E7D32',1.5));o.push(T(240,228,'Always show full working; check units; sig figs match data','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Drawing graphs','#6A1B9A',12,'middle',true));
if(p>=1){o.push(R(10,44,460,180,'#F3E5F5','#6A1B9A',1.5));
['1. Label both axes with quantity AND units','2. Choose scale using at least half the grid','3. Plot points accurately (pencil, \u00d7 or \u25cf)','4. Draw line of best fit (straight or curve, NOT dot-to-dot)','5. Ignore anomalous points (circle, do not include in line)','6. Calculate gradient: \u0394y/\u0394x (use large triangle)'].forEach(function(v,i){if(i<p)o.push(T(240,62+i*26,v,'#333',9,'middle',false));});}
s.innerHTML=o.join('');}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ5(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,22,'Practical skills summary','#6A1B9A',13,'middle',true));
[['Meniscus','read bottom of meniscus for volume'],['Concordant','titration results within 0.1 cm\u00b3'],['Anomalous','outlier data point; exclude from mean/line of best fit'],['% yield','actual/theoretical \u00d7 100'],['% atom economy','M\u1d63 wanted / \u03a3M\u1d63 all \u00d7 100'],['Random error','scatter around mean; reduced by repeating'],['Systematic error','shifts all readings same way; e.g. zero error on balance']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,'#F3E5F5','#E1BEE7',1));o.push(T(120,52+i*30,r[0],'#6A1B9A',10,'middle',true));o.push(T(340,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y11 Chemistry \u2022 Practical',ti:'Laboratory Techniques',su:'Describe correct use of laboratory equipment.',steps:[
  {lb:'Key techniques',dr:dQ1,ht:'<p>Burette: read meniscus at bottom, to 0.05 cm\u00b3. Pipette: one fixed volume. Measuring cylinder: less accurate. Balance: tare (zero) before use, 2+ decimal places for chemistry. Heating: use tripod and gauze for even heating; Bunsen on blue flame when heating.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var qs=[{q:'When reading volume in a burette or measuring cylinder, you read: 1=the top of the liquid, 2=the bottom of the meniscus.',a:2,w:'Read the bottom of the curved meniscus for accuracy. Answer: 2.'},{q:'In a titration, "concordant results" means: 1=results are exactly the same, 2=results are within 0.1 cm\u00b3 of each other.',a:2,w:'Concordant: within 0.1 cm\u00b3; no need to be exactly identical. Answer: 2.'},{q:'Before using a balance to measure mass, you should: 1=add a small amount of your substance, 2=tare (zero) the balance.',a:2,w:'Always zero the balance before measuring. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Meniscus: read bottom. Concordant: within 0.1 cm\u00b3. Balance: tare first.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q2 \u2022 Y11 Chemistry \u2022 Practical',ti:'Errors and Reliability',su:'Distinguish random and systematic errors. Describe how to improve results.',steps:[
  {lb:'Types of error',dr:dQ2,ht:'<p><b>Random error:</b> unpredictable scatter; readings vary around the true value. Reduced by taking more readings and averaging. <b>Systematic error:</b> all readings shifted in one direction; caused by faulty equipment or poor technique (e.g. zero error on balance, parallax error). Reduced by calibration.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var qs=[{q:'A balance always reads 0.5 g too high. This is: 1=a random error, 2=a systematic error.',a:2,w:'Systematic error: all readings shifted the same way. Answer: 2.'},{q:'To reduce random errors in an experiment, you should: 1=use more precise equipment only, 2=repeat measurements and calculate a mean.',a:2,w:'Repeating and averaging reduces random error. Answer: 2.'},{q:'An anomalous result should: 1=always be included in calculations, 2=be identified, circled and excluded from mean/line of best fit.',a:2,w:'Anomalous: outlier; exclude from calculations. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Random: scatter. Systematic: always shifted same direction. Anomalous: exclude.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q3 \u2022 Y11 Chemistry \u2022 Practical',ti:'Percentage Yield Calculations',su:'Calculate percentage yield from experimental data.',steps:[
  {lb:'% yield',dr:dQ3,ht:'<div class="fm">% yield = (actual yield / theoretical yield) \u00d7 100</div><p>Theoretical yield: calculated from stoichiometry. Actual yield: what you get in the lab (always \u2264 theoretical). Reasons for low yield: reaction incomplete, loss during transfer, side reactions, product dissolves in water during washing.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var theoretical=rnd(5,25)*4,pct=rnd(45,95),actual=parseFloat((theoretical*pct/100).toFixed(1));var type=pick(['pct','actual','theoretical_from_pct']);if(type==='pct')return{question:'Theoretical yield = <b>'+theoretical+' g</b>. Actual yield = <b>'+actual+' g</b>. % yield?',hints:['% yield = (actual/theoretical)\u00d7100'],ans:pct,tol:1,unit:'%',working:'% = '+actual+'/'+theoretical+'\u00d7100 = '+pct+'%'};if(type==='actual'){var pct2=rnd(45,95),actual2=parseFloat((theoretical*pct2/100).toFixed(1));return{question:'Theoretical = <b>'+theoretical+' g</b>, % yield = <b>'+pct2+'%</b>. Actual yield?',hints:['actual = (% yield/100) \u00d7 theoretical'],ans:actual2,tol:0.5,unit:'g',working:'actual = '+pct2+'/100\u00d7'+theoretical+' = '+actual2+' g'};}var actual3=parseFloat((theoretical*pct/100).toFixed(1));return{question:'Actual yield = <b>'+actual3+' g</b>, % yield = <b>'+pct+'%</b>. Theoretical yield?',hints:['theoretical = actual / (% yield/100)'],ans:theoretical,tol:0.5,unit:'g',working:'theoretical = '+actual3+'/('+pct+'/100) = '+theoretical+' g'};})}
]},
{ey:'Q4 \u2022 Y11 Chemistry \u2022 Practical',ti:'Atom Economy',su:'Calculate percentage atom economy and explain its importance.',steps:[
  {lb:'Atom economy',dr:dQ4,ht:'<div class="fm">% atom economy = (M\u1d63 of desired product / \u03a3M\u1d63 of all products) \u00d7 100</div><p>High atom economy = efficient use of atoms = less waste. Important in green chemistry and industry. Addition reactions: 100% atom economy (no by-products). Substitution reactions: lower atom economy.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var products=[{wanted:'NaCl',Mr_w:58.5,by:'H\u2082O',Mr_b:18},{wanted:'CuSO\u2084',Mr_w:160,by:'H\u2082O',Mr_b:18},{wanted:'MgCl\u2082',Mr_w:95,by:'H\u2082O',Mr_b:18},{wanted:'Fe',Mr_w:56,by:'CO\u2082',Mr_b:44}];var p2=pick(products);var total=p2.Mr_w+p2.Mr_b;var ae=parseFloat((p2.Mr_w/total*100).toFixed(1));return{question:'Products: <b>'+p2.wanted+'</b> (M\u1d63='+p2.Mr_w+') + <b>'+p2.by+'</b> (M\u1d63='+p2.Mr_b+'). % atom economy for '+p2.wanted+'?',hints:['% = M\u1d63 desired / \u03a3M\u1d63 all products \u00d7 100'],ans:ae,tol:0.5,unit:'%',working:'% = '+p2.Mr_w+'/'+(total)+'\u00d7100 = '+ae+'%'};})},
]},
{ey:'Q5 \u2022 Y11 Chemistry \u2022 Practical',ti:'Drawing and Interpreting Graphs',su:'Draw graphs correctly and calculate gradients.',steps:[
  {lb:'Graph drawing rules',dr:dQ5,ht:'<p>1. Label axes: quantity and units. 2. Use at least half the grid. 3. Plot accurately (pencil). 4. Draw line of best fit (straight or curve, NOT dot-to-dot). 5. Circle anomalous points (exclude from line). 6. Gradient = \u0394y/\u0394x (use large triangle).</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var dy=rnd(20,100),dx=rnd(10,50),gradient=parseFloat((dy/dx).toFixed(2));return{question:'Graph: rise = <b>'+dy+' units</b>, run = <b>'+dx+' units</b>. Find gradient.',hints:['gradient = \u0394y / \u0394x = rise / run'],ans:gradient,tol:gradient*0.02,unit:'',working:'gradient = '+dy+'/'+dx+' = '+gradient};})},
]},
{ey:'Q6 \u2022 Y11 Chemistry \u2022 Practical',ti:'Safe Handling of Chemicals',su:'Apply COSHH principles. Identify hazards and precautions.',steps:[
  {lb:'Chemical safety',dr:dQ6,ht:'<p>COSHH = Control of Substances Hazardous to Health. Hazard symbols: corrosive (acids/alkalis), flammable, toxic, oxidising, irritant, environmental hazard, explosive. Precautions: PPE (goggles, gloves, lab coat), fume cupboard for toxic/volatile substances, no mouth pipetting, dispose correctly.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var qs=[{q:'Concentrated H\u2082SO\u2084 is corrosive. You should: 1=handle without gloves, 2=wear gloves and goggles and handle carefully.',a:2,w:'Corrosive: always wear PPE (goggles + gloves). Answer: 2.'},{q:'Toxic gases (e.g. Cl\u2082, Br\u2082 vapour) should be handled: 1=on an open bench, 2=in a fume cupboard.',a:2,w:'Toxic/volatile: always use fume cupboard. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Corrosive: PPE. Toxic/volatile: fume cupboard.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q7 \u2022 Y11 Chemistry \u2022 Practical',ti:'Making a Standard Solution',su:'Describe how to make a standard solution of known concentration.',steps:[
  {lb:'Standard solution',dr:dQ7,ht:'<p>1. Calculate mass needed: mass = conc \u00d7 vol(L) \u00d7 M\u1d63. 2. Weigh accurately on balance. 3. Dissolve in small amount of distilled water in beaker. 4. Transfer to volumetric flask (exact volume, e.g. 250 cm\u00b3). 5. Rinse beaker 3\u00d7 into flask. 6. Add water up to the graduation mark (use dropper near end). 7. Stopper and invert to mix.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var compounds=[{name:'NaOH',Mr:40},{name:'KCl',Mr:74.5},{name:'Na\u2082CO\u2083',Mr:106},{name:'NaCl',Mr:58.5}];var c=pick(compounds);var conc=rnd(1,5)*0.1,vol_L=rnd(1,5)*0.05;var mass=parseFloat((conc*vol_L*c.Mr).toFixed(2));return{question:'Make '+conc+' mol/L '+c.name+' in '+Math.round(vol_L*1000)+' mL. Mass needed? (M\u1d63='+c.Mr+')',hints:['mass = conc \u00d7 vol(L) \u00d7 M\u1d63'],ans:mass,tol:mass*0.02,unit:'g',working:'mass = '+conc+'\u00d7'+vol_L+'\u00d7'+c.Mr+' = '+mass+' g'};})},
]},
{ey:'Q8 \u2022 Y11 Chemistry \u2022 Practical',ti:'Collecting Gases',su:'Describe methods for collecting and testing gases.',steps:[
  {lb:'Gas collection',dr:dQ8,ht:'<p>Collection over water: collect gas in inverted water-filled tube; works for insoluble gases (H\u2082, O\u2082, CO, N\u2082). Downward displacement of air: for dense gases heavier than air (CO\u2082, Cl\u2082). Upward displacement of air: for gases lighter than air (H\u2082, NH\u2083). Gas syringe: most accurate.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var qs=[{q:'Hydrogen is collected by upward displacement of air because: 1=H\u2082 is denser than air, 2=H\u2082 is less dense than air and rises.',a:2,w:'H\u2082 is lighter than air (M\u1d63=2 vs 29) \u2192 rises and displaces air upward. Answer: 2.'},{q:'CO\u2082 is collected by downward displacement of air because: 1=CO\u2082 is denser than air and sinks, 2=CO\u2082 dissolves in water.',a:1,w:'CO\u2082 (M\u1d63=44) > air (M\u1d63\u224829) \u2192 sinks, displaces air downward. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['H\u2082: lighter than air. CO\u2082: denser than air. NH\u2083: lighter than air.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q9 \u2022 Y11 Chemistry \u2022 Practical',ti:'Analysing Results and Conclusions',su:'Draw conclusions from data. Identify sources of error.',steps:[
  {lb:'Conclusions and evaluation',dr:dQ9,ht:'<p>Writing a conclusion: state what the results show, refer to data, explain using chemistry. Evaluation: are results reliable? (repeat measurements, concordant titres). Limitations: small sample size, impure reagents, heat loss, incomplete reaction. Improvements: more replicates, purer reagents, better insulation.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var qs=[{q:'A student gets titration results of 24.5, 24.6, 27.3, 24.4 cm\u00b3. Which value is anomalous? 1=24.5, 2=27.3.',a:2,w:'27.3 is far from the others (24.4\u201324.6) \u2192 anomalous. Answer: 2.'},{q:'To improve the accuracy of a titration, you should: 1=only do one titration, 2=repeat until you get concordant results (within 0.1 cm\u00b3).',a:2,w:'Concordant results: more reliable. Answer: 2.'}];var qq=pick(qs);return{question:qq.q,hints:['Anomalous: far from other results. Concordant: within 0.1 cm\u00b3.'],ans:qq.a,tol:0,unit:'',working:qq.w};})},
]},
{ey:'Q10 \u2022 Y11 Chemistry \u2022 Practical',ti:'Mixed Practical Skills',su:'Techniques, errors, calculations and safety combined.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Meniscus: read bottom. Concordant: \u00b10.1 cm\u00b3. Random: scatter \u2192 repeat. Systematic: always shifted. % yield = actual/theoretical\u00d7100. Atom economy = M\u1d63 wanted/\u03a3M\u1d63 all\u00d7100. Gradient = \u0394y/\u0394x.</p>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['yield','error','gradient']);if(type==='yield'){var theoretical=rnd(20,100),pct=rnd(50,95),actual=parseFloat((theoretical*pct/100).toFixed(1));return{question:'Theoretical = <b>'+theoretical+' g</b>, actual = <b>'+actual+' g</b>. % yield?',hints:['% = actual/theoretical \u00d7 100'],ans:pct,tol:1,unit:'%',working:'% = '+actual+'/'+theoretical+'\u00d7100 = '+pct+'%'};}if(type==='error'){var qs=[{q:'All readings are 0.2 g too high. This is: 1=random error, 2=systematic error.',a:2,w:'Systematic: all readings shifted same direction. Answer: 2.'},{q:'Readings vary up and down around true value. This is: 1=random error, 2=systematic error.',a:1,w:'Random: unpredictable scatter around true value. Answer: 1.'}];var qq=pick(qs);return{question:qq.q,hints:['Systematic: always same direction. Random: scatter.'],ans:qq.a,tol:0,unit:'',working:qq.w};}var dy=rnd(20,100),dx=rnd(10,50);return{question:'Graph: rise=<b>'+dy+'</b>, run=<b>'+dx+'</b>. Gradient?',hints:['gradient = \u0394y/\u0394x'],ans:parseFloat((dy/dx).toFixed(2)),tol:0.02,unit:'',working:'gradient = '+dy+'/'+dx+' = '+parseFloat((dy/dx).toFixed(2))};})},
]},
