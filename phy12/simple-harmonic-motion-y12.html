<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'SHM definition and equations',ACC,12,'middle',true));
o.push(R(10,36,460,44,CRM,ACC,2));o.push(T(240,54,'a = -\u03c9\u00b2 x',DARK,18,'middle',true));o.push(T(240,72,'Acceleration proportional to displacement; directed toward centre',ACC,9,'middle',false));
if(p>=1){o.push(R(10,90,460,40,CRM,ACC,1.5));o.push(T(240,108,'x = A sin(\u03c9t) or x = A cos(\u03c9t)','#333',11,'middle',false));o.push(T(240,126,'v = A\u03c9 cos(\u03c9t) or \u2212A\u03c9 sin(\u03c9t)','#555',9,'middle',false));}
if(p>=2){o.push(R(10,140,460,40,CRM,ACC,1.5));o.push(T(240,158,'v = \u03c9\u221a(A\u00b2 \u2212 x\u00b2) | max speed at x=0: v_max = A\u03c9','#333',11,'middle',false));}
if(p>=3){o.push(R(10,190,460,40,CRM,ACC,1.5));o.push(T(240,208,'\u03c9 = 2\u03c0f = 2\u03c0/T | T = 2\u03c0/\u03c9','#333',11,'middle',false));}
if(p>=4){o.push(R(10,238,460,18,LINE,ACC,0.5));o.push(T(240,250,'Max acceleration at x=\u00b1A: |a_max|=A\u03c9\u00b2 | At x=0: a=0 and v=max','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'SHM energy',ACC,12,'middle',true));
if(p>=1){o.push(R(10,36,460,42,CRM,ACC,2));o.push(T(240,54,'E_KE = \u00bdm\u03c9\u00b2(A\u00b2 \u2212 x\u00b2)','#333',11,'middle',false));o.push(T(240,72,'E_PE = \u00bdm\u03c9\u00b2 x\u00b2 | Total E = \u00bdm\u03c9\u00b2 A\u00b2 (constant)','#555',9,'middle',false));}
if(p>=2){o.push(R(10,88,460,42,CRM,ACC,1.5));o.push(T(240,106,'At x=0: KE=max, PE=0 | At x=A: KE=0, PE=max','#333',11,'middle',false));}
if(p>=3){o.push(R(10,140,460,42,CRM,ACC,1.5));o.push(T(240,158,'KE and PE both vary as sin\u00b2 or cos\u00b2 of t','#333',11,'middle',false));o.push(T(240,176,'Both complete two cycles per period of oscillation','#555',9,'middle',false));}
if(p>=4){o.push(R(10,192,460,42,LINE,ACC,1));o.push(T(240,210,'Damping: total energy decreases; amplitude decreases over time','#333',10,'middle',false));o.push(T(240,228,'Resonance: driving freq = natural freq \u2192 max amplitude buildup','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'SHM summary',ACC,13,'middle',true));
[['SHM condition','a = -\u03c9\u00b2 x; restoring force \u221d displacement'],['Displacement','x = A sin(\u03c9t)'],['Velocity','v = \u03c9\u221a(A\u00b2-x\u00b2); v_max = A\u03c9 at x=0'],['Acceleration','a = -\u03c9\u00b2 x; |a_max| = A\u03c9\u00b2 at x=\u00b1A'],['Energy total','\u00bdm\u03c9\u00b2A\u00b2 (constant for undamped)'],['Pendulum','\u03c9=\u221a(g/L); T=2\u03c0\u221a(L/g)'],['Spring','\u03c9=\u221a(k/m); T=2\u03c0\u221a(m/k)']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 SHM',ti:'Definition and Equations of SHM',su:'State the condition for SHM. Use x, v, a equations.',steps:[
  {lb:'SHM condition',dr:dQ1,ht:'<p>Simple harmonic motion: acceleration is proportional to displacement and always directed toward the equilibrium position. a = \u2212\u03c9\u00b2 x. The negative sign means a opposes x. Angular frequency \u03c9 = 2\u03c0f = 2\u03c0/T. SHM requires a restoring force: F = \u2212kx (Hooke\u2019s law or analogous).</p>'},
  {lb:'Displacement and velocity',dr:dQ1,ht:'<p>x = A sin(\u03c9t) (starts at x=0 at t=0) or x = A cos(\u03c9t) (starts at amplitude). v = dx/dt = A\u03c9 cos(\u03c9t) or \u2212A\u03c9 sin(\u03c9t). Speed at displacement x: v = \u03c9\u221a(A\u00b2 \u2212 x\u00b2). Maximum speed at x=0: v_max = A\u03c9.</p>'},
  {lb:'Acceleration',dr:dQ1,ht:'<p>a = d\u00b2x/dt\u00b2 = \u2212\u03c9\u00b2 A sin(\u03c9t) = \u2212\u03c9\u00b2 x. Maximum acceleration at x = \u00b1A: |a_max| = A\u03c9\u00b2. At x = 0: a = 0 (but v = v_max). At x = \u00b1A: a = max, v = 0 (momentarily at rest). Phase: a is 180\u00b0 out of phase with x; v is 90\u00b0 ahead of x.</p>'},
  {lb:'Period and frequency',dr:dQ1,ht:'<p>\u03c9 = 2\u03c0f = 2\u03c0/T. Pendulum: \u03c9 = \u221a(g/L), T = 2\u03c0\u221a(L/g). Mass on spring: \u03c9 = \u221a(k/m), T = 2\u03c0\u221a(m/k). Note: pendulum T independent of mass and amplitude (small angles). Spring T independent of amplitude. Both depend only on physical properties.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['v_max','a_max','omega']);if(type==='v_max'){var A=rnd(1,20)/100,omega=rnd(1,30),vmax=parseFloat((A*omega).toFixed(3));return{question:'SHM: A=<b>'+A.toFixed(2)+'m</b>, \u03c9=<b>'+omega+' rad/s</b>. Max speed?',hints:['v_max=A\u03c9'],ans:vmax,tol:vmax*0.02,unit:'m/s',working:'v_max='+A.toFixed(2)+'\u00d7'+omega+' = '+vmax+' m/s'};}if(type==='a_max'){var A=rnd(1,20)/100,omega=rnd(1,20),amax=parseFloat((A*omega*omega).toFixed(3));return{question:'SHM: A=<b>'+A.toFixed(2)+'m</b>, \u03c9=<b>'+omega+' rad/s</b>. Max acceleration?',hints:['|a_max|=A\u03c9\u00b2'],ans:amax,tol:amax*0.02,unit:'m/s\u00b2',working:'|a_max|='+A.toFixed(2)+'\u00d7'+omega+'\u00b2 = '+amax+' m/s\u00b2'};}var f=rnd(1,20),omega=parseFloat((2*Math.PI*f).toFixed(2));return{question:'f=<b>'+f+'Hz</b>. Angular frequency \u03c9?',hints:['\u03c9=2\u03c0f'],ans:omega,tol:omega*0.01,unit:'rad/s',working:'\u03c9=2\u03c0\u00d7'+f+' = '+omega+' rad/s'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 SHM',ti:'Energy in SHM',su:'Calculate KE, PE and total energy in SHM.',steps:[
  {lb:'Energy equations',dr:dQ2,ht:'<p>Kinetic energy: E_KE = \u00bdmv\u00b2 = \u00bdm\u03c9\u00b2(A\u00b2 \u2212 x\u00b2). Potential energy: E_PE = \u00bdm\u03c9\u00b2x\u00b2. Total mechanical energy: E = E_KE + E_PE = \u00bdm\u03c9\u00b2A\u00b2 (constant for undamped SHM). Energy is conserved; exchanges between KE and PE.</p>'},
  {lb:'Energy variation',dr:dQ2,ht:'<p>At x = 0 (equilibrium): E_PE = 0, E_KE = maximum = \u00bdm\u03c9\u00b2A\u00b2. At x = \u00b1A (amplitude): E_KE = 0, E_PE = maximum = \u00bdm\u03c9\u00b2A\u00b2. At x = A/\u221a2: E_KE = E_PE = \u00bdE_total. Both KE and PE vary as sin\u00b2 or cos\u00b2 with time \u2192 frequency is 2\u03c9 (twice SHM frequency).</p>'},
  {lb:'Damping',dr:dQ2,ht:'<p>Damping: energy removed from system (by friction/air resistance). Amplitude decreases exponentially. Three types: light damping (oscillates with decreasing amplitude), critical damping (returns to equilibrium fastest without oscillating), heavy damping (slowly returns without oscillating). Critical damping: used in car suspensions and door closers.</p>'},
  {lb:'Resonance',dr:dQ2,ht:'<p>Resonance: when driving frequency = natural frequency, amplitude is maximum. With light damping: large resonance peak. With heavy damping: broader, shorter peak; resonance at slightly lower frequency than natural frequency. Examples: breaking glass, Tacoma Narrows Bridge, MRI machines. Used in: radio tuning, musical instruments.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['total_E','KE_at_x','PE_at_x']);var m=rnd(1,10),omega=rnd(2,10),A=rnd(1,20)/100;if(type==='total_E'){var E=parseFloat((0.5*m*omega*omega*A*A).toFixed(4));return{question:'m=<b>'+m+'kg</b>, \u03c9=<b>'+omega+'rad/s</b>, A=<b>'+A.toFixed(2)+'m</b>. Total SHM energy?',hints:['E=\u00bdm\u03c9\u00b2A\u00b2'],ans:E,tol:E*0.02,unit:'J',working:'E=0.5\u00d7'+m+'\u00d7'+omega+'\u00b2\u00d7'+A.toFixed(2)+'\u00b2 = '+E+' J'};}var x=parseFloat((A*rnd(1,9)/10).toFixed(3));if(type==='KE_at_x'){var KE=parseFloat((0.5*m*omega*omega*(A*A-x*x)).toFixed(4));return{question:'m=<b>'+m+'kg</b>, \u03c9=<b>'+omega+'</b>, A=<b>'+A.toFixed(2)+'m</b>, x=<b>'+x.toFixed(3)+'m</b>. KE?',hints:['KE=\u00bdm\u03c9\u00b2(A\u00b2-x\u00b2)'],ans:KE,tol:KE*0.05,unit:'J',working:'KE=0.5\u00d7'+m+'\u00d7'+omega+'\u00b2\u00d7('+A.toFixed(2)+'\u00b2-'+x.toFixed(3)+'\u00b2) = '+KE+' J'};}var PE=parseFloat((0.5*m*omega*omega*x*x).toFixed(4));return{question:'m=<b>'+m+'kg</b>, \u03c9=<b>'+omega+'</b>, x=<b>'+x.toFixed(3)+'m</b>. PE?',hints:['PE=\u00bdm\u03c9\u00b2x\u00b2'],ans:PE,tol:PE*0.05,unit:'J',working:'PE=0.5\u00d7'+m+'\u00d7'+omega+'\u00b2\u00d7'+x.toFixed(3)+'\u00b2 = '+PE+' J'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 SHM',ti:'Mass-Spring System',su:'Apply SHM equations to a mass on a spring.',steps:[
  {lb:'Spring-mass system',dr:dQ3,ht:'<div class="fm">T = 2\u03c0\u221a(m/k) &nbsp;&nbsp; \u03c9 = \u221a(k/m)</div><p>Spring constant k (N/m). Mass m (kg). Period T independent of amplitude. The restoring force F = \u2212kx obeys Hooke\u2019s law \u2192 gives exactly SHM. Vertical spring: equilibrium at natural length + extension under weight; oscillates about new equilibrium.</p>'},
  {lb:'Vertical spring',dr:dQ3,ht:'<p>At equilibrium: kx\u2080 = mg where x\u2080 is static extension. If displaced further by x from equilibrium: net force = \u2212kx (same as horizontal). Period T = 2\u03c0\u221a(m/k) regardless of orientation. Can use pendulum T\u00b2 vs L method analogously: T\u00b2 vs m to find k.</p>'},
  {lb:'Combined spring-mass energy',dr:dQ3,ht:'<p>Total energy = KE + spring PE = \u00bdmv\u00b2 + \u00bdkx\u00b2 = \u00bdkA\u00b2 (constant). Max speed: v_max = A\u221a(k/m) = A\u03c9. Verify: KE + PE = \u00bdm(A\u03c9)sin\u00b2 + \u00bdkA\u00b2cos\u00b2 = \u00bdkA\u00b2(sin\u00b2+cos\u00b2) = \u00bdkA\u00b2 (using k=m\u03c9\u00b2).</p>'},
  {lb:'Measuring k from SHM period',dr:dQ3,ht:'<p>Experiment: vary mass m; measure period T. Plot T\u00b2 vs m: straight line through origin; gradient = 4\u03c0\u00b2/k. Then k = 4\u03c0\u00b2/gradient. Sources of error: spring mass (significant for light spring), damping, not small enough amplitude. Compare k with static Hooke\u2019s law measurement.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['T_from_mk','k_from_T','vmax_spring']);if(type==='T_from_mk'){var m=rnd(1,20)/10,k=rnd(5,200),T=parseFloat((2*Math.PI*Math.sqrt(m/k)).toFixed(3));return{question:'m=<b>'+m.toFixed(1)+'kg</b>, k=<b>'+k+'N/m</b>. Period T?',hints:['T=2\u03c0\u221a(m/k)'],ans:T,tol:T*0.01,unit:'s',working:'T=2\u03c0\u221a('+m.toFixed(1)+'/'+k+') = '+T+' s'};}if(type==='k_from_T'){var m=rnd(1,20)/10,T=rnd(5,30)/10,k=parseFloat((4*Math.PI*Math.PI*m/(T*T)).toFixed(2));return{question:'m=<b>'+m.toFixed(1)+'kg</b>, T=<b>'+T+'s</b>. Spring constant k?',hints:['k=4\u03c0\u00b2m/T\u00b2'],ans:k,tol:k*0.02,unit:'N/m',working:'k=4\u03c0\u00b2\u00d7'+m.toFixed(1)+'/'+T+'\u00b2 = '+k+' N/m'};}var m=rnd(1,10)/10,k=rnd(10,200),A=rnd(1,10)/100,vmax=parseFloat((A*Math.sqrt(k/m)).toFixed(3));return{question:'m=<b>'+m.toFixed(2)+'kg</b>, k=<b>'+k+'N/m</b>, A=<b>'+A.toFixed(2)+'m</b>. Max speed?',hints:['v_max=A\u03c9=A\u221a(k/m)'],ans:vmax,tol:vmax*0.02,unit:'m/s',working:'v_max='+A.toFixed(2)+'\u00d7\u221a('+k+'/'+m.toFixed(2)+') = '+vmax+' m/s'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 SHM',ti:'Simple Pendulum as SHM',su:'Derive and apply T=2\u03c0\u221a(L/g) for the pendulum.',steps:[
  {lb:'Pendulum as SHM',dr:dQ4,ht:'<p>Simple pendulum: bob of mass m, string length L, swings at angle \u03b8. Restoring force = \u2212mg sin\u03b8 \u2248 \u2212mg\u03b8 for small \u03b8. With arc length s = L\u03b8: F = \u2212(mg/L)s = \u2212ks. So \u03c9\u00b2 = g/L and T = 2\u03c0\u221a(L/g). Approximation valid for \u03b8 < ~10\u00b0.</p>'},
  {lb:'Period and energy',dr:dQ4,ht:'<p>T = 2\u03c0\u221a(L/g); \u03c9 = \u221a(g/L). KE max at bottom: \u00bdmv_max\u00b2 = mgl(1\u2212cos\u03b8\u2080) \u2248 \u00bdmg(A\u00b2/L) for small \u03b8. GPE at angle \u03b8: mgl(1\u2212cos\u03b8). The pendulum exchanges KE (at bottom) with GPE (at top of swing).</p>'},
  {lb:'Conical pendulum',dr:dQ4,ht:'<p>Conical pendulum: bob moves in horizontal circle, string at angle \u03b8 to vertical. T cos\u03b8 = mg; T sin\u03b8 = m\u03c9\u00b2r. Therefore: tan\u03b8 = \u03c9\u00b2r/g and g tan\u03b8 = \u03c9\u00b2 r = \u03c9\u00b2 L sin\u03b8. So \u03c9\u00b2 = g/(L cos\u03b8); T = 2\u03c0\u221a(L cos\u03b8/g). Faster rotation \u2192 larger \u03b8.</p>'},
  {lb:'Torsional pendulum',dr:dQ4,ht:'<p>Torsional pendulum: disc suspended from wire; rotates about vertical axis. Restoring torque \u03c4 = \u2212c\u03b8 (torsional spring constant c). Angular SHM: I\u03b1 = \u2212c\u03b8; \u03c9\u00b2 = c/I; T = 2\u03c0\u221a(I/c). Used to measure G (Cavendish experiment) and properties of materials.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['T_pendulum','L_from_T','g_from_T2L']);if(type==='T_pendulum'){var L=rnd(10,200)/100,T=parseFloat((2*Math.PI*Math.sqrt(L/9.81)).toFixed(3));return{question:'Pendulum L=<b>'+L.toFixed(2)+'m</b>. Period T?',hints:['T=2\u03c0\u221a(L/g)'],ans:T,tol:T*0.01,unit:'s',working:'T=2\u03c0\u221a('+L.toFixed(2)+'/9.81) = '+T+' s'};}if(type==='L_from_T'){var T=rnd(10,30)/10,L=parseFloat((9.81*T*T/(4*Math.PI*Math.PI)).toFixed(3));return{question:'T=<b>'+T+'s</b>. Pendulum length L?',hints:['L=gT\u00b2/(4\u03c0\u00b2)'],ans:L,tol:L*0.02,unit:'m',working:'L=9.81\u00d7'+T+'\u00b2/(4\u03c0\u00b2) = '+L+' m'};}var L=rnd(10,200)/100,T=parseFloat((2*Math.PI*Math.sqrt(L/9.81)).toFixed(3)),grad=parseFloat((4*Math.PI*Math.PI/9.81).toFixed(3)),g_calc=parseFloat((4*Math.PI*Math.PI/grad).toFixed(2));return{question:'T\u00b2 vs L gradient=<b>'+grad+' s\u00b2/m</b>. Calculate g.',hints:['g=4\u03c0\u00b2/gradient'],ans:g_calc,tol:g_calc*0.01,unit:'m/s\u00b2',working:'g=4\u03c0\u00b2/'+grad+' = '+g_calc+' m/s\u00b2'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 SHM',ti:'Velocity in SHM',su:'Calculate velocity at different displacements in SHM.',steps:[
  {lb:'Velocity equation',dr:dQ5,ht:'<div class="fm">v = \u03c9\u221a(A\u00b2 \u2212 x\u00b2)</div><p>Derived from energy conservation: \u00bdmv\u00b2 + \u00bdm\u03c9\u00b2x\u00b2 = \u00bdm\u03c9\u00b2A\u00b2. Maximum speed: v_max = A\u03c9 (when x=0). Zero speed: when x = \u00b1A (at amplitude). Direction: changes sign on each half cycle.</p>'},
  {lb:'Phase relationships',dr:dQ5,ht:'<p>If x = A cos(\u03c9t): v = \u2212A\u03c9 sin(\u03c9t). Velocity leads displacement by 90\u00b0 (a quarter period ahead). Acceleration a = \u2212A\u03c9\u00b2 cos(\u03c9t) = \u2212\u03c9\u00b2 x. Acceleration is 180\u00b0 out of phase with displacement. Phase summary: x \u2192 v leads by 90\u00b0 \u2192 a leads by another 90\u00b0.</p>'},
  {lb:'Velocity-displacement graph',dr:dQ5,ht:'<p>v\u00b2 = \u03c9\u00b2(A\u00b2 \u2212 x\u00b2) is the equation of an ellipse in v-x space. Plot v vs x: ellipse with semi-major axis A\u03c9 (on v-axis) and A (on x-axis). As damping increases, ellipse spirals inward. Each point on ellipse represents instantaneous state of oscillator.</p>'},
  {lb:'Applications and examples',dr:dQ5,ht:'<p>Mass on spring: at x=0, all energy is KE; v=A\u03c9. Pendulum at bottom: v=A\u03c9 = \u221a(2gL(1\u2212cos\u03b8\u2080)) for large angle. At amplitude: v=0, all energy PE. Spring stores EPE; pendulum stores GPE. In both cases: v = \u03c9\u221a(A\u00b2\u2212x\u00b2).</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['v_at_x','v_max','omega_from_Av']);if(type==='v_at_x'){var A=rnd(5,20)/100,omega=rnd(5,20),x=parseFloat((A*rnd(2,9)/10).toFixed(3)),v=parseFloat((omega*Math.sqrt(A*A-x*x)).toFixed(3));return{question:'A=<b>'+A.toFixed(2)+'m</b>, \u03c9=<b>'+omega+'rad/s</b>, x=<b>'+x.toFixed(3)+'m</b>. Speed?',hints:['v=\u03c9\u221a(A\u00b2-x\u00b2)'],ans:v,tol:v*0.03,unit:'m/s',working:'v='+omega+'\u00d7\u221a('+A.toFixed(2)+'\u00b2-'+x.toFixed(3)+'\u00b2) = '+v+' m/s'};}if(type==='v_max'){var A=rnd(5,20)/100,omega=rnd(5,20),vmax=parseFloat((A*omega).toFixed(3));return{question:'A=<b>'+A.toFixed(2)+'m</b>, \u03c9=<b>'+omega+'rad/s</b>. Max speed?',hints:['v_max=A\u03c9 (at x=0)'],ans:vmax,tol:vmax*0.01,unit:'m/s',working:'v_max='+A.toFixed(2)+'\u00d7'+omega+' = '+vmax+' m/s'};}var A=rnd(5,20)/100,vmax=rnd(1,20)/10,omega=parseFloat((vmax/A).toFixed(2));return{question:'A=<b>'+A.toFixed(2)+'m</b>, v_max=<b>'+vmax.toFixed(2)+'m/s</b>. Angular frequency \u03c9?',hints:['\u03c9=v_max/A'],ans:omega,tol:omega*0.02,unit:'rad/s',working:'\u03c9='+vmax.toFixed(2)+'/'+A.toFixed(2)+' = '+omega+' rad/s'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 SHM',ti:'Damping and Resonance',su:'Describe damping types. Explain resonance and its consequences.',steps:[
  {lb:'Types of damping',dr:dQ6,ht:'<p>Light (under-damping): oscillates with decreasing amplitude; amplitude decreases exponentially; energy lost slowly. Critical damping: fastest return to equilibrium without oscillating; timing mechanism for balance. Heavy (over-damping): returns to equilibrium slowly without oscillating; too sluggish.</p>'},
  {lb:'Energy and amplitude in damped SHM',dr:dQ6,ht:'<p>Energy \u221d A\u00b2; as energy dissipated, A decreases. Light damping: amplitude envelope A(t) = A\u2080 e^(\u2212\u03b3t) where \u03b3 = b/(2m), b = damping constant. Period approximately unchanged for light damping. Q-factor = \u03c9\u2080/(2\u03b3): high Q = low damping = sharp resonance.</p>'},
  {lb:'Forced oscillations and resonance',dr:dQ6,ht:'<p>Forced oscillation: external periodic force at frequency f_d drives system. If f_d = f_0 (natural frequency): resonance; amplitude builds up. Maximum amplitude limited only by damping. Phase at resonance: driving force leads displacement by 90\u00b0. Applications: tuning circuits (radio), musical instruments, MRI.</p>'},
  {lb:'Resonance consequences',dr:dQ6,ht:'<p>Dangerous resonance: Tacoma Narrows Bridge (1940, wind-induced oscillation matched natural frequency). London Millennium Bridge (2000, pedestrians walking at bridge frequency). Soldiers break step on bridges. Beneficial: radio tuning, microwave oven, NMR/MRI, ultrasound cleaning, quartz clocks (crystal at resonance).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['Q_factor','resonance_freq','damping_ratio']);if(type==='Q_factor'){var omega0=rnd(10,100),gamma=rnd(1,10),Q=parseFloat((omega0/(2*gamma)).toFixed(1));return{question:'\u03c9\u2080=<b>'+omega0+'rad/s</b>, \u03b3=<b>'+gamma+'s\u207b\u00b9</b>. Q-factor?',hints:['Q=\u03c9\u2080/(2\u03b3)'],ans:Q,tol:Q*0.02,unit:'',working:'Q='+omega0+'/(2\u00d7'+gamma+') = '+Q};}if(type==='resonance_freq'){var L=rnd(10,200)/100,f=parseFloat((1/(2*Math.PI)*Math.sqrt(9.81/L)).toFixed(3));return{question:'Pendulum L=<b>'+L.toFixed(2)+'m</b>. Resonance frequency?',hints:['f_0=1/(2\u03c0)\u00d7\u221a(g/L)'],ans:f,tol:f*0.02,unit:'Hz',working:'f=\u221a(9.81/'+L.toFixed(2)+')/(2\u03c0) = '+f+' Hz'};}var m=rnd(1,10),k=rnd(10,500),omega=parseFloat(Math.sqrt(k/m).toFixed(2));return{question:'Spring k=<b>'+k+'N/m</b>, m=<b>'+m+'kg</b>. Natural angular frequency?',hints:['\u03c9\u2080=\u221a(k/m)'],ans:omega,tol:omega*0.02,unit:'rad/s',working:'\u03c9=\u221a('+k+'/'+m+') = '+omega+' rad/s'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 SHM',ti:'SHM Graphs',su:'Interpret and sketch displacement, velocity and acceleration graphs.',steps:[
  {lb:'x-t, v-t and a-t graphs',dr:dQ7,ht:'<p>x = A cos(\u03c9t): cosine curve, amplitude A, period T. v = \u2212A\u03c9 sin(\u03c9t): sine curve, amplitude A\u03c9, 90\u00b0 behind x. a = \u2212A\u03c9\u00b2 cos(\u03c9t): cosine curve, amplitude A\u03c9\u00b2, 180\u00b0 out of phase with x (a is inverted x). All three are sinusoidal with same period T.</p>'},
  {lb:'Key points on graphs',dr:dQ7,ht:'<p>At t=0 (starting at x=A): x=A, v=0, a=\u2212A\u03c9\u00b2. At t=T/4 (at x=0): x=0, v=\u2212A\u03c9, a=0. At t=T/2 (at x=\u2212A): x=\u2212A, v=0, a=+A\u03c9\u00b2. At t=3T/4 (at x=0 moving right): x=0, v=+A\u03c9, a=0. Pattern repeats.</p>'},
  {lb:'Energy graphs',dr:dQ7,ht:'<p>KE = \u00bdm\u03c9\u00b2(A\u00b2\u2212x\u00b2): parabola opening downward in KE-x graph. PE = \u00bdm\u03c9\u00b2x\u00b2: parabola opening upward. Total energy = \u00bdm\u03c9\u00b2A\u00b2: constant horizontal line. KE + PE = constant at every point. KE is maximum at x=0; PE is maximum at x=\u00b1A.</p>'},
  {lb:'Phase and superposition',dr:dQ7,ht:'<p>Adding two SHMs: x = A\u2081cos(\u03c9t) + A\u2082cos(\u03c9t+\u03c6). Same frequency \u03c9: resultant is also SHM at same frequency; resultant amplitude depends on phase \u03c6. \u03c6=0: A_R = A\u2081+A\u2082 (constructive). \u03c6=\u03c0: A_R = |A\u2081-A\u2082| (destructive). Different frequencies: beats (\u03c9\u2081-\u03c9\u2082).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['read_period','amplitude_from_v','phase']);if(type==='read_period'){var f=rnd(1,10),T=parseFloat((1/f).toFixed(3));return{question:'SHM with f=<b>'+f+' Hz</b>. Period T?',hints:['T=1/f'],ans:T,tol:T*0.01,unit:'s',working:'T=1/'+f+' = '+T+' s'};}if(type==='amplitude_from_v'){var vmax=rnd(1,20)/10,omega=rnd(5,20),A=parseFloat((vmax/omega).toFixed(3));return{question:'v_max=<b>'+vmax.toFixed(2)+'m/s</b>, \u03c9=<b>'+omega+'rad/s</b>. Amplitude A?',hints:['A=v_max/\u03c9'],ans:A,tol:A*0.02,unit:'m',working:'A='+vmax.toFixed(2)+'/'+omega+' = '+A+' m'};}var A=rnd(5,20)/100,omega=rnd(5,15),amax=parseFloat((A*omega*omega).toFixed(3));return{question:'A=<b>'+A.toFixed(2)+'m</b>, \u03c9=<b>'+omega+'rad/s</b>. Max acceleration?',hints:['a_max=A\u03c9\u00b2'],ans:amax,tol:amax*0.02,unit:'m/s\u00b2',working:'a_max='+A.toFixed(2)+'\u00d7'+omega+'\u00b2 = '+amax+' m/s\u00b2'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 SHM',ti:'Applications of SHM',su:'Describe real systems exhibiting SHM.',steps:[
  {lb:'Examples of SHM',dr:dQ8,ht:'<p>Simple pendulum (small angle). Mass on spring. Floating object (bobbing). Guitar string. Air column in pipe. Atomic vibrations in solids (basis of specific heat). LC circuit (electrical SHM: Q = Q\u2080 cos(\u03c9t), \u03c9 = 1/\u221a(LC)). All share: restoring force \u221d displacement, period independent of amplitude.</p>'},
  {lb:'LC circuits as electrical SHM',dr:dQ8,ht:'<p>Inductor L and capacitor C in circuit. Energy oscillates between E_C = Q\u00b2/(2C) (electric) and E_L = \u00bdLI\u00b2 (magnetic). Analogous to: C\u21c4m, L\u21c4k, Q\u21c4x, I\u21c4v. Angular frequency: \u03c9 = 1/\u221a(LC). Application: radio tuning (change C to select station).</p>'},
  {lb:'Bungee jumping and oscillations',dr:dQ8,ht:'<p>Bungee: initially free fall, then stretched cord gives SHM about a new equilibrium. Period depends on cord spring constant and mass. At max stretch: all KE + initial GPE stored in cord. Analysis: split into free fall phase and SHM phase with displaced equilibrium.</p>'},
  {lb:'Atomic SHM and thermal energy',dr:dQ8,ht:'<p>Atoms in solids vibrate about equilibrium positions (like 3D SHM). Average energy per mode: k_BT (equipartition theorem). Total thermal energy U = 3Nk_BT = 3nRT. This gives molar heat capacity at constant volume C_V = 3R = 24.9 J/mol/K (Dulong-Petit law). Deviations at low T explained by quantum mechanics (Einstein/Debye models).</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['LC_omega','spring_mass_T','pendulum_T']);if(type==='LC_omega'){var L=rnd(1,100)/1000,C=rnd(1,100)/1e6,omega=parseFloat((1/Math.sqrt(L*C)).toFixed(0));return{question:'L=<b>'+L.toFixed(3)+'H</b>, C=<b>'+C.toExponential(2)+'F</b>. Angular frequency \u03c9 of LC circuit?',hints:['\u03c9=1/\u221a(LC)'],ans:omega,tol:omega*0.03,unit:'rad/s',working:'\u03c9=1/\u221a('+L.toFixed(3)+'\u00d7'+C.toExponential(2)+') = '+omega+' rad/s'};}if(type==='spring_mass_T'){var m=rnd(1,20)/10,k=rnd(10,200),T=parseFloat((2*Math.PI*Math.sqrt(m/k)).toFixed(3));return{question:'m=<b>'+m.toFixed(1)+'kg</b>, k=<b>'+k+'N/m</b>. T?',hints:['T=2\u03c0\u221a(m/k)'],ans:T,tol:T*0.01,unit:'s',working:'T=2\u03c0\u221a('+m.toFixed(1)+'/'+k+') = '+T+' s'};}var L=rnd(20,150)/100,T=parseFloat((2*Math.PI*Math.sqrt(L/9.81)).toFixed(3));return{question:'Pendulum L=<b>'+L.toFixed(2)+'m</b>. T?',hints:['T=2\u03c0\u221a(L/g)'],ans:T,tol:T*0.01,unit:'s',working:'T=2\u03c0\u221a('+L.toFixed(2)+'/9.81) = '+T+' s'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 SHM',ti:'SHM — Extended Problems',su:'Solve complex SHM problems combining all concepts.',steps:[
  {lb:'SHM starting at arbitrary position',dr:dQ9,ht:'<p>x = A cos(\u03c9t + \u03c6) where \u03c6 = initial phase. At t=0: x = A cos\u03c6; v = \u2212A\u03c9 sin\u03c6. Find A and \u03c6 from initial conditions: A = \u221a(x\u2080\u00b2 + v\u2080\u00b2/\u03c9\u00b2); tan\u03c6 = \u2212v\u2080/(\u03c9x\u2080). Example: released from x=A with v=0: \u03c6=0, x=A cos(\u03c9t). Released from x=0 with v=v\u2080: \u03c6=\u03c0/2, x=A sin(\u03c9t).</p>'},
  {lb:'Time for specific position',dr:dQ9,ht:'<p>x = A cos(\u03c9t): solve for t when x = x\u2081. \u03c9t = arccos(x\u2081/A); t = arccos(x\u2081/A)/\u03c9. Note: arccos gives values in [0,\u03c0]; second solution in [T/2, T]. Multiple crossings: add nT. For first time reaching x\u2081 from x=A: t = arccos(x\u2081/A)/\u03c9.</p>'},
  {lb:'Superposition of SHMs',dr:dQ9,ht:'<p>Two SHMs same frequency: x = A\u2081cos(\u03c9t) + A\u2082cos(\u03c9t+\u03c6). Phasor addition: draw A\u2081 and A\u2082 at angle \u03c6; resultant by parallelogram. A_R\u00b2 = A\u2081\u00b2 + A\u2082\u00b2 + 2A\u2081A\u2082 cos\u03c6. Constructive (\u03c6=0): A_R=A\u2081+A\u2082. Destructive (\u03c6=\u03c0): A_R=|A\u2081\u2212A\u2082|.</p>'},
  {lb:'Coupled oscillators',dr:dQ9,ht:'<p>Two masses connected by springs: normal modes. Mode 1 (in-phase): both oscillate at \u03c9\u2081 = \u221a(k/m). Mode 2 (anti-phase): \u03c9\u2082 = \u221a((k+2k_c)/m) where k_c is coupling spring. Beating between modes: energy transfers back and forth between masses. Basis of quantum tunneling and molecular vibrations.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['v_at_x','T_from_omega','total_energy']);if(type==='v_at_x'){var A=rnd(5,20)/100,omega=rnd(5,20),x=parseFloat((A*rnd(3,8)/10).toFixed(3)),v=parseFloat((omega*Math.sqrt(A*A-x*x)).toFixed(3));return{question:'A=<b>'+A.toFixed(2)+'m</b>, \u03c9=<b>'+omega+'</b>, x=<b>'+x.toFixed(3)+'m</b>. Speed v?',hints:['v=\u03c9\u221a(A\u00b2-x\u00b2)'],ans:v,tol:v*0.03,unit:'m/s',working:'v='+omega+'\u00d7\u221a('+A.toFixed(2)+'\u00b2-'+x.toFixed(3)+'\u00b2) = '+v+' m/s'};}if(type==='T_from_omega'){var omega=rnd(2,20),T=parseFloat((2*Math.PI/omega).toFixed(3));return{question:'\u03c9=<b>'+omega+'rad/s</b>. Period T?',hints:['T=2\u03c0/\u03c9'],ans:T,tol:T*0.01,unit:'s',working:'T=2\u03c0/'+omega+' = '+T+' s'};}var m=rnd(1,10),omega=rnd(2,15),A=rnd(5,20)/100,E=parseFloat((0.5*m*omega*omega*A*A).toFixed(4));return{question:'m=<b>'+m+'kg</b>, \u03c9=<b>'+omega+'</b>, A=<b>'+A.toFixed(2)+'m</b>. Total energy?',hints:['E=\u00bdm\u03c9\u00b2A\u00b2'],ans:E,tol:E*0.02,unit:'J',working:'E=0.5\u00d7'+m+'\u00d7'+omega+'\u00b2\u00d7'+A.toFixed(2)+'\u00b2 = '+E+' J'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 SHM',ti:'Mixed SHM Questions',su:'Integrated questions across all Y12-MEC-05 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>a=-\u03c9\u00b2x. x=A sin/cos(\u03c9t). v=\u03c9\u221a(A\u00b2-x\u00b2); v_max=A\u03c9. a_max=A\u03c9\u00b2. E_total=\u00bdm\u03c9\u00b2A\u00b2. Pendulum: \u03c9=\u221a(g/L); T=2\u03c0\u221a(L/g). Spring: \u03c9=\u221a(k/m); T=2\u03c0\u221a(m/k). Damping reduces amplitude. Resonance: f_drive=f_natural.</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC tests: defining SHM (a\u221dx, toward equilibrium); T equations for spring and pendulum; v=\u03c9\u221a(A\u00b2-x\u00b2); energy in SHM; describing damping; describing resonance and its effects. Cambridge adds: graphical work, phase relationships, forced oscillations.</p>'},
  {lb:'Key links',dr:dQ10,ht:'<p>SHM links to: waves (each particle does SHM); circular motion (projection of circular motion = SHM); springs (Hooke\u2019s law gives SHM); thermal physics (atoms vibrate); electricity (LC circuit is electrical SHM). Understanding SHM underpins much of physics.</p>'},
  {lb:'Key formulae',dr:dQ10,ht:'<div class="fm">a=-\u03c9\u00b2x \u2022 v=\u03c9\u221a(A\u00b2-x\u00b2) \u2022 E=\u00bdm\u03c9\u00b2A\u00b2</div><div class="fm">T_{pend}=2\u03c0\u221a(L/g) \u2022 T_{spring}=2\u03c0\u221a(m/k)</div>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['spring_T','pendulum_vmax','a_at_x']);if(type==='spring_T'){var m=rnd(1,20)/10,k=rnd(10,200),T=parseFloat((2*Math.PI*Math.sqrt(m/k)).toFixed(3));return{question:'m=<b>'+m.toFixed(1)+'kg</b>, k=<b>'+k+'N/m</b>. T?',hints:['T=2\u03c0\u221a(m/k)'],ans:T,tol:T*0.02,unit:'s',working:'T=2\u03c0\u221a('+m.toFixed(1)+'/'+k+') = '+T+' s'};}if(type==='pendulum_vmax'){var L=rnd(20,150)/100,A=rnd(5,20)/100,omega=parseFloat(Math.sqrt(9.81/L).toFixed(3)),vmax=parseFloat((A*omega).toFixed(3));return{question:'Pendulum L=<b>'+L.toFixed(2)+'m</b>, A=<b>'+A.toFixed(2)+'m</b>. Max speed?',hints:['v_max=A\u03c9=A\u221a(g/L)'],ans:vmax,tol:vmax*0.02,unit:'m/s',working:'v_max='+A.toFixed(2)+'\u00d7\u221a(9.81/'+L.toFixed(2)+') = '+vmax+' m/s'};}var A=rnd(5,20)/100,omega=rnd(5,20),x=parseFloat((A*rnd(3,8)/10).toFixed(3)),a=parseFloat((omega*omega*x).toFixed(3));return{question:'A=<b>'+A.toFixed(2)+'m</b>, \u03c9=<b>'+omega+'</b>, x=<b>'+x.toFixed(3)+'m</b>. |acceleration|?',hints:['|a|=\u03c9\u00b2x'],ans:a,tol:a*0.02,unit:'m/s\u00b2',working:'|a|='+omega+'\u00b2\u00d7'+x.toFixed(3)+' = '+a+' m/s\u00b2'};})},
