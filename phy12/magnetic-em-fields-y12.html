<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Magnetic force and fields',ACC,13,'middle',true));
o.push(R(10,36,460,44,CRM,ACC,2));o.push(T(240,58,'F = BIL sin\u03b8 (force on conductor)',DARK,13,'middle',true));o.push(T(240,76,'B = flux density (T), I = current (A), L = length (m)','#555',9,'middle',false));
if(p>=1){o.push(R(10,90,460,42,CRM,ACC,1.5));o.push(T(240,108,'F = Bqv sin\u03b8 (force on moving charge)',DARK,11,'middle',false));o.push(T(240,126,'q = charge (C), v = velocity (m/s), \u03b8 = angle to B','#555',9,'middle',false));}
if(p>=2){o.push(R(10,140,460,42,CRM,ACC,1.5));o.push(T(240,158,'Direction: Fleming LEFT-HAND rule (motor): F, B, I','#333',11,'middle',false));o.push(T(240,176,'Thumb=F (force), Index=B (field), Middle=I (current)','#555',9,'middle',false));}
if(p>=3){o.push(R(10,190,460,42,CRM,ACC,1.5));o.push(T(240,208,'Circular motion: Bqv = mv\u00b2/r \u2192 r = mv/(Bq)','#333',11,'middle',false));}
if(p>=4){o.push(R(10,238,460,18,LINE,ACC,0.5));o.push(T(240,250,'B unit: Tesla (T) = kg s\u207b\u00b2 A\u207b\u00b9; also Wb/m\u00b2','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Electromagnetic induction',ACC,12,'middle',true));
o.push(R(10,36,460,44,CRM,ACC,2));o.push(T(240,54,'Faraday: \u03b5 = -N d\u03a6/dt',DARK,14,'middle',true));o.push(T(240,72,'\u03a6 = BA cos\u03b8 (flux); N = number of turns; t = time','#555',9,'middle',false));
if(p>=1){o.push(R(10,90,460,42,CRM,ACC,1.5));o.push(T(240,108,'Lenz\u2019s law: induced current opposes the change causing it','#333',11,'middle',false));}
if(p>=2){o.push(R(10,140,460,42,CRM,ACC,1.5));o.push(T(240,158,'Moving conductor: \u03b5 = BvL (cutting field lines)','#333',11,'middle',false));}
if(p>=3){o.push(R(10,190,460,42,CRM,ACC,1.5));o.push(T(240,208,'Fleming RIGHT-HAND rule (generator): \u03b5, B, v','#333',11,'middle',false));}
if(p>=4){o.push(R(10,238,460,18,LINE,ACC,0.5));o.push(T(240,250,'SI unit of flux: weber (Wb) = V\u202fs = T\u202fm\u00b2','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Magnetic & EM fields summary',ACC,13,'middle',true));
[['Force on wire','F=BIL sin\u03b8; LEFT-HAND rule'],['Force on charge','F=Bqv sin\u03b8; circular motion r=mv/(Bq)'],['Faraday law','\u03b5=-N d\u03a6/dt; induced EMF opposes change'],['Flux','\u03a6=BA cos\u03b8 (Wb=T m\u00b2)'],['Moving rod','\u03b5=BvL'],['Transformer','\u03b5_s/\u03b5_p = N_s/N_p; I_s/I_p=N_p/N_s'],['Motor effect','electric\u2192magnetic\u2192kinetic']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Magnetism',ti:'Force on a Current-Carrying Conductor',su:'Apply F=BIL. Use Fleming\'s left-hand rule.',steps:[
  {lb:'Magnetic force on conductor',dr:dQ1,ht:'<div class="fm">F = BIL sin\u03b8</div><p>F = magnetic force (N). B = magnetic flux density (T). I = current (A). L = length of conductor in field (m). \u03b8 = angle between current direction and field. Maximum when \u03b8=90\u00b0 (I perpendicular to B): F = BIL. Zero when I parallel to B.</p>'},
  {lb:"Fleming's left-hand rule",dr:dQ1,ht:'<p>Motor effect: current in field produces force. Left hand: point fingers in direction of field B (index), current I (middle); thumb points in direction of force F. FBI mnemonic: F = thumb, B = index, I = middle. Used for: electric motors, loudspeakers, galvanometers, rail guns.</p>'},
  {lb:'Field from a wire',dr:dQ1,ht:'<div class="fm">B = μ₀I/(2πr)</div><p>Magnetic field from long straight wire at distance r. Direction: right-hand rule (thumb = current, fingers curl = field). μ₀ = 4π×10⁻⁷ H/m. Two parallel wires with currents in same direction attract; opposite directions repel. Force per unit length: F/L = μ₀I₁I₂/(2πd).</p>'},
  {lb:'Applications',dr:dQ1,ht:'<p>Electric motor: current-carrying coil in field; BIL force on each side; creates torque. Loudspeaker: varying current in coil in radial field; force moves cone; creates sound. Galvanometer: coil in field; current produces deflection; pointer indicates current. Moving-coil voltmeter: same as galvanometer with high series resistance.</p>'},
  {lb:'Magnetic flux density',dr:dQ1,ht:'<p>B measured in tesla (T) = kg s\u207b\u00b2 A\u207b\u00b9. Earth\u2019s field: ~50 \u03bcT. Bar magnet: ~0.01 T at surface. MRI machine: 1.5\u20133 T. LHC magnets: 8.3 T. B = \u03bc\u2080nI for solenoid (n = turns per metre). B = \u03bc\u2080I/(2\u03c0r) for long straight wire. \u03bc\u2080 = 4\u03c0\u00d710\u207b\u2077 H/m.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['F_BIL','B_from_F','I_from_F']);if(type==='F_BIL'){var B=rnd(1,20)/100,I=rnd(1,20),L=rnd(1,100)/100,F=parseFloat((B*I*L).toFixed(4));return{question:'B=<b>'+B+' T</b>, I=<b>'+I+' A</b>, L=<b>'+L.toFixed(2)+' m</b> (\u03b8=90\u00b0). Force F?',hints:['F=BIL (at 90\u00b0)'],ans:F,tol:F*0.03,unit:'N',working:'F='+B+'\u00d7'+I+'\u00d7'+L.toFixed(2)+' = '+F+' N'};}if(type==='B_from_F'){var F=rnd(1,100)/100,I=rnd(1,20),L=rnd(10,100)/100,B=parseFloat((F/(I*L)).toFixed(4));return{question:'F=<b>'+F+' N</b>, I=<b>'+I+' A</b>, L=<b>'+L.toFixed(2)+' m</b>. Flux density B?',hints:['B=F/(IL)'],ans:B,tol:B*0.03,unit:'T',working:'B='+F+'/('+I+'\u00d7'+L.toFixed(2)+') = '+B+' T'};}var B=rnd(1,20)/100,L=rnd(10,100)/100,F=rnd(1,100)/100,I=parseFloat((F/(B*L)).toFixed(2));return{question:'F=<b>'+F+' N</b>, B=<b>'+B+' T</b>, L=<b>'+L.toFixed(2)+' m</b>. Current I?',hints:['I=F/(BL)'],ans:I,tol:I*0.03,unit:'A',working:'I='+F+'/('+B+'\u00d7'+L.toFixed(2)+') = '+I+' A'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Magnetism',ti:'Force on a Moving Charge',su:'Apply F=Bqv. Analyse circular motion of charged particles.',steps:[
  {lb:'Force on moving charge',dr:dQ2,ht:'<div class="fm">F = Bqv sin\u03b8</div><p>F = magnetic force (N). B = flux density (T). q = charge (C). v = velocity (m/s). \u03b8 = angle between v and B. Maximum when \u03b8=90\u00b0. Force always perpendicular to both B and v (right-hand rule for positive charges). Electrons: force opposite to right-hand rule (negative charge).</p>'},
  {lb:'Circular motion in magnetic field',dr:dQ2,ht:'<p>F = Bqv provides centripetal force. Bqv = mv\u00b2/r \u2192 r = mv/(Bq). Period T = 2\u03c0m/(Bq) (cyclotron frequency; independent of v). Particle is not accelerated in energy by magnetic field (F perpendicular to v \u2192 no work done). Kinetic energy constant. Cyclotron: accelerate particles between magnetic-induced circular orbits.</p>'},
  {lb:'Mass spectrometer',dr:dQ2,ht:'<p>Ions accelerated through voltage V: \u00bdmv\u00b2 = qV. Then enter magnetic field; circular path radius r = mv/(Bq). r = (1/B)\u221a(2mV/q). Heavier ions: larger r. Separate isotopes by their radius. Modern instruments: time-of-flight (TOF); ions separated by speed differences. Used in: carbon-14 dating, drug testing, environmental analysis.</p>'},
  {lb:'Velocity selector',dr:dQ2,ht:'<p>Electric field E balanced by magnetic field B: qE = Bqv \u2192 v = E/B. Only particles with this speed pass through undeflected. Used to select specific velocity before entering mass spectrometer. Electric force: qE (vertical). Magnetic force: Bqv (vertical, opposite). For selected speed: qE = Bqv \u2192 E = Bv.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['F_Bqv','radius','velocity_selector']);if(type==='F_Bqv'){var B=rnd(1,20)/100,q=1.6e-19,v=rnd(1,100)*1e6,F=parseFloat((B*q*v).toExponential(2));return{question:'Proton: B=<b>'+B+' T</b>, v=<b>'+v.toExponential(2)+' m/s</b>. Magnetic force?',hints:['F=Bqv; q_proton=1.6\u00d710\u207b\u00b9\u2079C'],ans:parseFloat(F),tol:parseFloat(F)*0.05,unit:'N',working:'F='+B+'\u00d71.6\u00d710\u207b\u00b9\u2079\u00d7'+v.toExponential(2)+' = '+F+' N'};}if(type==='radius'){var B=rnd(1,20)/100,m=1.67e-27,q=1.6e-19,v=rnd(1,100)*1e6,r=parseFloat((m*v/(B*q)).toFixed(3));return{question:'Proton: B=<b>'+B+' T</b>, v=<b>'+v.toExponential(2)+' m/s</b>. Orbital radius?',hints:['r=mv/(Bq); m_p=1.67\u00d710\u207b\u00b2\u2077kg'],ans:r,tol:r*0.05,unit:'m',working:'r=1.67\u00d710\u207b\u00b2\u2077\u00d7'+v.toExponential(2)+'/('+B+'\u00d71.6\u00d710\u207b\u00b9\u2079) = '+r+' m'};}var E=rnd(1000,100000),B=rnd(1,20)/100,v=parseFloat((E/B).toFixed(0));return{question:'Velocity selector: E=<b>'+E+' V/m</b>, B=<b>'+B+' T</b>. Selected speed?',hints:['v=E/B'],ans:v,tol:v*0.02,unit:'m/s',working:'v='+E+'/'+B+' = '+v+' m/s'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Magnetism',ti:'Electromagnetic Induction',su:'Apply Faraday\'s and Lenz\'s laws. Calculate induced EMF.',steps:[
  {lb:'Magnetic flux',dr:dQ3,ht:'<div class="fm">\u03a6 = BA cos\u03b8 (Wb = T m\u00b2)</div><p>Magnetic flux \u03a6 = component of B perpendicular to area A. \u03b8 = angle between B and normal to area. When B perpendicular to area (\u03b8=0): \u03a6 = BA (maximum). When B parallel to area (\u03b8=90\u00b0): \u03a6 = 0. Flux linkage: N\u03a6 (for N-turn coil). Unit: weber (Wb) = T m\u00b2 = V s.</p>'},
  {lb:'Faraday\'s law',dr:dQ3,ht:'<div class="fm">\u03b5 = -N d\u03a6/dt</div><p>Magnitude of induced EMF = rate of change of flux linkage. The faster the change in flux, the greater the EMF. Ways to change flux: move conductor in field, move field relative to conductor, change field strength, change area, change angle. The minus sign \u2192 Lenz\u2019s law.</p>'},
  {lb:"Lenz's law",dr:dQ3,ht:'<p>Lenz\u2019s law: induced current flows in direction such that it opposes the change causing it (conservation of energy). Magnet pushed into coil: induced current creates field opposing magnet\u2019s motion (feels resistance). Magnet pulled out: induced current creates field attracting magnet (still feels resistance). Braking effect: eddy currents in conducting plates oppose motion.</p>'},
  {lb:'Flux linkage',dr:dQ3,ht:'<div class="fm">Flux linkage = NΦ (Wb turns)</div><p>For a coil of N turns: flux linkage = NΦ = NBA cosθ. Rate of change of flux linkage = induced EMF. WAEC: always check whether N is given (multiply Φ by N for flux linkage). Units: weber (Wb) or volt-second (V s).</p>'},
  {lb:'Moving conductor',dr:dQ3,ht:'<div class="fm">\u03b5 = BvL</div><p>Conductor of length L moving at speed v perpendicular to field B: EMF = BvL. Derived from Faraday: \u0394\u03a6 = B \u00d7 area swept = B \u00d7 v\u0394t \u00d7 L = BvL\u0394t; \u03b5 = \u0394\u03a6/\u0394t = BvL. Direction of current: Fleming\u2019s right-hand rule (generator). Applications: MHD generator, railgun, aeroplane wings cutting Earth\u2019s field.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['flux','EMF_Faraday','BvL_EMF']);if(type==='flux'){var B=rnd(1,20)/100,A=rnd(100,5000)/10000,theta=pick([0,30,60,90]),Phi=parseFloat((B*A*Math.cos(theta*Math.PI/180)).toFixed(5));return{question:'B=<b>'+B+' T</b>, A=<b>'+A.toFixed(4)+' m\u00b2</b>, \u03b8=<b>'+theta+'\u00b0</b>. Magnetic flux?',hints:['\u03a6=BA cos\u03b8'],ans:Phi,tol:Phi*0.03,unit:'Wb',working:'\u03a6='+B+'\u00d7'+A.toFixed(4)+'\u00d7cos'+theta+'\u00b0 = '+Phi+' Wb'};}if(type==='EMF_Faraday'){var N=rnd(1,500),dPhi=rnd(1,100)/1000,dt=rnd(1,100)/1000,EMF=parseFloat((N*dPhi/dt).toFixed(2));return{question:'N=<b>'+N+'</b> turns, \u0394\u03a6=<b>'+dPhi+' Wb</b>, \u0394t=<b>'+dt.toFixed(3)+' s</b>. Induced EMF?',hints:['\u03b5=N\u0394\u03a6/\u0394t'],ans:EMF,tol:EMF*0.03,unit:'V',working:'\u03b5='+N+'\u00d7'+dPhi+'/'+dt.toFixed(3)+' = '+EMF+' V'};}var B=rnd(1,20)/100,v=rnd(1,50),L=rnd(1,100)/100,EMF=parseFloat((B*v*L).toFixed(3));return{question:'B=<b>'+B+' T</b>, v=<b>'+v+' m/s</b>, L=<b>'+L.toFixed(2)+' m</b>. \u03b5=BvL?',hints:['\u03b5=BvL (moving conductor)'],ans:EMF,tol:EMF*0.03,unit:'V',working:'\u03b5='+B+'\u00d7'+v+'\u00d7'+L.toFixed(2)+' = '+EMF+' V'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Magnetism',ti:'The Transformer',su:'Apply transformer equations. Explain power transmission.',steps:[
  {lb:'Transformer principle',dr:dQ4,ht:'<div class="fm">\u03b5_s/\u03b5_p = N_s/N_p &nbsp;&nbsp; I_s/I_p = N_p/N_s</div><p>Mutual induction: alternating current in primary coil induces EMF in secondary. Voltage ratio = turns ratio. Current ratio = inverse of turns ratio. Step-up: N_s > N_p \u2192 V_s > V_p. Step-down: N_s < N_p \u2192 V_s < V_p. Ideal transformer: P_in = P_out \u2192 \u03b5_p I_p = \u03b5_s I_s.</p>'},
  {lb:'Power transmission',dr:dQ4,ht:'<p>Power loss in transmission line: P_loss = I\u00b2R. At high voltage: same P \u2192 lower I \u2192 much less I\u00b2R loss. National Grid: generated at ~25 kV, stepped up to 400 kV for transmission, stepped down at substations to 33 kV, 11 kV, then 230 V for homes. 400 kV reduces current by \u00d716 \u2192 power loss by \u00f7256 compared to 25 kV.</p>'},
  {lb:'Transformer efficiency',dr:dQ4,ht:'<p>Ideal transformer: 100% efficient (P_in = P_out). Practical losses: (1) Copper loss: I\u00b2R in windings. (2) Hysteresis: energy lost magnetising/demagnetising core each cycle. (3) Eddy currents: induced currents in core heat it; reduced by laminating core (thin insulated sheets). Efficiency \u03b7 = P_out/P_in \u00d7 100%. Large power transformers: \u03b7 > 99%.</p>'},
  {lb:'Eddy currents',dr:dQ4,ht:'<p>Eddy currents: induced currents in bulk conductors (not just wires) due to changing flux. Oppose change (Lenz). Causes heating (wasted energy in core). Reduced by: laminating core (insulating layers break up eddy current loops). Useful: induction hobs, electromagnetic braking, metal detection, induction heating for sterilisation.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['V_ratio','I_ratio','power_loss']);if(type==='V_ratio'){var Np=rnd(100,2000),Ns=rnd(100,2000),Vp=rnd(100,400),Vs=parseFloat((Vp*Ns/Np).toFixed(1));return{question:'N_p=<b>'+Np+'</b>, N_s=<b>'+Ns+'</b>, V_p=<b>'+Vp+' V</b>. Secondary voltage V_s?',hints:['V_s/V_p=N_s/N_p'],ans:Vs,tol:Vs*0.02,unit:'V',working:'V_s='+Vp+'\u00d7'+Ns+'/'+Np+' = '+Vs+' V'};}if(type==='I_ratio'){var Np=rnd(100,2000),Ns=rnd(100,2000),Ip=rnd(1,20),Is=parseFloat((Ip*Np/Ns).toFixed(2));return{question:'N_p=<b>'+Np+'</b>, N_s=<b>'+Ns+'</b>, I_p=<b>'+Ip+' A</b>. I_s (ideal transformer)?',hints:['I_s/I_p=N_p/N_s'],ans:Is,tol:Is*0.02,unit:'A',working:'I_s='+Ip+'\u00d7'+Np+'/'+Ns+' = '+Is+' A'};}var I=rnd(1,100),R=rnd(1,50),P_loss=I*I*R;return{question:'Transmission line: I=<b>'+I+' A</b>, R=<b>'+R+' \u03a9</b>. Power lost?',hints:['P_loss=I\u00b2R'],ans:P_loss,tol:0,unit:'W',working:'P_loss='+I+'\u00b2\u00d7'+R+' = '+P_loss+' W'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Magnetism',ti:'The Electric Motor',su:'Explain DC motor operation. Describe back-EMF and torque.',steps:[
  {lb:'DC motor principle',dr:dQ5,ht:'<p>Motor: current-carrying coil in magnetic field; BIL forces on sides create torque. For continuous rotation: commutator reverses current direction every half turn to keep torque in same rotational direction. Torque = NBILA (N=turns, B=field, I=current, L=length, A=coil width). Brushes: stationary contacts touching rotating commutator.</p>'},
  {lb:'Back EMF',dr:dQ5,ht:'<p>Rotating motor coil cuts field lines \u2192 induces back-EMF \u03b5_back opposing supply voltage. Net voltage: V_net = V_supply - \u03b5_back. Current: I = (V_supply - \u03b5_back)/R. At stall (zero speed): \u03b5_back = 0; I = V/R (maximum; can burn motor). At full speed: large \u03b5_back; small I. Power: P_mech = \u03b5_back \u00d7 I (back-EMF \u00d7 current = mechanical power).</p>'},
  {lb:'Motor efficiency',dr:dQ5,ht:'<p>Input power: P_in = V_supply \u00d7 I. Copper loss: P_heat = I\u00b2R. Mechanical output: P_mech = P_in - P_heat = \u03b5_back \u00d7 I. Efficiency = P_mech/P_in. Improve: reduce winding resistance; strong magnets; reduce friction; use more turns. Real motors: also iron losses (hysteresis, eddy currents in armature).</p>'},
  {lb:'The generator',dr:dQ5,ht:'<p>Generator: reverse of motor; mechanical energy \u2192 electrical. Coil rotating in field \u2192 flux changes \u2192 induced EMF. EMF = NBA\u03c9 sin(\u03c9t). AC generator: slip rings (not commutator) \u2192 sine wave output. DC generator: commutator \u2192 rectified output. Alternator in cars: charges battery. Turbine + generator: power station. Larger B, larger A, more N, faster \u03c9 \u2192 larger EMF.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['torque','back_EMF','efficiency']);if(type==='torque'){var N=rnd(50,500),B=rnd(1,20)/100,I=rnd(1,20),A=rnd(100,5000)/10000,tau=parseFloat((N*B*I*A).toFixed(3));return{question:'N=<b>'+N+'</b>, B=<b>'+B+' T</b>, I=<b>'+I+' A</b>, A=<b>'+A.toFixed(4)+' m\u00b2</b>. Motor torque?',hints:['torque=NBIA'],ans:tau,tol:tau*0.03,unit:'N m',working:'torque='+N+'\u00d7'+B+'\u00d7'+I+'\u00d7'+A.toFixed(4)+' = '+tau+' N m'};}if(type==='back_EMF'){var V=rnd(50,240),R=rnd(1,20),I=rnd(1,20),emf_back=parseFloat((V-I*R).toFixed(1));return{question:'V_supply=<b>'+V+' V</b>, R=<b>'+R+'\u03a9</b>, I=<b>'+I+' A</b>. Back-EMF?',hints:['\u03b5_back=V_supply-IR'],ans:emf_back,tol:emf_back*0.02,unit:'V',working:'\u03b5_back='+V+'-'+I+'\u00d7'+R+' = '+emf_back+' V'};}var Vin=rnd(100,240),I=rnd(1,20),R=rnd(1,20),Pheat=I*I*R,Pmech=Vin*I-Pheat,eta=parseFloat((Pmech/(Vin*I)*100).toFixed(1));return{question:'V=<b>'+Vin+'V</b>, I=<b>'+I+'A</b>, R=<b>'+R+'\u03a9</b>. Motor efficiency (%)?',hints:['P_mech=VI-I\u00b2R; \u03b7=P_mech/P_in\u00d7100'],ans:eta,tol:eta*0.03,unit:'%',working:'\u03b7=('+Vin+'\u00d7'+I+'-'+Pheat+')/('+Vin+'\u00d7'+I+')\u00d7100 = '+eta+'%'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Magnetism',ti:'Magnetic Field Calculations',su:'Calculate magnetic field strength. Apply Ampere\'s law results.',steps:[
  {lb:'Field due to long wire',dr:dQ6,ht:'<div class="fm">B = \u03bc\u2080I/(2\u03c0r)</div><p>\u03bc\u2080 = 4\u03c0\u00d710\u207b\u2077 T m A\u207b\u00b9 (permeability of free space). r = perpendicular distance from wire. Circular field lines around wire (right-hand rule: thumb = current, fingers = field direction). Two parallel wires: attract if currents same direction; repel if opposite. Force per unit length: F/L = \u03bc\u2080I\u2081I\u2082/(2\u03c0d).</p>'},
  {lb:'Field inside solenoid',dr:dQ6,ht:'<div class="fm">B = \u03bc\u2080 n I</div><p>n = number of turns per metre (N/L). Field is uniform inside; nearly zero outside. With iron core: B = \u03bc\u2080\u03bc_r nI (\u03bc_r = relative permeability; iron: \u03bc_r \u2248 1000). Applications: electromagnets, MRI, particle accelerators. Solenoid force: F = BIL on each turn.</p>'},
  {lb:'Force between parallel wires',dr:dQ6,ht:'<p>Wire 1 creates field B\u2081 = \u03bc\u2080I\u2081/(2\u03c0d) at wire 2. Force on wire 2: F = B\u2081I\u2082L = \u03bc\u2080I\u2081I\u2082L/(2\u03c0d). Force per unit length: F/L = \u03bc\u2080I\u2081I\u2082/(2\u03c0d). This defined the ampere (old definition): 1 A produces force of 2\u00d710\u207b\u2077 N/m between wires 1 m apart.</p>'},
  {lb:'Hall effect',dr:dQ6,ht:'<p>Hall effect: current I in conductor perpendicular to field B; free charges deflected; build up creates Hall voltage V_H across conductor width d. At equilibrium: eE = Bev; V_H/d = Bv; V_H = BId/(nqd) = BI/(nq). n = carrier density. Measurement of B, or of n (carrier density). Hall probe: measures B directly. WAEC: derive formula from force balance.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['B_wire','B_solenoid','Hall_V']);if(type==='B_wire'){var I=rnd(1,100),r=rnd(1,100)/100,B=parseFloat((4e-7*Math.PI*I/(2*Math.PI*r)).toExponential(4));return{question:'Long wire I=<b>'+I+' A</b>, r=<b>'+r.toFixed(2)+' m</b>. B?',hints:['B=\u03bc\u2080I/(2\u03c0r); \u03bc\u2080=4\u03c0\u00d710\u207b\u2077'],ans:parseFloat(B),tol:parseFloat(B)*0.05,unit:'T',working:'B=4\u03c0\u00d710\u207b\u2077\u00d7'+I+'/(2\u03c0\u00d7'+r.toFixed(2)+') = '+B+' T'};}if(type==='B_solenoid'){var n=rnd(500,5000),I=rnd(1,20),B=parseFloat((4e-7*Math.PI*n*I).toFixed(4));return{question:'Solenoid n=<b>'+n+' turns/m</b>, I=<b>'+I+' A</b>. B inside?',hints:['B=\u03bc\u2080nI'],ans:B,tol:B*0.03,unit:'T',working:'B=4\u03c0\u00d710\u207b\u2077\u00d7'+n+'\u00d7'+I+' = '+B+' T'};}var B=rnd(1,20)/100,I=rnd(1,20),n=rnd(1,100)*1e28,q=1.6e-19,VH=parseFloat((B*I/(n*q*1e-3)).toExponential(2));return{question:'Hall effect: B=<b>'+B+' T</b>, I=<b>'+I+' A</b>, n=<b>'+n.toExponential(2)+'/m\u00b3</b>, d=1mm. V_H?',hints:['V_H=BI/(nqd)'],ans:parseFloat(VH),tol:parseFloat(VH)*0.05,unit:'V',working:'V_H='+B+'\u00d7'+I+'/('+n.toExponential(2)+'\u00d71.6\u00d710\u207b\u00b9\u2079\u00d71\u00d710\u207b\u00b3) = '+VH+' V'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Magnetism',ti:'Inductance',su:'Calculate self-inductance. Describe inductor behaviour in circuits.',steps:[
  {lb:'Self-inductance',dr:dQ7,ht:'<div class="fm">L = N\u03a6/I &nbsp;&nbsp; \u03b5 = -L dI/dt (H)</div><p>Self-inductance L (henry): L = 1 H when current change of 1 A/s induces EMF of 1 V. Solenoid: L = \u03bc\u2080N\u00b2A/l. Inductor opposes changes in current (like inertia). Energy stored: E = \u00bdLI\u00b2. Large L with high current stores significant energy (danger when circuit opened suddenly \u2192 large spike).</p>'},
  {lb:'RL circuit',dr:dQ7,ht:'<p>When switch closed: I = (V/R)(1-e^(-t/\u03c4)) where \u03c4 = L/R (time constant). I rises exponentially; after 5\u03c4 essentially full current V/R. When switch opened: I = I\u2080 e^(-t/\u03c4). Inductor maintains current; voltage spike can be very large (\u03b5 = L dI/dt). Flyback diode across relay coil protects transistor from voltage spike.</p>'},
  {lb:'Mutual inductance',dr:dQ7,ht:'<p>Mutual inductance M between two coils: \u03b5\u2082 = -M dI\u2081/dt. M = N\u2082\u03a6\u2082\u2081/I\u2081. Transformer: M related to coupling coefficient k. Perfect coupling: k=1, M = \u221a(L\u2081L\u2082). Back-EMF in primary: \u03b5\u2081 = -L\u2081 dI\u2081/dt (self) - M dI\u2082/dt (from secondary). Transformer action: changing I\u2081 \u2192 changing \u03a6 \u2192 induces \u03b5\u2082 in secondary.</p>'},
  {lb:'Energy in inductor',dr:dQ7,ht:'<div class="fm">E = \u00bdLI\u00b2 (J)</div><p>Energy stored in magnetic field of inductor. Building up current \u2192 energy stored. Current decays \u2192 energy released. Compare capacitor: E = \u00bdCV\u00b2. Duality: inductor \u2194 capacitor; L \u2194 C; I \u2194 V; magnetic \u2194 electric. LC circuit: oscillates between inductor and capacitor energy; \u03c9 = 1/\u221a(LC).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['EMF_L','energy_L','time_const_RL']);if(type==='EMF_L'){var L=rnd(1,100)/1000,dIdt=rnd(1,100),EMF=parseFloat((L*dIdt).toFixed(3));return{question:'L=<b>'+(L*1000).toFixed(0)+' mH</b>, dI/dt=<b>'+dIdt+' A/s</b>. Induced EMF?',hints:['|\u03b5|=L\u00d7dI/dt'],ans:EMF,tol:EMF*0.02,unit:'V',working:'|\u03b5|='+L+'\u00d7'+dIdt+' = '+EMF+' V'};}if(type==='energy_L'){var L=rnd(1,100)/1000,I=rnd(1,20),E=parseFloat((0.5*L*I*I).toFixed(4));return{question:'L=<b>'+(L*1000).toFixed(0)+' mH</b>, I=<b>'+I+' A</b>. Energy stored?',hints:['E=\u00bdLI\u00b2'],ans:E,tol:E*0.02,unit:'J',working:'E=0.5\u00d7'+L+'\u00d7'+I+'\u00b2 = '+E+' J'};}var L=rnd(1,100)/1000,R=rnd(10,200),tau=parseFloat((L/R).toFixed(4));return{question:'L=<b>'+(L*1000).toFixed(0)+' mH</b>, R=<b>'+R+'\u03a9</b>. RL time constant \u03c4?',hints:['\u03c4=L/R'],ans:tau,tol:tau*0.02,unit:'s',working:'\u03c4='+L+'/'+R+' = '+tau+' s'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Magnetism',ti:'Magnetic Materials',su:'Describe ferromagnetic, paramagnetic and diamagnetic materials.',steps:[
  {lb:'Types of magnetic material',dr:dQ8,ht:'<p>Ferromagnetic: strongly attracted to magnets; can be permanently magnetised; retain magnetism; Fe, Ni, Co, rare-earth alloys. Paramagnetic: weakly attracted; not permanently magnetic; Al, Pt, O\u2082. Diamagnetic: weakly repelled; all materials have some diamagnetism; Si, Cu, Bi, water. Superconductors: perfect diamagnets (Meissner effect).</p>'},
  {lb:'Domain theory',dr:dQ8,ht:'<p>Ferromagnetic materials: divided into magnetic domains (regions of uniform magnetisation). In unmagnetised material: domains randomly oriented; no net field. In external field: domains aligned with field grow; others shrink. Saturation: all domains aligned. Removing field: domain walls do not fully return \u2192 permanent magnetisation (hysteresis).</p>'},
  {lb:'Hysteresis',dr:dQ8,ht:'<p>Hysteresis loop: graph of B (or M) vs H (applied field). Retentivity (Br): B remaining when H=0. Coercivity (Hc): H needed to reduce B to zero. Soft magnetic materials (Fe): small hysteresis loop; easy to magnetise/demagnetise; transformer cores. Hard magnetic materials (steel, alnico): large loop; hard to demagnetise; permanent magnets.</p>'},
  {lb:'Curie temperature',dr:dQ8,ht:'<p>Curie temperature T_C: above which ferromagnetism disappears (becomes paramagnetic). Iron: T_C = 770\u00b0C. Nickel: T_C = 358\u00b0C. Thermal energy destroys domain alignment. Above T_C: random thermal motion > exchange interaction. Applications: temperature sensing (Curie switch), food safety (changes magnetic properties at specific T).</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['B_solenoid','flux_density','permeability']);if(type==='B_solenoid'){var mu_r=rnd(500,2000),n=rnd(1000,5000),I=rnd(1,20),B=parseFloat((4e-7*Math.PI*mu_r*n*I).toFixed(3));return{question:'Iron core \u03bc_r=<b>'+mu_r+'</b>, n=<b>'+n+'/m</b>, I=<b>'+I+' A</b>. B inside?',hints:['B=\u03bc\u2080\u03bc_r nI'],ans:B,tol:B*0.05,unit:'T',working:'B=4\u03c0\u00d710\u207b\u2077\u00d7'+mu_r+'\u00d7'+n+'\u00d7'+I+' = '+B+' T'};}if(type==='flux_density'){var B=rnd(1,20)/100,A=rnd(100,5000)/10000,Phi=parseFloat((B*A).toFixed(5));return{question:'B=<b>'+B+' T</b>, A=<b>'+A.toFixed(4)+' m\u00b2</b>, \u03b8=0. Flux?',hints:['\u03a6=BA'],ans:Phi,tol:Phi*0.02,unit:'Wb',working:'\u03a6='+B+'\u00d7'+A.toFixed(4)+' = '+Phi+' Wb'};}var n=rnd(1000,5000),I=rnd(1,20),B=parseFloat((4e-7*Math.PI*n*I).toFixed(5)),mu_r=rnd(500,2000),B_iron=parseFloat((mu_r*B).toFixed(3));return{question:'Air-core B=<b>'+B.toFixed(5)+' T</b>, iron core \u03bc_r=<b>'+mu_r+'</b>. B with iron core?',hints:['B_iron=\u03bc_r\u00d7B_air'],ans:B_iron,tol:B_iron*0.05,unit:'T',working:'B_iron='+mu_r+'\u00d7'+B.toFixed(5)+' = '+B_iron+' T'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Magnetism',ti:'Applications of Electromagnetism',su:'Describe practical electromagnetic devices.',steps:[
  {lb:'MRI scanner',dr:dQ9,ht:'<p>MRI: Magnetic Resonance Imaging. Strong superconducting magnet (1.5\u20133 T) aligns proton spins. RF pulse at resonant frequency tips spins. Spins precess and relax; emit RF signal detected by coil. Different tissues relax at different rates \u2192 contrast. Gradient coils: vary B with position \u2192 spatial localisation of signal. Very safe (no ionising radiation); expensive; cannot use near iron/steel.</p>'},
  {lb:'Induction hob',dr:dQ9,ht:'<p>Induction hob: AC coil under ceramic surface. Alternating B \u2192 eddy currents in ferromagnetic pot base. Eddy current heating = I\u00b2R. Very efficient (heating directly in pot, not surface). Cannot heat non-ferromagnetic pots (aluminium, copper). Surface stays cool (no direct heating). Frequency typically 25\u2013100 kHz.</p>'},
  {lb:'Metal detector and security systems',dr:dQ9,ht:'<p>Metal detector: transmit coil + receive coil. Metallic object creates additional mutual inductance change; alters receive signal phase/amplitude. Discriminates: different metals have different conductivity and permeability responses. Airport security: walk-through detects disruption to uniform field. Mine detector: similar principle for finding buried metal. Eddy current testing: non-destructive; finds cracks in conducting materials.</p>'},
  {lb:'Maglev trains',dr:dQ9,ht:'<p>Magnetic levitation: superconducting magnets in train + aluminium guideway. Train motion induces eddy currents in guideway; eddy current repels superconducting magnet. No friction (no contact). Low noise. High speed (>600 km/h possible). Linear induction motor provides propulsion (moving magnetic field from coils in track). Very expensive infrastructure.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['power_loss','transformer_ratio','cyclotron_f']);if(type==='power_loss'){var I=rnd(1,50),R=rnd(1,100),P=I*I*R;return{question:'Transmission: I=<b>'+I+' A</b>, R=<b>'+R+'\u03a9</b>. Power loss?',hints:['P=I\u00b2R'],ans:P,tol:0,unit:'W',working:'P='+I+'\u00b2\u00d7'+R+' = '+P+' W'};}if(type==='transformer_ratio'){var Np=rnd(100,5000),Ns=rnd(100,5000),Vp=rnd(100,1000),Vs=parseFloat((Vp*Ns/Np).toFixed(1));return{question:'N_p=<b>'+Np+'</b>, N_s=<b>'+Ns+'</b>, V_p=<b>'+Vp+'V</b>. V_s?',hints:['V_s=V_p\u00d7N_s/N_p'],ans:Vs,tol:Vs*0.02,unit:'V',working:'V_s='+Vp+'\u00d7'+Ns+'/'+Np+' = '+Vs+' V'};}var B=rnd(1,20)/100,m=1.67e-27,q=1.6e-19,f=parseFloat((B*q/(2*Math.PI*m)).toFixed(0));return{question:'Proton cyclotron frequency: B=<b>'+B+' T</b>. f_c?',hints:['f_c=Bq/(2\u03c0m); q=1.6\u00d710\u207b\u00b9\u2079, m_p=1.67\u00d710\u207b\u00b2\u2077'],ans:f,tol:f*0.05,unit:'Hz',working:'f='+B+'\u00d71.6\u00d710\u207b\u00b9\u2079/(2\u03c0\u00d71.67\u00d710\u207b\u00b2\u2077) = '+f+' Hz'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Magnetism',ti:'Mixed Magnetic & EM Fields',su:'Integrated questions across all Y12-ELE-02 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>F=BIL. F=Bqv. r=mv/(Bq). \u03a6=BA cos\u03b8. \u03b5=N\u0394\u03a6/\u0394t. \u03b5=BvL. Transformer: V_s/V_p=N_s/N_p. B_wire=\u03bc\u2080I/(2\u03c0r). B_solenoid=\u03bc\u2080nI. E_inductor=\u00bdLI\u00b2. Motor: torque=NBIA; back-EMF=V-IR. Lenz law opposes change.</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC tests: F=BIL and direction (Fleming left-hand); Faraday\u2019s law (\u03b5=N\u0394\u03a6/\u0394t); Lenz\u2019s law (direction of induced current); transformer equations (V_s/V_p=N_s/N_p; power transmission); F=Bqv and circular motion in field.</p>'},
  {lb:'Key applications',dr:dQ10,ht:'<p>Motor (left-hand rule, F=BIL). Generator (Faraday, \u03b5=BvL). Transformer (mutual induction, V_s/V_p=N_s/N_p). Loudspeaker (F=BIL). Mass spectrometer (F=Bqv, circular motion). Cyclotron (constant period). Hall probe (Hall effect). MRI (NMR). Maglev (eddy currents). Induction hob (eddy currents).</p>'},
  {lb:'Key formulae',dr:dQ10,ht:'<div class="fm">F=BIL \u2022 F=Bqv \u2022 r=mv/(Bq)</div><div class="fm">\u03b5=N\u0394\u03a6/\u0394t \u2022 \u03b5=BvL \u2022 V_s/V_p=N_s/N_p</div>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['F_BIL','EMF_BvL','transformer']);if(type==='F_BIL'){var B=rnd(1,20)/100,I=rnd(1,20),L=rnd(10,100)/100,F=parseFloat((B*I*L).toFixed(4));return{question:'B=<b>'+B+' T</b>, I=<b>'+I+' A</b>, L=<b>'+L.toFixed(2)+' m</b>. F?',hints:['F=BIL'],ans:F,tol:F*0.03,unit:'N',working:'F='+B+'\u00d7'+I+'\u00d7'+L.toFixed(2)+' = '+F+' N'};}if(type==='EMF_BvL'){var B=rnd(1,20)/100,v=rnd(1,50),L=rnd(10,100)/100,EMF=parseFloat((B*v*L).toFixed(3));return{question:'B=<b>'+B+' T</b>, v=<b>'+v+' m/s</b>, L=<b>'+L.toFixed(2)+' m</b>. \u03b5=BvL?',hints:['\u03b5=BvL'],ans:EMF,tol:EMF*0.03,unit:'V',working:'\u03b5='+B+'\u00d7'+v+'\u00d7'+L.toFixed(2)+' = '+EMF+' V'};}var Np=rnd(100,2000),Ns=rnd(100,2000),Vp=rnd(100,400),Vs=parseFloat((Vp*Ns/Np).toFixed(1));return{question:'N_p=<b>'+Np+'</b>, N_s=<b>'+Ns+'</b>, V_p=<b>'+Vp+'V</b>. V_s?',hints:['V_s=V_p\u00d7N_s/N_p'],ans:Vs,tol:Vs*0.02,unit:'V',working:'V_s='+Vp+'\u00d7'+Ns+'/'+Np+' = '+Vs+' V'};})},
