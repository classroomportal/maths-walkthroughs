<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newton's Laws — Year 12 Physics</title>
<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

      <div class="cvs"><svg id="dg" viewBox="0 0 480 260"></svg></div>

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,"Newton's three laws",ACC,12,'middle',true));
if(p>=1){o.push(R(10,36,460,42,CRM,ACC,2));o.push(T(240,54,'1st: Body at rest or constant v unless net force acts',DARK,10,'middle',false));o.push(T(240,72,'   Inertia: tendency to resist change in motion','#555',9,'middle',false));}
if(p>=2){o.push(R(10,88,460,42,CRM,ACC,1.5));o.push(T(240,106,'2nd: F = ma = \u0394p/\u0394t (resultant net force)','#333',11,'middle',false));}
if(p>=3){o.push(R(10,140,460,42,CRM,ACC,1.5));o.push(T(240,158,'3rd: Equal and opposite reaction on DIFFERENT object','#333',11,'middle',false));}
if(p>=4){o.push(R(10,192,460,60,LINE,ACC,1));o.push(T(240,214,'F=ma applies to resultant force only','#333',10,'middle',false));o.push(T(240,234,'Variable mass rockets: F = v_ex (dm/dt)','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Connected objects',ACC,11,'middle',true));
if(p>=1){o.push(R(10,36,460,42,CRM,ACC,2));o.push(T(240,54,'Atwood: a = (m\u2081-m\u2082)g/(m\u2081+m\u2082)',DARK,11,'middle',false));o.push(T(240,72,'   T = 2m\u2081m\u2082g/(m\u2081+m\u2082)','#555',9,'middle',false));}
if(p>=2){o.push(R(10,88,460,42,CRM,ACC,1.5));o.push(T(240,106,'Mass on table: T=m\u2082\u00d7a; a=m\u2081g/(m\u2081+m\u2082)','#333',10,'middle',false));}
if(p>=3){o.push(R(10,140,460,42,CRM,ACC,1.5));o.push(T(240,158,'Elevator up: W_app=m(g+a)','#333',11,'middle',false));o.push(T(240,176,'Elevator down: W_app=m(g-a)','#555',9,'middle',false));}
if(p>=4){o.push(R(10,192,460,42,LINE,ACC,1));o.push(T(240,210,'Strategy: treat system \u2192 find a \u2192 analyse one body for T','#333',10,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,"Newton's laws summary",ACC,13,'middle',true));
[['1st law','constant v unless F_net acts; inertia'],['2nd law','F=ma=\u0394p/\u0394t; net/resultant F only'],['3rd law','equal+opp. on DIFFERENT objects'],['Atwood','a=(m\u2081-m\u2082)g/(m\u2081+m\u2082)'],['Elevator up','W_app=m(g+a)'],['Circular','F_c=mv\u00b2/r toward centre'],['Gravity','F=GMm/r\u00b2; g=GM/r\u00b2']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Mechanics',ti:"Newton's First Law",su:'State and apply the law of inertia.',steps:[
  {lb:'Law of inertia',dr:dQ1,ht:'<p>A body remains at rest or moves at constant velocity unless acted upon by a resultant external force. Inertia is the tendency to resist changes in motion and is proportional to mass.</p>'},
  {lb:'Inertia in practice',dr:dQ1,ht:'<p>Car brakes suddenly: passengers continue forward (seat belt provides braking force). Tablecloth pulled quickly: dishes stay (inertia overcomes brief friction). Spacecraft far from planets: coasts indefinitely at constant velocity. Equilibrium means \u03a3F=0, NOT rest.</p>'},
  {lb:'Inertial frames',dr:dQ1,ht:'<p>Inertial frame: one where Newton\u2019s 1st law holds (non-accelerating, non-rotating). Non-inertial frame: fictitious forces appear (centrifugal, Coriolis). For WAEC: treat Earth\u2019s surface as approximately inertial.</p>'},
  {lb:'Equilibrium vs rest',dr:dQ1,ht:'<p>Equilibrium (\u03a3F=0) does NOT require rest. A car at constant velocity is in equilibrium (driving force = friction + drag). Object stationary on table is in equilibrium (weight = normal). Both have \u03a3F=0; one moves, one does not.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['net_force','friction_constant','acc_find']);if(type==='net_force'){var m=rnd(2,500),a=rnd(1,20),F=m*a;return{question:'Net force on m=<b>'+m+'kg</b> giving a=<b>'+a+'m/s\u00b2</b>?',hints:['F=ma'],ans:F,tol:0,unit:'N',working:'F='+m+'\u00d7'+a+' = '+F+' N'};}if(type==='friction_constant'){var F_drive=rnd(500,5000);return{question:'Car at constant velocity; engine force=<b>'+F_drive+'N</b>. Total drag?',hints:['Constant v \u2192 \u03a3F=0 \u2192 drag=engine force'],ans:F_drive,tol:0,unit:'N',working:'At const v: drag='+F_drive+' N'};}var m=rnd(1,100),F=rnd(10,2000),a=parseFloat((F/m).toFixed(2));return{question:'F_net=<b>'+F+'N</b> on m=<b>'+m+'kg</b>. Acceleration?',hints:['a=F/m'],ans:a,tol:a*0.02,unit:'m/s\u00b2',working:'a='+F+'/'+m+' = '+a+' m/s\u00b2'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Mechanics',ti:"Newton's Second Law",su:'Apply F=ma and F=\u0394p/\u0394t to force and momentum problems.',steps:[
  {lb:'F = ma',dr:dQ2,ht:'<div class="fm">F = ma (N) \u2014 resultant force only</div><p>F = net/resultant force (N), m = mass (kg), a = acceleration (m/s\u00b2). All in SI. Apply separately in x and y. F_net = F_applied - mg\u202fsin\u03b8 - friction - drag (along direction of motion).</p>'},
  {lb:'F = \u0394p/\u0394t',dr:dQ2,ht:'<div class="fm">F = \u0394p/\u0394t = m\u0394v/\u0394t (constant mass)</div><p>Variable mass rockets: F = v_exhaust(dm/dt). Impulse J = F\u0394t = \u0394p. Large F for short \u0394t gives same \u0394p as small F for long \u0394t. Airbags and crumple zones increase \u0394t to reduce peak F.</p>'},
  {lb:'Multiple forces',dr:dQ2,ht:'<p>Draw a free body diagram. Identify ALL forces: weight, normal, tension, friction, applied. Resolve into components. Apply \u03a3F_x=ma_x and \u03a3F_y=ma_y. For slope: resolve along slope and perpendicular to slope.</p>'},
  {lb:'Rocket propulsion',dr:dQ2,ht:'<p>Thrust = v_exhaust \u00d7 (dm/dt). As fuel burns: mass decreases \u2192 same thrust gives increasing acceleration. Tsiolkovsky: \u0394v = v_ex\u202fln(m_0/m_f). Multi-stage rockets discard empty tanks to reduce mass further.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['F_ma','impulse','thrust']);if(type==='F_ma'){var m=rnd(1,1000),a=rnd(1,20),F=m*a;return{question:'m=<b>'+m+'kg</b>, a=<b>'+a+'m/s\u00b2</b>. Net force?',hints:['F=ma'],ans:F,tol:0,unit:'N',working:'F='+m+'\u00d7'+a+' = '+F+' N'};}if(type==='impulse'){var F=rnd(100,10000),t=rnd(1,100)/100,J=parseFloat((F*t).toFixed(2));return{question:'F=<b>'+F+'N</b> for \u0394t=<b>'+t.toFixed(2)+'s</b>. Impulse?',hints:['J=F\u0394t'],ans:J,tol:J*0.01,unit:'N s',working:'J='+F+'\u00d7'+t.toFixed(2)+' = '+J+' N s'};}var vex=rnd(1000,4000),dmdt=rnd(1,100),thrust=vex*dmdt;return{question:'Rocket v_ex=<b>'+vex+'m/s</b>, dm/dt=<b>'+dmdt+'kg/s</b>. Thrust?',hints:['Thrust=v_ex\u00d7(dm/dt)'],ans:thrust,tol:0,unit:'N',working:'Thrust='+vex+'\u00d7'+dmdt+' = '+thrust+' N'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Mechanics',ti:"Newton's Third Law",su:"Identify Newton's 3rd law pairs. Apply to collisions and propulsion.",steps:[
  {lb:'Third law',dr:dQ3,ht:'<p>For every force A exerts on B, B exerts an equal and opposite force on A. Pairs always have: (1) same magnitude; (2) opposite direction; (3) same type; (4) act on DIFFERENT objects. The two forces in a pair cannot cancel \u2014 they act on different bodies.</p>'},
  {lb:'Identifying pairs',dr:dQ3,ht:'<p>Earth pulls person down (gravity) \u2192 person pulls Earth up (gravity). Rocket pushes gas back \u2192 gas pushes rocket forward. Normal force on book from table \u2192 book pushes down on table. Normal force and weight are NOT a 3rd law pair (weight is gravity from Earth; normal is contact force from table).</p>'},
  {lb:'Momentum conservation from 3rd law',dr:dQ3,ht:'<p>A exerts F on B for \u0394t: B gains impulse F\u0394t. By 3rd law: B exerts \u2212F on A for same \u0394t: A gains \u2212F\u0394t. Total change = 0. The 3rd law proves conservation of momentum for all isolated systems.</p>'},
  {lb:'Propulsion and recoil',dr:dQ3,ht:'<p>Propulsion: push backward \u2192 pushed forward. Swimmer: arms push water back; water pushes swimmer forward. Gun recoil: v_recoil = m_bullet\u00d7v_bullet/m_gun. Equal and opposite: cannon and ball, rocket and exhaust, jumping off boat.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['recoil','collision_stick','which_pair']);if(type==='recoil'){var m_gun=rnd(2,10),m_b=rnd(5,50)/1000,v_b=rnd(200,1000),v_r=parseFloat((m_b*v_b/m_gun).toFixed(2));return{question:'Gun m=<b>'+m_gun+'kg</b>; bullet m=<b>'+(m_b*1000).toFixed(0)+'g</b> at <b>'+v_b+'m/s</b>. Recoil speed?',hints:['p conserved: 0=m_b\u00d7v_b - m_gun\u00d7v_recoil'],ans:v_r,tol:v_r*0.02,unit:'m/s',working:'v_r='+m_b+'\u00d7'+v_b+'/'+m_gun+' = '+v_r+' m/s'};}if(type==='collision_stick'){var m1=rnd(2,20),v1=rnd(5,30),m2=rnd(2,20),vf=parseFloat((m1*v1/(m1+m2)).toFixed(2));return{question:'m\u2081=<b>'+m1+'kg</b> at <b>'+v1+'m/s</b> hits stationary m\u2082=<b>'+m2+'kg</b>; stick. v_f?',hints:['m\u2081v\u2081=(m\u2081+m\u2082)v_f'],ans:vf,tol:vf*0.02,unit:'m/s',working:'v_f='+m1+'\u00d7'+v1+'/('+m1+'+'+m2+') = '+vf+' m/s'};}var m1=rnd(2,20),v1=rnd(5,30),m2=rnd(2,20);var vf=m1*v1/(m1+m2),KEl=parseFloat((0.5*m1*v1*v1-0.5*(m1+m2)*vf*vf).toFixed(1));return{question:'m\u2081=<b>'+m1+'kg</b> at <b>'+v1+'m/s</b> + stationary m\u2082=<b>'+m2+'kg</b>; stick. KE lost?',hints:['KE_lost=\u00bdm\u2081v\u2081\u00b2-\u00bd(m\u2081+m\u2082)v_f\u00b2'],ans:KEl,tol:KEl*0.05,unit:'J',working:'v_f='+vf.toFixed(2)+'; KE_lost='+KEl+' J'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Mechanics',ti:'Atwood Machine and Connected Objects',su:'Analyse Atwood machines. Solve connected-object problems.',steps:[
  {lb:'Atwood machine',dr:dQ4,ht:'<div class="fm">a=(m\u2081-m\u2082)g/(m\u2081+m\u2082) &nbsp; T=2m\u2081m\u2082g/(m\u2081+m\u2082)</div><p>Two masses over ideal pulley. Net force=(m\u2081-m\u2082)g. Total inertia=m\u2081+m\u2082. Tension same throughout (ideal string + pulley). Used to measure g precisely by slowing the effective gravity.</p>'},
  {lb:'Mass on table with hanging mass',dr:dQ4,ht:'<p>m\u2082 on frictionless table, m\u2081 hanging: a=m\u2081g/(m\u2081+m\u2082). T=m\u2081m\u2082g/(m\u2081+m\u2082). With friction \u03bc on table: a=(m\u2081g-\u03bcm\u2082g)/(m\u2081+m\u2082). Strategy: system equation first (no T), then individual body for T.</p>'},
  {lb:'Mass on slope with hanging mass',dr:dQ4,ht:'<p>m\u2082 on slope at \u03b8, m\u2081 hanging (frictionless): a=(m\u2081-m\u2082\u202fsin\u03b8)g/(m\u2081+m\u2082). Normal on slope: N=m\u2082g\u202fcos\u03b8. With friction: add \u03bcN component opposing motion.</p>'},
  {lb:'Elevator problems',dr:dQ4,ht:'<p>Actual weight W=mg (constant). Apparent weight (from scale): N=m(g+a) accelerating up; N=m(g-a) down; N=mg at constant speed; N=0 in free fall. The apparent weight is what a spring balance reads in the elevator.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['atwood_a','atwood_T','elevator']);if(type==='atwood_a'){var m1=rnd(3,20),m2=rnd(1,m1-1),a=parseFloat(((m1-m2)*9.81/(m1+m2)).toFixed(2));return{question:'Atwood: m\u2081=<b>'+m1+'kg</b>, m\u2082=<b>'+m2+'kg</b>. Acceleration?',hints:['a=(m\u2081-m\u2082)g/(m\u2081+m\u2082)'],ans:a,tol:a*0.02,unit:'m/s\u00b2',working:'a=('+m1+'-'+m2+')\u00d79.81/('+m1+'+'+m2+') = '+a+' m/s\u00b2'};}if(type==='atwood_T'){var m1=rnd(3,20),m2=rnd(1,m1-1),T=parseFloat((2*m1*m2*9.81/(m1+m2)).toFixed(2));return{question:'Atwood: m\u2081=<b>'+m1+'kg</b>, m\u2082=<b>'+m2+'kg</b>. Tension?',hints:['T=2m\u2081m\u2082g/(m\u2081+m\u2082)'],ans:T,tol:T*0.02,unit:'N',working:'T=2\u00d7'+m1+'\u00d7'+m2+'\u00d79.81/('+m1+'+'+m2+') = '+T+' N'};}var m=rnd(50,120),a=rnd(1,5),Wup=parseFloat((m*(9.81+a)).toFixed(1));return{question:'m=<b>'+m+'kg</b> in lift accelerating up at <b>'+a+'m/s\u00b2</b>. Apparent weight?',hints:['W_app=m(g+a)'],ans:Wup,tol:Wup*0.02,unit:'N',working:'W_app='+m+'\u00d7(9.81+'+a+') = '+Wup+' N'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Mechanics',ti:"Newton's Laws on Slopes",su:"Apply Newton's laws to inclined planes.",steps:[
  {lb:'Forces on a slope',dr:dQ5,ht:'<p>Object on slope at angle \u03b8: Weight along slope (down): mg\u202fsin\u03b8. Normal: N=mg\u202fcos\u03b8. Friction: F_f=\u03bcN=\u03bcmg\u202fcos\u03b8 (up slope if sliding down). Net force along slope: mg\u202fsin\u03b8-F_f = mg(sin\u03b8-\u03bc\u202fcos\u03b8).</p>'},
  {lb:'Equations on slope',dr:dQ5,ht:'<p>Acceleration down slope: a=g(sin\u03b8-\u03bc\u202fcos\u03b8). Slides when tan\u03b8>\u03bc. Common angles: 30\u00b0 (sin=0.5), 37\u00b0 (sin=0.6, cos=0.8), 45\u00b0 (both=0.707), 53\u00b0 (sin=0.8, cos=0.6), 60\u00b0 (sin=0.866).</p>'},
  {lb:'Smooth slope',dr:dQ5,ht:'<p>Frictionless slope: a=g\u202fsin\u03b8, independent of mass. Acceleration only depends on angle. Car driving up slope: F_engine=ma+mg\u202fsin\u03b8+friction. At constant speed: F_engine=mg\u202fsin\u03b8+friction. Power P=F\u00d7v.</p>'},
  {lb:'Car on slope',dr:dQ5,ht:'<p>Driving up: F_engine-R-mg\u202fsin\u03b8=ma. Constant speed: F_engine=R+mg\u202fsin\u03b8. Braking down: retarding force=\u03bcmg\u202fcos\u03b8+mg\u202fsin\u03b8 (friction+gravity component both oppose motion up, both act on stationary or decelerating object going down). WAEC: always draw diagram first.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['slope_a','slope_N','slope_friction']);if(type==='slope_a'){var th=pick([30,37,45,53]),a=parseFloat((9.81*Math.sin(th*Math.PI/180)).toFixed(2));return{question:'Smooth slope \u03b8=<b>'+th+'\u00b0</b>. Acceleration?',hints:['a=g\u202fsin\u03b8'],ans:a,tol:a*0.02,unit:'m/s\u00b2',working:'a=9.81\u00d7sin'+th+'\u00b0 = '+a+' m/s\u00b2'};}if(type==='slope_N'){var m=rnd(2,50),th=pick([30,37,45,53]),N=parseFloat((m*9.81*Math.cos(th*Math.PI/180)).toFixed(2));return{question:'m=<b>'+m+'kg</b> on slope \u03b8=<b>'+th+'\u00b0</b>. Normal force?',hints:['N=mg\u202fcos\u03b8'],ans:N,tol:N*0.02,unit:'N',working:'N='+m+'\u00d79.81\u00d7cos'+th+'\u00b0 = '+N+' N'};}var m=rnd(2,30),th=pick([30,37,45]),mu=rnd(10,40)/100,a=parseFloat((9.81*(Math.sin(th*Math.PI/180)-mu*Math.cos(th*Math.PI/180))).toFixed(2));return{question:'m=<b>'+m+'kg</b>, \u03b8=<b>'+th+'\u00b0</b>, \u03bc=<b>'+mu+'</b>. Acceleration down slope?',hints:['a=g(sin\u03b8-\u03bc\u202fcos\u03b8)'],ans:a,tol:Math.abs(a)*0.05+0.1,unit:'m/s\u00b2',working:'a=9.81\u00d7(sin'+th+'\u00b0-'+mu+'\u00d7cos'+th+'\u00b0) = '+a+' m/s\u00b2'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Mechanics',ti:'Circular Motion and Forces',su:'Apply Newton\u2019s 2nd law to circular motion.',steps:[
  {lb:'Centripetal force',dr:dQ6,ht:'<div class="fm">F_c = mv\u00b2/r = m\u03c9\u00b2r</div><p>Always directed toward centre. Provided by: tension (string), gravity (orbit), normal (loop), friction (road). NOT a new force type \u2014 an existing force plays this role. Without centripetal force, object moves in straight line (Newton\u2019s 1st).</p>'},
  {lb:'Vertical circles',dr:dQ6,ht:'<p>Top of circle: N+mg=mv\u00b2/r \u2192 min speed (N=0): v_min=\u221a(gr). Bottom: N-mg=mv\u00b2/r \u2192 N=m(v\u00b2/r+g). Loop-the-loop cars, roller coasters, aircraft manoeuvres. At top minimum speed: only gravity provides centripetal force.</p>'},
  {lb:'Horizontal circles',dr:dQ6,ht:'<p>Car on flat: friction=mv\u00b2/r; max speed=\u221a(\u03bcgr). Banked road \u03b8: ideal speed v=\u221a(rg\u202ftan\u03b8). Conical pendulum: T\u202fsin\u03b8=m\u03c9\u00b2r, T\u202fcos\u03b8=mg \u2192 \u03c9\u00b2=g\u202ftan\u03b8/r.</p>'},
  {lb:'Gravity and orbital motion',dr:dQ6,ht:'<p>Satellite: GMm/r\u00b2=mv\u00b2/r \u2192 v=\u221a(GM/r). T=2\u03c0r/v. Kepler\u2019s 3rd: T\u00b2/r\u00b3=4\u03c0\u00b2/(GM) for all satellites of same body. Geostationary: T=24h, r\u224842200km. Escape speed: v_esc=\u221a(2GM/R)=\u221a(2gR).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['Fc','min_speed_top','banked_v']);if(type==='Fc'){var m=rnd(1,50),v=rnd(5,30),r=rnd(5,50),F=parseFloat((m*v*v/r).toFixed(2));return{question:'m=<b>'+m+'kg</b>, v=<b>'+v+'m/s</b>, r=<b>'+r+'m</b>. Centripetal force?',hints:['F_c=mv\u00b2/r'],ans:F,tol:F*0.02,unit:'N',working:'F='+m+'\u00d7'+v+'\u00b2/'+r+' = '+F+' N'};}if(type==='min_speed_top'){var r=rnd(5,50),v=parseFloat(Math.sqrt(9.81*r).toFixed(2));return{question:'Vertical circle r=<b>'+r+'m</b>. Min speed at top?',hints:['v_min=\u221a(gr)'],ans:v,tol:v*0.02,unit:'m/s',working:'v_min=\u221a(9.81\u00d7'+r+') = '+v+' m/s'};}var r=rnd(10,200),th=pick([10,20,30,40]),v=parseFloat(Math.sqrt(r*9.81*Math.tan(th*Math.PI/180)).toFixed(2));return{question:'Banked r=<b>'+r+'m</b>, \u03b8=<b>'+th+'\u00b0</b>. Ideal speed?',hints:['v=\u221a(rg\u202ftan\u03b8)'],ans:v,tol:v*0.02,unit:'m/s',working:'v=\u221a('+r+'\u00d79.81\u00d7tan'+th+'\u00b0) = '+v+' m/s'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Mechanics',ti:'Friction and Drag',su:'Apply friction and drag using Newton\u2019s laws.',steps:[
  {lb:'Friction laws',dr:dQ7,ht:'<p>Static: F_f\u2264\u03bc_s N; max=\u03bc_s N. Kinetic: F_k=\u03bc_k N. Always \u03bc_k<\u03bc_s. Friction opposes relative motion; perpendicular to N. N=mg\u202fcos\u03b8 on slope (not mg). Friction independent of contact area (for same N).</p>'},
  {lb:'Drag forces',dr:dQ7,ht:'<p>Low speed (laminar): F_drag=6\u03c0\u03b7rv (Stokes). High speed (turbulent): F_drag=\u00bdC_D\u03c1Av\u00b2. Terminal velocity: mg=F_drag \u2192 v_T=\u221a(2mg/(C_D\u03c1A)). Heavier, smaller, streamlined \u2192 higher v_T. Parachute: large A \u2192 low v_T (~5m/s).</p>'},
  {lb:'Work done by friction',dr:dQ7,ht:'<p>W_friction=\u2212F_f\u00d7d (always negative, opposes motion, heats surface). Stopping distance: \u00bdmv\u00b2=\u03bcmg\u00d7d \u2192 d=v\u00b2/(2\u03bcg). Doubling speed: quadruples stopping distance. On slope with friction: energy balance \u2192 KE=mgh-F_friction\u00d7d (going down).</p>'},
  {lb:'Air resistance and terminal velocity',dr:dQ7,ht:'<p>As object falls: drag increases with speed. Net force decreases. At v_T: net force=0, acceleration=0. v-t graph: starts at slope g, curves to horizontal at v_T. When parachute opens: drag>weight momentarily \u2192 deceleration \u2192 new lower v_T.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['stop_dist','terminal_v','slope_acc']);if(type==='stop_dist'){var v=rnd(10,40),mu=rnd(30,70)/100,d=parseFloat((v*v/(2*mu*9.81)).toFixed(1));return{question:'v=<b>'+v+'m/s</b>, \u03bc=<b>'+mu+'</b>. Stopping distance?',hints:['d=v\u00b2/(2\u03bcg)'],ans:d,tol:d*0.02,unit:'m',working:'d='+v+'\u00b2/(2\u00d7'+mu+'\u00d79.81) = '+d+' m'};}if(type==='terminal_v'){var m=rnd(1,30),k=rnd(1,20)/10,vT=parseFloat(Math.sqrt(m*9.81/k).toFixed(2));return{question:'m=<b>'+m+'kg</b>, drag F=kv\u00b2, k=<b>'+k+'kg/m</b>. Terminal velocity?',hints:['v_T=\u221a(mg/k)'],ans:vT,tol:vT*0.02,unit:'m/s',working:'v_T=\u221a('+m+'\u00d79.81/'+k+') = '+vT+' m/s'};}var m=rnd(5,30),th=pick([30,37,45]),mu=rnd(10,40)/100,a=parseFloat((9.81*(Math.sin(th*Math.PI/180)-mu*Math.cos(th*Math.PI/180))).toFixed(2));return{question:'m=<b>'+m+'kg</b>, \u03b8=<b>'+th+'\u00b0</b>, \u03bc=<b>'+mu+'</b>. Acceleration down slope?',hints:['a=g(sin\u03b8-\u03bc\u202fcos\u03b8)'],ans:a,tol:Math.abs(a)*0.05+0.05,unit:'m/s\u00b2',working:'a=9.81\u00d7(sin'+th+'\u00b0-'+mu+'\u00d7cos'+th+'\u00b0) = '+a+' m/s\u00b2'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Mechanics',ti:'Gravitational Force and Orbits',su:"Apply Newton's law of gravitation. Analyse orbits.",steps:[
  {lb:"Newton's law of gravitation",dr:dQ8,ht:'<div class="fm">F = GMm/r\u00b2</div><p>G=6.674\u00d710\u207b\u00b9\u00b9 N\u202fm\u00b2/kg\u00b2. Force is attractive; acts along line joining centres; equal and opposite (3rd law). Weight: W=GMm/r\u00b2; g=GM/r\u00b2 decreases with altitude.</p>'},
  {lb:'Gravitation law',dr:dQ8,ht:'<div class="fm">F = GMm/r²</div><p>G=6.674×10⁻¹¹ N m²/kg². Attractive force between masses; acts along line joining centres; equal and opposite (3rd law). Weight W=GMm/r² at distance r. Surface: g=GM/R_E²=9.81 m/s². g decreases with altitude as 1/r².</p>'},
  {lb:'Orbital mechanics',dr:dQ8,ht:'<p>Circular orbit: GMm/r\u00b2=mv\u00b2/r \u2192 v=\u221a(GM/r). T=2\u03c0r/v. Kepler 3rd: T\u00b2/r\u00b3=4\u03c0\u00b2/GM. Geostationary: T=86400s; r\u224842200km. Lower orbit \u2192 faster speed, shorter period.</p>'},
  {lb:'Gravitational field strength',dr:dQ8,ht:'<p>g=GM/r\u00b2. At surface: g=9.81\u202fm/s\u00b2. At altitude h: g_h=g_0(R_E/(R_E+h))\u00b2. Gravitational potential V=\u2212GM/r (negative; zero at infinity). Potential energy U=mV=\u2212GMm/r.</p>'},
  {lb:'Escape speed',dr:dQ8,ht:'<div class="fm">v_esc = \u221a(2GM/R) = \u221a(2gR)</div><p>Speed needed to escape gravitational field to infinity. Earth: v_esc=\u221a(2\u00d79.81\u00d76.4\u00d710\u2076)=11.2\u202fkm/s. Moon: 2.4\u202fkm/s. Jupiter: 60\u202fkm/s. Escape does not depend on direction (if no atmosphere).</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['grav_g','orbital_v','escape_v']);if(type==='grav_g'){var G=6.674e-11,M=5.97e24,r=rnd(6400,12000)*1e3,g_h=parseFloat((G*M/(r*r)).toFixed(2));return{question:'Calculate g at r=<b>'+(r/1e6).toFixed(2)+'\u00d710\u2076m</b> from Earth centre (M=5.97\u00d710\u00b2\u2074)',hints:['g=GM/r\u00b2'],ans:g_h,tol:g_h*0.05,unit:'m/s\u00b2',working:'g=6.67\u00d710\u207b\u00b9\u00b9\u00d75.97\u00d710\u00b2\u2074/'+r.toExponential(2)+'\u00b2 = '+g_h+' m/s\u00b2'};}if(type==='orbital_v'){var r=rnd(7000,15000)*1e3,GM=3.986e14,v=parseFloat(Math.sqrt(GM/r).toFixed(0));return{question:'Orbit r=<b>'+(r/1e6).toFixed(2)+'\u00d710\u2076m</b>. Orbital speed (GM=3.986\u00d710\u00b9\u2074)?',hints:['v=\u221a(GM/r)'],ans:v,tol:v*0.03,unit:'m/s',working:'v=\u221a(3.986\u00d710\u00b9\u2074/'+r.toExponential(2)+') = '+v+' m/s'};}var g=rnd(5,25),R=rnd(1000,8000)*1e3,v_esc=parseFloat(Math.sqrt(2*g*R).toFixed(0));return{question:'Planet g=<b>'+g+'m/s\u00b2</b>, R=<b>'+(R/1e6).toFixed(2)+'\u00d710\u2076m</b>. Escape speed?',hints:['v_esc=\u221a(2gR)'],ans:v_esc,tol:v_esc*0.02,unit:'m/s',working:'v_esc=\u221a(2\u00d7'+g+'\u00d7'+R.toExponential(2)+') = '+v_esc+' m/s'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Mechanics',ti:'Impulse, Momentum and Collisions',su:"Apply Newton's 2nd law in impulse-momentum form.",steps:[
  {lb:'Impulse and momentum',dr:dQ9,ht:'<div class="fm">J = F\u0394t = \u0394p (N\u202fs)</div><p>Impulse = change in momentum = area under F-t graph. Safety design: increase \u0394t \u2192 reduce peak F for same \u0394p. Airbags, crumple zones, catching a cricket ball (moving hand back), bending knees on landing.</p>'},
  {lb:'Conservation of momentum',dr:dQ9,ht:'<p>Isolated system (\u03a3F_ext=0): \u03a3p constant. Elastic: KE also conserved. Inelastic: KE lost. Coefficient of restitution e=v_sep/v_approach. e=1 elastic; e=0 perfectly inelastic. Two-body elastic (equal masses): velocities exchange.</p>'},
  {lb:'Explosion problems',dr:dQ9,ht:'<p>Total p=0 before and after. m\u2081v\u2081+m\u2082v\u2082=0; v\u2081/v\u2082=\u2212m\u2082/m\u2081. Lighter piece gets more KE: KE\u2081/KE\u2082=m\u2082/m\u2081. Applications: gun recoil, nuclear decay, fireworks, rocket staging.</p>'},
  {lb:'2D collisions overview',dr:dQ9,ht:'<p>Momentum conserved in each dimension separately: \u03a3p_x=const, \u03a3p_y=const. Resolve before and after velocities into x and y. For elastic equal-mass glancing collision: paths are perpendicular after collision. WAEC usually 1D; Cambridge may include 2D.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['collision_vf','impulse','explosion']);if(type==='collision_vf'){var m1=rnd(2,20),v1=rnd(5,30),m2=rnd(2,20),vf=parseFloat((m1*v1/(m1+m2)).toFixed(2));return{question:'m\u2081=<b>'+m1+'kg</b> at <b>'+v1+'m/s</b> hits stationary m\u2082=<b>'+m2+'kg</b>; stick. v_f?',hints:['(m\u2081+m\u2082)v_f=m\u2081v\u2081'],ans:vf,tol:vf*0.02,unit:'m/s',working:'v_f='+m1+'\u00d7'+v1+'/('+m1+'+'+m2+') = '+vf+' m/s'};}if(type==='impulse'){var F=rnd(100,5000),t=rnd(1,100)/100,J=parseFloat((F*t).toFixed(2));return{question:'F=<b>'+F+'N</b> for \u0394t=<b>'+t.toFixed(2)+'s</b>. Impulse?',hints:['J=F\u0394t'],ans:J,tol:J*0.01,unit:'N s',working:'J='+F+'\u00d7'+t.toFixed(2)+' = '+J+' N s'};}var m1=rnd(2,20),v1=rnd(5,30),m2=rnd(2,20),v2=parseFloat((m1*v1/m2).toFixed(2));return{question:'Explosion: m\u2081=<b>'+m1+'kg</b> at <b>'+v1+'m/s</b>, m\u2082=<b>'+m2+'kg</b> opposite. Speed of m\u2082?',hints:['m\u2081v\u2081=m\u2082v\u2082 (p was zero)'],ans:v2,tol:v2*0.02,unit:'m/s',working:'v\u2082='+m1+'\u00d7'+v1+'/'+m2+' = '+v2+' m/s'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Mechanics',ti:"Mixed Newton's Laws Questions",su:"Integrated questions across all Y12-MEC-06 topics.",steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>F=ma. F=GMm/r\u00b2. F_c=mv\u00b2/r. J=F\u0394t=\u0394p. \u03a3p=const. Atwood: a=(m\u2081-m\u2082)g/(m\u2081+m\u2082). Elevator: W_app=m(g\u00b1a). Friction: F_f=\u03bcN. Slope: a=g(sin\u03b8-\u03bc\u202fcos\u03b8). v_esc=\u221a(2gR). v_orbit=\u221a(GM/r).</p>'},
