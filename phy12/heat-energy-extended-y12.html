<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Thermal physics overview',ACC,13,'middle',true));
[['Topic','Key Formula','Key Idea'],['Specific heat','Q=mc\u0394T','energy to raise 1 kg by 1 K'],['Latent heat','Q=mL','energy for phase change (no \u0394T)'],['Ideal gas','pV=nRT','n=moles; R=8.31 J/molK'],['Kinetic theory','E_k=\u00b3/\u2082k_BT','k_B=1.38\u00d710\u207b\u00b2\u00b3 J/K'],['Wien law','\u03bb_maxT=b','b=2.90\u00d710\u207b\u00b3 m K'],['Stefan-Boltz.','P=\u03c3AT\u2074','\u03c3=5.67\u00d710\u207b\u2078 W/m\u00b2K\u2074']].forEach(function(r,i){if(i<=p){o.push(R(10,26+i*34,460,28,i===0?LINE:CRM,i===0?ACC:LINE,0.5));r.forEach(function(v,j){o.push(T(15+j*148,46+i*34,v,i===0?ACC:'#333',i===0?8:8,'start',i===0));});}});
s.innerHTML=o.join('');}
function dQ2(p){dQ1(p);}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ1(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ1(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Heat energy summary',ACC,13,'middle',true));
[['Spec. heat Q','Q=mc\u0394T; c_water=4200 J/kgK'],['Latent heat L','Q=mL; L_fusion; L_vaporisation'],['Ideal gas','pV=nRT; R=8.31; p in Pa; V in m\u00b3; T in K'],['Kinetic theory','E_k=\u00b3/\u2082k_BT; c_rms=\u221a(3RT/M)'],['1st law thermo','\u0394U=Q+W; Q heat in; W work done on gas'],['Wien','T\u03bb_max=2.90\u00d710\u207b\u00b3 m K'],['Stefan','P=\u03c3AT\u2074; \u03c3=5.67\u00d710\u207b\u2078']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Thermal',ti:'Specific Heat Capacity',su:'Apply Q=mc\u0394T. Solve calorimetry problems.',steps:[
  {lb:'Specific heat capacity',dr:dQ1,ht:'<div class="fm">Q = mc\u0394T (J)</div><p>c = specific heat capacity (J/kgK). Q = heat energy transferred. m = mass (kg). \u0394T = temperature change (K or \u00b0C). c_water = 4200 J/kgK. c_copper = 385 J/kgK. c_aluminum = 900 J/kgK. c_air = 1000 J/kgK. Higher c: stores more energy per degree rise.</p>'},
  {lb:'Calorimetry',dr:dQ1,ht:'<p>Method of mixtures: heat gained by cold = heat lost by hot (in insulated container). m_c\u00d7c_c\u00d7(T_f-T_c) = m_h\u00d7c_h\u00d7(T_h-T_f). Electrical heating: Q = IVt = Pt; then c = Q/(m\u0394T). Sources of error: heat loss to surroundings; imprecise temperature measurement; condensation on container. Correct by extrapolation or insulation.</p>'},
  {lb:'Thermometers and temperature scales',dr:dQ1,ht:'<p>Thermometric property must vary linearly with temperature. Types: mercury-in-glass, thermocouple, thermistor resistance, platinum resistance, pyrometer (for very high T). Celsius (T_C) to Kelvin (T_K): T_K = T_C + 273. Absolute zero: 0 K = \u2212273\u00b0C. Kelvin is SI unit of temperature. Practical: use calibration with ice point (273 K) and steam point (373 K).</p>'},
  {lb:'Heat transfer mechanisms',dr:dQ1,ht:'<p>Conduction: energy transfer by particle collision; no bulk movement; good in metals (free electrons); poor in wood, air. Convection: bulk movement of fluid. Radiation: electromagnetic waves (no medium needed); all objects emit infrared. Lags by 1/r\u00b2. Rate of heat conduction: P = kA\u0394T/d (k = thermal conductivity). U-value: W/m\u00b2K for building materials.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['Q_mcdT','c_from_Q','T_final_mix']);if(type==='Q_mcdT'){var m=rnd(1,20),c=pick([385,900,4200]),dT=rnd(5,100),Q=m*c*dT;return{question:'m=<b>'+m+'kg</b>, c=<b>'+c+' J/kgK</b>, \u0394T=<b>'+dT+'K</b>. Heat Q?',hints:['Q=mc\u0394T'],ans:Q,tol:0,unit:'J',working:'Q='+m+'\u00d7'+c+'\u00d7'+dT+' = '+Q+' J'};}if(type==='c_from_Q'){var m=rnd(1,10),dT=rnd(10,50),Q=rnd(1,100)*m*dT,c=parseFloat((Q/(m*dT)).toFixed(0));return{question:'Q=<b>'+Q+' J</b>, m=<b>'+m+'kg</b>, \u0394T=<b>'+dT+'K</b>. Specific heat c?',hints:['c=Q/(m\u0394T)'],ans:c,tol:c*0.02,unit:'J/kgK',working:'c='+Q+'/('+m+'\u00d7'+dT+') = '+c+' J/kgK'};}var m1=rnd(1,5),m2=rnd(1,5),T1=rnd(20,50),T2=rnd(51,90),c1=c2=4200,Tf=parseFloat(((m1*T1+m2*T2)/(m1+m2)).toFixed(1));return{question:'Water: m\u2081=<b>'+m1+'kg</b> at <b>'+T1+'\u00b0C</b> + m\u2082=<b>'+m2+'kg</b> at <b>'+T2+'\u00b0C</b>. T_f?',hints:['m\u2081c\u0394T\u2081=m\u2082c\u0394T\u2082; T_f=(m\u2081T\u2081+m\u2082T\u2082)/(m\u2081+m\u2082)'],ans:Tf,tol:Tf*0.02,unit:'\u00b0C',working:'T_f=('+m1+'\u00d7'+T1+'+'+m2+'\u00d7'+T2+')/('+m1+'+'+m2+') = '+Tf+'\u00b0C'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Thermal',ti:'Latent Heat',su:'Apply Q=mL. Describe phase changes.',steps:[
  {lb:'Latent heat',dr:dQ2,ht:'<div class="fm">Q = mL (J)</div><p>L = specific latent heat (J/kg). No temperature change during phase change (energy breaks/forms intermolecular bonds). L_fusion (solid\u2192liquid): water = 3.34\u00d710\u2075 J/kg. L_vaporisation (liquid\u2192gas): water = 2.26\u00d710\u2076 J/kg. L_vap much larger (gas molecules much further apart; more bonds broken).</p>'},
  {lb:'Heating curve',dr:dQ2,ht:'<p>Heating curve (Q vs T): sloped sections = temperature rising (Q=mc\u0394T). Flat sections = phase change (Q=mL, T constant). Flat section at 0\u00b0C = melting; flat section at 100\u00b0C = boiling. Length of flat sections proportional to L. Slope of rising sections proportional to 1/(mc); less steep for larger c.</p>'},
  {lb:'Evaporation vs boiling',dr:dQ2,ht:'<p>Evaporation: occurs at all temperatures from liquid surface; fastest molecules escape; cools liquid. Boiling: occurs throughout liquid when vapour pressure = atmospheric pressure; at specific temperature at given pressure. Sweating: body cools by evaporation of water. Refrigeration: evaporation of coolant absorbs heat from fridge interior; condensation releases heat to room.</p>'},
  {lb:'Vapour pressure',dr:dQ2,ht:'<p>Vapour pressure: pressure of vapour in equilibrium with liquid. Increases with temperature. Boiling point: when vapour pressure = external pressure. At altitude: lower atmospheric pressure; lower boiling point; food cooks more slowly (or needs pressure cooker). Pressure cooker: increases pressure; raises boiling point; cooks faster.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['Q_mL','L_from_Q','total_heat']);if(type==='Q_mL'){var m=rnd(1,10),L=pick([334000,2260000]),Q=m*L;return{question:'m=<b>'+m+'kg</b>, L=<b>'+L.toExponential(3)+' J/kg</b>. Heat to change phase?',hints:['Q=mL'],ans:Q,tol:0,unit:'J',working:'Q='+m+'\u00d7'+L.toExponential(3)+' = '+Q+' J'};}if(type==='L_from_Q'){var m=rnd(1,5),L=pick([334000,2260000]),Q=m*L,L_calc=parseFloat((Q/m).toFixed(0));return{question:'Q=<b>'+Q.toExponential(3)+' J</b>, m=<b>'+m+'kg</b>. Latent heat L?',hints:['L=Q/m'],ans:L_calc,tol:L_calc*0.02,unit:'J/kg',working:'L='+Q.toExponential(3)+'/'+m+' = '+L_calc+' J/kg'};}var m=rnd(1,5),c=4200,T1=rnd(20,80),Q_heat=m*c*(100-T1),Q_evap=m*2260000,Q_total=Q_heat+Q_evap;return{question:'Heat <b>'+m+'kg</b> water from <b>'+T1+'\u00b0C</b> to steam (L=2260kJ/kg). Total Q?',hints:['Q=mc\u0394T + mL; c=4200'],ans:Q_total,tol:Q_total*0.02,unit:'J',working:'Q='+m+'\u00d74200\u00d7'+(100-T1)+'+'+m+'\u00d72260000 = '+Q_total+' J'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Thermal',ti:'Ideal Gas Laws',su:'Apply pV=nRT. Use Boyle\'s, Charles\' and Gay-Lussac\'s laws.',steps:[
  {lb:'Ideal gas law',dr:dQ3,ht:'<div class="fm">pV = nRT &nbsp;&nbsp; R = 8.31 J/mol K</div><p>p = pressure (Pa), V = volume (m\u00b3), n = amount (moles), T = absolute temperature (K). Also: pV = NkT where N = number of molecules, k = Boltzmann constant = 1.38\u00d710\u207b\u00b2\u00b3 J/K. pV/T = constant for fixed n (combined gas law).</p>'},
  {lb:'Boyle\'s, Charles\' and Gay-Lussac\'s laws',dr:dQ3,ht:'<p>Boyle (fixed T): pV = const; p\u2081V\u2081 = p\u2082V\u2082. Double pressure \u2192 half volume. Charles (fixed p): V/T = const; V\u2081/T\u2081 = V\u2082/T\u2082. Heat gas \u2192 volume increases proportionally (in K). Gay-Lussac (fixed V): p/T = const; p\u2081/T\u2081 = p\u2082/T\u2082. Heat in sealed container \u2192 pressure rises. All at absolute temperature (K)!</p>'},
  {lb:'Number of moles',dr:dQ3,ht:'<p>n = m/M where m = mass (g), M = molar mass (g/mol). N = nN_A where N_A = Avogadro\u2019s number = 6.02\u00d710\u00b2\u00b3/mol. Air: M \u2248 29 g/mol. O\u2082: M = 32 g/mol. CO\u2082: M = 44 g/mol. Molar volume at STP (0\u00b0C, 101 kPa): 22.4 L/mol. Standard conditions: STP = 0\u00b0C, 101.325 kPa; SATP = 25\u00b0C, 100 kPa.</p>'},
  {lb:'Real vs ideal gases',dr:dQ3,ht:'<p>Ideal gas assumptions: (1) molecules have negligible volume; (2) no intermolecular forces (except during collisions); (3) perfectly elastic collisions; (4) random motion. Real gases deviate at high pressure (molecules have volume) and low temperature (intermolecular forces important). Van der Waals equation: (p+a/V\u00b2)(V-b) = nRT. Hydrogen and helium behave most ideally.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['pV_nRT','Boyle','Charles']);if(type==='pV_nRT'){var n=rnd(1,10),T=rnd(273,500),V=rnd(1,50)/1000,p=parseFloat((n*8.31*T/V).toFixed(0));return{question:'n=<b>'+n+' mol</b>, T=<b>'+T+' K</b>, V=<b>'+V.toFixed(3)+' m\u00b3</b>. Pressure p?',hints:['p=nRT/V; R=8.31'],ans:p,tol:p*0.02,unit:'Pa',working:'p='+n+'\u00d78.31\u00d7'+T+'/'+V.toFixed(3)+' = '+p+' Pa'};}if(type==='Boyle'){var p1=rnd(100,500),V1=rnd(1,20),p2=rnd(200,1000),V2=parseFloat((p1*V1/p2).toFixed(2));return{question:'p\u2081=<b>'+p1+' kPa</b>, V\u2081=<b>'+V1+' L</b>, p\u2082=<b>'+p2+' kPa</b>. V\u2082?',hints:['p\u2081V\u2081=p\u2082V\u2082 (constant T)'],ans:V2,tol:V2*0.02,unit:'L',working:'V\u2082='+p1+'\u00d7'+V1+'/'+p2+' = '+V2+' L'};}var V1=rnd(1,20),T1=rnd(273,373),T2=rnd(374,500),V2=parseFloat((V1*T2/T1).toFixed(2));return{question:'V\u2081=<b>'+V1+' L</b>, T\u2081=<b>'+T1+' K</b>, T\u2082=<b>'+T2+' K</b>. V\u2082?',hints:['V\u2081/T\u2081=V\u2082/T\u2082 (constant p); T in Kelvin!'],ans:V2,tol:V2*0.02,unit:'L',working:'V\u2082='+V1+'\u00d7'+T2+'/'+T1+' = '+V2+' L'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Thermal',ti:'Kinetic Theory of Gases',su:'Derive pressure formula. Calculate mean kinetic energy and rms speed.',steps:[
  {lb:'Kinetic theory model',dr:dQ4,ht:'<p>Assumptions: large N identical molecules; random motion in all directions; molecule size \u226a container; only forces during brief elastic collisions; no intermolecular forces between collisions. Molecular speeds: Maxwell-Boltzmann distribution; most probable, mean, and rms speeds all different. At higher T: distribution shifts to higher speeds and broadens.</p>'},
  {lb:'Pressure from kinetic theory',dr:dQ4,ht:'<div class="fm">p = \u2153 (N/V) m\u3008c\u00b2\u3009</div><p>\u3008c\u00b2\u3009 = mean square speed. m = molecular mass. pV = \u2153 Nm\u3008c\u00b2\u3009. Comparing with pV = nRT = NkT: \u00bdm\u3008c\u00b2\u3009 = \u00b3\u2082 k_BT (mean KE per molecule). So KE \u221d T. c_rms = \u221a(\u3008c\u00b2\u3009) = \u221a(3kT/m) = \u221a(3RT/M). M = molar mass (kg/mol).</p>'},
  {lb:'Mean kinetic energy',dr:dQ4,ht:'<div class="fm">E_k = \u00b3/\u2082 k_B T (per molecule) &nbsp; E_k = \u00b3/\u2082 RT (per mole)</div><p>k_B = 1.38\u00d710\u207b\u00b2\u00b3 J/K. KE per molecule \u221d T (in Kelvin). At absolute zero: KE = 0; minimum molecular motion (quantum: still zero-point energy). Total internal energy of monatomic ideal gas: U = N \u00d7 \u00b3\u2082 k_BT = \u00b3\u2082 nRT.</p>'},
  {lb:'Equipartition of energy',dr:dQ4,ht:'<p>Each degree of freedom contributes \u00bd k_BT to KE per molecule. Monatomic gas (He, Ar): 3 translational DOF; U = \u00b3\u2082 nRT; C_v = \u00b3\u2082 R. Diatomic gas (N\u2082, O\u2082): 3 translational + 2 rotational = 5 DOF; U = \u2075\u2082 nRT; C_v = \u2075\u2082 R. At high T: vibrational modes also contribute. Explains different heat capacities of gases.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['KE_molecule','c_rms','p_kinetic']);if(type==='KE_molecule'){var T=rnd(200,1000),kB=1.38e-23,KE=parseFloat((1.5*kB*T).toExponential(2));return{question:'T=<b>'+T+' K</b>. Mean KE per molecule?',hints:['E_k=\u00b3/\u2082 k_BT; k_B=1.38\u00d710\u207b\u00b2\u00b3'],ans:parseFloat(KE),tol:parseFloat(KE)*0.03,unit:'J',working:'E_k=1.5\u00d71.38\u00d710\u207b\u00b2\u00b3\u00d7'+T+' = '+KE+' J'};}if(type==='c_rms'){var T=rnd(200,1000),M=rnd(2,44)/1000,c=parseFloat(Math.sqrt(3*8.31*T/M).toFixed(0));return{question:'T=<b>'+T+' K</b>, M=<b>'+(M*1000).toFixed(0)+' g/mol</b>. c_rms?',hints:['c_rms=\u221a(3RT/M); R=8.31; M in kg/mol'],ans:c,tol:c*0.03,unit:'m/s',working:'c=\u221a(3\u00d78.31\u00d7'+T+'/'+(M)+') = '+c+' m/s'};}var n=rnd(1,10),T=rnd(273,500),U=parseFloat((1.5*n*8.31*T).toFixed(0));return{question:'Monatomic ideal gas: n=<b>'+n+' mol</b>, T=<b>'+T+' K</b>. Internal energy U?',hints:['U=\u00b3/\u2082nRT (monatomic); R=8.31'],ans:U,tol:U*0.02,unit:'J',working:'U=1.5\u00d7'+n+'\u00d78.31\u00d7'+T+' = '+U+' J'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Thermal',ti:'First Law of Thermodynamics',su:'Apply \u0394U=Q+W. Analyse thermodynamic processes.',steps:[
  {lb:'First law',dr:dQ5,ht:'<div class="fm">\u0394U = Q + W</div><p>\u0394U = change in internal energy (J). Q = heat added to gas (positive into system). W = work done ON gas (positive when compressed). Alternative: \u0394U = Q - W where W = work done BY gas. Cyclic process: \u0394U = 0; Q = W. Adiabatic: Q = 0; \u0394U = W. Isothermal: \u0394U = 0; Q = \u2212W_on = W_by.</p>'},
  {lb:'Work done by/on a gas',dr:dQ5,ht:'<p>W_by_gas = p\u0394V (constant pressure). W_on_gas = \u2212p\u0394V. Work done = area under p-V graph. Expansion: gas does positive work; W_by > 0. Compression: work done on gas; W_by < 0. Area enclosed by cycle on p-V graph = net work done per cycle. Clockwise cycle: net work done by gas (engine). Anti-clockwise: net work done on gas (refrigerator).</p>'},
  {lb:'Thermodynamic processes',dr:dQ5,ht:'<p>Isothermal (constant T): pV = const; \u0394U = 0; Q = W_by. Isobaric (constant p): W = p\u0394V; \u0394U = Q \u2212 p\u0394V. Isochoric (constant V): W = 0; \u0394U = Q. Adiabatic (no heat): Q = 0; \u0394U = \u2212W_by; gas cools on expansion. Adiabatic: p\u03b3 = const (\u03b3 = heat capacity ratio).</p>'},
  {lb:'Second law and entropy',dr:dQ5,ht:'<p>Second law: heat flows spontaneously from hot to cold; not the reverse without doing work. Entropy (S) always increases in natural processes (\u0394S \u2265 0). Maximum efficiency (Carnot): \u03b7 = 1 \u2212 T_cold/T_hot (temperatures in Kelvin). Real engines less efficient than Carnot. Refrigerator: work must be done to move heat from cold to warm.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['delta_U','W_gas','Carnot_eff']);if(type==='delta_U'){var Q=rnd(-1000,2000),W=rnd(-500,1000),dU=Q+W;return{question:'Q=<b>'+Q+' J</b> (in), W=<b>'+W+' J</b> (on gas). \u0394U?',hints:['\u0394U=Q+W (W=work ON gas)'],ans:dU,tol:0,unit:'J',working:'\u0394U='+Q+' + '+(W)+' = '+dU+' J'};}if(type==='W_gas'){var p=rnd(100,1000),dV=rnd(1,50)/1000,W=parseFloat((p*dV).toFixed(3));return{question:'p=<b>'+p+' kPa</b>, \u0394V=<b>'+dV.toFixed(3)+' m\u00b3</b>. Work done BY gas?',hints:['W_by=p\u0394V (expansion)'],ans:parseFloat((p*1000*dV).toFixed(0)),tol:parseFloat((p*1000*dV).toFixed(0))*0.02,unit:'J',working:'W='+p+'\u00d71000\u00d7'+dV.toFixed(3)+' = '+(p*1000*dV).toFixed(0)+' J'};}var Th=rnd(400,800),Tc=rnd(200,Th-100),eff=parseFloat(((1-Tc/Th)*100).toFixed(1));return{question:'Carnot: T_h=<b>'+Th+' K</b>, T_c=<b>'+Tc+' K</b>. Max efficiency?',hints:['\u03b7=(1-T_c/T_h)\u00d7100%'],ans:eff,tol:eff*0.02,unit:'%',working:'\u03b7=(1-'+Tc+'/'+Th+')\u00d7100 = '+eff+'%'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Thermal',ti:'Blackbody Radiation',su:'Apply Wien\'s law and Stefan-Boltzmann law.',steps:[
  {lb:'Blackbody radiation',dr:dQ6,ht:'<p>Blackbody: perfect absorber/emitter. Emits continuous spectrum with characteristic shape. Peak wavelength depends only on temperature. Hotter object: more radiation at all wavelengths; peak shifts to shorter wavelengths (bluer). Real objects emit fraction of blackbody output: emissivity 0 < e < 1. Sun: T \u2248 5778 K; peak in visible. Earth: T \u2248 288 K; peak in IR.</p>'},
  {lb:'Wien\'s displacement law',dr:dQ6,ht:'<div class="fm">\u03bb_max = b/T &nbsp;&nbsp; b = 2.898\u00d710\u207b\u00b3 m K</div><p>Peak wavelength \u03bb_max inversely proportional to absolute temperature. Hot star (T=30000K): \u03bb_max = 97 nm (UV). Sun (T=5778K): \u03bb_max = 502 nm (green). Cool star (T=3000K): \u03bb_max = 966 nm (near-IR, appears red). Human body (T=310K): \u03bb_max = 9.4 \u03bcm (thermal IR).</p>'},
  {lb:'Stefan-Boltzmann law',dr:dQ6,ht:'<div class="fm">P = \u03c3AT\u2074 (W) &nbsp;&nbsp; \u03c3 = 5.67\u00d710\u207b\u2078 W m\u207b\u00b2 K\u207b\u2074</div><p>Total power radiated per unit area \u221d T\u2074. Double T: 16\u00d7 more power. Used to find star temperatures from luminosity (P) and radius (A=4\u03c0R\u00b2): T = (P/(\u03c34\u03c0R\u00b2))\u00b9\u2044\u2074. Net power radiated by object at T in environment at T_env: P_net = \u03c3A(T\u2074 \u2212 T_env\u2074).</p>'},
  {lb:'Applications of radiation laws',dr:dQ6,ht:'<p>Stellar astronomy: Wien gives surface temperature from spectrum colour. Stefan-Boltzmann gives luminosity from T and radius. Greenhouse effect: Sun visible (5778K); Earth re-emits IR (288K); atmosphere absorbs IR more than visible \u2192 warming. Infrared cameras: detect temperature from IR emission. Pyrometers: measure temperature remotely.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['Wien_lambda','Stefan_P','Stefan_T']);if(type==='Wien_lambda'){var T=rnd(2000,30000),b=2.898e-3,lam=parseFloat((b/T*1e9).toFixed(0));return{question:'Star T=<b>'+T+' K</b>. Peak wavelength (nm)?',hints:['\u03bb_max=b/T; b=2.898\u00d710\u207b\u00b3'],ans:lam,tol:lam*0.03,unit:'nm',working:'\u03bb_max=2.898\u00d710\u207b\u00b3/'+T+'\u00d710\u2079 = '+lam+' nm'};}if(type==='Stefan_P'){var T=rnd(200,6000),A=rnd(1,100),sigma=5.67e-8,P=parseFloat((sigma*A*Math.pow(T,4)).toFixed(0));return{question:'T=<b>'+T+' K</b>, A=<b>'+A+' m\u00b2</b>. Power radiated?',hints:['P=\u03c3AT\u2074; \u03c3=5.67\u00d710\u207b\u2078'],ans:P,tol:P*0.05,unit:'W',working:'P=5.67\u00d710\u207b\u2078\u00d7'+A+'\u00d7'+T+'\u2074 = '+P+' W'};}var P=rnd(100,100000),A=rnd(1,50),sigma=5.67e-8,T=parseFloat(Math.pow(P/(sigma*A),0.25).toFixed(0));return{question:'P=<b>'+P+' W</b>, A=<b>'+A+' m\u00b2</b>. Temperature T?',hints:['T=(P/(\u03c3A))^(1/4)'],ans:T,tol:T*0.03,unit:'K',working:'T=('+P+'/(5.67\u00d710\u207b\u2078\u00d7'+A+'))^0.25 = '+T+' K'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Thermal',ti:'Thermometers and Temperature',su:'Describe temperature scales and thermometric properties.',steps:[
  {lb:'Temperature scales',dr:dQ7,ht:'<p>Celsius (T_C): 0\u00b0C at ice point; 100\u00b0C at steam point. Kelvin (T_K): T_K = T_C + 273.15 (0 K = absolute zero = \u2212273.15\u00b0C). Absolute zero: theoretical temperature at which thermal motion ceases; KE = 0 classically; impossible to reach in practice. Thermodynamic temperature scale: defined by ideal gas or Carnot efficiency.</p>'},
  {lb:'Thermometers',dr:dQ7,ht:'<p>Mercury-in-glass: simple; reads directly; -39\u00b0C to 350\u00b0C. Thermocouple: two different metals; EMF proportional to temperature difference; wide range (-200 to 2600\u00b0C); fast response. Thermistor: resistance decreases with T; very sensitive; good for small temperature changes. Platinum resistance thermometer: very accurate; R = R\u2080(1+\u03b1\u0394T). Pyrometer: measures IR emission; no contact; high temperatures.</p>'},
  {lb:'Thermal equilibrium',dr:dQ7,ht:'<p>Zeroth law of thermodynamics: if A is in thermal equilibrium with B, and B is in thermal equilibrium with C, then A is in thermal equilibrium with C. Defines temperature: objects in thermal equilibrium have the same temperature. Net heat flow stops when temperatures equal. Thermometer works by reaching thermal equilibrium with measured object.</p>'},
  {lb:'Thermal expansion',dr:dQ7,ht:'<p>Linear: \u0394L = L\u2080\u03b1\u0394T (\u03b1 = linear expansion coefficient). Volume: \u0394V = V\u2080\u03b3\u0394T (\u03b3 = 3\u03b1). \u03b1_steel = 12\u00d710\u207b\u2076 K\u207b\u00b9. Practical applications: gaps in railway tracks, expansion joints in bridges, bimetallic strips (thermostats). Invar: very low \u03b1; used for precision instruments. Water: anomalous \u2014 maximum density at 4\u00b0C; ice less dense than water (floats).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['C_to_K','expansion','Wien_T']);if(type==='C_to_K'){var TC=rnd(-50,200),TK=TC+273;return{question:'T=<b>'+TC+'\u00b0C</b>. Convert to Kelvin.',hints:['T_K=T_C+273'],ans:TK,tol:1,unit:'K',working:'T_K='+TC+'+273 = '+TK+' K'};}if(type==='expansion'){var L0=rnd(1,100),alpha=12e-6,dT=rnd(10,200),dL=parseFloat((L0*alpha*dT*1000).toFixed(3));return{question:'Steel L\u2080=<b>'+L0+' m</b>, \u03b1=12\u00d710\u207b\u2076, \u0394T=<b>'+dT+' K</b>. \u0394L (mm)?',hints:['\u0394L=L\u2080\u03b1\u0394T; \u00d71000 for mm'],ans:dL,tol:dL*0.02,unit:'mm',working:'\u0394L='+L0+'\u00d712\u00d710\u207b\u2076\u00d7'+dT+'\u00d71000 = '+dL+' mm'};}var lam=rnd(400,10000),T=parseFloat((2898000/lam).toFixed(0));return{question:'Peak wavelength \u03bb_max=<b>'+lam+' nm</b>. Temperature T?',hints:['T=b/\u03bb_max; b=2.898\u00d710\u207b\u00b3 m K'],ans:T,tol:T*0.03,unit:'K',working:'T=2.898\u00d710\u207b\u00b3/'+lam+'nm\u00d710\u2079 = '+T+' K'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Thermal',ti:'Heat Engines and Refrigerators',su:'Apply efficiency. Describe Carnot cycle.',steps:[
  {lb:'Heat engine',dr:dQ8,ht:'<p>Heat engine: converts heat to work. Takes heat Q_h from hot reservoir T_h; does work W; rejects heat Q_c to cold reservoir T_c. Energy conservation: Q_h = W + Q_c. Efficiency: \u03b7 = W/Q_h = 1 \u2212 Q_c/Q_h = 1 \u2212 T_c/T_h (Carnot maximum). Real engines: friction, irreversibility reduce efficiency. Car engine: \u03b7 \u2248 25%; power plant: \u03b7 \u2248 35\u201340%.</p>'},
  {lb:'Carnot cycle',dr:dQ8,ht:'<p>Carnot cycle: maximum efficiency for given T_h and T_c. Consists of: 1) Isothermal expansion at T_h (absorbs Q_h). 2) Adiabatic expansion (T falls from T_h to T_c). 3) Isothermal compression at T_c (rejects Q_c). 4) Adiabatic compression (T rises from T_c to T_h). No real engine can exceed Carnot efficiency. More useful to increase T_h or decrease T_c.</p>'},
  {lb:'Refrigerators and heat pumps',dr:dQ8,ht:'<p>Refrigerator: reversal of heat engine. Input work W; removes Q_c from cold reservoir; rejects Q_h = Q_c + W to warm reservoir. COP (coefficient of performance): COP_fridge = Q_c/W. COP_heat_pump = Q_h/W. Heat pump always more efficient than direct heating (COP > 1). Carnot COP_fridge = T_c/(T_h - T_c).</p>'},
  {lb:'Entropy and the second law',dr:dQ8,ht:'<p>Entropy S: \u0394S = Q/T for reversible process (J/K). Clausius inequality: total \u0394S \u2265 0 for any process. Nature tends toward higher disorder (entropy). Perfect engine (100% efficiency): would violate 2nd law. Mixing hot and cold water: irreversible; entropy increases. Life maintains low entropy locally by increasing entropy of environment.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['efficiency','Carnot_eff','COP']);if(type==='efficiency'){var W=rnd(100,1000),Qh=rnd(W+100,2000),eff=parseFloat((W/Qh*100).toFixed(1));return{question:'W=<b>'+W+' J</b>, Q_h=<b>'+Qh+' J</b>. Engine efficiency?',hints:['\u03b7=W/Q_h\u00d7100%'],ans:eff,tol:eff*0.02,unit:'%',working:'\u03b7='+W+'/'+Qh+'\u00d7100 = '+eff+'%'};}if(type==='Carnot_eff'){var Th=rnd(500,900),Tc=rnd(200,Th-100),eff=parseFloat(((1-Tc/Th)*100).toFixed(1));return{question:'Carnot engine: T_h=<b>'+Th+' K</b>, T_c=<b>'+Tc+' K</b>. Max efficiency?',hints:['\u03b7=(1-T_c/T_h)\u00d7100%'],ans:eff,tol:eff*0.02,unit:'%',working:'\u03b7=(1-'+Tc+'/'+Th+')\u00d7100 = '+eff+'%'};}var W=rnd(100,500),Qc=rnd(100,1000),COP=parseFloat((Qc/W).toFixed(2));return{question:'Refrigerator: W=<b>'+W+' J</b>, Q_c removed=<b>'+Qc+' J</b>. COP?',hints:['COP=Q_c/W'],ans:COP,tol:COP*0.02,unit:'',working:'COP='+Qc+'/'+W+' = '+COP};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Thermal',ti:'Thermal Properties of Materials',su:'Compare thermal conductivity. Apply heat transfer equations.',steps:[
  {lb:'Thermal conductivity',dr:dQ9,ht:'<div class="fm">P = kA\u0394T/d (W)</div><p>k = thermal conductivity (W/mK). A = area (m\u00b2). \u0394T = temperature difference (K). d = thickness (m). Metals (Cu: 400, Al: 200, Fe: 80): high k (free electrons). Insulators (glass: 1, wood: 0.1, air: 0.024): low k. Composite wall: layers in series; same P through each; temperature drop proportional to d/k for each layer.</p>'},
  {lb:'Heat loss from buildings',dr:dQ9,ht:'<p>U-value: heat loss per unit area per degree per second (W/m\u00b2K). Lower U-value = better insulation. Cavity wall: 0.3 W/m\u00b2K. Solid brick: 2.0 W/m\u00b2K. Double glazing: 2.8 W/m\u00b2K. Loft insulation: reduces U from 2.0 to 0.15. Heat loss rate: P = U \u00d7 A \u00d7 (T_inside - T_outside). Payback period: cost of insulation / annual energy saving.</p>'},
  {lb:'Convection',dr:dQ9,ht:'<p>Natural convection: density differences drive flow. Warmed fluid rises; cooled fluid sinks; creates circulation. Forced convection: fan or pump circulates fluid; more efficient than natural. Convection coefficient h: P = hA\u0394T. Newton\u2019s law of cooling: \u0394T decreases exponentially. Applications: central heating (radiators), double-glazing (convection in gap reduced by narrow gap), sea breezes.</p>'},
  {lb:'Radiation heat transfer',dr:dQ9,ht:'<p>Net radiation power: P_net = e\u03c3A(T\u2074 - T_env\u2074). e = emissivity (0 to 1). Black surface (e=1): best emitter and absorber. Shiny surface (e~0): poor emitter; good reflector. Vacuum flask: silvered walls (reduce radiation); vacuum between walls (eliminate conduction and convection). Greenhouse effect: glass transparent to visible; opaque to far-IR.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['conduction_P','U_value_P','net_radiation']);if(type==='conduction_P'){var k=pick([0.024,0.1,1.0,50,200,400]),A=rnd(1,20),dT=rnd(10,100),d=rnd(1,100)/1000,P=parseFloat((k*A*dT/d).toFixed(1));return{question:'k=<b>'+k+' W/mK</b>, A=<b>'+A+' m\u00b2</b>, \u0394T=<b>'+dT+' K</b>, d=<b>'+(d*1000).toFixed(0)+'mm</b>. P?',hints:['P=kA\u0394T/d'],ans:P,tol:P*0.03,unit:'W',working:'P='+k+'\u00d7'+A+'\u00d7'+dT+'/'+d+' = '+P+' W'};}if(type==='U_value_P'){var U=pick([0.3,0.5,2.0,2.8]),A=rnd(5,100),dT=rnd(10,30),P=parseFloat((U*A*dT).toFixed(1));return{question:'U=<b>'+U+' W/m\u00b2K</b>, A=<b>'+A+' m\u00b2</b>, \u0394T=<b>'+dT+' K</b>. Heat loss P?',hints:['P=U\u00d7A\u00d7\u0394T'],ans:P,tol:P*0.02,unit:'W',working:'P='+U+'\u00d7'+A+'\u00d7'+dT+' = '+P+' W'};}var sigma=5.67e-8,T=rnd(300,1000),Tenv=300,A=rnd(1,10),P=parseFloat((sigma*A*(Math.pow(T,4)-Math.pow(Tenv,4))).toFixed(0));return{question:'\u03c3=5.67\u00d710\u207b\u2078, A=<b>'+A+' m\u00b2</b>, T=<b>'+T+' K</b>, T_env=300K. Net radiation P?',hints:['P=\u03c3A(T\u2074-T_env\u2074)'],ans:P,tol:P*0.05,unit:'W',working:'P=5.67\u00d710\u207b\u2078\u00d7'+A+'\u00d7('+T+'\u2074-300\u2074) = '+P+' W'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Thermal',ti:'Mixed Thermal Questions',su:'Integrated questions across all Y12-THE-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>Q=mc\u0394T. Q=mL. pV=nRT. E_k=\u00b3/\u2082k_BT. \u0394U=Q+W. P=\u03c3AT\u2074. \u03bb_maxT=2.90\u00d710\u207b\u00b3. \u03b7=1-T_c/T_h. P_cond=kA\u0394T/d. c_rms=\u221a(3RT/M). R=8.31 J/molK. k_B=1.38\u00d710\u207b\u00b2\u00b3 J/K.</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC tests: Q=mc\u0394T (calorimetry); Q=mL (latent heat and heating curves); gas laws (Boyle, Charles, ideal gas); kinetic theory (pressure, KE); Wien\u2019s law; Stefan\u2019s law; Carnot efficiency. Always convert temperature to Kelvin for gas law and radiation calculations.</p>'},
  {lb:'Key links',dr:dQ10,ht:'<p>All thermal properties link through temperature (in Kelvin). Gas laws and KE \u221d T. Radiation \u221d T\u2074. Wien \u03bb_max \u221d 1/T. First law links heat, work and internal energy. Carnot efficiency limits all heat engines. Understanding these links helps answer multi-step WAEC questions.</p>'},
  {lb:'Key formulae',dr:dQ10,ht:'<div class="fm">Q=mc\u0394T \u2022 Q=mL \u2022 pV=nRT</div><div class="fm">E_k=\u00b3/\u2082k_BT \u2022 P=\u03c3AT\u2074 \u2022 \u03bb_max=b/T</div>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['Q_heat','gas_law','Wien']);if(type==='Q_heat'){var m=rnd(1,20),c=pick([385,900,4200]),dT=rnd(5,100),Q=m*c*dT;return{question:'m=<b>'+m+'kg</b>, c=<b>'+c+' J/kgK</b>, \u0394T=<b>'+dT+' K</b>. Q?',hints:['Q=mc\u0394T'],ans:Q,tol:0,unit:'J',working:'Q='+m+'\u00d7'+c+'\u00d7'+dT+' = '+Q+' J'};}if(type==='gas_law'){var p1=rnd(100,500),V1=rnd(1,20),p2=rnd(200,1000),V2=parseFloat((p1*V1/p2).toFixed(2));return{question:'Boyle: p\u2081=<b>'+p1+'kPa</b>, V\u2081=<b>'+V1+'L</b>, p\u2082=<b>'+p2+'kPa</b>. V\u2082?',hints:['p\u2081V\u2081=p\u2082V\u2082'],ans:V2,tol:V2*0.02,unit:'L',working:'V\u2082='+p1+'\u00d7'+V1+'/'+p2+' = '+V2+' L'};}var T=rnd(3000,30000),b=2.898e-3,lam=parseFloat((b/T*1e9).toFixed(0));return{question:'T=<b>'+T+' K</b>. Peak wavelength (Wien, nm)?',hints:['\u03bb_max=b/T; b=2.898\u00d710\u207b\u00b3 m K; \u00d710\u2079 for nm'],ans:lam,tol:lam*0.03,unit:'nm',working:'\u03bb=2.898\u00d710\u207b\u00b3/'+T+'\u00d710\u2079 = '+lam+' nm'};})},
]},

var qi=0,si=0;

(function(){var p=new URLSearchParams(location.search),total=QS.length;var only=(p.get('only')||'').split(',').map(Number).filter(function(n){return n>=1&&n<=total;});window.abcQuestionNumbers=null;if(only.length){var nums=[],keep=[];QS.forEach(function(x,i){if(only.indexOf(i+1)>=0){nums.push(i+1);keep.push(x);}});QS.length=0;keep.forEach(function(x){QS.push(x);});window.abcQuestionNumbers=nums;var lbl=document.querySelector('#sb .sb-lbl');if(lbl){lbl.innerHTML='This lesson: '+nums.length+' of '+total+' questions &middot; <a href="'+location.pathname+'" style="color:inherit">show all</a>';}}var q=parseInt(p.get('q'),10);if(q>=1){var idx=window.abcQuestionNumbers?window.abcQuestionNumbers.indexOf(q):q-1;if(idx>=0&&idx<QS.length)qi=idx;}})();
// Keep each question's real number in the sidebar when only some are shown
if(window.abcQuestionNumbers){var _renderAll=render;render=function(){_renderAll.apply(this,arguments);var n=window.abcQuestionNumbers;document.querySelectorAll('#sb .qn').forEach(function(el,i){if(n[i])el.textContent='Q'+n[i];});};}

(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
render();
