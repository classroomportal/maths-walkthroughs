<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}

.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Mass vs weight',ACC,13,'middle',true));
o.push(R(10,36,222,210,CRM,ACC,2));o.push(T(121,54,'MASS',ACC,11,'middle',true));
o.push(R(248,36,222,210,CRM,ACC,2));o.push(T(359,54,'WEIGHT',ACC,11,'middle',true));
['Scalar','kg','Measure of inertia','Constant everywhere','Beam balance'].forEach(function(v,i){if(i<p+1)o.push(T(121,74+i*28,v,'#333',9,'middle',false));});
['Vector (down)','newton (N)','Gravitational force','Varies with g','Spring balance'].forEach(function(v,i){if(i<p+1)o.push(T(359,74+i*28,v,'#333',9,'middle',false));});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Free fall and terminal velocity',ACC,12,'middle',true));
if(p>=1){o.push(R(10,38,460,42,CRM,ACC,1.5));o.push(T(240,56,'Free fall: only gravity; a = g = 9.81 m/s\u00b2 for all objects (in vacuum)',DARK,10,'middle',false));o.push(T(240,74,'Equations: v=gt, s=\u00bdgt\u00b2 from rest','#333',9,'middle',false));}
if(p>=2){o.push(R(10,90,460,42,CRM,ACC,1.5));o.push(T(240,106,'In air: drag increases with speed; net force decreases','#333',10,'middle',false));o.push(T(240,124,'Terminal velocity: drag = weight; a = 0; constant speed','#555',9,'middle',false));}
if(p>=3){o.push(R(10,142,460,42,CRM,ACC,1.5));o.push(T(240,158,'Stokes\u2019 law (laminar flow): F_drag = 6\u03c0\u03b7rv','#333',10,'middle',false));o.push(T(240,174,'Terminal: mg = 6\u03c0\u03b7rv_T; v_T = mg/(6\u03c0\u03b7r)','#555',9,'middle',false));}
if(p>=4){o.push(R(10,194,460,42,LINE,ACC,1));o.push(T(240,210,'v-t graph: slope = g initially, curves to horizontal line at v_T','#333',9,'middle',false));o.push(T(240,228,'Parachute: large area, low v_T (~5\u20137 m/s)','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Simple pendulum',ACC,13,'middle',true));
o.push(R(10,36,460,44,CRM,ACC,2));o.push(T(240,58,'T = 2\u03c0\u221a(L/g)',DARK,16,'middle',true));
o.push(T(240,74,'T=period (s), L=length (m), g=9.81 m/s\u00b2','#555',9,'middle',false));
if(p>=1){o.push(R(10,92,460,40,CRM,ACC,1.5));o.push(T(240,110,'Independent of mass and amplitude (small angles < 10\u00b0)','#333',10,'middle',false));}
if(p>=2){o.push(R(10,142,460,40,CRM,ACC,1.5));o.push(T(240,158,'Rearranging: g = 4\u03c0\u00b2L/T\u00b2','#333',10,'middle',false));o.push(T(240,174,'Plot T\u00b2 vs L: gradient = 4\u03c0\u00b2/g','#555',9,'middle',false));}
if(p>=3){o.push(R(10,192,460,40,CRM,ACC,1.5));o.push(T(240,208,'Time 20 oscillations; repeat 3 times; divide by 20','#333',9,'middle',false));}
if(p>=4){o.push(R(10,236,460,18,LINE,ACC,0.5));o.push(T(240,248,'Reduce errors: light gate, small angle, measure L to centre of bob','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ4(p){dQ1(p);}
function dQ5(p){dQ3(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ3(p);}
function dQ9(p){dQ2(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Mass, weight, time summary',ACC,13,'middle',true));
[['W=mg','vector; varies with g; 9.81 N/kg on Earth'],['Mass','scalar; constant; measure of inertia'],['Free fall','a=g; all objects same in vacuum'],['Terminal velocity','drag=weight; a=0; depends on shape/mass'],['Pendulum T','2\u03c0\u221a(L/g); independent of mass, amplitude'],['g from pendulum','g=4\u03c0\u00b2/gradient of T\u00b2 vs L'],['Stokes law','F=6\u03c0\u03b7rv (sphere, laminar flow)']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Mechanics',ti:'Mass vs Weight',su:'Distinguish mass from weight. Calculate weight on different planets.',steps:[
  {lb:'Definitions',dr:dQ1,ht:'<p><b>Mass:</b> scalar; kg; amount of matter; measure of inertia; constant everywhere in universe. <b>Weight:</b> vector (downward); N; gravitational force; W = mg; varies with gravitational field strength g.</p>'},
  {lb:'Gravitational field strength',dr:dQ1,ht:'<p>g = 9.81 N/kg on Earth\u2019s surface (= 9.81 m/s\u00b2). Moon: 1.6 N/kg. Mars: 3.7 N/kg. Jupiter: 24.8 N/kg. g = GM/r\u00b2 (decreases with distance). Same astronaut: same mass everywhere; different weight on each planet.</p>'},
  {lb:'Measuring mass and weight',dr:dQ1,ht:'<p>Mass: beam balance (compares with known masses; works anywhere since both sides equally affected by g). Weight: spring balance (calibrated for specific g; gives different readings in different gravitational fields). In orbit: apparent weightlessness (free fall; mass unchanged).</p>'},
  {lb:'Equivalence principle',dr:dQ1,ht:'<p>Inertial mass (from F=ma) equals gravitational mass (from F=GMm/r\u00b2) to very high precision. Einstein\u2019s Equivalence Principle: gravity and acceleration are locally indistinguishable. Foundation of General Relativity.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var m=rnd(10,200),g=pick([9.81,1.6,3.7,24.8]);var pl={9.81:'Earth',1.6:'Moon',3.7:'Mars',24.8:'Jupiter'}[g];var W=parseFloat((m*g).toFixed(1));return{question:'Mass=<b>'+m+' kg</b>, g on '+pl+'=<b>'+g+' N/kg</b>. Weight?',hints:['W=mg'],ans:W,tol:W*0.02,unit:'N',working:'W='+m+'\u00d7'+g+' = '+W+' N'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Mechanics',ti:'Free Fall and Terminal Velocity',su:'Describe free fall. Explain terminal velocity.',steps:[
  {lb:'Free fall',dr:dQ2,ht:'<p>In free fall, only gravity acts (no air resistance). All objects fall with the same acceleration g = 9.81 m/s\u00b2, regardless of mass (in a vacuum). Equations of motion apply: v = u + gt, s = ut + \u00bdgt\u00b2, v\u00b2 = u\u00b2 + 2gs.</p>'},
  {lb:'Air resistance and drag',dr:dQ2,ht:'<p>In air: drag force opposes motion, increases with speed. As object speeds up: drag increases, net force (mg\u2212F_D) decreases, acceleration decreases. Eventually drag = weight \u2192 net force = 0 \u2192 acceleration = 0 \u2192 terminal velocity.</p>'},
  {lb:'Terminal velocity factors',dr:dQ2,ht:'<p>Higher mass: higher terminal velocity. Larger area/less streamlined: lower terminal velocity. Parachute: large area \u2192 much lower v_T (~5\u20137 m/s vs ~55 m/s without). Stokes\u2019 law for spheres: F = 6\u03c0\u03b7rv; v_T = 2r\u00b2(\u03c1_s\u2212\u03c1_f)g/(9\u03b7).</p>'},
  {lb:'Velocity-time graph',dr:dQ2,ht:'<p>v-t graph of falling object: starts at slope=g, curves, flattens at v_T. When parachute opens: speed decreases sharply (drag > weight), new lower v_T. a-t graph: starts at g, decreases exponentially to 0 at terminal velocity.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['v','s','drag']);if(type==='v'){var t=rnd(1,10),v=parseFloat((9.81*t).toFixed(2));return{question:'Free fall from rest for <b>'+t+' s</b>. Final speed?',hints:['v=gt'],ans:v,tol:v*0.01,unit:'m/s',working:'v=9.81\u00d7'+t+' = '+v+' m/s'};}if(type==='s'){var t=rnd(1,8),s=parseFloat((0.5*9.81*t*t).toFixed(1));return{question:'Free fall from rest for <b>'+t+' s</b>. Distance?',hints:['s=\u00bdgt\u00b2'],ans:s,tol:s*0.02,unit:'m',working:'s=0.5\u00d79.81\u00d7'+t+'\u00b2 = '+s+' m'};}var m=rnd(1,30),W=parseFloat((m*9.81).toFixed(1));return{question:'Mass=<b>'+m+' kg</b>. Drag force at terminal velocity?',hints:['At v_T: drag=weight=mg'],ans:W,tol:W*0.01,unit:'N',working:'Drag=mg='+m+'\u00d79.81 = '+W+' N'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Mechanics',ti:'Simple Pendulum',su:'Apply T=2\u03c0\u221a(L/g). Describe experiment to measure g.',steps:[
  {lb:'Pendulum equation',dr:dQ3,ht:'<div class="fm">T = 2\u03c0\u221a(L/g)</div><p>T = period (s); L = length from pivot to centre of bob (m); g = 9.81 m/s\u00b2. Valid for small amplitudes (<10\u00b0). Independent of mass and amplitude. Rearranging: g = 4\u03c0\u00b2L/T\u00b2.</p>'},
  {lb:'Measuring g',dr:dQ3,ht:'<p>Method: (1) Measure L from pivot to centre of bob. (2) Displace <10\u00b0. (3) Time 20 complete oscillations. (4) Repeat twice; average. (5) T = total time/20. (6) Vary L; repeat. (7) Plot T\u00b2 vs L; gradient = 4\u03c0\u00b2/g.</p>'},
  {lb:'T\u00b2 vs L graph',dr:dQ3,ht:'<p>Squaring: T\u00b2 = (4\u03c0\u00b2/g)L. Plot T\u00b2 (y) vs L (x): straight line through origin; gradient = 4\u03c0\u00b2/g; from gradient: g = 4\u03c0\u00b2/gradient. Uncertainty in g: use steepest and shallowest lines through error bars.</p>'},
  {lb:'Error analysis',dr:dQ3,ht:'<p>Sources of error: (1) L \u2014 measure to centre of bob; use calipers. (2) Timing \u2014 use light gate to eliminate reaction time. (3) Amplitude \u2014 keep <10\u00b0. (4) Air currents \u2014 shield apparatus. (5) Pivot friction \u2014 use knife edge. %unc(g) = %unc(L) + 2\u00d7%unc(T).</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var L=rnd(20,150)/100,g=9.81,T=parseFloat((2*Math.PI*Math.sqrt(L/g)).toFixed(3));var type=pick(['T','g_from_grad','L']);if(type==='T')return{question:'L=<b>'+L.toFixed(2)+' m</b>. Period T?',hints:['T=2\u03c0\u221a(L/g)'],ans:T,tol:T*0.01,unit:'s',working:'T=2\u03c0\u221a('+L.toFixed(2)+'/9.81) = '+T+' s'};if(type==='g_from_grad'){var grad=parseFloat((4*Math.PI*Math.PI/g).toFixed(3));return{question:'T\u00b2 vs L gradient=<b>'+grad+' s\u00b2/m</b>. Calculate g.',hints:['g=4\u03c0\u00b2/gradient'],ans:parseFloat((4*Math.PI*Math.PI/grad).toFixed(2)),tol:0.05,unit:'m/s\u00b2',working:'g=4\u03c0\u00b2/'+grad+' = '+parseFloat((4*Math.PI*Math.PI/grad).toFixed(2))+' m/s\u00b2'};}var T2=parseFloat((rnd(10,25)/10).toFixed(2)),L2=parseFloat((g*T2*T2/(4*Math.PI*Math.PI)).toFixed(3));return{question:'T=<b>'+T2+' s</b>. Pendulum length L?',hints:['L=gT\u00b2/(4\u03c0\u00b2)'],ans:L2,tol:L2*0.02,unit:'m',working:'L=9.81\u00d7'+T2+'\u00b2/(4\u03c0\u00b2) = '+L2+' m'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Mechanics',ti:'Momentum and Impulse',su:'Define momentum. Apply impulse-momentum theorem and conservation of momentum.',steps:[
  {lb:'Momentum',dr:dQ4,ht:'<div class="fm">p = mv (kg\u202fm\u202fs\u207b\u00b9)</div><p>Vector in direction of velocity. Newton\u2019s 2nd law: F = \u0394p/\u0394t. Conservation: in isolated system total momentum is constant (\u03a3F_ext = 0).</p>'},
  {lb:'Impulse',dr:dQ4,ht:'<div class="fm">Impulse J = F\u0394t = \u0394p (N\u202fs)</div><p>Area under F-t graph = impulse = change in momentum. Large F for short \u0394t gives same impulse as small F for long \u0394t. Airbags and crumple zones: increase \u0394t \u2192 reduce F for same impulse.</p>'},
  {lb:'Collisions',dr:dQ4,ht:'<p>Elastic: momentum AND KE conserved; bounce. Inelastic: only momentum conserved; KE lost to heat/sound. Perfectly inelastic: stick together; maximum KE lost. All collisions: \u03a3p_before = \u03a3p_after.</p>'},
  {lb:'Perfectly inelastic collision',dr:dQ4,ht:'<p>m\u2081v\u2081 + m\u2082v\u2082 = (m\u2081+m\u2082)v_f. KE lost = \u00bd(m\u2081+m\u2082)v_f\u00b2 \u2212 (\u00bdm\u2081v\u2081\u00b2+\u00bdm\u2082v\u2082\u00b2). Explosion: m\u2081v\u2081 + m\u2082v\u2082 = 0; v\u2081/v\u2082 = \u2212m\u2082/m\u2081. Gun recoil: recoil velocity = \u2212(m_bullet/m_gun)\u00d7v_bullet.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['p','impulse','collision']);if(type==='p'){var m=rnd(1,100),v=rnd(1,50);return{question:'m=<b>'+m+' kg</b>, v=<b>'+v+' m/s</b>. Momentum?',hints:['p=mv'],ans:m*v,tol:0,unit:'kg m/s',working:'p='+m+'\u00d7'+v+' = '+(m*v)+' kg m/s'};}if(type==='impulse'){var F=rnd(10,1000),t=rnd(1,100)/100,J=parseFloat((F*t).toFixed(2));return{question:'F=<b>'+F+' N</b> for <b>'+t.toFixed(2)+' s</b>. Impulse?',hints:['J=F\u0394t'],ans:J,tol:J*0.01,unit:'N s',working:'J='+F+'\u00d7'+t.toFixed(2)+' = '+J+' N s'};}var m1=rnd(2,20),v1=rnd(5,30),m2=rnd(2,20),vf=parseFloat((m1*v1/(m1+m2)).toFixed(2));return{question:'m\u2081=<b>'+m1+'kg</b> at <b>'+v1+'m/s</b> hits stationary m\u2082=<b>'+m2+'kg</b>; stick. v_f?',hints:['m\u2081v\u2081=(m\u2081+m\u2082)v_f'],ans:vf,tol:vf*0.02,unit:'m/s',working:'v_f='+m1+'\u00d7'+v1+'/('+m1+'+'+m2+') = '+vf+' m/s'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Mechanics',ti:'Work, Energy and Power',su:'Calculate work, kinetic energy, potential energy and power.',steps:[
  {lb:'Work done',dr:dQ5,ht:'<div class="fm">W = Fs\cos\u03b8 (J)</div><p>Work = force \u00d7 displacement \u00d7 cos\u03b8 (\u03b8 = angle between F and s). Zero work: F perpendicular to motion. Negative work: F opposes motion. Area under F-s graph = work done.</p>'},
  {lb:'Energy',dr:dQ5,ht:'<div class="fm">KE = \u00bdmv\u00b2 \u2022 GPE = mgh \u2022 EPE = \u00bdkx\u00b2</div><p>Work-energy theorem: W_net = \u0394KE. Conservation: total energy constant if no dissipation. With friction: KE_lost + GPE_gained = W_friction.</p>'},
  {lb:'Power',dr:dQ5,ht:'<div class="fm">P = W/t = Fv (W)</div><p>1 W = 1 J/s. P = Fv valid when F and v parallel. Efficiency \u03b7 = P_useful/P_input \u00d7 100%.</p>'},
  {lb:'Energy conservation',dr:dQ5,ht:'<p>No friction: KE \u21c4 GPE (or EPE). v = \u221a(2gh) for free fall from height h. Car braking: \u00bdmv\u00b2 = F_friction \u00d7 d. Pendulum: \u00bdmv\u00b2 = mgl(1\u2212cos\u03b8). WAEC: energy methods avoid needing to know forces.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['KE','GPE','power','work']);if(type==='KE'){var m=rnd(1,100),v=rnd(2,30),KE=parseFloat((0.5*m*v*v).toFixed(1));return{question:'m=<b>'+m+'kg</b>, v=<b>'+v+'m/s</b>. KE?',hints:['KE=\u00bdmv\u00b2'],ans:KE,tol:KE*0.02,unit:'J',working:'KE=0.5\u00d7'+m+'\u00d7'+v+'\u00b2 = '+KE+' J'};}if(type==='GPE'){var m=rnd(1,100),h=rnd(1,50),GPE=parseFloat((m*9.81*h).toFixed(1));return{question:'m=<b>'+m+'kg</b>, h=<b>'+h+'m</b>. GPE?',hints:['GPE=mgh'],ans:GPE,tol:GPE*0.02,unit:'J',working:'GPE='+m+'\u00d79.81\u00d7'+h+' = '+GPE+' J'};}if(type==='power'){var W=rnd(500,20000),t=rnd(5,120),P=parseFloat((W/t).toFixed(1));return{question:'W=<b>'+W+'J</b> in <b>'+t+'s</b>. Power?',hints:['P=W/t'],ans:P,tol:P*0.02,unit:'W',working:'P='+W+'/'+t+' = '+P+' W'};}var F=rnd(10,500),d=rnd(2,30),th=pick([0,30,45,60]),Wd=parseFloat((F*d*Math.cos(th*Math.PI/180)).toFixed(1));return{question:'F=<b>'+F+'N</b>, d=<b>'+d+'m</b>, \u03b8=<b>'+th+'\u00b0</b>. Work?',hints:['W=Fd cos\u03b8'],ans:Wd,tol:Wd*0.02,unit:'J',working:'W='+F+'\u00d7'+d+'\u00d7cos'+th+'\u00b0 = '+Wd+' J'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Mechanics',ti:'Density and Archimedes\u2019 Principle',su:'Calculate density. Apply Archimedes\u2019 principle.',steps:[
  {lb:'Density',dr:dQ6,ht:'<div class="fm">\u03c1 = m/V (kg/m\u00b3)</div><p>Water=1000, ice=917, air=1.2, Al=2700, steel=7900, Hg=13600. Relative density = \u03c1/\u03c1_water. Irregular solid: measure volume by water displacement.</p>'},
  {lb:'Archimedes\u2019 principle',dr:dQ6,ht:'<div class="fm">F_up = \u03c1_f V_s g</div><p>Upthrust = weight of fluid displaced. Float when F_up = weight. Fraction submerged = \u03c1_obj/\u03c1_fluid. Apparent weight = mg \u2212 F_up.</p>'},
  {lb:'Floating and sinking',dr:dQ6,ht:'<p>Floats if \u03c1_obj \u2264 \u03c1_fluid. Ice in water: 917/1000 = 91.7% submerged. Ships: hollow \u2192 low average density. Submarines: vary ballast water. Hot air balloon: heated air less dense than surrounding air.</p>'},
  {lb:'Finding density by weighing in water',dr:dQ6,ht:'<p>Weight in air = mg. Weight in water = mg \u2212 \u03c1_w Vg. Difference = \u03c1_w Vg \u2192 V = difference/(\u03c1_w g). Then \u03c1 = m/V. Relative density = weight in air / (weight in air \u2212 weight in water).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['density','upthrust','fraction']);if(type==='density'){var m=rnd(100,5000),V=rnd(100,5000)/1e6,rho=parseFloat((m/V).toFixed(0));return{question:'m=<b>'+m+'kg</b>, V=<b>'+V.toExponential(2)+'m\u00b3</b>. Density?',hints:['\u03c1=m/V'],ans:rho,tol:rho*0.02,unit:'kg/m\u00b3',working:'\u03c1='+m+'/'+V.toExponential(2)+' = '+rho+' kg/m\u00b3'};}if(type==='upthrust'){var V=rnd(200,5000)/1e6,F=parseFloat((1000*V*9.81).toFixed(2));return{question:'V_sub=<b>'+V.toExponential(2)+'m\u00b3</b> in water. Upthrust?',hints:['F=\u03c1_water\u00d7V\u00d7g'],ans:F,tol:F*0.02,unit:'N',working:'F=1000\u00d7'+V.toExponential(2)+'\u00d79.81 = '+F+' N'};}var rhoObj=rnd(500,900),frac=parseFloat((rhoObj/1000).toFixed(3));return{question:'\u03c1_obj=<b>'+rhoObj+'kg/m\u00b3</b>. Fraction submerged in water?',hints:['\u03c1_obj/\u03c1_water'],ans:frac,tol:0.002,unit:'',working:rhoObj+'/1000 = '+frac};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Mechanics',ti:'Centre of Mass and Equilibrium',su:'Locate centre of mass. Apply conditions for static equilibrium.',steps:[
  {lb:'Centre of mass',dr:dQ7,ht:'<p>Centre of mass (CoM): point through which gravity effectively acts. Uniform objects: geometric centre. Irregular: balance point or suspend from two different points. System: x_CoM = \u03a3(m_i x_i)/\u03a3m_i.</p>'},
  {lb:'Equilibrium conditions',dr:dQ7,ht:'<p>Translational: \u03a3F = 0 in all directions. Rotational: \u03a3\u03c4 = 0 about any point. Principle of moments: \u03a3CW moments = \u03a3ACW moments. Both conditions required for complete equilibrium.</p>'},
  {lb:'Types of equilibrium',dr:dQ7,ht:'<p>Stable: CoM rises when displaced; restoring moment. Wide base, low CoM. Unstable: CoM falls; topples further. Neutral: CoM unchanged. Object topples when vertical through CoM falls outside base area.</p>'},
  {lb:'Couples and torques',dr:dQ7,ht:'<p>Couple: two equal, opposite, parallel forces separated by d. Torque of couple = Fd (independent of pivot). Produces rotation without translation. Examples: steering wheel, screwdriver, compass needle.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['CoM','moment','pivot']);if(type==='CoM'){var m1=rnd(1,20),x1=rnd(1,5),m2=rnd(1,20),x2=rnd(6,15),xc=parseFloat(((m1*x1+m2*x2)/(m1+m2)).toFixed(2));return{question:'m\u2081=<b>'+m1+'kg</b> at x=<b>'+x1+'m</b>, m\u2082=<b>'+m2+'kg</b> at x=<b>'+x2+'m</b>. CoM?',hints:['x=(m\u2081x\u2081+m\u2082x\u2082)/(m\u2081+m\u2082)'],ans:xc,tol:xc*0.02,unit:'m',working:'x=('+m1+'\u00d7'+x1+'+'+m2+'\u00d7'+x2+')/('+m1+'+'+m2+') = '+xc+' m'};}if(type==='moment'){var F=rnd(10,200),d=rnd(1,10)/10,tau=parseFloat((F*d).toFixed(2));return{question:'F=<b>'+F+'N</b>, perp. distance=<b>'+d.toFixed(2)+'m</b>. Moment?',hints:['\u03c4=Fd'],ans:tau,tol:tau*0.02,unit:'N m',working:'\u03c4='+F+'\u00d7'+d.toFixed(2)+' = '+tau+' N m'};}var F=rnd(20,200),d1=rnd(1,5),d2=rnd(1,3),F2=parseFloat((F*d1/d2).toFixed(1));return{question:'F\u2081=<b>'+F+'N</b> at <b>'+d1+'m</b>; balance force F\u2082 at <b>'+d2+'m</b>?',hints:['F\u2081d\u2081=F\u2082d\u2082'],ans:F2,tol:F2*0.02,unit:'N',working:'F\u2082='+F+'\u00d7'+d1+'/'+d2+' = '+F2+' N'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Mechanics',ti:'Circular Motion',su:'Apply F_c=mv\u00b2/r. Explain centripetal force and acceleration.',steps:[
  {lb:'Circular motion quantities',dr:dQ8,ht:'<div class="fm">v=\u03c9r \u2022 a_c=v\u00b2/r=\u03c9\u00b2r \u2022 F_c=mv\u00b2/r</div><p>\u03c9 = angular velocity (rad/s). T = 2\u03c0/\u03c9. f = 1/T. Centripetal acceleration directed toward centre. Centripetal force provided by: tension, gravity, normal force, friction.</p>'},
  {lb:'Examples',dr:dQ8,ht:'<p>Car on flat road: friction = mv\u00b2/r; max speed = \u221a(\u03bcgr). Satellite: GM/r\u00b2 = v\u00b2/r \u2192 v=\u221a(GM/r). Vertical circle, top: T+mg=mv\u00b2/r; min speed (T=0): v=\u221a(gr). Bottom: N\u2212mg=mv\u00b2/r.</p>'},
  {lb:'Banking',dr:dQ8,ht:'<p>Banked road at angle \u03b8: ideal speed (no friction): v=\u221a(rg tan\u03b8). Aircraft bank: tan\u03b8=v\u00b2/(rg). Conical pendulum: T sin\u03b8=m\u03c9\u00b2r; T cos\u03b8=mg.</p>'},
  {lb:'Geostationary orbit',dr:dQ8,ht:'<p>T=24 hours; above equator; same \u03c9 as Earth. r=(GMT\u00b2/4\u03c0\u00b2)^(1/3) \u224842 200 km from centre. Satellites: GMm/r\u00b2=mv\u00b2/r \u2192 v=\u221a(GM/r); lower orbit = faster.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['F_c','a_c','omega']);if(type==='F_c'){var m=rnd(1,50),v=rnd(5,25),r=rnd(5,50),F=parseFloat((m*v*v/r).toFixed(2));return{question:'m=<b>'+m+'kg</b>, v=<b>'+v+'m/s</b>, r=<b>'+r+'m</b>. F_c?',hints:['F_c=mv\u00b2/r'],ans:F,tol:F*0.02,unit:'N',working:'F='+m+'\u00d7'+v+'\u00b2/'+r+' = '+F+' N'};}if(type==='a_c'){var v=rnd(5,30),r=rnd(5,50),a=parseFloat((v*v/r).toFixed(2));return{question:'v=<b>'+v+'m/s</b>, r=<b>'+r+'m</b>. Centripetal a?',hints:['a=v\u00b2/r'],ans:a,tol:a*0.02,unit:'m/s\u00b2',working:'a='+v+'\u00b2/'+r+' = '+a+' m/s\u00b2'};}var f=rnd(1,20),omega=parseFloat((2*Math.PI*f).toFixed(2));return{question:'f=<b>'+f+' Hz</b>. Angular velocity \u03c9?',hints:['\u03c9=2\u03c0f'],ans:omega,tol:omega*0.01,unit:'rad/s',working:'\u03c9=2\u03c0\u00d7'+f+' = '+omega+' rad/s'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Mechanics',ti:'Newton\u2019s Laws Extended',su:'Apply Newton\u2019s three laws to complex situations.',steps:[
  {lb:'Newton\u2019s first law',dr:dQ9,ht:'<p>A body remains at rest or at constant velocity unless a resultant force acts. Inertia \u221d mass. Equilibrium (\u03a3F=0) does not require rest. In deep space: spacecraft coasts without thrust.</p>'},
  {lb:'Newton\u2019s second law',dr:dQ9,ht:'<div class="fm">F = ma = \u0394p/\u0394t</div><p>F = m\u0394v/\u0394t for constant mass. Variable mass: rockets, F = v_ex(dm/dt). Atwood machine: a = (m\u2081\u2212m\u2082)g/(m\u2081+m\u2082).</p>'},
  {lb:'Newton\u2019s third law',dr:dQ9,ht:'<p>Equal and opposite reaction on DIFFERENT objects. A pushes B; B pushes A. Pairs: Earth-person gravity, normal force, rocket exhaust. Normal force and weight are NOT a Newton\u2019s 3rd pair (same object).</p>'},
  {lb:'Connected systems',dr:dQ9,ht:'<p>Total force / total mass = acceleration. Then find tension from one object. Elevator: apparent weight = m(g+a) going up, m(g\u2212a) going down. Two masses on string: a = (m\u2081\u2212m\u2082)g/(m\u2081+m\u2082); T = 2m\u2081m\u2082g/(m\u2081+m\u2082).</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['F_ma','Atwood','elevator']);if(type==='F_ma'){var m=rnd(2,50),a=rnd(1,15),F=m*a;return{question:'Net force on m=<b>'+m+'kg</b> giving a=<b>'+a+'m/s\u00b2</b>?',hints:['F=ma'],ans:F,tol:0,unit:'N',working:'F='+m+'\u00d7'+a+' = '+F+' N'};}if(type==='Atwood'){var m1=rnd(3,20),m2=rnd(1,m1-1),a=parseFloat(((m1-m2)*9.81/(m1+m2)).toFixed(2));return{question:'Atwood: m\u2081=<b>'+m1+'kg</b>, m\u2082=<b>'+m2+'kg</b>. Acceleration?',hints:['a=(m\u2081-m\u2082)g/(m\u2081+m\u2082)'],ans:a,tol:a*0.02,unit:'m/s\u00b2',working:'a=('+m1+'-'+m2+')\u00d79.81/('+m1+'+'+m2+') = '+a+' m/s\u00b2'};}var m=rnd(50,120),a=rnd(1,5),Wup=parseFloat((m*(9.81+a)).toFixed(1));return{question:'m=<b>'+m+'kg</b> in lift, a=<b>'+a+'m/s\u00b2</b> up. Apparent weight?',hints:['W_app=m(g+a)'],ans:Wup,tol:Wup*0.02,unit:'N',working:'W='+m+'\u00d7(9.81+'+a+') = '+Wup+' N'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Mechanics',ti:'Mixed Mass, Weight and Time',su:'Integrated questions across all Y12-MEC-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>W=mg. p=mv. J=F\u0394t=\u0394p. KE=\u00bdmv\u00b2. GPE=mgh. F_c=mv\u00b2/r. T=2\u03c0\u221a(L/g). \u03c1=m/V. F_up=\u03c1Vg. F=ma. \u03a3moments=0.</p>'},
  {lb:'Energy conservation',dr:dQ10,ht:'<p>Conservation of energy is the most powerful tool in mechanics. KE\u21c4GPE (no friction). KE_lost=GPE_gained+W_friction. WAEC: identify initial and final states; write energy equation; solve for unknown.</p>'},
  {lb:'WAEC problem-solving',dr:dQ10,ht:'<p>Steps: (1) Draw diagram. (2) Label all forces. (3) Resolve into components. (4) Apply F=ma and/or energy conservation. (5) Check units and s.f. (6) Comment on reasonableness.</p>'},
  {lb:'Key formulae',dr:dQ10,ht:'<div class="fm">v=u+at \u2022 s=ut+\u00bdut\u00b2 \u2022 v\u00b2=u\u00b2+2as</div><div class="fm">W=mg \u2022 p=mv \u2022 KE=\u00bdmv\u00b2 \u2022 F_c=mv\u00b2/r</div>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['energy','circular','pendulum']);if(type==='energy'){var h=rnd(2,20),v=parseFloat(Math.sqrt(2*9.81*h).toFixed(2));return{question:'Falls from h=<b>'+h+'m</b>. Speed at bottom (no friction)?',hints:['mgh=\u00bdmv\u00b2; v=\u221a(2gh)'],ans:v,tol:v*0.02,unit:'m/s',working:'v=\u221a(2\u00d79.81\u00d7'+h+') = '+v+' m/s'};}if(type==='circular'){var m=rnd(1,30),v=rnd(5,25),r=rnd(5,30),F=parseFloat((m*v*v/r).toFixed(1));return{question:'m=<b>'+m+'kg</b>, v=<b>'+v+'m/s</b>, r=<b>'+r+'m</b>. F_c?',hints:['F_c=mv\u00b2/r'],ans:F,tol:F*0.02,unit:'N',working:'F='+m+'\u00d7'+v+'\u00b2/'+r+' = '+F+' N'};}var L=rnd(20,150)/100,T=parseFloat((2*Math.PI*Math.sqrt(L/9.81)).toFixed(3));return{question:'L=<b>'+L.toFixed(2)+'m</b>. Period T?',hints:['T=2\u03c0\u221a(L/g)'],ans:T,tol:T*0.01,unit:'s',working:'T=2\u03c0\u221a('+L.toFixed(2)+'/9.81) = '+T+' s'};})},
]},
];

var qi=0,si=0;
function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
