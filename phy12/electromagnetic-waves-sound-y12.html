<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}

.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}

.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'EM wave properties',ACC,13,'middle',true));
if(p>=1){o.push(R(10,36,460,42,CRM,ACC,2));o.push(T(240,54,'All EM waves: c=3\u00d710\u2078 m/s in vacuum; transverse; no medium needed',DARK,10,'middle',false));o.push(T(240,72,'v=f\u03bb; oscillating E and B fields perpendicular to each other and to travel','#555',9,'middle',false));}
if(p>=2){o.push(R(10,88,460,42,CRM,ACC,1.5));o.push(T(240,106,'Polarisation: E-field oscillates in one plane (from filter or reflection)','#333',10,'middle',false));o.push(T(240,124,'Malus\u2019 law: I=I\u2080cos\u00b2\u03b8 (transmitted intensity through polaroid at angle \u03b8)','#555',9,'middle',false));}
if(p>=3){o.push(R(10,140,460,42,CRM,ACC,1.5));o.push(T(240,158,'Radio waves: >30cm; TV/FM/AM broadcast; through buildings','#333',10,'middle',false));o.push(T(240,176,'Microwave: 1mm-30cm; satellite TV, cooking (resonance of water), radar','#555',9,'middle',false));}
if(p>=4){o.push(R(10,192,460,60,LINE,ACC,1));o.push(T(240,210,'IR: heat; TV remote; fibre optics. UV: kills bacteria; fluorescence.','#333',9,'middle',false));o.push(T(240,230,'X-ray: medical imaging; absorb in bone. Gamma: highest energy; cancer.','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Sound wave properties',ACC,12,'middle',true));
if(p>=1){o.push(R(10,36,460,42,CRM,ACC,2));o.push(T(240,54,'Longitudinal; mechanical; needs medium; compressions + rarefactions',DARK,10,'middle',false));o.push(T(240,72,'v_sound in air \u2248 340 m/s at 20\u00b0C; faster in liquids and solids','#555',9,'middle',false));}
if(p>=2){o.push(R(10,88,460,42,CRM,ACC,1.5));o.push(T(240,106,'v = \u221a(\u03b3P/\u03c1) for gas; \u221a(E/\u03c1) for solids; \u221a(B/\u03c1) for liquids','#333',10,'middle',false));o.push(T(240,124,'Temperature effect: v \u221d \u221aT; +0.6 m/s per \u00b0C in air approx.','#555',9,'middle',false));}
if(p>=3){o.push(R(10,140,460,42,CRM,ACC,1.5));o.push(T(240,158,'Intensity I = P/(4\u03c0r\u00b2); I \u221d A\u00b2; dB = 10 log(I/I\u2080)','#333',10,'middle',false));}
if(p>=4){o.push(R(10,192,460,60,LINE,ACC,1));o.push(T(240,210,'Doppler (sound): f_obs = f_s(v\u00b1v_obs)/(v\u2213v_s)','#333',10,'middle',false));o.push(T(240,230,'Beats: f_beat = |f\u2081-f\u2082|; used to tune instruments','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'EM waves and sound summary',ACC,13,'middle',true));
[['EM waves','transverse; c=3\u00d710\u2078m/s vacuum; no medium'],['Polarisation','I=I\u2080cos\u00b2\u03b8 (Malus\u2019 law)'],['Sound','longitudinal; mechanical; needs medium'],['Speed of sound','~340 m/s air; faster in liquids/solids'],['Intensity','I=P/(4\u03c0r\u00b2); I\u221dA\u00b2; dB=10log(I/I\u2080)'],['Doppler','f_obs=f_s v/(v-v_s) (approaching)'],['Beats','f_beat=|f\u2081-f\u2082|']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 EM Waves',ti:'Electromagnetic Wave Properties',su:'Describe EM wave properties. Apply Malus\u2019 law for polarisation.',steps:[
  {lb:'EM wave structure',dr:dQ1,ht:'<p>EM waves consist of oscillating electric field (E) and magnetic field (B), perpendicular to each other and to the direction of propagation. Self-sustaining: changing E field generates B field and vice versa. Speed in vacuum: c = 1/\u221a(\u03b5\u2080\u03bc\u2080) = 3\u00d710\u2078 m/s. All EM waves travel at c in vacuum regardless of frequency.</p>'},
  {lb:'Polarisation and Malus\u2019 law',dr:dQ1,ht:'<div class="fm">I = I\u2080 cos\u00b2\u03b8 (Malus\u2019 law)</div><p>Unpolarised light: E-field vibrates in all directions perpendicular to travel. Polaroid filter: transmits only one plane. Second polaroid at angle \u03b8: transmitted intensity I = I\u2080 cos\u00b2\u03b8. Two crossed polaroids (\u03b8=90\u00b0): no light. Polarised by: polaroid filter, reflection at Brewster\u2019s angle, scattering.</p>'},
  {lb:'EM spectrum uses',dr:dQ1,ht:'<p>Radio: AM (MW/LW), FM, TV broadcast, emergency services. Microwave: satellite communication, mobile phones, radar, microwave oven. IR: TV remote controls, thermal imaging, optical fibre, greenhouse effect. UV: fluorescent lamps, sunburn, sterilisation, bank note detection. X-ray: medical imaging, airport security, crystallography. Gamma: cancer therapy, food sterilisation, PET scans.</p>'},
  {lb:'Absorption and transmission',dr:dQ1,ht:'<p>Atmosphere: transparent to visible and some radio; absorbs most UV (ozone layer) and much IR (water vapour, CO\u2082). Greenhouse effect: atmosphere lets in visible; absorbs outgoing IR (re-radiated by Earth). Ozone layer: absorbs UV-B and UV-C. Glass: transparent to visible; absorbs UV and IR. Lead: absorbs X-rays and gamma.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['Malus','E_photon','wavelength']);if(type==='Malus'){var I0=rnd(10,100),th=pick([30,45,60]),I=parseFloat((I0*Math.cos(th*Math.PI/180)*Math.cos(th*Math.PI/180)).toFixed(2));return{question:'I\u2080=<b>'+I0+' W/m\u00b2</b>, polaroid at \u03b8=<b>'+th+'\u00b0</b>. Transmitted intensity?',hints:['I=I\u2080cos\u00b2\u03b8'],ans:I,tol:I*0.02,unit:'W/m\u00b2',working:'I='+I0+'\u00d7cos\u00b2('+th+'\u00b0) = '+I+' W/m\u00b2'};}if(type==='E_photon'){var lam=rnd(1,700)*1e-9,E=parseFloat((6.63e-34*3e8/lam).toExponential(2));return{question:'\u03bb=<b>'+Math.round(lam*1e9)+'nm</b>. Photon energy?',hints:['E=hc/\u03bb'],ans:parseFloat(E),tol:parseFloat(E)*0.05,unit:'J',working:'E=6.63\u00d710\u207b\u00b3\u2074\u00d73\u00d710\u2078/'+lam.toExponential(2)+' = '+E+' J'};}var f=rnd(1,1000)*1e6,lam=parseFloat((3e8/f).toFixed(3));return{question:'f=<b>'+(f/1e6).toFixed(0)+' MHz</b>. Wavelength?',hints:['\u03bb=c/f'],ans:lam,tol:lam*0.02,unit:'m',working:'\u03bb=3\u00d710\u2078/'+f.toExponential(2)+' = '+lam+' m'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 EM Waves',ti:'Speed of Sound',su:'Calculate speed of sound. Describe factors affecting it.',steps:[
  {lb:'Speed of sound',dr:dQ2,ht:'<p>v = \u221a(B/\u03c1) where B = bulk modulus (N/m\u00b2), \u03c1 = density (kg/m\u00b3). In air at 20\u00b0C: v \u2248 340 m/s. Increases with temperature: v \u2248 331 + 0.6T (T in \u00b0C). In water: ~1500 m/s. In steel: ~5000 m/s. Higher stiffness (B) or lower density \u2192 faster. Denser gases: lower speed (same T).</p>'},
  {lb:'Measuring speed of sound',dr:dQ2,ht:'<p>Echo method: d = vt/2 (sound travels to wall and back). Oscilloscope method: two microphones at known separation d; time delay \u0394t; v = d/\u0394t. Signal generator + signal and noise: trigger signal at known frequency. Gun/clap method: see flash, count seconds before sound. v = 340 m/s in air (measure more precisely in lab).</p>'},
  {lb:'Acoustic resonance',dr:dQ2,ht:'<p>Resonance tube experiment: vibrating fork over tube partially submerged in water. Raise tube until resonance (loud sound) when air column length L = \u03bb/4 (closed pipe). Then \u03bb = 4L; v = f\u03bb. Allow for end correction e: effective length = L + e. Second resonance at L = 3\u03bb/4. End correction e = r/3 approximately (r = radius).</p>'},
  {lb:'Sound in solids',dr:dQ2,ht:'<p>Sound travels much faster in solids (up to ~5000 m/s in steel) because of high Young modulus (stiffness). v_solid = \u221a(E/\u03c1). Seismic waves: P-waves (longitudinal, ~6 km/s through Earth) and S-waves (transverse, ~3.5 km/s). P-waves travel through liquid outer core; S-waves cannot \u2192 evidence for liquid core.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['v_from_fL','L_resonance','echo_distance']);if(type==='v_from_fL'){var f=rnd(200,2000),L=rnd(5,50)/100,v=parseFloat((f*4*L).toFixed(1));return{question:'Resonance tube: f=<b>'+f+'Hz</b>, L=<b>'+L.toFixed(2)+'m</b> (closed). Speed of sound?',hints:['v=f\u03bb=f\u00d74L (closed pipe)'],ans:v,tol:v*0.02,unit:'m/s',working:'v='+f+'\u00d74\u00d7'+L.toFixed(2)+' = '+v+' m/s'};}if(type==='L_resonance'){var f=rnd(200,1000),v=340,L=parseFloat((v/(4*f)).toFixed(3));return{question:'Closed pipe resonance: f=<b>'+f+'Hz</b>, v=340m/s. Length at 1st resonance?',hints:['L=v/(4f) for closed pipe'],ans:L,tol:L*0.02,unit:'m',working:'L=340/(4\u00d7'+f+') = '+L+' m'};}var t=rnd(1,10)/10,v=340,d=parseFloat((v*t/2).toFixed(1));return{question:'Echo returns after t=<b>'+t.toFixed(1)+'s</b>. Distance to wall?',hints:['d=v\u00d7t/2 (echo travels there and back)'],ans:d,tol:d*0.02,unit:'m',working:'d=340\u00d7'+t.toFixed(1)+'/2 = '+d+' m'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 EM Waves',ti:'Doppler Effect',su:'Apply the Doppler effect to sound and light.',steps:[
  {lb:'Doppler effect for sound',dr:dQ3,ht:'<div class="fm">f_obs = f_s \u00d7 (v \u00b1 v_obs)/(v \u2213 v_s)</div><p>v = speed of sound (~340 m/s). v_s = speed of source. v_obs = speed of observer. Source approaching: denominator (v - v_s) \u2192 f_obs > f_s (higher pitch). Source receding: (v + v_s) \u2192 f_obs < f_s (lower pitch). Observer approaching source: numerator (v + v_obs) \u2192 higher f.</p>'},
  {lb:'Doppler effect for EM waves',dr:dQ3,ht:'<p>Redshift/blueshift: \u0394f/f \u2248 v/c (non-relativistic). Galaxy receding at v: light redshifted (\u03bb_obs > \u03bb_emit). Hubble\u2019s law: recession speed v = H\u2080d; H\u2080 \u2248 70 km/s/Mpc. Evidence for expanding universe. Radar speed gun: microwave reflected from moving car; Doppler shift gives speed. Medical: ultrasound Doppler for blood flow speed measurement.</p>'},
  {lb:'Applications',dr:dQ3,ht:'<p>Traffic: police radar measures \u0394f to find v of vehicle. Astronomy: recession speeds from redshift; binary star detection (periodic Doppler shift). Weather: Doppler radar maps rain velocity toward/away from station. Medical: echocardiography (heart movement), blood flow (umbilical artery), fetal heart rate.</p>'},
  {lb:'Beats',dr:dQ3,ht:'<p>Beats: two slightly different frequencies superpose; resultant amplitude oscillates at beat frequency f_beat = |f\u2081 - f\u2082|. Heard as periodic variation in loudness. Uses: tuning instruments (adjust until beats disappear); detecting frequency offsets in radio. Frequency beating: human ear can detect beat frequencies up to ~15 Hz before perceiving as dissonance.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['doppler_approach','doppler_recede','beats']);if(type==='doppler_approach'){var fs=rnd(200,2000),v=340,vs=rnd(10,50),f_obs=parseFloat((fs*v/(v-vs)).toFixed(1));return{question:'Source f=<b>'+fs+'Hz</b> approaching at v_s=<b>'+vs+'m/s</b>. f_obs?',hints:['f_obs=f_s\u00d7v/(v-v_s)'],ans:f_obs,tol:f_obs*0.02,unit:'Hz',working:'f_obs='+fs+'\u00d7340/(340-'+vs+') = '+f_obs+' Hz'};}if(type==='doppler_recede'){var fs=rnd(200,2000),v=340,vs=rnd(10,50),f_obs=parseFloat((fs*v/(v+vs)).toFixed(1));return{question:'Source f=<b>'+fs+'Hz</b> receding at v_s=<b>'+vs+'m/s</b>. f_obs?',hints:['f_obs=f_s\u00d7v/(v+v_s)'],ans:f_obs,tol:f_obs*0.02,unit:'Hz',working:'f_obs='+fs+'\u00d7340/(340+'+vs+') = '+f_obs+' Hz'};}var f1=rnd(400,800),f2=f1+rnd(1,10),fb=f2-f1;return{question:'f\u2081=<b>'+f1+'Hz</b>, f\u2082=<b>'+f2+'Hz</b>. Beat frequency?',hints:['f_beat=|f\u2081-f\u2082|'],ans:fb,tol:0,unit:'Hz',working:'f_beat='+f2+'-'+f1+' = '+fb+' Hz'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 EM Waves',ti:'Intensity and Decibel Scale',su:'Calculate intensity. Use the decibel scale for sound level.',steps:[
  {lb:'Intensity',dr:dQ4,ht:'<div class="fm">I = P/(4\u03c0r\u00b2) (W/m\u00b2)</div><p>Intensity = power per unit area (W/m\u00b2). For spherical waves from point source: I = P/(4\u03c0r\u00b2). Inverse square law: I \u221d 1/r\u00b2. Intensity ratio: I\u2081/I\u2082 = (r\u2082/r\u2081)\u00b2. Also: I \u221d A\u00b2 (amplitude squared). Doubling amplitude quadruples intensity.</p>'},
  {lb:'Decibel scale',dr:dQ4,ht:'<div class="fm">L = 10 log\u2081\u2080(I/I\u2080) dB &nbsp; I\u2080=10\u207b\u00b9\u00b2 W/m\u00b2</div><p>Logarithmic scale. 0 dB = threshold of hearing (10\u207b\u00b9\u00b2 W/m\u00b2). +10 dB \u2192 intensity \u00d710. +20 dB \u2192 \u00d7100. 60 dB = conversation. 120 dB = pain threshold. 140 dB = jet engine. Extended exposure to >85 dB causes hearing damage.</p>'},
  {lb:'Adding decibels',dr:dQ4,ht:'<p>Two identical sources at same point: I doubles \u2192 +3 dB (not +6 dB!). To add dB levels: convert back to intensity, add, convert back to dB. Example: 70 dB + 70 dB = 73 dB (not 140 dB). Two sources 6m and 3m away: I ratio = (6/3)\u00b2 = 4; \u0394L = 10\u202flog(4) = 6 dB.</p>'},
  {lb:'Frequency response of ear',dr:dQ4,ht:'<p>Human ear: 20 Hz to 20 kHz. Most sensitive: ~3-4 kHz (natural resonance of ear canal). Equal loudness curves (Fletcher-Munson): at low frequencies, need much more intensity for same perceived loudness. A-weighting (dBA): filters response to match ear sensitivity. Infrasound (<20 Hz): elephants, earthquakes, wind turbines. Ultrasound (>20 kHz): bats, dolphins, medical imaging.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['I_from_P','ratio_I','dB_level']);if(type==='I_from_P'){var P=rnd(1,1000),r=rnd(1,50),I=parseFloat((P/(4*Math.PI*r*r)).toFixed(4));return{question:'P=<b>'+P+'W</b>, r=<b>'+r+'m</b>. Intensity?',hints:['I=P/(4\u03c0r\u00b2)'],ans:I,tol:I*0.03,unit:'W/m\u00b2',working:'I='+P+'/(4\u03c0\u00d7'+r+'\u00b2) = '+I+' W/m\u00b2'};}if(type==='ratio_I'){var r1=rnd(1,5),r2=rnd(6,30),ratio=parseFloat((r2*r2/(r1*r1)).toFixed(1));return{question:'r\u2081=<b>'+r1+'m</b>, r\u2082=<b>'+r2+'m</b>. I\u2081/I\u2082?',hints:['I\u221d1/r\u00b2; I\u2081/I\u2082=(r\u2082/r\u2081)\u00b2'],ans:ratio,tol:ratio*0.02,unit:'',working:'('+r2+'/'+r1+')\u00b2 = '+ratio};}var I=rnd(1,100)*1e-6,I0=1e-12,dB=parseFloat((10*Math.log10(I/I0)).toFixed(1));return{question:'I=<b>'+I.toExponential(2)+' W/m\u00b2</b>. Sound level (dB)?',hints:['L=10log(I/I\u2080); I\u2080=10\u207b\u00b9\u00b2'],ans:dB,tol:0.5,unit:'dB',working:'L=10\u00d7log('+I.toExponential(2)+'/10\u207b\u00b9\u00b2) = '+dB+' dB'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 EM Waves',ti:'Microwave and Radio Wave Technology',su:'Describe uses and properties of radio and microwave bands.',steps:[
  {lb:'Radio wave propagation',dr:dQ5,ht:'<p>Ground wave: follows Earth\u2019s curvature; low frequencies (LW/MW); range up to ~2000 km. Sky wave: reflected from ionosphere; medium/high frequencies; long range (skip distance). Space wave (line-of-sight): VHF/UHF/SHF; direct path only; limited by horizon. Relay masts and satellites extend range.</p>'},
  {lb:'Amplitude and frequency modulation',dr:dQ5,ht:'<p>AM (amplitude modulation): carrier frequency constant; amplitude varies with signal. Bandwidth ~10 kHz. Susceptible to interference (static). FM (frequency modulation): amplitude constant; frequency varies with signal. Bandwidth ~200 kHz. Better quality; less noise; shorter range. DAB (digital audio broadcasting): digital signal; more efficient; CD quality.</p>'},
  {lb:'Microwave communication',dr:dQ5,ht:'<p>Satellite communication: geostationary (35,800 km altitude, fixed position relative to Earth). GPS: 24+ satellites at 20,200 km; triangulation from timing signals. Mobile phones: 1-5 GHz (4G/5G); local base stations. Microwave oven: 2.45 GHz; resonates water molecules; penetrates food. Radar: pulsed microwave; measures time delay for distance.</p>'},
  {lb:'Digital vs analogue signals',dr:dQ5,ht:'<p>Analogue: continuous signal; noise accumulates and cannot be removed; limited range. Digital: discrete values (0 or 1); noise removed by regeneration (clean 0/1 distinction); can be processed, compressed, encrypted. Sampling rate and bit depth determine audio quality. Nyquist: sampling rate > 2 \u00d7 max signal frequency. CD: 44.1 kHz, 16 bit.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['wavelength','energy','bandwidth']);if(type==='wavelength'){var f=rnd(88,108)*1e6,lam=parseFloat((3e8/f).toFixed(2));return{question:'FM radio station at <b>'+(f/1e6).toFixed(0)+' MHz</b>. Wavelength?',hints:['\u03bb=c/f'],ans:lam,tol:lam*0.02,unit:'m',working:'\u03bb=3\u00d710\u2078/'+f.toExponential(2)+' = '+lam+' m'};}if(type==='energy'){var f=rnd(1,100)*1e9,E=parseFloat((6.63e-34*f).toExponential(2));return{question:'Microwave f=<b>'+(f/1e9).toFixed(0)+' GHz</b>. Photon energy?',hints:['E=hf'],ans:parseFloat(E),tol:parseFloat(E)*0.05,unit:'J',working:'E=6.63\u00d710\u207b\u00b3\u2074\u00d7'+f.toExponential(2)+' = '+E+' J'};}var f=rnd(88,108)*1e6,lam=parseFloat((3e8/f).toFixed(2));return{question:'Signal at f=<b>'+(f/1e6).toFixed(0)+' MHz</b>. Period T?',hints:['T=1/f'],ans:parseFloat((1/f).toExponential(2)),tol:parseFloat((1/f).toExponential(2))*0.02,unit:'s',working:'T=1/'+f.toExponential(2)+' = '+(1/f).toExponential(2)+' s'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 EM Waves',ti:'X-Rays and Gamma Rays',su:'Describe production and properties of X-rays and gamma rays.',steps:[
  {lb:'X-ray production',dr:dQ6,ht:'<p>X-ray tube: electrons accelerated through voltage V; kinetic energy gained: eV = \u00bdmv\u00b2. Electrons hit tungsten target. Two processes: (1) Bremsstrahlung (braking radiation): continuous spectrum; deceleration of electrons. (2) Characteristic radiation: discrete line spectrum; electrons knock out inner-shell electrons; outer electrons drop in; energy specific to element.</p>'},
  {lb:'X-ray properties',dr:dQ6,ht:'<p>Min wavelength (max energy): eV = hf_max = hc/\u03bb_min. So \u03bb_min = hc/(eV). Penetration: increases with photon energy (voltage). Absorbed by dense materials (bone, metal) more than soft tissue. Coherent scattering, Compton scattering, photoelectric absorption. Used: medical radiography, CT scanning, airport security, crystallography (diffraction).</p>'},
  {lb:'Gamma rays',dr:dQ6,ht:'<p>Gamma rays: high-energy photons from nuclear decay. \u03b3 = \u03bd + \u03b3 (nucleus in excited state decays). Energy: 0.1\u201310 MeV. Penetration: most penetrating of nuclear radiations; needs thick lead or concrete shielding. Uses: cancer radiotherapy (kills rapidly dividing cells), food sterilisation (bacteria killed), sterilising medical instruments (no heat needed), nuclear power generation monitoring.</p>'},
  {lb:'Radiation interactions',dr:dQ6,ht:'<p>Alpha (\u03b1): 2 protons + 2 neutrons; low penetration (few cm air, paper); highly ionising. Beta (\u03b2): high-speed electron/positron; medium penetration (few mm Al); ionising. Gamma (\u03b3): high-energy photon; most penetrating (thick lead); least ionising per unit length. Half-value thickness: thickness reducing intensity by half. T\u00bd = ln2/\u03bc.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['lambda_min','photon_E_keV','attenuation']);if(type==='lambda_min'){var V=rnd(20,200)*1e3,lam=parseFloat((6.63e-34*3e8/(1.6e-19*V)*1e10).toFixed(2));return{question:'X-ray tube V=<b>'+V/1e3+' kV</b>. Minimum wavelength?',hints:['\u03bb_min=hc/(eV)'],ans:lam,tol:lam*0.05,unit:'\u00c5 (10\u207b\u00b9\u2070m)',working:'\u03bb=6.63\u00d710\u207b\u00b3\u2074\u00d73\u00d710\u2078/(1.6\u00d710\u207b\u00b9\u2079\u00d7'+V+') = '+lam+' \u00c5'};}if(type==='photon_E_keV'){var lam=rnd(1,100)*1e-12,E=parseFloat((6.63e-34*3e8/lam/1.6e-16).toFixed(1));return{question:'\u03bb=<b>'+(lam*1e12).toFixed(0)+' pm</b>. X-ray photon energy (keV)?',hints:['E=hc/\u03bb; 1keV=1.6\u00d710\u207b\u00b9\u2076J'],ans:E,tol:E*0.05,unit:'keV',working:'E=hc/\u03bb/1.6\u00d710\u207b\u00b9\u2076 = '+E+' keV'};}var mu=rnd(1,10)/10,x=rnd(1,20),I_ratio=parseFloat(Math.exp(-mu*x).toFixed(3));return{question:'\u03bc=<b>'+mu+' cm\u207b\u00b9</b>, thickness=<b>'+x+' cm</b>. I/I\u2080?',hints:['I=I\u2080e^(-\u03bcx)'],ans:I_ratio,tol:I_ratio*0.05,unit:'',working:'I/I\u2080=e^(-'+mu+'\u00d7'+x+') = '+I_ratio};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 EM Waves',ti:'Infrared and Ultraviolet',su:'Describe properties and uses of IR and UV radiation.',steps:[
  {lb:'Infrared radiation',dr:dQ7,ht:'<p>IR: 700 nm to 1 mm; \u03bb between visible and microwave. All objects emit IR; hotter objects emit more. Absorption by: CO\u2082, H\u2082O (greenhouse effect); special IR glass (opaque to visible). Uses: night vision (thermal imaging); remote controls (900 nm); optical fibre communications (1300 nm, 1550 nm); weather satellites; cooking (grill, toaster); physiotherapy (heat lamps).</p>'},
  {lb:'Greenhouse effect',dr:dQ7,ht:'<p>Sun emits visible light (peak ~550 nm at 5778 K). Earth absorbs visible; re-emits IR (peak ~10 \u03bcm at 288 K). Greenhouse gases (CO\u2082, H\u2082O, CH\u2084): absorb and re-emit IR; trap heat. Natural greenhouse effect keeps Earth ~33\u00b0C warmer than without. Enhanced greenhouse effect: increased CO\u2082 from fossil fuels; global warming. Stefan-Boltzmann: P=\u03c3AT\u2074.</p>'},
  {lb:'Ultraviolet radiation',dr:dQ7,ht:'<p>UV: 10-400 nm (higher frequency than visible). UV-A (320-400 nm): tanning, some fluorescence; less harmful. UV-B (280-320 nm): sunburn, vitamin D synthesis; absorbed by ozone layer. UV-C (10-280 nm): most harmful; kills bacteria; almost all absorbed by ozone. Ozone depletion: CFCs; ozone hole over Antarctica. Uses: UV sterilisation, forensics (fingerprints), security (bank notes), cancer therapy.</p>'},
  {lb:'Fluorescence and phosphorescence',dr:dQ7,ht:'<p>Fluorescence: UV absorbed; visible light emitted immediately. Phosphorescence: UV absorbed; visible light emitted slowly over time (glow in the dark). Fluorescent lamp: UV from mercury vapour excites phosphor coating; emits visible. LED: electroluminescence; efficient. Applications: laundry detergent (optical brighteners), security inks, crime scene analysis (LUMALIGHT).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['E_photon_IR','E_photon_UV','Stefan_T']);if(type==='E_photon_IR'){var lam=rnd(700,3000)*1e-9,E=parseFloat((6.63e-34*3e8/lam/1.6e-19).toFixed(3));return{question:'IR \u03bb=<b>'+Math.round(lam*1e9)+' nm</b>. Photon energy (eV)?',hints:['E=hc/\u03bb; /e for eV'],ans:E,tol:E*0.05,unit:'eV',working:'E=hc/\u03bb/1.6\u00d710\u207b\u00b9\u2079 = '+E+' eV'};}if(type==='E_photon_UV'){var lam=rnd(100,400)*1e-9,E=parseFloat((6.63e-34*3e8/lam/1.6e-19).toFixed(2));return{question:'UV \u03bb=<b>'+Math.round(lam*1e9)+' nm</b>. Photon energy (eV)?',hints:['E=hc/\u03bb; /e for eV'],ans:E,tol:E*0.05,unit:'eV',working:'E=hc/\u03bb/1.6\u00d710\u207b\u00b9\u2079 = '+E+' eV'};}var T=rnd(250,350),sigma=5.67e-8,A=rnd(1,100),P=parseFloat((sigma*A*Math.pow(T,4)).toFixed(0));return{question:'\u03c3=5.67\u00d710\u207b\u2078, A=<b>'+A+' m\u00b2</b>, T=<b>'+T+' K</b>. Power radiated?',hints:['P=\u03c3AT\u2074'],ans:P,tol:P*0.05,unit:'W',working:'P=5.67\u00d710\u207b\u2078\u00d7'+A+'\u00d7'+T+'\u2074 = '+P+' W'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 EM Waves',ti:'Ultrasonics',su:'Describe ultrasound. Apply to medical imaging and distance measurement.',steps:[
  {lb:'Ultrasound properties',dr:dQ8,ht:'<p>Ultrasound: sound with frequency > 20 kHz. Medical imaging: 1-20 MHz. Speed in soft tissue: ~1500 m/s. Pulse-echo technique: transmit pulse; detect reflected pulse; time delay \u0394t; distance d = v\u0394t/2. Wavelength in tissue: \u03bb = v/f \u2248 0.1-1.5 mm at 1-15 MHz. Shorter \u03bb \u2192 better resolution; shorter range; more absorbed.</p>'},
  {lb:'Medical ultrasound imaging',dr:dQ8,ht:'<p>A-scan: amplitude vs depth (1D). B-scan: 2D slice; multiple beams swept; brightness = echo amplitude. Real-time B-scan (sonogram): fetal scanning, cardiac imaging. Doppler ultrasound: frequency shift from moving blood cells gives velocity. Advantages: no ionising radiation (safe for fetus); real-time; portable. Disadvantages: does not penetrate bone or gas; limited depth.</p>'},
  {lb:'Non-destructive testing (NDT)',dr:dQ8,ht:'<p>Ultrasound NDT: finds cracks, voids, inclusions in metals and composites. Pulse-echo: probe and receiver on same side; crack reflects pulse. Through-transmission: probe and receiver opposite sides; crack reduces transmitted pulse. Used in: aircraft fuselages, nuclear reactor components, railway tracks, oil pipelines. Better resolution with higher frequency (shorter \u03bb).</p>'},
  {lb:'Sonar and distance measurement',dr:dQ8,ht:'<p>SONAR (Sound Navigation And Ranging): acoustic equivalent of radar. Active: transmit pulse; detect echo from seabed or submarine; calculate depth/distance. Passive: listen for sounds from submarines. Speed of sound in seawater: ~1500 m/s (varies with temperature, salinity, pressure). LIDAR: similar principle with laser pulses instead of sound.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['depth_from_time','resolution','frequency']);if(type==='depth_from_time'){var v=1500,t=rnd(1,100)/10000,d=parseFloat((v*t/2).toFixed(3));return{question:'Ultrasound in tissue (v=1500m/s): echo after <b>'+t.toFixed(4)+'s</b>. Depth?',hints:['d=v\u00d7t/2'],ans:d,tol:d*0.02,unit:'m',working:'d=1500\u00d7'+t.toFixed(4)+'/2 = '+d+' m'};}if(type==='resolution'){var f=rnd(1,15)*1e6,v=1500,lam=parseFloat((v/f*1000).toFixed(2));return{question:'Ultrasound f=<b>'+f/1e6+' MHz</b>, v=1500m/s. Wavelength in tissue (mm)?',hints:['\u03bb=v/f; convert to mm'],ans:lam,tol:lam*0.02,unit:'mm',working:'\u03bb=1500/'+f.toExponential(2)+'\u00d710\u00b3 = '+lam+' mm'};}var v=340,f=rnd(20000,200000),lam=parseFloat((v/f*1000).toFixed(3));return{question:'Ultrasound f=<b>'+f+' Hz</b> in air (v=340m/s). Wavelength (mm)?',hints:['\u03bb=v/f; convert to mm'],ans:lam,tol:lam*0.03,unit:'mm',working:'\u03bb=340/'+f+'\u00d710\u00b3 = '+lam+' mm'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 EM Waves',ti:'Seismic Waves',su:'Describe P-waves and S-waves. Explain how seismology reveals Earth structure.',steps:[
  {lb:'Types of seismic waves',dr:dQ9,ht:'<p>P-waves (Primary/pressure): longitudinal; travel through solids and liquids; faster (~6 km/s in crust, up to ~13 km/s in mantle). S-waves (Secondary/shear): transverse; travel only through solids (not liquids); slower (~3.5 km/s). Surface waves (Love and Rayleigh): along Earth surface; cause most damage in earthquakes. P and S arrive at seismometer at different times; gap gives distance to epicentre.</p>'},
  {lb:'Revealing Earth\u2019s structure',dr:dQ9,ht:'<p>S-wave shadow zone: S-waves not received 103\u00b0-180\u00b0 from epicentre \u2192 outer core is liquid (S-waves cannot travel through liquid). P-wave shadow zone: P-waves refracted by core; shadow zone 103\u00b0-143\u00b0. Inner core: solid (P-waves received at 143\u00b0+ again, having travelled through it). Speed changes with depth; Snell\u2019s law applies; waves refract and curve.</p>'},
  {lb:'Locating earthquakes',dr:dQ9,ht:'<p>P and S arrive at different times: \u0394t = d(1/v_S - 1/v_P). From \u0394t: find d (distance from seismometer). Need three stations: circles of radius d\u2081, d\u2082, d\u2083; intersection = epicentre. Richter scale: logarithmic; each unit = \u00d710 in amplitude, \u00d7\u221a1000 in energy. Moment magnitude Mw is now preferred (also logarithmic).</p>'},
  {lb:'Seismic prospecting',dr:dQ9,ht:'<p>Reflection seismic: controlled explosions or vibrators send waves down; reflected waves detected at surface; time delay gives depth of rock layers. Refraction seismic: waves refracted along interfaces between layers of different speed; used for mapping bedrock, oil exploration. Acoustic impedance: Z = \u03c1v; reflection at boundary depends on impedance contrast.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['P_wave_speed','distance_PS','shadow_zone']);if(type==='P_wave_speed'){var d=rnd(100,10000),t=rnd(10,100),v=parseFloat((d/t).toFixed(1));return{question:'P-wave travels <b>'+d+' km</b> in <b>'+t+' s</b>. Speed?',hints:['v=d/t'],ans:v,tol:v*0.02,unit:'km/s',working:'v='+d+'/'+t+' = '+v+' km/s'};}if(type==='distance_PS'){var vP=6,vS=3.5,t_P=rnd(10,100),t_S=parseFloat((t_P*vP/vS).toFixed(1)),dt=parseFloat((t_S-t_P).toFixed(1)),d=parseFloat((dt*vP*vS/(vP-vS)).toFixed(0));return{question:'P arrives at t_P=<b>'+t_P+'s</b>, S at t_S=<b>'+t_S+'s</b>. Distance to epicentre?',hints:['d=\u0394t\u00d7v_P\u00d7v_S/(v_P-v_S)'],ans:d,tol:d*0.05,unit:'km',working:'d='+dt+'\u00d7'+vP+'\u00d7'+vS+'/('+vP+'-'+vS+') = '+d+' km'};}return{question:'S-waves are not detected beyond 103\u00b0 from an earthquake epicentre. What does this tell us about the outer core?',hints:['S-waves cannot travel through liquids'],ans:1,tol:0,unit:'(1=liquid, 0=solid)',working:'S-wave shadow zone proves outer core is LIQUID. Answer: 1'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 EM Waves',ti:'Mixed EM Waves and Sound',su:'Integrated questions across all Y12-WAV-03 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>EM: c=3\u00d710\u2078m/s; transverse; Malus: I=I\u2080cos\u00b2\u03b8. Sound: longitudinal; v\u2248340m/s. I=P/(4\u03c0r\u00b2); I\u221d1/r\u00b2. dB=10log(I/I\u2080). Doppler: f_obs=f_sv/(v-v_s). Beats: |f\u2081-f\u2082|. Ultrasound: d=vt/2. X-ray: \u03bb_min=hc/(eV). Wien: \u03bb_maxT=b. Stefan: P=\u03c3AT\u2074.</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC tests: wave speed (v=f\u03bb); intensity and inverse square law; Doppler (source moving toward/away); beats; echo and sonar distance calculation. Cambridge also: Malus law; X-ray minimum wavelength; blackbody radiation; EM wave applications.</p>'},
  {lb:'Key applications',dr:dQ10,ht:'<p>Radio: broadcast, GPS, radar. Microwave: satellite, mobile phones, oven. IR: remote control, fibre optics, thermal imaging. UV: sterilisation, fluorescence. X-ray: medical, security. Gamma: cancer treatment. Sound: sonar, ultrasound imaging, NDT. Seismic: earthquake detection, Earth structure.</p>'},
  {lb:'Key formulae',dr:dQ10,ht:'<div class="fm">I=P/(4\u03c0r\u00b2) \u2022 L=10log(I/I\u2080) \u2022 I=I\u2080cos\u00b2\u03b8</div><div class="fm">f_obs=f_s v/(v-v_s) \u2022 f_beat=|f\u2081-f\u2082|</div>'},
