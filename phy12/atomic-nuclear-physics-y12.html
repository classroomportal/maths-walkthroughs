<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Atomic and nuclear physics',ACC,12,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,60,'Atomic structure: \u00b9\u2082\u00b6C notation; Z=protons; A=nucleons; N=neutrons=A-Z',DARK,10,'middle',false));}
if(p>=2){o.push(R(10,92,460,40,CRM,ACC,1.5));o.push(T(240,110,'Decay: \u03b1(A-4,Z-2); \u03b2\u207b(A,Z+1); \u03b2\u207a(A,Z-1); \u03b3(no change)','#333',10,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,CRM,ACC,1.5));o.push(T(240,160,'Decay law: A=A\u2080e^(-\u03bbt); T\u00bd=ln2/\u03bb; \u03bb=decay constant','#333',10,'middle',false));}
if(p>=4){o.push(R(10,192,460,60,LINE,ACC,1));o.push(T(240,212,'E=mc\u00b2; mass defect; binding energy; fission; fusion','#333',9,'middle',false));o.push(T(240,232,'1 u = 931.5 MeV/c\u00b2; 1 u = 1.66\u00d710\u207b\u00b2\u2077 kg','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){dQ1(p);}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ1(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ1(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Nuclear physics summary',ACC,13,'middle',true));
[['Notation','\u00b9\u2082\u00b6C: A=mass no; Z=atomic no; N=A-Z'],['Alpha decay','A-4, Z-2 (\u00b2\u2074He emitted)'],['Beta- decay','A same, Z+1 (n\u2192p+e\u207b+antineutrino)'],['Decay law','A=A\u2080e^(-\u03bbt); \u03bb=ln2/T\u00bd'],['Mass-energy','E=mc\u00b2; 1u=931.5 MeV/c\u00b2'],['Binding energy','B.E.=(Zm_p+Nm_n-m_nucleus)c\u00b2'],['Fission/fusion','both release energy; mass defect\u2192energy']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Nuclear',ti:'Atomic Structure and Notation',su:'Use nuclear notation. Identify isotopes and elements.',steps:[
  {lb:'Nuclear notation',dr:dQ1,ht:'<div class="fm">\u1d2f\u1d2f\u1d2f_Z^A X</div><p>A = mass number (total nucleons = protons + neutrons). Z = atomic number (protons; defines element). N = neutrons = A - Z. Isotopes: same Z, different A (different N). Example: \u00b9H (Z=1, N=0), \u00b2H (Z=1, N=1), \u00b3H (Z=1, N=2). Carbon-12: \u00b9\u00b2C (Z=6, N=6, A=12). Carbon-14: \u00b9\u2074C (Z=6, N=8, A=14).</p>'},
  {lb:'Isotopes',dr:dQ1,ht:'<p>Isotopes: atoms of same element (same Z); different number of neutrons; different A. Chemically almost identical. Some radioactive (unstable), some stable. Radioactive isotopes: \u00b9\u00b2\u2079I (thyroid), \u2076\u2070Co (cancer therapy), \u00b9\u2074C (carbon dating), ²³⁵U (nuclear fuel), ²³⁹Pu. Stable isotopes used as tracers. Natural abundance: mixture of isotopes.</p>'},
  {lb:'Forces in nucleus',dr:dQ1,ht:'<p>Strong nuclear force: holds nucleons together; very short range (\u22482 fm); same between n-n, p-p, p-n; overcomes electrostatic repulsion between protons. Electrostatic (Coulomb) force: repels protons; long range; proportional to Z(Z-1). For large Z: electrostatic overwhelms strong force \u2192 instability \u2192 radioactivity. Band of stability: ideal N/Z ratio.</p>'},
  {lb:'Nuclear sizes',dr:dQ1,ht:'<p>Nuclear radius: r = r\u2080 A^(1/3); r\u2080 \u2248 1.2\u00d710\u207b\u00b9\u2075 m. Nucleus much smaller than atom (10\u207b\u00b9\u2074 vs 10\u207b\u00b9\u2070 m; 10,000x smaller diameter). Nuclear density \u2248 2\u00d710\u00b9\u2077 kg/m\u00b3 (constant for all nuclei). Nuclear density calculated from r = r\u2080A^(1/3) and mass m \u2248 Au. Neutron star: nuclear density throughout; 10 km radius.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['neutron_count','isotope_symbol','nuclear_r']);if(type==='neutron_count'){var Z=rnd(1,92),A=rnd(Z,Z+150),N=A-Z;return{question:'Z=<b>'+Z+'</b>, A=<b>'+A+'</b>. Number of neutrons?',hints:['N=A-Z'],ans:N,tol:0,unit:'',working:'N='+A+'-'+Z+' = '+N};}if(type==='isotope_symbol'){var Z=rnd(1,10),A=rnd(Z,Z+10),elements=['H','He','Li','Be','B','C','N','O','F','Ne'];return{question:'Element symbol: Z=<b>'+Z+'</b> (i.e. '+elements[Z-1]+'), A=<b>'+A+'</b>. Number of protons?',hints:['Z = number of protons'],ans:Z,tol:0,unit:'',working:'Atomic number Z = protons = '+Z};}var r0=1.2e-15,A=rnd(1,238),r=parseFloat((r0*Math.pow(A,1/3)*1e15).toFixed(2));return{question:'A=<b>'+A+'</b>. Nuclear radius r? (r\u2080=1.2 fm)',hints:['r=r\u2080A^(1/3); r\u2080=1.2\u00d710\u207b\u00b9\u2075m'],ans:r,tol:r*0.03,unit:'fm',working:'r=1.2\u00d7'+A+'^(1/3) = '+r+' fm'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Nuclear',ti:'Radioactive Decay',su:'Write decay equations. Identify alpha, beta and gamma.',steps:[
  {lb:'Alpha decay',dr:dQ2,ht:'<p>Alpha particle (\u03b1) = \u2074\u2082He (2 protons + 2 neutrons). Decay: \u1d2f\u1d2f\u1d2f_Z^A X \u2192 \u1d2f\u1d2f\u1d2f_{Z-2}^{A-4} Y + \u2074\u2082He. A decreases by 4; Z decreases by 2. Short range in air (~3-7 cm); stopped by paper; highly ionising. Speed ~5% c. Example: \u00b2\u00b2\u2068Ra \u2192 \u00b2\u00b2\u2074Rn + \u00b2\u00b2\u00b9Th. Occurs in heavy nuclei.</p>'},
  {lb:'Beta decay',dr:dQ2,ht:'<p>Beta-minus (\u03b2\u207b): neutron \u2192 proton + electron + antineutrino. A unchanged; Z increases by 1. Example: \u00b9\u2074C \u2192 \u00b9\u2074N + e\u207b + \u03bd\u0305. Beta-plus (\u03b2\u207a): proton \u2192 neutron + positron + neutrino. A unchanged; Z decreases by 1. Range in air ~1 m; stopped by ~3 mm Al. Neutrinos: almost no interaction with matter. Antineutrinos: detected by inverse beta decay.</p>'},
  {lb:'Gamma decay',dr:dQ2,ht:'<p>Gamma (\u03b3): high-energy photon emitted from nucleus in excited state after alpha or beta decay. A and Z unchanged. E = hf = hc/\u03bb. Energies 0.1\u201310 MeV. Very penetrating (cm of lead needed). Very weakly ionising (no charge). Used in: cancer radiotherapy, food sterilisation, PET scans. Gamma knife surgery: focused gamma rays destroy tumours.</p>'},
  {lb:'Conservation laws in decay',dr:dQ2,ht:'<p>In all nuclear reactions: (1) Mass-energy conserved. (2) Charge conserved (Z total). (3) Baryon number conserved (A total). (4) Lepton number conserved (electrons, neutrinos). (5) Momentum conserved. (6) Angular momentum conserved. Nuclear reactions: same rules. In \u03b2 decay: neutrino carries off variable energy (continuous spectrum of \u03b2 energies).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['alpha_product','beta_product','identify_radiation']);if(type==='alpha_product'){var Z=rnd(84,92),A=rnd(Z+Z+20,Z+Z+150);return{question:'\u1d2f\u1d2f_'+Z+'^'+A+'X decays by \u03b1. Z and A of product?',hints:['\u03b1 decay: A\u22124, Z\u22122'],ans:A-4,tol:0,unit:'(A of product)',working:'A_product='+A+'-4='+(A-4)+'; Z_product='+Z+'-2='+(Z-2)};}if(type==='beta_product'){var Z=rnd(1,82),A=rnd(Z+Z,Z+Z+100);return{question:'\u1d2f\u1d2f_'+Z+'^'+A+'X decays by \u03b2\u207b. Z and A of product?',hints:['\u03b2\u207b decay: A unchanged; Z+1'],ans:A,tol:0,unit:'(A of product; Z becomes '+(Z+1)+')',working:'A unchanged='+A+'; Z_product='+Z+'+1='+(Z+1)};}return{question:'Which radiation is stopped by a thin sheet of aluminium?',hints:['Al stops \u03b2; \u03b1 stopped by paper; \u03b3 needs lead/concrete'],ans:2,tol:0,unit:'(1=\u03b1, 2=\u03b2, 3=\u03b3)',working:'\u03b2 particles (electrons) are stopped by ~3mm aluminium. Answer: 2'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Nuclear',ti:'Radioactive Decay Law and Half-Life',su:'Apply A=A\u2080e^(-\u03bbt). Calculate activity and half-life.',steps:[
  {lb:'Decay law',dr:dQ3,ht:'<div class="fm">A = A\u2080 e^{-\u03bbt} &nbsp;&nbsp; N = N\u2080 e^{-\u03bbt}</div><p>A = activity (Bq = decays per second). \u03bb = decay constant (s\u207b\u00b9). N = number of undecayed nuclei. T\u00bd = half-life = ln2/\u03bb = 0.693/\u03bb. After n half-lives: A = A\u2080 \u00d7 (1/2)\u207f. Random process: cannot predict which nucleus decays next; can predict fraction decaying per unit time.</p>'},
  {lb:'Half-life',dr:dQ3,ht:'<p>T\u00bd: time for activity (or number of undecayed nuclei) to halve. T\u00bd = ln2/\u03bb. Range: microseconds (\u00b2\u00b2\u2078Ra*: 26 ns) to billions of years (\u00b2\u00b3\u2088U: 4.5\u00d710\u2079 years). Short T\u00bd: high activity, decays quickly. Long T\u00bd: low activity, persists for a long time. Technetium-99m (T\u00bd=6h): medical imaging; short enough to decay quickly, long enough for scan.</p>'},
  {lb:'Radioactive decay calculations',dr:dQ3,ht:'<p>Activity A = \u03bbN. N = m\u00d7N_A/M (m=mass, M=molar mass). After n half-lives: N = N\u2080/2\u207f. From graph: plot ln(A) vs t: gradient = \u2212\u03bb; intercept = ln(A\u2080). Carbon dating: \u00b9\u2074C T\u00bd = 5730 yr; compare \u00b9\u2074C:\u00b9\u00b2C ratio to living organism; \u2192 age. Useful up to ~50,000 years. Uranium-lead dating for older rocks.</p>'},
  {lb:'Radioactive series',dr:dQ3,ht:'<p>Natural decay series: heavy nuclei decay through chain of \u03b1 and \u03b2 decays until reaching stable isotope. Uranium series: \u00b2\u00b3\u2088U \u2192 \u00b2\u2070\u2076Pb (14 steps; 4.5 Gyr for first step). Includes radon-222 (T\u00bd=3.8 days; gas; dangerous in houses). Thorium and actinium series similar. Secular equilibrium: activity of each member equal in long-lived chains.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['A_after_t','T_half_from_lambda','N_after_n_halflives']);if(type==='A_after_t'){var A0=rnd(1000,100000),T_half=rnd(1,100),t=rnd(1,5)*T_half,lam=Math.log(2)/T_half,A=parseFloat((A0*Math.exp(-lam*t)).toFixed(0));return{question:'A\u2080=<b>'+A0+' Bq</b>, T\u00bd=<b>'+T_half+' s</b>, t=<b>'+t+' s</b>. A(t)?',hints:['A=A\u2080e^(-\u03bbt); \u03bb=ln2/T\u00bd'],ans:A,tol:A*0.05,unit:'Bq',working:'A='+A0+'\u00d7e^(-ln2/'+T_half+'\u00d7'+t+') = '+A+' Bq'};}if(type==='T_half_from_lambda'){var lam=rnd(1,100)/1000,T_half=parseFloat((Math.log(2)/lam).toFixed(1));return{question:'\u03bb=<b>'+lam+' s\u207b\u00b9</b>. Half-life T\u00bd?',hints:['T\u00bd=ln2/\u03bb=0.693/\u03bb'],ans:T_half,tol:T_half*0.02,unit:'s',working:'T\u00bd=ln2/'+lam+' = '+T_half+' s'};}var n=rnd(1,5),A0=rnd(1000,100000),A=parseFloat((A0*Math.pow(0.5,n)).toFixed(0));return{question:'A\u2080=<b>'+A0+' Bq</b>; <b>'+n+'</b> half-lives later. A?',hints:['A=A\u2080\u00d7(1/2)^n'],ans:A,tol:A*0.02,unit:'Bq',working:'A='+A0+'\u00d7(1/2)^'+n+' = '+A+' Bq'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Nuclear',ti:'Mass-Energy Equivalence',su:'Apply E=mc\u00b2. Calculate mass defect and Q-values.',steps:[
  {lb:'Mass-energy equivalence',dr:dQ4,ht:'<div class="fm">E = mc\u00b2 (J) &nbsp;&nbsp; c = 3\u00d710\u2078 m/s</div><p>Mass and energy are interchangeable. 1 u (atomic mass unit) = 1.66\u00d710\u207b\u00b2\u2077 kg. Energy equivalent: 1 u = 931.5 MeV (useful conversion). 1 MeV = 1.6\u00d710\u207b\u00b9\u00b3 J. Mass of proton: 1.00728 u = 938.3 MeV/c\u00b2. Mass of neutron: 1.00867 u. Mass of electron: 0.000549 u = 0.511 MeV/c\u00b2.</p>'},
  {lb:'Mass defect and binding energy',dr:dQ4,ht:'<p>Mass defect: nucleus weighs less than sum of its parts. \u0394m = Zm_p + Nm_n - m_nucleus. Binding energy: B.E. = \u0394m \u00d7 c\u00b2. Energy needed to completely separate nucleus into individual nucleons. Binding energy per nucleon: peaks at iron-56 (\u00b5 = 8.8 MeV). Fission (U, Pu): higher A \u2192 lighter products; \u0394B.E. positive \u2192 energy released. Fusion (H, He): lower A \u2192 heavier products; \u0394B.E. positive \u2192 energy released.</p>'},
  {lb:'Nuclear fission',dr:dQ4,ht:'<p>Fission: heavy nucleus (e.g. \u00b2\u00b3\u2075U) splits into two medium-sized nuclei (fission fragments) + 2-3 neutrons + energy (~200 MeV per fission). Neutrons can trigger further fissions: chain reaction. Critical mass: minimum mass for self-sustaining chain reaction. Nuclear reactor: controlled chain reaction; energy extracted as heat. Bomb: uncontrolled rapid chain reaction.</p>'},
  {lb:'Nuclear fusion',dr:dQ4,ht:'<p>Fusion: light nuclei combine to form heavier nucleus + energy. \u00b2H + \u00b3H \u2192 \u2074He + n + 17.6 MeV. Releases more energy per unit mass than fission. Sun: proton-proton chain; produces He from H. Requirements: very high temperature (10\u2078 K) for nuclei to overcome Coulomb repulsion (quantum tunnelling helps). Challenges: plasma confinement (tokamak/laser); energy balance; tritium supply.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['E_from_mass','BE_per_nucleon','energy_MeV']);if(type==='E_from_mass'){var dm=rnd(1,10)*1e-30,E=parseFloat((dm*9e16).toExponential(2));return{question:'\u0394m=<b>'+dm.toExponential(2)+' kg</b>. Energy E=mc\u00b2?',hints:['E=\u0394m\u00d7c\u00b2; c\u00b2=9\u00d710\u00b9\u2076 m\u00b2/s\u00b2'],ans:parseFloat(E),tol:parseFloat(E)*0.05,unit:'J',working:'E='+dm.toExponential(2)+'\u00d79\u00d710\u00b9\u2076 = '+E+' J'};}if(type==='BE_per_nucleon'){var BE=rnd(500,8800),A=rnd(1,238),be_per=parseFloat((BE/A).toFixed(2));return{question:'BE=<b>'+BE+' MeV</b>, A=<b>'+A+'</b>. BE per nucleon?',hints:['BE/nucleon=BE/A'],ans:be_per,tol:be_per*0.02,unit:'MeV/nucleon',working:'BE/nucleon='+BE+'/'+A+' = '+be_per+' MeV/nucleon'};}var dm_u=rnd(1,20)/1000,E_MeV=parseFloat((dm_u*931.5).toFixed(1));return{question:'\u0394m=<b>'+dm_u.toFixed(3)+' u</b>. Energy released (MeV)? (1u=931.5MeV/c\u00b2)',hints:['E=\u0394m\u00d7931.5 MeV per u'],ans:E_MeV,tol:E_MeV*0.02,unit:'MeV',working:'E='+dm_u.toFixed(3)+'\u00d7931.5 = '+E_MeV+' MeV'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Nuclear',ti:'Radiation Detection and Measurement',su:'Describe radiation detectors. Calculate background-corrected count rate.',steps:[
  {lb:'Radiation detectors',dr:dQ5,ht:'<p>Geiger-Muller (GM) tube: detects \u03b1, \u03b2, \u03b3; ionisation of gas \u2192 pulse; counts pulses. Cannot distinguish types. Film badge: darkening of photographic film; measures cumulative dose; used by radiation workers. Cloud chamber: supersaturated vapour; ions cause droplets; \u03b1 = thick short tracks; \u03b2 = thin curved tracks. Scintillation counter: flash of light from scintillator + PMT; very sensitive; can measure energy.</p>'},
  {lb:'Background radiation',dr:dQ5,ht:'<p>Background radiation: present everywhere from natural and artificial sources. Natural: cosmic rays (from space; increases with altitude), radon gas (\u2248 50% of dose; from rocks), food/water, rocks/soil, building materials. Artificial: medical X-rays, nuclear power stations, fallout. UK average: ~2 mSv/year. Reduce background: underground labs; lead shielding; remote locations.</p>'},
  {lb:'Radiation dose',dr:dQ5,ht:'<p>Absorbed dose: D = E/m (gray, Gy; J/kg). Equivalent dose: H = D \u00d7 W_R (sievert, Sv). Quality factor W_R: \u03b3 and \u03b2 = 1; \u03b1 = 20; neutrons = 5\u201320. Effective dose: accounts for sensitivity of organ. Annual limits: public 1 mSv; radiation workers 20 mSv. Acute effects >1 Sv; radiation sickness >2 Sv; fatal >4 Sv (50% chance). ALARA principle: as low as reasonably achievable.</p>'},
  {lb:'Corrected count rate',dr:dQ5,ht:'<p>Measured count rate = source + background. Corrected = measured \u2212 background. Background: measure with source absent, take average over long time. Statistical fluctuation: count rates vary randomly; take multiple measurements. Inverse square law for gamma: C \u221d 1/r\u00b2. Absorption: C = C\u2080 e^(-\u03bcx) where \u03bc = absorption coefficient, x = thickness.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['corrected_count','dose','inverse_sq']);if(type==='corrected_count'){var source_bg=rnd(200,5000),bg=rnd(20,200),corrected=source_bg-bg;return{question:'GM tube: source+background=<b>'+source_bg+' cpm</b>, background=<b>'+bg+' cpm</b>. Corrected count rate?',hints:['corrected = measured - background'],ans:corrected,tol:0,unit:'cpm',working:'corrected='+source_bg+'-'+bg+' = '+corrected+' cpm'};}if(type==='dose'){var D=rnd(1,50)/1000,WR=pick([1,1,20]);var H=parseFloat((D*WR).toFixed(4));return{question:'D=<b>'+D.toFixed(3)+' Gy</b>, W_R=<b>'+WR+'</b>. Equivalent dose H (Sv)?',hints:['H=D\u00d7W_R'],ans:H,tol:H*0.02,unit:'Sv',working:'H='+D.toFixed(3)+'\u00d7'+WR+' = '+H+' Sv'};}var r1=rnd(1,5),r2=rnd(6,20),C1=rnd(1000,50000),C2=parseFloat((C1*r1*r1/(r2*r2)).toFixed(0));return{question:'Gamma: C\u2081=<b>'+C1+' cpm</b> at r\u2081=<b>'+r1+'m</b>. C at r\u2082=<b>'+r2+'m</b>?',hints:['C\u221d1/r\u00b2; C\u2082=C\u2081(r\u2081/r\u2082)\u00b2'],ans:C2,tol:C2*0.03,unit:'cpm',working:'C\u2082='+C1+'\u00d7('+r1+'/'+r2+')\u00b2 = '+C2+' cpm'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Nuclear',ti:'Nuclear Reactors',su:'Describe operation of a nuclear reactor. Identify key components.',steps:[
  {lb:'Reactor operation',dr:dQ6,ht:'<p>Chain reaction in reactor: controlled by: (1) Fuel (\u00b2\u00b3\u2075U enriched to 3\u20135%); (2) Moderator: slows neutrons (thermal neutrons more likely to cause fission); graphite or light water. (3) Control rods: absorb neutrons (boron or cadmium); inserted/withdrawn to control reaction rate. (4) Coolant: carries heat away; water (PWR), CO\u2082 (Magnox), sodium (fast reactor). (5) Shielding: thick concrete + lead.</p>'},
  {lb:'Moderator and control rods',dr:dQ6,ht:'<p>Fast neutrons from fission need slowing. Moderator: collisions transfer energy to moderator nuclei. Ideal moderator: mass similar to neutron (maximum energy transfer); H\u2082O, D\u2082O, graphite. Control rods: absorb neutrons; inserted to shut down reactor; withdrawn to increase power; auto-inserted if sensor detects fault (SCRAM). Negative temperature coefficient: reactor self-regulates.</p>'},
  {lb:'Types of reactor',dr:dQ6,ht:'<p>PWR (pressurised water reactor): light water moderator AND coolant; 300\u00b0C, 155 bar; two circuits (no radioactive water in secondary). BWR: water boils in reactor; direct to turbine. Magnox: CO\u2082 cooled, graphite moderated, natural U fuel; older UK design. AGR: CO\u2082, graphite, enriched U. Fast breeder: no moderator; breeds \u00b2\u00b3\u2079Pu from \u00b2\u00b3\u2078U. SMR (small modular reactors): new development.</p>'},
  {lb:'Nuclear waste',dr:dQ6,ht:'<p>High-level waste: spent fuel; very radioactive; generates heat; needs cooling; stored in ponds initially; eventual geological disposal. Intermediate: reactor components, cladding. Low-level: gloves, tools; buried. Reprocessing: extract unused U and Pu from spent fuel; MOX fuel. Long-term storage challenge: \u00b2\u00b3\u2079Pu T\u00bd = 24,000 yr; geological time scale needed. Yucca Mountain (US), Onkalo (Finland).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['decay_energy','fission_products','moderator']);if(type==='decay_energy'){var dm_u=rnd(1,5)/1000,E=parseFloat((dm_u*931.5).toFixed(1));return{question:'\u0394m=<b>'+dm_u.toFixed(3)+' u</b>. Energy released per fission?',hints:['E=\u0394m\u00d7931.5 MeV/u'],ans:E,tol:E*0.02,unit:'MeV',working:'E='+dm_u.toFixed(3)+'\u00d7931.5 = '+E+' MeV'};}if(type==='fission_products'){return{question:'Fission of \u00b2\u00b3\u2075U. Mass number of products must sum to?',hints:['Mass number (A) conserved; A(\u00b2\u00b3\u2075U)+A(n) = total A'],ans:236,tol:0,unit:'',working:'\u00b2\u00b3\u2075U absorbs neutron \u2192 \u00b2\u00b3\u2076U \u2192 fission fragments + neutrons; A_total=235+1=236'};}return{question:'Why is a moderator needed in a thermal nuclear reactor?',hints:['Fast neutrons need slowing to cause fission more efficiently'],ans:1,tol:0,unit:'(1=correct: slows fast neutrons; 0=wrong)',working:'Moderator slows fast neutrons to thermal energies; thermal neutrons more likely to cause fission in \u00b2\u00b3\u2075U'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Nuclear',ti:'Particle Physics',su:'Describe quarks, leptons and fundamental forces.',steps:[
  {lb:'Standard model overview',dr:dQ7,ht:'<p>Matter particles (fermions): quarks (6 flavours: up, down, strange, charm, bottom, top) and leptons (6: electron, muon, tau, and their neutrinos). Antiparticles: every particle has antiparticle (same mass, opposite charge). Hadrons: made of quarks. Baryons: 3 quarks (proton, neutron). Mesons: quark-antiquark pair (\u03c0 meson). Bosons: force carriers (photon, W\u00b1, Z\u2070, gluon, graviton).</p>'},
  {lb:'Quarks and hadrons',dr:dQ7,ht:'<p>Up quark (u): charge +2/3e. Down quark (d): charge \u22121/3e. Proton: uud; charge = 2/3+2/3-1/3 = 1. Neutron: udd; charge = 2/3-1/3-1/3 = 0. Beta-minus: d \u2192 u + e\u207b + \u03bd\u0305 (down quark changes to up quark). Conservation: baryon number (quarks = +1/3; antiquarks = -1/3), charge, lepton number, strangeness (sometimes).</p>'},
  {lb:'Fundamental forces',dr:dQ7,ht:'<p>4 fundamental forces: (1) Gravity (graviton; range infinite; weakest). (2) Electromagnetism (photon; range infinite). (3) Weak nuclear (W\u00b1, Z\u2070; range ~10\u207b\u00b9\u2078 m; responsible for \u03b2 decay). (4) Strong nuclear (gluons between quarks; pions between nucleons; range ~10\u207b\u00b9\u2075 m). Unification: electroweak (1967, Glashow-Salam-Weinberg); GUT attempted; quantum gravity unsolved.</p>'},
  {lb:'Antimatter',dr:dQ7,ht:'<p>Antiparticle: same mass, opposite quantum numbers. Positron (e\u207a): antielectron. Antiproton: \u00afp. Pair production: \u03b3 \u2192 e\u207b + e\u207a (photon creates electron-positron pair; needs E > 2m_e c\u00b2 = 1.022 MeV). Annihilation: e\u207b + e\u207a \u2192 2\u03b3 (energy E = 2m_e c\u00b2 minimum). PET scanner uses positron annihilation. Matter-antimatter asymmetry: why matter dominates universe.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['quark_charge','pair_prod_E','baryon_number']);if(type==='quark_charge'){return{question:'Proton quark composition is uud. What is the total charge?',hints:['u=+2/3e; d=-1/3e; add charges'],ans:1,tol:0,unit:'e',working:'2/3+2/3+(-1/3)=3/3=1e (proton charge)'};}if(type==='pair_prod_E'){var me=9.11e-31,c=3e8,E_min=parseFloat((2*me*c*c/1.6e-13).toFixed(2));return{question:'Minimum photon energy for e\u207b+e\u207a pair production? (m_e=9.11\u00d710\u207b\u00b3\u00b9kg)',hints:['E_min=2m_ec\u00b2; convert to MeV; 1MeV=1.6\u00d710\u207b\u00b9\u00b3J'],ans:E_min,tol:E_min*0.05,unit:'MeV',working:'E_min=2\u00d79.11\u00d710\u207b\u00b3\u00b9\u00d7(3\u00d710\u2078)\u00b2/1.6\u00d710\u207b\u00b9\u00b3 = '+E_min+' MeV'};}return{question:'What is the baryon number of a neutron?',hints:['Baryons: 3 quarks; baryon number=1'],ans:1,tol:0,unit:'',working:'Neutron (udd): 3 quarks; baryon number=1'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Nuclear',ti:'Medical Applications of Nuclear Physics',su:'Describe PET scans, radiotherapy and radioactive tracers.',steps:[
  {lb:'Radioactive tracers',dr:dQ8,ht:'<p>Radioactive tracer: radioactive isotope taken up by body (same chemical as stable version). Emits detectable radiation; follows metabolic path. Requirements: T\u00bd long enough for imaging but short to limit dose; \u03b3 emitter (escapes body). Iodine-131 (T\u00bd=8d): thyroid function. Tc-99m (T\u00bd=6h): most used; bone, kidney, heart scans. Fluorine-18 (T\u00bd=110min): glucose analogue; PET scan.</p>'},
  {lb:'PET scan',dr:dQ8,ht:'<p>PET (Positron Emission Tomography): inject \u00b9\u2078F-labelled glucose. \u00b9\u2078F decays: e\u207a emitted. Positron travels ~mm, then annihilates with electron \u2192 2 \u03b3 (511 keV each, back-to-back). Coincidence detection: ring of detectors; only counts when two 511 keV \u03b3 arrive simultaneously; locates annihilation point. 3D image of metabolic activity. Used for: cancer, brain disorders, heart function.</p>'},
  {lb:'Radiotherapy',dr:dQ8,ht:'<p>External beam: X-ray, electron, or proton beam aimed at tumour. Beam rotated around patient to reduce dose to surrounding tissue; max dose at tumour. Brachytherapy: radioactive implants (seeds) inside tumour. Gamma knife: 200 focused \u03b3 beams from Co-60; destroys deep tumours. Proton therapy: sharp Bragg peak; delivers dose precisely at tumour depth. Advantage over surgery: no anaesthetic; can treat deep/inoperable tumours.</p>'},
  {lb:'Radiation safety in medicine',dr:dQ8,ht:'<p>ALARA: as low as reasonably achievable. Lead aprons and thyroid shields for X-ray workers. Radioactive waste from hospitals: short T\u00bd (Tc-99m 6h) can decay in store; long T\u00bd requires specialist disposal. Nuclear medicine dose <5 mSv typically. X-ray (chest): 0.02 mSv; CT scan: 2\u201320 mSv. Benefits must outweigh risks. Pregnancy: avoid ionising radiation; ultrasound preferred.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['PET_E','tracer_decay','dose_rem']);if(type==='PET_E'){var me=9.11e-31,c=3e8,E=parseFloat((me*c*c/1.6e-13).toFixed(3));return{question:'Positron annihilation: each \u03b3 energy (m_e=9.11\u00d710\u207b\u00b3\u00b9kg)?',hints:['E=m_ec\u00b2 per photon; 1MeV=1.6\u00d710\u207b\u00b9\u00b3J'],ans:E,tol:E*0.05,unit:'MeV',working:'E=9.11\u00d710\u207b\u00b3\u00b9\u00d7(3\u00d710\u2078)\u00b2/1.6\u00d710\u207b\u00b9\u00b3 = '+E+' MeV \u2248 0.511 MeV'};}if(type==='tracer_decay'){var T_half=6,t=rnd(6,60),n=t/T_half,A0=rnd(100,5000),A=parseFloat((A0*Math.pow(0.5,n)).toFixed(1));return{question:'Tc-99m (T\u00bd=6h): A\u2080=<b>'+A0+' MBq</b>, t=<b>'+t+'h</b>. Activity?',hints:['A=A\u2080(1/2)^n; n=t/T\u00bd'],ans:A,tol:A*0.05,unit:'MBq',working:'n='+t+'/6='+n+'; A='+A0+'\u00d7(1/2)^'+n+' = '+A+' MBq'};}var D=rnd(1,50)/1000,WR=1;return{question:'X-ray: absorbed dose D=<b>'+D.toFixed(3)+' Gy</b>, W_R=1. Equivalent dose H?',hints:['H=D\u00d7W_R'],ans:D*WR,tol:D*WR*0.01,unit:'Sv',working:'H='+D.toFixed(3)+'\u00d71 = '+D.toFixed(3)+' Sv'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Nuclear',ti:'Nuclear Applications',su:'Describe carbon dating, smoke detectors and industrial uses.',steps:[
  {lb:'Carbon dating',dr:dQ9,ht:'<p>Carbon-14 (\u00b9\u2074C): T\u00bd = 5730 yr; produced in atmosphere by cosmic ray neutrons + \u00b9\u2074N; absorbed by living organisms. At death: \u00b9\u2074C no longer taken up; decays. Compare \u00b9\u2074C:\u00b9\u00b2C ratio to known value for living organisms \u2192 age. Useful range: 500\u201350,000 yr. Calibrated using tree rings (dendrochronology). Inaccurate if: contamination, changed atmospheric \u00b9\u2074C (fossil fuel burning reduces \u00b9\u2074C).</p>'},
  {lb:'Smoke detector',dr:dQ9,ht:'<p>Smoke detector uses Am-241 (\u03b1 emitter; T\u00bd=432 yr). \u03b1 particles ionise air between electrodes; small current flows. Smoke particles absorb \u03b1 particles; ionisation reduced; current drops; alarm triggered. Ionisation type: sensitive to fast-burning (flaming) fires. Optical type: uses LED and photodetector; smoke scatters light; better for slow smouldering fires. Battery changes regularly; annual testing.</p>'},
  {lb:'Industrial applications',dr:dQ9,ht:'<p>Thickness gauging: \u03b2 particles passed through sheet; detector measures transmission; reduced by thicker material; automatic control. Pipeline inspection: \u03b3 source one side, film other; reveals cracks. Flow monitoring: add tracer to pipeline; follow with detector. Level measurement: sealed source + detector on opposite sides of tank; level controls transmission. Food irradiation: gamma kills bacteria; extends shelf life.</p>'},
  {lb:'Fusion power',dr:dQ9,ht:'<p>Current fusion research: ITER (International Thermonuclear Experimental Reactor) in France; \u00b2H + \u00b3H \u2192 \u00b2\u00b3He + n + 17.6 MeV; plasma at 10\u2078 K confined by magnetic field (tokamak). JET (UK): achieved 59 MJ in 5 seconds (2022). Challenges: tritium supply; plasma instability; energy breakeven (Q>1). Potential: near-limitless fuel (deuterium from seawater); no long-lived waste; no CO\u2082.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['C14_age','shielding','fusion_energy']);if(type==='C14_age'){var n_half=rnd(1,5),age=n_half*5730;return{question:'Remaining \u00b9\u2074C = (1/2)^<b>'+n_half+'</b> of original. Age?',hints:['After n half-lives: age=n\u00d7T\u00bd; T\u00bd=5730yr'],ans:age,tol:0,unit:'yr',working:'age='+n_half+'\u00d75730 = '+age+' yr'};}if(type==='shielding'){return{question:'Which type of nuclear radiation cannot be fully stopped by 5cm of lead?',hints:['Gamma is most penetrating; alpha stopped by paper; beta by few mm Al'],ans:3,tol:0,unit:'(1=\u03b1, 2=\u03b2, 3=\u03b3)',working:'Gamma (\u03b3) is most penetrating; 5cm lead reduces but does not eliminate it'};} var dm_u=rnd(5,20)/1000,E=parseFloat((dm_u*931.5).toFixed(1));return{question:'Fusion: \u0394m=<b>'+dm_u.toFixed(3)+' u</b>. Energy per reaction?',hints:['E=\u0394m\u00d7931.5 MeV/u'],ans:E,tol:E*0.02,unit:'MeV',working:'E='+dm_u.toFixed(3)+'\u00d7931.5 = '+E+' MeV'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Nuclear',ti:'Mixed Nuclear Physics Questions',su:'Integrated questions across all Y12-NUC-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>\u03b1 decay: A-4, Z-2. \u03b2\u207b: A same, Z+1. \u03b3: no change. A=A\u2080e^(-\u03bbt). T\u00bd=ln2/\u03bb. E=mc\u00b2. 1u=931.5 MeV/c\u00b2. Proton=uud; Neutron=udd. BE=\u0394mc\u00b2. Fission: ~200 MeV. Fusion: D+T\u219217.6 MeV. Corrected count = measured - background.</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC tests: nuclear notation (Z, A, N); decay equations (write products); half-life (A=A\u2080(1/2)^n); mass-energy (E=mc\u00b2); fission vs fusion (describe and compare); radioactivity safety; applications (smoke detector, carbon dating). Always balance charge and mass number in decay equations.</p>'},
