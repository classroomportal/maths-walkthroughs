<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Wave-particle duality',ACC,13,'middle',true));
if(p>=1){o.push(R(10,38,460,44,CRM,ACC,2));o.push(T(240,58,'Photon: E=hf=hc/\u03bb; p=h/\u03bb; E=pc (photon momentum)',DARK,10,'middle',false));o.push(T(240,76,'h=6.63\u00d710\u207b\u00b3\u2074 J s (Planck\'s constant)','#555',9,'middle',false));}
if(p>=2){o.push(R(10,92,460,40,CRM,ACC,1.5));o.push(T(240,110,'de Broglie: \u03bb=h/p=h/(mv) (matter wavelength)','#333',10,'middle',false));}
if(p>=3){o.push(R(10,142,460,40,CRM,ACC,1.5));o.push(T(240,160,'Photoelectric: hf=\u03c6+KE_max; f\u2080=\u03c6/h; V_s=KE/e','#333',10,'middle',false));}
if(p>=4){o.push(R(10,192,460,60,LINE,ACC,1));o.push(T(240,212,'Heisenberg: \u0394x\u0394p\u2265h/(4\u03c0); \u0394E\u0394t\u2265h/(4\u03c0)','#333',9,'middle',false));o.push(T(240,232,'Both wave AND particle nature needed to explain all phenomena','#555',9,'middle',false));}
s.innerHTML=o.join('');}
function dQ2(p){dQ1(p);}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ1(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ1(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Wave-particle duality summary',ACC,13,'middle',true));
[['Photon E','E=hf=hc/\u03bb; h=6.63\u00d710\u207b\u00b3\u2074 J s'],['Photon p','p=h/\u03bb=E/c'],['de Broglie','\u03bb=h/p=h/(mv) (matter wavelength)'],['Photoelectric','hf=\u03c6+KE_max; f\u2080=\u03c6/h'],['Stopping V','eV_s=KE_max'],['Bohr energy','E_n=-13.6/n\u00b2 eV (hydrogen)'],['Heisenberg','\u0394x\u0394p\u2265h/(4\u03c0); fundamental uncertainty']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Quantum',ti:'Photons and Quantisation',su:'Apply E=hf. Describe the photon model of light.',steps:[
  {lb:'Photon concept',dr:dQ1,ht:'<div class="fm">E = hf = hc/\u03bb (J)</div><p>h = 6.63\u00d710\u207b\u00b3\u2074 J s (Planck\u2019s constant). Photon: quantum (discrete packet) of electromagnetic energy. E \u221d f: higher frequency = more energetic photon. Light consists of photons; each photon has energy E = hf. Number of photons from source: N = P/(hf) per second. Photon has zero rest mass; travels at c.</p>'},
  {lb:'Evidence for photons',dr:dQ1,ht:'<p>Wave theory predicts: all frequencies should cause photoelectric effect given enough time; KE should increase with intensity. These predictions FAIL. Photon model explains: one photon interacts with one electron (instantaneous); KE = hf \u2212 \u03c6 (depends on frequency, not intensity); threshold frequency f\u2080 = \u03c6/h. Compton scattering: photon momentum p = h/\u03bb; confirmed by X-ray scattering experiments.</p>'},
  {lb:'Photon momentum',dr:dQ1,ht:'<div class="fm">p = h/\u03bb = E/c</div><p>Photon has momentum despite zero rest mass (relativistic: E = pc for massless particle). Radiation pressure: light pushes on surfaces. Solar sail: radiation pressure from sunlight. Laser cooling: photon momentum transfer slows atoms. Compton effect: photon loses momentum; \u03bb increases; X-ray wavelength shift confirms p = h/\u03bb.</p>'},
  {lb:'Quantisation of energy levels',dr:dQ1,ht:'<p>Bohr model: electrons in atoms occupy quantised energy levels. Energy of hydrogen level: E_n = \u221213.6/n\u00b2 eV. Photon emitted/absorbed when electron transitions: E_photon = E_upper \u2212 E_lower = hf. Line spectra: specific wavelengths because energy levels are discrete. Each element has unique spectrum (atomic fingerprint). Evidence: emission and absorption spectra match exactly.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['E_photon','photons_per_sec','E_level_transition']);if(type==='E_photon'){var f=rnd(1,100)*1e13,E=parseFloat((6.63e-34*f).toExponential(2));return{question:'f=<b>'+f.toExponential(2)+' Hz</b>. Photon energy?',hints:['E=hf; h=6.63\u00d710\u207b\u00b3\u2074'],ans:parseFloat(E),tol:parseFloat(E)*0.05,unit:'J',working:'E=6.63\u00d710\u207b\u00b3\u2074\u00d7'+f.toExponential(2)+' = '+E+' J'};}if(type==='photons_per_sec'){var P=rnd(1,100),f=rnd(1,100)*1e13,N=parseFloat((P/(6.63e-34*f)).toExponential(2));return{question:'P=<b>'+P+' W</b>, f=<b>'+f.toExponential(2)+' Hz</b>. Photons/sec?',hints:['N=P/(hf)'],ans:parseFloat(N),tol:parseFloat(N)*0.05,unit:'s\u207b\u00b9',working:'N='+P+'/(6.63\u00d710\u207b\u00b3\u2074\u00d7'+f.toExponential(2)+') = '+N};}var n1=rnd(2,6),n2=n1+rnd(1,3),E1=-13.6/(n1*n1),E2=-13.6/(n2*n2),dE=parseFloat((E2-E1).toFixed(3));return{question:'H atom: n=<b>'+n1+'</b> to n=<b>'+n2+'</b>. Photon energy (eV)? (E_n=-13.6/n\u00b2 eV)',hints:['E_photon=E_n2-E_n1=-13.6/n2\u00b2-(-13.6/n1\u00b2)'],ans:dE,tol:Math.abs(dE)*0.03,unit:'eV',working:'E=-13.6/'+n2+'\u00b2-(-13.6/'+n1+'\u00b2) = '+dE+' eV'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Quantum',ti:'Photoelectric Effect',su:'Apply hf=\u03c6+KE_max. Determine threshold frequency and stopping voltage.',steps:[
  {lb:'Photoelectric effect',dr:dQ2,ht:'<p>UV light on metal surface: electrons emitted (photoelectrons). Observations: (1) threshold frequency f\u2080 (no emission below); (2) emission instantaneous; (3) max KE depends on f, not intensity; (4) more photons (brighter light) \u2192 more electrons (not more KE). All explained by photon model; wave model cannot explain (1), (2) or (3).</p>'},
  {lb:'Einstein\'s photoelectric equation',dr:dQ2,ht:'<div class="fm">hf = \u03c6 + KE_{max} = \u03c6 + \u00bdmv_{max}^2</div><p>\u03c6 = work function = minimum energy to release electron = hf\u2080. KE_max = maximum kinetic energy of emitted electrons (those from surface; deeper electrons have less KE). Stopping voltage V_s: eV_s = KE_max; measure V_s to find KE_max accurately.</p>'},
  {lb:'Graphs and threshold frequency',dr:dQ2,ht:'<p>Plot KE_max vs f: straight line. Gradient = h (Planck\u2019s constant!). x-intercept = f\u2080 = \u03c6/h. y-intercept = \u2212\u03c6. Millikan\u2019s oil drop experiment (separately measured e); combined with KE_max vs f gave first precise measurement of h. Value: h = 6.626\u00d710\u207b\u00b3\u2074 J s.</p>'},
  {lb:'Work functions and applications',dr:dQ2,ht:'<p>Work function \u03c6 depends on metal: caesium (\u03c6=2.0 eV, f\u2080=4.8\u00d710\u00b9\u2074 Hz); platinum (\u03c6=5.7 eV). Lower \u03c6 metals are more sensitive (trigger with lower f light). Applications: solar cells (photovoltaic effect), digital cameras (CCD sensor), light meters, photomultiplier tubes (very sensitive detectors). Night-vision goggles use photomultiplier tubes.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['KE_max','stopping_V','threshold_f']);if(type==='KE_max'){var phi=rnd(2,6)*1.6e-19,f=rnd(6,20)*1e14,E=6.63e-34*f,KE=E-phi;if(KE<=0)KE=1e-19;KE=parseFloat(KE.toExponential(2));return{question:'f=<b>'+f.toExponential(2)+' Hz</b>, \u03c6=<b>'+phi.toExponential(2)+' J</b>. KE_max?',hints:['KE_max=hf-\u03c6'],ans:parseFloat(KE),tol:parseFloat(KE)*0.05,unit:'J',working:'KE=6.63\u00d710\u207b\u00b3\u2074\u00d7'+f.toExponential(2)+'-\u03c6 = '+KE+' J'};}if(type==='stopping_V'){var KE=rnd(1,10)*1.6e-19,e=1.6e-19,Vs=parseFloat((KE/e).toFixed(2));return{question:'KE_max=<b>'+KE.toExponential(2)+' J</b>. Stopping voltage V_s?',hints:['eV_s=KE_max; V_s=KE/e'],ans:Vs,tol:Vs*0.02,unit:'V',working:'V_s='+KE.toExponential(2)+'/1.6\u00d710\u207b\u00b9\u2079 = '+Vs+' V'};}var phi=rnd(2,6)*1.6e-19,f0=parseFloat((phi/6.63e-34).toExponential(2));return{question:'\u03c6=<b>'+phi.toExponential(2)+' J</b>. Threshold frequency f\u2080?',hints:['f\u2080=\u03c6/h; h=6.63\u00d710\u207b\u00b3\u2074'],ans:parseFloat(f0),tol:parseFloat(f0)*0.03,unit:'Hz',working:'f\u2080='+phi.toExponential(2)+'/6.63\u00d710\u207b\u00b3\u2074 = '+f0+' Hz'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Quantum',ti:'de Broglie Wavelength',su:'Calculate de Broglie wavelength. Describe electron diffraction.',steps:[
  {lb:'de Broglie hypothesis',dr:dQ3,ht:'<div class="fm">\u03bb = h/p = h/(mv)</div><p>de Broglie (1924): all matter has wave nature. \u03bb = de Broglie wavelength. h = Planck\u2019s constant. p = momentum. Prediction: electrons (and other particles) should show diffraction and interference. Confirmed by Davisson and Germer (1927): electron beam diffracted by crystal lattice; pattern matched \u03bb = h/(mv).</p>'},
  {lb:'Electron diffraction',dr:dQ3,ht:'<p>Davisson-Germer experiment: electrons at ~54 eV diffracted by nickel crystal; measured \u03bb matched de Broglie formula. GP Thomson (separately): electrons through thin gold foil; concentric rings (like X-ray diffraction); \u03bb confirmed. Both shared Nobel Prize 1937. GP Thomson\u2019s father (JJ Thomson) discovered the electron as a PARTICLE \u2014 son showed it\u2019s a WAVE.</p>'},
  {lb:'Wavelength of macroscopic objects',dr:dQ3,ht:'<p>Electron (v=10\u2076 m/s, m=9.11\u00d710\u207b\u00b3\u00b9 kg): \u03bb = h/mv \u2248 7\u00d710\u207b\u00b9\u2070 m (atomic scale; significant!). Tennis ball (m=0.06 kg, v=50 m/s): \u03bb \u2248 2\u00d710\u207b\u00b3\u2074 m (undetectably small). For macroscopic objects: quantum effects negligible. Only at atomic/subatomic scale does wave nature matter. Why classical physics works for everyday objects.</p>'},
  {lb:'Electron microscope',dr:dQ3,ht:'<p>Electron microscope: uses de Broglie wavelength of electrons (much smaller than visible light). Resolution \u221d \u03bb; electrons allow resolution ~10\u00d7 smaller than optical. TEM (transmission): electrons pass through thin sample; \u03bb \u2248 0.1\u20131 pm; atomic resolution. SEM (scanning): electrons scan surface; topography. STM (scanning tunnelling): quantum tunnelling; image individual atoms. Applications: nanotechnology, biology, materials science.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['lambda_electron','lambda_proton','KE_from_lambda']);if(type==='lambda_electron'){var v=rnd(1,100)*1e5,m=9.11e-31,h=6.63e-34,lam=parseFloat((h/(m*v)).toExponential(2));return{question:'Electron v=<b>'+v.toExponential(2)+' m/s</b>. de Broglie \u03bb?',hints:['\u03bb=h/(mv); m_e=9.11\u00d710\u207b\u00b3\u00b9kg'],ans:parseFloat(lam),tol:parseFloat(lam)*0.05,unit:'m',working:'\u03bb=6.63\u00d710\u207b\u00b3\u2074/(9.11\u00d710\u207b\u00b3\u00b9\u00d7'+v.toExponential(2)+') = '+lam+' m'};}if(type==='lambda_proton'){var v=rnd(1,100)*1e4,m=1.67e-27,h=6.63e-34,lam=parseFloat((h/(m*v)).toExponential(2));return{question:'Proton v=<b>'+v.toExponential(2)+' m/s</b>. de Broglie \u03bb?',hints:['\u03bb=h/(mv); m_p=1.67\u00d710\u207b\u00b2\u2077kg'],ans:parseFloat(lam),tol:parseFloat(lam)*0.05,unit:'m',working:'\u03bb=6.63\u00d710\u207b\u00b3\u2074/(1.67\u00d710\u207b\u00b2\u2077\u00d7'+v.toExponential(2)+') = '+lam+' m'};}var m=9.11e-31,lam=rnd(1,100)*1e-11,h=6.63e-34,v=h/(m*lam),KE=parseFloat((0.5*m*v*v/1.6e-19).toFixed(1));return{question:'Electron \u03bb=<b>'+lam.toExponential(2)+' m</b>. KE (eV)?',hints:['v=h/(m\u03bb); KE=\u00bdmv\u00b2; \u00f71.6\u00d710\u207b\u00b9\u2079 for eV'],ans:KE,tol:KE*0.05,unit:'eV',working:'v='+v.toExponential(2)+'; KE=\u00bdmv\u00b2/e = '+KE+' eV'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Quantum',ti:'Atomic Energy Levels and Spectra',su:'Apply E=hf to energy level transitions. Explain line spectra.',steps:[
  {lb:'Energy levels',dr:dQ4,ht:'<p>Electrons in atoms occupy discrete (quantised) energy levels. Ground state (n=1): lowest energy; most stable. Excited states (n=2,3,\u2026): higher energy; unstable; electron returns to lower level emitting photon. Energy levels in hydrogen: E_n = \u221213.6/n\u00b2 eV. First ionisation energy: 13.6 eV (n=1 to infinity). Negative values: bound states (energy needed to remove electron).</p>'},
  {lb:'Emission and absorption spectra',dr:dQ4,ht:'<p>Emission spectrum: hot gas glows; photons emitted when electrons drop to lower levels. Each transition: specific \u03bb. Bright lines on dark background. Absorption spectrum: cool gas in front of hot continuous source; absorbs same \u03bb; dark lines on continuous spectrum. Fraunhofer lines in sunlight: from cool outer atmosphere. Identical wavelengths in emission and absorption (same transitions).</p>'},
  {lb:'Hydrogen spectrum',dr:dQ4,ht:'<p>Lyman series: n \u2192 1; UV. Balmer series: n \u2192 2; visible (some). Paschen series: n \u2192 3; IR. Photon energy: E = \u221213.6(1/n_f\u00b2 - 1/n_i\u00b2) eV. Rydberg formula: 1/\u03bb = R_H(1/n_f\u00b2 - 1/n_i\u00b2). Bohr model: explains hydrogen perfectly; fails for multi-electron atoms. Quantum mechanics: correct general theory.</p>'},
  {lb:'Ionisation and excitation',dr:dQ4,ht:'<p>Ionisation: remove electron completely (n=1 to \u221e). Excitation: move electron to higher level (n=1 to n=2,3\u2026). Ionisation energy for hydrogen: 13.6 eV. Excitation energies: E_n - E_1. Frank-Hertz experiment: electrons fired through mercury vapour; only specific KE transferred (matching energy levels); confirms quantisation. Gas discharge tubes (neon signs): electrical excitation.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['energy_level_H','photon_lambda','ionisation_E']);if(type==='energy_level_H'){var n=rnd(1,6),E=parseFloat((-13.6/(n*n)).toFixed(3));return{question:'H atom n=<b>'+n+'</b>. Energy E_n?',hints:['E_n=-13.6/n\u00b2 eV'],ans:E,tol:Math.abs(E)*0.02,unit:'eV',working:'E_'+n+'=-13.6/'+n+'\u00b2 = '+E+' eV'};}if(type==='photon_lambda'){var n1=rnd(1,3),n2=n1+rnd(1,3),dE=13.6*(1/(n1*n1)-1/(n2*n2)),f=dE*1.6e-19/6.63e-34,lam=parseFloat((3e8/f*1e9).toFixed(0));return{question:'H: n=<b>'+n2+'</b>\u2192n=<b>'+n1+'</b>. Photon \u03bb (nm)?',hints:['E=13.6(1/n\u2081\u00b2-1/n\u2082\u00b2) eV; then \u03bb=hc/E'],ans:lam,tol:lam*0.03,unit:'nm',working:'E='+dE.toFixed(3)+'eV; \u03bb='+lam+' nm'};}var n=rnd(2,5),E_ion=parseFloat((13.6/(n*n)).toFixed(3));return{question:'H atom in state n=<b>'+n+'</b>. Ionisation energy?',hints:['E_ion=13.6/n\u00b2 eV'],ans:E_ion,tol:E_ion*0.02,unit:'eV',working:'E_ion=13.6/'+n+'\u00b2 = '+E_ion+' eV'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Quantum',ti:'Heisenberg Uncertainty Principle',su:'Apply \u0394x\u0394p \u2265 h/(4\u03c0). Explain the implications for quantum systems.',steps:[
  {lb:'Heisenberg uncertainty principle',dr:dQ5,ht:'<div class="fm">\u0394x \u0394p \u2265 h/(4\u03c0) &nbsp;&nbsp; \u0394E \u0394t \u2265 h/(4\u03c0)</div><p>\u0394x = uncertainty in position. \u0394p = uncertainty in momentum. Fundamental: not about measurement error; built into nature itself. Cannot simultaneously know both position and momentum precisely. \u0394x and \u0394p obey product \u2265 h/(4\u03c0). Increasing precision of x-measurement: increases uncertainty in p, and vice versa.</p>'},
  {lb:'Physical interpretation',dr:dQ5,ht:'<p>Wave nature of particles: localised particle = superposition of many wavelengths = range of momenta. To pin down position (narrow wavepacket): need many wavelengths = broad momentum range. Plane wave (definite momentum): extends over all space = completely undefined position. Zero-point energy: even at T=0, particle has KE (by uncertainty: \u0394x finite \u2192 \u0394p > 0).</p>'},
  {lb:'Evidence and implications',dr:dQ5,ht:'<p>Single-slit diffraction: narrow slit constrains \u0394y; particle spreads in y-momentum (\u0394p_y increases); \u2192 diffraction pattern. Width of spectral lines: excited state has finite lifetime \u0394t; \u0394E\u0394t \u2265 h/(4\u03c0); natural line width. Electron in atom cannot have zero KE (\u0394p=0 requires \u0394x=\u221e; electrons would leave atom). Size of atoms determined partly by uncertainty principle.</p>'},
  {lb:'Quantum tunnelling',dr:dQ5,ht:'<p>Classical: particle needs E > barrier height to pass. Quantum: wave function penetrates classically forbidden barrier; non-zero probability of finding particle on other side (tunnelling). Probability decreases exponentially with barrier width and height. Applications: alpha decay (tunnels out of nucleus), scanning tunnelling microscope (STM), Josephson junction, flash memory. Without tunnelling: Sun would not shine (proton-proton fusion needs tunnelling).</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['dp_from_dx','dE_from_dt','tunnel_concept']);if(type==='dp_from_dx'){var dx=rnd(1,100)*1e-10,h=6.63e-34,dp=parseFloat((h/(4*Math.PI*dx)).toExponential(2));return{question:'\u0394x=<b>'+dx.toExponential(2)+' m</b>. Minimum \u0394p?',hints:['\u0394p\u2265h/(4\u03c0\u0394x)'],ans:parseFloat(dp),tol:parseFloat(dp)*0.05,unit:'kg m/s',working:'\u0394p=6.63\u00d710\u207b\u00b3\u2074/(4\u03c0\u00d7'+dx.toExponential(2)+') = '+dp+' kg m/s'};}if(type==='dE_from_dt'){var dt=rnd(1,100)*1e-9,h=6.63e-34,dE=parseFloat((h/(4*Math.PI*dt)).toExponential(2));return{question:'\u0394t=<b>'+dt.toExponential(2)+' s</b>. Minimum \u0394E?',hints:['\u0394E\u2265h/(4\u03c0\u0394t)'],ans:parseFloat(dE),tol:parseFloat(dE)*0.05,unit:'J',working:'\u0394E=6.63\u00d710\u207b\u00b3\u2074/(4\u03c0\u00d7'+dt.toExponential(2)+') = '+dE+' J'};}return{question:'Why can an alpha particle escape a nucleus despite not having enough energy classically?',hints:['Quantum tunnelling: wave function extends through potential barrier'],ans:1,tol:0,unit:'(1=tunnelling; 0=wrong)',working:'Quantum tunnelling: \u03b1 particle has non-zero probability of existing on other side of nuclear potential barrier. Answer: 1'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Quantum',ti:'Wave-Particle Duality: Evidence',su:'Summarise evidence for dual nature of light and matter.',steps:[
  {lb:'Evidence for wave nature of light',dr:dQ6,ht:'<p>Young\u2019s double-slit (1801): interference fringes prove wave nature. Diffraction: bends around obstacles (\u03bb comparable to gap). Polarisation: transverse wave. Reflection, refraction: explained by wave model. EM wave theory (Maxwell 1865): light as oscillating E and B fields. Speed of light = 1/\u221a(\u03b5\u2080\u03bc\u2080): predicted from electromagnetic constants.</p>'},
  {lb:'Evidence for particle nature of light',dr:dQ6,ht:'<p>Photoelectric effect (1905, Einstein): requires photon model; wave model fails. Compton effect (1922): X-ray photon scatters off electron; wavelength increases; momentum transfer proves photon momentum p = h/\u03bb. Pair production: single photon \u2192 electron + positron (particle-like creation). Photon counting: individual clicks in detector (particle-like). Discrete absorption in atoms: proves photons.</p>'},
  {lb:'Evidence for wave nature of matter',dr:dQ6,ht:'<p>Davisson-Germer (1927): electron beam diffracted by Ni crystal. G.P. Thomson: electron diffraction through gold foil; concentric rings. Neutron diffraction: neutrons diffracted by crystal; used to determine crystal structures. Atom diffraction: whole atoms show diffraction. Double-slit with electrons: one-at-a-time; still forms interference pattern (each electron goes through both slits). Electron microscope: uses matter wavelength for imaging.</p>'},
  {lb:'The Copenhagen interpretation',dr:dQ6,ht:'<p>Wave function \u03c8: describes probability distribution of particle. |\u03c8|\u00b2 = probability density. Collapse on measurement: definite result found. Before measurement: particle in superposition of states (both slits). Complementarity (Bohr): wave and particle are complementary descriptions; cannot simultaneously observe both properties. Measurement disturbs system irreversibly. Debates continue: many-worlds, pilot wave, decoherence interpretations.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['photon_E_ev','de_broglie','which_evidence']);if(type==='photon_E_ev'){var lam=rnd(100,700)*1e-9,E=parseFloat((6.63e-34*3e8/lam/1.6e-19).toFixed(2));return{question:'\u03bb=<b>'+Math.round(lam*1e9)+' nm</b>. Photon energy (eV)?',hints:['E=hc/\u03bb; /e for eV; h=6.63\u00d710\u207b\u00b3\u2074; c=3\u00d710\u2078'],ans:E,tol:E*0.03,unit:'eV',working:'E=hc/\u03bb/1.6\u00d710\u207b\u00b9\u2079 = '+E+' eV'};}if(type==='de_broglie'){var m=9.11e-31,v=rnd(1,50)*1e6,lam=parseFloat((6.63e-34/(m*v)).toExponential(2));return{question:'Electron v=<b>'+v.toExponential(2)+' m/s</b>. de Broglie \u03bb?',hints:['\u03bb=h/(mv); m=9.11\u00d710\u207b\u00b3\u00b9kg'],ans:parseFloat(lam),tol:parseFloat(lam)*0.05,unit:'m',working:'\u03bb=6.63\u00d710\u207b\u00b3\u2074/(9.11\u00d710\u207b\u00b3\u00b9\u00d7'+v.toExponential(2)+') = '+lam+' m'};}return{question:'Compton scattering proves photon has what property? (hint: p=h/\u03bb)',hints:['Photon has momentum p=h/\u03bb even though massless'],ans:1,tol:0,unit:'(1=momentum; 0=wrong)',working:'Compton scattering: photon momentum transferred to electron; proves p=h/\u03bb. Answer: 1'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Quantum',ti:'Applications of Quantum Physics',su:'Describe LEDs, lasers, and semiconductor applications.',steps:[
  {lb:'Light-emitting diode (LED)',dr:dQ7,ht:'<p>LED: p-n junction; electrons recombine with holes at junction; photon emitted with energy E = hf = E_gap. Colour: E_gap determines f and therefore colour. Blue LED: large E_gap (\u2248 2.7 eV; \u03bb \u2248 460 nm); difficult to make (1990s; Nobel Prize 2014). White LED: blue LED + phosphor; or RGB LEDs. Advantages over bulb: 90% less energy; longer life; no mercury (vs fluorescent). Applications: lighting, screens, fibre optic comms.</p>'},
  {lb:'Lasers',dr:dQ7,ht:'<p>LASER = Light Amplification by Stimulated Emission of Radiation. Stimulated emission: incoming photon triggers electron to emit second identical photon. Population inversion: more atoms in excited than ground state (pumping). Optical cavity: mirrors; photons bounce back and forth; amplified. Coherent, monochromatic, collimated. Types: gas (He-Ne, CO\u2082), solid state (Nd:YAG), semiconductor (diode laser), excimer. Applications: communications, surgery, manufacturing, measurement.</p>'},
  {lb:'Photodiodes and solar cells',dr:dQ7,ht:'<p>Photodiode: photon absorbed at p-n junction; creates electron-hole pair; current flows if circuit connected. Reverse-biased: sensitive to light intensity. Applications: optical communications, remote controls, barcode scanners, smoke detectors. Solar cell: photovoltaic; photons generate current directly; multiple cells in panel. Efficiency limited by: spectrum mismatch, recombination, resistance. Silicon efficiency \u224820%; GaAs \u224825%; multi-junction \u224845%.</p>'},
  {lb:'Quantum computing',dr:dQ7,ht:'<p>Qubit: quantum bit; can be 0 and 1 simultaneously (superposition). Entanglement: two qubits correlated regardless of distance. Quantum parallelism: compute on all states simultaneously. Useful for: factoring large numbers (Shor\u2019s algorithm; breaks encryption), searching databases (Grover\u2019s), simulation of quantum systems (chemistry, materials). Current state: noisy intermediate-scale quantum (NISQ) devices; ~100 qubits; not yet fault-tolerant. IBM, Google, IonQ, D-Wave leading.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['LED_wavelength','LED_energy','solar_power']);if(type==='LED_wavelength'){var E_gap=rnd(15,35)/10,lam=parseFloat((6.63e-34*3e8/(E_gap*1.6e-19)*1e9).toFixed(0));return{question:'LED E_gap=<b>'+E_gap.toFixed(1)+' eV</b>. Wavelength of emitted light?',hints:['\u03bb=hc/E; E=E_gap\u00d71.6\u00d710\u207b\u00b9\u2079 J'],ans:lam,tol:lam*0.03,unit:'nm',working:'\u03bb=hc/(E_gap\u00d7e) = '+lam+' nm'};}if(type==='LED_energy'){var lam=rnd(400,700)*1e-9,E=parseFloat((6.63e-34*3e8/lam/1.6e-19).toFixed(2));return{question:'LED \u03bb=<b>'+Math.round(lam*1e9)+' nm</b>. Band gap energy (eV)?',hints:['E=hc/\u03bb; /e for eV'],ans:E,tol:E*0.03,unit:'eV',working:'E=hc/\u03bb/1.6\u00d710\u207b\u00b9\u2079 = '+E+' eV'};}var P_incident=rnd(100,1000),eta=rnd(15,25)/100,P_out=parseFloat((P_incident*eta).toFixed(1));return{question:'Solar panel: P_incident=<b>'+P_incident+'W/m\u00b2</b>, efficiency=<b>'+Math.round(eta*100)+'%</b>, area=1m\u00b2. Output power?',hints:['P_out=P_incident\u00d7\u03b7\u00d7A'],ans:P_out,tol:P_out*0.02,unit:'W',working:'P_out='+P_incident+'\u00d7'+eta+' = '+P_out+' W'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Quantum',ti:'Quantum Tunnelling',su:'Describe and calculate probability of quantum tunnelling.',steps:[
  {lb:'Tunnelling concept',dr:dQ8,ht:'<p>Classical: particle at lower energy than barrier cannot pass through it. Quantum: wave function does not go to zero at barrier; decays exponentially inside; non-zero on other side; finite probability of tunnelling through. Transmission probability T \u221d e^(-2kL) where L = barrier width, k depends on (V-E). Thinner barrier \u2192 more tunnelling. Lighter particle \u2192 more tunnelling (larger de Broglie \u03bb).</p>'},
  {lb:'Alpha decay by tunnelling',dr:dQ8,ht:'<p>Alpha particle forms in nucleus; nuclear potential energy well. Outside nucleus: electrostatic repulsion from protons. Classically: not enough energy to escape. Quantum: wave function tunnels through the Coulomb barrier. T \u221d e^(-G) where G = Gamow factor. High-energy alphas: tunnels faster; shorter T\u00bd. Low-energy alphas: slower tunnelling; longer T\u00bd. Geiger-Nuttall law: log(T\u00bd) inversely proportional to \u221aE_\u03b1.</p>'},
  {lb:'Scanning tunnelling microscope (STM)',dr:dQ8,ht:'<p>STM: sharp metal tip brought very close to surface (~0.5 nm). Voltage applied; electrons tunnel across gap. Tunnelling current I \u221d e^(-kd) very sensitive to distance d. Feedback: maintain constant current by adjusting tip height; maps surface topography at atomic resolution. Room temperature operation possible. Invented 1981 (Binnig & Rohrer; Nobel 1986). Can image AND move individual atoms.</p>'},
  {lb:'Nuclear fusion and tunnelling',dr:dQ8,ht:'<p>Proton-proton fusion in Sun: temperature ~1.5\u00d710\u2077 K; thermal KE far below Coulomb barrier. Classical: fusion impossible. Quantum tunnelling: small but non-zero probability; \u00d7 enormous number of protons = significant rate. Gamow peak: narrow energy range where combination of Boltzmann factor and tunnelling probability is maximum. Sun would stop shining without quantum tunnelling.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['tunnel_concept','STM_current','alpha_energy']);if(type==='tunnel_concept'){return{question:'In quantum tunnelling, what happens to the probability as barrier width increases?',hints:['T\u221de^(-2kL); wider barrier: lower T'],ans:0,tol:0,unit:'(1=increases; 0=decreases)',working:'Transmission probability T \u221d e^(-2kL): increases exponentially as L decreases. Answer: 0 (decreases)'};} if(type==='STM_current'){return{question:'STM: tip 1nm from surface current 1nA. At 0.8nm, by roughly what factor does current change?',hints:['I\u221de^(-kd); exponentially sensitive to d'],ans:7,tol:5,unit:'times larger',working:'I \u221d e^(-kd); roughly doubles per 0.1nm decrease; 0.2nm \u2248 4x; approx 7x increase'};} var E=rnd(40,80)/10,logT_half=parseFloat((-10/E).toFixed(1));return{question:'Higher E_\u03b1 means shorter or longer T\u00bd?',hints:['Higher E\u2192less tunnelling suppression\u2192faster decay\u2192shorter T\u00bd'],ans:1,tol:0,unit:'(1=shorter; 2=longer)',working:'Higher E_\u03b1 \u2192 less Gamow suppression \u2192 shorter half-life. Answer: 1'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Quantum',ti:'The Compton Effect',su:'Apply Compton scattering formula. Explain X-ray wavelength shift.',steps:[
  {lb:'Compton scattering',dr:dQ9,ht:'<p>Compton (1922): X-rays scattered by electrons; scattered \u03bb longer than incident \u03bb. Classical: scattered frequency should equal incident frequency (wave model). Compton explained using photon model: photon collides elastically with electron; transfers some momentum; photon loses energy; \u03bb increases. Proved photon momentum p = h/\u03bb. Nobel Prize 1927.</p>'},
  {lb:'Compton formula',dr:dQ9,ht:'<div class="fm">\u0394\u03bb = \u03bb\u2019 - \u03bb = (h/m_e c)(1 - cos\u03b8)</div><p>h/m_e c = Compton wavelength = 2.43\u00d710\u207b\u00b9\u00b2 m. \u03b8 = scattering angle (angle between incident and scattered photon). \u0394\u03bb depends only on \u03b8; not on initial wavelength or photon energy. At \u03b8=90\u00b0: \u0394\u03bb = h/(m_ec). At \u03b8=180\u00b0 (back-scatter): max \u0394\u03bb = 2h/(m_ec) = 4.86\u00d710\u207b\u00b9\u00b2 m.</p>'},
  {lb:'Pair production revisited',dr:dQ9,ht:'<p>Pair production: high-energy photon \u2192 electron + positron. Requires E_photon \u2265 2m_e c\u00b2 = 1.022 MeV. Momentum conserved: must occur near nucleus (nucleus absorbs recoil momentum). Pair annihilation: e\u207b + e\u207a \u2192 2\u03b3 (each 511 keV); back-to-back. PET scan uses this. Photon-photon scattering: rare; requires very high energy photons (laser collider experiments).</p>'},
  {lb:'X-ray production and the Compton effect',dr:dQ9,ht:'<p>X-ray production: electrons accelerated through V hit target. Min wavelength: \u03bb_min = hc/(eV). Continuous (Bremsstrahlung) spectrum + characteristic lines (element-specific). Compton scattering: incident X-ray beam scattered by electrons; some photons lose energy (Compton scattered, longer \u03bb); some barely disturbed (coherent scattered, same \u03bb). Both seen in scattered beam.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['Compton_delta_lambda','pair_prod_min_E','Xray_lambda_min']);if(type==='Compton_delta_lambda'){var theta=pick([0,45,90,135,180]),cosT=Math.cos(theta*Math.PI/180),dl=parseFloat((2.43e-12*(1-cosT)*1e12).toFixed(2));return{question:'\u03b8=<b>'+theta+'\u00b0</b>. Compton wavelength shift \u0394\u03bb?',hints:['\u0394\u03bb=(h/m_ec)(1-cos\u03b8); h/m_ec=2.43\u00d710\u207b\u00b9\u00b2m'],ans:dl,tol:dl*0.05,unit:'pm',working:'\u0394\u03bb=2.43\u00d7(1-cos'+theta+'\u00b0) = '+dl+' pm'};}if(type==='pair_prod_min_E'){var me=9.11e-31,c=3e8,E=parseFloat((2*me*c*c/1.6e-13).toFixed(3));return{question:'Minimum photon energy for pair production?',hints:['E_min=2m_ec\u00b2; 1MeV=1.6\u00d710\u207b\u00b9\u00b3J'],ans:E,tol:E*0.05,unit:'MeV',working:'E=2\u00d79.11\u00d710\u207b\u00b3\u00b9\u00d7(3\u00d710\u2078)\u00b2/1.6\u00d710\u207b\u00b9\u00b3 = '+E+' MeV \u22481.022 MeV'};}var V=rnd(20,200)*1e3,lam=parseFloat((6.63e-34*3e8/(1.6e-19*V)*1e10).toFixed(2));return{question:'X-ray tube V=<b>'+V/1e3+' kV</b>. \u03bb_min?',hints:['\u03bb_min=hc/(eV)'],ans:lam,tol:lam*0.05,unit:'\u00c5',working:'\u03bb_min=hc/(eV) = '+lam+' \u00c5'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Quantum',ti:'Mixed Quantum Physics Questions',su:'Integrated questions across all Y12-NUC-02 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>E=hf=hc/\u03bb. p=h/\u03bb (photon). \u03bb=h/(mv) (de Broglie). hf=\u03c6+KE_max. eV_s=KE_max. f\u2080=\u03c6/h. E_n=-13.6/n\u00b2 eV (H). \u0394x\u0394p\u2265h/(4\u03c0). \u0394\u03bb=h/(m_ec)(1-cos\u03b8). LED: E=hf=E_gap. Tunnelling: T\u221de^(-kL). h=6.63\u00d710\u207b\u00b3\u2074 J s.</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC tests: photoelectric effect (E=hf; threshold; stopping voltage); de Broglie wavelength; energy levels and spectra; quantum numbers. Cambridge also: Heisenberg uncertainty; Compton effect; wave-particle duality evidence; tunnelling; LED band gap.</p>'},
  {lb:'Key links',dr:dQ10,ht:'<p>Planck constant h connects all quantum physics. Photons: E=hf=hc/\u03bb. Matter waves: \u03bb=h/p. Spectra: E=hf from energy level differences. Uncertainty: \u0394x\u0394p\u2265h/(4\u03c0). All involve h. Duality: light (waves=interference; particles=photoelectric). Matter (particles=tracks; waves=diffraction). Both descriptions needed.</p>'},

var qi=0,si=0;
function bSB(){var sb=document.getElementById('sb');var lbl=sb.querySelector('.sb-lbl');sb.innerHTML='';sb.appendChild(lbl);QS.forEach(function(q,i){var b=document.createElement('button');b.className='qb'+(i===qi?' on':'');b.innerHTML='<span class="qn">Q'+(i+1)+'</span>'+q.ti;b.onclick=function(){qi=i;si=0;render();};sb.appendChild(b);});}
function bDT(){var w=document.getElementById('dt');w.innerHTML='';QS[qi].steps.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===si?' on':i<si?' dn':'');w.appendChild(d);});}
function render(){bSB();var q=QS[qi],st=q.steps[si];document.getElementById('ey').innerHTML=q.ey;document.getElementById('ti').textContent=q.ti;document.getElementById('su').textContent=q.su;var p=document.getElementById('pn');p.classList.remove('fi');void p.offsetWidth;p.classList.add('fi');p.innerHTML='<div class="sl">'+st.lb+'</div>'+st.ht;st.dr(si);bDT();document.getElementById('pb').disabled=si===0;document.getElementById('nb').textContent=si===q.steps.length-1?'Restart':'Next';}
document.getElementById('pb').addEventListener('click',function(){if(si>0){si--;render();}});
document.getElementById('nb').addEventListener('click',function(){var q=QS[qi];si=si===q.steps.length-1?0:si+1;render();});
// Lesson links: ?only=2,5 shows just those questions (as ticked in Lesson Mapping); ?q=N opens question N
(function(){var p=new URLSearchParams(location.search),total=QS.length;var only=(p.get('only')||'').split(',').map(Number).filter(function(n){return n>=1&&n<=total;});window.abcQuestionNumbers=null;if(only.length){var nums=[],keep=[];QS.forEach(function(x,i){if(only.indexOf(i+1)>=0){nums.push(i+1);keep.push(x);}});QS.length=0;keep.forEach(function(x){QS.push(x);});window.abcQuestionNumbers=nums;var lbl=document.querySelector('#sb .sb-lbl');if(lbl){lbl.innerHTML='This lesson: '+nums.length+' of '+total+' questions &middot; <a href="'+location.pathname+'" style="color:inherit">show all</a>';}}var q=parseInt(p.get('q'),10);if(q>=1){var idx=window.abcQuestionNumbers?window.abcQuestionNumbers.indexOf(q):q-1;if(idx>=0&&idx<QS.length)qi=idx;}})();
// Keep each question's real number in the sidebar when only some are shown
if(window.abcQuestionNumbers){var _renderAll=render;render=function(){_renderAll.apply(this,arguments);var n=window.abcQuestionNumbers;document.querySelectorAll('#sb .qn').forEach(function(el,i){if(n[i])el.textContent='Q'+n[i];});};}

(function(){var seen={},done=false,_render=render;function save(tries){var sb=window._supabase;if(!sb||!window._abcTopicCode)return;sb.rpc('mark_walkthrough_complete',{p_topic_code:window._abcTopicCode}).then(function(r){if(r&&r.error){if(tries>0)setTimeout(function(){save(tries-1);},8000);else done=false;return;}var b=document.getElementById('abc-complete-btn'),d=document.getElementById('abc-complete-done'),l=document.getElementById('abc-dashboard-link');if(b)b.style.display='none';if(d)d.style.display='block';if(l)l.style.display='inline';var t=document.createElement('div');t.textContent='\u2713 Saved as completed';t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 16px;border-radius:20px;font:600 14px sans-serif;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body.appendChild(t);setTimeout(function(){t.remove();},4000);},function(){done=false;});}render=function(){_render.apply(this,arguments);try{if(done||!QS[qi]||si!==QS[qi].steps.length-1)return;seen[qi]=1;if(Object.keys(seen).length<QS.length)return;done=true;setTimeout(function(){save(1);},5000);}catch(e){}};})();
render();
