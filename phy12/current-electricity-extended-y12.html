<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Electric circuit quantities',ACC,13,'middle',true));
[['Quantity','Symbol','Unit','Formula'],['Current','I','A (ampere)','I=\u0394Q/\u0394t'],['Charge','Q','C (coulomb)','Q=It'],['Voltage (p.d.)','V','V (volt)','V=W/Q'],['Resistance','R','\u03a9 (ohm)','R=V/I'],['EMF','\u03b5','V','energy per unit charge'],['Power','P','W (watt)','P=IV=V\u00b2/R=I\u00b2R']].forEach(function(r,i){if(i<=p){o.push(R(10,26+i*32,460,26,i===0?LINE:CRM,i===0?ACC:LINE,0.5));r.forEach(function(v,j){o.push(T(18+j*112,44+i*32,v,i===0?ACC:'#333',i===0?8:8,'start',i===0));});}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Series and parallel circuits',ACC,12,'middle',true));
o.push(R(10,36,222,210,CRM,ACC,2));o.push(T(121,54,'SERIES',ACC,11,'middle',true));
o.push(R(248,36,222,210,CRM,ACC,2));o.push(T(359,54,'PARALLEL',ACC,11,'middle',true));
['I same throughout','V splits: \u03a3V=\u03b5','R_T=R\u2081+R\u2082+\u2026','No junction rule needed','One path only'].forEach(function(v,i){if(i<p+1)o.push(T(121,74+i*28,v,'#333',8,'middle',false));});
['V same across each','I splits: \u03a3I=I_T','1/R_T=1/R\u2081+1/R\u2082+\u2026','Kirchhoff junction rule','Multiple paths'].forEach(function(v,i){if(i<p+1)o.push(T(359,74+i*28,v,'#333',8,'middle',false));});
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Current electricity summary',ACC,13,'middle',true));
[['Ohm\'s law','V=IR; R constant at constant T'],['Series R','R_T=R\u2081+R\u2082; same I; V splits'],['Parallel R','1/R_T=1/R\u2081+1/R\u2082; same V; I splits'],['Power','P=IV=I\u00b2R=V\u00b2/R'],['KVL','\u03a3V=0 around any loop'],['KCL','\u03a3I_in=\u03a3I_out at junction'],['EMF','\u03b5=V+Ir; V=terminal voltage']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Electricity',ti:'Current, Charge and Potential Difference',su:'Apply V=IR, Q=It, P=IV.',steps:[
  {lb:'Current and charge',dr:dQ1,ht:'<div class="fm">I = \u0394Q/\u0394t (A) &nbsp;&nbsp; Q = It (C)</div><p>Current I = rate of flow of charge. 1 ampere = 1 coulomb per second. Charge of electron e = 1.6\u00d710\u207b\u00b9\u2079 C. Number of electrons: n = Q/e. Conventional current: direction positive charges would flow (opposite to electron flow). Current in metals: free electron flow.</p>'},
  {lb:'Potential difference and EMF',dr:dQ1,ht:'<div class="fm">V = W/Q (volt) &nbsp;&nbsp; \u03b5 = W/Q (source)</div><p>Potential difference V = energy transferred per unit charge between two points. Volt = joule per coulomb. EMF (\u03b5): energy supplied per unit charge by a source (battery, generator). Terminal voltage V = \u03b5 \u2212 Ir where r = internal resistance. V < \u03b5 when current flows.</p>'},
  {lb:'Resistance and Ohm\'s law',dr:dQ1,ht:'<div class="fm">V = IR &nbsp;&nbsp; R = V/I (\u03a9)</div><p>Ohm\u2019s law: V \u221d I at constant temperature and physical conditions. Ohmic conductor: straight line through origin on V-I graph. Non-ohmic: bulb filament (resistance increases with T), diode (conducts one way), thermistor (R decreases with T), LDR (R decreases with light).</p>'},
  {lb:'Power and energy',dr:dQ1,ht:'<div class="fm">P = IV = I\u00b2R = V\u00b2/R (W) &nbsp;&nbsp; E = Pt (J)</div><p>Power = rate of energy transfer. Energy E = Pt = IVt = I\u00b2Rt = V\u00b2t/R. Unit: joule (J) or kilowatt-hour (kWh). 1 kWh = 3.6\u00d710\u2076 J. Electricity cost: cost = P(kW) \u00d7 t(h) \u00d7 price per kWh. WAEC: always identify which form of P=IV to use depending on what is given.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['V_IR','P_IV','Q_It']);if(type==='V_IR'){var I=rnd(1,20),R=rnd(10,200),V=I*R;return{question:'I=<b>'+I+'A</b>, R=<b>'+R+'\u03a9</b>. Voltage V?',hints:['V=IR'],ans:V,tol:0,unit:'V',working:'V='+I+'\u00d7'+R+' = '+V+' V'};}if(type==='P_IV'){var I=rnd(1,20),V=rnd(10,240),P=I*V;return{question:'I=<b>'+I+'A</b>, V=<b>'+V+'V</b>. Power P?',hints:['P=IV'],ans:P,tol:0,unit:'W',working:'P='+I+'\u00d7'+V+' = '+P+' W'};}var I=rnd(1,20),t=rnd(10,3600),Q=I*t;return{question:'I=<b>'+I+'A</b> for <b>'+t+'s</b>. Charge Q?',hints:['Q=It'],ans:Q,tol:0,unit:'C',working:'Q='+I+'\u00d7'+t+' = '+Q+' C'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Electricity',ti:'Series and Parallel Circuits',su:'Calculate total resistance and currents in series and parallel.',steps:[
  {lb:'Series circuits',dr:dQ2,ht:'<p>In series: same current through all components. Total resistance R_T = R\u2081 + R\u2082 + R\u2083 + \u2026 Voltage divides: V\u2099 = IR\u2099 (each component). Sum of voltages = EMF: \u03a3V = \u03b5. Adding more resistors in series: total R increases, current decreases. Series: one path only; break in circuit stops everything.</p>'},
  {lb:'Parallel circuits',dr:dQ2,ht:'<p>In parallel: same voltage across all branches. Total resistance: 1/R_T = 1/R\u2081 + 1/R\u2082 + \u2026 Current divides: I\u2099 = V/R\u2099. Sum of branch currents = total: I_T = I\u2081 + I\u2082 + \u2026 Adding more in parallel: total R decreases, total current increases. Two equal R in parallel: R_T = R/2. House wiring is parallel.</p>'},
  {lb:'Kirchhoff\'s laws',dr:dQ2,ht:'<p>KCL (junction rule): \u03a3I_in = \u03a3I_out at any junction (conservation of charge). KVL (loop rule): \u03a3V = 0 around any closed loop (conservation of energy). Solving complex circuits: (1) label unknowns; (2) write KCL equations at junctions; (3) write KVL equations for loops; (4) solve simultaneously.</p>'},
  {lb:'Potential divider',dr:dQ2,ht:'<div class="fm">V_out = V_in \u00d7 R\u2082/(R\u2081+R\u2082)</div><p>Potential (voltage) divider: two resistors in series across supply; output taken across one. V splits proportionally to R. Applications: volume control, sensor circuits (thermistor or LDR in voltage divider gives voltage proportional to temperature or light).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['series_R','parallel_R','pot_div']);if(type==='series_R'){var R1=rnd(10,200),R2=rnd(10,200),RT=R1+R2;return{question:'R\u2081=<b>'+R1+'\u03a9</b>, R\u2082=<b>'+R2+'\u03a9</b> in series. R_T?',hints:['R_T=R\u2081+R\u2082'],ans:RT,tol:0,unit:'\u03a9',working:'R_T='+R1+'+'+R2+' = '+RT+' \u03a9'};}if(type==='parallel_R'){var R1=rnd(10,200),R2=rnd(10,200),RT=parseFloat((R1*R2/(R1+R2)).toFixed(2));return{question:'R\u2081=<b>'+R1+'\u03a9</b>, R\u2082=<b>'+R2+'\u03a9</b> in parallel. R_T?',hints:['1/R_T=1/R\u2081+1/R\u2082; R_T=R\u2081R\u2082/(R\u2081+R\u2082)'],ans:RT,tol:RT*0.02,unit:'\u03a9',working:'R_T='+R1+'\u00d7'+R2+'/('+R1+'+'+R2+') = '+RT+' \u03a9'};}var Vin=pick([6,9,12,24]),R1=rnd(10,500),R2=rnd(10,500),Vout=parseFloat((Vin*R2/(R1+R2)).toFixed(2));return{question:'V_in=<b>'+Vin+'V</b>, R\u2081=<b>'+R1+'\u03a9</b>, R\u2082=<b>'+R2+'\u03a9</b>. V_out (across R\u2082)?',hints:['V_out=V_in\u00d7R\u2082/(R\u2081+R\u2082)'],ans:Vout,tol:Vout*0.02,unit:'V',working:'V_out='+Vin+'\u00d7'+R2+'/('+R1+'+'+R2+') = '+Vout+' V'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Electricity',ti:'Resistivity and Resistance',su:'Apply R=\u03c1L/A. Describe factors affecting resistance.',steps:[
  {lb:'Resistivity',dr:dQ3,ht:'<div class="fm">R = \u03c1L/A</div><p>R = resistance (\u03a9), \u03c1 = resistivity (\u03a9m), L = length (m), A = cross-sectional area (m\u00b2). Resistivity is a material property; independent of dimensions. Copper: \u03c1 \u2248 1.7\u00d710\u207b\u2078 \u03a9m. Nichrome: \u03c1 \u2248 1.1\u00d710\u207b\u2076 \u03a9m. Silicon: \u03c1 \u2248 640 \u03a9m. Higher \u03c1 \u2192 poorer conductor.</p>'},
  {lb:'Factors affecting resistance',dr:dQ3,ht:'<p>R depends on: (1) Length \u2014 R \u221d L (longer wire, more resistance). (2) Cross-sectional area \u2014 R \u221d 1/A (thicker wire, less resistance). (3) Material \u2014 \u03c1 (intrinsic property of material). (4) Temperature \u2014 metals: R increases with T; semiconductors: R decreases with T (thermistor).</p>'},
  {lb:'Temperature coefficient',dr:dQ3,ht:'<p>For metals: R = R\u2080(1 + \u03b1\u0394T) where \u03b1 = temperature coefficient of resistance (K\u207b\u00b9). \u03b1_copper \u2248 4\u00d710\u207b\u00b3 K\u207b\u00b9. Practical effect: tungsten filament R increases \u00d74 from cold to hot; measured resistance depends on temperature. Resistance thermometer: measure R to find T accurately.</p>'},
  {lb:'Superconductivity',dr:dQ3,ht:'<p>Superconductors: R \u2192 0 below critical temperature T_c. Example: mercury T_c = 4.2 K. High-temperature superconductors: T_c up to 135 K. Applications: MRI magnets (no resistive heating; maintains field indefinitely), maglev trains, particle accelerator magnets (LHC). Meissner effect: expels magnetic field (magnetic levitation). WAEC: know R drops to zero, not just very small.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['R_from_rhoLA','rho_from_R','L_from_R']);if(type==='R_from_rhoLA'){var rho=rnd(1,20)*1e-8,L=rnd(1,100),A=rnd(1,10)*1e-6,R=parseFloat((rho*L/A).toFixed(4));return{question:'\u03c1=<b>'+rho.toExponential(2)+'\u03a9m</b>, L=<b>'+L+'m</b>, A=<b>'+A.toExponential(2)+'m\u00b2</b>. R?',hints:['R=\u03c1L/A'],ans:R,tol:R*0.03,unit:'\u03a9',working:'R='+rho.toExponential(2)+'\u00d7'+L+'/'+A.toExponential(2)+' = '+R+' \u03a9'};}if(type==='rho_from_R'){var R=rnd(1,50),L=rnd(1,100),A=rnd(1,10)*1e-6,rho=parseFloat((R*A/L).toExponential(2));return{question:'R=<b>'+R+'\u03a9</b>, L=<b>'+L+'m</b>, A=<b>'+A.toExponential(2)+'m\u00b2</b>. Resistivity \u03c1?',hints:['\u03c1=RA/L'],ans:parseFloat(rho),tol:parseFloat(rho)*0.03,unit:'\u03a9m',working:'\u03c1='+R+'\u00d7'+A.toExponential(2)+'/'+L+' = '+rho+' \u03a9m'};}var rho=1.7e-8,A=rnd(1,10)*1e-6,R=rnd(1,50),L=parseFloat((R*A/rho).toFixed(1));return{question:'Copper wire (\u03c1=1.7\u00d710\u207b\u2078), A=<b>'+A.toExponential(2)+'m\u00b2</b>, R=<b>'+R+'\u03a9</b>. Length?',hints:['L=RA/\u03c1'],ans:L,tol:L*0.03,unit:'m',working:'L='+R+'\u00d7'+A.toExponential(2)+'/1.7\u00d710\u207b\u2078 = '+L+' m'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Electricity',ti:'EMF and Internal Resistance',su:'Apply \u03b5=V+Ir. Draw and interpret V-I characteristics of a cell.',steps:[
  {lb:'EMF and terminal voltage',dr:dQ4,ht:'<div class="fm">\u03b5 = V + Ir &nbsp;&nbsp; V = \u03b5 - Ir</div><p>\u03b5 = EMF (energy per unit charge supplied by source). r = internal resistance of source. V = terminal voltage = pd across external circuit. When I = 0 (open circuit): V = \u03b5. When current flows: V < \u03b5 (voltage drop across internal resistance Ir). Short circuit: I_max = \u03b5/r.</p>'},
  {lb:'V-I graph for a cell',dr:dQ4,ht:'<p>Plot V (y-axis) vs I (x-axis): straight line. Y-intercept = \u03b5 (EMF). Gradient = \u2212r (negative = internal resistance). From graph: r = |\u0394V/\u0394I|. Increased external load: I increases, V decreases (more Ir lost). Rechargeable cells: during charging V > \u03b5 (reversed Ir). Power delivered to external: P_ext = I(\u03b5 \u2212 Ir) = I\u00b2R_ext.</p>'},
  {lb:'Maximum power transfer',dr:dQ4,ht:'<p>Power dissipated in external resistance R_ext: P_ext = I\u00b2R_ext where I = \u03b5/(R_ext + r). P_ext = \u03b5\u00b2R_ext/(R_ext + r)\u00b2. Maximum power when R_ext = r (internal resistance). At max power: efficiency = 50% (equal power in r and R_ext). Practical: batteries overheat if short-circuited (large I, large I\u00b2r).</p>'},
  {lb:'Cells in series and parallel',dr:dQ4,ht:'<p>Cells in series: \u03b5_T = \u03b5\u2081 + \u03b5\u2082 + \u2026; r_T = r\u2081 + r\u2082 + \u2026 Larger EMF, larger internal resistance. Cells in parallel (identical): \u03b5_T = \u03b5 (same); r_T = r/n. Same voltage, lower internal resistance. Useful when large current needed. Mixed (series-parallel): analyse with Kirchhoff\u2019s laws.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['terminal_V','internal_r','short_circuit_I']);if(type==='terminal_V'){var emf=rnd(6,24),r=rnd(1,5),I=rnd(1,10),V=parseFloat((emf-I*r).toFixed(1));return{question:'\u03b5=<b>'+emf+'V</b>, r=<b>'+r+'\u03a9</b>, I=<b>'+I+'A</b>. Terminal voltage V?',hints:['V=\u03b5-Ir'],ans:V,tol:V*0.02,unit:'V',working:'V='+emf+'-'+I+'\u00d7'+r+' = '+V+' V'};}if(type==='internal_r'){var emf=rnd(6,24),V=rnd(3,emf-1),I=rnd(1,10),r=parseFloat(((emf-V)/I).toFixed(2));return{question:'\u03b5=<b>'+emf+'V</b>, V=<b>'+V+'V</b>, I=<b>'+I+'A</b>. Internal resistance r?',hints:['r=(\u03b5-V)/I'],ans:r,tol:r*0.02,unit:'\u03a9',working:'r=('+emf+'-'+V+')/'+I+' = '+r+' \u03a9'};}var emf=rnd(6,24),r=rnd(1,5),Isc=parseFloat((emf/r).toFixed(2));return{question:'\u03b5=<b>'+emf+'V</b>, r=<b>'+r+'\u03a9</b>. Short-circuit current?',hints:['I_sc=\u03b5/r (R_ext=0)'],ans:Isc,tol:Isc*0.02,unit:'A',working:'I_sc='+emf+'/'+r+' = '+Isc+' A'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Electricity',ti:'The Wheatstone Bridge',su:'Apply the Wheatstone bridge principle. Use a metre bridge.',steps:[
  {lb:'Wheatstone bridge',dr:dQ5,ht:'<p>Wheatstone bridge: four resistors in a diamond arrangement; galvanometer between midpoints. Balanced condition: no current through galvanometer \u2192 P/Q = R/S (or PS = QR). Used to measure unknown resistance precisely. Sensitivity: best when all four resistors similar. Small changes in one arm detectable.</p>'},
  {lb:'Metre bridge',dr:dQ5,ht:'<p>Metre bridge: practical Wheatstone bridge with wire AB as one ratio arm. Unknown X in left gap, known R in right gap. Jockey moved to balance point D at length l. X/R = l/(100\u2212l). So X = R\u00d7l/(100\u2212l). Sources of error: contact resistance at gaps, non-uniform wire, connecting wire resistance. Repeat: swap X and R.</p>'},
  {lb:'Potentiometer principle',dr:dQ5,ht:'<p>Potentiometer: long uniform wire with constant current; potential drops uniformly along wire. Compare EMFs: E\u2081/E\u2082 = l\u2081/l\u2082 (balance lengths). More accurate than voltmeter (draws no current at balance). Measure internal resistance: two balance lengths with and without external resistance. Uses: accurate voltage measurement, calibration, rheostat.</p>'},
  {lb:'Sensors and resistance',dr:dQ5,ht:'<p>Thermistor: NTC (negative temperature coefficient) \u2014 R decreases as T increases. LDR: R decreases as light intensity increases. Both used in potential divider circuits for sensing. Output voltage changes with sensor resistance. Used in: temperature control, automatic lighting, burglar alarms. WAEC: understand direction of change; explain in terms of charge carriers.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['metre_bridge','wheatstone_balance','pot_ratio']);if(type==='metre_bridge'){var R=rnd(10,500),l=rnd(20,80),X=parseFloat((R*l/(100-l)).toFixed(2));return{question:'Metre bridge: R=<b>'+R+'\u03a9</b>, balance at l=<b>'+l+' cm</b>. Unknown X?',hints:['X=R\u00d7l/(100-l)'],ans:X,tol:X*0.02,unit:'\u03a9',working:'X='+R+'\u00d7'+l+'/(100-'+l+') = '+X+' \u03a9'};}if(type==='wheatstone_balance'){var P=rnd(10,200),Q=rnd(10,200),R=rnd(10,200),S=parseFloat((P*R/Q).toFixed(2));return{question:'Wheatstone bridge: P=<b>'+P+'</b>, Q=<b>'+Q+'</b>, R=<b>'+R+'</b>. Find S at balance?',hints:['P/Q=R/S; S=QR/P'],ans:S,tol:S*0.02,unit:'\u03a9',working:'S='+Q+'\u00d7'+R+'/'+P+' = '+S+' \u03a9'};}var E1=rnd(100,200)/100,l1=rnd(30,80),l2=rnd(30,80),E2=parseFloat((E1*l2/l1).toFixed(3));return{question:'Potentiometer: E\u2081=<b>'+E1+'V</b>, l\u2081=<b>'+l1+'cm</b>, l\u2082=<b>'+l2+'cm</b>. Find E\u2082?',hints:['E\u2082/E\u2081=l\u2082/l\u2081'],ans:E2,tol:E2*0.02,unit:'V',working:'E\u2082='+E1+'\u00d7'+l2+'/'+l1+' = '+E2+' V'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Electricity',ti:'Capacitors',su:'Calculate charge, voltage and energy stored in capacitors.',steps:[
  {lb:'Capacitance',dr:dQ6,ht:'<div class="fm">C = Q/V (F = C/V)</div><p>Capacitance C = charge stored per unit voltage. Farad (F) = coulomb per volt; 1 F is very large. Typical: \u03bcF (10\u207b\u2076), nF (10\u207b\u2079), pF (10\u207b\u00b9\u00b2). Parallel plate: C = \u03b5\u2080\u03b5_r A/d. Larger area, smaller gap, higher permittivity \u2192 more capacitance. \u03b5\u2080 = 8.85\u00d710\u207b\u00b9\u00b2 F/m.</p>'},
  {lb:'Energy stored in capacitor',dr:dQ6,ht:'<div class="fm">E = \u00bdCV\u00b2 = \u00bdQV = Q\u00b2/(2C)</div><p>Energy stored as electric field between plates. Charging: energy from supply \u2192 half stored in capacitor, half dissipated in resistance (regardless of R). Discharging: energy \u2192 heat in resistor. Capacitors in flash photography: rapid release of stored energy. Defibrillator: stores large energy, delivers in short pulse.</p>'},
  {lb:'Capacitors in circuits',dr:dQ6,ht:'<p>Series: 1/C_T = 1/C\u2081 + 1/C\u2082 (same charge on each). Parallel: C_T = C\u2081 + C\u2082 (same voltage across each). Capacitor in DC circuit: charges up; blocks DC current when fully charged. In AC circuit: alternating charge/discharge \u2192 passes AC. Capacitive reactance X_C = 1/(\u03c9C) = 1/(2\u03c0fC); decreases with increasing frequency.</p>'},
  {lb:'Charging and discharging',dr:dQ6,ht:'<div class="fm">V = V\u2080 e^(-t/RC) (discharge) &nbsp; Q = CV\u2080(1-e^(-t/RC)) (charge)</div><p>Time constant \u03c4 = RC (seconds). After time \u03c4: V falls to V\u2080/e \u2248 37% of initial (discharge) or rises to 63% of final (charge). After 5\u03c4: essentially fully discharged/charged. Larger R or larger C \u2192 slower charging/discharging.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['Q_CV','E_cap','time_const']);if(type==='Q_CV'){var C=rnd(1,100)*1e-6,V=rnd(5,100),Q=parseFloat((C*V).toExponential(3));return{question:'C=<b>'+C.toExponential(2)+'F</b>, V=<b>'+V+'V</b>. Charge stored Q?',hints:['Q=CV'],ans:parseFloat(Q),tol:parseFloat(Q)*0.02,unit:'C',working:'Q='+C.toExponential(2)+'\u00d7'+V+' = '+Q+' C'};}if(type==='E_cap'){var C=rnd(1,100)*1e-6,V=rnd(5,100),E=parseFloat((0.5*C*V*V).toFixed(4));return{question:'C=<b>'+C.toExponential(2)+'F</b>, V=<b>'+V+'V</b>. Energy stored?',hints:['E=\u00bdCV\u00b2'],ans:E,tol:E*0.02,unit:'J',working:'E=0.5\u00d7'+C.toExponential(2)+'\u00d7'+V+'\u00b2 = '+E+' J'};}var R=rnd(1,100)*1e3,C=rnd(1,100)*1e-6,tau=parseFloat((R*C).toFixed(3));return{question:'R=<b>'+R/1e3+'k\u03a9</b>, C=<b>'+C*1e6+'\u03bcF</b>. Time constant \u03c4?',hints:['\u03c4=RC'],ans:tau,tol:tau*0.02,unit:'s',working:'\u03c4='+R+'\u00d7'+C+' = '+tau+' s'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Electricity',ti:'Semiconductor Devices',su:'Describe p-n junction, diode and transistor behaviour.',steps:[
  {lb:'Semiconductors',dr:dQ7,ht:'<p>Semiconductor: electrical conductivity between conductor and insulator; increases with temperature (opposite to metals). Pure silicon: valence band full; conduction band nearly empty; few charge carriers. Doping: add impurity atoms. N-type: phosphorus (5 valence electrons); extra electrons as carriers. P-type: boron (3 valence electrons); holes as carriers.</p>'},
  {lb:'P-N junction and diode',dr:dQ7,ht:'<p>P-N junction: join p-type and n-type; depletion layer forms (no free carriers). Forward bias: positive to p, negative to n; depletion layer narrows; current flows above ~0.7V (Si). Reverse bias: positive to n, negative to p; depletion layer widens; only tiny leakage current; breakdown at high voltage (Zener effect).</p>'},
  {lb:'Transistor (BJT)',dr:dQ7,ht:'<p>Bipolar junction transistor (BJT): NPN or PNP. Three terminals: base (B), collector (C), emitter (E). Small base current I_B controls large collector current I_C: I_C = h_FE \u00d7 I_B (h_FE = current gain, typically 50\u2013500). Used as: switch (base saturated or cut off) or amplifier (base in active region). MOSFET: voltage-controlled; gate voltage controls drain current.</p>'},
  {lb:'Rectification and filtering',dr:dQ7,ht:'<p>Half-wave rectification: single diode; passes only half cycle; rippling DC. Full-wave rectification: bridge rectifier (4 diodes); both half cycles converted; less ripple. Smoothing capacitor: charges on peaks; discharges between peaks; reduces ripple. Large C \u2192 less ripple. Zener diode: used as voltage regulator; maintains constant output voltage.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['transistor_Ic','diode_voltage','gain']);if(type==='transistor_Ic'){var IB=rnd(1,100)*1e-6,hFE=rnd(50,500),IC=parseFloat((IB*hFE*1e3).toFixed(2));return{question:'I_B=<b>'+(IB*1e6).toFixed(0)+'\u03bcA</b>, h_FE=<b>'+hFE+'</b>. Collector current I_C?',hints:['I_C=h_FE\u00d7I_B'],ans:IC,tol:IC*0.02,unit:'mA',working:'I_C='+hFE+'\u00d7'+(IB*1e6).toFixed(0)+'\u03bcA = '+IC+' mA'};}if(type==='diode_voltage'){var type2=pick(['forward','reverse']);if(type2==='forward')return{question:'Silicon diode in forward bias. Approximate voltage drop across diode?',hints:['Si diode: ~0.7V forward voltage'],ans:0.7,tol:0.1,unit:'V',working:'Si diode: ~0.7 V forward bias'};return{question:'Diode in reverse bias (below breakdown). Current through it?',hints:['Reverse bias: essentially zero current'],ans:0,tol:0.001,unit:'A',working:'Reverse bias: I \u2248 0 (only tiny leakage)'};} var IC=rnd(10,500),IB=rnd(1,10),hFE=Math.round(IC/IB);return{question:'I_C=<b>'+IC+'mA</b>, I_B=<b>'+IB+'mA</b>. Current gain h_FE?',hints:['h_FE=I_C/I_B'],ans:hFE,tol:hFE*0.05,unit:'',working:'h_FE='+IC+'/'+IB+' = '+hFE};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Electricity',ti:'AC Circuits Basics',su:'Describe AC. Calculate RMS values and phase relationships.',steps:[
  {lb:'AC fundamentals',dr:dQ8,ht:'<div class="fm">V = V\u2080 sin(\u03c9t) &nbsp;&nbsp; V_{rms} = V\u2080/\u221a2</div><p>AC: voltage and current vary sinusoidally with time. V\u2080 = peak voltage. V_rms = root mean square = V\u2080/\u221a2 \u2248 0.707V\u2080. Same with I: I_rms = I\u2080/\u221a2. RMS gives equivalent DC heating effect. UK mains: 230 V rms, 50 Hz; peak voltage V\u2080 = 230\u221a2 \u2248 325 V.</p>'},
  {lb:'AC power',dr:dQ8,ht:'<p>Instantaneous power: p = iv = I\u2080V\u2080 sin\u00b2(\u03c9t). Average power: P_avg = \u00bdI\u2080V\u2080 = I_rms\u00d7V_rms = I_rms\u00b2R = V_rms\u00b2/R. For pure resistor: in phase (I and V peak together). For pure inductor: I lags V by 90\u00b0. For pure capacitor: I leads V by 90\u00b0. CIVIL mnemonic: C (capacitor) I before V; L (inductor) I after V.</p>'},
  {lb:'Inductors in AC',dr:dQ8,ht:'<div class="fm">X_L = \u03c9L = 2\u03c0fL (\u03a9)</div><p>Inductive reactance X_L (\u03a9) opposes AC current. Increases with frequency and inductance. At DC (f=0): X_L=0; inductor acts as wire. At high f: large X_L; blocks high frequency. I lags V by 90\u00b0 in pure inductor. Power in pure inductor: zero (energy stored and returned each cycle, not dissipated).</p>'},
  {lb:'Capacitors in AC',dr:dQ8,ht:'<div class="fm">X_C = 1/(\u03c9C) = 1/(2\u03c0fC) (\u03a9)</div><p>Capacitive reactance X_C. Decreases with frequency. At DC: X_C = \u221e; capacitor blocks DC. At high f: small X_C; passes high frequency. I leads V by 90\u00b0 in pure capacitor. CIVIL: Capacitor \u2014 I before V (leads by 90\u00b0). Power in pure capacitor: zero (energy stored and returned, not dissipated).</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['Vrms','XL','XC']);if(type==='Vrms'){var V0=rnd(100,500),Vrms=parseFloat((V0/Math.sqrt(2)).toFixed(1));return{question:'Peak voltage V\u2080=<b>'+V0+'V</b>. V_rms?',hints:['V_rms=V\u2080/\u221a2'],ans:Vrms,tol:Vrms*0.01,unit:'V',working:'V_rms='+V0+'/\u221a2 = '+Vrms+' V'};}if(type==='XL'){var f=rnd(50,5000),L=rnd(1,100)/1000,XL=parseFloat((2*Math.PI*f*L).toFixed(2));return{question:'f=<b>'+f+'Hz</b>, L=<b>'+(L*1000).toFixed(0)+'mH</b>. Inductive reactance X_L?',hints:['X_L=2\u03c0fL'],ans:XL,tol:XL*0.02,unit:'\u03a9',working:'X_L=2\u03c0\u00d7'+f+'\u00d7'+L+' = '+XL+' \u03a9'};}var f=rnd(50,5000),C=rnd(1,100)*1e-6,XC=parseFloat((1/(2*Math.PI*f*C)).toFixed(2));return{question:'f=<b>'+f+'Hz</b>, C=<b>'+C*1e6+'\u03bcF</b>. Capacitive reactance X_C?',hints:['X_C=1/(2\u03c0fC)'],ans:XC,tol:XC*0.02,unit:'\u03a9',working:'X_C=1/(2\u03c0\u00d7'+f+'\u00d7'+C.toExponential(2)+') = '+XC+' \u03a9'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Electricity',ti:'Electrical Safety and Applications',su:'Describe domestic wiring. Explain fuses, earthing and circuit breakers.',steps:[
  {lb:'Domestic wiring',dr:dQ9,ht:'<p>UK mains: 230 V rms, 50 Hz. Three wires: Live (L, brown, 230V), Neutral (N, blue, 0V), Earth (E, green/yellow, 0V). Fuse or circuit breaker on live wire. Current returns via neutral. Earth wire provides low-resistance path to ground; triggers fuse/CB if fault occurs. RCD (Residual Current Device): detects imbalance between L and N currents (as small as 30 mA).</p>'},
  {lb:'Fuses and circuit breakers',dr:dQ9,ht:'<p>Fuse: thin wire melts if current exceeds rated value; one-time use; must replace. Circuit breaker: electromagnetic switch; trips if current exceeds limit; resets. RCCB/RCD: trips if difference between live and neutral currents > threshold (30 mA); protects against electrocution. MCB: combines overcurrent and RCD protection. Fuse/CB rating: choose just above expected normal current.</p>'},
  {lb:'Earthing and double insulation',dr:dQ9,ht:'<p>Earthing: metal casings connected to earth; if live wire touches casing, large current to earth blows fuse/CB before dangerous voltage builds up on casing. Double insulation: no earth needed (class II); two layers of insulation; casing plastic (non-conducting). Symbol: square within square. Toasters, hair dryers often double insulated.</p>'},
  {lb:'Electrical hazards and safety',dr:dQ9,ht:'<p>Electric shock: current through body. Dangerous >1 mA (pain), >10 mA (muscular lock), >100 mA (ventricular fibrillation, death). Body resistance: ~1000-100000\u03a9 (varies with wetness). 230V/1000\u03a9 = 230 mA (very dangerous). Never use electrical equipment near water. Always turn off at mains before working on circuits. Capacitors can store lethal charge even when disconnected.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['fuse_choice','shock_current','power_kWh']);if(type==='fuse_choice'){var P=rnd(1000,3000),V=230,I=parseFloat((P/V).toFixed(1));var fuse=I<3?3:I<5?5:13;return{question:'Appliance P=<b>'+P+'W</b>, V=230V. Which fuse: 3A, 5A or 13A?',hints:['I=P/V; choose fuse just above I'],ans:fuse,tol:0,unit:'A',working:'I='+P+'/230='+I+'A; choose '+fuse+'A fuse'};}if(type==='shock_current'){var V=230,R=rnd(500,5000),I=parseFloat((V/R*1000).toFixed(1));return{question:'V=230V, body R=<b>'+R+'\u03a9</b>. Shock current (mA)?',hints:['I=V/R; convert to mA'],ans:I,tol:I*0.05,unit:'mA',working:'I=230/'+R+'\u00d71000 = '+I+' mA'};}var P=rnd(1,5),t=rnd(1,10),units=parseFloat((P*t).toFixed(1)),cost=parseFloat((units*0.28).toFixed(2));return{question:'<b>'+P+'kW</b> appliance for <b>'+t+'h</b>. Units of electricity used (kWh)?',hints:['Units = P(kW) \u00d7 t(h)'],ans:units,tol:units*0.02,unit:'kWh',working:'Units='+P+'\u00d7'+t+' = '+units+' kWh'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Electricity',ti:'Mixed Electricity Questions',su:'Integrated questions across all Y12-ELE-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>V=IR. Q=It. P=IV=I\u00b2R=V\u00b2/R. R_T(series)=\u03a3R. 1/R_T(parallel)=\u03a31/R. R=\u03c1L/A. \u03b5=V+Ir. V_div=V_in\u00d7R\u2082/(R\u2081+R\u2082). C=Q/V. E_cap=\u00bdCV\u00b2. V_rms=V\u2080/\u221a2. X_L=2\u03c0fL. X_C=1/(2\u03c0fC). h_FE=I_C/I_B.</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC heavily tests: Ohm\u2019s law; series and parallel resistance; power calculations; EMF and internal resistance; resistivity; Kirchhoff\u2019s laws; capacitor charge and energy. Know all three forms of P (IV, I\u00b2R, V\u00b2/R) and which to use depending on what\u2019s given.</p>'},
  {lb:'Problem strategy',dr:dQ10,ht:'<p>For circuit problems: (1) Identify series and parallel sections. (2) Reduce to equivalent resistance. (3) Find total current. (4) Apply voltage divider or current divider to find individual voltages and currents. (5) Calculate power in each component. Check: \u03a3P_components = total power from source = \u03b5I.</p>'},
