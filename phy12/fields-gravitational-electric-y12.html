<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Field comparison: gravity vs electric',ACC,12,'middle',true));
o.push(R(10,36,222,210,CRM,ACC,2));o.push(T(121,54,'GRAVITATIONAL',ACC,9,'middle',true));
o.push(R(248,36,222,210,CRM,ACC,2));o.push(T(359,54,'ELECTRIC',ACC,9,'middle',true));
['F=GMm/r\u00b2 (attractive)','g=GM/r\u00b2 (N/kg)','V=-GM/r (J/kg)','acts on mass','always attractive','v_esc=\u221a(2GM/R)'].forEach(function(v,i){if(i<p+1)o.push(T(121,74+i*28,v,'#333',8,'middle',false));});
['F=kQq/r\u00b2','E=kQ/r\u00b2 (N/C)','V=kQ/r (J/C)','acts on charge','+/- : attract/repel','E=V/d (parallel plates)'].forEach(function(v,i){if(i<p+1)o.push(T(359,74+i*28,v,'#333',8,'middle',false));});
s.innerHTML=o.join('');}
function dQ2(p){dQ1(p);}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ1(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ1(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Fields summary',ACC,13,'middle',true));
[['Gravitational F','F=GMm/r\u00b2; always attractive'],['Grav field g','g=GM/r\u00b2 (N/kg); g=9.81 at surface'],['Grav potential','V_g=-GM/r (J/kg); negative; zero at \u221e'],['Electric F','F=kQq/r\u00b2; k=8.99\u00d710\u2079 N m\u00b2/C\u00b2'],['Electric field E','E=kQ/r\u00b2; E=V/d (uniform)'],['Elec potential','V=kQ/r (J/C); zero at \u221e'],['Orbital','v=\u221a(GM/r); T\u00b2\u221dr\u00b3 (Kepler 3rd)']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Fields',ti:'Gravitational Force',su:'Apply Newton\'s law of gravitation.',steps:[
  {lb:'Newton\'s law of gravitation',dr:dQ1,ht:'<div class="fm">F = GMm/r\u00b2 (N)</div><p>G = 6.674\u00d710\u207b\u00b9\u00b9 N m\u00b2/kg\u00b2. Attractive; acts along line joining centres; equal and opposite (3rd law). Inverse square: double r \u2192 quarter the force. Holds for point masses and uniform spheres (treat mass concentrated at centre).</p>'},
  {lb:'Gravitational field strength',dr:dQ1,ht:'<div class="fm">g = GM/r\u00b2 (N/kg = m/s\u00b2)</div><p>g is force per unit mass. g = 9.81 m/s\u00b2 at Earth\u2019s surface. g decreases as 1/r\u00b2 with altitude. g at altitude h: g_h = g_0 (R/(R+h))\u00b2. At Moon surface: g = 1.6 N/kg. g inside Earth (shell theorem): decreases linearly toward centre.</p>'},
  {lb:'Gravitational potential',dr:dQ1,ht:'<div class="fm">V_g = -GM/r (J/kg)</div><p>Gravitational potential: energy per unit mass. Negative (bound state). Zero at infinity. Potential energy U = mV_g = -GMm/r. Escape velocity: KE = |U|; \u00bdmv_esc\u00b2 = GMm/R; v_esc = \u221a(2GM/R). At Earth\u2019s surface: v_esc = \u221a(2\u00d79.81\u00d76.4\u00d710\u2076) \u2248 11.2 km/s.</p>'},
  {lb:'Orbital motion',dr:dQ1,ht:'<p>GMm/r\u00b2 = mv\u00b2/r \u2192 v = \u221a(GM/r). Period: T\u00b2 = 4\u03c0\u00b2r\u00b3/(GM) (Kepler\u2019s 3rd). T\u00b2/r\u00b3 = constant for all satellites around same body. Geostationary: T=24h; r\u224242 200 km. Total energy in orbit: E = -GMm/(2r) (negative = bound orbit).</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['grav_force','g_altitude','escape_v']);if(type==='grav_force'){var G=6.674e-11,M=5.97e24,m=rnd(1,100),r=rnd(6400,12000)*1e3,F=parseFloat((G*M*m/(r*r)).toFixed(2));return{question:'M=5.97\u00d710\u00b2\u2074kg, m=<b>'+m+'kg</b>, r=<b>'+(r/1e6).toFixed(2)+'\u00d710\u2076m</b>. F?',hints:['F=GMm/r\u00b2'],ans:F,tol:F*0.05,unit:'N',working:'F=6.67\u00d710\u207b\u00b9\u00b9\u00d75.97\u00d710\u00b2\u2074\u00d7'+m+'/'+r.toExponential(2)+'\u00b2 = '+F+' N'};}if(type==='g_altitude'){var G=6.674e-11,M=5.97e24,r=rnd(7000,20000)*1e3,g=parseFloat((G*M/(r*r)).toFixed(3));return{question:'At r=<b>'+(r/1e6).toFixed(2)+'\u00d710\u2076m</b>. g?',hints:['g=GM/r\u00b2'],ans:g,tol:g*0.05,unit:'m/s\u00b2',working:'g=6.67\u00d710\u207b\u00b9\u00b9\u00d75.97\u00d710\u00b2\u2074/'+r.toExponential(2)+'\u00b2 = '+g+' m/s\u00b2'};}var g=rnd(5,25),R=rnd(1000,8000)*1e3,v=parseFloat(Math.sqrt(2*g*R).toFixed(0));return{question:'g=<b>'+g+'m/s\u00b2</b>, R=<b>'+(R/1e6).toFixed(2)+'\u00d710\u2076m</b>. Escape speed?',hints:['v_esc=\u221a(2gR)'],ans:v,tol:v*0.02,unit:'m/s',working:'v=\u221a(2\u00d7'+g+'\u00d7'+R.toExponential(2)+') = '+v+' m/s'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Fields',ti:'Electric Force and Coulomb\'s Law',su:'Apply Coulomb\'s law. Calculate electric field strength.',steps:[
  {lb:'Coulomb\'s law',dr:dQ2,ht:'<div class="fm">F = kQq/r\u00b2 (N) &nbsp; k = 1/(4\u03c0\u03b5\u2080) = 8.99\u00d710\u2079 N m\u00b2/C\u00b2</div><p>\u03b5\u2080 = 8.85\u00d710\u207b\u00b9\u00b2 F/m. Same and opposite charges: repel/attract. Compare to gravity: same inverse square form; gravity always attractive; electric can repel. At atomic scale: electric force \u226710\u00b3\u00b9 times stronger than gravity.</p>'},
  {lb:'Electric field strength',dr:dQ2,ht:'<div class="fm">E = kQ/r\u00b2 (N/C = V/m)</div><p>E = force per unit positive charge. Direction: away from + charge, toward - charge. Field lines: start on +, end on -; closer together = stronger field. Superposition: add field vectors from multiple charges.</p>'},
  {lb:'Electric potential',dr:dQ2,ht:'<div class="fm">V = kQ/r (V = J/C)</div><p>Potential: energy per unit positive charge. V positive for + charge; negative for - charge. Zero at infinity. Potential energy U = qV = kQq/r. Work done moving charge: W = q\u0394V. Equipotential surfaces: perpendicular to field lines. V constant on sphere around point charge.</p>'},
  {lb:'Uniform field between plates',dr:dQ2,ht:'<div class="fm">E = V/d (V/m) &nbsp;&nbsp; F = qE</div><p>Parallel plates separated by d, voltage V: uniform field E=V/d inside. Charge q in field: F=qE. Electron accelerated through voltage V: KE=eV; v=\u221a(2eV/m). Capacitance C=\u03b5\u2080A/d (vacuum) or C=\u03b5\u2080\u03b5_rA/d (dielectric).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['Coulomb_F','E_field','V_plate']);if(type==='Coulomb_F'){var k=8.99e9,Q=rnd(1,100)*1e-6,q=rnd(1,100)*1e-6,r=rnd(1,100)/100,F=parseFloat((k*Q*q/(r*r)).toFixed(2));return{question:'Q=<b>'+(Q*1e6).toFixed(0)+'\u03bcC</b>, q=<b>'+(q*1e6).toFixed(0)+'\u03bcC</b>, r=<b>'+r.toFixed(2)+'m</b>. F?',hints:['F=kQq/r\u00b2; k=8.99\u00d710\u2079'],ans:F,tol:F*0.05,unit:'N',working:'F=8.99\u00d710\u2079\u00d7'+Q.toExponential(2)+'\u00d7'+q.toExponential(2)+'/'+r.toFixed(2)+'\u00b2 = '+F+' N'};}if(type==='E_field'){var k=8.99e9,Q=rnd(1,100)*1e-6,r=rnd(1,50)/100,E=parseFloat((k*Q/(r*r)).toFixed(0));return{question:'Q=<b>'+(Q*1e6).toFixed(0)+'\u03bcC</b>, r=<b>'+r.toFixed(2)+'m</b>. E?',hints:['E=kQ/r\u00b2'],ans:E,tol:E*0.05,unit:'N/C',working:'E=8.99\u00d710\u2079\u00d7'+Q.toExponential(2)+'/'+r.toFixed(2)+'\u00b2 = '+E+' N/C'};}var V=rnd(10,1000),d=rnd(1,100)/1000,E=parseFloat((V/d).toFixed(1));return{question:'V=<b>'+V+'V</b>, d=<b>'+d.toFixed(3)+'m</b>. E (uniform field)?',hints:['E=V/d'],ans:E,tol:E*0.02,unit:'V/m',working:'E='+V+'/'+d.toFixed(3)+' = '+E+' V/m'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Fields',ti:'Gravitational and Electric Potential',su:'Calculate field potential and potential energy.',steps:[
  {lb:'Gravitational potential',dr:dQ3,ht:'<div class="fm">V_g = -GM/r (J/kg)</div><p>Always negative (bound state). V_g = 0 at r = \u221e. Potential energy: U = mV_g = -GMm/r. Work needed to escape to infinity: W = -U = GMm/r. Potential well: deep well for strong gravity fields. Potential difference: \u0394V_g = GM(1/r\u2081 - 1/r\u2082).</p>'},
  {lb:'Electric potential',dr:dQ3,ht:'<div class="fm">V_e = kQ/r (V = J/C)</div><p>Positive for + charges; negative for - charges. V = 0 at infinity. Potential energy: U = qV = kQq/r. Work moving charge q through \u0394V: W = q\u0394V. Equipotentials: spheres around point charge; parallel lines for uniform field. Field lines perpendicular to equipotentials.</p>'},
  {lb:'Superposition of potentials',dr:dQ3,ht:'<p>Total potential at a point = algebraic sum of potentials from all sources (scalar addition; no direction needed). Total field = vector sum of fields from all sources. This makes potential easier to calculate for multiple charges. Work done moving charge from A to B: W = q(V_B - V_A) = q\u0394V.</p>'},
  {lb:'Electron-volt',dr:dQ3,ht:'<p>Electron-volt (eV): energy gained by electron moved through 1 V. 1 eV = 1.6\u00d710\u207b\u00b9\u2079 J. Used in atomic, nuclear, particle physics where joules are too large. KE of electron accelerated through V: KE = eV. X-ray tube 50 kV: electron KE = 50 keV = 50,000 eV = 8\u00d710\u207b\u00b9\u2075 J.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['grav_pot','elec_pot','W_charge']);if(type==='grav_pot'){var G=6.674e-11,M=5.97e24,r=rnd(6400,15000)*1e3,V=parseFloat((-G*M/r).toFixed(0));return{question:'At r=<b>'+(r/1e6).toFixed(2)+'\u00d710\u2076m</b>. V_g?',hints:['V_g=-GM/r'],ans:V,tol:Math.abs(V)*0.05,unit:'J/kg',working:'V_g=-6.67\u00d710\u207b\u00b9\u00b9\u00d75.97\u00d710\u00b2\u2074/'+r.toExponential(2)+' = '+V+' J/kg'};}if(type==='elec_pot'){var k=8.99e9,Q=rnd(1,100)*1e-6,r=rnd(1,50)/100,V=parseFloat((k*Q/r).toFixed(0));return{question:'Q=<b>'+(Q*1e6).toFixed(0)+'\u03bcC</b>, r=<b>'+r.toFixed(2)+'m</b>. V_e?',hints:['V=kQ/r'],ans:V,tol:V*0.05,unit:'V',working:'V=8.99\u00d710\u2079\u00d7'+Q.toExponential(2)+'/'+r.toFixed(2)+' = '+V+' V'};}var q=rnd(1,100)*1e-6,dV=rnd(10,1000),W=parseFloat((q*dV).toFixed(4));return{question:'q=<b>'+(q*1e6).toFixed(0)+'\u03bcC</b>, \u0394V=<b>'+dV+'V</b>. Work W=q\u0394V?',hints:['W=q\u0394V'],ans:W,tol:W*0.02,unit:'J',working:'W='+q.toExponential(2)+'\u00d7'+dV+' = '+W+' J'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Fields',ti:'Orbital Motion and Kepler\'s Laws',su:'Apply Kepler\'s third law. Calculate orbital speed and period.',steps:[
  {lb:'Kepler\'s laws',dr:dQ4,ht:'<p>1st: planets orbit in ellipses with Sun at one focus. 2nd: line from Sun to planet sweeps equal areas in equal times (conservation of angular momentum). 3rd: T\u00b2 \u221d r\u00b3; T\u00b2/r\u00b3 = 4\u03c0\u00b2/(GM) = constant for all satellites around same body. T in seconds, r in metres.</p>'},
  {lb:'Orbital mechanics',dr:dQ4,ht:'<p>Circular orbit: gravitational force provides centripetal force. GMm/r\u00b2 = mv\u00b2/r \u2192 v = \u221a(GM/r). Period: T = 2\u03c0r/v = 2\u03c0r\u221a(r/(GM)). Lower orbit: faster speed, shorter period. Geostationary: T=86400s; r\u224242200km above centre.</p>'},
  {lb:'Energy in orbit',dr:dQ4,ht:'<p>KE = \u00bdmv\u00b2 = GMm/(2r). GPE = -GMm/r. Total E = KE + GPE = -GMm/(2r). Negative: bound orbit. Increasing r: KE decreases, GPE increases, total E increases (less negative). Satellite slows as orbit raised (boosted); would speed up if loses energy to drag (lower orbit, higher speed).</p>'},
  {lb:'Synchronous satellites',dr:dQ4,ht:'<p>Geostationary: T=24h; stays above same point on equator. r = (GMT\u00b2/4\u03c0\u00b2)^(1/3) \u2248 42200 km from centre (\u224835800 km above surface). Used: weather satellites, TV broadcast, GPS relay. Disadvantages: 36000 km \u2192 signal delay ~240 ms; cannot serve polar regions. GPS: medium Earth orbit, 20200 km.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['orbital_v','period_T','Kepler3']);if(type==='orbital_v'){var GM=3.986e14,r=rnd(7000,42000)*1e3,v=parseFloat(Math.sqrt(GM/r).toFixed(0));return{question:'Orbit r=<b>'+(r/1e6).toFixed(2)+'\u00d710\u2076m</b> (GM=3.986\u00d710\u00b9\u2074). v?',hints:['v=\u221a(GM/r)'],ans:v,tol:v*0.03,unit:'m/s',working:'v=\u221a(3.986\u00d710\u00b9\u2074/'+r.toExponential(2)+') = '+v+' m/s'};}if(type==='period_T'){var GM=3.986e14,r=rnd(7000,42000)*1e3,T=parseFloat((2*Math.PI*r/Math.sqrt(GM/r)).toFixed(0));return{question:'Orbit r=<b>'+(r/1e6).toFixed(2)+'\u00d710\u2076m</b>. Period T?',hints:['T=2\u03c0r/v; v=\u221a(GM/r)'],ans:T,tol:T*0.03,unit:'s',working:'T=2\u03c0\u00d7'+r.toExponential(2)+'/\u221a(GM/r) = '+T+' s'};}var r1=rnd(7000,15000)*1e3,r2=rnd(16000,42000)*1e3,T1=2*Math.PI*r1/Math.sqrt(3.986e14/r1),T2=parseFloat((2*Math.PI*r2/Math.sqrt(3.986e14/r2)).toFixed(0));return{question:'r\u2082=<b>'+(r2/1e6).toFixed(2)+'\u00d710\u2076m</b>; r\u2081=<b>'+(r1/1e6).toFixed(2)+'\u00d710\u2076m</b>; T\u2081=<b>'+T1.toFixed(0)+'s</b>. T\u2082?',hints:['T\u00b2/r\u00b3=const; T\u2082=T\u2081(r\u2082/r\u2081)^(3/2)'],ans:T2,tol:T2*0.05,unit:'s',working:'T\u2082='+T1.toFixed(0)+'\u00d7('+r2.toExponential(2)+'/'+r1.toExponential(2)+')\u00b3/\u00b2 = '+T2+' s'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Fields',ti:'Motion of Charges in Fields',su:'Analyse motion of charged particles in electric and magnetic fields.',steps:[
  {lb:'Charge in electric field',dr:dQ5,ht:'<p>F = qE = qV/d. Acceleration: a = qE/m. For uniform field: projectile-like motion. Along field: constant acceleration. Perpendicular to field: constant velocity. KE gained = qV (particle accelerated through voltage V). Electron gun: electrons accelerated; then deflected by transverse field.</p>'},
  {lb:'Charge in magnetic field',dr:dQ5,ht:'<div class="fm">F = Bqv (perpendicular to v and B)</div><p>No work done (F \u22a5 v). KE constant. Circular motion: Bqv = mv\u00b2/r \u2192 r = mv/(Bq). Period T = 2\u03c0m/(Bq): independent of v. Cyclotron uses this: accelerate particles in spiral. Mass spectrometer: r \u221d m for same q and v.</p>'},
  {lb:'Velocity selector',dr:dQ5,ht:'<p>Electric force qE and magnetic force Bqv in opposite directions. At selected speed: qE = Bqv \u2192 v = E/B. Only particles with this speed pass through undeflected. Used to prepare monoenergetic beam before mass spectrometer. Independent of charge-to-mass ratio.</p>'},
  {lb:'CRT (cathode ray tube)',dr:dQ5,ht:'<p>Electron gun: electrons accelerated through voltage V; KE = eV; speed v = \u221a(2eV/m). Deflection plates: transverse electric field; parabolic path (same as projectile in gravity). Time in plates: t = L_plates/v_x. Transverse deflection: y = \u00bdat\u00b2 = eEL\u00b2/(4eVL_plates). Magnification: y \u221d V_deflect/V_accelerate.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['v_selector','radius_B','KE_accel']);if(type==='v_selector'){var E=rnd(1000,100000),B=rnd(1,20)/100,v=parseFloat((E/B).toFixed(0));return{question:'Velocity selector: E=<b>'+E+' V/m</b>, B=<b>'+B+' T</b>. Selected speed?',hints:['v=E/B'],ans:v,tol:v*0.02,unit:'m/s',working:'v='+E+'/'+B+' = '+v+' m/s'};}if(type==='radius_B'){var B=rnd(1,20)/100,m=9.11e-31,q=1.6e-19,v=rnd(1,100)*1e6,r=parseFloat((m*v/(B*q)).toFixed(4));return{question:'Electron: B=<b>'+B+' T</b>, v=<b>'+v.toExponential(2)+' m/s</b>. r?',hints:['r=mv/(Bq)'],ans:r,tol:r*0.05,unit:'m',working:'r=9.11\u00d710\u207b\u00b3\u00b9\u00d7'+v.toExponential(2)+'/('+B+'\u00d71.6\u00d710\u207b\u00b9\u2079) = '+r+' m'};}var V=rnd(100,50000),q=1.6e-19,m=9.11e-31,v=parseFloat(Math.sqrt(2*q*V/m).toExponential(2));return{question:'Electron accelerated through V=<b>'+V+'V</b>. Speed?',hints:['eV=\u00bdmv\u00b2; v=\u221a(2eV/m)'],ans:parseFloat(v),tol:parseFloat(v)*0.05,unit:'m/s',working:'v=\u221a(2\u00d71.6\u00d710\u207b\u00b9\u2079\u00d7'+V+'/9.11\u00d710\u207b\u00b3\u00b9) = '+v+' m/s'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Fields',ti:'Electric and Gravitational Potential Energy',su:'Calculate potential energy. Apply conservation of energy in fields.',steps:[
  {lb:'Energy in gravitational field',dr:dQ6,ht:'<p>GPE = mV_g = -GMm/r. At surface: GPE = -GMm/R. To escape to infinity: need KE = GMm/R; so v_esc = \u221a(2GM/R). If dropped from height h: gain KE = loss in GPE = mgh (near surface). Far from surface: use exact formula \u0394GPE = GMm(1/r\u2081 - 1/r\u2082).</p>'},
  {lb:'Energy in electric field',dr:dQ6,ht:'<p>Electric PE: U = qV = kQq/r. Moving charge through \u0394V: W = q\u0394V. Electric PE + KE = constant (conservative force). Electron accelerated through V: KE = eV. Particle in field E over distance d: W = qEd = q(V/d)d = qV. \u0394PE = q\u0394V = -W (work done by field decreases PE).</p>'},
  {lb:'Field and potential gradient',dr:dQ6,ht:'<p>Electric field = negative potential gradient: E = -dV/dr. Field strength from potential: steeper potential \u2192 stronger field. Equipotentials closer \u2192 stronger field. Gravity: g = -dV_g/dr. This explains why field is zero inside a hollow sphere (potential constant inside; gradient = 0).</p>'},
  {lb:'Comparing fields',dr:dQ6,ht:'<p>Both gravity and electricity obey inverse square law. Both have potential that varies as 1/r. Gravity: always attractive; G is very small; significant only for astronomical masses. Electric: attractive or repulsive; k is large; important at atomic scale. Ratio F_electric/F_gravity for electron-proton: \u224810\u00b3\u2077 (electric dominates).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['GPE_change','KE_gained','W_charge']);if(type==='GPE_change'){var G=6.674e-11,M=5.97e24,m=rnd(1,100),r1=rnd(6400,10000)*1e3,r2=rnd(10001,15000)*1e3,dU=parseFloat((G*M*m*(1/r1-1/r2)).toFixed(0));return{question:'m=<b>'+m+'kg</b>, move from r\u2081=<b>'+(r1/1e6).toFixed(2)+'\u00d710\u2076</b> to r\u2082=<b>'+(r2/1e6).toFixed(2)+'\u00d710\u2076m</b>. \u0394GPE?',hints:['GPE=-GMm/r; \u0394GPE=GMm(1/r\u2081-1/r\u2082)'],ans:dU,tol:Math.abs(dU)*0.05,unit:'J',working:'\u0394GPE=6.67\u00d710\u207b\u00b9\u00b9\u00d75.97\u00d710\u00b2\u2074\u00d7'+m+'\u00d7(1/'+r1.toExponential(2)+'-1/'+r2.toExponential(2)+') = '+dU+' J'};}if(type==='KE_gained'){var V=rnd(100,10000),q=1.6e-19,KE=parseFloat((q*V).toExponential(2));return{question:'Electron through V=<b>'+V+'V</b>. KE gained?',hints:['KE=eV; e=1.6\u00d710\u207b\u00b9\u2079C'],ans:parseFloat(KE),tol:parseFloat(KE)*0.02,unit:'J',working:'KE=1.6\u00d710\u207b\u00b9\u2079\u00d7'+V+' = '+KE+' J'};}var q=rnd(1,100)*1e-6,V1=rnd(100,500),V2=rnd(501,1000),W=parseFloat((q*(V2-V1)).toFixed(4));return{question:'q=<b>'+(q*1e6).toFixed(0)+'\u03bcC</b>, V\u2081=<b>'+V1+'V</b>, V\u2082=<b>'+V2+'V</b>. W=q\u0394V?',hints:['W=q(V\u2082-V\u2081)'],ans:W,tol:W*0.02,unit:'J',working:'W='+q.toExponential(2)+'\u00d7('+V2+'-'+V1+') = '+W+' J'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Fields',ti:'Capacitors in Electric Fields',su:'Apply C=\u03b5A/d. Calculate electric field between plates.',steps:[
  {lb:'Capacitance formula',dr:dQ7,ht:'<div class="fm">C = \u03b5\u2080\u03b5_r A/d (F)</div><p>\u03b5\u2080 = 8.85\u00d710\u207b\u00b9\u00b2 F/m. \u03b5_r = relative permittivity (1 for vacuum; ~4-5 for glass; ~80 for water). Larger A, smaller d, higher \u03b5_r \u2192 larger C. Between plates: E = V/d = Q/(\u03b5\u2080\u03b5_rA). Surface charge density \u03c3 = Q/A; E = \u03c3/\u03b5\u2080.</p>'},
  {lb:'Energy stored in capacitor',dr:dQ7,ht:'<div class="fm">E = \u00bdCV\u00b2 = \u00bdQV = Q\u00b2/(2C)</div><p>Energy density in electric field: u = \u00bd\u03b5\u2080E\u00b2 (J/m\u00b3). Total energy = u \u00d7 volume. Charging: half of energy from supply stored in capacitor, half dissipated in resistance (regardless of R value). Flash photography: capacitor stores energy, releases rapidly.</p>'},
  {lb:'Dielectric materials',dr:dQ7,ht:'<p>Dielectric: insulating material inserted between plates. Increases C by factor \u03b5_r. Polarisation: dipoles align with field; oppose field; reduce E inside; allow more charge at same V. Common dielectrics: paper (\u03b5_r \u22482), ceramic (\u03b5_r \u224810-1000), water (\u03b5_r \u224880). Applications: increase capacitance; prevent plates touching; increase breakdown voltage.</p>'},
  {lb:'Capacitors in series and parallel',dr:dQ7,ht:'<p>Series: 1/C_T = 1/C\u2081 + 1/C\u2082; same charge on each; voltages add. Parallel: C_T = C\u2081 + C\u2082; same voltage; charges add. Mixed: reduce step by step. Practical: capacitors have voltage ratings; series reduces voltage across each; parallel increases charge-storage capacity.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['C_from_Ad','E_between_plates','energy_stored']);if(type==='C_from_Ad'){var eps0=8.85e-12,A=rnd(100,5000)/10000,d=rnd(1,10)/1000,C=parseFloat((eps0*A/d).toExponential(2));return{question:'\u03b5\u2080=8.85\u00d710\u207b\u00b9\u00b2, A=<b>'+A.toFixed(4)+'m\u00b2</b>, d=<b>'+d.toFixed(3)+'m</b>. C?',hints:['C=\u03b5\u2080A/d'],ans:parseFloat(C),tol:parseFloat(C)*0.03,unit:'F',working:'C=8.85\u00d710\u207b\u00b9\u00b2\u00d7'+A.toFixed(4)+'/'+d.toFixed(3)+' = '+C+' F'};}if(type==='E_between_plates'){var V=rnd(10,1000),d=rnd(1,20)/1000,E=parseFloat((V/d).toFixed(1));return{question:'V=<b>'+V+'V</b>, d=<b>'+d.toFixed(3)+'m</b>. E between plates?',hints:['E=V/d'],ans:E,tol:E*0.02,unit:'V/m',working:'E='+V+'/'+d.toFixed(3)+' = '+E+' V/m'};}var C=rnd(1,100)*1e-6,V=rnd(10,500),E_stored=parseFloat((0.5*C*V*V).toFixed(4));return{question:'C=<b>'+C*1e6+'\u03bcF</b>, V=<b>'+V+'V</b>. Energy stored?',hints:['E=\u00bdCV\u00b2'],ans:E_stored,tol:E_stored*0.02,unit:'J',working:'E=0.5\u00d7'+C.toExponential(2)+'\u00d7'+V+'\u00b2 = '+E_stored+' J'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Fields',ti:'Field Lines and Equipotentials',su:'Draw and interpret field line and equipotential diagrams.',steps:[
  {lb:'Electric field lines',dr:dQ8,ht:'<p>Field lines start on + charges, end on - charges. Lines never cross. Direction: force on +ve test charge. Closer together: stronger field. Uniform field: parallel equally-spaced lines (between parallel plates). Radial field: lines spread out uniformly (point charge). Sphere: like point charge outside; zero field inside (Faraday cage).</p>'},
  {lb:'Gravitational field lines',dr:dQ8,ht:'<p>Gravitational field lines: point toward mass (attractive). Radial for sphere (point mass outside). Lines closer near surface. Uniform near surface (parallel lines pointing downward). Zero g inside hollow shell (shell theorem). g inside solid uniform sphere: decreases linearly to zero at centre.</p>'},
  {lb:'Equipotential surfaces',dr:dQ8,ht:'<p>Equipotentials: surfaces of constant potential; no work done moving along them; perpendicular to field lines. For point charge: concentric spheres. For uniform field: parallel planes. Conductor surface: always an equipotential (charges rearrange until E=0 inside conductor, E perpendicular to surface outside). Electric field always perpendicular to equipotentials.</p>'},
  {lb:'Field inside conductor',dr:dQ8,ht:'<p>Inside perfect conductor: E = 0 (any field would cause charge to move until it cancels). Charge distributes on surface. Electric shielding (Faraday cage). Enclosed space shielded from external electric fields. Used in: sensitive electronics, cable shielding (coaxial cable), microwave ovens (mesh on door). Note: magnetic fields still penetrate (not shielded).</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['E_uniform','V_point','E_inside']);if(type==='E_uniform'){var V=rnd(100,5000),d=rnd(1,100)/1000,E=parseFloat((V/d).toFixed(0));return{question:'Plates: V=<b>'+V+'V</b>, d=<b>'+(d*1000).toFixed(0)+'mm</b>. E?',hints:['E=V/d'],ans:E,tol:E*0.02,unit:'V/m',working:'E='+V+'/'+(d.toFixed(3))+' = '+E+' V/m'};}if(type==='V_point'){var k=8.99e9,Q=rnd(1,100)*1e-6,r=rnd(1,50)/100,V=parseFloat((k*Q/r).toFixed(0));return{question:'Q=<b>'+(Q*1e6).toFixed(0)+'\u03bcC</b>, r=<b>'+r.toFixed(2)+'m</b>. V?',hints:['V=kQ/r'],ans:V,tol:V*0.05,unit:'V',working:'V=8.99\u00d710\u2079\u00d7'+Q.toExponential(2)+'/'+r.toFixed(2)+' = '+V+' V'};}return{question:'Electric field strength inside a hollow conducting sphere?',hints:['Faraday cage: E=0 inside conductor'],ans:0,tol:0,unit:'V/m',working:'E=0 inside conducting shell (no net charge enclosed; Gauss: E=0)'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Fields',ti:'Inverse Square Laws and Field Comparisons',su:'Compare gravitational and electric inverse square laws.',steps:[
  {lb:'Inverse square law comparison',dr:dQ9,ht:'<p>Both obey same mathematical form: F = (constant \u00d7 product of sources)/r\u00b2. Gravity: F=GMm/r\u00b2; always attractive; constant G=6.67\u00d710\u207b\u00b9\u00b9 (very small). Electric: F=kQq/r\u00b2; attractive or repulsive; constant k=8.99\u00d710\u2079 (very large). Consequence: electric dominates at atomic scale; gravity dominates at cosmic scale.</p>'},
  {lb:'Ratio of forces',dr:dQ9,ht:'<p>For electron-proton pair: F_electric/F_gravity = ke\u00b2/(Gm_em_p) \u2248 2.3\u00d710\u00b3\u2079. Electric force is \u224810\u00b3\u2079 times stronger than gravity between fundamental particles. Why gravity dominates universe: matter is electrically neutral (charges cancel); gravity has no such cancellation; accumulates for all mass in a body.</p>'},
  {lb:'Shell theorem',dr:dQ9,ht:'<p>Gravitational shell theorem: spherically symmetric shell exerts zero gravitational force on objects inside it. Object inside Earth: only mass closer to centre contributes. g inside uniform Earth: g(r) = g_0(r/R); decreases linearly to zero at centre. Applies similarly to Gauss\u2019 law for electric fields: charge inside spherical surface gives field as if concentrated at centre.</p>'},
  {lb:'Gauss\'s law',dr:dQ9,ht:'<p>Gauss\u2019s law: total electric flux through closed surface = Q_enclosed/\u03b5\u2080. \u03a6 = \u222eE\u00b7dA = Q/\u03b5\u2080. Used to find field for symmetric charge distributions. Sphere: E = kQ/r\u00b2 (same as Coulomb). Infinite wire: E = \u03bb/(2\u03c0\u03b5\u2080r). Infinite plane: E = \u03c3/(2\u03b5\u2080). Gravitational equivalent: Gauss\u2019s law for gravity.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['inverse_sq_ratio','g_inside_earth','Gauss_sphere']);if(type==='inverse_sq_ratio'){var r1=rnd(1,5),r2=rnd(6,20),ratio=parseFloat((r2*r2/(r1*r1)).toFixed(1));return{question:'F\u2081 at r\u2081=<b>'+r1+'m</b>; r\u2082=<b>'+r2+'m</b>. Ratio F\u2081/F\u2082?',hints:['F\u221d1/r\u00b2; F\u2081/F\u2082=(r\u2082/r\u2081)\u00b2'],ans:ratio,tol:ratio*0.02,unit:'',working:'F\u2081/F\u2082=('+r2+'/'+r1+')\u00b2 = '+ratio};}if(type==='g_inside_earth'){var r_frac=rnd(10,90)/100,g0=9.81,g=parseFloat((g0*r_frac).toFixed(3));return{question:'Inside Earth at r=<b>'+(r_frac*100).toFixed(0)+'%</b> of radius. g?',hints:['g inside=g_0\u00d7(r/R)'],ans:g,tol:g*0.02,unit:'m/s\u00b2',working:'g=9.81\u00d7'+r_frac+' = '+g+' m/s\u00b2'};}var k=8.99e9,Q=rnd(1,100)*1e-9,r=rnd(1,50)/100,E=parseFloat((k*Q/(r*r)).toFixed(0));return{question:'Sphere Q=<b>'+(Q*1e9).toFixed(0)+'nC</b>. E at r=<b>'+r.toFixed(2)+'m</b> outside?',hints:['E=kQ/r\u00b2 (as if point charge)'],ans:E,tol:E*0.05,unit:'N/C',working:'E=8.99\u00d710\u2079\u00d7'+Q.toExponential(2)+'/'+r.toFixed(2)+'\u00b2 = '+E+' N/C'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Fields',ti:'Mixed Field Questions',su:'Integrated questions across all Y12-FIE-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>F_grav=GMm/r\u00b2. F_elec=kQq/r\u00b2. g=GM/r\u00b2. E_elec=kQ/r\u00b2. V_grav=-GM/r. V_elec=kQ/r. E=V/d (plates). C=\u03b5A/d. v_esc=\u221a(2gR). v_orbit=\u221a(GM/r). Bqv=mv\u00b2/r (charged particle in B). W=q\u0394V.</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC tests: gravitational force (Newton\u2019s law); g at different altitudes; escape velocity; electric force (Coulomb\u2019s law); electric field strength; capacitor charge and energy; orbital speed and period. Know both gravitational and electric formulae and when to apply each.</p>'},
