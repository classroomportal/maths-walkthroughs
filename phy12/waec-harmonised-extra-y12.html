<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'WAEC Y12 Physics — Key Topic Areas',ACC,13,'middle',true));
[['Mechanics','Newton\'s laws; SHM; energy; circular motion'],['Thermal','Gas laws; kinetic theory; heat transfer; radiation'],['Waves','Optics; sound; EM spectrum; interference'],['Electricity','Ohm\'s law; circuits; capacitors; transformers'],['Fields','Gravitational; electric; magnetic; induction'],['Nuclear','Decay; half-life; fission/fusion; E=mc\u00b2'],['Modern physics','Photoelectric; de Broglie; spectra; lasers']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(110,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){dQ1(p);}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ1(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ1(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ1(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'WAEC formula summary',ACC,13,'middle',true));
[['Motion','v=u+at; s=ut+\u00bdat\u00b2; v\u00b2=u\u00b2+2as'],['Forces','F=ma; p=mv; F=GMm/r\u00b2; F=BIL'],['Waves','v=f\u03bb; n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082; f\u2080=1/(2\u03c0\u221a(LC))'],['Electricity','V=IR; P=IV; \u03b5=V+Ir; C=Q/V'],['Thermal','Q=mc\u0394T; pV=nRT; E_k=\u00b3/\u2082kT'],['Nuclear','A=A\u2080e^(-\u03bbt); E=mc\u00b2; T\u00bd=ln2/\u03bb'],['Quantum','E=hf; \u03bb=h/mv; hf=\u03c6+KE_max']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(100,52+i*30,r[0],ACC,10,'middle',true));o.push(T(310,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 WAEC Revision',ti:'WAEC Mechanics Revision',su:'Key mechanics formulae and problem strategies.',steps:[
  {lb:'Equations of motion',dr:dQ1,ht:'<div class="fm">v=u+at \u2022 s=ut+\u00bdat\u00b2 \u2022 v\u00b2=u\u00b2+2as</div><p>Always: identify u, v, a, s, t; list known; select equation with unknown. Sign convention: choose + direction first; keep consistent. Free fall: a=9.81 m/s\u00b2 downward. Projectile: horizontal (constant v) and vertical (a=g) independent. Time of flight from vertical; range from horizontal.</p>'},
  {lb:'Newton\'s laws applied',dr:dQ1,ht:'<p>F=ma: draw free body diagram first; identify all forces; resultant \u2192 a. Connected objects: treat as system for a; then isolate for T. Lift: W_app=m(g\u00b1a). Slope: resolve along and perpendicular. Circular: Bqv or mv\u00b2/r centripetal. Gravity: F=GMm/r\u00b2. WAEC: always draw FBD before equations.</p>'},
  {lb:'Energy and momentum',dr:dQ1,ht:'<p>Energy: KE=\u00bdmv\u00b2; GPE=mgh; elastic PE=\u00bdkx\u00b2. W=Fs cos\u03b8. P=Fv. Efficiency=useful out/total in. Momentum p=mv. J=F\u0394t=\u0394p. Conservation: \u03a3p before=\u03a3p after (isolated). Elastic: KE also conserved. Inelastic: KE lost. WAEC: state conservation law explicitly.</p>'},
  {lb:'SHM and circular motion',dr:dQ1,ht:'<p>SHM: a=-\u03c9\u00b2x; T=2\u03c0/\u03c9; E_total=\u00bdm\u03c9\u00b2A\u00b2. Pendulum: T=2\u03c0\u221a(l/g). Spring: T=2\u03c0\u221a(m/k). Circular: F_c=mv\u00b2/r=m\u03c9\u00b2r. Centripetal force provided by: tension (string), gravity (orbit), normal (loop), friction (road bend). Never centrifugal in an inertial frame.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['SUVAT','F_ma','momentum']);if(type==='SUVAT'){var u=rnd(0,30),a=rnd(1,10),t=rnd(1,10),v=u+a*t;return{question:'u=<b>'+u+' m/s</b>, a=<b>'+a+' m/s\u00b2</b>, t=<b>'+t+' s</b>. v?',hints:['v=u+at'],ans:v,tol:0,unit:'m/s',working:'v='+u+'+'+a+'\u00d7'+t+' = '+v+' m/s'};}if(type==='F_ma'){var m=rnd(1,100),a=rnd(1,20),F=m*a;return{question:'m=<b>'+m+' kg</b>, a=<b>'+a+' m/s\u00b2</b>. F?',hints:['F=ma'],ans:F,tol:0,unit:'N',working:'F='+m+'\u00d7'+a+' = '+F+' N'};}var m1=rnd(2,20),v1=rnd(5,30),m2=rnd(2,20),vf=parseFloat((m1*v1/(m1+m2)).toFixed(2));return{question:'m\u2081=<b>'+m1+'kg</b> at <b>'+v1+' m/s</b> hits stationary m\u2082=<b>'+m2+'kg</b>, stick. v_f?',hints:['p conserved: m\u2081v\u2081=(m\u2081+m\u2082)v_f'],ans:vf,tol:vf*0.02,unit:'m/s',working:'v_f='+m1+'\u00d7'+v1+'/('+m1+'+'+m2+') = '+vf+' m/s'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 WAEC Revision',ti:'WAEC Electricity Revision',su:'Key electricity formulae and circuit analysis.',steps:[
  {lb:'Ohm\'s law and power',dr:dQ2,ht:'<div class="fm">V=IR \u2022 P=IV=I\u00b2R=V\u00b2/R \u2022 Q=It</div><p>Use the form of P that avoids needing unknown. Know: R_T(series)=\u03a3R; 1/R_T(parallel)=\u03a31/R. Kirchhoff: KVL (\u03a3V=0 around loop); KCL (\u03a3I_in=\u03a3I_out at junction). Internal resistance: \u03b5=V+Ir; V=terminal voltage.</p>'},
  {lb:'EMF and capacitors',dr:dQ2,ht:'<p>EMF \u03b5=V+Ir. V-I graph: y-intercept=\u03b5; gradient=-r. Capacitor: C=Q/V; E=\u00bdCV\u00b2; Q=CV. Series: 1/C_T=\u03a31/C. Parallel: C_T=\u03a3C. Time constant \u03c4=RC. V=V\u2080e^(-t/RC) discharge. Wheatstone bridge: P/Q=R/S at balance.</p>'},
  {lb:'AC and transformers',dr:dQ2,ht:'<p>V_rms=V\u2080/\u221a2. X_L=2\u03c0fL. X_C=1/(2\u03c0fC). Z=\u221a(R\u00b2+(X_L-X_C)\u00b2). f\u2080=1/(2\u03c0\u221a(LC)). P=I\u00b2R=I_rms V_rms cos\u03c6. Transformer: V_s/V_p=N_s/N_p; I_s/I_p=N_p/N_s. P_loss=I\u00b2R (transmission line). High V \u2192 low I \u2192 less P_loss.</p>'},
  {lb:'WAEC exam strategy for electricity',dr:dQ2,ht:'<p>Step 1: Identify circuit type (series/parallel/mixed). Step 2: Find equivalent resistance. Step 3: Find total current from source. Step 4: Apply KVL/KCL to find branch values. Step 5: Check with power balance (\u03a3P_components = \u03b5I). Common errors: wrong sign in KVL; using total current instead of branch current; not accounting for internal resistance.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['Ohm','power_P','parallel_R']);if(type==='Ohm'){var V=rnd(10,240),R=rnd(10,1000),I=parseFloat((V/R).toFixed(3));return{question:'V=<b>'+V+'V</b>, R=<b>'+R+'\u03a9</b>. I?',hints:['I=V/R'],ans:I,tol:I*0.02,unit:'A',working:'I='+V+'/'+R+' = '+I+' A'};}if(type==='power_P'){var I=rnd(1,20),R=rnd(10,500),P=I*I*R;return{question:'I=<b>'+I+'A</b>, R=<b>'+R+'\u03a9</b>. P=I\u00b2R?',hints:['P=I\u00b2R'],ans:P,tol:0,unit:'W',working:'P='+I+'\u00b2\u00d7'+R+' = '+P+' W'};}var R1=rnd(10,200),R2=rnd(10,200),RT=parseFloat((R1*R2/(R1+R2)).toFixed(2));return{question:'R\u2081=<b>'+R1+'\u03a9</b>, R\u2082=<b>'+R2+'\u03a9</b> parallel. R_T?',hints:['R_T=R\u2081R\u2082/(R\u2081+R\u2082)'],ans:RT,tol:RT*0.02,unit:'\u03a9',working:'R_T='+R1+'\u00d7'+R2+'/('+R1+'+'+R2+') = '+RT+' \u03a9'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 WAEC Revision',ti:'WAEC Waves Revision',su:'Key wave equations and optical formulae.',steps:[
  {lb:'Wave properties',dr:dQ3,ht:'<div class="fm">v=f\u03bb \u2022 n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082 \u2022 d sin\u03b8=n\u03bb</div><p>Speed, frequency, wavelength. Transverse vs longitudinal. Polarisation (transverse only). Interference: path diff=n\u03bb (constructive); (n+\u00bd)\u03bb (destructive). Fringe spacing y=\u03bbD/d. Stationary waves: nodes, antinodes; f_n=nv/(2L) string.</p>'},
  {lb:'Optics',dr:dQ3,ht:'<p>Refraction: n=c/v; Snell: n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082. TIR: sin\u03b8_c=n\u2082/n\u2081; above critical angle. Lens: 1/v+1/u=1/f; m=v/u. Mirror: same formula; f=r/2. Convex lens: real+virtual images. Concave lens: always virtual. Grating: d sin\u03b8=n\u03bb. Doppler: f_obs=f_s v/(v\u00b1v_s).</p>'},
  {lb:'Sound and EM',dr:dQ3,ht:'<p>Sound: longitudinal; v\u2248340 m/s; I=P/(4\u03c0r\u00b2); dB=10log(I/I\u2080). Beats: f_beat=|f\u2081-f\u2082|. EM: all travel at c in vacuum; v=f\u03bb; c=3\u00d710\u2078 m/s. Spectrum: radio\u2192micro\u2192IR\u2192visible\u2192UV\u2192X-ray\u2192gamma. Photon: E=hf. WAEC: know all parts of spectrum, wavelength ranges, and uses.</p>'},
  {lb:'WAEC exam strategy for waves',dr:dQ3,ht:'<p>Draw ray diagrams for optics questions (always). Use sign convention consistently. For interference: state conditions for maxima/minima before calculation. For stationary waves: draw diagram showing nodes/antinodes; count half-wavelengths. For Doppler: identify if source or observer is moving; correct sign (+/\u2212) for approach vs recession.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['wave_v','snell_law','fringe_y']);if(type==='wave_v'){var f=rnd(100,10000),lam=rnd(1,100)/100,v=parseFloat((f*lam).toFixed(2));return{question:'f=<b>'+f+' Hz</b>, \u03bb=<b>'+lam.toFixed(2)+' m</b>. v?',hints:['v=f\u03bb'],ans:v,tol:v*0.01,unit:'m/s',working:'v='+f+'\u00d7'+lam.toFixed(2)+' = '+v+' m/s'};}if(type==='snell_law'){var n2=pick([1.33,1.5,2.0]),th1=pick([20,30,40]),sinT=Math.sin(th1*Math.PI/180)/n2,th2=parseFloat((Math.asin(sinT)*180/Math.PI).toFixed(1));return{question:'n\u2081=1, n\u2082=<b>'+n2+'</b>, \u03b8\u2081=<b>'+th1+'\u00b0</b>. \u03b8\u2082?',hints:['n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082'],ans:th2,tol:0.5,unit:'\u00b0',working:'sin\u03b8\u2082=sin'+th1+'\u00b0/'+n2+'; \u03b8\u2082='+th2+'\u00b0'};}var lam=rnd(400,700)*1e-9,D=rnd(1,5),d=rnd(1,5)/1000,y=parseFloat((lam*D/d*1000).toFixed(2));return{question:'\u03bb=<b>'+Math.round(lam*1e9)+' nm</b>, D=<b>'+D+' m</b>, d=<b>'+d*1000+' mm</b>. Fringe y (mm)?',hints:['y=\u03bbD/d'],ans:y,tol:y*0.03,unit:'mm',working:'y='+lam.toExponential(2)+'\u00d7'+D+'/'+d+'\u00d710\u00b3 = '+y+' mm'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 WAEC Revision',ti:'WAEC Nuclear and Thermal Revision',su:'Nuclear decay, gas laws, heat energy — WAEC focus.',steps:[
  {lb:'Radioactivity revision',dr:dQ4,ht:'<p>\u03b1 decay: A-4, Z-2. \u03b2\u207b: A same, Z+1. \u03b3: no change. Half-life: A=A\u2080(1/2)^n=A\u2080e^(-\u03bbt). T\u00bd=ln2/\u03bb. E=mc\u00b2; 1u=931.5 MeV/c\u00b2. Fission: ~200 MeV per reaction. Fusion: D+T\u219217.6 MeV. Carbon dating: T\u00bd=5730 yr. Background subtracted from measured count rate.</p>'},
  {lb:'Thermal physics revision',dr:dQ4,ht:'<p>Q=mc\u0394T. Q=mL (phase change, no \u0394T). pV=nRT (T in Kelvin!). Boyle: p\u2081V\u2081=p\u2082V\u2082. Charles: V\u2081/T\u2081=V\u2082/T\u2082. E_k=\u00b3/\u2082kT per molecule. \u0394U=Q+W (1st law). Carnot: \u03b7=1-T_c/T_h. Wien: \u03bb_maxT=b. Stefan: P=\u03c3AT\u2074. P_cond=kA\u0394T/d.</p>'},
  {lb:'Fields revision',dr:dQ4,ht:'<p>Gravity: F=GMm/r\u00b2; g=GM/r\u00b2; v_esc=\u221a(2gR); v_orbit=\u221a(GM/r); T\u00b2\u221dr\u00b3. Electric: F=kQq/r\u00b2; E=kQ/r\u00b2; V=kQ/r; E=V/d (plates); C=\u03b5A/d. Magnetic: F=BIL; F=Bqv; r=mv/(Bq); \u03b5=N\u0394\u03a6/\u0394t; \u03b5=BvL. V_s/V_p=N_s/N_p (transformer).</p>'},
  {lb:'Quantum and modern physics revision',dr:dQ4,ht:'<p>E=hf=hc/\u03bb. Photoelectric: hf=\u03c6+KE_max; f\u2080=\u03c6/h. de Broglie: \u03bb=h/(mv). Hydrogen: E_n=-13.6/n\u00b2 eV. Heisenberg: \u0394x\u0394p\u2265h/(4\u03c0). Compton: \u0394\u03bb=(h/m_ec)(1-cos\u03b8). Pair production: E\u22652m_ec\u00b2=1.022 MeV. LED: E=hf=E_gap. h=6.63\u00d710\u207b\u00b3\u2074 J s.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['half_life','gas_law','photon_E']);if(type==='half_life'){var n=rnd(1,5),A0=rnd(1000,50000),A=parseFloat((A0*Math.pow(0.5,n)).toFixed(0));return{question:'A\u2080=<b>'+A0+' Bq</b>; n=<b>'+n+'</b> half-lives. A?',hints:['A=A\u2080(1/2)^n'],ans:A,tol:A*0.02,unit:'Bq',working:'A='+A0+'\u00d7(1/2)^'+n+' = '+A+' Bq'};}if(type==='gas_law'){var p1=rnd(100,500),V1=rnd(1,20),p2=rnd(200,1000),V2=parseFloat((p1*V1/p2).toFixed(2));return{question:'Boyle: p\u2081=<b>'+p1+' kPa</b>, V\u2081=<b>'+V1+' L</b>, p\u2082=<b>'+p2+' kPa</b>. V\u2082?',hints:['p\u2081V\u2081=p\u2082V\u2082'],ans:V2,tol:V2*0.02,unit:'L',working:'V\u2082='+p1+'\u00d7'+V1+'/'+p2+' = '+V2+' L'};}var lam=rnd(100,700)*1e-9,E=parseFloat((6.63e-34*3e8/lam/1.6e-19).toFixed(2));return{question:'\u03bb=<b>'+Math.round(lam*1e9)+' nm</b>. Photon E (eV)?',hints:['E=hc/\u03bb; /1.6\u00d710\u207b\u00b9\u2079'],ans:E,tol:E*0.03,unit:'eV',working:'E=hc/\u03bb/e = '+E+' eV'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 WAEC Revision',ti:'Mixed WAEC Exam Practice',su:'Mixed questions across all Y12 topics — exam conditions.',steps:[
  {lb:'Exam strategy',dr:dQ5,ht:'<p>WAEC Physics exam tips: (1) Read question carefully; note all given values and unit. (2) Draw diagram if relevant (FBD, ray diagram, circuit). (3) State the formula first. (4) Substitute values with units. (5) Show calculation. (6) State answer with correct unit and significant figures. (7) Check: is the magnitude reasonable?</p>'},
  {lb:'Common errors to avoid',dr:dQ5,ht:'<p>Most common WAEC errors: (1) Not converting to SI units (g not kg; km not m; \u00b0C not K). (2) Forgetting to square in P=I\u00b2R or E=\u00bdmv\u00b2. (3) Using wrong form of P (use I\u00b2R when R and I given; V\u00b2/R when V and R given). (4) Not drawing FBD before mechanics question. (5) Using Celsius instead of Kelvin in gas law. (6) Confusing mass number and atomic number in nuclear equations.</p>'},
  {lb:'Data booklet formulae',dr:dQ5,ht:'<p>Key formulae you must know (not always in data booklet): F=ma; W=mg; KE=\u00bdmv\u00b2; GPE=mgh; p=mv; P=Fv; Q=mc\u0394T; V=IR; P=IV; C=Q/V; v=f\u03bb; n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082; E=hf; \u03bb=h/mv; F=GMm/r\u00b2; A=A\u2080e^(-\u03bbt); E=mc\u00b2. Learn all of these by heart.</p>'},
  {lb:'Units and dimensions',dr:dQ5,ht:'<p>SI base units: m, kg, s, A, K, mol, cd. Derived: N=kg m/s\u00b2; J=kg m\u00b2/s\u00b2=N m; W=J/s; Pa=N/m\u00b2; C=A s; V=J/C; \u03a9=V/A; F=C/V; T=kg/As\u00b2=N/Am; Wb=V s. Checking dimensions: if units on both sides match, equation dimensionally correct (necessary but not sufficient for correctness).</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['mechanics','electricity','thermal']);if(type==='mechanics'){var m=rnd(1,100),v=rnd(5,50),KE=parseFloat((0.5*m*v*v).toFixed(0));return{question:'m=<b>'+m+' kg</b>, v=<b>'+v+' m/s</b>. KE?',hints:['KE=\u00bdmv\u00b2'],ans:KE,tol:KE*0.01,unit:'J',working:'KE=0.5\u00d7'+m+'\u00d7'+v+'\u00b2 = '+KE+' J'};}if(type==='electricity'){var V=rnd(10,240),R=rnd(10,1000),I=parseFloat((V/R).toFixed(3)),P=parseFloat((V*I).toFixed(1));return{question:'V=<b>'+V+'V</b>, R=<b>'+R+'\u03a9</b>. P=IV?',hints:['I=V/R; P=IV=V\u00b2/R'],ans:P,tol:P*0.02,unit:'W',working:'P=V\u00b2/R='+V+'\u00b2/'+R+' = '+P+' W'};}var m=rnd(1,20),c=4200,dT=rnd(10,80),Q=m*c*dT;return{question:'m=<b>'+m+' kg</b> water, \u0394T=<b>'+dT+' K</b>. Q (c=4200)?',hints:['Q=mc\u0394T'],ans:Q,tol:0,unit:'J',working:'Q='+m+'\u00d74200\u00d7'+dT+' = '+Q+' J'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 WAEC Revision',ti:'Past Paper Style — Mechanics',su:'Past-exam-style questions on mechanics.',steps:[
  {lb:'Projectile motion',dr:dQ6,ht:'<p>Resolve into horizontal (constant v_x=v_0 cos\u03b8) and vertical (a=g). Time to peak: t_peak=v_y0/g. Total time: T=2t_peak. Range: R=v_x\u00d7T. Max height: H=v_y0\u00b2/(2g). For 45\u00b0 launch: maximum range. Same range for 30\u00b0 and 60\u00b0 (complementary angles). Air resistance neglected unless stated.</p>'},
  {lb:'Work-energy theorem',dr:dQ6,ht:'<p>Net work done = change in KE: W_net = \u0394KE = \u00bdmv\u00b2 - \u00bdmu\u00b2. Work done by each force = F\u00d7s\u00d7cos\u03b8 (angle between force and displacement). Friction does negative work (opposes motion). Energy approach: avoids need to find acceleration; often quicker for inclined planes or rough surfaces.</p>'},
  {lb:'Rotational mechanics',dr:dQ6,ht:'<p>Torque \u03c4 = F\u00d7d (perpendicular distance). Equilibrium: \u03a3F=0; \u03a3\u03c4=0. Moment of couple: F\u00d7d (two equal opposite parallel forces). Archimedes: buoyancy = weight of fluid displaced = \u03c1_fluid\u00d7V\u00d7g. Floats when \u03c1_object < \u03c1_fluid. Centre of gravity: point where weight acts; stability when CG low and base wide.</p>'},
  {lb:'Fluids',dr:dQ6,ht:'<p>Pressure: p=F/A=\u03c1gh (at depth h). Pascal\u2019s law: pressure transmitted equally in all directions in enclosed fluid. Bernoulli: p+\u00bd\u03c1v\u00b2+\u03c1gh=const (along streamline). Continuity: A\u2081v\u2081=A\u2082v\u2082 (for incompressible fluid). Viscosity: F=\u03b7Av/d (Newton\u2019s law of viscosity). Stokes\u2019 law: F_drag=6\u03c0\u03b7rv (sphere at low speed).</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['projectile_R','work_energy','pressure']);if(type==='projectile_R'){var v=rnd(10,50),theta=45,R=parseFloat((v*v*Math.sin(2*theta*Math.PI/180)/9.81).toFixed(1));return{question:'Projectile v=<b>'+v+' m/s</b>, \u03b8=45\u00b0. Range R?',hints:['R=v\u00b2sin(2\u03b8)/g'],ans:R,tol:R*0.02,unit:'m',working:'R='+v+'\u00b2\u00d7sin90\u00b0/9.81 = '+R+' m'};}if(type==='work_energy'){var m=rnd(5,50),u=rnd(0,10),v=rnd(15,40),dKE=parseFloat((0.5*m*(v*v-u*u)).toFixed(0));return{question:'m=<b>'+m+'kg</b>, u=<b>'+u+' m/s</b>, v=<b>'+v+' m/s</b>. Net work done?',hints:['W_net=\u0394KE=\u00bdm(v\u00b2-u\u00b2)'],ans:dKE,tol:dKE*0.01,unit:'J',working:'W=0.5\u00d7'+m+'\u00d7('+v+'\u00b2-'+u+'\u00b2) = '+dKE+' J'};}var rho=rnd(500,2000),h=rnd(1,20),p=parseFloat((rho*9.81*h).toFixed(0));return{question:'\u03c1=<b>'+rho+' kg/m\u00b3</b>, h=<b>'+h+' m</b>. Pressure?',hints:['p=\u03c1gh'],ans:p,tol:p*0.02,unit:'Pa',working:'p='+rho+'\u00d79.81\u00d7'+h+' = '+p+' Pa'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 WAEC Revision',ti:'Past Paper Style — Electricity and Magnetism',su:'Past-exam-style questions on E&M.',steps:[
  {lb:'Complex circuits',dr:dQ7,ht:'<p>Mixed series-parallel: (1) Combine parallel branches: R_p=R\u2081R\u2082/(R\u2081+R\u2082). (2) Add series elements. (3) Find I from V/R_T. (4) V across parallel section = I\u00d7R_p. (5) Individual branch currents: I_n=V_parallel/R_n. Check: \u03a3I_branches=I_total; \u03a3V_drops=\u03b5.</p>'},
  {lb:'EM induction calculations',dr:dQ7,ht:'<p>Faraday: \u03b5=N\u0394\u03a6/\u0394t. \u03a6=BA cos\u03b8. \u03b5=BvL (moving rod). Direction: Lenz\u2019s law (opposes change). Transformer: V_s/V_p=N_s/N_p; I_p/I_s=N_s/N_p (ideal). Power loss in cables: P=I\u00b2R; to minimise use high V, low I. Eddy currents: reduced by laminating core.</p>'},
  {lb:'Magnetic force problems',dr:dQ7,ht:'<p>F=BIL (on conductor): direction from Fleming LEFT-HAND rule (FBI). F=Bqv (on moving charge): direction from right-hand rule (positive charge). Circular motion: r=mv/(Bq); T=2\u03c0m/(Bq). Hall effect: V_H=BI/(nqd). Mass spectrometer: r=(1/B)\u221a(2mV/q); identify ions by r.</p>'},
  {lb:'Semiconductor and diodes',dr:dQ7,ht:'<p>p-n junction: forward bias (V>0.7V Si): conducts; reverse bias: blocks. Rectification: half-wave (1 diode); full-wave bridge (4 diodes). Smoothing: capacitor reduces ripple. Transistor (NPN): I_C=h_FE\u00d7I_B; switch or amplifier. Zener diode: voltage regulator; maintains constant V_out at V_Z. LED: photon emitted at E=hf=E_gap.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['transformer_V','F_BIL','EMF_BvL']);if(type==='transformer_V'){var Np=rnd(100,2000),Ns=rnd(100,2000),Vp=rnd(100,400),Vs=parseFloat((Vp*Ns/Np).toFixed(1));return{question:'N_p=<b>'+Np+'</b>, N_s=<b>'+Ns+'</b>, V_p=<b>'+Vp+' V</b>. V_s?',hints:['V_s=V_p\u00d7N_s/N_p'],ans:Vs,tol:Vs*0.02,unit:'V',working:'V_s='+Vp+'\u00d7'+Ns+'/'+Np+' = '+Vs+' V'};}if(type==='F_BIL'){var B=rnd(1,20)/100,I=rnd(1,20),L=rnd(10,100)/100,F=parseFloat((B*I*L).toFixed(4));return{question:'B=<b>'+B+' T</b>, I=<b>'+I+' A</b>, L=<b>'+L.toFixed(2)+' m</b>. F=BIL?',hints:['F=BIL'],ans:F,tol:F*0.03,unit:'N',working:'F='+B+'\u00d7'+I+'\u00d7'+L.toFixed(2)+' = '+F+' N'};}var B=rnd(1,20)/100,v=rnd(1,50),L=rnd(10,100)/100,EMF=parseFloat((B*v*L).toFixed(3));return{question:'B=<b>'+B+' T</b>, v=<b>'+v+' m/s</b>, L=<b>'+L.toFixed(2)+' m</b>. \u03b5=BvL?',hints:['\u03b5=BvL'],ans:EMF,tol:EMF*0.03,unit:'V',working:'\u03b5='+B+'\u00d7'+v+'\u00d7'+L.toFixed(2)+' = '+EMF+' V'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 WAEC Revision',ti:'Past Paper Style — Waves and Optics',su:'Past-exam-style questions on waves.',steps:[
  {lb:'Geometric optics',dr:dQ8,ht:'<p>Mirror/lens formula: 1/v+1/u=1/f; m=v/u. Sign convention: real is positive. Concave mirror/lens f>0; convex f<0. Images: real if v>0 (formed by actual rays); virtual if v<0. Draw ray diagrams: (1) parallel to axis \u2192 through focus; (2) through focus \u2192 parallel; (3) through centre \u2192 straight. WAEC: label image position, type (real/virtual), orientation (erect/inverted), size (magnified/diminished).</p>'},
  {lb:'Wave behaviour',dr:dQ8,ht:'<p>Reflection: angle of incidence = angle of reflection (measured from normal). Refraction: n=c/v; Snell\u2019s law. Diffraction: waves spread around obstacles; most when \u03bb \u2248 gap size. Interference: two coherent sources; constructive (path diff=n\u03bb); destructive ((n+\u00bd)\u03bb). Polarisation: transverse waves only; Malus\u2019 law I=I\u2080cos\u00b2\u03b8.</p>'},
  {lb:'Stationary waves',dr:dQ8,ht:'<p>Formed by two waves of same amplitude/frequency travelling in opposite directions. Nodes (zero displacement) and antinodes (maximum) at fixed positions. String (fixed ends): L=n\u03bb/2; f_n=nv/(2L). Closed pipe: L=(2n-1)\u03bb/4; f_n=(2n-1)v/(4L). Open pipe: L=n\u03bb/2; f_n=nv/(2L). Node at fixed end; antinode at open end.</p>'},
  {lb:'Optical instruments',dr:dQ8,ht:'<p>Telescope (normal adjustment): m=f_o/f_e; length=f_o+f_e. Microscope: total m=m_obj\u00d7m_eye. Spectroscope: diffraction grating separates wavelengths; d sin\u03b8=n\u03bb. Electron microscope: de Broglie wavelength of electrons (\u03bb=h/mv) much smaller than light; better resolution. Resolution limit: Rayleigh criterion \u03b8=1.22\u03bb/D.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['lens_v','stationary_f1','grating']);if(type==='lens_v'){var u=rnd(20,100),f=rnd(5,u-1),v=parseFloat((1/(1/f-1/u)).toFixed(1));return{question:'Convex lens: u=<b>'+u+' cm</b>, f=<b>'+f+' cm</b>. Image distance v?',hints:['1/v=1/f-1/u'],ans:v,tol:Math.abs(v)*0.03,unit:'cm',working:'1/v=1/'+f+'-1/'+u+'; v='+v+' cm'};}if(type==='stationary_f1'){var L=rnd(10,100)/100,v=340,f=parseFloat((v/(2*L)).toFixed(1));return{question:'String L=<b>'+L.toFixed(2)+' m</b>, v=340 m/s. Fundamental frequency?',hints:['f\u2081=v/(2L)'],ans:f,tol:f*0.02,unit:'Hz',working:'f\u2081=340/(2\u00d7'+L.toFixed(2)+') = '+f+' Hz'};}var N=rnd(300,600),d=1/N*1e-3,lam=rnd(400,700)*1e-9,theta=parseFloat((Math.asin(lam/d)*180/Math.PI).toFixed(1));return{question:'Grating <b>'+N+' lines/mm</b>, \u03bb=<b>'+Math.round(lam*1e9)+' nm</b>, n=1. Angle?',hints:['d sin\u03b8=n\u03bb; d=1/('+N+'mm\u207b\u00b9)'],ans:theta,tol:0.5,unit:'\u00b0',working:'sin\u03b8=\u03bb/d; \u03b8='+theta+'\u00b0'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 WAEC Revision',ti:'Past Paper Style — Nuclear and Quantum',su:'Past-exam-style nuclear and quantum questions.',steps:[
  {lb:'Nuclear equations',dr:dQ9,ht:'<p>Write complete nuclear equation: \u1d2f\u1d2f\u1d2f_Z^A X \u2192 products; balance A and Z. \u03b1: lose \u2074\u2082He; A-4, Z-2. \u03b2\u207b: gain proton; A same, Z+1; emit e\u207b and antineutrino. \u03b2\u207a: lose proton; A same, Z-1; emit e\u207a and neutrino. \u03b3: same A and Z; emit high-energy photon. Q-value: Q=(m_reactants-m_products)c\u00b2; positive=exothermic.</p>'},
  {lb:'Half-life calculations',dr:dQ9,ht:'<p>After n half-lives: N=N\u2080/2\u207f; A=A\u2080/2\u207f. n=t/T\u00bd. Alternatively: A=A\u2080e^(-\u03bbt). T\u00bd=ln2/\u03bb=0.693/\u03bb. Activity A=\u03bbN. N=m\u00d7N_A/M. Corrected count: subtract background. Plot: ln(A) vs t: gradient=-\u03bb; intercept=ln(A\u2080). WAEC: show all substitutions with units.</p>'},
  {lb:'Quantum physics calculations',dr:dQ9,ht:'<p>E=hf=hc/\u03bb. Photoelectric: hf=\u03c6+KE_max; eV_s=KE_max; f\u2080=\u03c6/h. de Broglie: \u03bb=h/(mv); v=h/(m\u03bb). Energy levels: E=hf=E_upper-E_lower. Hydrogen: E_n=-13.6/n\u00b2 eV. LED: E_gap=hf=hc/\u03bb. X-ray \u03bb_min=hc/(eV). Compton: \u0394\u03bb=(h/m_ec)(1-cos\u03b8). 1 eV=1.6\u00d710\u207b\u00b9\u2079 J; h=6.63\u00d710\u207b\u00b3\u2074 J s.</p>'},
  {lb:'Nuclear energy',dr:dQ9,ht:'<p>E=\u0394mc\u00b2. \u0394m in kg: E in J. \u0394m in u: E=\u0394m\u00d7931.5 MeV. 1 u=1.66\u00d710\u207b\u00b2\u2077 kg. BE=(Zm_p+Nm_n-m_nucleus)c\u00b2. BE/A peaks at Fe-56 (most stable). Fission: U/Pu \u2192 lighter fragments (higher BE/A); energy released. Fusion: H+H\u2192He (highest BE/A gain); energy released. WAEC: calculate Q-value from mass data.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['decay_equation','de_Broglie','mass_energy']);if(type==='decay_equation'){var Z=rnd(84,92),A=rnd(200,238),Zp=Z-2,Ap=A-4;return{question:'\u1d2f\u1d2f_'+Z+'^'+A+'X undergoes \u03b1 decay. A of product?',hints:['\u03b1 decay: A\u22124, Z\u22122'],ans:Ap,tol:0,unit:'(Z becomes '+(Zp)+')',working:'A_product='+A+'-4='+Ap+'; Z_product='+Z+'-2='+Zp};}if(type==='de_Broglie'){var m=9.11e-31,v=rnd(1,100)*1e6,lam=parseFloat((6.63e-34/(m*v)).toExponential(2));return{question:'Electron v=<b>'+v.toExponential(2)+' m/s</b>. \u03bb?',hints:['\u03bb=h/(mv)'],ans:parseFloat(lam),tol:parseFloat(lam)*0.05,unit:'m',working:'\u03bb=6.63\u00d710\u207b\u00b3\u2074/(9.11\u00d710\u207b\u00b3\u00b9\u00d7'+v.toExponential(2)+') = '+lam+' m'};}var dm=rnd(1,10)*1e-29,E=parseFloat((dm*9e16).toExponential(2));return{question:'\u0394m=<b>'+dm.toExponential(2)+' kg</b>. E=mc\u00b2?',hints:['E=\u0394m\u00d7c\u00b2; c\u00b2=9\u00d710\u00b9\u2076'],ans:parseFloat(E),tol:parseFloat(E)*0.05,unit:'J',working:'E='+dm.toExponential(2)+'\u00d79\u00d710\u00b9\u2076 = '+E+' J'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 WAEC Revision',ti:'Final WAEC Mixed Practice',su:'Final integrated revision across all Y12 Physics topics.',steps:[
  {lb:'All topics summary',dr:dQ10,ht:'<p>Mechanics: F=ma; p=mv; KE=\u00bdmv\u00b2; W=Fs. Thermal: Q=mc\u0394T; pV=nRT; E=\u00b3/\u2082kT. Waves: v=f\u03bb; y=\u03bbD/d; d sin\u03b8=n\u03bb. Electricity: V=IR; P=IV; C=Q/V. Fields: F=GMm/r\u00b2; F=kQq/r\u00b2; F=BIL. Nuclear: A=A\u2080e^(-\u03bbt); E=mc\u00b2. Quantum: E=hf; \u03bb=h/mv; hf=\u03c6+KE.</p>'},
  {lb:'WAEC marking criteria',dr:dQ10,ht:'<p>WAEC awards marks for: (1) Correct formula stated. (2) Correct substitution with units. (3) Correct answer with unit. Three marks for showing all three. Even if arithmetic wrong, get 2/3 for formula + substitution. Write clearly; state formula FIRST; then substitute; then evaluate. Diagrams: draw carefully; label all quantities; include scale if asked.</p>'},

  {lb:'Final formulae',dr:dQ10,ht:'<div class="fm">F=ma \u2022 P=IV \u2022 E=hf \u2022 A=A\u2080e^(-\u03bbt)</div><div class="fm">v=f\u03bb \u2022 Q=mc\u0394T \u2022 F=GMm/r\u00b2 \u2022 E=mc\u00b2</div>'},
