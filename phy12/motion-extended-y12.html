<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Kinematics equations',ACC,13,'middle',true));
[['v = u + at','velocity after time t'],['s = ut + \u00bdut\u00b2','displacement (use at\u00b2!)'],['v\u00b2 = u\u00b2 + 2as','no time involved'],['s = (u+v)t/2','average velocity method'],['s = vt - \u00bdat\u00b2','alternative form']].forEach(function(r,i){if(i<=p){o.push(R(10,38+i*42,460,34,CRM,LINE,1));o.push(T(200,58+i*42,r[0],DARK,12,'middle',true));o.push(T(360,58+i*42,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Projectile motion',ACC,12,'middle',true));
o.push(R(10,36,460,44,CRM,ACC,2));o.push(T(240,54,'Horizontal: x = v_x t (constant velocity)','#333',10,'middle',false));o.push(T(240,72,'Vertical: y = u_y t - \u00bdgt\u00b2 (constant acceleration g)','#555',9,'middle',false));
if(p>=1){o.push(R(10,90,460,40,CRM,ACC,1.5));o.push(T(240,106,'Initial: v_x = v\u2080cos\u03b8, u_y = v\u2080sin\u03b8','#333',10,'middle',false));o.push(T(240,124,'At max height: v_y = 0 \u2192 t_up = u_y/g','#555',9,'middle',false));}
if(p>=2){o.push(R(10,140,460,40,CRM,ACC,1.5));o.push(T(240,156,'Range R = v_x \u00d7 total time = v\u2080\u00b2sin2\u03b8/g','#333',10,'middle',false));o.push(T(240,174,'Max range at \u03b8 = 45\u00b0; max height at \u03b8 = 90\u00b0','#555',9,'middle',false));}
if(p>=3){o.push(R(10,190,460,40,CRM,ACC,1.5));o.push(T(240,206,'Speed at any point: v = \u221a(v_x\u00b2 + v_y\u00b2)','#333',10,'middle',false));o.push(T(240,224,'Direction: \u03b1 = arctan(v_y/v_x) below horizontal','#555',9,'middle',false));}
if(p>=4){o.push(R(10,238,460,18,LINE,ACC,0.5));o.push(T(240,250,'Air resistance neglected in standard projectile model','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Motion \u2014 summary',ACC,13,'middle',true));
[['v = u+at','constant acceleration; t in seconds'],['s = ut+\u00bdgt\u00b2','s correct sign convention!'],['v\u00b2 = u\u00b2+2as','no time; useful for collision problems'],['Projectile x','v\u2080cos\u03b8 \u00d7 t; constant'],['Projectile y','u_y t - \u00bdgt\u00b2; g = 9.81 m/s\u00b2 downward'],['Range','v\u2080\u00b2sin2\u03b8/g; max at 45\u00b0'],['Speed','v=\u221a(v_x\u00b2+v_y\u00b2) at any instant']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Motion',ti:'Equations of Uniform Motion',su:'Apply the four kinematics equations to 1D problems.',steps:[
  {lb:'The four equations',dr:dQ1,ht:'<p>For <b>constant acceleration</b> only: v = u+at; s = ut+\u00bdat\u00b2; v\u00b2 = u\u00b2+2as; s = (u+v)t/2. Note: \u00bdat\u00b2 not \u00bdut\u00b2! These connect u, v, a, s, t. Choose the equation that has your unknown and excludes the variable you don\u2019t know or need.</p>'},
  {lb:'Sign conventions',dr:dQ1,ht:'<p>Assign positive direction (usually upward or right). Negative: opposite direction. Deceleration: acceleration opposite to motion direction, so a is negative if velocity is positive. Free fall from rest: u=0, a=\u22129.81 m/s\u00b2 (taking up as positive) or a=+9.81 (taking down as positive).</p>'},
  {lb:'Strategy',dr:dQ1,ht:'<p>Strategy: (1) List known and unknown quantities. (2) Choose equation with your unknown. (3) Substitute with consistent units (SI). (4) Solve algebraically first, then substitute numbers. (5) Check sign of answer is physically sensible.</p>'},
  {lb:'Multi-stage problems',dr:dQ1,ht:'<p>For problems with different phases (e.g. braking after cruising), apply equations separately to each phase. Final velocity of first phase = initial velocity of next. WAEC: always state which equation you are using.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['v_from_t','s_from_t','v_from_s']);if(type==='v_from_t'){var u=rnd(0,20),a=rnd(1,10),t=rnd(1,10),v=u+a*t;return{question:'u=<b>'+u+' m/s</b>, a=<b>'+a+' m/s\u00b2</b>, t=<b>'+t+' s</b>. Find v.',hints:['v = u + at'],ans:v,tol:0,unit:'m/s',working:'v='+u+'+'+a+'\u00d7'+t+' = '+v+' m/s'};}if(type==='s_from_t'){var u=rnd(0,20),a=rnd(1,10),t=rnd(1,8),s=parseFloat((u*t+0.5*a*t*t).toFixed(1));return{question:'u=<b>'+u+' m/s</b>, a=<b>'+a+' m/s\u00b2</b>, t=<b>'+t+' s</b>. Find s.',hints:['s = ut + \u00bdat\u00b2'],ans:s,tol:s*0.02,unit:'m',working:'s='+u+'\u00d7'+t+'+0.5\u00d7'+a+'\u00d7'+t+'\u00b2 = '+s+' m'};}var u=rnd(0,20),a=rnd(1,10),s=rnd(10,200),v=parseFloat(Math.sqrt(u*u+2*a*s).toFixed(2));return{question:'u=<b>'+u+' m/s</b>, a=<b>'+a+' m/s\u00b2</b>, s=<b>'+s+' m</b>. Find v.',hints:['v\u00b2 = u\u00b2 + 2as'],ans:v,tol:v*0.02,unit:'m/s',working:'v=\u221a('+u+'\u00b2+2\u00d7'+a+'\u00d7'+s+') = '+v+' m/s'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Motion',ti:'Projectile Motion',su:'Analyse projectile motion. Calculate range, time of flight and speed.',steps:[
  {lb:'Projectile principle',dr:dQ2,ht:'<p>A projectile has: <b>constant horizontal velocity</b> v_x = v\u2080cos\u03b8 (no horizontal force), <b>vertical acceleration g downward</b>. Horizontal and vertical motions are independent. Analyse separately, linked only by time t.</p>'},
  {lb:'Time of flight and max height',dr:dQ2,ht:'<p>Time to max height: t_up = u_y/g where u_y = v\u2080sin\u03b8. Total flight time: T = 2t_up (symmetric for flat ground). Max height: H = u_y\u00b2/(2g). Range: R = v_x \u00d7 T = v\u2080\u00b2 sin2\u03b8/g. Maximum range at \u03b8 = 45\u00b0.</p>'},
  {lb:'Velocity at any point',dr:dQ2,ht:'<p>At time t: v_x = v\u2080cos\u03b8 (constant); v_y = u_y \u2212 gt. Speed: v = \u221a(v_x\u00b2 + v_y\u00b2). Direction: \u03b1 = arctan(|v_y|/v_x) below horizontal. At max height: v_y = 0, so speed = v_x = v\u2080cos\u03b8 (minimum speed in flight).</p>'},
  {lb:'Horizontal launch',dr:dQ2,ht:'<p>Object launched horizontally (u_y=0): y = \u00bdgt\u00b2ey, x = v_x t. Time to fall height h: t = \u221a(2h/g). Range: x = v_x\u221a(2h/g). Speed at ground: v = \u221a(v_x\u00b2 + v_y\u00b2) where v_y = gt = \u221a(2gh).</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['time_up','range','H_max']);if(type==='time_up'){var v0=rnd(10,50),th=pick([30,37,45,53,60]),uy=parseFloat((v0*Math.sin(th*Math.PI/180)).toFixed(2)),t_up=parseFloat((uy/9.81).toFixed(3));return{question:'v\u2080=<b>'+v0+' m/s</b>, \u03b8=<b>'+th+'\u00b0</b>. Time to max height?',hints:['t_up = u_y/g; u_y = v\u2080 sin\u03b8'],ans:t_up,tol:t_up*0.02,unit:'s',working:'u_y='+v0+' sin'+th+'\u00b0='+uy+'; t='+uy+'/9.81 = '+t_up+' s'};}if(type==='range'){var v0=rnd(10,50),th=pick([30,37,45,53,60]),R=parseFloat((v0*v0*Math.sin(2*th*Math.PI/180)/9.81).toFixed(2));return{question:'v\u2080=<b>'+v0+' m/s</b>, \u03b8=<b>'+th+'\u00b0</b>. Horizontal range?',hints:['R = v\u2080\u00b2 sin2\u03b8/g'],ans:R,tol:R*0.02,unit:'m',working:'R='+v0+'\u00b2\u00d7sin('+2*th+'\u00b0)/9.81 = '+R+' m'};}var v0=rnd(10,50),th=pick([30,45,60]),uy=v0*Math.sin(th*Math.PI/180),H=parseFloat((uy*uy/(2*9.81)).toFixed(2));return{question:'v\u2080=<b>'+v0+' m/s</b>, \u03b8=<b>'+th+'\u00b0</b>. Maximum height?',hints:['H = u_y\u00b2/(2g); u_y = v\u2080 sin\u03b8'],ans:H,tol:H*0.02,unit:'m',working:'u_y='+v0+' sin'+th+'\u00b0; H=u_y\u00b2/(2\u00d79.81) = '+H+' m'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Motion',ti:'Velocity-Time Graphs',su:'Interpret and draw v-t graphs. Calculate acceleration and displacement.',steps:[
  {lb:'Reading v-t graphs',dr:dQ3,ht:'<p>Slope (gradient) of v-t graph = acceleration. Positive slope: accelerating. Negative slope: decelerating (in positive direction) or accelerating in negative direction. Horizontal: constant velocity (zero acceleration). Area under v-t graph = displacement (or distance if always positive).</p>'},
  {lb:'Area calculations',dr:dQ3,ht:'<p>Area under v-t graph: rectangle = v \u00d7 t; triangle = \u00bd base \u00d7 height; trapezium = \u00bd(v\u2081+v\u2082)t. For complex shapes: split into simple areas. Negative area (below t-axis): displacement in negative direction; add to find total distance.</p>'},
  {lb:'Multi-phase motion',dr:dQ3,ht:'<p>Real motion often has phases: (1) constant acceleration; (2) constant velocity; (3) deceleration. Analyse each phase separately using kinematics equations. Link phases: final v of one = initial v of next. Total displacement = sum of displacements in all phases.</p>'},
  {lb:'Non-uniform acceleration',dr:dQ3,ht:'<p>Non-uniform acceleration: v-t graph is a curve. Instantaneous acceleration = gradient of tangent. Displacement = area under curve (estimate by counting squares or trapezium rule). Acceleration-time graph: area under = change in velocity.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['gradient','area_rect','area_trap']);if(type==='gradient'){var v1=rnd(0,20),v2=rnd(v1+5,50),t=rnd(2,10),a=parseFloat(((v2-v1)/t).toFixed(2));return{question:'v changes from <b>'+v1+' m/s</b> to <b>'+v2+' m/s</b> in <b>'+t+' s</b>. Acceleration?',hints:['a = \u0394v/\u0394t'],ans:a,tol:a*0.02,unit:'m/s\u00b2',working:'a=('+v2+'-'+v1+')/'+t+' = '+a+' m/s\u00b2'};}if(type==='area_rect'){var v=rnd(5,30),t=rnd(2,15),s=v*t;return{question:'Constant v=<b>'+v+' m/s</b> for <b>'+t+' s</b>. Displacement?',hints:['Area = v \u00d7 t (rectangle)'],ans:s,tol:0,unit:'m',working:'s='+v+'\u00d7'+t+' = '+s+' m'};}var v1=rnd(5,20),v2=rnd(v1+5,40),t=rnd(2,10),s=parseFloat((0.5*(v1+v2)*t).toFixed(1));return{question:'v goes from <b>'+v1+' m/s</b> to <b>'+v2+' m/s</b> in <b>'+t+' s</b>. Displacement?',hints:['Area = \u00bd(v\u2081+v\u2082)t (trapezium)'],ans:s,tol:s*0.02,unit:'m',working:'s=0.5\u00d7('+v1+'+'+v2+')\u00d7'+t+' = '+s+' m'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Motion',ti:'Relative Motion',su:'Calculate relative velocity. Solve river-crossing and pursuit problems.',steps:[
  {lb:'Relative velocity',dr:dQ4,ht:'<p>Velocity of A relative to B = v_A \u2212 v_B (vector subtraction). Example: car A at 30 m/s east, car B at 20 m/s east: velocity of A relative to B = +10 m/s east. Car B at 20 m/s west: v_A = +30, v_B = -20; relative = +50 m/s east.</p>'},
  {lb:'River crossing',dr:dQ4,ht:'<p>Boat velocity (relative to water) + river velocity = resultant velocity (relative to ground). Time to cross = width / v_perpendicular component. Drift = v_river \u00d7 time. To go straight across: aim upstream at angle \u03b8 so that v_boat sin\u03b8 = v_river.</p>'},
  {lb:'Pursuit and meeting problems',dr:dQ4,ht:'<p>Two objects A and B: A catches B when they have the same displacement from a reference point. Set s_A = s_B and solve for time. Alternatively: relative velocity = v_A \u2212 v_B; close gap = initial separation / relative velocity.</p>'},
  {lb:'Frame of reference',dr:dQ4,ht:'<p>All motion is relative to a frame of reference. Galilean relativity: add velocities. In same-direction pursuit: time = gap / (v_fast \u2212 v_slow). In head-on: time = gap / (v_A + v_B). Collision: use relative velocity to determine closing speed.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['relative_1D','river_time','pursuit']);if(type==='relative_1D'){var vA=rnd(10,50),vB=rnd(5,vA-2),vrel=vA-vB;return{question:'v_A=<b>'+vA+' m/s</b> (east), v_B=<b>'+vB+' m/s</b> (east). v_A relative to B?',hints:['v_rel = v_A - v_B'],ans:vrel,tol:0,unit:'m/s (east)',working:'v_rel='+vA+'-'+vB+' = '+vrel+' m/s east'};}if(type==='river_time'){var w=rnd(50,500),v_perp=rnd(2,10),t=parseFloat((w/v_perp).toFixed(1));return{question:'River width=<b>'+w+' m</b>, perpendicular boat speed=<b>'+v_perp+' m/s</b>. Time to cross?',hints:['t = width / v_perpendicular'],ans:t,tol:t*0.02,unit:'s',working:'t='+w+'/'+v_perp+' = '+t+' s'};}var gap=rnd(100,1000),vA=rnd(20,50),vB=rnd(5,vA-5),t=parseFloat((gap/(vA-vB)).toFixed(1));return{question:'A pursues B: gap=<b>'+gap+' m</b>, v_A=<b>'+vA+'m/s</b>, v_B=<b>'+vB+'m/s</b>. Time to catch?',hints:['t = gap / (v_A - v_B)'],ans:t,tol:t*0.02,unit:'s',working:'t='+gap+'/('+vA+'-'+vB+') = '+t+' s'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Motion',ti:'Vertical Motion Under Gravity',su:'Apply kinematics to objects thrown upward or dropped.',steps:[
  {lb:'Sign conventions for vertical motion',dr:dQ5,ht:'<p>Taking upward as positive: a = \u22129.81 m/s\u00b2 (always). Object thrown upward with speed v\u2080: u = +v\u2080, a = \u22129.81. At maximum height: v = 0. Time to max height: t = v\u2080/g. Max height: h = v\u2080\u00b2/(2g). Returns to same level at time T = 2v\u2080/g.</p>'},
  {lb:'Free fall from height',dr:dQ5,ht:'<p>Object dropped (u=0): v = gt, s = \u00bdgt\u00b2 (taking down as positive). Time to fall height h: t = \u221a(2h/g). Impact speed: v = \u221a(2gh). From rest at height H: arrives with speed v = \u221a(2gH) regardless of mass. Bouncing: rebounds with some fraction of impact speed.</p>'},
  {lb:'Projectile: vertical component',dr:dQ5,ht:'<p>For projectile launched at angle \u03b8 and falling to same level: total time T = 2v\u2080sin\u03b8/g. For level below launch (e.g. cliff): set up coordinate origin at launch point; displacement is negative when below launch. Use quadratic formula if needed.</p>'},
  {lb:'Measurement of g',dr:dQ5,ht:'<p>Free-fall method: drop object, measure fall time t for known height h. g = 2h/t\u00b2. Errors: reaction time (systematic \u2192 use light gate), air resistance (negligible for dense objects), measuring h from wrong reference. Pendulum method more accurate for school experiments.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['max_h','time_fall','impact_v']);if(type==='max_h'){var v0=rnd(5,40),H=parseFloat((v0*v0/(2*9.81)).toFixed(2));return{question:'Ball thrown up at v\u2080=<b>'+v0+' m/s</b>. Max height above launch?',hints:['H = v\u2080\u00b2/(2g)'],ans:H,tol:H*0.02,unit:'m',working:'H='+v0+'\u00b2/(2\u00d79.81) = '+H+' m'};}if(type==='time_fall'){var h=rnd(5,100),t=parseFloat(Math.sqrt(2*h/9.81).toFixed(3));return{question:'Dropped from h=<b>'+h+' m</b>. Time to fall?',hints:['t = \u221a(2h/g)'],ans:t,tol:t*0.02,unit:'s',working:'t=\u221a(2\u00d7'+h+'/9.81) = '+t+' s'};}var h=rnd(5,100),v=parseFloat(Math.sqrt(2*9.81*h).toFixed(2));return{question:'Dropped from h=<b>'+h+' m</b>. Impact speed?',hints:['v = \u221a(2gh)'],ans:v,tol:v*0.02,unit:'m/s',working:'v=\u221a(2\u00d79.81\u00d7'+h+') = '+v+' m/s'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Motion',ti:'Acceleration-Time Graphs',su:'Interpret a-t graphs. Link to v-t and s-t graphs.',steps:[
  {lb:'a-t graph relationships',dr:dQ6,ht:'<p>Area under a-t graph = change in velocity (\u0394v). If a is constant and positive: v-t graph has constant positive slope (straight line). If a decreases (e.g. terminal velocity): v-t curves toward horizontal. Area under v-t graph = displacement.</p>'},
  {lb:'Deriving v-t from a-t',dr:dQ6,ht:'<p>For constant a: v = u + at \u2192 straight v-t line. For variable a: integrate graphically (area method). For sinusoidal a (SHM): v is cosinusoidal (90\u00b0 out of phase). For exponential a (terminal velocity): v = v_T(1 \u2212 e^(-t/\u03c4)).</p>'},
  {lb:'Combined graph interpretation',dr:dQ6,ht:'<p>s-t graph: gradient = velocity. v-t graph: gradient = acceleration; area = displacement. a-t graph: area = change in velocity. For projectile at max height: s-t has zero gradient; v-t passes through v=0; a-t is constant (\u22129.81 throughout).</p>'},
  {lb:'Non-uniform acceleration example',dr:dQ6,ht:'<p>Car braking: a-t graph may show braking force applied. Magnetic braking: a \u221d v \u2192 exponential decay of v. Rocket: mass decreases \u2192 a increases even if thrust constant. Human running: initial high a, then a \u2192 0 at top speed.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['area_at','derive_v','s_area']);if(type==='area_at'){var a=rnd(1,10),t=rnd(2,10),dv=a*t;return{question:'Constant a=<b>'+a+' m/s\u00b2</b> for <b>'+t+' s</b>. Change in velocity?',hints:['Area under a-t = \u0394v = a\u00d7t'],ans:dv,tol:0,unit:'m/s',working:'\u0394v='+a+'\u00d7'+t+' = '+dv+' m/s'};}if(type==='derive_v'){var u=rnd(5,20),a=rnd(1,8),t=rnd(2,10),v=u+a*t;return{question:'u=<b>'+u+' m/s</b>, constant a=<b>'+a+' m/s\u00b2</b>. v at t=<b>'+t+' s</b>?',hints:['v = u + at'],ans:v,tol:0,unit:'m/s',working:'v='+u+'+'+a+'\u00d7'+t+' = '+v+' m/s'};}var v=rnd(5,30),t=rnd(2,15),s=parseFloat((0.5*v*t).toFixed(1));return{question:'Object accelerates from rest to v=<b>'+v+' m/s</b> in <b>'+t+' s</b>. Displacement?',hints:['Area = \u00bd \u00d7 base \u00d7 height (triangle)'],ans:s,tol:s*0.02,unit:'m',working:'s=0.5\u00d7'+v+'\u00d7'+t+' = '+s+' m'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Motion',ti:'Collisions and Newton\'s Laws of Motion',su:'Apply Newton\'s laws to collisions. Use impulse-momentum theorem.',steps:[
  {lb:'Newton\u2019s laws review',dr:dQ7,ht:'<p>1st: object at rest or constant velocity unless resultant force acts. 2nd: F = ma = \u0394p/\u0394t. 3rd: equal and opposite reaction on different object. For collisions: Newton\u2019s 3rd law means both objects experience equal and opposite impulses \u2192 momentum conserved.</p>'},
  {lb:'Elastic collisions',dr:dQ7,ht:'<p>Elastic: both momentum AND kinetic energy conserved. For equal masses: velocities exchange (v\u2081\u2019 = v\u2082, v\u2082\u2019 = v\u2081). General: v\u2081\u2019 = (m\u2081\u2212m\u2082)v\u2081/(m\u2081+m\u2082) + 2m\u2082v\u2082/(m\u2081+m\u2082). Coefficient of restitution e = 1 for perfectly elastic.</p>'},
  {lb:'Inelastic collisions',dr:dQ7,ht:'<p>Inelastic: only momentum conserved; KE lost to heat, sound, deformation. Perfectly inelastic: objects stick; v_f = (m\u2081v\u2081 + m\u2082v\u2082)/(m\u2081+m\u2082). KE lost = KE_before \u2212 KE_after. Coefficient of restitution e = 0 (perfectly inelastic).</p>'},
  {lb:'Coefficient of restitution',dr:dQ7,ht:'<p>e = relative speed of separation / relative speed of approach = (v\u2082\u2019 \u2212 v\u2081\u2019)/(v\u2081 \u2212 v\u2082). e = 1: elastic. e = 0: perfectly inelastic. 0 < e < 1: partially inelastic. Bouncing ball: e = \u221a(h_bounce/h_drop). WAEC: use momentum conservation + e to find both final velocities.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['momentum_cons','KE_lost','restitution']);if(type==='momentum_cons'){var m1=rnd(2,20),v1=rnd(5,30),m2=rnd(2,20),vf=parseFloat((m1*v1/(m1+m2)).toFixed(2));return{question:'m\u2081=<b>'+m1+'kg</b> at <b>'+v1+'m/s</b> hits stationary m\u2082=<b>'+m2+'kg</b>; stick. v_f?',hints:['(m\u2081+m\u2082)v_f = m\u2081v\u2081'],ans:vf,tol:vf*0.02,unit:'m/s',working:'v_f='+m1+'\u00d7'+v1+'/('+m1+'+'+m2+') = '+vf+' m/s'};}if(type==='KE_lost'){var m1=rnd(2,10),v1=rnd(5,20),m2=rnd(2,10),vf=m1*v1/(m1+m2),KE_before=0.5*m1*v1*v1,KE_after=0.5*(m1+m2)*vf*vf,KE_lost=parseFloat((KE_before-KE_after).toFixed(1));return{question:'m\u2081=<b>'+m1+'kg</b> at <b>'+v1+'m/s</b> + stationary m\u2082=<b>'+m2+'kg</b>; stick. KE lost?',hints:['KE_lost = KE_before - KE_after'],ans:KE_lost,tol:KE_lost*0.05,unit:'J',working:'KE_lost=\u00bd\u00d7'+m1+'\u00d7'+v1+'\u00b2 - \u00bd\u00d7'+(m1+m2)+'\u00d7'+vf.toFixed(2)+'\u00b2 = '+KE_lost+' J'};}var h_drop=rnd(1,10),h_bounce=rnd(10,80)/100*h_drop,e=parseFloat(Math.sqrt(h_bounce/h_drop).toFixed(3));return{question:'Ball drops from <b>'+h_drop+' m</b>, bounces to <b>'+h_bounce.toFixed(2)+' m</b>. Coefficient of restitution e?',hints:['e = \u221a(h_bounce/h_drop)'],ans:e,tol:e*0.02,unit:'',working:'e=\u221a('+h_bounce.toFixed(2)+'/'+h_drop+') = '+e};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Motion',ti:'Non-Uniform Acceleration',su:'Describe and analyse motion when acceleration varies.',steps:[
  {lb:'When acceleration is not constant',dr:dQ8,ht:'<p>F = ma: if F varies (e.g. springs, drag, gravity at large distances), a varies. Cannot use kinematics equations directly. Instead: use F-x graph (area = work done = change in KE), or calculus (a = dv/dt, v = ds/dt). For A-level: know how to read variable-acceleration graphs.</p>'},
  {lb:'Numerical methods',dr:dQ8,ht:'<p>For variable a: divide into small time steps \u0394t. v_n+1 = v_n + a_n \u0394t; s_n+1 = s_n + v_n \u0394t. Computer simulations use this method (Euler method). More accurate methods (Runge-Kutta) used in physics and engineering software. Useful for: drag, orbits, oscillations.</p>'},
  {lb:'Velocity-dependent drag',dr:dQ8,ht:'<p>At high speed: F_drag \u221d v\u00b2. Then a = g \u2212 kv\u00b2/m (downward motion). Terminal velocity: a = 0 when kv_T\u00b2 = mg \u2192 v_T = \u221a(mg/k). Speed approaches v_T asymptotically. v-t graph: starts at slope g, curves toward v_T. Exponential approach.</p>'},
  {lb:'SHM as non-uniform acceleration',dr:dQ8,ht:'<p>Simple harmonic motion (SHM): a = \u2212\u03c9\u00b2x. Acceleration proportional to displacement, directed toward centre. a-t graph: sinusoidal, 180\u00b0 out of phase with x-t. At max displacement: max |a|. At centre: a = 0, max v.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['terminal_k','euler_step','SHM_a']);if(type==='terminal_k'){var m=rnd(1,20),g=9.81,vT=rnd(5,50),k=parseFloat((m*g/(vT*vT)).toFixed(4));return{question:'Mass=<b>'+m+'kg</b>, terminal velocity=<b>'+vT+'m/s</b> (drag\u221dv\u00b2). Find k (drag constant)?',hints:['At v_T: kv_T\u00b2=mg; k=mg/v_T\u00b2'],ans:k,tol:k*0.05,unit:'kg/m',working:'k='+m+'\u00d79.81/'+vT+'\u00b2 = '+k+' kg/m'};}if(type==='euler_step'){var v=rnd(5,20),a=rnd(1,10),dt=rnd(1,5)/10,v_new=parseFloat((v+a*dt).toFixed(2));return{question:'v=<b>'+v+' m/s</b>, a=<b>'+a+' m/s\u00b2</b>, \u0394t=<b>'+dt+' s</b>. New velocity (Euler)?',hints:['v_new = v + a\u0394t'],ans:v_new,tol:v_new*0.01,unit:'m/s',working:'v_new='+v+'+'+a+'\u00d7'+dt+' = '+v_new+' m/s'};}var omega=rnd(1,10),x=rnd(1,10)/10,a=parseFloat((omega*omega*x).toFixed(2));return{question:'SHM: \u03c9=<b>'+omega+' rad/s</b>, displacement x=<b>'+x+' m</b>. Magnitude of acceleration?',hints:['|a|=\u03c9\u00b2x'],ans:a,tol:a*0.02,unit:'m/s\u00b2',working:'|a|='+omega+'\u00b2\u00d7'+x+' = '+a+' m/s\u00b2'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Motion',ti:'Motion in Two Dimensions — Extended',su:'Solve complex 2D motion problems.',steps:[
  {lb:'2D kinematics general',dr:dQ9,ht:'<p>In 2D, treat x and y independently. x: s_x = u_x t + \u00bda_x t\u00b2. y: s_y = u_y t + \u00bda_y t\u00b2. For projectile: a_x = 0, a_y = \u22129.81 m/s\u00b2. Position as vector: r = (s_x, s_y). Velocity as vector: v = (v_x, v_y). Speed = |v| = \u221a(v_x\u00b2 + v_y\u00b2).</p>'},
  {lb:'Launching from a cliff',dr:dQ9,ht:'<p>Horizontal launch from height H at speed v_x: Time to hit ground: t = \u221a(2H/g). Horizontal range: R = v_x t = v_x\u221a(2H/g). Impact speed: v = \u221a(v_x\u00b2 + (gt)\u00b2). Impact angle: \u03b1 = arctan(v_y/v_x) below horizontal. v_y = gt at impact.</p>'},
  {lb:'Angled launch from cliff',dr:dQ9,ht:'<p>Launch at angle \u03b8 and speed v\u2080 from height H. Take up as positive, origin at launch. y: H + (v\u2080sin\u03b8)t \u2212 \u00bdgt\u00b2 = 0 (when hits ground). Solve quadratic for t; take positive root. Then R = (v\u2080cos\u03b8)t. For launch angle below horizontal: u_y negative.</p>'},
  {lb:'Projectile optimization',dr:dQ9,ht:'<p>For given v\u2080 and flat ground: range = v\u2080\u00b2sin2\u03b8/g. dR/d\u03b8 = 0 when cos2\u03b8 = 0 \u2192 2\u03b8 = 90\u00b0 \u2192 \u03b8 = 45\u00b0. But for maximizing range to elevated target, or with air resistance, optimal angle differs from 45\u00b0. WAEC: always use R = v\u2080\u00b2sin2\u03b8/g on flat ground.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['cliff_range','cliff_time','impact_speed']);if(type==='cliff_range'){var H=rnd(5,100),vx=rnd(5,30),t=parseFloat(Math.sqrt(2*H/9.81).toFixed(3)),R=parseFloat((vx*t).toFixed(2));return{question:'Horizontal launch from H=<b>'+H+'m</b> at v_x=<b>'+vx+'m/s</b>. Range?',hints:['t=\u221a(2H/g); R=v_x t'],ans:R,tol:R*0.02,unit:'m',working:'t=\u221a(2\u00d7'+H+'/9.81)='+t+'s; R='+vx+'\u00d7'+t+' = '+R+' m'};}if(type==='cliff_time'){var H=rnd(5,100),t=parseFloat(Math.sqrt(2*H/9.81).toFixed(3));return{question:'Dropped from H=<b>'+H+'m</b>. Time to hit ground?',hints:['t=\u221a(2H/g)'],ans:t,tol:t*0.02,unit:'s',working:'t=\u221a(2\u00d7'+H+'/9.81) = '+t+' s'};}var vx=rnd(5,30),H=rnd(5,80),t=parseFloat(Math.sqrt(2*H/9.81).toFixed(3)),vy=parseFloat((9.81*t).toFixed(2)),v=parseFloat(Math.sqrt(vx*vx+vy*vy).toFixed(2));return{question:'Horizontal launch: v_x=<b>'+vx+'m/s</b> from H=<b>'+H+'m</b>. Impact speed?',hints:['v=\u221a(v_x\u00b2+v_y\u00b2); v_y=gt'],ans:v,tol:v*0.02,unit:'m/s',working:'t='+t+'s; v_y='+vy+'m/s; v=\u221a('+vx+'\u00b2+'+vy+'\u00b2) = '+v+' m/s'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Motion',ti:'Mixed Motion Questions',su:'Integrated questions across all Y12-MEC-03 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>v=u+at. s=ut+\u00bdat\u00b2. v\u00b2=u\u00b2+2as. Projectile: x=v_x t, y=u_y t-\u00bdgt\u00b2. Range R=v\u2080\u00b2sin2\u03b8/g. Time up: t=u_y/g. Area under v-t = displacement. Gradient of v-t = acceleration.</p>'},
  {lb:'Problem strategy',dr:dQ10,ht:'<p>Choose the right equation: know your unknown and what you have. For projectile: always split into horizontal and vertical. Write two sets of equations. Link via time. For collisions: momentum first, then energy if needed.</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC heavily tests: kinematics equations; projectile motion (range, time of flight, max height); reading v-t graphs (gradient and area); free fall problems. Always state which equation you use and show working.</p>'},
  {lb:'Key formulae',dr:dQ10,ht:'<div class="fm">v=u+at \u2022 s=ut+\u00bdat\u00b2 \u2022 v\u00b2=u\u00b2+2as</div><div class="fm">R=v\u2080\u00b2sin2\u03b8/g \u2022 H=u_y\u00b2/(2g) \u2022 T=2u_y/g</div>'},
  {lb:'Your turn',dr:dQ10,ht:tryIt(function(){var type=pick(['kinematics','range','freefall']);if(type==='kinematics'){var u=rnd(5,20),a=rnd(1,8),t=rnd(2,10),s=parseFloat((u*t+0.5*a*t*t).toFixed(1));return{question:'u=<b>'+u+'m/s</b>, a=<b>'+a+'m/s\u00b2</b>, t=<b>'+t+'s</b>. s?',hints:['s=ut+\u00bdat\u00b2'],ans:s,tol:s*0.02,unit:'m',working:'s='+u+'\u00d7'+t+'+0.5\u00d7'+a+'\u00d7'+t+'\u00b2 = '+s+' m'};}if(type==='range'){var v0=rnd(10,50),th=pick([30,37,45,53,60]),R=parseFloat((v0*v0*Math.sin(2*th*Math.PI/180)/9.81).toFixed(2));return{question:'v\u2080=<b>'+v0+'m/s</b>, \u03b8=<b>'+th+'\u00b0</b>. Range?',hints:['R=v\u2080\u00b2sin2\u03b8/g'],ans:R,tol:R*0.02,unit:'m',working:'R='+v0+'\u00b2 sin('+2*th+'\u00b0)/9.81 = '+R+' m'};}var h=rnd(5,50),v=parseFloat(Math.sqrt(2*9.81*h).toFixed(2));return{question:'Dropped from h=<b>'+h+'m</b>. Impact speed?',hints:['v=\u221a(2gh)'],ans:v,tol:v*0.02,unit:'m/s',working:'v=\u221a(2\u00d79.81\u00d7'+h+') = '+v+' m/s'};})},
]},
];

var qi=0,si=0;
