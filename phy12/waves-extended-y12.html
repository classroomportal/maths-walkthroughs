<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Wave properties',ACC,13,'middle',true));
[['Property','Symbol','Unit','Definition'],['Amplitude','A','m','max displacement from equilibrium'],['Wavelength','\u03bb','m','distance per complete wave cycle'],['Period','T','s','time per complete cycle'],['Frequency','f','Hz','cycles per second; f=1/T'],['Wave speed','v','m/s','v=f\u03bb=\u03bb/T']].forEach(function(r,i){if(i<=p){o.push(R(10,30+i*34,460,28,i===0?LINE:CRM,i===0?ACC:LINE,0.5));r.forEach(function(v,j){o.push(T(20+j*112,50+i*34,v,i===0?ACC:'#333',i===0?8:8,'start',i===0));});}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Transverse vs longitudinal waves',ACC,12,'middle',true));
o.push(R(10,36,222,210,CRM,ACC,2));o.push(T(121,54,'TRANSVERSE',ACC,10,'middle',true));
o.push(R(248,36,222,210,CRM,ACC,2));o.push(T(359,54,'LONGITUDINAL',ACC,10,'middle',true));
['Displacement \u22a5 to travel','EM waves, water waves','S-seismic waves','Show polarisation','Crests and troughs'].forEach(function(v,i){if(i<p+1)o.push(T(121,74+i*28,v,'#333',8,'middle',false));});
['Displacement \u2225 to travel','Sound, ultrasound','P-seismic waves','Cannot be polarised','Compressions + rarefactions'].forEach(function(v,i){if(i<p+1)o.push(T(359,74+i*28,v,'#333',8,'middle',false));});
s.innerHTML=o.join('');}
function dQ3(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Superposition and interference',ACC,12,'middle',true));
o.push(R(10,36,460,44,CRM,ACC,2));o.push(T(240,58,'Superposition: resultant displacement = algebraic sum',DARK,11,'middle',false));
if(p>=1){o.push(R(10,90,460,40,CRM,ACC,1.5));o.push(T(240,108,'Constructive: same phase; path diff = n\u03bb; amplitude doubles','#333',10,'middle',false));}
if(p>=2){o.push(R(10,140,460,40,CRM,ACC,1.5));o.push(T(240,158,'Destructive: anti-phase; path diff = (n+\u00bd)\u03bb; zero amplitude','#333',10,'middle',false));}
if(p>=3){o.push(R(10,190,460,40,CRM,ACC,1.5));o.push(T(240,208,'Two-slit fringe spacing: y = \u03bbD/d (D=screen dist, d=slit sep)','#333',10,'middle',false));}
if(p>=4){o.push(R(10,238,460,18,LINE,ACC,0.5));o.push(T(240,250,'Coherent sources needed: constant phase difference','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ4(p){dQ1(p);}
function dQ5(p){dQ2(p);}
function dQ6(p){dQ3(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ3(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Waves summary',ACC,13,'middle',true));
[['Wave equation','v=f\u03bb; f=1/T; T=1/f'],['Transverse','displacement \u22a5 direction; can polarise'],['Longitudinal','displacement \u2225 direction; compressions'],['Superposition','add displacements algebraically'],['Constructive','path diff=n\u03bb; max amplitude'],['Destructive','path diff=(n+\u00bd)\u03bb; zero amplitude'],['Fringe spacing','y=\u03bbD/d (double slit)']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Waves',ti:'Wave Properties and Equation',su:'Use v=f\u03bb. Calculate wave speed, frequency, wavelength and period.',steps:[
  {lb:'Wave equation',dr:dQ1,ht:'<div class="fm">v = f\u03bb (m/s)</div><p>v = wave speed (m/s), f = frequency (Hz), \u03bb = wavelength (m). Also: v = \u03bb/T where T = period (s). For all waves in a given medium, speed is constant (determined by medium). Frequency is determined by source. Wavelength adjusts: \u03bb = v/f.</p>'},
  {lb:'Wave properties',dr:dQ1,ht:'<p>Amplitude A: max displacement from equilibrium (m); determines energy and loudness/brightness. Wavelength \u03bb: distance between successive crests (or any two identical points one cycle apart). Period T = 1/f. Phase: describes the stage of a wave cycle; two points in phase differ by n\u03bb; anti-phase differ by (n+\u00bd)\u03bb.</p>'},
  {lb:'Speed in different media',dr:dQ1,ht:'<p>Sound in air: ~340 m/s (increases with temperature: v = 331\u221a(T/273)). Sound in water: ~1500 m/s. Sound in steel: ~5000 m/s. Light in vacuum: c = 3\u00d710\u2078 m/s. Light in glass: v \u2248 2\u00d710\u2078 m/s. EM waves always travel at c in vacuum, regardless of frequency.</p>'},
  {lb:'Wavefronts and rays',dr:dQ1,ht:'<p>Wavefront: surface connecting all points with the same phase. Rays: perpendicular to wavefronts; show direction of propagation. Plane wave: parallel wavefronts, parallel rays (e.g. sunlight). Spherical wave: expanding spherical wavefronts from point source; intensity \u221d 1/r\u00b2 (inverse square law).</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['v_from_fl','f_from_vl','lambda_from_vf']);if(type==='v_from_fl'){var f=rnd(100,10000),lam=rnd(1,100)/100,v=parseFloat((f*lam).toFixed(2));return{question:'f=<b>'+f+' Hz</b>, \u03bb=<b>'+lam.toFixed(2)+' m</b>. Wave speed?',hints:['v=f\u03bb'],ans:v,tol:v*0.01,unit:'m/s',working:'v='+f+'\u00d7'+lam.toFixed(2)+' = '+v+' m/s'};}if(type==='f_from_vl'){var v=pick([340,1500,3e8]),lam=rnd(1,100)/100,f=parseFloat((v/lam).toFixed(0));return{question:'v=<b>'+v+' m/s</b>, \u03bb=<b>'+lam.toFixed(2)+' m</b>. Frequency?',hints:['f=v/\u03bb'],ans:f,tol:f*0.01,unit:'Hz',working:'f='+v+'/'+lam.toFixed(2)+' = '+f+' Hz'};}var v=pick([340,1500,5000]),f=rnd(100,10000),lam=parseFloat((v/f).toFixed(4));return{question:'v=<b>'+v+' m/s</b>, f=<b>'+f+' Hz</b>. Wavelength?',hints:['\u03bb=v/f'],ans:lam,tol:lam*0.02,unit:'m',working:'\u03bb='+v+'/'+f+' = '+lam+' m'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Waves',ti:'Transverse and Longitudinal Waves',su:'Distinguish wave types. Describe polarisation. Explain compressions and rarefactions.',steps:[
  {lb:'Wave types',dr:dQ2,ht:'<p><b>Transverse:</b> displacement perpendicular to direction of travel. Examples: EM waves, water surface waves, S-seismic waves, waves on strings. Can be polarised. Show crests and troughs. <b>Longitudinal:</b> displacement parallel to direction of travel. Examples: sound, ultrasound, P-seismic waves, compression in springs. Cannot be polarised.</p>'},
  {lb:'Compressions and rarefactions',dr:dQ2,ht:'<p>Longitudinal waves: compression = region of higher pressure/density (particles closer together). Rarefaction = region of lower pressure/density (particles further apart). Distance between successive compressions = wavelength \u03bb. Speed of sound: v = \u221a(B/\u03c1) where B = bulk modulus, \u03c1 = density.</p>'},
  {lb:'Polarisation',dr:dQ2,ht:'<p>Polarisation: restriction of transverse wave oscillations to one plane. Plane polarised: all oscillations in one plane. Unpolarised: oscillations in all planes perpendicular to direction of travel. Polaroid filter: transmits one plane only; absorbs perpendicular. Two crossed polaroids: no light transmitted. Longitudinal waves cannot be polarised (displacement already parallel to travel).</p>'},
  {lb:'Intensity and inverse square law',dr:dQ2,ht:'<p>Intensity I = power / area = P/(4\u03c0r\u00b2) for point source (spherical spreading). Units: W/m\u00b2. Inverse square law: I \u221d 1/r\u00b2. Double the distance: quarter the intensity. Also I \u221d A\u00b2 (proportional to amplitude squared). Sound level (dB): L = 10 log(I/I\u2080) where I\u2080 = 10\u207b\u00b9\u00b2 W/m\u00b2.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['intensity_ratio','speed_sound','period']);if(type==='intensity_ratio'){var r1=rnd(1,5),r2=rnd(6,20),ratio=parseFloat((r2*r2/(r1*r1)).toFixed(1));return{question:'Source at r\u2081=<b>'+r1+'m</b> and r\u2082=<b>'+r2+'m</b>. Ratio I\u2081/I\u2082?',hints:['I\u221d1/r\u00b2; I\u2081/I\u2082=(r\u2082/r\u2081)\u00b2'],ans:ratio,tol:ratio*0.02,unit:'',working:'I\u2081/I\u2082=('+r2+'/'+r1+')\u00b2 = '+ratio};}if(type==='speed_sound'){var f=rnd(200,5000),lam=rnd(1,170)/100,v=parseFloat((f*lam).toFixed(1));return{question:'Sound: f=<b>'+f+' Hz</b>, \u03bb=<b>'+lam.toFixed(2)+' m</b>. Speed?',hints:['v=f\u03bb'],ans:v,tol:v*0.02,unit:'m/s',working:'v='+f+'\u00d7'+lam.toFixed(2)+' = '+v+' m/s'};}var T=rnd(1,100)/1000,f=parseFloat((1/T).toFixed(1));return{question:'Period T=<b>'+T.toFixed(3)+' s</b>. Frequency?',hints:['f=1/T'],ans:f,tol:f*0.02,unit:'Hz',working:'f=1/'+T.toFixed(3)+' = '+f+' Hz'};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Waves',ti:'Superposition and Interference',su:'Apply superposition principle. Explain constructive and destructive interference.',steps:[
  {lb:'Superposition principle',dr:dQ3,ht:'<p>When two or more waves overlap at a point, the resultant displacement equals the algebraic sum of the individual displacements. True for all linear waves. After passing through each other, waves continue unchanged. Superposition leads to interference, beats, standing waves and diffraction patterns.</p>'},
  {lb:'Constructive and destructive interference',dr:dQ3,ht:'<p><b>Constructive:</b> waves in phase (path difference = n\u03bb, n = 0, 1, 2\u2026); amplitudes add; resultant amplitude = A\u2081 + A\u2082; intensity maximum. <b>Destructive:</b> waves in anti-phase (path diff = (n+\u00bd)\u03bb); amplitudes subtract; minimum amplitude = |A\u2081 - A\u2082|; zero if equal amplitudes.</p>'},
  {lb:'Conditions for interference',dr:dQ3,ht:'<p>Coherent sources needed: (1) same frequency; (2) constant phase difference. Lasers and two slits from one source are coherent. Two separate loudspeakers can be coherent if driven by same signal. Two separate light bulbs are incoherent (phase difference changes randomly very quickly).</p>'},
  {lb:'Double-slit experiment',dr:dQ3,ht:'<div class="fm">y = \u03bbD/d</div><p>y = fringe spacing (m), \u03bb = wavelength, D = distance to screen, d = slit separation. Bright fringes: path diff = n\u03bb. Dark fringes: path diff = (n+\u00bd)\u03bb. Increasing D or decreasing d \u2192 wider fringes. Wider slits: fringes still there but brighter at centre (diffraction envelope).</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['fringe_spacing','path_diff','lambda_from_fringes']);if(type==='fringe_spacing'){var lam=rnd(400,700)*1e-9,D=rnd(1,5),d=rnd(1,5)/1000,y=parseFloat((lam*D/d).toFixed(5));return{question:'\u03bb=<b>'+Math.round(lam*1e9)+'nm</b>, D=<b>'+D+'m</b>, d=<b>'+d*1000+'mm</b>. Fringe spacing y?',hints:['y=\u03bbD/d'],ans:y,tol:y*0.03,unit:'m',working:'y='+lam.toExponential(2)+'\u00d7'+D+'/'+d+' = '+y.toExponential(3)+' m'};}if(type==='path_diff'){var n=rnd(1,5),lam=rnd(400,700),pd=n*lam;return{question:'Constructive interference, n=<b>'+n+'</b>, \u03bb=<b>'+lam+' nm</b>. Path difference?',hints:['path diff = n\u03bb'],ans:pd,tol:0,unit:'nm',working:'path diff='+n+'\u00d7'+lam+' = '+pd+' nm'};}var D=rnd(1,5),d=rnd(1,5)/1000,y=rnd(1,5)/1000,lam=parseFloat((y*d/D*1e9).toFixed(0));return{question:'y=<b>'+y*1000+'mm</b>, D=<b>'+D+'m</b>, d=<b>'+d*1000+'mm</b>. Wavelength?',hints:['\u03bb=yd/D'],ans:lam,tol:lam*0.03,unit:'nm',working:'\u03bb='+y+'\u00d7'+d+'/'+D+'\u00d710\u2079 = '+lam+' nm'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Waves',ti:'Stationary Waves',su:'Describe stationary (standing) waves. Find frequencies of harmonics.',steps:[
  {lb:'Formation of stationary waves',dr:dQ4,ht:'<p>Stationary (standing) wave: two progressive waves of equal amplitude and frequency travelling in opposite directions superpose. Nodes: points of zero displacement (destructive, constant). Antinodes: points of maximum displacement (constructive, constant). Pattern does not travel; energy is stored, not transmitted (ideally).</p>'},
  {lb:'Harmonics on a string',dr:dQ4,ht:'<p>Fixed ends = nodes. Fundamental (1st harmonic): L = \u03bb/2; f\u2081 = v/(2L). 2nd harmonic: L = \u03bb; f\u2082 = v/L = 2f\u2081. nth harmonic: f_n = nf\u2081 = nv/(2L). Speed on string: v = \u221a(T/\u03bc) where T = tension, \u03bc = mass per unit length. More tension or less mass \u2192 faster speed \u2192 higher pitch.</p>'},
  {lb:'Pipes (air columns)',dr:dQ4,ht:'<p>Closed pipe (closed at one end): node at closed end; antinode at open end. Fundamental: L = \u03bb/4; f\u2081 = v/(4L). Only odd harmonics: f_n = (2n-1)f\u2081. Open pipe: antinodes at both ends. Fundamental: L = \u03bb/2; f\u2081 = v/(2L). All harmonics: f_n = nf\u2081. v_sound \u2248 340 m/s in air.</p>'},
  {lb:'Nodes and antinodes pattern',dr:dQ4,ht:'<p>Distance between adjacent nodes = \u03bb/2. Distance between adjacent antinodes = \u03bb/2. Distance from node to adjacent antinode = \u03bb/4. Measure \u03bb from stationary wave: measure distance between several nodes, divide by number of intervals, multiply by 2. Then v = f\u03bb.</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['fundamental_string','harmonic_freq','pipe_fundamental']);if(type==='fundamental_string'){var L=rnd(1,5)/10,v=rnd(100,500),f=parseFloat((v/(2*L)).toFixed(1));return{question:'String L=<b>'+L.toFixed(2)+'m</b>, wave speed=<b>'+v+'m/s</b>. Fundamental frequency?',hints:['f\u2081=v/(2L)'],ans:f,tol:f*0.02,unit:'Hz',working:'f\u2081='+v+'/(2\u00d7'+L.toFixed(2)+') = '+f+' Hz'};}if(type==='harmonic_freq'){var f1=rnd(50,300),n=rnd(2,6),fn=f1*n;return{question:'Fundamental f\u2081=<b>'+f1+'Hz</b>. Frequency of <b>'+n+'th</b> harmonic (string)?',hints:['f_n=n\u00d7f\u2081'],ans:fn,tol:0,unit:'Hz',working:'f_n='+n+'\u00d7'+f1+' = '+fn+' Hz'};}var L=rnd(10,50)/100,v=340,f=parseFloat((v/(4*L)).toFixed(1));return{question:'Closed pipe L=<b>'+L.toFixed(2)+'m</b>. Fundamental frequency (v=340m/s)?',hints:['f\u2081=v/(4L) for closed pipe'],ans:f,tol:f*0.02,unit:'Hz',working:'f\u2081=340/(4\u00d7'+L.toFixed(2)+') = '+f+' Hz'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Waves',ti:'Diffraction',su:'Describe and calculate single-slit diffraction. Apply Huygens\u2019 principle.',steps:[
  {lb:'Huygens\u2019 principle',dr:dQ5,ht:'<p>Every point on a wavefront acts as a source of secondary wavelets. The new wavefront is the envelope of these wavelets. Explains: diffraction (waves bending around obstacles), refraction (change in speed at boundary), reflection. Applies to all wave types: light, sound, water waves.</p>'},
  {lb:'Diffraction',dr:dQ5,ht:'<p>Diffraction: spreading of waves around edges of obstacles or through gaps. Significant when gap width \u2248 \u03bb. Narrow gap: more diffraction. Wide gap: less diffraction (more geometric shadow). Single slit: central maximum (width 2\u03bbD/a), smaller side maxima. \u03b8_min = \u03bb/a (first minimum, in radians).</p>'},
  {lb:'Single slit formula',dr:dQ5,ht:'<div class="fm">sin\u03b8 = \u03bb/a (first minimum)</div><p>a = slit width, \u03b8 = angle to first minimum. For small \u03b8: \u03b8 \u2248 \u03bb/a (radians). Width of central maximum = 2\u03bbD/a where D = distance to screen. Narrower slit \u2192 wider central maximum. Longer wavelength \u2192 more diffraction.</p>'},
  {lb:'Diffraction grating',dr:dQ5,ht:'<div class="fm">d sin\u03b8 = n\u03bb (diffraction grating)</div><p>d = grating spacing = 1/(lines per metre). n = order. Bright maxima when path difference between adjacent slits = n\u03bb. More slits \u2192 sharper maxima. Used in spectroscopy to analyse spectra. Maximum order when sin\u03b8 = 1: n_max = d/\u03bb.</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['grating_angle','grating_lambda','single_slit_min']);if(type==='grating_angle'){var N=rnd(300,1200),d=1/N*1e-3,n=pick([1,2]),lam=rnd(400,700)*1e-9,sinT=parseFloat((n*lam/d).toFixed(4));var theta=parseFloat((Math.asin(sinT)*180/Math.PI).toFixed(1));return{question:'Grating: <b>'+N+' lines/mm</b>, \u03bb=<b>'+Math.round(lam*1e9)+'nm</b>, n=<b>'+n+'</b>. Angle of max?',hints:['d sin\u03b8=n\u03bb; d=1/('+N+'mm\u207b\u00b9)'],ans:theta,tol:0.5,unit:'\u00b0',working:'sin\u03b8='+n+'\u00d7'+lam.toExponential(2)+'/'+d.toExponential(4)+'; \u03b8='+theta+'\u00b0'};}if(type==='grating_lambda'){var N=rnd(300,600),d=1/N*1e-3,n=1,theta=pick([15,20,25,30,35]),lam=parseFloat((d*Math.sin(theta*Math.PI/180)*1e9).toFixed(0));return{question:'Grating: <b>'+N+' lines/mm</b>, first order at <b>'+theta+'\u00b0</b>. Wavelength?',hints:['\u03bb=d sin\u03b8/n'],ans:lam,tol:lam*0.03,unit:'nm',working:'\u03bb='+d.toExponential(4)+'\u00d7sin'+theta+'\u00b0\u00d710\u2079 = '+lam+' nm'};}var a=rnd(1,10)*1e-6,lam=rnd(400,700)*1e-9,theta=parseFloat((Math.asin(lam/a)*180/Math.PI).toFixed(1));return{question:'Single slit a=<b>'+(a*1e6).toFixed(1)+'\u03bcm</b>, \u03bb=<b>'+Math.round(lam*1e9)+'nm</b>. Angle to 1st min?',hints:['sin\u03b8=\u03bb/a'],ans:theta,tol:0.5,unit:'\u00b0',working:'sin\u03b8='+lam.toExponential(2)+'/'+a.toExponential(2)+'; \u03b8='+theta+'\u00b0'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Waves',ti:'Refraction',su:'Apply Snell\u2019s law. Calculate refractive index and critical angle.',steps:[
  {lb:'Refraction and Snell\u2019s law',dr:dQ6,ht:'<div class="fm">n\u2081 sin\u03b8\u2081 = n\u2082 sin\u03b8\u2082 &nbsp;&nbsp; n = c/v</div><p>Refraction: change in direction when wave changes speed at boundary. Bends toward normal when slowing down. n = refractive index = c/v (speed in vacuum/speed in medium). n_vacuum = n_air = 1. n_glass \u2248 1.5. n_water \u2248 1.33. n_diamond \u2248 2.42.</p>'},
  {lb:'Critical angle and total internal reflection',dr:dQ6,ht:'<div class="fm">sin\u03b8_c = n\u2082/n\u2081 = 1/n (going from denser to less dense)</div><p>TIR occurs when: (1) light travels from denser to less dense medium; (2) angle of incidence > critical angle. Applications: optical fibres (communication), periscopes, diamond brilliance, cats eye road reflectors.</p>'},
  {lb:'Optical fibres',dr:dQ6,ht:'<p>Step-index fibre: core (high n) and cladding (low n); TIR keeps light in core. Uses: internet cables (infrared light), medical endoscopes, sensors. Dispersion: different wavelengths travel at slightly different speeds \u2192 pulse broadening (multimode dispersion). Single-mode fibre: very narrow core; eliminates modal dispersion.</p>'},
  {lb:'Dispersion and prism',dr:dQ6,ht:'<p>Dispersion: different wavelengths have different refractive indices (n increases as \u03bb decreases: violet bends more than red). Prism: white light separated into spectrum. Rainbow: dispersion in raindrops (refraction + TIR + refraction). Chromatic aberration in lenses: different colours focus at different distances.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['snell','critical_angle','speed_in_medium']);if(type==='snell'){var n1=1,n2=pick([1.3,1.5,1.7,2.0]),th1=pick([20,30,40,50]),sinTh2=parseFloat((n1*Math.sin(th1*Math.PI/180)/n2).toFixed(4)),th2=parseFloat((Math.asin(sinTh2)*180/Math.PI).toFixed(1));return{question:'n\u2081=1, n\u2082=<b>'+n2+'</b>, \u03b8\u2081=<b>'+th1+'\u00b0</b>. Angle of refraction \u03b8\u2082?',hints:['n\u2081 sin\u03b8\u2081=n\u2082 sin\u03b8\u2082'],ans:th2,tol:0.5,unit:'\u00b0',working:'sin\u03b8\u2082=sin'+th1+'\u00b0/'+n2+'; \u03b8\u2082='+th2+'\u00b0'};}if(type==='critical_angle'){var n=pick([1.3,1.5,1.7,2.0]),th_c=parseFloat((Math.asin(1/n)*180/Math.PI).toFixed(1));return{question:'Glass n=<b>'+n+'</b> (in air). Critical angle?',hints:['sin\u03b8_c=1/n'],ans:th_c,tol:0.5,unit:'\u00b0',working:'sin\u03b8_c=1/'+n+'; \u03b8_c='+th_c+'\u00b0'};}var n=pick([1.33,1.5,2.0]),v=parseFloat((3e8/n/1e8).toFixed(3));return{question:'n=<b>'+n+'</b>. Speed of light in medium?',hints:['v=c/n'],ans:v*1e8,tol:v*1e8*0.02,unit:'m/s',working:'v=3\u00d710\u2078/'+n+' = '+v+'\u00d710\u2078 m/s'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Waves',ti:'Sound Waves',su:'Describe sound wave properties. Calculate sound intensity and speed.',steps:[
  {lb:'Sound as a longitudinal wave',dr:dQ7,ht:'<p>Sound is a longitudinal mechanical wave requiring a medium. Compressions: regions of high pressure. Rarefactions: regions of low pressure. Frequency range: infrasound (<20Hz), audible (20Hz-20kHz), ultrasound (>20kHz). Speed in air \u2248 340 m/s (at 20\u00b0C); faster in denser/stiffer materials.</p>'},
  {lb:'Intensity and the decibel scale',dr:dQ7,ht:'<div class="fm">I = P/(4\u03c0r\u00b2) &nbsp;&nbsp; L = 10 log(I/I\u2080) dB</div><p>I\u2080 = 10\u207b\u00b9\u00b2 W/m\u00b2 (threshold of hearing). 10 dB increase \u2192 intensity \u00d710. 20 dB \u2192 \u00d7100. 0 dB = threshold. 60 dB = normal speech. 120 dB = pain threshold. I \u221d A\u00b2 (intensity proportional to amplitude squared).</p>'},
  {lb:'Beats',dr:dQ7,ht:'<p>Beats: periodic variation in amplitude when two sources of slightly different frequency interfere. Beat frequency = |f\u2081 - f\u2082|. Heard as wavering sound. Used to tune instruments (beat frequency \u2192 0 when in tune). Maximum loudness when waves are in phase; minimum when anti-phase.</p>'},
  {lb:'Doppler effect',dr:dQ7,ht:'<div class="fm">f_obs = f_s(v\u00b1v_obs)/(v\u2213v_s)</div><p>Observed frequency changes when source or observer moves. Source approaching observer: f_obs > f_s (higher pitch). Source receding: f_obs < f_s (lower pitch). Applications: radar speed guns, astronomical redshift, medical ultrasound (blood flow).</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['intensity','beat_freq','doppler']);if(type==='intensity'){var P=rnd(1,100),r=rnd(1,20),I=parseFloat((P/(4*Math.PI*r*r)).toFixed(4));return{question:'Source P=<b>'+P+'W</b>, r=<b>'+r+'m</b>. Intensity?',hints:['I=P/(4\u03c0r\u00b2)'],ans:I,tol:I*0.03,unit:'W/m\u00b2',working:'I='+P+'/(4\u03c0\u00d7'+r+'\u00b2) = '+I+' W/m\u00b2'};}if(type==='beat_freq'){var f1=rnd(400,800),f2=f1+rnd(1,10),fb=f2-f1;return{question:'f\u2081=<b>'+f1+' Hz</b>, f\u2082=<b>'+f2+' Hz</b>. Beat frequency?',hints:['f_beat=|f\u2081-f\u2082|'],ans:fb,tol:0,unit:'Hz',working:'f_beat=|'+f1+'-'+f2+'| = '+fb+' Hz'};}var fs=rnd(200,2000),v=340,vs=rnd(10,50),f_obs=parseFloat((fs*v/(v-vs)).toFixed(1));return{question:'Source f=<b>'+fs+'Hz</b> approaching at v_s=<b>'+vs+'m/s</b>. Observed frequency?',hints:['f_obs=f_s\u00d7v/(v-v_s) (approaching)'],ans:f_obs,tol:f_obs*0.02,unit:'Hz',working:'f_obs='+fs+'\u00d7340/(340-'+vs+') = '+f_obs+' Hz'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Waves',ti:'Wave Energy and Intensity',su:'Calculate wave energy and intensity. Apply the inverse square law.',steps:[
  {lb:'Energy in waves',dr:dQ8,ht:'<p>Energy transported by a wave is proportional to: amplitude squared (E \u221d A\u00b2), frequency squared (E \u221d f\u00b2 for mechanical waves). Power P = energy / time. Intensity I = power / area. For progressive wave: I = \u00bd\u03c1v\u03c9\u00b2A\u00b2 (per unit area, per unit time). Doubling amplitude quadruples intensity.</p>'},
  {lb:'Inverse square law',dr:dQ8,ht:'<div class="fm">I = P/(4\u03c0r\u00b2) \u221d 1/r\u00b2</div><p>For a point source radiating uniformly: intensity I \u221d 1/r\u00b2. Also: I \u221d A\u00b2 so amplitude A \u221d 1/r. At distance r\u2082: I\u2082/I\u2081 = (r\u2081/r\u2082)\u00b2. Used for: sound from speakers, light from bulbs, radiation from point sources.</p>'},
  {lb:'Energy transmission and absorption',dr:dQ8,ht:'<p>As waves travel through absorbing medium: I = I\u2080 e^(-\u03bcx) (exponential attenuation). \u03bc = attenuation coefficient. X-rays in tissue: attenuate exponentially; half-value thickness = ln2/\u03bc. Beer-Lambert law for light: I = I\u2080 e^(-\u03b5cx) where \u03b5 = molar absorptivity, c = concentration.</p>'},
  {lb:'Power and efficiency of waves',dr:dQ8,ht:'<p>Wave power for simple harmonic oscillator: P_avg = \u00bd m\u03c9\u00b2A\u00b2/T = \u00bd m v_max\u00b2 / T. Ocean wave power per unit width: P/w \u2248 \u03c1g\u00b2A\u00b2T/(8\u03c0) \u2248 0.5\u00d7A\u00b2\u00d7T kW/m (approximate). Useful for wave energy generation calculations.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['I_from_PA','ratio_I','amplitude_ratio']);if(type==='I_from_PA'){var P=rnd(10,1000),r=rnd(1,20),I=parseFloat((P/(4*Math.PI*r*r)).toFixed(3));return{question:'P=<b>'+P+'W</b>, r=<b>'+r+'m</b>. Intensity?',hints:['I=P/(4\u03c0r\u00b2)'],ans:I,tol:I*0.03,unit:'W/m\u00b2',working:'I='+P+'/(4\u03c0\u00d7'+r+'\u00b2) = '+I+' W/m\u00b2'};}if(type==='ratio_I'){var r1=rnd(1,5),r2=rnd(6,20),ratio=parseFloat((r1*r1/(r2*r2)).toFixed(3));return{question:'r\u2081=<b>'+r1+'m</b>, r\u2082=<b>'+r2+'m</b>. Ratio I(r\u2082)/I(r\u2081)?',hints:['I\u221d1/r\u00b2; ratio=(r\u2081/r\u2082)\u00b2'],ans:ratio,tol:ratio*0.03,unit:'',working:'I\u2082/I\u2081=('+r1+'/'+r2+')\u00b2 = '+ratio};}var A1=rnd(1,10),A2=rnd(1,10),I_ratio=parseFloat(((A1/A2)*(A1/A2)).toFixed(2));return{question:'Amplitudes A\u2081=<b>'+A1+'</b>, A\u2082=<b>'+A2+'</b>. Intensity ratio I\u2081/I\u2082?',hints:['I\u221dA\u00b2; ratio=(A\u2081/A\u2082)\u00b2'],ans:I_ratio,tol:I_ratio*0.03,unit:'',working:'I\u2081/I\u2082=('+A1+'/'+A2+')\u00b2 = '+I_ratio};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Waves',ti:'Phase and Path Difference',su:'Calculate phase difference from path difference. Apply to interference problems.',steps:[
  {lb:'Phase and path difference',dr:dQ9,ht:'<p>Path difference \u0394x and phase difference \u03c6 are related by: \u03c6 = 2\u03c0\u0394x/\u03bb (radians) or \u03c6 = 360\u00b0 \u00d7 \u0394x/\u03bb (degrees). One full wavelength path difference = 2\u03c0 rad = 360\u00b0 phase difference = constructive. Half wavelength = \u03c0 rad = 180\u00b0 = destructive.</p>'},
  {lb:'Applying to double slit',dr:dQ9,ht:'<p>For two slits separated by d, point P on screen at angle \u03b8: path difference = d\u202fsin\u03b8. Bright fringe: d\u202fsin\u03b8 = n\u03bb. Dark fringe: d\u202fsin\u03b8 = (n+\u00bd)\u03bb. Fringe spacing: \u03b8 small \u2192 y = \u03bbD/d. For large angle: use d\u202fsin\u03b8 = n\u03bb directly.</p>'},
  {lb:'Multiple source interference',dr:dQ9,ht:'<p>Three or more sources: principal maxima when all in phase (all path differences multiples of \u03bb). Secondary maxima smaller. More slits (grating): sharper, brighter principal maxima; more secondary maxima between them; zero-order maximum at centre (\u03b8=0). Used in spectroscopy for high resolution.</p>'},
  {lb:'Thin film interference',dr:dQ9,ht:'<p>Light reflects from top and bottom surfaces of thin film (e.g. soap bubble, oil slick). Phase change on reflection: occurs when reflecting from optically denser medium (\u03c0 phase change = \u03bb/2 path difference equivalent). Condition for constructive: 2t = (n+\u00bd)\u03bb/n_film (with one phase change). Beautiful colours from different thicknesses.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['phase_from_path','path_from_phase','fringe_order']);if(type==='phase_from_path'){var lam=rnd(400,700),path=rnd(1,5)*lam/2,phase=parseFloat((360*path/lam).toFixed(0));return{question:'Path diff=<b>'+path+'nm</b>, \u03bb=<b>'+lam+'nm</b>. Phase difference (degrees)?',hints:['\u03c6=360\u00b0\u00d7\u0394x/\u03bb'],ans:phase,tol:phase*0.02,unit:'\u00b0',working:'\u03c6=360\u00d7'+path+'/'+lam+' = '+phase+'\u00b0'};}if(type==='path_from_phase'){var lam=rnd(400,700),n=rnd(1,5),path=n*lam;return{question:'\u03bb=<b>'+lam+'nm</b>, constructive, order n=<b>'+n+'</b>. Path difference?',hints:['path diff=n\u03bb'],ans:path,tol:0,unit:'nm',working:'path diff='+n+'\u00d7'+lam+' = '+path+' nm'};}var N=rnd(400,600),d=1/N*1e-3,lam=rnd(400,700)*1e-9,n_max=Math.floor(d/lam);return{question:'Grating <b>'+N+'lines/mm</b>, \u03bb=<b>'+Math.round(lam*1e9)+'nm</b>. Max diffraction order?',hints:['n_max=d/\u03bb (when sin\u03b8=1)'],ans:n_max,tol:0,unit:'',working:'n_max='+d.toExponential(4)+'/'+lam.toExponential(4)+' = '+n_max};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Waves',ti:'Mixed Waves Questions',su:'Integrated questions across all Y12-WAV-01 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>v=f\u03bb. Transverse vs longitudinal. Superposition. Constructive: path diff=n\u03bb. Destructive: (n+\u00bd)\u03bb. Fringe spacing y=\u03bbD/d. Stationary wave: nodes and antinodes. Harmonics: f_n=nv/(2L). Snell: n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082. TIR: sin\u03b8_c=n\u2082/n\u2081. Grating: d\u202fsin\u03b8=n\u03bb. Doppler: f_obs=f_s v/(v-v_s).</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC regularly tests: v=f\u03bb; stationary waves and harmonics; refraction and Snell\u2019s law; TIR and critical angle; interference (constructive/destructive conditions); double-slit fringe spacing. Know all wave formulae and be able to identify wave types from descriptions.</p>'},
  {lb:'Linking wave concepts',dr:dQ10,ht:'<p>Progressive wave \u2192 hits boundary \u2192 reflected wave \u2192 superposition of incident + reflected \u2192 stationary wave. Coherent sources + superposition \u2192 interference pattern (double-slit). Diffraction: waves spread around obstacles, most when \u03bb comparable to gap size.</p>'},
  {lb:'Key formulae',dr:dQ10,ht:'<div class="fm">v=f\u03bb \u2022 y=\u03bbD/d \u2022 d\u202fsin\u03b8=n\u03bb</div><div class="fm">n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082 \u2022 sin\u03b8_c=1/n</div>'},
