<style>
:root{--red:#1565C0;--dark:#0d47a1;--cream:#E3F2FD;--ink:#0d1b2a;--line:#BBDEFB;--gold:#C8922A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
header{background:var(--red);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;}
.back{font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:3px;text-decoration:none;}
.ht{font-size:15px;font-weight:700;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 20px 60px;gap:28px;}
.sb{width:215px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.sb-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:700;margin-bottom:4px;}
.qb{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer;font-size:12px;transition:.15s;color:var(--ink);}
.qb:hover{border-color:var(--red);color:var(--red);}
.qb.on{background:var(--red);color:#fff;border-color:var(--red);}
.qn{font-weight:700;font-size:10px;display:block;opacity:.7;}
.main{flex:1;min-width:0;}
.hdr{width:100%;max-width:760px;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:20px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;}
.hdr h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 4px;line-height:1.2;}
.sub{font-size:14px;color:#555;}
.stage{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:760px;}
.cvs{background:linear-gradient(#fff,#E3F2FD);padding:14px 0 4px;display:flex;justify-content:center;}
.cvs svg{width:100%;max-width:520px;height:auto;}
.pnl{padding:20px 24px 24px;border-top:1px solid var(--line);min-height:180px;}
.sl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.pnl p{font-size:15px;line-height:1.6;margin:0 0 8px;}
.fm{font-family:'Cambria Math',Georgia,serif;font-size:16px;background:var(--cream);border-left:4px solid var(--red);padding:9px 13px;margin:8px 0;display:block;}
.ctrl{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.btn{font-size:14px;font-weight:600;padding:9px 18px;border-radius:3px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;}
.btn.p{background:var(--red);color:#fff;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:not(:disabled):hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--red);}.dot.dn{background:var(--gold);}
.fi{animation:fi .4s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.try{background:#fff;border:2px solid var(--gold);border-radius:6px;padding:18px 20px;margin-top:4px;}
.try-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.try-q{font-size:15px;margin-bottom:8px;line-height:1.5;}
.hl{font-size:14px;color:#1a2a3a;margin:8px 0 12px;padding-left:4px;list-style:none;}
.hl li{margin-bottom:5px;padding-left:18px;position:relative;}
.hl li::before{content:">";position:absolute;left:0;color:var(--gold);font-weight:700;}
.ar{display:flex;gap:8px;margin-top:6px;}
.ar input{flex:1;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;outline:none;font-family:inherit;}
.ar input:focus{border-color:var(--gold);}
.ck{font-size:14px;font-weight:600;padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ck:hover{background:#a07018;}
.try-fb{margin-top:10px;font-size:14px;padding:9px 12px;border-radius:3px;display:none;}
.try-fb.ok{background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9;display:block;}
.try-fb.er{background:#fde8e8;color:#a01820;border:1px solid #f0b8b8;display:block;}
.wk summary{cursor:pointer;color:var(--red);font-weight:600;font-size:14px;}
.wk-b{margin-top:8px;font-size:14px;line-height:1.6;color:#1a2a3a;}
@media(max-width:640px){.layout{flex-direction:column;}.sb{width:100%;flex-direction:row;flex-wrap:wrap;}.qb{flex:1;min-width:80px;}}
</style>

<script>
var ACC='#1565C0',DARK='#0d47a1',CRM='#E3F2FD',LINE='#BBDEFB';
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
var ST={};
function tryIt(genFn){var id='t'+Math.random().toString(36).slice(2);var o=genFn();ST[id]={o:o,genFn:genFn};return buildTry(id,o);}
function buildTry(id,o){
  var h=(o.hints||[]).map(function(x){return '<li>'+x+'</li>';}).join('');
  var wk=(h?'<ul class="hl">'+h+'</ul>':'')+'<div class="wk-b">'+o.working+'</div>';
  return '<div class="try" data-tryid="'+id+'"><div class="try-t">&#10004; Your Turn</div><div class="try-q">'+o.question+'</div>'
    +'<div class="ar"><input type="number" step="any" placeholder="Answer'+(o.unit?' ('+o.unit+')':'')+'" class="try-inp" data-tryid="'+id+'"/>'
    +'<button class="ck try-ck" data-tryid="'+id+'">Check</button></div>'
    +'<div class="try-fb" data-tryid="'+id+'"></div>'
    +'<details class="wk"><summary>Show working</summary>'+wk+'</details>'
    +'<div style="margin-top:10px;"><button class="ck try-new" data-tryid="'+id+'" style="background:#888;">New question</button></div></div>';
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.classList.contains('try-new')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;
    var o=entry.genFn();entry.o=o;
    var wrap=el.closest('.try');if(!wrap)return;
    var tmp=document.createElement('div');tmp.innerHTML=buildTry(id,o);
    wrap.parentNode.replaceChild(tmp.firstChild,wrap);ST[id]={o:o,genFn:entry.genFn};return;
  }
  if(el.classList.contains('try-ck')){
    var id=el.getAttribute('data-tryid');var entry=ST[id];if(!entry)return;var o=entry.o;
    var inp=document.querySelector('.try-inp[data-tryid="'+id+'"]');
    var fb=document.querySelector('.try-fb[data-tryid="'+id+'"]');if(!inp||!fb)return;
    var v=parseFloat(inp.value);
    if(isNaN(v)){fb.className='try-fb er';fb.textContent='Enter a number.';return;}
    if(Math.abs(v-o.ans)<=(o.tol!=null?o.tol:0.05*Math.abs(o.ans)||0.05)){fb.className='try-fb ok';fb.innerHTML='&#10003; Correct! &nbsp;'+o.working;}
    else{fb.className='try-fb er';fb.textContent='Not quite \u2014 check your working and try again.';}
  }
});
function g(){return document.getElementById('dg');}
function T(x,y,txt,c,sz,a,bold){c=c||'#0d1b2a';sz=sz||12;a=a||'middle';return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" font-family="Arial" fill="'+c+'" text-anchor="'+a+'" font-weight="'+(bold?700:400)+'">'+txt+'</text>';}
function R(x,y,w,h,fill,stroke,sw){fill=fill||CRM;stroke=stroke||ACC;sw=sw||1.5;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" rx="3"/>';}
function L(x1,y1,x2,y2,c,w,d){c=c||'#888';w=w||1.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+'/>';}
function arw(x1,y1,x2,y2,c,w){var id='m'+Math.round(x1*7+y2*3);return '<defs><marker id="'+id+'" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="'+(c||ACC)+'"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||ACC)+'" stroke-width="'+(w||2)+'" marker-end="url(#'+id+')"/>';}
function circ(cx,cy,r,fill,stroke){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||CRM)+'" stroke="'+(stroke||ACC)+'" stroke-width="1.5"/>';}

function dQ1(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'EM spectrum',ACC,13,'middle',true));
[['Type','Wavelength','Frequency','Source'],['Gamma','\u03bb<10pm','f>10\u00b2\u2070Hz','Nuclear decay'],['X-ray','10pm-10nm','10\u00b9\u00b7-10\u00b2\u2070Hz','X-ray tube'],['UV','10-400nm','10\u00b9\u2075-10\u00b9\u2076Hz','Sun, UV lamp'],['Visible','400-700nm','4-7\u00d710\u00b9\u2074Hz','Light sources'],['IR','700nm-1mm','3\u00d710\u00b9\u00b9-4\u00d710\u00b9\u2074Hz','Warm objects'],['Microwave','1mm-30cm','10\u2079-3\u00d710\u00b9\u00b9Hz','Magnetron, radar'],['Radio','>30cm','<10\u2079Hz','Aerial/antenna']].forEach(function(r,i){if(i<=p){o.push(R(10,26+i*30,460,24,i===0?LINE:CRM,i===0?ACC:LINE,0.5));r.forEach(function(v,j){o.push(T(15+j*113,42+i*30,v,i===0?ACC:'#333',i===0?8:7,'start',i===0));});}});
s.innerHTML=o.join('');}
function dQ2(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Lenses and images',ACC,12,'middle',true));
o.push(R(10,36,460,44,CRM,ACC,2));o.push(T(240,58,'1/v + 1/u = 1/f &nbsp;&nbsp; m = v/u',DARK,13,'middle',true));
if(p>=1){o.push(R(10,90,460,40,CRM,ACC,1.5));o.push(T(240,108,'Convex (converging): real focus; f positive','#333',10,'middle',false));o.push(T(240,126,'Concave (diverging): virtual focus; f negative','#555',9,'middle',false));}
if(p>=2){o.push(R(10,140,460,40,CRM,ACC,1.5));o.push(T(240,158,'Real image: formed by actual rays; on opposite side; inverted','#333',10,'middle',false));o.push(T(240,176,'Virtual image: rays diverge; same side as object; upright','#555',9,'middle',false));}
if(p>=3){o.push(R(10,190,460,40,CRM,ACC,1.5));o.push(T(240,208,'Sign convention: distances measured from lens centre','#333',10,'middle',false));o.push(T(240,226,'Real and positive: v positive. Virtual: v negative.','#555',9,'middle',false));}
if(p>=4){o.push(R(10,238,460,18,LINE,ACC,0.5));o.push(T(240,250,'Power of lens P = 1/f (dioptres; f in metres)','#555',8,'middle',false));}
s.innerHTML=o.join('');}
function dQ3(p){dQ1(p);}
function dQ4(p){dQ2(p);}
function dQ5(p){dQ1(p);}
function dQ6(p){dQ2(p);}
function dQ7(p){dQ1(p);}
function dQ8(p){dQ2(p);}
function dQ9(p){dQ1(p);}
function dQ10(p){var s=g(),o=[];s.setAttribute('viewBox','0 0 480 260');
o.push(T(240,20,'Light summary',ACC,13,'middle',true));
[['EM spectrum','same speed c in vacuum; varies v in medium'],['Visible light','400nm (violet) to 700nm (red)'],['Lens formula','1/v+1/u=1/f; m=v/u'],['Convex lens','converging; f positive; can form real image'],['Concave lens','diverging; f negative; always virtual image'],['Power','P=1/f (dioptres)'],['Photon energy','E=hf=hc/\u03bb']].forEach(function(r,i){if(i<p+1){o.push(R(10,36+i*30,460,24,CRM,LINE,1));o.push(T(120,52+i*30,r[0],ACC,10,'middle',true));o.push(T(320,52+i*30,r[1],'#555',9,'middle',false));}});
s.innerHTML=o.join('');}
var QS=[
{ey:'Q1 \u2022 Y12 Physics \u2022 Light',ti:'Electromagnetic Spectrum',su:'State properties and uses of EM radiation. Apply v=f\u03bb.',steps:[
  {lb:'EM spectrum overview',dr:dQ1,ht:'<p>All EM waves travel at c = 3\u00d710\u2078 m/s in vacuum, regardless of frequency. The spectrum (increasing frequency / decreasing wavelength): radio, microwave, infrared, visible (ROY G BIV: 700nm red to 400nm violet), UV, X-ray, gamma. All are transverse; all can be polarised; all obey v=f\u03bb.</p>'},
  {lb:'Properties and penetration',dr:dQ1,ht:'<p>Penetration increases with frequency. Radio: long range communications; passes through buildings. Microwave: satellite comms, cooking, radar. IR: heat sensing, remote controls, fibre optics. Visible: human vision, photography. UV: sterilisation, fluorescence. X-ray: medical imaging, security. Gamma: cancer treatment, sterilisation, highest penetration.</p>'},
  {lb:'Photon energy',dr:dQ1,ht:'<div class="fm">E = hf = hc/\u03bb (J)</div><p>h = 6.63\u00d710\u207b\u00b3\u2074 J s (Planck\u2019s constant). Higher frequency \u2192 more energetic photons \u2192 more ionising. Visible light photons: E \u2248 2\u20133 eV. X-ray photons: E \u2248 10\u00b3\u201310\u2074 eV (can ionise atoms, cause DNA damage). 1 eV = 1.6\u00d710\u207b\u00b9\u2079 J.</p>'},
  {lb:'Speed in a medium',dr:dQ1,ht:'<p>In a medium with refractive index n: v = c/n. In glass (n\u22481.5): v\u22482\u00d710\u2078 m/s. Frequency unchanged when entering medium; wavelength changes: \u03bb_medium = \u03bb_vacuum/n. Speed of radio waves in atmosphere: slightly less than c (n_air \u2248 1.0003). GPS must correct for this.</p>'},
  {lb:'Your turn',dr:dQ1,ht:tryIt(function(){var type=pick(['E_photon','v_from_fl','c_in_medium']);if(type==='E_photon'){var lam=rnd(100,700)*1e-9,h=6.63e-34,c=3e8,E=parseFloat((h*c/lam).toExponential(2));return{question:'\u03bb=<b>'+Math.round(lam*1e9)+'nm</b>. Photon energy?',hints:['E=hc/\u03bb; h=6.63\u00d710\u207b\u00b3\u2074, c=3\u00d710\u2078'],ans:parseFloat(E),tol:parseFloat(E)*0.05,unit:'J',working:'E=6.63\u00d710\u207b\u00b3\u2074\u00d73\u00d710\u2078/'+lam.toExponential(2)+' = '+E+' J'};}if(type==='v_from_fl'){var f=rnd(1,100)*1e6,lam=parseFloat((3e8/f).toFixed(2));return{question:'f=<b>'+(f/1e6).toFixed(0)+' MHz</b>. Wavelength in vacuum?',hints:['\u03bb=c/f'],ans:lam,tol:lam*0.02,unit:'m',working:'\u03bb=3\u00d710\u2078/'+f.toExponential(2)+' = '+lam+' m'};}var n=pick([1.33,1.5,2.0]),v=parseFloat((3e8/n).toFixed(0));return{question:'n=<b>'+n+'</b>. Speed of light in medium?',hints:['v=c/n'],ans:v,tol:v*0.02,unit:'m/s',working:'v=3\u00d710\u2078/'+n+' = '+v+' m/s'};})},
]},
{ey:'Q2 \u2022 Y12 Physics \u2022 Light',ti:'Refraction and Snell\u2019s Law',su:'Apply n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082. Calculate critical angle.',steps:[
  {lb:'Snell\u2019s law',dr:dQ2,ht:'<div class="fm">n\u2081 sin\u03b8\u2081 = n\u2082 sin\u03b8\u2082</div><p>n = c/v = refractive index. n_air \u2248 1. n_water \u2248 1.33. n_glass \u2248 1.5. n_diamond \u2248 2.42. Light bends toward normal when going from less dense to more dense medium (slows down). Bends away when going from more dense to less dense (speeds up).</p>'},
  {lb:'Total internal reflection',dr:dQ2,ht:'<div class="fm">sin\u03b8_c = n\u2082/n\u2081 = 1/n (air outside)</div><p>TIR when: light travels from denser to less dense medium AND angle of incidence \u2265 critical angle. At critical angle: refracted ray at 90\u00b0 to normal. Above critical angle: all light reflected. Applications: optical fibres, diamond brilliance, binoculars (Porro prism), cats eyes on roads.</p>'},
  {lb:'Optical fibres',dr:dQ2,ht:'<p>Step-index fibre: core (high n) surrounded by cladding (low n); TIR keeps light inside core. Single-mode: very narrow core; eliminates multimode dispersion; used for long-distance broadband. Multi-mode: wider core; modal dispersion (different path lengths); used for short distances. Endoscopes use bundles of optical fibres for imaging.</p>'},
  {lb:'Dispersion and colours',dr:dQ2,ht:'<p>Dispersion: n varies with \u03bb. For glass: n_violet > n_red (\u03b2 dispersion). Prism: white light separated into spectrum. Red deviated least (smallest n), violet most. Chromatic aberration in lenses: different colours focus at different distances. Corrected by achromatic doublet (two lenses of different glass). Rainbow: dispersion in raindrops.</p>'},
  {lb:'Your turn',dr:dQ2,ht:tryIt(function(){var type=pick(['snell_th2','critical_angle','n_from_snell']);if(type==='snell_th2'){var n1=1,n2=pick([1.33,1.5,2.0]),th1=pick([20,30,40]),sinT=n1*Math.sin(th1*Math.PI/180)/n2,th2=parseFloat((Math.asin(sinT)*180/Math.PI).toFixed(1));return{question:'n\u2081=1, n\u2082=<b>'+n2+'</b>, \u03b8\u2081=<b>'+th1+'\u00b0</b>. \u03b8\u2082?',hints:['n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082'],ans:th2,tol:0.5,unit:'\u00b0',working:'sin\u03b8\u2082=sin'+th1+'\u00b0/'+n2+'; \u03b8\u2082='+th2+'\u00b0'};}if(type==='critical_angle'){var n=pick([1.33,1.5,1.7,2.42]),thc=parseFloat((Math.asin(1/n)*180/Math.PI).toFixed(1));return{question:'n=<b>'+n+'</b> (air outside). Critical angle?',hints:['sin\u03b8_c=1/n'],ans:thc,tol:0.5,unit:'\u00b0',working:'sin\u03b8_c=1/'+n+'; \u03b8_c='+thc+'\u00b0'};}var n1=1,n2=pick([1.33,1.5,1.7]),th1=pick([20,30,40]),th2=parseFloat((Math.asin(n1*Math.sin(th1*Math.PI/180)/n2)*180/Math.PI).toFixed(1));return{question:'Ray enters: \u03b8\u2081=<b>'+th1+'\u00b0</b>, \u03b8\u2082=<b>'+th2+'\u00b0</b>. Find n\u2082 (n\u2081=1)?',hints:['n\u2082=n\u2081sin\u03b8\u2081/sin\u03b8\u2082'],ans:n2,tol:0.03,unit:'',working:'n\u2082=sin'+th1+'\u00b0/sin'+th2+'\u00b0 = '+n2};})},
]},
{ey:'Q3 \u2022 Y12 Physics \u2022 Light',ti:'Lenses and Image Formation',su:'Use lens formula 1/v+1/u=1/f. Calculate magnification.',steps:[
  {lb:'Lens formula',dr:dQ3,ht:'<div class="fm">1/v + 1/u = 1/f &nbsp;&nbsp; m = v/u</div><p>u = object distance (positive when object on same side as incoming light). v = image distance (positive when real image on opposite side). f = focal length (positive for convex/converging; negative for concave/diverging). Magnification m = image height / object height = v/u.</p>'},
  {lb:'Convex (converging) lens',dr:dQ3,ht:'<p>Object beyond 2f: real, inverted, diminished image beyond f on other side. Object at 2f: real, inverted, same size at 2f. Object between f and 2f: real, inverted, magnified beyond 2f. Object within f: virtual, upright, magnified on same side as object. Used as: magnifying glass (object within f), camera (object far away), eye.</p>'},
  {lb:'Concave (diverging) lens',dr:dQ3,ht:'<p>Always produces virtual, upright, diminished image on same side as object, within focal length. Used for: myopia (short-sightedness) correction. f is negative. Image is always virtual. Power P = 1/f (negative for diverging, positive for converging). Combined lens power: P_total = P\u2081 + P\u2082.</p>'},
  {lb:'Eye defects and corrections',dr:dQ3,ht:'<p>Myopia (short sight): eyeball too long; image in front of retina. Corrected by concave (diverging) lens. Hyperopia (long sight): eyeball too short; image behind retina. Corrected by convex (converging) lens. Presbyopia: loss of accommodation (flexibility of lens) with age. Astigmatism: cornea not spherical; corrected by cylindrical lenses.</p>'},
  {lb:'Your turn',dr:dQ3,ht:tryIt(function(){var type=pick(['find_v','find_m','find_f']);if(type==='find_v'){var u=rnd(20,100),f=rnd(5,u-1),v=parseFloat((1/(1/f-1/u)).toFixed(1));return{question:'u=<b>'+u+'cm</b>, f=<b>'+f+'cm</b>. Image distance v?',hints:['1/v=1/f-1/u'],ans:v,tol:Math.abs(v)*0.03,unit:'cm',working:'1/v=1/'+f+'-1/'+u+'; v='+v+' cm'};}if(type==='find_m'){var u=rnd(20,100),f=rnd(5,u-1),v=parseFloat((1/(1/f-1/u)).toFixed(1)),m=parseFloat((v/u).toFixed(2));return{question:'u=<b>'+u+'cm</b>, f=<b>'+f+'cm</b>. Magnification m?',hints:['Find v first from lens formula, then m=v/u'],ans:m,tol:Math.abs(m)*0.05,unit:'',working:'v='+v+'cm; m='+v+'/'+u+' = '+m};}var f=rnd(5,30),u=rnd(f+5,100),v=parseFloat((u*f/(u-f)).toFixed(1));return{question:'v=<b>'+v.toFixed(1)+'cm</b>, u=<b>'+u+'cm</b>. Focal length f?',hints:['1/f=1/v+1/u'],ans:f,tol:f*0.05,unit:'cm',working:'1/f=1/'+v.toFixed(1)+'+1/'+u+'; f='+f+' cm'};})},
]},
{ey:'Q4 \u2022 Y12 Physics \u2022 Light',ti:'Colour and Spectra',su:'Describe emission and absorption spectra. Explain colour mixing.',steps:[
  {lb:'Emission spectra',dr:dQ4,ht:'<p>Continuous spectrum: hot dense object (blackbody); all wavelengths present; seen through prism. Line emission spectrum: excited gas; specific wavelengths emitted; each element has unique spectrum (fingerprint). Photon emitted when electron transitions from higher to lower energy level: E = hf = E\u2081 - E\u2082.</p>'},
  {lb:'Absorption spectra',dr:dQ4,ht:'<p>Cool gas in front of continuous source: absorbs same specific wavelengths it would emit; dark lines on continuous spectrum (Fraunhofer lines in sunlight). Same wavelengths absorbed as emitted (same energy transitions). Used to identify elements in stars, galaxies (redshift too). Absorption \u2192 atom excited; then re-emits in all directions.</p>'},
  {lb:'Colour mixing',dr:dQ4,ht:'<p>Additive mixing (light): Red + Green + Blue = White. Secondary: Cyan (G+B), Magenta (R+B), Yellow (R+G). Screen pixels use R, G, B. Subtractive mixing (pigments/paints): Cyan + Magenta + Yellow = Black. Printer ink CMYK. Filter: transmits its own colour, absorbs others. Two complementary colours add to white.</p>'},
  {lb:'Blackbody radiation',dr:dQ4,ht:'<p>Blackbody: perfect absorber and emitter of radiation. Spectrum peaks at wavelength \u03bb_max = b/T (Wien\u2019s law; b = 2.898\u00d710\u207b\u00b3 m K). Hotter object: peak at shorter wavelength, more intense, blue-shifted. Stefan\u2019s law: P = \u03c3AT\u2074 (total power). \u03c3 = 5.67\u00d710\u207b\u2078 W m\u207b\u00b2 K\u207b\u2074. Stars: surface temperature from colour (Wien) and luminosity (Stefan).</p>'},
  {lb:'Your turn',dr:dQ4,ht:tryIt(function(){var type=pick(['photon_E','Wien','Stefan_P']);if(type==='photon_E'){var lam=rnd(200,700)*1e-9,E=parseFloat((6.63e-34*3e8/lam).toExponential(2));return{question:'\u03bb=<b>'+Math.round(lam*1e9)+'nm</b>. Photon energy (J)?',hints:['E=hc/\u03bb; h=6.63\u00d710\u207b\u00b3\u2074'],ans:parseFloat(E),tol:parseFloat(E)*0.05,unit:'J',working:'E=6.63\u00d710\u207b\u00b3\u2074\u00d73\u00d710\u2078/'+lam.toExponential(2)+' = '+E+' J'};}if(type==='Wien'){var T=rnd(3000,30000),lam_max=parseFloat((2.898e-3/T*1e9).toFixed(0));return{question:'Star surface T=<b>'+T+' K</b>. Peak wavelength (Wien)?',hints:['\u03bb_max=b/T; b=2.898\u00d710\u207b\u00b3 m K'],ans:lam_max,tol:lam_max*0.03,unit:'nm',working:'\u03bb_max=2.898\u00d710\u207b\u00b3/'+T+'\u00d710\u2079 = '+lam_max+' nm'};}var A=rnd(1,100)*1e-6,T=rnd(1000,6000),P=parseFloat((5.67e-8*A*Math.pow(T,4)).toFixed(2));return{question:'Blackbody A=<b>'+A.toExponential(2)+'m\u00b2</b>, T=<b>'+T+'K</b>. Power radiated?',hints:['P=\u03c3AT\u2074; \u03c3=5.67\u00d710\u207b\u2078'],ans:P,tol:P*0.05,unit:'W',working:'P=5.67\u00d710\u207b\u2078\u00d7'+A.toExponential(2)+'\u00d7'+T+'\u2074 = '+P+' W'};})},
]},
{ey:'Q5 \u2022 Y12 Physics \u2022 Light',ti:'Mirrors',su:'Apply mirror formula. Locate images in concave and convex mirrors.',steps:[
  {lb:'Mirror formula',dr:dQ5,ht:'<div class="fm">1/v + 1/u = 1/f = 2/r</div><p>f = focal length = r/2 (r = radius of curvature). Sign convention (real is positive): u positive (real object). v positive for real image (in front of mirror). f positive for concave (converging); negative for convex (diverging). Magnification m = v/u.</p>'},
  {lb:'Concave mirror',dr:dQ5,ht:'<p>Object beyond C (2f): real, inverted, diminished image between f and C. Object at C: real, inverted, same size at C. Object between f and C: real, inverted, magnified beyond C. Object within f: virtual, upright, magnified behind mirror. Uses: car headlights (object at focus \u2192 parallel beam), dental mirrors, telescopes, solar furnaces.</p>'},
  {lb:'Convex mirror',dr:dQ5,ht:'<p>Always produces virtual, upright, diminished image behind mirror. Cannot form real image. Wide field of view. Uses: rear-view mirrors in cars, security mirrors in shops, wide-angle surveillance. f negative (focus behind mirror). Image always within focal length, same side as focus.</p>'},
  {lb:'Mirror vs lens comparison',dr:dQ5,ht:'<p>Same formula (1/v+1/u=1/f) applies to both. Key differences: mirror uses reflection; lens uses refraction. Mirror: no chromatic aberration (reflection wavelength-independent). Telescope using mirrors: no chromatic aberration, can be very large. Hubble Space Telescope uses concave mirror primary reflector (2.4 m diameter).</p>'},
  {lb:'Your turn',dr:dQ5,ht:tryIt(function(){var type=pick(['concave_v','convex_m','focal_from_uv']);if(type==='concave_v'){var u=rnd(20,100),f=rnd(5,u-1),v=parseFloat((1/(1/f-1/u)).toFixed(1));return{question:'Concave mirror u=<b>'+u+'cm</b>, f=<b>'+f+'cm</b>. v?',hints:['1/v=1/f-1/u'],ans:v,tol:Math.abs(v)*0.04,unit:'cm',working:'1/v=1/'+f+'-1/'+u+'; v='+v+' cm'};}if(type==='convex_m'){var u=rnd(10,50),f=-rnd(5,20),v=parseFloat((1/(1/f-1/u)).toFixed(1)),m=parseFloat((Math.abs(v/u)).toFixed(2));return{question:'Convex mirror u=<b>'+u+'cm</b>, f=<b>'+Math.abs(f)+'cm</b>. Magnification |m|?',hints:['1/v=1/f-1/u; m=v/u'],ans:m,tol:m*0.05,unit:'',working:'v='+v.toFixed(1)+'cm; |m|='+m};}var u=rnd(20,100),v=rnd(10,100),f=parseFloat((1/(1/u+1/v)).toFixed(1));return{question:'u=<b>'+u+'cm</b>, v=<b>'+v+'cm</b>. Focal length f?',hints:['1/f=1/v+1/u'],ans:f,tol:f*0.05,unit:'cm',working:'1/f=1/'+u+'+1/'+v+'; f='+f+' cm'};})},
]},
{ey:'Q6 \u2022 Y12 Physics \u2022 Light',ti:'Photoelectric Effect',su:'Describe the photoelectric effect. Apply Einstein\u2019s equation.',steps:[
  {lb:'Photoelectric effect',dr:dQ6,ht:'<p>Photoelectric effect: electrons emitted from metal surface when illuminated with light of sufficiently high frequency. Cannot be explained by wave theory. Key observations: (1) There is a threshold frequency f\u2080 below which no emission regardless of intensity. (2) Emission is instantaneous. (3) Max KE of emitted electrons is independent of intensity but depends on frequency.</p>'},
  {lb:'Einstein\u2019s equation',dr:dQ6,ht:'<div class="fm">hf = \u03c6 + KE_max = \u03c6 + \u00bdmv\u00b2</div><p>h = 6.63\u00d710\u207b\u00b3\u2074 J s. \u03c6 = work function = minimum energy to release electron = hf\u2080. KE_max = \u00bdmv_max\u00b2. Stopping voltage V_s: eV_s = KE_max. If hf < \u03c6: no emission. Increase intensity: more photons \u2192 more electrons (if hf > \u03c6), but same KE_max.</p>'},
  {lb:'Threshold frequency and work function',dr:dQ6,ht:'<p>\u03c6 = hf\u2080. \u03c6 depends on metal: caesium 3.0\u00d710\u207b\u00b9\u2079 J (lowest; used in photoelectric cells); platinum 10.0\u00d710\u207b\u00b9\u2079 J (highest visible). f\u2080 = \u03c6/h. Stopping potential: use V_s to measure KE_max: eV_s = KE_max \u2192 V_s = (hf-\u03c6)/e. Plot KE_max vs f: straight line, gradient = h, y-intercept = \u2212\u03c6.</p>'},
  {lb:'Evidence for particle nature of light',dr:dQ6,ht:'<p>Photoelectric effect proves light consists of photons (quanta) with E = hf. Wave theory prediction: (1) all frequencies should work given enough time; (2) KE should increase with intensity. Both predictions fail. Photon model explains: one photon \u2192 one electron; KE = hf\u2212\u03c6; threshold at f\u2080=\u03c6/h. Evidence for wave-particle duality of light.</p>'},
  {lb:'Your turn',dr:dQ6,ht:tryIt(function(){var type=pick(['KE_max','stopping_V','threshold_f']);if(type==='KE_max'){var phi=rnd(20,60)*1e-20,f=rnd(8,20)*1e14,E=6.63e-34*f,KE=parseFloat(((E-phi)*1e20).toFixed(1));if(KE<=0){KE=0;return{question:'f=<b>'+f.toExponential(2)+' Hz</b>, \u03c6=<b>'+phi.toExponential(2)+' J</b>. KE_max?',hints:['Check if hf>\u03c6'],ans:0,tol:0,unit:'J',working:'hf='+E.toExponential(2)+' < \u03c6; no emission; KE_max=0'};}return{question:'f=<b>'+f.toExponential(2)+' Hz</b>, \u03c6=<b>'+phi.toExponential(2)+' J</b>. KE_max?',hints:['KE_max=hf-\u03c6'],ans:parseFloat((E-phi).toExponential(2)),tol:parseFloat((E-phi).toExponential(2))*0.05,unit:'J',working:'KE_max=6.63\u00d710\u207b\u00b3\u2074\u00d7'+f.toExponential(2)+'-\u03c6 = '+(E-phi).toExponential(2)+' J'};}if(type==='stopping_V'){var phi=rnd(20,60)*1e-20,f=rnd(8,20)*1e14,E=6.63e-34*f,KE=E-phi;if(KE<=0)KE=1e-19;var V=parseFloat((KE/1.6e-19).toFixed(3));return{question:'KE_max=<b>'+KE.toExponential(2)+' J</b>. Stopping potential V_s?',hints:['eV_s=KE_max; V_s=KE/e; e=1.6\u00d710\u207b\u00b9\u2079'],ans:V,tol:V*0.03,unit:'V',working:'V_s='+KE.toExponential(2)+'/1.6\u00d710\u207b\u00b9\u2079 = '+V+' V'};}var phi=rnd(20,60)*1e-20,f0=parseFloat((phi/6.63e-34).toExponential(2));return{question:'\u03c6=<b>'+phi.toExponential(2)+' J</b>. Threshold frequency f\u2080?',hints:['f\u2080=\u03c6/h; h=6.63\u00d710\u207b\u00b3\u2074'],ans:parseFloat(f0),tol:parseFloat(f0)*0.03,unit:'Hz',working:'f\u2080='+phi.toExponential(2)+'/6.63\u00d710\u207b\u00b3\u2074 = '+f0+' Hz'};})},
]},
{ey:'Q7 \u2022 Y12 Physics \u2022 Light',ti:'Optical Instruments',su:'Describe and calculate for astronomical telescopes and microscopes.',steps:[
  {lb:'Simple telescope (two lenses)',dr:dQ7,ht:'<p>Astronomical telescope: two converging lenses; objective (long f_o) and eyepiece (short f_e). In normal adjustment: final image at infinity; lenses separated by f_o + f_e; parallel rays enter eye. Magnifying power m = f_o/f_e. Larger f_o, smaller f_e \u2192 greater magnification. Need large-diameter objective for light gathering.</p>'},
  {lb:'Compound microscope',dr:dQ7,ht:'<p>Two converging lenses: objective (short f, close to object) and eyepiece (magnifier). Objective forms real, magnified, inverted image just inside eyepiece focal length. Eyepiece acts as magnifier for this image. Total magnification = m_objective \u00d7 m_eyepiece. Resolution limited by wavelength (Rayleigh criterion).</p>'},
  {lb:'Reflecting telescope',dr:dQ7,ht:'<p>Large concave mirror replaces objective lens. Advantages: no chromatic aberration; can be very large; mirror easier to grind than large lens. Newtonian: flat diagonal mirror redirects light to side-mounted eyepiece. Cassegrain: convex secondary mirror reflects light back through hole in primary. Hubble, ELT, JWST all use mirrors.</p>'},
  {lb:'Resolution and Rayleigh criterion',dr:dQ7,ht:'<div class="fm">\u03b8_min = 1.22\u03bb/D</div><p>\u03b8_min = minimum angular separation that can be resolved (radians). D = diameter of aperture. Smaller \u03bb or larger D: better resolution. Radio telescope: long \u03bb \u2192 needs huge dish (e.g. Jodrell Bank 76m). Optical telescope: good resolution even at small diameter. Microscope resolution: d_min = 0.61\u03bb/n\u202fsin\u03b1.</p>'},
  {lb:'Your turn',dr:dQ7,ht:tryIt(function(){var type=pick(['telescope_M','microscope_m','resolution']);if(type==='telescope_M'){var fo=rnd(100,2000),fe=rnd(5,30),M=parseFloat((fo/fe).toFixed(1));return{question:'Telescope f_o=<b>'+fo+'mm</b>, f_e=<b>'+fe+'mm</b>. Magnification?',hints:['M=f_o/f_e'],ans:M,tol:M*0.02,unit:'',working:'M='+fo+'/'+fe+' = '+M};}if(type==='microscope_m'){var m_obj=rnd(20,100),m_eye=rnd(5,20),M_total=m_obj*m_eye;return{question:'Microscope: m_obj=<b>\u00d7'+m_obj+'</b>, m_eye=<b>\u00d7'+m_eye+'</b>. Total magnification?',hints:['m_total=m_obj\u00d7m_eye'],ans:M_total,tol:0,unit:'x',working:'m_total='+m_obj+'\u00d7'+m_eye+' = '+M_total};}var lam=rnd(400,700)*1e-9,D=rnd(10,500)/100,theta=parseFloat((1.22*lam/D*1e6).toFixed(2));return{question:'\u03bb=<b>'+Math.round(lam*1e9)+'nm</b>, D=<b>'+D+'m</b>. Angular resolution (microrad)?',hints:['\u03b8_min=1.22\u03bb/D'],ans:theta,tol:theta*0.05,unit:'\u03bcrad',working:'\u03b8_min=1.22\u00d7'+lam.toExponential(2)+'/'+D+'\u00d710\u2076 = '+theta+' \u03bcrad'};})},
]},
{ey:'Q8 \u2022 Y12 Physics \u2022 Light',ti:'Laser Light and Coherence',su:'Describe properties of laser light. Explain stimulated emission.',steps:[
  {lb:'Properties of laser light',dr:dQ8,ht:'<p>Laser light is: (1) Coherent: constant phase relationship between all photons. (2) Monochromatic: single wavelength/frequency. (3) Collimated: very narrow beam with little divergence. (4) Highly intense: energy concentrated in small area. Compare to ordinary light: incoherent, broad spectrum, spreads in all directions. LASER = Light Amplification by Stimulated Emission of Radiation.</p>'},
  {lb:'Stimulated emission',dr:dQ8,ht:'<p>Absorption: photon promotes electron to excited state. Spontaneous emission: electron decays randomly; photon emitted in any direction; incoherent. Stimulated emission: incoming photon triggers decay; emitted photon identical (same f, phase, direction). This is the key to laser: one photon \u2192 two identical photons \u2192 amplification.</p>'},
  {lb:'Population inversion and lasing',dr:dQ8,ht:'<p>For stimulated emission to dominate: need population inversion (more atoms in excited than ground state). Achieved by pumping (optical, electrical). Three-level system: pump to high state; fast decay to metastable state; lasing transition from metastable to ground state. Four-level: more efficient (ground state always nearly empty).</p>'},
  {lb:'Applications of lasers',dr:dQ8,ht:'<p>Communications: fibre optic internet (IR lasers). Medicine: eye surgery (LASIK), cutting/welding tissue, photodynamic therapy. Industrial: cutting, welding, engraving. Science: interferometry, spectroscopy, laser cooling, optical tweezers. Barcode scanners, CD/DVD players, laser printers, holograms. High-power lasers: nuclear fusion (NIF), directed energy weapons.</p>'},
  {lb:'Your turn',dr:dQ8,ht:tryIt(function(){var type=pick(['photon_E','coherence_path','intensity']);if(type==='photon_E'){var lam=rnd(400,900)*1e-9,E=parseFloat((6.63e-34*3e8/lam/1.6e-19).toFixed(2));return{question:'Laser \u03bb=<b>'+Math.round(lam*1e9)+'nm</b>. Photon energy in eV?',hints:['E=hc/\u03bb; 1eV=1.6\u00d710\u207b\u00b9\u2079J'],ans:E,tol:E*0.03,unit:'eV',working:'E=6.63\u00d710\u207b\u00b3\u2074\u00d73\u00d710\u2078/'+lam.toExponential(2)+'/1.6\u00d710\u207b\u00b9\u2079 = '+E+' eV'};}if(type==='coherence_path'){var lam=rnd(400,700)*1e-9,n=rnd(1,100),path=n*lam*1e9;return{question:'Laser \u03bb=<b>'+Math.round(lam*1e9)+'nm</b>, path diff=<b>'+n+'\u03bb</b>. Constructive or destructive?',hints:['path diff = n\u03bb \u2192 constructive'],ans:1,tol:0,unit:'(1=constructive, 0=destructive)',working:'path diff=n\u03bb \u2192 constructive interference (answer: 1)'};}var P=rnd(1,100),A=rnd(1,50)*1e-6,I=parseFloat((P/A).toFixed(0));return{question:'Laser P=<b>'+P+'W</b>, beam area=<b>'+A.toExponential(2)+'m\u00b2</b>. Intensity?',hints:['I=P/A'],ans:I,tol:I*0.03,unit:'W/m\u00b2',working:'I='+P+'/'+A.toExponential(2)+' = '+I+' W/m\u00b2'};})},
]},
{ey:'Q9 \u2022 Y12 Physics \u2022 Light',ti:'Fibre Optics and Communications',su:'Describe optical fibres. Calculate attenuation and bandwidth.',steps:[
  {lb:'Optical fibres principles',dr:dQ9,ht:'<p>Step-index fibre: core (n\u2081 high) and cladding (n\u2082 low). Light undergoes TIR at core-cladding boundary if incident angle > critical angle. Acceptance cone: range of angles for which TIR is maintained throughout fibre. Numerical aperture NA = \u221a(n\u2081\u00b2-n\u2082\u00b2) = sin(\u03b8_max acceptance).</p>'},
  {lb:'Attenuation',dr:dQ9,ht:'<p>Signal power decreases as light travels through fibre. Attenuation \u03b1 (dB/km): I = I\u2080 \u00d7 10^(-\u03b1L/10). Loss in dB: \u0394L = 10 log(P\u2080/P_out) = \u03b1 \u00d7 length. Modern fibres: \u03b1 \u2248 0.2 dB/km at \u03bb = 1550 nm (optimum window). Attenuation due to: absorption by OH ions, Rayleigh scattering, bending losses.</p>'},
  {lb:'Dispersion and bandwidth',dr:dQ9,ht:'<p>Multimode dispersion: different paths (ray angles) have different travel times; pulse spreading \u2192 bandwidth limitation. Material dispersion: n varies with wavelength; different \u03bb arrive at different times. Single-mode fibre: very narrow core (9 \u03bcm); only one mode propagates; eliminates modal dispersion; bandwidth >50 GHz\u00d7km.</p>'},
  {lb:'Wavelength division multiplexing',dr:dQ9,ht:'<p>WDM: multiple data channels on different wavelengths simultaneously in same fibre. Dense WDM (DWDM): channels spaced 0.8 nm apart; 80+ channels per fibre. Each channel 10 Gbps: total capacity >800 Gbps per fibre. Optical amplifiers (EDFAs): amplify all channels simultaneously without conversion to electrical signal.</p>'},
  {lb:'Your turn',dr:dQ9,ht:tryIt(function(){var type=pick(['attenuation','TIR_angle','critical_n']);if(type==='attenuation'){var alpha=rnd(2,10)/10,L=rnd(10,100),loss_dB=parseFloat((alpha*L).toFixed(1));return{question:'\u03b1=<b>'+alpha+' dB/km</b>, L=<b>'+L+' km</b>. Total attenuation (dB)?',hints:['loss=\u03b1\u00d7L'],ans:loss_dB,tol:loss_dB*0.02,unit:'dB',working:'loss='+alpha+'\u00d7'+L+' = '+loss_dB+' dB'};}if(type==='TIR_angle'){var n1=pick([1.5,1.6,1.7,1.8]),n2=parseFloat((n1-rnd(5,20)/100).toFixed(2));var thc=parseFloat((Math.asin(n2/n1)*180/Math.PI).toFixed(1));return{question:'Core n\u2081=<b>'+n1+'</b>, cladding n\u2082=<b>'+n2+'</b>. Critical angle?',hints:['sin\u03b8_c=n\u2082/n\u2081'],ans:thc,tol:0.5,unit:'\u00b0',working:'sin\u03b8_c='+n2+'/'+n1+'; \u03b8_c='+thc+'\u00b0'};}var n=pick([1.33,1.5,1.7]),thc=parseFloat((Math.asin(1/n)*180/Math.PI).toFixed(1));return{question:'n=<b>'+n+'</b> (in air). Critical angle?',hints:['sin\u03b8_c=1/n'],ans:thc,tol:0.5,unit:'\u00b0',working:'sin\u03b8_c=1/'+n+'; \u03b8_c='+thc+'\u00b0'};})},
]},
{ey:'Q10 \u2022 Y12 Physics \u2022 Light',ti:'Mixed Light Questions',su:'Integrated questions across all Y12-WAV-02 topics.',steps:[
  {lb:'Summary',dr:dQ10,ht:'<p>v=f\u03bb=c/n. n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082. sin\u03b8_c=n\u2082/n\u2081. 1/v+1/u=1/f. m=v/u. E=hf=hc/\u03bb. hf=\u03c6+KE_max. f_0=\u03c6/h. Telescope m=f_o/f_e. Wien: \u03bb_maxT=b. Stefan: P=\u03c3AT\u2074. Grating: d\u202fsin\u03b8=n\u03bb.</p>'},
  {lb:'WAEC emphasis',dr:dQ10,ht:'<p>WAEC tests: Snell\u2019s law (refraction calculations); critical angle and TIR; lens formula and magnification; photoelectric effect (E=hf-\u03c6); electromagnetic spectrum (types, properties, uses). Cambridge adds: blackbody radiation, telescope magnification, optical fibres. Always show full working.</p>'},
  {lb:'Key connections',dr:dQ10,ht:'<p>Wave theory explains: interference, diffraction, refraction, polarisation. Particle theory explains: photoelectric effect, Compton scattering. Light exhibits both wave and particle nature (wave-particle duality). Quantum mechanics: photon energy E=hf is both wave (frequency) and particle (energy quantum).</p>'},
  {lb:'Key formulae',dr:dQ10,ht:'<div class="fm">n\u2081sin\u03b8\u2081=n\u2082sin\u03b8\u2082 \u2022 sin\u03b8_c=n\u2082/n\u2081</div><div class="fm">1/v+1/u=1/f \u2022 E=hf=hc/\u03bb \u2022 hf=\u03c6+KE</div>'},
