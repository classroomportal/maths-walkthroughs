<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }

         min-height:52px; -webkit-tap-highlight-color:transparent; }

<body>
<header><h1>Bridge English: Word Classes (Nouns, Verbs, Adjectives, Adverbs)</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is a noun?", "teach": ["A noun is a word for a person, place, thing, or idea.", "Example: 'dog', 'Lagos', 'happiness', and 'teacher' are all nouns.", "Nouns are usually the 'who' or 'what' of a sentence."], "yt_prompt": "Find the noun in this sentence:"}, {"title": "What is a verb?", "teach": ["A verb is a 'doing' or 'being' word \u2014 it shows an action or a state.", "Example: 'ran', 'is', 'thinks', and 'jumped' are all verbs.", "Every complete sentence needs at least one verb."], "yt_prompt": "Find the verb in this sentence:"}, {"title": "What is an adjective?", "teach": ["An adjective describes a noun \u2014 it tells you more about what something is like.", "Example: in 'the happy dog', 'happy' is the adjective describing the dog.", "Adjectives usually answer the question: what kind? how many? which one?"], "yt_prompt": "Find the adjective in this sentence:"}, {"title": "What is an adverb?", "teach": ["An adverb describes a verb (or sometimes an adjective) \u2014 it tells you how, when, or where something happens.", "Example: in 'she ran quickly', 'quickly' describes how she ran.", "Many adverbs end in '-ly', but not all of them (e.g. 'fast', 'soon')."], "yt_prompt": "Find the adverb in this sentence:"}, {"title": "Identifying multiple word classes in a sentence", "teach": ["A sentence usually contains several word classes working together \u2014 nouns, verbs, adjectives, and adverbs.", "Example: 'The tall boy ran quickly.' \u2014 'boy' (noun), 'ran' (verb), 'tall' (adjective), 'quickly' (adverb).", "Practice spotting each word class separately before trying to identify them all at once."], "yt_prompt": "What word class is 'quickly' in this sentence?"}, {"title": "Common nouns vs proper nouns", "teach": ["A common noun names a general thing (dog, city, teacher). A proper noun names a specific thing and starts with a capital letter (Rex, Lagos, Mrs Bello).", "Example: 'dog' is common, but 'Rex' (a specific dog's name) is proper.", "This connects to the capital letters rule you learned earlier \u2014 proper nouns always need a capital letter."], "yt_prompt": "Is this a common noun or a proper noun?"}, {"title": "Verbs showing different tenses", "teach": ["Verbs change form to show when something happens \u2014 past, present, or future.", "Example: 'walk' (present), 'walked' (past), 'will walk' (future).", "Being consistent with tense throughout a piece of writing is really important for clarity."], "yt_prompt": "What tense is this verb?"}, {"title": "Choosing a strong adjective", "teach": ["Strong, specific adjectives create a clearer picture than vague ones like 'nice' or 'good'.", "Example: instead of 'a nice house', try 'a spacious house' or 'a crumbling house' \u2014 much more descriptive.", "When editing your writing, look for vague adjectives you could replace with stronger, more specific ones."], "yt_prompt": "Which adjective is more specific and descriptive?"}, {"title": "Choosing a strong verb", "teach": ["Strong, specific verbs are more powerful than vague ones like 'went' or 'said'.", "Example: instead of 'she went quickly', try 'she dashed' or 'she sprinted' \u2014 much more vivid.", "Strong verbs can often replace a verb + adverb combination entirely."], "yt_prompt": "Which single strong verb could replace 'walked slowly and sadly'?"}, {"title": "Mixed practice \u2014 word classes", "teach": ["You've now covered nouns, verbs, adjectives, adverbs, tenses, and choosing stronger words.", "Being confident identifying word classes helps with everything from grammar rules to improving your own writing style.", "This final question brings a few of these ideas together."], "yt_prompt": "What word class is 'brightly' in this sentence?"}];
function ytGen_0() { const sets=[{q:'The dog barked loudly.', correct:'dog', wrong:['barked','loudly']},{q:'The teacher smiled kindly.', correct:'teacher', wrong:['smiled','kindly']},{q:'Happiness filled her completely.', correct:'Happiness', wrong:['filled','completely']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_1() { const sets=[{q:'The dog barked loudly.', correct:'barked', wrong:['dog','loudly']},{q:'Ade ran to school quickly.', correct:'ran', wrong:['Ade','quickly']},{q:'The teacher smiled kindly.', correct:'smiled', wrong:['teacher','kindly']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_2() { const sets=[{q:'The happy dog barked.', correct:'happy', wrong:['dog','barked']},{q:'She wore a red dress.', correct:'red', wrong:['wore','dress']},{q:'It was a cold morning.', correct:'cold', wrong:['was','morning']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_3() { const sets=[{q:'She ran quickly.', correct:'quickly', wrong:['She','ran']},{q:'He spoke softly.', correct:'softly', wrong:['He','spoke']},{q:'They arrived early.', correct:'early', wrong:['They','arrived']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_4() { return {q:'The tall boy ran quickly.', answer:'adverb', options:['noun','verb','adjective','adverb']}; }
function ytGen_5() { const opts=[['Lagos','proper'],['city','common'],['Amara','proper'],['teacher','common']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1], options:['common','proper']}; }
function ytGen_6() { const opts=[['She walked to school.','past'],['She walks to school.','present'],['She will walk to school.','future'],['He played football.','past']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1], options:['past','present','future']}; }
function ytGen_7() { return {q:'Which adjective paints a clearer picture: "a nice castle" or "an ancient castle"?', answer:'ancient', options:['ancient','nice']}; }
function ytGen_8() { return {q:'Which single word means "walked slowly and sadly"?', answer:'trudged', options:['trudged','ran','skipped']}; }
function ytGen_9() { const sets=[{prompt:"What word class is <strong>very</strong> in this sentence?", q:'The soup was <strong>very</strong> hot.', answer:'adverb', options:['noun','verb','adjective','adverb']},{prompt:"What word class is <strong>fast</strong> in this sentence?", q:'He ran <strong>fast</strong> to catch the bus.', answer:'adverb', options:['noun','verb','adjective','adverb']},{prompt:"What word class is <strong>well</strong> in this sentence?", q:'She played the game <strong>well</strong>.', answer:'adverb', options:['noun','verb','adjective','adverb']},{prompt:"Which single strong verb could replace 'walked slowly and quietly'?", q:'She walked slowly and quietly across the room.', answer:'crept', options:['crept','went','walked','moved']},{prompt:"Which stronger adjective could replace 'good' in this sentence?", q:'It was a good meal.', answer:'delicious', options:['delicious','nice','fine','good']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {prompt:p.prompt, q:p.q, answer:p.answer, options:p.options}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

// Pre-compute every correct answer in this topic, used as a distractor pool
// for non-numeric answers (sampled once per attempt via YT_GENS() calls below)
let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      if (c !== ans && !candidates.includes(c) && Number(c) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+r\d+$/.test(ans)) {
    const [whole, rem] = ans.split('r').map(Number);
    const perturbs = [[whole+1,rem],[whole>1?whole-1:whole+2,rem],[whole,rem+1],[whole,rem>1?rem-1:rem+2]].sort(() => Math.random()-0.5);
    for (const [w,r] of perturbs) {
      if (w>0 && r>=0) {
        const c = `${w}r${r}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+ \d+\/\d+$/.test(ans)) {
    const [wholePart, fracPart] = ans.split(' ');
    const whole = Number(wholePart);
    const [numer, denom] = fracPart.split('/').map(Number);
    const perturbs = [[whole+1,numer,denom],[whole>1?whole-1:whole+2,numer,denom],[whole,numer+1,denom],[whole,numer>1?numer-1:numer+2,denom]].sort(() => Math.random()-0.5);
    for (const [w,n,d] of perturbs) {
      if (w>0 && n>0 && d>0 && n<d) {
        const c = `${w} ${n}/${d}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  }

  // Fill any remaining slots from the pool of other correct answers this topic
  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    // Some questions supply their own explicit options (e.g. category-style
    // answers like increasing/decreasing/flat, where auto-generated distractors
    // from unrelated numeric answers elsewhere in the topic wouldn't make sense)
    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${currentYT.prompt || q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

// Precompute the answer pool once at load (using each question's first generated answer)
ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
