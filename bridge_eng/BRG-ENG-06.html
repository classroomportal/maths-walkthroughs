<style>

<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>

      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>

<script>
const QUESTIONS = [{"title": "What is a paragraph?", "teach": ["A paragraph is a group of sentences that all focus on one main idea.", "When you move to a new idea, you should start a new paragraph.", "Paragraphs help organise writing so the reader can follow your ideas clearly, one at a time."], "yt_prompt": "Should these two sentences be in the same paragraph?"}, {"title": "What is a topic sentence?", "teach": ["A topic sentence usually comes first in a paragraph and tells the reader what the whole paragraph will be about.", "Example: 'Lagos is a busy and exciting city.' \u2014 this topic sentence tells us the paragraph will describe Lagos.", "Every other sentence in the paragraph should support or explain the topic sentence."], "yt_prompt": "Which sentence would work best as a topic sentence for a paragraph about football?"}, {"title": "Identifying the topic sentence in a paragraph", "teach": ["The topic sentence is usually the first sentence, and it's more general than the sentences that follow.", "Example: in a paragraph about a beach holiday, the topic sentence might be 'Our holiday at the beach was unforgettable.'", "Later sentences give specific details that support this general opening idea."], "yt_prompt": "Which sentence is the topic sentence?"}, {"title": "When to start a new paragraph \u2014 new idea", "teach": ["Start a new paragraph whenever you move to a new main idea or topic.", "Example: after finishing a paragraph about the weather, a new paragraph should start when you begin talking about food.", "If you can summarise a group of sentences in one general statement, they probably belong in the same paragraph."], "yt_prompt": "Should a new paragraph start here?"}, {"title": "When to start a new paragraph \u2014 new speaker", "teach": ["In dialogue, start a new paragraph every time a different character starts speaking.", "Example: \"Hello,\" said Ade. (new paragraph) \"Hi,\" replied Chidi.", "This rule connects to what you learned in the speech marks topic \u2014 it's the same idea, just from a paragraphing angle."], "yt_prompt": "Should a new paragraph start when a new character begins speaking?"}, {"title": "When to start a new paragraph \u2014 change in time or place", "teach": ["A new paragraph often starts when the setting changes \u2014 a new time, place, or scene.", "Example: 'The next morning, Amara woke up early.' signals a time change and often starts a new paragraph.", "Look out for phrases like 'later that day', 'meanwhile', or 'back at home' \u2014 these usually signal a new paragraph is needed."], "yt_prompt": "Does this phrase usually signal the start of a new paragraph?"}, {"title": "Supporting sentences", "teach": ["Supporting sentences come after the topic sentence and give more detail, examples, or explanation.", "Example: topic sentence 'Lagos is a busy city.' Supporting sentence: 'The streets are full of cars, and markets are crowded every day.'", "Good supporting sentences give specific evidence or examples, not just repeat the topic sentence in different words."], "yt_prompt": "Which sentence best supports the topic sentence 'Football is an exciting sport'?"}, {"title": "Concluding a paragraph", "teach": ["A paragraph can end with a sentence that sums up the main idea or leads into the next paragraph.", "Example: 'Overall, Lagos offers something for everyone.' rounds off a descriptive paragraph well.", "Not every paragraph needs a formal conclusion, but longer or more complex paragraphs often benefit from one."], "yt_prompt": "Which sentence works best as a paragraph conclusion?"}, {"title": "Fixing a paragraph with mixed ideas", "teach": ["If a paragraph contains two unrelated ideas, it usually needs to be split into two separate paragraphs.", "Example: a paragraph about a football match that suddenly starts describing what was eaten for dinner should be split.", "Read through your own paragraphs and check: does everything here really belong together?"], "yt_prompt": "Should this paragraph be split into two?"}, {"title": "Mixed practice \u2014 paragraphing", "teach": ["You've now covered topic sentences, supporting sentences, and knowing when to start a new paragraph.", "Clear paragraphing is one of the biggest factors examiners look for when assessing organisation in writing.", "This final question brings these ideas together."], "yt_prompt": "Which sentence would work best as a topic sentence for a paragraph about a favourite holiday?"}];
function ytGen_0() { return {q:'The weather was sunny. My favourite food is rice.', answer:'no', options:['yes','no']}; }
function ytGen_1() { return {q:'', answer:'Football is my favourite sport.', options:['Football is my favourite sport.','The ball was red.']}; }
function ytGen_2() { return {q:'', answer:'The beach holiday was the best trip of my life.', options:['The beach holiday was the best trip of my life.','We built sandcastles every morning.']}; }
function ytGen_3() { return {q:'Moving from describing a character\'s appearance to describing what happens next in the story.', answer:'yes', options:['yes','no']}; }
function ytGen_4() { return {q:'', answer:'yes', options:['yes','no']}; }
function ytGen_5() { return {q:'"The next morning,"', answer:'yes', options:['yes','no']}; }
function ytGen_6() { return {q:'', answer:'Football involves fast action and dramatic goals.', options:['Football involves fast action and dramatic goals.','I do not like tennis.']}; }
function ytGen_7() { return {q:'', answer:'In short, the trip was unforgettable.', options:['In short, the trip was unforgettable.','We arrived at 9am.']}; }
function ytGen_8() { return {q:'A paragraph starts describing a football match, then switches to describing a birthday party.', answer:'yes', options:['yes','no']}; }
function ytGen_9() { return {q:'', answer:'Our family holiday to the coast was the best week of my life.', options:['Our family holiday to the coast was the best week of my life.','We packed our bags on Monday.']}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

// Pre-compute every correct answer in this topic, used as a distractor pool
// for non-numeric answers (sampled once per attempt via YT_GENS() calls below)
let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      if (c !== ans && !candidates.includes(c) && Number(c) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+r\d+$/.test(ans)) {
    const [whole, rem] = ans.split('r').map(Number);
    const perturbs = [[whole+1,rem],[whole>1?whole-1:whole+2,rem],[whole,rem+1],[whole,rem>1?rem-1:rem+2]].sort(() => Math.random()-0.5);
    for (const [w,r] of perturbs) {
      if (w>0 && r>=0) {
        const c = `${w}r${r}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+ \d+\/\d+$/.test(ans)) {
    const [wholePart, fracPart] = ans.split(' ');
    const whole = Number(wholePart);
    const [numer, denom] = fracPart.split('/').map(Number);
    const perturbs = [[whole+1,numer,denom],[whole>1?whole-1:whole+2,numer,denom],[whole,numer+1,denom],[whole,numer>1?numer-1:numer+2,denom]].sort(() => Math.random()-0.5);
    for (const [w,n,d] of perturbs) {
      if (w>0 && n>0 && d>0 && n<d) {
        const c = `${w} ${n}/${d}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  }

  // Fill any remaining slots from the pool of other correct answers this topic
  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    // Some questions supply their own explicit options (e.g. category-style
    // answers like increasing/decreasing/flat, where auto-generated distractors
    // from unrelated numeric answers elsewhere in the topic wouldn't make sense)
    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

// Precompute the answer pool once at load (using each question's first generated answer)
ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
