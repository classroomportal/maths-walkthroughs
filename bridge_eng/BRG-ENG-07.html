<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }

         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }

         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }

<body>
<header><h1>Bridge English: Literal vs Inferential Comprehension Questions</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is a literal question?", "teach": ["A literal question asks for information directly stated in the text \u2014 the answer is written word-for-word or very close to it.", "Example: if the text says 'Amara wore a blue dress', a literal question would be 'What colour was Amara's dress?'", "Literal questions are usually the easiest type, since you're just finding and copying information."], "yt_prompt": "Is this a literal question?"}, {"title": "What is an inferential question?", "teach": ["An inferential question asks you to work out something the text doesn't say directly \u2014 using clues and your own reasoning.", "Example: if the text says 'Amara's hands were shaking as she opened the letter', an inferential question might ask 'How did Amara feel?' (nervous/scared) even though the text never says this directly.", "Inferential questions need you to 'read between the lines'."], "yt_prompt": "Is this an inferential question?"}, {"title": "Spotting literal vs inferential \u2014 practice 1", "teach": ["Literal questions have answers written directly in the text. Inferential questions require you to work something out.", "Read carefully \u2014 if you can point to the exact sentence with the answer, it's literal. If you have to think and combine clues, it's inferential.", "This distinction is one of the most commonly tested skills in reading comprehension."], "yt_prompt": "Is this question literal or inferential?"}, {"title": "Spotting literal vs inferential \u2014 practice 2", "teach": ["Words like 'why do you think', 'how might', and 'what does this suggest' usually signal inferential questions.", "Words like 'what', 'where', 'when', and 'who' (asking for a direct fact) usually signal literal questions.", "Look at the question wording carefully before deciding which type it is."], "yt_prompt": "Is this question literal or inferential?"}, {"title": "Using evidence for literal answers", "teach": ["To answer a literal question well, quote or closely paraphrase the exact part of the text that gives the answer.", "Example: 'According to the text, the boat was tied to a rusted metal ring.'", "Always go back to the text to check your literal answers rather than relying on memory."], "yt_prompt": "What was the rope tied to?"}, {"title": "Using evidence for inferential answers", "teach": ["To answer an inferential question well, mention the clue from the text AND explain what it suggests.", "Example: 'The character's hands were shaking, which suggests she was nervous or afraid.'", "A good inferential answer never just guesses \u2014 it always links back to specific evidence in the text."], "yt_prompt": "How might the character be feeling?"}, {"title": "Making a prediction (a type of inference)", "teach": ["Predicting what happens next is a type of inferential thinking \u2014 using clues already given to guess what's likely to come.", "Example: if a story ends with someone finding a mysterious old key, a reasonable prediction is that they'll try to find out what it unlocks.", "Predictions should always be based on evidence in the text, not just random guesses."], "yt_prompt": "What is a reasonable prediction?"}, {"title": "Combining literal details to make an inference", "teach": ["Sometimes you need to combine two or more literal facts to work out an inferential answer.", "Example: the text says it's December and there's snow \u2014 combining these facts, you can infer the season is winter.", "Look for multiple small details that, together, point toward a bigger conclusion."], "yt_prompt": "What season can you infer it is?"}, {"title": "Checking your inference is reasonable", "teach": ["A good inference must be supported by evidence in the text \u2014 not just anything that popped into your head.", "Example: if the text never mentions a character's age, you shouldn't infer a specific age with total certainty.", "Always ask: 'Can I point to a clue in the text that supports this idea?'"], "yt_prompt": "Is this a reasonable inference, based only on 'the room was completely silent'?"}, {"title": "Mixed practice \u2014 literal and inferential questions", "teach": ["You've now covered spotting the difference between literal and inferential questions, and how to answer each using evidence.", "This is one of the most heavily tested comprehension skills across English exams.", "This final question checks you can apply both types confidently."], "yt_prompt": "Is this question literal or inferential?"}];
function ytGen_0() { return {q:'The text says \'She arrived at 8am.\' Question: What time did she arrive?', answer:'yes', options:['yes','no']}; }
function ytGen_1() { return {q:'The text describes shaking hands but never states the emotion. Question: How did the character feel?', answer:'yes', options:['yes','no']}; }
function ytGen_2() { const opts=[['What was the name of the boat in the story?','literal'],['Why do you think the character was crying?','inferential'],['What colour was the door?','literal'],['What might happen next in the story?','inferential']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1], options:['literal','inferential']}; }
function ytGen_3() { const opts=[['Where did the family live?','literal'],['What does the author suggest about the character\'s mood?','inferential'],['Who was the main character?','literal'],['Why might the character have made that choice?','inferential']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1], options:['literal','inferential']}; }
function ytGen_4() { return {q:'The text says: \'The rope was tied to a rusted metal ring.\'', answer:'a rusted metal ring', options:['a rusted metal ring','a wooden post']}; }
function ytGen_5() { return {q:'Her hands were shaking as she opened the letter.', answer:'nervous', options:['nervous','happy']}; }
function ytGen_6() { return {q:'A character finds a mysterious old key at the end of a story.', answer:'They will try to find what it unlocks.', options:['They will try to find what it unlocks.','The story ends there with no more events.']}; }
function ytGen_7() { return {q:'The text says it is December and there is snow outside.', answer:'winter', options:['winter','summer']}; }
function ytGen_8() { return {q:'Inference: \'The character was alone or everyone was being very quiet.\'', answer:'yes', options:['yes','no']}; }
function ytGen_9() { return {q:'What does the character\'s silence suggest about how they feel?', answer:'inferential', options:['literal','inferential']}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

// Pre-compute every correct answer in this topic, used as a distractor pool
// for non-numeric answers (sampled once per attempt via YT_GENS() calls below)
let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      if (c !== ans && !candidates.includes(c) && Number(c) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+r\d+$/.test(ans)) {
    const [whole, rem] = ans.split('r').map(Number);
    const perturbs = [[whole+1,rem],[whole>1?whole-1:whole+2,rem],[whole,rem+1],[whole,rem>1?rem-1:rem+2]].sort(() => Math.random()-0.5);
    for (const [w,r] of perturbs) {
      if (w>0 && r>=0) {
        const c = `${w}r${r}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+ \d+\/\d+$/.test(ans)) {
    const [wholePart, fracPart] = ans.split(' ');
    const whole = Number(wholePart);
    const [numer, denom] = fracPart.split('/').map(Number);
    const perturbs = [[whole+1,numer,denom],[whole>1?whole-1:whole+2,numer,denom],[whole,numer+1,denom],[whole,numer>1?numer-1:numer+2,denom]].sort(() => Math.random()-0.5);
    for (const [w,n,d] of perturbs) {
      if (w>0 && n>0 && d>0 && n<d) {
        const c = `${w} ${n}/${d}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  }

  // Fill any remaining slots from the pool of other correct answers this topic
  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    // Some questions supply their own explicit options (e.g. category-style
    // answers like increasing/decreasing/flat, where auto-generated distractors
    // from unrelated numeric answers elsewhere in the topic wouldn't make sense)
    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

// Precompute the answer pool once at load (using each question's first generated answer)
ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
