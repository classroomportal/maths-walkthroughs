<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Capital Letters & Full Stops — Bridge English — ABC</title>

<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  .q-progress { font-size:.85rem; color:#888; margin-bottom:8px; }
  .step-progress { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .step-bar { height:100%; background:var(--red); transition:width .3s; }
  .teach { background:var(--cream); border-left:4px solid var(--red); padding:14px 16px; border-radius:6px; margin-bottom:16px; line-height:1.65; font-size:1.05rem; }
  .worked { font-family:'Courier New',monospace; background:#fafafa; padding:12px; border-radius:6px; margin:10px 0; font-size:1.1rem; text-align:center; }
  .yt-box { border:2px dashed var(--red); padding:16px; border-radius:8px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:center; padding:16px 14px; margin-bottom:10px;
         border:2px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-size:1.15rem; font-weight:600;
         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }
  .try-fb { margin-top:12px; font-weight:600; font-size:1.05rem; }
  .try-fb.ok { color:#1b7d3a; }
  .try-fb.er { color:var(--red); }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }
  button.nav-btn.primary { background:var(--red); color:#fff; }
  button.nav-btn:disabled { opacity:0.5; }
</style>

<script src="../notation.js" defer></script>
</head>
<body>
<header><h1>Bridge English: Capital Letters & Full Stops</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "Capital letters at the start of a sentence", "teach": ["Every sentence must begin with a capital letter, no matter how short the sentence is.", "Example: 'the dog ran.' should be 'The dog ran.'", "This is one of the most common mistakes in early writing \u2014 always check the first letter of each sentence."], "yt_prompt": "Which is correctly capitalised?"}, {"title": "Capital letters for names (proper nouns)", "teach": ["Names of specific people, places, and things (proper nouns) always start with a capital letter.", "Example: 'amara lives in lagos.' should be 'Amara lives in Lagos.'", "This applies to first names, surnames, cities, countries, days of the week, and months."], "yt_prompt": "Which is correctly capitalised?"}, {"title": "Capital letter 'I'", "teach": ["The word 'I' (referring to yourself) is always written as a capital letter, wherever it appears in a sentence.", "Example: 'me and my friend went to the shop, and i bought sweets.' should have a capital I.", "This rule applies even in the middle of a sentence, not just at the start."], "yt_prompt": "Which is correctly capitalised?"}, {"title": "Where does a full stop go?", "teach": ["A full stop goes at the very end of a sentence, showing the sentence is complete.", "Example: 'The dog ran to the park' needs a full stop at the end: 'The dog ran to the park.'", "Never forget the full stop \u2014 without it, sentences can run into each other and become confusing."], "yt_prompt": "Which is correctly punctuated?"}, {"title": "Spotting run-on sentences", "teach": ["A run-on sentence happens when two complete ideas are joined together without any punctuation.", "Example: 'The dog ran the cat hid' should be two sentences: 'The dog ran. The cat hid.'", "Look for where one complete idea ends and a new one begins \u2014 that's where the full stop should go."], "yt_prompt": "Which is the correctly fixed version of this run-on sentence?"}, {"title": "Capital letters for titles", "teach": ["Titles of books, films, and other works use capital letters for the main words.", "Example: 'things fall apart' should be 'Things Fall Apart'.", "Small words like 'the', 'a', 'of', and 'and' inside a title usually stay lowercase unless they're the first word."], "yt_prompt": "Which is correctly capitalised as a title?"}, {"title": "Days, months, and nationalities", "teach": ["Days of the week, months of the year, and nationalities all start with a capital letter.", "Example: 'we met on tuesday in march, and she is nigerian.' needs three capitals fixed.", "These are proper nouns because they refer to specific, named things."], "yt_prompt": "Which is correctly capitalised?"}, {"title": "Checking a whole paragraph for capitals and full stops", "teach": ["When proofreading, check every sentence has a capital letter at the start and a full stop at the end.", "Example: 'my name is ade i live in lagos i am eleven years old' needs three fixes: capitals and full stops between each idea.", "Read slowly and mark where each complete idea ends before adding punctuation."], "yt_prompt": "Which is the correctly fixed version of this passage?"}, {"title": "Common capital letter mistakes", "teach": ["A common mistake is capitalising ordinary words in the middle of a sentence that aren't proper nouns.", "Example: 'I went to the School' is wrong \u2014 'school' isn't a proper noun here, so no capital needed.", "Only capitalise specific names, not general words like 'school', 'dog', or 'teacher' unless they start a sentence."], "yt_prompt": "Is this sentence correctly capitalised?"}, {"title": "Mixed practice \u2014 capitals and full stops", "teach": ["You've now covered sentence-starting capitals, proper nouns, the word 'I', and full stops for complete sentences.", "These are foundational skills that affect every piece of writing you do \u2014 worth being completely confident with.", "This final question brings a few of these rules together."], "yt_prompt": "Which is the correctly fixed version of this sentence?"}];
function ytGen_0() { const sets=[{q:'the sun was hot.', correct:'The sun was hot.', wrong:['the sun was hot.','The sun Was hot.']},{q:'she ran to the shop.', correct:'She ran to the shop.', wrong:['she ran to the shop.','She ran to the Shop.']},{q:'we played football.', correct:'We played football.', wrong:['we played football.','We played Football.']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_1() { const sets=[{q:'chidi lives in abuja.', correct:'Chidi lives in Abuja.', wrong:['chidi lives in Abuja.','Chidi lives in abuja.']},{q:'we visited nigeria in june.', correct:'We visited Nigeria in June.', wrong:['We visited nigeria in June.','We visited Nigeria in june.']},{q:'ade met tunde on monday.', correct:'Ade met Tunde on Monday.', wrong:['Ade met tunde on Monday.','Ade met Tunde on monday.']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_2() { const sets=[{q:'my friend and i went to the park.', correct:'My friend and I went to the park.', wrong:['My friend and i went to the park.','my friend and I went to the park.']},{q:'i was happy when i saw her.', correct:'I was happy when I saw her.', wrong:['I was happy when i saw her.','i was happy when I saw her.']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_3() { const sets=[{q:'The cat sat on the mat', correct:'The cat sat on the mat.', wrong:['The cat sat on the mat','The cat sat on the mat!']},{q:'We went to school today', correct:'We went to school today.', wrong:['We went to school today','We went to school today!']},{q:'She likes to read books', correct:'She likes to read books.', wrong:['She likes to read books','She likes to read books!']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_4() { const sets=[{q:'The dog ran the cat hid', correct:'The dog ran. The cat hid.', wrong:['The dog ran, the cat hid.','The dog ran the cat hid.']},{q:'She was tired she went to bed', correct:'She was tired. She went to bed.', wrong:['She was tired, she went to bed.','She was tired she went to bed.']},{q:'It started raining we went inside', correct:'It started raining. We went inside.', wrong:['It started raining, we went inside.','It started raining we went inside.']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_5() { const sets=[{q:"harry potter and the philosopher's stone", correct:"Harry Potter and the Philosopher's Stone", wrong:["Harry potter and the philosopher's stone","harry Potter and the Philosopher's Stone"]},{q:'the lion king', correct:'The Lion King', wrong:['the Lion King','The lion King']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_6() { const sets=[{q:'we met on tuesday in march.', correct:'We met on Tuesday in March.', wrong:['We met on tuesday in March.','We met on Tuesday in march.']},{q:'she is nigerian and he is british.', correct:'She is Nigerian and he is British.', wrong:['She is nigerian and he is British.','She is Nigerian and he is british.']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_7() { return {q:'my name is ade i live in lagos', answer:'My name is Ade. I live in Lagos.', options:['My name is Ade. I live in Lagos.','my name is ade. i live in lagos.','My name is Ade I live in Lagos']}; }
function ytGen_8() { const opts=[['I went to the School yesterday.','no'],['I went to school yesterday.','yes'],['My Dog is friendly.','no'],['My dog is friendly.','yes']]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1], options:['yes','no']}; }
function ytGen_9() { return {q:'my friend chidi and i went to lagos on friday', answer:'My friend Chidi and I went to Lagos on Friday.', options:['My friend Chidi and I went to Lagos on Friday.','my friend chidi and i went to lagos on friday.','My friend chidi and I went to Lagos on friday.']}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

// Pre-compute every correct answer in this topic, used as a distractor pool
// for non-numeric answers (sampled once per attempt via YT_GENS() calls below)
let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      if (c !== ans && !candidates.includes(c) && Number(c) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+r\d+$/.test(ans)) {
    const [whole, rem] = ans.split('r').map(Number);
    const perturbs = [[whole+1,rem],[whole>1?whole-1:whole+2,rem],[whole,rem+1],[whole,rem>1?rem-1:rem+2]].sort(() => Math.random()-0.5);
    for (const [w,r] of perturbs) {
      if (w>0 && r>=0) {
        const c = `${w}r${r}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+ \d+\/\d+$/.test(ans)) {
    const [wholePart, fracPart] = ans.split(' ');
    const whole = Number(wholePart);
    const [numer, denom] = fracPart.split('/').map(Number);
    const perturbs = [[whole+1,numer,denom],[whole>1?whole-1:whole+2,numer,denom],[whole,numer+1,denom],[whole,numer>1?numer-1:numer+2,denom]].sort(() => Math.random()-0.5);
    for (const [w,n,d] of perturbs) {
      if (w>0 && n>0 && d>0 && n<d) {
        const c = `${w} ${n}/${d}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  }

  // Fill any remaining slots from the pool of other correct answers this topic
  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    // Some questions supply their own explicit options (e.g. category-style
    // answers like increasing/decreasing/flat, where auto-generated distractors
    // from unrelated numeric answers elsewhere in the topic wouldn't make sense)
    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

// Precompute the answer pool once at load (using each question's first generated answer)
ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
