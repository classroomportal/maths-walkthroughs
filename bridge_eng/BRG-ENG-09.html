<header><h1>Bridge English: Narrative Structure (Opening, Build-up, Climax, Resolution)</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>

    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>

<script>
const QUESTIONS = [{"title": "What is narrative structure?", "teach": ["A narrative (story) is usually organised into stages: opening, build-up, climax, and resolution.", "Each stage has a specific job to do \u2014 introducing, developing, peaking, and concluding the story.", "Understanding this structure helps you both read stories more deeply and write your own more effectively."], "yt_prompt": "Which comes first in a typical story structure?"}, {"title": "The opening", "teach": ["The opening introduces the setting, characters, and often hints at what the story will be about.", "Example: 'Amara had walked past the canoe every day, but today something made her stop.' \u2014 this introduces character and setting, and hints at something unusual about to happen.", "A strong opening grabs the reader's attention and sets up everything that follows."], "yt_prompt": "Does this sentence work well as a story opening?"}, {"title": "The build-up", "teach": ["The build-up develops the story, adding detail, tension, or complications as events unfold.", "Example: after Amara notices the canoe, the build-up might describe her growing curiosity as she investigates it further.", "This stage usually makes up the largest part of a story, gradually leading toward the most exciting moment."], "yt_prompt": "Which sentence sounds more like build-up than an opening?"}, {"title": "The climax", "teach": ["The climax is the most exciting, tense, or important moment in the story \u2014 often where the main problem is faced directly.", "Example: the moment Amara finally opens the rusted tin box and discovers what's inside is a climax moment.", "Everything in the build-up leads towards this key turning point."], "yt_prompt": "Which sentence sounds like a climax moment?"}, {"title": "The resolution", "teach": ["The resolution wraps up the story, showing how the main problem is solved or how things end for the characters.", "Example: after finding the mysterious paper, the resolution might show Amara deciding to research its history at the library.", "A satisfying resolution usually connects back to what happened during the climax."], "yt_prompt": "Which sentence sounds like a resolution?"}, {"title": "Putting the stages in order", "teach": ["A typical story follows this order: opening \u2192 build-up \u2192 climax \u2192 resolution.", "Being able to identify which stage a section of text belongs to helps you understand the overall shape of a story.", "Some stories play with this order for effect, but most follow this basic pattern, especially in shorter stories."], "yt_prompt": "Which shows these story stages in the correct order?"}, {"title": "Using descriptive detail in the opening", "teach": ["A strong opening often uses descriptive detail to set the scene and create atmosphere.", "Example: 'The wooden hull was cracked and grey, half-buried in the sand' creates a vivid, slightly mysterious image.", "Choosing specific, sensory details (sight, sound, smell) makes an opening much more engaging than vague description."], "yt_prompt": "Which is more descriptive and engaging?"}, {"title": "Building tension in the build-up", "teach": ["Tension can be built through short sentences, hinting at danger, or slowing down key moments.", "Example: 'She stepped closer. Something glinted. Her heart raced.' \u2014 short sentences speed up the pace and build excitement.", "Notice how varying sentence length affects the feeling of tension in a passage."], "yt_prompt": "Which creates more tension?"}, {"title": "Linking the climax to the resolution", "teach": ["A good resolution should follow logically from what happened in the climax \u2014 it shouldn't feel random or disconnected.", "Example: if the climax is discovering an old letter, the resolution should relate to what happens as a result of that discovery.", "Check your own story endings: does the resolution actually follow from the climax, or does it feel unconnected?"], "yt_prompt": "Does this resolution logically follow the climax?"}, {"title": "Mixed practice \u2014 narrative structure", "teach": ["You've now covered all four stages of narrative structure: opening, build-up, climax, and resolution.", "Understanding this shape helps you both analyse stories in comprehension questions and plan your own creative writing more effectively.", "This final question checks you can identify each stage confidently."], "yt_prompt": "Which stage is this?"}];
function ytGen_0() { return {q:'', answer:'opening', options:['opening','climax']}; }
function ytGen_1() { return {q:'The old house stood silent at the end of the road, its windows dark.', answer:'yes', options:['yes','no']}; }
function ytGen_2() { return {q:'', answer:'Amara noticed something strange about the canoe and stepped closer to investigate.', options:['Amara noticed something strange about the canoe and stepped closer to investigate.','Once upon a time, there was a small village by the river.']}; }
function ytGen_3() { return {q:'', answer:'With trembling hands, she finally forced the box open.', options:['She walked to the market as usual.','With trembling hands, she finally forced the box open.']}; }
function ytGen_4() { return {q:'', answer:'Amara decided to find out the full story behind the old paper.', options:['Amara decided to find out the full story behind the old paper.','The canoe sat half-buried in the sand.']}; }
function ytGen_5() { return {q:'', answer:'Opening, Build-up, Climax, Resolution', options:['Opening, Build-up, Climax, Resolution','Build-up, Opening, Climax, Resolution','Opening, Climax, Build-up, Resolution','Resolution, Build-up, Opening, Climax']}; }
function ytGen_6() { return {q:'', answer:'The wooden hull was cracked and grey, half-buried in the pale sand.', options:['There was a boat on the beach.','The wooden hull was cracked and grey, half-buried in the pale sand.']}; }
function ytGen_7() { return {q:'', answer:'She stepped closer. Something glinted. Her heart raced.', options:['She walked over to the box slowly and carefully picked it up, feeling quite curious about it.','She stepped closer. Something glinted. Her heart raced.']}; }
function ytGen_8() { return {q:'Climax: she opens a box and finds an old coin. Resolution: she decides to research the coin\'s history.', answer:'yes', options:['yes','no']}; }
function ytGen_9() { return {q:'With one final effort, she pulled the lid free, and light spilled onto the old paper inside.', answer:'climax', options:['opening','build-up','climax','resolution']}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

// Pre-compute every correct answer in this topic, used as a distractor pool
// for non-numeric answers (sampled once per attempt via YT_GENS() calls below)
let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      if (c !== ans && !candidates.includes(c) && Number(c) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+r\d+$/.test(ans)) {
    const [whole, rem] = ans.split('r').map(Number);
    const perturbs = [[whole+1,rem],[whole>1?whole-1:whole+2,rem],[whole,rem+1],[whole,rem>1?rem-1:rem+2]].sort(() => Math.random()-0.5);
    for (const [w,r] of perturbs) {
      if (w>0 && r>=0) {
        const c = `${w}r${r}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+ \d+\/\d+$/.test(ans)) {
    const [wholePart, fracPart] = ans.split(' ');
    const whole = Number(wholePart);
    const [numer, denom] = fracPart.split('/').map(Number);
    const perturbs = [[whole+1,numer,denom],[whole>1?whole-1:whole+2,numer,denom],[whole,numer+1,denom],[whole,numer>1?numer-1:numer+2,denom]].sort(() => Math.random()-0.5);
    for (const [w,n,d] of perturbs) {
      if (w>0 && n>0 && d>0 && n<d) {
        const c = `${w} ${n}/${d}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  }

  // Fill any remaining slots from the pool of other correct answers this topic
  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    // Some questions supply their own explicit options (e.g. category-style
    // answers like increasing/decreasing/flat, where auto-generated distractors
    // from unrelated numeric answers elsewhere in the topic wouldn't make sense)
    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

// Precompute the answer pool once at load (using each question's first generated answer)
ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
