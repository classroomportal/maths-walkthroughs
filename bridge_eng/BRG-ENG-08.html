<style>
  :root { --red:#C0272D; --dark:#8f1d22; --cream:#FDECEC; --line:#F3C6C6; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:#f7f7f8; color:#222; font-size:16px; }
  header { background:var(--red); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.2rem; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }

         min-height:52px; -webkit-tap-highlight-color:transparent; }
  .opt:active { transform:scale(0.98); }
  .opt.selected { border-color:var(--red); background:#fdeceb; }
  .opt.correct { border-color:#1b7d3a; background:#e8f5e9; }
  .opt.wrong { border-color:var(--red); background:#fdeceb; }

  button.nav-btn { background:#eee; color:#333; border:none; padding:14px 22px; border-radius:10px; cursor:pointer;
         font-size:1.05rem; min-height:48px; flex:1; -webkit-tap-highlight-color:transparent; }

<body>
<header><h1>Bridge English: Retrieval Skills — Finding Evidence in a Text</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"title": "What is retrieval?", "teach": ["Retrieval means finding and picking out specific information from a text, usually to answer a question.", "Example: if asked 'what was the weather like?', you scan the text to find the exact sentence describing weather.", "Retrieval is a skimming and scanning skill \u2014 you don't need to read every word again, just locate the relevant part."], "yt_prompt": "What was the weather like?"}, {"title": "Scanning for key words", "teach": ["When looking for an answer, scan the text for key words from the question rather than re-reading everything.", "Example: if the question asks about 'the dog', scan quickly for the word 'dog' rather than reading every sentence in full.", "This is much faster than reading the whole passage again from the start."], "yt_prompt": "What colour was the canoe's paint?"}, {"title": "Finding a specific fact", "teach": ["Retrieval questions often ask for one specific fact \u2014 a name, a number, a place, or a time.", "Example: 'How old was the character?' requires finding the exact number stated in the text.", "Give a precise, short answer for retrieval questions \u2014 don't add unnecessary extra detail."], "yt_prompt": "How old was Amara?"}, {"title": "Finding multiple pieces of information", "teach": ["Some retrieval questions ask for more than one piece of information \u2014 make sure you find all the parts asked for.", "Example: 'What did she find inside the box?' \u2014 if the text lists two items, both need to be included in your answer.", "Check the question carefully: does it use 'and' or list multiple things you need to find?"], "yt_prompt": "What two things were inside the box?"}, {"title": "Locating information in a specific part of a text", "teach": ["Sometimes you're told which part of the text to look in \u2014 e.g. 'in the second paragraph, find...'", "This narrows down where to search, saving time.", "Always check you're looking in the correct section before answering."], "yt_prompt": "Who is named in the second sentence?"}, {"title": "Retrieval using synonyms", "teach": ["Sometimes the question uses a different word than the text \u2014 you need to spot the synonym (a word with a similar meaning).", "Example: if the question asks 'what did she feel?' and the text says 'she was terrified', the answer relates to fear.", "Don't expect the exact same word every time \u2014 think about meaning, not just matching letters."], "yt_prompt": "How did she feel?"}, {"title": "Retrieval from a list or set of instructions", "teach": ["Non-fiction texts often present information as lists or steps \u2014 retrieval questions may ask you to find a specific step or item.", "Example: 'What is the second step in the recipe?' requires you to count through the steps carefully.", "Count carefully \u2014 it's easy to miscount steps or list items if you go too quickly."], "yt_prompt": "What is step 2?"}, {"title": "Skimming for the general topic", "teach": ["Skimming means reading quickly to get a general sense of what a text is about, without focusing on every detail.", "This is useful before doing detailed retrieval \u2014 it helps you know roughly where different information might be.", "Skim first, then scan carefully for the specific detail you need."], "yt_prompt": "What is this text mainly about?"}, {"title": "Answering retrieval questions in full sentences", "teach": ["In exams, retrieval answers are often expected in full sentences, not just single words.", "Example: instead of just 'blue', write 'The canoe's paint was blue.'", "Turning the question into the start of your answer is a reliable way to build a full sentence response."], "yt_prompt": "Which is the correctly answered full sentence?"}, {"title": "Mixed practice \u2014 retrieval skills", "teach": ["You've now covered scanning for key words, finding specific facts, using synonyms, and answering in full sentences.", "Retrieval is often the first skill tested in comprehension exams because it checks basic understanding before moving to harder inference questions.", "This final question brings these retrieval skills together."], "yt_prompt": "How long had the fisherman lived by the river?"}];
function ytGen_0() { return {q:'The sky was grey and it began to rain.', answer:'grey and rainy', options:['grey and rainy','sunny and warm','clear and cold']}; }
function ytGen_1() { return {q:'Faded blue paint clung to the canoe.', answer:'blue', options:['blue','red','green']}; }
function ytGen_2() { return {q:'Amara was eleven years old.', answer:'eleven', options:['eleven','ten','twelve']}; }
function ytGen_3() { return {q:'Inside the box was a coin and a folded letter.', answer:'a coin and a folded letter', options:['a coin and a folded letter','a key and a map','a photo and a ring']}; }
function ytGen_4() { return {q:'The morning was cold. Ade woke up early. He got dressed quickly.', answer:'Ade', options:['Ade','Chidi','Tunde']}; }
function ytGen_5() { return {q:'She was terrified when she heard the noise.', answer:'terrified', options:['terrified','excited','bored']}; }
function ytGen_6() { return {q:'1) Chop the onions 2) Heat the oil 3) Add the onions', answer:'Heat the oil', options:['Heat the oil','Chop the onions','Add the onions']}; }
function ytGen_7() { return {q:'A text describes a boy who lost his dog and searched the neighbourhood.', answer:'a boy searching for his lost dog', options:['a boy searching for his lost dog','a girl finding a lost cat','a boy building a treehouse']}; }
function ytGen_8() { return {q:'Faded blue paint clung to the canoe. What colour was the paint?', answer:"The canoe's paint was blue.", options:["The canoe's paint was blue.","The canoe's paint was red.","The canoe was painted yesterday."]}; }
function ytGen_9() { return {q:'The old fisherman had lived by the river for forty years.', answer:'forty years', options:['forty years','twenty years','ten years']}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

// Pre-compute every correct answer in this topic, used as a distractor pool
// for non-numeric answers (sampled once per attempt via YT_GENS() calls below)
let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      if (c !== ans && !candidates.includes(c) && Number(c) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+r\d+$/.test(ans)) {
    const [whole, rem] = ans.split('r').map(Number);
    const perturbs = [[whole+1,rem],[whole>1?whole-1:whole+2,rem],[whole,rem+1],[whole,rem>1?rem-1:rem+2]].sort(() => Math.random()-0.5);
    for (const [w,r] of perturbs) {
      if (w>0 && r>=0) {
        const c = `${w}r${r}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+ \d+\/\d+$/.test(ans)) {
    const [wholePart, fracPart] = ans.split(' ');
    const whole = Number(wholePart);
    const [numer, denom] = fracPart.split('/').map(Number);
    const perturbs = [[whole+1,numer,denom],[whole>1?whole-1:whole+2,numer,denom],[whole,numer+1,denom],[whole,numer>1?numer-1:numer+2,denom]].sort(() => Math.random()-0.5);
    for (const [w,n,d] of perturbs) {
      if (w>0 && n>0 && d>0 && n<d) {
        const c = `${w} ${n}/${d}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  }

  // Fill any remaining slots from the pool of other correct answers this topic
  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    // Some questions supply their own explicit options (e.g. category-style
    // answers like increasing/decreasing/flat, where auto-generated distractors
    // from unrelated numeric answers elsewhere in the topic wouldn't make sense)
    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

// Precompute the answer pool once at load (using each question's first generated answer)
ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
