<body>
<header><h1>Bridge English: Commas & Apostrophes</h1></header>
<div class="wrap">
  <div class="card">
    <div class="step-progress"><div class="step-bar" id="stepBar" style="width:0%"></div></div>
    <div class="q-progress" id="qProgress"></div>
    <div id="stepContent"></div>
    <div class="nav">
      <button class="nav-btn" id="backBtn" onclick="prevStep()">Back</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">Next</button>
    </div>

<script>
const QUESTIONS = [{"title": "Commas in a list", "teach": ["When listing three or more items, separate each one with a comma (except before 'and' at the end).", "Example: 'I bought apples, bananas, oranges and bread.'", "Commas in a list make it much easier for the reader to see where each item starts and ends."], "yt_prompt": "Which is the correctly punctuated version?"}, {"title": "Commas after a fronted adverbial", "teach": ["When a sentence starts with a phrase describing time, place, or manner, add a comma after it before the main sentence.", "Example: 'After school, we went to the market.'", "Common fronted adverbials include 'Later that day,', 'In the morning,', and 'Suddenly,'."], "yt_prompt": "Which is the correctly punctuated version?"}, {"title": "Commas in compound sentences", "teach": ["When joining two complete ideas with 'and', 'but', or 'so', add a comma just before the connective.", "Example: 'I wanted to go outside, but it was raining.'", "Not every 'and' needs a comma \u2014 only when it's joining two full sentences, not just two words."], "yt_prompt": "Which is the correctly punctuated version?"}, {"title": "Apostrophes for contractions", "teach": ["An apostrophe shows where letters have been missed out when two words are joined together (a contraction).", "Example: 'do not' becomes 'don't' \u2014 the apostrophe replaces the missing 'o'.", "Common contractions: 'can't' (cannot), 'it's' (it is), 'they're' (they are)."], "yt_prompt": "Which is the correctly written contraction?"}, {"title": "Apostrophes for singular possession", "teach": ["An apostrophe + 's' shows something belongs to one person or thing.", "Example: 'the dog's bone' means the bone belonging to one dog.", "Always ask: does this belong to just one person/thing? If yes, use apostrophe + s.", "When two people share one thing, only the second name gets the apostrophe: 'Femi and Cynthia's mother' (one shared mother). When each person has their own, both names get an apostrophe: 'Femi's and Cynthia's mothers' (two different mothers)."], "yt_prompt": "Which is the correctly punctuated version?"}, {"title": "Apostrophes for plural possession", "teach": ["When something belongs to more than one person, put the apostrophe after the 's' at the end of the plural word.", "Example: 'the students' books' means books belonging to several students.", "If the plural doesn't already end in 's' (like 'children'), you still add apostrophe + s: 'the children's toys'."], "yt_prompt": "Which is the correctly punctuated version?"}, {"title": "Common apostrophe mistake: it's vs its", "teach": ["'It's' (with an apostrophe) always means 'it is'. 'Its' (no apostrophe) shows possession, like 'his' or 'her'.", "Example: 'The dog wagged its tail' (possession) vs 'It's a sunny day' (it is).", "More examples: 'The teacher parked its car outside' is wrong \u2014 a car belongs to the teacher, not to 'it'. Instead: 'The car has lost its wheel' (the wheel belongs to the car) vs 'It's the teacher's car' (short for 'it is').", "This is one of the most commonly confused pairs in English \u2014 always check if you mean 'it is' before adding the apostrophe."], "yt_prompt": "Which is correct?"}, {"title": "Commas to separate extra information", "teach": ["Commas can be used to add extra information in the middle of a sentence, without changing its main meaning.", "Example: 'My brother, who is twelve, loves football.' \u2014 the comma-wrapped part is extra detail.", "If you can remove the section between the commas and the sentence still makes sense, the commas are used correctly."], "yt_prompt": "Which is the correctly punctuated version?"}, {"title": "Commas in direct address", "teach": ["When speaking directly to someone by name, use a comma to separate their name from the rest of the sentence.", "Example: 'Chidi, please close the door.'", "This applies whether the name comes at the start, middle, or end of the sentence."], "yt_prompt": "Which is the correctly punctuated version?"}, {"title": "Mixed practice \u2014 commas and apostrophes", "teach": ["You've now covered commas in lists, fronted adverbials, compound sentences, and apostrophes for contractions and possession.", "These small punctuation marks make a big difference to how clearly your writing reads.", "This final question brings a couple of these rules together."], "yt_prompt": "Which is the correctly fixed version of this sentence?"}];
function ytGen_0() { const sets=[{q:'I bought rice beans and yam.', correct:'I bought rice, beans and yam.', wrong:['I bought rice beans and yam.','I bought rice, beans, and, yam.']},{q:'She likes reading writing and drawing.', correct:'She likes reading, writing and drawing.', wrong:['She likes reading writing and drawing.','She likes reading, writing, and, drawing.']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_1() { const sets=[{q:'After school we went home.', correct:'After school, we went home.', wrong:['After school we went home.','After, school we went home.']},{q:'Later that night she heard a noise.', correct:'Later that night, she heard a noise.', wrong:['Later that night she heard a noise.','Later, that night she heard a noise.']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_2() { const sets=[{q:'I was hungry but there was no food.', correct:'I was hungry, but there was no food.', wrong:['I was hungry but there was no food.','I was hungry but, there was no food.']},{q:'She studied hard so she passed the test.', correct:'She studied hard, so she passed the test.', wrong:['She studied hard so she passed the test.','She studied hard so, she passed the test.']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_3() { const sets=[{q:'do not', correct:"don't", wrong:['dont',"do'nt"]},{q:'can not', correct:"can't", wrong:['cant',"ca'nt"]},{q:'it is', correct:"it's", wrong:['its',"i'ts"]},{q:'they are', correct:"they're", wrong:['theyre',"the'yre"]},{q:'I am', correct:"I'm", wrong:['Im',"I'am"]},{q:'we will', correct:"we'll", wrong:['well',"we'l"]}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_4() { const sets=[{q:'the girls bag', correct:"the girl's bag", wrong:['the girls bag',"the girls' bag"]},{q:'Ades book', correct:"Ade's book", wrong:['Ades book',"Ades' book"]},{q:'the cats tail', correct:"the cat's tail", wrong:['the cats tail',"the cats' tail"]},{q:'Femi and Cynthia have one mother \u2014 how do you write it?', correct:"Femi and Cynthia's mother", wrong:["Femi's and Cynthia's mother","Femis and Cynthias mother"]},{q:'Femi and Cynthia each have their own mother \u2014 how do you write it?', correct:"Femi's and Cynthia's mothers", wrong:["Femi and Cynthia's mothers","Femis and Cynthias mothers"]}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_5() { const sets=[{q:'the students books', correct:"the students' books", wrong:['the students books',"the student's books"]},{q:'the teachers cars', correct:"the teachers' cars", wrong:['the teachers cars',"the teacher's cars"]},{q:'the girls shoes', correct:"the girls' shoes", wrong:['the girls shoes',"the girl's shoes"]}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_6() { const opts=[['The cat licked ___ paw.','its'],['___ raining outside.',"it's"],['___ time to go home.',"it's"],['The bird built ___ nest.','its'],['The car has lost ___ wheel.','its'],['___ the teacher\u2019s car parked outside.',"it's"],['The teacher left ___ bag on the desk.','its'],['___ a very old car.',"it's"]]; const p=opts[Math.floor(Math.random()*opts.length)]; return {q:p[0], answer:p[1], options:['its',"it's"]}; }
function ytGen_7() { return {q:'My sister who is ten years old loves to dance.', answer:'My sister, who is ten years old, loves to dance.', options:['My sister, who is ten years old, loves to dance.','My sister who is ten years old loves to dance.','My sister, who is ten years old loves to dance.']}; }
function ytGen_8() { const sets=[{q:'Ada please pass the salt.', correct:'Ada, please pass the salt.', wrong:['Ada please pass the salt.','Ada please, pass the salt.']},{q:'Thank you Tunde for your help.', correct:'Thank you, Tunde, for your help.', wrong:['Thank you Tunde for your help.','Thank you, Tunde for your help.']}]; const p=sets[Math.floor(Math.random()*sets.length)]; return {q:p.q, answer:p.correct, options:[p.correct,...p.wrong]}; }
function ytGen_9() { return {q:"After the match Ades team celebrated but they were tired.", answer:"After the match, Ade's team celebrated, but they were tired.", options:["After the match, Ade's team celebrated, but they were tired.","After the match Ades team celebrated but they were tired.","After the match, Ades team celebrated, but they were tired."]}; }
const YT_GENS = [ytGen_0,ytGen_1,ytGen_2,ytGen_3,ytGen_4,ytGen_5,ytGen_6,ytGen_7,ytGen_8,ytGen_9];

// Pre-compute every correct answer in this topic, used as a distractor pool
// for non-numeric answers (sampled once per attempt via YT_GENS() calls below)
let ANSWER_POOL = [];

let qIdx = 0;
let stepIdx = 0;
const STEPS_PER_Q = 4;
let currentYT = null;
let currentOptions = null;
let answered = false;

function makeDistractors(correctAnswer, pool) {
  const ans = String(correctAnswer);
  let candidates = [];

  if (/^-?\d+$/.test(ans)) {
    const num = parseInt(ans, 10);
    const deltas = [1,-1,2,-2,5,-5,10,-10,3,-3].sort(() => Math.random()-0.5);
    for (const d of deltas) {
      const c = String(num + d);
      if (c !== ans && !candidates.includes(c) && Number(c) >= 0) candidates.push(c);
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+\/\d+$/.test(ans)) {
    const [numer, denom] = ans.split('/').map(Number);
    const perturbs = [[numer+1,denom],[numer>1?numer-1:numer+2,denom],[numer,denom+1],[numer,denom>1?denom-1:denom+2],[numer+1,denom+1]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}/${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+:\d+$/.test(ans)) {
    const [a1, b1] = ans.split(':').map(Number);
    const perturbs = [[a1+1,b1],[a1>1?a1-1:a1+2,b1],[a1,b1+1],[a1,b1>1?b1-1:b1+2]].sort(() => Math.random()-0.5);
    for (const [a,b] of perturbs) {
      if (a>0 && b>0) {
        const c = `${a}:${b}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+r\d+$/.test(ans)) {
    const [whole, rem] = ans.split('r').map(Number);
    const perturbs = [[whole+1,rem],[whole>1?whole-1:whole+2,rem],[whole,rem+1],[whole,rem>1?rem-1:rem+2]].sort(() => Math.random()-0.5);
    for (const [w,r] of perturbs) {
      if (w>0 && r>=0) {
        const c = `${w}r${r}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  } else if (/^\d+ \d+\/\d+$/.test(ans)) {
    const [wholePart, fracPart] = ans.split(' ');
    const whole = Number(wholePart);
    const [numer, denom] = fracPart.split('/').map(Number);
    const perturbs = [[whole+1,numer,denom],[whole>1?whole-1:whole+2,numer,denom],[whole,numer+1,denom],[whole,numer>1?numer-1:numer+2,denom]].sort(() => Math.random()-0.5);
    for (const [w,n,d] of perturbs) {
      if (w>0 && n>0 && d>0 && n<d) {
        const c = `${w} ${n}/${d}`;
        if (c !== ans && !candidates.includes(c)) candidates.push(c);
      }
      if (candidates.length >= 3) break;
    }
  }

  // Fill any remaining slots from the pool of other correct answers this topic
  if (candidates.length < 3 && pool && pool.length) {
    const seen = new Set([ans, ...candidates]);
    const others = [...new Set(pool.map(String))].filter(a => !seen.has(a));
    others.sort(() => Math.random()-0.5);
    for (const o of others) {
      if (candidates.includes(o)) continue;
      candidates.push(o);
      if (candidates.length >= 3) break;
    }
  }

  return candidates.slice(0,3);
}

function render() {
  const q = QUESTIONS[qIdx];
  document.getElementById('qProgress').textContent = `Question ${qIdx+1} of 10 — Step ${stepIdx+1} of ${STEPS_PER_Q}`;
  const pct = Math.round(((qIdx*STEPS_PER_Q)+stepIdx+1) / (10*STEPS_PER_Q) * 100);
  document.getElementById('stepBar').style.width = pct + '%';

  const box = document.getElementById('stepContent');
  document.getElementById('backBtn').disabled = (qIdx===0 && stepIdx===0);

  if (stepIdx < 3) {
    box.innerHTML = `<div class="teach"><strong>${q.title}</strong><br><br>${q.teach[stepIdx]}</div>`;
    document.getElementById('nextBtn').textContent = 'Next';
    document.getElementById('nextBtn').disabled = false;
  } else {
    currentYT = YT_GENS[qIdx]();
    answered = false;

    // Some questions supply their own explicit options (e.g. category-style
    // answers like increasing/decreasing/flat, where auto-generated distractors
    // from unrelated numeric answers elsewhere in the topic wouldn't make sense)
    if (currentYT.options) {
      currentOptions = [...new Set(currentYT.options)].sort(() => Math.random()-0.5);
    } else {
      const pool = ANSWER_POOL.filter((_, i) => i !== qIdx);
      const distractors = makeDistractors(currentYT.answer, pool);
      currentOptions = [...new Set([String(currentYT.answer), ...distractors])].sort(() => Math.random()-0.5);
    }

    let optsHtml = currentOptions.map((opt, i) =>
      `<button class="opt" data-idx="${i}" onclick="selectOpt(${i})">${opt}</button>`
    ).join('');

    box.innerHTML = `
      <div class="teach"><strong>${q.title}</strong></div>
      <div class="yt-box">
        <div>${q.yt_prompt}</div>
        ${currentYT.q ? `<div class="worked">${currentYT.q}</div>` : ''}
        ${optsHtml}
        <div id="ytFeedback"></div>
      </div>`;
    const isLast = (qIdx === 9);
    document.getElementById('nextBtn').textContent = isLast ? 'Finish' : 'Next Question';
    document.getElementById('nextBtn').disabled = true;
  }
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt');
  const correctIdx = currentOptions.indexOf(String(currentYT.answer));
  btns.forEach((b, idx) => {
    b.onclick = null;
    if (idx === correctIdx) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });
  const fb = document.getElementById('ytFeedback');
  if (i === correctIdx) {
    fb.innerHTML = '<div class="try-fb ok">Correct! Well done.</div>';
  } else {
    fb.innerHTML = '<div class="try-fb er">Not quite — the correct answer is highlighted in green.</div>';
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextStep() {
  if (stepIdx < 3) {
    stepIdx++;
  } else {
    logWalkthroughInteraction(qIdx + 1);
    if (qIdx < 9) {
      qIdx++; stepIdx = 0;
    } else {
      finishWalkthrough();
      return;
    }
  }
  render();
}

function prevStep() {
  if (stepIdx > 0) { stepIdx--; }
  else if (qIdx > 0) { qIdx--; stepIdx = 3; }
  render();
}

function finishWalkthrough() {
  document.getElementById('stepContent').innerHTML = `
    <div class="teach"><strong>Well done — topic complete!</strong><br>Great work finishing all 10 questions.</div>
    <div id="completeStatus" style="text-align:center; margin-top:16px;">
      <div id="completeSpinner" style="color:#888; font-size:0.95rem;">Saving your progress…</div>
    </div>`;
  document.querySelector('.nav').style.display = 'none';
  if (window.markComplete) {
    window.markComplete().then(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:#1b7d3a; font-weight:700; font-size:1.05rem;">✓ Marked as complete!</div><a href="../dashboard-student.html" style="display:inline-block; margin-top:12px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Back to dashboard</a>';
    }).catch(() => {
      document.getElementById('completeStatus').innerHTML = '<div style="color:var(--red); font-size:0.9rem;">Could not save automatically.</div><button class="nav-btn primary" style="margin-top:10px;" onclick="window.markComplete().then(()=>location.reload())">Try again</button>';
    });
  }
}

// Precompute the answer pool once at load (using each question's first generated answer)
ANSWER_POOL = YT_GENS.map(fn => fn().answer);

render();
</script>
